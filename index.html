<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Java 入门到面试指南</title>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#eff6ff; --good:#16a34a; --warn:#d97706;
  --border:#e5e7eb; --code-bg:#0f172a; --code-fg:#e2e8f0;
  --side-bg:#0f172a; --side-fg:#cbd5e1; --side-active:#38bdf8;
  --mark:#fde68a;
}
[data-theme="dark"]{
  --bg:#0b1220; --card:#111a2c; --text:#e5eaf3; --muted:#94a3b8;
  --accent:#60a5fa; --accent-soft:#16233d; --good:#4ade80;
  --border:#24314d; --mark:#a16207;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);display:flex}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
/* ---------- 侧边栏 ---------- */
#sidebar{width:292px;flex:0 0 292px;background:var(--side-bg);color:var(--side-fg);height:100vh;overflow-y:auto;padding:18px 14px;position:sticky;top:0}
#sidebar h1{font-size:17px;color:#fff;margin:4px 6px 2px}
#sidebar .sub{font-size:11px;color:#64748b;margin:0 6px 14px}
.overall{background:#1e293b;border-radius:10px;padding:10px 12px;margin:0 2px 16px}
.overall .row{display:flex;justify-content:space-between;font-size:12px;color:#94a3b8;margin-bottom:6px}
.bar{height:6px;background:#334155;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#38bdf8,#34d399);border-radius:99px;transition:width .3s}
.scard .bar{background:#e5e7eb}
[data-theme="dark"] .scard .bar{background:#24314d}
.stage{margin-bottom:6px}
.stage-h{display:flex;align-items:center;gap:8px;padding:8px 8px;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:600;color:#e2e8f0;user-select:none}
.stage-h:hover{background:#1e293b}
.stage-h .n{margin-left:auto;font-size:11px;color:#64748b;font-weight:400}
.stage-h .arrow{transition:transform .2s;font-size:10px;color:#64748b}
.stage.open .arrow{transform:rotate(90deg)}
.stage-files{display:none;padding:2px 0 6px}
.stage.open .stage-files{display:block}
.fitem{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 22px;border-radius:7px;font-size:12.5px;color:var(--side-fg);cursor:pointer}
.fitem:hover{background:#1e293b;color:#fff}
.fitem.active{background:#1d4ed84d;color:#fff}
.fitem .dot{width:7px;height:7px;border-radius:99px;background:#475569;flex:0 0 7px}
.fitem.done .dot{background:#34d399}
#sidefoot{margin-top:18px;padding-top:12px;border-top:1px solid #1e293b;display:flex;gap:6px;flex-wrap:wrap}
.sbtn{font-size:11px;background:#1e293b;color:#94a3b8;border:none;border-radius:6px;padding:5px 8px;cursor:pointer}
.sbtn:hover{color:#fff;background:#334155}
/* ---------- 主区 ---------- */
#mainwrap{flex:1;height:100vh;overflow-y:auto;scroll-behavior:smooth}
#topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 22px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
#burger{display:none;background:none;border:1px solid var(--border);border-radius:8px;font-size:15px;padding:4px 9px;cursor:pointer;color:var(--text)}
#search{flex:1;max-width:460px;margin-left:auto;display:flex}
#search input{width:100%;padding:8px 12px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px;outline:none}
#search input:focus{border-color:var(--accent)}
#themeBtn{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:7px 10px;cursor:pointer;font-size:13px}
#content{max-width:900px;margin:0 auto;padding:26px 34px 90px}
/* ---------- Markdown ---------- */
.md h1{font-size:26px;margin:.2em 0 .6em;padding-bottom:.35em;border-bottom:2px solid var(--border);letter-spacing:.2px}
.md h2{font-size:20px;margin:1.6em 0 .6em;padding-bottom:.3em;border-bottom:1px solid var(--border)}
.md h3{font-size:16.5px;margin:1.35em 0 .5em;color:var(--text)}
.md h4{font-size:14.5px;margin:1.2em 0 .4em}
.md p{line-height:1.85;margin:.65em 0;font-size:14.5px}
.md li{line-height:1.8;margin:.28em 0;font-size:14.5px}
.md ul,.md ol{padding-left:1.5em;margin:.5em 0}
.md blockquote{margin:1em 0;padding:.7em 1em;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;color:var(--muted)}
.md blockquote p{margin:.25em 0}
.md code{background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--accent);border-radius:5px;padding:2px 6px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em}
pre.code{background:var(--code-bg);color:var(--code-fg);border-radius:12px;padding:16px 18px;overflow-x:auto;position:relative;margin:1em 0}
pre.code code{background:none;color:inherit;padding:0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.8px;line-height:1.7;white-space:pre}
pre.code[data-lang]::before{content:attr(data-lang);position:absolute;top:8px;right:14px;font-size:10.5px;color:#64748b;text-transform:uppercase;letter-spacing:1px}
.mermaidbox{border:1px dashed var(--border);border-radius:12px;padding:10px 14px;margin:1em 0;background:var(--card)}
.mermaidbox-h{font-size:12px;color:var(--muted);margin-bottom:6px}
.twrap{overflow-x:auto;margin:1em 0;border:1px solid var(--border);border-radius:12px}
.md table{border-collapse:collapse;width:100%;font-size:13.5px}
.md th{background:color-mix(in srgb,var(--accent) 8%,var(--card));text-align:left;font-weight:600}
.md th,.md td{padding:9px 13px;border-bottom:1px solid var(--border);line-height:1.65;vertical-align:top}
.md tr:last-child td{border-bottom:none}
.md hr{border:none;border-top:1px solid var(--border);margin:2em 0}
label.ck{display:flex;gap:9px;align-items:flex-start;cursor:pointer;padding:2px 0}
label.ck input{accent-color:var(--good);width:15px;height:15px;margin-top:4px;flex:0 0 15px;cursor:pointer}
label.ck span{flex:1}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px}
/* ---------- 阅读页头 ---------- */
.doc-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.crumb{font-size:12.5px;color:var(--muted)}
.crumb b{color:var(--text)}
.spacer{flex:1}
.btn{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:9px;padding:7px 13px;font-size:12.5px;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{opacity:.9;color:#fff}
.btn.good{border-color:var(--good);color:var(--good)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:34px;padding-top:16px;border-top:1px solid var(--border)}
/* ---------- 首页 ---------- */
.hero{background:linear-gradient(135deg,#1d4ed8,#0ea5e9 55%,#10b981);border-radius:18px;color:#fff;padding:30px 34px;margin-bottom:22px}
.hero h1{margin:0 0 6px;font-size:26px}
.hero p{margin:0 0 16px;opacity:.92;font-size:14px}
.hero .bar{background:#ffffff40;height:8px}
.hero .stat{font-size:12.5px;margin-top:8px;opacity:.95}
.hero .acts{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.hero .acts .btn{background:#ffffff22;border-color:#ffffff55;color:#fff;font-size:13px;padding:9px 16px}
.hero .acts .btn:hover{background:#ffffff35;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.scard{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px 18px;transition:box-shadow .2s,transform .2s}
.scard:hover{box-shadow:0 8px 24px #0f172a14;transform:translateY(-2px)}
.scard .t{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.scard .d{font-size:12px;color:var(--muted);margin-bottom:10px}
.scard .flist{display:flex;flex-direction:column;gap:2px}
.scard .flist a{font-size:12.5px;padding:4px 6px;border-radius:6px;display:flex;gap:7px;align-items:center;color:var(--text)}
.scard .flist a:hover{background:var(--accent-soft);text-decoration:none}
.scard .flist .dot{width:6px;height:6px;border-radius:99px;background:#cbd5e1;flex:0 0 6px}
.scard .flist .dot.on{background:var(--good)}
.note{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 18px;font-size:13px;color:var(--muted);margin-top:18px;line-height:1.8}
/* ---------- 闪卡 ---------- */
.cards-wrap{max-width:760px;margin:0 auto}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 20px}
.chip{border:1px solid var(--border);background:var(--card);border-radius:99px;padding:6px 13px;font-size:12.5px;cursor:pointer;color:var(--text)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.fcard{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:34px 38px;min-height:300px;display:flex;flex-direction:column;box-shadow:0 10px 34px #0f172a0d}
.fcard .cat{font-size:12px;color:var(--accent);font-weight:600;margin-bottom:14px}
.fcard .q{font-size:19px;font-weight:700;line-height:1.65}
.fcard .a{margin-top:22px;padding-top:20px;border-top:1px dashed var(--border);font-size:14.5px;line-height:1.9;color:var(--text)}
.fcard .a.hidden .atext{filter:blur(7px);user-select:none;pointer-events:none}
.fcard .hint{font-size:11.5px;color:var(--muted);margin-top:14px}
.fcard .ref{margin-top:14px;font-size:12.5px}
.facts{display:flex;gap:10px;margin-top:20px}
.facts .btn{flex:1;padding:11px}
.cprog{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:10px}
.cstats{display:flex;gap:14px;margin-top:16px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.cstats b{color:var(--text)}
/* ---------- 搜索结果 ---------- */
.sres{margin-top:8px}
.sres .grp{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 16px;margin-bottom:12px}
.sres .gt{font-weight:700;font-size:14.5px;cursor:pointer}
.sres .cnt{font-size:11.5px;color:var(--muted);margin-left:8px;font-weight:400}
.sres .ln{font-size:12.8px;color:var(--muted);padding:5px 8px;border-radius:6px;cursor:pointer;line-height:1.7}
.sres .ln:hover{background:var(--accent-soft);color:var(--text)}
.qstats{font-size:12.5px;color:var(--muted)}
.qopt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin:9px 0;cursor:pointer;font-size:14.5px;line-height:1.75;background:var(--card)}
.qopt:hover{border-color:var(--accent)}
.qopt b{color:var(--accent);flex:0 0 auto;font-size:12.5px;margin-top:2px}
.qopt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--card))}
.qopt.wrong{border-color:#ef4444;background:color-mix(in srgb,#ef4444 8%,var(--card))}
.qstem{font-size:16.5px;font-weight:600;line-height:2.4;margin-top:8px}
.blankin{border:none;border-bottom:2px solid var(--accent);background:var(--accent-soft);padding:4px 12px;border-radius:8px 8px 0 0;font-size:14.5px;font-weight:600;color:var(--text);outline:none;margin:0 6px;min-width:130px;text-align:center}
.blankin:focus{background:color-mix(in srgb,var(--accent) 16%,var(--card))}
.blankin.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--card))}
.blankin.bad{border-color:#ef4444;background:color-mix(in srgb,#ef4444 8%,var(--card))}
.qfb{margin-top:18px;font-weight:700;font-size:15px}
.qfb.ok{color:var(--good)}
.qfb.bad{color:#ef4444}
.weakcard{background:color-mix(in srgb,var(--warn) 10%,var(--card));border:1px solid color-mix(in srgb,var(--warn) 45%,var(--border));border-radius:14px;padding:12px 18px;margin-bottom:14px;font-size:13.5px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.weakcard b{color:var(--warn)}
.chap-sel{padding:7px 10px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px;outline:none}
.chap-sel:focus{border-color:var(--accent)}
.exbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.extimer{font-variant-numeric:tabular-nums;background:var(--accent);color:#fff;border-radius:99px;padding:6px 16px;font-weight:700;font-size:14.5px}
.extimer.low{background:#ef4444;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.65}}
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin:0 0 14px}
.exdot{border:1px solid var(--border);border-radius:8px;text-align:center;padding:6px 0;font-size:12px;cursor:pointer;background:var(--card);color:var(--muted)}
.exdot.answered{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.exdot.cur{outline:2px solid var(--accent);outline-offset:1px}
.exscore{font-size:38px;font-weight:800;color:var(--accent)}
.exres-item{border:1px solid var(--border);border-radius:12px;padding:12px 16px;margin:8px 0;font-size:13.5px;line-height:1.85;background:var(--card)}
.exres-item.bad{border-color:color-mix(in srgb,#ef4444 45%,var(--border))}
/* ---------- 遮罩 ---------- */
#overlay{position:fixed;inset:0;background:#0f172a99;display:none;align-items:center;justify-content:center;z-index:99}
#overlay .box{background:var(--card);border-radius:16px;padding:22px;width:min(560px,92vw)}
#overlay textarea{width:100%;height:180px;border:1px solid var(--border);border-radius:10px;padding:10px;font-size:12px;background:var(--bg);color:var(--text)}
#overlay .row{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
@media (max-width:920px){
  #sidebar{position:fixed;z-index:50;left:0;top:0;transform:translateX(-100%);transition:transform .25s}
  #sidebar.open{transform:none;box-shadow:0 0 40px #0008}
  #burger{display:block}
  #content{padding:20px 18px 80px}
}
</style>
</head>

并发编程](#/f/f8) | JMM、synchronized/volatile、线程池、JUC、ThreadLocal |\n| [02-进阶篇/02-JVM核心](#/f/f9) | 内存区域、GC 与收集器、类加载、调优与排查 |\n| [02-进阶篇/03-IO模型与网络编程](#/f/f10) | TCP/HTTP、BIO/NIO/AIO、零拷贝、Netty |\n\n### 数据库与框架\n\n| 文件 | 内容 |\n|------|------|\n| [03-数据库篇/01-MySQL基础与SQL实战](#/f/f11) | SQL 全量语法、连接查询、JDBC 到 ORM |\n| [03-数据库篇/02-索引-事务-锁与调优](#/f/f12) | B+ 树、MVCC、三大日志、慢 SQL、分库分表 |\n| [05-框架篇/01-Spring核心](#/f/f21) | IoC/AOP、Bean 生命周期、事务、循环依赖、SpringMVC |\n| [05-框架篇/02-SpringBoot实战](#/f/f22) | 自动配置原理、统一返回/异常/校验、第一个完整项目 |\n| [05-框架篇/03-MyBatis](#/f/f23) | 动态 SQL、缓存、MyBatis-Plus、Mapper 原理 |\n| [05-框架篇/04-SpringCloud微服务](#/f/f24) | Nacos、OpenFeign、Gateway、Sentinel |\n\n### 中间件（重点篇）\n\n| 文件 | 内容 |\n|------|------|\n| [04-中间件篇/01-Redis](#/f/f13) | 五大类型、持久化、缓存三兄弟、分布式锁、哨兵/集群 |\n| [04-中间件篇/02-RabbitMQ](#/f/f14) | AMQP 模型、消息可靠性、死信队列、延迟队列 |\n| [04-中间件篇/03-Kafka](#/f/f15) | 分区与消费组、ACK/ISR、为什么快 |\n| [04-中间件篇/04-RocketMQ](#/f/f16) | 事务消息、顺序/延迟消息、三大 MQ 选型对比 |\n| [04-中间件篇/05-Elasticsearch](#/f/f17) | 倒排索引、DSL 查询、数据同步 |\n| [04-中间件篇/06-ZooKeeper与Nacos](#/f/f18) | 注册/配置中心、Watcher、AP/CP |\n| [04-中间件篇/07-Nginx](#/f/f19) | 反向代理、负载均衡、动静分离、限流 |\n| [04-中间件篇/08-MongoDB](#/f/f20) | 文档模型、CRUD 与聚合、选型场景 |\n\n### 架构与求职\n\n| 文件 | 内容 |\n|------|------|\n| [06-分布式与高并发篇/01-分布式理论基础](#/f/f25) | CAP/BASE、一致性哈希、分布式 ID/锁/事务 |\n| [06-分布式与高并发篇/02-高并发系统设计](#/f/f26) | 限流熔断降级、分库分表、秒杀系统设计 |\n| [07-面试篇/01-Java高频八股速查](#/f/f27) | Java 基础/集合/并发/JVM/Spring 自测清单（约 93 题） |\n| [07-面试篇/02-数据库与中间件面试速查](#/f/f28) | MySQL/Redis/MQ/ES/网络/OS 自测清单（约 82 题） |\n| [07-面试篇/03-算法刷题路线](#/f/f29) | 专题刷题顺序、200 题清单、手撕模板 |\n| [07-面试篇/04-简历与求职指南](#/f/f30) | 简历写法、项目 STAR、各轮面试侧重 |\n| [07-面试篇/05-选择填空题库](#/f/f31) | 90 题（选择 64 + 填空 26）覆盖全部章节；应用内支持「📖 章节小考」「🎲 乱序」「🔁 只做错题」 |\n| [07-面试篇/06-考点详略表](#/f/f32) | 每章标注 🔴 必考精通 / 🟡 高频掌握 / 🟢 了解即可 + 时间紧时的取舍清单 |\n\n### 总览\n\n| 文件 | 内容 |\n|------|------|\n| [ROADMAP.md](#/f/f1) | 总路线图、三档时间规划、过关标准 |\n| [STUDY-TRACKER.md](#/f/f2) | 全知识点打卡清单 + 周复盘模板 |\n\n---\n\n## 三条贯穿始终的主线\n\n1. **项目线**：入门完成后做一个 `todo-list` REST API（见 SpringBoot 实战篇），学完 MyBatis 后把它接入数据库，学完中间件后演进成一个「带缓存 + 消息队列 + 搜索」的商城 demo，最后用秒杀设计串起高并发知识。面试讲项目时，这套演进过程本身就是亮点。\n2. **算法线**：从进阶篇开始每天 2~3 题，按 [算法刷题路线](#/f/f29) 的专题推进，总量目标 200 题。\n3. **面试线**：每学完一个文件，先做文件末尾的高频面试题自测；面试篇的八股清单在冲刺期每天过一遍。\n\n## 约定\n\n- 每个文件的「🔗 推荐资料」只指向上面五个站点（均已验证可访问），外部资料以这五个站为骨架，需要官方文档时自行延伸。\n- 学习进度一律记在 [STUDY-TRACKER.md](#/f/f2)，勾选即可。\n- 建议时长按「每天 2~3 小时」估算，全程约 6~7 个月；赶时间可看 ROADMAP 里的加速方案。\n","ck":0},{"id":"f1","stage":0,"path":"ROADMAP.md","title":"学习路线图 Roadmap","md":"# 学习路线图 Roadmap\n\n> 建议搭配 [STUDY-TRACKER.md](#/f/f2) 使用：每完成一个知识点就打卡。时长按每天 2~3 小时估算。\n\n## 一图看懂\n\n```mermaid\nflowchart TD\n    S1[\"① 入门篇<br/>环境 · 语法 · 面向对象 · 集合 · Java8<br/>产出：能独立写小练习\"] --> S2[\"② 进阶篇<br/>并发 · JVM · IO与网络<br/>产出：理解程序如何运行\"]\n    S2 --> S3[\"③ 数据库篇<br/>SQL · 索引 · 事务 · 调优<br/>产出：会设计表、会优化 SQL\"]\n    S3 --> S4[\"④ 框架篇<br/>Spring · SpringBoot · MyBatis · Cloud<br/>产出：todo-list 完整项目\"]\n    S4 --> S5[\"⑤ 中间件篇<br/>Redis · MQ 三剑客 · ES · ZK/Nacos · Nginx · MongoDB<br/>产出：知道每个件用在哪、怎么用\"]\n    S5 --> S6[\"⑥ 分布式与高并发<br/>CAP · 分布式锁/事务 · 限流 · 秒杀<br/>产出：能讲清系统设计题\"]\n    S6 --> S7[\"⑦ 面试篇<br/>八股速查 · 算法 · 简历<br/>产出：offer\"]\n```\n\n两条贯穿线与主线并行：\n\n- **项目线**：`todo-list API`（框架篇）→ 接入 MyBatis-Plus（MyBatis 篇）→ 加缓存与消息队列（中间件篇）→ 演进为秒杀系统（高并发篇）。每个阶段都在同一个项目上叠加，面试时就是一段完整的成长故事。\n- **算法线**：从进阶篇开始，每天 2~3 题，按 [03-算法刷题路线](#/f/f29) 推进。\n\n## 阶段总表\n\n| 阶段 | 建议时长 | 核心文件 | 过关标准（全部满足才进入下一阶段） |\n|------|---------|----------|------------------------------------|\n| ① 入门篇 | 3 周 | [入门篇 5 个文件](#/f/f3) | 不查资料能写出：集合统计词频、异常+反射的小工具、Stream 处理订单列表；文件末尾面试题能答 80% |\n| ② 进阶篇 | 3 周 | [并发](#/f/f8)、[JVM](#/f/f9)、[IO网络](#/f/f10) | 能手写线程池使用代码并解释 7 参数；能用 jstack/jmap 分析死锁与 OOM；能讲三次握手与 NIO 三大件 |\n| ③ 数据库篇 | 2 周 | [MySQL 基础](#/f/f11)、[索引事务调优](#/f/f12) | 学生选课库 10 道 SQL 全部独立完成；能解释 B+ 树/MVCC/三大日志；能对慢 SQL 做 explain 分析 |\n| ④ 框架篇 | 3 周 | [Spring](#/f/f21)、[SpringBoot](#/f/f22)、[MyBatis](#/f/f23)、[SpringCloud](#/f/f24) | todo-list 项目上线本地运行：CRUD+校验+全局异常+缓存；能讲自动配置原理与事务失效场景 |\n| ⑤ 中间件篇 | 3 周 | [Redis](#/f/f13)、[RabbitMQ](#/f/f14)、[Kafka](#/f/f15)、[RocketMQ](#/f/f16)、[ES](#/f/f17)、[ZK/Nacos](#/f/f18)、[Nginx](#/f/f19)、[MongoDB](#/f/f20) | 每个中间件都完成 Docker 部署 + Spring Boot 整合 demo；能说出每个件的 3 个使用场景与核心可靠性问题 |\n| ⑥ 分布式与高并发 | 2 周 | [分布式理论](#/f/f25)、[高并发设计](#/f/f26) | 能白板画出秒杀系统全链路并解释防超卖；能对比三种分布式锁与四种限流算法 |\n| ⑦ 面试篇 | 3~4 周 | [八股速查一](#/f/f27)、[八股速查二](#/f/f28)、[选择填空题库](#/f/f31)、[考点详略表](#/f/f32)、[算法路线](#/f/f29)、[简历求职](#/f/f30) | 175 道自测题全部打勾；章节小考逐章 90%+；综合大考 20 题 ≥85%；算法 200 题完成；简历定稿并完成 3 次模拟面试 |\n\n合计约 19~20 周（零基础按部就班约 5 个月，加上缓冲 6 个月）。\n\n## 三档时间规划\n\n### A. 零基础 · 6~7 个月（默认节奏）\n\n| 月份 | 内容 |\n|------|------|\n| 第 1 月 | 入门篇全部 + 开始算法（数组、链表专题） |\n| 第 2 月 | 进阶篇（并发重推 1 周）+ 算法（栈队列、哈希） |\n| 第 3 月 | 数据库篇 + 框架篇前半（Spring、SpringBoot，完成 todo-list） |\n| 第 4 月 | 框架篇后半（MyBatis、SpringCloud）+ 中间件篇（Redis、RabbitMQ） |\n| 第 5 月 | 中间件篇其余 + 分布式与高并发篇；项目加中间件 |\n| 第 6 月 | 面试篇：八股清单每天过、算法套卷、简历与模拟面 |\n| 第 7 月 | 查漏补缺 + 投递 |\n\n### B. 有其他语言基础 · 3 个月\n\n- 第 1~2 周：入门篇快速过（语法对照学，重点看面向对象、集合、Java8）。\n- 第 3~5 周：进阶篇 + 数据库篇并行，算法每天保持。\n- 第 6~8 周：框架篇，完成 todo-list 项目。\n- 第 9~10 周：中间件篇 + 分布式篇，项目加中间件。\n- 第 11~12 周：面试篇冲刺。\n\n### C. 临门冲刺 · 1 个月（已有项目与八股基础）\n\n- 每天上午：[八股速查](#/f/f27) 两个板块 + 对应指南文件补漏。\n- 每天下午：算法 3~4 题（按专题）+ 手撕模板默写。\n- 每天晚上：中间件场景题（[Redis](#/f/f13)、[MQ 选型](#/f/f16)、[秒杀设计](#/f/f26)）+ [简历打磨](#/f/f30)。\n\n## 学习方法建议\n\n1. **先资料后提纲**：每个文件先读「推荐资料」里的廖雪峰/JavaGuide 对应章节（原始讲解更细），再用本指南的「核心知识点」当提纲复习，用「高频面试题」验收。\n2. **代码必须亲手敲**：动手实践的任务不要复制粘贴；中间件全部用 Docker 起服务，练习启停与排错本身也是面试考点。\n3. **API 随手查**：忘掉类和方法签名时用 [Java 8 中文 API](https://www.matools.com/api/java8)，不要背 API。\n4. **输出倒逼输入**：每完成一篇，用自己的话写 200 字笔记（或讲给朋友/橡皮鸭听），讲不清的地方就是漏洞。\n5. **面试题不是背的**：先理解，再把答案压缩成 3~6 条要点——压缩不出来的，说明还没懂，回知识点重看。\n","ck":0},{"id":"f2","stage":0,"path":"STUDY-TRACKER.md","title":"学习进度打卡表","md":"# 学习进度打卡表\n\n> 用法：每条即一个自测点。能独立完成/讲清才算打勾；一个文件的条目全部打勾 = 该篇过关。阶段过关标准见 [ROADMAP.md](#/f/f1)。\n\n## ① 入门篇\n\n### [01-环境搭建与基础语法](#/f/f3)\n- [ ] 能解释 JDK/JRE/JVM 关系，并完成 JDK + IDEA 安装\n- [ ] 8 种基本类型、类型转换、运算符用过一遍\n- [ ] 流程控制 + 方法 + 重载练熟（九九乘法表、猜数字）\n- [ ] 数组遍历、排序、Arrays 工具\n- [ ] 能讲清「Java 只有值传递」\n\n### [02-面向对象与核心类](#/f/f4)\n- [ ] 封装 - [ ] 消息队列 12 题全部自测通过\n- [ ] ES/ZK/Nacos 12 题全部自测通过\n- [ ] 网络 15 题全部自测通过\n- [ ] 操作系统 8 题全部自测通过\n\n### [03-算法刷题路线](#/f/f29)\n- [ ] 前六个专题完成（数组/链表/栈队列/哈希/二叉树/搜索）\n- [ ] 回溯 + 贪心 + 二分完成\n- [ ] 动态规划经典类完成\n- [ ] 7 个手撕模板能默写\n- [ ] 总量达到 200 题、热题 100 完成\n\n### [04-简历与求职指南](#/f/f30)\n- [ ] 简历一页定稿\n- [ ] 每个项目都有 STAR + 量化结果\n- [ ] 技能清单每条都经得起追问\n- [ ] 完成 3 次模拟面试（自录/朋友/AI）\n\n### [05-选择填空题库](#/f/f31)\n- [ ] 48 道选择题全部做过（应用「📝 选择填空练习」）\n- [ ] 20 道填空题全部做过\n- [ ] 最近一轮全部答对（🔁 只做错题时池为空）\n- [ ] 累计正确率 ≥ 90%\n\n---\n\n## 每周复盘模板（复制使用）\n\n```markdown\n## 第 N 周复盘（MM.DD ~ MM.DD）\n- 本周完成：xxx（对应打卡条目）\n- 动手产出：xxx（代码/项目进展）\n- 面试题自测正确率：xx/xx\n- 没搞懂的问题（下周解决）：\n  1.\n- 算法：完成 x 题，错题：\n- 下周计划：\n```\n","ck":155},{"id":"f3","stage":1,"path":"01-入门篇/01-环境搭建与基础语法.md","title":"01-环境搭建与基础语法","md":"# 01-环境搭建与基础语法\n\n> **阶段**：入门篇 ｜ **建议时长**：4 天 ｜ **前置**：无\n\n## 🎯 学习目标\n\n- 独立完成 JDK 17 安装与环境变量配置，会用 `java -version`、`javac -version` 验证。\n- 手写 `HelloWorld` 并分别用命令行（javac/java）和 IDEA 运行成功，能说清编译运行过程。\n- 掌握 8 种基本类型、类型转换、运算符、流程控制、方法重载与可变参数，能独立写出 50 行以内的小程序。\n- 熟练使用 IDEA 断点调试（Step Over/Into、查看变量）与常用快捷键。\n- 能口头解释「Java 只有值传递」并举例验证。\n\n## 📖 核心知识点\n\n### JDK 安装与版本选择\n\n- 三者关系：**JDK（开发工具包）⊇ JRE（运行环境）⊇ JVM（虚拟机）**。开发装 JDK，只运行装 JRE。\n- 常用 LTS 版本：**8**（老项目存量最大）、**17**（当前主流，入门推荐）、**21**（最新 LTS，引入虚拟线程）。\n- 17 相比 8 的明显变化：模块化（JPMS）、`var` 局部变量类型推断、Switch 表达式、文本块、record、更强的 G1 GC。\n- 安装后配置 `JAVA_HOME`，并把 `%JAVA_HOME%\\bin`（Windows）或 `$JAVA_HOME/bin`（macOS/Linux）加入 `PATH`。\n\n### 第一个程序与编译运行原理\n\n```java\npublic class Hello {\n    public static void main(String[] args) {\n        System.out.println(\"Hello, Java!\");\n    }\n}\n```\n\n- `javac Hello.java` 编译出 **字节码文件 Hello.class**；`java Hello` 由 JVM 加载执行（Java 11+ 可直接 `java Hello.java` 单文件运行）。\n- 核心机制：**一次编译，到处运行**——源码编译成与平台无关的 `.class`，不同平台的 JVM 负责解释/JIT 编译执行。\n- `main` 方法签名固定：`public static void main(String[] args)`，是程序入口。\n\n### IDEA 安装与调试\n\n- 社区版（Community）免费够用；新建 Project 时选择 JDK 17。\n- 断点调试：行号左侧点击下断点 → Debug 运行；**F8（Step Over）单步跳过、F7（Step Into）进入方法、Shift+F8 跳出、F9 放行到下一断点**；调试窗口可实时查看/修改变量值。\n- 快捷键（Windows/macOS）：`psvm`+Tab 生成 main、`sout`+Tab 生成输出；Alt+Enter 快速修复；Ctrl+D 复制行；Ctrl+Y 删除行；Ctrl+Alt+L 格式化；Shift+F6 重命名。\n\n### 变量与 8 种基本类型\n\n| 类型 | 字节 | 范围/说明 | 默认值 |\n|---|---|---|---|\n| byte | 1 | -128 ~ 127 | 0 |\n| short | 2 | -32768 ~ 32767 | 0 |\n| int | 4 | 约 ±21 亿 | 0 |\n| long | 8 | 需加后缀 `L` | 0L |\n| float | 4 | 单精度，需加 `f` | 0.0f |\n| double | 8 | 双精度，浮点默认类型 | 0.0d |\n| char | 2 | 单个字符，0 ~ 65535 | '\\u0000' |\n| boolean | - | true/false（JVM 层面实现决定大小） | false |\n\n- 类型转换：**小→大自动提升**（byte/short/char 参与运算先转 int），**大→小强制转换 `(int) 3.9` 截断小数**。\n- 整数字面量默认 int，浮点默认 double；`long x = 10000000000L;` 不加 L 会编译错误。\n- `float`/`double` 存在精度丢失，**金额计算禁止用它们**（见文件 2 的 BigDecimal）。\n\n### 运算符\n\n- 算术：`+ - * / %`；整数相除结果仍是整数（`5 / 2 == 2`）。\n- 自增：`i++` 先用后加，`++i` 先加后用。\n- 逻辑：`&&`、`||` **短路**——`a && b` 中 a 为 false 则 b 不执行；`&`、`|` 不短路（位运算）。\n- 三元：`条件 ? 值1 : 值2`；优先级不确定时加括号。\n\n### String 简介与 Scanner\n\n- `String` 是引用类型、**不可变对象**，字符串字面量存在常量池中；`==` 比较地址，`equals()` 比较内容（详见文件 2）。\n- 常用方法：`length()`、`charAt()`、`substring()`、`indexOf()`、`equals()`、`split()`。\n\n```java\nScanner sc = new Scanner(System.in);\nint n = sc.nextInt();          // 读整数\nString line = sc.nextLine();   // 读一行字符串\n```\n\n- 坑：`nextInt()` 后接 `nextLine()` 会读到换行符，需要先额外调用一次 `nextLine()` 清空缓冲。\n\n### 流程控制\n\n- `if / else if / else`：条件必须是 boolean。\n- `switch`：可作用的类型——**byte、short、char、int 及其包装类、枚举、String**（Java 7+），**不支持 long/float/double/boolean**；Java 14+ 箭头表达式 `case 1 -> ...` 不用写 break。\n- `for`、`while`、`do-while`、增强 for（`for (int x : arr)`）。\n- `break` 跳出本层循环，`continue` 跳过本次；带标签 `outer:` 可跳出多层（少用）。\n\n### 方法、重载与可变参数\n\n```java\nstatic int add(int a, int b) { return a + b; }              // 重载：参数列表不同\nstatic double add(double a, double b) { return a + b; }     // 与返回值类型无关\nstatic int sum(int... nums) {                               // 可变参数本质是数组\n    int s = 0;\n    for (int n : nums) s += n;\n    return s;\n}\n```\n\n- 重载（overload）：同一个类中方法名相同、**参数列表不同**；仅返回值不同不算重载。\n- 可变参数必须是参数列表的最后一个。\n\n### ⭐Java 只有值传递\n\n面试官想听：你能区分「传值的拷贝」和「传引用的拷贝」，并用一个反例证明引用本身不会被改变。\n\n- Java 中**永远传递的是实参的拷贝**：基本类型拷贝「值」，引用类型拷贝「引用（地址）」。\n- 方法内通过引用修改对象内容会影响原对象；但**让引用指向新对象不影响原引用**：\n\n```java\nstatic void change(int x) { x = 100; }                      // 无效\nstatic void fill(int[] arr) { arr[0] = 100; }               // 有效：改的是对象内容\nstatic void reassign(int[] arr) { arr = new int[]{9}; }     // 无效：改的是引用副本\n```\n\n### 数组与 Arrays 工具类\n\n- 声明与初始化：`int[] a = new int[3];`、`int[] b = {1, 2, 3};`；长度固定 `a.length`，越界抛 `ArrayIndexOutOfBoundsException`。\n- 二维数组：`int[][] m = new int[3][4];`，本质是「数组的数组」，第二维长度可不同。\n- `Arrays` 常用方法：`toString()` 打印、`sort()` 排序、`fill()` 填充、`copyOf()` 复制、`equals()` 比较、`binarySearch()` 二分查找（需有序）。\n\n## 🛠 动手实践\n\n### 任务 1：九九乘法表\n\n```java\nfor (int i = 1; i <= 9; i++) {\n    for (int j = 1; j <= i; j++) {\n        System.out.printf(\"%d*%d=%-4d\", j, i, i * j);\n    }\n    System.out.println();\n}\n```\n\n- 验收标准：输出标准下三角 45 行乘法口诀；列对齐（用 `%-4d`）；改写成 `while` 版本结果一致。\n\n### 任务 2：猜数字游戏\n\n- 要求：程序随机生成 1~100 的整数（`new Random().nextInt(100) + 1`），用户循环输入猜测，提示「大了/小了」，猜中后输出总次数并退出。\n- 验收标准：用 `while(true)` + `break` 实现；输入非法（非数字）不崩溃（用 `InputMismatchException` 或先读字符串再解析）；能统计并输出猜测次数。\n\n### 任务 3：数组冒泡排序 + 最大值\n\n```java\nfor (int i = 0; i < arr.length - 1; i++) {\n    boolean swapped = false;\n    for (int j = 0; j < arr.length - 1 - i; j++) {\n        if (arr[j] > arr[j + 1]) {\n            int t = arr[j]; arr[j] = arr[j + 1]; arr[j + 1] = t;\n            swapped = true;\n        }\n    }\n    if (!swapped) break;   // 一趟无交换说明已有序，提前结束\n}\n```\n\n- 验收标准：对 `{5, 2, 8, 1, 9}` 输出排序结果与最大值 9；加上提前退出的优化；最后用 `Arrays.sort(arr)` 对照验证自己的排序结果一致。\n\n### 任务 4：IDEA 调试练习\n\n- 验收标准：在任务 3 的内层循环处打断点，Debug 运行，用 Step Over 观察每轮 `i、j、swapped` 的值变化，并截图记录一次「修改 Debug 窗口中的变量值后程序行为改变」。\n\n## 💼 高频面试题\n\n**Q：JDK、JRE、JVM 三者是什么关系？⭐**\n- JVM 是执行字节码的虚拟机，是「跨平台」的关键。\n- JRE = JVM + Java 核心类库，只够运行程序。\n- JDK = JRE + 编译器 javac、调试器 jdb 等开发工具，开发必须装 JDK。\n- 一句话：JDK ⊃ JRE ⊃ JVM。\n\n**Q：Java 是值传递还是引用传递？⭐**\n- 只有值传递。基本类型传「值的副本」，方法内修改不影响原变量。\n- 引用类型传「引用（地址）的副本」，方法内通过该引用可以修改对象内容，但重新赋值（指向新对象）不影响原引用。\n- 反例：`reassign(int[] arr)` 中 `arr = new int[]{9}` 后调用方数组不变，证明不是引用传递。\n\n**Q：switch 支持哪些类型？**\n- byte、short、char、int 及其包装类（Byte/Short/Character/Integer）、枚举（Java 5+）、String（Java 7+）。\n- 不支持 long、float、double、boolean；case 必须是编译期常量且不重复。\n- Java 14+ 的箭头语法 `case x ->` 无需 break、不穿透。\n\n**Q：& 和 && 的区别？**\n- `&&` 短路：左边为 false 时右边不计算，效率高且能防 NPE（如 `s != null && s.length() > 0`）。\n- `&` 是位运算符也可用于 boolean，但不短路，两边都会计算。\n\n**Q：char 类型能存一个汉字吗？**\n- 能。char 占 2 字节（UTF-16 code unit），汉字大多落在基本多文种平面（BMP），如 `'中'` 可直接赋给 char。\n- 生僻字（如 emoji 或增补平面字符）需两个 char（代理对），`String.length()` 返回的是 code unit 数而不是字符个数。\n\n**Q：为什么 float 和 double 不能直接比较相等？**\n- 二进制浮点无法精确表示很多十进制小数（如 0.1），运算后存在累积误差。\n- 比较应使用差值阈值，金额计算应使用 BigDecimal（字符串构造）。\n\n**Q：编译型语言和解释型语言，Java 算哪种？**\n- 混合型：javac 先把源码编译成字节码（.class），再由 JVM 逐条解释执行，热点代码由 JIT 编译成本地机器码。\n- 由此获得「一次编译，到处运行」，JIT 又保证了接近原生的执行速度。\n\n## 🔗 推荐资料\n\n| 资料 | 说明 | 链接 |\n|---|---|---|\n| 廖雪峰 Java 快速入门 | 入门主线精读，配环境到基础语法全覆盖 | https://liaoxuefeng.com/books/java/quick-start/index.html |\n| 慕课网《Java入门第一季》 | 免费视频，适合完全零基础跟练 | https://www.imooc.com/learn/85 |\n| pdai 语言基础 | 语法要点体系化梳理，可当速查表 | https://pdai.tech/md/java/basic/java-basic-lan-basic.html |\n| JavaGuide 基础面试题 | 学完本章开始刷基础面试题第一部分 | https://javaguide.cn/java/basis/java-basic-questions-01.html |\n| Java 8 中文 API 速查 | 查 String/Arrays/Scanner 等类的方法 | https://www.matools.com/api/java8 |\n","ck":0},{"id":"f4","stage":1,"path":"01-入门篇/02-面向对象与核心类.md","title":"02-面向对象与核心类","md":"# 02-面向对象与核心类\n\n> **阶段**：入门篇 ｜ **建议时长**：6 天 ｜ **前置**：01-环境搭建与基础语法.md\n\n## 🎯 学习目标\n\n- 能用「封装、继承、多态」设计一个 3 层以上继承体系并解释每一处多态调用。\n- 能重写 `equals`/`hashCode`/`toString`，并说清两者的约定关系。\n- 掌握 String 常量池、Integer 缓存、BigDecimal 精度三大经典坑，能预测代码输出结果。\n- 会用枚举表达固定状态集合，并写出线程安全的枚举单例。\n- 会用 `java.time` 完成日期格式化、加减与间隔计算。\n\n## 📖 核心知识点\n\n### 类、对象、构造方法与 this\n\n- 类是模板，对象是实例：`new` 在堆中分配内存，字段有默认值，局部变量必须手动初始化。\n- 构造方法与类同名、无返回值；未手写时编译器提供无参构造；`this(...)` 可在构造方法间复用（必须放第一行）。\n- `this` 指当前对象，用于区分成员变量与参数（`this.name = name`）。\n- JavaBean 规范：字段 private、提供 getter/setter、无参构造。\n\n### ⭐封装、继承、多态\n\n面试官想听：不只是背定义，而是能各举一个真实设计场景说明「为什么需要」。\n\n- **封装**：字段 private + 提供 public 访问器，在 setter 中做校验，隔离变化。\n- **继承**：`class Dog extends Animal`，子类复用并扩展父类；Java 单继承（避免菱形冲突），所有类默认继承 Object。\n- **多态**：父类引用指向子类对象 `Animal a = new Dog();`，调用 `a.sound()` 执行的是**子类重写后的方法**（运行时绑定）；成员变量没有多态，静态方法不参与多态。\n- `super` 调用父类构造（必须第一行）或父类成员；`instanceof` 判断真实类型后再向下转型（Java 16+ 可写 `if (a instanceof Dog d)`）。\n\n### ⭐重写 vs 重载\n\n面试官想听：一句话点破——重写是运行时多态（纵向），重载是编译时多态（横向）。\n\n| 维度 | 重写 Override | 重载 Overload |\n|---|---|---|\n| 范围 | 父子类之间 | 同一个类中 |\n| 参数列表 | 必须相同 | 必须不同 |\n| 返回值 | 相同或为其子类 | 可以不同 |\n| 访问权限 | 不能小于父类 | 无要求 |\n| 异常 | 不能抛更宽的受检异常 | 无要求 |\n| 绑定时机 | 运行时 | 编译时 |\n\n- `@Override` 注解让编译器帮你校验是否真的是重写，建议永远加上。\n- private、static、final 方法不能被重写。\n\n### ⭐抽象类 vs 接口\n\n面试官想听：抽象类是「是什么」（模板复用），接口是「能做什么」（能力契约），能按场景选择。\n\n| 维度 | 抽象类 abstract class | 接口 interface |\n|---|---|---|\n| 构造方法 | 有（供子类调用） | 无 |\n| 成员变量 | 任意 | 只能 public static final 常量 |\n| 方法 | 可含具体实现 | Java 8 前只有抽象方法；8+ 允许 default/static 方法 |\n| 继承/实现 | 单继承 | 多实现 |\n| 设计语义 | \"is-a\"，代码复用 | \"can-do\"，能力声明 |\n\n- 典型组合：抽象类 `AbstractList` 提供骨架实现，接口 `List` 定义契约——模板方法模式。\n\n### static 与 final\n\n- `static`：属于类而非实例。静态变量所有实例共享；静态方法不能访问实例成员、不能用 this；静态代码块在类加载时执行一次。\n- `final`：修饰类（不能被继承，如 String）、修饰方法（不能被重写）、修饰变量（基本类型值不变，引用类型指向不变但内容可变）。\n- 常量命名：`static final int MAX_SIZE = 10;`\n\n### 内部类与访问权限\n\n- 成员内部类（持有外部类引用）、静态嵌套类（不持有，推荐静态场景用）、局部内部类、匿名内部类（Lambda 的前身，实现监听器/临时逻辑）。\n- 访问权限从小到大：`private`（本类）→ 默认/包级（同包）→ `protected`（同包+子类）→ `public`（全公开）。\n- 包的作用：命名空间 + 访问控制；`import` 引入其他包的类。\n\n### ⭐Object 核心方法：equals / hashCode / toString\n\n面试官想听：知道默认 equals 是 `==`，重写后必须同时重写 hashCode，并能说出约定的具体内容。\n\n- `toString()` 默认输出 `类名@十六进制hash`，打印对象会被自动调用，建议重写。\n- `equals()` 默认等价于 `==`（比较地址）；重写模板（IDEA 自动生成即可）：\n\n```java\n@Override\npublic boolean equals(Object o) {\n    if (this == o) return true;                      // 自反优化\n    if (o == null || getClass() != o.getClass()) return false;\n    return age == p.age && Objects.equals(name, p.name);\n}\n@Override\npublic int hashCode() { return Objects.hash(name, age); }\n```\n\n- 约定：equals 相等 ⇒ hashCode 必须相等；hashCode 相等 ⇏ equals 相等（哈希冲突）。违反约定会导致 HashSet/HashMap 存取异常。\n\n### ⭐String 不可变原理与常量池\n\n面试官想听：说出「private final + 不提供修改方法 + 类被 final 修饰」三层防护和安全/池化/线程安全三大好处。\n\n- 不可变的实现：`String` 内部 `private final char[] value`（Java 9+ 改为 byte[]），数组引用不可变且不外泄，String 类本身被 final 修饰不能被子类破坏。\n- 常量池：字面量先查池，存在则复用引用，所以 `\"a\" == \"a\"` 为 true；`new String(\"a\")` 一定在堆上创建新对象，`==` 为 false，必须用 `equals`。\n- 编译期可确定的拼接 `\"he\" + \"llo\"` 会被优化进常量池；含变量的拼接在运行时生成新对象，应用 `StringBuilder`。\n- `String.intern()` 可把字符串放入/复用常量池。\n- `StringBuilder`（非线程安全、快）vs `StringBuffer`（线程安全、慢）；`StringJoiner` 处理 `a, b, c` 这类带分隔符拼接。\n\n### ⭐包装类型与自动装箱、Integer 缓存\n\n面试官想听：能准确答出缓存范围 -128~127，并解释包装类型存在的意义（泛型与集合需要对象）。\n\n```java\nInteger a = 127, b = 127;      // true：取自 IntegerCache 缓存数组\nInteger c = 128, d = 128;      // false：超出缓存，new 新对象\nc == d;        // false\nc.equals(d);   // true：包装类型比较永远用 equals\n```\n\n- 自动装箱调用 `Integer.valueOf()`，拆箱调用 `intValue()`；装箱发生在集合/泛型场景。\n- 经典坑：`Integer` 与 `int` 混合比较会自动拆箱；拆箱 null 抛 `NullPointerException`；三目运算符两侧类型不统一会触发拆箱。\n- Byte/Short/Long 缓存同为 -128~127，Character 缓存 0~127，Float/Double 无缓存。\n\n### 枚举与枚举单例\n\n```java\npublic enum OrderStatus {\n    WAIT_PAY(\"待支付\"), PAID(\"已支付\"), CLOSED(\"已关闭\");\n    private final String desc;\n    OrderStatus(String desc) { this.desc = desc; }\n    public String getDesc() { return desc; }\n}\n```\n\n- 枚举天然继承 `java.lang.Enum`，有 `values()`、`valueOf()`、`name()`、`ordinal()`；可用 `==` 比较（实例唯一）。\n- 可定义字段、方法和构造方法；配合 `switch` 使用最直观。\n- **枚举单例**是《Effective Java》推荐写法：防止反射创建实例（构造方法反射调用会直接抛异常）且天然线程安全、可序列化：\n\n```java\npublic enum Singleton { INSTANCE;\n    public void doSomething() { /* 业务方法 */ } }\n```\n\n### ⭐BigDecimal 与精度问题\n\n面试官想听：知道 `new BigDecimal(0.1)` 会带入二进制误差，必须用字符串构造或 `valueOf`。\n\n```java\nSystem.out.println(0.1 + 0.2);                       // 0.30000000000000004\nBigDecimal a = new BigDecimal(\"0.1\");                // 正确：字符串构造\nBigDecimal b = BigDecimal.valueOf(0.1);              // 等效：内部走 Double.toString\nSystem.out.println(a.add(b));                        // 0.2（精确）\nnew BigDecimal(0.1).doubleValue();                   // 坑：0.1000000000000000055511151231257827\n```\n\n- 除不尽时必须指定舍入模式：`divide(b, 2, RoundingMode.HALF_UP)`，否则抛 `ArithmeticException`。\n- `equals` 比较值和精度（`1.0` 不等于 `1`），比较数值用 `compareTo`。\n\n### java.time 新日期 API\n\n- `LocalDate`（日期）、`LocalTime`（时间）、`LocalDateTime`（日期时间）不可变且线程安全，取代线程不安全的 `SimpleDateFormat`。\n\n```java\nLocalDateTime now = LocalDateTime.now();\nLocalDateTime d = now.plusDays(3).minusHours(2);\nDateTimeFormatter f = DateTimeFormatter.ofPattern(\"yyyy-MM-dd HH:mm:ss\");\nString s = now.format(f);\nlong days = Duration.between(t1, t2).toDays();       // Period 用于日期差\n```\n\n- `Instant` 对应时间戳，`ZoneId` 处理时区，格式化线程安全可复用。\n\n## 🛠 动手实践\n\n### 任务 1：Shape 继承体系\n\n- 要求：抽象类 `Shape`（抽象方法 `double area()`、`double perimeter()`，实现 `toString` 输出面积周长）；接口 `Drawable`（`void draw()`）；子类 `Circle`、`Rectangle` 实现三者；用 `Shape[] shapes` 数组循环打印，体现多态。\n- 验收标准：`main` 中不出现 `Circle` 具体类型的 new（统一用 `Shape s = new Circle(2)` 声明）；新增 `Triangle` 子类时循环代码零改动。\n\n### 任务 2：订单状态枚举\n\n- 要求：把上面的 `OrderStatus` 补全——每个状态带一个 `nextStatus()` 返回下一个合法状态（终态返回自身），`main` 中模拟 `WAIT_PAY -> PAID` 流转。\n- 验收标准：switch/方法内不含魔法字符串；对 `CLOSED.nextStatus()` 返回自身有单测或打印验证；说出「为什么不用 int 常量 0/1/2 表达状态」。\n\n### 任务 3：BigDecimal 揭穿 double 的坑\n\n- 验收标准：写程序分别用 double 和 BigDecimal 计算 100 个 0.1 累加；输出 double 版本结果 `9.99999999999998`（或相近值）与 BigDecimal 版本 `10.0`；再加一段「金额 0.1 元乘以 3」演示四舍五入保留 2 位的正确写法。\n\n## 💼 高频面试题\n\n**Q：面向对象三大特性是什么？⭐**\n- 封装：隐藏内部细节，通过公开方法受控访问，降低耦合。\n- 继承：子类复用父类代码并扩展，Java 单继承，用 super 访问父类成员。\n- 多态：父类引用指向子类对象，运行时绑定调用子类重写方法，提高扩展性。\n- 每个特性最好跟一个自己项目/练习里的例子。\n\n**Q：接口和抽象类的区别？怎么选？⭐**\n- 抽象类：单继承、可有构造方法与成员变量、可含具体实现，表达 is-a、做模板复用。\n- 接口：多实现、成员全是 public static final 常量、Java 8 后可有 default/static 方法，表达 can-do、定义契约。\n- 选择：共享代码骨架用抽象类；定义能力/规范（尤其需要多继承效果）用接口；实践中常组合使用。\n\n**Q：== 和 equals 的区别？⭐**\n- `==`：基本类型比值，引用类型比地址。\n- `equals`：Object 默认实现就是 `==`；String、Integer 等类重写后比较内容。\n- 引用类型判相等一律用 equals；常量放前可防 NPE（`\"abc\".equals(s)`）。\n\n**Q：重写 equals 时为什么必须重写 hashCode？⭐**\n- 约定：equals 相等的两个对象 hashCode 必须相等。\n- HashSet/HashMap 先用 hashCode 定位桶，再用 equals 判重；只重写 equals 会导致两个「相等」对象被放进不同的桶，出现重复元素或 get 不到。\n- 反之 hashCode 相同不代表 equals 相等（允许哈希冲突）。\n\n**Q：String 为什么设计成不可变？⭐**\n- 常量池复用：相同字面量共享一个对象，节省内存。\n- 安全性：String 广泛用于类加载名、网络地址、文件路径等，不可变防止被恶意篡改。\n- 线程安全：不可变对象天然线程安全，可放心在多线程间共享。\n- hashCode 可缓存：String 重写了 hashCode 并缓存结果，适合做 HashMap 的 key。\n\n**Q：`Integer a = 127; Integer b = 127; a == b` 和 128 的版本结果分别是什么？⭐**\n- 127 为 true：`Integer.valueOf` 对 -128~127 返回缓存的同一对象。\n- 128 为 false：超出缓存范围 new 了新对象，地址不同。\n- 结论：包装类型比较一律用 equals，或先拆箱成 int 再比较。\n\n**Q：重写和重载的区别？**\n- 重写发生在父子类，方法签名相同，运行时决定调用哪个（多态基础）；访问权限不能更小、不能抛更宽的受检异常。\n- 重载发生在同一个类，方法名相同参数列表不同，编译期按实参静态匹配；与返回值无关。\n- 记忆：重写是同一个方法的不同实现，重载是同名方法的不同入口。\n\n**Q：BigDecimal 有哪些使用注意点？**\n- 构造用字符串或 `valueOf`，禁止传 double。\n- 除法指定 scale 和 RoundingMode，防止除不尽抛异常。\n- 比较数值用 compareTo 而非 equals（equals 连精度一起比）。\n\n## 🔗 推荐资料\n\n| 资料 | 说明 | 链接 |\n|---|---|---|\n| 廖雪峰 Java 面向对象 | 从类到包的完整 OOP 主线教程 | https://liaoxuefeng.com/books/java/oop/index.html |\n| pdai Java 基础-面向对象 | 三大特性、抽象类接口的体系化讲解 | https://pdai.tech/md/java/basic/java-basic-oop.html |\n| 廖雪峰 日期与时间 | java.time 详细用法与陷阱 | https://liaoxuefeng.com/books/java/datetime/index.html |\n| JavaGuide 基础面试题 | 本章面试题的标准答案与延伸 | https://javaguide.cn/java/basis/java-basic-questions-01.html |\n| 慕课网《Java入门第一季》 | 面向对象章节配套免费视频 | https://www.imooc.com/learn/85 |\n","ck":0},{"id":"f5","stage":1,"path":"01-入门篇/03-集合与泛型.md","title":"03-集合与泛型","md":"# 03-集合与泛型\n\n> **阶段**：入门篇 ｜ **建议时长**：5 天 ｜ **前置**：02-面向对象与核心类.md\n\n## 🎯 学习目标\n\n- 能默画集合框架总图：Collection（List/Set/Queue）与 Map 两棵树及常用实现类。\n- 能说清 ArrayList 扩容机制（1.5 倍）与 ArrayList vs LinkedList 的选型结论。\n- 能完整讲述 HashMap 的 put 流程、扩容、树化条件及 1.7 vs 1.8 差异。\n- 掌握泛型通配符与 PECS 原则，能解释类型擦除的表现。\n- 会用 Iterator 正确遍历删除，理解 fail-fast 机制。\n\n## 📖 核心知识点\n\n### ⭐集合框架总图\n\n面试官想听：你脑中有全局地图，能按「是否有序、是否可重复、是否线程安全」给常用类定位。\n\n```\nIterable\n └─ Collection\n     ├─ List（有序可重复）: ArrayList / LinkedList / Vector(旧)\n     ├─ Set（不重复）:      HashSet / LinkedHashSet / TreeSet\n     └─ Queue（队列）:      LinkedList / ArrayDeque / PriorityQueue\nMap（键值对，不属于 Collection）\n     ├─ HashMap / LinkedHashMap（保持插入序）/ TreeMap（按 key 排序）\n     └─ Hashtable(旧) / ConcurrentHashMap（并发）\n```\n\n- 存取定位口诀：要「按下标/顺序」用 List；要「去重」用 Set；要「key 查 value」用 Map；要「排队/FIFO」用 Queue。\n- 所有实现类都不是线程安全的（并发场景见文件 6 的 ConcurrentHashMap）。\n\n### ⭐ArrayList 扩容机制\n\n面试官想听：说出默认容量 10、1.5 倍扩容、数组拷贝成本，以及为什么最好预估容量。\n\n- 底层是 `Object[] elementData`；`new ArrayList<>()` 初始为空数组，**首次 add 时才分配容量 10**。\n- 扩容：容量不足时 `newCapacity = oldCapacity + (oldCapacity >> 1)`，即 **1.5 倍**，通过 `Arrays.copyOf` 把旧数组复制到新数组，O(n)。\n- 大数据量场景用 `new ArrayList<>(expectedSize)` 指定初始容量，避免反复扩容拷贝。\n- 中间插入/删除需要 `System.arraycopy` 移动元素，平均 O(n)；随机访问 `get(i)` 直接下标寻址 O(1)。\n\n### ⭐ArrayList vs LinkedList\n\n面试官想听：别只背「一个数组一个链表」，重点在随机访问性能、内存局部性和 CPU 缓存友好度。\n\n| 维度 | ArrayList | LinkedList |\n|---|---|---|\n| 底层 | 动态数组 | 双向链表（Node 前/后指针） |\n| 随机访问 get(i) | O(1) | O(n) 需从头/尾遍历 |\n| 头部/中间增删 | O(n) 移动元素 | O(1) 找到节点即可 |\n| 内存 | 连续，缓存友好；有少量预留空间 | 每个节点额外两个引用，离散，缓存不友好 |\n| 实战结论 | **绝大多数场景首选** | 很少用；当队列/双端队列时优先 ArrayDeque |\n\n- 注意：LinkedList 的「增删快」仅指头尾；即使删中间找到了节点，ArrayList 批量移动在 CPU 缓存下常常更快。\n\n### Set 三兄弟\n\n- **HashSet**：基于 HashMap（元素作 key，共享 `PRESENT` 占位对象）；无序；`add` 依赖 `hashCode` + `equals` 去重。\n- **LinkedHashSet**：HashSet + 双向链表记录插入顺序，遍历按插入序，稍慢于 HashSet。\n- **TreeSet**：基于 TreeMap（红黑树），按 key 自然序或 `Comparator` 排序，增删查 O(log n)；元素必须可比较（实现 `Comparable` 或传入比较器）。\n- 去重自定义类必须同时重写 `equals` 和 `hashCode`，否则去重失效。\n\n### ⭐HashMap 用法与底层入门\n\n面试官想听：put 流程讲得完整、有条理，能带出树化、扩容、容量为 2 的幂三个子问题。\n\n- 结构（Java 8+）：**数组 + 链表 + 红黑树**；数组每个槽位叫桶（bucket）。\n- put 流程：计算 `hash(key)`（key 的 hashCode 高 16 位异或低 16 位，让散列更均匀）→ `(n-1) & hash` 定位桶 → 空桶直接放入 → 链表则尾插并逐个 equals 判重 → 链表长度 ≥ 8 且数组长度 ≥ 64 时**树化**为红黑树（查找 O(n) 降为 O(log n)）；树节点数 ≤ 6 退化为链表 → 插入后若 `size > capacity * 0.75` 触发扩容。\n- 扩容：容量翻倍（2 倍），重新分配元素；Java 8 中元素新位置要么在原下标 j，要么在 j + oldCap（高位 bit 决定），无需重新计算 hash。\n- 默认容量 16，负载因子 0.75，容量始终是 **2 的幂**。\n\n**为什么容量必须是 2 的幂？** 使 `(n-1) & hash` 等价于取模但更快（位运算），且 n-1 的二进制全 1 让散列分布均匀。\n\n**1.7 vs 1.8 的区别：**\n- 1.7：数组 + 链表，头插法；扩容后可能**环形链表**导致死循环（多线程下）；1.8 改尾插法避免。\n- 1.8 引入红黑树优化长链表；hash 计算从 4 次位运算+5 次异或简化为 1 次异或。\n- 1.7 先扩容后插入，1.8 先插入后扩容。\n\n### TreeMap 与 Comparator\n\n- TreeMap 按 key 排序（红黑树实现），支持 `firstKey()`、`ceilingKey()` 等导航方法。\n- 排序两种方式：元素实现 `Comparable`（自然序）或构造时传 `Comparator`（定制序）。\n\n```java\nlist.sort(Comparator.comparing(User::getAge)\n                    .thenComparing(User::getName)     // 多字段\n                    .reversed());                      // 降序\n```\n\n### Queue / Deque / PriorityQueue\n\n- `Queue`：`offer` 入队、`poll` 出队、`peek` 看队头（抛异常版本为 `add/remove/element`）。\n- `Deque` 双端队列：`addFirst/addLast/pollFirst/pollLast`；**用 ArrayDeque 代替 Stack 和 LinkedList 做栈/队列**。\n- `PriorityQueue` 小顶堆：`poll` 总是取最小元素（可传 Comparator 改大顶堆 `Comparator.reverseOrder()`），TopN 场景常用。\n\n### ⭐Iterator 与 fail-fast\n\n面试官想听：能解释 ConcurrentModificationException 的检测原理（modCount），并给出至少两种安全删除方案。\n\n- 遍历统一入口：`Iterator it = list.iterator(); while (it.hasNext()) { it.next(); }`。\n- **fail-fast（快速失败）**：集合内部维护 `modCount` 修改计数，迭代器创建时记录快照，每次 `next()` 校验 modCount 是否被改变，被改则抛 `ConcurrentModificationException`——这是「提前暴露 bug」的设计，不保证并发安全。\n\n### ⭐遍历时删除的正确姿势\n\n面试官想听：一开口就给出正确答案而不是 `list.remove()`。\n\n```java\n// 方式 1：迭代器的 remove（推荐，唯一会同步 modCount 的删除方式）\nIterator<String> it = list.iterator();\nwhile (it.hasNext()) {\n    if (it.next().startsWith(\"a\")) it.remove();\n}\n// 方式 2：removeIf（Java 8+，底层也是迭代器删除）\nlist.removeIf(s -> s.startsWith(\"a\"));\n// 方式 3：普通 for 按 i-- 倒序删除（下标法可行但易错）\n```\n\n- foreach 循环里直接 `list.remove(x)` 必抛 ConcurrentModificationException。\n- 并发场景改用 `CopyOnWriteArrayList` 或并发容器（文件 6）。\n\n### Collections / Arrays 工具与不可变集合\n\n- `Collections`：`sort`、`reverse`、`shuffle`、`max/min`、`unmodifiableList`（不可变视图）、`synchronizedList`（同步包装）。\n- `Arrays`：`asList` 返回**定长列表**（底层数组引用，不支持 add/remove，修改元素会影响原数组）。\n- Java 9+ `List.of/Set.of/Map.of` 创建真正不可变集合：不允许 null、任何修改抛 `UnsupportedOperationException`，适合常量表。\n\n### 泛型\n\n- 泛型把类型检查提前到编译期：`List<String> list = new ArrayList<>();`（菱形推断）。\n- 泛型类 `class Box<T>`、泛型方法 `<T> T pick(T... a)`、泛型接口，命名习惯 T/E/K/V/R。\n\n### ⭐通配符与 PECS\n\n面试官想听：知道 `? extends` 与 `? super` 各限制什么，并说出 Producer Extends, Consumer Super。\n\n```java\nList<? extends Number> producer = List.of(1, 2.0); // 只能读出 Number，不能写入\nList<? super Integer> consumer = new ArrayList<Number>(); // 只能写入 Integer，读出为 Object\nstatic void copy(List<? extends T> src, List<? super T> dst) // JDK Collections.copy 原型\n```\n\n- PECS：参数是生产者（只读出来用）用 `extends`；是消费者（要往里写）用 `super`。\n- `List<String>` 与 `List<Object>` 没有任何继承关系，没有通配符就无法互相赋值。\n\n### ⭐类型擦除\n\n面试官想听：泛型只存在于编译期，运行时全是原始类型；知道后果比背定义重要。\n\n- 编译后 `List<String>` 与 `List<Integer>` 都是 `List`，T 被替换为上边界（无边界则为 Object），调用处由编译器插入强制转换。\n- 后果：不能 `new T()`、不能 `T.class`、不能 `new T[]`、不能对泛型类型用 instanceof；运行时获取泛型参数需借助 `getGenericSuperclass` 等反射手段（框架常用）。\n- 验证：`new ArrayList<String>().getClass() == new ArrayList<Integer>().getClass()` 为 true。\n\n## 🛠 动手实践\n\n### 任务 1：Map 统计词频\n\n```java\nMap<String, Integer> count = new HashMap<>();\nfor (String w : words) {\n    count.merge(w, 1, Integer::sum);   // 等价于 get+判空+put\n}\ncount.entrySet().stream()\n     .sorted(Map.Entry.<String, Integer>comparingByValue().reversed())\n     .limit(3).forEach(e -> System.out.println(e.getKey() + \"=\" + e.getValue()));\n```\n\n- 验收标准：对一段中文/英文文本输出 Top3 词频；使用 `merge` 或 `getOrDefault` 而不是 if-else 嵌套；说出 TreeMap 方案的另一种写法。\n\n### 任务 2：Comparator 多字段排序\n\n- 要求：定义 `Student(id, name, score, age)`，实现先按 score 降序、同分按 age 升序、再同按 name 字典序。\n- 验收标准：仅用 `Comparator.comparing().thenComparing()` 链式实现，不写 compare 方法；对构造的同分数据验证次序正确。\n\n### 任务 3：模拟购物车\n\n- 要求：`Cart` 内部用 `LinkedHashMap<String, CartItem>`（key=商品编号），支持添加（数量累加）、修改数量、删除、计算总价（BigDecimal）、按加入顺序打印。\n- 验收标准：重复添加同一商品时数量合并而不是重复条目；总价用 BigDecimal 精确到 2 位；演示一次 `List.of`/`Map.of` 不可变集合在常量商品目录中的应用。\n\n## 💼 高频面试题\n\n**Q：ArrayList 和 LinkedList 的区别？怎么选？⭐**\n- ArrayList 动态数组：get/set O(1)；尾部均摊 O(1)；中间插删 O(n)；内存连续、缓存友好。\n- LinkedList 双向链表：头尾插删 O(1)；随机访问 O(n)；每个节点多两个引用，内存开销大。\n- 结论：绝大多数场景选 ArrayList；做队列/双端队列优先 ArrayDeque。LinkedList 很少是正确答案。\n\n**Q：讲一下 HashMap 的 put 流程。⭐**\n- 计算 hash（高 16 位异或低 16 位），`(n-1) & hash` 定位桶。\n- 空桶直接新建节点；是链表则尾插并 equals 判重替换；是红黑树则按树插入。\n- 链表长度达 8 且数组容量 ≥ 64 时树化，≤ 6 退化回链表。\n- 插入后 size 超过 `容量 × 0.75` 触发 2 倍扩容并 rehash（新位置为原下标或原下标+旧容量）。\n\n**Q：为什么 HashMap 容量是 2 的幂？⭐**\n- 使 `(n-1) & hash` 与 `hash % n` 等价但只需一次位运算，性能更高。\n- n-1 二进制为连续 1，与运算能让 hash 的每一位都参与散列，分布更均匀，减少冲突。\n- 指定初始容量为非 2 的幂时，tableSizeFor 会向上取整到最近的 2 的幂。\n\n**Q：HashMap 1.7 和 1.8 有什么区别？⭐**\n- 结构：1.7 数组+链表；1.8 数组+链表+红黑树（长链表查找 O(n)→O(log n)）。\n- 插入：1.7 头插，多线程扩容可能形成环形链表死循环；1.8 改尾插。\n- 扩容时机与 hash 计算也做了简化优化；1.8 rehash 时只需判断新增高位 bit，不用重新算 hash。\n\n**Q：HashSet 是如何保证元素不重复的？⭐**\n- 底层就是 HashMap，元素作为 key，value 是共享的 PRESENT 占位对象。\n- add 时先比较 hashCode 定位，再用 equals 判等，两者都「相同」才认定重复。\n- 所以自定义类放入 HashSet 必须重写 equals 和 hashCode，且两个方法逻辑要一致。\n\n**Q：什么是 fail-fast？怎么在遍历时安全删除元素？⭐**\n- fail-fast：迭代时检测到集合结构性被修改（modCount 变化）立即抛 ConcurrentModificationException，防止不确定行为。\n- 单线程安全删除：用 `iterator.remove()` 或 Java 8 的 `removeIf`。\n- foreach 中直接 remove 是错误姿势；多线程环境应使用并发容器或加锁。\n\n**Q：什么是 PECS 原则？**\n- Producer Extends：只读取数据的生产者参数用 `? extends T`；Consumer Super：只写入数据的消费者参数用 `? super T`。\n- `Collections.copy(List<? super T> dst, List<? extends T> src)` 是标准范例。\n- 目的：在保证类型安全的前提下让 API 接受尽可能宽的参数类型。\n\n**Q：类型擦除是什么？带来哪些限制？**\n- 泛型信息只在编译期用于类型检查，编译后擦除为上边界（默认 Object），运行时插入强转。\n- 限制：运行时无法 new T()、取 T.class、instanceof 泛型类型。\n- 框架通过反射的 getGenericXXX 接口在字节码签名（Signature）里仍能拿到泛型声明。\n\n## 🔗 推荐资料\n\n| 资料 | 说明 | 链接 |\n|---|---|---|\n| 廖雪峰 Java 集合 | Collection/Map 主线教程，配套练习多 | https://liaoxuefeng.com/books/java/collection/index.html |\n| 廖雪峰 Java 泛型 | 泛型、通配符、擦除的通俗讲解 | https://liaoxuefeng.com/books/java/generics/index.html |\n| pdai 集合框架 | 全家桶结构图 + 底层源码分析 | https://pdai.tech/md/java/collection/java-collection-all.html |\n| JavaGuide 集合面试题 | HashMap/ConcurrentHashMap 面试专题 | https://javaguide.cn/java/collection/java-collection-questions-01.html |\n","ck":0},{"id":"f6","stage":1,"path":"01-入门篇/04-异常-IO-反射-注解.md","title":"04-异常-IO-反射-注解","md":"# 04-异常-IO-反射-注解\n\n> **阶段**：入门篇 ｜ **建议时长**：4 天 ｜ **前置**：02-面向对象与核心类.md\n\n## 🎯 学习目标\n\n- 能默画异常体系图（Throwable → Error/Exception → Checked/Unchecked）并正确选择受检/非受检异常。\n- 会用 try-with-resources 管理资源，能解释 finally 的执行时机与吞异常的危害。\n- 会用字节缓冲流拷贝文件并用 `System.nanoTime` 对比性能。\n- 掌握获取 Class 的三种方式与反射读写字段、调用方法，能写一个 JDK 动态代理 demo。\n- 能定义注解并用反射编写一个「模拟 @Test」的注解执行器。\n\n## 📖 核心知识点\n\n### ⭐异常体系图\n\n面试官想听：先画层级，再答「受检异常编译器强制处理、运行时异常交给程序员」这条主线。\n\n```\nThrowable\n ├─ Error（严重错误，程序无法处理）: OutOfMemoryError / StackOverflowError\n └─ Exception\n     ├─ Checked 受检异常（编译期强制 try-catch 或 throws）\n     │    IOException / SQLException / ClassNotFoundException\n     └─ RuntimeException（Unchecked 非受检）\n          NullPointerException / ArrayIndexOutOfBoundsException\n          ClassCastException / ArithmeticException / IllegalArgumentException\n```\n\n- Error 与 RuntimeException 及其子类无需强制捕获；其他 Exception 必须显式处理。\n- 编译时异常 vs 运行时异常：受检异常调用方必须面对；运行时异常通常是程序 bug，应修代码而不是到处 catch。\n\n### try-catch-finally 与 try-with-resources\n\n```java\ntry (FileInputStream in = new FileInputStream(\"a.txt\")) {   // 自动 close，无需 finally\n    // 业务\n} catch (FileNotFoundException e) {          // 从小到大捕获，子类在前\n    log.error(\"文件不存在\", e);               // 必须携带原始异常\n} finally {\n    // 一定执行（除 System.exit/进程被杀），用于释放非 AutoCloseable 资源\n}\n```\n\n- 多类型 catch：`catch (IOException | SQLException e)`；`finally` 中 return 会吞掉 try 中的返回值和异常——**禁止在 finally 写 return**。\n- **try-with-resources**（Java 7+）：资源类实现 `AutoCloseable`，编译器自动生成 close 调用，异常抑制机制保留原始异常（`getSuppressed()`），优先于手写 finally 关闭。\n\n### 自定义异常与不要吞异常\n\n```java\npublic class BizException extends RuntimeException {      // 业务异常继承 RuntimeException\n    private final int code;\n    public BizException(int code, String message) {\n        super(message);\n        this.code = code;\n    }\n    public int getCode() { return code; }\n}\n```\n\n- 业务代码统一用非受检自定义异常（带错误码），在全局层（如 Spring 的 @ControllerAdvice）兜底转换成响应。\n- **吞异常反模式**：`catch (Exception e) {}` 或只 `e.printStackTrace()`——排障时线索全丢；正确做法是记录日志（带堆栈）后向上抛出或转换为业务异常。\n- 不要用异常做流程控制；捕获范围尽量精确。\n\n### IO：File 与流分类\n\n- `File` 表示路径：`exists()`、`createNewFile()`、`mkdirs()`、`delete()`、`listFiles()`；Java 11+ 推荐 `Path`/`Files`。\n- 四个抽象基类（按「输入/输出 × 字节/字符」）：`InputStream`/`OutputStream`/`Reader`/`Writer`。\n- 字节流适合一切二进制（图片、视频）；字符流适合文本（自动处理编码）；缓冲流包装原始流减少系统调用：\n\n```java\ntry (BufferedInputStream bis = new BufferedInputStream(new FileInputStream(src), 8192);\n     BufferedOutputStream bos = new BufferedOutputStream(new FileOutputStream(dest))) {\n    byte[] buf = new byte[8192];\n    int len;\n    while ((len = bis.read(buf)) != -1) bos.write(buf, 0, len);\n}\n```\n\n- 编码：`new InputStreamReader(in, StandardCharsets.UTF_8)` 显式指定，避免平台默认编码差异。\n\n### ⭐序列化：Serializable 与 serialVersionUID\n\n面试官想听：知道 serialVersionUID 的作用（版本兼容校验）和不写的后果，以及 transient 关键字。\n\n- 实现标记接口 `Serializable` 后，可用 `ObjectOutputStream.writeObject` 持久化/传输对象，`ObjectInputStream.readObject` 反序列化。\n- **serialVersionUID**：类的版本号；反序列化时若流中的版本号与当前类不一致抛 `InvalidClassException`。不显式声明时 JVM 自动生成，类一改动就变化，导致旧数据无法反序列化——**必须显式写 `private static final long serialVersionUID = 1L;`**。\n- `transient` 修饰的字段不参与序列化（如密码）；`static` 字段属于类也不序列化。\n- 静态成员变量不参与序列化（属于类不属于对象）；子类实现序列化时父类字段需父类也可序列化或有无参构造。\n\n### Files 工具类（Java 7+ NIO.2）\n\n- 一行流式 API 替代手工流：`Files.readAllLines(Path)`、`Files.writeString`、`Files.copy(src, dest, REPLACE_EXISTING)`、`Files.walk` 遍历目录树。\n- 大文件仍应使用缓冲流分块读取，`readAllBytes` 会把整个文件读入内存。\n\n### 反射\n\n- 运行时动态获取类信息并操作（构造、字段、方法），是 Spring/Swagger/序列化框架的基石。\n\n```java\n// 三种获取 Class 的方式（同一份 Class 对象）\nClass<?> c1 = Class.forName(\"com.demo.User\");   // 全限定名，最常用\nClass<?> c2 = User.class;                        // 编译期已知类\nClass<?> c3 = user.getClass();                   // 已有实例\n\nObject u = c1.getDeclaredConstructor().newInstance();\nField field = c1.getDeclaredField(\"name\");\nfield.setAccessible(true);                       // 突破 private（关闭安全检查）\nfield.set(u, \"Tom\");\nMethod m = c1.getMethod(\"sayHello\", String.class);\nm.invoke(u, \"hi\");\n```\n\n- 优点：解耦、支持「配置驱动」的通用框架；缺点：性能低于直接调用、绕过编译期检查、破坏封装。\n- 无法访问被安全管理器限制的成员（`setAccessible` 在模块化下可能受限）。\n\n### ⭐JDK 动态代理\n\n面试官想听：说出「运行时生成接口实现类、方法调用转发给 InvocationHandler」，以及它只能代理接口这个限制。\n\n```java\ninterface UserService { void save(String name); }\n\npublic class LogHandler implements InvocationHandler {\n    private final Object target;                       // 被代理对象\n    public LogHandler(Object target) { this.target = target; }\n    @Override\n    public Object invoke(Object proxy, Method method, Object[] args) throws Throwable {\n        System.out.println(\"before \" + method.getName());   // 增强逻辑\n        Object result = method.invoke(target, args);        // 反射调用原方法\n        System.out.println(\"after\");\n        return result;\n    }\n}\nUserService proxy = (UserService) Proxy.newProxyInstance(\n        UserService.class.getClassLoader(), new Class[]{UserService.class},\n        new LogHandler(new UserServiceImpl()));\nproxy.save(\"Tom\");     // before -> 原逻辑 -> after\n```\n\n- 这是 AOP 的底层原理：把「日志、事务」等横切逻辑与业务解耦。\n\n### ⭐注解与元注解\n\n面试官想听：注解本身不做任何事，「注解 + 反射读取」才构成机制；能现场写一个自定义注解。\n\n```java\n@Retention(RetentionPolicy.RUNTIME)     // 保留到运行期（反射可读）\n@Target(ElementType.METHOD)             // 只能标注在方法上\npublic @interface MyTest {              // 模拟 JUnit 的 @Test\n    int times() default 1;              // 带默认值的属性\n}\n```\n\n- 元注解：`@Retention`（SOURCE/CLASS/RUNTIME 三档保留期）、`@Target`（可用位置）、`@Documented`、`@Inherited`、`@Repeatable`。\n- 解析：`Method#getAnnotation(MyTest.class)` 返回 null 表示未标注；反射调用标注的方法即实现「注解驱动」。\n\n```java\nfor (Method m : cls.getDeclaredMethods()) {\n    MyTest t = m.getAnnotation(MyTest.class);\n    if (t != null) for (int i = 0; i < t.times(); i++) m.invoke(instance);\n}\n```\n\n## 🛠 动手实践\n\n### 任务 1：自定义业务异常体系\n\n- 要求：定义 `BizException`（含 code）与子类 `OrderNotFoundException`；写 `findOrder(int id)` 模拟 id<0 抛运行时异常、查不到抛业务异常；main 中分层 catch 并打印错误码与消息。\n- 验收标准：无 `catch (Exception e) {}` 空捕获；日志输出包含完整堆栈；能口头说出「为什么业务异常选 RuntimeException 而不是 IOException 那类受检异常」。\n\n### 任务 2：缓冲流拷贝性能对比\n\n- 要求：生成一个 ≥ 10MB 的文件；分别用「单字节 read/write」「8KB 缓冲数组」「BufferedInputStream/OutputStream」三种方式拷贝，`System.nanoTime()` 计时。\n- 验收标准：三组耗时打印成对比表格（预期缓冲数组与缓冲流快一个数量级以上）；全部使用 try-with-resources；能解释缓冲快的原因（减少系统调用次数）。\n\n### 任务 3：自定义注解执行器（模拟 @Test）\n\n- 要求：定义 `@MyTest(times)`；写一个类包含 3 个方法，其中 2 个标注注解；编写 `runTests(Class<?>)` 用反射扫描并执行标注方法，执行结果打印「方法名 通过/异常」。\n- 验收标准：新增/删除注解方法时执行器代码零改动；一个方法抛异常不影响其他方法执行；能说出 @Retention 必须是 RUNTIME 的原因。\n\n### 任务 4（可选）：JDK 动态代理增强\n\n- 验收标准：基于任务 3 的类生成代理，为所有 public 方法自动加耗时统计；打印结果包含方法名与纳秒耗时；能说明「为什么 Proxy 要求传 Class[] 接口」。\n\n## 💼 高频面试题\n\n**Q：Error 和 Exception 的区别？⭐**\n- 都继承 Throwable；Error 是 JVM 层面的严重错误（OutOfMemoryError、StackOverflowError），程序不应也不必捕获。\n- Exception 是程序可以处理的异常情况。\n- Exception 再分受检（编译器强制处理，如 IOException）与非受检 RuntimeException（如 NPE，通常靠改进代码避免）。\n\n**Q：受检异常和非受检异常怎么选？**\n- 调用方「可以恢复/必须处理」的外部故障用受检异常（IO、SQL），编译器兜底。\n- 程序 bug 或业务错误用 RuntimeException，避免到处 throws 污染方法签名。\n- 业务系统常见做法：统一 RuntimeException 子类 + 全局异常处理器。\n\n**Q：final、finally、finalize 的区别？⭐**\n- final：修饰符——类不可继承、方法不可重写、变量值/指向不可变。\n- finally：try 块的收尾代码，保证资源释放（现在更多用 try-with-resources）。\n- finalize：Object 的方法，GC 回收前的回调，执行时机不确定且已被 Java 9 标记 @Deprecated，资源释放不要依赖它。\n\n**Q：反射是什么？优缺点和应用场景？⭐**\n- 反射让程序在运行时获取类的结构（构造器/字段/方法）并动态调用。\n- 优点：解耦、通用化，支持配置驱动和插件化；缺点：有性能开销、绕过编译期检查、破坏封装。\n- 应用：Spring 的 IoC 依配置反射创建 Bean、MyBatis 结果映射、Jackson 序列化、各类注解处理。\n\n**Q：JDK 动态代理和 CGLIB 的区别？⭐**\n- JDK 动态代理：JDK 内置，基于接口——运行时生成接口实现类，转发到 InvocationHandler；目标类必须实现接口。\n- CGLIB：第三方库，基于继承——运行时生成目标类的子类覆写方法（final/private 方法无法代理）。\n- Spring AOP：目标有接口时默认用 JDK 代理（Spring Boot 2.x 起默认统一 CGLIB，可通过配置切换）。\n\n**Q：serialVersionUID 有什么用？不写会怎样？**\n- 反序列化时校验发送方与接收方的类版本是否兼容；不一致抛 InvalidClassException。\n- 不写时 JVM 根据类结构自动计算，任何改动（加字段/改方法）都会导致旧数据无法反序列化。\n- 显式声明固定值可让类演进时旧序列化数据仍可读。\n\n**Q：try-with-resources 相比 try-finally 好在哪？**\n- 自动生成 close，代码更简洁，不会忘记关闭。\n- 多个资源逆序关闭；异常抑制机制通过 getSuppressed 保留 close 抛出的次要异常，而手写 finally 可能覆盖主异常。\n\n## 🔗 推荐资料\n\n| 资料 | 说明 | 链接 |\n|---|---|---|\n| 廖雪峰 Java 异常处理 | 异常主线教程，含自定义异常 | https://liaoxuefeng.com/books/java/exception/index.html |\n| 廖雪峰 Java IO | 流、序列化与 Files 用法 | https://liaoxuefeng.com/books/java/io/index.html |\n| 廖雪峰 Java 反射 | Class 对象与访问字段方法 | https://liaoxuefeng.com/books/java/reflection/index.html |\n| 廖雪峰 Java 注解 | 元注解与注解处理原理 | https://liaoxuefeng.com/books/java/annotation/index.html |\n| JavaGuide IO 基础 | 流分类与序列化面试要点 | https://javaguide.cn/java/io/io-basis.html |\n","ck":0},{"id":"f7","stage":1,"path":"01-入门篇/05-Lambda-Stream与Java8新特性.md","title":"05-Lambda-Stream与Java8新特性","md":"# 05-Lambda-Stream与Java8新特性\n\n> **阶段**：入门篇 ｜ **建议时长**：3 天 ｜ **前置**：03-集合与泛型.md\n\n## 🎯 学习目标\n\n- 会写 Lambda 与方法引用，能说出「函数式接口 = 一个抽象方法的接口」这一本质。\n- 掌握 Function/Consumer/Supplier/Predicate 四大内置接口的输入输出方向。\n- 能用 Stream 完成过滤、映射、排序、分组统计、TopN、去重全流程。\n- 会正确使用 Optional 链式取值，避免 `get()` 反模式。\n- 能按版本脉络说出 Java 9/11/17/21 的代表性新特性。\n\n## 📖 核心知识点\n\n### Lambda 表达式\n\n- 本质：**函数式接口（只有一个抽象方法的接口）的实例**；`@FunctionalInterface` 注解用于声明与校验。\n- 语法：`(参数) -> 表达式` 或 `(参数) -> { 语句块; return x; }`；单参数可省括号，无参必须 `()`。\n\n```java\nRunnable r = () -> System.out.println(\"run\");\nComparator<Integer> cmp = (a, b) -> a - b;              // 建议用 Integer.compare\nlist.forEach(x -> System.out.println(x));\n```\n\n- Lambda 只能访问 **effectively final**（实际不变）的局部变量——因为局部变量在线程栈上，Lambda 可能被异步执行，捕获引用会引发并发问题；成员变量/静态变量可以修改。\n- 匿名内部类能表达多方法接口，Lambda 只服务函数式接口；this 语义也不同（Lambda 中 this 指外围对象）。\n\n### ⭐四大内置函数式接口\n\n面试官想听：能用「输入输出」一句话区分四个接口，并举出各自在 Stream 里的对应方法。\n\n| 接口 | 抽象方法 | 语义 | Stream 中的对应 |\n|---|---|---|---|\n| `Function<T,R>` | `R apply(T t)` | 输入 T 输出 R（转换） | `map` |\n| `Consumer<T>` | `void accept(T t)` | 输入 T 无返回（消费） | `forEach`、`peek` |\n| `Supplier<T>` | `T get()` | 无输入输出 T（生产） | `collect(Supplier, ...)`、`Stream.generate` |\n| `Predicate<T>` | `boolean test(T t)` | 输入 T 返回布尔（判断） | `filter` |\n\n- 变体：`BiFunction<T,U,R>`、`UnaryOperator<T>`、`IntPredicate` 等针对基本类型的特化版（避免装箱）。\n\n### 方法引用\n\n- Lambda 的简写，四种形式：\n\n```java\nlist.forEach(System.out::println);          // 对象::实例方法\nlist.sort(Integer::compare);                // 类::静态方法\nmap.replaceAll(String::concat);             // 类::实例方法（第一个参数作为调用者）\nSupplier<List<String>> s = ArrayList::new;  // 类::new 构造引用\n```\n\n- 优先用方法引用让代码更短，但以可读为先。\n\n### Stream：创建与惰性求值\n\n- 创建：`list.stream()`、`Arrays.stream(arr)`、`Stream.of(...)`、`Stream.generate/infinite`、`Files.lines(path)`（读文件行）。\n- 操作分两类：**中间操作惰性**（filter/map/sorted/limit/distinct/peek，返回新 Stream，不执行）与**终端操作触发**（forEach/collect/count/reduce/anyMatch，一次消费后流关闭）。\n- 不调用终端操作，中间操作永远不执行——验证方式：只写 `stream().map(x -> x * 2)` 不收集，无任何输出。\n\n### ⭐map / filter / sorted / collect / groupingBy\n\n面试官想听：groupingBy + count/partitioningBy 是业务统计的高频写法，能直接上代码。\n\n```java\nList<Order> orders = ...;\n// 过滤 + 映射 + 收集\nList<String> names = orders.stream()\n        .filter(o -> o.getAmount() > 100)\n        .sorted(Comparator.comparing(Order::getAmount).reversed())\n        .limit(3)                                   // TopN\n        .map(Order::getUser)                        // 一对一转换\n        .map(User::getName)\n        .collect(Collectors.toList());              // Java 16+ 可直接 .toList()\n\n// 分组统计\nMap<String, Long> cnt = orders.stream()\n        .collect(Collectors.groupingBy(Order::getStatus, Collectors.counting()));\nMap<String, Double> sum = orders.stream()\n        .collect(Collectors.groupingBy(Order::getStatus,\n                 Collectors.summingDouble(Order::getAmount)));   // 分组求和\n\n// 分区（按条件二分）\nMap<Boolean, List<Order>> parts = orders.stream()\n        .collect(Collectors.partitioningBy(o -> o.getAmount() > 100));\n\n// 去重与扁平化\nList<Integer> distinct = list.stream().distinct().collect(Collectors.toList());\nList<String> chars = words.stream().map(w -> w.split(\"\"))\n        .flatMap(Arrays::stream).distinct().collect(Collectors.toList());\n```\n\n- `reduce` 聚合：`Optional<Integer> sum = nums.stream().reduce(Integer::sum);` 带初值版本返回具体值。\n- 数值流避免装箱：`mapToInt(Order::getAmount).sum()/average()/summaryStatistics()`。\n- `collect` 到 Map：`Collectors.toMap(Order::getId, o -> o)`；**value 为 null 或 key 重复会抛异常**，需传合并函数：`toMap(k, v, (a, b) -> a)`。\n\n### ⭐map vs flatMap\n\n面试官想听：一对一是 map，一对多打散合并是 flatMap——各给一个例子。\n\n- `map`：一对一转换，`Stream<Stream<R>>` 仍是嵌套结构；例：`map(String::length)` 得到长度流。\n- `flatMap`：把每个元素转换成流后**压平**合并；例：把句子流拆成单词流、把多层数组拍平。\n- 记忆：flatMap = map + flatten（扁平化）。\n\n### ⭐并行流注意点\n\n面试官想听：知道它底层是 ForkJoinPool 公共池，能说出何时不用。\n\n- `list.parallelStream()` 把任务切分后多线程处理再合并；底层使用 **ForkJoinPool.commonPool()**，与全局共享，一个慢任务会拖累整个 JVM 的并行流。\n- 适用：**数据量大（万级以上）+ 无状态 + 可无序 + CPU 密集**；ArrayList 数组切分高效，LinkedList/Iterator 源切分代价大。\n- 陷阱：操作里修改共享变量会出并发问题；I/O 阻塞任务别用；默认排序 `forEach` 顺序不保证；小数据量并行反而更慢（拆分与合并开销）。\n\n### ⭐Optional 正确用法\n\n面试官想听：Optional 是「返回类型语义化」工具（可能为空），不是万能判空器。\n\n```java\nOptional<User> opt = repository.findByName(name);          // 方法返回 Optional 表示可能为空\nString city = opt.map(User::getAddress)                    // 值存在则转换\n                 .map(Address::getCity)                    // 链式穿透多层判空\n                 .orElse(\"unknown\");                       // 为空给默认值\nString v = opt.orElseGet(() -> loadDefault());             // 默认值昂贵时用 orElseGet（惰性）\nopt.orElseThrow(() -> new BizException(404, \"未找到\"));     // 为空抛业务异常\n```\n\n- 正确姿势：作为方法返回值；用 `map/flatMap/filter` 链式处理；`ifPresent(u -> ...)` 替代 isPresent+get。\n- 反模式：`opt.get()` 不判空直接取、把 Optional 做字段/入参、`Optional.of(null)`（会 NPE，可空用 `ofNullable`）。\n\n### 接口默认方法\n\n- Java 8 允许接口有 `default` 方法与 `static` 方法：不破坏已有实现类即可给接口加新能力（如 `Collection.stream()`、`Comparator.reversed()`）。\n- 类优先原则：同时继承父类方法和实现接口 default 方法时，父类方法优先；冲突的接口 default 必须显式 `A.super.m()`。\n\n### ⭐java.time 与版本脉络\n\n面试官想听：知道 SimpleDateFormat 的线程安全问题，以及近年版本的一句话定位。\n\n```java\nLocalDateTime now = LocalDateTime.now();\nString s = now.format(DateTimeFormatter.ofPattern(\"yyyy-MM-dd HH:mm:ss\"));  // 线程安全\nLocalDateTime d = LocalDateTime.parse(\"2026-01-15T10:30\", DateTimeFormatter.ISO_LOCAL_DATE_TIME);\nlong between = ChronoUnit.DAYS.between(now, d);            // 间隔天数\n```\n\n| 版本 | 关键特性（一句话） |\n|---|---|\n| Java 8 | Lambda/Stream/Optional/接口默认方法/java.time |\n| Java 9 | 模块化 JPMS、集合工厂方法 List.of、jshell |\n| Java 11（LTS） | HttpClient 标准 HTTP 客户端、var 局部变量（Java 10 引入）、String 新方法 |\n| Java 14+ | switch 表达式、文本块 `\"\"\"`（13+）、instanceof 模式匹配（16+）、record 不可变数据类（16+） |\n| Java 17（LTS） | sealed 密封类（限定继承体系）、RandomGenerator、更强 G1 |\n| Java 21（LTS） | **虚拟线程**正式发布（轻量级并发，见文件 6）、模式匹配 switch、结构化并发预览 |\n\n- `var` 只用于局部变量且必须有初始值，可读性优先；`record` 一行定义不可变 DTO：`record Point(int x, int y) {}` 自动生成构造/访问器/equals/hashCode。\n\n## 🛠 动手实践\n\n### 任务 1：订单列表统计三连\n\n- 要求：构造 20 条订单（用户、金额、状态、日期），分别用 Stream 完成：① 按状态分组统计条数与金额总和；② 金额 Top3 的订单号列表；③ 所有状态为 PAID 的用户去重（`distinct` 或 `toSet`）。\n- 验收标准：三问均一条 Stream 表达式完成（不超过 3 行）；TopN 用 `sorted().limit()`；分组用 `groupingBy` 组合 `counting`/`summingDouble`；对比 traditional for 循环版本的行数差异。\n\n### 任务 2：Optional 链式取值\n\n- 要求：`Order -> User -> Address -> City` 的多层嵌套对象，用 Optional 一行取出 city，任一层为 null 返回 `\"unknown\"`；再写一个「为空则抛 BizException」的版本。\n- 验收标准：全程无显式 if (x != null)；故意置空中间对象验证不抛 NPE；能解释为什么不用 `Optional` 做字段。\n\n### 任务 3：LocalDateTime 格式化练习\n\n- 要求：把 `LocalDateTime.now()` 格式化为 `yyyy/MM/dd HH:mm`；解析字符串 `\"2026-01-15 10:30:00\"`；计算距今的天数；把日期列表格式化后输出。\n- 验收标准：`DateTimeFormatter` 定义为 static final 复用；无 SimpleDateFormat 出现；能说出 SimpleDateFormat 非线程安全的后果（数据错乱/异常）。\n\n## 💼 高频面试题\n\n**Q：Java 8 有哪些新特性？⭐**\n- Lambda 表达式与函数式接口（Function/Consumer/Supplier/Predicate）。\n- Stream API 声明式集合处理，接口 default/static 方法。\n- Optional、新的日期时间 API java.time（不可变、线程安全）。\n- 方法引用、`HashMap` 红黑树优化、`MetaSpace` 取代永久代。\n- 能结合自己最常用的（如 Stream 分组统计）展开一句。\n\n**Q：map 和 flatMap 的区别？⭐**\n- map：一对一，把每个元素转换成另一个元素，结果可能嵌套。\n- flatMap：一对多转换后扁平化合并成一个流，常用于「拆分/展开」场景。\n- 例：`map(this::splitToWords)` 得到 `Stream<List<String>>`；`flatMap` 直接得到 `Stream<String>`。\n\n**Q：Optional 解决什么问题？怎么正确使用？⭐**\n- 用类型系统表达「可能为空」，把 NPE 从运行时提前到编译期提示，减少层层判空。\n- 正确用法：作为返回值；`map/flatMap/filter` 链式取值；`orElse/orElseGet/orElseThrow` 处理缺省。\n- 反模式：直接 get()、用作字段或方法参数、of(null)。\n\n**Q：常见的函数式接口有哪些？**\n- Function<T,R> 转换、Consumer<T> 消费、Supplier<T> 生产、Predicate<T> 断言。\n- 二元版本 BiFunction/BinaryOperator、基本类型特化 IntStream 相关。\n- 在 Stream 中的对应：map/filter/forEach/collect(Supplier)。\n\n**Q：Stream 和 for 循环谁性能好？**\n- 小数据量下 for 循环更快（Stream 有 lambda 调用与装箱开销，数值流可缓解）。\n- Stream 的价值在可读性、可组合、易并行（parallelStream），万级以上数据且 CPU 密集时并行流可能有优势。\n- 面试结论：性能敏感的紧密循环用 for；业务数据处理优先 Stream，瓶颈时再测再换。\n\n**Q：并行流有哪些注意事项？**\n- 底层共用 ForkJoinPool.commonPool，任务被全局共享，不适合阻塞/I/O 任务。\n- 操作必须无状态、无副作用，不要在 lambda 里改共享集合。\n- 数据量小、LinkedList 源、依赖顺序的场景都不适合。\n\n**Q：var 和 record 是干什么的？**\n- var：局部变量类型推断，类型由右侧推断，仅限局部变量，提高可读性不改运行时行为。\n- record：不可变数据载体，一行声明自动生成构造器、getter、equals/hashCode/toString，适合 DTO 与值对象。\n\n## 🔗 推荐资料\n\n| 资料 | 说明 | 链接 |\n|---|---|---|\n| 廖雪峰 Java 函数式编程 | Lambda/Stream/Optional 系统教程 | https://liaoxuefeng.com/books/java/functional/index.html |\n| pdai Java 8 特性 | 新特性全景与代码示例汇总 | https://pdai.tech/md/java/java8/java8.html |\n| JavaGuide Java 8 新特性 | 新特性面试向整理与示例 | https://javaguide.cn/java/new-features/java8-tutorial-translate.html |\n| 廖雪峰 日期与时间 | java.time 详细用法 | https://liaoxuefeng.com/books/java/datetime/index.html |\n","ck":0},{"id":"f8","stage":2,"path":"02-进阶篇/01-多线程与并发编程.md","title":"01-多线程与并发编程","md":"# 01-多线程与并发编程\n\n> **阶段**：进阶篇 ｜ **建议时长**：7 天 ｜ **前置**：02-面向对象与核心类.md、03-集合与泛型.md\n\n## 🎯 学习目标\n\n- 能用三种方式创建线程，画出线程 6 种状态流转图。\n- 能解释 JMM 三性与 volatile 的两个保证、一个不保证。\n- 掌握 synchronized 三种用法与 ReentrantLock 差异，会写死锁并排查。\n- 能默写线程池 7 参数、执行流程、4 种拒绝策略，并给出线程数经验公式。\n- 会用 ThreadLocal、CAS 工具类、JUC 协调工具与 CompletableFuture 完成典型并发任务。\n\n## 📖 核心知识点\n\n### ⭐线程的三种创建方式\n\n面试官想听：本质都是 Runnable——Thread 封装任务、FutureTask 接收返回值、线程池统一管理。\n\n```java\n// 1. 继承 Thread\nclass MyThread extends Thread {\n    public void run() { System.out.println(\"thread\"); }\n}\n// 2. 实现 Runnable（推荐，任务与执行解耦，还能交给线程池）\nRunnable task = () -> System.out.println(\"runnable\");\nnew Thread(task).start();\n// 3. Callable + FutureTask（有返回值、可抛异常）\nCallable<Integer> c = () -> 42;\nFutureTask<Integer> ft = new FutureTask<>(c);\nnew Thread(ft).start();\nInteger result = ft.get();      // 阻塞直到完成\n```\n\n- 必须调用 `start()` 而不是 `run()`：`run()` 只是普通方法调用（单线程执行），`start()` 才创建新线程。\n- 实战第 4 种：线程池 `ExecutorService`（见下文），避免手动 new Thread。\n- `Thread.currentThread()` 获取当前线程；线程默认不继承父线程状态（InheritableThreadLocal 除外）。\n\n### ⭐线程的 6 种状态\n\n面试官想听：NEW→RUNNABLE 的启动路径、RUNNABLE 与阻塞系状态的区分、WAITING 与 TIMED_WAITING 的差别。\n\n```\nNEW -> start() -> RUNNABLE <-> BLOCKED（等 synchronized 锁）\n                     |-> WAITING（wait/join/LockSupport.park，无超时）\n                     |-> TIMED_WAITING（sleep(n)/wait(n)/join(n)）\n                     |-> TERMINATED（run 结束）\n```\n\n- `sleep` 是 Thread 静态方法、**不释放锁**；`wait` 是 Object 方法、**释放锁**，且必须在 synchronized 块内调用，靠 `notify/notifyAll` 唤醒。\n- `join()`：等待目标线程结束；`yield()`：提示调度器让出 CPU（不可依赖）；`interrupt()` 只是设置中断标志，阻塞中线程会抛 `InterruptedException`，需自行决定退出策略。\n- 守护线程：`thread.setDaemon(true)` 必须在 start 前调用；所有非守护线程结束 JVM 就退出，GC 线程就是守护线程。\n\n### ⭐JMM 三性\n\n面试官想听：原子性、可见性、有序性，能各举一个反例并给出对应解决方案。\n\n- **原子性**：操作不可分割。`i++` 是「读-改-写」三步，多线程下会丢更新；用 `synchronized`、`AtomicInteger`、`Lock` 保证。\n- **可见性**：一个线程的修改对其他线程立即可见。工作内存（CPU 缓存）与主存不同步导致；用 `volatile`、`synchronized`、`final` 保证。\n- **有序性**：编译器/CPU 指令重排导致代码执行顺序与书写顺序不一致；`volatile` 禁止指令重排，锁保证串行语义。\n- **happens-before**：JMM 定义的操作间偏序规则（程序顺序、锁的解锁先于加锁、volatile 写先于读、线程 start/join 等），满足则后操作可见前操作的结果，是理解并发的理论抓手。\n\n### ⭐volatile\n\n面试官想听：两个保证（可见性、禁止重排）+ 一个不保证（原子性），最好带双重检查锁单例的例子。\n\n```java\npublic class Singleton {\n    private static volatile Singleton instance;   // 防止指令重排\n    public static Singleton getInstance() {\n        if (instance == null) {                   // 第一次检查：避免不必要加锁\n            synchronized (Singleton.class) {\n                if (instance == null) {           // 第二次检查\n                    instance = new Singleton();   // 分配内存->初始化->赋值，可能被重排\n                }\n            }\n        }\n        return instance;\n    }\n}\n```\n\n- `new` 对象不是原子操作：若无 volatile，另一线程可能在「赋值完成但未初始化」时拿到半成品。\n- volatile 适合**一写多读**或状态标志位（`volatile boolean running = false;`）；复合运算仍需锁或原子类。\n\n### ⭐synchronized 与锁升级\n\n面试官想听：三种用法对应不同锁对象；1.6 后锁升级路径（偏向→轻量级→重量级）说明 synchronized 并不重。\n\n- 三种用法：① 修饰实例方法（锁当前对象 this）；② 修饰静态方法（锁 Class 对象）；③ 同步代码块 `synchronized(obj)`（锁指定对象）。\n- 底层基于对象头的 Monitor（重量级锁依赖 OS mutex），Java 6 引入优化：**无锁 → 偏向锁（单线程反复进入）→ 轻量级锁（CAS 自旋）→ 重量级锁（线程挂起）**，只升不降。\n- 可重入：同一线程可重复获取自己持有的锁；异常会自动释放锁。\n- 注意 `String` 常量、Integer 缓存对象等被共享的锁对象，可能造成意外竞争。\n\n### ⭐ReentrantLock 与 synchronized vs Lock\n\n面试官想听：默认用 synchronized，需要「可中断、超时、公平、多条件」四个能力之一才上 ReentrantLock。\n\n```java\nprivate final ReentrantLock lock = new ReentrantLock();       // true 为公平锁\nprivate final Condition notEmpty = lock.newCondition();\npublic void take() throws InterruptedException {\n    lock.lockInterruptibly();                                 // 可中断获取\n    try {\n        while (queue.isEmpty()) notEmpty.await();             // 条件等待（等价 wait）\n        // 取数据\n    } finally {\n        lock.unlock();                                        // 必须放 finally\n    }\n}\n```\n\n| 维度 | synchronized | ReentrantLock |\n|---|---|---|\n| 层级 | JVM 关键字，自动释放 | JDK API，手动 lock/unlock |\n| 可中断/超时 | 不支持 | `lockInterruptibly()`/`tryLock(超时)` |\n| 公平锁 | 不支持 | 构造参数可选 |\n| 条件变量 | 单一 wait/notify | 多个 Condition 精准唤醒 |\n\n### ⭐死锁：四条件与排查\n\n面试官想听：背出四个必要条件并给出「按序加锁」这个最实用的预防手段。\n\n- 四个必要条件：**互斥、持有并等待、不可剥夺、循环等待**，破坏任意一个即可预防（最常用：所有线程按相同顺序加锁；或 `tryLock` 带超时）。\n- 排查：`jstack pid` 末尾直接输出 `Found one Java-level deadlock`；jconsole 检测死锁按钮；代码上 `lock.tryLock(timeout)` 日志告警。\n\n### ⭐线程池：7 参数、执行流程与拒绝策略\n\n面试官想听：这是并发面试第一高频，参数、流程、拒绝策略必须一次说全，再补 Executors 的坑。\n\n```java\nThreadPoolExecutor pool = new ThreadPoolExecutor(\n        4, 8, 60, TimeUnit.SECONDS,\n        new ArrayBlockingQueue<>(100),\n        Thread::new,                       // 线程工厂：命名便于排障\n        new ThreadPoolExecutor.CallerRunsPolicy());\n```\n\n- **7 参数**：核心线程数 corePoolSize、最大线程数 maximumPoolSize、空闲存活时间 keepAliveTime、时间单位、任务队列 workQueue、线程工厂 threadFactory、拒绝策略 handler。\n- **执行流程**：核心线程未满则新建核心线程执行 → 满了进队列排队 → 队列满了再创建非核心线程至 maximum → 达到 maximum 则执行拒绝策略。\n- **4 种拒绝策略**：`AbortPolicy`（默认，抛 RejectedExecutionException）、`CallerRunsPolicy`（调用者线程自己执行，天然削峰）、`DiscardPolicy`（静默丢弃）、`DiscardOldestPolicy`（丢队首最旧任务再重试）。\n- **Executors 的坑**（阿里规约禁止）：`newFixedThreadPool/newSingleThreadExecutor` 用**无界队列** LinkedBlockingQueue，任务堆积可 OOM；`newCachedThreadPool` 最大线程数 Integer.MAX_VALUE，可无限建线程。**手动 new ThreadPoolExecutor**。\n- 线程数经验公式：CPU 密集型 ≈ **N核 + 1**；I/O 密集型 ≈ **N核 × (1 + 等待时间/计算时间)**，再压测校准。\n- 优雅关闭：`shutdown()`（等任务跑完）→ `awaitTermination` → 超时后 `shutdownNow()`。\n- `submit` 吞异常：异常存在返回的 Future 里，不调用 `get()` 就无人知晓——记得处理或用 execute。\n\n### ⭐CAS 与 Atomic、ABA 问题\n\n面试官想听：CAS = 比较并交换的 CPU 原子指令，知道它的三个问题：ABA、自旋开销、只能保一个变量。\n\n- CAS：`compareAndSwap(内存值V, 预期值E, 新值N)`，硬件级原子指令，失败自旋重试；`Unsafe` → `AtomicInteger` 等的实现基础。\n- **ABA 问题**：值从 A→B→A，CAS 以为没变过；用 `AtomicStampedReference`（版本号戳）解决。\n- 常用原子类：`AtomicInteger/AtomicLong`（`incrementAndGet`）、`AtomicReference`、`LongAdder`（分段累加，高并发计数优于 AtomicLong）。\n\n### ⭐ThreadLocal 原理与内存泄漏\n\n面试官想听：ThreadLocalMap 的 key 是弱引用这条链路，以及「为什么必须 finally 里 remove」。\n\n```java\nstatic ThreadLocal<SimpleDateFormat> DF =\n        ThreadLocal.withInitial(() -> new SimpleDateFormat(\"yyyy-MM-dd\"));\ntry {\n    use(DF.get());\n} finally {\n    DF.remove();          // 必须手动清理\n}\n```\n\n- 原理：每个 `Thread` 内有 `ThreadLocalMap`，key 是 ThreadLocal 对象（**弱引用**），value 是存的值（强引用）。\n- 泄漏链路：ThreadLocal 外部引用消失后 key 被 GC 变 null，但 value 仍被线程强引用，线程池线程长存 → value 永远无法回收。Entry 的 key 为 null 也不会被主动清。\n- 结论：线程池场景用完必须 `remove()`；用途：按线程隔离状态（如 SimpleDateFormat、用户上下文、链路 traceId）。\n\n### ⭐ConcurrentHashMap 1.7 vs 1.8\n\n面试官想听：分段的粒度从「Segment 二级哈希」进化到「单桶 CAS+synchronized」。\n\n- 1.7：`Segment` 分段锁（默认 16 段，继承 ReentrantLock），并发度=段数；两次 hash 定位。\n- 1.8：抛弃分段，**Node 数组 + 链表/红黑树**；put 时桶为空用 **CAS 插入**，冲突时 **synchronized 锁住桶头节点**，锁粒度更细、并发度更高。\n- size 统计用 `baseCount + CounterCell[]` 分片计数（LongAdder 思想）；扩容支持多线程协助迁移。\n- key/value 都不允许 null（并发下无法区分「不存在」与「值为 null」）。\n\n### ⭐CountDownLatch / CyclicBarrier / Semaphore\n\n面试官想听：三个工具一句话定位——等 N 件事完成、凑 N 个人再一起走、只放行 M 个。\n\n- `CountDownLatch`：`countDown()` 减计数、`await()` 阻塞到 0；一次性，用于主线程等待多个子任务完成。\n- `CyclicBarrier`：N 个线程互相等待到齐后一起继续，可复用（可传回调）；用于分段计算后汇总。\n- `Semaphore`：许可数=并发上限，`acquire/release`；用于限流（如数据库连接数、接口并发数）。\n- 阻塞队列：`ArrayBlockingQueue`（有界数组）、`LinkedBlockingQueue`（默认无界链表）、`SynchronousQueue`（不存储、直接交接）、`DelayQueue/PriorityBlockingQueue`；`put/take` 自动阻塞，是生产者消费者的现成方案。\n\n### CompletableFuture 与虚拟线程\n\n```java\nCompletableFuture<String> price = CompletableFuture.supplyAsync(() -> queryPrice(id), pool);\nCompletableFuture<Integer> stock = CompletableFuture.supplyAsync(() -> queryStock(id), pool);\nprice.thenCombine(stock, (p, s) -> p + \" / \" + s)     // 两个结果合并\n     .orTimeout(2, TimeUnit.SECONDS)                  // 超时保护\n     .whenComplete((r, e) -> log.info(\"{}\", r, e));\n```\n\n- 异步编排三件套：`supplyAsync` 提交、`thenApply/thenAccept/thenCombine` 链式转换、`thenCompose` 串行依赖、`allOf/anyOf` 聚合多个任务。**必须传入自定义线程池**，默认池仍是 ForkJoinPool.commonPool。\n- 虚拟线程（Java 21 正式）：JVM 调度的轻量级线程（KB 级栈），`Thread.ofVirtual().start(...)` 或 `Executors.newVirtualThreadPerTaskExecutor()`；阻塞时自动挂起不占 OS 线程，**适合大量阻塞 I/O 任务**，CPU 密集无收益。\n\n## 🛠 动手实践\n\n### 任务 1：三线程交替打印 ABC\n\n```java\nprivate static final Object lock = new Object();\nprivate static int state = 0;   // 0->A, 1->B, 2->C\n// 每个线程：synchronized (lock) { while (state % 3 != self) lock.wait(); print; state++; lock.notifyAll(); }\n```\n\n- 验收标准：连续输出 `ABCABCABC...` 至少 10 轮不乱序；用 wait/notifyAll（不能用 Thread.sleep 控制顺序）；能解释为什么用 while 而不是 if 判断条件（防止虚假唤醒）。\n\n### 任务 2：阻塞队列生产者消费者\n\n- 要求：`ArrayBlockingQueue<Integer>`（容量 5），3 个生产者各生产 100 个随机数，2 个消费者取出求和；用「毒丸对象」通知消费者退出。\n- 验收标准：程序正常退出且总和打印完整；生产过快时观察 `put` 阻塞（有界队列生效）；改用手写 `wait/notifyAll` 版本对比一次。\n\n### 任务 3：线程池批处理统计耗时\n\n- 要求：用 `new ThreadPoolExecutor(4, 8, ...)` 提交 1000 个模拟任务（`Thread.sleep(1)`），统计总耗时；分别设置 CPU 密集（sleep 0）与 I/O 密集（sleep 10）参数对比线程数公式。\n- 验收标准：记录不同 corePoolSize 下的耗时对比数据；拒绝策略演示触发过一次（队列调小）；所有线程有命名（自定义 ThreadFactory）。\n\n## 💼 高频面试题\n\n**Q：创建线程有几种方式？⭐**\n- 继承 Thread 重写 run；实现 Runnable 交给 Thread；实现 Callable 配 FutureTask 拿返回值；线程池提交任务。\n- 本质上只有「new Thread().start()」一种启动方式，其他都是任务形态差异。\n- 实践必须用线程池：复用线程、统一管控、避免频繁创建销毁。\n\n**Q：线程有哪些状态？⭐**\n- 6 种：NEW、RUNNABLE、BLOCKED、WAITING、TIMED_WAITING、TERMINATED。\n- 调 start 后进入 RUNNABLE；等 synchronized 进入 BLOCKED；wait/join/park 进入 WAITING；带超时版本进入 TIMED_WAITING。\n- sleep 不释放锁、wait 释放锁且必须在同步块内。\n\n**Q：volatile 和 synchronized 的区别？⭐**\n- volatile 只保证可见性和有序性，不保证原子性；synchronized 三性都保证。\n- volatile 是轻量级无锁方案，适合状态标志、一写多读；synchronized 互斥执行，适合复合操作。\n- volatile 不阻塞线程；synchronized 可能阻塞。volatile 修饰变量，synchronized 修饰方法/代码块。\n\n**Q：说说线程池的核心参数与任务执行流程。⭐**\n- 7 参数：corePoolSize、maximumPoolSize、keepAliveTime、时间单位、workQueue、threadFactory、拒绝策略 handler。\n- 流程：核心线程未满直接新建执行 → 满了进队列 → 队列满再建线程到最大值 → 达到最大值执行拒绝策略。\n- 四种拒绝策略：Abort（抛异常）、CallerRuns（调用者执行）、Discard（丢弃）、DiscardOldest（丢最旧）。\n\n**Q：线程池大小怎么定？**\n- CPU 密集型：N+1（N 为核心数），避免过多上下文切换。\n- I/O 密集型：N × (1 + 等待时间/计算时间)，等待占比越大线程越多。\n- 经验值需压测校准；区分业务用独立线程池，避免相互影响。\n\n**Q：ThreadLocal 为什么会内存泄漏？⭐**\n- 每个 Thread 持有 ThreadLocalMap，key 是弱引用的 ThreadLocal，value 是强引用。\n- ThreadLocal 被回收后 key 变 null，value 无法访问但被长生命周期线程（线程池）强引用，无法回收。\n- 规范：使用完（尤其线程池场景）必须在 finally 中 remove()。\n\n**Q：CAS 是什么？有什么问题？**\n- Compare And Swap：比较内存值与预期值，相等则替换为新值，由 CPU 原子指令保证，失败自旋重试。Atomic 类的底层。\n- 问题：ABA（用 AtomicStampedReference 加版本号解决）、自旋开销（竞争激烈时 CPU 空转）、只能保证单个变量原子性。\n- 典型应用：AtomicInteger 计数、ConcurrentHashMap 空桶插入。\n\n**Q：ConcurrentHashMap 如何保证并发安全？1.7 和 1.8 区别？⭐**\n- 1.7：Segment 分段锁（默认 16 段 ReentrantLock），锁一段。\n- 1.8：CAS + synchronized 锁单个桶头节点，粒度更细并发更高；链表过长转红黑树。\n- size 用 CounterCell 分片计数；不允许 null key/value。\n\n**Q：sleep 和 wait 的区别？**\n- 所属：Thread.sleep 是静态方法；wait 是 Object 方法。\n- 锁：sleep 不释放锁；wait 释放对象锁。\n- 场景：wait/notify 配合做线程间通信，必须在 synchronized 内；sleep 单纯休眠。\n\n**Q：死锁怎么产生、怎么排查和避免？**\n- 四个必要条件：互斥、持有并等待、不可剥夺、循环等待。\n- 排查：jstack 输出 Found one Java-level deadlock；jconsole 检测死锁。\n- 避免：全局固定加锁顺序、tryLock 带超时、减小锁粒度、用并发工具替代手写锁。\n\n## 🔗 推荐资料\n\n| 资料 | 说明 | 链接 |\n|---|---|---|\n| 廖雪峰 Java 多线程 | 线程基础到同步机制的主线教程 | https://liaoxuefeng.com/books/java/threading/index.html |\n| pdai 并发知识体系 | JMM/锁/线程池/JUC 全景与源码索引 | https://pdai.tech/md/java/thread/java-thread-x-overview.html |\n| JavaGuide 并发面试题 | 本章所有面试题的标准展开版本 | https://javaguide.cn/java/concurrent/java-concurrent-questions-01.html |\n","ck":0},{"id":"f9","stage":2,"path":"02-进阶篇/02-JVM核心.md","title":"02-JVM核心","md":"# 02-JVM核心\n\n> **阶段**：进阶篇 ｜ **建议时长**：5 天 ｜ **前置**：建议先学 01-多线程与并发编程.md\n\n## 🎯 学习目标\n\n- 能默画运行时数据区五块区域，并说明哪些线程共享、哪些线程私有。\n- 能演示三种 OOM（堆、栈、元空间）并说出对应参数。\n- 能讲清类加载五阶段、双亲委派模型及其打破场景。\n- 掌握 GC 判活算法、四种引用、三大回收算法与 G1 的核心特点。\n- 会用 jps/jstat/jmap/jstack/arthas 完成 CPU 飙高与 Full GC 频繁的排查。\n\n## 📖 核心知识点\n\n### ⭐运行时数据区\n\n面试官想听：先分「线程私有 vs 共享」再逐区说职责与 OOM 表现，这是 JVM 面试的第一题。\n\n```\n线程私有：程序计数器 ｜ 虚拟机栈（栈帧：局部变量表/操作数栈/动态链接/返回地址）｜ 本地方法栈\n线程共享：堆（对象实例；分新生代 Eden+2*Survivor / 老年代）｜ 元空间 Metaspace（类元数据）\n```\n\n- **程序计数器**：当前线程字节码执行行号，唯一不会 OOM/StackOverflow 的区域。\n- **虚拟机栈**：每个方法调用压入一个栈帧；递归过深抛 `StackOverflowError`；线程过多也可能 OOM（无法创建本地线程）。\n- **堆**：GC 主战场；`-Xms` 初始大小、`-Xmx` 最大大小；分配不下的对象抛 `java.lang.OutOfMemoryError: Java heap space`。\n- **元空间**（Java 8 取代永久代）：存类元信息、常量池（运行时常量）、静态变量移至堆（Java 8 起在堆中）；用本地内存，`-XX:MaxMetaspaceSize` 限制，动态生成类过多会 OOM: Metaspace。\n- 直接内存（NIO DirectByteBuffer）：不属于运行时数据区但受 `-XX:MaxDirectMemorySize` 限制。\n\n### 对象创建与内存布局\n\n- 创建流程：检查类是否已加载 → 分配内存（指针碰撞/空闲列表；TLAB 线程私有缓冲避免并发竞争）→ 零值初始化 → 设置对象头（哈希码、GC 分代年龄、锁标志）→ 执行构造方法。\n- 内存布局三部分：**对象头**（Mark Word + 类型指针 + 数组长度）、**实例数据**、**对齐填充**（8 字节整数倍）。\n- 对象分配优先在 Eden（TLAB），大对象直接进老年代（`-XX:PretenureSizeThreshold`），长期存活（年龄 ≥ 15）晋升老年代。\n\n### 各区域 OOM 演示\n\n```java\nList<byte[]> heapLeak = new ArrayList<>();          // OOM: Java heap space\nwhile (true) heapLeak.add(new byte[1024 * 1024]);\n\npublic void stackOverflow(int i) { stackOverflow(i + 1); }   // StackOverflowError\n\n// OOM: Metaspace —— CGLIB/反射在循环里动态生成类不回收\n// 启动参数：-Xmx32m -Xss128k -XX:MaxMetaspaceSize=16m\n```\n\n- 排查的第一步永远是让 OOM 时自动 dump：`-XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp`。\n\n### ⭐类加载五阶段\n\n面试官想听：加载→验证→准备→解析→初始化的顺序，以及「准备阶段赋默认值、初始化阶段才执行 <clinit>」的细节。\n\n- **加载**：读取字节码生成 Class 对象；**验证**：格式/元数据/字节码/符号引用合法性；**准备**：为静态变量分配内存并赋**零值**（`static int a = 1` 此时 a=0；被 `static final` 修饰的常量则直接赋值）；**解析**：符号引用转直接引用；**初始化**：执行静态变量赋值与静态代码块（`<clinit>`，JVM 保证加锁、只执行一次）。\n- 触发初始化的时机（主动引用）：`new`、读写静态字段（非 final）、调用静态方法、反射、子类初始化触发父类、main 所在类。\n- 不触发初始化：通过子类引用父类静态字段、数组定义、访问 final 常量（编译期已入常量池）。\n- 验证练习：`static int a = 1; static int b;` 中准备阶段后 a=0、b=0，`<clinit>` 执行后 a 才等于 1；`static final int C = 1` 在准备阶段即赋值（ConstantValue 属性）。\n- 类加载器是隔离的基础：同一个 `.class` 被两个不同加载器加载会得到两个互不兼容的 Class 对象（`instanceof` 为 false），Tomcat 多应用隔离正基于此。\n\n### ⭐类加载器与双亲委派\n\n面试官想听：三层加载器 + 「先委托父加载器，父无法加载才自己加载」的流程，能说出安全与唯一性两个意义。\n\n```\nBootstrap（核心类库 rt.jar，C++ 实现）← 扩展类加载器 PlatformClassLoader ← 应用类加载器 AppClassLoader ← 自定义类加载器\n```\n\n- 流程：收到加载请求先向上委托，父加载器能加载就返回；都到顶仍失败才逐层向下由子加载器尝试。\n- 意义：① 安全——用户自定义 `java.lang.String` 不会被加载替换核心类；② 唯一——同一个类只被加载一次，保证 `Class` 对象全局唯一。\n- **打破双亲委派的场景**：SPI/JDBC（`Thread.contextClassLoader` 线程上下文类加载器反向委托）、OSGi/容器热部署（每个模块独立加载器）、Tomcat 的 WebappClassLoader（先自己加载 web 应用类实现隔离）。\n\n### ⭐GC Roots 可达性分析\n\n面试官想听：能列举至少四类 GC Roots，并说清与引用计数的对比（为什么 Java 不用引用计数）。\n\n- 可作为 GC Roots 的对象：**虚拟机栈（栈帧局部变量表）引用的对象、方法区类静态变量引用的对象、方法区常量引用的对象、JNI（本地方法栈）引用的对象、活跃线程、锁持有的对象**。\n- 从 Roots 出发不可达 ⇒ 可回收。相比引用计数，可达性分析能正确处理循环引用（Java 不用引用计数的核心原因）。\n- 四种引用（强 → 软 → 弱 → 虚）：强引用不回收；**软引用**内存不足才回收（缓存）；**弱引用**下次 GC 必回收（WeakHashMap、ThreadLocalMap 的 key）；虚引用仅用于回收通知（堆外内存管理）。\n\n### 回收算法与分代\n\n- **标记-清除**：标记可达后清除；缺点：效率不稳、内存碎片。\n- **标记-复制**：内存分两块，存活对象复制到另一半；无碎片、效率高，代价是可用内存减半——**适合存活率低的新生代**（Eden:S0:S1 = 8:1:1）。\n- **标记-整理**：存活对象向一端移动；无碎片但移动成本高——**适合存活率高的老年代**。\n- Minor GC：回收新生代，Eden 满触发，复制算法，STW 短；对象年龄 +1。\n- **Full GC（Major GC）触发条件**：老年代空间不足、元空间不足、`System.gc()` 建议、空间分配担保失败、大对象直接分配失败。STW 时间长，**线上要重点监控**。\n\n### ⭐垃圾收集器演进：CMS → G1 → ZGC\n\n面试官想听：按「追求更短停顿」这条主线串起演进，能说出 G1 三点核心设计。\n\n| 收集器 | 特点 | 局限 |\n|---|---|---|\n| Parallel GC（1.8 默认） | 吞吐量优先，多线程并行回收 | 停顿长 |\n| CMS（9 已移除） | 并发标记清除，停顿短 | 碎片、并发失败退化、CPU 敏感 |\n| **G1（9+ 默认）** | 分 Region 管理、可预测停顿（`-XX:MaxGCPauseMillis=200`）、整体标记整理+局部复制 | 大堆下的记忆集开销 |\n| ZGC/Shenandoah | 着色指针/读屏障，停顿 <1ms，支持 TB 级堆 | 吞吐略有损耗，版本要求高 |\n\n- **G1 三个关键词**：Region 化布局（不再物理分代，逻辑上分 Eden/Survivor/Old/Humongous）、按停顿目标优先回收「垃圾最多」的 Region（Garbage First 得名）、并行并发混合回收。\n\n### 常用 JVM 参数表\n\n| 参数 | 作用 | 常用值 |\n|---|---|---|\n| -Xms / -Xmx | 堆初始/最大（两者设为相同避免抖动） | 2g / 2g |\n| -Xss | 单线程栈大小 | 512k~1m |\n| -Xmn | 新生代大小 | 堆的 1/3 |\n| -XX:MetaspaceSize / MaxMetaspaceSize | 元空间初始/上限 | 256m |\n| -XX:MaxGCPauseMillis | G1 停顿目标 | 200 |\n| -XX:+HeapDumpOnOutOfMemoryError | OOM 自动 dump | 开启 |\n| -XX:+PrintGCDetails（或 -Xlog:gc*） | GC 日志 | 开启 |\n| -XX:SurvivorRatio / PretenureSizeThreshold | Eden 比 / 大对象阈值 | 8 / 视情况 |\n\n### ⭐排查工具箱与两个经典案例\n\n面试官想听：工具会一个一个报出名字，并按固定套路描述排查过程，这是校招/社招的「过程分」。\n\n- 工具：`jps`（进程号）、`jstat -gcutil pid 1000`（GC 统计）、`jmap -heap`/`jmap -dump:live,format=b,file=heap.hprof pid`（堆转储）、`jstack pid`（线程栈）、`jinfo`、图形化 jconsole/VisualVM/MAT/JProfiler、在线诊断 **Arthas**（`dashboard`、`thread -n 3`、`heapdump`、`trace`）。\n- Arthas 三步上手：`curl -O arthas-boot.jar` 启动选择进程 → `dashboard` 总览线程/内存/GC → `thread -b` 直接找死锁、`watch 类名 方法名 '{params,returnObj}'` 观察入参出参，无需重启应用。\n\n**CPU 100% 排查流程：**\n1. `top` 找到高 CPU 的 Java 进程 PID。\n2. `top -Hp pid` 找到该进程内高 CPU 的线程 TID。\n3. `printf '%x' TID` 把线程号转十六进制。\n4. `jstack pid | grep -A 30 '0x十六进制'` 定位线程栈，看它卡在哪个业务方法。\n5. 常见原因：死循环、正则回溯、频繁 Full GC（GC 线程本身占满）。\n\n**内存泄漏排查思路：**\n1. 现象确认：jstat 观察 Old 区持续上涨、Full GC 后回收很少。\n2. `jmap -dump` 导出堆快照（或 OOM 自动 dump）。\n3. MAT/VisualVM 分析支配树，找 Retained Size 最大的对象链，定位到持有引用的业务代码。\n4. 常见泄漏源：静态集合只增不减、ThreadLocal 未 remove、监听器/回调未注销、连接未关闭。\n\n## 🛠 动手实践\n\n### 任务 1：堆 OOM 复现并用 jmap 定位\n\n- 要求：用 `-Xmx32m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp` 启动一段「List 持续添加 1MB 数组」的代码，触发 OOM；用 MAT 或 `jmap -histo pid` 找到占用最大的类型。\n- 验收标准：能截出 OOM 日志与 dump 分析图；能说出「哪一行代码持有引用、为什么 GC 无法回收」；写出让堆存活参数生效的完整启动命令。\n\n### 任务 2：jstack 分析死锁\n\n- 要求：写两个线程互锁（A 锁 o1 等 o2，B 锁 o2 等 o1），启动后执行 `jstack pid`。\n- 验收标准：找到输出中的 `Found one Java-level deadlock` 段落并贴出两个线程的栈帧；能按栈信息对上代码中两把锁的获取顺序；改造成按序加锁后死锁消失。\n\n### 任务 3：jstat 观察 Full GC\n\n- 要求：程序周期性创建大对象但不持有引用，再改造成持续持有引用两个版本；`jstat -gcutil pid 500` 观察 Eden/Survivor/Old/FGC 变化。\n- 验收标准：能解释 YGC 与 FGC 列数值的变化含义；第二版本出现 Old 持续增长、FGC 次数上升；总结一行结论（Old 涨且 FGC 不降 ≈ 泄漏嫌疑）。\n\n## 💼 高频面试题\n\n**Q：说说 JVM 运行时内存区域。⭐**\n- 线程私有：程序计数器（行号）、虚拟机栈（栈帧，StackOverflowError 发生地）、本地方法栈。\n- 线程共享：堆（对象实例，分新生代/老年代）、元空间（类元数据，Java 8 取代永久代，用本地内存）。\n- 再补一句各区域对应的 OOM 类型，体现理解深度。\n\n**Q：对象什么时候进入老年代？⭐**\n- 年龄达到阈值（默认 15，CMS 6）长期存活的对象。\n- 大对象直接进入老年代（避免 Eden 与 Survivor 间反复复制）。\n- Minor GC 后 Survivor 放不下的对象通过空间分配担保提前进入老年代；动态年龄判断：同龄对象总大小超 Survivor 一半，该年龄及以上直接晋升。\n\n**Q：如何判断对象可以被回收？⭐**\n- 可达性分析：从 GC Roots（栈局部变量、静态变量、常量、JNI 引用、活跃线程等）出发，不可达即可回收。\n- 引用计数无法处理循环引用，JVM 不采用。\n- 补充四种引用强度：强不回收、软引用内存不足回收、弱引用下次 GC 回收、虚引用仅通知。\n\n**Q：G1 和 CMS 的区别？为什么 G1 成为主流？⭐**\n- CMS 标记-清除产生碎片，并发失败退化 Serial Old；G1 整体标记整理无碎片。\n- G1 按停顿目标优先回收垃圾最多的 Region，停顿可预测可控；CMS 只针对老年代，G1 全堆统一管理。\n- CMS 已在 Java 9 移除，G1 自 Java 9 起为默认收集器。\n\n**Q：类加载过程与双亲委派模型。⭐**\n- 五阶段：加载、验证、准备（静态变量赋零值）、解析、初始化（执行 <clinit>）。\n- 双亲委派：收到请求先委托父加载器，直到 Bootstrap，父加载不了才自己加载。\n- 意义：防止核心类被篡改、保证类全局唯一。打破场景：SPI 的线程上下文类加载器、Tomcat 隔离部署、热部署。\n\n**Q：线上 CPU 飙高怎么排查？⭐**\n- top 找高 CPU 进程 → top -Hp 找高 CPU 线程 → printf '%x' 转十六进制 → jstack 按线程号 grep 定位栈帧。\n- 常见根因：死循环、正则回溯灾难、频繁 GC（看 jstat）。\n- 有条件用 Arthas：thread -n 3 一步定位，dashboard 总览。\n\n**Q：Full GC 频繁怎么排查？⭐**\n- 先看 GC 日志/jstat 确认频率与每次回收量：Old 回收后仍高 ⇒ 疑似泄漏，dump 分析大对象链。\n- 回收后 Old 很低但仍频繁触发 ⇒ 检查堆太小、MetaSpace 不足、System.gc() 调用、内存分配速率过高。\n- 手段组合：GC 日志 + jmap dump + MAT 支配树；优化方向：调大堆/元空间、修泄漏、对象池化、降低分配速率。\n\n**Q：有哪些 JVM 调优参数是你常用的？**\n- -Xms=-Xmx 固定堆、-Xss 栈、-XX:MaxMetaspaceSize、-XX:MaxGCPauseMillis（G1 停顿目标）。\n- 排障三件套：HeapDumpOnOutOfMemoryError、GC 日志、（容器环境）-XX:+UseContainerSupport。\n- 强调：调优基于监控数据，不是背参数。\n\n## 🔗 推荐资料\n\n| 资料 | 说明 | 链接 |\n|---|---|---|\n| pdai JVM 内存结构 | 运行时数据区图文详解 | https://pdai.tech/md/java/jvm/java-jvm-struct.html |\n| pdai JVM 垃圾回收 | GC 算法与收集器演进梳理 | https://pdai.tech/md/java/jvm/java-jvm-gc.html |\n| pdai 类加载机制 | 双亲委派与打破场景 | https://pdai.tech/md/java/jvm/java-jvm-classload.html |\n| JavaGuide JVM 面试题 | 本章面试题的完整版答案 | https://javaguide.cn/java/jvm/jvm-interview-questions.html |\n","ck":0},{"id":"f10","stage":2,"path":"02-进阶篇/03-IO模型与网络编程.md","title":"03-IO模型与网络编程","md":"# 03-IO模型与网络编程\n\n> **阶段**：进阶篇 ｜ **建议时长**：3 天 ｜ **前置**：01-环境搭建与基础语法.md\n\n## 🎯
