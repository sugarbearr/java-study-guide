kind":"blank","cat":"Java8","diff":"中","q":"Stream 的中间操作是＿＿＿求值的，只有遇到终端操作才会真正执行。","alts":[["惰性","lazy"]],"exp":"filter/map 等只记录流水线，collect/forEach 等终端操作才拉动执行；这也是 peek 不接终端操作不生效的原因。详见[《05-Lambda-Stream与Java8新特性》](#/f/f7)","ref":"f7"},{"id":"qa3e67645","kind":"blank","cat":"Java基础","diff":"中","q":"Java 中 String 与 StringBuilder 的核心区别是：String 是＿＿＿的，StringBuilder 是可变的。","alts":[["不可变","immutable"]],"exp":"String 每次拼接产生新对象，循环拼接应用 StringBuilder 避免大量临时对象。详见[《02-面向对象与核心类》](#/f/f4)","ref":"f4"},{"id":"qedf35c4c","kind":"blank","cat":"Java基础","diff":"易","q":"Java 支持＿＿＿继承，一个类可以实现多个接口。","alts":[["单","单一"]],"exp":"单继承多实现是 Java 的设计取舍，避免 C++ 菱形继承的歧义问题；接口多实现配合 Java 8 default 方法需要显式消歧。详见[《02-面向对象与核心类》](#/f/f4)","ref":"f4"},{"id":"qd1cf5beb","kind":"blank","cat":"集合","diff":"中","q":"保证元素唯一性的 HashSet，底层实际是维护了一个＿＿＿。","alts":[["HashMap","哈希表"]],"exp":"HashSet 把元素当 key 存入 HashMap，value 是统一的占位对象，因此去重依赖 hashCode+equals。详见[《03-集合与泛型》](#/f/f5)","ref":"f5"},{"id":"q959310ea","kind":"blank","cat":"Java基础","diff":"中","q":"finally 块中若执行 return，会＿＿＿ try 块中已有的返回值。","alts":[["覆盖","覆盖掉"]],"exp":"finally 在方法返回前执行，其中的 return 会替换原返回值；同理 try 里有 return、finally 里改基本类型变量不会影响已确定的返回值。详见[《04-异常-IO-反射-注解》](#/f/f6)","ref":"f6"},{"id":"q51424e88","kind":"blank","cat":"集合","diff":"中","q":"List、Set、Map 三大集合中，＿＿＿不属于 Collection 接口体系。","alts":[["Map"]],"exp":"Collection 分支是 List/Set/Queue，Map 是独立顶层接口，以键值对存储，两者无继承关系。详见[《03-集合与泛型》](#/f/f5)","ref":"f5"},{"id":"qdc79e65b","kind":"blank","cat":"Java8","diff":"中","q":"方法引用 `String::length` 等价于 Lambda 表达式＿＿＿。","alts":[["s -> s.length()","str -> str.length()"]],"exp":"方法引用是 Lambda 的语法糖，静态方法用 类::方法名，实例方法用 对象::方法名，构造器用 类::new。详见[《05-Lambda-Stream与Java8新特性》](#/f/f7)","ref":"f7"},{"id":"q4610157f","kind":"blank","cat":"集合","diff":"中","q":"把数组转成固定长度的 List 常用 Arrays.＿＿＿ 方法，但它不支持 add/remove。","alts":[["asList"]],"exp":"asList 返回的是 Arrays 内部类视图，长度固定；要可变列表需 new ArrayList<>(Arrays.asList(arr))。详见[《03-集合与泛型》](#/f/f5)","ref":"f5"},{"id":"qaa86de9d","kind":"blank","cat":"Java基础","diff":"中","q":"String.intern() 的作用是把字符串放入＿＿＿，返回其规范表示。","alts":[["字符串常量池","常量池","StringTable"]],"exp":"JDK 7 起常量池移到堆中，intern 用于复用重复字符串、节省内存；大量重复字符串场景是优化点。详见[《02-面向对象与核心类》](#/f/f4)","ref":"f4"},{"id":"q3cab5388","kind":"blank","cat":"集合","diff":"中","q":"用 Stream 把 List 转 Map 时，若 key 重复会抛 IllegalStateException，需传入＿＿＿参数指定合并策略。","alts":[["合并函数","mergeFunction","BinaryOperator"]],"exp":"`toMap(keyMapper, valueMapper, (a,b) -> b)` 三参重载用合并函数消解冲突，否则默认 throwDuplicates。详见[《05-Lambda-Stream与Java8新特性》](#/f/f7)","ref":"f7"},{"id":"qf285e4d1","kind":"blank","cat":"Java基础","diff":"中","q":"`Integer a = 100; Integer b = 100; a == b` 的结果是＿＿＿。","alts":[["true"]],"exp":"-128~127 内命中 IntegerCache 返回同一对象，超出范围则各建对象为 false；比较值应始终用 equals。详见[《02-面向对象与核心类》](#/f/f4)","ref":"f4"},{"id":"q3e84c712","kind":"blank","cat":"并发","diff":"易","q":"synchronized 修饰实例方法时，锁对象是＿＿＿。","alts":[["this","当前对象","调用该方法的对象"]],"exp":"实例方法锁 this，静态方法锁 Class 对象，同步代码块锁括号里指定的对象，三种用法锁的对象各不相同。详见[《01-多线程与并发编程》](#/f/f9)","ref":"f9"},{"id":"qbaa5769a","kind":"blank","cat":"并发","diff":"易","q":"调用 `thread.start()` 之后，线程进入的第一个状态是＿＿＿（填英文状态名）。","alts":[["RUNNABLE"]],"exp":"start 只是让线程进入可运行状态参与调度，并不等于立刻占用 CPU；NEW 是还没 start 时的状态。详见[《01-多线程与并发编程》](#/f/f9)","ref":"f9"},{"id":"q5ed1176c","kind":"blank","cat":"并发","diff":"中","q":"ReentrantLock 默认是＿＿＿锁，只有在构造时传入 true 才会按队列顺序发放。","alts":[["非公平"]],"exp":"非公平锁允许新线程插队先 CAS 抢一次，省掉挂起与唤醒开销、吞吐更高；只有防饥饿才需要公平模式。详见[《01-多线程与并发编程》](#/f/f9)","ref":"f9"},{"id":"qbd50b183","kind":"blank","cat":"并发","diff":"中","q":"ReentrantReadWriteLock 的读锁与写锁共用一个 state 字段，其中高 16 位记录＿＿＿。","alts":[["读锁的持有次数","读锁的数量","读锁被获取的总次数"]],"exp":"低 16 位是写锁的重入次数、高 16 位是读锁持有总数，因此读写锁的重入上限都是 65535。详见[《01-多线程与并发编程》](#/f/f9)","ref":"f9"},{"id":"q5d9d8ae8","kind":"blank","cat":"并发","diff":"难","q":"虚拟线程在 synchronized 块中执行阻塞操作时无法从载体线程上卸载，这种现象称为＿＿＿（中文术语或英文原词均可）。","alts":[["固定","钉住","pinning"]],"exp":"pinning 会让载体线程一起被占住，虚拟线程失去伸缩优势；官方建议把这类临界区改用 ReentrantLock。详见[《01-多线程与并发编程》](#/f/f9)","ref":"f9"},{"id":"q5010e3ff","kind":"blank","cat":"JVM","diff":"易","q":"对象优先在新生代的＿＿＿区分配；超过 -XX:PretenureSizeThreshold 的大对象则直接在＿＿＿分配。","alts":[["Eden","伊甸园区"],["老年代"]],"exp":"Eden 是新生代的主要分配区，大对象直接进老年代可避免在 Eden 与 Survivor 之间反复复制。详见[《02-JVM核心》](#/f/f10)","ref":"f10"},{"id":"q64cb49f9","kind":"blank","cat":"网络","diff":"易","q":"TCP 依靠序号＋＿＿＿实现丢包重传，依靠＿＿＿窗口实现流量控制。","alts":[["确认应答","ACK"],["滑动"]],"exp":"ACK 与超时重传保证数据不丢，滑动窗口让发送方按接收方的处理能力调速，拥塞控制则保护网络本身。详见[《03-IO模型与网络编程》](#/f/f11)","ref":"f11"},{"id":"qe1f27339","kind":"blank","cat":"操作系统","diff":"易","q":"进程是＿＿＿分配的基本单位，线程是＿＿＿调度的基本单位。","alts":[["资源"],["CPU","处理器"]],"exp":"进程拥有独立地址空间等资源，线程共享进程资源但各有自己的栈与程序计数器，是调度实际作用的对象。详见[《03-IO模型与网络编程》](#/f/f11)","ref":"f11"},{"id":"qb204e23e","kind":"blank","cat":"操作系统","diff":"易","q":"虚拟地址到物理地址的转换依靠＿＿＿完成；当访问的页面不在物理内存中时，会触发＿＿＿中断。","alts":[["页表"],["缺页"]],"exp":"页表记录虚拟页到物理页框的映射，缺页中断由内核把页面从磁盘调入后再恢复执行，这是按需调页的基础。详见[《03-IO模型与网络编程》](#/f/f11)","ref":"f11"},{"id":"qc66e7cfb","kind":"blank","cat":"JVM","diff":"中","q":"Java 8 起方法区由＿＿＿实现，使用本地内存；其容量上限可通过参数 -XX:＿＿＿ 设置。","alts":[["元空间","Metaspace"],["MaxMetaspaceSize"]],"exp":"元空间取代了永久代，默认不设上限只受本机内存约束，动态生成类过多会 OOM: Metaspace，生产建议显式限制。详见[《02-JVM核心》](#/f/f10)","ref":"f10"},{"id":"q5b000b15","kind":"blank","cat":"网络","diff":"易","q":"HTTPS 握手阶段用＿＿＿加密安全地协商出会话密钥，之后的通信数据使用＿＿＿加密传输。","alts":[["非对称","公钥"],["对称"]],"exp":"非对称加密安全但慢，只用来交换密钥；对称加密快，用来承载真正的业务数据，这就是混合加密的分工。详见[《03-IO模型与网络编程》](#/f/f11)","ref":"f11"},{"id":"q15fc5614","kind":"blank","cat":"MySQL","diff":"易","q":"建表时，金额与成绩等要求精确的小数字段应使用＿＿＿类型，而不是 FLOAT/DOUBLE。","alts":[["DECIMAL","decimal","DECIMAL(M,D)","定点数"]],"exp":"FLOAT/DOUBLE 以二进制浮点存储，比较与累加都会产生误差；DECIMAL 按十进制精确存储，代价是运算稍慢。详见[《MySQL基础与SQL实战》](#/f/f13)","ref":"f13"},{"id":"qeed7e365","kind":"blank","cat":"MySQL","diff":"易","q":"联合索引中，查询条件必须从最左列开始连续命中才能用上索引，这一规则称为＿＿＿原则。","alts":[["最左前缀","最左匹配","最左前缀匹配"]],"exp":"(a,b,c) 相当于提供 a、(a,b)、(a,b,c) 三套索引能力，跳过 a 直接查 b 就用不上这个索引。详见[《索引-事务-锁与调优》](#/f/f14)","ref":"f14"},{"id":"q0fb4f680","kind":"blank","cat":"MySQL","diff":"易","q":"InnoDB 的行锁是加在＿＿＿上的，因此 UPDATE/DELETE 的 WHERE 条件若没有走索引，会退化成扫描全表并把扫过的记录全锁住。","alts":[["索引","索引项","索引记录"]],"exp":"这也解释了为什么加锁类语句的条件列必须有索引；无索引的 UPDATE 会把每一条记录都加上临键锁，约等于锁全表。详见[《索引-事务-锁与调优》](#/f/f14)","ref":"f14"},{"id":"q500ca024","kind":"blank","cat":"MySQL","diff":"中","q":"explain 的 Extra 列出现＿＿＿表示用到了覆盖索引、无需回表；出现＿＿＿表示有额外的文件排序需要优化。","alts":[["Using index"],["Using filesort"]],"exp":"前者说明查询列都在索引中，后者说明排序无法由索引顺序满足；Using temporary（临时表）同样是值得优化的信号。详见[《索引-事务-锁与调优》](#/f/f14)","ref":"f14"},{"id":"qcc804f8f","kind":"blank","cat":"MySQL","diff":"中","q":"SQL 逻辑执行顺序中，＿＿＿在 GROUP BY 之前过滤行，＿＿＿在分组之后过滤组。","alts":[["WHERE"],["HAVING"]],"exp":"因为 WHERE 早于 SELECT 执行，它引用不了 SELECT 中定义的别名，而 HAVING 与 ORDER BY 可以。详见[《MySQL基础与SQL实战》](#/f/f13)","ref":"f13"},{"id":"qb781c766","kind":"blank","cat":"MySQL","diff":"难","q":"主从延迟的三类常见成因是：从库重放能力不足、主库存在＿＿＿导致从库长时间追不上、从库机器配置弱于主库。","alts":[["大事务","大事务或大表 DDL"]],"exp":"单线程重放遇上一次性改几十万行的事务就会持续落后；对策是拆小事务、开启并行复制、关键读强制走主库。详见[《索引-事务-锁与调优》](#/f/f14)","ref":"f14"},{"id":"q4ee12ea4","kind":"blank","cat":"Redis","diff":"易","q":"删除百万元素的大 key 时，用＿＿＿命令把键从键空间摘除、内存回收交给后台线程，可避免 DEL 造成的长时间阻塞。","alts":[["UNLINK","unlink"]],"exp":"大 key 的痛点是释放内存的耗时全压在主线程上；UNLINK 先摘除键、由后台线程回收内存，把阻塞降到最低。日常还应定期用 `redis-cli --bigkeys` 排查大 key。详见[《01-Redis》](#/f/f21)","ref":"f21"},{"id":"qbec13bdd","kind":"blank","cat":"Redis","diff":"易","q":"缓存 key 即使业务上\"不会变\"，也建议显式设置＿＿＿，它既能回收冷数据，也是删缓存失败时的一致性兜底。","alts":[["过期时间","TTL","ttl","EXPIRE"]],"exp":"业务数据变更时，即使删缓存的逻辑漏了或调用失败，到期后也会自动失效并重新加载，这是最后一道兜底。详见[《01-Redis》](#/f/f21)","ref":"f21"},{"id":"qed834bee","kind":"blank","cat":"消息队列","diff":"易","q":"Kafka 中消费进度体现为消费者提交的＿＿＿，重置它就能重新消费历史消息。","alts":[["offset","位移","偏移量"]],"exp":"Kafka 不因消费而删除消息，消费进度只是一个位移数字，所以既能被多个消费组各读各的，也能通过重置位移做数据回放。详见[《03-Kafka》](#/f/f23)","ref":"f23"},{"id":"q7741b664","kind":"blank","cat":"Redis","diff":"中","q":"Redis Sentinel 中，单个哨兵判定主节点失联称为＿＿＿下线；达到 quorum 数量的哨兵共同确认后才升级为＿＿＿下线并触发故障转移。","alts":[["主观"],["客观"]],"exp":"这样设计是为了避免单个哨兵的网络抖动引发误切换，也正是哨兵要多节点部署的原因。详见[《01-Redis》](#/f/f21)","ref":"f21"},{"id":"q89d9fa3b","kind":"blank","cat":"消息队列","diff":"中","q":"RocketMQ 中，Broker 对迟迟收不到二次确认的半消息会发起＿＿＿，由生产者反查本地事务状态后返回提交或回滚。","alts":[["事务回查","回查"]],"exp":"回查依据是 checkLocalTransaction() 里反查业务表（如订单是否创建成功），把\"本地事务成功\"与\"消息可达\"绑成最终一致。详见[《04-RocketMQ》](#/f/f24)","ref":"f24"},{"id":"q30fa3481","kind":"blank","cat":"消息队列","diff":"难","q":"RocketMQ 顺序消息依赖两段配合：发送时按业务 key 哈希进入同一个＿＿＿，消费端用 ConsumeMode.＿＿＿ 加队列锁单线程消费。","alts":[["MessageQueue"],["ORDERLY"]],"exp":"队列内天然 FIFO，加锁串行消费才能保证顺序。代价是吞吐下降、消费失败会阻塞该队列的重试，Broker 主从切换也会短暂破坏顺序。详见[《04-RocketMQ》](#/f/f24)","ref":"f24"},{"id":"q395e3db5","kind":"blank","cat":"Elasticsearch","diff":"中","q":"Elasticsearch 中在 refresh 之前就记录下写入操作、用于防止内存数据丢失的日志称为＿＿＿。","alts":[["translog","事务日志"]],"exp":"写入同时进内存 buffer 和 translog，即使进程崩溃也能靠 translog 重放恢复；它要到 flush 时才被清空。refresh 只负责「可见」，translog 负责「不丢」。详见[《05-Elasticsearch》](#/f/f25)","ref":"f25"},{"id":"qab4ba186","kind":"blank","cat":"ZooKeeper","diff":"易","q":"ZooKeeper 中生命周期与客户端会话绑定、会话断开后由服务端自动删除的节点称为＿＿＿节点。","alts":[["临时","ephemeral"]],"exp":"临时节点是服务注册与分布式锁自动释放的基石；在此基础上加顺序后缀得到的临时顺序节点，可实现公平锁并避免羊群效应。详见[《06-ZooKeeper与Nacos》](#/f/f26)","ref":"f26"},{"id":"q2c762513","kind":"blank","cat":"ZooKeeper","diff":"易","q":"Nacos 临时实例默认每＿＿＿秒发送一次心跳，超过＿＿＿秒未收到心跳的实例会被自动剔除。","alts":[["5"],["30"]],"exp":"15 秒未收到心跳只是标记为不健康，30 秒未收到才真正剔除。这套「心跳保活 + 超时剔除」的机制正是 AP 模式下最终一致的实现方式。详见[《06-ZooKeeper与Nacos》](#/f/f26)","ref":"f26"},{"id":"qf8a43865","kind":"blank","cat":"Nginx","diff":"易","q":"Nginx 配置中的＿＿＿指令块用于定义一组后端服务器，并按指定策略把请求分发到它们。","alts":[["upstream"]],"exp":"upstream 定义节点池，配合 weight（权重轮询）、ip_hash（会话保持）、least_conn（最少连接）等策略；location 里再用 proxy_pass 引用它，这是负载均衡配置的标准结构。详见[《07-Nginx》](#/f/f27)","ref":"f27"},{"id":"q78465429","kind":"blank","cat":"MongoDB","diff":"中","q":"MongoDB 中让文档在指定秒数后自动过期的索引称为＿＿＿索引。","alts":[["TTL"]],"exp":"`db.log_events.createIndex({ createdAt: 1 }, { expireAfterSeconds: 3600 })` 即可让文档在 createdAt 之后一小时自动删除，特别适合日志、埋点、临时会话这类「只关心近期数据」的场景，省去手写清理任务。详见[《08-MongoDB》](#/f/f28)","ref":"f28"},{"id":"q5b2380f6","kind":"blank","cat":"框架","diff":"易","q":"Spring 中声明式事务依赖的注解是 @＿＿＿。","alts":[["Transactional"]],"exp":"加到方法或类上即可，底层由 AOP 代理实现，所以一切绕过代理的调用（自调用、非 public 方法）都会失效。详见[《Spring核心》](#/f/f15)","ref":"f15"},{"id":"qcca749b0","kind":"blank","cat":"框架","diff":"易","q":"Spring 中 @Autowired 默认按＿＿＿匹配候选 Bean，候选不唯一时可用 @Qualifier 按名称指定。","alts":[["类型"]],"exp":"@Autowired 是 Spring 提供的注解、默认按类型注入，配合 @Qualifier 或 @Primary 解决多候选；@Resource 是 JDK 规范，默认按名称。详见[《Spring核心》](#/f/f15)","ref":"f15"},{"id":"q67abfadf","kind":"blank","cat":"框架","diff":"易","q":"MyBatis 中用于遍历集合、生成 IN 查询或批量插入的动态 SQL 标签是 <＿＿＿>。","alts":[["foreach"]],"exp":"foreach 负责循环，collection 指定集合、item 是元素别名、separator 是分隔符；配合 `<where>` 的\"去头\"和 `<set>` 的\"去尾\"构成动态 SQL 的常用组合。详见[《MyBatis》](#/f/f17)","ref":"f17"},{"id":"q4715ceb8","kind":"blank","cat":"单元测试","diff":"易","q":"JUnit 5 中标注在方法上、表示每个 @Test 执行前都会先跑一次的注解是 @＿＿＿。","alts":[["BeforeEach"]],"exp":"@BeforeEach/@AfterEach 每个用例各一次，@BeforeAll/@AfterAll 全部用例共一次且必须是 static 方法——因为 JUnit 5 为每个 @Test 都新建一个测试类实例。详见[《05-单元测试与工程质量》](#/f/f19)","ref":"f19"},{"id":"q142b1840","kind":"blank","cat":"单元测试","diff":"中","q":"Mockito 中要断言\"某个方法从未被调用过\"，应写成 verify(mock, ＿＿＿())。","alts":[["never"]],"exp":"verify 的默认次数是 times(1)，还有 atLeastOnce()/atMost()；用 never() 断言\"不该发生的事\"是单测里容易被忽略、价值却很高的一类断言。详见[《05-单元测试与工程质量》](#/f/f19)","ref":"f19"},{"id":"q87cca456","kind":"blank","cat":"认证与安全","diff":"易","q":"RBAC 模型中，用户不直接关联权限，而是通过＿＿＿作为中转。","alts":[["角色"]],"exp":"链路是用户 → 角色 → 权限 → 资源，角色是批量授权的中转站，换岗只改角色不改人；落地时前端按钮显隐只是体验，后端接口鉴权才是安全。详见[《06-认证与安全》](#/f/f20)","ref":"f20"},{"id":"qe9b5a86a","kind":"blank","cat":"分布式与高并发","diff":"易","q":"BASE 理论是对 CAP 中 AP 路线的工程化延伸，三个字母分别指基本可用、软状态和＿＿＿。","alts":[["最终一致","Eventually Consistent","最终一致性"]],"exp":"Basically Available 指降级、限流保住核心功能；Soft state 指允许\"支付处理中\"这类中间态存在；Eventually consistent 指经过一段时间同步与补偿后收敛到一致。互联网业务的主流选择就是\"接受短暂不一致，用对账与补偿把窗口压到最小\"。详见[《01-分布式理论基础》](#/f/f29)","ref":"f29"},{"id":"q469fd0ff","kind":"blank","cat":"分布式与高并发","diff":"中","q":"Seata AT 模式在一阶段把业务 SQL 修改前后的镜像写入 ＿＿＿ 表，并与业务数据在同一个本地事务中提交，二阶段回滚时据此生成反向 SQL。","alts":[["undo_log"]],"exp":"前后镜像（before/after image）随本地事务一起落库，保证\"业务改动\"与\"可回滚信息\"原子；全局提交时只需异步批量删除，几乎无性能损耗；全局回滚时先校验后镜像没有被别人改过，再用前镜像生成补偿 SQL。AT 靠 TC 的全局锁保证回滚窗口内数据不被其他全局事务修改，用并发性能换业务零侵入（一个 @GlobalTransactional 注解）。详见[《01-分布式理论基础》](#/f/f29)","ref":"f29"},{"id":"qa529e91e","kind":"blank","cat":"系统设计","diff":"易","q":"短链系统通常用自增 ID 配合 ＿＿＿ 编码（0-9、A-Z、a-z 共 62 个字符）生成 6~7 位短码。","alts":[["Base62"]],"exp":"62 进制把长数字压得很短，6 位就有 62^6 ≈ 568 亿的空间，配合发号器（DB 号段 / Redis INCR / 雪花）即可。自定义后缀则另走业务表的唯一键，冲突就重试。别忘了跳转用 301、不存在的短码用布隆过滤器提前挡掉。详见[《03-系统设计场景题》](#/f/f31)","ref":"f31"},{"id":"q262d1f2e","kind":"blank","cat":"系统设计","diff":"中","q":"统计 UV 时只关心去重后的数量、不关心具体是谁，用 Redis 的 ＿＿＿ 结构只需约 12KB 就能把标准误差控制在 0.81%。","alts":[["HyperLogLog"]],"exp":"HyperLogLog 用概率算法估算基数，内存恒定约 12KB（16384 个 6bit 寄存器），比 SET 省下几个数量级。代价是只能拿到计数、拿不到成员列表，且结果本身是近似值。判断要不要精确应先问指标的精度要求：排行榜要精确名次，UV 通常只用来看趋势。详见[《01-Redis》](#/f/f21)","ref":"f21"},{"id":"qbad7410d","kind":"blank","cat":"系统设计","diff":"中","q":"IM 系统为每个会话维护一个单调递增的 ＿＿＿，接收方按它排序与去重，一次解决\"不乱序\"和\"重复消息\"两个问题。","alts":[["seq","序列号","会话内序列号"]],"exp":"IM 的可靠性四件套是不丢（ACK + 重传 + 离线拉取）、不乱（会话内单调递增的 seq）、不重（幂等 msgId）、在线状态（心跳 / 临时节点）。有了 seq，客户端断线重连只需上报\"我收到的最大 seq\"，服务端就能续传缺口，比逐条确认高效得多；已读回执也别逐条存，用位图或区间压缩。详见[《03-系统设计场景题》](#/f/f31)","ref":"f31"},{"id":"q9e7ad10d","kind":"blank","cat":"工具链","diff":"中","q":"打 war 包部署到外部 Tomcat 时，`spring-boot-starter-tomcat` 应设为 `<scope>＿＿＿<\/scope>`：编译与测试可用，但不打进包，由运行容器提供。","alts":[["provided"]],"exp":"provided 在编译、测试 classpath 上有效而运行 classpath 上无效；若不这样设，war 内嵌的 Tomcat 会和外部容器自带的冲突导致启动失败。打可执行 jar 独立运行的场景则不需要。详见[《04-开发工具链-Git-Maven-Linux》](#/f/f12)","ref":"f12"},{"id":"qa63bbb8f","kind":"blank","cat":"工具链","diff":"中","q":"统计 access.log 中访问次数 Top10 的 IP，命令为 `awk '{print $1}' access.log | sort | ＿＿＿ | sort -rn | head -10`。","alts":[["uniq -c"]],"exp":"uniq 只能合并相邻的重复行，所以必须先 sort；-c 给每组加上出现次数前缀，再 `sort -rn` 按次数降序取前 10。这也解释了为什么不能直接对原始文件 sort -rn——那时比较的是整行文本而不是计数。详见[《04-开发工具链-Git-Maven-Linux》](#/f/f12)","ref":"f12"},{"id":"q836c6bb2","kind":"blank","cat":"设计模式","diff":"易","q":"`Integer` 缓存 -128~127 与字符串常量池复用字面量，都是＿＿＿模式的落地：由工厂统一管理、共享不可变实例来节省内存。","alts":[["享元"]],"exp":"共享的是\"多个相同值的对象共用同一份实例\"，而不是\"全局唯一实例\"，所以不是单例；这也解释了 `Integer a=128,b=128` 时 == 为 false——超出缓存范围就不再共享。享元对象必须不可变，否则一个持有者改了全都受影响。详见[《07-设计模式》](#/f/f8)","ref":"f8"},{"id":"q6d47f36c","kind":"blank","cat":"设计模式","diff":"中","q":"静态内部类（Holder）单例既能延迟加载又线程安全，靠的是内部类被首次引用时才触发类加载，且 JVM 保证同一个类的＿＿＿过程只执行一次。","alts":[["初始化","类初始化"]],"exp":"类初始化由 JVM 加锁完成，所以 Holder.I 只会被创建一次，既不用 volatile 也不用显式加锁；延迟则来自\"内部类只有被引用时才加载\"这一特性。详见[《07-设计模式》](#/f/f8)","ref":"f8"},{"id":"q9198943f","kind":"blank","cat":"算法","diff":"易","q":"二分查找中，为避免 `(left + right) / 2` 在两个大整数相加时溢出，常写成 `mid = left + ＿＿＿`。","alts":[["(right - left) / 2"]],"exp":"变形后等价于取中间位置，差值不会超过 int 范围；`(left + right) >>> 1` 也是常见的无溢出写法。详见[《03-算法刷题路线》](#/f/f34)","ref":"f34"},{"id":"qa5c86d7d","kind":"blank","cat":"算法","diff":"中","q":"「找下一个更大元素」这一类题（每日温度、柱状图中最大的矩形）的标准解法是维护一个＿＿＿栈。","alts":[["单调栈","单调递减栈"]],"exp":"把暂时还没有更大元素的下标压栈，遇到更大的就弹栈结算，每个元素最多进出栈一次，整体 O(n)；与暴力双重循环的 O(n²) 形成对比。详见[《03-算法刷题路线》](#/f/f34)","ref":"f34"},{"id":"qdadc9c6b","kind":"judge","cat":"并发","diff":"易","q":"volatile 可以保证 i++ 这类复合操作的原子性。","opts":["正确","错误"],"a":"B","exp":"volatile 只管可见性与有序性，i++ 是\"读-改-写\"三步，并发下仍会丢更新，需要 synchronized 或 AtomicInteger。详见[《01-多线程与并发编程》](#/f/f9)","ref":"f9"},{"id":"q1cec6a47","kind":"judge","cat":"集合","diff":"易","q":"HashMap 的 key 允许为 null。","opts":["正确","错误"],"a":"A","exp":"JDK 1.8 允许一个 null 键（固定放在 0 号桶）；而 Hashtable 与 ConcurrentHashMap 的 key、value 都不允许为 null。详见[《03-集合与泛型》](#/f/f5)","ref":"f5"},{"id":"q63d3c7fe","kind":"judge","cat":"Java基础","diff":"中","q":"`\"a|b\".split(\"|\")` 能正确按竖线切成两个元素，不需要转义。","opts":["正确","错误"],"a":"B","exp":"split 的参数是正则，竖线表示\"或\"，结果是每个字符被空匹配切开；必须写成 split(\"\\\\|\")。详见[《02-面向对象与核心类》](#/f/f4)","ref":"f4"},{"id":"qa2604307","kind":"judge","cat":"并发","diff":"中","q":"synchronized 修饰静态方法时，锁的是该类的 Class 对象。","opts":["正确","错误"],"a":"A","exp":"静态方法没有 this，锁的是 Class 对象，与实例锁互不影响——同一类里静态与实例同步方法可以并发进入。详见[《01-多线程与并发编程》](#/f/f9)","ref":"f9"},{"id":"q388ae959","kind":"judge","cat":"集合","diff":"中","q":"重写 equals 而不重写 hashCode，程序一定会抛出异常或明显出错。","opts":["正确","错误"],"a":"B","exp":"不放进哈希容器时逻辑上看不出问题，所以更隐蔽；一旦用作 HashMap 键或 HashSet 元素，就会重复存、get 不到。违反的是约定而非必然崩溃。详见[《02-面向对象与核心类》](#/f/f4)","ref":"f4"},{"id":"q91f4ae02","kind":"judge","cat":"框架","diff":"易","q":"MyBatis 的 #{} 最终会被编译成 JDBC 的预编译占位符 ?。","opts":["正确","错误"],"a":"A","exp":"#{} 由 PreparedStatement 用 setXxx 绑定参数，SQL 结构在编译期确定，因此能防注入。详见[《MyBatis》](#/f/f17)","ref":"f17"},{"id":"qf173b870","kind":"judge","cat":"Redis","diff":"中","q":"Redis 6.0 的多线程只用于网络 IO 与协议解析，命令的执行仍然是单线程。","opts":["正确","错误"],"a":"A","exp":"多线程解决的是网络读写瓶颈；命令在单线程中串行执行，因此单条命令的原子性依旧成立，Lua 脚本也据此工作。详见[《01-Redis》](#/f/f21)","ref":"f21"},{"id":"q6784bb72","kind":"judge","cat":"消息队列","diff":"中","q":"Kafka Topic 增加分区数后，同一个 key 的消息可能被路由到与历史不同的分区。","opts":["正确","错误"],"a":"A","exp":"分区路由是 hash(key) % 分区数，分区数一变映射就变；需要严格顺序的业务要评估扩容影响或改用新 Topic。详见[《03-Kafka》](#/f/f23)","ref":"f23"},{"id":"qb58f76c7","kind":"judge","cat":"MySQL","diff":"中","q":"在默认 RR 隔离级别下，MySQL 已经彻底杜绝了幻读，任何写法都不会出现。","opts":["正确","错误"],"a":"B","exp":"快照读靠 MVCC、当前读靠临键锁各自避免幻读，但\"先快照读、再被别的事务插入、再当前读/更新\"这类混用场景仍会看到幻影行。详见[《索引-事务-锁与调优》](#/f/f14)","ref":"f14"},{"id":"q37ee4579","kind":"judge","cat":"框架","diff":"中","q":"Spring 事务传播行为 REQUIRED 表示：当前有事务就加入，没有就新建一个。","opts":["正确","错误"],"a":"A","exp":"这是默认值；REQUIRES_NEW 会挂起当前事务另开一个，NESTED 用保存点，SUPPORTS 无事务则非事务执行。详见[《Spring核心》](#/f/f15)","ref":"f15"},{"id":"qcf2fa34d","kind":"judge","cat":"框架","diff":"中","q":"@Transactional 默认会对所有抛出的 Exception（含受检异常）回滚。","opts":["正确","错误"],"a":"B","exp":"默认只对 RuntimeException 和 Error 回滚，受检异常需要 rollbackFor = Exception.class 才回滚——这是最常见的\"事务没回滚\"原因。详见[《Spring核心》](#/f/f15)","ref":"f15"},{"id":"qaf0a530c","kind":"judge","cat":"单元测试","diff":"中","q":"为提高覆盖率，单元测试应优先直接测试私有方法。","opts":["正确","错误"],"a":"B","exp":"私有方法是实现细节，直接反射测试会让重构寸步难行；应通过公共入口的行为测试间接覆盖，若难测则说明该方法该拆出去了。详见[《05-单元测试与工程质量》](#/f/f19)","ref":"f19"},{"id":"q99d52b34","kind":"judge","cat":"Java基础","diff":"中","q":"Java 中 String 是基本数据类型。","opts":["正确","错误"],"a":"B","exp":"String 是引用类型（final 类），8 种基本类型不含它；面试常拿它与基本类型的包装类一起考。详见[《02-面向对象与核心类》](#/f/f4)","ref":"f4"},{"id":"qea804b20","kind":"judge","cat":"集合","diff":"中","q":"HashMap 是线程安全的。","opts":["正确","错误"],"a":"B","exp":"HashMap 非线程安全，并发 put 可能丢数据甚至 1.7 下成环；并发场景用 ConcurrentHashMap 或 Collections.synchronizedMap。详见[《03-集合与泛型》](#/f/f5)","ref":"f5"},{"id":"q82559c08","kind":"judge","cat":"Java基础","diff":"中","q":"重写 equals 必须同时重写 hashCode。","opts":["正确","错误"],"a":"A","exp":"约定是相等的对象必须有相同哈希值，否则 HashMap/HashSet 中会「存进去却找不到」；反之 hashCode 相同不要求 equals 相等。详见[《02-面向对象与核心类》](#/f/f4)","ref":"f4"},{"id":"q1ae706c7","kind":"judge","cat":"集合","diff":"易","q":"ArrayList 支持随机访问，按下标取元素的时间复杂度是 O(1)。","opts":["正确","错误"],"a":"A","exp":"底层数组可直接寻址；LinkedList 按下标访问需从头遍历是 O(n)，这也是两者选型的核心差异之一。详见[《03-集合与泛型》](#/f/f5)","ref":"f5"},{"id":"qf3b790fd","kind":"judge","cat":"Java8","diff":"中","q":"Stream 可以被重复消费，同一流可以 collect 两次。","opts":["正确","错误"],"a":"B","exp":"Stream 是一次性的，终端操作后流已关闭，复用会抛 IllegalStateException；需要复用就每次从源重新 stream()。详见[《05-Lambda-Stream与Java8新特性》](#/f/f7)","ref":"f7"},{"id":"qbd644bf5","kind":"judge","cat":"Java基础","diff":"难","q":"Java 中 `i++` 是原子操作。","opts":["正确","错误"],"a":"B","exp":"i++ 是读-改-写三步，多线程下会丢更新，需 AtomicInteger 或加锁；这与 volatile 无关，volatile 也不保证原子性。详见[《01-多线程与并发编程》](#/f/f9)","ref":"f9"},{"id":"q2d230200","kind":"judge","cat":"并发","diff":"易","q":"线程已经 start() 之后，仍然可以调用 setDaemon(true) 把它改成守护线程。","opts":["正确","错误"],"a":"B","exp":"setDaemon 必须在 start 之前调用，否则抛 IllegalThreadStateException；守护属性不允许事后再改。详见[《01-多线程与并发编程》](#/f/f9)","ref":"f9"},{"id":"qbb1d5f63","kind":"judge","cat":"并发","diff":"中","q":"CyclicBarrier 的计数归零后会自动重置、可以循环使用，而 CountDownLatch 归零后无法重置。","opts":["正确","错误"],"a":"A","exp":"CyclicBarrier 可复用且支持到齐回调，CountDownLatch 是一次性的，想重新计数只能新建对象，这是两者最常被问的区别。详见[《01-多线程与并发编程》](#/f/f9)","ref":"f9"},{"id":"q19690ef4","kind":"judge","cat":"并发","diff":"中","q":"在 synchronized 代码块内调用 `Thread.sleep()` 会让当前线程释放它持有的锁。","opts":["正确","错误"],"a":"B","exp":"sleep 不释放锁，会抱着锁睡到超时；会释放锁的是 Object.wait()，它同时把线程挂到等待队列。详见[《01-多线程与并发编程》](#/f/f9)","ref":"f9"},{"id":"qef4e6741","kind":"judge","cat":"并发","diff":"难","q":"线程 A 先执行 `v = 1`（v 为 volatile），紧接着执行 `y = 2`（y 为普通变量）；线程 B 读到 `v == 1` 后再读 y，则 B 一定能读到 `y == 2`。","opts":["正确","错误"],"a":"A","exp":"A 中 v 的写先于 y 的写，volatile 写又 happens-before 读到它的读，加上 B 中读 v 先于读 y，传递性让 y 的写对 B 可见。详见[《01-多线程与并发编程》](#/f/f9)","ref":"f9"},{"id":"qa5652a8f","kind":"judge","cat":"JVM","diff":"易","q":"把 -Xms 与 -Xmx 设为相同值，可以避免堆在运行期间反复扩容与收缩带来抖动，是生产的常用做法。","opts":["正确","错误"],"a":"A","exp":"固定堆大小省去动态调整的代价，也便于按最坏情况规划内存，代价是启动即占用全部堆空间。详见[《02-JVM核心》](#/f/f10)","ref":"f10"},{"id":"q2541622b","kind":"judge","cat":"网络","diff":"中","q":"TCP 是面向字节流的协议，不保留应用层的消息边界，因此粘包与拆包需要应用层自己处理。","opts":["正确","错误"],"a":"A","exp":"TCP 只保证字节有序到达，会把多次 write 合并或拆分；常见解法是定长、分隔符或\"长度字段＋内容\"的自定义协议。详见[《03-IO模型与网络编程》](#/f/f11)","ref":"f11"},{"id":"qa10a1efd","kind":"judge","cat":"网络","diff":"中","q":"TCP 三次握手中，若客户端发出的第三个 ACK 报文丢失，连接一定无法建立。","opts":["正确","错误"],"a":"B","exp":"客户端发出 ACK 后即认为连接已建立并可发送数据；服务端超时会重传 SYN+ACK，客户端再次确认后连接照样建立。详见[《03-IO模型与网络编程》](#/f/f11)","ref":"f11"},{"id":"q978db63a","kind":"judge","cat":"操作系统","diff":"中","q":"只要系统的资源足够充足，就不会发生死锁。","opts":["正确","错误"],"a":"B","exp":"死锁源于四个必要条件同时成立，与资源总量无关；两个线程各持一把锁再互相申请，资源再多也会死锁。详见[《03-IO模型与网络编程》](#/f/f11)","ref":"f11"},{"id":"qa3427b38","kind":"judge","cat":"JVM","diff":"中","q":"Eden 区被填满时会触发 Full GC。","opts":["正确","错误"],"a":"B","exp":"Eden 满触发的是 Minor GC（Young GC）；Full GC 的常见触发点老年代或元空间不足、分配担保失败、调用 System.gc() 等。详见[《02-JVM核心》](#/f/f10)","ref":"f10"},{"id":"q0006a593","kind":"judge","cat":"MySQL","diff":"易","q":"只要在 (a, b) 上建了联合索引，单独用 b 作为查询条件也能走上这个索引。","opts":["正确","错误"],"a":"B","exp":"联合索引先按 a 排序，a 未限定时 b 在全局是无序的，不满足最左前缀；需要单独给 b 建索引或调整索引列顺序。详见[《索引-事务-锁与调优》](#/f/f14)","ref":"f14"},{"id":"q87517f95","kind":"judge","cat":"MySQL","diff":"中","q":"事务 ACID 中的隔离性（I）是靠 redo log 实现的。","opts":["正确","错误"],"a":"B","exp":"隔离性靠 MVCC 与锁共同实现；redo log 保证的是持久性（D），undo log 保证的是原子性（A）。详见[《索引-事务-锁与调优》](#/f/f14)","ref":"f14"},{"id":"q4f2142a1","kind":"judge","cat":"MySQL","diff":"中","q":"在大表上查询要返回其中大部分数据时，优化器主动放弃索引改为全表扫描是正常现象，此时 explain 的 key 为 NULL 未必说明 SQL 有问题。","opts":["正确","错误"],"a":"A","exp":"走二级索引要逐行回表且是随机 IO，当条件区分度低、命中行数占比过高时，顺序全表扫描反而更快；一切以实测耗时为准。详见[《索引-事务-锁与调优》](#/f/f14)","ref":"f14"},{"id":"q2593adda","kind":"judge","cat":"MySQL","diff":"难","q":"binlog 组提交（group commit）把多个事务的 binlog 刷盘合并成一次 fsync，从而摊薄两阶段提交带来的磁盘 IO 开销。","opts":["正确","错误"],"a":"A","exp":"commit 阶段被拆成 flush、sync、commit 三段，每段一个队列由 leader 带队执行，多个事务共用一次刷盘；prepare 阶段不变。详见[《索引-事务-锁与调优》](#/f/f14)","ref":"f14"},{"id":"qa7f40650","kind":"judge","cat":"Redis","diff":"中","q":"Redis 的发布订阅可以当作消息队列使用，订阅者离线期间的消息会在重连后补投。","opts":["正确","错误"],"a":"B","exp":"Pub/Sub 是即发即弃：没有持久化、没有 ACK、没有重投，订阅者离线期间的消息直接丢失，只适合\"丢一两次无大碍\"的缓存失效广播；业务消息（订单、支付）必须交给 RabbitMQ/Kafka/RocketMQ 这类专业 MQ。详见[《01-Redis》](#/f/f21)","ref":"f21"},{"id":"qe213bc17","kind":"judge","cat":"消息队列","diff":"中","q":"Kafka 通过分区设计保证了消息的全局有序，只要 Topic 有足够多的分区，就能同时兼顾吞吐与全局顺序。","opts":["正确","错误"],"a":"B","exp":"Kafka 只保证分区内有序，分区之间没有任何顺序关系，所以\"全局有序\"与\"多分区并行\"本质互斥，真要全局有序只能退化成单分区。业务上的常规解法是收敛为\"同一业务 key 有序\"，按 key 路由到同一分区。详见[《03-Kafka》](#/f/f23)","ref":"f23"},{"id":"qf9033bbe","kind":"judge","cat":"Redis","diff":"中","q":"RDB 是二进制的紧凑快照，恢复速度比 AOF 快，代价是可能丢失最后一次快照之后的写入。","opts":["正确","错误"],"a":"A","exp":"RDB 定时 fork 子进程做全量快照，文件小、加载快，但两次快照之间的写入会丢；AOF 记录写命令序列，everysec 下最多丢约 1 秒，代价是文件更大、恢复更慢。生产常用混合持久化兼顾两者。详见[《01-Redis》](#/f/f21)","ref":"f21"},{"id":"qccf86cb3","kind":"judge","cat":"消息队列","diff":"易","q":"RabbitMQ 生产者开启 publisher confirm 后收到 Basic.Ack，只说明消息已被 Broker 接收，并不代表消费者已经处理成功。","opts":["正确","错误"],"a":"A","exp":"Confirm 只覆盖\"生产者到 Broker\"这一段，与消费成功与否无关；若消息到了交换机却路由不到任何队列，还要靠 publisher-returns + ReturnCallback 才能捕获。全链路可靠需要队列与消息持久化、消费者手动 ACK、失败重试与死信队列逐段补齐。详见[《02-RabbitMQ》](#/f/f22)","ref":"f22"},{"id":"q01e13dc0","kind":"judge","cat":"Elasticsearch","diff":"中","q":"ES 中「更新一条文档」的底层实现是直接在原 segment 里原地修改这条记录。","opts":["正确","错误"],"a":"B","exp":"segment 一旦生成即不可修改，更新实际是「标记旧文档为删除 + 写入一条新文档」，被标记的旧文档要到段合并（merge）时才真正回收空间——这正是 ES 更新代价高的根源，也是它不适合当主库的原因之一。详见[《05-Elasticsearch》](#/f/f25)","ref":"f25"},{"id":"q22481966","kind":"judge","cat":"Nginx","diff":"中","q":"开源版 Nginx 的 upstream 只提供被动健康检查（max_fails/fail_timeout），主动探测需要商业版或第三方模块。","opts":["正确","错误"],"a":"A","exp":"被动检查是「请求失败达到 max_fails 次就把该节点暂停 fail_timeout 时长不派流量」，属于事后发现；主动探测（定期发请求探活）开源版不具备，需要商业版或 OpenResty 等第三方模块补齐。详见[《07-Nginx》](#/f/f27)","ref":"f27"},{"id":"q38e26c4e","kind":"judge","cat":"MongoDB","diff":"易","q":"MongoDB 的单文档更新本身就是原子的，所以把强关联数据放进同一个文档、减少对跨文档事务的依赖，是它的惯用设计。","opts":["正确","错误"],"a":"A","exp":"一条 BSON 文档的更新不会「写一半」，因此「把需要一起变更的数据内嵌在同一文档里」比开事务更高效，这也是文档模型的核心设计思路。MongoDB 4.0 起虽支持多文档事务，但性能与生态仍不如关系库，不适合当 MySQL 的替代品。详见[《08-MongoDB》](#/f/f28)","ref":"f28"},{"id":"q23ad56a7","kind":"judge","cat":"框架","diff":"中","q":"Spring Boot 扫描到的候选自动配置类都会被注册成 Bean，条件注解只决定它们的加载先后顺序。","opts":["正确","错误"],"a":"B","exp":"条件注解是\"是否生效\"的开关，不满足条件的候选类根本不会注册（@ConditionalOnMissingBean 就是让位给用户配置的关键）；加载先后顺序由 @AutoConfigureOrder/@AutoConfigureBefore 这类注解控制，与条件注解是两件事。详见[《SpringBoot实战》](#/f/f16)","ref":"f16"},{"id":"q6cea58ec","kind":"judge","cat":"框架","diff":"难","q":"Feign 的重试只应对幂等操作开启：对下单这类非幂等接口重试，可能造成重复下单。","opts":["正确","错误"],"a":"A","exp":"重试的本质是\"再发一次请求\"，查询接口重复执行无害，下单、扣款重复执行就是事故；所以只给幂等接口配 Retryer，非幂等接口要靠超时 + 幂等号来兜底。另需显式配置 connectTimeout/readTimeout，避免下游慢调用拖垮自己。详见[《SpringCloud微服务》](#/f/f18)","ref":"f18"},{"id":"qafbebeaf","kind":"judge","cat":"框架","diff":"难","q":"Sentinel 触发限流或熔断后，请求会走 blockHandler 等兜底逻辑返回降级结果，而不是把异常直接抛给用户。","opts":["正确","错误"],"a":"A","exp":"这正是\"降级\"的意义：被限流/熔断/异常时返回缓存旧值、默认值这类\"有损但可用\"的结果。注意规则默认存在内存里，重启即丢失，生产要接 Nacos 做规则持久化。详见[《SpringCloud微服务》](#/f/f18)","ref":"f18"},{"id":"q618fe3fb","kind":"judge","cat":"单元测试","diff":"难","q":"测试类上标注 @Transactional 后，用例结束时数据库、Redis 与消息队列的写入都会一起回滚，因此不会污染环境。","opts":["正确","错误"],"a":"B","exp":"它只回滚当前事务里的数据库操作，回滚不了 Redis、消息队列等外部副作用；而且因为复用同一连接、内层事务被合并，还会掩盖事务传播行为的 bug。生产级做法是独立测试库每轮清理，或用 Testcontainers 每次起新容器。详见[《05-单元测试与工程质量》](#/f/f19)","ref":"f19"},{"id":"q33b5f32c","kind":"judge","cat":"认证与安全","diff":"中","q":"JWT 的 payload 是加密的，所以把手机号等敏感信息放进 payload 是安全的。","opts":["正确","错误"],"a":"B","exp":"JWT 是\"签名\"不是\"加密\"，header 与 payload 只是 Base64URL 编码，任何人都能解开看内容；签名只保证不被篡改，不保证保密。payload 里只放 userId、role 这类不敏感标识，手机号等敏感数据留在服务端按需查询。详见[《06-认证与安全》](#/f/f20)","ref":"f20"},{"id":"q5f55490c","kind":"judge","cat":"分布式与高并发","diff":"中","q":"一致性哈希环上移除一个节点时，该节点原本承载的数据会被平均分摊到其余所有节点上。","opts":["正确","错误"],"a":"B","exp":"数据是沿环顺时针找到第一个节点存放的，所以被移除节点的数据只会整体交给它在环上的**顺时针后继**那一台，其余节点分毫不动。之所以看起来\"分摊开了\"，是因为虚拟节点让每个物理节点在环上有上百个落点，它的后继自然散布在多台机器上——这是虚拟节点的第二个好处：故障压力均摊。详见[《01-分布式理论基础》](#/f/f29)","ref":"f29"},{"id":"q96e6751f","kind":"judge","cat":"系统设计","diff":"易","q":"短链跳转返回 301（永久重定向）而不是 302，好处是浏览器会缓存这次跳转，从而减少对短链服务的回源请求。","opts":["正确","错误"],"a":"A","exp":"301 会被浏览器缓存，同一短码的后续访问可能根本不打到服务端，对读多写少的短链系统是很大的减负。反过来，如果业务强依赖每次点击都回源，才会考虑 302——但点击统计的正确做法是异步上报（写 MQ 不阻塞跳转），而不是牺牲缓存来换。详见[《03-系统设计场景题》](#/f/f31)","ref":"f31"},{"id":"qc666ccce","kind":"judge","cat":"系统设计","diff":"中","q":"Redis ZSET 中分数相同的成员会按成员名的字典序排列，因此做排行榜时若要求\"同分先达到者排前\"，需要把时间信息编进 score。","opts":["正确","错误"],"a":"A","exp":"ZSET 的排序规则是\"先比 score，score 相同再按 member 字典序\"，字典序与达成先后毫无关系。常规做法是把 score 设计成复合值（例如 `分数 × 10^10 + (大常数 - 时间戳)`），一次 ZADD 就把并列名次也定好；取榜单用 ZREVRANGE，查自己名次用 ZREVRANK。注意\"精确名次\"与\"TopN 列表\"是两个量级的问题，亿级数据要靠分桶 + 近似 + 定时快照。详见[《03-系统设计场景题》](#/f/f31)","ref":"f31"},{"id":"q67202e0e","kind":"judge","cat":"工具链","diff":"易","q":"git rebase 会把被重放的提交彻底删除，之后再也找不回来。","opts":["正确","错误"],"a":"B","exp":"rebase 是\"把提交逐个重放\"，原提交仍以悬空对象留在仓库里，通过 reflog 或旧 sha 通常还能找回，直到 gc 回收；它真正危险的地方不是\"丢内容\"，而是改写了公共历史导致协作者本地历史错位。详见[《04-开发工具链-Git-Maven-Linux》](#/f/f12)","ref":"f12"},{"id":"qeaabcc85","kind":"judge","cat":"设计模式","diff":"中","q":"把 `@Scope(\"prototype\")` 的 Bean 注入到一个单例 Bean 之后，该单例持有的始终是注入时创建的那一个实例。","opts":["正确","错误"],"a":"A","exp":"注入只发生一次，之后这个字段一直指向最初创建的对象。想每次都拿新的，需要用 ObjectProvider、@Lookup 或直接从容器 getBean——这是原型模式在 Spring 里最常见的踩坑点。详见[《07-设计模式》](#/f/f8)","ref":"f8"},{"id":"qfd27cec6","kind":"judge","cat":"算法","diff":"易","q":"快速排序的最坏时间复杂度是 O(nlogn)。","opts":["正确","错误"],"a":"B","exp":"快排最坏是 O(n²)——每次划分只能分出一个元素（如已有序数组固定取首元素为基准），递归深度退化成 n。O(nlogn) 是它的平均复杂度，这一点是最常见的时间复杂度误解之一。详见[《03-算法刷题路线》](#/f/f34)","ref":"f34"},{"id":"qdb0a772b","kind":"judge","cat":"算法","diff":"中","q":"HashMap 的查询平均时间复杂度是 O(1)，最坏情况下会退化成 O(n)。","opts":["正确","错误"],"a":"A","exp":"哈希均匀时定位到桶是常数时间；大量 key 落在同一个桶（哈希碰撞）时会退化成链表扫描，JDK 1.8 用\"链表长度超过 8 且容量 ≥ 64 时转红黑树\"把最坏情况改善到 O(logn)。详见[《03-集合与泛型》](#/f/f5)","ref":"f5"}]}</script>

/* ---------- Markdown 渲染 ---------- */
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function inline(s) {
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
  const links = [];
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, u) => { links.push([t, u]); return '\u0001' + (links.length - 1) + '\u0001'; });
  // 裸 URL 自动转为可点击链接（资料表里的纯文本网址）
  s = s.replace(/https?:\/\/[A-Za-z0-9._~:/?#[\]@!$&'()*+,;=%-]+/g,
    m => '<a href="' + m + '" target="_blank" rel="noopener">' + m + '</a>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\s][^*]*?)\*/g, '$1<em>$2</em>');
  s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  s = s.replace(/\u0001(\d+)\u0001/g, (m, i) => {
    const t = links[i][0], u = links[i][1];
    return u.startsWith('#')
      ? '<a class="ilink" href="' + u + '">' + t + '</a>'
      : '<a href="' + u + '" target="_blank" rel="noopener">' + t + '</a>';
  });
  s = s.replace(/\u0000(\d+)\u0000/g, (m, i) => '<code>' + codes[i] + '</code>');
  return s;
}
function itemHtml(txt, f) {
  const tm = txt.match(/^\[( |x)\]\s*([\s\S]*)$/);
  if (tm) {
    const key = f.id + ':' + (f._ck++);
    const on = tm[1] === 'x' || !!store.ck[key];
    return '<label class="ck"><input type="checkbox" data-ck="' + key + '"' + (on ? ' checked' : '') + '><span>' + inline(esc(tm[2])) + '</span></label>';
  }
  return inline(esc(txt));
}
function listHtml(items, f) {
  const root = { kids: [] }; const st = [{ ind: -1, node: root }];
  for (const it of items) {
    const n = { it, kids: [] };
    while (st[st.length - 1].ind >= it.ind) st.pop();
    st[st.length - 1].node.kids.push(n); st.push({ ind: it.ind, node: n });
  }
  function rec(n) {
    if (!n.kids.length) return '';
    const ord = n.kids[0].it.ord;
    let s = ord ? '<ol>' : '<ul>';
    for (const k of n.kids) s += '<li>' + itemHtml(k.it.txt, f) + rec(k) + '</li>';

  }
  return rec(root);
}
function mdToHtml(md, f) {
  f._ck = 0;
  const lines = md.replace(/\r\n?/g, '\n').split('\n');
  const out = []; let i = 0;
  const blank = s => /^\s*$/.test(s);
  const blockStart = /^\s*(#{1,4}\s|```|>|\||\s*[-*]\s|\s*\d+\.\s)/;
  while (i < lines.length) {
    const ln = lines[i];
    if (/^\s*```/.test(ln)) {
      const lang = (ln.match(/^\s*```(\S*)/) || [])[1] || '';
      i++; const buf = [];
      while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++;
      if (lang === 'mermaid') {
        out.push('<div class="mermaidbox"><div class="mermaidbox-h">📈 流程图（mermaid 源码，粘贴到 GitHub / typora 可直接渲染）</div><pre class="code"><code>' + esc(buf.join('\n')) + '</code></pre></div>');
      } else {
        out.push('<pre class="code"' + (lang ? ' data-lang="' + esc(lang) + '"' : '') + '><code>' + esc(buf.join('\n')) + '</code></pre>');
      }
      continue;
    }
    const hm = ln.match(/^(#{1,4})\s+(.*)$/);
    if (hm) { out.push('<h' + hm[1].length + '>' + inline(esc(hm[2])) + '</h' + hm[1].length + '>'); i++; continue; }
    if (/^\s*(---+|\*\*\*+)\s*$/.test(ln)) { out.push('<hr>'); i++; continue; }
    if (ln.includes('|') && i + 1 < lines.length && lines[i + 1].includes('-') && /^\s*\|?[\s:|-]+$/.test(lines[i + 1])) {
      const row = r => r.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(c => c.trim());
      const head = row(ln); i += 2; const rows = [];
      while (i < lines.length && lines[i].includes('|') && !blank(lines[i])) { rows.push(row(lines[i])); i++; }
      out.push('<div class="twrap"><table><thead><tr>' + head.map(c => '<th>' + inline(esc(c)) + '</th>').join('') + '</tr></thead><tbody>'
        + rows.map(r => '<tr>' + r.map(c => '<td>' + inline(esc(c)) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>');
      continue;
    }
    if (/^\s*>/.test(ln)) {
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) { buf.push(lines[i].replace(/^\s*>\s?/, '')); i++; }
      out.push('<blockquote>' + buf.map(s => blank(s) ? '' : '<p>' + inline(esc(s)) + '</p>').join('') + '</blockquote>');
      continue;
    }
    const lm = ln.match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
    if (lm) {
      const items = [{ ind: lm[1].length, ord: /\d/.test(lm[2]), txt: lm[3] }];
      i++;
      while (i < lines.length) {
        const m2 = lines[i].match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
        if (m2) { items.push({ ind: m2[1].length, ord: /\d/.test(m2[2]), txt: m2[3] }); i++; }
        else if (!blank(lines[i]) && /^\s{2,}\S/.test(lines[i]) && !blockStart.test(lines[i])) { items[items.length - 1].txt += '<br>' + lines[i].trim(); i++; }
        else if (blank(lines[i]) && i + 1 < lines.length && /^(\s*)([-*]|\d+\.)\s+/.test(lines[i + 1])) { i++; }
        else break;
      }
      out.push(listHtml(items, f));
      continue;
    }
    if (blank(ln)) { i++; continue; }
    const buf = [];
    while (i < lines.length && !blank(lines[i]) && !blockStart.test(lines[i])) { buf.push(lines[i].trim()); i++; }
    out.push('<p>' + buf.map(s => inline(esc(s))).join('<br>') + '</p>');
  }
  return out.join('\n');
}

function highlightAll(root, q) {
  if (!q) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  const escRe = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp(escRe, 'gi');
  let first = null;
  for (const n of nodes) {
    if (n.parentElement.closest('pre, code, script, mark, input')) continue;
    if (!re.test(n.nodeValue)) continue;
    re.lastIndex = 0;
    const frag = document.createDocumentFragment(); let last = 0, m;
    const text = n.nodeValue;
    while ((m = re.exec(text))) {
      frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      const mk = document.createElement('mark'); mk.textContent = m[0]; frag.appendChild(mk);
      if (!first) first = mk;
      last = m.index + m[0].length;
      if (m[0].length === 0) re.lastIndex++;
    }
    frag.appendChild(document.createTextNode(text.slice(last)));
    n.parentNode.replaceChild(frag, n);
  }
  if (first) setTimeout(() => first.scrollIntoView({ block: 'center', behavior: 'smooth' }), 60);
}

function goWeakCat(c) { window.__pendingCat = c; location.hash = '#/quiz'; }
function quizFilter(patch) {

  renderQuiz();
}
function quizRestart() { Object.assign(quizSession, { i: 0, revealed: false, sel: -1, vals: [], round: { done: 0, right: 0 } }); renderQuiz(); }
function quizNext() { quizSession.i++; quizSession.revealed = false; quizSession.sel = -1; quizSession.vals = []; renderQuiz(); }

  for (let k = 0; k < n; k++) {

    s.blankOk.push(alts.some(a => QNORM(a) === QNORM(v)));
  }
  s.revealed = true;
  recordQuiz(q, s.blankOk.every(Boolean));
  renderQuiz();

    const inp = document.querySelector('.blankin');
    if (inp) inp.focus();
  }
}

  let md = '# 错题本（' + new Date().toLocaleDateString() + '，共 ' + wrong.length + ' 题）\n\n';
  wrong.forEach(q => {
    md += '## [' + q.cat + '·' + q.diff + '] ' + q.q + '\n';
    if (q.kind === 'select') { q.opts.forEach((o, k) => md += '- ' + 'ABCD'[k] + '. ' + o + '\n'); md += '\n正确答案：' + q.a + '\n'; }
    else md += '\n正确答案：' + q.alts.map(a => a.join('／')).join('；') + '\n';
    md += '解析：' + q.exp.replace(/\[《([^》]+)》\]\(#[^)]+\)/g, '《$1》') + '\n\n';

  if (navigator.clipboard && navigator.clipboard.writeText) {

/* ---------- 综合大考 ---------- */
let examSession = null, examTimer = null;

      + '<div class="chips" style="justify-content:center;margin:0">'
      + ['all', '易', '中', '难'].map(d => '<span class="chip ' + (examSetup.diff === d ? 'on' : '') + '" onclick="examSetup.diff=\'' + d + '\';renderExam()">' + (d === 'all' ? '全部难度' : d + '题') + '</span>').join('') + '</div>'

    }).length;
    const dots = s.order.map((x, k) => {
      const a = s.answers[x.id];
      const has = a !== undefined && a !== null && !(Array.isArray(a) && a.every(v => !v));
      return '<div class="exdot' + (has ? ' answered' : '') + (k === s.i ? ' cur' : '') + '" onclick="examGo(' + k + ')">' + (k + 1) + '</div>';

    } else {
      const segs = q.q.split(/＿{2,}/);

        + (k < segs.length - 1 ? '<input class="blankin" data-k="' + k + '" value="' + esc(cur[k] || '') + '" oninput="examSetBlank(this)" placeholder="填空' + (k + 1) + '">' : '')).join('');
      body = '<div class="qstem">' + stem + '</div><div class="hint" style="margin-top:14px">作答会自动保存，切题不丢失</div>';

        : '<div style="font-size:12.5px;color:var(--muted)">正确答案：' + esc(q.alts.map(a => a.join('／')).join('；')) + '</div>')

    + '<div style="margin-top:14px">' + list + '</div></div>';

function startExam(n) {
  if (examTimer) clearInterval(examTimer);
  const pool = (DATA.quiz || []).filter(q => (examSetup.cat === 'all' || q.cat === examSetup.cat) && (examSetup.diff === 'all' || q.diff === examSetup.diff));
  const order = shuffledArr(pool).slice(0, Math.min(n, pool.length));
  examSession = { phase: 'run', order, i: 0, answers: {}, result: {}, deadline: Date.now() + order.length * 60000, startTs: Date.now(), usedMs: 0 };
  examTimer = setInterval(examTick, 500);
  renderExam();
}
function examTick() {
  const s = examSession;
  if (!s || s.phase !== 'run') return;
  const el = document.getElementById('examTimer');
  if (el) {
    const left = s.deadline - Date.now();
    el.textContent = fmtMs(left);
    el.classList.toggle('low', left < 60000);
  }
  if (Date.now() >= s.deadline) submitExam(true);
}
function examGo(k) { const s = examSession; if (!s || k < 0 || k >= s.order.length) return; s.i = k; renderExam(); }
function examPick(k) { const s = examSession, q = s.order[s.i]; if (q.kind !== 'select') return; s.answers[q.id] = 'ABCD'[k]; renderExam(); }
function examSetBlank(inp) {
  const s = examSession, q = s.order[s.i];
  const k = +inp.dataset.k;
  const cur = s.answers[q.id] || [];
  cur[k] = inp.value;
  s.answers[q.id] = cur;   // 不重渲染，避免输入焦点丢失
}
function examQuit() {
  if (confirm('放弃本次大考？作答将不计入记录。')) {

  }
}
function submitExam(auto) {

  if (!s || s.phase !== 'run') return;
  if (!auto && !confirm('确认交卷？未作答的题按错误计。')) return;
  if (examTimer) clearInterval(examTimer);
  s.usedMs = Date.now() - s.startTs; s.phase = 'done';
  s.order.forEach(q => {
    let ok;
    if (q.kind === 'select') ok = s.answers[q.id] === q.a;
    else {
      const n = q.q.split(/＿{2,}/).length - 1;
      const vals = s.answers[q.id] || [];
      ok = [];
      for (let k = 0; k < n; k++) ok.push((q.alts[k] || []).some(a => QNORM(a) === QNORM(vals[k] || '')));
      ok = ok.every(Boolean);
    }
    s.result[q.id] = ok;
    recordQuiz(q, ok);
  });
  if (location.hash.startsWith('#/exam') || auto) renderExam();
}

/* ---------- 导入导出 / 主题 / 事件 ---------- */
function openOverlay(title, text, onOk) {
  $('#ovTitle').textContent = title; $('#ovText').value = text || '';
  $('#overlay').style.display = 'flex';
  $('#ovOk').onclick = () => { if (onOk($('#ovText').value)) $('#overlay').style.display = 'none'; };
  $('#ovCancel').onclick = () => $('#overlay').style.display = 'none';
}
$('#expBtn').onclick = () => openOverlay('导出进度（复制保存）', JSON.stringify(store), () => true);
$('#impBtn').onclick = () => openOverlay('导入进度（粘贴 JSON）', '', t => {
  try { const s = JSON.parse(t); if (typeof s !== 'object') throw 0; store = s; store.ck = store.ck || {}; store.done = store.done || {}; store.cards = store.cards || {}; store.quiz = store.quiz || {}; save(); location.reload(); return true; }
  catch (e) { alert('JSON 解析失败，请检查内容'); return false; }
});
$('#resetBtn').onclick = () => { if (confirm('确定清空所有打卡与学习进度？')) { store = { ck: {}, done: {}, cards: {}, quiz: {}, theme: store.theme, last: null }; save(); location.reload(); } };
$('#themeBtn').onclick = () => {
  store.theme = store.theme === 'dark' ? 'light' : 'dark'; save();
  document.documentElement.dataset.theme = store.theme;
  $('#themeBtn').textContent = store.theme === 'dark' ? '☀️' : '🌙';
};
$('#burger').onclick = () => $('#sidebar').classList.toggle('open');
$('#searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') { location.hash = '#/search/' + encodeURIComponent(e.target.value.trim()); }
});
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement.tagName !== 'TEXTAREA' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); $('#searchInput').focus(); }
  if (e.key === 'Escape') { $('#overlay').style.display = 'none'; $('#sidebar').classList.remove('open'); }
  if (e.key === 'Enter' && e.target && e.target.classList && e.target.classList.contains('blankin')) { e.preventDefault(); submitBlanks(); }
  const tg = document.activeElement ? document.activeElement.tagName : '';
  if (tg === 'INPUT' || tg === 'TEXTAREA') return;
  const h = location.hash || '#/home';
  if (h.startsWith('#/f/')) {
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      const id = decodeURIComponent(h.slice(4));
      const idx = DATA.files.findIndex(f => f.id === id);
      const nb = DATA.files[idx + (e.key === 'ArrowRight' ? 1 : -1)];
      if (nb) { e.preventDefault(); goto(nb.id); }
    }
  } else if (h.startsWith('#/cards')) {
    if (e.key === ' ') { e.preventDefault(); cardSession.revealed = !cardSession.revealed; renderCards(); }
    else if (e.key === '1' && cardSession.revealed) grade('known');
    else if (e.key === '2' && cardSession.revealed) grade('review');
  } else if (h.startsWith('#/quiz')) {
    const s = quizSession;
    if (!s || !s.pool || s.i >= s.pool.length) return;
    const q = s.pool[s.i];
    if (!s.revealed && q.kind === 'select' && /^[1-4]$/.test(e.key)) { e.preventDefault(); pickOpt(+e.key - 1); }
    else if (s.revealed && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); quizNext(); }
  } else if (h.startsWith('#/exam')) {
    const s = examSession;
    if (!s || s.phase !== 'run') return;
    const q = s.order[s.i];
    if (q.kind === 'select' && /^[1-4]$/.test(e.key)) { e.preventDefault(); examPick(+e.key - 1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); examGo(s.i + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); examGo(s.i - 1); }
    else if (e.key === 'e' || e.key === 'E') { e.preventDefault(); submitExam(); }
  }
});
document.addEventListener('change', e => {
  if (e.target.dataset && e.target.dataset.ck) {
    if (e.target.checked) store.ck[e.target.dataset.ck] = 1; else delete store.ck[e.target.dataset.ck];
    save(); updateBars();
  }
});
window.addEventListener('hashchange', route);

/* ---------- 启动 ---------- */
document.documentElement.dataset.theme = store.theme;
$('#themeBtn').textContent = store.theme === 'dark' ? '☀️' : '🌙';
buildSidebar();
route();
updateBars();
if (innerWidth > 920) document.querySelector('.stage')?.classList.add('open');
</script>
</body>
</html>
