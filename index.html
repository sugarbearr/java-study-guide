/f/f21)\n- [ ] **Q：SpringMVC 的执行流程？** —— 请求到 DispatcherServlet → HandlerMapping 找处理器 → HandlerAdapter 调用 Controller → 返回视图渲染 ｜ 详见[《Spring核心》](#/f/f21)\n- [ ] **Q：SpringBoot 自动配置原理？** —— @EnableAutoConfiguration 读取 AutoConfiguration.imports 文件，配合 @ConditionalOnClass 等条件注解按需装配 ｜ 详见[《SpringBoot实战》](#/f/f22)\n- [ ] **Q：starter 是什么？** —— 依赖聚合 + 自动配置的封装，引入即用；自定义 starter = 自动配置模块 + starter 空壳依赖 ｜ 详见[《SpringBoot实战》](#/f/f22)\n- [ ] **Q：@Autowired 和 @Resource 的区别？** —— @Autowired 是 Spring 的，先按类型后按名称；@Resource 是 JSR-250 的，先按名称后按类型 ｜ 详见[《SpringBoot实战》](#/f/f22)\n- [ ] **Q：@ConfigurationProperties 与 @Value 怎么选？** —— 前者批量绑定前缀配置、类型安全、支持校验；后者适合单个值，支持 SpEL ｜ 详见[《SpringBoot实战》](#/f/f22)\n- [ ] **Q：@Configuration 与 @Component 的区别？** —— @Configuration 类被 CGLIB 代理，@Bean 方法互调仍走容器保证单例；@Component 下互调会 new 新对象 ｜ 详见[《Spring核心》](#/f/f21)\n- [ ] **Q：BeanFactory 和 FactoryBean 的区别？** —— BeanFactory 是容器顶层接口；FactoryBean 是\"生产 Bean 的 Bean\"，用于封装复杂对象的构建（如 SqlSessionFactoryBean）｜ 详见[《Spring核心》](#/f/f21)\n\n### MyBatis（8 题）\n\n> 面试形式：题量少但 #{} vs ${} 与 Mapper 动态代理几乎必问，答好后会转向 MyBatis-Plus 与分页等使用细节。\n\n- [ ] **Q：#{} 和 ${} 的区别？** —— #{} 是预编译占位符防 SQL 注入；${} 是字符串拼接，只用于动态表名/列名等受控场景 ｜ 详见[《MyBatis》](#/f/f23)\n- [ ] **Q：一级缓存与二级缓存？** —— 一级是 SqlSession 级默认开启；二级是 namespace 级需手动开启，跨会话共享，分布式下易脏读生产慎用 ｜ 详见[《MyBatis》](#/f/f23)\n- [ ] **Q：Mapper 接口没有实现类为什么能执行 SQL？** —— JDK 动态代理 MapperProxy 拦截方法调用，接口全限定名+方法名映射到 XML 的 statement id ｜ 详见[《MyBatis》](#/f/f23)\n- [ ] **Q：常用动态 SQL 标签？** —— if/where/choose/when/otherwise/set/foreach/trim，用于条件拼接与批量插入 ｜ 详见[《MyBatis》](#/f/f23)\n- [ ] **Q：resultMap 什么时候用？** —— 列名与属性名不一致、一对一/一对多关联映射、自定义类型转换时使用 ｜ 详见[《MyBatis》](#/f/f23)\n- [ ] **Q：MyBatis 的分页方案？** —— RowBounds 是内存逻辑分页（全查再截取，有 OOM 风险）；生产用 PageHelper 物理分页（改写 SQL 加 LIMIT）｜ 详见[《MyBatis》](#/f/f23)\n- [ ] **Q：MyBatis-Plus 有哪些特性？** —— BaseMapper 通用 CRUD、Wrapper 条件构造器、分页/乐观锁插件、自动填充、代码生成器 ｜ 详见[《MyBatis》](#/f/f23)\n- [ ] **Q：MyBatis 和 JPA 怎么选？** —— SQL 需要精细控制、复杂查询多选 MyBatis（国内主流）；标准 CRUD 快速开发选 JPA/Hibernate ｜ 详见[《MyBatis》](#/f/f23)\n\n## 🔗 深入学习资料\n\n| 资料 | 说明 | 链接 |\n| --- | --- | --- |\n| JavaGuide Java 基础面试题（系列共 3 篇） | 基础题的完整版答案与追问 | https://javaguide.cn/java/basis/java-basic-questions-01.html |\n| JavaGuide 集合面试题（系列共 3 篇） | HashMap/ConcurrentHashMap 深挖 | https://javaguide.cn/java/collection/java-collection-questions-01.html |\n| JavaGuide 并发面试题（系列共 3 篇） | 线程池/AQS/volatile 逐层追问 | https://javaguide.cn/java/concurrent/java-concurrent-questions-01.html |\n| JavaGuide JVM 面试题 | 内存区域、GC、类加载完整版 | https://javaguide.cn/java/jvm/jvm-interview-questions.html |\n| JavaGuide Spring 常见问题 | 事务、循环依赖、AOP 深挖 | https://javaguide.cn/system-design/framework/spring/spring-knowledge-and-questions-summary.html |\n| JavaGuide MyBatis 面试题 | 缓存、Mapper 原理完整版 | https://javaguide.cn/system-design/framework/mybatis/mybatis-interview.html |\n| JavaGuide 面试突击版 | 冲刺期快速过题的浓缩版 | https://interview.javaguide.cn/home.html |\n| pdai 面试知识体系 | 按专题组织的 Java 面试题库 | https://pdai.tech/md/interview/x-interview.html |\n","ck":93},{"id":"f28","stage":7,"path":"07-面试篇/02-数据库与中间件面试速查.md","title":"02-数据库与中间件面试速查","md":"# 02-数据库与中间件面试速查\n\n> **阶段**：面试篇 ｜ **用法**：遮住答案自测，能独立说出 3 条以上要点再打勾；冲刺期每天过一遍\n\n## 使用说明\n\n- 格式：`- [ ] **Q：xxx？** —— 一句话核心答案 ｜ 详见《对应指南文件名》`；一句话只是提醒，打勾标准是**能展开说 3 条以上要点**；\n- 本文件覆盖数据库、中间件、网络、操作系统四大块——它们与 Java 八股共同构成一面/二面的主力题源；\n- 先看下方\"板块频率与追问链速览\"排优先级：MySQL 与 Redis 出现频率最高，建议每天至少各过一遍；\n- MQ 按\"作用 → 可靠性 → 不丢不重\"一条线连着记，别孤立背每个组件的特性；\n- 网络与操作系统偏\"概念 + 排查\"：三次握手、epoll、零拷贝要与 IO 模型篇对照着理解，不要死背；\n- 本清单与[《01-Java高频八股速查》](#/f/f27)交替着过，避免同一板块刷久了疲劳效率下降；\n- 场景类题目（分库分表、秒杀、限流）的完整设计思路见[《02-高并发系统设计》](#/f/f26)。\n\n## 📊 板块频率与追问链速览\n\n| 板块 | 出现频率 | 典型追问链 |\n| --- | --- | --- |\n| MySQL | ⭐⭐⭐⭐⭐ | 索引结构 → 回表/覆盖 → 失效场景 → explain → 事务/MVCC → 三大日志 → 分库分表 |\n| Redis | ⭐⭐⭐⭐⭐ | 数据类型 → 持久化 → 缓存三问题 → 一致性 → 分布式锁 → 主从/哨兵/集群 |\n| 消息队列 | ⭐⭐⭐⭐ | 为什么用 → 不丢消息 → 不重复（幂等）→ 顺序 → 三大 MQ 选型 |\n| ES/ZK/Nacos | ⭐⭐⭐ | 倒排索引 → 与 MySQL 分工 → 数据同步；ZK Watcher/锁；Nacos AP/CP |\n| 网络 | ⭐⭐⭐⭐ | 握手挥手 → HTTPS → epoll → HTTP 方法/状态码 → 粘包 |\n| 操作系统 | ⭐⭐ | 进程线程 → 死锁 → 虚拟内存 → 零拷贝/IO 多路复用 |\n\n## 📋 自测清单\n\n### MySQL（20 题）\n\n> 面试形式：必考板块，从一道索引题出发能连追问十分钟；\"你项目里加过什么索引、为什么\"是标准衔接。\n\n- [ ] **Q：为什么用 B+ 树而不是 B 树/哈希/红黑树？** —— 矮胖 3 层可存千万级数据、叶子链表支持范围查询；哈希不支持范围，红黑树/AVL 树太高 IO 次数多 ｜ 详见[《索引-事务-锁与调优》](#/f/f12)\n- [ ] **Q：聚簇索引与二级索引的区别？** —— 聚簇索引叶子存整行数据（InnoDB 必有，默认主键），二级索引叶子存主键值 ｜ 详见[《索引-事务-锁与调优》](#/f/f12)\n- [ ] **Q：什么是回表？** —— 用二级索引只拿到主键，还要回聚簇索引再查一次整行；查询列都在索引里则免回表 ｜ 详见[《索引-事务-锁与调优》](#/f/f12)\n- [ ] **Q：什么是覆盖索引？** —— 查询所需列全部包含在索引中，无需回表；是\"只查需要的列\"与联合索引设计的核心依据 ｜ 详见[《索引-事务-锁与调优》](#/f/f12)\n- [ ] **Q：最左前缀原则？** —— 联合索引 (a,b,c) 必须从 a 开始连续命中才走索引，遇到范围查询后索引列失效 ｜ 详见[《索引-事务-锁与调优》](#/f/f12)\n- [ ] **Q：索引失效的常见场景？** —— 索引列上函数/运算、隐式类型转换、前导 % 模糊、or 连接非索引列、违反最左前缀、优化器认为全表更快 ｜ 详见[《索引-事务-锁与调优》](#/f/f12)\n- [ ] **Q：explain 主要看哪些字段？** —— type（至少 range，理想 ref/const）、key（实际用的索引）、rows（预估扫描行数）、Extra（出现 Using filesort/Using temporary 要优化）｜ 详见[《索引-事务-锁与调优》](#/f/f12)\n- [ ] **Q：ACID 分别靠什么实现？** —— 原子性靠 undo log、持久性靠 redo log、隔离性靠锁+MVCC、一致性是前三者共同保障的结果 ｜ 详见[《索引-事务-锁与调优》](#/f/f12)\n- [ ] **Q：四种隔离级别？** —— 读未提交 → 读已提交（解决脏读）→ 可重复读（InnoDB 默认，解决不可重复读）→ 串行化；InnoDB 的 RR 用 MVCC+间隙锁基本杜绝幻读 ｜ 详见[《索引-事务-锁与调优》](#/f/f12)\n- [ ] **Q：MVCC 的原理？** —— 隐藏字段 trx_id/roll_pointer + undo log 版本链 + ReadView 可见性判断；RC 每次查询生成 ReadView，RR 事务内复用第一次的 ｜ 详见[《索引-事务-锁与调优》](#/f/f12)\n- [ ] **Q：三大日志的作用？** —— redo log 保证崩溃恢复（WAL、循环写）、undo log 支持回滚与 MVCC、binlog 用于主从复制与数据恢复（Server 层、追加写）｜ 详见[《索引-事务-锁与调优》](#/f/f12)\n- [ ] **Q：redo log 和 binlog 的区别？** —— 层级（InnoDB vs Server）、形态（循环写 vs 追加写）、用途（崩溃恢复 vs 复制/恢复）都不同；两阶段提交保证两者一致 ｜ 详见[《索引-事务-锁与调优》](#/f/f12)\n- [ ] **Q：InnoDB 有哪些锁？** —— 行锁（记录锁/间隙锁/临键锁）、表锁、意向锁；行锁是加在索引上的，无索引条件更新会升级为全表扫描锁住大量记录 ｜ 详见[《索引-事务-锁与调优》](#/f/f12)\n- [ ] **Q：慢 SQL 怎么排查优化？** —— 慢查询日志定位 → explain 分析执行计划 → 优化索引/改写 SQL/覆盖索引 → 数据量太大再考虑分库分表 ｜ 详见[《索引-事务-锁与调优》](#/f/f12)\n- [ ] **Q：分库分表怎么拆？** —— 先垂直（按业务拆库、大字段拆表）再水平（按分片键散列行）；分片键要满足高频查询条件且分布均匀 ｜ 详见[《索引-事务-锁与调优》](#/f/f12)\n- [ ] **Q：分库分表带来哪些问题？** —— 跨片 join/分页/聚合困难、跨库事务、全局唯一 ID、扩容数据迁移；能用缓存/ES 撑住就别急着拆 ｜ 详见[《02-高并发系统设计》](#/f/f26)\n- [ ] **Q：深分页怎么优化？** —— `LIMIT 1000000,10` 要扫描并丢弃前 100 万行；改成游标（WHERE id > 上次最大值）、子查询先定位 id、或覆盖索引 ｜ 详见[《索引-事务-锁与调优》](#/f/f12)\n- [ ] **Q：inner join / left join / right join 的区别？** —— inner 取两表交集；left 保留左表全部行、右表无匹配补 NULL；right 相反 ｜ 详见[《MySQL基础与SQL实战》](#/f/f11)\n- [ ] **Q：char 与 varchar 的区别？** —— char 定长、空间换性能、适合定长数据（手机号/MD5）；varchar 变长、多 1~2 字节长度头，按实际长度存储 ｜ 详见[《MySQL基础与SQL实战》](#/f/f11)\n- [ ] **Q：drop、delete、truncate 的区别？** —— drop 删表结构与数据；delete 逐行删、可回滚、可带 where；truncate 清空全表重置自增，属 DDL 不可回滚 ｜ 详见[《MySQL基础与SQL实战》](#/f/f11)\n\n### Redis（15 题）\n\n> 面试形式：与 MySQL 并列的必考板块；缓存三问题 + 一致性 + 分布式锁是固定三连，答好了会追问集群。\n\n- [ ] **Q：Redis 为什么快？** —— 纯内存操作 + 命令执行单线程（无锁无切换）+ epoll IO 多路复用 + 针对场景优化的数据结构 ｜ 详见[《01-Redis》](#/f/f13)\n- [ ] **Q：五种基本类型与使用场景？** —— String 缓存/计数/分布式锁，Hash 对象属性，List 队列/时间线，Set 去重/抽奖/交并集，ZSet 排行榜/延迟队列 ｜ 详见[《01-Redis》](#/f/f13)\n- [ ] **Q：RDB 与 AOF 怎么选？** —— RDB 快照恢复快、可能丢最后一次快照后的数据；AOF 追加日志丢得少但文件大；4.0 混合持久化（RDB 底座+AOF 增量）兼得 ｜ 详见[《01-Redis》](#/f/f13)\n- [ ] **Q：过期删除策略？** —— 惰性删除（访问时检查）+ 定期删除（随机抽检）组合，内存超限再触发淘汰策略 ｜ 详见[《01-Redis》](#/f/f13)\n- [ ] **Q：内存淘汰策略？** —— 默认 noeviction 写报错；缓存场景用 allkeys-lru，含过期集合维度有 volatile-lru/lfu 等 8 种 ｜ 详见[《01-Redis》](#/f/f13)\n- [ ] **Q：缓存穿透及解决？** —— 查询**不存在**的数据每次都打穿到 DB；空值缓存、布隆过滤器、入口参数校验 ｜ 详见[《01-Redis》](#/f/f13)\n- [ ] **Q：缓存击穿及解决？** —— 单个**热点 key 过期瞬间**大量请求直击 DB；互斥锁重建、逻辑过期不删 key、热点数据不过期 ｜ 详见[《01-Redis》](#/f/f13)\n- [ ] **Q：缓存雪崩及解决？** —— **大量 key 同时失效**或 Redis 宕机；TTL 加随机值、多级缓存、集群高可用、限流降级兜底 ｜ 详见[《01-Redis》](#/f/f13)\n- [ ] **Q：缓存与数据库一致性？** —— Cache Aside 先更新 DB 再删除缓存 + 失败重试；要求更高用延迟双删；终极方案 canal 订阅 binlog 异步删缓存 ｜ 详见[《01-Redis》](#/f/f13)\n- [ ] **Q：用 Redis 写分布式锁要注意什么？** —— `SET key uniqueValue NX EX` 原子加锁；value 存唯一标识防误删；解锁用 Lua 校验后删除 ｜ 详见[《01-Redis》](#/f/f13)\n- [ ] **Q：Redisson 分布式锁的原理？** —— Lua 加解锁 + Hash 结构记录持有线程与重入次数；看门狗默认 30 秒锁、每 10 秒续期，解决业务超时锁先过期 ｜ 详见[《01-Redis》](#/f/f13)\n- [ ] **Q：主从复制的流程？** —— 首次全量同步（主库生成 RDB 传给从库）+ 复制缓冲区增量，之后命令异步传播；读写分离依赖它 ｜ 详见[《01-Redis》](#/f/f13)\n- [ ] **Q：哨兵的作用？** —— 监控主库、通知运维、自动故障转移（选新主）、充当配置中心；至少 3 个哨兵节点防止误判与脑裂 ｜ 详见[《01-Redis》](#/f/f13)\n- [ ] **Q：Cluster 集群的原理？** —— 16384 个槽位按 CRC16 分片到各主节点，客户端请求错位收 MOVED 重定向；gossip 协议通信，主从自动切换 ｜ 详见[《01-Redis》](#/f/f13)\n- [ ] **Q：大 key 与热 key 怎么处理？** —— 大 key：拆分成多个 key、用 UNLINK 异步删除、避免集合过大；热 key：本地缓存兜底、副本打散、限流 ｜ 详见[《01-Redis》](#/f/f13)\n\n### 消息队列（12 题）\n\n> 面试形式：围绕\"不丢消息、不重复消费、保证顺序\"三问展开，项目里用过 MQ 才答得出体感。\n\n- [ ] **Q：消息队列的三大作用？** —— 异步（缩短响应时间）、解耦（生产者消费者互不依赖）、削峰（洪峰进队列匀速消费）｜ 详见[《02-RabbitMQ》](#/f/f14)\n- [ ] **Q：RabbitMQ 的四种交换机？** —— direct 精确匹配、fanout 广播、topic 通配符匹配、headers 按头部匹配；业务路由多用 topic ｜ 详见[《02-RabbitMQ》](#/f/f14)\n- [ ] **Q：RabbitMQ 如何保证消息不丢？** —— 三段：生产者 confirm 确认、交换机/队列/消息持久化、消费者手动 ack，任一环节失败可重发 ｜ 详见[《02-RabbitMQ》](#/f/f14)\n- [ ] **Q：死信队列是什么？** —— 消息被拒绝/过期/队列满时路由到 DLX；用途是异常消息兜底，以及 TTL+死信实现延迟队列 ｜ 详见[《02-RabbitMQ》](#/f/f14)\n- [ ] **Q：Kafka 为什么快？** —— 顺序写磁盘+页缓存、零拷贝 sendfile、批量发送与压缩、分区并行消费 ｜ 详见[《03-Kafka》](#/f/f15)\n- [ ] **Q：Kafka 的 ACK 机制？** —— 0 不等待、1 主分区落盘即确认、all（-1）等 ISR 全部确认；可靠性要求高用 all + retries ｜ 详见[《03-Kafka》](#/f/f15)\n- [ ] **Q：ISR 是什么？** —— 与 leader 保持同步的副本集合（含 leader），落后超过阈值被踢出；all ACK 只等 ISR 成员，兼顾可靠与性能 ｜ 详见[《03-Kafka》](#/f/f15)\n- [ ] **Q：消费组与 rebalance？** —— 组内消费者分摊分区且一个分区只归一个消费者；成员增减触发重平衡，期间会停止消费且可能重复消费 ｜ 详见[《03-Kafka》](#/f/f15)\n- [ ] **Q：Kafka 怎么保证消息顺序？** —— 只保证分区内有序；需要顺序的业务按 key 路由到同一分区，消费端单线程处理该分区 ｜ 详见[《03-Kafka》](#/f/f15)\n- [ ] **Q：RocketMQ 事务消息的原理？** —— 半消息（消费者不可见）→ 执行本地事务 → 提交/回滚半消息；Broker 定时回查事务状态兜底 ｜ 详见[《04-RocketMQ》](#/f/f16)\n- [ ] **Q：重复消费怎么办（幂等）？** —— MQ 是至少一次投递，重复不可避免；消费端用唯一业务键 + 去重表/Redis SETNX/状态机校验实现幂等 ｜ 详见[《04-RocketMQ》](#/f/f16)\n- [ ] **Q：RabbitMQ/Kafka/RocketMQ 怎么选型？** —— RabbitMQ 低延迟、功能全、适合中小业务；Kafka 吞吐王、适合日志与大数据；RocketMQ 电商业务（事务/延迟/顺序消息全支持）｜ 详见[《04-RocketMQ》](#/f/f16)\n\n### Elasticsearch/ZooKeeper/Nacos（12 题）\n\n> 面试形式：ES 问倒排索引与和 MySQL 的分工；ZK/Nacos 问 AP/CP 与服务发现原理，JD 提到才深挖。\n\n- [ ] **Q：什么是倒排索引？** —— 分词后建立\"词项 → 文档列表\"的映射，查询按词直达文档，FST 结构压缩词典，这是全文检索快的根本 ｜ 详见[《05-Elasticsearch》](#/f/f17)\n- [ ] **Q：ES 和 MySQL 的分工？** —— MySQL 是事务主存（写入源），ES 做检索与聚合的查询副本；各司其职而非互相替代 ｜ 详见[《05-Elasticsearch》](#/f/f17)\n- [ ] **Q：match 与 term 的区别？** —— match 对查询词分词后做全文匹配打分；term 不分词做精确匹配；bool 组合 must/should/filter（filter 不算分且可缓存）｜ 详见[《05-Elasticsearch》](#/f/f17)\n- [ ] **Q：ES 的深分页问题？** —— from+size 每个分片都要取 from+size 条排序，默认限制 1 万；翻页深用 search_after 游标，全量导出用 scroll ｜ 详见[《05-Elasticsearch》](#/f/f17)\n- [ ] **Q：text 和 keyword 类型的区别？** —— text 分词、参与相关性打分，用于全文搜索；keyword 不分词、整体匹配，用于精确过滤与聚合排序 ｜ 详见[《05-Elasticsearch》](#/f/f17)\n- [ ] **Q：MySQL 数据怎么同步到 ES？** —— 主流用 canal 监听 binlog → 发 MQ → 消费写入 ES，解耦且不侵入业务；代码双写是简易方案但有一致性风险 ｜ 详见[《05-Elasticsearch》](#/f/f17)\n- [ ] **Q：ZooKeeper 的应用场景？** —— 分布式锁、注册中心、配置中心、Master 选举；本质是基于\"文件系统 + Watcher\"的协调服务 ｜ 详见[《06-ZooKeeper与Nacos》](#/f/f18)\n- [ ] **Q：Watcher 机制的特点？** —— 一次性触发（触发后需重新注册）、轻量（只推事件类型不推数据）、顺序性（客户端先收到事件再看到新数据）｜ 详见[《06-ZooKeeper与Nacos》](#/f/f18)\n- [ ] **Q：临时节点与顺序节点？** —— 临时节点随会话断开自动删除（服务发现/锁的基石）；顺序节点由 ZK 追加序号保证全局有序（锁排队）｜ 详见[《06-ZooKeeper与Nacos》](#/f/f18)\n- [ ] **Q：ZAB 协议做了什么？** —— 崩溃恢复（按 zxid/epoch 选主）+ 消息广播（类似两阶段提交、过半即提交）；因此 ZK 是 CP 系统 ｜ 详见[《06-ZooKeeper与Nacos》](#/f/f18)\n- [ ] **Q：Nacos 的 AP 与 CP 怎么选？** —— 临时实例走 Distro 协议（AP，默认），持久实例与配置中心走 Raft（CP）；服务发现一般用 AP 保可用 ｜ 详见[《06-ZooKeeper与Nacos》](#/f/f18)\n- [ ] **Q：注册中心的服务发现原理？** —— 服务启动时注册地址 → 消费者订阅并拉取列表缓存本地 → 心跳续约剔除失效实例 → 变更推送更新本地缓存 ｜ 详见[《06-ZooKeeper与Nacos》](#/f/f18)\n\n### 网络（15 题）\n\n> 面试形式：一面的保留节目，三次握手/四次挥手与 HTTPS 是出现率最高的两道，常加\"从 URL 到页面\"综合题。\n\n- [ ] **Q：TCP 和 UDP 的区别？** —— TCP 面向连接、可靠字节流、有流量/拥塞控制；UDP 无连接、不可靠、报文小延迟低（DNS/视频/游戏）｜ 详见[《03-IO模型与网络编程》](#/f/f10)\n- [ ] **Q：为什么三次握手不是两次？** —— 确认双方收发能力都正常，并防止历史重复的 SYN 建立无效连接；两次会导致服务端白白维持半连接 ｜ 详见[《03-IO模型与网络编程》](#/f/f10)\n- [ ] **Q：四次挥手与 TIME_WAIT？** —— 双向各发 FIN+ACK；主动方最后等 2MSL：确保对端收到最后的 ACK、让旧报文在网络中消亡 ｜ 详见[《03-IO模型与网络编程》](#/f/f10)\n- [ ] **Q：TCP 如何保证可靠传输？** —— 序列号+确认应答、超时重传/快速重传、滑动窗口流量控制、拥塞控制（慢启动/拥塞避免/快恢复）｜ 详见[《03-IO模型与网络编程》](#/f/f10)\n- [ ] **Q：常见 HTTP 状态码？** —— 200 成功、301/302 重定向、304 缓存有效、400 参数错、401/403 未认证/无权限、404 不存在、500 服务器错、502/504 网关错误/超时 ｜ 详见[《03-IO模型与网络编程》](#/f/f10)\n- [ ] **Q：HTTP 方法的幂等性？** —— GET/PUT/DELETE 幂等（重复执行效果相同），POST 非幂等；幂等性影响重试设计 ｜ 详见[《03-IO模型与网络编程》](#/f/f10)\n- [ ] **Q：HTTPS 的握手与加密？** —— TCP 之后 TLS 协商套件 → 验证证书（防冒充）→ ECDHE 非对称交换出对称密钥 → 之后对称加密通信；混合加密兼顾安全与性能 ｜ 详见[《03-IO模型与网络编程》](#/f/f10)\n- [ ] **Q：GET 和 POST 的区别？** —— 语义：GET 获取（幂等、参数在 URL、可缓存）vs POST 提交（非幂等、参数在 body）；本质都是 TCP 报文，区别是约定 ｜ 详见[《03-IO模型与网络编程》](#/f/f10)\n- [ ] **Q：TCP 粘包拆包怎么解决？** —— TCP 是字节流没有消息边界；定长协议、分隔符、长度前缀（Netty LengthFieldBasedFrameDecoder）三种方案 ｜ 详见[《03-IO模型与网络编程》](#/f/f10)\n- [ ] **Q：select/poll/epoll 的区别？** —— select 有 1024 上限且每次全量拷贝轮询；poll 无上限仍轮询；epoll 红黑树管理 fd + 就绪链表回调，O(1) 只处理就绪的 ｜ 详见[《03-IO模型与网络编程》](#/f/f10)\n- [ ] **Q：Cookie/Session/Token 的区别？** —— Cookie 存客户端随请求携带；Session 存服务端（集群需共享）；Token（JWT）自包含无状态、天然适合分布式 ｜ 详见[《03-IO模型与网络编程》](#/f/f10)\n- [ ] **Q：JWT 的结构与校验？** —— Header.Payload.Signature，签名防篡改；服务端无状态验证签发方；缺点是无法主动失效（要配黑名单）｜ 详见[《03-IO模型与网络编程》](#/f/f10)\n- [ ] **Q：DNS 的解析过程？** —— 浏览器缓存 → 系统缓存 → 本地 DNS（递归）→ 根/顶级/权威服务器（迭代），最终拿到 IP 并缓存 ｜ 详见[《03-IO模型与网络编程》](#/f/f10)\n- [ ] **Q：HTTP/1.1、2、3 的演进？** —— 1.1 长连接但仍有队头阻塞；2 二进制分帧+多路复用解决 HTTP 层阻塞；3 基于 QUIC/UDP 彻底解决 TCP 层队头阻塞 ｜ 详见[《03-IO模型与网络编程》](#/f/f10)\n- [ ] **Q：从输入 URL 到页面展示发生了什么？** —— DNS 解析 → TCP 三次握手 → TLS 握手 → HTTP 请求 → 服务端处理返回 → 浏览器解析渲染，综合串讲题 ｜ 详见[《03-IO模型与网络编程》](#/f/f10)\n\n### 操作系统（8 题）\n\n> 面试形式：题少但与网络相通——死锁、IO 多路复用、零拷贝都会在并发与中间件话题里被顺手问到。\n\n- [ ] **Q：进程和线程的区别？** —— 进程是资源分配单位（独立地址空间），线程是 CPU 调度单位（共享进程堆与方法区，各自有栈）；线程切换成本更低 ｜ 详见[《03-IO模型与网络编程》](#/f/f10)\n- [ ] **Q：进程间通信方式？** —— 管道、消息队列、共享内存（最快）、信号量、Socket；线程间直接共享内存但要加锁同步 ｜ 详见[《03-IO模型与网络编程》](#/f/f10)\n- [ ] **Q：死锁的四个必要条件？** —— 互斥、请求与保持、不可剥夺、循环等待；破坏任意一个即可预防，工程上常用资源有序申请 ｜ 详见[《03-IO模型与网络编程》](#/f/f10)\n- [ ] **Q：什么是虚拟内存？** —— 每个进程独立的虚拟地址空间，经页表映射到物理内存，缺页中断按需加载；带来隔离与\"内存超售\"能力 ｜ 详见[《03-IO模型与网络编程》](#/f/f10)\n- [ ] **Q：用户态与内核态？** —— CPU 权限分级；系统调用/中断触发切换并保存上下文，切换有开销，频繁切换是性能杀手（如大量小 IO）｜ 详见[《03-IO模型与网络编程》](#/f/f10)\n- [ ] **Q：IO 多路复用是什么？** —— 一个线程同时监听多个 fd，内核告知就绪后才处理；select/poll/epoll 是三种实现，epoll 是高性能服务的标配 ｜ 详见[《03-IO模型与网络编程》](#/f/f10)\n- [ ] **Q：什么是零拷贝？** —— 数据不经过用户态来回拷贝（sendfile/mmap），减少 CPU 拷贝与上下文切换；Kafka、RocketMQ、Nginx 靠它提速 ｜ 详见[《03-IO模型与网络编程》](#/f/f10)\n- [ ] **Q：fork 是什么？写时复制？** —— Unix 创建子进程的系统调用；COW 让父子先共享物理页，任一方写入时才真正复制，降低创建成本 ｜ 详见[《03-IO模型与网络编程》](#/f/f10)\n\n## 🔗 深入学习资料\n\n| 资料 | 说明 | 链接 |\n| --- | --- | --- |\n| JavaGuide MySQL 面试题（系列） | 索引/事务/日志/锁的完整版答案 | https://javaguide.cn/database/mysql/mysql-questions-01.html |\n| JavaGuide Redis 面试题（系列） | 缓存问题与集群的完整版答案 | https://javaguide.cn/database/redis/redis-questions-01.html |\n| JavaGuide 消息队列入门 | MQ 基础概念与选型总览 | https://javaguide.cn/high-performance/message-queue/message-queue.html |\n| JavaGuide 读写分离与分库分表 | 分库分表场景题的完整展开 | https://javaguide.cn/high-performance/read-and-write-separation-and-library-subtable.html |\n| JavaGuide ZooKeeper 入门 | ZK 数据模型、ZAB、应用场景 | https://javaguide.cn/distributed-system/distributed-process-coordination/zookeeper/zookeeper-intro.html |\n| JavaGuide 面试突击版 | 冲刺期数据库/中间件快速过题 | https://interview.javaguide.cn/home.html |\n| pdai 面试知识体系 | 数据库/中间件/网络的专题题库 | https://pdai.tech/md/interview/x-interview.html |\n","ck":82},{"id":"f29","stage":7,"path":"07-面试篇/03-算法刷题路线.md","title":"03-算法刷题路线","md":"# 03-算法刷题路线\n\n> **阶段**：面试篇 ｜ **建议总量**：热题 100 + 剑指 Offer 为主，200 题以内 ｜ **节奏**：从进阶篇开始每天 2~3 题，面试前保持手感\n\n### 一、刷题总原则\n\n- **先专题后套卷**：按下面的专题顺序集中攻一类套路，形成肌肉记忆；面试前一个月再刷 Hot 100 混排，模拟真实考试；\n- **每天 2~3 题、限时**：简单题 15 分钟、中等题 25 分钟、困难题 40 分钟；到时没思路就看题解，看懂后**合上题解默写**才算完成；\n- **错题隔天重做**：建一个\"重刷清单\"，3 天后重做仍能独立写出才打勾；面试前只重刷清单里的题；\n- **一题多解**：每题先写暴力解，再逐步优化，每个解法都说得出时间/空间复杂度——面试官就是要听你的优化过程；\n- **总量控制**：200 题以内、质量优先；刷 500 遘题不如把 150 道经典题刷透；\n- **与指南进度配合**：进阶篇开始同步刷数组与链表，03-面试篇期间完成主干专题，冲刺期每天 1 题保手感。\n\n### 二、Java 刷题常用 API ⭐\n\n```java\n// —— List / 数组 ——\nList<Integer> list = new ArrayList<>();\nlist.add(1); list.get(0); list.size();\nlist.sort(Comparator.comparingInt(a -> a));        // List 自定义升序\nCollections.sort(list, (a, b) -> b - a);           // 降序\nint[] arr = {3, 1, 2};\nArrays.sort(arr);                                  // 数组排序（基本类型只能升序）\nint[][] intervals = {{2, 1}, {3, 2}};\nArrays.sort(intervals, (a, b) -> a[0] - b[0]);     // 二维数组按首元素升序（区间题必用）\n\n// —— Deque：用 ArrayDeque 同时当栈和队列，比 Stack/LinkedList 快 ——\nDeque<Integer> stack = new ArrayDeque<>();\nstack.push(1); stack.peek(); stack.pop();          // 栈：压 / 瞥 / 弹\nDeque<Integer> queue = new ArrayDeque<>();\nqueue.offer(1); queue.peek(); queue.poll();        // 队列：入 / 瞥 / 出\n\n// —— PriorityQueue 堆：Top K、堆排序题专用 ——\nPriorityQueue<Integer> minHeap = new PriorityQueue<>();                  // 小顶堆\nPriorityQueue<Integer> maxHeap = new PriorityQueue<>((a, b) -> b - a);   // 大顶堆\nPriorityQueue<int[]> pq = new PriorityQueue<>((a, b) -> a[1] - b[1]);    // 按元素第 2 位排序\nminHeap.offer(1); minHeap.peek(); minHeap.poll();\n\n// —— HashMap：计数、映射、前缀和 ——\nMap<Character, Integer> map = new HashMap<>();\nmap.put('a', 1); map.get('a'); map.containsKey('a');\nmap.getOrDefault('b', 0);\nmap.merge('a', 1, Integer::sum);                   // 计数神器：不存在则 1，存在则累加\nmap.remove('a');\n\n// —— 常用小工具 ——\n// Character.isDigit(c)、c - '0' 转 int、Integer.parseInt(s)、String.valueOf(n)\n// StringBuilder 拼接；s.toCharArray() 与 new String(chars) 互转\n// Integer.MIN_VALUE / MAX_VALUE 做初始极值\n```\n\n### 三、专题路线表（顺序学习）⭐\n\n| 顺序 | 专题 | 天数 | 代表题（LC 题号 + 题名） | 核心技巧 |\n| --- | --- | --- | --- | --- |\n| 1 | 数组与双指针 | 3 | LC1 两数之和、LC15 三数之和、LC11 盛最多水的容器、LC283 移动零、LC26 删除有序数组中的重复项、LC121 买卖股票的最佳时机、LC53 最大子数组和、LC42 接雨水 | 排序后左右夹逼；原地双指针；前缀和 |\n| 2 | 链表 | 3 | LC206 反转链表、LC21 合并两个有序链表、LC141 环形链表、LC142 环形链表 II、LC19 删除链表的倒数第 N 个结点、LC160 相交链表、LC234 回文链表、LC25 K 个一组翻转链表 | 虚拟头节点省边界判断；快慢指针找中点/判环 |\n| 3 | 栈与队列 | 2 | LC20 有效的括号、LC155 最小栈、LC232 用栈实现队列、LC739 每日温度、LC84 柱状图中最大的矩形、LC239 滑动窗口最大值 | 单调栈/单调队列：\"找下一个更大/更小\"就想到它 |\n| 4 | 哈希表 | 2 | LC217 存在重复元素、LC49 字母异位词分组、LC383 赎金信、LC128 最长连续序列、LC560 和为 K 的子数组、LC1 两数之和（哈希解法重做） | 空间换时间；前缀和 + 哈希计\"和为 K 的区间\" |\n| 5 | 二叉树与递归 | 4 | LC104 二叉树的最大深度、LC226 翻转二叉树、LC101 对称二叉树、LC110 平衡二叉树、LC236 二叉树的最近公共祖先、LC105 从前序与中序遍历序列构造二叉树、LC98 验证二叉搜索树、LC124 二叉树中的最大路径和 | 递归三要素：终止条件 / 本级处理 / 返回值；分清前中后序位置 |\n| 6 | BFS/DFS | 3 | LC102 二叉树的层序遍历、LC200 岛屿数量、LC695 岛屿的最大面积、LC994 腐烂的橘子、LC207 课程表、LC210 课程表 II | 层序模板固定 size 分层；网格 DFS 标记已访问；拓扑排序数入度 |\n| 7 | 回溯 | 3 | LC46 全排列、LC78 子集、LC77 组合、LC39 组合总和、LC22 括号生成、LC131 分割回文串、LC51 N 皇后 | 决策树：做选择 → 递归 → 撤销；used 数组与剪枝去重 |\n| 8 | 贪心 | 2 | LC55 跳跃游戏、LC45 跳跃游戏 II、LC122 买卖股票的最佳时机 II、LC435 无重叠区间、LC452 用最少数量的箭引爆气球、LC134 加油站 | 先排序找局部最优，再论证推出全局最优 |\n| 9 | 二分查找 | 2 | LC704 二分查找、LC35 搜索插入位置、LC34 在排序数组中查找元素的第一个和最后一个位置、LC33 搜索旋转排序数组、LC153 寻找旋转排序数组中的最小值、LC162 寻找峰值 | 先问单调性，再定区间开闭与收缩方向，边界不猜 |\n| 10 | 动态规划·基础 | 4 | LC70 爬楼梯、LC118 杨辉三角、LC198 打家劫舍、LC213 打家劫舍 II、LC62 不同路径、LC64 最小路径和、LC343 整数拆分 | 先定状态与转移方程，再抠初始化与遍历顺序 |\n| 11 | 动态规划·背包与子序列 | 4 | LC416 分割等和子集（0-1 背包）、LC322 零钱兑换、LC518 零钱兑换 II（完全背包）、LC300 最长递增子序列、LC1143 最长公共子序列、LC72 编辑距离、LC5 最长回文子串 | 背包按\"容量维度\"展开；子序列想\"以 i/j 结尾\"的定义 |\n| 12 | 排序与堆 | 2 | LC912 排序数组、LC215 数组中的第 K 个最大元素、LC347 前 K 个高频元素、LC23 合并 K 个升序链表、LC56 合并区间 | 手写快排/归并应付\"手撕排序\"；Top K 用堆 |\n\n### 四、手撕代码模板 ⭐（背诵级，面试默写）\n\n**模板 1：反转链表（LC206）**\n\n```java\npublic ListNode reverseList(ListNode head) {\n    ListNode prev = null, curr = head;\n    while (curr != null) {\n        ListNode next = curr.next;   // 先存后继\n        curr.next = prev;            // 反转指向\n        prev = curr;                 // 双指针前移\n        curr = next;\n    }\n    return prev;                     // prev 即新头\n}\n```\n\n**模板 2：二分查找（LC704，左闭右闭）**\n\n```java\npublic int search(int[] nums, int target) {\n    int left = 0, right = nums.length - 1;\n    while (left <= right) {                    // 区间合法才继续\n        int mid = left + (right - left) / 2;   // 防溢出写法\n        if (nums[mid] == target) return mid;\n        else if (nums[mid] < target) left = mid + 1;   // 收缩左边界\n        else right = mid - 1;\n    }\n    return -1;\n}\n```\n\n**模板 3：快速排序**\n\n```java\npublic void quickSort(int[] nums, int left, int right) {\n    if (left >= right) return;\n    int pivot = nums[left], i = left, j = right;\n    while (i < j) {\n        while (i < j && nums[j] >= pivot) j--;   // 右侧找小的\n        while (i < j && nums[i] <= pivot) i++;   // 左侧找大的\n        swap(nums, i, j);\n    }\n    swap(nums, left, i);                          // 基准归位\n    quickSort(nums, left, i - 1);\n    quickSort(nums, i + 1, right);\n}\nprivate void swap(int[] a, int i, int j) { int t = a[i]; a[i] = a[j]; a[j] = t; }\n```\n\n**模板 4：归并排序**\n\n```java\npublic int[] mergeSort(int[] nums, int left, int right) {\n    if (left == right) return new int[]{nums[left]};\n    int mid = left + (right - left) / 2;\n    int[] l = mergeSort(nums, left, mid), r = mergeSort(nums, mid + 1, right);\n    int[] res = new int[l.length + r.length];\n    int i = 0, j = 0, k = 0;\n    while (i < l.length && j < r.length) res[k++] = l[i] <= r[j] ? l[i++] : r[j++];\n    while (i < l.length) res[k++] = l[i++];\n    while (j < r.length) res[k++] = r[j++];\n    return res;\n}\n```\n\n**模板 5：BFS 层序遍历（LC102，网格 BFS 同骨架）**\n\n```java\npublic List<List<Integer>> levelOrder(TreeNode root) {\n    List<List<Integer>> res = new ArrayList<>();\n    if (root == null) return res;\n    Queue<TreeNode> queue = new ArrayDeque<>();\n    queue.offer(root);\n    while (!queue.isEmpty()) {\n        int size = queue.size();               // 固定本层节点数，实现\"分层\"\n        List<Integer> level = new ArrayList<>(size);\n        for (int i = 0; i < size; i++) {\n            TreeNode node = queue.poll();\n            level.add(node.val);\n            if (node.left != null) queue.offer(node.left);\n            if (node.right != null) queue.offer(node.right);\n        }\n        res.add(level);\n    }\n    return res;\n}\n```\n\n**模板 6：DFS 全排列（LC46，一切回溯题的骨架）**\n\n```java\npublic List<List<Integer>> permute(int[] nums) {\n    List<List<Integer>> res = new ArrayList<>();\n    dfs(nums, new boolean[nums.length], new ArrayList<>(), res);\n    return res;\n}\nprivate void dfs(int[] nums, boolean[] used, List<Integer> path, List<List<Integer>> res) {\n    if (path.size() == nums.length) {\n        res.add(new ArrayList<>(path));        // 必须拷贝快照\n        return;\n    }\n    for (int i = 0; i < nums.length; i++) {\n        if (used[i]) continue;\n        used[i] = true; path.add(nums[i]);     // 做选择\n        dfs(nums, used, path, res);\n        path.remove(path.size() - 1); used[i] = false;   // 撤销选择\n    }\n}\n```\n\n**模板 7：LRU 缓存（LC146）——先说 LinkedHashMap 思路版**\n\n```java\nclass LRUCache extends LinkedHashMap<Integer, Integer> {\n    private final int capacity;\n    public LRUCache(int capacity) {\n        super(capacity, 0.75f, true);          // true = 按访问顺序排序\n        this.capacity = capacity;\n    }\n    public int get(int key) { return super.getOrDefault(key, -1); }\n    @Override\n    protected boolean removeEldestEntry(Map.Entry<Integer, Integer> eldest) {\n        return size() > capacity;              // 超容量淘汰最久未访问\n    }\n}\n```\n\n**模板 7（进阶）：手写 HashMap + 双向链表版**\n\n```java\nclass LRUCache {\n    private final int capacity;\n    private final Map<Integer, Node> map = new HashMap<>();\n    private final Node head = new Node(0, 0), tail = new Node(0, 0);  // 哨兵\n\n    public LRUCache(int capacity) {\n        this.capacity = capacity;\n        head.next = tail; tail.prev = head;\n    }\n    public int get(int key) {\n        Node node = map.get(key);\n        if (node == null) return -1;\n        moveToHead(node);                      // 刚访问的提到最前\n        return node.value;\n    }\n    public void put(int key, int value) {\n        Node node = map.get(key);\n        if (node != null) { node.value = value; moveToHead(node); return; }\n        if (map.size() == capacity) {          // 淘汰链表尾部（最久未用）\n            Node last = tail.prev;\n            remove(last); map.remove(last.key);\n        }\n        Node fresh = new Node(key, value);\n        map.put(key, fresh); addToHead(fresh);\n    }\n    private void addToHead(Node n) { n.next = head.next; n.prev = head; head.next.prev = n; head.next = n; }\n    private void remove(Node n) { n.prev.next = n.next; n.next.prev = n.prev; }\n    private void moveToHead(Node n) { remove(n); addToHead(n); }\n    static class Node { int key, value; Node prev, next; Node(int k, int v) { key = k; value = v; } }\n}\n```\n\n### 五、面试场景应对\n\n**五步法（按顺序执行，全程开口讲）**：\n\n1. **澄清题意**：数据规模多大、是否有序/有重复、边界情况（空、单元素、负数），复述题目与面试官确认；\n2. **说思路**：先讲暴力解再讲优化方向，征求面试官同意后再动手，避免闷头写偏；\n3. **报复杂度**：时间/空间复杂度各是多少、为什么，这是面试官判断你是否受过训练的关键；\n4. **动手写**：变量命名规范、保持缩进，边写边讲；卡住就先写伪代码骨架再填实现；\n5. **自测用例**：写完主动跑一遍空输入、单元素、重复值等用例，自己先抓 bug 比被抓强。\n\n**平台注意事项**：\n\n- **白板/纸面**：先写函数骨架再填细节，保持布局整洁，写完站在面试官角度\"通读\"一遍；\n- **牛客 ACM 模式**：要自己处理输入输出，提前练 `Scanner`/`BufferedReader` 读多行数据的标准套路；\n- **共享文档（无编译器）**：靠脑内编译，写完口头逐行过一遍用例，主动说\"这里我检查一下越界\"；\n- **卡壳时**：绝不沉默——大声思考，从 n=1、n=2 的小例子找规律，面试官往往在等你的思考过程而不是答案。\n\n### 🔗 推荐资料\n\n| 资料 | 说明 | 链接 |\n| --- | --- | --- |\n| pdai 数据结构与算法导读 | 算法知识体系与各专题的索引入口 | https://pdai.tech/md/outline/x-outline.html |\n| JavaGuide 后端面试通关计划 | 算法在整体求职准备中的位置与节奏 | https://javaguide.cn/interview-preparation/backend-interview-plan.html |\n","ck":0},{"id":"f30","stage":7,"path":"07-面试篇/04-简历与求职指南.md","title":"04-简历与求职指南","md":"# 04-简历与求职指南\n\n> **阶段**：面试篇 ｜ **定位**：把前几篇学到的能力，翻译成简历语言与面试表现，覆盖求职全程\n\n### 一、求职时间线\n\n**校招（应届生主战场，按倒推准备）**：\n\n| 时间 | 节点 | 关键动作 |\n| --- | --- | --- |\n| 大三/研一上 | 能力建设期 | 过完入门→框架篇，开始算法刷题（见[《03-算法刷题路线》](#/f/f29)） |\n| 3~5 月 | 春招实习投递 | 投暑期实习（头部公司暑期实习转正是进大厂最稳的路径） |\n| 6~8 月 | 暑期实习 | 把项目难点写进简历，实习结束争取转正评价 |\n| 7~9 月 | 提前批 | 大厂提前批免笔试/流程快，用实习经历冲一波，不影响正式批 |\n| 8~10 月 | **秋招正式批（主战场）** | 笔试+三轮技术面+HR 面，同时投 30+ 家分散风险 |\n| 次年 3~4 月 | 春招补录 | 秋招不满意的补机会，岗位少于秋招、节奏更急 |\n\n**社招**：集中在\"金三银四\"与\"金九银十\"，提前 1~2 个月准备——更新简历、把当前项目沉淀出 2~3 个可讲的难点、重刷八股与算法；在职跳槽要预留背调与交接时间。\n\n**投递渠道与节奏**：\n\n- 校招：公司官网/招聘公众号 → 内推（学长学姐、牛客内推帖，提前批大多靠内推）→ 宣讲会现场投递；\n- 社招：内推成功率最高（优先找目标团队的人），其次 BOSS 直聘等平台主动沟通，中高级岗位走猎头；\n- 节奏：秋招 7 月底 8 月初就开投提前批，批次越早 HC 越足；同一公司通常只能投一个岗位，投前想清楚方向；\n- 建一张投递进度表（公司/岗位/状态/下一动作），面试邀约集中在同一周时要主动协调时间。\n\n### 二、Java 后端岗位画像 ⭐\n\nJD（岗位描述）看着五花八门，核心要求就六类，正好对应本指南的各篇：\n\n| JD 通用要求 | 背后在考察什么 | 对应本指南 |\n| --- | --- | --- |\n| Java 基础扎实，熟悉集合、并发、JVM | 一面硬门槛，追问链最深的板块 | 01/02 篇 + [《01-Java高频八股速查》](#/f/f27) |\n| 熟悉 Spring/SpringBoot/MyBatis | 是否有真实工程经验，事务、Bean 细节常挖 | 05-框架篇 |\n| 熟悉 MySQL、索引调优、事务 | 写过真业务的人才答得出慢 SQL 实战 | 03-数据库篇 |\n| 熟悉 Redis/MQ 等中间件 | 缓存三大问题、消息可靠性是必考 | 04-中间件篇 |\n| 了解分布式、高并发场景 | 场景题与项目深度的分水岭 | 06-分布式与高并发篇 |\n| 良好的算法与数据结构基础 | 笔试 + 每轮面试手撕代码 | [《03-算法刷题路线》](#/f/f29) |\n\n加分项：GitHub 有像样的仓库、技术博客、竞赛/证书、参与过开源项目；没有也不必编，把项目讲深同样有竞争力。\n\n### 三、简历结构 ⭐\n\n**一页原则**：应届/两年以内经验必须一页；模块顺序：基本信息 → 教育背景 → 专业技能 → 项目经历 → 其他（加分项）。教育背景在前（校招看学校），项目经历占篇幅 50% 以上。\n\n**专业技能写法 ⭐（最容易踩坑的部分）**：\n\n- 程度词只用\"熟悉/掌握/了解\"三档，**慎用\"精通\"**——写了精通的板块面试官会往死里问；\n- 每一条技能都要能**接住两层追问**，写之前自问：\"这条被问到原理层我能答吗？\"\n- 不要写名词堆砌（\"熟悉 Java、Spring、MySQL、Redis、Kafka...\"一行带过），每条带能力描述。\n\n```text\n反例：精通 Java，精通 Spring 全家桶，精通 MySQL、Redis，精通分布式。\n\n正例：\n- 熟悉 JVM 内存模型与常用 GC 收集器，能使用 jstack/jmap 排查线上 CPU 飙高、OOM 问题；\n- 熟悉线程池原理（7 参数、执行流程、拒绝策略），有异步任务编排与虚拟线程实践经验；\n- 熟悉 MySQL 索引与事务原理，有慢 SQL 定位优化、索引设计的实际经验；\n- 熟悉 Redis 核心数据结构与持久化，能解决缓存穿透/击穿/雪崩与缓存一致性问题；\n- 了解分布式理论（CAP、一致性哈希）与分布式事务方案，熟悉 Seata/RocketMQ 事务消息的使用场景。\n```\n\n**其他加分项写法**：GitHub 放有 README 的完整仓库（不是 fork 堆）、博客列 3~5 篇高阅读量文章、算法写\"LeetCode 刷题 200+（Hot 100 全刷）\"——写了就要经得起现场手撕。\n\n**投递前自查清单（10 条全过再投）**：\n\n- [ ] 一页以内、PDF 格式，文件名为\"姓名-岗位-学校/工作年限\"；\n- [ ] 手机号与邮箱正确，邮箱名正式、头像得体；\n- [ ] 专业技能每一条都通过了\"两层追问\"自测；\n- [ ] 每段项目经历都有量化结果，且数字能说出测试方法；\n- [ ] 时间线无矛盾（实习/项目/在校时间能对上）；\n- [ ] 无错别字，技术名词大小写拼写正确（Java/MySQL/Spring）；\n- [ ] GitHub 与博客链接可访问，仓库有 README；\n- [ ] 技能顺序按目标 JD 调整，匹配度最高的两条放最前；\n- [ ] 导出 PDF 后再检查一遍排版（字体、加粗、分隔线不错乱）；\n- [ ] 找一位已工作的学长/朋友完整看一遍并提意见。\n\n### 四、项目经验怎么写 ⭐⭐\n\n**STAR 法则**：Situation（背景：什么业务、什么规模）→ Task（任务：你负责什么）→ Action（行动：技术方案与取舍）→ Result（结果：**量化数据**）。篇幅上 Action 与 Result 占七成，别花笔墨写\"需求分析、团队协作\"。\n\n**三个可写项目方向（难度递进，衔接本指南动手实践）**：\n\n1. **基础项目：多线程 todo / 图书管理**（练 01/05 篇）：SpringBoot + MyBatis-Plus + MySQL 完整 CRUD、登录鉴权、统一异常与参数校验——证明工程基本功，可写的难点：全局异常设计、参数校验、接口幂等；\n2. **进阶项目：简易商城**（练 03/04 篇）：商品/订单/支付模拟，引入 Redis 缓存商品热点数据、RabbitMQ 异步通知库存与日志——可写的难点：缓存一致性方案、消息可靠性（confirm + 手动 ack + 死信兜底）、消费幂等；\n3. **亮点项目：秒杀系统演进**（练 06 篇，最能拉开差距）：从\"DB 扣库存被压垮\"讲起，演进到 网关限流 → Redis+Lua 预扣 → MQ 异步落库 → DB 条件更新防超卖，压测出量化数据——这是把整个分布式篇串成故事的最好载体。\n\n**难点挖掘清单（每个项目找 2~3 个，按此排查你做过的事）**：\n\n- 性能优化：慢 SQL 加索引/覆盖索引前后对比、接口 RT 从多少降到多少；\n- 缓存一致性：选了 Cache Aside + 删除缓存 + 重试，为什么不更新缓存、不一致窗口多大；\n- 消息可靠性：生产确认 + 持久化 + 手动 ack 三段怎么配，消息丢了怎么办；\n- 幂等：防重复下单/重复支付用什么方案（唯一索引/去重表/状态机），为什么；\n- 限流与熔断：限流阈值怎么定的、压测过吗、被限流的请求怎么处理。\n\n**量化结果模板**（没有线上环境就用 JMeter 压测自己的项目，数据真实可复述）：\n\n- 接口响应：下单接口 RT 由 380ms 降至 60ms（缓存 + 异步化）；\n- 吞吐：单机 QPS 由 300 提升至 2400（压测环境：4C8G，JMeter 500 并发）；\n- 正确性：500 并发抢 100 件库存压测 10 轮，0 超卖；\n\n**写法示例（一段合格的 Action+Result）**：\n\n```text\n商品详情页 QPS 高时 DB 查询打满：引入 Caffeine+Redis 两级缓存，热点商品走本地缓存，\n采用\"先更新 DB 再删缓存 + 消息重试\"保证一致性；压测详情接口 QPS 从 350 提升至 2800，\nP99 由 210ms 降至 18ms，缓存命中率 97%。\n```\n\n**面试官常见追问与应对**：\n\n| 追问 | 应对思路 |\n| --- | --- |\n| \"为什么不用 X 方案？\" | 说出 X 的问题 + 你所选方案的代价，体现权衡而非\"唯一正确答案\" |\n| \"这个 QPS 怎么测出来的？\" | 说清工具（JMeter）、并发数、机器配置、测试数据量，数据要可复现 |\n| \"流量再涨 10 倍怎么办？\" | 按 06 篇演进路径答：先缓存/限流，再 MQ 削峰，最后才分库分表 |\n| \"项目里你负责哪部分？\" | 如实划边界，突出自己负责模块的难点，别把整个项目说成一个人做的 |\n| \"上线后出过什么问题？\" | 提前准备一个真实故障/bug：现象 → 排查过程 → 根因 → 修复与复盘 |\n\n### 五、面试流程与各轮准备 ⭐\n\n| 轮次 | 侧重点 | 准备要点 |\n| --- | --- | --- |\n| 一面（基础+算法） | 八股 + 手撕代码，刷人最多 | 《01-Java高频八股速查》《02-数据库与中间件面试速查》过两轮；算法模板默写级熟练 |\n| 二面（深度+项目） | 项目追问到底层，八股问\"为什么\" | 每个简历上的技术点准备\"原理 + 取舍 + 备选方案\"三层答案 |\n| 三面（设计+软素质） | 场景设计题、职业规划、带人潜力 | 秒杀/短链/抢红包等场景题用框架练熟，准备反问与职业故事 |\n| HR 面（稳定性与匹配） | 离职原因、薪资、抗压 | 话术真诚不抱怨，提前想好期望薪资的依据 |\n\n**场景题应对框架（三面标配）**：\n\n1. **澄清需求**：先问\"日活多少、峰值多大、哪些功能必须\"——很多题目本无标准答案，考察的是你怎么收敛问题；\n2. **估算量级**：QPS、存储量、带宽拍个数量级（如 100 万日活 × 人均 20 次 = 2000 万次/天 ≈ 峰值 5000 QPS）；\n3. **分模块设计**：接入层（网关/负载均衡）→ 服务层（缓存/MQ/微服务拆分）→ 数据层（读写分离/分库分表）；\n4. **权衡取舍**：主动说每个选择的代价（一致性 vs 性能、复杂度 vs 收益），这里最能体现 06 篇的功力。\n\n**笔试准备**：校招笔试通常是 2~4 道编程题（ACM 模式）+ 选择题；按[《03-算法刷题路线》](#/f/f29)的要求练好标准输入输出，在牛客上做 2~3 次两小时整卷模拟，练时间分配（先易后难，部分公司按用例给分）。\n\n**场景题示例（设计一个短链接服务，套用上面的框架）**：\n\n1. 澄清：读多写少？要不要统计点击量？短链会过期吗？\n2. 估算：每年 1 亿条新短链 → 长链截哈希取 62 进制 7 位，或分布式 ID 发号器（呼应[《01-分布式理论基础》](#/f/f25)雪花算法）；\n3. 设计：短码作唯一索引存 MySQL + Redis 缓存热点映射 → 访问 302 跳转（301 省 RT 但 302 便于统计与改指向）；\n4. 取舍：哈希冲突重试/补位；发号器方案无冲突、趋势递增利于分库分表；收尾补防刷与监控。\n\n### 六、避坑清单\n\n- **背题痕迹**：一字不差背答案、答非所问——用自己的话复述，答案不超过 90 秒再等追问；\n- **简历注水**：写了没做过的技术，被追问两层就露馅，比不写更糟；每条经历按\"三层追问\"自检；\n- **不懂装懂**：最忌硬编。安全的说法是\"这块我没实际用过，按我的理解是……如果不对请您指点\"；\n- **只答不问**：全程被动。适当反问（\"这个岗位主要业务方向是什么\"）展示主动性；\n- **情绪化抱怨**：吐槽前公司/前领导是 HR 面一票否决项，把离职原因包装成\"求发展\"；\n- **迟到大意**：线上面试提前 15 分钟测试摄像头与网络，笔试带好身份证件。\n\n**反问环节问什么（说\"没有问题\"会显得没兴趣）**：\n\n- 团队与业务：这个岗位进去负责什么业务/模块？团队规模与梯队？\n- 技术与成长：目前的技术栈与架构演进方向？新人有没有导师制？\n- 考核：试用期考核标准是什么？（薪资福利留到 HR 面谈，技术面别问）\n\n### 七、Offer 选择与谈薪\n\n- **比较维度**：别只看月薪——算\"月薪 × 月数 + 年终概率 + 五险一金缴纳基数 + 补贴\"，再叠加平台成长性、业务前景、加班强度（问清是否有大小周、加班文化与调休）；\n- **应届优先级建议**：平台与业务 > 薪资 > 城市；第一份工作的技术密度和项目复杂度，决定下一跳的高度；\n- **谈薪依据**：手里有其他 offer 才有筹码，话术是\"贵司是我优先选择，但手上还有 offer 在比，希望评估能否调整\"；\n- **红线**：不虚构 offer 金额（背调一问便知）、不轻易毁约已接的 offer（行业圈子小，信誉是长期资产）。\n\n### 八、面试前一周冲刺清单\n\n- 八股：《01-Java高频八股速查》《02-数据库与中间件面试速查》再过一轮，只重刷未打勾与\"心里没底\"的题；\n- 算法：每天 2 道模板题保手感，把 7 个手撕模板各默写一遍；\n- 项目：对镜/录音演练 3 分钟项目介绍，把每个难点的\"追问链\"答到第三层；\n- 场景题：秒杀设计讲 3 遍到不卡壳，再准备 1 个备用场景（短链、抢红包、排行榜）；\n- 杂项：多份 PDF 简历、1 分钟与 3 分钟两版自我介绍、提前 15 分钟测试线上面试设备或规划路线。\n\n### 🔗 推荐资料\n\n| 资料 | 说明 | 链接 |\n| --- | --- | --- |\n| JavaGuide 简历指南 | 简历结构与技能清单的官方建议 | https://javaguide.cn/interview-preparation/resume-guide.html |\n| JavaGuide 项目经验指南 | 项目怎么写、怎么被追问 | https://javaguide.cn/interview-preparation/project-experience-guide.html |\n| JavaGuide 后端面试通关计划 | 从准备到拿 offer 的完整时间线 | https://javaguide.cn/interview-preparation/backend-interview-plan.html |\n| JavaGuide 面试突击版 | 冲刺期快速复习的浓缩知识库 | https://interview.javaguide.cn/home.html |\n| pdai 面试知识体系 | 按专题组织的面试题与答案索引 | https://pdai.tech/md/interview/x-interview.html |\n","ck":10},{"id":"f31","stage":7,"path":"07-面试篇/05-选择填空题库.md","title":"05-选择填空题库","md":"# 05-选择填空题库\n\n> **阶段**：面试篇 ｜ **用法**：在应用「📝 选择填空练习」中在线作答（可按「📖 章节小考」下拉框逐章刷题、🎲 乱序防背题、🔁 只做错题），或直接阅读自测——遮住「答案」行，做完再对照「解析」，答错的知识点回到「详见」对应文件复习。\n\n## 选择题\n\n### 1.（Java基础·易）JDK、JRE、JVM 三者的包含关系是？\n- A. JDK ⊃ JRE ⊃ JVM\n- B. JVM ⊃ JRE ⊃ JDK\n- C. JRE ⊃ JDK ⊃ JVM\n- D. 三者互相独立\n\n答案：A\n解析：JDK = 开发工具 + JRE，JRE = JVM + 核心类库；只需运行程序装 JRE，要开发才装 JDK。详见[《01-环境搭建与基础语法》](#/f/f3)\n\n### 2.（Java基础·中）`StringBuilder sb = new StringBuilder(\"a\");` 调用 `change(sb)`，方法体为 `void change(StringBuilder x){ x.append(\"b\"); x = new StringBuilder(\"c\"); }`，之后 sb 的内容是？\n- A. a\n- B. ab\n- C. c\n- D. bc\n\n答案：B\n解析：Java 只有值传递：append 修改的是同一个对象，而重新赋值只改变了形参的指向，不影响实参。详见[《02-面向对象与核心类》](#/f/f4)\n\n### 3.（Java基础·易）`Integer a = 127, b = 127; System.out.println(a == b);` 输出什么？\n- A. true\n- B. false\n- C. 编译错误\n- D. 不确定\n\n答案：A\n解析：IntegerCache 缓存 -128~127，范围内 == 比较的是同一个缓存对象；超出范围（如 128）必须用 equals。详见[《02-面向对象与核心类》](#/f/f4)\n\n### 4.（Java基础·易）以下哪个不属于面向对象三大特性？\n- A. 封装\n- B. 继承\n- C. 多态\n- D. 重载\n\n答案：D\n解析：三大特性是封装、继承、多态；重载是编译期确定同签名不同参数的方法，不属于三大特性。详见[《02-面向对象与核心类》](#/f/f4)\n\n### 5.（Java基础·易）try-with-resources 的主要作用是？\n- A. 自动关闭实现了 AutoCloseable 的资源\n- B. 自动提交事务\n- C. 捕获所有异常\n- D. 提升运行速度\n\n答案：A\n解析：编译器会生成 finally 中的关闭逻辑，避免资源泄漏，优于手写 try-catch-finally。详见[《04-异常-IO-反射-注解》](#/f/f6)\n\n### 6.（Java基础·中）关于 String 不可变，正确的解释是？\n- A. String 是可变的，只是习惯上不改\n- B. String 类被 final 修饰、内部数据私有且不暴露修改方法\n- C. 频繁拼接字符串应优先用 String\n- D. String 是基本数据类型\n\n答案：B\n解析：不可变带来安全性、字符串常量池复用、hashCode 可缓存；频繁拼接用 StringBuilder。详见[《02-面向对象与核心类》](#/f/f4)\n\n### 7.（集合·中）JDK 1.8 中 ArrayList 首次 add 时容量扩到 10，此后每次扩容为原来的？\n- A. 1.5 倍\n- B. 2 倍\n- C. 1.2 倍\n- D. 3 倍\n\n答案：A\n解析：newCapacity = oldCapacity + (oldCapacity >> 1)，即 1.5 倍向下取整。详见[《03-集合与泛型》](#/f/f5)\n\n### 8.（集合·中）HashMap（JDK 1.8）中链表转红黑树的条件是？\n- A. 链表长度 ≥ 8 且数组长度 ≥ 64\n- B. 链表长度 ≥ 8 即可\n- C. 链表长度 ≥ 16\n- D. 元素总数 ≥ 64\n\n答案：A\n解析：数组长度不足 64 时优先扩容而不是树化；红黑树退化回链表的阈值是 6。详见[《03-集合与泛型》](#/f/f5)\n\n### 9.（集合·易）HashSet 判断元素是否重复依赖的方法是？\n- A. 仅 equals\n- B. 仅 ==\n- C. hashCode 与 equals\n- D. compareTo\n\n答案：C\n解析：先用 hashCode 定位桶，再在桶内用 equals 精确比较，两者必须一起重写。详见[《03-集合与泛型》](#/f/f5)\n\n### 10.（集合·易）下列集合中线程安全的是？\n- A. ArrayList\n- B. HashMap\n- C. Vector\n- D. LinkedList\n\n答案：C\n解析：Vector 方法用 synchronized 修饰；现代并发场景更推荐 ConcurrentHashMap 或 CopyOnWriteArrayList。详见[《03-集合与泛型》](#/f/f5)\n\n### 11.（集合·易）用 for-each 遍历 ArrayList 时直接调用 list.remove(o)，通常会？\n- A. 正常删除\n- B. 抛出 ConcurrentModificationException\n- C. 编译错误\n- D. 静默删除所有元素\n\n答案：B\n解析：fail-fast 机制检测到 modCount 被修改即抛异常；正确做法是 Iterator.remove() 或 removeIf。详见[《03-集合与泛型》](#/f/f5)\n\n### 12.（并发·易）直接调用线程对象的 run() 而不是 start()，结果是？\n- A. 创建新线程执行\n- B. 在当前线程中作为普通方法执行\n- C. 抛出异常\n- D. 永久阻塞\n\n答案：B\n解析：只有 start() 会让 JVM 创建新线程并调用 run()；直接调 run() 与普通方法调用无异。详见[《01-多线程与并发编程》](#/f/f8)\n\n### 13.（并发·易）volatile 能保证的是？\n- A. 原子性\n- B. 可见性与有序性\n- C. 原子性与可见性\n- D. 原子性、可见性、有序性都保证\n\n答案：B\n解析：volatile 保证可见性和禁止指令重排，但 i++ 这类复合操作仍需 synchronized 或原子类。详见[《01-多线程与并发编程》](#/f/f8)\n\n### 14.（并发·中）线程池提交任务后的处理顺序是？\n- A. 核心线程 → 阻塞队列 → 非核心线程 → 拒绝策略\n- B. 直接创建线程直到最大线程数\n- C. 先入队列再创建核心线程\n- D. 顺序随机\n\n答案：A\n解析：先占满核心线程，队列满了才扩非核心线程，到 max 后触发拒绝策略——这也是 FixedThreadPool 无界队列堆积 OOM 的根源。详见[《01-多线程与并发编程》](#/f/f8)\n\n### 15.（并发·中）synchronized 锁升级的正确顺序是？\n- A. 偏向锁 → 轻量级锁 → 重量级锁\n- B. 重量级锁 → 轻量级锁 → 偏向锁\n- C. 轻量级锁 → 偏向锁 → 重量级锁\n- D. 不存在锁升级\n\n答案：A\n解析：JVM 按竞争激烈程度逐步升级且不可逆，目的是减少无竞争场景的开销。详见[《01-多线程与并发编程》](#/f/f8)\n\n### 16.（并发·中）ThreadLocal 可能内存泄漏的根本原因是？\n- A. key 是强引用\n- B. key 是弱引用但 value 是强引用，线程长期存活时 value 无法回收\n- C. value 是弱引用\n- D. 底层是 ArrayList\n\n答案：B\n解析：线程池中线程长期存活，ThreadLocalMap 的 value 无法自动回收，用完必须调用 remove()。详见[《01-多线程与并发编程》](#/f/f8)\n\n### 17.（并发·易）以下哪个不是 ThreadPoolExecutor 的拒绝策略？\n- A. AbortPolicy\n- B. CallerRunsPolicy\n- C. DiscardPolicy\n- D. FairPolicy\n\n答案：D\n解析：四种拒绝策略是 AbortPolicy、CallerRunsPolicy、DiscardPolicy、DiscardOldestPolicy。详见[《01-多线程与并发编程》](#/f/f8)\n\n### 18.（JVM·中）以下运行时区域中，规范规定不会抛出 OutOfMemoryError 的是？\n- A. 堆\n- B. 虚拟机栈\n- C. 程序计数器\n- D. 元空间\n\n答案：C\n解析：程序计数器是唯一没有规定任何 OOM 情况的区域；栈是 StackOverflowError，堆和元空间都会 OOM。详见[《02-JVM核心》](#/f/f9)\n\n### 19.（JVM·易）判断对象是否可回收，主流商用虚拟机采用？\n- A. 引用计数法\n- B. 可达性分析（从 GC Roots 出发）\n- C. 随机回收\n- D. 手动释放\n\n答案：B\n解析：可达性分析解决了引用计数法的循环引用问题；GC Roots 包括栈帧局部变量、静态变量、常量、JNI 引用等。详见[《02-JVM核心》](#/f/f9)\n\n### 20.（JVM·中）双亲委派机制的主要作用是？\n- A. 加快类加载速度\n- B. 避免核心类被篡改与类的重复加载\n- C. 是节省内存的唯一手段\n- D. 为了支持热更新\n\n答案：B\n解析：子加载器先委托父加载器，保证 String 等核心类始终由 Bootstrap 加载，安全且唯一。详见[《02-JVM核心》](#/f/f9)\n\n### 21.（JVM·中）关于 G1 收集器，下列说法正确的是？\n- A. 将堆划分为多个 Region，可设定目标停顿时间\n- B. 只能回收新生代\n- C. 基于标记-清除，必然产生大量碎片\n- D. 是 JDK 8 的默认收集器\n\n答案：A\n解析：G1 按 Region 管理、可预测停顿（-XX:MaxGCPauseMillis），整体标记-整理、Region 间复制，JDK 9+ 默认。详见[《02-JVM核心》](#/f/f9)\n\n### 22.（MySQL·易）InnoDB 的默认事务隔离级别是？\n- A. 读未提交\n- B. 读已提交\n- C. 可重复读\n- D. 串行化\n\n答案：C\n解析：RR 通过 MVCC + 临键锁在很大程度上避免幻读；互联网公司常改用 RC 以减少锁冲突。详见[《索引-事务-锁与调优》](#/f/f12)\n\n### 23.（MySQL·中）假设 name 列有索引，下列条件能走索引的是？\n- A. name LIKE '%三'\n- B. name LIKE '张%'\n- C. LEFT(name,1) = '张'\n- D. name + 1 = '张三'\n\n答案：B\n解析：左模糊、对索引列使用函数或运算都会导致索引失效，只有右前缀模糊可以走索引。详见[《索引-事务-锁与调优》](#/f/f12)\n\n### 24.（MySQL·易）事务 ACID 中的 I 指的是？\n- A. 原子性\n- B. 一致性\n- C. 隔离性\n- D. 持久性\n\n答案：C\n解析：Atomicity 原子性、Consistency 一致性、Isolation 隔离性、Durability 持久性。详见[《索引-事务-锁与调优》](#/f/f12)\n\n### 25.（MySQL·中）binlog（二进制日志）的主要用途是？\n- A. 崩溃后恢复未完成的事务\n- B. 主从复制与时间点恢复\n- C. 保证事务原子性\n- D. 记录慢查询\n\n答案：B\n解析：崩溃恢复靠 redo log；binlog 是 Server 层日志，用于主从复制和数据归档恢复。详见[《索引-事务-锁与调优》](#/f/f12)\n\n### 26.（MySQL·易）InnoDB 聚簇索引的叶子节点存放的是？\n- A. 主键值\n- B. 整行数据\n- C. 索引列 + 主键\n- D. 数据页地址\n\n答案：B\n解析：聚簇索引即主键索引，叶子存整行；二级索引叶子存\"索引列+主键\"，查非覆盖列需回表。详见[《索引-事务-锁与调优》](#/f/f12)\n\n### 27.（MySQL·易）varchar(50) 在 utf8mb4 字符集下的含义是？\n- A. 最多 50 字节\n- B. 最多 50 个字符\n- C. 固定占 50 字节\n- D. 最多存 50 个汉字\n\n答案：B\n解析：varchar 按字符计长度，实际占用字节数取决于字符集与内容。详见[《MySQL基础与SQL实战》](#/f/f11)\n\n### 28.（Redis·中）Redis 6.0 引入多线程的目的是？\n- A. 让命令执行并行化\n- B. 处理网络 IO 与协议解析，命令执行仍是单线程\n- C. 彻底替换单线程模型\n- D. 为了实现分布式锁\n\n答案：B\n解析：Redis 瓶颈常在网络 IO；引入多线程读写网络，命令执行保持单线程避免锁竞争。详见[《01-Redis》](#/f/f13)\n\n### 29.（Redis·易）解决缓存穿透的常用手段是？\n- A. 缓存空值与布隆过滤器\n- B. 过期时间加随机值\n- C. 互斥锁重建缓存\n- D. 多级缓存\n\n答案：A\n解析：穿透是查询根本不存在的数据；B 针对 AOF 雪崩、C 针对击穿、D 用于高并发兜底。详见[《01-Redis》](#/f/f13)\n\n### 30.（Redis·中）关于 RDB 持久化，正确的是？\n- A. 每条写命令都实时落盘\n- B. 某一时刻的内存快照，恢复快但可能丢失最后一次快照后的数据\n- C. 生成可读的文本命令日志\n- D. 不能与 AOF 同时开启\n\n答案：B\n解析：AOF 才是命令日志；RDB 二进制紧凑恢复快，Redis 4.0+ 支持 RDB+AOF 混合持久化。详见[《01-Redis》](#/f/f13)\n\n### 31.（Redis·易）大量 key 同一时刻过期导致数据库瞬间被压垮，这属于？\n- A. 缓存穿透\n- B. 缓存击穿\n- C. 缓存雪崩\n- D. 缓存污染\n\n答案：C\n解析：雪崩=大规模 key 同时失效或 Redis 宕机；过期时间加随机值、多级缓存、集群高可用是常用方案。详见[《01-Redis》](#/f/f13)\n\n### 32.（Redis·易）实现排行榜功能最合适的 Redis 数据结构是？\n- A. String\n- B. Hash\n- C. Set\n- D. ZSet\n\n答案：D\n解析：ZSet 按 score 排序，天然支持 ZINCRBY 加分、ZRANGE/ZREVRANGE 取 TopN。详见[《01-Redis》](#/f/f13)\n\n### 33.（Redis·中）Cache Aside 模式推荐的更新顺序是？\n- A. 先更新缓存，再更新数据库\n- B. 先更新数据库，再删除缓存\n- C. 先删除缓存，再更新数据库，无兜底\n- D. 缓存与数据库同时双写\n\n答案：B\n解析：先更库再删缓存的不一致窗口最小；并发读写场景可配合延迟双删、过期时间兜底。详见[《01-Redis》](#/f/f13)\n\n### 34.（消息队列·易）消息队列解决的核心问题是？\n- A. 异步、解耦、削峰\n- B. 数据持久存储\n- C. 数据计算\n- D. 服务发现\n\n答案：A\n解析：典型场景：异步通知（注册发短信）、系统解耦（订单与库存）、流量削峰（秒杀）。详见[《02-RabbitMQ》](#/f/f14)\n\n### 35.（消息队列·中）关于 Kafka 的消息顺序，正确的是？\n- A. Topic 内天然全局有序\n- B. 单分区内有序，按 key 路由可保证同类消息有序\n- C. 消费者越多越有序\n- D. 顺序与分区无关\n\n答案：B\n解析：顺序只保证在分区内；需要顺序的消息按业务 key 路由到同一分区，且该分区在消费组内只由一个消费者处理。详见[《03-Kafka》](#/f/f15)\n\n### 36.（消息队列·中）以下哪项不是 Kafka 高吞吐的原因？\n- A. 顺序写磁盘\n- B. 零拷贝（sendfile）\n- C. 批量发送与压缩\n- D. 每条消息立即 fsync 刷盘\n\n答案：D\n解析：Kafka 依赖页缓存批量刷盘，逐条 fsync 反而严重拖慢写入。详见[《03-Kafka》](#/f/f15)\n\n### 37.（消息队列·中）RocketMQ 事务消息的正确流程是？\n- A. 先投递消息再执行本地事务，失败无法处理\n- B. 发送半消息 → 执行本地事务 → 提交/回滚，配合事务回查兜底\n- C. 由消费者代替生产者执行本地事务\n- D. 依赖数据库两阶段提交\n\n答案：B\n解析：半消息对消费者不可见；生产者宕机时 Broker 通过回查确认本地事务状态，实现最终一致。详见[《04-RocketMQ》](#/f/f16)\n\n### 38.（消息队列·易）防止重复消费污染数据的通用思路是？\n- A. 要求 MQ 绝对不重复\n- B. 消费端幂等：唯一业务 ID + 去重表/状态机\n- C. 把消费模式改为只消费一次\n- D. 无需处理\n\n答案：B\n解析：至少一次投递下重复不可避免，幂等是标准答案：数据库唯一键、Redis setnx 去重等。详见[《02-RabbitMQ》](#/f/f14)\n\n### 39.（框架·中）同类中方法 A 直接调用带 @Transactional 的方法 B，事务失效的原因是？\n- A. 事务传播行为冲突\n- B. 自调用走的是原始对象而非代理对象\n- C. 方法 B 不是 public\n- D. 数据库不支持事务\n\n答案：B\n解析：Spring 事务基于 AOP 代理，自调用绕过了代理对象；可拆分类、注入自身代理或用 AopContext 解决。注意 C 也可能失效，但\"自调用\"是本题场景主因。详见[《Spring核心》](#/f/f21)\n\n### 40.（框架·易）Spring Bean 的默认作用域是？\n- A. prototype\n- B. singleton\n- C. request\n- D. session\n\n答案：B\n解析：默认单例；有状态Bean可用 @Scope(\"prototype\")。详见[《Spring核心》](#/f/f21)\n\n### 41.（框架·易）Spring AOP 底层实现采用的是？\n- A. 反射工具类\n- B. 动态代理（JDK 动态代理或 CGLIB）\n- C. 手写字节码注入\n- D. 操作系统信号量\n\n答案：B\n解析：目标类有接口时默认 JDK 动态代理，无接口时用 CGLIB 子类代理。详见[《Spring核心》](#/f/f21)\n\n### 42.（框架·中）SpringBoot 自动配置的加载逻辑是？\n- A. 扫描并加载所有第三方类\n- B. 读取 AutoConfiguration.imports 列出的自动配置类，再按 @ConditionalOnXxx 条件筛选生效\n- C. 用户必须手动注册所有 Bean\n- D. 启动时随机加载部分配置\n\n答案：B\n解析：@EnableAutoConfiguration 聚合加载配置清单，条件注解（如类路径、已有 Bean）决定是否生效。详见[《SpringBoot实战》](#/f/f22)\n\n### 43.（框架·易）MyBatis 中 #{} 与 ${} 的区别，正确的是？\n- A. 二者完全等价\n- B. #{} 是预编译占位符可防 SQL 注入，${} 是字符串拼接有注入风险\n- C. ${} 更安全\n- D. #{} 不能用在任何地方\n\n答案：B\n解析：动态表名、ORDER BY 列名等无法参数化的位置才用 ${}，且必须白名单校验。详见[《MyBatis》](#/f/f23)\n\n### 44.（框架·易）MyBatis 一级缓存的作用范围是？\n- A. SqlSession\n- B. 单个 Mapper 接口\n- C. 应用全局\n- D. 单个线程\n\n答案：A\n解析：同一 SqlSession 内相同查询命中一级缓存（默认开启）；二级缓存跨会话，分布式下易脏读应慎用。详见[《MyBatis》](#/f/f23)\n\n### 45.（框架·难）Spring 三级缓存能解决的循环依赖是？\n- A. 所有循环依赖\n- B. singleton 作用域 + setter/字段注入的循环依赖\n- C. 构造器注入的循环依赖\n- D. prototype 作用域的循环依赖\n\n答案：B\n解析：三级缓存靠\"提前暴露早期引用\"；构造器注入在实例化阶段就需要依赖，prototype 每次新建，都无法用三级缓存解决。详见[《Spring核心》](#/f/f21)\n\n### 46.（分布式与高并发·中）关于 CAP 理论，实践中更准确的理解是？\n- A. 三个特性可以同时任选\n- B. 分区不可避免，实际是在 CP 与 AP 之间取舍\n- C. 应该追求 CA 而放弃 P\n- D. P 可以通过配置关闭\n\n答案：B\n解析：网络分区必然发生，P 是必选项；无分区时才能同时兼顾 C 与 A，如 ZK 偏 CP、Eureka 偏 AP。详见[《01-分布式理论基础》](#/f/f25)\n\n### 47.（分布式与高并发·中）雪花算法的结构中不包含以下哪部分？\n- A. 符号位\n- B. 时间戳\n- C. 机器 ID\n- D. 随机数\n\n答案：D\n解析：标准结构是 1 位符号 + 41 位时间戳 + 10 位机器 ID + 12 位序列号；时钟回拨会产生重复 ID，需要兜底策略。详见[《01-分布式理论基础》](#/f/f25)\n\n### 48.（分布式与高并发·中）与漏桶算法相比，令牌桶的特点是？\n- A. 恒定速率处理请求\n- B. 允许一定程度的突发流量\n- C. 不能用于限流\n- D. 只能单机使用\n\n答案：B\n解析：令牌桶积攒令牌允许突发消费；漏桶恒定速率流出，平滑但无突发能力。详见[《02-高并发系统设计》](#/f/f26)\n\n### 49.（Java8·易）以下哪一项不是 Java 8 引入的新特性？\n- A. Lambda 表达式与函数式接口\n- B. Stream API\n- C. Optional\n- D. sealed 密封类\n\n答案：D\n解析：sealed 是 Java 17 的特性；Java 8 的代表性新特性是 Lambda、函数式接口、Stream、Optional、接口默认方法与新日期 API。详见[《05-Lambda-Stream与Java8新特性》](#/f/f7)\n\n### 50.（Java8·中）关于 Stream 的 map 与 flatMap，正确的是？\n- A. map 将每个元素映射为另一个元素，flatMap 将每个元素映射为流后再拼接扁平化\n- B. 二者完全等价\n- C. flatMap 只能用于数值流\n- D. map 会自动去重\n\n答案：A\n解析：flatMap 常用于「一对多展开」，例如把句子流拆成单词流。详见[《05-Lambda-Stream与Java8新特性》](#/f/f7)\n\n### 51.（Java8·易）Optional 的设计目的是？\n- A. 彻底取代所有 null 判断\n- B. 显式表达\"可能为空\"，用链式 API 减少 NPE\n- C. 提升程序运行性能\n- D. 替代异常处理\n\n答案：B\n解析：主要用于方法返回值；不建议用作字段与入参，也不建议直接 get()。详见[《05-Lambda-Stream与Java8新特性》](#/f/f7)\n\n### 52.（网络·易）TCP 建立连接需要进行几次握手？\n- A. 2 次\n- B. 3 次\n- C. 4 次\n- D. 1 次\n\n答案：B\n解析：三次握手确认双方收发能力；两次无法确认\"客户端能收到\"，四次则冗余。详见[《03-IO模型与网络编程》](#/f/f10)\n\n### 53.（网络·中）NIO 的核心三组件是？\n- A. Stream、Reader、Writer\n- B. Channel、Buffer、Selector\n- C. Socket、ServerSocket、URL\n- D. Thread、Runnable、Future\n\n答案：B\n解析：一个 Selector 可监听多个 Channel 的事件，单线程管理大量连接，即 IO 多路复用。详见[《03-IO模型与网络编程》](#/f/f10)\n\n### 54.（网络·中）以下哪项不是 Netty 高性能的原因？\n- A. 主从 Reactor 线程模型\n- B. 零拷贝与池化 Buffer\n- C. 每个连接独占一个线程\n- D. eventLoop 串行无锁化设计\n\n答案：C\n解析：「每连接一线程」正是 BIO 的模型，连接多时线程爆炸；Netty 用少量 eventLoop 线程服务大量连接。详见[《03-IO模型与网络编程》](#/f/f10)\n\n### 55.（网络·易）与 TCP 相比，UDP 的特点是？\n- A. 面向连接、可靠传输\n- B. 无连接、不保证可靠但开销小、延迟低\n- C. 必须先握手才能发数据\n- D. 自带拥塞控制\n\n答案：B\n解析：适合音视频、DNS、游戏等实时性优先、可容忍少量丢包的场景。详见[《03-IO模型与网络编程》](#/f/f10)\n\n### 56.（框架·中）微服务架构中，注册中心的作用是？\n- A. 存储业务数据\n- B. 服务提供者注册地址，消费者动态发现可用实例\n- C. 代替数据库做缓存\n- D. 部署应用\n\n答案：B\n解析：配合心跳做健康检查，实例上下线自动感知，调用方从注册中心拉取可用地址列表。详见[《SpringCloud微服务》](#/f/f24)\n\n### 57.（框架·易）OpenFeign 实现声明式 HTTP 调用的底层原理是？\n- A. 反射调用 Controller\n- B. 为接口生成动态代理，把方法调用翻译成 HTTP 请求\n- C. 需要手写 OkHttp 代码\n- D. 依赖数据库存储过程\n\n答案：B\n解析：@FeignClient 接口在启动时生成代理对象，结合负载均衡选择实例发起请求。详见[《SpringCloud微服务》](#/f/f24)\n\n### 58.（框架·中）下游服务大量超时，调用方暂时切断对它的请求并直接走兜底逻辑，这属于？\n- A. 限流\n- B. 熔断\n- C. 负载均衡\n- D. 灰度发布\n\n答案：B\n解析：熔断像电闸：错误率或慢调用超阈值后跳闸快速失败，防止雪崩，之后半开状态试探恢复。详见[《SpringCloud微服务》](#/f/f24)\n\n### 59.（Elasticsearch·易）Elasticsearch 实现全文检索的核心数据结构是？\n- A. B+ 树\n- B. 倒排索引\n- C. 哈希表\n- D. 跳表\n\n答案：B\n解析：文本分词后建立「词项 → 文档列表」的映射，查询时先查词再取文档，天然适合全文搜索。详见[《05-Elasticsearch》](#/f/f17)\n\n### 60.（Elasticsearch·中）关于 keyword 与 text 类型，正确的是？\n- A. 二者都会分词\n- B. text 会分词用于全文检索，keyword 不分词、适合精确匹配与排序聚合\n- C. keyword 会分词，text 不分词\n- D. 都不能用于聚合\n\n答案：B\n解析：状态码、手机号等用 keyword 精确匹配；商品描述等长文本用 text。详见[《05-Elasticsearch》](#/f/f17)\n\n### 61.（Nginx·易）以下哪项不是 Nginx 的典型用途？\n- A. 反向代理\n- B. 负载均衡\n- C. 静态资源服务\n- D. 消息存储转发\n\n答案：D\n解析：消息存储转发是消息队列的职责；Nginx 基于 epoll，擅长高并发连接接入与转发。详见[《07-Nginx》](#/f/f19)\n\n### 62.（Nginx·中）upstream 中配置 ip_hash 的作用是？\n- A. 随机分发请求\n- B. 同一客户端 IP 固定转发到同一后端节点\n- C. 按权重分发\n- D. 执行健康检查\n\n答案：B\n解析：实现会话保持（不依赖 Cookie）；缺点是后端扩缩容时分布会变化。详见[《07-Nginx》](#/f/f19)\n\n### 63.（MongoDB·易）MongoDB 的数据模型是？\n- A. 二维关系表\n- B. 文档（BSON）\n- C. 图结构\n- D. 纯键值对\n\n答案：B\n解析：文档模型 schema 灵活、嵌套结构免多表关联；概念对应：库-集合-文档 ≈ 库-表-行。详见[《08-MongoDB》](#/f/f20)\n\n### 64.（MongoDB·中）以下哪种场景最适合 MongoDB？\n- A. 银行核心账务（强事务）\n- B. 商品详情这类字段灵活、结构多变的内容管理\n- C. 复杂的多表 JOIN 报表\n- D. 计费扣款\n\n答案：B\n解析：MongoDB 的弱项正是强事务与复杂关联；内容管理、日志埋点、爬虫数据是它的强项。详见[《08-MongoDB》](#/f/f20)\n\n## 填空题\n\n### 1.（Java基础·易）Java 源文件经 javac 编译后生成＿＿＿文件，由 JVM 加载执行。\n答案：字节码／class／.class\n解析：javac 把 .java 编译为 .class 字节码，JVM 解释/JIT 执行，这是\"一次编写，到处运行\"的基础。详见[《01-环境搭建与基础语法》](#/f/f3)\n\n### 2.（Java基础·易）== 用于比较引用类型时，比较的是＿＿＿。\n答案：地址／内存地址／引用地址\n解析：比较内容应使用重写后的 equals，String、Integer 等都已重写。详见[《02-面向对象与核心类》](#/f/f4)\n\n### 3.（集合·易）ArrayList 的底层是＿＿＿，LinkedList 的底层是＿＿＿。\n答案：数组；双向链表\n解析：ArrayList 随机访问快，LinkedList 头尾插删快，随机访问慢。详见[《03-集合与泛型》](#/f/f5)\n\n### 4.（集合·易）HashMap（JDK 1.8）的底层结构是＿＿＿＋链表＋红黑树。\n答案：数组／哈希表\n解析：数组是主体，冲突挂链表，链表长度≥8 且数组长度≥64 时树化。详见[《03-集合与泛型》](#/f/f5)\n\n### 5.（并发·中）Executors 创建的 FixedThreadPool 使用无界＿＿＿，任务堆积可能导致 OOM，因此推荐手动 new ThreadPoolExecutor。\n答案：队列／阻塞队列\n解析：无界队列在消费慢时会无限堆积任务，最终内存耗尽。详见[《01-多线程与并发编程》](#/f/f8)\n\n### 6.（并发·中）synchronized 是 JVM 层面的锁，而 ReentrantLock 是＿＿＿层面用 AQS 实现的锁。\n答案：JDK／API／Java\n解析：ReentrantLock 基于队列同步器（AQS）在 Java 代码层实现，功能更丰富：可中断、超时、公平锁、Condition。详见[《01-多线程与并发编程》](#/f/f8)\n\n### 7.（JVM·中）JVM 新生代分为 Eden 区和两个＿＿＿区。\n答案：Survivor／S0/S1／from/to\n解析：默认 8:1:1，对象在两个 Survivor 区之间来回复制，每熬过一次 Minor GC 年龄+1。详见[《02-JVM核心》](#/f/f9)\n\n### 8.（JVM·中）类加载过程依次为：加载 → 验证 → 准备 → ＿＿＿ → 初始化。\n答案：解析\n解析：准备阶段给静态变量赋零值，初始化才执行 <clinit>；解析将常量池符号引用转为直接引用。详见[《02-JVM核心》](#/f/f9)\n\n### 9.（MySQL·易）MySQL 5.5 之后的默认存储引擎是＿＿＿。\n答案：InnoDB\n解析：支持事务、行级锁、外键与 MVCC；MyISAM 表锁且无事务，已非默认。详见[《MySQL基础与SQL实战》](#/f/f11)\n\n### 10.（MySQL·易）MySQL 默认的事务隔离级别是＿＿＿。\n答案：可重复读／REPEATABLE READ／RR\n解析：通过 MVCC + 临键锁在该级别下大幅避免幻读。详见[《索引-事务-锁与调优》](#/f/f12)\n\n### 11.（MySQL·中）EXPLAIN 输出的 type 列出现＿＿＿时表示全表扫描，通常需要优化。\n答案：ALL\n解析：性能从好到差：const > eq_ref > ref > range > index > ALL，生产 SQL 至少做到 range。详见[《索引-事务-锁与调优》](#/f/f12)\n\n### 12.（Redis·易）Redis 中实现排行榜最常用的数据结构是＿＿＿。\n答案：ZSet／zset／有序集合／sorted set\n解析：按 score 排序，ZINCRBY 加分、ZREVRANGE 取 TopN。详见[《01-Redis》](#/f/f13)\n\n### 13.（Redis·易）缓存三大经典问题：缓存穿透、缓存击穿、缓存＿＿＿。\n答案：雪崩\n解析：穿透查不存在的数据，击穿是热点 key 过期瞬间被打穿，雪崩是大规模 key 同时失效。详见[《01-Redis》](#/f/f13)\n\n### 14.（Redis·中）Redis 分布式锁的加锁命令 SET key value NX ＿＿＿ ttl 中，最后一参数段表示过期时间，防止死锁。\n答案：EX／ex\n解析：NX 保证互斥，EX 设置过期；生产建议直接用 Redisson 看门狗自动续期。详见[《01-Redis》](#/f/f13)\n\n### 15.（消息队列·中）Kafka 的消息顺序只在＿＿＿范围内保证，跨分区无序。\n答案：分区／Partition／partition\n解析：按 key 路由到同一分区可保证同类消息有序，消费组内一个分区只由一个消费者消费。详见[《03-Kafka》](#/f/f15)\n\n### 16.（框架·中）SpringBoot 中把配置文件批量绑定到配置类的注解是 @＿＿＿。\n答案：ConfigurationProperties\n解析：@Value 适合单个值；@ConfigurationProperties(prefix=\"xxx\") 支持批量绑定与校验。详见[《SpringBoot实战》](#/f/f22)\n\n### 17.（框架·易）SpringMVC 的前端核心控制器是＿＿＿。\n答案：DispatcherServlet\n解析：所有请求统一经过它分发到 HandlerMapping → HandlerAdapter → Controller。详见[《Spring核心》](#/f/f21)\n\n### 18.（分布式与高并发·中）Nacos 同时支持 AP 与＿＿＿两种模式，可按场景切换。\n答案：CP\n解析：临时实例走 AP（Distro 协议），持久实例走 CP（Raft）；ZK 是 CP，Eureka 是 AP。详见[《06-ZooKeeper与Nacos》](#/f/f18)\n\n### 19.（分布式与高并发·中）雪花算法依赖机器时钟，时钟回拨可能导致生成＿＿＿的 ID。\n答案：重复ID／ID重复／重复\n解析：兜底方案：等待追平、拒绝发号、使用备用机器 ID 或改用号段/Leaf 等方案。详见[《01-分布式理论基础》](#/f/f25)\n\n### 20.（分布式与高并发·中）秒杀系统中常用 Redis＋＿＿＿脚本原子地\"判断库存并扣减\"，防止超卖。\n答案：Lua／lua\n解析：多个 Redis 命令在 Lua 中原子执行，配合 MQ 异步落库完成秒杀主链路。详见[《02-高并发系统设计》](#/f/f26)\n\n### 21.（Java8·中）Stream 的中间操作是＿＿＿执行的，遇到终端操作才真正计算。\n答案：惰性／延迟\n解析：filter/map 等只记录操作，collect/forEach 触发才执行；这也是流只能被消费一次的原因。详见[《05-Lambda-Stream与Java8新特性》](#/f/f7)\n\n### 22.（网络·易）TCP 断开连接需要＿＿＿次挥手。\n答案：4／四\n解析：TCP 全双工，两个方向各需一次 FIN 和一次 ACK。详见[《03-IO模型与网络编程》](#/f/f10)\n\n### 23.（Nginx·中）Nginx 把动态请求转交给后端应用的核心指令是＿＿＿。\n答案：proxy_pass\n解析：写在 location 块中；静态资源用 root/alias，动静分离即由此组合实现。详见[《07-Nginx》](#/f/f19)\n\n### 24.（框架·中）Spring Cloud Gateway 中，定义\"哪些请求转发到哪个服务\"的配置叫＿＿＿规则。\n答案：路由／Route\n解析：路由 = 断言（Predicate，匹配条件）+ 过滤器（Filter，处理逻辑），是网关的核心抽象。详见[《SpringCloud微服务》](#/f/f24)\n\n### 25.（Elasticsearch·中）MySQL 与 ES 近实时同步，常用阿里开源的＿＿＿监听 binlog 异步写入 ES。\n答案：canal\n解析：canal 伪装成 MySQL 从库解析 binlog；其他方案还有同步双写与 MQ 异步，各有取舍。详见[《05-Elasticsearch》](#/f/f17)\n\n### 26.（MongoDB·易）MongoDB 中对应关系型数据库\"行\"的概念叫＿＿＿。\n答案：文档／document\n解析：集合 collection ≈ 表；文档以 BSON（二进制 JSON）存储。详见[《08-MongoDB》](#/f/f20)\n","ck":0},{"id":"f32","stage":7,"path":"07-面试篇/06-考点详略表.md","title":"06-考点详略表","md":"# 06-考点详略表\n\n> **阶段**：全部 ｜ **用法**：时间有限时按此表取舍精力。图例——🔴 **必考精通**：详学 + 亲手敲代码 + 面试题全过 + 能应对追问；🟡 **高频掌握**：懂原理 + 能讲清楚 + 小考通过即可；🟢 **了解即可**：有印象、能用一句话对比定位。配合应用「📖 章节小考」逐章验收、🟡 以下允许只看文档不写代码。\n\n## 一、面试权重总览\n\n| 阶段 | 面试权重 | 建议投入 | 说明 |\n|------|---------|---------|------|\n| ② 进阶篇（并发/JVM） | 🔴🔴 最高 | 全程 40% 力度 | 区分度最大，追问最深的板块 |\n| ④ 中间件篇 | 🔴 最高 | 全程 25% 力度 | 场景题主力（缓存/消息/搜索） |\n| ③ 数据库篇 | 🔴 最高 | 全程 15% 力度 | MySQL 几乎每场必问 |\n| ⑤ 框架篇 | 🔴 高 | 全程 12% 力度 | Spring 事务与自动配置是常客 |\n| ⑥ 分布式与高并发 | 🟡 高 | 全程 5% 力度 | 一二面考场景设计题 |\n| ① 入门篇 | 🟡 中 | 全程 3% 力度 | 地基，但面试问得浅（一面开场） |\n| ⑦ 面试篇 | 🔴 冲刺期主战场 | 最后 3~4 周 | 速查 + 题库 + 算法 + 简历 |\n\n## 二、各篇详略\n\n### ① 入门篇（整体 🟡）\n\n| 文件 | 定位 | 必须精通 🔴 | 了解即可 🟢 |\n|------|------|------------|------------|\n| 01-环境搭建与基础语法 | 🟡 地基 | JDK/JRE/JVM、值传递、基本类型 | 快捷键、二维数组细节 |\n| 02-面向对象与核心类 | 🟡 地基 | 三大特性、equals/hashCode、String 不可变、Integer 缓存 | 内部类细节、StringJoiner |\n| 03-集合与泛型 | 🔴 详学 | ArrayList 扩容、HashMap 全套（put/扩容/1.7vs1.8）、fail-fast | Vector/Stack、EnumMap |\n| 04-异常-IO-反射-注解 | 🟡 | 异常体系、反射原理与用途、动态代理 | 加密与安全、正则 |\n| 05-Lambda-Stream与Java8 | 🟡 | Stream 常用操作、map/flatMap、Optional | Nashorn、模块化细节 |\n\n### ② 进阶篇（整体 🔴🔴，面试区分度最大）\n\n| 文件 | 定位 | 必须精通 🔴 | 了解即可 🟢 |\n|------|------|------------|------------|\n| 01-多线程与并发编程 | 🔴🔴 | 线程池全套（7 参数/流程/拒绝策略/大小）、synchronized 与锁升级、volatile、ThreadLocal、ConcurrentHashMap、JMM 三性 | 虚拟线程、StampedLock |\n| 02-JVM核心 | 🔴🔴 | 内存区域、GC 判活与收集器（G1）、类加载与双亲委派、CPU 100%/OOM 排查流程 | ZGC 细节、逃逸分析 |\n| 03-IO模型与网络编程 | 🟡 | 三次握手/四次挥手、BIO/NIO/AIO 区别、零拷贝概念 | Netty 源码级细节、RMI |\n\n### ③ 数据库篇\n\n| 文件 | 定位 | 必须精通 🔴 | 了解即可 🟢 |\n|------|------|------------|------------|\n| 01-MySQL基础与SQL实战 | 🟡 | 连接查询、分组聚合、执行顺序（手写 SQL 要熟） | 存储过程、窗口函数 |\n| 02-索引-事务-锁与调优 | 🔴🔴 | B+ 树与回表/覆盖索引/最左前缀、隔离级别与 MVCC、三大日志、explain、慢 SQL 排查、分库分表思路 | 主从复制的字节级细节 |\n\n### ④ 中间件篇（场景题主战场）\n\n| 文件 | 定位 | 必须精通 🔴 | 了解即可 🟢 |\n|------|------|------------|------------|\n| 01-Redis | 🔴🔴 | 五大类型与场景、持久化、缓存穿透/击穿/雪崩、缓存一致性、分布式锁（Redisson）、哨兵/集群 | 模块（Module）、Stream 类型 |\n| 02-RabbitMQ | 🟡 | 消息不丢全链路（confirm/持久化/ACK/死信）、幂等消费、延迟队列 | 镜像/仲裁队列运维细节 |\n| 03-Kafka | 🟡 | 为什么快、分区与消费组、ACK/ISR、不丢不重 | Streams、Exactly-Once 事务细节 |\n| 04-RocketMQ | 🟡 | 事务消息流程、顺序/延迟消息、三大 MQ 选型对比 | 消息轨迹、Dledger 运维 |\n| 05-Elasticsearch | 🟡 | 倒排索引、与 MySQL 分工、DSL 基本查询、数据同步方案 | 深分页源码、分片路由细节 |\n| 06-ZooKeeper与Nacos | 🟡 | Watcher 与临时节点、CP/AP 取舍、Nacos 注册+配置热更新 | ZAB 选举细节 |\n| 07-Nginx | 🟢 略读 | 反向代理 vs 正向代理、负载均衡策略、动静分离 | OpenResty、内核级调优 |\n| 08-MongoDB | 🟢 略读 | 与 MySQL 的选型边界、文档模型 | 副本集/分片集群运维 |\n\n### ⑤ 框架篇\n\n| 文件 | 定位 | 必须精通 🔴 | 了解即可 🟢 |\n|------|------|------------|------------|\n| 01-Spring核心 | 🔴🔴 | IoC/AOP 原理、Bean 生命周期与循环依赖、@Transactional 失效场景、SpringMVC 流程 | 事件机制、SpEL |\n| 02-SpringBoot实战 | 🔴🔴 | 自动配置原理、统一返回/异常/校验三件套（项目要用） | Actuator 细节、自定义 starter 完整实现 |\n| 03-MyBatis | 🟡 | #{} vs ${}、一二级缓存、Mapper 动态代理原理、Plus 常用功能 | 插件开发、多数据源 |\n| 04-SpringCloud微服务 | 🟡 | 组件全景（注册/配置/网关/熔断）、Nacos 原理、Feign/网关/限流的概念与用法 | 链路追踪落地、Seata 细节（分布式篇补） |\n\n### ⑥ 分布式与高并发篇\n\n| 文件 | 定位 | 必须精通 🔴 | 了解即可 🟢 |\n|------|------|------------|------------|\n| 01-分布式理论基础 | 🟡 | CAP/BASE、一致性哈希、雪花算法与时钟回拨、三种分布式锁对比、分布式事务方案选型 | Paxos/Raft 推导 |\n| 02-高并发系统设计 | 🔴🔴 | 秒杀全链路（必考场景题）、限流四算法、缓存体系与一致性、分库分表问题清单 | 异地多活、单元化 |\n\n### ⑦ 面试篇（冲刺期全部 🔴）\n\n| 文件 | 定位 | 用法 |\n|------|------|------|\n| 01/02-八股速查 | 🔴 | 冲刺期每天过 1~2 个板块，全部打勾 |\n| 03-算法刷题路线 | 🔴 | 每天 2~3 题 + 手撕模板默写，总量 200 题 |\n| 04-简历与求职指南 | 🔴 | 简历定稿 + STAR 项目故事 + 各轮侧重 |\n| 05-选择填空题库 | 🔴 | 章节小考逐章清零 → 乱序全刷 → 只做错题 → 综合大考 ≥85% |\n| 本篇（详略表） | 🟡 | 每 2 周回顾一次，动态调整精力分配 |\n\n## 三、时间紧时的「最小可行知识面」\n\n只剩 1 个月时的取舍（按性价比排序，保住 80% 的面试得分点）：\n\n1. 🔴 并发：线程池 + synchronized/volatile + ThreadLocal + ConcurrentHashMap（2 天）\n2. 🔴 JVM：内存区域 + GC 基础 + 双亲委派 + 两条排查流程（2 天）\n3. 🔴 MySQL：B+ 树/回表/覆盖 + 隔离级别/MVCC + 三大日志 + explain（3 天）\n4. 🔴 Redis：五大类型 + 持久化 + 三兄弟 + 一致性 + 分布式锁（3 天）\n5. 🔴 Spring：IoC/AOP + Bean 生命周期 + 事务失效 + 自动配置（2 天）\n6. 🔴 场景题：秒杀设计 + 缓存一致性 + 消息不丢不重（2 天）\n7. 🟡 MQ 三选一精通（RocketMQ 优先，含事务消息），另外两个会选型对比（2 天）\n8. 🟡 算法：热题 100 的前 6 个专题 + 7 个手撕模板（贯穿每天）\n9. 🟢 其余（网络细节、Nginx、MongoDB、SpringCloud 组件细节）只看本指南对应文件的「高频面试题」部分\n\n## 四、与打卡和应用的联动\n\n- 每章学完 → 应用「📝 选择填空练习」→「📖 章节小考」选本章 → 正确率 90%+ 才过\n- 每个 🔴 文件 → STUDY-TRACKER 打卡全部勾完才算精通\n- 周末 → 「🏁 综合大考」20 题，正确率 <85% 时用「🔁 只做错题」+ 首页「薄弱环节」定位补漏\n- 本表每 2 周对照一次：已精通的降级为维持性复习，薄弱的升级投入\n","ck":0}],"cards":[{"id":"c0","cat":"Java 基础","q":"== 与 equals 的区别？","a":"== 比较栈里的值（基本类型比值、引用类型比地址），equals 默认同 ==，String 等重写后比较内容","ref":"f4","refTitle":"02-面向对象与核心类"},{"id":"c1","cat":"Java 基础","q":"为什么重写 equals 必须重写 hashCode？","a":"约定相等对象必须有相同哈希值，否则重写后两个\"相等\"对象在 HashMap 中会落到不同桶","ref":"f4","refTitle":"02-面向对象与核心类"},{"id":"c2","cat":"Java 基础","q":"String 为什么设计成不可变？","a":"private final 存储不暴露修改方法：安全性、hashCode 可缓存、字符串常量池复用","ref":"f4","refTitle":"02-面向对象与核心类"},{"id":"c3","cat":"Java 基础","q":"String、StringBuilder、StringBuffer 怎么选？","a":"常量用 String，单线程频繁拼接用 StringBuilder，多线程共享拼接用 StringBuffer","ref":"f4","refTitle":"02-面向对象与核心类"},{"id":"c4","cat":"Java 基础","q":"Integer 缓存机制？","a":"IntegerCache 缓存 -128~127，范围内 == 为 true，范围外必须用 equals，面试常挖箱拆箱 NPE","ref":"f4","refTitle":"02-面向对象与核心类"},{"id":"c5","cat":"Java 基础","q":"Java 是值传递还是引用传递？","a":"永远是值传递；传对象时复制的是引用值，方法内改属性生效、重新赋值不影响原对象","ref":"f4","refTitle":"02-面向对象与核心类"},{"id":"c6","cat":"Java 基础","q":"重载与重写的区别？","a":"重载是同类同名不同参（编译期确定），重写是子类覆盖父类同签名方法（运行期多态）","ref":"f4","refTitle":"02-面向对象与核心类"},{"id":"c7","cat":"Java 基础","q":"接口与抽象类的区别？","a":"抽象类表示\"是什么\"（单继承、可有状态），接口表示\"能做什么\"（多实现，Java 8 后可有 default/static 方法）","ref":"f4","refTitle":"02-面向对象与核心类"},{"id":"c8","cat":"Java 基础","q":"final 关键字有哪些用法？","a":"类不可继承、方法不可重写、变量不可重新赋值（引用不变但对象内容可变）","ref":"f4","refTitle":"02-面向对象与核心类"},{"id":"c9","cat":"Java 基础","q":"面向对象三大特性？","a":"封装隐藏细节、继承复用扩展、多态同一方法不同实现（编译看左边、运行看右边）","ref":"f4","refTitle":"02-面向对象与核心类"},{"id":"c10","cat":"Java 基础","q":"Java 异常体系？","a":"Throwable 下分 Error（OOM/StackOverflowError 不该捕获）与 Exception，后者分受检异常与运行时异常","ref":"f6","refTitle":"04-异常-IO-反射-注解"},{"id":"c11","cat":"Java 基础","q":"反射是什么？有什么用？","a":"运行期动态获取类信息并创建对象、调用方法，是 Spring IoC、MyBatis Mapper 等框架的底层基石","ref":"f6","refTitle":"04-异常-IO-反射-注解"},{"id":"c12","cat":"Java 基础","q":"注解的原理？","a":"@interface 本质是继承 Annotation 的接口，运行期靠反射读取元数据，Retention 决定保留到源码/字节码/运行期","ref":"f6","refTitle":"04-异常-IO-反射-注解"},{"id":"c13","cat":"Java 基础","q":"什么是泛型擦除？","a":"泛型只存在于编译期做类型检查，运行期 List\\<String\\> 与 List\\<Integer\\> 都是 List，桥接方法保证多态","ref":"f5","refTitle":"03-集合与泛型"},{"id":"c14","cat":"Java 基础","q":"static 关键字的用法？","a":"静态变量/方法/代码块/内部类都属于类而非实例，静态方法不能访问实例成员，加载时初始化","ref":"f3","refTitle":"01-环境搭建与基础语法"},{"id":"c15","cat":"Java 基础","q":"内部类有哪些？","a":"成员、静态、局部、匿名内部类；匿名内部类访问局部变量要求 effectively final","ref":"f6","refTitle":"04-异常-IO-反射-注解"},{"id":"c16","cat":"Java 基础","q":"BigDecimal 为什么能避免精度丢失？","a":"用\"无标度整数+标度\"精确表示十进制；金额计算必用，除法必须指定舍入模式与精度","ref":"f4","refTitle":"02-面向对象与核心类"},{"id":"c17","cat":"Java 基础","q":"Java 8 有哪些新特性？","a":"Lambda、函数式接口、Stream、Optional、接口 default 方法、新时间日期 API","ref":"f7","refTitle":"05-Lambda-Stream与Java8新特性"},{"id":"c18","cat":"Java 基础","q":"Stream 常用操作？","a":"中间操作 filter/map/sorted/flatMap 惰性执行，终端操作 collect/reduce/count/forEach 触发计算，只能消费一次","ref":"f7","refTitle":"05-Lambda-Stream与Java8新特性"},{"id":"c19","cat":"Java 基础","q":"Optional 解决什么问题？","a":"显式表达\"可能为空\"，用 map/orElse/ifPresent 链式处理减少 NPE，不建议用作字段","ref":"f7","refTitle":"05-Lambda-Stream与Java8新特性"},{"id":"c20","cat":"集合","q":"ArrayList 和 LinkedList 的区别？","a":"数组随机访问 O(1) vs 双向链表头尾插删 O(1)；实际绝大多数场景用 ArrayList（CPU 缓存友好、无指针开销）","ref":"f5","refTitle":"03-集合与泛型"},{"id":"c21","cat":"集合","q":"ArrayList 扩容机制？","a":"首次 add 创建容量 10，超出后扩为 1.5 倍并 Arrays.copyOf 拷贝；能预估数据量就指定初始容量","ref":"f5","refTitle":"03-集合与泛型"},{"id":"c22","cat":"集合","q":"HashMap 底层数据结构？","a":"1.8 起数组+链表+红黑树：链表长度 ≥8 且数组长度 ≥64 转红黑树，节点减到 6 退化回链表","ref":"f5","refTitle":"03-集合与泛型"},{"id":"c23","cat":"集合","q":"HashMap 的 put 流程？","a":"计算 hash 定位桶 → 空桶直接放 → 链表尾插或树插入 → key 已存在则覆盖 → 超过阈值扩容","ref":"f5","refTitle":"03-集合与泛型"},{"id":"c24","cat":"集合","q":"HashMap 扩容机制？","a":"容量翻倍、负载因子 0.75；1.8 优化：元素要么留在原索引，要么移到\"原索引+旧容量\"位置","ref":"f5","refTitle":"03-集合与泛型"},{"id":"c25","cat":"集合","q":"HashMap 1.7 和 1.8 的区别？","a":"1.7 头插法+纯链表（并发扩容可能成环死循环），1.8 尾插法+红黑树+扩容高位拆分优化","ref":"f5","refTitle":"03-集合与泛型"},{"id":"c26","cat":"集合","q":"HashMap 容量为什么是 2 的幂？","a":"使 (n-1) & hash 等价于取模且位运算更快，同时保证散列均匀","ref":"f5","refTitle":"03-集合与泛型"},{"id":"c27","cat":"集合","q":"HashSet 如何去重？","a":"底层就是 HashMap，元素作 key，add 时先比 hashCode 再比 equals","ref":"f5","refTitle":"03-集合与泛型"},{"id":"c28","cat":"集合","q":"ConcurrentHashMap 1.8 的实现原理？","a":"CAS 初始化 + synchronized 锁单个桶头节点，扩容支持多线程协助迁移，size 用 CounterCell 分散计数","ref":"f5","refTitle":"03-集合与泛型"},{"id":"c29","cat":"集合","q":"fail-fast 与 fail-safe？","a":"遍历中结构被改抛 ConcurrentModificationException（modCount 校验）；CopyOnWrite 系列是 fail-safe 的快照遍历","ref":"f5","refTitle":"03-集合与泛型"},{"id":"c30","cat":"集合","q":"遍历集合时如何安全删除元素？","a":"用 Iterator.remove() 或 removeIf()，不能在 for-each 中直接 list.remove()","ref":"f5","refTitle":"03-集合与泛型"},{"id":"c31","cat":"集合","q":"TreeMap 的底层与使用场景？","a":"红黑树实现，key 有序，支持范围查询与首个/最后一个元素，需自然排序或 Comparator","ref":"f5","refTitle":"03-集合与泛型"},{"id":"c32","cat":"集合","q":"List/Set/Queue/Map 怎么选型？","a":"有序可重复选 List、去重选 Set、先进先出/优先级选 Queue、键值映射选 Map，再看是否需要排序与并发","ref":"f5","refTitle":"03-集合与泛型"},{"id":"c33","cat":"集合","q":"ArrayList 线程安全吗？怎么解决？","a":"不安全；Vector 已过时，读多写少用 CopyOnWriteArrayList，或 Collections.synchronizedList","ref":"f8","refTitle":"01-多线程与并发编程"},{"id":"c34","cat":"集合","q":"Comparable 与 Comparator 的区别？","a":"Comparable 在类内部定义自然排序（compareTo），Comparator 外部定制排序规则（compare），后者可多套并存","ref":"f5","refTitle":"03-集合与泛型"},{"id":"c35","cat":"并发","q":"创建线程有几种方式？","a":"本质都是 new Thread 传 Runnable（Callable 配 FutureTask 可拿返回值）；生产环境一律用线程池","ref":"f8","refTitle":"01-多线程与并发编程"},{"id":"c36","cat":"并发","q":"线程有哪些状态？","a":"NEW/RUNNABLE/BLOCKED/WAITING/TIMED_WAITING/TERMINATED 六种，常追问 wait 与 sleep 的区别","ref":"f8","refTitle":"01-多线程与并发编程"},{"id":"c37","cat":"并发","q":"synchronized 的底层原理？","a":"基于对象头 Mark Word 与 monitor（monitorenter/monitorexit 字节码指令），锁状态记录在对象头","ref":"f8","refTitle":"01-多线程与并发编程"},{"id":"c38","cat":"并发","q":"锁升级过程？","a":"无锁 → 偏向锁 → 轻量级锁（CAS 自旋）→ 重量级锁（monitor 阻塞），偏向锁在 JDK 15 后已废弃","ref":"f8","refTitle":"01-多线程与并发编程"},{"id":"c39","cat":"并发","q":"volatile 的作用？","a":"保证可见性（写立即刷主存、读失效本地缓存）与有序性（内存屏障禁重排），**不保证原子性**","ref":"f8","refTitle":"01-多线程与并发编程"},{"id":"c40","cat":"并发","q":"JMM（Java 内存模型）是什么？","a":"主内存+工作内存的抽象，定义 happens-before 规则，解决多线程的可见性与有序性问题","ref":"f8","refTitle":"01-多线程与并发编程"},{"id":"c41","cat":"并发","q":"CAS 的原理与问题？","a":"CPU 原子比较交换指令；存在 ABA（用 AtomicStampedReference 加版本号）与自旋空转问题","ref":"f8","refTitle":"01-多线程与并发编程"},{"id":"c42","cat":"并发","q":"一句话说清 AQS？","a":"抽象队列同步器：volatile 的 state + CLH 变体等待队列 + 模板方法，ReentrantLock/Semaphore/CountDownLatch 的共同基石","ref":"f8","refTitle":"01-多线程与并发编程"},{"id":"c43","cat":"并发","q":"ReentrantLock 与 synchronized 的区别？","a":"支持可中断、tryLock 超时、公平锁、多个 Condition；JDK 6 后性能相当，简单场景仍用 synchronized","ref":"f8","refTitle":"01-多线程与并发编程"},{"id":"c44","cat":"并发","q":"公平锁与非公平锁？","a":"公平锁按队列顺序获取防饥饿；非公平锁允许新请求直接插队，吞吐更高，ReentrantLock 默认非公平","ref":"f8","refTitle":"01-多线程与并发编程"},{"id":"c45","cat":"并发","q":"线程池的 7 个参数？","a":"corePoolSize、maximumPoolSize、keepAliveTime、unit、workQueue、threadFactory、handler","ref":"f8","refTitle":"01-多线程与并发编程"},{"id":"c46","cat":"并发","q":"线程池的任务执行流程？","a":"先填核心线程 → 满了入队列 → 队列满了开非核心线程 → 到 maximum 后触发拒绝策略（注意\"先排队再扩容\"）","ref":"f8","refTitle":"01-多线程与并发编程"},{"id":"c47","cat":"并发","q":"四种拒绝策略？","a":"AbortPolicy 抛异常（默认）、CallerRunsPolicy 调用者线程执行、DiscardPolicy 静默丢弃、DiscardOldestPolicy 丢最旧任务","ref":"f8","refTitle":"01-多线程与并发编程"},{"id":"c48","cat":"并发","q":"线程池大小怎么定？","a":"经验公式 CPU 密集 N+1、IO 密集 N×(1+等待时间/计算时间)，最终靠压测校准，不建议 unbounded 队列","ref":"f8","refTitle":"01-多线程与并发编程"},{"id":"c49","cat":"并发","q":"ThreadLocal 原理与内存泄漏？","a":"每个 Thread 内有 ThreadLocalMap，key 是弱引用、value 是强引用，用完必须 remove() 防止 value 泄漏","ref":"f8","refTitle":"01-多线程与并发编程"},{"id":"c50","cat":"并发","q":"CountDownLatch/CyclicBarrier/Semaphore 的区别？","a":"一次性倒数开门 / 可复用的集体等齐 / 控制并发数（permits），三者都基于 AQS","ref":"f8","refTitle":"01-多线程与并发编程"},{"id":"c51","cat":"并发","q":"死锁的产生条件与排查？","a":"互斥、请求与保持、不可剥夺、循环等待四个必要条件；jstack 可直接检测出死锁","ref":"f8","refTitle":"01-多线程与并发编程"},{"id":"c52","cat":"并发","q":"CompletableFuture 怎么用？","a":"supplyAsync/thenApply/thenCompose/allOf 做异步编排与结果组合，注意默认线程池与异常传播","ref":"f8","refTitle":"01-多线程与并发编程"},{"id":"c53","cat":"并发","q":"ConcurrentHashMap 并发 put 为什么安全？","a":"1.8 用 CAS 初始化 + 对桶头节点 synchronized，锁粒度到单个桶；get 无锁靠 volatile","ref":"f8","refTitle":"01-多线程与并发编程"},{"id":"c54","cat":"并发","q":"虚拟线程是什么？","a":"JDK 21 正式特性：由 JVM 调度的轻量线程，阻塞时不占用 OS 线程，可创建百万级，适合 IO 密集场景","ref":"f8","refTitle":"01-多线程与并发编程"},{"id":"c55","cat":"JVM","q":"JVM 内存区域划分？","a":"线程私有：虚拟机栈、本地方法栈、程序计数器；线程共享：堆、方法区（JDK 8 后由元空间实现）","ref":"f9","refTitle":"02-JVM核心"},{"id":"c56","cat":"JVM","q":"对象的创建过程？","a":"类加载检查 → 分配内存（TLAB/指针碰撞）→ 零值初始化 → 设置对象头 → 执行构造函数","ref":"f9","refTitle":"02-JVM核心"},{"id":"c57","cat":"JVM","q":"GC Roots 有哪些？","a":"栈帧局部变量、静态变量、常量引用、JNI 引用、活跃线程等，是可达性分析的起点","ref":"f9","refTitle":"02-JVM核心"},{"id":"c58","cat":"JVM","q":"四种引用的区别？","a":"强引用不回收；软引用内存不足才回收（缓存）；弱引用下次 GC 必回收（ThreadLocal key）；虚引用仅用于跟踪回收","ref":"f9","refTitle":"02-JVM核心"},{"id":"c59","cat":"JVM","q":"三种基础 GC 算法？","a":"标记-清除（有碎片）、标记-复制（新生代，浪费空间）、标记-整理（老年代，移动对象慢）","ref":"f9","refTitle":"02-JVM核心"},{"id":"c60","cat":"JVM","q":"分代收集的设计？","a":"新生代 Eden:Survivor:Survivor = 8:1:1 用复制算法，对象熬过 15 次 GC（默认）晋升老年代用标记整理","ref":"f9","refTitle":"02-JVM核心"},{"id":"c61","cat":"JVM","q":"Minor GC 和 Full GC 的区别？","a":"Minor 只清新生代、STW 短且频繁；Full GC 清整堆+元空间、STW 长，是性能优化的头号目标","ref":"f9","refTitle":"02-JVM核心"},{"id":"c62","cat":"JVM","q":"对象什么时候进入老年代？","a":"年龄达阈值（默认 15）、大对象直接进入、动态年龄判断、Survivor 放不下","ref":"f9","refTitle":"02-JVM核心"},{"id":"c63","cat":"JVM","q":"CMS 的原理与问题？","a":"并发标记-清除收集器，四阶段中标记可并发；产生内存碎片、并发失败退化为 Serial Old，已在新版移除","ref":"f9","refTitle":"02-JVM核心"},{"id":"c64","cat":"JVM","q":"G1 的原理？","a":"堆划分为多个 Region，按\"停顿时间目标\"优先回收垃圾最多的 Region（Mixed GC），JDK 9 起默认","ref":"f9","refTitle":"02-JVM核心"},{"id":"c65","cat":"JVM","q":"ZGC 的特点？","a":"着色指针+读屏障实现并发整理，停顿 <1ms 且与堆大小无关，适合超大堆低延迟场景","ref":"f9","refTitle":"02-JVM核心"},{"id":"c66","cat":"JVM","q":"类加载过程？","a":"加载 → 验证 → 准备（静态变量赋零值）→ 解析 → 初始化（执行 \\<clinit\\>），五步常按\"什么时候触发初始化\"追问","ref":"f9","refTitle":"02-JVM核心"},{"id":"c67","cat":"JVM","q":"双亲委派模型？","a":"类加载请求逐级向上委托（自定义 → 应用 → 扩展 → 启动），保证核心类安全与唯一；打破场景：SPI、热部署、Tomcat 隔离","ref":"f9","refTitle":"02-JVM核心"},{"id":"c68","cat":"JVM","q":"CPU 飙到 100% 怎么排查？","a":"top 找进程 → top -Hp 找线程 → printf '%x' 转十六进制 → jstack 中按 nid 定位到代码行","ref":"f9","refTitle":"02-JVM核心"},{"id":"c69","cat":"JVM","q":"OOM 怎么排查？","a":"启动加 -XX:+HeapDumpOnOutOfMemoryError 拿堆转储 → MAT/jvisualvm 分析支配树与大对象 → 沿引用链定位泄漏代码","ref":"f9","refTitle":"02-JVM核心"},{"id":"c70","cat":"Spring/SpringBoot","q":"什么是 IoC 和 DI？","a":"IoC 把对象创建与依赖管理交给容器（控制反转），DI 是实现手段：构造器/setter/字段注入","ref":"f21","refTitle":"Spring核心"},{"id":"c71","cat":"Spring/SpringBoot","q":"Bean 的生命周期？","a":"实例化 → 属性填充 → Aware 回调 → BeanPostProcessor 前置 → 初始化（@PostConstruct/afterPropertiesSet）→ 后置处理 → 销毁","ref":"f21","refTitle":"Spring核心"},{"id":"c72","cat":"Spring/SpringBoot","q":"三级缓存如何解决循环依赖？","a":"成品池/早期引用池/工厂池三步走，只能解决单例 + setter 注入的循环依赖，构造器依赖无解","ref":"f21","refTitle":"Spring核心"},{"id":"c73","cat":"Spring/SpringBoot","q":"Bean 的作用域？","a":"singleton（默认，容器单例）、prototype（每次新建）、request/session 等 Web 作用域","ref":"f21","refTitle":"Spring核心"},{"id":"c74","cat":"Spring/SpringBoot","q":"AOP 的原理？","a":"运行期动态代理织入横切逻辑：目标类有接口走 JDK 动态代理，无接口走 CGLIB 子类代理","ref":"f21","refTitle":"Spring核心"},{"id":"c75","cat":"Spring/SpringBoot","q":"JDK 动态代理与 CGLIB 的区别？","a":"JDK 基于接口反射实现代理，CGLIB 生成子类字节码；final 类/方法无法被 CGLIB 代理","ref":"f21","refTitle":"Spring核心"},{"id":"c76","cat":"Spring/SpringBoot","q":"Spring 事务的传播行为？","a":"REQUIRED（默认，有事务则加入）、REQUIRES_NEW（挂起当前另开新事务）、NESTED（嵌套保存点）等 7 种","ref":"f21","refTitle":"Spring核心"},{"id":"c77","cat":"Spring/SpringBoot","q":"Spring 事务失效的场景？","a":"自调用（this 绕过代理）、方法非 public、异常被 catch 吞掉、默认只回滚 RuntimeException、引擎不支持事务","ref":"f21","refTitle":"Spring核心"},{"id":"c78","cat":"Spring/SpringBoot","q":"SpringMVC 的执行流程？","a":"请求到 DispatcherServlet → HandlerMapping 找处理器 → HandlerAdapter 调用 Controller → 返回视图渲染","ref":"f21","refTitle":"Spring核心"},{"id":"c79","cat":"Spring/SpringBoot","q":"SpringBoot 自动配置原理？","a":"@EnableAutoConfiguration 读取 AutoConfiguration.imports 文件，配合 @ConditionalOnClass 等条件注解按需装配","ref":"f22","refTitle":"SpringBoot实战"},{"id":"c80","cat":"Spring/SpringBoot","q":"starter 是什么？","a":"依赖聚合 + 自动配置的封装，引入即用；自定义 starter = 自动配置模块 + starter 空壳依赖","ref":"f22","refTitle":"SpringBoot实战"},{"id":"c81","cat":"Spring/SpringBoot","q":"@Autowired 和 @Resource 的区别？","a":"@Autowired 是 Spring 的，先按类型后按名称；@Resource 是 JSR-250 的，先按名称后按类型","ref":"f22","refTitle":"SpringBoot实战"},{"id":"c82","cat":"Spring/SpringBoot","q":"@ConfigurationProperties 与 @Value 怎么选？","a":"前者批量绑定前缀配置、类型安全、支持校验；后者适合单个值，支持 SpEL","ref":"f22","refTitle":"SpringBoot实战"},{"id":"c83","cat":"Spring/SpringBoot","q":"@Configuration 与 @Component 的区别？","a":"@Configuration 类被 CGLIB 代理，@Bean 方法互调仍走容器保证单例；@Component 下互调会 new 新对象","ref":"f21","refTitle":"Spring核心"},{"id":"c84","cat":"Spring/SpringBoot","q":"BeanFactory 和 FactoryBean 的区别？","a":"BeanFactory 是容器顶层接口；FactoryBean 是\"生产 Bean 的 Bean\"，用于封装复杂对象的构建（如 SqlSessionFactoryBean）","ref":"f21","refTitle":"Spring核心"},{"id":"c85","cat":"MyBatis","q":"#{} 和 ${} 的区别？","a":"#{} 是预编译占位符防 SQL 注入；${} 是字符串拼接，只用于动态表名/列名等受控场景","ref":"f23","refTitle":"MyBatis"},{"id":"c86","cat":"MyBatis","q":"一级缓存与二级缓存？","a":"一级是 SqlSession 级默认开启；二级是 namespace 级需手动开启，跨会话共享，分布式下易脏读生产慎用","ref":"f23","refTitle":"MyBatis"},{"id":"c87","cat":"MyBatis","q":"Mapper 接口没有实现类为什么能执行 SQL？","a":"JDK 动态代理 MapperProxy 拦截方法调用，接口全限定名+方法名映射到 XML 的 statement id","ref":"f23","refTitle":"MyBatis"},{"id":"c88","cat":"MyBatis","q":"常用动态 SQL 标签？","a":"if/where/choose/when/otherwise/set/foreach/trim，用于条件拼接与批量插入","ref":"f23","refTitle":"MyBatis"},{"id":"c89","cat":"MyBatis","q":"resultMap 什么时候用？","a":"列名与属性名不一致、一对一/一对多关联映射、自定义类型转换时使用","ref":"f23","refTitle":"MyBatis"},{"id":"c90","cat":"MyBatis","q":"MyBatis 的分页方案？","a":"RowBounds 是内存逻辑分页（全查再截取，有 OOM 风险）；生产用 PageHelper 物理分页（改写 SQL 加 LIMIT）","ref":"f23","refTitle":"MyBatis"},{"id":"c91","cat":"MyBatis","q":"MyBatis-Plus 有哪些特性？","a":"BaseMapper 通用 CRUD、Wrapper 条件构造器、分页/乐观锁插件、自动填充、代码生成器","ref":"f23","refTitle":"MyBatis"},{"id":"c92","cat":"MyBatis","q":"MyBatis 和 JPA 怎么选？","a":"SQL 需要精细控制、复杂查询多选 MyBatis（国内主流）；标准 CRUD 快速开发选 JPA/Hibernate","ref":"f23","refTitle":"MyBatis"},{"id":"c93","cat":"MySQL","q":"为什么用 B+ 树而不是 B 树/哈希/红黑树？","a":"矮胖 3 层可存千万级数据、叶子链表支持范围查询；哈希不支持范围，红黑树/AVL 树太高 IO 次数多","ref":"f12","refTitle":"索引-事务-锁与调优"},{"id":"c94","cat":"MySQL","q":"聚簇索引与二级索引的区别？","a":"聚簇索引叶子存整行数据（InnoDB 必有，默认主键），二级索引叶子存主键值","ref":"f12","refTitle":"索引-事务-锁与调优"},{"id":"c95","cat":"MySQL","q":"什么是回表？","a":"用二级索引只拿到主键，还要回聚簇索引再查一次整行；查询列都在索引里则免回表","ref":"f12","refTitle":"索引-事务-锁与调优"},{"id":"c96","cat":"MySQL","q":"什么是覆盖索引？","a":"查询所需列全部包含在索引中，无需回表；是\"只查需要的列\"与联合索引设计的核心依据","ref":"f12","refTitle":"索引-事务-锁与调优"},{"id":"c97","cat":"MySQL","q":"最左前缀原则？","a":"联合索引 (a,b,c) 必须从 a 开始连续命中才走索引，遇到范围查询后索引列失效","ref":"f12","refTitle":"索引-事务-锁与调优"},{"id":"c98","cat":"MySQL","q":"索引失效的常见场景？","a":"索引列上函数/运算、隐式类型转换、前导 % 模糊、or 连接非索引列、违反最左前缀、优化器认为全表更快","ref":"f12","refTitle":"索引-事务-锁与调优"},{"id":"c99","cat":"MySQL","q":"explain 主要看哪些字段？","a":"type（至少 range，理想 ref/const）、key（实际用的索引）、rows（预估扫描行数）、Extra（出现 Using filesort/Using temporary 要优化）","ref":"f12","refTitle":"索引-事务-锁与调优"},{"id":"c100","cat":"MySQL","q":"ACID 分别靠什么实现？","a":"原子性靠 undo log、持久性靠 redo log、隔离性靠锁+MVCC、一致性是前三者共同保障的结果","ref":"f12","refTitle":"索引-事务-锁与调优"},{"id":"c101","cat":"MySQL","q":"四种隔离级别？","a":"读未提交 → 读已提交（解决脏读）→ 可重复读（InnoDB 默认，解决不可重复读）→ 串行化；InnoDB 的 RR 用 MVCC+间隙锁基本杜绝幻读","ref":"f12","refTitle":"索引-事务-锁与调优"},{"id":"c102","cat":"MySQL","q":"MVCC 的原理？","a":"隐藏字段 trx_id/roll_pointer + undo log 版本链 + ReadView 可见性判断；RC 每次查询生成 ReadView，RR 事务内复用第一次的","ref":"f12","refTitle":"索引-事务-锁与调优"},{"id":"c103","cat":"MySQL","q":"三大日志的作用？","a":"redo log 保证崩溃恢复（WAL、循环写）、undo log 支持回滚与 MVCC、binlog 用于主从复制与数据恢复（Server 层、追加写）","ref":"f12","refTitle":"索引-事务-锁与调优"},{"id":"c104","cat":"MySQL","q":"redo log 和 binlog 的区别？","a":"层级（InnoDB vs Server）、形态（循环写 vs 追加写）、用途（崩溃恢复 vs 复制/恢复）都不同；两阶段提交保证两者一致","ref":"f12","refTitle":"索引-事务-锁与调优"},{"id":"c105","cat":"MySQL","q":"InnoDB 有哪些锁？","a":"行锁（记录锁/间隙锁/临键锁）、表锁、意向锁；行锁是加在索引上的，无索引条件更新会升级为全表扫描锁住大量记录","ref":"f12","refTitle":"索引-事务-锁与调优"},{"id":"c106","cat":"MySQL","q":"慢 SQL 怎么排查优化？","a":"慢查询日志定位 → explain 分析执行计划 → 优化索引/改写 SQL/覆盖索引 → 数据量太大再考虑分库分表","ref":"f12","refTitle":"索引-事务-锁与调优"},{"id":"c107","cat":"MySQL","q":"分库分表怎么拆？","a":"先垂直（按业务拆库、大字段拆表）再水平（按分片键散列行）；分片键要满足高频查询条件且分布均匀","ref":"f12","refTitle":"索引-事务-锁与调优"},{"id":"c108","cat":"MySQL","q":"分库分表带来哪些问题？","a":"跨片 join/分页/聚合困难、跨库事务、全局唯一 ID、扩容数据迁移；能用缓存/ES 撑住就别急着拆","ref":"f26","refTitle":"02-高并发系统设计"},{"id":"c109","cat":"MySQL","q":"深分页怎么优化？","a":"`LIMIT 1000000,10` 要扫描并丢弃前 100 万行；改成游标（WHERE id > 上次最大值）、子查询先定位 id、或覆盖索引","ref":"f12","refTitle":"索引-事务-锁与调优"},{"id":"c110","cat":"MySQL","q":"inner join / left join / right join 的区别？","a":"inner 取两表交集；left 保留左表全部行、右表无匹配补 NULL；right 相反","ref":"f11","refTitle":"MySQL基础与SQL实战"},{"id":"c111","cat":"MySQL","q":"char 与 varchar 的区别？","a":"char 定长、空间换性能、适合定长数据（手机号/MD5）；varchar 变长、多 1~2 字节长度头，按实际长度存储","ref":"f11","refTitle":"MySQL基础与SQL实战"},{"id":"c112","cat":"MySQL","q":"drop、delete、truncate 的区别？","a":"drop 删表结构与数据；delete 逐行删、可回滚、可带 where；truncate 清空全表重置自增，属 DDL 不可回滚","ref":"f11","refTitle":"MySQL基础与SQL实战"},{"id":"c113","cat":"Redis","q":"Redis 为什么快？","a":"纯内存操作 + 命令执行单线程（无锁无切换）+ epoll IO 多路复用 + 针对场景优化的数据结构","ref":"f13","refTitle":"01-Redis"},{"id":"c114","cat":"Redis","q":"五种基本类型与使用场景？","a":"String 缓存/计数/分布式锁，Hash 对象属性，List 队列/时间线，Set 去重/抽奖/交并集，ZSet 排行榜/延迟队列","ref":"f13","refTitle":"01-Redis"},{"id":"c115","cat":"Redis","q":"RDB 与 AOF 怎么选？","a":"RDB 快照恢复快、可能丢最后一次快照后的数据；AOF 追加日志丢得少但文件大；4.0 混合持久化（RDB 底座+AOF 增量）兼得","ref":"f13","refTitle":"01-Redis"},{"id":"c116","cat":"Redis","q":"过期删除策略？","a":"惰性删除（访问时检查）+ 定期删除（随机抽检）组合，内存超限再触发淘汰策略","ref":"f13","refTitle":"01-Redis"},{"id":"c117","cat":"Redis","q":"内存淘汰策略？","a":"默认 noeviction 写报错；缓存场景用 allkeys-lru，含过期集合维度有 volatile-lru/lfu 等 8 种","ref":"f13","refTitle":"01-Redis"},{"id":"c118","cat":"Redis","q":"缓存穿透及解决？","a":"查询**不存在**的数据每次都打穿到 DB；空值缓存、布隆过滤器、入口参数校验","ref":"f13","refTitle":"01-Redis"},{"id":"c119","cat":"Redis","q":"缓存击穿及解决？","a":"单个**热点 key 过期瞬间**大量请求直击 DB；互斥锁重建、逻辑过期不删 key、热点数据不过期","ref":"f13","refTitle":"01-Redis"},{"id":"c120","cat":"Redis","q":"缓存雪崩及解决？","a":"**大量 key 同时失效**或 Redis 宕机；TTL 加随机值、多级缓存、集群高可用、限流降级兜底","ref":"f13","refTitle":"01-Redis"},{"id":"c121","cat":"Redis","q":"缓存与数据库一致性？","a":"Cache Aside 先更新 DB 再删除缓存 + 失败重试；要求更高用延迟双删；终极方案 canal 订阅 binlog 异步删缓存","ref":"f13","refTitle":"01-Redis"},{"id":"c122","cat":"Redis","q":"用 Redis 写分布式锁要注意什么？","a":"`SET key uniqueValue NX EX` 原子加锁；value 存唯一标识防误删；解锁用 Lua 校验后删除","ref":"f13","refTitle":"01-Redis"},{"id":"c123","cat":"Redis","q":"Redisson 分布式锁的原理？","a":"Lua 加解锁 + Hash 结构记录持有线程与重入次数；看门狗默认 30 秒锁、每 10 秒续期，解决业务超时锁先过期","ref":"f13","refTitle":"01-Redis"},{"id":"c124","cat":"Redis","q":"主从复制的流程？","a":"首次全量同步（主库生成 RDB 传给从库）+ 复制缓冲区增量，之后命令异步传播；读写分离依赖它","ref":"f13","refTitle":"01-Redis"},{"id":"c125","cat":"Redis","q":"哨兵的作用？","a":"监控主库、通知运维、自动故障转移（选新主）、充当配置中心；至少 3 个哨兵节点防止误判与脑裂","ref":"f13","refTitle":"01-Redis"},{"id":"c126","cat":"Redis","q":"Cluster 集群的原理？","a":"16384 个槽位按 CRC16 分片到各主节点，客户端请求错位收 MOVED 重定向；gossip 协议通信，主从自动切换","ref":"f13","refTitle":"01-Redis"},{"id":"c127","cat":"Redis","q":"大 key 与热 key 怎么处理？","a":"大 key：拆分成多个 key、用 UNLINK 异步删除、避免集合过大；热 key：本地缓存兜底、副本打散、限流","ref":"f13","refTitle":"01-Redis"},{"id":"c128","cat":"消息队列","q":"消息队列的三大作用？","a":"异步（缩短响应时间）、解耦（生产者消费者互不依赖）、削峰（洪峰进队列匀速消费）","ref":"f14","refTitle":"02-RabbitMQ"},{"id":"c129","cat":"消息队列","q":"RabbitMQ 的四种交换机？","a":"direct 精确匹配、fanout 广播、topic 通配符匹配、headers 按头部匹配；业务路由多用 topic","ref":"f14","refTitle":"02-RabbitMQ"},{"id":"c130","cat":"消息队列","q":"RabbitMQ 如何保证消息不丢？","a":"三段：生产者 confirm 确认、交换机/队列/消息持久化、消费者手动 ack，任一环节失败可重发","ref":"f14","refTitle":"02-RabbitMQ"},{"id":"c131","cat":"消息队列","q":"死信队列是什么？","a":"消息被拒绝/过期/队列满时路由到 DLX；用途是异常消息兜底，以及 TTL+死信实现延迟队列","ref":"f14","refTitle":"02-RabbitMQ"},{"id":"c132","cat":"消息队列","q":"Kafka 为什么快？","a":"顺序写磁盘+页缓存、零拷贝 sendfile、批量发送与压缩、分区并行消费","ref":"f15","refTitle":"03-Kafka"},{"id":"c133","cat":"消息队列","q":"Kafka 的 ACK 机制？","a":"0 不等待、1 主分区落盘即确认、all（-1）等 ISR 全部确认；可靠性要求高用 all + retries","ref":"f15","refTitle":"03-Kafka"},{"id":"c134","cat":"消息队列","q":"ISR 是什么？","a":"与 leader 保持同步的副本集合（含 leader），落后超过阈值被踢出；all ACK 只等 ISR 成员，兼顾可靠与性能","ref":"f15","refTitle":"03-Kafka"},{"id":"c135","cat":"消息队列","q":"消费组与 rebalance？","a":"组内消费者分摊分区且一个分区只归一个消费者；成员增减触发重平衡，期间会停止消费且可能重复消费","ref":"f15","refTitle":"03-Kafka"},{"id":"c136","cat":"消息队列","q":"Kafka 怎么保证消息顺序？","a":"只保证分区内有序；需要顺序的业务按 key 路由到同一分区，消费端单线程处理该分区","ref":"f15","refTitle":"03-Kafka"},{"id":"c137","cat":"消息队列","q":"RocketMQ 事务消息的原理？","a":"半消息（消费者不可见）→ 执行本地事务 → 提交/回滚半消息；Broker 定时回查事务状态兜底","ref":"f16","refTitle":"04-RocketMQ"},{"id":"c138","cat":"消息队列","q":"重复消费怎么办（幂等）？","a":"MQ 是至少一次投递，重复不可避免；消费端用唯一业务键 + 去重表/Redis SETNX/状态机校验实现幂等","ref":"f16","refTitle":"04-RocketMQ"},{"id":"c139","cat":"消息队列","q":"RabbitMQ/Kafka/RocketMQ 怎么选型？","a":"RabbitMQ 低延迟、功能全、适合中小业务；Kafka 吞吐王、适合日志与大数据；RocketMQ 电商业务（事务/延迟/顺序消息全支持）","ref":"f16","refTitle":"04-RocketMQ"},{"id":"c140","cat":"Elasticsearch/ZooKeeper/Nacos","q":"什么是倒排索引？","a":"分词后建立\"词项 → 文档列表\"的映射，查询按词直达文档，FST 结构压缩词典，这是全文检索快的根本","ref":"f17","refTitle":"05-Elasticsearch"},{"id":"c141","cat":"Elasticsearch/ZooKeeper/Nacos","q":"ES 和 MySQL 的分工？","a":"MySQL 是事务主存（写入源），ES 做检索与聚合的查询副本；各司其职而非互相替代","ref":"f17","refTitle":"05-Elasticsearch"},{"id":"c142","cat":"Elasticsearch/ZooKeeper/Nacos","q":"match 与 term 的区别？","a":"match 对查询词分词后做全文匹配打分；term 不分词做精确匹配；bool 组合 must/should/filter（filter 不算分且可缓存）","ref":"f17","refTitle":"05-Elasticsearch"},{"id":"c143","cat":"Elasticsearch/ZooKeeper/Nacos","q":"ES 的深分页问题？","a":"from+size 每个分片都要取 from+size 条排序，默认限制 1 万；翻页深用 search_after 游标，全量导出用 scroll","ref":"f17","refTitle":"05-Elasticsearch"},{"id":"c144","cat":"Elasticsearch/ZooKeeper/Nacos","q":"text 和 keyword 类型的区别？","a":"text 分词、参与相关性打分，用于全文搜索；keyword 不分词、整体匹配，用于精确过滤与聚合排序","ref":"f17","refTitle":"05-Elasticsearch"},{"id":"c145","cat":"Elasticsearch/ZooKeeper/Nacos","q":"MySQL 数据怎么同步到 ES？","a":"主流用 canal 监听 binlog → 发 MQ → 消费写入 ES，解耦且不侵入业务；代码双写是简易方案但有一致性风险","ref":"f17","refTitle":"05-Elasticsearch"},{"id":"c146","cat":"Elasticsearch/ZooKeeper/Nacos","q":"ZooKeeper 的应用场景？","a":"分布式锁、注册中心、配置中心、Master 选举；本质是基于\"文件系统 + Watcher\"的协调服务","ref":"f18","refTitle":"06-ZooKeeper与Nacos"},{"id":"c147","cat":"Elasticsearch/ZooKeeper/Nacos","q":"Watcher 机制的特点？","a":"一次性触发（触发后需重新注册）、轻量（只推事件类型不推数据）、顺序性（客户端先收到事件再看到新数据）","ref":"f18","refTitle":"06-ZooKeeper与Nacos"},{"id":"c148","cat":"Elasticsearch/ZooKeeper/Nacos","q":"临时节点与顺序节点？","a":"临时节点随会话断开自动删除（服务发现/锁的基石）；顺序节点由 ZK 追加序号保证全局有序（锁排队）","ref":"f18","refTitle":"06-ZooKeeper与Nacos"},{"id":"c149","cat":"Elasticsearch/ZooKeeper/Nacos","q":"ZAB 协议做了什么？","a":"崩溃恢复（按 zxid/epoch 选主）+ 消息广播（类似两阶段提交、过半即提交）；因此 ZK 是 CP 系统","ref":"f18","refTitle":"06-ZooKeeper与Nacos"},{"id":"c150","cat":"Elasticsearch/ZooKeeper/Nacos","q":"Nacos 的 AP 与 CP 怎么选？","a":"临时实例走 Distro 协议（AP，默认），持久实例与配置中心走 Raft（CP）；服务发现一般用 AP 保可用","ref":"f18","refTitle":"06-ZooKeeper与Nacos"},{"id":"c151","cat":"Elasticsearch/ZooKeeper/Nacos","q":"注册中心的服务发现原理？","a":"服务启动时注册地址 → 消费者订阅并拉取列表缓存本地 → 心跳续约剔除失效实例 → 变更推送更新本地缓存","ref":"f18","refTitle":"06-ZooKeeper与Nacos"},{"id":"c152","cat":"网络","q":"TCP 和 UDP 的区别？","a":"TCP 面向连接、可靠字节流、有流量/拥塞控制；UDP 无连接、不可靠、报文小延迟低（DNS/视频/游戏）","ref":"f10","refTitle":"03-IO模型与网络编程"},{"id":"c153","cat":"网络","q":"为什么三次握手不是两次？","a":"确认双方收发能力都正常，并防止历史重复的 SYN 建立无效连接；两次会导致服务端白白维持半连接","ref":"f10","refTitle":"03-IO模型与网络编程"},{"id":"c154","cat":"网络","q":"四次挥手与 TIME_WAIT？","a":"双向各发 FIN+ACK；主动方最后等 2MSL：确保对端收到最后的 ACK、让旧报文在网络中消亡","ref":"f10","refTitle":"03-IO模型与网络编程"},{"id":"c155","cat":"网络","q":"TCP 如何保证可靠传输？","a":"序列号+确认应答、超时重传/快速重传、滑动窗口流量控制、拥塞控制（慢启动/拥塞避免/快恢复）","ref":"f10","refTitle":"03-IO模型与网络编程"},{"id":"c156","cat":"网络","q":"常见 HTTP 状态码？","a":"200 成功、301/302 重定向、304 缓存有效、400 参数错、401/403 未认证/无权限、404 不存在、500 服务器错、502/504 网关错误/超时","ref":"f10","refTitle":"03-IO模型与网络编程"},{"id":"c157","cat":"网络","q":"HTTP 方法的幂等性？","a":"GET/PUT/DELETE 幂等（重复执行效果相同），POST 非幂等；幂等性影响重试设计","ref":"f10","refTitle":"03-IO模型与网络编程"},{"id":"c158","cat":"网络","q":"HTTPS 的握手与加密？","a":"TCP 之后 TLS 协商套件 → 验证证书（防冒充）→ ECDHE 非对称交换出对称密钥 → 之后对称加密通信；混合加密兼顾安全与性能","ref":"f10","refTitle":"03-IO模型与网络编程"},{"id":"c159","cat":"网络","q":"GET 和 POST 的区别？","a":"语义：GET 获取（幂等、参数在 URL、可缓存）vs POST 提交（非幂等、参数在 body）；本质都是 TCP 报文，区别是约定","ref":"f10","refTitle":"03-IO模型与网络编程"},{"id":"c160","cat":"网络","q":"TCP 粘包拆包怎么解决？","a":"TCP 是字节流没有消息边界；定长协议、分隔符、长度前缀（Netty LengthFieldBasedFrameDecoder）三种方案","ref":"f10","refTitle":"03-IO模型与网络编程"},{"id":"c161","cat":"网络","q":"select/poll/epoll 的区别？","a":"select 有 1024 上限且每次全量拷贝轮询；poll 无上限仍轮询；epoll 红黑树管理 fd + 就绪链表回调，O(1) 只处理就绪的","ref":"f10","refTitle":"03-IO模型与网络编程"},{"id":"c162","cat":"网络","q":"Cookie/Session/Token 的区别？","a":"Cookie 存客户端随请求携带；Session 存服务端（集群需共享）；Token（JWT）自包含无状态、天然适合分布式","ref":"f10","refTitle":"03-IO模型与网络编程"},{"id":"c163","cat":"网络","q":"JWT 的结构与校验？","a":"Header.Payload.Signature，签名防篡改；服务端无状态验证签发方；缺点是无法主动失效（要配黑名单）","ref":"f10","refTitle":"03-IO模型与网络编程"},{"id":"c164","cat":"网络","q":"DNS 的解析过程？","a":"浏览器缓存 → 系统缓存 → 本地 DNS（递归）→ 根/顶级/权威服务器（迭代），最终拿到 IP 并缓存","ref":"f10","refTitle":"03-IO模型与网络编程"},{"id":"c165","cat":"网络","q":"HTTP/1.1、2、3 的演进？","a":"1.1 长连接但仍有队头阻塞；2 二进制分帧+多路复用解决 HTTP 层阻塞；3 基于 QUIC/UDP 彻底解决 TCP 层队头阻塞","ref":"f10","refTitle":"03-IO模型与网络编程"},{"id":"c166","cat":"网络","q":"从输入 URL 到页面展示发生了什么？","a":"DNS 解析 → TCP 三次握手 → TLS 握手 → HTTP 请求 → 服务端处理返回 → 浏览器解析渲染，综合串讲题","ref":"f10","refTitle":"03-IO模型与网络编程"},{"id":"c167","cat":"操作系统","q":"进程和线程的区别？","a":"进程是资源分配单位（独立地址空间），线程是 CPU 调度单位（共享进程堆与方法区，各自有栈）；线程切换成本更低","ref":"f10","refTitle":"03-IO模型与网络编程"},{"id":"c168","cat":"操作系统","q":"进程间通信方式？","a":"管道、消息队列、共享内存（最快）、信号量、Socket；线程间直接共享内存但要加锁同步","ref":"f10","refTitle":"03-IO模型与网络编程"},{"id":"c169","cat":"操作系统","q":"死锁的四个必要条件？","a":"互斥、请求与保持、不可剥夺、循环等待；破坏任意一个即可预防，工程上常用资源有序申请","ref":"f10","refTitle":"03-IO模型与网络编程"},{"id":"c170","cat":"操作系统","q":"什么是虚拟内存？","a":"每个进程独立的虚拟地址空间，经页表映射到物理内存，缺页中断按需加载；带来隔离与\"内存超售\"能力","ref":"f10","refTitle":"03-IO模型与网络编程"},{"id":"c171","cat":"操作系统","q":"用户态与内核态？","a":"CPU 权限分级；系统调用/中断触发切换并保存上下文，切换有开销，频繁切换是性能杀手（如大量小 IO）","ref":"f10","refTitle":"03-IO模型与网络编程"},{"id":"c172","cat":"操作系统","q":"IO 多路复用是什么？","a":"一个线程同时监听多个 fd，内核告知就绪后才处理；select/poll/epoll 是三种实现，epoll 是高性能服务的标配","ref":"f10","refTitle":"03-IO模型与网络编程"},{"id":"c173","cat":"操作系统","q":"什么是零拷贝？","a":"数据不经过用户态来回拷贝（sendfile/mmap），减少 CPU 拷贝与上下文切换；Kafka、RocketMQ、Nginx 靠它提速","ref":"f10","refTitle":"03-IO模型与网络编程"},{"id":"c174","cat":"操作系统","q":"fork 是什么？写时复制？","a":"Unix 创建子进程的系统调用；COW 让父子先共享物理页，任一方写入时才真正复制，降低创建成本","ref":"f10","refTitle":"03-IO模型与网络编程"}],"quiz":[{"id":"q9f4b265c","kind":"select","cat":"Java基础","diff":"易","q":"JDK、JRE、JVM 三者的包含关系是？","opts":["JDK ⊃ JRE ⊃ JVM","JVM ⊃ JRE ⊃ JDK","JRE ⊃ JDK ⊃ JVM","三者互相独立"],"a":"A","exp":"JDK = 开发工具 + JRE，JRE = JVM + 核心类库；只需运行程序装 JRE，要开发才装 JDK。详见[《01-环境搭建与基础语法》](#/f/f3)","ref":"f3"},{"id":"q2e983fea","kind":"select","cat":"Java基础","diff":"中","q":"`StringBuilder sb = new StringBuilder(\"a\");` 调用 `change(sb)`，方法体为 `void change(StringBuilder x){ x.append(\"b\"); x = new StringBuilder(\"c\"); }`，之后 sb 的内容是？","opts":["a","ab","c","bc"],"a":"B","exp":"Java 只有值传递：append 修改的是同一个对象，而重新赋值只改变了形参的指向，不影响实参。详见[《02-面向对象与核心类》](#/f/f4)","ref":"f4"},{"id":"q94b063d1","kind":"select","cat":"Java基础","diff":"易","q":"`Integer a = 127, b = 127; System.out.println(a == b);` 输出什么？","opts":["true","false","编译错误","不确定"],"a":"A","exp":"IntegerCache 缓存 -128~127，范围内 == 比较的是同一个缓存对象；超出范围（如 128）必须用 equals。详见[《02-面向对象与核心类》](#/f/f4)","ref":"f4"},{"id":"qdb9bf6ae","kind":"select","cat":"Ja
