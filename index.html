va基础","diff":"易","q":"以下哪个不属于面向对象三大特性？","opts":["封装","继承","多态","重载"],"a":"D","exp":"三大特性是封装、继承、多态；重载是编译期确定同签名不同参数的方法，不属于三大特性。详见[《02-面向对象与核心类》](#/f/f4)","ref":"f4"},{"id":"qc53e2f40","kind":"select","cat":"Java基础","diff":"易","q":"try-with-resources 的主要作用是？","opts":["自动关闭实现了 AutoCloseable 的资源","自动提交事务","捕获所有异常","提升运行速度"],"a":"A","exp":"编译器会生成 finally 中的关闭逻辑，避免资源泄漏，优于手写 try-catch-finally。详见[《04-异常-IO-反射-注解》](#/f/f6)","ref":"f6"},{"id":"qc518bf56","kind":"select","cat":"Java基础","diff":"中","q":"关于 String 不可变，正确的解释是？","opts":["String 是可变的，只是习惯上不改","String 类被 final 修饰、内部数据私有且不暴露修改方法","频繁拼接字符串应优先用 String","String 是基本数据类型"],"a":"B","exp":"不可变带来安全性、字符串常量池复用、hashCode 可缓存；频繁拼接用 StringBuilder。详见[《02-面向对象与核心类》](#/f/f4)","ref":"f4"},{"id":"q49902d55","kind":"select","cat":"集合","diff":"中","q":"JDK 1.8 中 ArrayList 首次 add 时容量扩到 10，此后每次扩容为原来的？","opts":["1.5 倍","2 倍","1.2 倍","3 倍"],"a":"A","exp":"newCapacity = oldCapacity + (oldCapacity >> 1)，即 1.5 倍向下取整。详见[《03-集合与泛型》](#/f/f5)","ref":"f5"},{"id":"q36b54228","kind":"select","cat":"集合","diff":"中","q":"HashMap（JDK 1.8）中链表转红黑树的条件是？","opts":["链表长度 ≥ 8 且数组长度 ≥ 64","链表长度 ≥ 8 即可","链表长度 ≥ 16","元素总数 ≥ 64"],"a":"A","exp":"数组长度不足 64 时优先扩容而不是树化；红黑树退化回链表的阈值是 6。详见[《03-集合与泛型》](#/f/f5)","ref":"f5"},{"id":"qd0c54804","kind":"select","cat":"集合","diff":"易","q":"HashSet 判断元素是否重复依赖的方法是？","opts":["仅 equals","仅 ==","hashCode 与 equals","compareTo"],"a":"C","exp":"先用 hashCode 定位桶，再在桶内用 equals 精确比较，两者必须一起重写。详见[《03-集合与泛型》](#/f/f5)","ref":"f5"},{"id":"q3cef9a45","kind":"select","cat":"集合","diff":"易","q":"下列集合中线程安全的是？","opts":["ArrayList","HashMap","Vector","LinkedList"],"a":"C","exp":"Vector 方法用 synchronized 修饰；现代并发场景更推荐 ConcurrentHashMap 或 CopyOnWriteArrayList。详见[《03-集合与泛型》](#/f/f5)","ref":"f5"},{"id":"qa42fd497","kind":"select","cat":"集合","diff":"易","q":"用 for-each 遍历 ArrayList 时直接调用 list.remove(o)，通常会？","opts":["正常删除","抛出 ConcurrentModificationException","编译错误","静默删除所有元素"],"a":"B","exp":"fail-fast 机制检测到 modCount 被修改即抛异常；正确做法是 Iterator.remove() 或 removeIf。详见[《03-集合与泛型》](#/f/f5)","ref":"f5"},{"id":"q8e47eefc","kind":"select","cat":"并发","diff":"易","q":"直接调用线程对象的 run() 而不是 start()，结果是？","opts":["创建新线程执行","在当前线程中作为普通方法执行","抛出异常","永久阻塞"],"a":"B","exp":"只有 start() 会让 JVM 创建新线程并调用 run()；直接调 run() 与普通方法调用无异。详见[《01-多线程与并发编程》](#/f/f8)","ref":"f8"},{"id":"q47770921","kind":"select","cat":"并发","diff":"易","q":"volatile 能保证的是？","opts":["原子性","可见性与有序性","原子性与可见性","原子性、可见性、有序性都保证"],"a":"B","exp":"volatile 保证可见性和禁止指令重排，但 i++ 这类复合操作仍需 synchronized 或原子类。详见[《01-多线程与并发编程》](#/f/f8)","ref":"f8"},{"id":"qfc23522a","kind":"select","cat":"并发","diff":"中","q":"线程池提交任务后的处理顺序是？","opts":["核心线程 → 阻塞队列 → 非核心线程 → 拒绝策略","直接创建线程直到最大线程数","先入队列再创建核心线程","顺序随机"],"a":"A","exp":"先占满核心线程，队列满了才扩非核心线程，到 max 后触发拒绝策略——这也是 FixedThreadPool 无界队列堆积 OOM 的根源。详见[《01-多线程与并发编程》](#/f/f8)","ref":"f8"},{"id":"q5d6c68e0","kind":"select","cat":"并发","diff":"中","q":"synchronized 锁升级的正确顺序是？","opts":["偏向锁 → 轻量级锁 → 重量级锁","重量级锁 → 轻量级锁 → 偏向锁","轻量级锁 → 偏向锁 → 重量级锁","不存在锁升级"],"a":"A","exp":"JVM 按竞争激烈程度逐步升级且不可逆，目的是减少无竞争场景的开销。详见[《01-多线程与并发编程》](#/f/f8)","ref":"f8"},{"id":"q76a56636","kind":"select","cat":"并发","diff":"中","q":"ThreadLocal 可能内存泄漏的根本原因是？","opts":["key 是强引用","key 是弱引用但 value 是强引用，线程长期存活时 value 无法回收","value 是弱引用","底层是 ArrayList"],"a":"B","exp":"线程池中线程长期存活，ThreadLocalMap 的 value 无法自动回收，用完必须调用 remove()。详见[《01-多线程与并发编程》](#/f/f8)","ref":"f8"},{"id":"q0e8a68e0","kind":"select","cat":"并发","diff":"易","q":"以下哪个不是 ThreadPoolExecutor 的拒绝策略？","opts":["AbortPolicy","CallerRunsPolicy","DiscardPolicy","FairPolicy"],"a":"D","exp":"四种拒绝策略是 AbortPolicy、CallerRunsPolicy、DiscardPolicy、DiscardOldestPolicy。详见[《01-多线程与并发编程》](#/f/f8)","ref":"f8"},{"id":"q1982ed9e","kind":"select","cat":"JVM","diff":"中","q":"以下运行时区域中，规范规定不会抛出 OutOfMemoryError 的是？","opts":["堆","虚拟机栈","程序计数器","元空间"],"a":"C","exp":"程序计数器是唯一没有规定任何 OOM 情况的区域；栈是 StackOverflowError，堆和元空间都会 OOM。详见[《02-JVM核心》](#/f/f9)","ref":"f9"},{"id":"qf75982ef","kind":"select","cat":"JVM","diff":"易","q":"判断对象是否可回收，主流商用虚拟机采用？","opts":["引用计数法","可达性分析（从 GC Roots 出发）","随机回收","手动释放"],"a":"B","exp":"可达性分析解决了引用计数法的循环引用问题；GC Roots 包括栈帧局部变量、静态变量、常量、JNI 引用等。详见[《02-JVM核心》](#/f/f9)","ref":"f9"},{"id":"q5efc147f","kind":"select","cat":"JVM","diff":"中","q":"双亲委派机制的主要作用是？","opts":["加快类加载速度","避免核心类被篡改与类的重复加载","是节省内存的唯一手段","为了支持热更新"],"a":"B","exp":"子加载器先委托父加载器，保证 String 等核心类始终由 Bootstrap 加载，安全且唯一。详见[《02-JVM核心》](#/f/f9)","ref":"f9"},{"id":"q61240830","kind":"select","cat":"JVM","diff":"中","q":"关于 G1 收集器，下列说法正确的是？","opts":["将堆划分为多个 Region，可设定目标停顿时间","只能回收新生代","基于标记-清除，必然产生大量碎片","是 JDK 8 的默认收集器"],"a":"A","exp":"G1 按 Region 管理、可预测停顿（-XX:MaxGCPauseMillis），整体标记-整理、Region 间复制，JDK 9+ 默认。详见[《02-JVM核心》](#/f/f9)","ref":"f9"},{"id":"qa9ba616a","kind":"select","cat":"MySQL","diff":"易","q":"InnoDB 的默认事务隔离级别是？","opts":["读未提交","读已提交","可重复读","串行化"],"a":"C","exp":"RR 通过 MVCC + 临键锁在很大程度上避免幻读；互联网公司常改用 RC 以减少锁冲突。详见[《索引-事务-锁与调优》](#/f/f12)","ref":"f12"},{"id":"qc8377dce","kind":"select","cat":"MySQL","diff":"中","q":"假设 name 列有索引，下列条件能走索引的是？","opts":["name LIKE '%三'","name LIKE '张%'","LEFT(name,1) = '张'","name + 1 = '张三'"],"a":"B","exp":"左模糊、对索引列使用函数或运算都会导致索引失效，只有右前缀模糊可以走索引。详见[《索引-事务-锁与调优》](#/f/f12)","ref":"f12"},{"id":"q223389b2","kind":"select","cat":"MySQL","diff":"易","q":"事务 ACID 中的 I 指的是？","opts":["原子性","一致性","隔离性","持久性"],"a":"C","exp":"Atomicity 原子性、Consistency 一致性、Isolation 隔离性、Durability 持久性。详见[《索引-事务-锁与调优》](#/f/f12)","ref":"f12"},{"id":"qda615f50","kind":"select","cat":"MySQL","diff":"中","q":"binlog（二进制日志）的主要用途是？","opts":["崩溃后恢复未完成的事务","主从复制与时间点恢复","保证事务原子性","记录慢查询"],"a":"B","exp":"崩溃恢复靠 redo log；binlog 是 Server 层日志，用于主从复制和数据归档恢复。详见[《索引-事务-锁与调优》](#/f/f12)","ref":"f12"},{"id":"q1b70b94a","kind":"select","cat":"MySQL","diff":"易","q":"InnoDB 聚簇索引的叶子节点存放的是？","opts":["主键值","整行数据","索引列 + 主键","数据页地址"],"a":"B","exp":"聚簇索引即主键索引，叶子存整行；二级索引叶子存\"索引列+主键\"，查非覆盖列需回表。详见[《索引-事务-锁与调优》](#/f/f12)","ref":"f12"},{"id":"qa1a50173","kind":"select","cat":"MySQL","diff":"易","q":"varchar(50) 在 utf8mb4 字符集下的含义是？","opts":["最多 50 字节","最多 50 个字符","固定占 50 字节","最多存 50 个汉字"],"a":"B","exp":"varchar 按字符计长度，实际占用字节数取决于字符集与内容。详见[《MySQL基础与SQL实战》](#/f/f11)","ref":"f11"},{"id":"qb86f3b6e","kind":"select","cat":"Redis","diff":"中","q":"Redis 6.0 引入多线程的目的是？","opts":["让命令执行并行化","处理网络 IO 与协议解析，命令执行仍是单线程","彻底替换单线程模型","为了实现分布式锁"],"a":"B","exp":"Redis 瓶颈常在网络 IO；引入多线程读写网络，命令执行保持单线程避免锁竞争。详见[《01-Redis》](#/f/f13)","ref":"f13"},{"id":"qd7a646d1","kind":"select","cat":"Redis","diff":"易","q":"解决缓存穿透的常用手段是？","opts":["缓存空值与布隆过滤器","过期时间加随机值","互斥锁重建缓存","多级缓存"],"a":"A","exp":"穿透是查询根本不存在的数据；B 针对 AOF 雪崩、C 针对击穿、D 用于高并发兜底。详见[《01-Redis》](#/f/f13)","ref":"f13"},{"id":"q865afd28","kind":"select","cat":"Redis","diff":"中","q":"关于 RDB 持久化，正确的是？","opts":["每条写命令都实时落盘","某一时刻的内存快照，恢复快但可能丢失最后一次快照后的数据","生成可读的文本命令日志","不能与 AOF 同时开启"],"a":"B","exp":"AOF 才是命令日志；RDB 二进制紧凑恢复快，Redis 4.0+ 支持 RDB+AOF 混合持久化。详见[《01-Redis》](#/f/f13)","ref":"f13"},{"id":"q17fdae4d","kind":"select","cat":"Redis","diff":"易","q":"大量 key 同一时刻过期导致数据库瞬间被压垮，这属于？","opts":["缓存穿透","缓存击穿","缓存雪崩","缓存污染"],"a":"C","exp":"雪崩=大规模 key 同时失效或 Redis 宕机；过期时间加随机值、多级缓存、集群高可用是常用方案。详见[《01-Redis》](#/f/f13)","ref":"f13"},{"id":"q094e877b","kind":"select","cat":"Redis","diff":"易","q":"实现排行榜功能最合适的 Redis 数据结构是？","opts":["String","Hash","Set","ZSet"],"a":"D","exp":"ZSet 按 score 排序，天然支持 ZINCRBY 加分、ZRANGE/ZREVRANGE 取 TopN。详见[《01-Redis》](#/f/f13)","ref":"f13"},{"id":"q770693c6","kind":"select","cat":"Redis","diff":"中","q":"Cache Aside 模式推荐的更新顺序是？","opts":["先更新缓存，再更新数据库","先更新数据库，再删除缓存","先删除缓存，再更新数据库，无兜底","缓存与数据库同时双写"],"a":"B","exp":"先更库再删缓存的不一致窗口最小；并发读写场景可配合延迟双删、过期时间兜底。详见[《01-Redis》](#/f/f13)","ref":"f13"},{"id":"q6fb83eb8","kind":"select","cat":"消息队列","diff":"易","q":"消息队列解决的核心问题是？","opts":["异步、解耦、削峰","数据持久存储","数据计算","服务发现"],"a":"A","exp":"典型场景：异步通知（注册发短信）、系统解耦（订单与库存）、流量削峰（秒杀）。详见[《02-RabbitMQ》](#/f/f14)","ref":"f14"},{"id":"qbe5d6915","kind":"select","cat":"消息队列","diff":"中","q":"关于 Kafka 的消息顺序，正确的是？","opts":["Topic 内天然全局有序","单分区内有序，按 key 路由可保证同类消息有序","消费者越多越有序","顺序与分区无关"],"a":"B","exp":"顺序只保证在分区内；需要顺序的消息按业务 key 路由到同一分区，且该分区在消费组内只由一个消费者处理。详见[《03-Kafka》](#/f/f15)","ref":"f15"},{"id":"q08b25567","kind":"select","cat":"消息队列","diff":"中","q":"以下哪项不是 Kafka 高吞吐的原因？","opts":["顺序写磁盘","零拷贝（sendfile）","批量发送与压缩","每条消息立即 fsync 刷盘"],"a":"D","exp":"Kafka 依赖页缓存批量刷盘，逐条 fsync 反而严重拖慢写入。详见[《03-Kafka》](#/f/f15)","ref":"f15"},{"id":"q3ac7d566","kind":"select","cat":"消息队列","diff":"中","q":"RocketMQ 事务消息的正确流程是？","opts":["先投递消息再执行本地事务，失败无法处理","发送半消息 → 执行本地事务 → 提交/回滚，配合事务回查兜底","由消费者代替生产者执行本地事务","依赖数据库两阶段提交"],"a":"B","exp":"半消息对消费者不可见；生产者宕机时 Broker 通过回查确认本地事务状态，实现最终一致。详见[《04-RocketMQ》](#/f/f16)","ref":"f16"},{"id":"q89ab8286","kind":"select","cat":"消息队列","diff":"易","q":"防止重复消费污染数据的通用思路是？","opts":["要求 MQ 绝对不重复","消费端幂等：唯一业务 ID + 去重表/状态机","把消费模式改为只消费一次","无需处理"],"a":"B","exp":"至少一次投递下重复不可避免，幂等是标准答案：数据库唯一键、Redis setnx 去重等。详见[《02-RabbitMQ》](#/f/f14)","ref":"f14"},{"id":"q44ddd0ff","kind":"select","cat":"框架","diff":"中","q":"同类中方法 A 直接调用带 @Transactional 的方法 B，事务失效的原因是？","opts":["事务传播行为冲突","自调用走的是原始对象而非代理对象","方法 B 不是 public","数据库不支持事务"],"a":"B","exp":"Spring 事务基于 AOP 代理，自调用绕过了代理对象；可拆分类、注入自身代理或用 AopContext 解决。注意 C 也可能失效，但\"自调用\"是本题场景主因。详见[《Spring核心》](#/f/f21)","ref":"f21"},{"id":"q27fb8513","kind":"select","cat":"框架","diff":"易","q":"Spring Bean 的默认作用域是？","opts":["prototype","singleton","request","session"],"a":"B","exp":"默认单例；有状态Bean可用 @Scope(\"prototype\")。详见[《Spring核心》](#/f/f21)","ref":"f21"},{"id":"q0d508603","kind":"select","cat":"框架","diff":"易","q":"Spring AOP 底层实现采用的是？","opts":["反射工具类","动态代理（JDK 动态代理或 CGLIB）","手写字节码注入","操作系统信号量"],"a":"B","exp":"目标类有接口时默认 JDK 动态代理，无接口时用 CGLIB 子类代理。详见[《Spring核心》](#/f/f21)","ref":"f21"},{"id":"q749f45b9","kind":"select","cat":"框架","diff":"中","q":"SpringBoot 自动配置的加载逻辑是？","opts":["扫描并加载所有第三方类","读取 AutoConfiguration.imports 列出的自动配置类，再按 @ConditionalOnXxx 条件筛选生效","用户必须手动注册所有 Bean","启动时随机加载部分配置"],"a":"B","exp":"@EnableAutoConfiguration 聚合加载配置清单，条件注解（如类路径、已有 Bean）决定是否生效。详见[《SpringBoot实战》](#/f/f22)","ref":"f22"},{"id":"qceaf8c49","kind":"select","cat":"框架","diff":"易","q":"MyBatis 中 #{} 与 ${} 的区别，正确的是？","opts":["二者完全等价","#{} 是预编译占位符可防 SQL 注入，${} 是字符串拼接有注入风险","${} 更安全","#{} 不能用在任何地方"],"a":"B","exp":"动态表名、ORDER BY 列名等无法参数化的位置才用 ${}，且必须白名单校验。详见[《MyBatis》](#/f/f23)","ref":"f23"},{"id":"qe9a11be0","kind":"select","cat":"框架","diff":"易","q":"MyBatis 一级缓存的作用范围是？","opts":["SqlSession","单个 Mapper 接口","应用全局","单个线程"],"a":"A","exp":"同一 SqlSession 内相同查询命中一级缓存（默认开启）；二级缓存跨会话，分布式下易脏读应慎用。详见[《MyBatis》](#/f/f23)","ref":"f23"},{"id":"qc67b4731","kind":"select","cat":"框架","diff":"难","q":"Spring 三级缓存能解决的循环依赖是？","opts":["所有循环依赖","singleton 作用域 + setter/字段注入的循环依赖","构造器注入的循环依赖","prototype 作用域的循环依赖"],"a":"B","exp":"三级缓存靠\"提前暴露早期引用\"；构造器注入在实例化阶段就需要依赖，prototype 每次新建，都无法用三级缓存解决。详见[《Spring核心》](#/f/f21)","ref":"f21"},{"id":"qd6bb8246","kind":"select","cat":"分布式与高并发","diff":"中","q":"关于 CAP 理论，实践中更准确的理解是？","opts":["三个特性可以同时任选","分区不可避免，实际是在 CP 与 AP 之间取舍","应该追求 CA 而放弃 P","P 可以通过配置关闭"],"a":"B","exp":"网络分区必然发生，P 是必选项；无分区时才能同时兼顾 C 与 A，如 ZK 偏 CP、Eureka 偏 AP。详见[《01-分布式理论基础》](#/f/f25)","ref":"f25"},{"id":"q4c6946d8","kind":"select","cat":"分布式与高并发","diff":"中","q":"雪花算法的结构中不包含以下哪部分？","opts":["符号位","时间戳","机器 ID","随机数"],"a":"D","exp":"标准结构是 1 位符号 + 41 位时间戳 + 10 位机器 ID + 12 位序列号；时钟回拨会产生重复 ID，需要兜底策略。详见[《01-分布式理论基础》](#/f/f25)","ref":"f25"},{"id":"qc742b160","kind":"select","cat":"分布式与高并发","diff":"中","q":"与漏桶算法相比，令牌桶的特点是？","opts":["恒定速率处理请求","允许一定程度的突发流量","不能用于限流","只能单机使用"],"a":"B","exp":"令牌桶积攒令牌允许突发消费；漏桶恒定速率流出，平滑但无突发能力。详见[《02-高并发系统设计》](#/f/f26)","ref":"f26"},{"id":"qbfa9317a","kind":"select","cat":"Java8","diff":"易","q":"以下哪一项不是 Java 8 引入的新特性？","opts":["Lambda 表达式与函数式接口","Stream API","Optional","sealed 密封类"],"a":"D","exp":"sealed 是 Java 17 的特性；Java 8 的代表性新特性是 Lambda、函数式接口、Stream、Optional、接口默认方法与新日期 API。详见[《05-Lambda-Stream与Java8新特性》](#/f/f7)","ref":"f7"},{"id":"qf767077e","kind":"select","cat":"Java8","diff":"中","q":"关于 Stream 的 map 与 flatMap，正确的是？","opts":["map 将每个元素映射为另一个元素，flatMap 将每个元素映射为流后再拼接扁平化","二者完全等价","flatMap 只能用于数值流","map 会自动去重"],"a":"A","exp":"flatMap 常用于「一对多展开」，例如把句子流拆成单词流。详见[《05-Lambda-Stream与Java8新特性》](#/f/f7)","ref":"f7"}, "},{"id":"q728914a2","kind":"select","cat":"Elasticsearch","diff":"易","q":"Elasticsearch 实现全文检索的核心数据结构是？","opts":["B+ 树","倒排索引","哈希表","跳表"],"a":"B","exp":"文本分词后建立「词项 → 文档列表」的映射，查询时先查词再取文档，天然适合全文搜索。详见[《05-Elasticsearch》](#/f/f17)","ref":"f17"},{"id":"qdca15af0","kind":"select","cat":"Elasticsearch","diff":"中","q":"关于 keyword 与 text 类型，正确的是？","opts":["二者都会分词","text 会分词用于全文检索，keyword 不分词、适合精确匹配与排序聚合","keyword 会分词，text 不分词","都不能用于聚合"],"a":"B","exp":"状态码、手机号等用 keyword 精确匹配；商品描述等长文本用 text。详见[《05-Elasticsearch》](#/f/f17)","ref":"f17"},{"id":"q030b55df","kind":"select","cat":"Nginx","diff":"易","q":"以下哪项不是 Nginx 的典型用途？","opts":["反向代理","负载均衡","静态资源服务","消息存储转发"],"a":"D","exp":"消息存储转发是消息队列的职责；Nginx 基于 epoll，擅长高并发连接接入与转发。详见[《07-Nginx》](#/f/f19)","ref":"f19"},{"id":"qd704ad7b","kind":"select","cat":"Nginx","diff":"中","q":"upstream 中配置 ip_hash 的作用是？","opts":["随机分发请求","同一客户端 IP 固定转发到同一后端节点","按权重分发","执行健康检查"],"a":"B","exp":"实现会话保持（不依赖 Cookie）；缺点是后端扩缩容时分布会变化。详见[《07-Nginx》](#/f/f19)","ref":"f19"},{"id":"qa0025d19","kind":"select","cat":"MongoDB","diff":"易","q":"MongoDB 的数据模型是？","opts":["二维关系表","文档（BSON）","图结构","纯键值对"],"a":"B","exp":"文档模型 schema 灵活、嵌套结构免多表关联；概念对应：库-集合-文档 ≈ 库-表-行。详见[《08-MongoDB》](#/f/f20)","ref":"f20"},{"id":"q23b960ff","kind":"select","cat":"MongoDB","diff":"中","q":"以下哪种场景最适合 MongoDB？","opts":["银行核心账务（强事务）","商品详情这类字段灵活、结构多变的内容管理","复杂的多表 JOIN 报表","计费扣款"],"a":"B","exp":"MongoDB 的弱项正是强事务与复杂关联；内容管理、日志埋点、爬虫数据是它的强项。详见[《08-MongoDB》](#/f/f20)","ref":"f20"},{"id":"qb7aabe53","kind":"blank","cat":"Java基础","diff":"易","q":"Java 源文件经 javac 编译后生成＿＿＿文件，由 JVM 加载执行。","alts":[["字节码","class",".class"]],"exp":"javac 把 .java 编译为 .class 字节码，JVM 解释/JIT 执行，这是\"一次编写，到处运行\"的基础。详见[《01-环境搭建与基础语法》](#/f/f3)","ref":"f3"},{"id":"qaf4cebf4","kind":"blank","cat":"Java基础","diff":"易","q":"== 用于比较引用类型时，比较的是＿＿＿。","alts":[["地址","内存地址","引用地址"]],"exp":"比较内容应使用重写后的 equals，String、Integer 等都已重写。详见[《02-面向对象与核心类》](#/f/f4)","ref":"f4"},{"id":"q6ce67066","kind":"blank","cat":"集合","diff":"易","q":"ArrayList 的底层是＿＿＿，LinkedList 的底层是＿＿＿。","alts":[["数组"],["双向链表"]],"exp":"ArrayList 随机访问快，LinkedList 头尾插删快，随机访问慢。详见[《03-集合与泛型》](#/f/f5)","ref":"f5"},{"id":"qa86f8ef3","kind":"blank","cat":"集合","diff":"易","q":"HashMap（JDK 1.8）的底层结构是＿＿＿＋链表＋红黑树。","alts":[["数组","哈希表"]],"exp":"数组是主体，冲突挂链表，链表长度≥8 且数组长度≥64 时树化。详见[《03-集合与泛型》](#/f/f5)","ref":"f5"},{"id":"qc3c9965b","kind":"blank","cat":"并发","diff":"中","q":"Executors 创建的 FixedThreadPool 使用无界＿＿＿，任务堆积可能导致 OOM，因此推荐手动 new ThreadPoolExecutor。","alts":[["队列","阻塞队列"]],"exp":"无界队列在消费慢时会无限堆积任务，最终内存耗尽。详见[《01-多线程与并发编程》](#/f/f8)","ref":"f8"},{"id":"q47ff62a7","kind":"blank","cat":"并发","diff":"中","q":"synchronized 是 JVM 层面的锁，而 ReentrantLock 是＿＿＿层面用 AQS 实现的锁。","alts":[["JDK","API","Java"]],"exp":"ReentrantLock 基于队列同步器（AQS）在 Java 代码层实现，功能更丰富：可中断、超时、公平锁、Condition。详见[《01-多线程与并发编程》](#/f/f8)","ref":"f8"},{"id":"q0fca9652","kind":"blank","cat":"JVM","diff":"中","q":"JVM 新生代分为 Eden 区和两个＿＿＿区。","alts":[["Survivor","S0/S1","from/to"]],"exp":"默认 8:1:1，对象在两个 Survivor 区之间来回复制，每熬过一次 Minor GC 年龄+1。详见[《02-JVM核心》](#/f/f9)","ref":"f9"},{"id":"qbe130ce3","kind":"blank","cat":"JVM","diff":"中","q":"类加载过程依次为：加载 → 验证 → 准备 → ＿＿＿ → 初始化。","alts":[["解析"]],"exp":"准备阶段给静态变量赋零值，初始化才执行 <clinit>；解析将常量池符号引用转为直接引用。详见[《02-JVM核心》](#/f/f9)","ref":"f9"},{"id":"q4ac78094","kind":"blank","cat":"MySQL","diff":"易","q":"MySQL 5.5 之后的默认存储引擎是＿＿＿。","alts":[["InnoDB"]],"exp":"支持事务、行级锁、外键与 MVCC；MyISAM 表锁且无事务，已非默认。详见[《MySQL基础与SQL实战》](#/f/f11)","ref":"f11"},{"id":"qb9ce91e9","kind":"blank","cat":"MySQL","diff":"易","q":"MySQL 默认的事务隔离级别是＿＿＿。","alts":[["可重复读","REPEATABLE READ","RR"]],"exp":"通过 MVCC + 临键锁在该级别下大幅避免幻读。详见[《索引-事务-锁与调优》](#/f/f12)","ref":"f12"},{"id":"q1b530685","kind":"blank","cat":"MySQL","diff":"中","q":"EXPLAIN 输出的 type 列出现＿＿＿时表示全表扫描，通常需要优化。","alts":[["ALL"]],"exp":"性能从好到差：const > eq_ref > ref > range > index > ALL，生产 SQL 至少做到 range。详见[《索引-事务-锁与调优》](#/f/f12)","ref":"f12"},{"id":"qffb166bf","kind":"blank","cat":"Redis","diff":"易","q":"Redis 中实现排行榜最常用的数据结构是＿＿＿。","alts":[["ZSet","zset","有序集合","sorted set"]],"exp":"按 score 排序，ZINCRBY 加分、ZREVRANGE 取 TopN。详见[《01-Redis》](#/f/f13)","ref":"f13"},{"id":"q112548c2","kind":"blank","cat":"Redis","diff":"易","q":"缓存三大经典问题：缓存穿透、缓存击穿、缓存＿＿＿。","alts":[["雪崩"]],"exp":"穿透查不存在的数据，击穿是热点 key 过期瞬间被打穿，雪崩是大规模 key 同时失效。详见[《01-Redis》](#/f/f13)","ref":"f13"},{"id":"qcff29460","kind":"blank","cat":"Redis","diff":"中","q":"Redis 分布式锁的加锁命令 SET key value NX ＿＿＿ ttl 中，最后一参数段表示过期时间，防止死锁。","alts":[["EX","ex"]],"exp":"NX 保证互斥，EX 设置过期；生产建议直接用 Redisson 看门狗自动续期。详见[《01-Redis》](#/f/f13)","ref":"f13"},{"id":"q557800ee","kind":"blank","cat":"消息队列","diff":"中","q":"Kafka 的消息顺序只在＿＿＿范围内保证，跨分区无序。","alts":[["分区","Partition","partition"]],"exp":"按 key 路由到同一分区可保证同类消息有序，消费组内一个分区只由一个消费者消费。详见[《03-Kafka》](#/f/f15)","ref":"f15"},{"id":"qbd97d4e3","kind":"blank","cat":"框架","diff":"中","q":"SpringBoot 中把配置文件批量绑定到配置类的注解是 @＿＿＿。","alts":[["ConfigurationProperties"]],"exp":"@Value 适合单个值；@ConfigurationProperties(prefix=\"xxx\") 支持批量绑定与校验。详见[《SpringBoot实战》](#/f/f22)","ref":"f22"},{"id":"qb22016e3","kind":"blank","cat":"框架","diff":"易","q":"SpringMVC 的前端核心控制器是＿＿＿。","alts":[["DispatcherServlet"]],"exp":"所有请求统一经过它分发到 HandlerMapping → HandlerAdapter → Controller。详见[《Spring核心》](#/f/f21)","ref":"f21"},{"id":"qb80564aa","kind":"blank","cat":"分布式与高并发","diff":"中","q":"Nacos 同时支持 AP 与＿＿＿两种模式，可按场景切换。","alts":[["CP"]],"exp":"临时实例走 AP（Distro 协议），持久实例走 CP（Raft）；ZK 是 CP，Eureka 是 AP。详见[《06-ZooKeeper与Nacos》](#/f/f18)","ref":"f18"},{"id":"q83dda969","kind":"blank","cat":"分布式与高并发","diff":"中","q":"雪花算法依赖机器时钟，时钟回拨可能导致生成＿＿＿的 ID。","alts":[["重复ID","ID重复","重复"]],"exp":"兜底方案：等待追平、拒绝发号、使用备用机器 ID 或改用号段/Leaf 等方案。详见[《01-分布式理论基础》](#/f/f25)","ref":"f25"},{"id":"q0ab0b098","kind":"blank","cat":"分布式与高并发","diff":"中","q":"秒杀系统中常用 Redis＋＿＿＿脚本原子地\"判断库存并扣减\"，防止超卖。","alts":[["Lua","lua"]],"exp":"多个 Redis 命令在 Lua 中原子执行，配合 MQ 异步落库完成秒杀主链路。详见[《02-高并发系统设计》](#/f/f26)","ref":"f26"},{"id":"q2d229a11","kind":"blank","cat":"Java8","diff":"中","q":"Stream 的中间操作是＿＿＿执行的，遇到终端操作才真正计算。","alts":[["惰性","延迟"]],"exp":"filter/map 等只记录操作，collect/forEach 触发才执行；这也是流只能被消费一次的原因。详见[《05-Lambda-Stream与Java8新特性》](#/f/f7)","ref":"f7"},{"id":"q8946d66d","kind":"blank","cat":"网络","diff":"易","q":"TCP 断开连接需要＿＿＿次挥手。","alts":[["4","四"]],"exp":"TCP 全双工，两个方向各需一次 FIN 和一次 ACK。详见[《03-IO模型与网络编程》](#/f/f10)","ref":"f10"},{"id":"q05529d1a","kind":"blank","cat":"Nginx","diff":"中","q":"Nginx 把动态请求转交给后端应用的核心指令是＿＿＿。","alts":[["proxy_pass"]],"exp":"写在 location 块中；静态资源用 root/alias，动静分离即由此组合实现。详见[《07-Nginx》](#/f/f19)","ref":"f19"},{"id":"qcd3625dc","kind":"blank","cat":"框架","diff":"中","q":"Spring Cloud Gateway 中，定义\"哪些请求转发到哪个服务\"的配置叫＿＿＿规则。","alts":[["路由","Route"]],"exp":"路由 = 断言（Predicate，匹配条件）+ 过滤器（Filter，处理逻辑），是网关的核心抽象。详见[《SpringCloud微服务》](#/f/f24)","ref":"f24"},{"id":"q85bda68e","kind":"blank","cat":"Elasticsearch","diff":"中","q":"MySQL 与 ES 近实时同步，常用阿里开源的＿＿＿监听 binlog 异步写入 ES。","alts":[["canal"]],"exp":"canal 伪装成 MySQL 从库解析 binlog；其他方案还有同步双写与 MQ 异步，各有取舍。详见[《05-Elasticsearch》](#/f/f17)","ref":"f17"},{"id":"q38aa01fd","kind":"blank","cat":"MongoDB","diff":"易","q":"MongoDB 中对应关系型数据库\"行\"的概念叫＿＿＿。","alts":[["文档","document"]],"exp":"集合 collection ≈ 表；文档以 BSON（二进制 JSON）存储。详见[《08-MongoDB》](#/f/f20)","ref":"f20"}]}</script>
<script>
window.addEventListener('error', function (e) {
  var el = document.getElementById('boot-err');
  if (!el) {
    el = document.createElement('div'); el.id = 'boot-err';
    el.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:#dc2626;color:#fff;padding:10px 16px;font:13px/1.6 -apple-system,sans-serif';
    (document.body || document.documentElement).appendChild(el);
  }
  el.textContent = '⚠ 应用脚本出错：' + (e.message || '未知错误') + '（请把这段文字发给助手定位问题）';
});
const DATA = JSON.parse(document.getElementById('app-data').textContent);
const $ = s => document.querySelector(s);
const byId = Object.fromEntries(DATA.files.map(f => [f.id, f]));
const stageFiles = DATA.files.reduce((m, f) => { (m[f.stage] = m[f.stage] || []).push(f); return m; }, []);
const TOTAL_CK = DATA.files.reduce((s, f) => s + f.ck, 0);

/* ---------- 存储 ---------- */
let store;
try { store = JSON.parse(localStorage.getItem('jvg1') || '{}'); } catch (e) { store = {}; }
store.ck = store.ck || {}; store.done = store.done || {}; store.cards = store.cards || {}; store.quiz = store.quiz || {};
store.theme = store.theme || 'light'; store.last = store.last || null;
const save = () => { try { localStorage.setItem('jvg1', JSON.stringify(store)); } catch (e) { /* 浏览器禁用存储时静默降级，功能不受影响 */ } };

/* ---------- Markdown 渲染 ---------- */
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function inline(s) {
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
  const links = [];
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, u) => { links.push([t, u]); return '\u0001' + (links.length - 1) + '\u0001'; });
  // 裸 URL 自动转为可点击链接（资料表里的纯文本网址）
  s = s.replace(/https?:\/\/[A-Za-z0-9._~:/?#[\]@!$&'()*+,;=%-]+/g,
    m => '<a href="' + m + '" target="_blank" rel="noopener">' + m + '</a>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\s][^*]*?)\*/g, '$1<em>$2</em>');
  s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  s = s.replace(/\u0001(\d+)\u0001/g, (m, i) => {
    const t = links[i][0], u = links[i][1];
    return u.startsWith('#')
      ? '<a class="ilink" href="' + u + '">' + t + '</a>'
      : '<a href="' + u + '" target="_blank" rel="noopener">' + t + '</a>';
  });
  s = s.replace(/\u0000(\d+)\u0000/g, (m, i) => '<code>' + codes[i] + '</code>');
  return s;
}
function itemHtml(txt, f) {
  const tm = txt.match(/^\[( |x)\]\s*([\s\S]*)$/);
  if (tm) {
    const key = f.id + ':' + (f._ck++);
    const on = tm[1] === 'x' || !!store.ck[key];
    return '<label class="ck"><input type="checkbox" data-ck="' + key + '"' + (on ? ' checked' : '') + '><span>' + inline(esc(tm[2])) + '</span></label>';
  }
  return inline(esc(txt));
}
function listHtml(items, f) {
  const root = { kids: [] }; const st = [{ ind: -1, node: root }];
  for (const it of items) {
    const n = { it, kids: [] };
    while (st[st.length - 1].ind >= it.ind) st.pop();
    st[st.length - 1].node.kids.push(n); st.push({ ind: it.ind, node: n });
  }
  function rec(n) {
    if (!n.kids.length) return '';
    const ord = n.kids[0].it.ord;
    let s = ord ? '<ol>' : '<ul>';
    for (const k of n.kids) s += '<li>' + itemHtml(k.it.txt, f) + rec(k) + '</li>';
    return s + (ord ? '</ol>' : '</ul>');
  }
  return rec(root);
}
function mdToHtml(md, f) {
  f._ck = 0;
  const lines = md.replace(/\r\n?/g, '\n').split('\n');
  const out = []; let i = 0;
  const blank = s => /^\s*$/.test(s);
  const blockStart = /^\s*(#{1,4}\s|```|>|\||\s*[-*]\s|\s*\d+\.\s)/;
  while (i < lines.length) {
    const ln = lines[i];
    if (/^\s*```/.test(ln)) {
      const lang = (ln.match(/^\s*```(\S*)/) || [])[1] || '';
      i++; const buf = [];
      while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++;
      if (lang === 'mermaid') {
        out.push('<div class="mermaidbox"><div class="mermaidbox-h">📈 流程图（mermaid 源码，粘贴到 GitHub / typora 可直接渲染）</div><pre class="code"><code>' + esc(buf.join('\n')) + '</code></pre></div>');
      } else {
        out.push('<pre class="code"' + (lang ? ' data-lang="' + esc(lang) + '"' : '') + '><code>' + esc(buf.join('\n')) + '</code></pre>');
      }
      continue;
    }
    const hm = ln.match(/^(#{1,4})\s+(.*)$/);
    if (hm) { out.push('<h' + hm[1].length + '>' + inline(esc(hm[2])) + '</h' + hm[1].length + '>'); i++; continue; }
    if (/^\s*(---+|\*\*\*+)\s*$/.test(ln)) { out.push('<hr>'); i++; continue; }
    if (ln.includes('|') && i + 1 < lines.length && lines[i + 1].includes('-') && /^\s*\|?[\s:|-]+$/.test(lines[i + 1])) {
      const row = r => r.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(c => c.trim());
      const head = row(ln); i += 2; const rows = [];
      while (i < lines.length && lines[i].includes('|') && !blank(lines[i])) { rows.push(row(lines[i])); i++; }
      out.push('<div class="twrap"><table><thead><tr>' + head.map(c => '<th>' + inline(esc(c)) + '</th>').join('') + '</tr></thead><tbody>'
        + rows.map(r => '<tr>' + r.map(c => '<td>' + inline(esc(c)) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>');
      continue;
    }
    if (/^\s*>/.test(ln)) {
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) { buf.push(lines[i].replace(/^\s*>\s?/, '')); i++; }
      out.push('<blockquote>' + buf.map(s => blank(s) ? '' : '<p>' + inline(esc(s)) + '</p>').join('') + '</blockquote>');
      continue;
    }
    const lm = ln.match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
    if (lm) {
      const items = [{ ind: lm[1].length, ord: /\d/.test(lm[2]), txt: lm[3] }];
      i++;
      while (i < lines.length) {
        const m2 = lines[i].match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
        if (m2) { items.push({ ind: m2[1].length, ord: /\d/.test(m2[2]), txt: m2[3] }); i++; }
        else if (!blank(lines[i]) && /^\s{2,}\S/.test(lines[i]) && !blockStart.test(lines[i])) { items[items.length - 1].txt += '<br>' + lines[i].trim(); i++; }
        else if (blank(lines[i]) && i + 1 < lines.length && /^(\s*)([-*]|\d+\.)\s+/.test(lines[i + 1])) { i++; }
        else break;
      }
      out.push(listHtml(items, f));
      continue;
    }
    if (blank(ln)) { i++; continue; }
    const buf = [];
    while (i < lines.length && !blank(lines[i]) && !blockStart.test(lines[i])) { buf.push(lines[i].trim()); i++; }
    out.push('<p>' + buf.map(s => inline(esc(s))).join('<br>') + '</p>');
  }
  return out.join('\n');
}

/* ---------- 进度 ---------- */
function statsOf(files) {
  let total = 0, done = 0, doneFiles = 0;
  files.forEach(f => {
    if (f.ck > 0) {
      total += f.ck;
      for (let k = 0; k < f.ck; k++) if (store.ck[f.id + ':' + k]) done++;
    } else { total += 1; if (store.done[f.id]) done++; }
    if (store.done[f.id]) doneFiles++;
  });
  return { total, done, doneFiles, n: files.length };
}
function stageStats(si) { return statsOf(stageFiles[si] || []); }
function overall() { return statsOf(DATA.files); }
function updateBars() {
  const o = overall();
  const pct = o.total ? Math.round(o.done / o.total * 100) : 0;
  $('#ovBar').style.width = pct + '%'; $('#ovNum').textContent = pct + '%（' + o.done + '/' + o.total + '）';
  document.querySelectorAll('[data-stageprog]').forEach(el => {
    const s = stageStats(+el.dataset.stageprog);
    el.style.width = (s.total ? Math.round(s.done / s.total * 100) : 0) + '%';
  });
  document.querySelectorAll('[data-fdot]').forEach(el => el.classList.toggle('on', !!store.done[el.dataset.fdot]));

let searchIndex = null;
function buildSearchIndex() {
  searchIndex = DATA.files.map(f => ({
    id: f.id, title: f.title, stage: f.stage,
    lines: f.md.split('\n')
      .map(l => l
        .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
        .replace(/\*\*|~~|`/g, '')
        .replace(/^[#>\s\-*| ]+/, '')
        .replace(/^\[[ x]\]\s*/, '')
        .trim())
      .filter(l => l.length > 4)
  }));
}
function renderSearch(q) {
  if (!searchIndex) buildSearchIndex();
  q = q.trim();
  if (!q) return renderHome();
  const ql = q.toLowerCase(); const res = [];
  for (const f of searchIndex) {
    const hits = f.lines.filter(l => l.toLowerCase().includes(ql));
    if (hits.length) res.push({ f, hits: hits.slice(0, 4), total: hits.length });
  }
  res.sort((a, b) => b.total - a.total);
  $('#content').innerHTML = '<div class="md"><h1>🔍 搜索：' + esc(q) + '</h1></div>'
    + (res.length ? '<div class="sres">' + res.slice(0, 40).map(r =>
      '<div class="grp"><div class="gt" onclick="pendingHighlight=' + JSON.stringify(JSON.stringify(q)) + ';goto(\'' + r.f.id + '\')">' + esc(r.f.title) + '<span class="cnt">' + r.total + ' 处匹配</span></div>'

      + '</div>').join('') + '</div>'
      : '<div class="note">没有找到「' + esc(q) + '」。试试更短的关键词，如：HashMap、线程池、缓存穿透、秒杀。</div>');
  markActive(null);
  $('#mainwrap').scrollTo(0, 0);
}
function highlightAll(root, q) {
  if (!q) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  const escRe = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp(escRe, 'gi');
  let first = null;
  for (const n of nodes) {
    if (n.parentElement.closest('pre, code, script, mark, input')) continue;
    if (!re.test(n.nodeValue)) continue;
    re.lastIndex = 0;
    const frag = document.createDocumentFragment(); let last = 0, m;
    const text = n.nodeValue;
    while ((m = re.exec(text))) {
      frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      const mk = document.createElement('mark'); mk.textContent = m[0]; frag.appendChild(mk);
      if (!first) first = mk;
      last = m.index + m[0].length;
      if (m[0].length === 0) re.lastIndex++;
    }
    frag.appendChild(document.createTextNode(text.slice(last)));
    n.parentNode.replaceChild(frag, n);
  }
  if (first) setTimeout(() => first.scrollIntoView({ block: 'center', behavior: 'smooth' }), 60);
}

  let h = '<div class="qfb ' + (ok ? 'ok' : 'bad') + '">' + (ok ? '✅ 回答正确' : '❌ 回答错误　' + esc(ansTxt)) + '</div>'
    + '<blockquote><p>' + inline(esc(q.exp)) + '</p></blockquote>';
  if (q.ref) h += '<div class="ref" style="margin:-6px 0 14px;font-size:12.5px">📖 详见 <a href="#/f/' + q.ref + '">' + esc(byId[q.ref] ? byId[q.ref].title : '') + '</a></div>';
  h += '<div class="facts"><button class="btn primary" onclick="quizNext()">' + (quizSession.i + 1 >= quizSession.pool.length ? '查看本轮成绩 →' : '下一题 →') + '</button></div>';
  return h;
}
function goWeakCat(c) { window.__pendingCat = c; location.hash = '#/quiz'; }
function quizFilter(patch) {
  Object.assign(quizSession, patch, { i: 0, revealed: false, sel: -1, vals: [], round: { done: 0, right: 0 } });
  renderQuiz();
}
function quizRestart() { Object.assign(quizSession, { i: 0, revealed: false, sel: -1, vals: [], round: { done: 0, right: 0 } }); renderQuiz(); }
function quizNext() { quizSession.i++; quizSession.revealed = false; quizSession.sel = -1; quizSession.vals = []; renderQuiz(); }
function recordQuiz(q, ok) {
  const st = store.quiz[q.id] || (store.quiz[q.id] = { r: 0, w: 0 });
  ok ? st.r++ : st.w++;
  st.last = ok ? 'right' : 'wrong';
  if (quizSession) { quizSession.round.done++; if (ok) quizSession.round.right++; }
  save();
}
function pickOpt(k) {
  const s = quizSession, q = s.pool[s.i];
  if (!q || s.revealed || q.kind !== 'select') return;
  s.sel = k; s.revealed = true;
  recordQuiz(q, k === 'ABCD'.indexOf(q.a));
  renderQuiz();
}
function submitBlanks() {
  const s = quizSession, q = s.pool[s.i];
  if (!q || s.revealed || q.kind !== 'blank') return;
  const n = q.q.split(/＿{2,}/).length - 1;
  const inputs = document.querySelectorAll('.blankin');
  s.vals = []; s.blankOk = [];
  for (let k = 0; k < n; k++) {
    const v = (inputs[k] ? inputs[k].value : '');
    s.vals.push(v);
    const alts = (q.alts[k] || []);
    s.blankOk.push(alts.some(a => QNORM(a) === QNORM(v)));
  }
  s.revealed = true;
  recordQuiz(q, s.blankOk.every(Boolean));
  renderQuiz();
  if (!s.blankOk.every(Boolean)) {
    const inp = document.querySelector('.blankin');
    if (inp) inp.focus();
  }
}
function exportWrong() {
  const wrong = (DATA.quiz || []).filter(q => (store.quiz[q.id] || {}).last === 'wrong');
  if (!wrong.length) { openOverlay('📤 错题导出', '当前错题池是空的，太棒了！保持下去。', () => true); return; }
  let md = '# 错题本（' + new Date().toLocaleDateString() + '，共 ' + wrong.length + ' 题）\n\n';
  wrong.forEach(q => {
    md += '## [' + q.cat + '·' + q.diff + '] ' + q.q + '\n';
    if (q.kind === 'select') { q.opts.forEach((o, k) => md += '- ' + 'ABCD'[k] + '. ' + o + '\n'); md += '\n正确答案：' + q.a + '\n'; }
    else md += '\n正确答案：' + q.alts.map(a => a.join('／')).join('；') + '\n';
    md += '解析：' + q.exp.replace(/\[《([^》]+)》\]\(#[^)]+\)/g, '《$1》') + '\n\n';
  });
  const done = ok => openOverlay('📤 错题导出（' + wrong.length + ' 题，' + (ok ? '已复制到剪贴板' : '请手动复制') + '）', md, () => true);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(md).then(() => done(true)).catch(() => done(false));
  } else done(false);
}

/* ---------- 综合大考 ---------- */
let examSession = null, examTimer = null;
function fmtMs(ms) {
  const t = Math.max(0, Math.floor(ms / 1000));
  return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
}
function renderExam() {
  const s = examSession;
  if (!s) {
    $('#content').innerHTML = '<div class="cards-wrap"><div class="md"><h1>🏁 综合大考</h1>'
      + '<p style="color:var(--muted);font-size:13.5px">从全部 ' + (DATA.quiz || []).length + ' 题中随机抽题、统一计时，交卷后出分并逐题解析；成绩计入错题本与首页「薄弱环节」。建议大部分内容学完后再来，每次大考间隔至少一周。</p></div>'
      + '<div class="fcard" style="align-items:center;gap:16px;text-align:center">'
      + '<div style="font-size:13.5px;color:var(--muted)">选择题量（每题 1 分钟，中途可切换题目）</div>'
      + '<div class="chips" style="justify-content:center;margin:0">'
      + [10, 20, 40].map(n => '<span class="chip" onclick="startExam(' + n + ')">' + n + ' 题 · ' + n + ' 分钟</span>').join('')
      + '</div><div class="hint">快捷键：数字键 1~4 选答案 · ←/→ 切换题目 · E 交卷</div></div></div>';
    markActive(null); return;
  }
  if (s.phase === 'run') {
    const q = s.order[s.i];
    const answeredN = s.order.filter(x => {
      const a = s.answers[x.id];
      return a !== undefined && a !== null && !(Array.isArray(a) && a.every(v => !v));
    }).length;
    const dots = s.order.map((x, k) => {
      const a = s.answers[x.id];
      const has = a !== undefined && a !== null && !(Array.isArray(a) && a.every(v => !v));
      return '<div class="exdot' + (has ? ' answered' : '') + (k === s.i ? ' cur' : '') + '" onclick="examGo(' + k + ')">' + (k + 1) + '</div>';
    }).join('');
    let body;
    if (q.kind === 'select') {
      const sel = s.answers[q.id];
      body = '<div class="q">' + inline(esc(q.q)) + '</div><div style="margin-top:16px">'
        + q.opts.map((o, k) => '<div class="qopt' + (sel === 'ABCD'[k] ? ' right' : '') + '" onclick="examPick(' + k + ')"><b>' + 'ABCD'[k] + '</b><span>' + inline(esc(o)) + '</span></div>').join('') + '</div>';
    } else {
      const segs = q.q.split(/＿{2,}/);
      const cur = s.answers[q.id] || [];
      const stem = segs.map((seg, k) => inline(esc(seg))
        + (k < segs.length - 1 ? '<input class="blankin" data-k="' + k + '" value="' + esc(cur[k] || '') + '" oninput="examSetBlank(this)" placeholder="填空' + (k + 1) + '">' : '')).join('');
      body = '<div class="qstem">' + stem + '</div><div class="hint" style="margin-top:14px">作答会自动保存，切题不丢失</div>';
    }
    $('#content').innerHTML = '<div class="cards-wrap">'
      + '<div class="exbar"><span class="extimer" id="examTimer">' + fmtMs(s.deadline - Date.now()) + '</span>'
      + '<span style="font-size:13px;color:var(--muted)">第 ' + (s.i + 1) + ' / ' + s.order.length + ' 题 · 已答 ' + answeredN + '</span><span class="spacer"></span>'
      + '<button class="btn primary" onclick="submitExam()">交卷</button>'
      + '<button class="btn" onclick="examQuit()">放弃</button></div>'
      + '<div class="exgrid">' + dots + '</div>'
      + '<div class="fcard" onclick="event.stopPropagation()"><div class="cat">' + esc(q.cat) + ' · ' + esc(q.diff) + '</div>' + body + '</div>'
      + '<div class="facts"><button class="btn" onclick="examGo(' + (s.i - 1) + ')"' + (s.i === 0 ? ' disabled' : '') + '>← 上一题</button>'
      + '<button class="btn primary" onclick="examGo(' + (s.i + 1) + ')"' + (s.i === s.order.length - 1 ? ' disabled' : '') + '>下一题 →</button></div></div>';
    markActive(null); return;
  }
  const right = s.order.filter(q => s.result[q.id]).length;
  const list = s.order.map((q, k) => {
    const ok = s.result[q.id];
    return '<div class="exres-item' + (ok ? '' : ' bad') + '"><b>' + (ok ? '✅' : '❌') + ' 第 ' + (k + 1) + ' 题（' + esc(q.cat) + '·' + esc(q.diff) + '）</b>'
      + '<div style="margin:4px 0">' + inline(esc(q.q)) + '</div>'
      + (q.kind === 'select'
        ? '<div style="font-size:12.5px;color:var(--muted)">你的答案：' + esc(String(s.answers[q.id] || '未作答')) + '　·　正确答案：' + esc(q.a) + '</div>'
        : '<div style="font-size:12.5px;color:var(--muted)">正确答案：' + esc(q.alts.map(a => a.join('／')).join('；')) + '</div>')
      + '<blockquote style="margin:8px 0 0"><p>' + inline(esc(q.exp)) + '</p></blockquote>'
      + (q.ref && byId[q.ref] ? '<div class="ref" style="font-size:12.5px;margin-top:6px">📖 详见 <a href="#/f/' + q.ref + '">' + esc(byId[q.ref].title) + '</a></div>' : '')
      + '</div>';
  }).join('');
  $('#content').innerHTML = '<div class="cards-wrap"><div class="md"><h1>🏁 大考成绩</h1></div>'
    + '<div class="fcard" style="align-items:center;text-align:center"><div class="exscore">' + right + ' / ' + s.order.length + '</div>'
    + '<div style="font-size:14px;color:var(--muted);margin-top:6px">正确率 ' + Math.round(right / s.order.length * 100) + '% · 用时 ' + fmtMs(s.usedMs) + ' · ' + (right / s.order.length >= 0.85 ? '达到 85% 分手线，继续保持！' : '未到 85% 分手线：用「只做错题」+ 首页「薄弱环节」补漏后再来') + '</div>'
    + '<div class="acts" style="margin-top:14px;justify-content:center"><button class="btn primary" onclick="examSession=null;renderExam()">再来一套</button>'
    + '<button class="btn" onclick="location.hash=\'#/quiz\'">去练习模式复盘</button></div></div>'
    + '<div style="margin-top:14px">' + list + '</div></div>';
  markActive(null);
}
function startExam(n) {
  if (examTimer) clearInterval(examTimer);
  const pool = (DATA.quiz || []).slice();
  const order = shuffledArr(pool).slice(0, Math.min(n, pool.length));
  examSession = { phase: 'run', order, i: 0, answers: {}, result: {}, deadline: Date.now() + order.length * 60000, startTs: Date.now(), usedMs: 0 };
  examTimer = setInterval(examTick, 500);
  renderExam();
}
function examTick() {
  const s = examSession;
  if (!s || s.phase !== 'run') return;
  const el = document.getElementById('examTimer');
  if (el) {
    const left = s.deadline - Date.now();
    el.textContent = fmtMs(left);
    el.classList.toggle('low', left < 60000);
  }
  if (Date.now() >= s.deadline) submitExam(true);
}
function examGo(k) { const s = examSession; if (!s || k < 0 || k >= s.order.length) return; s.i = k; renderExam(); }
function examPick(k) { const s = examSession, q = s.order[s.i]; if (q.kind !== 'select') return; s.answers[q.id] = 'ABCD'[k]; renderExam(); }
function examSetBlank(inp) {
  const s = examSession, q = s.order[s.i];
  const k = +inp.dataset.k;
  const cur = s.answers[q.id] || [];
  cur[k] = inp.value;
  s.answers[q.id] = cur;   // 不重渲染，避免输入焦点丢失
}
function examQuit() {
  if (confirm('放弃本次大考？作答将不计入记录。')) {
    if (examTimer) clearInterval(examTimer);
    examSession = null; renderExam();
  }
}
function submitExam(auto) {
  const s = examSession;
  if (!s || s.phase !== 'run') return;
  if (!auto && !confirm('确认交卷？未作答的题按错误计。')) return;
  if (examTimer) clearInterval(examTimer);
  s.usedMs = Date.now() - s.startTs; s.phase = 'done';
  s.order.forEach(q => {
    let ok;
    if (q.kind === 'select') ok = s.answers[q.id] === q.a;
    else {
      const n = q.q.split(/＿{2,}/).length - 1;
      const vals = s.answers[q.id] || [];
      ok = [];
      for (let k = 0; k < n; k++) ok.push((q.alts[k] || []).some(a => QNORM(a) === QNORM(vals[k] || '')));
      ok = ok.every(Boolean);
    }
    s.result[q.id] = ok;
    recordQuiz(q, ok);
  });
  if (location.hash.startsWith('#/exam') || auto) renderExam();
}

/* ---------- 导入导出 / 主题 / 事件 ---------- */
function openOverlay(title, text, onOk) {
  $('#ovTitle').textContent = title; $('#ovText').value = text || '';
  $('#overlay').style.display = 'flex';
  $('#ovOk').onclick = () => { if (onOk($('#ovText').value)) $('#overlay').style.display = 'none'; };
  $('#ovCancel').onclick = () => $('#overlay').style.display = 'none';
}
$('#expBtn').onclick = () => openOverlay('导出进度（复制保存）', JSON.stringify(store), () => true);
$('#impBtn').onclick = () => openOverlay('导入进度（粘贴 JSON）', '', t => {
  try { const s = JSON.parse(t); if (typeof s !== 'object') throw 0; store = s; store.ck = store.ck || {}; store.done = store.done || {}; store.cards = store.cards || {}; store.quiz = store.quiz || {}; save(); location.reload(); return true; }
  catch (e) { alert('JSON 解析失败，请检查内容'); return false; }
});
$('#resetBtn').onclick = () => { if (confirm('确定清空所有打卡与学习进度？')) { store = { ck: {}, done: {}, cards: {}, quiz: {}, theme: store.theme, last: null }; save(); location.reload(); } };
$('#themeBtn').onclick = () => {
  store.theme = store.theme === 'dark' ? 'light' : 'dark'; save();
  document.documentElement.dataset.theme = store.theme;
  $('#themeBtn').textContent = store.theme === 'dark' ? '☀️' : '🌙';
};
$('#burger').onclick = () => $('#sidebar').classList.toggle('open');
$('#searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') { location.hash = '#/search/' + encodeURIComponent(e.target.value.trim()); }
});
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement.tagName !== 'TEXTAREA' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); $('#searchInput').focus(); }
  if (e.key === 'Escape') { $('#overlay').style.display = 'none'; $('#sidebar').classList.remove('open'); }
  if (e.key === 'Enter' && e.target && e.target.classList && e.target.classList.contains('blankin')) { e.preventDefault(); submitBlanks(); }
  const tg = document.activeElement ? document.activeElement.tagName : '';
  if (tg === 'INPUT' || tg === 'TEXTAREA') return;
  const h = location.hash || '#/home';
  if (h.startsWith('#/f/')) {
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      const id = decodeURIComponent(h.slice(4));
      const idx = DATA.files.findIndex(f => f.id === id);
      const nb = DATA.files[idx + (e.key === 'ArrowRight' ? 1 : -1)];
      if (nb) { e.preventDefault(); goto(nb.id); }
    }
  } else if (h.startsWith('#/cards')) {
    if (e.key === ' ') { e.preventDefault(); cardSession.revealed = !cardSession.revealed; renderCards(); }
    else if (e.key === '1' && cardSession.revealed) grade('known');
    else if (e.key === '2' && cardSession.revealed) grade('review');
  } else if (h.startsWith('#/quiz')) {
    const s = quizSession;
    if (!s || !s.pool || s.i >= s.pool.length) return;
    const q = s.pool[s.i];
    if (!s.revealed && q.kind === 'select' && /^[1-4]$/.test(e.key)) { e.preventDefault(); pickOpt(+e.key - 1); }
    else if (s.revealed && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); quizNext(); }
  } else if (h.startsWith('#/exam')) {
    const s = examSession;
    if (!s || s.phase !== 'run') return;
    const q = s.order[s.i];
    if (q.kind === 'select' && /^[1-4]$/.test(e.key)) { e.preventDefault(); examPick(+e.key - 1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); examGo(s.i + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); examGo(s.i - 1); }
    else if (e.key === 'e' || e.key === 'E') { e.preventDefault(); submitExam(); }
  }
});
document.addEventListener('change', e => {
  if (e.target.dataset && e.target.dataset.ck) {
    if (e.target.checked) store.ck[e.target.dataset.ck] = 1; else delete store.ck[e.target.dataset.ck];
    save(); updateBars();
  }
});
window.addEventListener('hashchange', route);

/* ---------- 启动 ---------- */
document.documentElement.dataset.theme = store.theme;
$('#themeBtn').textContent = store.theme === 'dark' ? '☀️' : '🌙';
buildSidebar();
route();
updateBars();
if (innerWidth > 920) document.querySelector('.stage')?.classList.add('open');
</script>
</body>
