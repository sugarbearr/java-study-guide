十万级吞吐扛住瞬时下单洪峰 | 数据库被瞬时流量打垮 |\n\n## 🚀 快速上手\n\n### 1. Docker 启动（NameServer + Broker + Dashboard）\n\n```bash\n# 1) NameServer\ndocker run -d --name rmqnamesrv -p 9876:9876 apache/rocketmq:5.3.1 sh mqnamesrv\n\n# 2) Broker（Mac 上用 host.docker.internal 连 NameServer；Linux 用宿主机 IP）\ndocker run -d --name rmqbroker -p 10911:10911 -p 10909:10909 \\\n  -e \"NAMESRV_ADDR=host.docker.internal:9876\" \\\n  -e \"JAVA_OPT_EXT=-Xmx512m -Xms512m\" \\\n  apache/rocketmq:5.3.1 sh mqbroker -n host.docker.internal:9876\n\n# 3) 可视化控制台\ndocker run -d --name rmqdashboard -p 8081:8080 \\\n  -e \"JAVA_OPTS=-Drocketmq.namesrv.addr=host.docker.internal:9876\" \\\n  apacherocketmq/rocketmq-dashboard:latest\n# 控制台：http://localhost:8081\n```\n\n### 2. Spring Boot 整合（三种发送方式 + 消费）\n\n```xml\n<dependency>\n    <groupId>org.apache.rocketmq<\/groupId>\n    <artifactId>rocketmq-spring-boot-starter<\/artifactId>\n    <version>2.3.1<\/version>\n<\/dependency>\n```\n\n```yaml\n# application.yml\nrocketmq:\n  name-server: localhost:9876\n  producer:\n    group: order-producer-group        # 生产者组（事务消息回查时有用）\n    send-message-timeout: 3000\n```\n\n```java\n@Service\n@RequiredArgsConstructor\n@Slf4j\npublic class OrderProducer {\n    private final RocketMQTemplate template;\n\n    /** 同步发送：等 Broker 确认，可靠性要求高（订单、支付） */\n    public void syncSend(OrderMsg msg) {\n        SendResult result = template.syncSend(\"order-topic\", msg);\n        log.info(\"发送状态: {}\", result.getSendStatus());\n    }\n\n    /** 异步发送：回调通知成功/失败，兼顾吞吐与可靠 */\n    public void asyncSend(OrderMsg msg) {\n        template.asyncSend(\"order-topic\", msg, new SendCallback() {\n            public void onSuccess(SendResult r) { log.info(\"OK\"); }\n            public void onException(Throwable e) { log.error(\"失败，落库补偿\", e); }\n        });\n    }\n\n    /** 单向发送：只管发不等结果，用于日志类消息（可能丢） */\n    public void sendOneWay(OrderMsg msg) { template.sendOneWay(\"order-topic\", msg); }\n\n    /** 延迟消息：默认 18 个等级（1s 5s 10s 30s 1m 2m 3m 4m 5m 6m 7m 8m 9m 10m 20m 30m 1h 2h） */\n    public void sendDelay(OrderMsg msg) {\n        template.syncSend(\"order-topic\",\n                MessageBuilder.withPayload(msg).build(), 3000, 3); // level 3 = 10s\n    }\n\n    /** 顺序消息：同一 orderId 哈希到同一 MessageQueue，分区内先进先出 */\n    public void sendOrderly(OrderMsg msg) {\n        template.syncSendOrderly(\"order-topic\", msg, msg.getOrderId());\n    }\n}\n\n@Component\n@RocketMQMessageListener(\n        topic = \"order-topic\",\n        consumerGroup = \"order-consumer-group\",\n        consumeMode = ConsumeMode.ORDERLY,     // 顺序消费；默认 CONCURRENTLY 并发消费\n        selectorExpression = \"TagA || TagB\")   // 按 Tag 过滤，\"*\" 表示全部\n@Slf4j\npublic class OrderConsumer implements RocketMQListener<OrderMsg> {\n    @Override\n    public void onMessage(OrderMsg msg) {\n        log.info(\"消费: {}\", msg.getOrderId()); // 抛异常 = 消费失败，触发重试\n    }\n}\n```\n\n## 🔧 常用命令 / API 速查\n\n| 操作 | 命令 / API |\n| --- | --- |\n| 控制台 | Dashboard 查看 Topic、消费组、消息轨迹、堆积 |\n| 创建 Topic | 控制台创建，或 `sh mqadmin updateTopic -n localhost:9876 -t order-topic -c DefaultCluster` |\n| 发送消息 | `template.syncSend(topic, msg)` / `asyncSend` / `sendOneWay` |\n| 消费消息 | 类实现 `RocketMQListener<T>`，加 `@RocketMQMessageListener` |\n| 消费模式 | `MessageModel.CLUSTERING`（默认，负载均衡）/ `BROADCASTING`（广播） |\n| 死信 Topic | `%DLQ%+消费者组名`，重试耗尽后自动进入 |\n\n## 🧠 核心进阶\n\n### 1. 事务消息（面试重点，必须会画流程）\n\n```\nProducer                          Broker                         Consumer\n   │ ①发送半消息(Half Msg) ────────> │ (对消费者不可见)\n   │ <────②ACK 半消息落盘成功────────│\n   │ ③执行本地事务(扣库存/下单)\n   │ ④Commit/Rollback ────────────> │ Commit: 消息对消费者可见\n   │                                │ Rollback: 删除半消息\n   │      （若④网络丢失）            │ ⑤定时回查 checkLocalTransaction()\n   │ <────⑥回查请求────────────────│    根据本地事务状态返回 COMMIT/ROLLBACK\n   │                                │ ⑦消息可见 → 推送给 Consumer 消费\n```\n\n- 解决的问题：**\"本地事务成功\"与\"消息发出\"的原子性**（先发消息可能事务回滚了消息已出去；先提交事务再发消息可能发送失败）；\n- 注意：它只保证**生产端与本地事务的一致**，消费端仍需自己做幂等；\n- 回查依据：`@RocketMQTransactionListener` 的 `checkLocalTransaction()` 里反查业务表状态（如订单是否创建成功）。\n\n### 2. 顺序消息\n\n- 全局有序代价大，业务上只需**同一业务 key 有序**（同一订单：创建→支付→发货）；\n- 实现：发送时 `syncSendOrderly(topic, msg, orderId)`，相同 key 经哈希进入**同一个 MessageQueue**；消费端 `ConsumeMode.ORDERLY` 用队列级锁单线程消费该队列；\n- 注意：消费失败会阻塞当前队列重试，需设置合理的最大重试次数；Broker 宕机切换会短暂破坏顺序。\n\n### 3. 延迟消息\n\n- 4.x 固定 18 个等级（level 1~18，见上方注释），存入内部的 `SCHEDULE_TOPIC_XXXX`，定时任务按等级扫描到期后转回真实 Topic；\n- 5.x 基于**时间轮**支持任意时刻延迟（`deliverTimeMs`）；\n- 与 RabbitMQ 对比：原生支持、无队头阻塞，这是选 RocketMQ 的常见理由。\n\n### 4. 消费重试与死信、消费模式\n\n- 消费抛异常 → 默认重试 **16 次**，间隔递增（10s 起逐步拉长到 2h），期间消息堆积在 `RETRY_TOPIC`；全部失败进入死信 Topic **`%DLQ%消费者组名`**，人工处理；\n- **集群模式**（默认）：组内消费者分摊 MessageQueue，一条消息只被组内一个实例消费；**广播模式**：组内每个实例都消费一遍（如本地缓存刷新），广播模式失败不重试。\n\n### 5. 三大 MQ 对比与选型（必背）\n\n| 维度 | RabbitMQ | Kafka | RocketMQ |\n| --- | --- | --- | --- |\n| 吞吐量 | 万~十万级 | 百万级 | 十万级 |\n| 延迟 | 微秒~毫秒（最低） | 毫秒级 | 毫秒级 |\n| 路由能力 | 最强（四种交换机） | 弱（仅 topic/分区） | 中（Topic+Tag） |\n| 特色功能 | 延迟(插件)、死信、优先级 | 消息回溯、流处理生态 | 事务消息、顺序消息、延迟消息、消息轨迹 |\n| 消息保留 | 确认即删 | 按 offset/时间保留，可回放 | 确认后按时间保留 |\n| 语言/社区 | Erlang，社区活跃 | Scala/Java，大数据生态标准 | Java，阿里/国内生态 |\n| 典型场景 | 业务系统异步解耦、低延迟场景 | 日志、埋点、大数据管道 | 电商交易、订单等强业务场景 |\n\n选型建议：中小业务系统、需要灵活路由和低延迟 → RabbitMQ；日志流、大数据实时计算、超高吞吐 → Kafka；电商交易类业务、需要事务/顺序/延迟消息 → RocketMQ。没被公司技术栈绑架时，Java 团队业务系统选 RocketMQ 最省心。\n\n## 💼 高频面试题\n\n**Q：RocketMQ 事务消息的流程？**\n- 先发**半消息**（消费者不可见）→ Broker ACK → 执行**本地事务** → 根据结果 Commit/Rollback；\n- 若 Broker 未收到二次确认，定时**回查**生产者本地事务状态（查业务表）决定提交或回滚；\n- 本质：用\"半消息+回查\"把\"本地事务成功\"和\"消息可达\"绑成最终一致；消费端仍要幂等。\n\n**Q：顺序消息怎么保证？**\n- 发送端：同一业务 key（订单号）哈希路由到同一个 MessageQueue，队列内天然 FIFO；\n- 消费端：`ConsumeMode.ORDERLY`，对队列加锁单线程消费；\n- 代价：吞吐下降、消费失败会阻塞队列、Broker 扩缩容会短暂乱序。\n\n**Q：延迟消息是怎么实现的？**\n- 4.x：18 个固定等级，消息先写到系统 Topic `SCHEDULE_TOPIC_XXXX`，定时任务按等级扫描，到期后投回真实 Topic；\n- 5.x：时间轮支持任意延迟时间；\n- 面试可对比：RabbitMQ 用 TTL+死信有队头阻塞，Kafka 原生不支持延迟。\n\n**Q：三大 MQ 怎么选型？**\n- 吞吐：Kafka(百万) > RocketMQ(十万) > RabbitMQ(万~十万)；\n- 功能：业务功能 RocketMQ 最全（事务/顺序/延迟/轨迹），路由能力 RabbitMQ 最强；\n- 场景：日志/大数据管道选 Kafka；低延迟业务解耦选 RabbitMQ；电商交易、需要事务消息选 RocketMQ。\n\n**Q：消费重试机制？**\n- 并发消费失败默认重试 16 次，间隔指数递增；期间进入重试 Topic `%RETRY%组名`；\n- 耗尽后进入死信 Topic `%DLQ%组名`，需人工/补偿任务处理；\n- 广播模式不重试；顺序消费会本地重试并阻塞队列。\n\n## 🔗 推荐资料\n\n| 资料 | 说明 | 链接 |\n| --- | --- | --- |\n| JavaGuide 消息队列基础 | 消息队列通用知识与可靠性设计 | https://javaguide.cn/high-performance/message-queue/message-queue.html |\n| 廖雪峰 Spring Boot 集成消息队列 | Spring Boot 整合 MQ 实操 | https://liaoxuefeng.com/books/java/springboot/index.html |\n| JavaGuide 高可用系统设计指南 | 削峰、异步、解耦的系统性设计 | https://javaguide.cn/high-availability/high-availability-system-design.html |\n| pdai 架构知识体系 | MQ 在整体架构中的位置 | https://pdai.tech/md/arch/arch-z-overview.html |\n","ck":0},{"id":"f25","stage":5,"path":"05-中间件篇/05-Elasticsearch.md","title":"05-Elasticsearch","md":"# 05-Elasticsearch\n\n> **阶段**：中间件篇 ｜ **建议时长**：4 天 ｜ **前置**：MySQL 基础（03-数据库篇）、Docker 基础\n\n## 🧩 它是什么，解决什么问题\n\nElasticsearch（ES）是基于 Lucene 的**分布式搜索与分析引擎**，核心是**倒排索引**：把文档分词后建立\"**词 → 文档 ID 列表**\"的映射，查\"华为手机\"时直接拿到包含这两个词的文档集合，再按**相关度评分**排序——这正是 MySQL 做不好的事。\n\n**ES 与 MySQL 的分工**：\n\n| 对比点 | MySQL | Elasticsearch |\n| --- | --- | --- |\n| `LIKE '%手机%'` | 前模糊不走索引，**全表扫描** | 分词后命中倒排表，毫秒级 |\n| 相关度排序 | 只能按字段值排 | 按 BM25 评分：词频、权重、字段长度综合打分 |\n| 复杂聚合分析 | 慢，易拖垮主库 | 倒排+列存 doc_values，聚合飞快 |\n| 事务/强一致 | 强项 | 不支持事务，近实时（约 1s 延迟） |\n\n一句话：**MySQL 是\"存数据的\"，ES 是\"查数据的\"**。典型架构：MySQL 为主存，数据同步到 ES 专供搜索。\n\n## 📌 典型使用场景\n\n| 业务场景 | 为什么用它 | 不用的后果 |\n| --- | --- | --- |\n| 商品搜索（电商） | 多关键词分词检索 + 筛选 + 排序 + 高亮 | `LIKE '%xx%'` 全表扫，商品百万级时秒开不可能 |\n| 日志分析（ELK） | Filebeat→Kafka→Logstash→ES，集中检索海量日志 | 故障排查只能登机器 grep，效率极低 |\n| 站内搜索（文章/简历） | 全文检索 + 相关度排序 + 分词纠错 | 搜索结果不相关，用户体验差 |\n| 数据聚合看板 | terms/range 聚合秒级出报表 | MySQL `GROUP BY` 大表慢查询堆积 |\n\n## 🚀 快速上手\n\n### 1. Docker 启动（单节点，可选 Kibana）\n\n```bash\ndocker run -d --name es \\\n  -p 9200:9200 \\\n  -e discovery.type=single-node \\\n  -e ES_JAVA_OPTS=\"-Xms512m -Xmx512m\" \\\n  -e xpack.security.enabled=false \\\n  elasticsearch:8.14.0\n# 验证：curl http://localhost:9200\n# 9200 = REST API 端口；Kibana（可视化，可选）映射 5601 连接 http://host.docker.internal:9200\n# 中文分词需安装 IK 插件（镜像内执行 elasticsearch-plugin install analysis-ik 或自制镜像）\n```\n\n### 2. REST 风格 CRUD + DSL 查询\n\n```bash\n# 建索引 + Mapping：商品名用 text 分词，品牌用 keyword 精确\nPUT /product\n{\n  \"mappings\": {\n    \"properties\": {\n      \"name\":  { \"type\": \"text\",    \"analyzer\": \"ik_max_word\", \"search_analyzer\": \"ik_smart\" },\n      \"brand\": { \"type\": \"keyword\" },\n      \"price\": { \"type\": \"double\" },\n      \"desc\":  { \"type\": \"text\",    \"analyzer\": \"ik_max_word\" }\n    }\n  }\n}\n\n# 写入文档（可指定 id；不指定用自动生成）\nPOST /product/_doc/1\n{ \"name\": \"华为 Mate60 Pro\", \"brand\": \"华为\", \"price\": 6999, \"desc\": \"麒麟芯片 支持卫星通信\" }\nPOST /product/_doc/2\n{ \"name\": \"小米 14 Ultra\",  \"brand\": \"小米\", \"price\": 6499, \"desc\": \"徕卡光学 骁龙芯片\" }\n\n# 查询：bool 组合 —— must 打分、filter 不打分可缓存\nGET /product/_search\n{\n  \"query\": {\n    \"bool\": {\n      \"must\":     [ { \"match\": { \"name\": \"华为手机\" } } ],\n      \"should\":   [ { \"match\": { \"desc\": \"卫星通信\" } } ],\n      \"filter\":   [ { \"range\": { \"price\": { \"gte\": 5000, \"lte\": 8000 } } } ]\n    }\n  },\n  \"highlight\": { \"fields\": { \"name\": {} } },     // 命中词高亮\n  \"sort\":  [ { \"price\": \"desc\" } ],              // 排序\n  \"from\": 0, \"size\": 10                          // 分页\n}\n```\n\n| DSL 关键词 | 作用 | 注意 |\n| --- | --- | --- |\n| `match` | 对 text 分词后检索，参与相关度打分 | 搜索字段用这个 |\n| `match_phrase` | 短语匹配，分词后要求**按序相邻** | 更精确，召回更少 |\n| `term` | 精确匹配，**不涉及分词** | 只对 keyword/数值/日期字段用 |\n| `bool` | 组合：`must`(AND) / `should`(OR) / `must_not` / `filter` | filter 不算分且可缓存，条件过滤放这里 |\n| `from/size` | 浅分页 | `from + size <= 10000`，深分页用 `search_after` |\n\n### 3. Spring Boot 整合（Spring Data Elasticsearch）\n\n```xml\n<dependency>\n    <groupId>org.springframework.boot<\/groupId>\n    <artifactId>spring-boot-starter-data-elasticsearch<\/artifactId>\n<\/dependency>\n```\n\n```yaml\nspring:\n  elasticsearch:\n    uris: http://localhost:9200\n```\n\n```java\n@Document(indexName = \"product\")\n@Data\npublic class Product {\n    @Id\n    private Long id;\n    @Field(type = FieldType.Text, analyzer = \"ik_max_word\", searchAnalyzer = \"ik_smart\")\n    private String name;\n    @Field(type = FieldType.Keyword)     // 品牌精确匹配/聚合，必须是 Keyword\n    private String brand;\n    @Field(type = FieldType.Double)\n    private Double price;\n}\n\npublic interface ProductRepository extends ElasticsearchRepository<Product, Long> {\n    List<Product> findByName(String name);   // 方法名派生查询\n}\n\n// 常用操作\n@Service\n@RequiredArgsConstructor\npublic class ProductSearchService {\n    private final ProductRepository repository;\n    private final ElasticsearchOperations operations; // 复杂查询用Criteria/原生DSL\n\n    public void save(Product p) { repository.save(p); }\n    public List<Product> search(String keyword) { return repository.findByName(keyword); }\n    public long countByBrand(String brand) { return repository.count(); }\n}\n```\n\n## 🔧 常用命令 / API 速查\n\n| 操作 | 命令 |\n| --- | --- |\n| 查看集群健康 | `GET /_cluster/health`（green/yellow/red） |\n| 查看索引 Mapping | `GET /product/_mapping` |\n| 删除索引 | `DELETE /product` |\n| 按 id 查/删 | `GET/DELETE /product/_doc/1` |\n| 批量导入 | `POST /_bulk`（一行动作描述 + 一行文档） |\n| 分词测试 | `GET /product/_analyze {\"analyzer\":\"ik_smart\",\"text\":\"华为手机\"}` |\n| 聚合统计 | `\"aggs\": {\"brand_count\": {\"terms\": {\"field\": \"brand\"}}}` |\n\n**与 MySQL 概念对照**：\n\n| Elasticsearch | MySQL | 说明 |\n| --- | --- | --- |\n| Index | Table | 一类文档的集合 |\n| Document | Row | JSON 文档 |\n| Field | Column | 字段 |\n| Mapping | Schema | 字段类型定义 |\n| Shard（主分片） | 分库分表 | 建索引时定，之后不可改 |\n| Replica（副本） | 从库 | 容灾 + 读扩展 |\n\n## 🧠 核心进阶\n\n### 1. 倒排索引（面试必问）\n\n- 正排：文档 ID → 内容（MySQL 主键查询）；倒排：**分词后的词条 → 包含该词的文档 ID 列表（posting list）**；\n- 写入时对 text 字段分词，为每个词建倒排；查询\"华为手机\"→ 分词为\"华为/手机\" → 查两张倒排表 → 取交集/并集 → 按相关度（BM25）排序；\n- 词条表有序 + 压缩，查找近似 O(logN)，因此海量文档也能毫秒级检索。\n\n### 2. 分词器（analyzer）\n\n面试官想听：中文检索效果一半取决于分词器，且**写入和查询可以用不同的分词器**。\n\n- **standard**（默认）：按 Unicode 切词，中文基本被切成**单字**（\"华为手机\"→华/为/手/机），搜\"手机\"能命中但噪声大、相关性差；中文必须换 **IK 插件**。\n- IK 两种模式：`ik_max_word`（最细粒度，\"华为手机\"→华为/手机/华为手机…，宁可多切）适合**写入**保证召回；`ik_smart`（粗粒度，少而准）适合**查询**。前面 Mapping 里 `analyzer=ik_max_word, search_analyzer=ik_smart` 就是这个搭配。\n- 自定义词典：`IKAnalyzer.cfg.xml` 加 `ext_dict`（新词如\"徕卡\"不被乱切）+ `ext_stopwords`（停用词如\"的/了\"）；改词典后热加载或重启，ES 重启不丢。\n- 分词只发生在 `text` 字段上；`keyword` 跳过分词器（见下一节）。\n- 为什么 MySQL LIKE 不行而 ES 行：`LIKE '%手机%'` 前模糊无法走索引只能全表扫，也无法\"按匹配程度打分\"；ES 靠**倒排索引**直接定位含词的文档，再用 **BM25**（词频高、文档中出现少、字段短 → 分高）给相关度打分排序。\n- 验证工具：`GET /_analyze {\"analyzer\":\"ik_smart\",\"text\":\"华为手机\"}`，调搜索效果先查分词结果。\n\n### 3. text vs keyword（高频坑）\n\n- `text`：写入时**分词**建倒排，用于全文检索（match）；不能直接精确匹配/聚合；\n- `keyword`：**不分词**，整体作为一个词，用于精确匹配（term）、排序、聚合；\n- 经典错误：对 text 字段用 term 查\"华为手机\"查不到（因为分词后没有\"华为手机\"这个整体词）；品牌、状态、类别字段必须用 keyword；\n- 一个字段可同时要两个能力：`\"fields\": {\"raw\": {\"type\": \"keyword\"}}`。\n\n### 4. 写入为什么是\"近实时\"（NRT）\n\n```\n写入 → Index Buffer(内存) + translog(事务日志,防丢)\n  ↓ refresh（默认每 1s）→ 生成 segment，写入 OS 页缓存 → 此时才可被搜索\n  ↓ flush（默认 30min 或 translog 满）→ segment 持久化到磁盘，清空 translog\n```\n\n- 所以写入到可搜索**最多有约 1 秒延迟**（`refresh_interval` 可调）；追求实时可设 `refresh_interval=1s` 以下但费性能；\n- segment 一旦生成不可修改：删除只是打标记，更新=删旧+插新，这是 ES 更新代价高的根源。\n\n### 5. 深分页问题\n\n- `from + size`：每个分片都要取 `from + size` 条到协调节点排序，`from` 越大代价越高，默认上限 10000；\n- 深翻页方案：**`search_after` + PIT（Point in Time）**——用上一页最后一条的排序值做游标，性能稳定，适合\"下一页\"式翻页；`scroll` 适合一次性导出全量（已不推荐做分页）；\n- 产品层面规避：搜索结果只允许翻前 100 页（如 Google）。\n\n### 6. 数据同步方案（MySQL → ES）\n\n| 方案 | 原理 | 优点 | 缺点 |\n| --- | --- | --- | --- |\n| 同步双写 | 代码里写完 MySQL 写 ES | 简单、实时 | 代码耦合；双写不一致风险 |\n| 异步 MQ | 写库后发消息，消费者更新 ES | 解耦、可重试、可靠 | 毫秒~秒级延迟；要处理堆积 |\n| canal | 伪装 MySQL 从库订阅 binlog | 对业务零侵入 | 多一套 canal 运维；有延迟 |\n| Logstash | 定时按 `update_time` 拉增量 | 纯配置，上手快 | 秒~分钟级延迟；给 DB 带来查询压力 |\n\n生产主流：**MQ 异步同步**或 **canal 订阅 binlog**；要求最终一致再加对账任务。\n\n### 7. 集群\n\n- 主分片数建索引时固定（默认 1），副本可动态调；分片是数据分布与并行的单位；\n- 节点角色：master（管理）、data（存数据）、coordinating（协调，所有节点默认兼任）；\n- 容量评估经验：单分片建议 20~50GB 以内。\n\n## 💼 高频面试题\n\n**Q：倒排索引是什么？**\n- 与正排（ID→文档）相反，倒排是\"分词后的词条→文档 ID 列表\"；\n- 写入时分词建表，查询时对关键词分词后查倒排表，取交集并集再按相关度排序；\n- 词典有序查找近似 O(logN)，因此全量数据也能毫秒级检索。\n\n**Q：ES 和 MySQL 怎么选型？**\n- 主数据、强事务、多表关联 → MySQL；全文检索、模糊搜索、聚合分析、日志 → ES；\n- 典型架构：MySQL 存主数据，异步同步（MQ/canal）到 ES 专供搜索；\n- ES 不支持事务、近实时、更新代价高，别当主库用。\n\n**Q：ES 深分页怎么办？**\n- `from+size` 每个分片都取前 N 条再归并，代价随 from 线性涨，默认限 10000；\n- 翻页用 `search_after` + PIT 游标；全量导出用 scroll（或 search_after）；\n- 产品上限制可翻页深度是通用做法。\n\n**Q：text 和 keyword 的区别？**\n- text 会分词建倒排，用于 match 全文搜索；keyword 不分词，用于 term 精确匹配、排序、聚合；\n- 坑：对 text 字段 term 查整句通常查不到；状态/品牌/分类字段务必用 keyword。\n\n**Q：ES 写入为什么是近实时的？**\n- 写入先进内存 buffer + translog；**refresh（默认 1s）** 生成 segment 进入页缓存后才可搜索；\n- **flush** 才真正落盘并清 translog；调小 refresh_interval 可降延迟但增加开销；\n- segment 不可变，删除/更新是标记与重建，这也解释了 ES 更新昂贵。\n\n## 🔗 推荐资料\n\n| 资料 | 说明 | 链接 |\n| --- | --- | --- |\n| JavaGuide Elasticsearch 面试题 | 面试题合集（部分内容付费，注意甄别） | https://javaguide.cn/database/elasticsearch/elasticsearch-questions-01.html |\n| pdai Elasticsearch 总览 | ES 知识体系与原理详解 | https://pdai.tech/md/db/nosql-es/elasticsearch.html |\n| 廖雪峰 Spring Boot 集成 ES | Spring Boot 整合实操 | https://liaoxuefeng.com/books/java/springboot/index.html |\n| pdai 架构知识体系 | 搜索中间件在架构中的位置 | https://pdai.tech/md/arch/arch-z-overview.html |\n","ck":0},{"id":"f26","stage":5,"path":"05-中间件篇/06-ZooKeeper与Nacos.md","title":"06-ZooKeeper与Nacos","md":"# 06-ZooKeeper与Nacos\n\n> **阶段**：中间件篇 ｜ **建议时长**：3 天 ｜ **前置**：Spring Boot 基础、01-Redis（理解分布式锁）\n\n## 🧩 它是什么，解决什么问题\n\n进入微服务后出现两个新问题，注册中心/配置中心就是为它们而生的：\n\n1. **服务动态感知（注册中心）**：服务提供者有多台实例，随时扩容、缩容、宕机，调用方不能把 IP 写死在配置里——实例启动时把地址注册上去，调用方实时拉取并监听列表变化；\n2. **配置集中管理 + 热更新（配置中心）**：几十个实例的开关、阈值、连接串散落在各自配置文件里，改一次要逐个重启——配置集中存放，改完自动推送到所有实例，**不用重启**。\n\n**ZooKeeper（ZK）**：Apache 的分布式协调服务，本质是\"高可靠的树形 K-V 存储 + Watcher 通知\"，并非专为服务发现设计，但 Hadoop/Kafka/Dubbo 早期都拿它当注册中心，它的**临时节点、Watcher、顺序节点**是面试核心。\n\n**Nacos**：阿里开源的**注册中心 + 配置中心二合一**，Spring Cloud Alibaba 生态的标配，开箱即用、带控制台，是目前国内 Java 微服务的最主流选择。\n\n## 📌 典型使用场景\n\n| 业务场景 | 用什么 | 为什么 | 不用的后果 |\n| --- | --- | --- | --- |\n| 微服务互相调用 | Nacos 注册中心 | 调用方按服务名动态发现实例，自动剔除宕机实例 | IP 写死，扩缩容要改所有调用方配置 |\n| 业务开关/阈值热更新 | Nacos 配置中心 | 控制台改配置秒级推送，无需重启 | 改个开关要发版重启全部实例 |\n| 分布式锁/选主 | ZK | 临时顺序节点 + Watcher 实现公平锁与 Leader 选举 | 多进程并发操作共享资源无序 |\n| 大数据组件依赖 | ZK | Kafka(旧)、HBase、SolrCloud 的协调底座 | 组件无法选主与元数据管理 |\n\n## 🚀 快速上手\n\n### 1. Docker 启动 Nacos（单机模式）\n\n```bash\ndocker run -d --name nacos \\\n  -p 8848:8848 -p 9848:9848 \\\n  -e MODE=standalone \\\n  -e NACOS_AUTH_ENABLE=false \\\n  nacos/nacos-server:v2.3.2\n# 控制台：http://localhost:8848/nacos（默认 nacos/nacos）\n# 8848=控制台/HTTP API，9848=客户端 gRPC（2.x 必须开放）\n```\n\n### 2. （可选）Docker 启动 ZooKeeper，体验临时节点\n\n```bash\ndocker run -d --name zk -p 2181:2181 zookeeper:3.9\ndocker exec -it zk zkCli.sh\n\ncreate -e /order-svc \"192.168.1.10:8080\"   # -e：创建临时节点，模拟服务注册\nls /order-svc                              # 能看到节点\nquit                                       # 退出 = 会话断开\n# 重新进入 zkCli 后 ls /order-svc：节点已自动消失（临时节点随会话销毁）\n```\n\n### 3. Spring Boot 接入（注册中心 + 配置中心）\n\n```xml\n<dependency>\n    <groupId>com.alibaba.cloud<\/groupId>\n    <artifactId>spring-cloud-starter-alibaba-nacos-discovery<\/artifactId>\n<\/dependency>\n<dependency>\n    <groupId>com.alibaba.cloud<\/groupId>\n    <artifactId>spring-cloud-starter-alibaba-nacos-config<\/artifactId>\n<\/dependency>\n<!-- 版本随 Spring Cloud Alibaba BOM 管理，Boot 3.x 对应 2023.x 系列 -->\n```\n\n```yaml\n# application.yml（Boot 3.x 用 spring.config.import 引入远端配置）\nspring:\n  application:\n    name: order-service              # 服务名 = 注册中心里的标识\n  cloud:\n    nacos:\n      server-addr: localhost:8848\n      discovery:\n        namespace: dev               # 命名空间隔离环境（dev/test/prod）\n      config:\n        file-extension: yaml\n  config:\n    import: nacos:order-service.yaml # 拉取 Nacos 上的配置\n```\n\n在 Nacos 控制台新建配置 `order-service.yaml`（Group 默认 DEFAULT_GROUP），写入：\n\n```yaml\norder:\n  discount: 100       # 折扣阈值，演示热更新\n```\n\n```java\n// 服务提供方：启动即自动注册到 Nacos（discovery 依赖引入即生效）\n\n// 配置热更新：控制台改 discount 后，本 Bean 无需重启即拿到新值\n@RestController\n@RefreshScope                     // 让 @Value 绑定的配置支持热刷新\npublic class ConfigController {\n    @Value(\"${order.discount:100}\")\n    private int discount;\n\n    @GetMapping(\"/discount\")\n    public int discount() { return discount; }\n}\n\n// 服务消费方：从注册中心拿可用实例列表（配合 LoadBalancer 实现负载均衡）\n@Service\n@RequiredArgsConstructor\npublic class DiscoveryDemo {\n    private final DiscoveryClient discoveryClient;\n\n    public List<String> instances() {\n        return discoveryClient.getInstances(\"order-service\").stream()\n                .map(i -> i.getHost() + \":\" + i.getPort()).toList();\n    }\n}\n```\n\n## 🔧 常用命令 / API 速查\n\n| 操作 | 命令 / API |\n| --- | --- |\n| Nacos 控制台 | `http://localhost:8848/nacos`：服务列表、配置管理、命名空间 |\n| 注册服务 | 引入 discovery 依赖 + `spring.cloud.nacos.server-addr` 即自动注册 |\n| 手动上下线 | 控制台对实例\"上线/下线\"，用于发布前摘流量 |\n| 读取配置 | `@Value` + `@RefreshScope`，或 `@ConfigurationProperties`（天然支持刷新） |\n| 查看实例列表 | `discoveryClient.getInstances(\"service-name\")` |\n| ZK 客户端 | `docker exec -it zk zkCli.sh` 进入命令行 |\n\n**ZooKeeper 常用操作（zkCli.sh）**：\n\n| 命令 | 说明 |\n| --- | --- |\n| `create /app/lock/seq- \"data\"` | 创建 znode（`-e` 临时、`-s` 顺序） |\n| `get /app/config` | 读节点数据并注册 Watcher |\n| `ls /app` | 列子节点并注册 Watcher |\n| `set /app/config \"new\"` | 更新数据，触发 Watcher 通知 |\n| `delete /app/config` | 删除节点 |\n\n## 🧠 核心进阶\n\n### 1. ZooKeeper 三大机制（面试核心）\n\n- **znode**：树形命名空间中的节点，类似文件/目录二合一，可存少量数据（建议 < 1MB）；\n- **临时节点（ephemeral）**：**与客户端会话绑定，会话断开自动删除**——这就是服务注册与锁自动释放的基石（实例宕机 → 会话失效 → 节点消失 → 下游立刻感知）；另有**临时顺序节点**：自动追加单调递增序号（`lock-0001`、`lock-0002`）；\n- **Watcher 机制**：客户端对节点注册监听，节点**变化时触发一次通知**（数据变更、子节点增减、节点删除）；注意是**一次性**的，收到通知后要重新注册——服务发现每次拉完列表都要再挂一次 Watcher。\n\n**ZAB 协议一句话**：ZK 用 ZAB（原子广播）保证一致性——写请求都转发给 Leader，**过半节点写入成功才算提交**；Leader 挂掉触发选举，恢复期间集群不可写。由此 ZK 的**写性能受限于过半同步**，且部署节点建议为奇数（3/5 台）以省资源。\n\n- **容灾换算**（常考的算术）：过半要求**存活节点数 > n/2** → **3 节点最多宕 1 台**（剩 2 台过半可写）、5 节点最多宕 2 台；而 **4 节点也只能宕 1 台**（需 3 台在线），容错能力与 3 节点相同却多花一台机器——这就是\"部署奇数台\"的原因。\n\n**ZAB vs Paxos（易混点）**：Paxos 是解决「一批节点就某个值达成一致」的**通用**共识算法，本身**不保证全序**，也不规定主备结构；ZAB 是专为**主备模式的原子广播**设计的协议，目标是把所有写请求排成一个**全局有序**的序列、按序复制到各副本，让所有副本的状态机按同样顺序执行、最终状态一致。两者关系：ZAB 借鉴了 Paxos 的思想（过半确认、Leader 提案），但不是 Paxos 的等价物或实现。\n\n- ZAB 的两个阶段：**消息广播**（正常态，Leader 把写请求编号后广播，过半 ACK 即提交）、**崩溃恢复**（Leader 挂掉后重新选举并同步差异）。\n- **zxid**（64 位事务 ID，高 32 位 epoch + 低 32 位计数器）：全局单调递增，既是写请求的序号，也用于选举后对比各副本进度、决定谁的数据最新。\n\n**临时顺序节点实现分布式锁**：\n\n```\n1. 各客户端在 /lock/ 下创建临时顺序节点 seq-\n2. 判断自己是不是序号最小的 → 是则获锁\n3. 否则 watch「比自己序号小的最近一个节点」\n4. 持锁者释放锁/会话断开 → 节点删除 → 下一个收到通知 → 回到 2\n```\n\n比\"所有人抢同一个节点\"好在**避免惊群**：锁释放只唤醒一个等待者；会话断开自动删节点则天然解决\"持锁进程挂死锁不释放\"。\n\n**CP 的代价**：ZK 是 CP 系统，Leader 选举期间（可能长达数十秒）整个集群**拒绝服务**——服务发现场景下\"宁可返回旧列表也不能不可用\"，这就是\"ZK 不适合做注册中心\"论断的核心；再加上 Watcher 一次性、无控制台、运维重，新项目基本不再选它做注册。\n\n### 2. Nacos 架构与 AP/CP\n\n- **AP/CP 可切换⭐**：**临时实例（默认）用 AP（Distro 协议）**——客户端每 5s 发心跳，15s 未收到标记不健康，30s 未收到剔除；实例下线最终一致，可用性优先。**持久实例用 CP（Raft 协议）**——强一致，适合数据库类\"必须全员知道\"的服务；\n- 注册中心要的恰恰是\"宕机也能返回旧列表\"，所以**临时实例 + AP 是服务发现的正确姿势**；面试追问\"为什么不用 CP\"就答 ZK 选举期不可用的反例；\n- **配置中心**：长轮询（客户端 30s 内监听配置变更，改动秒级推送）+ MD5 比对；`@RefreshScope` 触发 Bean 重建实现热更新；`@ConfigurationProperties` 绑定的配置自动刷新；与 ZK Watcher 对比：Nacos 长轮询可重复等待无需反复注册，使用成本低得多；\n- **保护阈值（雪崩保护）**：健康实例比例低于阈值时，Nacos 把不健康实例也返回给调用方——宁可部分调用失败，也不返回空列表导致服务全瘫，这正是\"可用性优先\"的体现；\n- **集群部署**：生产至少 3 节点组集群（内嵌 Raft/Distro 协议选主与同步），配置持久化到 MySQL（单机默认 Derby），客户端通过 gRPC 长连接保持实时感知；\n- **命名空间（namespace）**：按环境隔离（dev/test/prod 各一个 namespace），配合 Group、Cluster 做多级隔离；\n- **优雅上下线**：发布前在控制台对实例\"下线\"摘流量，等流量排空再停机，避免发布瞬间报错——注册中心的控制台能力比\"能注册\"更值钱。\n\n### 3. 三者对比与选型\n\n| 维度 | ZooKeeper | Nacos | Eureka |\n| --- | --- | --- | --- |\n| 一致性 | CP | AP/CP 可切换 | AP |\n| 健康检查 | 会话 keepalive | 心跳 + 主动探测 | 客户端心跳 |\n| 功能 | 树形 K-V + Watcher | 注册 + 配置 + 控制台 | 仅注册 |\n| 易用性 | 无 UI、运维重 | 控制台开箱即用 | 有控制台但已停更 |\n| 典型用途 | 选主/锁/大数据组件 | Spring Cloud Alibaba 微服务 | 旧 Spring Cloud Netflix |\n\n选型：**Spring Cloud Alibaba 体系直接用 Nacos**（注册+配置一站式）；需要强一致的协调原语（选主、严格的锁）用 ZK 或 etcd；新项目不要再选已停更的 Eureka。国内新项目 90% 的组合是：Nacos（注册+配置）+ OpenFeign（调用）+ Sentinel（限流熔断），即 Spring Cloud Alibaba 标准全家桶。\n\n## 💼 高频面试题\n\n**Q：ZooKeeper 能干什么？**\n- 树形 znode 存储 + 临时节点 + Watcher，提供高可靠的分布式协调原语；\n- 典型用途：注册中心（早期 Dubbo/Kafka）、分布式锁（临时顺序节点）、Leader 选举、配置共享；\n- 本质是 CP 的协调服务，不是专门的服务发现组件。\n\n**Q：Watcher 机制是什么？**\n- 客户端对节点读操作可注册监听，节点数据变更/子节点变化/删除时服务端推送一次通知；\n- **一次性触发**：收到通知后必须重新注册，否则后续变更收不到；\n- 服务发现依赖它：列表变化 → 通知 → 重新拉取 + 重新注册。\n\n**Q：临时节点有什么用途？**\n- 生命周期绑定客户端**会话**，会话断开自动删除；\n- 服务注册：实例宕机 → 节点消失 → 调用方即时感知；\n- 分布式锁：持锁进程崩溃 → 锁节点自动删除 → 不会死锁；加顺序性后可实现公平锁并避免惊群。\n\n**Q：为什么说 ZK 不适合做注册中心？**\n- CP：Leader 选举期间集群不可用，而服务发现更需要可用性（AP）——宁可返回略旧的实例列表；\n- Watcher 一次性，客户端要反复注册，实现繁琐；\n- 无健康检查语义外的管理能力（无控制台、无权重/灰度），运维成本高。\n\n**Q：Nacos 的 AP 和 CP 怎么选？**\n- 临时实例（默认）→ AP/Distro：客户端心跳保活，宕机靠心跳超时剔除，最终一致，适合绝大多数微服务；\n- 持久实例 → CP/Raft：不会自动剔除，需主动注销，适合配置类、数据库类强一致服务；\n- 同一 Nacos 集群可同时承载两种模式，按实例类型自动路由。\n\n**Q：Nacos 配置中心如何实现热更新？**\n- 客户端与 Nacos 保持**长轮询**，配置变更后秒级返回新版本；\n- `@Value` 字段所在 Bean 加 `@RefreshScope`：刷新时销毁重建 Bean 重新注入；`@ConfigurationProperties` 绑定类天然支持；\n- 灰度发布与回滚可直接在控制台操作。\n\n## 🔗 推荐资料\n\n| 资料 | 说明 | 链接 |\n| --- | --- | --- |\n| JavaGuide ZooKeeper 入门 | znode/Watcher/ZAB 等核心概念 | https://javaguide.cn/distributed-system/distributed-process-coordination/zookeeper/zookeeper-intro.html |\n| pdai 架构知识体系 | 注册中心/配置中心在微服务架构中的位置 | https://pdai.tech/md/arch/arch-z-overview.html |\n| 廖雪峰 Spring Boot 教程 | Spring Boot 整合实操基础 | https://liaoxuefeng.com/books/java/springboot/index.html |\n| JavaGuide 高可用系统设计指南 | 服务注册发现的可用性设计视角 | https://javaguide.cn/high-availability/high-availability-system-design.html |\n","ck":0},{"id":"f27","stage":5,"path":"05-中间件篇/07-Nginx.md","title":"07-Nginx","md":"# 07-Nginx\n\n> **阶段**：中间件篇 ｜ **建议时长**：2 天 ｜ **前置**：无（了解 HTTP、前后端分离更佳）\n\n## 🧩 它是什么，解决什么问题\n\nNginx 是高性能的 **HTTP 服务器 / 反向代理服务器**，C 语言编写，单机可轻松支撑数万并发连接。在后端项目里它几乎无处不在：**静态资源服务、反向代理、负载均衡**是三大本职工作。\n\n**为什么它这么能扛？（高频）**\n\n- **epoll 事件驱动 + 异步非阻塞 IO**：一个 worker 进程用 IO 多路复用同时处理成千上万连接，不为每个连接分配线程（对比传统\"一连接一线程\"模型）；\n- **master-worker 架构**：master 读配置、管理 worker；worker 真正处理请求（数量 ≈ CPU 核数，`worker_processes auto`），worker 挂了 master 自动拉起，改配置可平滑 reload 不中断服务。\n- **惊群问题与 accept_mutex**：多个 worker 都阻塞在同一个监听套接字上，新连接到来时**所有 worker 被同时唤醒，却只有一个能 accept 成功**，其余白白被唤醒消耗 CPU，这就是惊群（thundering herd）。Nginx 的应对是 **`accept_mutex`**：worker 之间用互斥锁**串行竞争** accept 权，保证同一时刻只有一个 worker 在等待新连接，其余安心处理已有连接。新版 Linux 内核提供 `EPOLLEXCLUSIVE` 标志，由内核只唤醒一个等待者，承担了同类职责；`accept_mutex` 在高并发下可能成为瓶颈，可按需关闭（`accept_mutex off`）。\n\n**正向代理 vs 反向代理（必会）**：\n\n| | 正向代理 | 反向代理 |\n| --- | --- | --- |\n| 代理谁 | **客户端**（替客户端出去访问） | **服务端**（替服务器接请求） |\n| 谁知道谁存在 | 服务端不知道真实客户端 | 客户端不知道真实后端（以为 Nginx 就是服务） |\n| 典型例子 | VPN/科学上网 | Nginx 转发到 Spring Boot 集群 |\n\n## 📌 典型使用场景\n\n| 业务场景 | 为什么用它 | 不用的后果 |\n| --- | --- | --- |\n| 前后端分离部署 | Nginx 托管前端静态包，`/api` 转发后端，同域解决跨域 | 前后端分开部署域名不同，跨域问题频出 |\n| 多实例负载均衡 | upstream 把请求分摊到多个 Spring Boot 实例 | 单实例扛不住，宕机全站不可用 |\n| 灰度发布 | 按权重把少量流量切到新版本，观察后再全量 | 新版本直接全量上线，出事故影响所有人 |\n| 静态资源服务 | 图片/CSS/JS 直接由 Nginx 返回，带缓存头 | 静态请求也打到 Java 应用，浪费 JVM 资源 |\n\n## 🚀 快速上手\n\n### 1. 安装与常用命令\n\n```bash\ndocker run -d --name nginx -p 80:80 nginx:1.26\n# 或 Mac：brew install nginx；配置文件通常在 /usr/local/etc/nginx/nginx.conf 或 /etc/nginx/nginx.conf\n\nnginx -t              # 检查配置语法（改完必做）\nnginx -s reload       # 平滑重载配置，不断连接\ndocker exec -it nginx nginx -s reload   # docker 版重载\n```\n\n### 2. 核心配置结构（全局块 / events / http / server / location）\n\n```nginx\n# ===== 全局块 =====\nworker_processes  auto;              # worker 数 = CPU 核数\nevents {\n    worker_connections  10240;       # 每个 worker 的最大连接数\n}\nhttp {\n    include       mime.types;        # 文件类型映射\n    default_type  application/octet-stream;\n    access_log    logs/access.log;\n    sendfile      on;                # 静态文件零拷贝\n\n    # gzip 压缩：JS/CSS 传输体积减小 70%+\n    gzip on;\n    gzip_types text/css application/json application/javascript;\n    gzip_min_length 1k;\n\n    # ===== 负载均衡：定义后端集群 =====\n    upstream backend {\n        server 127.0.0.1:8081 weight=2;      # 权重轮询：8081 承担 2 倍流量\n        server 127.0.0.1:8082;               # 默认轮询\n        # ip_hash;                           # 按客户端 IP 固定分发（会话保持）\n        # least_conn;                        # 最少连接优先\n        server 127.0.0.1:8083 max_fails=3 fail_timeout=30s;  # 被动健康检查\n    }\n\n    server {\n        listen 80;\n        server_name example.com;\n\n        # 场景1：静态站点（Vue/React 打包产物，history 路由回退 index.html）\n        location / {\n            root  /usr/share/nginx/html;     # 文件映射到本地目录\n            try_files $uri $uri/ /index.html;\n        }\n\n        # 场景2：动静分离——静态资源单独 location，直接返回\n        location /static/ {\n            root /data/www;                  # 实际文件在 /data/www/static/\n            expires 7d;                      # 浏览器缓存 7 天\n        }\n\n        # 场景3：反向代理——/api 开头转发给后端集群\n        location /api/ {\n            proxy_pass http://backend/;      # 结尾带 / → 去掉 /api 前缀再转发\n            proxy_set_header Host $host;\n            proxy_set_header X-Real-IP $remote_addr;          # 传真实客户端 IP\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n            proxy_read_timeout 60s;\n        }\n    }\n}\n```\n\n### 3. 限流（令牌桶）与 CORS 跨域\n\n```nginx\nhttp {\n    # 每个 IP 每秒 10 个请求，10m 内存约可跟踪 16 万 IP\n    limit_req_zone $binary_remote_addr zone=apiLimit:10m rate=10r/s;\n\n    server {\n        location /api/ {\n            limit_req zone=apiLimit burst=20 nodelay;\n            # burst=20 允许突发 20 个排队，nodelay 立即处理不匀速等待\n\n            # 跨域：让前端域名的请求被浏览器放行\n            add_header Access-Control-Allow-Origin  $http_origin always;\n            add_header Access-Control-Allow-Methods \"GET, POST, PUT, DELETE, OPTIONS\" always;\n            add_header Access-Control-Allow-Headers \"Content-Type, Authorization\" always;\n            add_header Access-Control-Allow-Credentials \"true\" always;\n            if ($request_method = OPTIONS) { return 204; }   # 预检请求直接放行\n        }\n    }\n}\n```\n\n### 4. WebSocket 反向代理（实时推送场景）\n\n```nginx\nlocation /ws/ {\n    proxy_pass http://backend;\n    proxy_http_version 1.1;\n    proxy_set_header Upgrade $http_upgrade;      # 协议升级头，缺一不可\n    proxy_set_header Connection \"upgrade\";\n    proxy_read_timeout 300s;                     # 长连接空闲超时，避免被误断\n}\n```\n\n### 5. HTTPS 思路与高可用\n\n- HTTPS：用 certbot/云厂商证书拿到 `.pem/.key`，server 块监听 443，配置 `ssl_certificate` 与 `ssl_certificate_key`，再把 80 端口 `return 301 https://$host$request_uri;` 整站跳转；\n- **keepalived 高可用**：Nginx 自身是单点，主备两台 Nginx + keepalived 抢占同一个 VIP（虚拟 IP），主挂了 VIP 漂移到备机，客户端无感知。\n\n## 🔧 常用命令 / API 速查\n\n| 配置 / 命令 | 作用 |\n| --- | --- |\n| `root /data/www` | 把 URL 映射到**本地文件**（静态资源） |\n| `proxy_pass http://backend` | 把请求**转发到后端服务**（反向代理） |\n| `upstream` + `server` | 定义负载均衡后端节点池 |\n| `weight / ip_hash / least_conn` | 权重轮询 / IP 会话保持 / 最少连接 |\n| `limit_req_zone` + `limit_req` | 令牌桶限流 |\n| `gzip on; gzip_types ...` | 响应压缩 |\n| `expires 7d` | 静态资源浏览器缓存时间 |\n| `nginx -t` / `nginx -s reload` | 语法检查 / 平滑重载 |\n| `tail -f logs/access.log` / `error.log` | 排查 502/404 等问题第一现场 |\n\n## 🧠 核心进阶\n\n### 1. 负载均衡策略对比\n\n| 策略 | 规则 | 适用 |\n| --- | --- | --- |\n| 轮询（默认） | 依次分发 | 实例性能相近 |\n| weight | 按权重分发（`weight=2`） | 机器配置不均 |\n| ip_hash | 客户端 IP 哈希固定到某实例 | 有状态的会话保持（更推荐应用层用 Redis 共享 Session） |\n| least_conn | 转发给当前连接数最少的实例 | 请求处理时长差异大 |\n- **健康检查**：开源版只有被动检查（`max_fails`/`fail_timeout`：失败 3 次、暂停 30s 不派流量）；主动探测（定期发请求探活）需商业版或第三方模块。\n\n### 2. Nginx 与 Spring Cloud Gateway 的分工（高频）\n\n| | Nginx | Spring Cloud Gateway |\n| --- | --- | --- |\n| 定位 | 接入层：静态资源、SSL 终止、全局负载均衡 | 业务网关：路由 + 鉴权 + 限流 + 熔断 |\n| 能力 | C 语言、性能极高，但不感知微服务 | 与注册中心联动按**服务名**路由，可写 Java 过滤器做业务逻辑 |\n| 典型位置 | 最外层入口 | Nginx 之后、微服务之前 |\n\n标准链路：**客户端 → Nginx（负载均衡）→ Gateway（业务网关，做鉴权/限流）→ 微服务**。判断标准：和业务无关的\"流量转发\"给 Nginx，和微服务体系相关的\"路由+治理\"给 Gateway。\n\n### 3. 动静分离与灰度\n\n- **动静分离**：静态请求（html/js/css/图片）由 Nginx 直接返回并设置 `expires` 缓存，动态请求走 `proxy_pass` 到应用——减少无效请求占用 JVM；\n- **灰度发布**：upstream 中新旧版本配权重（如 `weight=1` vs `weight=9`）放 10% 流量到新版；更精细的按 Cookie/Header 分流用 `map` + 两个 upstream 实现。\n\n### 5. 常见问题排查（实战）\n\n- **502 Bad Gateway**：后端挂了/端口不通/处理超时——先 `curl` 直连后端确认，再查 `error.log`；\n- **404**：`root` 与 location 拼接路径不对；前端 history 路由刷新 404 是漏配 `try_files $uri $uri/ /index.html;`；\n- **限流不生效**：`limit_req_zone` 必须在 http 块定义、`limit_req` 在 location 块引用，二者缺一；\n- **跨域失败**：OPTIONS 预检没放行，或后端也加了 CORS 头导致重复头报错——跨域头只在一处加（推荐 Nginx）。\n\n## 💼 高频面试题\n\n**Q：正向代理和反向代理的区别？**\n- 正向代理代理客户端：服务端不知道真实客户端是谁（VPN）；\n- 反向代理代理服务端：客户端不知道真实后端是谁，以为代理就是服务本身；\n- Nginx 做的是反向代理：隐藏后端、负载均衡、统一入口。\n\n**Q：Nginx 为什么能支撑高并发？**\n- master-worker 多进程模型：master 管理，worker 处理请求，worker 数 ≈ CPU 核数，避免线程争抢；\n- epoll 事件驱动 + 非阻塞 IO：一个 worker 可同时处理上万连接，不为每个连接创建线程；\n- sendfile 零拷贝传输静态文件。\n\n**Q：Nginx 的负载均衡策略有哪些？**\n- 轮询（默认）、weight 权重、ip_hash（会话保持）、least_conn（最少连接）；\n- 健康检查：开源版被动探测（max_fails/fail_timeout），主动探测要商业版/模块；\n- 有状态场景更推荐应用层用 Redis 共享 Session 而不是 ip_hash。\n\n**Q：你写过哪些 Nginx 配置？**\n- 静态站点 + `try_files` 支持前端 history 路由；`/api` 反向代理到 Spring Boot 集群（带 X-Real-IP）；\n- gzip 压缩、静态资源 `expires` 缓存（动静分离）；\n- `limit_req` 接口限流、CORS 跨域头、443 HTTPS + 80 跳转。\n\n**Q：Nginx 和 Spring Cloud Gateway 有什么区别，怎么一起用？**\n- Nginx 是接入层反向代理：性能极高，处理静态资源、SSL、全局负载均衡，但不懂微服务；\n- Gateway 是业务网关：基于注册中心按服务名动态路由，可用过滤器实现鉴权、限流、熔断等业务治理；\n- 典型架构：客户端 → Nginx → Gateway → 微服务，流量入口归 Nginx，服务治理归 Gateway。\n\n## 🔗 推荐资料\n\n| 资料 | 说明 | 链接 |\n| --- | --- | --- |\n| JavaGuide 负载均衡 | 负载均衡原理与分类 | https://javaguide.cn/high-performance/load-balancing.html |\n| JavaGuide API 网关 | 网关与 Nginx 的分工 | https://javaguide.cn/distributed-system/api-gateway.html |\n| pdai 架构知识体系 | 接入层在整个架构中的位置 | https://pdai.tech/md/arch/arch-z-overview.html |\n| JavaGuide 高可用系统设计指南 | 限流、降级等高可用手段 | https://javaguide.cn/high-availability/high-availability-system-design.html |\n","ck":0},{"id":"f28","stage":5,"path":"05-中间件篇/08-MongoDB.md","title":"08-MongoDB","md":"# 08-MongoDB\n\n> **阶段**：中间件篇 ｜ **建议时长**：2 天 ｜ **前置**：MySQL 基础（03-数据库篇）\n\n## 🧩 它是什么，解决什么问题\n\nMongoDB 是**文档型 NoSQL 数据库**，数据以 **BSON**（二进制 JSON）存储，一行可以是一个嵌套任意层级的 JSON 文档。它不要求每条记录字段一致（**schema 灵活**），查询语法面向文档而非 SQL，索引机制却与 MySQL 类似（B+ 树），是\"既要灵活结构、又要像数据库一样查询\"场景的最优解。\n\n**与 MySQL 概念对照（必须记住）**：\n\n| MongoDB | MySQL | 说明 |\n| --- | --- | --- |\n| database | database | 库 |\n| collection | table | 集合（表），无需建表结构 |\n| document | row（一行） | BSON 文档，字段可各不相同 |\n| field | column | 字段 |\n| `_id` | 主键 | 默认自动生成 ObjectId |\n| index | index | B+ 树索引，语法不同思想相同 |\n\n核心差异：MySQL 先定义表结构才能写；MongoDB **随时往集合里塞不同结构的文档**——商品 A 有\"颜色\"规格、商品 B 有\"内存/硬盘\"规格，放同一集合毫无压力，这正是关系库做\"商品多规格\"时的痛点（一堆 NULL 列或 EAV 反范式）。\n\n## 📌 典型使用场景\n\n| 业务场景 | 为什么用它 | 不用的后果 |\n| --- | --- | --- |\n| 内容管理（文章/评论/CMS） | 文档结构可嵌套，字段增减无需 DDL | MySQL 频繁改表结构，字段大量为 NULL |\n| 商品详情聚合 | 标题、规格、图文、扩展属性一个大文档一次查出 | 多表 JOIN 拼装，SQL 复杂且慢 |\n| 日志/埋点存储 | 写入吞吐高，字段随业务变化，按 TTL 自动过期 | MySQL 单表暴涨，加字段要 DDL 锁表 |\n| 用户画像/标签 | 每个用户标签数不同，文档天然表达 | 关系库做标签需 EAV 多表关联，查询慢 |\n\n**不适用**（同样重要，面试会问）：需要**强事务、多表复杂关联、金额类强一致**的场景（如订单资金、账务系统）→ 用 MySQL。MongoDB 4.0+ 虽支持多文档事务，但性能与生态仍不如关系库，别把它当 MySQL 的替代品。\n\n## 🚀 快速上手\n\n### 1. Docker 启动 + mongosh CRUD\n\n```bash\ndocker run -d --name mongo -p 27017:27017 mongo:7.0\ndocker exec -it mongo mongosh          # 进入交互式 shell\n```\n\n```javascript\nuse shop                                // 创建/切换库（写数据时才真正创建）\n\n// 增：insertOne / insertMany，无需建表\ndb.product.insertOne({ name: \"华为 Mate60 Pro\", brand: \"华为\", price: 6999,\n                       specs: { memory: \"12G\", storage: \"512G\" }, tags: [\"旗舰\", \"5G\"] })\n\n// 查：find + 条件 + 投影\ndb.product.find({ brand: \"华为\" })                                  // 等值\ndb.product.find({ price: { $gte: 5000, $lte: 8000 } })              // 范围：$gte/$lte/$gt/$lt\ndb.product.find({ tags: \"旗舰\" })                                   // 数组包含\ndb.product.find({}, { name: 1, price: 1, _id: 0 })                  // 只返回指定字段\n\n// 排序分页：sort / skip / limit（跳过前 10 条取 5 条，按价格倒序）\ndb.product.find().sort({ price: -1 }).skip(10).limit(5)\n\n// 统计\ndb.product.countDocuments({ brand: \"华为\" })\n\n// 改：updateOne + $set（只改指定字段，不会覆盖整个文档）\ndb.product.updateOne({ name: \"华为 Mate60 Pro\" }, { $set: { price: 6499 } })\ndb.product.updateOne({ name: \"华为 Mate60 Pro\" }, { $addToSet: { tags: \"卫星通信\" } }) // 数组去重追加\n\n// 删\ndb.product.deleteOne({ name: \"华为 Mate60 Pro\" })\n\n// 索引：与 MySQL 一样，等值/排序字段要建索引\ndb.product.createIndex({ brand: 1 })                 // 普通索引\ndb.product.createIndex({ name: \"text\" })             // 全文索引\ndb.log_events.createIndex({ createdAt: 1 }, { expireAfterSeconds: 3600 })  // TTL 自动过期\n```\n\n### 2. 聚合管道（MongoDB 版的 GROUP BY + JOIN）\n\n```javascript\n// 按品牌统计商品数与均价：$match(过滤) → $group(分组聚合) → $sort(排序)\ndb.product.aggregate([\n  { $match: { price: { $gte: 1000 } } },\n  { $group: { _id: \"$brand\", count: { $sum: 1 }, avgPrice: { $avg: \"$price\" } } },\n  { $sort: { count: -1 } }\n])\n```\n\n- **管道严格按数组顺序执行**，顺序直接影响性能与正确性：**`$match` 尽量前置**（先滤掉无关文档，减少后续阶段的数据量，还能用上索引，等价于 SQL 里\"先 WHERE 再 GROUP BY\"）；`$group` 做聚合；`$sort` 放最后对**聚合结果**排序。反过来把 `$match` 放在 `$group` 之后，等于对全量文档白算一遍聚合。\n- 常用阶段：`$match`（过滤）→ `$project`（选字段/计算）→ `$group`（分组聚合，配 `$sum/$avg/$max`）→ `$sort`（排序）→ `$limit/$skip`（分页）→ `$lookup`（左连接，相当于 JOIN）→ `$unwind`（把数组字段拆成多行）。\n\n### 3. Spring Boot 整合（MongoTemplate 常用操作）\n\n```xml\n<dependency>\n    <groupId>org.springframework.boot<\/groupId>\n    <artifactId>spring-boot-starter-data-mongodb<\/artifactId>\n<\/dependency>\n```\n\n```yaml\nspring:\n  data:\n    mongodb:\n      uri: mongodb://localhost:27017/shop\n```\n\n```java\n@Document(collection = \"product\")\n@Data\npublic class Product {\n    @Id\n    private String id;          // 不赋值则自动生成 ObjectId\n    private String name;\n    private String brand;\n    private Double price;\n    private Map<String, Object> specs;   // 灵活 schema：任意规格字段\n    private List<String> tags;\n}\n\n@Service\n@RequiredArgsConstructor\npublic class ProductService {\n    private final MongoTemplate mongoTemplate;\n\n    public void demo() {\n        // 插入\n        Product p = new Product();\n        p.setName(\"小米 14\"); p.setBrand(\"小米\"); p.setPrice(4999.0);\n        mongoTemplate.save(p);\n\n        // 条件查询：brand=华为 且 price 在 [5000,8000]，按价格倒序\n        Query query = new Query(\n                new Criteria().andOperator(\n                        Criteria.where(\"brand\").is(\"华为\"),\n                        Criteria.where(\"price\").gte(5000).lte(8000)))\n                .with(Sort.by(Sort.Direction.DESC, \"price\"))\n                .skip(0).limit(10);\n        List<Product> list = mongoTemplate.find(query, Product.class);\n\n        // 更新：$set\n        mongoTemplate.updateFirst(\n                Query.query(Criteria.where(\"name\").is(\"小米 14\")),\n                Update.update(\"price\", 4599.0), Product.class);\n\n        // 聚合：按品牌统计\n        mongoTemplate.aggregate(\n                Aggregation.newAggregation(\n                        Aggregation.group(\"brand\").count().as(\"count\"),\n                        Aggregation.sort(Sort.Direction.DESC, \"count\")),\n                \"product\", Document.class);\n\n        // 计数与删除\n        long count = mongoTemplate.count(\n                Query.query(Criteria.where(\"brand\").is(\"华为\")), Product.class);\n        mongoTemplate.remove(Query.query(Criteria.where(\"price\").lt(100)), Product.class);\n    }\n}\n```\n\n## 🔧 常用命令 / API 速查\n\n| 操作 | mongosh | MongoTemplate |\n| --- | --- | --- |\n| 插入 | `insertOne/insertMany` | `save()` / `insert()` |\n| 查询 | `find({条件}, {投影})` | `find(Query, Class)` |\n| 范围 | `$gte $lte $gt $lt $in $ne` | `Criteria.where(...).gte(...)` |\n| 更新 | `updateOne + $set/$inc/$push` | `updateFirst(Query, Update, Class)` |\n| 删除 | `deleteOne/deleteMany` | `remove(Query, Class)` |\n| 分页 | `sort().skip().limit()` | `Sort / skip / limit` |\n| 聚合 | `aggregate([$match, $group])` | `Aggregation.newAggregation(...)` |\n| 索引 | `createIndex({field: 1})` | `@Indexed` / `@CompoundIndex` 注解 |\n\n## 🧠 核心进阶\n\n### 1. ObjectId 结构（面试常考）\n\n`_id` 默认生成的 ObjectId 共 **12 字节**：\n\n| 部分 | 长度 | 含义 |\n| --- | --- | --- |\n| 时间戳 | 4 字节 | 创建时间（秒级），所以 ObjectId 本身就带创建时间且**大致按时间递增** |\n| 随机值 | 5 字节 | 机器 + 进程标识（同一实例唯一） |\n| 递增计数 | 3 字节 | 同一秒内的自增序号 |\n\n价值：主键生成**不依赖数据库协调**（应用端即可生成），天然趋势递增，适合做索引键。\n\n### 2. 副本集与分片（一句话级别即可）\n\n- **副本集（Replica Set）**：一主多从自动选主——主节点写、从节点读，主挂了从节点自动选举接管，等同 MySQL 主从 + MHA 的开箱即用版；生产最小 3 节点（PSS 或 PSA）；\n- **分片（Sharding）**：按分片键（如 user_id 哈希）把 collection 水平拆到多台机器，解决单机容量与写入瓶颈，mongos 路由组件对应用透明；\n- 一句话：**副本集保高可用，分片保扩展性**。\n\n### 3. 事务与一致性\n\n- 4.0 起支持**多文档事务**（副本集内），用法与 Spring `@Transactional` 类似；\n- 但单文档操作本身就是原子的（一条 BSON 的更新不会写一半），所以\"把强一致需求的关联数据放进同一个文档\"是 MongoDB 的惯用设计，比开事务更高效；\n- 默认读自己写的没问题，但跨文档、跨集合的一致性需求仍是 MySQL 的主场。\n\n### 4. 写关注（writeConcern）\n\n写关注决定「写入要被多少节点确认、才向客户端返回成功」——**越高越安全、越慢**：\n\n| 配置 | 含义 | 风险 |\n| --- | --- | --- |\n| `w:0` | 发出去就不管，不等待任何确认 | 最快，网络抖动/主节点宕机都可能丢 |\n| `w:1`（默认） | **主节点**写入成功即返回 | 主节点故障且未同步到从节点时，该写可能被**回滚** |\n| `w:\"majority\"` | **多数节点**确认后才返回 | 最稳、延迟最高；关键数据（资金、订单）用 |\n\n- **`j:true`**：要求写入**journal 日志**（预写日志）后才确认，保证即使服务器断电、重启后也能恢复这条写；不开启时数据先进内存，靠定期刷盘，宕机可能丢最近一段。\n- 常用组合：`{ w: \"majority\", j: true }` 用于关键写；`{ w: 1 }` 用于日志埋点等可容忍少量丢失的场景。\n- 读端有对称的 **readConcern**（`local` / `majority` / `linearizable`），控制「能读到多新的数据」，与 writeConcern 配合使用。\n\n## 💼 高频面试题\n\n**Q：MongoDB 和 MySQL 怎么选型？**\n- MySQL：强事务（资金/订单）、多表关联、结构固定的业务主数据；\n- MongoDB：schema 灵活多变（内容管理、商品多规格、日志埋点）、文档自包含一次读取、写入吞吐优先；\n- 常见组合：MySQL 存核心交易数据，MongoDB 存内容/详情/日志类数据。\n\n**Q：什么场景适合 MongoDB？不适合什么场景？**\n- 适合：字段不固定或嵌套复杂、单文档整体读写、大容量写多读多（CMS、商品详情、日志、画像）；\n- 不适合：强事务与金额一致性、复杂多表 JOIN（`$lookup` 能力有限且慢）；\n- 4.0+ 有事务但不是它的主场，选型要明确\"文档优先\"的设计思路。\n\n**Q：ObjectId 是什么结构？**\n- 12 字节：4 字节秒级时间戳 + 5 字节机器/进程随机值 + 3 字节自增计数；\n- 应用端生成，无需数据库协调；带时间信息、趋势递增，利于索引；\n- 这也是 MongoDB 写入性能好的原因之一（主键不冲突、不回页）。\n\n**Q：副本集和分片分别解决什么问题？**\n- 副本集：一主多从 + 自动选主，解决**高可用**与读写分离；\n- 分片：按分片键水平拆分数据到多节点，解决**容量与写入扩展**；\n- 生产通常\"分片集群的每个分片本身是一个副本集\"。\n\n## 🔗 推荐资料\n\n| 资料 | 说明 | 链接 |\n| --- | --- | --- |\n| JavaGuide MongoDB 面试题 | 面试导向的知识点梳理 | https://javaguide.cn/database/mongodb/mongodb-questions-01.html |\n| pdai MongoDB 总览 | MongoDB 知识体系与原理 | https://pdai.tech/md/db/nosql-mongo/mongo.html |\n| 廖雪峰 Spring Boot 集成 MongoDB | Spring Boot 整合实操 | https://liaoxuefeng.com/books/java/springboot/index.html |\n| pdai 架构知识体系 | NoSQL 在整体架构中的位置 | https://pdai.tech/md/arch/arch-z-overview.html |\n","ck":0},{"id":"f29","stage":6,"path":"06-分布式与高并发篇/01-分布式理论基础.md","title":"01-分布式理论基础","md":"# 01-分布式理论基础\n\n> **阶段**：分布式与高并发篇 ｜ **建议时长**：5 天 ｜ **前置**：05-中间件篇（Redis、ZooKeeper、RocketMQ）\n\n## 🎯 学习目标\n\n- 讲清\"单机 → 分布式\"的动机：不是追新技术，而是单机在**性能、容量、可用性**上撞墙后的必然选择；\n- 能结合注册中心（ZooKeeper/Nacos）讲 CAP 定理与 CP/AP 取舍，说清 BASE 理论与强/最终一致性的区别 ⭐；\n- 讲清一致性哈希为什么能让节点扩缩容时只迁移少量数据（哈希环 + 虚拟节点）⭐；\n- 掌握分布式 ID 四种方案，吃透雪花算法 64 位结构与**时钟回拨**处理 ⭐；\n- 从实现、优缺点、选型三个维度对比数据库/Redis/ZooKeeper 三种分布式锁 ⭐⭐；\n- 理解 2PC、TCC、本地消息表、RocketMQ 事务消息、Seata AT 的原理与适用场景，会做选型 ⭐⭐；\n- 说出一次 RPC 调用的完整链路（动态代理 → 序列化 → 网络传输 → 反序列化 → 反射调用）。\n\n## 📖 核心知识点\n\n### 1. 为什么需要分布式\n\n单机架构的三堵墙，每一堵都对应一个\"分布式化\"动作：\n\n| 单机瓶颈 | 具体表现 | 对应解法 |\n| --- | --- | --- |\n| 性能墙 | 单机 QPS/连接数有上限，CPU 与内存物理封顶 | 横向加机器 + 负载均衡 |\n| 容量墙 | 单表几千万行后索引膨胀、单机磁盘放不下 | 分库分表、数据分片 |\n| 可用性墙 | 单机故障 = 全站故障，发布即停服 | 多副本 + 故障转移（Redis/MySQL 主从、服务多实例） |\n\n代价同样明确：**数据一致性变难、运维复杂度上升、排查链路变长**。所以原则是\"先优化单机与架构，能不分布式就不分布式\"，这与下一篇的高并发演进路径是同一条主线。\n\n### 2. CAP 定理与取舍 ⭐\n\n- **C（Consistency）一致性**：所有节点在同一时刻读到相同的数据；\n- **A（Availability）可用性**：每个请求都能得到（非错误的）响应；\n- **P（Partition tolerance）分区容错性**：网络分区（节点间断连）发生时系统仍能工作。\n\n三个关键结论：\n\n1. 分布式系统中网络分区**必然发生**，P 必选，所以真实选择是 **CP 还是 AP**；\n2. 分区发生时：选 CP 就拒绝部分请求保数据一致（分布式锁、选主场景）；选 AP 就返回可能旧的数据保可用（服务发现场景）；\n3. 分区恢复后通过同步、补偿达到最终一致。\n\n**注册中心的取舍（呼应 05-中间件篇）**：\n\n| 注册中心 | 倾向 | 具体表现 |\n| --- | --- | --- |\n| ZooKeeper | CP | 主节点宕机选举期间（可达 30~120 秒）服务不可用，宁停服不脏读 |\n| Eureka | AP | 节点对等，任一节点可用即可完成注册发现，可能读到旧实例列表 |\n| Nacos | AP/CP 可切换 | 临时实例走 Distro 协议（AP），持久实例走 Raft（CP），默认 AP |\n\n**BASE 理论**：选 AP 时的工程化落地方案 —— **BA**（Basically Available，基本可用：降级、限流）、**S**（Soft State，软状态：允许中间态，如\"支付处理中\"）、**E**（Eventually Consistent，最终一致）。\n\n**一致性级别**：\n\n- **强一致**：写完任意节点后，立即可读到最新值，代价高、性能差；\n- **最终一致**：允许短暂不一致，经过一段时间同步后保证一致，互联网业务主流选择；\n- 两者之间还有\"读己之写\"\"单调读\"等会话级保证，面试提一句即可。\n\n### 3. 一致性哈希 ⭐\n\n**普通 Hash 取模的问题**：`hash(key) % N`，N 从 3 变 4 时绝大多数 key 的落点都会变，缓存几乎全部失效——这就是缓存集群扩容的经典痛点。\n\n**哈希环方案**：\n\n1. 把 2^32 的哈希空间想成一个环，节点（按 IP/主机名 hash）与数据（按 key hash）都映射到环上；\n2. 数据沿顺时针找到**第一个节点**存取；\n3. 增删节点时，只有\"该节点逆时针方向到上一个节点之间\"的数据需要迁移（约 1/N），其余全部不动。\n\n**数据倾斜与虚拟节点**：节点少时在环上分布不均，可能大部分数据落到同一节点。给每个物理节点生成 100~200 个**虚拟节点**散布在环上，数据先落在虚拟节点再映射回物理节点，均匀性大幅提升。\n\n**应用**：分布式缓存节点分布、负载均衡（Dubbo 的一致性哈希策略）、分库分表备选方案。注意：Redis Cluster 用的不是一致性哈希，而是 **16384 个 hash slot**，面试要能区分这两者。\n\n### 4. 分布式 ID ⭐\n\n分库分表后自增主键只能保证单表唯一，必须引入全局 ID。核心诉求：全局唯一、趋势递增（利于 B+ 树顺序插入）、信息安全和性能可用性。\n\n| 方案 | 原理 | 优点 | 缺点 |\n| --- | --- | --- | --- |\n| UUID | 128 位随机数 | 本地生成、无依赖、性能高 | 无序导致 B+ 树页分裂、太长（36 字符）、无业务含义 |\n| 数据库号段 | 批量取一段号缓存在应用内存，用完再取 | 趋势递增、DB 压力小（一次取 1000 个） | 依赖 DB、应用重启浪费号段、多机房扩展难 |\n| 雪花算法 | 64 位：时间戳 + 机器 ID + 序列号 | 本地生成、趋势递增、单机每秒 400 万+ | **依赖机器时钟**（回拨问题）、workerId 需要分配 |\n| Redis 自增 | INCR + 初始值/步长 | 简单、有序 | 强依赖 Redis 可用性，需持久化防重启丢数据 |\n\n**雪花算法结构（必背）**：\n\n```text\n| 1 bit 符号位 | 41 bit 时间戳（毫秒级，可用约 69 年） | 10 bit 机器 ID（可拆 5+5 机房+机器，共 1024 台） | 12 bit 序列号（同一毫秒内 0~4095） |\n```\n\n**时钟回拨问题**：机器时间被 NTP 校准往回调后，同一毫秒可能被\"重复使用\"，生成重复 ID。处理思路：小幅度回拨（如 ≤5ms）等待追平；回拨过大直接抛异常告警，或切换备用 workerId。动手实践第 1 题要求实现。\n\n### 5. 分布式锁方案对比 ⭐⭐\n\n单机用 `synchronized`/`ReentrantLock`，应用多实例部署后 JVM 锁失效，需要跨进程互斥——典型如防重复下单、定时任务防多机并发执行。\n\n**方案一：数据库**\n- 唯一索引插入法：`INSERT INTO lock_table(lock_key) VALUES(?)`，插入成功即获锁，删除记录即释放；\n- 悲观锁法：`SELECT ... FOR UPDATE` 排他锁。\n- 缺点：性能差（DB 是瓶颈）、无过期自动释放、宕机要自己处理死锁。仅适合低频场景或没有其他中间件时兜底。\n\n**方案二：Redis（主流）**\n- 雏形：`SET lockKey uniqueValue NX EX 30`，一条命令原子完成\"不存在才设置 + 过期时间\"；\n- 三大坑：① 业务没执行完锁先过期 → Redisson **看门狗**自动续期；② 误删他人锁 → value 存唯一标识，释放时 Lua 校验后再删；③ 不可重入 → Redisson 用 Hash 结构记录持有线程与重入次数；\n- Redisson 关键点：加锁/解锁都是 Lua 脚本保证原子性；不传 leaseTime 时默认锁 30 秒，后台线程每 10 秒（1/3）检查并续期，业务没执行完锁不会失效。\n\n```java\nRLock lock = redissonClient.getLock(\"order:lock:\" + userId);\ntry {\n    // 不指定 leaseTime → 启用看门狗自动续期；第一个参数是最长等待时间\n    if (lock.tryLock(3, TimeUnit.SECONDS)) {\n        // 业务逻辑\n    }\n} finally {\n    if (lock.isHeldByCurrentThread()) {   // 只释放自己持有的锁\n        lock.unlock();\n    }\n}\n```\n\n**方案三：ZooKeeper**\n- 客户端在 `/locks` 下创建**临时顺序节点**；\n- 判断自己是否是序号最小的节点：是则获锁；否则只 **watch 前一个节点**的删除事件（避免羊群效应）；\n- 释放 = 删除自己的节点；客户端宕机时临时节点自动消失，**锁天然不会死锁**；\n- 代价：写请求要走 ZAB 过半提交，性能不如 Redis；过半机制的容灾换算（3 台容 1、4 台也只容 1）见[《06-ZooKeeper与Nacos》](#/f/f26)。\n\n**对比与选型**：\n\n| 维度 | 数据库 | Redis | ZooKeeper |\n| --- | --- | --- | --- |\n| 性能 | 低 | 高（内存操作） | 中 |\n| 可靠性 | 高（落库） | 中（主从切换瞬间可能丢锁） | 高（CP） |\n| 实现复杂度 | 低 | 中（Redisson 已解决） | 中 |\n| 自动过期 | 需自己实现 | 过期时间 + 看门狗续期 | 临时节点（会话断开即释放） |\n| 适用场景 | 低频、无其他中间件 | 高并发业务锁（秒杀、防重） | 强一致要求（选主、元数据） |\n\n**一句话选型**：业务高并发选 Redisson；强一致、不能出错选 ZK；没得选才用数据库。\n\n**Redlock 与它的争议**（深挖加分项）：Redis 官方提出 **Redlock**——向 N 个（通常 5 个）**互相独立**的 Redis 主节点依次加锁，**过半数成功且总耗时小于锁有效期**才算加锁成功，意在摆脱\"单主从切换丢锁\"的隐患。争议焦点（Kleppmann 的质疑）：\n\n- **依赖时钟**：Redlock 靠各节点本地时钟判断锁是否过期；若某节点时钟**跳变**（NTP 校时、虚拟机迁移），锁可能在业务未完成时就失效。\n- **进程暂停（GC/调度）无法被锁阻止**：持锁进程暂停跨越了锁租期，醒来后仍会继续写共享资源——此时锁已被别人拿走，**互斥被破坏**。这不是 Redis 独有的问题，任何基于租期的锁都躲不掉，只能用 **fencing token**（每次获锁拿到单调递增的令牌，写资源时带上；存储端拒绝比已见令牌更小的写入）来兜底。\n- **工程结论**：对正确性要求极高的场景，别把安全性全押在分布式锁上——**用 fencing token 或让下游操作幂等**（如\"更新前先校验版本号\"）才是根本防线。因此 Redlock 在实践中用于\"提高可用性、降低丢锁概率\"，而不是\"保证绝对互斥\"。\n\n### 6. 分布式事务方案与选型 ⭐⭐\n\n跨库/跨服务的写操作无法用本地事务保证。先想清楚：**能不用就不用**——能合并到单库就合并，能靠业务流程避开的就避开。\n\n**2PC（两阶段提交）/3PC**：协调者先问所有参与者\"能否提交\"（Prepare），全部同意再统一提交（Commit）。\n- 问题：同步阻塞、协调者单点、第二阶段部分节点宕机会导致数据不一致；3PC 增加超时与 CanCommit 预询问缓解阻塞，但未根治。属于一致性协议层面的考点，工程上很少直接用。\n\n**TCC（Try-Confirm-Cancel）**：业务层的两阶段，每个参与方实现三个方法。\n- Try：预留资源（冻结库存/冻结金额）；Confirm：确认扣减；Cancel：释放预留；\n- 三个经典问题：**空回滚**（Try 没到、Cancel 先到）、**幂等**（重试导致重复执行）、**悬挂**（Cancel 之后迟到的 Try 又落地）；解决方式是事务状态表 + 幂等控制；\n- 特点：不依赖数据库回滚、性能好，但**业务侵入极大**（每个接口要写三套逻辑），适合资金类核心链路。\n\n**本地消息表**：业务操作与\"待发送消息\"记录在**同一个本地事务**里落库，后台任务扫描消息表投递 MQ，投递成功标记完成，失败重试；消费方保证幂等。简单可靠，缺点是与业务耦合、消息表需要定时清理。\n\n**RocketMQ 事务消息**：本地消息表的中间件化。\n1. 发送**半消息**（对消费者不可见）→ 2. 执行本地事务 → 3. 根据结果提交/回滚半消息；Broker 定时**回查**生产者本地事务状态兜底。解决\"本地事务与发消息的原子性\"。\n\n**Seata AT 模式原理 ⭐（国内面试高频）**：\n\n- 一阶段：代理数据源解析业务 SQL，生成前后镜像（before/after image）写入 `undo_log`，**与业务数据在同一个本地事务提交**，同时向 TC（事务协调器）注册分支；\n- 二阶段提交：异步批量删除 undo_log，几乎无性能损耗；\n- 二阶段回滚：根据 undo_log 校验数据未被别人改过，用前镜像生成反向 SQL 补偿；\n- 全局锁：保证一阶段已提交的本地数据，在全局事务回滚前不被其他全局事务修改（隔离性来源）；\n- 优点：业务几乎零侵入（一个 `@GlobalTransactional` 注解）；代价：全局锁带来并发性能损耗。\n\n**选型对比表**：\n\n| 方案 | 一致性 | 性能 | 侵入性 | 适用场景 |\n| --- | --- | --- | --- | --- |\n| 2PC/3PC | 强 | 差 | 低（协议层） | 数据库层面，工程少用 |\n| TCC | 最终一致（较强） | 好 | 极高（手写三接口） | 资金类核心链路 |\n| 本地消息表 | 最终一致 | 好 | 中 | 中小系统的 MQ 场景 |\n| RocketMQ 事务消息 | 最终一致 | 好 | 低 | 依赖 RocketMQ 的异步场景 |\n| Seata AT | 最终一致（准实时） | 中（全局锁） | 低 | 大多数微服务跨库场景 |\n\n### 7. RPC 基础\n\n把本地方法调用变成跨网络调用，中间要做五件事——**一次 RPC 调用流程**：\n\n1. **动态代理**：调用方拿到的是接口的代理对象，方法调用被拦截，组装请求（接口名、方法名、参数、版本号）；\n2. **序列化**：把请求对象序列化成字节流（Kryo/Protobuf/Hessian 等；JSON 慢但可读）；\n3. **网络传输**：客户端通过 Netty（TCP）发送，服务端接收；\n4. **反序列化**：服务端还原请求，根据接口名找到本地实现类；\n5. **反射调用**：`Method.invoke` 执行真实方法，结果原路序列化返回。\n\n注册中心（Nacos/ZK）负责服务地址的注册与发现，负载均衡在调用方（客户端）完成。\n\n**Dubbo 与 OpenFeign 一句话**：都是远程调用方案——Dubbo 是自研 RPC 框架（默认 Dubbo 协议 + 注册中心，服务治理能力强）；OpenFeign 本质是基于 HTTP 的声明式调用客户端（伪 RPC：HTTP + 动态代理），是 Spring Cloud 技术栈的默认选择。\n\n## 🛠 动手实践\n\n1. **手写雪花算法（含时钟回拨抛异常）**\n   - 实现 64 位结构生成器 + 简单 workerId 分配（配置文件或数据库）；\n   - 时钟回拨处理：≤5ms 自旋等待追平；>5ms 抛 `IllegalStateException` 并打告警日志；\n   - **验收**：10 个线程各生成 10 万个 ID，去重后仍是 100 万（无重复）；手动把系统时间回拨 10 秒，程序稳定抛异常而不是生成重复 ID。\n\n2. **封装 Redisson 分布式锁工具类**\n   - 提供 `tryLock(key, waitTime, Supplier)` 模板方法：加锁 → 执行业务 → finally 中释放；进阶用 AOP + 自定义 `@DistributedLock` 注解实现；\n   - **验收**：两个终端同时运行抢锁程序，同一时刻只有一个执行业务；把业务耗时设为 40 秒（超过默认 30 秒锁时长），观察看门狗续期期间锁不失效。\n\n3. **对比测试三种\"锁\"（可选）**\n   - 分别用数据库唯一索引、原生 `SET NX EX`、Redisson 跑同一段\"查库存→扣减\"逻辑；\n   - **验收**：用 JMeter 100 并发压测，观察前两种出现超卖或请求堆积，Redisson 版扣减结果精确；把现象与原因写成注释留在代码里。\n\n## 💼 高频面试题\n\n**Q：CAP 定理是什么？实践中怎么取舍？⭐**\n- P 必选（网络分区无法避免），实际是在 CP 与 AP 之间做选择；\n- 涉及钱、锁、选主的场景选 CP：宁可拒绝服务，不能读到脏数据（ZooKeeper、etcd）；\n- 服务发现、登录态、信息流场景选 AP：宁可返回旧数据，不能整体不可用（Eureka、Nacos 默认）；\n- 分区恢复后靠同步与补偿达到最终一致，这正是 BASE 理论；\n- 能举注册中心的例子（ZK 选举期间不可用 vs Eureka 返回旧列表）是明显加分项。\n\n**Q：一致性哈希解决什么问题？虚拟节点的作用？⭐**\n- 解决节点数变化时普通取模导致几乎全量数据迁移的问题；\n- 哈希环 + 顺时针寻址，增删节点只影响相邻区段的数据（约 1/N）；\n- 节点少时数据倾斜，用虚拟节点（每个物理节点 100~200 个）打散到环上，让分布均匀；\n- 应用：分布式缓存、负载均衡策略；能对比出 Redis Cluster 用的是 hash slot 而非一致性哈希更好。\n\n**Q：讲讲雪花算法的结构？时钟回拨怎么处理？⭐**\n- 64 位 = 1 符号位 + 41 位时间戳（约 69 年）+ 10 位机器 ID + 12 位毫秒内序列号（4096）；\n- 时钟回拨会让同一毫秒被重复使用而生成重复 ID；\n- 处理：小回拨（毫秒级）等待追平；大回拨抛异常告警，或切换备用 workerId；\n- 缓解手段：NTP 用渐变同步（slew）而非阶跃、预留回拨保护位、生产用美团 Leaf 等成熟方案。\n\n**Q：Redis、ZooKeeper、数据库三种分布式锁怎么选？⭐**\n- Redis：性能最高，Redisson 解决了续期、误删、重入三大坑；代价是主从切换瞬间可能丢锁，适合高并发业务锁；\n- ZK：临时顺序节点 + watch 前一个节点，会话断开自动释放、不会死锁，CP 更可靠，性能一般；\n- 数据库：实现最简单，但性能差、无自动过期、要自己处理宕机，只在低频场景兜底；\n- 结论：默认 Redisson；强一致选 ZK；数据库是最后的选择。\n\n**Q：分布式事务有哪些方案？怎么选型？⭐**\n- 用三个维度评估：一致性强度、性能、业务侵入性；\n- 强一致：2PC（同步阻塞，工程少用）、TCC（侵入大但可控，适合资金链路，要处理空回滚/幂等/悬挂）；\n- 最终一致：本地消息表（简单通用）、RocketMQ 事务消息（半消息 + 回查）、Seata AT（零侵入但有全局锁开销）；\n- 选择优先级：能合并成单库本地事务 > 消息最终一致 > Seata AT > TCC，数据越重要用侵入性越强的方案；\n- 一定先反问业务场景再选型，体现\"能不用就不用\"的工程判断。\n\n**Q：Seata AT 模式的原理？**\n- 一阶段：代理数据源解析 SQL，把前后镜像写入 undo_log，随本地事务一起提交，并向 TC 注册分支；\n- 二阶段：全局提交则异步删除 undo_log；全局回滚则校验后镜像无脏写，用前镜像生成反向 SQL 补偿；\n- 全局锁保证回滚窗口内数据不被其他全局事务修改；\n- 对比 TCC：AT 无业务侵入，但依赖数据库支持且并发受全局锁限制。\n\n## 🔗 推荐资料\n\n| 资料 | 说明 | 链接 |\n| --- | --- | --- |\n| pdai 架构知识体系 | CAP、一致性、分布式锁、事务的体系化索引 | https://pdai.tech/md/arch/arch-z-overview.html |\n| JavaGuide RPC&Dubbo 入门 | RPC 原理与 Dubbo 架构详解 | https://javaguide.cn/distributed-system/rpc/rpc-intro.html |\n| JavaGuide ZooKeeper 入门 | ZAB、Watcher、临时节点与 ZK 分布式锁 | https://javaguide.cn/distributed-system/distributed-process-coordination/zookeeper/zookeeper-intro.html |\n| JavaGuide 消息队列入门 | 事务消息与 MQ 基础概念 | https://javaguide.cn/high-performance/message-queue/message-queue.html |\n| JavaGuide 高可用系统设计指南 | 限流/降级/超时重试，衔接下一篇 | https://javaguide.cn/high-availability/high-availability-system-design.html |\n| JavaGuide 后端面试通关计划 | 冲刺期分布式部分的复习节奏 | https://javaguide.cn/interview-preparation/backend-interview-plan.html |\n| pdai 面试知识体系 | 分布式面试真题索引 | https://pdai.tech/md/interview/x-interview.html |\n","ck":0},{"id":"f30","stage":6,"path":"06-分布式与高并发篇/02-高并发系统设计.md","title":"02-高并发系统设计","md":"# 02-高并发系统设计\n\n> **阶段**：分布式与高并发篇 ｜ **建议时长**：5 天 ｜ **前置**：01-分布式理论基础、05-中间件篇（Redis/MQ/分库分表基础）\n\n## 🎯 学习目标\n\n- 用一条演进主线讲清高并发系统是怎么一步步长出来的（单机 → 读写分离 → 缓存 → MQ → 分库分表 → 微服务）⭐；\n- 说清多级缓存的层次与取舍（本地 Caffeine + Redis），会处理热点 key ⭐；\n- 对比四种限流算法并说出各自的 Java 实现（Guava RateLimiter/Sentinel/Redis+Lua）⭐；\n- 区分限流、熔断、降级三者，理解雪崩效应与舱壁模式 ⭐；\n- 讲清读写分离的主从延迟对策，以及分库分表的分片键选择与三大代价 ⭐；\n- **完整输出一份秒杀系统设计方案（流量漏斗 + 防超卖 + 一致性）⭐⭐——这是后端面试最经典的场景题**。\n\n## 📖 核心知识点\n\n### 1. 高并发演进路径 ⭐\n\n以一个电商订单系统为例，流量从日均 1 万单涨到峰值 10 万 QPS，每一步都是\"瓶颈出现 → 针对性加一层\"：\n\n| 阶段 | 出现的瓶颈 | 采取的动作 |\n| --- | --- | --- |\n| 1. 单机 all-in-one | 应用+DB 挤在一台机器 | 应用与 DB 分离部署 |\n| 2. 读写分离 | 读多写少，单库读扛不住 | MySQL 主从 + 读写分离，读请求分摊到从库 |\n| 3. 加缓存 | 热点读打穿到 DB | Redis 缓存热点数据，DB 只兜底缓存没有的 |\n| 4. MQ 削峰 | 写入洪峰（大促/秒杀） | 写请求先进 MQ，消费端按 DB 能力匀速落库 |\n| 5. 分库分表 | 单表过亿、单库写入瓶颈 | 垂直拆业务库，水平按分片键拆表 |\n| 6. 微服务化 | 单体应用发布慢、模块互相拖垮 | 按业务域拆服务，注册中心 + 网关 + 链路追踪 |\n\n三条铁律：\n\n1. **演进由瓶颈驱动**，不要一上来就微服务+分库分表（过度设计）；\n2. 每一步都是为了解决**上一层扛不住的那一类流量**（读 → 缓存、写 → MQ、数据量 → 分片）；\n3. 面试讲演进时永远带一句\"当时的瓶颈是什么\"，体现判断力而不是背名词。\n\n### 2. 缓存体系：多级缓存与热点 key ⭐\n\n**完整的读链路**：浏览器缓存 → CDN → Nginx 缓存 → **本地缓存（Caffeine）→ Redis → MySQL**。离用户越近越快，越远越全。\n\n**为什么要两级（本地 + Redis）**：\n\n| 维度 | 本地缓存 Caffeine | Redis |\n| --- | --- | --- |\n| 读取速度 | 纳秒~微秒（进程内存） | 毫秒内（多一次网络 IO + 序列化） |\n| 容量 | 单机有限 | 集群可扩展 |\n| 一致性 | 各实例独立，改动难同步 | 集中式，相对好保证 |\n| 定位 | 极热的小量数据（配置、商品 top100） | 主要缓存层，容量主力 |\n\n典型组合：先查 Caffeine，未命中查 Redis 并回填本地；更新时先失效 Redis，本地用**短 TTL（秒级）+ 过期自动刷新**容忍短暂不一致。\n\n```java\nCache<String, Product> localCache = Caffeine.newBuilder()\n        .maximumSize(10_000)                 // 控制容量，防内存溢出\n        .expireAfterWrite(Duration.ofSeconds(10)) // 短 TTL 控制不一致窗口\n        .build();\nProduct p = localCache.getIfPresent(id);\nif (p == null) {                             // 一级未命中 → 查二级\n    p = redisTemplate.opsForValue().get(\"p:\" + id);\n    if (p != null) localCache.put(id, p);\n}\n```\n\n**热点 key 处理**：单个 key 的 QPS 高到单分片扛不住（明星八卦、爆款商品）。手段：① 检测发现（客户端统计 + Redis `--hotkeys`/monitor）；② 热点 key 进**本地缓存**扛掉大部分读；③ 打散副本（`key_1`~`key_N` 随机读）；④ 读写分离多从库。\n\n**三种缓存问题一句话回顾**（详见[《01-Redis》](#/f/f21)）：\n- 穿透 = 查**不存在**的数据打穿到 DB → 空值缓存/布隆过滤器；\n- 击穿 = 单个**热点 key 失效瞬间** → 互斥锁重建/逻辑过期；\n- 雪崩 = **大量 key 同时失效**或 Redis 宕机 → TTL 随机打散/多级缓存/限流降级。\n\n### 3. 限流 ⭐\n\n**四种算法对比**：\n\n| 算法 | 原理 | 优点 | 缺点 | 典型实现 |\n| --- | --- | --- | --- | --- |\n| 固定窗口计数 | 单位时间计数器，超阈值拒绝 | 实现最简单 | 窗口边界突刺：两个窗口交界处可通过 2 倍流量 | Redis INCR+EXPIRE |\n| 滑动窗口 | 统计最近 N 秒内的请求数 | 解决边界突刺，更平滑 | 精度依赖格子数，内存略高 | Sentinel（滑动窗口统计） |\n| 漏桶 | 请求进桶，恒定速率流出 | 绝对平滑，整形流量 | 无法应对合理突发，排队有延迟 | Nginx limit_req |\n| 令牌桶 | 恒定速率往桶里放令牌，拿到令牌才放行 | 允许一定突发（桶里攒了令牌） | 速率与容量需调参 | Guava RateLimiter |\n\n**三种实现方式**：\n\n1. **Guava RateLimiter（单机）**：令牌桶，`tryAcquire()` 拿不到就快速失败。只对单个实例有效，多实例要乘以实例数折算阈值；\n2. **Sentinel（单机 + 集群，最常用于生产）**：滑动窗口统计，支持 QPS/线程数两种维度、流控效果（快速失败/Warm Up/排队等待）、熔断降级一体，配控制台动态改规则；\n3. **Redis + Lua（集群全局限流）**：多实例共享一份计数器，Lua 保证\"判断+计数+设过期\"原子执行：\n\n```lua\n-- 固定窗口：超过阈值返回 0（拒绝），否则自增并放行\nlocal current = redis.call('INCR', KEYS[1])\nif current == 1 then\n    redis.call('EXPIRE', KEYS[1], ARGV[1])   -- 第一次访问才设置过期\nend\nif current > tonumber(ARGV[2]) then\n    return 0\nend\nreturn 1\n```\n\nLua 的必要性：INCR 与 EXPIRE 分两步执行时，进程可能死在中间导致 key 永不过期、限流器永久锁死；Lua 脚本整体原子执行，天然规避。\n\n### 4. 熔断与降级 ⭐\n\n**雪崩效应**：服务 A 调 B，B 调 C；C 变慢 → B 的线程被拖住堆积 → B 也慢 → A 线程池耗尽 → 整条链路瘫痪。一个下游故障放大成全站故障，就是雪崩。\n\n三个概念各管一件事：\n\n- **限流**：流量太多时只放一部分进来（保自己）；\n- **熔断**：下游故障/超时率超阈值时，断路器跳闸，一段时间内直接快速失败，不再真正调用（断开依赖，防雪崩）。断路器三态：**关闭**（正常放行）→ **打开**（直接拒绝，计时）→ **半开**（放少量探测请求，成功则恢复）；\n- **降级**：出问题时返回兜底数据/简化逻辑（丢卒保帅：推荐列表挂了就返回默认榜单，不让页面白屏）。\n\n**舱壁模式（Bulkhead）**：像船舱一样隔离资源——给每个下游依赖分配**独立线程池/信号量**，一个依赖挂掉只烧掉自己的舱，不殃及其他调用。\n\n**三者关系一句话**：限流是入口处控量，熔断是调用链上断开故障依赖，降级是失败后的兜底预案；Sentinel 里三者通常配合使用。\n\n### 5. 数据层扩展：读写分离与分库分表 ⭐\n\n**读写分离**：主库写，从库读，主从复制（主库写 binlog → 从库 IO 线程拉取 → SQL 线程重放）。\n- **主从延迟**是核心问题：写完立刻读，从库可能还没同步到。对策：① 关键路径**强制走主库**（下单后查订单）；② 写后短时间内的同用户请求路由到主库；③ 半同步复制降低丢数据风险；\n- 注意：读写分离解决**读压力**，不解决单表数据量与写压力。\n\n**分库分表**：\n- **垂直分库**：按业务域拆（订单库/商品库/用户库）；**垂直分表**：把大字段、低频字段拆出去；\n- **水平分表/分库**：同一张表的数据按分片键打散到多个表/库，解决数据量与写入瓶颈。\n\n**分片键选择（最关键的决策）**：\n- 原则一：带分片键的查询占绝大多数（如订单表按 `user_id` 分，\"查我的订单\"直落单片）；\n- 原则二：数据分布均匀，避免热点（不能按\"省份\"分）；\n- 冲突处理：商家侧查询\"店铺所有订单\"没有 user_id → 冗余一份按 seller_id 分的异构索引表，或走 ES/宽表。\n\n**分库分表的三大代价（必考）**：\n1. **跨片查询**：无分片键的条件要扇出到全部分片再聚合，分页/排序代价极高（配合 ES 或异构索引解决）；\n2. **分布式事务**：跨库写无法用本地事务，需要 01 篇的分布式事务方案；\n3. **扩容与数据迁移**：翻倍扩容要迁移数据，常用\"翻倍扩容 + 双写迁移 + 灰度校验\"；\n4. 附带问题：全局唯一主键（见[《01-分布式理论基础》](#/f/f29)雪花算法）。\n\n**ShardingSphere**：Apache 分库分表中间件，两种形态——**ShardingSphere-JDBC**（客户端 SDK，直连数据库，性能好、侵入应用）与 **ShardingSphere-Proxy**（独立代理进程，对应用透明、支持异构语言）。核心配置概念：逻辑表/真实节点/分片算法。\n\n### 6. 削峰填谷\n\n- **MQ 异步化**：短时间洪峰（0 点签到、秒杀下单）先进队列，消费端按数据库承受能力**匀速消费**，把\"尖峰\"削成\"平谷\"；\n- **缓冲与排队**：请求进缓冲池/答题/令牌预发放，把随机洪峰变成可控节奏；\n- 代价：**延迟变高**（用户看到\"排队中\"）、需要处理消息可靠性与消费幂等（详见[《04-RocketMQ》](#/f/f24)与 MQ 三篇）。\n\n### 7. 秒杀系统设计串讲 ⭐⭐\n\n**先估量级**：100 万用户抢 1 万件商品，假设 10 分钟内 80% 请求涌入 → 峰值读 QPS 可到 10 万级，写（下单）远小于读。**99% 的流量应该死在到达数据库之前**——这就是流量漏斗。\n\n**流量漏斗（五层，自上而下）**：\n\n| 层 | 手段 | 挡掉什么 |\n| --- | --- | --- |\n| 1. 前端 | 按钮置灰防重复点击、答题/验证码拉平请求、秒杀 URL 动态加密防提前刷接口 | 机器人与重复点击，削掉大半流量 |\n| 2. 网关 | 令牌桶限流（如 5000 QPS）、黑名单/IP 限流、登录态校验 | 超过系统容量的流量与刷子 |\n| 3. 服务层 | 风控（同用户/设备限购）、Redis **预扣库存**（Lua 原子） | 无资格请求；库存不足直接拒绝，不再往下 |\n| 4. 异步层 | 抢到资格 → 发 MQ → 返回\"排队中\" | 削掉写入洪峰，前端体验平滑 |\n| 5. 数据库 | 消费端真正创建订单 + 扣减库存：`UPDATE stock SET num = num - 1 WHERE goods_id = ? AND num > 0` | 只接住队列匀速来的写，乐观锁条件 `num > 0` 兜底防超卖 |\n\n**Redis 预扣库存 + Lua 脚本防超卖 ⭐**（核中之核）：\n\n```lua\n-- KEYS[1]=库存 key，ARGV[1]=扣减数量\nlocal stock = tonumber(redis.call('GET', KEYS[1]) or '-1')\nif stock < tonumber(ARGV[1]) then\n    return -1                                   -- 库存不足，直接拒绝\nend\nredis.call('DECRBY', KEYS[1], ARGV[1])\nreturn stock - 1\n```\n\n要点：GET 判断与 DECRBY 之间不能有缝隙——若先 GET 再 DECR 两步执行，并发下会同时看到\"还剩 1\"然后都扣成负数（超卖）；Lua 单线程原子执行杜绝该窗口。\n\n**防刷三板斧**：验证码/答题（挡脚本+拉平峰值）、风控规则（同用户限购 1 件、同设备/同 IP 频次限制）、黑名单（提前标记羊毛党账号，网关直接拦截）。\n\n**热点与一致性**：\n- 库存是**热点 key**：单分片扛不住就分段（`stock_1`~`stock_10` 各存 1/10，随机段扣减，合并剩余量）；\n- **不超卖**靠 Redis 原子预扣 + DB 条件更新双保险；**不少卖**靠超时未支付回补库存（延迟消息）+ 定时对账 Redis 与 DB 的库存差异；\n- 缓存与 DB 一致性：下单成功以 DB 为准，Redis 库存在扣减成功后随 MQ 消费同步更新，失败有对账兜底。\n\n**一分钟回答框架**：澄清规模 → 漏斗五层逐层挡流量 → Redis+Lua 原子预扣防超卖 → MQ 异步落库削峰 → DB 条件更新兜底 → 防刷与对账保一致。\n\n## 🛠 动手实践\n\n1. **Redis + Lua 限流器**\n   - 用 `StringRedisTemplate.execute(RedisScript)` 封装\"固定窗口限流\"，参数为 key、窗口秒数、阈值；\n   - 写清注释：为什么必须 Lua（INCR/EXPIRE 两步不原子，进程中断会导致 key 永不过期）；\n   - **验收**：20 线程并发调用阈值 10 次/10 秒的限流器，恰好放行 10 个；窗口过期后自动恢复放行。\n\n2. **实现秒杀预扣库存（复用第 7 节 Lua）**\n   - Spring Boot + StringRedisTemplate：初始化库存 → Lua 预扣 → 抢到后发 RocketMQ/RabbitMQ 消息 → 消费端落库 `UPDATE ... AND num > 0`；\n   - **验收**：JMeter 500 并发抢 100 件库存，最终订单恰好 100 条、库存不为负；把每层日志（预扣成功/失败、MQ 消费、落库）打出来核对漏斗。\n\n3. **写一份秒杀设计文档**\n   - 固定三段：① 扣库存（预扣+落库怎么分工）② 防超卖（两层保险在哪）③ 一致性（超时回补、对账、缓存更新）；\n   - **验收**：文档里有 QPS 估算过程、流量漏斗图（文字版即可）、防刷清单；能对着文档口头讲 3 分钟不卡壳。\n\n## 💼 高频面试题\n\n**Q：设计一个秒杀系统？⭐⭐**\n- 先澄清量级：多少库存、多少用户、峰值读多大，再开始设计；\n- 流量漏斗：前端（置灰/答题/动态 URL）→ 网关（令牌桶限流+黑名单）→ 服务（风控限购 + Redis 预扣）→ MQ 异步 → DB 匀速落库；\n- 防超卖双保险：Redis Lua 原子预扣（GET+DECR 不留缝隙）+ DB `UPDATE ... AND num > 0` 条件更新；\n- 削峰：抢到资格先进 MQ 返回\"排队中\"，消费端按 DB 能力匀速创建订单；\n- 热点：库存 key 分段扛单分片极限，读走本地缓存+静态化；\n- 收尾讲一致性：超时未支付用延迟消息回补库存，定时对账兜底。\n\n**Q：四种限流算法对比？⭐**\n- 固定窗口：最简单，但窗口交界处有 2 倍突刺；\n- 滑动窗口：按小格子统计最近 N 秒，消除突刺，Sentinel 采用；\n- 漏桶：恒定速率流出，绝对平滑但压掉合理突发，Nginx 采用；\n- 令牌桶：匀速放令牌、桶内可攒，允许突发又能限制平均速率，Guava RateLimiter 采用；\n- 实现选型：单机用 RateLimiter/Sentinel，集群全局用 Redis+Lua。\n\n**Q：如何防止超卖？⭐**\n- 第一层：Redis 预扣库存，Lua 把\"查库存+扣减\"做成原子操作，不留并发窗口；\n- 第二层：数据库 `UPDATE stock SET num = num - 1 WHERE id = ? AND num > 0`，利用行锁+条件更新兜底，返回影响行数为 0 即回滚；\n- 也可以用 `SELECT ... FOR UPDATE` 悲观锁，但吞吐低，作为对比方案讲；\n- 最后对账：Redis 与 DB 库存定时核对，发现偏差告警修复。\n\n**Q：如何保证缓存与数据库一致性？⭐**\n- 基础方案 Cache Aside：读→先缓存后 DB；写→**先更新 DB，再删除缓存**（不是更新缓存）；\n- 删除失败的补偿：消息队列重试或订阅 binlog（canal）异步删除，解耦且不易漏；\n- 并发窗口要求高：延迟双删（写后删一次，隔几百毫秒再删一次，清掉期间旧读回填的脏缓存）；\n- 结论话术：强一致代价极高，业务上通常接受\"最终一致 + 不一致窗口最小化\"。\n\n**Q：系统突然来 10 倍流量怎么办？**\n- 应急三件套：限流（保住容量内的流量）、降级（非核心功能先砍）、扩容（无状态服务横向加实例）；\n- 缓存层检查：命中率是否下降、有没有热点 key 打爆单分片；\n- 写洪峰进 MQ 排队削峰，消费速率对齐 DB 承受力；\n- 事后：补压测、加容量告警，把\"突变\"变成\"可预测的扩容预案\"。\n\n**Q：为什么要多级缓存？本地缓存和 Redis 怎么分工？**\n- Redis 集中管理：容量大、一致性好维护，但每次多一次网络 IO 与序列化（约 0.5~1ms）；\n- 本地缓存：纳秒级响应，但各实例独立、容量有限、更新难同步；\n- 分工：极热、更新少的小数据（配置、TopN 商品）进本地，主力缓存放 Redis，DB 兜底；\n- 本地用短 TTL（秒级）控制不一致窗口，或通过 MQ 广播失效通知各实例清本地缓存。\n\n**Q：做了读写分离，主从延迟怎么处理？**\n- 先定性：复制是异步的，延迟通常毫秒级，但大事务、机器负载高时会放大到秒级；\n- 关键路径强制读主库：下单后立刻查订单，这类读不信任从库；\n- 会话级路由：同一用户\"写后 N 秒内\"的读请求路由到主库；\n- 监控从库同步延迟（Seconds_Behind_Master），落后过大告警并摘除读流量。\n\n## 🔗 推荐资料\n\n| 资料 | 说明 | 链接 |\n| --- | --- | --- |\n| JavaGuide 读写分离与分库分表 | 数据层扩展的完整思路 | https://javaguide.cn/high-performance/read-and-write-separation-and-library-subtable.html |\n| JavaGuide 高可用系统设计指南 | 限流/熔断/降级/隔离的系统化讲解 | https://javaguide.cn/high-availability/high-availability-system-design.html |\n| JavaGuide 负载均衡 | 演进路径与网关层的基础概念 | https://javaguide.cn/high-performance/load-balancing.html |\n| JavaGuide 消息队列入门 | 削峰、异步、解耦三大作用 | https://javaguide.cn/high-performance/message-queue/message-queue.html |\n| JavaGuide 系统设计面试题 | 秒杀/抢红包等场景题的答题框架 | https://javaguide.cn/system-design/system-design-questions.html |\n| pdai Redis 缓存问题 | 穿透/击穿/雪崩/一致性的深入篇 | https://pdai.tech/md/db/nosql-redis/db-redis-x-cache.html |\n| pdai MySQL 分库分表 | 分片策略与问题的更多细节 | https://pdai.tech/md/db/sql-mysql/sql-mysql-devide.html |\n| pdai 架构知识体系 | 高并发演进与架构设计的全景图 | https://pdai.tech/md/arch/arch-z-overview.html |\n","ck":0},{"id":"f31","stage":6,"path":"06-分布式与高并发篇/03-系统设计场景题.md","title":"03-系统设计场景题","md":"# 03-系统设计场景题\n\n> **阶段**：分布式与高并发篇 ｜ **用法**：三面/架构面的弹药库。每题按固定框架答：**澄清需求 → 估算量级 → 存储设计 → 核心链路 → 难点与取舍**。秒杀已在[《02-高并发系统设计》](#/f/f30)串讲，本篇补另外 6 个高频场景。冲刺期每个场景对着朋友讲一遍，讲不下去的就是漏洞。\n\n## 答题通用框架 ⭐\n\n1. **澄清**：读多还是写多？数据量级？一致性要求高吗？有哪些隐藏约束（会过期？要统计？）——先问再画，直接开画是减分项。\n2. **估算**：QPS = 日活 × 人均次数 ÷ 86400，再乘 10 倍峰值；存储 = 条数 × 单条大小 × (1+冗余)，一年翻几倍要留量。\n3. **最小可用架构**：客户端 → LB → 无状态服务 → 缓存 → DB，先跑通再谈优化。\n4. **难点**：每个场景真正的考点（下表「考点」列），主动讲出来，别等面试官挖。\n\n## 场景一：短链接系统 ⭐（读多写少 + 发号器）\n\n- **澄清**：要自定义后缀吗？要点击统计吗？链接会过期吗？\n- **估算**：1 亿条/年 ≈ 300 万/日，读多写少 100:1；单条约 200B → 存储无压力，**瓶颈在读**。\n- **核心链路**：长链 → 发号器取 ID → **Base62 编码**（0-9A-Za-z，62 进制）得 6~7 位短码 → 存 `short → long` 映射 → 跳转用 **301**（永久重定向，浏览器缓存，别用 302 每次回源）。\n- **发号器三选一**：DB 号段（批量取段，防单点）、雪花（呼应[《01-分布式理论基础》](#/f/f29)）、Redis INCR。自定义后缀走业务表唯一键，撞了就重试。\n- **考点**：为什么 301 vs 302；缓存热点（LRU + 布隆过滤不存在短码）；点击统计异步 MQ 上报不阻塞跳转；防刷（同 IP 限流）。\n\n## 场景二：海量数据去重（10 亿 URL 判断是否出现过）\n\n- **精确方案**：Redis SET/BitMap——内存算账：10 亿 × 32B ≈ 32GB 起步，太贵，除非量级小。\n- **考点核心：布隆过滤器**：k 个哈希 + 位数组，**说「没有」一定准，说「有」可能假阳性**；容量与误判率定 `m = -n·ln p/(ln2)²`、`k = m/n·ln2`；不能删除（计数布隆可）。10 亿 + 1% 误判 ≈ 1.2GB，这就是它赢的地方。\n- **大数据视角**：离线场景直接 Spark/Hive `distinct`，或 bitmap 精确去重（RoaringBitmap）；实时场景布隆 + 定期重建。\n- **加分**：UV 统计进一步用 HyperLogLog（12KB 误差 0.81%），**去重要精确吗？先问指标精度要求**。\n\n## 场景三：排行榜（游戏/热榜/直播间）\n\n- **ZSET 起步**：`ZADD rank {score} {member}`、`ZREVRANGE` 取 TopN、`ZREVRANK` 查自己名次——单机 Redis 一题解决。\n- **考点**：① 分数相同怎么排（score 拼时间戳取负，双写一次排序键）；② 数据量大分片：按分区/赛区拆多个 ZSET，Top 汇总归并；③ 实时更新频率高：客户端轮询改服务端推（WebSocket/SSE）、**写合并**（多次变更攒批 ZADD）。\n- **亿级**：分桶 + 近似（Count-Min 估热度）+ 定时快照，讲清「精确名次」与「TopN 列表」是两个量级的问题。\n\n## 场景四：延迟任务 / 订单超时关闭 ⭐\n\n- **方案四对比**（面试就爱问这个）：\n\n| 方案 | 原理 | 问题 |\n|---|---|---|\n| 定时任务扫表 | 每分钟 `WHERE status=待付 AND create<now-15min` | 延迟大、扫表压力、分片麻烦 |\n| JDK DelayQueue | 内存优先级队列 | **重启全丢**，单机 |\n| Redis ZSET | score=执行时间，轮询 `ZRANGEBYSCORE` | 需自己保证消费幂等与不丢 |\n| **RabbitMQ 死信/TTL** | 队列设 TTL，过期进 DLX，消费 DLX | 队头阻塞（用**延迟插件**解决） |\n| **RocketMQ 延迟等级/定时消息 5.x** | Broker 原生支持 | 版本与运维成本 |\n\n- **口径**：小任务用 MQ 延迟消息（业务解耦 + 不丢），量大用时间轮（HashedWheelTimer 内存版 / 容器化调度平台）。**超时关单必须与支付回调并发安全：关单前查最新状态（CAS update ... where status=待付）**，呼应秒杀防超卖。\n\n## 场景五：Feed 流（朋友圈/微博首页）\n\n- **推拉模型**：推（写扩散，发布时写进所有粉丝收件箱，读 O(1) 写爆炸）、拉（读扩散，读时现查关注列表聚合，写 O(1) 读慢）、**推拉结合**（普通用户拉、大 V 推）是标准答案。\n- **收件箱存储**：Redis List/ZSET 存最近 N 条 ID + 回源 DB 翻页；粉丝千万级写扩散要**分批 + 异步**。\n- **考点**：删除与可见性（读时过滤被删内容）、计数的最终一致、大 V 发文的削峰（呼应 MQ 削峰填谷）。\n\n## 场景六：附近的人 / GEO（一句话了解）\n\n- Redis `GEOADD`（底层 ZSET + GeoHash）→ `GEORADIUS` 圈范围；GeoHash 原理：经纬度交叠编码成字符串，**前缀相同≈距离近**，用空间索引换掉全表算距离。\n- 讲清 GeoHash 方块边界问题（相邻可能跨格子，查周围 8 格）即可，不深入。\n\n## 场景七：IM 消息系统（了解框架即可）\n\n- 链路：客户端长连接（WebSocket，呼应《IO模型与网络编程》Netty）→ 接入层（连接散列保持）→ 逻辑层 → 存储（Timeline：每会话一个 seq 递增）。\n- 难点四件套：**不丢**（ACK + 重传 + 离线拉取）、**不乱**（会话内 seq）、**不重**（幂等 msgId，呼应 MQ 消费幂等）、**在线状态**（临时节点/心跳，呼应 ZK）。\n- 已读回执用位图/区间压缩，别逐条存。\n\n## 万能兜底话术\n\n没准备过的场景也别慌，套路一样：「先澄清三个问题 → 给一个能跑的最小方案 → 说两个瓶颈（读瓶颈加缓存、写瓶颈加队列/分片）→ 点一个一致性/可靠性取舍」。面试官考的是**思维结构**，不是标准答案。\n\n## 💼 高频面试题\n\n- [ ] **Q：短链为什么用 301 不用 302？** —— 永久重定向浏览器会缓存跳转，省一次回源；302 每次都打到服务端，读放大 ｜ 详见[《03-系统设计场景题》](#/f/f31)\n- [ ] **Q：布隆过滤器能删元素吗？误判率怎么定？** —— 基础版不能（置 0 会误伤）；m 与 k 由容量 n 和目标误差 p 推出；「说没有一定准」 ｜ 详见[《03-系统设计场景题》](#/f/f31)\n- [ ] **Q：订单超时关闭有哪几种实现，怎么选？** —— 扫表/DelayQueue/Redis ZSET/MQ 延迟；生产选 MQ 延迟消息或 RocketMQ 定时消息，关单用条件更新防与支付回调打架 ｜ 详见[《02-RabbitMQ》](#/f/f22)\n- [ ] **Q：排行榜同分怎么处理？** —— score 复合（分数 × 基数 + 取反时间戳），一次排序解决「同分先达优先」 ｜ 详见[《01-Redis》](#/f/f21)\n- [ ] **Q：Feed 流推拉结合怎么划分用户？** —— 粉丝量阈值：超阈值大 V 写扩散推，普通用户读扩散拉，兼顾写放大与读延迟 ｜ 详见[《03-系统设计场景题》](#/f/f31)\n- [ ] **Q：UV 统计为什么用 HyperLogLog？** —— 只关心计数不关心成员，12KB 内存 0.81% 误差，比 SET 省几个量级 ｜ 详见[《01-Redis》](#/f/f21)\n\n## 🔗 推荐资料\n\n| 资料 | 用来干什么 | 链接 |\n|---|---|---|\n| JavaGuide 系统设计面试题 | 场景题答题框架的原始出处 | https://javaguide.cn/system-design/system-design-questions.html |\n| pdai.tech 分布式与架构篇 | 发号器/缓存/消息队列的工程视角 | https://pdai.tech/md/arch/arch-index.html |\n| 廖雪峰 Web 应用开发 | HTTP 重定向/状态码的底层语境 | https://www.liaoxuefeng.com/books/java/ |\n| 码工具 Java API | 场景实现时查类签名 | https://www.matools.com/api/java8 |\n","ck":6},{"id":"f32","stage":7,"path":"07-面试篇/01-Java高频八股速查.md","title":"01-Java高频八股速查","md":"# 01-Java高频八股速查\n\n> **阶段**：面试篇 ｜ **用法**：遮住答案自测，能独立说出 3 条以上要点再打勾；冲刺期每天过一遍\n\n## 使用说明\n\n- 每条格式：`- [ ] **Q：xxx？** —— 一句话核心答案 ｜ 详见《对应指南文件名》`，一句话只是提醒方向，真正的标准是**能展开说 3 条以上要点**；\n- 顺序按考察频率排列，越靠前越常被问；每道题的完整版答案与追问链在\"详见\"对应的指南文件里；\n- 冲刺期节奏：每天 1~2 个板块，全部过完一轮后重刷未打勾的题；面试前一晚只看打勾但\"心里没底\"的；\n- 八股追问是链式的（如 HashMap → 扩容 → 并发问题 → ConcurrentHashMap），建议按板块连着练，不要跳着背；\n- 每个板块开头有一行\"面试形式\"提示，说明该板块怎么考，按提示的连环问法对练；\n- 有精力时点开板块末尾的资料链接读完整版，把每条\"一句话答案\"扩成自己的 3 条要点；\n- 算法与项目经验不在本文件，见[《03-算法刷题路线》](#/f/f34)与[《04-简历与求职指南》](#/f/f35)。\n\n## 📋 自测清单\n\n### Java 基础（20 题）\n\n> 面试形式：单点直问 + 小连环（== → equals → hashCode 连问）；基础题答错一条，面试官会直接调低对整体的评价。\n\n- [ ] **Q：== 与 equals 的区别？** —— == 比较栈里的值（基本类型比值、引用类型比地址），equals 默认同 ==，String 等重写后比较内容 ｜ 详见[《02-面向对象与核心类》](#/f/f4)\n- [ ] **Q：为什么重写 equals 必须重写 hashCode？** —— 约定相等对象必须有相同哈希值，否则重写后两个\"相等\"对象在 HashMap 中会落到不同桶 ｜ 详见[《02-面向对象与核心类》](#/f/f4)\n- [ ] **Q：String 为什么设计成不可变？** —— private final 存储不暴露修改方法：安全性、hashCode 可缓存、字符串常量池复用 ｜ 详见[《02-面向对象与核心类》](#/f/f4)\n- [ ] **Q：String、StringBuilder、StringBuffer 怎么选？** —— 常量用 String，单线程频繁拼接用 StringBuilder，多线程共享拼接用 StringBuffer ｜ 详见[《02-面向对象与核心类》](#/f/f4)\n- [ ] **Q：Integer 缓存机制？** —— IntegerCache 缓存 -128~127，范围内 == 为 true，范围外必须用 equals，面试常挖箱拆箱 NPE ｜ 详见[《02-面向对象与核心类》](#/f/f4)\n- [ ] **Q：Java 是值传递还是引用传递？** —— 永远是值传递；传对象时复制的是引用值，方法内改属性生效、重新赋值不影响原对象 ｜ 详见[《01-环境搭建与基础语法》](#/f/f3)\n- [ ] **Q：重载与重写的区别？** —— 重载是同类同名不同参（编译期确定），重写是子类覆盖父类同签名方法（运行期多态）｜ 详见[《02-面向对象与核心类》](#/f/f4)\n- [ ] **Q：接口与抽象类的区别？** —— 抽象类表示\"是什么\"（单继承、可有状态），接口表示\"能做什么\"（多实现，Java 8 后可有 default/static 方法）｜ 详见[《02-面向对象与核心类》](#/f/f4)\n- [ ] **Q：final 关键字有哪些用法？** —— 类不可继承、方法不可重写、变量不可重新赋值（引用不变但对象内容可变）｜ 详见[《02-面向对象与核心类》](#/f/f4)\n- [ ] **Q：面向对象三大特性？** —— 封装隐藏细节、继承复用扩展、多态同一方法不同实现（编译看左边、运行看右边）｜ 详见[《02-面向对象与核心类》](#/f/f4)\n- [ ] **Q：Java 异常体系？** —— Throwable 下分 Error（OOM/StackOverflowError 不该捕获）与 Exception，后者分受检异常与运行时异常 ｜ 详见[《04-异常-IO-反射-注解》](#/f/f6)\n- [ ] **Q：反射是什么？有什么用？** —— 运行期动态获取类信息并创建对象、调用方法，是 Spring IoC、MyBatis Mapper 等框架的底层基石 ｜ 详见[《04-异常-IO-反射-注解》](#/f/f6)\n- [ ] **Q：注解的原理？** —— @interface 本质是继承 Annotation 的接口，运行期靠反射读取元数据，Retention 决定保留到源码/字节码/运行期 ｜ 详见[《04-异常-IO-反射-注解》](#/f/f6)\n- [ ] **Q：什么是泛型擦除？** —— 泛型只存在于编译期做类型检查，运行期 List\\<String\\> 与 List\\<Integer\\> 都是 List，桥接方法保证多态 ｜ 详见[《03-集合与泛型》](#/f/f5)\n- [ ] **Q：static 关键字的用法？** —— 静态变量/方法/代码块/内部类都属于类而非实例，静态方法不能访问实例成员，加载时初始化 ｜ 详见[《01-环境搭建与基础语法》](#/f/f3)\n- [ ] **Q：内部类有哪些？** —— 成员、静态、局部、匿名内部类；匿名内部类访问局部变量要求 effectively final ｜ 详见[《02-面向对象与核心类》](#/f/f4)\n- [ ] **Q：BigDecimal 为什么能避免精度丢失？** —— 用\"无标度整数+标度\"精确表示十进制；金额计算必用，除法必须指定舍入模式与精度 ｜ 详见[《02-面向对象与核心类》](#/f/f4)\n- [ ] **Q：Java 8 有哪些新特性？** —— Lambda、函数式接口、Stream、Optional、接口 default 方法、新时间日期 API ｜ 详见[《05-Lambda-Stream与Java8新特性》](#/f/f7)\n- [ ] **Q：Stream 常用操作？** —— 中间操作 filter/map/sorted/flatMap 惰性执行，终端操作 collect/reduce/count/forEach 触发计算，只能消费一次 ｜ 详见[《05-Lambda-Stream与Java8新特性》](#/f/f7)\n- [ ] **Q：Optional 解决什么问题？** —— 显式表达\"可能为空\"，用 map/orElse/ifPresent 链式处理减少 NPE，不建议用作字段 ｜ 详见[《05-Lambda-Stream与Java8新特性》](#/f/f7)\n\n### 集合（15 题）\n\n> 面试形式：以 HashMap 为绝对中心向下挖（put → 扩容 → 1.7/1.8 → 线程安全），ConcurrentHashMap 是通往并发板块的衔接点。\n\n- [ ] **Q：ArrayList 和 LinkedList 的区别？** —— 数组随机访问 O(1) vs 双向链表头尾插删 O(1)；实际绝大多数场景用 ArrayList（CPU 缓存友好、无指针开销）｜ 详见[《03-集合与泛型》](#/f/f5)\n- [ ] **Q：ArrayList 扩容机制？** —— 首次 add 创建容量 10，超出后扩为 1.5 倍并 Arrays.copyOf 拷贝；能预估数据量就指定初始容量 ｜ 详见[《03-集合与泛型》](#/f/f5)\n- [ ] **Q：HashMap 底层数据结构？** —— 1.8 起数组+链表+红黑树：链表长度 ≥8 且数组长度 ≥64 转红黑树，节点减到 6 退化回链表 ｜ 详见[《03-集合与泛型》](#/f/f5)\n- [ ] **Q：HashMap 的 put 流程？** —— 计算 hash 定位桶 → 空桶直接放 → 链表尾插或树插入 → key 已存在则覆盖 → 超过阈值扩容 ｜ 详见[《03-集合与泛型》](#/f/f5)\n- [ ] **Q：HashMap 扩容机制？** —— 容量翻倍、负载因子 0.75；1.8 优化：元素要么留在原索引，要么移到\"原索引+旧容量\"位置 ｜ 详见[《03-集合与泛型》](#/f/f5)\n- [ ] **Q：HashMap 1.7 和 1.8 的区别？** —— 1.7 头插法+纯链表（并发扩容可能成环死循环），1.8 尾插法+红黑树+扩容高位拆分优化 ｜ 详见[《03-集合与泛型》](#/f/f5)\n- [ ] **Q：HashMap 容量为什么是 2 的幂？** —— 使 (n-1) & hash 等价于取模且位运算更快，同时保证散列均匀 ｜ 详见[《03-集合与泛型》](#/f/f5)\n- [ ] **Q：HashSet 如何去重？** —— 底层就是 HashMap，元素作 key，add 时先比 hashCode 再比 equals ｜ 详见[《03-集合与泛型》](#/f/f5)\n- [ ] **Q：ConcurrentHashMap 1.8 的实现原理？** —— CAS 初始化 + synchronized 锁单个桶头节点，扩容支持多线程协助迁移，size 用 CounterCell 分散计数 ｜ 详见[《03-集合与泛型》](#/f/f5)\n- [ ] **Q：fail-fast 与 fail-safe？** —— 遍历中结构被改抛 ConcurrentModificationException（modCount 校验）；CopyOnWrite 系列是 fail-safe 的快照遍历 ｜ 详见[《03-集合与泛型》](#/f/f5)\n- [ ] **Q：遍历集合时如何安全删除元素？** —— 用 Iterator.remove() 或 removeIf()，不能在 for-each 中直接 list.remove() ｜ 详见[《03-集合与泛型》](#/f/f5)\n- [ ] **Q：TreeMap 的底层与使用场景？** —— 红黑树实现，key 有序，支持范围查询与首个/最后一个元素，需自然排序或 Comparator ｜ 详见[《03-集合与泛型》](#/f/f5)\n- [ ] **Q：List/Set/Queue/Map 怎么选型？** —— 有序可重复选 List、去重选 Set、先进先出/优先级选 Queue、键值映射选 Map，再看是否需要排序与并发 ｜ 详见[《03-集合与泛型》](#/f/f5)\n- [ ] **Q：ArrayList 线程安全吗？怎么解决？** —— 不安全；Vector 已过时，读多写少用 CopyOnWriteArrayList，或 Collections.synchronizedList ｜ 详见[《03-集合与泛型》](#/f/f5)\n- [ ] **Q：Comparable 与 Comparator 的区别？** —— Comparable 在类内部定义自然排序（compareTo），Comparator 外部定制排序规则（compare），后者可多套并存 ｜ 详见[《03-集合与泛型》](#/f/f5)\n\n### 并发（20 题）\n\n> 面试形式：追问最深的板块，线程池 7 参数与 synchronized/volatile 几乎必考，常要求现场写出线程池使用代码。\n\n- [ ] **Q：创建线程有几种方式？** —— 本质都是 new Thread 传 Runnable（Callable 配 FutureTask 可拿返回值）；生产环境一律用线程池 ｜ 详见[《01-多线程与并发编程》](#/f/f9)\n- [ ] **Q：线程有哪些状态？** —— NEW/RUNNABLE/BLOCKED/WAITING/TIMED_WAITING/TERMINATED 六种，常追问 wait 与 sleep 的区别 ｜ 详见[《01-多线程与并发编程》](#/f/f9)\n- [ ] **Q：synchronized 的底层原理？** —— 基于对象头 Mark Word 与 monitor（monitorenter/monitorexit 字节码指令），锁状态记录在对象头 ｜ 详见[《01-多线程与并发编程》](#/f/f9)\n- [ ] **Q：锁升级过程？** —— 无锁 → 偏向锁 → 轻量级锁（CAS 自旋）→ 重量级锁（monitor 阻塞），偏向锁在 JDK 15 后已废弃 ｜ 详见[《01-多线程与并发编程》](#/f/f9)\n- [ ] **Q：volatile 的作用？** —— 保证可见性（写立即刷主存、读失效本地缓存）与有序性（内存屏障禁重排），**不保证原子性** ｜ 详见[《01-多线程与并发编程》](#/f/f9)\n- [ ] **Q：JMM（Java 内存模型）是什么？** —— 主内存+工作内存的抽象，定义 happens-before 规则，解决多线程的可见性与有序性问题 ｜ 详见[《01-多线程与并发编程》](#/f/f9)\n- [ ] **Q：CAS 的原理与问题？** —— CPU 原子比较交换指令；存在 ABA（用 AtomicStampedReference 加版本号）与自旋空转问题 ｜ 详见[《01-多线程与并发编程》](#/f/f9)\n- [ ] **Q：一句话说清 AQS？** —— 抽象队列同步器：volatile 的 state + CLH 变体等待队列 + 模板方法，ReentrantLock/Semaphore/CountDownLatch 的共同基石 ｜ 详见[《01-多线程与并发编程》](#/f/f9)\n- [ ] **Q：ReentrantLock 与 synchronized 的区别？** —— 支持可中断、tryLock 超时、公平锁、多个 Condition；JDK 6 后性能相当，简单场景仍用 synchronized ｜ 详见[《01-多线程与并发编程》](#/f/f9)\n- [ ] **Q：公平锁与非公平锁？** —— 公平锁按队列顺序获取防饥饿；非公平锁允许新请求直接插队，吞吐更高，ReentrantLock 默认非公平 ｜ 详见[《01-多线程与并发编程》](#/f/f9)\n- [ ] **Q：线程池的 7 个参数？** —— corePoolSize、maximumPoolSize、keepAliveTime、unit、workQueue、threadFactory、handler ｜ 详见[《01-多线程与并发编程》](#/f/f9)\n- [ ] **Q：线程池的任务执行流程？** —— 先填核心线程 → 满了入队列 → 队列满了开非核心线程 → 到 maximum 后触发拒绝策略（注意\"先排队再扩容\"）｜ 详见[《01-多线程与并发编程》](#/f/f9)\n- [ ] **Q：四种拒绝策略？** —— AbortPolicy 抛异常（默认）、CallerRunsPolicy 调用者线程执行、DiscardPolicy 静默丢弃、DiscardOldestPolicy 丢最旧任务 ｜ 详见[《01-多线程与并发编程》](#/f/f9)\n- [ ] **Q：线程池大小怎么定？** —— 经验公式 CPU 密集 N+1、IO 密集 N×(1+等待时间/计算时间)，最终靠压测校准，不建议 unbounded 队列 ｜ 详见[《01-多线程与并发编程》](#/f/f9)\n- [ ] **Q：ThreadLocal 原理与内存泄漏？** —— 每个 Thread 内有 ThreadLocalMap，key 是弱引用、value 是强引用，用完必须 remove() 防止 value 泄漏 ｜ 详见[《01-多线程与并发编程》](#/f/f9)\n- [ ] **Q：CountDownLatch/CyclicBarrier/Semaphore 的区别？** —— 一次性倒数开门 / 可复用的集体等齐 / 控制并发数（permits），三者都基于 AQS ｜ 详见[《01-多线程与并发编程》](#/f/f9)\n- [ ] **Q：死锁的产生条件与排查？** —— 互斥、请求与保持、不可剥夺、循环等待四个必要条件；jstack 可直接检测出死锁 ｜ 详见[《01-多线程与并发编程》](#/f/f9)\n- [ ] **Q：CompletableFuture 怎么用？** —— supplyAsync/thenApply/thenCompose/allOf 做异步编排与结果组合，注意默认线程池与异常传播 ｜ 详见[《01-多线程与并发编程》](#/f/f9)\n- [ ] **Q：ConcurrentHashMap 并发 put 为什么安全？** —— 1.8 用 CAS 初始化 + 对桶头节点 synchronized，锁粒度到单个桶；get 无锁靠 volatile ｜ 详见[《01-多线程与并发编程》](#/f/f9)\n- [ ] **Q：虚拟线程是什么？** —— JDK 21 正式特性：由 JVM 调度的轻量线程，阻塞时不占用 OS 线程，可创建百万级，适合 IO 密集场景 ｜ 详见[《01-多线程与并发编程》](#/f/f9)\n\n### JVM（16 题）\n\n> 面试形式：概念之外一定接实操——CPU 飙高与 OOM 排查两类题要按步骤背熟，最好配上自己跑过的例子。\n\n- [ ] **Q：JVM 内存区域划分？** —— 线程私有：虚拟机栈、本地方法栈、程序计数器；线程共享：堆、方法区（JDK 8 后由元空间实现）｜ 详见[《02-JVM核心》](#/f/f10)\n- [ ] **Q：对象的创建过程？** —— 类加载检查 → 分配内存（TLAB/指针碰撞）→ 零值初始化 → 设置对象头 → 执行构造函数 ｜ 详见[《02-JVM核心》](#/f/f10)\n- [ ] **Q：GC Roots 有哪些？** —— 栈帧局部变量、静态变量、常量引用、JNI 引用、活跃线程等，是可达性分析的起点 ｜ 详见[《02-JVM核心》](#/f/f10)\n- [ ] **Q：四种引用的区别？** —— 强引用不回收；软引用内存不足才回收（缓存）；弱引用下次 GC 必回收（ThreadLocal key）；虚引用仅用于跟踪回收 ｜ 详见[《02-JVM核心》](#/f/f10)\n- [ ] **Q：三种基础 GC 算法？** —— 标记-清除（有碎片）、标记-复制（新生代，浪费空间）、标记-整理（老年代，移动对象慢）｜ 详见[《02-JVM核心》](#/f/f10)\n- [ ] **Q：分代收集的设计？** —— 新生代 Eden:Survivor:Survivor = 8:1:1 用复制算法，对象熬过 15 次 GC（默认）晋升老年代用标记整理 ｜ 详见[《02-JVM核心》](#/f/f10)\n- [ ] **Q：Minor GC 和 Full GC 的区别？** —— Minor 只清新生代、STW 短且频繁；Full GC 清整堆+元空间、STW 长，是性能优化的头号目标 ｜ 详见[《02-JVM核心》](#/f/f10)\n- [ ] **Q：对象什么时候进入老年代？** —— 年龄达阈值（默认 15）、大对象直接进入、动态年龄判断、Survivor 放不下 ｜ 详见[《02-JVM核心》](#/f/f10)\n- [ ] **Q：CMS 的原理与问题？** —— 并发标记-清除收集器，四阶段中标记可并发；产生内存碎片、并发失败退化为 Serial Old，已在新版移除 ｜ 详见[《02-JVM核心》](#/f/f10)\n- [ ] **Q：G1 的原理？** —— 堆划分为多个 Region，按\"停顿时间目标\"优先回收垃圾最多的 Region（Mixed GC），JDK 9 起默认 ｜ 详见[《02-JVM核心》](#/f/f10)\n- [ ] **Q：ZGC 的特点？** —— 着色指针+读屏障实现并发整理，停顿 <1ms 且与堆大小无关，适合超大堆低延迟场景 ｜ 详见[《02-JVM核心》](#/f/f10)\n- [ ] **Q：并发标记为什么会\"漏标\"？CMS 和 G1 怎么解决？** —— 漏标需同时满足「黑对象新增指向白对象的引用」+「灰到白的路径被删」；CMS 用增量更新（写后屏障记录新引用、黑变灰重扫），G1 用 SATB（写前屏障保留删除前旧值，浮动垃圾下次收）｜ 详见[《02-JVM核心》](#/f/f10)\n- [ ] **Q：类加载过程？** —— 加载 → 验证 → 准备（静态变量赋零值）→ 解析 → 初始化（执行 \\<clinit\\>），五步常按\"什么时候触发初始化\"追问 ｜ 详见[《02-JVM核心》](#/f/f10)\n- [ ] **Q：双亲委派模型？** —— 类加载请求逐级向上委托（自定义 → 应用 → 扩展 → 启动），保证核心类安全与唯一；打破场景：SPI、热部署、Tomcat 隔离 ｜ 详见[《02-JVM核心》](#/f/f10)\n- [ ] **Q：CPU 飙到 100% 怎么排查？** —— top 找进程 → top -Hp 找线程 → printf '%x' 转十六进制 → jstack 中按 nid 定位到代码行 ｜ 详见[《02-JVM核心》](#/f/f10)\n- [ ] **Q：OOM 怎么排查？** —— 启动加 -XX:+HeapDumpOnOutOfMemoryError 拿堆转储 → MAT/jvisualvm 分析支配树与大对象 → 沿引用链定位泄漏代码 ｜ 详见[《02-JVM核心》](#/f/f10)\n\n### Spring/SpringBoot（15 题）\n\n> 面试形式：围绕 Bean 生命周期、事务失效、自动配置三条主线追问，常结合项目问\"你项目里怎么用的\"。\n\n- [ ] **Q：什么是 IoC 和 DI？** —— IoC 把对象创建与依赖管理交给容器（控制反转），DI 是实现手段：构造器/setter/字段注入 ｜ 详见[《Spring核心》](#/f/f15)\n- [ ] **Q：Bean 的生命周期？** —— 实例化 → 属性填充 → Aware 回调 → BeanPostProcessor 前置 → 初始化（@PostConstruct/afterPropertiesSet）→ 后置处理 → 销毁 ｜ 详见[《Spring核心》](#/f/f15)\n- [ ] **Q：三级缓存如何解决循环依赖？** —— 成品池/早期引用池/工厂池三步走，只能解决单例 + setter 注入的循环依赖，构造器依赖无解 ｜ 详见[《Spring核心》](#/f/f15)\n- [ ] **Q：Bean 的作用域？** —— singleton（默认，容器单例）、prototype（每次新建）、request/session 等 Web 作用域 ｜ 详见[《Spring核心》](#/f/f15)\n- [ ] **Q：AOP 的原理？** —— 运行期动态代理织入横切逻辑：目标类有接口走 JDK 动态代理，无接口走 CGLIB 子类代理 ｜ 详见[《Spring核心》](#/f/f15)\n- [ ] **Q：JDK 动态代理与 CGLIB 的区别？** —— JDK 基于接口反射实现代理，CGLIB 生成子类字节码；final 类/方法无法被 CGLIB 代理 ｜ 详见[《Spring核心》](#/f/f15)\n- [ ] **Q：Spring 事务的传播行为？** —— REQUIRED（默认，有事务则加入）、REQUIRES_NEW（挂起当前另开新事务）、NESTED（嵌套保存点）等 7 种 ｜ 详见[《Spring核心》](#/f/f15)\n- [ ] **Q：Spring 事务失效的场景？** —— 自调用（this 绕过代理）、方法非 public、异常被 catch 吞掉、默认只回滚 RuntimeException、引擎不支持事务 ｜ 详见[《Spring核心》](#/f/f15)\n- [ ] **Q：SpringMVC 的执行流程？** —— 请求到 DispatcherServlet → HandlerMapping 找处理器 → HandlerAdapter 调用 Controller → 返回视图渲染 ｜ 详见[《Spring核心》](#/f/f15)\n- [ ] **Q：SpringBoot 自动配置原理？** —— @EnableAutoConfiguration 读取 AutoConfiguration.imports 文件，配合 @ConditionalOnClass 等条件注解按需装配 ｜ 详见[《SpringBoot实战》](#/f/f16)\n- [ ] **Q：starter 是什么？** —— 依赖聚合 + 自动配置的封装，引入即用；自定义 starter = 自动配置模块 + starter 空壳依赖 ｜ 详见[《SpringBoot实战》](#/f/f16)\n- [ ] **Q：@Autowired 和 @Resource 的区别？** —— @Autowired 是 Spring 的，先按类型后按名称；@Resource 是 JSR-250 的，先按名称后按类型 ｜ 详见[《SpringBoot实战》](#/f/f16)\n- [ ] **Q：@ConfigurationProperties 与 @Value 怎么选？** —— 前者批量绑定前缀配置、类型安全、支持校验；后者适合单个值，支持 SpEL ｜ 详见[《SpringBoot实战》](#/f/f16)\n- [ ] **Q：@Configuration 与 @Component 的区别？** —— @Configuration 类被 CGLIB 代理，@Bean 方法互调仍走容器保证单例；@Component 下互调会 new 新对象 ｜ 详见[《Spring核心》](#/f/f15)\n- [ ] **Q：BeanFactory 和 FactoryBean 的区别？** —— BeanFactory 是容器顶层接口；FactoryBean 是\"生产 Bean 的 Bean\"，用于封装复杂对象的构建（如 SqlSessionFactoryBean）｜ 详见[《Spring核心》](#/f/f15)\n\n### MyBatis（8 题）\n\n> 面试形式：题量少但 #{} vs ${} 与 Mapper 动态代理几乎必问，答好后会转向 MyBatis-Plus 与分页等使用细节。\n\n- [ ] **Q：#{} 和 ${} 的区别？** —— #{} 是预编译占位符防 SQL 注入；${} 是字符串拼接，只用于动态表名/列名等受控场景 ｜ 详见[《MyBatis》](#/f/f17)\n- [ ] **Q：一级缓存与二级缓存？** —— 一级是 SqlSession 级默认开启；二级是 namespace 级需手动开启，跨会话共享，分布式下易脏读生产慎用 ｜ 详见[《MyBatis》](#/f/f17)\n- [ ] **Q：Mapper 接口没有实现类为什么能执行 SQL？** —— JDK 动态代理 MapperProxy 拦截方法调用，接口全限定名+方法名映射到 XML 的 statement id ｜ 详见[《MyBatis》](#/f/f17)\n- [ ] **Q：常用动态 SQL 标签？** —— if/where/choose/when/otherwise/set/foreach/trim，用于条件拼接与批量插入 ｜ 详见[《MyBatis》](#/f/f17)\n- [ ] **Q：resultMap 什么时候用？** —— 列名与属性名不一致、一对一/一对多关联映射、自定义类型转换时使用 ｜ 详见[《MyBatis》](#/f/f17)\n- [ ] **Q：MyBatis 的分页方案？** —— RowBounds 是内存逻辑分页（全查再截取，有 OOM 风险）；生产用 PageHelper 物理分页（改写 SQL 加 LIMIT）｜ 详见[《MyBatis》](#/f/f17)\n- [ ] **Q：MyBatis-Plus 有哪些特性？** —— BaseMapper 通用 CRUD、Wrapper 条件构造器、分页/乐观锁插件、自动填充、代码生成器 ｜ 详见[《MyBatis》](#/f/f17)\n- [ ] **Q：MyBatis 和 JPA 怎么选？** —— SQL 需要精细控制、复杂查询多选 MyBatis（国内主流）；标准 CRUD 快速开发选 JPA/Hibernate ｜ 详见[《MyBatis》](#/f/f17)\n\n## 🔗 深入学习资料\n\n| 资料 | 说明 | 链接 |\n| --- | --- | --- |\n| JavaGuide Java 基础面试题（系列共 3 篇） | 基础题的完整版答案与追问 | https://javaguide.cn/java/basis/java-basic-questions-01.html |\n| JavaGuide 集合面试题（系列共 3 篇） | HashMap/ConcurrentHashMap 深挖 | https://javaguide.cn/java/collection/java-collection-questions-01.html |\n| JavaGuide 并发面试题（系列共 3 篇） | 线程池/AQS/volatile 逐层追问 | https://javaguide.cn/java/concurrent/java-concurrent-questions-01.html |\n| JavaGuide JVM 面试题 | 内存区域、GC、类加载完整版 | https://javaguide.cn/java/jvm/jvm-interview-questions.html |\n| JavaGuide Spring 常见问题 | 事务、循环依赖、AOP 深挖 | https://javaguide.cn/system-design/framework/spring/spring-knowledge-and-questions-summary.html |\n| JavaGuide MyBatis 面试题 | 缓存、Mapper 原理完整版 | https://javaguide.cn/system-design/framework/mybatis/mybatis-interview.html |\n| JavaGuide 面试突击版 | 冲刺期快速过题的浓缩版 | https://interview.javaguide.cn/home.html |\n| pdai 面试知识体系 | 按专题组织的 Java 面试题库 | https://pdai.tech/md/interview/x-interview.html |\n","ck":94},{"id":"f33","stage":7,"path":"07-面试篇/02-数据库与中间件面试速查.md","title":"02-数据库与中间件面试速查","md":"# 02-数据库与中间件面试速查\n\n> **阶段**：面试篇 ｜ **用法**：遮住答案自测，能独立说出 3 条以上要点再打勾；冲刺期每天过一遍\n\n## 使用说明\n\n- 格式：`- [ ] **Q：xxx？** —— 一句话核心答案 ｜ 详见《对应指南文件名》`；一句话只是提醒，打勾标准是**能展开说 3 条以上要点**；\n- 本文件覆盖数据库、中间件、网络、操作系统四大块——它们与 Java 八股共同构成一面/二面的主力题源；\n- 先看下方\"板块频率与追问链速览\"排优先级：MySQL 与 Redis 出现频率最高，建议每天至少各过一遍；\n- MQ 按\"作用 → 可靠性 → 不丢不重\"一条线连着记，别孤立背每个组件的特性；\n- 网络与操作系统偏\"概念 + 排查\"：三次握手、epoll、零拷贝要与 IO 模型篇对照着理解，不要死背；\n- 本清单与[《01-Java高频八股速查》](#/f/f32)交替着过，避免同一板块刷久了疲劳效率下降；\n- 场景类题目（分库分表、秒杀、限流）的完整设计思路见[《02-高并发系统设计》](#/f/f30)。\n\n## 📊 板块频率与追问链速览\n\n| 板块 | 出现频率 | 典型追问链 |\n| --- | --- | --- |\n| MySQL | ⭐⭐⭐⭐⭐ | 索引结构 → 回表/覆盖 → 失效场景 → explain → 事务/MVCC → 三大日志 → 分库分表 |\n| Redis | ⭐⭐⭐⭐⭐ | 数据类型 → 持久化 → 缓存三问题 → 一致性 → 分布式锁 → 主从/哨兵/集群 |\n| 消息队列 | ⭐⭐⭐⭐ | 为什么用 → 不丢消息 → 不重复（幂等）→ 顺序 → 三大 MQ 选型 |\n| ES/ZK/Nacos | ⭐⭐⭐ | 倒排索引 → 与 MySQL 分工 → 数据同步；ZK Watcher/锁；Nacos AP/CP |\n| 网络 | ⭐⭐⭐⭐ | 握手挥手 → HTTPS → epoll → HTTP 方法/状态码 → 粘包 |\n| 操作系统 | ⭐⭐ | 进程线程 → 死锁 → 虚拟内存 → 零拷贝/IO 多路复用 |\n\n## 📋 自测清单\n\n### MySQL（20 题）\n\n> 面试形式：必考板块，从一道索引题出发能连追问十分钟；\"你项目里加过什么索引、为什么\"是标准衔接。\n\n- [ ] **Q：为什么用 B+ 树而不是 B 树/哈希/红黑树？** —— 矮胖 3 层可存千万级数据、叶子链表支持范围查询；哈希不支持范围，红黑树/AVL 树太高 IO 次数多 ｜ 详见[《索引-事务-锁与调优》](#/f/f14)\n- [ ] **Q：聚簇索引与二级索引的区别？** —— 聚簇索引叶子存整行数据（InnoDB 必有，默认主键），二级索引叶子存主键值 ｜ 详见[《索引-事务-锁与调优》](#/f/f14)\n- [ ] **Q：什么是回表？** —— 用二级索引只拿到主键，还要回聚簇索引再查一次整行；查询列都在索引里则免回表 ｜ 详见[《索引-事务-锁与调优》](#/f/f14)\n- [ ] **Q：什么是覆盖索引？** —— 查询所需列全部包含在索引中，无需回表；是\"只查需要的列\"与联合索引设计的核心依据 ｜ 详见[《索引-事务-锁与调优》](#/f/f14)\n- [ ] **Q：最左前缀原则？** —— 联合索引 (a,b,c) 必须从 a 开始连续命中才走索引，遇到范围查询后索引列失效 ｜ 详见[《索引-事务-锁与调优》](#/f/f14)\n- [ ] **Q：索引失效的常见场景？** —— 索引列上函数/运算、隐式类型转换、前导 % 模糊、or 连接非索引列、违反最左前缀、优化器认为全表更快 ｜ 详见[《索引-事务-锁与调优》](#/f/f14)\n- [ ] **Q：explain 主要看哪些字段？** —— type（至少 range，理想 ref/const）、key（实际用的索引）、rows（预估扫描行数）、Extra（出现 Using filesort/Using temporary 要优化）｜ 详见[《索引-事务-锁与调优》](#/f/f14)\n- [ ] **Q：ACID 分别靠什么实现？** —— 原子性靠 undo log、持久性靠 redo log、隔离性靠锁+MVCC、一致性是前三者共同保障的结果 ｜ 详见[《索引-事务-锁与调优》](#/f/f14)\n- [ ] **Q：四种隔离级别？** —— 读未提交 → 读已提交（解决脏读）→ 可重复读（InnoDB 默认，解决不可重复读）→ 串行化；InnoDB 的 RR 用 MVCC+间隙锁基本杜绝幻读 ｜ 详见[《索引-事务-锁与调优》](#/f/f14)\n- [ ] **Q：MVCC 的原理？** —— 隐藏字段 trx_id/roll_pointer + undo log 版本链 + ReadView 可见性判断；RC 每次查询生成 ReadView，RR 事务内复用第一次的 ｜ 详见[《索引-事务-锁与调优》](#/f/f14)\n- [ ] **Q：三大日志的作用？** —— redo log 保证崩溃恢复（WAL、循环写）、undo log 支持回滚与 MVCC、binlog 用于主从复制与数据恢复（Server 层、追加写）｜ 详见[《索引-事务-锁与调优》](#/f/f14)\n- [ ] **Q：redo log 和 binlog 的区别？** —— 层级（InnoDB vs Server）、形态（循环写 vs 追加写）、用途（崩溃恢复 vs 复制/恢复）都不同；两阶段提交保证两者一致 ｜ 详见[《索引-事务-锁与调优》](#/f/f14)\n- [ ] **Q：InnoDB 有哪些锁？** —— 行锁（记录锁/间隙锁/临键锁）、表锁、意向锁；行锁是加在索引上的，无索引条件更新会升级为全表扫描锁住大量记录 ｜ 详见[《索引-事务-锁与调优》](#/f/f14)\n- [ ] **Q：慢 SQL 怎么排查优化？** —— 慢查询日志定位 → explain 分析执行计划 → 优化索引/改写 SQL/覆盖索引 → 数据量太大再考虑分库分表 ｜ 详见[《索引-事务-锁与调优》](#/f/f14)\n- [ ] **Q：分库分表怎么拆？** —— 先垂直（按业务拆库、大字段拆表）再水平（按分片键散列行）；分片键要满足高频查询条件且分布均匀 ｜ 详见[《索引-事务-锁与调优》](#/f/f14)\n- [ ] **Q：分库分表带来哪些问题？** —— 跨片 join/分页/聚合困难、跨库事务、全局唯一 ID、扩容数据迁移；能用缓存/ES 撑住就别急着拆 ｜ 详见[《02-高并发系统设计》](#/f/f30)\n- [ ] **Q：深分页怎么优化？** —— `LIMIT 1000000,10` 要扫描并丢弃前 100 万行；改成游标（WHERE id > 上次最大值）、子查询先定位 id、或覆盖索引 ｜ 详见[《索引-事务-锁与调优》](#/f/f14)\n- [ ] **Q：inner join / left join / right join 的区别？** —— inner 取两表交集；left 保留左表全部行、右表无匹配补 NULL；right 相反 ｜ 详见[《MySQL基础与SQL实战》](#/f/f13)\n- [ ] **Q：char 与 varchar 的区别？** —— char 定长、空间换性能、适合定长数据（手机号/MD5）；varchar 变长、多 1~2 字节长度头，按实际长度存储 ｜ 详见[《MySQL基础与SQL实战》](#/f/f13)\n- [ ] **Q：drop、delete、truncate 的区别？** —— drop 删表结构与数据；delete 逐行删、可回滚、可带 where；truncate 清空全表重置自增，属 DDL 不可回滚 ｜ 详见[《MySQL基础与SQL实战》](#/f/f13)\n\n### Redis（15 题）\n\n> 面试形式：与 MySQL 并列的必考板块；缓存三问题 + 一致性 + 分布式锁是固定三连
