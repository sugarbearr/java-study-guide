，答好了会追问集群。\n\n- [ ] **Q：Redis 为什么快？** —— 纯内存操作 + 命令执行单线程（无锁无切换）+ epoll IO 多路复用 + 针对场景优化的数据结构 ｜ 详见[《01-Redis》](#/f/f21)\n- [ ] **Q：五种基本类型与使用场景？** —— String 缓存/计数/分布式锁，Hash 对象属性，List 队列/时间线，Set 去重/抽奖/交并集，ZSet 排行榜/延迟队列 ｜ 详见[《01-Redis》](#/f/f21)\n- [ ] **Q：RDB 与 AOF 怎么选？** —— RDB 快照恢复快、可能丢最后一次快照后的数据；AOF 追加日志丢得少但文件大；4.0 混合持久化（RDB 底座+AOF 增量）兼得 ｜ 详见[《01-Redis》](#/f/f21)\n- [ ] **Q：过期删除策略？** —— 惰性删除（访问时检查）+ 定期删除（随机抽检）组合，内存超限再触发淘汰策略 ｜ 详见[《01-Redis》](#/f/f21)\n- [ ] **Q：内存淘汰策略？** —— 默认 noeviction 写报错；缓存场景用 allkeys-lru，含过期集合维度有 volatile-lru/lfu 等 8 种 ｜ 详见[《01-Redis》](#/f/f21)\n- [ ] **Q：缓存穿透及解决？** —— 查询**不存在**的数据每次都打穿到 DB；空值缓存、布隆过滤器、入口参数校验 ｜ 详见[《01-Redis》](#/f/f21)\n- [ ] **Q：缓存击穿及解决？** —— 单个**热点 key 过期瞬间**大量请求直击 DB；互斥锁重建、逻辑过期不删 key、热点数据不过期 ｜ 详见[《01-Redis》](#/f/f21)\n- [ ] **Q：缓存雪崩及解决？** —— **大量 key 同时失效**或 Redis 宕机；TTL 加随机值、多级缓存、集群高可用、限流降级兜底 ｜ 详见[《01-Redis》](#/f/f21)\n- [ ] **Q：缓存与数据库一致性？** —— Cache Aside 先更新 DB 再删除缓存 + 失败重试；要求更高用延迟双删；终极方案 canal 订阅 binlog 异步删缓存 ｜ 详见[《01-Redis》](#/f/f21)\n- [ ] **Q：用 Redis 写分布式锁要注意什么？** —— `SET key uniqueValue NX EX` 原子加锁；value 存唯一标识防误删；解锁用 Lua 校验后删除 ｜ 详见[《01-Redis》](#/f/f21)\n- [ ] **Q：Redisson 分布式锁的原理？** —— Lua 加解锁 + Hash 结构记录持有线程与重入次数；看门狗默认 30 秒锁、每 10 秒续期，解决业务超时锁先过期 ｜ 详见[《01-Redis》](#/f/f21)\n- [ ] **Q：主从复制的流程？** —— 首次全量同步（主库生成 RDB 传给从库）+ 复制缓冲区增量，之后命令异步传播；读写分离依赖它 ｜ 详见[《01-Redis》](#/f/f21)\n- [ ] **Q：哨兵的作用？** —— 监控主库、通知运维、自动故障转移（选新主）、充当配置中心；至少 3 个哨兵节点防止误判与脑裂 ｜ 详见[《01-Redis》](#/f/f21)\n- [ ] **Q：Cluster 集群的原理？** —— 16384 个槽位按 CRC16 分片到各主节点，客户端请求错位收 MOVED 重定向；gossip 协议通信，主从自动切换 ｜ 详见[《01-Redis》](#/f/f21)\n- [ ] **Q：大 key 与热 key 怎么处理？** —— 大 key：拆分成多个 key、用 UNLINK 异步删除、避免集合过大；热 key：本地缓存兜底、副本打散、限流 ｜ 详见[《01-Redis》](#/f/f21)\n\n### 消息队列（12 题）\n\n> 面试形式：围绕\"不丢消息、不重复消费、保证顺序\"三问展开，项目里用过 MQ 才答得出体感。\n\n- [ ] **Q：消息队列的三大作用？** —— 异步（缩短响应时间）、解耦（生产者消费者互不依赖）、削峰（洪峰进队列匀速消费）｜ 详见[《02-RabbitMQ》](#/f/f22)\n- [ ] **Q：RabbitMQ 的四种交换机？** —— direct 精确匹配、fanout 广播、topic 通配符匹配、headers 按头部匹配；业务路由多用 topic ｜ 详见[《02-RabbitMQ》](#/f/f22)\n- [ ] **Q：RabbitMQ 如何保证消息不丢？** —— 三段：生产者 confirm 确认、交换机/队列/消息持久化、消费者手动 ack，任一环节失败可重发 ｜ 详见[《02-RabbitMQ》](#/f/f22)\n- [ ] **Q：死信队列是什么？** —— 消息被拒绝/过期/队列满时路由到 DLX；用途是异常消息兜底，以及 TTL+死信实现延迟队列 ｜ 详见[《02-RabbitMQ》](#/f/f22)\n- [ ] **Q：Kafka 为什么快？** —— 顺序写磁盘+页缓存、零拷贝 sendfile、批量发送与压缩、分区并行消费 ｜ 详见[《03-Kafka》](#/f/f23)\n- [ ] **Q：Kafka 的 ACK 机制？** —— 0 不等待、1 主分区落盘即确认、all（-1）等 ISR 全部确认；可靠性要求高用 all + retries ｜ 详见[《03-Kafka》](#/f/f23)\n- [ ] **Q：ISR 是什么？** —— 与 leader 保持同步的副本集合（含 leader），落后超过阈值被踢出；all ACK 只等 ISR 成员，兼顾可靠与性能 ｜ 详见[《03-Kafka》](#/f/f23)\n- [ ] **Q：消费组与 rebalance？** —— 组内消费者分摊分区且一个分区只归一个消费者；成员增减触发重平衡，期间会停止消费且可能重复消费 ｜ 详见[《03-Kafka》](#/f/f23)\n- [ ] **Q：Kafka 怎么保证消息顺序？** —— 只保证分区内有序；需要顺序的业务按 key 路由到同一分区，消费端单线程处理该分区 ｜ 详见[《03-Kafka》](#/f/f23)\n- [ ] **Q：RocketMQ 事务消息的原理？** —— 半消息（消费者不可见）→ 执行本地事务 → 提交/回滚半消息；Broker 定时回查事务状态兜底 ｜ 详见[《04-RocketMQ》](#/f/f24)\n- [ ] **Q：重复消费怎么办（幂等）？** —— MQ 是至少一次投递，重复不可避免；消费端用唯一业务键 + 去重表/Redis SETNX/状态机校验实现幂等 ｜ 详见[《04-RocketMQ》](#/f/f24)\n- [ ] **Q：RabbitMQ/Kafka/RocketMQ 怎么选型？** —— RabbitMQ 低延迟、功能全、适合中小业务；Kafka 吞吐王、适合日志与大数据；RocketMQ 电商业务（事务/延迟/顺序消息全支持）｜ 详见[《04-RocketMQ》](#/f/f24)\n\n### Elasticsearch/ZooKeeper/Nacos（12 题）\n\n> 面试形式：ES 问倒排索引与和 MySQL 的分工；ZK/Nacos 问 AP/CP 与服务发现原理，JD 提到才深挖。\n\n- [ ] **Q：什么是倒排索引？** —— 分词后建立\"词项 → 文档列表\"的映射，查询按词直达文档，FST 结构压缩词典，这是全文检索快的根本 ｜ 详见[《05-Elasticsearch》](#/f/f25)\n- [ ] **Q：ES 和 MySQL 的分工？** —— MySQL 是事务主存（写入源），ES 做检索与聚合的查询副本；各司其职而非互相替代 ｜ 详见[《05-Elasticsearch》](#/f/f25)\n- [ ] **Q：match 与 term 的区别？** —— match 对查询词分词后做全文匹配打分；term 不分词做精确匹配；bool 组合 must/should/filter（filter 不算分且可缓存）｜ 详见[《05-Elasticsearch》](#/f/f25)\n- [ ] **Q：ES 的深分页问题？** —— from+size 每个分片都要取 from+size 条排序，默认限制 1 万；翻页深用 search_after 游标，全量导出用 scroll ｜ 详见[《05-Elasticsearch》](#/f/f25)\n- [ ] **Q：text 和 keyword 类型的区别？** —— text 分词、参与相关性打分，用于全文搜索；keyword 不分词、整体匹配，用于精确过滤与聚合排序 ｜ 详见[《05-Elasticsearch》](#/f/f25)\n- [ ] **Q：MySQL 数据怎么同步到 ES？** —— 主流用 canal 监听 binlog → 发 MQ → 消费写入 ES，解耦且不侵入业务；代码双写是简易方案但有一致性风险 ｜ 详见[《05-Elasticsearch》](#/f/f25)\n- [ ] **Q：ZooKeeper 的应用场景？** —— 分布式锁、注册中心、配置中心、Master 选举；本质是基于\"文件系统 + Watcher\"的协调服务 ｜ 详见[《06-ZooKeeper与Nacos》](#/f/f26)\n- [ ] **Q：Watcher 机制的特点？** —— 一次性触发（触发后需重新注册）、轻量（只推事件类型不推数据）、顺序性（客户端先收到事件再看到新数据）｜ 详见[《06-ZooKeeper与Nacos》](#/f/f26)\n- [ ] **Q：临时节点与顺序节点？** —— 临时节点随会话断开自动删除（服务发现/锁的基石）；顺序节点由 ZK 追加序号保证全局有序（锁排队）｜ 详见[《06-ZooKeeper与Nacos》](#/f/f26)\n- [ ] **Q：ZAB 协议做了什么？** —— 崩溃恢复（按 zxid/epoch 选主）+ 消息广播（类似两阶段提交、过半即提交）；因此 ZK 是 CP 系统 ｜ 详见[《06-ZooKeeper与Nacos》](#/f/f26)\n- [ ] **Q：Nacos 的 AP 与 CP 怎么选？** —— 临时实例走 Distro 协议（AP，默认），持久实例与配置中心走 Raft（CP）；服务发现一般用 AP 保可用 ｜ 详见[《06-ZooKeeper与Nacos》](#/f/f26)\n- [ ] **Q：注册中心的服务发现原理？** —— 服务启动时注册地址 → 消费者订阅并拉取列表缓存本地 → 心跳续约剔除失效实例 → 变更推送更新本地缓存 ｜ 详见[《06-ZooKeeper与Nacos》](#/f/f26)\n\n### 网络（15 题）\n\n> 面试形式：一面的保留节目，三次握手/四次挥手与 HTTPS 是出现率最高的两道，常加\"从 URL 到页面\"综合题。\n\n- [ ] **Q：TCP 和 UDP 的区别？** —— TCP 面向连接、可靠字节流、有流量/拥塞控制；UDP 无连接、不可靠、报文小延迟低（DNS/视频/游戏）｜ 详见[《03-IO模型与网络编程》](#/f/f11)\n- [ ] **Q：为什么三次握手不是两次？** —— 确认双方收发能力都正常，并防止历史重复的 SYN 建立无效连接；两次会导致服务端白白维持半连接 ｜ 详见[《03-IO模型与网络编程》](#/f/f11)\n- [ ] **Q：四次挥手与 TIME_WAIT？** —— 双向各发 FIN+ACK；主动方最后等 2MSL：确保对端收到最后的 ACK、让旧报文在网络中消亡 ｜ 详见[《03-IO模型与网络编程》](#/f/f11)\n- [ ] **Q：TCP 如何保证可靠传输？** —— 序列号+确认应答、超时重传/快速重传、滑动窗口流量控制、拥塞控制（慢启动/拥塞避免/快恢复）｜ 详见[《03-IO模型与网络编程》](#/f/f11)\n- [ ] **Q：常见 HTTP 状态码？** —— 200 成功、301/302 重定向、304 缓存有效、400 参数错、401/403 未认证/无权限、404 不存在、500 服务器错、502/504 网关错误/超时 ｜ 详见[《03-IO模型与网络编程》](#/f/f11)\n- [ ] **Q：HTTP 方法的幂等性？** —— GET/PUT/DELETE 幂等（重复执行效果相同），POST 非幂等；幂等性影响重试设计 ｜ 详见[《03-IO模型与网络编程》](#/f/f11)\n- [ ] **Q：HTTPS 的握手与加密？** —— TCP 之后 TLS 协商套件 → 验证证书（防冒充）→ ECDHE 非对称交换出对称密钥 → 之后对称加密通信；混合加密兼顾安全与性能 ｜ 详见[《03-IO模型与网络编程》](#/f/f11)\n- [ ] **Q：GET 和 POST 的区别？** —— 语义：GET 获取（幂等、参数在 URL、可缓存）vs POST 提交（非幂等、参数在 body）；本质都是 TCP 报文，区别是约定 ｜ 详见[《03-IO模型与网络编程》](#/f/f11)\n- [ ] **Q：TCP 粘包拆包怎么解决？** —— TCP 是字节流没有消息边界；定长协议、分隔符、长度前缀（Netty LengthFieldBasedFrameDecoder）三种方案 ｜ 详见[《03-IO模型与网络编程》](#/f/f11)\n- [ ] **Q：select/poll/epoll 的区别？** —— select 有 1024 上限且每次全量拷贝轮询；poll 无上限仍轮询；epoll 红黑树管理 fd + 就绪链表回调，O(1) 只处理就绪的 ｜ 详见[《03-IO模型与网络编程》](#/f/f11)\n- [ ] **Q：Cookie/Session/Token 的区别？** —— Cookie 存客户端随请求携带；Session 存服务端（集群需共享）；Token（JWT）自包含无状态、天然适合分布式 ｜ 详见[《03-IO模型与网络编程》](#/f/f11)\n- [ ] **Q：JWT 的结构与校验？** —— Header.Payload.Signature，签名防篡改；服务端无状态验证签发方；缺点是无法主动失效（要配黑名单）｜ 详见[《03-IO模型与网络编程》](#/f/f11)\n- [ ] **Q：DNS 的解析过程？** —— 浏览器缓存 → 系统缓存 → 本地 DNS（递归）→ 根/顶级/权威服务器（迭代），最终拿到 IP 并缓存 ｜ 详见[《03-IO模型与网络编程》](#/f/f11)\n- [ ] **Q：HTTP/1.1、2、3 的演进？** —— 1.1 长连接但仍有队头阻塞；2 二进制分帧+多路复用解决 HTTP 层阻塞；3 基于 QUIC/UDP 彻底解决 TCP 层队头阻塞 ｜ 详见[《03-IO模型与网络编程》](#/f/f11)\n- [ ] **Q：从输入 URL 到页面展示发生了什么？** —— DNS 解析 → TCP 三次握手 → TLS 握手 → HTTP 请求 → 服务端处理返回 → 浏览器解析渲染，综合串讲题 ｜ 详见[《03-IO模型与网络编程》](#/f/f11)\n\n### 操作系统（8 题）\n\n> 面试形式：题少但与网络相通——死锁、IO 多路复用、零拷贝都会在并发与中间件话题里被顺手问到。\n\n- [ ] **Q：进程和线程的区别？** —— 进程是资源分配单位（独立地址空间），线程是 CPU 调度单位（共享进程堆与方法区，各自有栈）；线程切换成本更低 ｜ 详见[《03-IO模型与网络编程》](#/f/f11)\n- [ ] **Q：进程间通信方式？** —— 管道、消息队列、共享内存（最快）、信号量、Socket；线程间直接共享内存但要加锁同步 ｜ 详见[《03-IO模型与网络编程》](#/f/f11)\n- [ ] **Q：死锁的四个必要条件？** —— 互斥、请求与保持、不可剥夺、循环等待；破坏任意一个即可预防，工程上常用资源有序申请 ｜ 详见[《03-IO模型与网络编程》](#/f/f11)\n- [ ] **Q：什么是虚拟内存？** —— 每个进程独立的虚拟地址空间，经页表映射到物理内存，缺页中断按需加载；带来隔离与\"内存超售\"能力 ｜ 详见[《03-IO模型与网络编程》](#/f/f11)\n- [ ] **Q：用户态与内核态？** —— CPU 权限分级；系统调用/中断触发切换并保存上下文，切换有开销，频繁切换是性能杀手（如大量小 IO）｜ 详见[《03-IO模型与网络编程》](#/f/f11)\n- [ ] **Q：IO 多路复用是什么？** —— 一个线程同时监听多个 fd，内核告知就绪后才处理；select/poll/epoll 是三种实现，epoll 是高性能服务的标配 ｜ 详见[《03-IO模型与网络编程》](#/f/f11)\n- [ ] **Q：什么是零拷贝？** —— 数据不经过用户态来回拷贝（sendfile/mmap），减少 CPU 拷贝与上下文切换；Kafka、RocketMQ、Nginx 靠它提速 ｜ 详见[《03-IO模型与网络编程》](#/f/f11)\n- [ ] **Q：fork 是什么？写时复制？** —— Unix 创建子进程的系统调用；COW 让父子先共享物理页，任一方写入时才真正复制，降低创建成本 ｜ 详见[《03-IO模型与网络编程》](#/f/f11)\n\n## 🔗 深入学习资料\n\n| 资料 | 说明 | 链接 |\n| --- | --- | --- |\n| JavaGuide MySQL 面试题（系列） | 索引/事务/日志/锁的完整版答案 | https://javaguide.cn/database/mysql/mysql-questions-01.html |\n| JavaGuide Redis 面试题（系列） | 缓存问题与集群的完整版答案 | https://javaguide.cn/database/redis/redis-questions-01.html |\n| JavaGuide 消息队列入门 | MQ 基础概念与选型总览 | https://javaguide.cn/high-performance/message-queue/message-queue.html |\n| JavaGuide 读写分离与分库分表 | 分库分表场景题的完整展开 | https://javaguide.cn/high-performance/read-and-write-separation-and-library-subtable.html |\n| JavaGuide ZooKeeper 入门 | ZK 数据模型、ZAB、应用场景 | https://javaguide.cn/distributed-system/distributed-process-coordination/zookeeper/zookeeper-intro.html |\n| JavaGuide 面试突击版 | 冲刺期数据库/中间件快速过题 | https://interview.javaguide.cn/home.html |\n| pdai 面试知识体系 | 数据库/中间件/网络的专题题库 | https://pdai.tech/md/interview/x-interview.html |\n","ck":82},{"id":"f34","stage":7,"path":"07-面试篇/03-算法刷题路线.md","title":"03-算法刷题路线","md":"# 03-算法刷题路线\n\n> **阶段**：面试篇 ｜ **建议总量**：热题 100 + 剑指 Offer 为主，200 题以内 ｜ **节奏**：从进阶篇开始每天 2~3 题，面试前保持手感\n\n### 一、刷题总原则\n\n- **先专题后套卷**：按下面的专题顺序集中攻一类套路，形成肌肉记忆；面试前一个月再刷 Hot 100 混排，模拟真实考试；\n- **每天 2~3 题、限时**：简单题 15 分钟、中等题 25 分钟、困难题 40 分钟；到时没思路就看题解，看懂后**合上题解默写**才算完成；\n- **错题隔天重做**：建一个\"重刷清单\"，3 天后重做仍能独立写出才打勾；面试前只重刷清单里的题；\n- **一题多解**：每题先写暴力解，再逐步优化，每个解法都说得出时间/空间复杂度——面试官就是要听你的优化过程；\n- **总量控制**：200 题以内、质量优先；刷 500 遘题不如把 150 道经典题刷透；\n- **与指南进度配合**：进阶篇开始同步刷数组与链表，03-面试篇期间完成主干专题，冲刺期每天 1 题保手感。\n\n### 二、Java 刷题常用 API ⭐\n\n```java\n// —— List / 数组 ——\nList<Integer> list = new ArrayList<>();\nlist.add(1); list.get(0); list.size();\nlist.sort(Comparator.comparingInt(a -> a));        // List 自定义升序\nCollections.sort(list, (a, b) -> b - a);           // 降序\nint[] arr = {3, 1, 2};\nArrays.sort(arr);                                  // 数组排序（基本类型只能升序）\nint[][] intervals = {{2, 1}, {3, 2}};\nArrays.sort(intervals, (a, b) -> a[0] - b[0]);     // 二维数组按首元素升序（区间题必用）\n\n// —— Deque：用 ArrayDeque 同时当栈和队列，比 Stack/LinkedList 快 ——\nDeque<Integer> stack = new ArrayDeque<>();\nstack.push(1); stack.peek(); stack.pop();          // 栈：压 / 瞥 / 弹\nDeque<Integer> queue = new ArrayDeque<>();\nqueue.offer(1); queue.peek(); queue.poll();        // 队列：入 / 瞥 / 出\n\n// —— PriorityQueue 堆：Top K、堆排序题专用 ——\nPriorityQueue<Integer> minHeap = new PriorityQueue<>();                  // 小顶堆\nPriorityQueue<Integer> maxHeap = new PriorityQueue<>((a, b) -> b - a);   // 大顶堆\nPriorityQueue<int[]> pq = new PriorityQueue<>((a, b) -> a[1] - b[1]);    // 按元素第 2 位排序\nminHeap.offer(1); minHeap.peek(); minHeap.poll();\n\n// —— HashMap：计数、映射、前缀和 ——\nMap<Character, Integer> map = new HashMap<>();\nmap.put('a', 1); map.get('a'); map.containsKey('a');\nmap.getOrDefault('b', 0);\nmap.merge('a', 1, Integer::sum);                   // 计数神器：不存在则 1，存在则累加\nmap.remove('a');\n\n// —— 常用小工具 ——\n// Character.isDigit(c)、c - '0' 转 int、Integer.parseInt(s)、String.valueOf(n)\n// StringBuilder 拼接；s.toCharArray() 与 new String(chars) 互转\n// Integer.MIN_VALUE / MAX_VALUE 做初始极值\n```\n\n### 二·补、复杂度与算法思想速查 ⭐\n\n面试不只要写出代码，还会追问时间/空间复杂度与\"为什么这么设计\"。这一节是选择题与口头追问的高频弹药。\n\n**常见排序的复杂度**（背表）：\n\n| 算法 | 平均 | 最坏 | 额外空间 | 稳定性 | 备注 |\n| --- | --- | --- | --- | --- | --- |\n| 快速排序 | O(nlogn) | **O(n²)** | O(logn) 栈 | 不稳定 | 最坏：每次划分极不均匀（如已有序数组固定取首元素为基准，递归深度退化成 n） |\n| 归并排序 | O(nlogn) | **O(nlogn)** | **O(n)** | 稳定 | 唯一\"最坏也能保证 nlogn\"的常用排序，代价是额外数组 |\n| 堆排序 | O(nlogn) | O(nlogn) | O(1) | 不稳定 | 原地排序；建堆 O(n)、每次调整 O(logn) |\n| 插入排序 | O(n²) | O(n²) | O(1) | 稳定 | 近乎有序时接近 O(n)，小数组优于快排 |\n| 计数/桶排序 | O(n+k) | O(n+k) | O(n+k) | 稳定 | 非比较排序，值域必须可控 |\n\n- 口径：**\"最坏仍 O(nlogn)\"只有归并（和堆排序）能保证**；快排 O(nlogn) 是平均，最坏 O(n²) 是最常见的时间复杂度误解之一。\n- 改进：三数取中 / 随机化基准 / 小区间切插入排序，可显著降低快排退化概率（工业库都这么做）。\n\n**看循环算复杂度**：看**每层循环的步进方式**，不是嵌套层数。\n\n```java\nfor (int i = 1; i < n; i *= 2)      // i 每次翻倍 → 只执行 log n 次\n    for (int j = 0; j < n; j++)     // 内层固定 n 次\n        sum++;                       // 合计 O(n log n)，不是 O(n²)\n```\n\n- 记忆：`i++` 是 n 次、`i *= 2` 或 `i /= 2` 是 logn 次；两层相乘。三层循环若外层是倍增，往往是 O(n²logn) 或 O(nlogn)。\n\n**建堆是 O(n)，不是 O(nlogn)**（上界 ≠ 紧界）：自底向上建堆时，n 次 sift-down 的上界是 n×O(logn)，但实际代价按层求和——**大部分节点在底层、下沉高度很小**，Σ(每层节点数 × 该层最大下沉高度) 收敛于 O(n)。\n- 对比：**逐个 insert 建堆才是 O(nlogn)**；这也是堆排序整体复杂度仍为 O(nlogn) 的原因（建堆 O(n) + n 次取堆顶并调整 O(nlogn)）。\n- 另一个复杂度反直觉点：HashMap 平均 O(1)、**最坏 O(n)**（所有 key 冲突到同一桶；JDK 8 起链表超阈值转红黑树，最坏降为 O(logn)，详见[《03-集合与泛型》](#/f/f5)）。\n\n**TopK / 第 K 大：小顶堆 O(n log K)**：遍历 n 个数是 O(n)，每次入堆/出堆 O(logK)，合计 **O(nlogK)**；K 远小于 n 时明显优于整体排序的 O(nlogn)，且只需 O(K) 空间——\"海量数据取 Top K\"的标准解。选**小顶堆**是为了让堆顶正好是当前第 K 大，超出容量就弹掉堆顶。\n\n**二分的两种取整方向必须与收缩方向配套**（死循环高发区）：下取整 `mid = (l + r) / 2` 在区间只剩两个元素时会等于 left，若用 `left = mid` 收缩则 left 永不前进 → **死循环**。两种修法：① 改成 `left = mid + 1`（配 `r = mid`）；② 把 mid 改成上取整 `(l + r + 1) / 2` 再配 `left = mid`。背模板时两者必须成对记（模板 2 见下）。\n\n### 三、专题路线表（顺序学习）⭐\n\n| 顺序 | 专题 | 天数 | 代表题（LC 题号 + 题名） | 核心技巧 |\n| --- | --- | --- | --- | --- |\n| 1 | 数组与双指针 | 3 | LC1 两数之和、LC15 三数之和、LC11 盛最多水的容器、LC283 移动零、LC26 删除有序数组中的重复项、LC121 买卖股票的最佳时机、LC53 最大子数组和、LC42 接雨水 | 排序后左右夹逼；原地双指针；前缀和 |\n| 2 | 链表 | 3 | LC206 反转链表、LC21 合并两个有序链表、LC141 环形链表、LC142 环形链表 II、LC19 删除链表的倒数第 N 个结点、LC160 相交链表、LC234 回文链表、LC25 K 个一组翻转链表 | 虚拟头节点省边界判断；快慢指针找中点/判环 |\n| 3 | 栈与队列 | 2 | LC20 有效的括号、LC155 最小栈、LC232 用栈实现队列、LC739 每日温度、LC84 柱状图中最大的矩形、LC239 滑动窗口最大值 | 单调栈/单调队列：\"找下一个更大/更小\"就想到它 |\n| 4 | 哈希表 | 2 | LC217 存在重复元素、LC49 字母异位词分组、LC383 赎金信、LC128 最长连续序列、LC560 和为 K 的子数组、LC1 两数之和（哈希解法重做） | 空间换时间；前缀和 + 哈希计\"和为 K 的区间\" |\n| 5 | 二叉树与递归 | 4 | LC104 二叉树的最大深度、LC226 翻转二叉树、LC101 对称二叉树、LC110 平衡二叉树、LC236 二叉树的最近公共祖先、LC105 从前序与中序遍历序列构造二叉树、LC98 验证二叉搜索树、LC124 二叉树中的最大路径和 | 递归三要素：终止条件 / 本级处理 / 返回值；分清前中后序位置 |\n| 6 | BFS/DFS | 3 | LC102 二叉树的层序遍历、LC200 岛屿数量、LC695 岛屿的最大面积、LC994 腐烂的橘子、LC207 课程表、LC210 课程表 II | 层序模板固定 size 分层；网格 DFS 标记已访问；拓扑排序数入度 |\n| 7 | 回溯 | 3 | LC46 全排列、LC78 子集、LC77 组合、LC39 组合总和、LC22 括号生成、LC131 分割回文串、LC51 N 皇后 | 决策树：做选择 → 递归 → 撤销；used 数组与剪枝去重 |\n| 8 | 贪心 | 2 | LC55 跳跃游戏、LC45 跳跃游戏 II、LC122 买卖股票的最佳时机 II、LC435 无重叠区间、LC452 用最少数量的箭引爆气球、LC134 加油站 | 先排序找局部最优，再论证推出全局最优 |\n| 9 | 二分查找 | 2 | LC704 二分查找、LC35 搜索插入位置、LC34 在排序数组中查找元素的第一个和最后一个位置、LC33 搜索旋转排序数组、LC153 寻找旋转排序数组中的最小值、LC162 寻找峰值 | 先问单调性，再定区间开闭与收缩方向，边界不猜 |\n| 10 | 动态规划·基础 | 4 | LC70 爬楼梯、LC118 杨辉三角、LC198 打家劫舍、LC213 打家劫舍 II、LC62 不同路径、LC64 最小路径和、LC343 整数拆分 | 先定状态与转移方程，再抠初始化与遍历顺序 |\n| 11 | 动态规划·背包与子序列 | 4 | LC416 分割等和子集（0-1 背包）、LC322 零钱兑换、LC518 零钱兑换 II（完全背包）、LC300 最长递增子序列、LC1143 最长公共子序列、LC72 编辑距离、LC5 最长回文子串 | 背包按\"容量维度\"展开；子序列想\"以 i/j 结尾\"的定义 |\n| 12 | 排序与堆 | 2 | LC912 排序数组、LC215 数组中的第 K 个最大元素、LC347 前 K 个高频元素、LC23 合并 K 个升序链表、LC56 合并区间 | 手写快排/归并应付\"手撕排序\"；Top K 用堆 |\n\n### 四、手撕代码模板 ⭐（背诵级，面试默写）\n\n**模板 1：反转链表（LC206）**\n\n```java\npublic ListNode reverseList(ListNode head) {\n    ListNode prev = null, curr = head;\n    while (curr != null) {\n        ListNode next = curr.next;   // 先存后继\n        curr.next = prev;            // 反转指向\n        prev = curr;                 // 双指针前移\n        curr = next;\n    }\n    return prev;                     // prev 即新头\n}\n```\n\n**模板 2：二分查找（LC704，左闭右闭）**\n\n```java\npublic int search(int[] nums, int target) {\n    int left = 0, right = nums.length - 1;\n    while (left <= right) {                    // 区间合法才继续\n        int mid = left + (right - left) / 2;   // 防溢出写法\n        if (nums[mid] == target) return mid;\n        else if (nums[mid] < target) left = mid + 1;   // 收缩左边界\n        else right = mid - 1;\n    }\n    return -1;\n}\n```\n\n**模板 3：快速排序**\n\n```java\npublic void quickSort(int[] nums, int left, int right) {\n    if (left >= right) return;\n    int pivot = nums[left], i = left, j = right;\n    while (i < j) {\n        while (i < j && nums[j] >= pivot) j--;   // 右侧找小的\n        while (i < j && nums[i] <= pivot) i++;   // 左侧找大的\n        swap(nums, i, j);\n    }\n    swap(nums, left, i);                          // 基准归位\n    quickSort(nums, left, i - 1);\n    quickSort(nums, i + 1, right);\n}\nprivate void swap(int[] a, int i, int j) { int t = a[i]; a[i] = a[j]; a[j] = t; }\n```\n\n**模板 4：归并排序**\n\n```java\npublic int[] mergeSort(int[] nums, int left, int right) {\n    if (left == right) return new int[]{nums[left]};\n    int mid = left + (right - left) / 2;\n    int[] l = mergeSort(nums, left, mid), r = mergeSort(nums, mid + 1, right);\n    int[] res = new int[l.length + r.length];\n    int i = 0, j = 0, k = 0;\n    while (i < l.length && j < r.length) res[k++] = l[i] <= r[j] ? l[i++] : r[j++];\n    while (i < l.length) res[k++] = l[i++];\n    while (j < r.length) res[k++] = r[j++];\n    return res;\n}\n```\n\n**模板 5：BFS 层序遍历（LC102，网格 BFS 同骨架）**\n\n```java\npublic List<List<Integer>> levelOrder(TreeNode root) {\n    List<List<Integer>> res = new ArrayList<>();\n    if (root == null) return res;\n    Queue<TreeNode> queue = new ArrayDeque<>();\n    queue.offer(root);\n    while (!queue.isEmpty()) {\n        int size = queue.size();               // 固定本层节点数，实现\"分层\"\n        List<Integer> level = new ArrayList<>(size);\n        for (int i = 0; i < size; i++) {\n            TreeNode node = queue.poll();\n            level.add(node.val);\n            if (node.left != null) queue.offer(node.left);\n            if (node.right != null) queue.offer(node.right);\n        }\n        res.add(level);\n    }\n    return res;\n}\n```\n\n**模板 6：DFS 全排列（LC46，一切回溯题的骨架）**\n\n```java\npublic List<List<Integer>> permute(int[] nums) {\n    List<List<Integer>> res = new ArrayList<>();\n    dfs(nums, new boolean[nums.length], new ArrayList<>(), res);\n    return res;\n}\nprivate void dfs(int[] nums, boolean[] used, List<Integer> path, List<List<Integer>> res) {\n    if (path.size() == nums.length) {\n        res.add(new ArrayList<>(path));        // 必须拷贝快照\n        return;\n    }\n    for (int i = 0; i < nums.length; i++) {\n        if (used[i]) continue;\n        used[i] = true; path.add(nums[i]);     // 做选择\n        dfs(nums, used, path, res);\n        path.remove(path.size() - 1); used[i] = false;   // 撤销选择\n    }\n}\n```\n\n**模板 7：LRU 缓存（LC146）——先说 LinkedHashMap 思路版**\n\n```java\nclass LRUCache extends LinkedHashMap<Integer, Integer> {\n    private final int capacity;\n    public LRUCache(int capacity) {\n        super(capacity, 0.75f, true);          // 第三个参数 accessOrder=true = 按访问顺序排序（false 则按插入序）\n        this.capacity = capacity;\n    }\n    public int get(int key) { return super.getOrDefault(key, -1); }\n    @Override\n    protected boolean removeEldestEntry(Map.Entry<Integer, Integer> eldest) {\n        return size() > capacity;              // 超容量淘汰最久未访问\n    }\n}\n```\n\n**模板 7（进阶）：手写 HashMap + 双向链表版**\n\n```java\nclass LRUCache {\n    private final int capacity;\n    private final Map<Integer, Node> map = new HashMap<>();\n    private final Node head = new Node(0, 0), tail = new Node(0, 0);  // 哨兵\n\n    public LRUCache(int capacity) {\n        this.capacity = capacity;\n        head.next = tail; tail.prev = head;\n    }\n    public int get(int key) {\n        Node node = map.get(key);\n        if (node == null) return -1;\n        moveToHead(node);                      // 刚访问的提到最前\n        return node.value;\n    }\n    public void put(int key, int value) {\n        Node node = map.get(key);\n        if (node != null) { node.value = value; moveToHead(node); return; }\n        if (map.size() == capacity) {          // 淘汰链表尾部（最久未用）\n            Node last = tail.prev;\n            remove(last); map.remove(last.key);\n        }\n        Node fresh = new Node(key, value);\n        map.put(key, fresh); addToHead(fresh);\n    }\n    private void addToHead(Node n) { n.next = head.next; n.prev = head; head.next.prev = n; head.next = n; }\n    private void remove(Node n) { n.prev.next = n.next; n.next.prev = n.prev; }\n    private void moveToHead(Node n) { remove(n); addToHead(n); }\n    static class Node { int key, value; Node prev, next; Node(int k, int v) { key = k; value = v; } }\n}\n```\n\n### 五、面试场景应对\n\n**五步法（按顺序执行，全程开口讲）**：\n\n1. **澄清题意**：数据规模多大、是否有序/有重复、边界情况（空、单元素、负数），复述题目与面试官确认；\n2. **说思路**：先讲暴力解再讲优化方向，征求面试官同意后再动手，避免闷头写偏；\n3. **报复杂度**：时间/空间复杂度各是多少、为什么，这是面试官判断你是否受过训练的关键；\n4. **动手写**：变量命名规范、保持缩进，边写边讲；卡住就先写伪代码骨架再填实现；\n5. **自测用例**：写完主动跑一遍空输入、单元素、重复值等用例，自己先抓 bug 比被抓强。\n\n**平台注意事项**：\n\n- **白板/纸面**：先写函数骨架再填细节，保持布局整洁，写完站在面试官角度\"通读\"一遍；\n- **牛客 ACM 模式**：要自己处理输入输出，提前练 `Scanner`/`BufferedReader` 读多行数据的标准套路；\n- **共享文档（无编译器）**：靠脑内编译，写完口头逐行过一遍用例，主动说\"这里我检查一下越界\"；\n- **卡壳时**：绝不沉默——大声思考，从 n=1、n=2 的小例子找规律，面试官往往在等你的思考过程而不是答案。\n\n### 🔗 推荐资料\n\n| 资料 | 说明 | 链接 |\n| --- | --- | --- |\n| pdai 数据结构与算法导读 | 算法知识体系与各专题的索引入口 | https://pdai.tech/md/outline/x-outline.html |\n| JavaGuide 后端面试通关计划 | 算法在整体求职准备中的位置与节奏 | https://javaguide.cn/interview-preparation/backend-interview-plan.html |\n","ck":0},{"id":"f35","stage":7,"path":"07-面试篇/04-简历与求职指南.md","title":"04-简历与求职指南","md":"# 04-简历与求职指南\n\n> **阶段**：面试篇 ｜ **定位**：把前几篇学到的能力，翻译成简历语言与面试表现，覆盖求职全程\n\n### 一、求职时间线\n\n**校招（应届生主战场，按倒推准备）**：\n\n| 时间 | 节点 | 关键动作 |\n| --- | --- | --- |\n| 大三/研一上 | 能力建设期 | 过完入门→框架篇，开始算法刷题（见[《03-算法刷题路线》](#/f/f34)） |\n| 3~5 月 | 春招实习投递 | 投暑期实习（头部公司暑期实习转正是进大厂最稳的路径） |\n| 6~8 月 | 暑期实习 | 把项目难点写进简历，实习结束争取转正评价 |\n| 7~9 月 | 提前批 | 大厂提前批免笔试/流程快，用实习经历冲一波，不影响正式批 |\n| 8~10 月 | **秋招正式批（主战场）** | 笔试+三轮技术面+HR 面，同时投 30+ 家分散风险 |\n| 次年 3~4 月 | 春招补录 | 秋招不满意的补机会，岗位少于秋招、节奏更急 |\n\n**社招**：集中在\"金三银四\"与\"金九银十\"，提前 1~2 个月准备——更新简历、把当前项目沉淀出 2~3 个可讲的难点、重刷八股与算法；在职跳槽要预留背调与交接时间。\n\n**投递渠道与节奏**：\n\n- 校招：公司官网/招聘公众号 → 内推（学长学姐、牛客内推帖，提前批大多靠内推）→ 宣讲会现场投递；\n- 社招：内推成功率最高（优先找目标团队的人），其次 BOSS 直聘等平台主动沟通，中高级岗位走猎头；\n- 节奏：秋招 7 月底 8 月初就开投提前批，批次越早 HC 越足；同一公司通常只能投一个岗位，投前想清楚方向；\n- 建一张投递进度表（公司/岗位/状态/下一动作），面试邀约集中在同一周时要主动协调时间。\n\n### 二、Java 后端岗位画像 ⭐\n\nJD（岗位描述）看着五花八门，核心要求就六类，正好对应本指南的各篇：\n\n| JD 通用要求 | 背后在考察什么 | 对应本指南 |\n| --- | --- | --- |\n| Java 基础扎实，熟悉集合、并发、JVM | 一面硬门槛，追问链最深的板块 | 01/02 篇 + [《01-Java高频八股速查》](#/f/f32) |\n| 熟悉 Spring/SpringBoot/MyBatis | 是否有真实工程经验，事务、Bean 细节常挖 | 04-框架篇 |\n| 熟悉 MySQL、索引调优、事务 | 写过真业务的人才答得出慢 SQL 实战 | 03-数据库篇 |\n| 熟悉 Redis/MQ 等中间件 | 缓存三大问题、消息可靠性是必考 | 05-中间件篇 |\n| 了解分布式、高并发场景 | 场景题与项目深度的分水岭 | 06-分布式与高并发篇 |\n| 良好的算法与数据结构基础 | 笔试 + 每轮面试手撕代码 | [《03-算法刷题路线》](#/f/f34) |\n\n加分项：GitHub 有像样的仓库、技术博客、竞赛/证书、参与过开源项目；没有也不必编，把项目讲深同样有竞争力。\n\n### 三、简历结构 ⭐\n\n**一页原则**：应届/两年以内经验必须一页；模块顺序：基本信息 → 教育背景 → 专业技能 → 项目经历 → 其他（加分项）。教育背景在前（校招看学校），项目经历占篇幅 50% 以上。\n\n**专业技能写法 ⭐（最容易踩坑的部分）**：\n\n- 程度词只用\"熟悉/掌握/了解\"三档，**慎用\"精通\"**——写了精通的板块面试官会往死里问；\n- 每一条技能都要能**接住两层追问**，写之前自问：\"这条被问到原理层我能答吗？\"\n- 不要写名词堆砌（\"熟悉 Java、Spring、MySQL、Redis、Kafka...\"一行带过），每条带能力描述。\n\n```text\n反例：精通 Java，精通 Spring 全家桶，精通 MySQL、Redis，精通分布式。\n\n正例：\n- 熟悉 JVM 内存模型与常用 GC 收集器，能使用 jstack/jmap 排查线上 CPU 飙高、OOM 问题；\n- 熟悉线程池原理（7 参数、执行流程、拒绝策略），有异步任务编排与虚拟线程实践经验；\n- 熟悉 MySQL 索引与事务原理，有慢 SQL 定位优化、索引设计的实际经验；\n- 熟悉 Redis 核心数据结构与持久化，能解决缓存穿透/击穿/雪崩与缓存一致性问题；\n- 了解分布式理论（CAP、一致性哈希）与分布式事务方案，熟悉 Seata/RocketMQ 事务消息的使用场景。\n```\n\n**其他加分项写法**：GitHub 放有 README 的完整仓库（不是 fork 堆）、博客列 3~5 篇高阅读量文章、算法写\"LeetCode 刷题 200+（Hot 100 全刷）\"——写了就要经得起现场手撕。\n\n**投递前自查清单（10 条全过再投）**：\n\n- [ ] 一页以内、PDF 格式，文件名为\"姓名-岗位-学校/工作年限\"；\n- [ ] 手机号与邮箱正确，邮箱名正式、头像得体；\n- [ ] 专业技能每一条都通过了\"两层追问\"自测；\n- [ ] 每段项目经历都有量化结果，且数字能说出测试方法；\n- [ ] 时间线无矛盾（实习/项目/在校时间能对上）；\n- [ ] 无错别字，技术名词大小写拼写正确（Java/MySQL/Spring）；\n- [ ] GitHub 与博客链接可访问，仓库有 README；\n- [ ] 技能顺序按目标 JD 调整，匹配度最高的两条放最前；\n- [ ] 导出 PDF 后再检查一遍排版（字体、加粗、分隔线不错乱）；\n- [ ] 找一位已工作的学长/朋友完整看一遍并提意见。\n\n### 四、项目经验怎么写 ⭐⭐\n\n**STAR 法则**：Situation（背景：什么业务、什么规模）→ Task（任务：你负责什么）→ Action（行动：技术方案与取舍）→ Result（结果：**量化数据**）。篇幅上 Action 与 Result 占七成，别花笔墨写\"需求分析、团队协作\"。\n\n**三个可写项目方向（难度递进，衔接本指南动手实践）**：\n\n1. **基础项目：多线程 todo / 图书管理**（练 01/05 篇）：SpringBoot + MyBatis-Plus + MySQL 完整 CRUD、登录鉴权、统一异常与参数校验——证明工程基本功，可写的难点：全局异常设计、参数校验、接口幂等；\n2. **进阶项目：简易商城**（练 03/04 篇）：商品/订单/支付模拟，引入 Redis 缓存商品热点数据、RabbitMQ 异步通知库存与日志——可写的难点：缓存一致性方案、消息可靠性（confirm + 手动 ack + 死信兜底）、消费幂等；\n3. **亮点项目：秒杀系统演进**（练 06 篇，最能拉开差距）：从\"DB 扣库存被压垮\"讲起，演进到 网关限流 → Redis+Lua 预扣 → MQ 异步落库 → DB 条件更新防超卖，压测出量化数据——这是把整个分布式篇串成故事的最好载体。\n\n**难点挖掘清单（每个项目找 2~3 个，按此排查你做过的事）**：\n\n- 性能优化：慢 SQL 加索引/覆盖索引前后对比、接口 RT 从多少降到多少；\n- 缓存一致性：选了 Cache Aside + 删除缓存 + 重试，为什么不更新缓存、不一致窗口多大；\n- 消息可靠性：生产确认 + 持久化 + 手动 ack 三段怎么配，消息丢了怎么办；\n- 幂等：防重复下单/重复支付用什么方案（唯一索引/去重表/状态机），为什么；\n- 限流与熔断：限流阈值怎么定的、压测过吗、被限流的请求怎么处理。\n\n**量化结果模板**（没有线上环境就用 JMeter 压测自己的项目，数据真实可复述）：\n\n- 接口响应：下单接口 RT 由 380ms 降至 60ms（缓存 + 异步化）；\n- 吞吐：单机 QPS 由 300 提升至 2400（压测环境：4C8G，JMeter 500 并发）；\n- 正确性：500 并发抢 100 件库存压测 10 轮，0 超卖；\n\n**写法示例（一段合格的 Action+Result）**：\n\n```text\n商品详情页 QPS 高时 DB 查询打满：引入 Caffeine+Redis 两级缓存，热点商品走本地缓存，\n采用\"先更新 DB 再删缓存 + 消息重试\"保证一致性；压测详情接口 QPS 从 350 提升至 2800，\nP99 由 210ms 降至 18ms，缓存命中率 97%。\n```\n\n**面试官常见追问与应对**：\n\n| 追问 | 应对思路 |\n| --- | --- |\n| \"为什么不用 X 方案？\" | 说出 X 的问题 + 你所选方案的代价，体现权衡而非\"唯一正确答案\" |\n| \"这个 QPS 怎么测出来的？\" | 说清工具（JMeter）、并发数、机器配置、测试数据量，数据要可复现 |\n| \"流量再涨 10 倍怎么办？\" | 按 06 篇演进路径答：先缓存/限流，再 MQ 削峰，最后才分库分表 |\n| \"项目里你负责哪部分？\" | 如实划边界，突出自己负责模块的难点，别把整个项目说成一个人做的 |\n| \"上线后出过什么问题？\" | 提前准备一个真实故障/bug：现象 → 排查过程 → 根因 → 修复与复盘 |\n\n### 五、面试流程与各轮准备 ⭐\n\n| 轮次 | 侧重点 | 准备要点 |\n| --- | --- | --- |\n| 一面（基础+算法） | 八股 + 手撕代码，刷人最多 | 《01-Java高频八股速查》《02-数据库与中间件面试速查》过两轮；算法模板默写级熟练 |\n| 二面（深度+项目） | 项目追问到底层，八股问\"为什么\" | 每个简历上的技术点准备\"原理 + 取舍 + 备选方案\"三层答案 |\n| 三面（设计+软素质） | 场景设计题、职业规划、带人潜力 | 秒杀/短链/抢红包等场景题用框架练熟，准备反问与职业故事 |\n| HR 面（稳定性与匹配） | 离职原因、薪资、抗压 | 话术真诚不抱怨，提前想好期望薪资的依据 |\n\n**场景题应对框架（三面标配）**：\n\n1. **澄清需求**：先问\"日活多少、峰值多大、哪些功能必须\"——很多题目本无标准答案，考察的是你怎么收敛问题；\n2. **估算量级**：QPS、存储量、带宽拍个数量级（如 100 万日活 × 人均 20 次 = 2000 万次/天 ≈ 峰值 5000 QPS）；\n3. **分模块设计**：接入层（网关/负载均衡）→ 服务层（缓存/MQ/微服务拆分）→ 数据层（读写分离/分库分表）；\n4. **权衡取舍**：主动说每个选择的代价（一致性 vs 性能、复杂度 vs 收益），这里最能体现 06 篇的功力。\n\n**笔试准备**：校招笔试通常是 2~4 道编程题（ACM 模式）+ 选择题；按[《03-算法刷题路线》](#/f/f34)的要求练好标准输入输出，在牛客上做 2~3 次两小时整卷模拟，练时间分配（先易后难，部分公司按用例给分）。\n\n**场景题示例（设计一个短链接服务，套用上面的框架）**：\n\n1. 澄清：读多写少？要不要统计点击量？短链会过期吗？\n2. 估算：每年 1 亿条新短链 → 长链截哈希取 62 进制 7 位，或分布式 ID 发号器（呼应[《01-分布式理论基础》](#/f/f29)雪花算法）；\n3. 设计：短码作唯一索引存 MySQL + Redis 缓存热点映射 → 访问 302 跳转（301 省 RT 但 302 便于统计与改指向）；\n4. 取舍：哈希冲突重试/补位；发号器方案无冲突、趋势递增利于分库分表；收尾补防刷与监控。\n\n### 六、避坑清单\n\n- **背题痕迹**：一字不差背答案、答非所问——用自己的话复述，答案不超过 90 秒再等追问；\n- **简历注水**：写了没做过的技术，被追问两层就露馅，比不写更糟；每条经历按\"三层追问\"自检；\n- **不懂装懂**：最忌硬编。安全的说法是\"这块我没实际用过，按我的理解是……如果不对请您指点\"；\n- **只答不问**：全程被动。适当反问（\"这个岗位主要业务方向是什么\"）展示主动性；\n- **情绪化抱怨**：吐槽前公司/前领导是 HR 面一票否决项，把离职原因包装成\"求发展\"；\n- **迟到大意**：线上面试提前 15 分钟测试摄像头与网络，笔试带好身份证件。\n\n**反问环节问什么（说\"没有问题\"会显得没兴趣）**：\n\n- 团队与业务：这个岗位进去负责什么业务/模块？团队规模与梯队？\n- 技术与成长：目前的技术栈与架构演进方向？新人有没有导师制？\n- 考核：试用期考核标准是什么？（薪资福利留到 HR 面谈，技术面别问）\n\n### 七、Offer 选择与谈薪\n\n- **比较维度**：别只看月薪——算\"月薪 × 月数 + 年终概率 + 五险一金缴纳基数 + 补贴\"，再叠加平台成长性、业务前景、加班强度（问清是否有大小周、加班文化与调休）；\n- **应届优先级建议**：平台与业务 > 薪资 > 城市；第一份工作的技术密度和项目复杂度，决定下一跳的高度；\n- **谈薪依据**：手里有其他 offer 才有筹码，话术是\"贵司是我优先选择，但手上还有 offer 在比，希望评估能否调整\"；\n- **红线**：不虚构 offer 金额（背调一问便知）、不轻易毁约已接的 offer（行业圈子小，信誉是长期资产）。\n\n### 八、面试前一周冲刺清单\n\n- 八股：《01-Java高频八股速查》《02-数据库与中间件面试速查》再过一轮，只重刷未打勾与\"心里没底\"的题；\n- 算法：每天 2 道模板题保手感，把 7 个手撕模板各默写一遍；\n- 项目：对镜/录音演练 3 分钟项目介绍，把每个难点的\"追问链\"答到第三层；\n- 场景题：秒杀设计讲 3 遍到不卡壳，再准备 1 个备用场景（短链、抢红包、排行榜）；\n- 杂项：多份 PDF 简历、1 分钟与 3 分钟两版自我介绍、提前 15 分钟测试线上面试设备或规划路线。\n\n### 🔗 推荐资料\n\n| 资料 | 说明 | 链接 |\n| --- | --- | --- |\n| JavaGuide 简历指南 | 简历结构与技能清单的官方建议 | https://javaguide.cn/interview-preparation/resume-guide.html |\n| JavaGuide 项目经验指南 | 项目怎么写、怎么被追问 | https://javaguide.cn/interview-preparation/project-experience-guide.html |\n| JavaGuide 后端面试通关计划 | 从准备到拿 offer 的完整时间线 | https://javaguide.cn/interview-preparation/backend-interview-plan.html |\n| JavaGuide 面试突击版 | 冲刺期快速复习的浓缩知识库 | https://interview.javaguide.cn/home.html |\n| pdai 面试知识体系 | 按专题组织的面试题与答案索引 | https://pdai.tech/md/interview/x-interview.html |\n","ck":10},{"id":"f36","stage":7,"path":"07-面试篇/05-选择填空题库.md","title":"05-选择填空判断题库","md":"# 05-选择填空判断题库\n\n> **阶段**：面试篇 ｜ **题量**：共 448 题（选择 307 + 填空 91 + 判断 50，含 85 道难题）｜ **用法**：在应用「📝 选择填空练习」中在线作答（可按「📖 章节小考」下拉框逐章刷题、🎲 乱序防背题、🔁 只做错题），或直接阅读自测——遮住「答案」行，做完再对照「解析」，答错的知识点回到「详见」对应文件复习。\n\n## 选择题\n\n### 1.（Java基础·易）JDK、JRE、JVM 三者的包含关系是？\n- A. JDK ⊃ JRE ⊃ JVM\n- B. JVM ⊃ JRE ⊃ JDK\n- C. JRE ⊃ JDK ⊃ JVM\n- D. 三者互相独立\n\n答案：A\n解析：JDK = 开发工具 + JRE，JRE = JVM + 核心类库；只需运行程序装 JRE，要开发才装 JDK。详见[《01-环境搭建与基础语法》](#/f/f3)\n\n### 2.（Java基础·中）`StringBuilder sb = new StringBuilder(\"a\");` 调用 `change(sb)`，方法体为 `void change(StringBuilder x){ x.append(\"b\"); x = new StringBuilder(\"c\"); }`，之后 sb 的内容是？\n- A. a\n- B. c\n- C. ab\n- D. bc\n\n答案：C\n解析：Java 只有值传递：append 修改的是同一个对象，而重新赋值只改变了形参的指向，不影响实参。详见[《01-环境搭建与基础语法》](#/f/f3)\n\n### 3.（Java基础·易）`Integer a = 127, b = 127; System.out.println(a == b);` 输出什么？\n- A. false\n- B. 编译错误\n- C. 不确定\n- D. true\n\n答案：D\n解析：IntegerCache 缓存 -128~127，范围内 == 比较的是同一个缓存对象；超出范围（如 128）必须用 equals。详见[《02-面向对象与核心类》](#/f/f4)\n\n### 4.（Java基础·易）以下哪个不属于面向对象三大特性？\n- A. 重载\n- B. 封装\n- C. 继承\n- D. 多态\n\n答案：A\n解析：三大特性是封装、继承、多态；重载是编译期确定同签名不同参数的方法，不属于三大特性。详见[《02-面向对象与核心类》](#/f/f4)\n\n### 5.（Java基础·易）try-with-resources 的主要作用是？\n- A. 自动提交事务\n- B. 自动关闭实现了 AutoCloseable 的资源\n- C. 捕获所有异常\n- D. 提升运行速度\n\n答案：B\n解析：编译器会生成 finally 中的关闭逻辑，避免资源泄漏，优于手写 try-catch-finally。详见[《04-异常-IO-反射-注解》](#/f/f6)\n\n### 6.（Java基础·中）关于 String 不可变，正确的解释是？\n- A. String 是可变的，只是习惯上不改\n- B. 频繁拼接字符串应优先用 String\n- C. String 类被 final 修饰、内部数据私有且不暴露修改方法\n- D. String 是基本数据类型\n\n答案：C\n解析：不可变带来安全性、字符串常量池复用、hashCode 可缓存；频繁拼接用 StringBuilder。详见[《02-面向对象与核心类》](#/f/f4)\n\n### 7.（集合·中）JDK 1.8 中 ArrayList 首次 add 时容量扩到 10，此后每次扩容为原来的？\n- A. 2 倍\n- B. 1.2 倍\n- C. 3 倍\n- D. 1.5 倍\n\n答案：D\n解析：newCapacity = oldCapacity + (oldCapacity >> 1)，即 1.5 倍向下取整。详见[《03-集合与泛型》](#/f/f5)\n\n### 8.（集合·中）HashMap（JDK 1.8）中链表转红黑树的条件是？\n- A. 链表长度 ≥ 8 且数组长度 ≥ 64\n- B. 链表长度 ≥ 8 即可\n- C. 链表长度 ≥ 16\n- D. 元素总数 ≥ 64\n\n答案：A\n解析：数组长度不足 64 时优先扩容而不是树化；红黑树退化回链表的阈值是 6。详见[《03-集合与泛型》](#/f/f5)\n\n### 9.（集合·易）HashSet 判断元素是否重复依赖的方法是？\n- A. 仅 equals\n- B. hashCode 与 equals\n- C. 仅 ==\n- D. compareTo\n\n答案：B\n解析：先用 hashCode 定位桶，再在桶内用 equals 精确比较，两者必须一起重写。详见[《03-集合与泛型》](#/f/f5)\n\n### 10.（集合·易）下列集合中线程安全的是？\n- A. ArrayList\n- B. HashMap\n- C. Vector\n- D. LinkedList\n\n答案：C\n解析：Vector 方法用 synchronized 修饰；现代并发场景更推荐 ConcurrentHashMap 或 CopyOnWriteArrayList。详见[《03-集合与泛型》](#/f/f5)\n\n### 11.（集合·易）用 for-each 遍历 ArrayList 时直接调用 list.remove(o)，通常会？\n- A. 正常删除\n- B. 编译错误\n- C. 静默删除所有元素\n- D. 抛出 ConcurrentModificationException\n\n答案：D\n解析：fail-fast 机制检测到 modCount 被修改即抛异常；正确做法是 Iterator.remove() 或 removeIf。详见[《03-集合与泛型》](#/f/f5)\n\n### 12.（并发·易）直接调用线程对象的 run() 而不是 start()，结果是？\n- A. 在当前线程中作为普通方法执行\n- B. 创建新线程执行\n- C. 抛出异常\n- D. 永久阻塞\n\n答案：A\n解析：只有 start() 会让 JVM 创建新线程并调用 run()；直接调 run() 与普通方法调用无异。详见[《01-多线程与并发编程》](#/f/f9)\n\n### 13.（并发·易）volatile 能保证的是？\n- A. 原子性\n- B. 可见性与有序性\n- C. 原子性与可见性\n- D. 原子性、可见性、有序性都保证\n\n答案：B\n解析：volatile 保证可见性和禁止指令重排，但 i++ 这类复合操作仍需 synchronized 或原子类。详见[《01-多线程与并发编程》](#/f/f9)\n\n### 14.（并发·中）线程池提交任务后的处理顺序是？\n- A. 直接创建线程直到最大线程数\n- B. 核心线程 → 阻塞队列 → 非核心线程 → 拒绝策略\n- C. 先入队列再创建核心线程\n- D. 顺序随机\n\n答案：B\n解析：先占满核心线程，队列满了才扩非核心线程，到 max 后触发拒绝策略——这也是 FixedThreadPool 无界队列堆积 OOM 的根源。详见[《01-多线程与并发编程》](#/f/f9)\n\n### 15.（并发·中）synchronized 锁升级的正确顺序是？\n- A. 重量级锁 → 轻量级锁 → 偏向锁\n- B. 轻量级锁 → 偏向锁 → 重量级锁\n- C. 偏向锁 → 轻量级锁 → 重量级锁\n- D. 不存在锁升级\n\n答案：C\n解析：JVM 按竞争激烈程度逐步升级且不可逆，目的是减少无竞争场景的开销。详见[《01-多线程与并发编程》](#/f/f9)\n\n### 16.（并发·中）ThreadLocal 可能内存泄漏的根本原因是？\n- A. key 是强引用\n- B. value 是弱引用\n- C. 底层是 ArrayList\n- D. key 是弱引用但 value 是强引用，线程长期存活时 value 无法回收\n\n答案：D\n解析：线程池中线程长期存活，ThreadLocalMap 的 value 无法自动回收，用完必须调用 remove()。详见[《01-多线程与并发编程》](#/f/f9)\n\n### 17.（并发·易）以下哪个不是 ThreadPoolExecutor 的拒绝策略？\n- A. FairPolicy\n- B. AbortPolicy\n- C. CallerRunsPolicy\n- D. DiscardPolicy\n\n答案：A\n解析：四种拒绝策略是 AbortPolicy、CallerRunsPolicy、DiscardPolicy、DiscardOldestPolicy。详见[《01-多线程与并发编程》](#/f/f9)\n\n### 18.（JVM·中）以下运行时区域中，规范规定不会抛出 OutOfMemoryError 的是？\n- A. 堆\n- B. 程序计数器\n- C. 虚拟机栈\n- D. 元空间\n\n答案：B\n解析：程序计数器是唯一没有规定任何 OOM 情况的区域；栈是 StackOverflowError，堆和元空间都会 OOM。详见[《02-JVM核心》](#/f/f10)\n\n### 19.（JVM·易）判断对象是否可回收，主流商用虚拟机采用？\n- A. 引用计数法\n- B. 随机回收\n- C. 可达性分析（从 GC Roots 出发）\n- D. 手动释放\n\n答案：C\n解析：可达性分析解决了引用计数法的循环引用问题；GC Roots 包括栈帧局部变量、静态变量、常量、JNI 引用等。详见[《02-JVM核心》](#/f/f10)\n\n### 20.（JVM·中）双亲委派机制的主要作用是？\n- A. 加快类加载速度\n- B. 是节省内存的唯一手段\n- C. 为了支持热更新\n- D. 避免核心类被篡改与类的重复加载\n\n答案：D\n解析：子加载器先委托父加载器，保证 String 等核心类始终由 Bootstrap 加载，安全且唯一。详见[《02-JVM核心》](#/f/f10)\n\n### 21.（JVM·中）关于 G1 收集器，下列说法正确的是？\n- A. 将堆划分为多个 Region，可设定目标停顿时间\n- B. 只能回收新生代\n- C. 基于标记-清除，必然产生大量碎片\n- D. 是 JDK 8 的默认收集器\n\n答案：A\n解析：G1 按 Region 管理、可预测停顿（-XX:MaxGCPauseMillis），整体标记-整理、Region 间复制，JDK 9+ 默认。详见[《02-JVM核心》](#/f/f10)\n\n### 22.（MySQL·易）InnoDB 的默认事务隔离级别是？\n- A. 读未提交\n- B. 可重复读\n- C. 读已提交\n- D. 串行化\n\n答案：B\n解析：RR 通过 MVCC + 临键锁在很大程度上避免幻读；互联网公司常改用 RC 以减少锁冲突。详见[《索引-事务-锁与调优》](#/f/f14)\n\n### 23.（MySQL·中）假设 name 列有索引，下列条件能走索引的是？\n- A. name LIKE '%三'\n- B. LEFT(name,1) = '张'\n- C. name LIKE '张%'\n- D. name + 1 = '张三'\n\n答案：C\n解析：左模糊、对索引列使用函数或运算都会导致索引失效，只有右前缀模糊可以走索引。详见[《索引-事务-锁与调优》](#/f/f14)\n\n### 24.（MySQL·易）事务 ACID 中的 I 指的是？\n- A. 原子性\n- B. 一致性\n- C. 持久性\n- D. 隔离性\n\n答案：D\n解析：Atomicity 原子性、Consistency 一致性、Isolation 隔离性、Durability 持久性。详见[《索引-事务-锁与调优》](#/f/f14)\n\n### 25.（MySQL·中）binlog（二进制日志）的主要用途是？\n- A. 主从复制与时间点恢复\n- B. 崩溃后恢复未完成的事务\n- C. 保证事务原子性\n- D. 记录慢查询\n\n答案：A\n解析：崩溃恢复靠 redo log；binlog 是 Server 层日志，用于主从复制和数据归档恢复。详见[《索引-事务-锁与调优》](#/f/f14)\n\n### 26.（MySQL·易）InnoDB 聚簇索引的叶子节点存放的是？\n- A. 主键值\n- B. 整行数据\n- C. 索引列 + 主键\n- D. 数据页地址\n\n答案：B\n解析：聚簇索引即主键索引，叶子存整行；二级索引叶子存\"索引列+主键\"，查非覆盖列需回表。详见[《索引-事务-锁与调优》](#/f/f14)\n\n### 27.（MySQL·易）varchar(50) 在 utf8mb4 字符集下的含义是？\n- A. 最多 50 字节\n- B. 固定占 50 字节\n- C. 最多 50 个字符\n- D. 最多存 50 个汉字\n\n答案：C\n解析：varchar 按字符计长度，实际占用字节数取决于字符集与内容。详见[《MySQL基础与SQL实战》](#/f/f13)\n\n### 28.（Redis·中）Redis 6.0 引入多线程的目的是？\n- A. 让命令执行并行化\n- B. 彻底替换单线程模型\n- C. 为了实现分布式锁\n- D. 处理网络 IO 与协议解析，命令执行仍是单线程\n\n答案：D\n解析：Redis 瓶颈常在网络 IO；引入多线程读写网络，命令执行保持单线程避免锁竞争。详见[《01-Redis》](#/f/f21)\n\n### 29.（Redis·易）解决缓存穿透的常用手段是？\n- A. 缓存空值与布隆过滤器\n- B. 过期时间加随机值\n- C. 互斥锁重建缓存\n- D. 多级缓存\n\n答案：A\n解析：穿透是查询根本不存在的数据；B 针对 AOF 雪崩、C 针对击穿、D 用于高并发兜底。详见[《01-Redis》](#/f/f21)\n\n### 30.（Redis·中）关于 RDB 持久化，正确的是？\n- A. 每条写命令都实时落盘\n- B. 某一时刻的内存快照，恢复快但可能丢失最后一次快照后的数据\n- C. 生成可读的文本命令日志\n- D. 不能与 AOF 同时开启\n\n答案：B\n解析：AOF 才是命令日志；RDB 二进制紧凑恢复快，Redis 4.0+ 支持 RDB+AOF 混合持久化。详见[《01-Redis》](#/f/f21)\n\n### 31.（Redis·易）大量 key 同一时刻过期导致数据库瞬间被压垮，这属于？\n- A. 缓存穿透\n- B. 缓存击穿\n- C. 缓存雪崩\n- D. 缓存污染\n\n答案：C\n解析：雪崩=大规模 key 同时失效或 Redis 宕机；过期时间加随机值、多级缓存、集群高可用是常用方案。详见[《01-Redis》](#/f/f21)\n\n### 32.（Redis·易）实现排行榜功能最合适的 Redis 数据结构是？\n- A. String\n- B. Hash\n- C. Set\n- D. ZSet\n\n答案：D\n解析：ZSet 按 score 排序，天然支持 ZINCRBY 加分、ZRANGE/ZREVRANGE 取 TopN。详见[《01-Redis》](#/f/f21)\n\n### 33.（Redis·中）Cache Aside 模式推荐的更新顺序是？\n- A. 先更新数据库，再删除缓存\n- B. 先更新缓存，再更新数据库\n- C. 先删除缓存，再更新数据库，无兜底\n- D. 缓存与数据库同时双写\n\n答案：A\n解析：先更库再删缓存的不一致窗口最小；并发读写场景可配合延迟双删、过期时间兜底。详见[《01-Redis》](#/f/f21)\n\n### 34.（消息队列·易）消息队列解决的核心问题是？\n- A. 数据持久存储\n- B. 异步、解耦、削峰\n- C. 数据计算\n- D. 服务发现\n\n答案：B\n解析：典型场景：异步通知（注册发短信）、系统解耦（订单与库存）、流量削峰（秒杀）。详见[《02-RabbitMQ》](#/f/f22)\n\n### 35.（消息队列·中）关于 Kafka 的消息顺序，正确的是？\n- A. Topic 内天然全局有序\n- B. 消费者越多越有序\n- C. 单分区内有序，按 key 路由可保证同类消息有序\n- D. 顺序与分区无关\n\n答案：C\n解析：顺序只保证在分区内；需要顺序的消息按业务 key 路由到同一分区，且该分区在消费组内只由一个消费者处理。详见[《03-Kafka》](#/f/f23)\n\n### 36.（消息队列·中）以下哪项不是 Kafka 高吞吐的原因？\n- A. 顺序写磁盘\n- B. 零拷贝（sendfile）\n- C. 批量发送与压缩\n- D. 每条消息立即 fsync 刷盘\n\n答案：D\n解析：Kafka 依赖页缓存批量刷盘，逐条 fsync 反而严重拖慢写入。详见[《03-Kafka》](#/f/f23)\n\n### 37.（消息队列·中）RocketMQ 事务消息的正确流程是？\n- A. 发送半消息 → 执行本地事务 → 提交/回滚，配合事务回查兜底\n- B. 先投递消息再执行本地事务，失败无法处理\n- C. 由消费者代替生产者执行本地事务\n- D. 依赖数据库两阶段提交\n\n答案：A\n解析：半消息对消费者不可见；生产者宕机时 Broker 通过回查确认本地事务状态，实现最终一致。详见[《04-RocketMQ》](#/f/f24)\n\n### 38.（消息队列·易）防止重复消费污染数据的通用思路是？\n- A. 要求 MQ 绝对不重复\n- B. 消费端幂等：唯一业务 ID + 去重表/状态机\n- C. 把消费模式改为只消费一次\n- D. 无需处理\n\n答案：B\n解析：至少一次投递下重复不可避免，幂等是标准答案：数据库唯一键、Redis setnx 去重等。详见[《02-RabbitMQ》](#/f/f22)\n\n### 39.（框架·中）同类中方法 A 直接调用带 @Transactional 的方法 B，事务失效的原因是？\n- A. 事务传播行为冲突\n- B. 方法 B 不是 public\n- C. 自调用走的是原始对象而非代理对象\n- D. 数据库不支持事务\n\n答案：C\n解析：Spring 事务基于 AOP 代理，自调用绕过了代理对象；可拆分类、注入自身代理或用 AopContext 解决。注意 C 也可能失效，但\"自调用\"是本题场景主因。详见[《Spring核心》](#/f/f15)\n\n### 40.（框架·易）Spring Bean 的默认作用域是？\n- A. prototype\n- B. request\n- C. session\n- D. singleton\n\n答案：D\n解析：默认单例；有状态Bean可用 @Scope(\"prototype\")。详见[《Spring核心》](#/f/f15)\n\n### 41.（框架·易）Spring AOP 底层实现采用的是？\n- A. 动态代理（JDK 动态代理或 CGLIB）\n- B. 反射工具类\n- C. 手写字节码注入\n- D. 操作系统信号量\n\n答案：A\n解析：目标类有接口时默认 JDK 动态代理，无接口时用 CGLIB 子类代理。详见[《Spring核心》](#/f/f15)\n\n### 42.（框架·中）SpringBoot 自动配置的加载逻辑是？\n- A. 扫描并加载所有第三方类\n- B. 读取 AutoConfiguration.imports 列出的自动配置类，再按 @ConditionalOnXxx 条件筛选生效\n- C. 用户必须手动注册所有 Bean\n- D. 启动时随机加载部分配置\n\n答案：B\n解析：@EnableAutoConfiguration 聚合加载配置清单，条件注解（如类路径、已有 Bean）决定是否生效。详见[《SpringBoot实战》](#/f/f16)\n\n### 43.（框架·易）MyBatis 中 #{} 与 ${} 的区别，正确的是？\n- A. 二者完全等价\n- B. ${} 更安全\n- C. #{} 是预编译占位符可防 SQL 注入，${} 是字符串拼接有注入风险\n- D. #{} 不能用在任何地方\n\n答案：C\n解析：动态表名、ORDER BY 列名等无法参数化的位置才用 ${}，且必须白名单校验。详见[《MyBatis》](#/f/f17)\n\n### 44.（框架·易）MyBatis 一级缓存的作用范围是？\n- A. 单个 Mapper 接口\n- B. 应用全局\n- C. 单个线程\n- D. SqlSession\n\n答案：D\n解析：同一 SqlSession 内相同查询命中一级缓存（默认开启）；二级缓存跨会话，分布式下易脏读应慎用。详见[《MyBatis》](#/f/f17)\n\n### 45.（框架·难）Spring 三级缓存能解决的循环依赖是？\n- A. singleton 作用域 + setter/字段注入的循环依赖\n- B. 所有循环依赖\n- C. 构造器注入的循环依赖\n- D. prototype 作用域的循环依赖\n\n答案：A\n解析：三级缓存靠\"提前暴露早期引用\"；构造器注入在实例化阶段就需要依赖，prototype 每次新建，都无法用三级缓存解决。详见[《Spring核心》](#/f/f15)\n\n### 46.（分布式与高并发·中）关于 CAP 理论，实践中更准确的理解是？\n- A. 三个特性可以同时任选\n- B. 分区不可避免，实际是在 CP 与 AP 之间取舍\n- C. 应该追求 CA 而放弃 P\n- D. P 可以通过配置关闭\n\n答案：B\n解析：网络分区必然发生，P 是必选项；无分区时才能同时兼顾 C 与 A，如 ZK 偏 CP、Eureka 偏 AP。详见[《01-分布式理论基础》](#/f/f29)\n\n### 47.（分布式与高并发·中）雪花算法的结构中不包含以下哪部分？\n- A. 符号位\n- B. 时间戳\n- C. 随机数\n- D. 机器 ID\n\n答案：C\n解析：标准结构是 1 位符号 + 41 位时间戳 + 10 位机器 ID + 12 位序列号；时钟回拨会产生重复 ID，需要兜底策略。详见[《01-分布式理论基础》](#/f/f29)\n\n### 48.（分布式与高并发·中）与漏桶算法相比，令牌桶的特点是？\n- A. 恒定速率处理请求\n- B. 不能用于限流\n- C. 只能单机使用\n- D. 允许一定程度的突发流量\n\n答案：D\n解析：令牌桶积攒令牌允许突发消费；漏桶恒定速率流出，平滑但无突发能力。详见[《02-高并发系统设计》](#/f/f30)\n\n### 49.（Java8·易）以下哪一项不是 Java 8 引入的新特性？\n- A. sealed 密封类\n- B. Lambda 表达式与函数式接口\n- C. Stream API\n- D. Optional\n\n答案：A\n解析：sealed 是 Java 17 的特性；Java 8 的代表性新特性是 Lambda、函数式接口、Stream、Optional、接口默认方法与新日期 API。详见[《05-Lambda-Stream与Java8新特性》](#/f/f7)\n\n### 50.（Java8·中）关于 Stream 的 map 与 flatMap，正确的是？\n- A. 二者完全等价\n- B. map 将每个元素映射为另一个元素，flatMap 将每个元素映射为流后再拼接扁平化\n- C. flatMap 只能用于数值流\n- D. map 会自动去重\n\n答案：B\n解析：flatMap 常用于「一对多展开」，例如把句子流拆成单词流。详见[《05-Lambda-Stream与Java8新特性》](#/f/f7)\n\n### 51.（Java8·易）Optional 的设计目的是？\n- A. 彻底取代所有 null 判断\n- B. 提升程序运行性能\n- C. 显式表达\"可能为空\"，用链式 API 减少 NPE\n- D. 替代异常处理\n\n答案：C\n解析：主要用于方法返回值；不建议用作字段与入参，也不建议直接 get()。详见[《05-Lambda-Stream与Java8新特性》](#/f/f7)\n\n### 52.（网络·易）TCP 建立连接需要进行几次握手？\n- A. 2 次\n- B. 4 次\n- C. 1 次\n- D. 3 次\n\n答案：D\n解析：三次握手确认双方收发能力；两次无法确认\"客户端能收到\"，四次则冗余。详见[《03-IO模型与网络编程》](#/f/f11)\n\n### 53.（网络·中）NIO 的核心三组件是？\n- A. Channel、Buffer、Selector\n- B. Stream、Reader、Writer\n- C. Socket、ServerSocket、URL\n- D. Thread、Runnable、Future\n\n答案：A\n解析：一个 Selector 可监听多个 Channel 的事件，单线程管理大量连接，即 IO 多路复用。详见[《03-IO模型与网络编程》](#/f/f11)\n\n### 54.（网络·中）以下哪项不是 Netty 高性能的原因？\n- A. 主从 Reactor 线程模型\n- B. 每个连接独占一个线程\n- C. 零拷贝与池化 Buffer\n- D. eventLoop 串行无锁化设计\n\n答案：B\n解析：「每连接一线程」正是 BIO 的模型，连接多时线程爆炸；Netty 用少量 eventLoop 线程服务大量连接。详见[《03-IO模型与网络编程》](#/f/f11)\n\n### 55.（网络·易）与 TCP 相比，UDP 的特点是？\n- A. 面向连接、可靠传输\n- B. 必须先握手才能发数据\n- C. 无连接、不保证可靠但开销小、延迟低\n- D. 自带拥塞控制\n\n答案：C\n解析：适合音视频、DNS、游戏等实时性优先、可容忍少量丢包的场景。详见[《03-IO模型与网络编程》](#/f/f11)\n\n### 56.（框架·中）微服务架构中，注册中心的作用是？\n- A. 存储业务数据\n- B. 代替数据库做缓存\n- C. 部署应用\n- D. 服务提供者注册地址，消费者动态发现可用实例\n\n答案：D\n解析：配合心跳做健康检查，实例上下线自动感知，调用方从注册中心拉取可用地址列表。详见[《SpringCloud微服务》](#/f/f18)\n\n### 57.（框架·易）OpenFeign 实现声明式 HTTP 调用的底层原理是？\n- A. 为接口生成动态代理，把方法调用翻译成 HTTP 请求\n- B. 反射调用 Controller\n- C. 需要手写 OkHttp 代码\n- D. 依赖数据库存储过程\n\n答案：A\n解析：@FeignClient 接口在启动时生成代理对象，结合负载均衡选择实例发起请求。详见[《SpringCloud微服务》](#/f/f18)\n\n### 58.（框架·中）下游服务大量超时，调用方暂时切断对它的请求并直接走兜底逻辑，这属于？\n- A. 限流\n- B. 熔断\n- C. 负载均衡\n- D. 灰度发布\n\n答案：B\n解析：熔断像电闸：错误率或慢调用超阈值后跳闸快速失败，防止雪崩，之后半开状态试探恢复。详见[《SpringCloud微服务》](#/f/f18)\n\n### 59.（Elasticsearch·易）Elasticsearch 实现全文检索的核心数据结构是？\n- A. B+ 树\n- B. 哈希表\n- C. 倒排索引\n- D. 跳表\n\n答案：C\n解析：文本分词后建立「词项 → 文档列表」的映射，查询时先查词再取文档，天然适合全文搜索。详见[《05-Elasticsearch》](#/f/f25)\n\n### 60.（Elasticsearch·中）关于 keyword 与 text 类型，正确的是？\n- A. 二者都会分词\n- B. keyword 会分词，text 不分词\n- C. 都不能用于聚合\n- D. text 会分词用于全文检索，keyword 不分词、适合精确匹配与排序聚合\n\n答案：D\n解析：状态码、手机号等用 keyword 精确匹配；商品描述等长文本用 text。详见[《05-Elasticsearch》](#/f/f25)\n\n### 61.（Nginx·易）以下哪项不是 Nginx 的典型用途？\n- A. 消息存储转发\n- B. 反向代理\n- C. 负载均衡\n- D. 静态资源服务\n\n答案：A\n解析：消息存储转发是消息队列的职责；Nginx 基于 epoll，擅长高并发连接接入与转发。详见[《07-Nginx》](#/f/f27)\n\n### 62.（Nginx·中）upstream 中配置 ip_hash 的作用是？\n- A. 随机分发请求\n- B. 同一客户端 IP 固定转发到同一后端节点\n- C. 按权重分发\n- D. 执行健康检查\n\n答案：B\n解析：实现会话保持（不依赖 Cookie）；缺点是后端扩缩容时分布会变化。详见[《07-Nginx》](#/f/f27)\n\n### 63.（MongoDB·易）MongoDB 的数据模型是？\n- A. 二维关系表\n- B. 图结构\n- C. 文档（BSON）\n- D. 纯键值对\n\n答案：C\n解析：文档模型 schema 灵活、嵌套结构免多表关联；概念对应：库-集合-文档 ≈ 库-表-行。详见[《08-MongoDB》](#/f/f28)\n\n### 64.（MongoDB·中）以下哪种场景最适合 MongoDB？\n- A. 银行核心账务（强事务）\n- B. 复杂的多表 JOIN 报表\n- C. 计费扣款\n- D. 商品详情这类字段灵活、结构多变的内容管理\n\n答案：D\n解析：MongoDB 的弱项正是强事务与复杂关联；内容管理、日志埋点、爬虫数据是它的强项。详见[《08-MongoDB》](#/f/f28)\n\n### 65.（Java基础·中）`Integer x = 128, y = 128;` 执行 `System.out.println(x == y);` 输出什么？\n- A. false\n- B. true\n- C. 编译错误\n- D. 抛出 NullPointerException\n\n答案：A\n解析：IntegerCache 只缓存 -128~127，128 会各自新建对象，== 比地址为 false；比较值必须用 equals。详见[《02-面向对象与核心类》](#/f/f4)\n\n### 66.（Java基础·中）`final StringBuilder sb = new StringBuilder(\"a\"); sb.append(\"b\"); sb = new StringBuilder(\"c\");` 的结果是？\n- A. 正常运行，sb 内容为 abc\n- B. 编译错误：不能对 final 变量重新赋值\n- C. 正常运行，sb 内容为 c\n- D. 运行时抛出 IllegalStateException\n\n答案：B\n解析：final 只禁止引用再次指向别处，指向的对象内容仍可修改；append 合法，第二次赋值非法。详见[《02-面向对象与核心类》](#/f/f4)\n\n### 67.（Java基础·中）方法体为 `try { return 1; } finally { return 2; }`，调用方拿到的返回值是？\n- A. 1\n- B. 编译错误：finally 中不允许 return\n- C. 2\n- D. 抛出异常\n\n答案：C\n解析：finally 在 return 之前执行，其中的 return 会覆盖 try 的返回值并吞掉异常；这是典型的坑，实际编码禁止在 finally 写 return。详见[《04-异常-IO-反射-注解》](#/f/f6)\n\n### 68.（集合·中）某类只重写了 equals 没有重写 hashCode，用它作 HashMap 的 key，`put(k,v)` 后用另一个字段相等的新对象 `get(k2)`，通常得到？\n- A. v\n- B. 编译错误\n- C. 抛出 ClassCastException\n- D. null\n\n答案：D\n解析：HashMap 先用 hashCode 定位桶，未重写 hashCode 时两个对象哈希不同、落到不同桶，equals 根本没机会被调用。详见[《03-集合与泛型》](#/f/f5)\n\n### 69.（集合·中）`List<Integer> list = Arrays.asList(1, 2,3);` 之后执行 `list.set(0, 9)` 和 `list.add(4)`，结果是？\n- A. set 成功，add 抛出 UnsupportedOperationException\n- B. set 和 add 都成功\n- C. set 抛异常，add 成功\n- D. 两者都编译错误\n\n答案：A\n解析：Arrays.asList 返回的是固定大小的视图（底层是数组），支持改元素 set，不支持改变长度的 add/remove。详见[《03-集合与泛型》](#/f/f5)\n\n### 70.（并发·中）线程池 corePoolSize=1、maximumPoolSize=2、队列容量=1，连续提交 4 个耗时任务，会观察到？\n- A. 1 个线程执行，其余排队\n- B. 2 个线程执行，1 个在队列中，第 4 个触发拒绝策略\n- C. 4 个线程并行执行\n- D. 4 个任务全部被拒绝\n\n答案：B\n解析：任务 1 建核心线程，任务 2 入队，任务 3 因队列已满才建非核心线程，任务 4 已达 max 走拒绝策略——队列先于非核心线程。详见[《01-多线程与并发编程》](#/f/f9)\n\n### 71.（并发·中）多个线程共用同一个 SimpleDateFormat 实例做 parse/format，最典型的现象是？\n- A. 完全正常，只是慢一点\n- B. 编译错误，SimpleDateFormat 不可共享\n- C. 结果错乱或抛出解析异常\n- D. 自动加锁串行执行\n\n答案：C\n解析：SimpleDateFormat 内部持有可变 Calendar，非线程安全；应改用线程安全的 DateTimeFormatter，或每次新建、用 ThreadLocal 持有。详见[《05-Lambda-Stream与Java8新特性》](#/f/f7)\n\n### 72.（Java基础·中）`System.out.println(0.1 + 0.2 == 0.3);` 输出什么？\n- A. true\n- B. 编译错误\n- C. 不确定，取决于 JVM 版本\n- D. false\n\n答案：D\n解析：0.1/0.2 的二进制浮点表示无法精确存储，相加为 0.30000000000000004；金额计算用 BigDecimal 或 long 存分。详见[《01-环境搭建与基础语法》](#/f/f3)\n\n### 73.（并发·难）AQS 中的 state 变量，在独占模式与共享模式下分别表示什么？\n- A. 独占模式下表示资源占用/重入次数，共享模式下表示剩余可用许可数\n- B. 两种模式下都表示持有者的线程编号\n- C. 两种模式下都表示等待队列的长度\n- D. 由开发者随意定义，AQS 内部并不使用它\n\n答案：A\n解析：ReentrantLock 用 state 记重入次数，Semaphore/CountDownLatch 用 state 记许可数/计数，tryAcquire 与 tryAcquireShared 语义由此不同。详见[《01-多线程与并发编程》](#/f/f9)\n\n### 74.（并发·难）ThreadLocal 泄漏链路中，当外部 strong 引用被置 null 后，正确的描述是？\n- A. key 被回收，value 同时被自动回收\n- B. key 被回收变成 null，但 value 仍被 Thread→ThreadLocalMap→Entry 强引用链持有\n- C. key 和 value 都不会被回收，因为 Entry 是强引用\n- D. value 是弱引用，随时可能被 GC 回收\n\n答案：B\n解析：Entry 继承 WeakReference，key 弱、value 强。线程不死则 value 无法回收，get/set 时的惰性清理不可靠，所以用完必须 remove()。详见[《01-多线程与并发编程》](#/f/f9)\n\n### 75.（JVM·难）并发标记出现\"漏标\"（对象明明活着却被回收）需要同时满足两个条件，是？\n- A. 白色对象被两个黑色对象同时引用\n- B. 新生代对象被老年代引用\n- C. 黑色对象新增了指向白色对象的引用，且灰色到该白色对象的路径被删除\n- D. 标记线程与应用线程同时运行\n\n答案：C\n解析：三色标记只破坏一个条件不会漏标；CMS 用增量更新（写屏障记录黑→白新引用）、G1 用 SATB 快照（记录删除前的引用）分别解决。详见[《02-JVM核心》](#/f/f10)\n\n### 76.（JVM·难）双亲委派机制被\"破坏\"的典型场景不包括以下哪项？\n- A. JDBC 通过 SPI 让 DriverManager 反向调用 AppClassLoader 加载 Driver\n- B. Tomcat 各 Webapp 的类加载器优先加载自己的类，实现应用隔离\n- C. 热部署/OSGi 用自定义 ClassLoader 替换旧类实现动态更新\n- D. 用 Class.forName() 显式指定类名加载一个类\n\n答案：D\n解析：Class.forName 仍走调用者所在类加载器并向上委托，没有破坏委派；A 靠线程上下文类加载器，B、C 是打破委派顺序的真实需求。详见[《02-JVM核心》](#/f/f10)\n\n### 77.（MySQL·难）RR 隔离级别下，执行 `UPDATE t SET x=1 WHERE name='a'` 而 name 上没有索引，InnoDB 的加锁行为是？\n- A. 扫描过程中对所有行都加行锁（约等于锁全表），无匹配也不释放已扫描行\n- B. 只对匹配的行加锁\n- C. 只加表级元数据锁，不加行锁\n- D. 直接抛出\"无索引不能更新\"的错误\n\n答案：A\n解析：InnoDB 锁的是\"扫过的记录\"，无索引即全表扫描，于是每行都被加锁；这也解释了为什么 UPDATE/DELETE 条件列必须有索引。详见[《索引-事务-锁与调优》](#/f/f14)\n\n### 78.（MySQL·难）关于 MVCC 的 ReadView 生成时机，正确的是？\n- A. RR 和 RC 都在事务开始时生成\n- B. RR 在事务第一次快照读时生成并整个事务复用；RC 每次快照读都重新生成\n- C. RR 每次 select 都重新生成，所以能读到最新数据\n- D. ReadView 只在加锁读时生成，快照读不需要\n\n答案：B\n解析：这正是\"可重复读\"与\"读已提交\"差异的实现根源：RR 复用一份快照，RC 每次重新取，因而能看到别的事务已提交的更新。详见[《索引-事务-锁与调优》](#/f/f14)\n\n### 79.（分布式与高并发·难）关于 Redlock 算法的主要争议，下列说法最准确的是？\n- A. 它的争议在于只能部署在单机 Redis 上\n- B. 争议在于它必须依赖 ZooKeeper 才能工作\n- C. 在 GC 停顿或时钟漂移下，客户端可能在锁已过期后仍以为持有锁，需要 fencing token 兜底\n- D. 学界已公认它完全不可用\n\n答案：C\n解析：Kleppmann 指出：进程暂停跨越租期后依旧会写，多节点也无法阻止；antirez 则反驳假设过于悲观。实践中单点故障容忍度高的业务多用单实例锁 + 幂等。详见[《01-分布式理论基础》](#/f/f29)\n\n### 80.（并发·难）多个线程竞争同一把锁时，锁升级各阶段的触发条件正确的是？\n- A. 只要有两个线程访问就直接重量级锁\n- B. 轻量级锁竞争失败会退回偏向锁\n- C. 偏向锁和轻量级锁是同时获取的\n- D. 只有一个线程访问时保持偏向，出现第二个线程竞争升级为轻量级，自旋失败/竞争加剧才膨胀为重量级\n\n答案：D\n解析：升级路径单向不可逆，代价依次升高：偏向只需一次 CAS 记录线程 ID，轻量级靠 CAS+自旋，重量级依赖 OS Mutex 挂起线程。详见[《01-多线程与并发编程》](#/f/f9)\n\n### 81.（消息队列·难）Kafka 消费组频繁发生 Rebalance（Rebalance 风暴）的常见诱因是？\n- A. 消费者处理时间超过 max.poll.interval.ms 被判定失效，反复进出组触发全员重分配\n- B. 分区数少于消费者数量\n- C. Broker 端开启了事务\n- D. 生产者 acks 配置为 all\n\n答案：A\n解析：Rebalance 是 stop-the-world 的，期间整组停止消费；调大单次处理量上限、缩小批处理、优化耗时才是正解，分区数不足只会造成空闲。详见[《03-Kafka》](#/f/f23)\n\n### 82.（JVM·难）安全点（Safepoint）的准确含义是？\n- A. 内存不足时触发 Full GC 的时刻\n- B. 线程执行到指定位置后暂停，此时所有线程的栈与引用关系可被精确定位\n- C. 每次对象分配前都要检查的位置\n- D. 只有方法调用才是安全点，循环不是\n\n答案：B\n解析：GC、偏向锁撤销、线程 dump 等操作要求线程在安全点停顿，靠 OopMap 定位引用；长循环需插入轮询指令，否则 safepoint 停顿时间被拉长。详见[《02-JVM核心》](#/f/f10)\n\n### 83.（MySQL·难）以下哪个 SELECT 一定需要回表（假设只有 name 单列索引）？\n- A. SELECT id FROM t WHERE name = 'a'\n- B. SELECT name FROM t WHERE name = 'a'\n- C. SELECT age FROM t WHERE name = 'a'\n- D. SELECT count(*) FROM t WHERE name = 'a'\n\n答案：C\n解析：二级索引叶子只存索引列与主键，age 不在索引中只能拿主键回聚簇索引取整行；A、B、D 需要的列都在索引里，属于覆盖索引。详见[《索引-事务-锁与调优》](#/f/f14)\n\n### 84.（操作系统·中）fork() 之后父子进程初始时的内存状态是？\n- A. 父进程内存被完整复制到子进程的物理内存\n- B. 子进程只共享代码段，数据段全部重新初始化\n- C. 父子进程完全共享内存，互相可见所有修改\n- D. 父子共享同一份物理页，任一方写入时才复制该页（写时复制 COW）\n\n答案：D\n解析：fork 只复制页表，物理页通过引用计数共享，写触发缺页异常再拷贝；这就是 fork 大内存进程仍然很快、但写入会翻倍占用的原因。详见[《03-IO模型与网络编程》](#/f/f11)\n\n### 85.（操作系统·中）以下哪项不是死锁的四个必要条件之一？\n- A. 时间片轮转调度\n- B. 互斥条件\n- C. 请求与保持条件\n- D. 循环等待条件\n\n答案：A\n解析：四个必要条件是互斥、请求与保持、不可剥夺、循环等待；破坏任意一个即可预防死锁，调度算法与死锁无必然关系。详见[《01-多线程与并发编程》](#/f/f9)\n\n### 86.（操作系统·中）用户态切换到内核态的典型时机是？\n- A. 执行任何一条算术指令\n- B. 系统调用、中断或异常\n- C. 方法调用与返回\n- D. 只有进程创建时\n\n答案：B\n解析：系统调用（read/write）、外设中断、缺页等异常会触发特权级切换并保存现场；频繁切换的开销正是 NIO/epoll、零拷贝优化的动机。详见[《03-IO模型与网络编程》](#/f/f11)\n\n### 87.（ZooKeeper·中）用 ZooKeeper 实现分布式锁或公平排队，最合适的节点组合是？\n- A. 持久节点 + 轮询\n- B. 只读节点 + Watch 全量列表\n- C. 临时顺序节点，各客户端监听前一个节点\n- D. 持久顺序节点 + 定时删除\n\n答案：C\n解析：临时节点随会话断开自动消失，解决持锁者宕机的死锁；顺序号保证公平，只监听前一个节点可避免羊群效应。详见[《06-ZooKeeper与Nacos》](#/f/f26)\n\n### 88.（ZooKeeper·中）一个 3 节点的 ZK 集群，最多能容忍几个节点宕机仍对外提供读写？\n- A. 0 个\n- B. 2 个\n- C. 3 个都可以\n- D. 1 个\n\n答案：D\n解析：过半机制要求存活节点数 > n/2：3 台需 2 台在线，故只能挂 1 台；5 台可挂 2 台。部署 4 台的容错能力和 3 台一样，还多花成本。详见[《06-ZooKeeper与Nacos》](#/f/f26)\n\n### 89.（ZooKeeper·中）关于 ZooKeeper 的 Watcher 机制，正确的是？\n- A. Watcher 是一次性的，事件触发后需重新注册\n- B. Watcher 触发后会持续监听该节点的每次变更\n- C. Watcher 能保证事件按写入顺序且不丢失地送达\n- D. 只有持久节点能设置 Watcher\n\n答案：A\n解析：一次性注册意味着两次变更之间的信息可能丢失，因此 ZK 不适合做可靠消息通知；Nacos 的配置推送、MQ 的削峰都用别的方案。详见[《06-ZooKeeper与Nacos》](#/f/f26)\n\n### 90.（框架·中）动态排序需求 `ORDER BY ${orderBy}` 的正确防护做法是？\n- A. 把 orderBy 用 #{} 包住即可防注入\n- B. 在 Java 层用白名单校验列名，非法值直接抛异常或回退默认排序\n- C. 依赖 MyBatis 自带的 SQL 转义函数\n- D. 只允许前端传数字，就不会有注入\n\n答案：B\n解析：ORDER BY 的列名无法用 #{} 参数化（预编译占位符只能替换值），只能字符串拼接，必须服务端白名单枚举；D 错在字段名本身也可被注入。详见[《MyBatis》](#/f/f17)\n\n### 91.（设计模式·中）双重检查锁单例中，实例字段必须加 volatile，原因是？\n- A. volatile 能让 new 操作变成原子操作\n- B. 不加 volatile 会导致编译错误\n- C. 保证可见性，且禁止\"分配内存-初始化-赋值引用\"三步重排序\n- D. 主要是为了提升加锁的性能\n\n答案：C\n解析：没有 volatile 时，其他线程可能拿到引用非 null 但尚未初始化完的半成品对象；volatile 的内存屏障禁止了这一步序颠倒。详见[《07-设计模式》](#/f/f8)\n\n### 92.（工具链·中）要把功能分支合并回主干且保留真实分叉历史，应选？\n- A. git rebase，历史变成一条直线\n- B. git cherry-pick\n- C. git stash\n- D. git merge，产生一个合并提交、保留分支分叉\n\n答案：D\n解析：merge 不改写历史，适合已推送的公共分支；rebase 会重写提交，对多人协作的分支执行会有风险，\"已发布的历史不要 rebase\"是铁律。详见[《04-开发工具链-Git-Maven-Linux》](#/f/f12)\n\n### 93.（工具链·中）一次 merge 已经把错误代码合进了主干并已推送，最稳妥的撤销方式是？\n- A. git revert -m 1 <合并提交>\n- B. git reset --hard HEAD~1 后强推\n- C. git commit --amend\n- D. 删掉分支重新拉\n\n答案：A\n解析：revert 生成一条反向提交、不改写历史，对协作分支安全；-m 1 表示保留主干一侧的父提交。reset+强推会让同事的本地历史错位。详见[《04-开发工具链-Git-Maven-Linux》](#/f/f12)\n\n### 94.（工具链·中）Maven 出现依赖版本冲突时，默认的仲裁规则是？\n- A. 版本号最大的胜出\n- B. 依赖树中路径最近的胜出，路径相同则先声明的胜出\n- C. pom 中最后一个 <dependency> 胜出\n- D. 由传递依赖的作者指定\n\n答案：B\n解析：先\"最短路径优先\"再\"同深度先声明优先\"；定位用 mvn dependency:tree，治理用 <dependencyManagement> 或 exclusions 显式固定版本。详见[《04-开发工具链-Git-Maven-Linux》](#/f/f12)\n\n### 95.（单元测试·中）@MockBean 与 Mockito 的 @Mock 的关键区别是？\n- A. 两者完全等价，只是包名不同\n- B. @Mock 能替换容器里的 Bean，@MockBean 不能\n- C. @MockBean 替换 Spring 容器中的 Bean 且会导致上下文缓存失效重建，@Mock 只是纯对象、需手动注入\n- D. @MockBean 只能用于 Controller 层\n\n答案：C\n解析：@MockBean 需要 SpringBootTest 上下文支持，一个类里多个 @MockBean 会显著拖慢测试；纯单元测试优先用 @Mock + @InjectMocks。详见[《05-单元测试与工程质量》](#/f/f19)\n\n### 96.（单元测试·中）要测试\"Controller → Service → Mapper 整条链路真实装配\"，最合适的注解组合是？\n- A. @WebMvcTest 单独使用\n- B. @DataJpaTest 单独使用\n- C. @ExtendWith(MockitoExtension.class)\n- D. @SpringBootTest + @AutoConfigureMockMvc\n\n答案：D\n解析：@SpringBootTest 启动完整容器做集成测试；@WebMvcTest 只加载 Web 层（Service 需 mock），@DataJpaTest 只测持久层且默认事务回滚。详见[《05-单元测试与工程质量》](#/f/f19)\n\n### 97.（MySQL·难）关于间隙锁（Gap Lock）与插入冲突，下列描述正确的是？\n- A. 两个事务同时对同一间隙加间隙锁不冲突，但其中一个插入该间隙会被另一个阻塞\n- B. 间隙锁之间互斥，第二个事务无法加\n- C. 间隙锁会锁住整张表\n- D. RR 与 RC 都会对范围查询加间隙锁\n\n答案：A\n解析：间隙锁只与\"插入该间隙\"冲突，彼此相容，所以两事务都能锁 (10,20) 区间；一旦一方插入 (10,20) 就被另一方的间隙锁挡住——并发插入死锁的常见来源。RC 下基本不加间隙锁。详见[《索引-事务-锁与调优》](#/f/f14)\n\n### 98.（Java基础·中）`int[] a = {1, 2, 3}; int[] b = a.clone(); b[0] = 99;` 之后 `a[0]` 的值是？\n- A. 99\n- B. 1\n- C. 编译错误\n- D. 0\n\n答案：B\n解析：数组 clone 是浅拷贝，新数组元素独立；若元素是引用类型则复制的是引用，改对象内容仍会互相影响。详见[《07-设计模式》](#/f/f8)\n\n### 99.（Java基础·中）关于接口中的方法，Java 8 之后说法正确的是？\n- A. 接口只能有抽象方法\n- B. default 方法必须被实现类强制覆写\n- C. 接口可以有 default 方法与 static 方法，default 方法可被实现类继承或覆写\n- D. static 方法可以被子接口继承并在实现类中直接调用\n\n答案：C\n解析：Java 8 引入 default/static 方法支持接口演进；default 可不覆写，static 属于接口本身、不被继承，只能通过接口名调用。详见[《02-面向对象与核心类》](#/f/f4)\n\n### 100.（Java基础·中）一个类实现两个接口，两个接口有同名同参的 default 方法，会发生什么？\n- A. 自动选择第一个接口的实现\n- B. 自动选择第二个接口的实现\n- C. 运行时抛异常\n- D. 编译错误，必须在该类中显式覆写并用 `接口名.super.方法()` 指定\n\n答案：D\n解析：菱形冲突编译器无法裁决，强制实现类覆写消歧，这也是 default 方法引入后的典型考点。详见[《02-面向对象与核心类》](#/f/f4)\n\n### 101.（Java基础·中）`new BigDecimal(0.1)` 与 `new BigDecimal(\"0.1\")` 的区别是？\n- A. 前者以 double 的二进制近似值为准，结果不是精确的 0.1；后者按十进制字符串精确表示\n- B. 没有区别，结果相同\n- C. 前者精确、后者有误差\n- D. 前者编译报错\n\n答案：A\n解析：造 BigDecimal 必须用 String 或 valueOf，用 double 会把二进制误差一起带进来，金额计算尤忌。详见[《02-面向对象与核心类》](#/f/f4)\n\n### 102.（Java基础·中）自定义异常继承 RuntimeException 与继承 Exception 的关键差别是？\n- A. 前者是受检异常必须 try 或 throws\n- B. 前者无需显式 catch/throws，后者编译期强制处理\n- C. 后者是运行时异常，编译器不强制处理\n- D. 没有差别，只是命名习惯\n\n答案：B\n解析：Exception 系（非 RuntimeException）是受检异常，编译器强制处理；RuntimeException 系免检，参数校验失败常抛它。详见[《04-异常-IO-反射-注解》](#/f/f6)\n\n### 103.（Java基础·中）关于 try-with-resources，说法正确的是？\n- A. 任何对象都能作为资源\n- B. 必须在 finally 里手动 close，否则不会关闭\n- C. 资源必须实现 AutoCloseable，且 close 会在 try 块结束（含异常）时自动调用\n- D. 多个资源按声明顺序逆序关闭，先声明后关闭\n\n答案：C\n解析：需实现 AutoCloseable（或 Closeable），多个资源按声明逆序关闭（后声明先关）；这也是它优于手写 finally 的地方。详见[《04-异常-IO-反射-注解》](#/f/f6)\n\n### 104.（Java基础·中）`Class.forName(\"com.mysql.jdbc.Driver\")` 与 `ClassLoader.loadClass(...)` 的关键差别是？\n- A. 两者完全等价\n- B. forName 只能加载 JDK 自带的类\n- C. loadClass 会触发静态初始化，forName 不会\n- D. forName 默认会执行类的静态初始化块，loadClass 默认不会\n\n答案：D\n解析：forName 默认 initialize=true 会跑 static 块，这正是 JDBC 驱动注册的经典用法；loadClass 只加载不初始化。详见[《02-JVM核心》](#/f/f10)\n\n### 105.（Java基础·中）序列化时 `serialVersionUID` 不一致会导致什么？\n- A. 反序列化时抛 InvalidClassException\n- B. 序列化时抛异常\n- C. 静默忽略旧字段，正常反序列化\n- D. 编译报错\n\n答案：A\n解析：serialVersionUID 是序列化的版本契约，类结构变了而 UID 不匹配时反序列化会拒绝，显式声明可避免编译器自动生成值随环境变化。详见[《04-异常-IO-反射-注解》](#/f/f6)\n\n### 106.（Java基础·难）静态代码块、实例代码块、构造方法的执行顺序（首次创建对象时）是？\n- A. 构造方法 → 实例块 → 静态块\n- B. 静态块 → 实例块 → 构造方法\n- C. 实例块 → 静态块 → 构造方法\n- D. 三者顺序不确定\n\n答案：B\n解析：静态块随类初始化执行且仅一次，之后每次 new 走实例块再走构造方法，父类先于子类；面试常给继承场景问输出。详见[《02-面向对象与核心类》](#/f/f4)\n\n### 107.（Java基础·难）`String s = \"a\" + \"b\" + \"c\";` 在编译期发生什么？\n- A. 创建三个临时 String 再拼接\n- B. 编译为 StringBuilder 链式调用\n- C. 编译器常量折叠，直接生成 \"abc\" 一个常量\n- D. 运行时用 + 逐个拼接\n\n答案：C\n解析：字面量相加编译器直接折叠为一个常量；只有含变量时才会编译为 StringBuilder，这是「字符串拼接性能」题的关键前提。详见[《02-面向对象与核心类》](#/f/f4)\n\n### 108.（Java基础·难）方法重载的解析（选择哪个重载版本）发生在什么阶段？\n- A. 运行时，根据实际对象类型动态选择\n- B. 编译期和运行时各选一次\n- C. 运行时，根据参数个数动态选择\n- D. 编译期，根据引用变量的静态类型选择\n\n答案：D\n解析：重载是编译期静态分派（看静态类型），重写是运行期动态分派（看实际类型）；重载版本的参数若是父类与子类，选的是编译期那个。详见[《02-面向对象与核心类》](#/f/f4)\n\n### 109.（Java基础·难）以下哪种情况**不会**触发类的初始化？\n- A. 通过数组定义引用类，如 `MyClass[] arr = new MyClass[5]`\n- B. 读取一个类的静态字段（非常量）\n- C. new 一个该类的实例\n- D. 通过反射调用该类的静态方法\n\n答案：A\n解析：数组定义只创建数组对象，不初始化元素类；B/C/D 都会触发初始化。另有两条边界：static final 基本类型常量在编译期内联、同样不触发；通过子类访问父类静态字段，初始化的是父类。详见[《02-JVM核心》](#/f/f10)\n\n### 110.（集合·中）`ArrayList` 与 `LinkedList` 做头部插入 10000 次，性能差异的根本原因是？\n- A. LinkedList 线程安全所以更慢\n- B. ArrayList 头插需要整体移动元素 O(n)，LinkedList 只需改指针 O(1)\n- C. LinkedList 更省内存\n- D. ArrayList 不支持头部插入\n\n答案：B\n解析：ArrayList 底层数组，头插要 System.arraycopy 搬移；LinkedList 双向链表改前后指针即可，但按索引访问却是 O(n)。详见[《03-集合与泛型》](#/f/f5)\n\n### 111.（集合·中）`HashMap` 扩容时（JDK 1.8）对旧桶链表的处理方式是？\n- A. 重新计算每个 key 的 hash 再分配\n- B. 全部重新插入到新表头\n- C. 利用 `hash & oldCap` 判断高位，把链表拆成「原位置」与「原位置+oldCap」两条\n- D. 保持链表不动，只扩大数组\n\n答案：C\n解析：容量为 2 的幂时，元素新位置只可能是原位或原位+oldCap，1.8 借此省去重算 hash 并避免 1.7 头插成环。详见[《03-集合与泛型》](#/f/f5)\n\n### 112.（集合·中）遍历 `HashMap` 时想按插入顺序输出，应该用？\n- A. HashMap\n- B. Hashtable\n- C. TreeMap\n- D. LinkedHashMap\n\n答案：D\n解析：LinkedHashMap 在哈希结构上加了双向链表维护插入顺序（accessOrder=true 时变访问顺序，天然可做 LRU）；TreeMap 按 key 排序。详见[《03-集合与泛型》](#/f/f5)\n\n### 113.（集合·中）`TreeMap` 的 key 必须满足什么条件？\n- A. 必须实现 Comparable 或构造时传入 Comparator\n- B. 必须实现 hashCode\n- C. 必须是 String\n- D. 必须重写 equals 即可\n\n答案：A\n解析：TreeMap 靠比较排序，key 需可比较，否则 put 时抛 ClassCastException；它用比较结果代替 equals 判等。详见[《03-集合与泛型》](#/f/f5)\n\n### 114.（集合·中）关于 `Iterator.remove()` 与 `Collection.remove()`，说法正确的是？\n- A. 两者在遍历中等价\n- B. for-each 遍历时调用集合的 remove 会抛 ConcurrentModificationException（某些集合行为未定义），Iterator.remove 才是安全做法\n- C. Iterator.remove 会抛异常\n- D. 只有 Map 支持 Iterator.remove\n\n答案：B\n解析：for-each 底层是迭代器，直接改集合会破坏 modCount 校验；用迭代器自己的 remove，或 Java 8 的 removeIf。详见[《03-集合与泛型》](#/f/f5)\n\n### 115.（集合·难）`HashMap` 中两个不同对象 hash 值相同但 equals 为 false，会怎样？\n- A. 后者覆盖前者\n- B. 抛异常\n- C. 两者共存于同一桶，通过链表/红黑树区分，查找时先比 hash 再比 equals\n- D. 只保留先插入的\n\n答案：C\n解析：哈希冲突是常态，定位桶后再用 equals 精确区分；这就是「重写 equals 必须重写 hashCode」的另一面——hash 相同不代表相等。详见[《03-集合与泛型》](#/f/f5)\n\n### 116.（集合·难）`ConcurrentHashMap`（JDK 1.8）保证线程安全的核心手段是？\n- A. 全表加一把 synchronized 锁\n- B. 用 Segment 分段锁\n- C. 读操作也全程加锁\n- D. CAS + synchronized 锁单个桶头节点，配合 volatile 保证可见性\n\n答案：D\n解析：1.8 抛弃 Segment，锁粒度细到桶（首节点），空桶用 CAS 插入，扩容支持多线程协助迁移；1.7 才是分段锁。详见[《03-集合与泛型》](#/f/f5)\n\n### 117.（集合·难）以下代码输出的顺序是？`Set<String> s = new LinkedHashSet<>(); s.add(\"b\"); s.add(\"a\"); s.add(\"c\"); s.add(\"a\");`\n- A. b, a, c\n- B. a, b, c\n- C. c, a, b\n- D. b, c, a\n\n答案：A\n解析：LinkedHashSet 保持插入顺序且去重，重复的 \"a\" 不改变原位置也不追加，输出按首次插入序。详见[《03-集合与泛型》](#/f/f5)\n\n### 118.（集合·难）`ArrayList` 的 `subList(1, 3)` 返回的视图，对它的修改会怎样？\n- A. 抛 UnsupportedOperationException\n- B. 直接反映到原列表（它是视图而非副本），原列表结构变化后视图操作可能抛 ConcurrentModificationException\n- C. 生成独立副本，互不影响\n- D. 只能读不能写\n\n答案：B\n解析：subList 是原列表的视图，改视图即改原表；这是踩坑高发区，需要副本时必须 new ArrayList<>(list.subList(...))。详见[《03-集合与泛型》](#/f/f5)\n\n### 119.（Java8·中）`Stream` 中 `map` 与 `flatMap` 的区别是？\n- A. map 可以改变流的大小，flatMap 不能\n- B. 两者完全等价\n- C. map 是一对一转换，flatMap 把每个元素展开成流再合并（一对多/扁平化）\n- D. flatMap 只能处理字符串\n\n答案：C\n解析：map 元素数不变（1→1），flatMap 先 map 再 flat（1→N），典型场景是 List<List<T>> 打平。详见[《05-Lambda-Stream与Java8新特性》](#/f/f7)\n\n### 120.（Java8·中）`Stream` 的 `peek` 方法在什么情况下不会执行？\n- A. 永远会执行\n- B. 并行流中永远不执行\n- C. 只处理基本类型时\n- D. 后面没有终端操作时（惰性求值，中间操作不触发）\n\n答案：D\n解析：中间操作惰性，只有终端操作才会拉动整条流水线；peek 常用于调试，别拿它做副作用业务。详见[《05-Lambda-Stream与Java8新特性》](#/f/f7)\n\n### 121.（Java8·中）关于并行流 `parallelStream()` 的默认线程池，说法正确的是？\n- A. 使用公共 ForkJoinPool.commonPool()，可用 `-Djava.util.concurrent.ForkJoinPool.common.parallelism` 调大小\n- B. 每次调用新建一个线程池\n- C. 使用 Tomcat 线程池\n- D. 使用 newCachedThreadPool\n\n答案：A\n解析：并行流共享 commonPool，默认并行度是 CPU 核数-1；阻塞型任务别用并行流，会拖垮整个公共池。详见[《05-Lambda-Stream与Java8新特性》](#/f/f7)\n\n### 122.（Java8·难）`Collectors.groupingBy` 默认返回的 Map 是什么类型？\n- A. TreeMap\n- B. HashMap，且默认值类型是 List\n- C. LinkedHashMap\n- D. ConcurrentHashMap\n\n答案：B\n解析：默认 HashMap+List；要保序用三参重载传 LinkedHashMap::new，要下游聚合传 counting()/mapping() 等。详见[《05-Lambda-Stream与Java8新特性》](#/f/f7)\n\n### 123.（Java8·难）以下代码输出的结果是？`Optional<String> o = Optional.of(null);`\n- A. 创建成功，o.isEmpty() 为 true\n- B. 编译错误\n- C. 立即抛出 NullPointerException\n- D. 创建成功但 get() 返回 null\n\n答案：C\n解析：of 不接受 null（空值用 ofNullable），这是刻意设计——让空指针尽早暴露而非藏进 Optional；get() 前应先 isPresent 或用 orElse。详见[《05-Lambda-Stream与Java8新特性》](#/f/f7)\n\n### 124.（Java基础·易）Java 中 `switch` 的 case 标签可以使用的类型不包括？\n- A. byte/short/char/int\n- B. 枚举\n- C. String（Java 7+）\n- D. double\n\n答案：D\n解析：switch 支持整型（含包装类）、枚举、String 与 Java 17 的模式匹配，浮点与 long 不行（long 自 Java 14 起在部分场景可用，但 double 始终不支持语法语义是明确考点）。详见[《01-环境搭建与基础语法》](#/f/f3)\n\n### 125.（Java基础·中）`String s = \"hello\"; s.concat(\" world\"); System.out.println(s);` 输出？\n- A. hello\n- B. hello world\n- C. 编译错误\n- D. hello world 但 s 已变\n\n答案：A\n解析：String 不可变，concat 返回新串，返回值未接收则原引用不变；这类「忘了接返回值」是常见低级 bug。详见[《02-面向对象与核心类》](#/f/f4)\n\n### 126.（集合·中）`HashMap` 的初始容量 16 与负载因子 0.75 意味着什么？\n- A. 存满 16 个元素才扩容\n- B. 元素数超过 16×0.75=12 时扩容为两倍\n- C. 永远不扩容\n- D. 初始容量是 12\n\n答案：B\n解析：阈值 = 容量×负载因子，达到阈值触发 resize，容量翻倍；负载因子权衡空间与冲突，0.75 是官方折中值。详见[《03-集合与泛型》](#/f/f5)\n\n### 127.（集合·中）`Collections.unmodifiableList(list)` 与 `List.of(...)` 的区别是？\n- A. 两者都是不可变且都不允许 null\n- B. List.of 可以继续 add\n- C. unmodifiableList 是原列表的只读视图（原列表变了它也跟着变），List.of 是真正不可变且不允许 null\n- D. unmodifiableList 会复制一份数据\n\n答案：C\n解析：只读视图仍被原表牵动，防御性场景要真不可变；List.of 拒绝 null 且结构绝对不变。详见[《03-集合与泛型》](#/f/f5)\n\n### 128.（Java基础·难）泛型擦除后，`List<String>` 与 `List<Integer>` 在运行时的 getClass() 结果是？\n- A. 分别是 Class<List<String>> 与 Class<List<Integer>>\n- B. 一个是 List 一个是 Collection\n- C. 编译错误\n- D. 都是同一个 Class 对象（如 java.util.ArrayList），因为泛型在运行时被擦除\n\n答案：D\n解析：泛型仅存在于编译期（类型检查与自动转换），运行时都是裸类型，这也是不能 `new T[]`、不能对泛型做 instanceof 的原因。详见[《03-集合与泛型》](#/f/f5)\n\n### 129.（Java8·中）`Predicate<T>` 的 `and`/`or`/`negate` 组合，`p.negate().and(p)` 对任意输入的结果是？\n- A. 恒为 false\n- B. 恒为 true\n- C. 等于 p 本身\n- D. 编译错误\n\n答案：A\n解析：negate 取反后与原判定做逻辑与，两个条件互斥，任何输入都不可能同时成立。详见[《05-Lambda-Stream与Java8新特性》](#/f/f7)\n\n### 130.（并发·易）线程 t 的任务体是 `Thread.sleep(5000)`，主线程在 t 启动 300ms 后打印 `t.getState()`，结果是？\n- A. BLOCKED\n- B. WAITING\n- C. TIMED_WAITING\n- D. RUNNABLE\n\n答案：C\n解析：带超时的 sleep 让线程进入 TIMED_WAITING；BLOCKED 专指等待 synchronized 锁，WAITING 是无超时的 wait/park。详见[《01-多线程与并发编程》](#/f/f9)\n\n### 131.（并发·易）两个线程分别用 `new A()` 和 `new A()` 调用同一个 `static synchronized` 方法，结果是？\n- A. 可以并行执行，因为实例对象不同\n- B. 只有同一个实例的调用才互斥\n- C. 抛 IllegalMonitorStateException\n- D. 互斥执行，因为锁的是同一个 Class 对象\n\n答案：D\n解析：静态方法没有 this，同步锁是类对应的 Class 对象，与实例无关；只有实例方法才锁 this。详见[《01-多线程与并发编程》](#/f/f9)\n\n### 132.（并发·易）关于守护线程，下列说法正确的是？\n- A. 所有非守护线程结束后 JVM 就会退出，即使还有守护线程在运行\n- B. setDaemon(true) 可以在 start() 之后调用\n- C. 守护线程的 finally 块一定会被执行\n- D. main 线程默认是守护线程\n\n答案：A\n解析：守护线程不阻止 JVM 退出，被放弃时 finally 不保证执行；setDaemon 必须在 start 前调用，main 是非守护线程。详见[《01-多线程与并发编程》](#/f/f9)\n\n### 133.（并发·易）10 个线程各对同一变量自增 1000 次：用 `int count` 与用 `AtomicInteger`，最终结果分别是？\n- A. 两者都一定是 10000\n- B. int 一定是 10000，AtomicInteger 可能小于 10000\n- C. int 通常小于 10000 且每次运行可能不同，AtomicInteger 一定是 10000\n- D. 两者都可能小于 10000\n\n答案：C\n解析：`count++` 是读-改-写三步，多线程下会丢更新；AtomicInteger 靠 CAS 保证单次自增原子，计数精确。详见[《01-多线程与并发编程》](#/f/f9)\n\n### 134.（并发·易）以下哪种线程池最容易因任务无界堆积而 OOM？\n- A. `new ThreadPoolExecutor(4, 8, 60, TimeUnit.SECONDS, new ArrayBlockingQueue<>(100))`\n- B. `new ThreadPoolExecutor(2, 4, 60, TimeUnit.SECONDS, new ArrayBlockingQueue<>(10))`\n- C. `new ThreadPoolExecutor(4, 8, 60, TimeUnit.SECONDS, new SynchronousQueue<>())`\n- D. `Executors.newFixedThreadPool(4)`\n\n答案：D\n解析：newFixedThreadPool 用无界 LinkedBlockingQueue，队列永不溢出、任务持续堆积直到 OOM，所以规约要求手动 new ThreadPoolExecutor。详见[《01-多线程与并发编程》](#/f/f9)\n\n### 135.（并发·中）线程池 corePoolSize=2、maximumPoolSize=4、workQueue 为 ArrayBlockingQueue(2)、默认拒绝策略，连续提交 8 个一直阻塞不结束的任务，结果是？\n- A. 8 个任务全部进队列排队\n- B. 4 个在执行、2 个在队列、2 个被拒绝抛 RejectedExecutionException\n- C. 2 个在执行、6 个在队列\n- D. 2 个在执行、4 个被拒绝、2 个在队列\n\n答案：B\n解析：先占满 2 个核心线程，再塞满容量 2 的队列，然后扩到 maximum 共 4 个线程，剩余 2 个走 AbortPolicy 抛异常。详见[《01-多线程与并发编程》](#/f/f9)\n\n### 136.（并发·中）关于 ReentrantLock，下列说法错误的是？\n- A. 一个 ReentrantLock 实例只能创建一个 Condition 对象\n- B. 必须手动调用 unlock，通常写在 finally 中\n- C. 构造时传入 true 可以得到公平锁\n- D. lockInterruptibly() 支持在等待锁时响应中断\n\n答案：A\n解析：一个 ReentrantLock 可以 newCondition() 出多个 Condition 做精准唤醒，这正是它相较 wait/notify 的优势。详见[《01-多线程与并发编程》](#/f/f9)\n\n### 137.（并发·中）线程 A 先执行 `x = 1;`（x 为普通 int），紧接着执行 `flag = true;`（flag 为 volatile boolean）；线程 B 在 `while (!flag) {}` 之后打印 x，输出是？\n- A. 一定是 0\n- B. 可能是 0 也可能是 1，取决于 CPU 核数\n- C. 编译不通过，volatile 不能修饰 boolean\n- D. 一定是 1\n\n答案：D\n解析：volatile 写 happens-before 读到该值的读，而 A 中 x=1 又先于 volatile 写，经传递性 x 的修改对 B 必然可见。详见[《01-多线程与并发编程》](#/f/f9)\n\n### 138.（并发·中）`CompletableFuture.supplyAsync(() -> { sb.append(\"1\"); return \"x\"; }).thenApply(s -> { sb.append(\"2\"); return s; }).thenAccept(s -> sb.append(\"3\")).join();` 返回后主线程再执行 `sb.append(\"4\")`，最终 sb 的内容是？\n- A. 1234\n- B. 4123\n- C. 2134\n- D. 无法确定，thenApply 可能与 supplyAsync 并行执行\n\n答案：A\n解析：join 会阻塞到整条链执行完毕，1→2→3 按阶段先后串行完成，主线程随后才追加 4；链式阶段的依赖关系保证不了乱序。详见[《01-多线程与并发编程》](#/f/f9)\n\n### 139.（并发·中）`Semaphore s = new Semaphore(2);` 两个线程已各 acquire 一次且都没 release，此时第三个线程调用 `s.acquire()` 会？\n- A. 立即返回，许可数变为 -1\n- B. 阻塞，直到有线程 release 归还许可\n- C. 抛 IllegalStateException\n- D. 抢占其他线程已持有的许可\n\n答案：B\n解析：许可耗尽后 acquire 会进入 AQS 队列挂起，release 时被唤醒；不想无限等待可改用带超时的 tryAcquire。详见[《01-多线程与并发编程》](#/f/f9)\n\n### 140.（并发·中）CAS 的 ABA 问题指的是什么？常用什么方案解决？\n- A. 两个线程同时 CAS 导致都失败，需要用自旋重试解决\n- B. 值从 A 变成 B 又变回 A，CAS 误以为从未变过；用 AtomicStampedReference 加版本号解决\n- C. CAS 只能操作 int 类型，需要用 AtomicReference 解决\n- D. CAS 失败自旋消耗 CPU，需要改用 synchronized 解决\n\n答案：B\n解析：ABA 的坑在于中间状态被抹平；AtomicStampedReference 用版本戳识别「变过又变回来」。自旋开销是 CAS 的另一个独立问题。详见[《01-多线程与并发编程》](#/f/f9)\n\n### 141.（并发·中）JDK 1.8 的 ConcurrentHashMap 执行 put 时，对空桶与非空桶分别采用？\n- A. 都用 synchronized 锁住对应的 Segment 段\n- B. 空桶用 CAS 插入，非空桶用 synchronized 锁住桶的头节点\n- C. 空桶用 synchronized，非空桶用 CAS\n- D. 全程用 ReentrantLock 锁住整个 table\n\n答案：B\n解析：1.8 抛弃 Segment 分段锁，桶为空时 CAS 无锁写入，发生冲突才 synchronized 锁单个桶头，锁粒度比 1.7 更细。详见[《01-多线程与并发编程》](#/f/f9)\n\n### 142.（并发·中）关于 CopyOnWriteArrayList，下列说法错误的是？\n- A. 每次写操作都复制一份新数组，写开销较大\n- B. 迭代器基于快照，遍历时不会抛 ConcurrentModificationException\n- C. 适合读多写少的场景，如监听器列表\n- D. 迭代过程中能立刻读到其他线程刚写入的新元素\n\n答案：D\n解析：读写分离带来弱一致性，迭代器拿到的是创建时的旧数组快照，看不到之后的写入，这正是它写少读多才划算的原因。详见[《01-多线程与并发编程》](#/f/f9)\n\n### 143.（并发·中）线程池中某任务往 ThreadLocal 里 set 了值却没有 remove，同一线程执行的下一个任务调用 get() 会得到？\n- A. 上一个任务残留的值\n- B. null，因为线程复用时 JVM 会重置 ThreadLocalMap\n- C. 抛 IllegalStateException\n- D. 取决于任务是用 submit 还是 execute 提交\n\n答案：A\n解析：ThreadLocalMap 挂在线程对象上并随线程复用，不会自动清空，这是线程池场景必须在 finally 中 remove 的原因。详见[《01-多线程与并发编程》](#/f/f9)\n\n### 144.（并发·中）预防死锁最常用的手段是？\n- A. 加大线程池的线程数\n- B. 用 volatile 修饰锁对象\n- C. 把多把锁合并成一把大锁并延长持锁时间\n- D. 让所有线程按相同的全局顺序获取锁\n\n答案：D\n解析：死锁四条件中最容易破坏的是「循环等待」，统一加锁顺序即可；tryLock 带超时也是常用兜底。加大线程数只会提高发生概率。详见[《01-多线程与并发编程》](#/f/f9)\n\n### 145.（并发·中）线程池 `shutdownNow()` 的返回值是？\n- A. 队列中尚未开始执行的任务列表\n- B. void，没有返回值\n- C. 已经执行完成的任务数\n- D. 表示线程池是否成功终止的布尔值\n\n答案：A\n解析：shutdownNow 会尝试中断执行中的任务并返回未执行的任务列表以便补偿处理；温和关闭等任务跑完的是 shutdown。详见[《01-多线程与并发编程》](#/f/f9)\n\n### 146.（并发·难）AQS 共享模式中，子类实现的 `tryAcquireShared` 返回值语义是？\n- A. 负值表示获取成功，0 表示失败，正值表示重入次数\n- B. 负值表示获取失败需要排队，0 表示获取成功但后继线程无法再获取，正值表示获取成功且后继也可能成功\n- C. 只需区分是否为 0，其余取值没有意义\n- D. 返回值就是当前 state 的值，仅供调试打印\n\n答案：B\n解析：共享模式下返回值同时承担「告知后继节点能否继续获取」的职责，CountDownLatch 计数归零时返回正数唤醒整条队列。详见[《01-多线程与并发编程》](#/f/f9)\n\n### 147.（并发·难）关于 synchronized 的偏向锁撤销，下列说法正确的是？\n- A. 只要出现第二个线程竞争，就会立即膨胀为重量级锁\n- B. 偏向锁一旦被撤销，该对象就永远无法再被偏向\n- C. 撤销偏向需要在全局安全点进行，批量重偏向与批量撤销正是为降低这笔开销引入的优化\n- D. 偏向锁无法通过 JVM 参数关闭\n\n答案：C\n解析：撤销要先等 STW 安全点，代价高，于是有了批量重偏向/撤销；竞争时先升级为轻量级锁而非直接重量级。详见[《01-多线程与并发编程》](#/f/f9)\n\n### 148.（并发·难）CMS 并发标记阶段使用的增量更新（incremental update）写屏障，记录的是？\n- A. 被删除的旧引用，即所谓原始快照\n- B. 所有新创建出来的对象，防止它们被漏标\n- C. 新插入的引用，并把新增该引用的黑色对象重新变灰，避免存活对象被漏标\n- D. 跨代引用的卡表条目\n\n答案：C\n解析：增量更新破坏「黑色对象新增指向白色对象的引用」这一漏标条件，屏障记录新引用、把该黑对象重新变灰待扫；记录被删除的旧引用则是 G1 的 SATB 思路。详见[《02-JVM核心》](#/f/f10)\n\n### 149.（并发·难）ThreadLocalMap 的 key 已经是弱引用，为什么仍会内存泄漏、还必须手动 remove()？\n- A. 弱引用在 Java 中对 GC 没有实际作用，key 永远不会被回收\n- B. ThreadLocalMap 是定长数组，槽位迟早会被写满\n- C. key 是弱引用但 value 是强引用，key 被回收后 Entry 变成 key=null 而 value 仍被线程强引用，且 get/set 只顺带清理命中的少数槽位\n- D. 弱引用只在 Full GC 时才会被回收，平时等价于强引用\n\n答案：C\n解析：弱引用只解决了 key 的回收，value 仍被长期存活的线程池线程强引用；探测式清理只覆盖命中的槽位，所以必须 remove。详见[《01-多线程与并发编程》](#/f/f9)\n\n### 150.（并发·难）ConcurrentHashMap 用 baseCount + CounterCell[] 而不是单个 AtomicLong 来统计 size，主要目的是？\n- A. 让 size() 的返回值具有强一致性\n- B. 把不同线程的计数分散到不同槽位，减少单点 CAS 自旋与缓存行伪共享带来的冲突\n- C. 支持扩容时的多线程协助迁移\n- D. 让 size() 的时间复杂度降为 O(1)\n\n答案：B\n解析：这与 LongAdder 的分段累加同源，热点计数被打散到多个 Cell 上；size() 仍是遍历求和，只保证弱一致。详见[《01-多线程与并发编程》](#/f/f9)\n\n### 151.（JVM·易）对象头中的 Mark Word 不包含以下哪项信息？\n- A. 对象的实例字段值\n- B. 对象的哈希码\n- C. GC 分代年龄\n- D. 锁状态标志位\n\n答案：A\n解析：Mark Word 存放哈希码、分代年龄、锁标志等运行时数据，实例字段值属于实例数据区。详见[《02-JVM核心》](#/f/f10)\n\n### 152.（网络·易）下列场景中最适合使用 UDP 的是？\n- A. 下载一份必须完整无损的安装包\n- B. 实时视频会议的音视频流传输\n- C. 数据库客户端与数据库服务器之间的通信\n- D. 通过 HTTP 浏览网页\n\n答案：B\n解析：UDP 无连接、开销小、可容忍少量丢包，适合实时音视频；其余场景都要求可靠有序，应当用 TCP。详见[《03-IO模型与网络编程》](#/f/f11)\n\n### 153.（操作系统·易）下列进程间通信方式中，数据无需在用户态与内核态之间反复拷贝、速度最快的是？\n- A. 匿名管道\n- B. 消息队列\n- C. 共享内存\n- D. 信号（signal）\n\n答案：C\n解析：共享内存把同一块物理页映射进两个进程的地址空间，读写不再经过内核拷贝，代价是要自行用信号量同步。详见[《03-IO模型与网络编程》](#/f/f11)\n\n### 154.（JVM·难）同一个 .class 文件被两个不同的类加载器分别加载，下列说法正确的是？\n- A. 得到同一个 Class 对象，两个加载器共享该类的静态变量\n- B. 得到两个 Class 对象，但两者之间可以正常互相赋值\n- C. 得到两个 Class 对象，但 instanceof 判断依然为 true\n- D. 得到两个互不兼容的 Class 对象，互相赋值会抛 ClassCastException\n\n答案：D\n解析：类加载器构成命名空间，同一个 class 被不同加载器加载会得到两个独立 Class，instanceof 为 false，转型直接抛异常。详见[《02-JVM核心》](#/f/f10)\n\n### 155.（网络·中）TCP 主动关闭方在发完最后一个 ACK 后进入 TIME_WAIT 并等待 2MSL，主要目的是？\n- A. 确保这个 ACK 丢失时对端重传的 FIN 能被响应，并让本次连接的旧报文在网络中消亡\n- B. 等待对端把尚未发完的剩余数据发送完毕\n- C. 等待操作系统回收本地端口号资源\n- D. 防止对端重发 SYN 重新建立连接\n\n答案：A\n解析：2MSL 保证最后 ACK 丢失时可重发，同时让迟到报文过期，避免串到之后复用相同四元组的新连接上。详见[《03-IO模型与网络编程》](#/f/f11)\n\n### 156.（操作系统·易）关于僵尸进程，下列说法正确的是？\n- A. 父进程先于子进程退出，子进程被 init 收养，因此称为僵尸进程\n- B. 子进程已退出但父进程尚未调用 wait/waitpid 回收其退出状态，进程表项仍被占用\n- C. 僵尸进程会持续占用 CPU 空转，只能靠 kill -9 清除\n- D. 僵尸进程占用大量物理内存，是内存泄漏的主要来源\n\n答案：B\n解析：退出状态未被父进程回收，进程表项残留；它不占 CPU 与内存，kill -9 也无效，需父进程 wait。A 描述的是孤儿进程。详见[《03-IO模型与网络编程》](#/f/f11)\n\n### 157.（JVM·中）类加载的准备阶段，对 `static int a = 1; static final int B = 2;` 这两个字段的处理是？\n- A. a 与 B 都只赋零值，到初始化阶段才分别变成 1 和 2\n- B. a 直接赋为 1，B 先赋零值，到初始化阶段再赋为 2\n- C. a 赋零值（初始化阶段才变成 1），B 在准备阶段即被赋为 2\n- D. a 与 B 都在准备阶段直接赋为最终值\n\n答案：C\n解析：普通静态变量在准备阶段只赋零值；被 static final 修饰的编译期常量带 ConstantValue 属性，准备阶段就完成赋值。详见[《02-JVM核心》](#/f/f10)\n\n### 158.（网络·中）关于 epoll 的水平触发（LT）与边缘触发（ET），下列说法正确的是？\n- A. LT 只在状态变化时通知一次，ET 则只要还有数据就反复通知\n- B. 两者行为完全一致，只是 ET 的性能更好\n- C. ET 模式只能用于监听套接字，不能用于已建立连接的套接字\n- D. LT 只要缓冲区还有未读完的数据就持续通知，ET 仅在状态变化时通知一次，因此 ET 必须一次读完\n\n答案：D\n解析：LT 反复提醒直到处理干净、编程简单；ET 只报一次状态变化，必须循环读到 EAGAIN，否则剩余数据不再通知。详见[《03-IO模型与网络编程》](#/f/f11)\n\n### 159.（操作系统·中）进程切换的开销明显大于线程切换，主要原因是？\n- A. 进程切换要更换页表、切换虚拟地址空间，导致 TLB 与缓存大面积失效\n- B. 进程切换必须销毁并重建内核栈\n- C. 进程切换会触发一次垃圾回收\n- D. 进程切换一定伴随磁盘 I/O\n\n答案：A\n解析：同进程内的线程共享地址空间，切换只需换栈与寄存器；进程切换还要换页表，TLB 失效后访存代价显著上升。详见[《03-IO模型与网络编程》](#/f/f11)\n\n### 160.（JVM·中）关于 TLAB（Thread Local Allocation Buffer），下列说法正确的是？\n- A. 它位于老年代，专门用于分配大对象\n- B. 它是每个线程在 Eden 中预先划出的一小块私有区域，避免多线程分配对象时争抢同一个指针\n- C. 它位于元空间，用于缓存类元数据\n- D. 它的作用是缓存字符串常量，减少重复创建\n\n答案：B\n解析：TLAB 是 Eden 内线程私有的分配缓冲，分配在本地指针上完成，用完再申请新的，避免指针碰撞的并发竞争。详见[《02-JVM核心》](#/f/f10)\n\n### 161.（网络·易）HTTP 响应的 502 与 504 状态码分别表示？\n- A. 502 请求参数错误，504 未认证\n- B. 502 服务器内部错误，504 资源不存在\n- C. 502 网关收到了上游服务器的无效响应，504 网关等待上游响应超时\n- D. 502 服务不可用，504 重定向次数过多\n\n答案：C\n解析：5xx 属服务端错误：502 Bad Gateway 是上游返回了无效响应，504 是网关等上游超时，两者常见于 Nginx 反代场景。详见[《03-IO模型与网络编程》](#/f/f11)\n\n### 162.（操作系统·中）关于虚拟内存与缺页中断，下列说法正确的是？\n- A. 缺页中断说明程序有 bug，正常程序运行中不应出现\n- B. 虚拟内存让所有进程共享同一份地址空间，便于互相访问数据\n- C. 虚拟内存的总大小不能超过物理内存大小\n- D. 访问的页不在物理内存时触发缺页中断，由内核调入该页后重新执行刚才那条指令\n\n答案：D\n解析：缺页是按需调页的正常机制而非错误，它支撑了内存超售与进程隔离，代价是一次访问可能多花上百微秒。详见[《03-IO模型与网络编程》](#/f/f11)\n\n### 163.（JVM·中）关于类初始化的触发时机，下列说法正确的是？\n- A. 访问被 static final 修饰且编译期可确定值的常量，不会触发该类的初始化\n- B. 通过子类引用父类的静态字段时，子类也会被初始化\n- C. 执行 `new Foo[10]` 定义数组会触发 Foo 类的初始化\n- D. 只要调用了 ClassLoader.loadClass()，类就完成了初始化\n\n答案：A\n解析：编译期常量在准备阶段已进常量池，读取不触发初始化；数组定义、父类静态字段、loadClass 都只到加载与链接阶段。详见[《02-JVM核心》](#/f/f10)\n\n### 164.（网络·难）线上服务执行 `ss -ant` 后显示大量连接停留在 CLOSE_WAIT，下列判断最准确的是？\n- A. 说明本机是主动关闭方，应开启 tcp_tw_reuse 缓解\n- B. 对端已发来 FIN 且本端内核已确认，但应用程序迟迟没调用 close()，通常是连接或流未关闭的代码缺陷\n- C. 说明本机端口即将耗尽，应调大本地端口范围\n- D. 这是网络拥塞造成的，应调大拥塞窗口\n\n答案：B\n解析：CLOSE_WAIT 是\"收到对方 FIN、本端尚未 close\"的等待态，堆积即代码没关连接；主动关闭方的残留态是 TIME_WAIT。详见[《03-IO模型与网络编程》](#/f/f11)\n\n### 165.（操作系统·中）要求所有线程都按资源编号从小到大的顺序申请锁，这一做法破坏了死锁四个必要条件中的？\n- A. 互斥条件\n- B. 请求与保持条件\n- C. 循环等待条件\n- D. 不可剥夺条件\n\n答案：C\n解析：全局统一的加锁顺序使环路无法形成，破坏的是循环等待；一次性申请全部资源破坏的才是请求与保持。详见[《03-IO模型与网络编程》](#/f/f11)\n\n### 166.（JVM·难）G1 的 SATB（原始快照）与 CMS 的增量更新在并发标记中的区别是？\n- A. SATB 记录新建立的引用，增量更新记录被删除的引用\n- B. 两者都只记录新建立的引用，区别仅在于记录所用的数据结构不同\n- C. SATB 用于标记新生代，增量更新用于标记老年代\n- D. SATB 在引用被删除前记录旧引用，增量更新在引用被赋值后记录新引用\n\n答案：D\n解析：SATB 靠写前屏障保留删除前的旧值，维持标记开始时的对象图快照；增量更新靠写后屏障记录新引用，重新标记时再扫描。详见[《02-JVM核心》](#/f/f10)\n\n### 167.（网络·难）Charles、Fiddler 这类抓包工具能解密 HTTPS 流量，其前提是？\n- A. 客户端信任了工具自签发的根证书，工具分别与客户端、服务端建立两条独立的 TLS 连接\n- B. 工具拿到了服务端证书对应的私钥\n- C. 工具与客户端恰好使用了相同的会话密钥\n- D. 只要与客户端处于同一局域网内，即可自动解密\n\n答案：A\n解析：中间人分别与客户端和服务端各建一条 TLS 连接，用自签根证书骗客户端信任；证书校验一旦被绕过，流量即为明文。详见[《03-IO模型与网络编程》](#/f/f11)\n\n### 168.（操作系统·难）某单线程计算任务在单核上耗时 100 秒；改成 4 个无共享数据的线程在 4 核上运行后实测 28 秒（理论 25 秒），多出来的时间最主要来自？\n- A. 线程创建与销毁的系统调用开销\n- B. 线程调度与上下文切换、多核间缓存一致性（缓存行失效、伪共享）带来的额外开销\n- C. 磁盘 I/O 等待\n- D. JVM 的类加载过程\n\n答案：B\n解析：创建销毁是一次性成本，主要损耗在切换与跨核缓存同步；这也解释了多线程加速比为何总达不到线性。详见[《03-IO模型与网络编程》](#/f/f11)\n\n### 169.（JVM·难）关于 Minor GC 前的空间分配担保，下列说法正确的是？\n- A. 只要老年代剩余空间小于新生代对象总大小，就一定先触发一次 Full GC\n- B. 分配担保指把新创建的对象直接分配到老年代\n- C. JDK 6 Update 24 之后，只要老年代最大可用连续空间大于新生代对象总大小或历次晋升平均大小，就允许先尝试 Minor GC，否则才 Full GC\n- D. 分配担保只在 Serial 收集器上生效，G1 已取消该机制\n\n答案：C\n解析：担保是 Minor GC 前的安全检查，防的是晋升对象无处安放；HandlePromotionFailure 参数在该版本之后已不再生效。详见[《02-JVM核心》](#/f/f10)\n\n### 170.（网络·中）压测客户端使用短连接，观测到 TIME_WAIT 数量暴涨并触发本地端口告警，最直接有效的组合措施是？\n- A. 调大 net.ipv4.tcp_max_syn_backlog\n- B. 调大 net.ipv4.tcp_fin_timeout，延长等待时间\n- C. 关闭 net.ipv4.tcp_syncookies\n- D. 开启 net.ipv4.tcp_tw_reuse，并改用连接池复用长连接\n\n答案：D\n解析：TIME_WAIT 落在主动关闭方，短连接使它不断堆积；长连接从源头减少连接数，tcp_tw_reuse 让出站连接可复用 TIME_WAIT 端口。详见[《03-IO模型与网络编程》](#/f/f11)\n\n### 171.（操作系统·难）`top` 中某个 Java 进程的 CPU 占用显示为 380%，最合理的解释是？\n- A. top 以单核为 100% 累加，380% 表示该进程的多个线程同时在约 4 个核上运行\n- B. 数据显示异常，单进程不可能超过 100%\n- C. 该进程陷入了内核态忙等待\n- D. 该进程正在进行频繁的 Full GC\n\n答案：A\n解析：Linux 的进程 CPU 占用是多核累加值，超过 100% 属正常；要进一步定位可 top -Hp 看线程级占用再对照 jstack。详见[《02-JVM核心》](#/f/f10)\n\n### 172.（JVM·难）把 G1 的 `-XX:MaxGCPauseMillis` 从 200 调到 50 后，停顿确实变短，但吞吐量明显下降，最合理的解释是？\n- A. 停顿目标会让 G1 在压力下改用 Serial 收集器兜底\n- B. 停顿目标越小，单次可回收的 Region 越少，GC 次数变多，GC 总开销上升\n- C. 调小该参数会禁用并发标记线程\n- D. 调小该参数会强制每次 Young GC 都回收老年代\n\n答案：B\n解析：G1 依据停顿目标挑选回收的 Region 数量，目标越激进每次回收越少、频率越高；停顿与吞吐本就需要权衡。详见[《02-JVM核心》](#/f/f10)\n\n### 173.（网络·中）TCP 慢启动阶段，拥塞窗口 cwnd 的变化方式是？\n- A. 每个 RTT 增加 1 个报文段，直到发生超时\n- B. 由接收方通告的接收窗口 rwnd 决定，与网络状况无关\n- C. 每个 RTT 翻倍（指数增长），达到慢启动阈值 ssthresh 后转为拥塞避免的线性增长\n- D. 始终保持初始值不变，直到发生丢包才调整\n\n答案：C\n解析：慢启动从 1 个 MSS 起指数扩张，到 ssthresh 转线性；丢包后将 ssthresh 减半，再进入快速重传与快速恢复。详见[《03-IO模型与网络编程》](#/f/f11)\n\n### 174.（JVM·中）`jstat -gcutil <pid> 1000` 显示老年代使用率长期高于 98%、Full GC 次数不断上涨，但每次回收后使用率几乎不下降。最可能的原因是？\n- A. 新生代太小，对象过早晋升到老年代\n- B. SurvivorRatio 设置不合理，Survivor 区过小\n- C. 元空间不足导致频繁触发 Full GC\n- D. 存在内存泄漏，大量对象仍被引用而无法回收\n\n答案：D\n解析：回收后占用不降说明对象依然可达，是典型泄漏特征；应导出堆快照用 MAT 找 Retained Size 最大的对象链。详见[《02-JVM核心》](#/f/f10)\n\n### 175.（JVM·中）用 `-Xmx512m -XX:MaxMetaspaceSize=16m` 启动的程序，循环用 CGLIB 动态生成类并把 Class 对象存入静态集合，最可能先抛出的是？\n- A. java.lang.OutOfMemoryError: Metaspace\n- B. java.lang.OutOfMemoryError: Java heap space\n- C. java.lang.StackOverflowError\n- D. java.lang.OutOfMemoryError: Direct buffer memory\n\n答案：A\n解析：类元数据存放在元空间，静态集合又阻止了 Class 卸载，16m 的元空间上限最先被击穿，报错信息即为 Metaspace。详见[《02-JVM核心》](#/f/f10)\n\n### 176.（MySQL·易）InnoDB 的 B+ 树把完整行数据只放在叶子节点，这样做最直接的好处是？\n- A. 单个数据页能容纳更多键值，树更矮，定位一行所需的磁盘 IO 更少\n- B. 索引不再需要维护键值的排序\n- C. 范围查询不必再走叶子链表，在非叶子层就能扫完整个区间\n- D. 二级索引因此不必再存储主键值\n\n答案：A\n解析：非叶子只存键与页指针，一页可放上千项，三层即可覆盖千万级数据；叶子间的双向链表才是范围查询快的另一原因。详见[《索引-事务-锁与调优》](#/f/f14)\n\n### 177.（MySQL·易）建表时，金额、成绩这类要求精确的小数字段应优先选用哪种类型？\n- A. FLOAT\n- B. DOUBLE\n- C. DECIMAL\n- D. VARCHAR\n\n答案：C\n解析：FLOAT/DOUBLE 是二进制浮点，累加与比较会出现精度丢失；DECIMAL 按十进制精确存储，是金额与成绩的标准选择。详见[《MySQL基础与SQL实战》](#/f/f13)\n\n### 178.（MySQL·易）关于 DATETIME 与 TIMESTAMP，下列说法正确的是？\n- A. 两者都会随服务器时区的变化而改变存储的数值\n- B. TIMESTAMP 占 4 字节、存取时做时区转换，最大只能表示到 2038 年\n- C. DATETIME 占 4 字节，取值范围可到 9999 年\n- D. TIMESTAMP 与时区无关，DATETIME 反而受时区影响\n\n答案：B\n解析：DATETIME 占 8 字节、与时区无关、范围到 9999 年；需要跟随客户端时区变化的全球化场景才考虑 TIMESTAMP。详见[《MySQL基础与SQL实战》](#/f/f13)\n\n### 179.（MySQL·易）关于 COUNT(*)、COUNT(1)、COUNT(name)，说法正确的是？\n- A. 三者完全等价，结果与性能都一样\n- B. COUNT(1) 只统计值为 1 的行，因此语义与 COUNT(*) 不同\n- C. COUNT(*) 会跳过 name 为 NULL 的行，另外两个不会\n- D. InnoDB 下 COUNT(*) 与 COUNT(1) 等价且官方有优化；COUNT(name) 不统计 name 为 NULL 的行\n\n答案：D\n解析：数字 1 只是占位，COUNT(1) 与 COUNT(*) 一样统计所有行；COUNT(列) 的语义才是\"该列非 NULL 的行数\"。COUNT(主键) 也并不更快。详见[《MySQL基础与SQL实战》](#/f/f13)\n\n### 180.（MySQL·易）关于 DROP TABLE、DELETE FROM t、TRUNCATE TABLE，说法正确的是？\n- A. 三者都在事务中可回滚\n- B. TRUNCATE 属 DDL，清空整表并重置自增，不可回滚\n- C. DELETE 不带 WHERE 时会自动重置自增\n- D. DROP 只删数据、保留表结构\n\n答案：B\n解析：DELETE 是 DML，逐行删、可带 WHERE、事务内可回滚、不重置自增；DROP 连表带结构一起删，最彻底。详见[《MySQL基础与SQL实战》](#/f/f13)\n\n### 181.（MySQL·易）库存表 `stock(id BIGINT PRIMARY KEY, num INT NOT NULL)` 中 id=1 的 num 为 1。\"先 SELECT 查出来再判断再 UPDATE\"在并发下会超卖，更稳妥的写法是？\n- A. 把隔离级别升到 SERIALIZABLE 就一定不会超卖\n- B. 先 `SELECT num FROM stock WHERE id = 1;`，应用层判断 num > 0 之后再 `UPDATE stock SET num = 1 WHERE id = 1;`\n- C. 用 `UPDATE stock SET num = num - 1 WHERE id = 1 AND num > 0;`，靠影响行数判断是否扣减成功\n- D. 把 num 声明成 `INT NOT NULL` 并给它加唯一索引\n\n答案：C\n解析：把判断与扣减合并成一条原子语句，由数据库保证原子性；影响行数为 0 即库存不足，回到应用层按失败处理。乐观锁版本号写法同理。详见[《索引-事务-锁与调优》](#/f/f14)\n\n### 182.（MySQL·中）表结构如下，执行 `SELECT name FROM big_user WHERE name = 'user_999999';` 的执行计划最可能是什么？\n- A. type=ref，key=idx_name，Extra 含 Using index\n- B. type=ALL，key=NULL\n- C. type=range，key=PRIMARY，Extra 含 Using filesort\n- D. type=index，key=idx_name，Extra 含 Using temporary\n\n答案：A\n解析：等值条件命中 idx_name，且查询列 name 本身就在索引里，构成覆盖索引；二级索引自带主键，故 Extra 会显示 Using index。详见[《索引-事务-锁与调优》](#/f/f14)\n\n### 183.（MySQL·中）同样是 `SELECT * FROM big_user WHERE name = 'user_999999';`（表与索引同上一题），与上一题的写法相比，代价变大的主要原因是？\n- A. 二者没有实质差异，`*` 只是书写习惯\n- B. `*` 会让 idx_name 直接失效，必然退化成全表扫描\n- C. `*` 会让结果集自动去重，多出一次排序开销\n- D. 需要的列不在 idx_name 中，每行都要回表取整行，代价高于覆盖索引\n\n答案：D\n解析：二级索引只带主键，回表是随机 IO；当命中行数占比过高时，优化器甚至可能直接放弃索引改为全表扫描。详见[《索引-事务-锁与调优》](#/f/f14)\n\n### 184.（MySQL·中）已有联合索引 `idx_city_age_created (city, age, created_at)`，下列哪条 SQL 能把该索引用得最充分？\n- A. `SELECT * FROM t WHERE age = 20 ORDER BY created_at;`\n- B. `SELECT * FROM t WHERE city = '北京' AND created_at > '2026-01-01';`\n- C. `SELECT * FROM t WHERE city = '北京' AND age = 20 ORDER BY created_at;`\n- D. `SELECT * FROM t WHERE city = '北京' ORDER BY created_at;`\n\n答案：C\n解析：C 三列连续命中，且索引顺序天然满足 ORDER BY，不产生 filesort；A 缺最左列，B 与 D 都跳过了 age，created_at 用不上。详见[《索引-事务-锁与调优》](#/f/f14)\n\n### 185.（MySQL·中）查询 `SELECT * FROM t WHERE city = '北京' AND age = 20 ORDER BY created_at;` 已建有 `idx_city_age (city, age)`，explain 的 Extra 出现 Using filesort。最有效的改法是？\n- A. 把 created_at 追加到联合索引末尾，改建成 (city, age, created_at)\n- B. 给 created_at 单独建一个索引\n- C. 把 ORDER BY 改成 ORDER BY id\n- D. 调大 sort_buffer_size 参数\n\n答案：A\n解析：排序列紧跟在等值列之后，索引自身的顺序即满足 ORDER BY，filesort 随之消失；单列索引与本次排序无关。详见[《索引-事务-锁与调优》](#/f/f14)\n\n### 186.（MySQL·中）联合索引 `idx_a_b (a, b)`，SQL 为 `SELECT * FROM t WHERE a > 10 AND b = 5;`，b 列的情况是？\n- A. b 仍能参与索引定位，等同于一次等值匹配\n- B. a 走了范围查询，b 无法再用于定位，只能靠索引下推在回表前过滤\n- C. 整条 SQL 用不上该索引，只能全表扫描\n- D. 优化器会自动把索引顺序改写成 (b, a) 后再使用\n\n答案：B\n解析：最左列遇到范围查询后，其后的列失去定位能力；MySQL 5.6+ 的索引下推能把 b=5 下推到引擎层过滤，减少回表次数。详见[《索引-事务-锁与调优》](#/f/f14)\n\n### 187.（MySQL·中）name 为 VARCHAR(20) 且有索引 idx_name，SQL `SELECT * FROM t WHERE name = 13800000000;` 的执行结果是？\n- A. 走 idx_name，type=ref，性能正常\n- B. 报语法错误，字符串列不能与数字比较\n- C. 走索引，但结果会漏掉部分行\n- D. 不走索引，字符串列与数字比较会触发隐式类型转换，相当于对索引列做了运算\n\n答案：D\n解析：此时 MySQL 会把列值转成数字再比较，索引的有序性被破坏；正确写法是加引号传字符串，让两边类型一致。详见[《索引-事务-锁与调优》](#/f/f14)\n\n### 188.（MySQL·中）表与数据如下，执行后面的 SQL，结果是？\n- A. 2 行：(1, 3, 255.5) 与 (2, 1, 74.0)\n- B. 1 行：(1, 3, 255.5)\n- C. 1 行：(1, 3, 78.0)\n- D. 报错，HAVING 不能引用 SELECT 中定义的别名 cnt\n\n答案：B\n解析：HAVING 执行在 SELECT 之后，可以引用 cnt、total 这类别名；学生 2 只有 1 条记录被滤掉，没有记录的学生也不会出现在结果里。详见[《MySQL基础与SQL实战》](#/f/f13)\n\n### 189.（MySQL·中）两阶段提交中，redo log、binlog 的写入先后顺序是？\n- A. redo log prepare → 写 binlog → redo log commit\n- B. 写 binlog → redo log prepare → redo log commit\n- C. redo log commit → 写 binlog → 写 undo log\n- D. 写 undo log → 写 binlog → redo log prepare\n\n答案：A\n解析：redo 先置 prepare、再写 binlog、最后置 commit；崩溃恢复时用 XID 去 binlog 中比对，据此决定提交还是回滚。详见[《索引-事务-锁与调优》](#/f/f14)\n\n### 190.（MySQL·中）关于插入意向锁（Insert Intention Lock），下列说法正确的是？\n- A. 它是表级锁，插入之前会先锁住整张表\n- B. 它本身就是间隙锁的一种，两个插入意向锁之间也互斥\n- C. 它是插入前设置的意向标记；间隙锁彼此不冲突，但它与范围内已存在的间隙锁冲突\n- D. 它只在 RC 隔离级别下才会产生\n\n答案：C\n解析：多个事务可同时持有同一间隙的间隙锁，一旦有人真要插入，插入意向锁便与这些间隙锁冲突而被阻塞——并发插入死锁的常见来源。详见[《索引-事务-锁与调优》](#/f/f14)\n\n### 191.（MySQL·中）RR 隔离级别下，两个会话按下列顺序执行（v 初值为 0），最终 t 表中 id=1 的 v 值是？\n- A. 1\n- B. 0\n- C. 报死锁错误，事务 A 被整体回滚\n- D. 2\n\n答案：D\n解析：A 的 SELECT 是快照读不阻塞 B；A 随后的 UPDATE 是当前读，会读到 B 已提交的最新值 1，再按自己的语义写为 2。详见[《索引-事务-锁与调优》](#/f/f14)\n\n### 192.（MySQL·中）订单表预计增长到 5 亿行，准备按 user_id 做水平分表。直接带来的后果是？\n- A. 表结构必须改成 MyISAM 才能分片\n- B. 主键不能再自增，必须改成无序 UUID\n- C. 分片键选了 user_id，按 order_id 查询无法直接定位分片，需要额外的路由或映射方案\n- D. 事务隔离级别必须降到 RC\n\n答案：C\n解析：按订单号查落不到确定分片，只能广播查询或再维护一张 order_id 到 user_id 的映射；分片后的全局唯一 ID 通常用雪花算法生成。详见[《02-数据库与中间件面试速查》](#/f/f33)\n\n### 193.（MySQL·难）事务在执行过程中尚未 COMMIT 时 MySQL 崩溃，重启后的处理是？\n- A. 扫描 redo log 中处于 prepare 状态的记录，用其中的 XID 去 binlog 比对：能找到就提交，找不到就回滚\n- B. 一律回滚，因为事务没有走到 commit 阶段\n- C. 一律提交，因为 redo log 已经持久化到磁盘\n- D. 由 undo log 的版本链自行决定，与 binlog 无关\n\n答案：A\n解析：binlog 写成功才是事务提交成功的标志；用 XID 回查 binlog，正是两阶段提交保证两份日志一致、进而保证主从一致的关键。详见[《索引-事务-锁与调优》](#/f/f14)\n\n### 194.（MySQL·难）主库执行 `UPDATE account SET balance = balance - 100 WHERE id = 1;`，redo log 已写入并处于 prepare，写 binlog 之前主库宕机且数据无法恢复。此时从库的情况是？\n- A. 从库的余额已经扣减 100，需要人工补偿\n- B. 从库没有这条变更，余额不变，与回滚后的主库保持一致\n- C. 从库会自动把这条事务补写进自己的 binlog\n- D. 从库进入只读模式，等待主库恢复后重新同步\n\n答案：B\n解析：binlog 没写成功，恢复时该事务回滚；从库只重放 binlog，自然也没有这条变更，两边同为\"未扣款\"。详见[《索引-事务-锁与调优》](#/f/f14)\n\n### 195.（MySQL·难）表 `t(id BIGINT PRIMARY KEY, a INT, b INT)` 上有 `KEY idx_a (a)`，索引中 a 的值依次为 1、5、10、15。会话 A 执行：\n- A. `UPDATE t SET b = 1 WHERE a = 10;`\n- B. `INSERT INTO t (id, a, b) VALUES (99, 8, 1);`\n- C. `SELECT * FROM t WHERE a = 10 FOR UPDATE;`\n- D. `SELECT b FROM t WHERE a = 10;`\n\n答案：D\n解析：非唯一索引等值加锁会覆盖记录 10 及 (5,10]、(10,15] 等区间，A、C 撞上被锁记录，B 插入的 a=8 落在被锁间隙里；D 是快照读走 MVCC，不阻塞。详见[《索引-事务-锁与调优》](#/f/f14)\n\n### 196.（MySQL·难）关于覆盖索引与索引下推（ICP），下列说法正确的是？\n- A. 两者是同一件事的两种叫法\n- B. 覆盖索引指查询列全部落在索引中、无需回表；ICP 是把无法用于定位的索引列过滤下推到引擎层，减少回表次数\n- C. 使用覆盖索引时，explain 的 Extra 显示的是 Using index condition\n- D. ICP 默认关闭，需要手动打开才会生效\n\n答案：B\n解析：覆盖索引对应 Extra 的 Using index，ICP 对应 Using index condition；ICP 自 MySQL 5.6 起默认开启，两者优化的是不同环节。详见[《索引-事务-锁与调优》](#/f/f14)\n\n### 197.（MySQL·难）深分页优化中，延迟关联写法比原始写法快，原理是？\n- A. 它把一条 SQL 拆成两次查询并发执行\n- B. 它把排序工作挪到了应用层完成\n- C. 子查询只扫描较窄的二级索引即可拿到 10 个目标主键，避免为前 90 万行逐行取整行数据\n- D. 它命中了查询缓存，第二次直接从缓存读取\n\n答案：C\n解析：子查询在 idx_created 上完成排序与偏移，最后只对 10 个主键回表；游标分页（WHERE created_at > 上次值）则连偏移扫描都省掉，但只能顺序翻页。详见[《索引-事务-锁与调优》](#/f/f14)\n\n### 198.（Redis·易）Redis 的 Hash 类型在字段数较少、值较小时，采用哪种编码存储？\n- A. 跳表 + 哈希表\n- B. 整数集合（intset）\n- C. 压缩列表（ziplist/listpack）\n- D. 双向链表\n\n答案：C\n解析：小 Hash 用 ziplist/listpack 连续内存紧凑存放，字段数或值长度超过 hash-max-listpack-entries/value 阈值后才转成哈希表。intset 是 Set 在\"元素全是整数且数量少\"时的编码；跳表 + 哈希表是 ZSet 变大后的双结构。详见[《01-Redis》](#/f/f21)\n\n### 199.（Redis·易）下面哪一项最不适合用 Redis 的 List 来实现？\n- A. 按分数实时排名的游戏榜单\n- B. 取最新 10 条评论（LPUSH + LRANGE 截断）\n- C. 秒杀订单的异步落库队列（LPUSH + BRPOP）\n- D. 未读消息列表\n\n答案：A\n解析：List 只能按下标或头尾访问，没有按分数排序的能力，排行榜要交给 ZSet 的 score + ZREVRANGE。B/C/D 都是 List 的典型用法。详见[《01-Redis》](#/f/f21)\n\n### 200.（消息队列·易）RabbitMQ 中一条消息被消费失败且 `basicNack` 时 requeue 设为 false，它最终会去哪里？\n- A. 直接丢弃，没有任何记录\n- B. 自动重试 3 次后丢弃\n- C. 进入死信交换机，落到死信队列等人工或补偿任务处理\n- D. 退回给生产者重新发送\n\n答案：C\n解析：消息被 nack/reject 且不回队列、TTL 到期、队列超长这三种情况都会触发死信路由，前提是声明队列时绑定了死信交换机（x-dead-letter-exchange）。死信队列是排查\"消息去哪了\"的关键兜底，也常被用来配合 TTL 实现延迟队列。A 忽略了 DLX 的兜底作用；MQ 不会自动把消息退给生产者。详见[《02-RabbitMQ》](#/f/f22)\n\n### 201.（Redis·中）关于 Redis 的惰性删除，下列说法正确的是？\n- A. key 一到过期时间就被立即从内存中删除\n- B. key 过期后不主动回收，直到下一次访问到它时才检查并删除\n- C. 惰性删除意味着过期 key 永远不会被清理\n- D. 惰性删除是内存达到 maxmemory 之后才启动的机制\n\n答案：B\n解析：惰性删除把 CPU 开销摊到访问时刻，代价是\"再也没人访问的过期 key 会一直占内存\"，所以要配合定期删除（每 100ms 随机抽一批检查
