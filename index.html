<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Java 入门到面试指南</title>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#eff6ff; --good:#16a34a; --warn:#d97706;
  --border:#e5e7eb; --code-bg:#0f172a; --code-fg:#e2e8f0;
  --side-bg:#0f172a; --side-fg:#cbd5e1; --side-active:#38bdf8;
  --mark:#fde68a;
}
[data-theme="dark"]{
  --bg:#0b1220; --card:#111a2c; --text:#e5eaf3; --muted:#94a3b8;
  --accent:#60a5fa; --accent-soft:#16233d; --good:#4ade80;
  --border:#24314d; --mark:#a16207;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);display:flex}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
/* ---------- 侧边栏 ---------- */
#sidebar{width:292px;flex:0 0 292px;background:var(--side-bg);color:var(--side-fg);height:100vh;overflow-y:auto;padding:18px 14px;position:sticky;top:0}
#sidebar h1{font-size:17px;color:#fff;margin:4px 6px 2px}
#sidebar .sub{font-size:11px;color:#64748b;margin:0 6px 14px}
.overall{background:#1e293b;border-radius:10px;padding:10px 12px;margin:0 2px 16px}
.overall .row{display:flex;justify-content:space-between;font-size:12px;color:#94a3b8;margin-bottom:6px}
.bar{height:6px;background:#334155;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#38bdf8,#34d399);border-radius:99px;transition:width .3s}
.scard .bar{background:#e5e7eb}
[data-theme="dark"] .scard .bar{background:#24314d}
.stage{margin-bottom:6px}
.stage-h{display:flex;align-items:center;gap:8px;padding:8px 8px;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:600;color:#e2e8f0;user-select:none}
.stage-h:hover{background:#1e293b}
.stage-h .n{margin-left:auto;font-size:11px;color:#64748b;font-weight:400}
.stage-h .arrow{transition:transform .2s;font-size:10px;color:#64748b}
.stage.open .arrow{transform:rotate(90deg)}
.stage-files{display:none;padding:2px 0 6px}
.stage.open .stage-files{display:block}
.fitem{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 22px;border-radius:7px;font-size:12.5px;color:var(--side-fg);cursor:pointer}
.fitem:hover{background:#1e293b;color:#fff}
.fitem.active{background:#1d4ed84d;color:#fff}
.fitem .dot{width:7px;height:7px;border-radius:99px;background:#475569;flex:0 0 7px}
.fitem.done .dot{background:#34d399}
#sidefoot{margin-top:18px;padding-top:12px;border-top:1px solid #1e293b;display:flex;gap:6px;flex-wrap:wrap}
.sbtn{font-size:11px;background:#1e293b;color:#94a3b8;border:none;border-radius:6px;padding:5px 8px;cursor:pointer}
.sbtn:hover{color:#fff;background:#334155}
/* ---------- 主区 ---------- */
#mainwrap{flex:1;height:100vh;overflow-y:auto;scroll-behavior:smooth}
#topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 22px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
#burger{display:none;background:none;border:1px solid var(--border);border-radius:8px;font-size:15px;padding:4px 9px;cursor:pointer;color:var(--text)}
#search{flex:1;max-width:460px;margin-left:auto;display:flex}
#search input{width:100%;padding:8px 12px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px;outline:none}
#search input:focus{border-color:var(--accent)}
#themeBtn{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:7px 10px;cursor:pointer;font-size:13px}
#content{max-width:900px;margin:0 auto;padding:26px 34px 90px}
/* ---------- Markdown ---------- */
.md h1{font-size:26px;margin:.2em 0 .6em;padding-bottom:.35em;border-bottom:2px solid var(--border);letter-spacing:.2px}
.md h2{font-size:20px;margin:1.6em 0 .6em;padding-bottom:.3em;border-bottom:1px solid var(--border)}
.md h3{font-size:16.5px;margin:1.35em 0 .5em;color:var(--text)}
.md h4{font-size:14.5px;margin:1.2em 0 .4em}
.md p{line-height:1.85;margin:.65em 0;font-size:14.5px}
.md li{line-height:1.8;margin:.28em 0;font-size:14.5px}
.md ul,.md ol{padding-left:1.5em;margin:.5em 0}
.md blockquote{margin:1em 0;padding:.7em 1em;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;color:var(--muted)}
.md blockquote p{margin:.25em 0}
.md code{background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--accent);border-radius:5px;padding:2px 6px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em}
pre.code{background:var(--code-bg);color:var(--code-fg);border-radius:12px;padding:16px 18px;overflow-x:auto;position:relative;margin:1em 0}
pre.code code{background:none;color:inherit;padding:0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.8px;line-height:1.7;white-space:pre}
pre.code[data-lang]::before{content:attr(data-lang);position:absolute;top:8px;right:14px;font-size:10.5px;color:#64748b;text-transform:uppercase;letter-spacing:1px}
.mermaidbox{border:1px dashed var(--border);border-radius:12px;padding:10px 14px;margin:1em 0;background:var(--card)}
.mermaidbox-h{font-size:12px;color:var(--muted);margin-bottom:6px}
.twrap{overflow-x:auto;margin:1em 0;border:1px solid var(--border);border-radius:12px}
.md table{border-collapse:collapse;width:100%;font-size:13.5px}
.md th{background:color-mix(in srgb,var(--accent) 8%,var(--card));text-align:left;font-weight:600}
.md th,.md td{padding:9px 13px;border-bottom:1px solid var(--border);line-height:1.65;vertical-align:top}
.md tr:last-child td{border-bottom:none}
.md hr{border:none;border-top:1px solid var(--border);margin:2em 0}
label.ck{display:flex;gap:9px;align-items:flex-start;cursor:pointer;padding:2px 0}
label.ck input{accent-color:var(--good);width:15px;height:15px;margin-top:4px;flex:0 0 15px;cursor:pointer}
label.ck span{flex:1}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px}
/* ---------- 阅读页头 ---------- */
.doc-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.crumb{font-size:12.5px;color:var(--muted)}
.crumb b{color:var(--text)}
.spacer{flex:1}
.btn{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:9px;padding:7px 13px;font-size:12.5px;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{opacity:.9;color:#fff}
.btn.good{border-color:var(--good);color:var(--good)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:34px;padding-top:16px;border-top:1px solid var(--border)}
/* ---------- 首页 ---------- */
.hero{background:linear-gradient(135deg,#1d4ed8,#0ea5e9 55%,#10b981);border-radius:18px;color:#fff;padding:30px 34px;margin-bottom:22px}
.hero h1{margin:0 0 6px;font-size:26px}
.hero p{margin:0 0 16px;opacity:.92;font-size:14px}
.hero .bar{background:#ffffff40;height:8px}
.hero .stat{font-size:12.5px;margin-top:8px;opacity:.95}
.hero .acts{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.hero .acts .btn{background:#ffffff22;border-color:#ffffff55;color:#fff;font-size:13px;padding:9px 16px}
.hero .acts .btn:hover{background:#ffffff35;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.scard{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px 18px;transition:box-shadow .2s,transform .2s}
.scard:hover{box-shadow:0 8px 24px #0f172a14;transform:translateY(-2px)}
.scard .t{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.scard .d{font-size:12px;color:var(--muted);margin-bottom:10px}
.scard .flist{display:flex;flex-direction:column;gap:2px}
.scard .flist a{font-size:12.5px;padding:4px 6px;border-radius:6px;display:flex;gap:7px;align-items:center;color:var(--text)}
.scard .flist a:hover{background:var(--accent-soft);text-decoration:none}
.scard .flist .dot{width:6px;height:6px;border-radius:99px;background:#cbd5e1;flex:0 0 6px}
.scard .flist .dot.on{background:var(--good)}
.note{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 18px;font-size:13px;color:var(--muted);margin-top:18px;line-height:1.8}
/* ---------- 闪卡 ---------- */
.cards-wrap{max-width:760px;margin:0 auto}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 20px}
.chip{border:1px solid var(--border);background:var(--card);border-radius:99px;padding:6px 13px;font-size:12.5px;cursor:pointer;color:var(--text)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.fcard{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:34px 38px;min-height:300px;display:flex;flex-direction:column;box-shadow:0 10px 34px #0f172a0d}
.fcard .cat{font-size:12px;color:var(--accent);font-weight:600;margin-bottom:14px}
.fcard .q{font-size:19px;font-weight:700;line-height:1.65}
.fcard .a{margin-top:22px;padding-top:20px;border-top:1px dashed var(--border);font-size:14.5px;line-height:1.9;color:var(--text)}
.fcard .a.hidden .atext{filter:blur(7px);user-select:none;pointer-events:none}
.fcard .hint{font-size:11.5px;color:var(--muted);margin-top:14px}
.fcard .ref{margin-top:14px;font-size:12.5px}
.facts{display:flex;gap:10px;margin-top:20px}
.facts .btn{flex:1;padding:11px}
.cprog{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:10px}
.cstats{display:flex;gap:14px;margin-top:16px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.cstats b{color:var(--text)}
/* ---------- 搜索结果 ---------- */
.sres{margin-top:8px}
.sres .grp{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 16px;margin-bottom:12px}
.sres .gt{font-weight:700;font-size:14.5px;cursor:pointer}
.sres .cnt{font-size:11.5px;color:var(--muted);margin-left:8px;font-weight:400}
.sres .ln{font-size:12.8px;color:var(--muted);padding:5px 8px;border-radius:6px;cursor:pointer;line-height:1.7}
.sres .ln:hover{background:var(--accent-soft);color:var(--text)}
.qstats{font-size:12.5px;color:var(--muted)}
.qopt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin:9px 0;cursor:pointer;font-size:14.5px;line-height:1.75;background:var(--card)}
.qopt:hover{border-color:var(--accent)}
.qopt b{color:var(--accent);flex:0 0 auto;font-size:12.5px;margin-top:2px}
.qopt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--card))}
.qopt.wrong{border-color:#ef4444;background:color-mix(in srgb,#ef4444 8%,var(--card))}
.qstem{font-size:16.5px;font-weight:600;line-height:2.4;margin-top:8px}
.blankin{border:none;border-bottom:2px solid var(--accent);background:var(--accent-soft);padding:4px 12px;border-radius:8px 8px 0 0;font-size:14.5px;font-weight:600;color:var(--text);outline:none;margin:0 6px;min-width:130px;text-align:center}
.blankin:focus{background:color-mix(in srgb,var(--accent) 16%,var(--card))}
.blankin.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--card))}
.blankin.bad{border-color:#ef4444;background:color-mix(in srgb,#ef4444 8%,var(--card))}
.qfb{margin-top:18px;font-weight:700;font-size:15px}
.qfb.ok{color:var(--good)}
.qfb.bad{color:#ef4444}
.weakcard{background:color-mix(in srgb,var(--warn) 10%,var(--card));border:1px solid color-mix(in srgb,var(--warn) 45%,var(--border));border-radius:14px;padding:12px 18px;margin-bottom:14px;font-size:13.5px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.weakcard b{color:var(--warn)}
.chap-sel{padding:7px 10px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px;outline:none}
.chap-sel:focus{border-color:var(--accent)}
.exbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.extimer{font-variant-numeric:tabular-nums;background:var(--accent);color:#fff;border-radius:99px;padding:6px 16px;font-weight:700;font-size:14.5px}
.extimer.low{background:#ef4444;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.65}}
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin:0 0 14px}
.exdot{border:1px solid var(--border);border-radius:8px;text-align:center;padding:6px 0;font-size:12px;cursor:pointer;background:var(--card);color:var(--muted)}
.exdot.answered{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.exdot.cur{outline:2px solid var(--accent);outline-offset:1px}
.exscore{font-size:38px;font-weight:800;color:var(--accent)}
.exres-item{border:1px solid var(--border);border-radius:12px;padding:12px 16px;margin:8px 0;font-size:13.5px;line-height:1.85;background:var(--card)}
.exres-item.bad{border-color:color-mix(in srgb,#ef4444 45%,var(--border))}
/* ---------- 遮罩 ---------- */
#overlay{position:fixed;inset:0;background:#0f172a99;display:none;align-items:center;justify-content:center;z-index:99}
#overlay .box{background:var(--card);border-radius:16px;padding:22px;width:min(560px,92vw)}
#overlay textarea{width:100%;height:180px;border:1px solid var(--border);border-radius:10px;padding:10px;font-size:12px;background:var(--bg);color:var(--text)}
#overlay .row{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
@media (max-width:920px){
  #sidebar{position:fixed;z-index:50;left:0;top:0;transform:translateX(-100%);transition:transform .25s}
  #sidebar.open{transform:none;box-shadow:0 0 40px #0008}
  #burger{display:block}
  #content{padding:20px 18px 80px}
}
</style>
</head>

\n| 文件 | 内容 |\n|------|------|\n| [02-进阶篇/01-多线程与并发编程](#/f/f9) | JMM、synchronized/volatile、线程池、JUC、ThreadLocal |\n| [02-进阶篇/02-JVM核心](#/f/f10) | 内存区域、GC 与收集器、类加载、调优与排查 |\n| [02-进阶篇/03-IO模型与网络编程](#/f/f11) | TCP/HTTP、BIO/NIO/AIO、零拷贝、Netty |\n| [02-进阶篇/04-开发工具链](#/f/f12) | Git 工作流、Maven 依赖冲突、Linux 排查命令链 |\n\n### 数据库与框架\n\n| 文件 | 内容 |\n|------|------|\n| [03-数据库篇/01-MySQL基础与SQL实战](#/f/f13) | SQL 全量语法、连接查询、JDBC 到 ORM |\n| [03-数据库篇/02-索引-事务-锁与调优](#/f/f14) | B+ 树、MVCC、三大日志、慢 SQL、分库分表 |\n| [04-框架篇/01-Spring核心](#/f/f15) | IoC/AOP、Bean 生命周期、事务、循环依赖、SpringMVC |\n| [04-框架篇/02-SpringBoot实战](#/f/f16) | 自动配置原理、统一返回/异常/校验、第一个完整项目 |\n| [04-框架篇/03-MyBatis](#/f/f17) | 动态 SQL、缓存、MyBatis-Plus、Mapper 原理 |\n| [04-框架篇/04-SpringCloud微服务](#/f/f18) | Nacos、OpenFeign、Gateway、Sentinel |\n| [04-框架篇/05-单元测试与工程质量](#/f/f19) | JUnit5/Mockito、切片测试、Lombok 与日志规范 |\n| [04-框架篇/06-认证与安全](#/f/f20) | JWT/Session、BCrypt 存密码、XSS/CSRF/注入、RBAC |\n\n### 中间件（重点篇）\n\n| 文件 | 内容 |\n|------|------|\n| [05-中间件篇/01-Redis](#/f/f21) | 五大类型、持久化、缓存三兄弟、分布式锁、哨兵/集群 |\n| [05-中间件篇/02-RabbitMQ](#/f/f22) | AMQP 模型、消息可靠性、死信队列、延迟队列 |\n| [05-中间件篇/03-Kafka](#/f/f23) | 分区与消费组、ACK/ISR、为什么快 |\n| [05-中间件篇/04-RocketMQ](#/f/f24) | 事务消息、顺序/延迟消息、三大 MQ 选型对比 |\n| [05-中间件篇/05-Elasticsearch](#/f/f25) | 倒排索引、DSL 查询、数据同步 |\n| [05-中间件篇/06-ZooKeeper与Nacos](#/f/f26) | 注册/配置中心、Watcher、AP/CP |\n| [05-中间件篇/07-Nginx](#/f/f27) | 反向代理、负载均衡、动静分离、限流 |\n| [05-中间件篇/08-MongoDB](#/f/f28) | 文档模型、CRUD 与聚合、选型场景 |\n\n### 架构与求职\n\n| 文件 | 内容 |\n|------|------|\n| [06-分布式与高并发篇/01-分布式理论基础](#/f/f29) | CAP/BASE、一致性哈希、分布式 ID/锁/事务 |\n| [06-分布式与高并发篇/02-高并发系统设计](#/f/f30) | 限流熔断降级、分库分表、秒杀系统设计 |\n| [06-分布式与高并发篇/03-系统设计场景题](#/f/f31) | 短链/去重/排行榜/延迟任务/Feed 流等 7 个场景 |\n| [07-面试篇/01-Java高频八股速查](#/f/f32) | Java 基础/集合/并发/JVM/Spring 自测清单（约 94 题） |\n| [07-面试篇/02-数据库与中间件面试速查](#/f/f33) | MySQL/Redis/MQ/ES/网络/OS 自测清单（约 82 题） |\n| [07-面试篇/03-算法刷题路线](#/f/f34) | 专题刷题顺序、80 道代表题清单、手撕模板（总量目标 200 题） |\n| [07-面试篇/04-简历与求职指南](#/f/f35) | 简历写法、项目 STAR、各轮面试侧重 |\n| [07-面试篇/05-选择填空题库](#/f/f36) | 448 题（选择 307 + 填空 91 + 判断 50）覆盖全部章节；含 85 道难题；应用内支持「章节小考」「乱序」「只做错题」「难度筛选」「按板块+难度组卷」 |\n| [07-面试篇/06-考点详略表](#/f/f37) | 每章标注 🔴 必考精通 / 🟡 高频掌握 / 🟢 了解即可 + 时间紧时的取舍清单 |\n| [07-面试篇/07-术语速查表](#/f/f38) | QPS/MTTR/RPO/RTO 等缩写与易混概念对照，冲刺期 10 分钟扫一遍 |\n\n### 总览\n\n| 文件 | 内容 |\n|------|------|\n| [ROADMAP.md](#/f/f1) | 总路线图、三档时间规划、过关标准 |\n| [STUDY-TRACKER.md](#/f/f2) | 全知识点打卡清单 + 周复盘模板 |\n\n---\n\n## 三条贯穿始终的主线\n\n1. **项目线**：入门完成后做一个 `todo-list` REST API（见 SpringBoot 实战篇），学完 MyBatis 后把它接入数据库，学完中间件后演进成一个「带缓存 + 消息队列 + 搜索」的商城 demo，最后用秒杀设计串起高并发知识。面试讲项目时，这套演进过程本身就是亮点。\n2. **算法线**：从进阶篇开始每天 2~3 题，按 [算法刷题路线](#/f/f34) 的专题推进，总量目标 200 题。\n3. **面试线**：每学完一个文件，先做文件末尾的高频面试题自测；面试篇的八股清单在冲刺期每天过一遍。\n\n## 约定\n\n- 每个文件的「🔗 推荐资料」只指向上面五个站点（均已验证可访问），外部资料以这五个站为骨架，需要官方文档时自行延伸。\n- 学习进度一律记在 [STUDY-TRACKER.md](#/f/f2)，勾选即可。\n- 建议时长按「每天 2~3 小时」估算，全程约 6~7 个月；赶时间可看 ROADMAP 里的加速方案。\n\n## 仓库结构与技术栈\n\n- **站点**：Astro 7 + [AstroPaper](https://github.com/satnaing/astro-paper) 主题（Tailwind CSS 4 + Pagefind 搜索）。文章内容在 `src/content/posts/`，由 `app/migrate-astro.py` 从根目录分篇 md 生成（注入 frontmatter、改写内链）。\n- **练习场**：`src/pages/practice.astro`（八股闪卡 / 选择填空 / 综合大考 / 进度打卡），数据由 `app/migrate-astro.py` 生成到 `src/data/guide-app.json`。\n- **离线版**：根目录 `index.html` 为单文件离线应用，由 `app/build.py` 生成，双击即用。\n\n## 本地开发与更新\n\n```bash\n# 修改根目录的 md 内容后：\npython3 app/migrate-astro.py   # 同步到 Astro 内容集合 + 练习场数据\nnpm run build                  # 构建到 dist/（本地预览：npm run dev 或 npm run preview）\n\n# 离线单文件版（可选）：\npython3 app/build.py           # 重新生成根目录 index.html\n\n# 发布：\ngit add -A && git commit -m \"更新内容\" && git push   # Actions 自动部署到 GitHub Pages\n```\n","ck":0},{"id":"f1","stage":0,"path":"ROADMAP.md","title":"学习路线图 Roadmap","md":"# 学习路线图 Roadmap\n\n> 建议搭配 [STUDY-TRACKER.md](#/f/f2) 使用：每完成一个知识点就打卡。时长按每天 2~3 小时估算。\n\n## 一图看懂\n\n```mermaid\nflowchart TD\n    S1[\"① 入门篇<br/>环境 · 语法 · 面向对象 · 集合 · Java8<br/>产出：能独立写小练习\"] --> S2[\"② 进阶篇<br/>并发 · JVM · IO与网络<br/>产出：理解程序如何运行\"]\n    S2 --> S3[\"③ 数据库篇<br/>SQL · 索引 · 事务 · 调优<br/>产出：会设计表、会优化 SQL\"]\n    S3 --> S4[\"④ 框架篇<br/>Spring · SpringBoot · MyBatis · Cloud<br/>产出：todo-list 完整项目\"]\n    S4 --> S5[\"⑤ 中间件篇<br/>Redis · MQ 三剑客 · ES · ZK/Nacos · Nginx · MongoDB<br/>产出：知道每个件用在哪、怎么用\"]\n    S5 --> S6[\"⑥ 分布式与高并发<br/>CAP · 分布式锁/事务 · 限流 · 秒杀<br/>产出：能讲清系统设计题\"]\n    S6 --> S7[\"⑦ 面试篇<br/>八股速查 · 算法 · 简历<br/>产出：offer\"]\n```\n\n两条贯穿线与主线并行：\n\n- **项目线**：`todo-list API`（框架篇）→ 接入 MyBatis-Plus（MyBatis 篇）→ 加缓存与消息队列（中间件篇）→ 演进为秒杀系统（高并发篇）。每个阶段都在同一个项目上叠加，面试时就是一段完整的成长故事。\n- **算法线**：从进阶篇开始，每天 2~3 题，按 [03-算法刷题路线](#/f/f34) 推进。\n\n## 阶段总表\n\n| 阶段 | 建议时长 | 核心文件 | 过关标准（全部满足才进入下一阶段） |\n|------|---------|----------|------------------------------------|\n| ① 入门篇 | 3 周 | [入门篇文件](#/f/f3) + [设计模式](#/f/f8) | 不查资料能写出：集合统计词频、异常+反射的小工具、Stream 处理订单列表；文件末尾面试题能答 80% |\n| ② 进阶篇 | 3 周 | [并发](#/f/f9)、[JVM](#/f/f10)、[IO网络](#/f/f11)、[工具链](#/f/f12) | 能手写线程池使用代码并解释 7 参数；能用 jstack/jmap 分析死锁与 OOM；能讲三次握手与 NIO 三大件；Git 协作命令盲打、Maven 依赖冲突会排查 |\n| ③ 数据库篇 | 2 周 | [MySQL 基础](#/f/f13)、[索引事务调优](#/f/f14) | 学生选课库 10 道 SQL 全部独立完成；能解释 B+ 树/MVCC/三大日志；能对慢 SQL 做 explain 分析 |\n| ④ 框架篇 | 3 周 | [Spring](#/f/f15)、[SpringBoot](#/f/f16)、[MyBatis](#/f/f17)、[SpringCloud](#/f/f18)、[单元测试](#/f/f19)、[认证安全](#/f/f20) | todo-list 项目上线本地运行：CRUD+校验+全局异常+缓存+登录鉴权；核心 Service 有单测；能讲自动配置原理与事务失效场景 |\n| ⑤ 中间件篇 | 3 周 | [Redis](#/f/f21)、[RabbitMQ](#/f/f22)、[Kafka](#/f/f23)、[RocketMQ](#/f/f24)、[ES](#/f/f25)、[ZK/Nacos](#/f/f26)、[Nginx](#/f/f27)、[MongoDB](#/f/f28) | 每个中间件都完成 Docker 部署 + Spring Boot 整合 demo；能说出每个件的 3 个使用场景与核心可靠性问题 |\n| ⑥ 分布式与高并发 | 2 周 | [分布式理论](#/f/f29)、[高并发设计](#/f/f30)、[场景题集](#/f/f31) | 能白板画出秒杀系统全链路并解释防超卖；能对比三种分布式锁与四种限流算法；短链/延迟任务/排行榜各能讲 5 分钟 |\n| ⑦ 面试篇 | 3~4 周 | [八股速查一](#/f/f32)、[八股速查二](#/f/f33)、[选择填空题库](#/f/f36)、[考点详略表](#/f/f37)、[算法路线](#/f/f34)、[简历求职](#/f/f35) | 224 张闪卡全部过一遍（含速查 176 + 设计模式/工具链/单测/认证/场景题新章）；448 题题库全刷（选择 307 + 填空 91 + 判断 50）；章节小考逐章 90%+；综合大考 20 题 ≥85%；算法 200 题完成；简历定稿并完成 3 次模拟面试 |\n\n合计约 19~20 周（零基础按部就班约 5 个月，加上缓冲 6 个月）。\n\n## 三档时间规划\n\n### A. 零基础 · 6~7 个月（默认节奏）\n\n| 月份 | 内容 |\n|------|------|\n| 第 1 月 | 入门篇全部 + 开始算法（数组、链表专题） |\n| 第 2 月 | 进阶篇（并发重推 1 周）+ 算法（栈队列、哈希） |\n| 第 3 月 | 数据库篇 + 框架篇前半（Spring、SpringBoot，完成 todo-list） |\n| 第 4 月 | 框架篇后半（MyBatis、SpringCloud）+ 中间件篇（Redis、RabbitMQ） |\n| 第 5 月 | 中间件篇其余 + 分布式与高并发篇；项目加中间件 |\n| 第 6 月 | 面试篇：八股清单每天过、算法套卷、简历与模拟面 |\n| 第 7 月 | 查漏补缺 + 投递 |\n\n### B. 有其他语言基础 · 3 个月\n\n- 第 1~2 周：入门篇快速过（语法对照学，重点看面向对象、集合、Java8）。\n- 第 3~5 周：进阶篇 + 数据库篇并行，算法每天保持。\n- 第 6~8 周：框架篇，完成 todo-list 项目。\n- 第 9~10 周：中间件篇 + 分布式篇，项目加中间件。\n- 第 11~12 周：面试篇冲刺。\n\n### C. 临门冲刺 · 1 个月（已有项目与八股基础）\n\n- 每天上午：[八股速查](#/f/f32) 两个板块 + 对应指南文件补漏。\n- 每天下午：算法 3~4 题（按专题）+ 手撕模板默写。\n- 每天晚上：中间件场景题（[Redis](#/f/f21)、[MQ 选型](#/f/f24)、[秒杀设计](#/f/f30)）+ [简历打磨](#/f/f35)。\n\n## 学习方法建议\n\n1. **先资料后提纲**：每个文件先读「推荐资料」里的廖雪峰/JavaGuide 对应章节（原始讲解更细），再用本指南的「核心知识点」当提纲复习，用「高频面试题」验收。\n2. **代码必须亲手敲**：动手实践的任务不要复制粘贴；中间件全部用 Docker 起服务，练习启停与排错本身也是面试考点。\n3. **API 随手查**：忘掉类和方法签名时用 [Java 8 中文 API](https://www.matools.com/api/java8)，不要背 API。\n4. **输出倒逼输入**：每完成一篇，用自己的话写 200 字笔记（或讲给朋友/橡皮鸭听），讲不清的地方就是漏洞。\n5. **面试题不是背的**：先理解，再把答案压缩成 3~6 条要点——压缩不出来的，说明还没懂，回知识点重看。\n","ck":0},{"id":"f2","stage":0,"path":"STUDY-TRACKER.md","title":"学习进度打卡表","md":"# 学习进度打卡表\n\n> 用法：每条即一个自测点。能独立完成/讲清才算打勾；一个文件的条目全部打勾 = 该篇过关。阶段过关标准见 [ROADMAP.md](#/f/f1)。\n\n## ① 入门篇\n\n### [01-环境搭建与基础语法](#/f/f3)\n- [ ] 能解释 JDK/JRE/JVM 关系，并完成 JDK + IDEA 安装\n- [ ] 8 种基本类型、类型转换、运算符用过一遍\n- [ ] 流程控制 + 方法 + 重载练熟（九九乘法表、猜数字）\n- [ ] 数组遍历、排序、Arrays 工具\n- [ ] 能讲清「Java 只有值传递」\n\n### [02-面向对象与核心类](#/f/f4)\n- [ ] 封装/继承/多态各写出一个例子\n- [ ] 能对比接口与抽象类、重写与重载\n- [ ] equals 与 hashCode 的关系讲得清\n- [ ] String 不可变、StringBuilder、Integer 缓存\n- [ ] 枚举、BigDecimal、java.time 用法\n\n### [03-集合与泛型](#/f/f5)\n- [ ] 画出 Collection/Map 两棵树\n- [ ] ArrayList 扩容、与 LinkedList 的选型\n- [ ] HashMap put 流程、扩容、1.7 vs 1.8\n- [ ] 遍历中安全删除元素\n- [ ] 泛型通配符与 PECS\n\n### [04-异常-IO-反射-注解](#/f/f6)\n- [ ] 异常体系与 try-with-resources\n- [ ] 字节/字符流、缓冲流拷贝对比\n- [ ] 序列化与 serialVersionUID\n- [ ] 反射获取 Class 并操作字段方法\n- [ ] 自定义注解 + 反射解析跑通\n\n### [05-Lambda-Stream与Java8新特性](#/f/f7)\n- [ ] 四大函数式接口\n- [ ] Stream 分组/过滤/汇总一套连招\n- [ ] map vs flatMap 讲得清\n- [ ] Optional 正确 `。\n\n### 第一个程序与编译运行原理\n\n```java\npublic class Hello {\n    public static void main(String[] args) {\n        System.out.println(\"Hello, Java!\");\n    }\n}\n```\n\n- `javac Hello.java` 编译出 **字节码文件 Hello.class**；`java Hello` 由 JVM 加载执行（Java 11+ 可直接 `java Hello.java` 单文件运行）。\n- 核心机制：**一次编译，到处运行**——源码编译成与平台无关的 `.class`，不同平台的 JVM 负责解释/JIT 编译执行。\n- `main` 方法签名固定：`public static void main(String[] args)`，是程序入口。\n\n### IDEA 安装与调试\n\n- 社区版（Community）免费够用；新建 Project 时选择 JDK 17。\n- 断点调试：行号左侧点击下断点 → Debug 运行；**F8（Step Over）单步跳过、F7（Step Into）进入方法、Shift+F8 跳出、F9 放行到下一断点**；调试窗口可实时查看/修改变量值。\n- 快捷键（Windows/macOS）：`psvm`+Tab 生成 main、`sout`+Tab 生成输出；Alt+Enter 快速修复；Ctrl+D 复制行；Ctrl+Y 删除行；Ctrl+Alt+L 格式化；Shift+F6 重命名。\n\n### 变量与 8 种基本类型\n\n| 类型 | 字节 | 范围/说明 | 默认值 |\n|---|---|---|---|\n| byte | 1 | -128 ~ 127 | 0 |\n| short | 2 | -32768 ~ 32767 | 0 |\n| int | 4 | 约 ±21 亿 | 0 |\n| long | 8 | 需加后缀 `L` | 0L |\n| float | 4 | 单精度，需加 `f` | 0.0f |\n| double | 8 | 双精度，浮点默认类型 | 0.0d |\n| char | 2 | 单个字符，0 ~ 65535 | '\\u0000' |\n| boolean | - | true/false（JVM 层面实现决定大小） | false |\n\n- 类型转换：**小→大自动提升**（byte/short/char 参与运算先转 int），**大→小强制转换 `(int) 3.9` 截断小数**。\n- 整数字面量默认 int，浮点默认 double；`long x = 10000000000L;` 不加 L 会编译错误。\n- `float`/`double` 存在精度丢失，**金额计算禁止用它们**（见文件 2 的 BigDecimal）。\n\n### 运算符\n\n- 算术：`+ - * / %`；整数相除结果仍是整数（`5 / 2 == 2`）。\n- 自增：`i++` 先用后加，`++i` 先加后用。\n- 逻辑：`&&`、`||` **短路**——`a && b` 中 a 为 false 则 b 不执行；`&`、`|` 不短路（位运算）。\n- 三元：`条件 ? 值1 : 值2`；优先级不确定时加括号。\n\n### String 简介与 Scanner\n\n- `String` 是引用类型、**不可变对象**，字符串字面量存在常量池中；`==` 比较地址，`equals()` 比较内容（详见文件 2）。\n- 常用方法：`length()`、`charAt()`、`substring()`、`indexOf()`、`equals()`、`split()`。\n\n```java\nScanner sc = new Scanner(System.in);\nint n = sc.nextInt();          // 读整数\nString line = sc.nextLine();   // 读一行字符串\n```\n\n- 坑：`nextInt()` 后接 `nextLine()` 会读到换行符，需要先额外调用一次 `nextLine()` 清空缓冲。\n\n### 流程控制\n\n- `if / else if / else`：条件必须是 boolean。\n- `switch`：可作用的类型——**byte、short、char、int 及其包装类、枚举、String**（Java 7+），**不支持 long/float/double/boolean**；Java 14+ 箭头表达式 `case 1 -> ...` 不用写 break。\n- `for`、`while`、`do-while`、增强 for（`for (int x : arr)`）。\n- `break` 跳出本层循环，`continue` 跳过本次；带标签 `outer:` 可跳出多层（少用）。\n\n### 方法、重载与可变参数\n\n```java\nstatic int add(int a, int b) { return a + b; }              // 重载：参数列表不同\nstatic double add(double a, double b) { return a + b; }     // 与返回值类型无关\nstatic int sum(int... nums) {                               // 可变参数本质是数组\n    int s = 0;\n    for (int n : nums) s += n;\n    return s;\n}\n```\n\n- 重载（overload）：同一个类中方法名相同、**参数列表不同**；仅返回值不同不算重载。\n- 可变参数必须是参数列表的最后一个。\n\n### ⭐Java 只有值传递\n\n面试官想听：你能区分「传值的拷贝」和「传引用的拷贝」，并用一个反例证明引用本身不会被改变。\n\n- Java 中**永远传递的是实参的拷贝**：基本类型拷贝「值」，引用类型拷贝「引用（地址）」。\n- 方法内通过引用修改对象内容会影响原对象；但**让引用指向新对象不影响原引用**：\n\n```java\nstatic void change(int x) { x = 100; }                      // 无效\nstatic void fill(int[] arr) { arr[0] = 100; }               // 有效：改的是对象内容\nstatic void reassign(int[] arr) { arr = new int[]{9}; }     // 无效：改的是引用副本\n```\n\n### 数组与 Arrays 工具类\n\n- 声明与初始化：`int[] a = new int[3];`、`int[] b = {1, 2, 3};`；长度固定 `a.length`，越界抛 `ArrayIndexOutOfBoundsException`。\n- 二维数组：`int[][] m = new int[3][4];`，本质是「数组的数组」，第二维长度可不同。\n- `Arrays` 常用方法：`toString()` 打印、`sort()` 排序、`fill()` 填充、`copyOf()` 复制、`equals()` 比较、`binarySearch()` 二分查找（需有序）。\n\n## 🛠 动手实践\n\n### 任务 1：九九乘法表\n\n```java\nfor (int i = 1; i <= 9; i++) {\n    for (int j = 1; j <= i; j++) {\n        System.out.printf(\"%d*%d=%-4d\", j, i, i * j);\n    }\n    System.out.println();\n}\n```\n\n- 验收标准：输出标准下三角 45 行乘法口诀；列对齐（用 `%-4d`）；改写成 `while` 版本结果一致。\n\n### 任务 2：猜数字游戏\n\n- 要求：程序随机生成 1~100 的整数（`new Random().nextInt(100) + 1`），用户循环输入猜测，提示「大了/小了」，猜中后输出总次数并退出。\n- 验收标准：用 `while(true)` + `break` 实现；输入非法（非数字）不崩溃（用 `InputMismatchException` 或先读字符串再解析）；能统计并输出猜测次数。\n\n### 任务 3：数组冒泡排序 + 最大值\n\n```java\nfor (int i = 0; i < arr.length - 1; i++) {\n    boolean swapped = false;\n    for (int j = 0; j < arr.length - 1 - i; j++) {\n        if (arr[j] > arr[j + 1]) {\n            int t = arr[j]; arr[j] = arr[j + 1]; arr[j + 1] = t;\n            swapped = true;\n        }\n    }\n    if (!swapped) break;   // 一趟无交换说明已有序，提前结束\n}\n```\n\n- 验收标准：对 `{5, 2, 8, 1, 9}` 输出排序结果与最大值 9；加上提前退出的优化；最后用 `Arrays.sort(arr)` 对照验证自己的排序结果一致。\n\n### 任务 4：IDEA 调试练习\n\n- 验收标准：在任务 3 的内层循环处打断点，Debug 运行，用 Step Over 观察每轮 `i、j、swapped` 的值变化，并截图记录一次「修改 Debug 窗口中的变量值后程序行为改变」。\n\n## 💼 高频面试题\n\n**Q：JDK、JRE、JVM 三者是什么关系？⭐**\n- JVM 是执行字节码的虚拟机，是「跨平台」的关键。\n- JRE = JVM + Java 核心类库，只够运行程序。\n- JDK = JRE + 编译器 javac、调试器 jdb 等开发工具，开发必须装 JDK。\n- 一句话：JDK ⊃ JRE ⊃ JVM。\n\n**Q：Java 是值传递还是引用传递？⭐**\n- 只有值传递。基本类型传「值的副本」，方法内修改不影响原变量。\n- 引用类型传「引用（地址）的副本」，方法内通过该引用可以修改对象内容，但重新赋值（指向新对象）不影响原引用。\n- 反例：`reassign(int[] arr)` 中 `arr = new int[]{9}` 后调用方数组不变，证明不是引用传递。\n\n**Q：switch 支持哪些类型？**\n- byte、short、char、int 及其包装类（Byte/Short/Character/Integer）、枚举（Java 5+）、String（Java 7+）。\n- 不支持 long、float、double、boolean；case 必须是编译期常量且不重复。\n- Java 14+ 的箭头语法 `case x ->` 无需 break、不穿透。\n\n**Q：& 和 && 的区别？**\n- `&&` 短路：左边为 false 时右边不计算，效率高且能防 NPE（如 `s != null && s.length() > 0`）。\n- `&` 是位运算符也可用于 boolean，但不短路，两边都会计算。\n\n**Q：char 类型能存一个汉字吗？**\n- 能。char 占 2 字节（UTF-16 code unit），汉字大多落在基本多文种平面（BMP），如 `'中'` 可直接赋给 char。\n- 生僻字（如 emoji 或增补平面字符）需两个 char（代理对），`String.length()` 返回的是 code unit 数而不是字符个数。\n\n**Q：为什么 float 和 double 不能直接比较相等？**\n- 二进制浮点无法精确表示很多十进制小数（如 0.1），运算后存在累积误差。\n- 比较应使用差值阈值，金额计算应使用 BigDecimal（字符串构造）。\n\n**Q：编译型语言和解释型语言，Java 算哪种？**\n- 混合型：javac 先把源码编译成字节码（.class），再由 JVM 逐条解释执行，热点代码由 JIT 编译成本地机器码。\n- 由此获得「一次编译，到处运行」，JIT 又保证了接近原生的执行速度。\n\n## 🔗 推荐资料\n\n| 资料 | 说明 | 链接 |\n|---|---|---|\n| 廖雪峰 Java 快速入门 | 入门主线精读，配环境到基础语法全覆盖 | https://liaoxuefeng.com/books/java/quick-start/index.html |\n| 慕课网《Java入门第一季》 | 免费视频，适合完全零基础跟练 | https://www.imooc.com/learn/85 |\n| pdai 语言基础 | 语法要点体系化梳理，可当速查表 | https://pdai.tech/md/java/basic/java-basic-lan-basic.html |\n| JavaGuide 基础面试题 | 学完本章开始刷基础面试题第一部分 | https://javaguide.cn/java/basis/java-basic-questions-01.html |\n| Java 8 中文 API 速查 | 查 String/Arrays/Scanner 等类的方法 | https://www.matools.com/api/java8 |\n","ck":0},{"id":"f4","stage":1,"path":"01-入门篇/02-面向对象与核心类.md","title":"02-面向对象与核心类","md":"# 02-面向对象与核心类\n\n> **阶段**：入门篇 ｜ **建议时长**：6 天 ｜ **前置**：01-环境搭建与基础语法.md\n\n## 🎯 学习目标\n\n- 能用「封装、继承、多态」设计一个 3 层以上继承体系并解释每一处多态调用。\n- 能重写 `equals`/`hashCode`/`toString`，并说清两者的约定关系。\n- 掌握 String 常量池、Integer 缓存、BigDecimal 精度三大经典坑，能预测代码输出结果。\n- 会用枚举表达固定状态集合，并写出线程安全的枚举单例。\n- 会用 `java.time` 完成日期格式化、加减与间隔计算。\n\n## 📖 核心知识点\n\n### 类、对象、构造方法与 this\n\n- 类是模板，对象是实例：`new` 在堆中分配内存，字段有默认值，局部变量必须手动初始化。\n- 构造方法与类同名、无返回值；未手写时编译器提供无参构造；`this(...)` 可在构造方法间复用（必须放第一行）。\n- `this` 指当前对象，用于区分成员变量与参数（`this.name = name`）。\n- JavaBean 规范：字段 private、提供 getter/setter、无参构造。\n\n### ⭐封装、继承、多态\n\n面试官想听：不只是背定义，而是能各举一个真实设计场景说明「为什么需要」。\n\n- **封装**：字段 private + 提供 public 访问器，在 setter 中做校验，隔离变化。\n- **继承**：`class Dog extends Animal`，子类复用并扩展父类；Java 单继承（避免菱形冲突），所有类默认继承 Object。\n- **多态**：父类引用指向子类对象 `Animal a = new Dog();`，调用 `a.sound()` 执行的是**子类重写后的方法**（运行时绑定）；成员变量没有多态，静态方法不参与多态。\n- `super` 调用父类构造（必须第一行）或父类成员；`instanceof` 判断真实类型后再向下转型（Java 16+ 可写 `if (a instanceof Dog d)`）。\n\n### ⭐重写 vs 重载\n\n面试官想听：一句话点破——重写是运行时多态（纵向），重载是编译时多态（横向）。\n\n| 维度 | 重写 Override | 重载 Overload |\n|---|---|---|\n| 范围 | 父子类之间 | 同一个类中 |\n| 参数列表 | 必须相同 | 必须不同 |\n| 返回值 | 相同或为其子类 | 可以不同 |\n| 访问权限 | 不能小于父类 | 无要求 |\n| 异常 | 不能抛更宽的受检异常 | 无要求 |\n| 绑定时机 | 运行时 | 编译时 |\n\n- `@Override` 注解让编译器帮你校验是否真的是重写，建议永远加上。\n- private、static、final 方法不能被重写。\n\n### ⭐抽象类 vs 接口\n\n面试官想听：抽象类是「是什么」（模板复用），接口是「能做什么」（能力契约），能按场景选择。\n\n| 维度 | 抽象类 abstract class | 接口 interface |\n|---|---|---|\n| 构造方法 | 有（供子类调用） | 无 |\n| 成员变量 | 任意 | 只能 public static final 常量 |\n| 方法 | 可含具体实现 | Java 8 前只有抽象方法；8+ 允许 default/static 方法 |\n| 继承/实现 | 单继承 | 多实现 |\n| 设计语义 | \"is-a\"，代码复用 | \"can-do\"，能力声明 |\n\n- 典型组合：抽象类 `AbstractList` 提供骨架实现，接口 `List` 定义契约——模板方法模式。\n\n### static 与 final\n\n- `static`：属于类而非实例。静态变量所有实例共享；静态方法不能访问实例成员、不能用 this；静态代码块在类加载时执行一次。\n- `final`：修饰类（不能被继承，如 String）、修饰方法（不能被重写）、修饰变量（基本类型值不变，引用类型指向不变但内容可变）。\n- 常量命名：`static final int MAX_SIZE = 10;`\n\n**代码块的执行顺序**（面试常给继承场景问输出）：\n\n- **静态代码块**（`static { }`）：随**类初始化**执行，**只执行一次**；多个静态块按书写顺序执行。\n- **实例代码块**（`{ }`，也叫构造代码块）：**每次 new 都执行**，且在构造方法体之前；它会被编译器插进每个构造方法的最前面。\n- 顺序：**父类静态块 → 子类静态块 → 父类实例块 → 父类构造方法 → 子类实例块 → 子类构造方法**。\n- 记忆口诀：**静态只一次（先父后子），实例每次 new（先父后子，块在构造前）**。类初始化的触发时机与静态块的细节见[《02-JVM核心》](#/f/f10)。\n\n### 内部类与访问权限\n\n- 成员内部类（持有外部类引用）、静态嵌套类（不持有，推荐静态场景用）、局部内部类、匿名内部类（Lambda 的前身，实现监听器/临时逻辑）。\n- 访问权限从小到大：`private`（本类）→ 默认/包级（同包）→ `protected`（同包+子类）→ `public`（全公开）。\n- 包的作用：命名空间 + 访问控制；`import` 引入其他包的类。\n\n### ⭐Object 核心方法：equals / hashCode / toString\n\n面试官想听：知道默认 equals 是 `==`，重写后必须同时重写 hashCode，并能说出约定的具体内容。\n\n- `toString()` 默认输出 `类名@十六进制hash`，打印对象会被自动调用，建议重写。\n- `equals()` 默认等价于 `==`（比较地址）；重写模板（IDEA 自动生成即可）：\n\n```java\n@Override\npublic boolean equals(Object o) {\n    if (this == o) return true;                      // 自反优化\n    if (o == null || getClass() != o.getClass()) return false;\n    return age == p.age && Objects.equals(name, p.name);\n}\n@Override\npublic int hashCode() { return Objects.hash(name, age); }\n```\n\n- 约定：equals 相等 ⇒ hashCode 必须相等；hashCode 相等 ⇏ equals 相等（哈希冲突）。违反约定会导致 HashSet/HashMap 存取异常。\n\n### ⭐String 不可变原理与常量池\n\n面试官想听：说出「private final + 不提供修改方法 + 类被 final 修饰」三层防护和安全/池化/线程安全三大好处。\n\n- 不可变的实现：`String` 内部 `private final char[] value`（Java 9+ 改为 byte[]），数组引用不可变且不外泄，String 类本身被 final 修饰不能被子类破坏。\n- 常量池：字面量先查池，存在则复用引用，所以 `\"a\" == \"a\"` 为 true；`new String(\"a\")` 一定在堆上创建新对象，`==` 为 false，必须用 `equals`。\n- 编译期可确定的拼接 `\"he\" + \"llo\"` 会被优化进常量池；含变量的拼接在运行时生成新对象，应用 `StringBuilder`。\n- `String.intern()` 可把字符串放入/复用常量池。\n- `StringBuilder`（非线程安全、快）vs `StringBuffer`（线程安全、慢）；`StringJoiner` 处理 `a, b, c` 这类带分隔符拼接。\n\n### ⭐包装类型与自动装箱、Integer 缓存\n\n面试官想听：能准确答出缓存范围 -128~127，并解释包装类型存在的意义（泛型与集合需要对象）。\n\n```java\nInteger a = 127, b = 127;      // true：取自 IntegerCache 缓存数组\nInteger c = 128, d = 128;      // false：超出缓存，new 新对象\nc == d;        // false\nc.equals(d);   // true：包装类型比较永远用 equals\n```\n\n- 自动装箱调用 `Integer.valueOf()`，拆箱调用 `intValue()`；装箱发生在集合/泛型场景。\n- 经典坑：`Integer` 与 `int` 混合比较会自动拆箱；拆箱 null 抛 `NullPointerException`；三目运算符两侧类型不统一会触发拆箱。\n- Byte/Short/Long 缓存同为 -128~127，Character 缓存 0~127，Float/Double 无缓存。\n\n### 枚举与枚举单例\n\n```java\npublic enum OrderStatus {\n    WAIT_PAY(\"待支付\"), PAID(\"已支付\"), CLOSED(\"已关闭\");\n    private final String desc;\n    OrderStatus(String desc) { this.desc = desc; }\n    public String getDesc() { return desc; }\n}\n```\n\n- 枚举天然继承 `java.lang.Enum`，有 `values()`、`valueOf()`、`name()`、`ordinal()`；可用 `==` 比较（实例唯一）。\n- 可定义字段、方法和构造方法；配合 `switch` 使用最直观。\n- **枚举单例**是《Effective Java》推荐写法：防止反射创建实例（构造方法反射调用会直接抛异常）且天然线程安全、可序列化：\n\n```java\npublic enum Singleton { INSTANCE;\n    public void doSomething() { /* 业务方法 */ } }\n```\n\n### ⭐BigDecimal 与精度问题\n\n面试官想听：知道 `new BigDecimal(0.1)` 会带入二进制误差，必须用字符串构造或 `valueOf`。\n\n```java\nSystem.out.println(0.1 + 0.2);                       // 0.30000000000000004\nBigDecimal a = new BigDecimal(\"0.1\");                // 正确：字符串构造\nBigDecimal b = BigDecimal.valueOf(0.1);              // 等效：内部走 Double.toString\nSystem.out.println(a.add(b));                        // 0.2（精确）\nnew BigDecimal(0.1).doubleValue();                   // 坑：0.1000000000000000055511151231257827\n```\n\n- 除不尽时必须指定舍入模式：`divide(b, 2, RoundingMode.HALF_UP)`，否则抛 `ArithmeticException`。\n- `equals` 比较值和精度（`1.0` 不等于 `1`），比较数值用 `compareTo`。\n\n### java.time 新日期 API\n\n- `LocalDate`（日期）、`LocalTime`（时间）、`LocalDateTime`（日期时间）不可变且线程安全，取代线程不安全的 `SimpleDateFormat`。\n\n```java\nLocalDateTime now = LocalDateTime.now();\nLocalDateTime d = now.plusDays(3).minusHours(2);\nDateTimeFormatter f = DateTimeFormatter.ofPattern(\"yyyy-MM-dd HH:mm:ss\");\nString s = now.format(f);\nlong days = Duration.between(t1, t2).toDays();       // Period 用于日期差\n```\n\n- `Instant` 对应时间戳，`ZoneId` 处理时区，格式化线程安全可复用。\n\n## 🛠 动手实践\n\n### 任务 1：Shape 继承体系\n\n- 要求：抽象类 `Shape`（抽象方法 `double area()`、`double perimeter()`，实现 `toString` 输出面积周长）；接口 `Drawable`（`void draw()`）；子类 `Circle`、`Rectangle` 实现三者；用 `Shape[] shapes` 数组循环打印，体现多态。\n- 验收标准：`main` 中不出现 `Circle` 具体类型的 new（统一用 `Shape s = new Circle(2)` 声明）；新增 `Triangle` 子类时循环代码零改动。\n\n### 任务 2：订单状态枚举\n\n- 要求：把上面的 `OrderStatus` 补全——每个状态带一个 `nextStatus()` 返回下一个合法状态（终态返回自身），`main` 中模拟 `WAIT_PAY -> PAID` 流转。\n- 验收标准：switch/方法内不含魔法字符串；对 `CLOSED.nextStatus()` 返回自身有单测或打印验证；说出「为什么不用 int 常量 0/1/2 表达状态」。\n\n### 任务 3：BigDecimal 揭穿 double 的坑\n\n- 验收标准：写程序分别用 double 和 BigDecimal 计算 100 个 0.1 累加；输出 double 版本结果 `9.99999999999998`（或相近值）与 BigDecimal 版本 `10.0`；再加一段「金额 0.1 元乘以 3」演示四舍五入保留 2 位的正确写法。\n\n## 💼 高频面试题\n\n**Q：面向对象三大特性是什么？⭐**\n- 封装：隐藏内部细节，通过公开方法受控访问，降低耦合。\n- 继承：子类复用父类代码并扩展，Java 单继承，用 super 访问父类成员。\n- 多态：父类引用指向子类对象，运行时绑定调用子类重写方法，提高扩展性。\n- 每个特性最好跟一个自己项目/练习里的例子。\n\n**Q：接口和抽象类的区别？怎么选？⭐**\n- 抽象类：单继承、可有构造方法与成员变量、可含具体实现，表达 is-a、做模板复用。\n- 接口：多实现、成员全是 public static final 常量、Java 8 后可有 default/static 方法，表达 can-do、定义契约。\n- 选择：共享代码骨架用抽象类；定义能力/规范（尤其需要多继承效果）用接口；实践中常组合使用。\n\n**Q：== 和 equals 的区别？⭐**\n- `==`：基本类型比值，引用类型比地址。\n- `equals`：Object 默认实现就是 `==`；String、Integer 等类重写后比较内容。\n- 引用类型判相等一律用 equals；常量放前可防 NPE（`\"abc\".equals(s)`）。\n\n**Q：重写 equals 时为什么必须重写 hashCode？⭐**\n- 约定：equals 相等的两个对象 hashCode 必须相等。\n- HashSet/HashMap 先用 hashCode 定位桶，再用 equals 判重；只重写 equals 会导致两个「相等」对象被放进不同的桶，出现重复元素或 get 不到。\n- 反之 hashCode 相同不代表 equals 相等（允许哈希冲突）。\n\n**Q：String 为什么设计成不可变？⭐**\n- 常量池复用：相同字面量共享一个对象，节省内存。\n- 安全性：String 广泛用于类加载名、网络地址、文件路径等，不可变防止被恶意篡改。\n- 线程安全：不可变对象天然线程安全，可放心在多线程间共享。\n- hashCode 可缓存：String 重写了 hashCode 并缓存结果，适合做 HashMap 的 key。\n\n**Q：`Integer a = 127; Integer b = 127; a == b` 和 128 的版本结果分别是什么？⭐**\n- 127 为 true：`Integer.valueOf` 对 -128~127 返回缓存的同一对象。\n- 128 为 false：超出缓存范围 new 了新对象，地址不同。\n- 结论：包装类型比较一律用 equals，或先拆箱成 int 再比较。\n\n**Q：重写和重载的区别？**\n- 重写发生在父子类，方法签名相同，运行时决定调用哪个（多态基础）；访问权限不能更小、不能抛更宽的受检异常。\n- 重载发生在同一个类，方法名相同参数列表不同，编译期按实参静态匹配；与返回值无关。\n- 记忆：重写是同一个方法的不同实现，重载是同名方法的不同入口。\n\n**Q：BigDecimal 有哪些使用注意点？**\n- 构造用字符串或 `valueOf`，禁止传 double。\n- 除法指定 scale 和 RoundingMode，防止除不尽抛异常。\n- 比较数值用 compareTo 而非 equals（equals 连精度一起比）。\n\n## 🔗 推荐资料\n\n| 资料 | 说明 | 链接 |\n|---|---|---|\n| 廖雪峰 Java 面向对象 | 从类到包的完整 OOP 主线教程 | https://liaoxuefeng.com/books/java/oop/index.html |\n| pdai Java 基础-面向对象 | 三大特性、抽象类接口的体系化讲解 | https://pdai.tech/md/java/basic/java-basic-oop.html |\n| 廖雪峰 日期与时间 | java.time 详细用法与陷阱 | https://liaoxuefeng.com/books/java/datetime/index.html |\n| JavaGuide 基础面试题 | 本章面试题的标准答案与延伸 | https://javaguide.cn/java/basis/java-basic-questions-01.html |\n| 慕课网《Java入门第一季》 | 面向对象章节配套免费视频 | https://www.imooc.com/learn/85 |\n","ck":0},{"id":"f5","stage":1,"path":"01-入门篇/03-集合与泛型.md","title":"03-集合与泛型","md":"# 03-集合与泛型\n\n> **阶段**：入门篇 ｜ **建议时长**：5 天 ｜ **前置**：02-面向对象与核心类.md\n\n## 🎯 学习目标\n\n- 能默画集合框架总图：Collection（List/Set/Queue）与 Map 两棵树及常用实现类。\n- 能说清 ArrayList 扩容机制（1.5 倍）与 ArrayList vs LinkedList 的选型结论。\n- 能完整讲述 HashMap 的 put 流程、扩容、树化条件及 1.7 vs 1.8 差异。\n- 掌握泛型通配符与 PECS 原则，能解释类型擦除的表现。\n- 会用 Iterator 正确遍历删除，理解 fail-fast 机制。\n\n## 📖 核心知识点\n\n### ⭐集合框架总图\n\n面试官想听：你脑中有全局地图，能按「是否有序、是否可重复、是否线程安全」给常用类定位。\n\n```\nIterable\n └─ Collection\n     ├─ List（有序可重复）: ArrayList / LinkedList / Vector(旧)\n     ├─ Set（不重复）:      HashSet / LinkedHashSet / TreeSet\n     └─ Queue（队列）:      LinkedList / ArrayDeque / PriorityQueue\nMap（键值对，不属于 Collection）\n     ├─ HashMap / LinkedHashMap（保持插入序）/ TreeMap（按 key 排序）\n     └─ Hashtable(旧) / ConcurrentHashMap（并发）\n```\n\n- 存取定位口诀：要「按下标/顺序」用 List；要「去重」用 Set；要「key 查 value」用 Map；要「排队/FIFO」用 Queue。\n- **线程安全**：`Vector` 的方法都用 `synchronized` 修饰（所以\"下列集合中线程安全的是\"这类题选它）、`Hashtable` 同理；而 `ArrayList/HashMap/LinkedList` 等**常用实现类都不是线程安全的**（并发场景见 `ConcurrentHashMap`、`CopyOnWriteArrayList`）。注意 `Vector`/`Hashtable` 是早期遗留类，全表加锁性能差，现代并发场景**不推荐**，只是面试会考\"谁线程安全\"。\n\n### ⭐ArrayList 扩容机制\n\n面试官想听：说出默认容量 10、1.5 倍扩容、数组拷贝成本，以及为什么最好预估容量。\n\n- 底层是 `Object[] elementData`；`new ArrayList<>()` 初始为空数组，**首次 add 时才分配容量 10**。\n- 扩容：容量不足时 `newCapacity = oldCapacity + (oldCapacity >> 1)`，即 **1.5 倍**，通过 `Arrays.copyOf` 把旧数组复制到新数组，O(n)。\n- 大数据量场景用 `new ArrayList<>(expectedSize)` 指定初始容量，避免反复扩容拷贝。\n- 中间插入/删除需要 `System.arraycopy` 移动元素，平均 O(n)；随机访问 `get(i)` 直接下标寻址 O(1)。\n\n### ⭐ArrayList vs LinkedList\n\n面试官想听：别只背「一个数组一个链表」，重点在随机访问性能、内存局部性和 CPU 缓存友好度。\n\n| 维度 | ArrayList | LinkedList |\n|---|---|---|\n| 底层 | 动态数组 | 双向链表（Node 前/后指针） |\n| 随机访问 get(i) | O(1) | O(n) 需从头/尾遍历 |\n| 头部/中间增删 | O(n) 移动元素 | O(1) 找到节点即可 |\n| 内存 | 连续，缓存友好；有少量预留空间 | 每个节点额外两个引用，离散，缓存不友好 |\n| 实战结论 | **绝大多数场景首选** | 很少用；当队列/双端队列时优先 ArrayDeque |\n\n- 注意：LinkedList 的「增删快」仅指头尾；即使删中间找到了节点，ArrayList 批量移动在 CPU 缓存下常常更快。\n\n### Set 三兄弟\n\n- **HashSet**：基于 HashMap（元素作 key，共享 `PRESENT` 占位对象）；无序；`add` 依赖 `hashCode` + `equals` 去重。\n- **LinkedHashSet**：HashSet + 双向链表记录插入顺序，遍历按插入序，稍慢于 HashSet。\n- **TreeSet**：基于 TreeMap（红黑树），按 key 自然序或 `Comparator` 排序，增删查 O(log n)；元素必须可比较（实现 `Comparable` 或传入比较器）。\n- 去重自定义类必须同时重写 `equals` 和 `hashCode`，否则去重失效。\n\n### ⭐HashMap 用法与底层入门\n\n面试官想听：put 流程讲得完整、有条理，能带出树化、扩容、容量为 2 的幂三个子问题。\n\n- 结构（Java 8+）：**数组 + 链表 + 红黑树**；数组每个槽位叫桶（bucket）。\n- put 流程：计算 `hash(key)`（key 的 hashCode 高 16 位异或低 16 位，让散列更均匀）→ `(n-1) & hash` 定位桶 → 空桶直接放入 → 链表则尾插并逐个 equals 判重 → 链表长度 ≥ 8 且数组长度 ≥ 64 时**树化**为红黑树（查找 O(n) 降为 O(log n)）；树节点数 ≤ 6 退化为链表 → 插入后若 `size > capacity * 0.75` 触发扩容。\n- 扩容：容量翻倍（2 倍），重新分配元素；Java 8 中元素新位置要么在原下标 j，要么在 j + oldCap（高位 bit 决定），无需重新计算 hash。\n- 默认容量 16，负载因子 0.75，容量始终是 **2 的幂**。\n\n**为什么容量必须是 2 的幂？** 使 `(n-1) & hash` 等价于取模但更快（位运算），且 n-1 的二进制全 1 让散列分布均匀。\n\n**1.7 vs 1.8 的区别：**\n- 1.7：数组 + 链表，头插法；扩容后可能**环形链表**导致死循环（多线程下）；1.8 改尾插法避免。\n- 1.8 引入红黑树优化长链表；hash 计算从 4 次位运算+5 次异或简化为 1 次异或。\n- 1.7 先扩容后插入，1.8 先插入后扩容。\n\n### LinkedHashMap：插入序与 LRU\n\n- LinkedHashMap = HashMap + **双向链表**维护顺序，遍历顺序可控：\n  - `new LinkedHashMap<>()` 默认 `accessOrder=false`，按**插入顺序**遍历——想要「遍历 HashMap 时按插入序输出」，答案就是它。\n  - `new LinkedHashMap<>(16, 0.75f, true)` 传 `accessOrder=true` 后按**访问顺序**：每次 `get`/`put` 都会把该节点移到链表尾，**最久未访问的排在链表头**——这正是 LRU 的实现基础。\n- 配套钩子 **`removeEldestEntry(eldest)`**：默认返回 false；重写为 `return size() > capacity;` 后，每次插入新节点都会检查链表头（最久未用）是否该淘汰，**一行代码就是一个 LRU 缓存**（LeetCode 146 的常见解法）。想手写不依赖 LinkedHashMap 的版本，见[《03-算法刷题路线》](#/f/f34)的 LRU 模板。\n- 注意区别：`accessOrder=false` 时淘汰的是**最早插入**的（FIFO），不是最久未用的——用错了语义就变成 FIFO 缓存。\n\n### TreeMap 与 Comparator\n\n- TreeMap 按 key 排序（红黑树实现），支持 `firstKey()`、`ceilingKey()` 等导航方法。\n- 排序两种方式：元素实现 `Comparable`（自然序）或构造时传 `Comparator`（定制序）。\n\n```java\nlist.sort(Comparator.comparing(User::getAge)\n                    .thenComparing(User::getName)     // 多字段\n                    .reversed());                      // 降序\n```\n\n### Queue / Deque / PriorityQueue\n\n- `Queue`：`offer` 入队、`poll` 出队、`peek` 看队头（抛异常版本为 `add/remove/element`）。\n- `Deque` 双端队列：`addFirst/addLast/pollFirst/pollLast`；**用 ArrayDeque 代替 Stack 和 LinkedList 做栈/队列**。\n- `PriorityQueue` 小顶堆：`poll` 总是取最小元素（可传 Comparator 改大顶堆 `Comparator.reverseOrder()`），TopN 场景常用。\n\n### ⭐Iterator 与 fail-fast\n\n面试官想听：能解释 ConcurrentModificationException 的检测原理（modCount），并给出至少两种安全删除方案。\n\n- 遍历统一入口：`Iterator it = list.iterator(); while (it.hasNext()) { it.next(); }`。\n- **fail-fast（快速失败）**：集合内部维护 `modCount` 修改计数，迭代器创建时记录快照，每次 `next()` 校验 modCount 是否被改变，被改则抛 `ConcurrentModificationException`——这是「提前暴露 bug」的设计，不保证并发安全。\n\n### ⭐遍历时删除的正确姿势\n\n面试官想听：一开口就给出正确答案而不是 `list.remove()`。\n\n```java\n// 方式 1：迭代器的 remove（推荐，唯一会同步 modCount 的删除方式）\nIterator<String> it = list.iterator();\nwhile (it.hasNext()) {\n    if (it.next().startsWith(\"a\")) it.remove();\n}\n// 方式 2：removeIf（Java 8+，底层也是迭代器删除）\nlist.removeIf(s -> s.startsWith(\"a\"));\n// 方式 3：普通 for 按 i-- 倒序删除（下标法可行但易错）\n```\n\n- foreach 循环里直接 `list.remove(x)` 必抛 ConcurrentModificationException。\n- 并发场景改用 `CopyOnWriteArrayList` 或并发容器（文件 6）。\n\n### Collections / Arrays 工具与不可变集合\n\n- `Collections`：`sort`、`reverse`、`shuffle`、`max/min`、`unmodifiableList`（不可变视图）、`synchronizedList`（同步包装）。\n- `Arrays`：`asList` 返回**定长列表**（底层数组引用，不支持 add/remove，修改元素会影响原数组）。\n- Java 9+ `List.of/Set.of/Map.of` 创建真正不可变集合：不允许 null、任何修改抛 `UnsupportedOperationException`，适合常量表。\n\n### ⭐subList 是视图，不是拷贝\n\n- `list.subList(1, 3)` 返回的是原列表的**视图（view）**，不是新列表：**改视图即改原表**（`sub.set(0, x)` 会改到原 list；`sub.remove(...)` 也会连带删原表元素）。\n- 反向也成立：**原表结构性修改后，视图立即失效**，再访问它抛 `ConcurrentModificationException`。\n- 踩坑高发区：把 `subList` 结果当独立列表返回或缓存——调用方一改就污染原表。\n- **要副本必须显式拷贝**：`new ArrayList<>(list.subList(1, 3))`。\n- 同类视图还有：`Arrays.asList`（定长视图）、`keySet/values/entrySet`（Map 的视图）、`Collections.unmodifiableList`（只读视图）——判断标准都是\"它是原容器的窗口，还是独立存储\"。\n\n### 泛型\n\n- 泛型把类型检查提前到编译期：`List<String> list = new ArrayList<>();`（菱形推断）。\n- 泛型类 `class Box<T>`、泛型方法 `<T> T pick(T... a)`、泛型接口，命名习惯 T/E/K/V/R。\n\n### ⭐通配符与 PECS\n\n面试官想听：知道 `? extends` 与 `? super` 各限制什么，并说出 Producer Extends, Consumer Super。\n\n```java\nList<? extends Number> producer = List.of(1, 2.0); // 只能读出 Number，不能写入\nList<? super Integer> consumer = new ArrayList<Number>(); // 只能写入 Integer，读出为 Object\nstatic void copy(List<? extends T> src, List<? super T> dst) // JDK Collections.copy 原型\n```\n\n- PECS：参数是生产者（只读出来用）用 `extends`；是消费者（要往里写）用 `super`。\n- `List<String>` 与 `List<Object>` 没有任何继承关系，没有通配符就无法互相赋值。\n\n### ⭐类型擦除\n\n面试官想听：泛型只存在于编译期，运行时全是原始类型；知道后果比背定义重要。\n\n- 编译后 `List<String>` 与 `List<Integer>` 都是 `List`，T 被替换为上边界（无边界则为 Object），调用处由编译器插入强制转换。\n- 后果：不能 `new T()`、不能 `T.class`、不能 `new T[]`、不能对泛型类型用 instanceof；运行时获取泛型参数需借助 `getGenericSuperclass` 等反射手段（框架常用）。\n- 验证：`new ArrayList<String>().getClass() == new ArrayList<Integer>().getClass()` 为 true。\n\n## 🛠 动手实践\n\n### 任务 1：Map 统计词频\n\n```java\nMap<String, Integer> count = new HashMap<>();\nfor (String w : words) {\n    count.merge(w, 1, Integer::sum);   // 等价于 get+判空+put\n}\ncount.entrySet().stream()\n     .sorted(Map.Entry.<String, Integer>comparingByValue().reversed())\n     .limit(3).forEach(e -> System.out.println(e.getKey() + \"=\" + e.getValue()));\n```\n\n- 验收标准：对一段中文/英文文本输出 Top3 词频；使用 `merge` 或 `getOrDefault` 而不是 if-else 嵌套；说出 TreeMap 方案的另一种写法。\n\n### 任务 2：Comparator 多字段排序\n\n- 要求：定义 `Student(id, name, score, age)`，实现先按 score 降序、同分按 age 升序、再同按 name 字典序。\n- 验收标准：仅用 `Comparator.comparing().thenComparing()` 链式实现，不写 compare 方法；对构造的同分数据验证次序正确。\n\n### 任务 3：模拟购物车\n\n- 要求：`Cart` 内部用 `LinkedHashMap<String, CartItem>`（key=商品编号），支持添加（数量累加）、修改数量、删除、计算总价（BigDecimal）、按加入顺序打印。\n- 验收标准：重复添加同一商品时数量合并而不是重复条目；总价用 BigDecimal 精确到 2 位；演示一次 `List.of`/`Map.of` 不可变集合在常量商品目录中的应用。\n\n## 💼 高频面试题\n\n**Q：ArrayList 和 LinkedList 的区别？怎么选？⭐**\n- ArrayList 动态数组：get/set O(1)；尾部均摊 O(1)；中间插删 O(n)；内存连续、缓存友好。\n- LinkedList 双向链表：头尾插删 O(1)；随机访问 O(n)；每个节点多两个引用，内存开销大。\n- 结论：绝大多数场景选 ArrayList；做队列/双端队列优先 ArrayDeque。LinkedList 很少是正确答案。\n\n**Q：讲一下 HashMap 的 put 流程。⭐**\n- 计算 hash（高 16 位异或低 16 位），`(n-1) & hash` 定位桶。\n- 空桶直接新建节点；是链表则尾插并 equals 判重替换；是红黑树则按树插入。\n- 链表长度达 8 且数组容量 ≥ 64 时树化，≤ 6 退化回链表。\n- 插入后 size 超过 `容量 × 0.75` 触发 2 倍扩容并 rehash（新位置为原下标或原下标+旧容量）。\n\n**Q：为什么 HashMap 容量是 2 的幂？⭐**\n- 使 `(n-1) & hash` 与 `hash % n` 等价但只需一次位运算，性能更高。\n- n-1 二进制为连续 1，与运算能让 hash 的每一位都参与散列，分布更均匀，减少冲突。\n- 指定初始容量为非 2 的幂时，tableSizeFor 会向上取整到最近的 2 的幂。\n\n**Q：HashMap 1.7 和 1.8 有什么区别？⭐**\n- 结构：1.7 数组+链表；1.8 数组+链表+红黑树（长链表查找 O(n)→O(log n)）。\n- 插入：1.7 头插，多线程扩容可能形成环形链表死循环；1.8 改尾插。\n- 扩容时机与 hash 计算也做了简化优化；1.8 rehash 时只需判断新增高位 bit，不用重新算 hash。\n\n**Q：HashSet 是如何保证元素不重复的？⭐**\n- 底层就是 HashMap，元素作为 key，value 是共享的 PRESENT 占位对象。\n- add 时先比较 hashCode 定位，再用 equals 判等，两者都「相同」才认定重复。\n- 所以自定义类放入 HashSet 必须重写 equals 和 hashCode，且两个方法逻辑要一致。\n\n**Q：什么是 fail-fast？怎么在遍历时安全删除元素？⭐**\n- fail-fast：迭代时检测到集合结构性被修改（modCount 变化）立即抛 ConcurrentModificationException，防止不确定行为。\n- 单线程安全删除：用 `iterator.remove()` 或 Java 8 的 `removeIf`。\n- foreach 中直接 remove 是错误姿势；多线程环境应使用并发容器或加锁。\n\n**Q：什么是 PECS 原则？**\n- Producer Extends：只读取数据的生产者参数用 `? extends T`；Consumer Super：只写入数据的消费者参数用 `? super T`。\n- `Collections.copy(List<? super T> dst, List<? extends T> src)` 是标准范例。\n- 目的：在保证类型安全的前提下让 API 接受尽可能宽的参数类型。\n\n**Q：类型擦除是什么？带来哪些限制？**\n- 泛型信息只在编译期用于类型检查，编译后擦除为上边界（默认 Object），运行时插入强转。\n- 限制：运行时无法 new T()、取 T.class、instanceof 泛型类型。\n- 框架通过反射的 getGenericXXX 接口在字节码签名（Signature）里仍能拿到泛型声明。\n\n## 🔗 推荐资料\n\n| 资料 | 说明 | 链接 |\n|---|---|---|\n| 廖雪峰 Java 集合 | Collection/Map 主线教程，配套练习多 | https://liaoxuefeng.com/books/java/collection/index.html |\n| 廖雪峰 Java 泛型 | 泛型、通配符、擦除的通俗讲解 | https://liaoxuefeng.com/books/java/generics/index.html |\n| pdai 集合框架 | 全家桶结构图 + 底层源码分析 | https://pdai.tech/md/java/collection/java-collection-all.html |\n| JavaGuide 集合面试题 | HashMap/ConcurrentHashMap 面试专题 | https://javaguide.cn/java/collection/java-collection-questions-01.html |\n","ck":0},{"id":"f6","stage":1,"path":"01-入门篇/04-异常-IO-反射-注解.md","title":"04-异常-IO-反射-注解","md":"# 04-异常-IO-反射-注解\n\n> **阶段**：入门篇 ｜ **建议时长**：4 天 ｜ **前置**：02-面向对象与核心类.md\n\n## 🎯 学习目标\n\n- 能默画异常体系图（Throwable → Error/Exception → Checked/Unchecked）并正确选择受检/非受检异常。\n- 会用 try-with-resources 管理资源，能解释 finally 的执行时机与吞异常的危害。\n- 会用字节缓冲流拷贝文件并用 `System.nanoTime` 对比性能。\n- 掌握获取 Class 的三种方式与反射读写字段、调用方法，能写一个 JDK 动态代理 demo。\n- 能定义注解并用反射编写一个「模拟 @Test」的注解执行器。\n\n## 📖 核心知识点\n\n### ⭐异常体系图\n\n面试官想听：先画层级，再答「受检异常编译器强制处理、运行时异常交给程序员」这条主线。\n\n```\nThrowable\n ├─ Error（严重错误，程序无法处理）: OutOfMemoryError / StackOverflowError\n └─ Exception\n     ├─ Checked 受检异常（编译期强制 try-catch 或 throws）\n     │    IOException / SQLException / ClassNotFoundException\n     └─ RuntimeException（Unchecked 非受检）\n          NullPointerException / ArrayIndexOutOfBoundsException\n          ClassCastException / ArithmeticException / IllegalArgumentException\n```\n\n- Error 与 RuntimeException 及其子类无需强制捕获；其他 Exception 必须显式处理。\n- 编译时异常 vs 运行时异常：受检异常调用方必须面对；运行时异常通常是程序 bug，应修代码而不是到处 catch。\n\n### try-catch-finally 与 try-with-resources\n\n```java\ntry (FileInputStream in = new FileInputStream(\"a.txt\")) {   // 自动 close，无需 finally\n    // 业务\n} catch (FileNotFoundException e) {          // 从小到大捕获，子类在前\n    log.error(\"文件不存在\", e);               // 必须携带原始异常\n} finally {\n    // 一定执行（除 System.exit/进程被杀），用于释放非 AutoCloseable 资源\n}\n```\n\n- 多类型 catch：`catch (IOException | SQLException e)`；`finally` 中 return 会吞掉 try 中的返回值和异常——**禁止在 finally 写 return**。\n- **try-with-resources**（Java 7+）：资源类实现 `AutoCloseable`，编译器自动生成 close 调用，异常抑制机制保留原始异常（`getSuppressed()`），优先于手写 finally 关闭。\n\n### 自定义异常与不要吞异常\n\n```java\npublic class BizException extends RuntimeException {      // 业务异常继承 RuntimeException\n    private final int code;\n    public BizException(int code, String message) {\n        super(message);\n        this.code = code;\n    }\n    public int getCode() { return code; }\n}\n```\n\n- 业务代码统一用非受检自定义异常（带错误码），在全局层（如 Spring 的 @ControllerAdvice）兜底转换成响应。\n- **吞异常反模式**：`catch (Exception e) {}` 或只 `e.printStackTrace()`——排障时线索全丢；正确做法是记录日志（带堆栈）后向上抛出或转换为业务异常。\n- 不要用异常做流程控制；捕获范围尽量精确。\n\n### IO：File 与流分类\n\n- `File` 表示路径：`exists()`、`createNewFile()`、`mkdirs()`、`delete()`、`listFiles()`；Java 11+ 推荐 `Path`/`Files`。\n- 四个抽象基类（按「输入/输出 × 字节/字符」）：`InputStream`/`OutputStream`/`Reader`/`Writer`。\n- 字节流适合一切二进制（图片、视频）；字符流适合文本（自动处理编码）；缓冲流包装原始流减少系统调用：\n\n```java\ntry (BufferedInputStream bis = new BufferedInputStream(new FileInputStream(src), 8192);\n     BufferedOutputStream bos = new BufferedOutputStream(new FileOutputStream(dest))) {\n    byte[] buf = new byte[8192];\n    int len;\n    while ((len = bis.read(buf)) != -1) bos.write(buf, 0, len);\n}\n```\n\n- 编码：`new InputStreamReader(in, StandardCharsets.UTF_8)` 显式指定，避免平台默认编码差异。\n\n### ⭐序列化：Serializable 与 serialVersionUID\n\n面试官想听：知道 serialVersionUID 的作用（版本兼容校验）和不写的后果，以及 transient 关键字。\n\n- 实现标记接口 `Serializable` 后，可用 `ObjectOutputStream.writeObject` 持久化/传输对象，`ObjectInputStream.readObject` 反序列化。\n- **serialVersionUID**：类的版本号；反序列化时若流中的版本号与当前类不一致抛 `InvalidClassException`。不显式声明时 JVM 自动生成，类一改动就变化，导致旧数据无法反序列化——**必须显式写 `private static final long serialVersionUID = 1L;`**。\n- `transient` 修饰的字段不参与序列化（如密码）；`static` 字段属于类也不序列化。\n- 静态成员变量不参与序列化（属于类不属于对象）；子类实现序列化时父类字段需父类也可序列化或有无参构造。\n\n### Files 工具类（Java 7+ NIO.2）\n\n- 一行流式 API 替代手工流：`Files.readAllLines(Path)`、`Files.writeString`、`Files.copy(src, dest, REPLACE_EXISTING)`、`Files.walk` 遍历目录树。\n- 大文件仍应使用缓冲流分块读取，`readAllBytes` 会把整个文件读入内存。\n\n### 反射\n\n- 运行时动态获取类信息并操作（构造、字段、方法），是 Spring/Swagger/序列化框架的基石。\n\n```java\n// 三种获取 Class 的方式（同一份 Class 对象）\nClass<?> c1 = Class.forName(\"com.demo.User\");   // 全限定名，最常用\nClass<?> c2 = User.class;                        // 编译期已知类\nClass<?> c3 = user.getClass();                   // 已有实例\n\nObject u = c1.getDeclaredConstructor().newInstance();\nField field = c1.getDeclaredField(\"name\");\nfield.setAccessible(true);                       // 突破 private（关闭安全检查）\nfield.set(u, \"Tom\");\nMethod m = c1.getMethod(\"sayHello\", String.class);\nm.invoke(u, \"hi\");\n```\n\n- 优点：解耦、支持「配置驱动」的通用框架；缺点：性能低于直接调用、绕过编译期检查、破坏封装。\n- 无法访问被安全管理器限制的成员（`setAccessible` 在模块化下可能受限）。\n\n### ⭐JDK 动态代理\n\n面试官想听：说出「运行时生成接口实现类、方法调用转发给 InvocationHandler」，以及它只能代理接口这个限制。\n\n```java\ninterface UserService { void save(String name); }\n\npublic class LogHandler implements InvocationHandler {\n    private final Object target;                       // 被代理对象\n    public LogHandler(Object target) { this.target = target; }\n    @Override\n    public Object invoke(Object proxy, Method method, Object[] args) throws Throwable {\n        System.out.println(\"before \" + method.getName());   // 增强逻辑\n        Object result = method.invoke(target, args);        // 反射调用原方法\n        System.out.println(\"after\");\n        return result;\n    }\n}\nUserService proxy = (UserService) Proxy.newProxyInstance(\n        UserService.class.getClassLoader(), new Class[]{UserService.class},\n        new LogHandler(new UserServiceImpl()));\nproxy.save(\"Tom\");     // before -> 原逻辑 -> after\n```\n\n- 这是 AOP 的底层原理：把「日志、事务」等横切逻辑与业务解耦。\n\n### ⭐注解与元注解\n\n面试官想听：注解本身不做任何事，「注解 + 反射读取」才构成机制；能现场写一个自定义注解。\n\n```java\n@Retention(RetentionPolicy.RUNTIME)     // 保留到运行期（反射可读）\n@Target(ElementType.METHOD)             // 只能标注在方法上\npublic @interface MyTest {              // 模拟 JUnit 的 @Test\n    int times() default 1;              // 带默认值的属性\n}\n```\n\n- 元注解：`@Retention`（SOURCE/CLASS/RUNTIME 三档保留期）、`@Target`（可用位置）、`@Documented`、`@Inherited`、`@Repeatable`。\n- 解析：`Method#getAnnotation(MyTest.class)` 返回 null 表示未标注；反射调用标注的方法即实现「注解驱动」。\n\n```java\nfor (Method m : cls.getDeclaredMethods()) {\n    MyTest t = m.getAnnotation(MyTest.class);\n    if (t != null) for (int i = 0; i < t.times(); i++) m.invoke(instance);\n}\n```\n\n## 🛠 动手实践\n\n### 任务 1：自定义业务异常体系\n\n- 要求：定义 `BizException`（含 code）与子类 `OrderNotFoundException`；写 `findOrder(int id)` 模拟 id<0 抛运行时异常、查不到抛业务异常；main 中分层 catch 并打印错误码与消息。\n- 验收标准：无 `catch (Exception e) {}` 空捕获；日志输出包含完整堆栈；能口头说出「为什么业务异常选 RuntimeException 而不是 IOException 那类受检异常」。\n\n### 任务 2：缓冲流拷贝性能对比\n\n- 要求：生成一个 ≥ 10MB 的文件；分别用「单字节 read/write」「8KB 缓冲数组」「BufferedInputStream/OutputStream」三种方式拷贝，`System.nanoTime()` 计时。\n- 验收标准：三组耗时打印成对比表格（预期缓冲数组与缓冲流快一个数量级以上）；全部使用 try-with-resources；能解释缓冲快的原因（减少系统调用次数）。\n\n### 任务 3：自定义注解执行器（模拟 @Test）\n\n- 要求：定义 `@MyTest(times)`；写一个类包含 3 个方法，其中 2 个标注注解；编写 `runTests(Class<?>)` 用反射扫描并执行标注方法，执行结果打印「方法名 通过/异常」。\n- 验收标准：新增/删除注解方法时执行器代码零改动；一个方法抛异常不影响其他方法执行；能说出 @Retention 必须是 RUNTIME 的原因。\n\n### 任务 4（可选）：JDK 动态代理增强\n\n- 验收标准：基于任务 3 的类生成代理，为所有 public 方法自动加耗时统计；打印结果包含方法名与纳秒耗时；能说明「为什么 Proxy 要求传 Class[] 接口」。\n\n## 💼 高频面试题\n\n**Q：Error 和 Exception 的区别？⭐**\n- 都继承 Throwable；Error 是 JVM 层面的严重错误（OutOfMemoryError、StackOverflowError），程序不应也不必捕获。\n- Exception 是程序可以处理的异常情况。\n- Exception 再分受检（编译器强制处理，如 IOException）与非受检 RuntimeException（如 NPE，通常靠改进代码避免）。\n\n**Q：受检异常和非受检异常怎么选？**\n- 调用方「可以恢复/必须处理」的外部故障用受检异常（IO、SQL），编译器兜底。\n- 程序 bug 或业务错误用 RuntimeException，避免到处 throws 污染方法签名。\n- 业务系统常见做法：统一 RuntimeException 子类 + 全局异常处理器。\n\n**Q：final、finally、finalize 的区别？⭐**\n- final：修饰符——类不可继承、方法不可重写、变量值/指向不可变。\n- finally：try 块的收尾代码，保证资源释放（现在更多用 try-with-resources）。\n- finalize：Object 的方法，GC 回收前的回调，执行时机不确定且已被 Java 9 标记 @Deprecated，资源释放不要依赖它。\n\n**Q：反射是什么？优缺点和应用场景？⭐**\n- 反射让程序在运行时获取类的结构（构造器/字段/方法）并动态调用。\n- 优点：解耦、通用化，支持配置驱动和插件化；缺点：有性能开销、绕过编译期检查、破坏封装。\n- 应用：Spring 的 IoC 依配置反射创建 Bean、MyBatis 结果映射、Jackson 序列化、各类注解处理。\n\n**Q：JDK 动态代理和 CGLIB 的区别？⭐**\n- JDK 动态代理：JDK 内置，基于接口——运行时生成接口实现类，转发到 InvocationHandler；目标类必须实现接口。\n- CGLIB：第三方库，基于继承——运行时生成目标类的子类覆写方法（final/private 方法无法代理）。\n- Spring AOP：目标有接口时默认用 JDK 代理（Spring Boot 2.x 起默认统一 CGLIB，可通过配置切换）。\n\n**Q：serialVersionUID 有什么用？不写会怎样？**\n- 反序列化时校验发送方与接收方的类版本是否兼容；不一致抛 InvalidClassException。\n- 不写时 JVM 根据类结构自动计算，任何改动（加字段/改方法）都会导致旧数据无法反序列化。\n- 显式声明固定值可让类演进时旧序列化数据仍可读。\n\n**Q：try-with-resources 相比 try-finally 好在哪？**\n- 自动生成 close，代码更简洁，不会忘记关闭。\n- 多个资源逆序关闭；异常抑制机制通过 getSuppressed 保留 close 抛出的次要异常，而手写 finally 可能覆盖主异常。\n\n## 🔗 推荐资料\n\n| 资料 | 说明 | 链接 |\n|---|---|---|\n| 廖雪峰 Java 异常处理 | 异常主线教程，含自定义异常 | https://liaoxuefeng.com/books/java/exception/index.html |\n| 廖雪峰 Java IO | 流、序列化与 Files 用法 | https://liaoxuefeng.com/books/java/io/index.html |\n| 廖雪峰 Java 反射 | Class 对象与访问字段方法 | https://liaoxuefeng.com/books/java/reflection/index.html |\n| 廖雪峰 Java 注解 | 元注解与注解处理原理 | https://liaoxuefeng.com/books/java/annotation/index.html |\n| JavaGuide IO 基础 | 流分类与序列化面试要点 | https://javaguide.cn/java/io/io-basis.html |\n","ck":0},{"id":"f7","stage":1,"path":"01-入门篇/05-Lambda-Stream与Java8新特性.md","title":"05-Lambda-Stream与Java8新特性","md":"# 05-Lambda-Stream与Java8新特性\n\n> **阶段**：入门篇 ｜ **建议时长**：3 天 ｜ **前置**：03-集合与泛型.md\n\n## 🎯 学习目标\n\n- 会写 Lambda 与方法引用，能说出「函数式接口 = 一个抽象方法的接口」这一本质。\n- 掌握 Function/Consumer/Supplier/Predicate 四大内置接口的输入输出方向。\n- 能用 Stream 完成过滤、映射、排序、分组统计、TopN、去重全流程。\n- 会正确使用 Optional 链式取值，避免 `get()` 反模式。\n- 能按版本脉络说出 Java 9/11/17/21 的代表性新特性。\n\n## 📖 核心知识点\n\n### Lambda 表达式\n\n- 本质：**函数式接口（只有一个抽象方法的接口）的实例**；`@FunctionalInterface` 注解用于声明与校验。\n- 语法：`(参数) -> 表达式` 或 `(参数) -> { 语句块; return x; }`；单参数可省括号，无参必须 `()`。\n\n```java\nRunnable r = () -> System.out.println(\"run\");\nComparator<Integer> cmp = (a, b) -> a - b;              // 建议用 Integer.compare\nlist.forEach(x -> System.out.println(x));\n```\n\n- Lambda 只能访问 **effectively final**（实际不变）的局部变量——因为局部变量在线程栈上，Lambda 可能被异步执行，捕获引用会引发并发问题；成员变量/静态变量可以修改。\n- 匿名内部类能表达多方法接口，Lambda 只服务函数式接口；this 语义也不同（Lambda 中 this 指外围对象）。\n\n### ⭐四大内置函数式接口\n\n面试官想听：能用「输入输出」一句话区分四个接口，并举出各自在 Stream 里的对应方法。\n\n| 接口 | 抽象方法 | 语义 | Stream 中的对应 |\n|---|---|---|---|\n| `Function<T,R>` | `R apply(T t)` | 输入 T 输出 R（转换） | `map` |\n| `Consumer<T>` | `void accept(T t)` | 输入 T 无返回（消费） | `forEach`、`peek` |\n| `Supplier<T>` | `T get()` | 无输入输出 T（生产） | `collect(Supplier, ...)`、`Stream.generate` |\n| `Predicate<T>` | `boolean test(T t)` | 输入 T 返回布尔（判断） | `filter` |\n\n- **Predicate 的组合方法**：`p.and(q)`、`p.or(q)`、`p.negate()` 返回新的 Predicate，可就地拼装复杂条件，如 `list.removeIf(s -> s.isBlank().negate())` 等价于保留非空白项。注意 `p.negate().and(p)` 恒为 false（同一判定与其取反互斥，任何输入都不可能同时成立）——这类\"逻辑组合推演\"是选择题常客。\n\n- 变体：`BiFunction<T,U,R>`、`UnaryOperator<T>`、`IntPredicate` 等针对基本类型的特化版（避免装箱）。\n\n### 方法引用\n\n- Lambda 的简写，四种形式：\n\n```java\nlist.forEach(System.out::println);          // 对象::实例方法\nlist.sort(Integer::compare);                // 类::静态方法\nmap.replaceAll(String::concat);             // 类::实例方法（第一个参数作为调用者）\nSupplier<List<String>> s = ArrayList::new;  // 类::new 构造引用\n```\n\n- 优先用方法引用让代码更短，但以可读为先。\n\n### Stream：创建与惰性求值\n\n- 创建：`list.stream()`、`Arrays.stream(arr)`、`Stream.of(...)`、`Stream.generate/infinite`、`Files.lines(path)`（读文件行）。\n- 操作分两类：**中间操作惰性**（filter/map/sorted/limit/distinct/peek，返回新 Stream，不执行）与**终端操作触发**（forEach/collect/count/reduce/anyMatch，一次消费后流关闭）。\n- 不调用终端操作，中间操作永远不执行——验证方式：只写 `stream().map(x -> x * 2)` 不收集，无任何输出。\n\n### ⭐map / filter / sorted / collect / groupingBy\n\n面试官想听：groupingBy + count/partitioningBy 是业务统计的高频写法，能直接上代码。\n\n```java\nList<Order> orders = ...;\n// 过滤 + 映射 + 收集\nList<String> names = orders.stream()\n        .filter(o -> o.getAmount() > 100)\n        .sorted(Comparator.comparing(Order::getAmount).reversed())\n        .limit(3)                                   // TopN\n        .map(Order::getUser)                        // 一对一转换\n        .map(User::getName)\n        .collect(Collectors.toList());              // Java 16+ 可直接 .toList()\n\n// 分组统计\nMap<String, Long> cnt = orders.stream()\n        .collect(Collectors.groupingBy(Order::getStatus, Collectors.counting()));\nMap<String, Double> sum = orders.stream()\n        .collect(Collectors.groupingBy(Order::getStatus,\n                 Collectors.summingDouble(Order::getAmount)));   // 分组求和\n\n// 分区（按条件二分）\nMap<Boolean, List<Order>> parts = orders.stream()\n        .collect(Collectors.partitioningBy(o -> o.getAmount() > 100));\n\n// 去重与扁平化\nList<Integer> distinct = list.stream().distinct().collect(Collectors.toList());\nList<String> chars = words.stream().map(w -> w.split(\"\"))\n        .flatMap(Arrays::stream).distinct().collect(Collectors.toList());\n```\n\n- `reduce` 聚合：`Optional<Integer> sum = nums.stream().reduce(Integer::sum);` 带初值版本返回具体值。\n- **`groupingBy` 的默认返回类型**：两参版本 `groupingBy(classifier)` 默认返回 **`HashMap`，且每个分组的值默认是 `List`**（下游收集器默认 `toList()`）。要保序用三参版本传 `LinkedHashMap::new`；要改下游聚合传 `counting()/summingDouble()/mapping()`。同理 `toMap` 的默认实现也是 HashMap。\n- 数值流避免装箱：`mapToInt(Order::getAmount).sum()/average()/summaryStatistics()`。\n- `collect` 到 Map：`Collectors.toMap(Order::getId, o -> o)`；**value 为 null 或 key 重复会抛异常**，需传合并函数：`toMap(k, v, (a, b) -> a)`。\n\n### ⭐map vs flatMap\n\n面试官想听：一对一是 map，一对多打散合并是 flatMap——各给一个例子。\n\n- `map`：一对一转换，`Stream<Stream<R>>` 仍是嵌套结构；例：`map(String::length)` 得到长度流。\n- `flatMap`：把每个元素转换成流后**压平**合并；例：把句子流拆成单词流、把多层数组拍平。\n- 记忆：flatMap = map + flatten（扁平化）。\n\n### ⭐并行流注意点\n\n面试官想听：知道它底层是 ForkJoinPool 公共池，能说出何时不用。\n\n- `list.parallelStream()` 把任务切分后多线程处理再合并；底层使用 **ForkJoinPool.commonPool()**，与全局共享，一个慢任务会拖累整个 JVM 的并行流。\n- 适用：**数据量大（万级以上）+ 无状态 + 可无序 + CPU 密集**；ArrayList 数组切分高效，LinkedList/Iterator 源切分代价大。\n- 陷阱：操作里修改共享变量会出并发问题；I/O 阻塞任务别用；默认排序 `forEach` 顺序不保证；小数据量并行反而更慢（拆分与合并开销）。\n\n### ⭐Optional 正确用法\n\n面试官想听：Optional 是「返回类型语义化」工具（可能为空），不是万能判空器。\n\n```java\nOptional<User> opt = repository.findByName(name);          // 方法返回 Optional 表示可能为空\nString city = opt.map(User::getAddress)                    // 值存在则转换\n                 .map(Address::getCity)                    // 链式穿透多层判空\n                 .orElse(\"unknown\");                       // 为空给默认值\nString v = opt.orElseGet(() -> loadDefault());             // 默认值昂贵时用 orElseGet（惰性）\nopt.orElseThrow(() -> new BizException(404, \"未找到\"));     // 为空抛业务异常\n```\n\n- 正确姿势：作为方法返回值；用 `map/flatMap/filter` 链式处理；`ifPresent(u -> ...)` 替代 isPresent+get。\n- 反模式：`opt.get()` 不判空直接取、把 Optional 做字段/入参、`Optional.of(null)`（会 NPE，可空用 `ofNullable`）。\n\n### 接口默认方法\n\n- Java 8 允许接口有 `default` 方法与 `static` 方法：不破坏已有实现类即可给接口加新能力（如 `Collection.stream()`、`Comparator.reversed()`）。\n- 类优先原则：同时继承父类方法和实现接口 default 方法时，父类方法优先；冲突的接口 default 必须显式 `A.super.m()`。\n\n### ⭐java.time 与版本脉络\n\n面试官想听：知道 SimpleDateFormat 的线程安全问题，以及近年版本的一句话定位。\n\n```java\nLocalDateTime now = LocalDateTime.now();\nString s = now.format(DateTimeFormatter.ofPattern(\"yyyy-MM-dd HH:mm:ss\"));  // 线程安全\nLocalDateTime d = LocalDateTime.parse(\"2026-01-15T10:30\", DateTimeFormatter.ISO_LOCAL_DATE_TIME);\nlong between = ChronoUnit.DAYS.between(now, d);            // 间隔天数\n```\n\n| 版本 | 关键特性（一句话） |\n|---|---|\n| Java 8 | Lambda/Stream/Optional/接口默认方法/java.time |\n| Java 9 | 模块化 JPMS、集合工厂方法 List.of、jshell |\n| Java 11（LTS） | HttpClient 标准 HTTP 客户端、var 局部变量（Java 10 引入）、String 新方法 |\n| Java 14+ | switch 表达式、文本块 `\"\"\"`（13+）、instanceof 模式匹配（16+）、record 不可变数据类（16+） |\n| Java 17（LTS） | sealed 密封类（限定继承体系）、RandomGenerator、更强 G1 |\n| Java 21（LTS） | **虚拟线程**正式发布（轻量级并发，见文件 6）、模式匹配 switch、结构化并发预览 |\n| Java 25（LTS，2025.9） | 稳定 generational ZGC、分代 G1 默认、Server-Sent Events 客户端、更多模式匹配语法糖；新项目选型推荐 |\n\n- 选型口径：**存量项目 8 最多、新立项 17 起步、追新选 25（LTS）**；Spring Boot 3.x 要求 Java 17+，Spring Boot 4.0（2025.11 发布）基于 Spring Framework 7 并优先支持 Java 21/25。\n\n- `var` 只用于局部变量且必须有初始值，可读性优先；`record` 一行定义不可变 DTO：`record Point(int x, int y) {}` 自动生成构造/访问器/equals/hashCode。\n\n## 🛠 动手实践\n\n### 任务 1：订单列表统计三连\n\n- 要求：构造 20 条订单（用户、金额、状态、日期），分别用 Stream 完成：① 按状态分组统计条数与金额总和；② 金额 Top3 的订单号列表；③ 所有状态为 PAID 的用户去重（`distinct` 或 `toSet`）。\n- 验收标准：三问均一条 Stream 表达式完成（不超过 3 行）；TopN 用 `sorted().limit()`；分组用 `groupingBy` 组合 `counting`/`summingDouble`；对比 traditional for 循环版本的行数差异。\n\n### 任务 2：Optional 链式取值\n\n- 要求：`Order -> User -> Address -> City` 的多层嵌套对象，用 Optional 一行取出 city，任一层为 null 返回 `\"unknown\"`；再写一个「为空则抛 BizException」的版本。\n- 验收标准：全程无显式 if (x != null)；故意置空中间对象验证不抛 NPE；能解释为什么不用 `Optional` 做字段。\n\n### 任务 3：LocalDateTime 格式化练习\n\n- 要求：把 `LocalDateTime.now()` 格式化为 `yyyy/MM/dd HH:mm`；解析字符串 `\"2026-01-15 10:30:00\"`；计算距今的天数；把日期列表格式化后输出。\n- 验收标准：`DateTimeFormatter` 定义为 static final 复用；无 SimpleDateFormat 出现；能说出 SimpleDateFormat 非线程安全的后果（数据错乱/异常）。\n\n## 💼 高频面试题\n\n**Q：Java 8 有哪些新特性？⭐**\n- Lambda 表达式与函数式接口（Function/Consumer/Supplier/Predicate）。\n- Stream API 声明式集合处理，接口 default/static 方法。\n- Optional、新的日期时间 API java.time（不可变、线程安全）。\n- 方法引用、`HashMap` 红黑树优化、`MetaSpace` 取代永久代。\n- 能结合自己最常用的（如 Stream 分组统计）展开一句。\n\n**Q：map 和 flatMap 的区别？⭐**\n- map：一对一，把每个元素转换成另一个元素，结果可能嵌套。\n- flatMap：一对多转换后扁平化合并成一个流，常用于「拆分/展开」场景。\n- 例：`map(this::splitToWords)` 得到 `Stream<List<String>>`；`flatMap` 直接得到 `Stream<String>`。\n\n**Q：Optional 解决什么问题？怎么正确使用？⭐**\n- 用类型系统表达「可能为空」，把 NPE 从运行时提前到编译期提示，减少层层判空。\n- 正确用法：作为返回值；`map/flatMap/filter` 链式取值；`orElse/orElseGet/orElseThrow` 处理缺省。\n- 反模式：直接 get()、用作字段或方法参数、of(null)。\n\n**Q：常见的函数式接口有哪些？**\n- Function<T,R> 转换、Consumer<T> 消费、Supplier<T> 生产、Predicate<T> 断言。\n- 二元版本 BiFunction/BinaryOperator、基本类型特化 IntStream 相关。\n- 在 Stream 中的对应：map/filter/forEach/collect(Supplier)。\n\n**Q：Stream 和 for 循环谁性能好？**\n- 小数据量下 for 循环更快（Stream 有 lambda 调用与装箱开销，数值流可缓解）。\n- Stream 的价值在可读性、可组合、易并行（parallelStream），万级以上数据且 CPU 密集时并行流可能有优势。\n- 面试结论：性能敏感的紧密循环用 for；业务数据处理优先 Stream，瓶颈时再测再换。\n\n**Q：并行流有哪些注意事项？**\n- 底层共用 ForkJoinPool.commonPool，任务被全局共享，不适合阻塞/I/O 任务。\n- 操作必须无状态、无副作用，不要在 lambda 里改共享集合。\n- 数据量小、LinkedList 源、依赖顺序的场景都不适合。\n\n**Q：var 和 record 是干什么的？**\n- var：局部变量类型推断，类型由右侧推断，仅限局部变量，提高可读性不改运行时行为。\n- record：不可变数据载体，一行声明自动生成构造器、getter、equals/hashCode/toString，适合 DTO 与值对象。\n\n## 🔗 推荐资料\n\n| 资料 | 说明 | 链接 |\n|---|---|---|\n| 廖雪峰 Java 函数式编程 | Lambda/Stream/Optional 系统教程 | https://liaoxuefeng.com/books/java/functional/index.html |\n| pdai Java 8 特性 | 新特性全景与代码示例汇总 | https://pdai.tech/md/java/java8/java8.html |\n| JavaGuide Java 8 新特性 | 新特性面试向整理与示例 | https://javaguide.cn/java/new-features/java8-tutorial-translate.html |\n| 廖雪峰 日期与时间 | java.time 详细用法 | https://liaoxuefeng.com/books/java/datetime/index.html |\n","ck":0},{"id":"f8","stage":1,"path":"01-入门篇/07-设计模式.md","title":"07-设计模式","md":"# 07-设计模式\n\n> **阶段**：入门篇 ｜ **建议时长**：5 天 ｜ **前置**：02-面向对象与核心类.md、04-异常-IO-反射-注解.md\n\n## 🎯 学习目标\n\n- 能用一句话说清 23 种 GoF 设计模式里 **⭐15 种常用模式**的意图与适用场景。\n- 能手写双重检查锁单例、静态内部类单例，并说出各自被反射/序列化破坏的原因。\n- 能对比 JDK 动态代理与 CGLIB，并把它接到 Spring AOP 上。\n- 能在 JDK 和 Spring 源码里各指出 5 个模式的实际应用（这是面试最高频问法）。\n- 会用策略模式重构一段 if-else，并讲出重构收益。\n\n## 📖 核心知识点\n\n### 设计模式是什么\n\n一句话：**前人反复遇到的问题和对应的解法模板**，不是必须照抄的规范。\n\n- GoF《设计模式》23 种，分三类：创建型 5、结构型 7、行为型 11。\n- 面试真实考法不是\"背 23 种\"，而是三问：① 这个模式解决什么问题；② JDK/Spring 里哪里用了；③ 你的项目里怎么用的。\n- 使用顺序：先知道\"不用它会有什么痛\"，再记解法。硬背类图对面试毫无帮助。\n\n### ⭐SOLID 五大原则\n\n面试官想听：每条能配一个 Java 里的反例或正例，而不是只念缩写。\n\n| 原则 | 一行解释 | Java 例子 |\n|---|---|---|\n| **S** 单一职责 | 一个类只有 1 个被修改的理由 | 反例：`UserService` 又校验、又查库、又发邮件 → 拆成 Validator / Repository / MailSender |\n| **O** 开闭 | 对扩展开放、对修改关闭 | 新增支付方式加 `PayStrategy` 实现类，不改 `PayService` 主干 |\n| **L** 里氏替换 | 子类能替换父类且不破坏行为 | 反例：`Square extends Rectangle`，重写 `setWidth` 同时改高度，调用方预期崩了 |\n| **I** 接口隔离 | 多个窄接口优于一个胖接口 | JDBC 的 `Statement` / `PreparedStatement` / `CallableStatement` 分层 |\n| **D** 依赖倒置 | 依赖抽象，不依赖具体 | Controller 注入 `UserService` 接口而非 `UserServiceImpl`，Spring DI 是它的工程化实现 |\n\n补充两句设计哲学：**迪米特法则**（只和直接朋友通信，`a.getB().getC()` 是坏味道）、**合成复用原则**（能用组合就别用继承）。\n\n### 创建型模式（5 种）\n\n#### ⭐单例 Singleton\n\n保证一个 Class 只有一个实例，全局访问点。\n\n| 写法 | 线程安全 | 懒加载 | 备注 |\n|---|---|---|---|\n| 饿汉 `private static final INSTANCE = new X()` | ✅ | ❌ 类加载即创建 | 最简单，实例小、无初始化异常时用 |\n| 懒汉（直接 `if (null)` 加锁） | ✅ 但性能差 | ✅ | 每次调用都进 synchronized，不可取 |\n| **双重检查锁 DCL** | ✅ | ✅ | ⭐面试标准答案 |\n| 静态内部类 | ✅ | ✅ | ⭐推荐，靠 JVM 类加载保证 |\n| 枚举 | ✅ | ❌ | ⭐《Effective Java》最佳，天然防反射与序列化 |\n\n```java\npublic class Singleton {\n    // volatile 不能去：new 是\"分配内存→初始化→指向引用\"三步，无 volatile 时可能重排序，\n    // 别的线程拿到\"引用非空但未初始化完\"的半成品对象\n    private static volatile Singleton instance;\n    private Singleton() {\n        // 顺便挡一下反射：第二次构造直接抛异常\n        if (instance != null) throw new IllegalStateException(\"Already created\");\n    }\n    public static Singleton getInstance() {\n        if (instance == null) {                      // 第一次检查：无锁快速返回\n            synchronized (Singleton.class) {\n                if (instance == null) instance = new Singleton();  // 第二次检查：防止并发重复创建\n            }\n        }\n        return instance;\n    }\n}\n```\n\n静态内部类写法（**推荐手写这个**）：\n\n```java\npublic class Singleton {\n    private Singleton() {}\n    private static class Holder { static final Singleton I = new Singleton(); }\n    public static Singleton getInstance() { return Holder.I; }\n}   // 内部类只有被引用时才加载，靠 ClassLoader 的初始化锁保证唯一且延迟\n```\n\n**单例如何被破坏（必考追问链）**：\n- **反射**：`Constructor c = clazz.getDeclaredConstructor(); c.setAccessible(true); c.newInstance()` 能强开私有构造 → 构造器里判空抛异常可挡。\n- **序列化**：每次 `readObject` 都新建实例 → 实现 `readResolve()` 返回原实例可挡。\n- **多个类加载器**：各自加载出一份，这也是 ThreadLocal/容器场景要小心的原因。\n- 典型应用：Spring 单例 Bean、线程池、`Runtime`、连接池、配置对象。\n\n#### 工厂方法 vs 抽象工厂\n\n- **简单工厂**（不算 GoF 模式）：一个 static 方法 `if/else` 按参数造对象。新增品类要改工厂 → 违反开闭。\n- **工厂方法**：每个产品一个工厂子类，新增品类只加类不改老代码。`Connection conn = dataSource.getConnection();`——调用方不知道自己是 MySQL 还是 Druid 连接。\n- **抽象工厂**：一个工厂生产**一整族**相关对象（如跨数据库的 `Connection` + `Statement` + `Dialect`）。\n- 一句话分辨：**工厂方法解决\"一个产品\"的创建，抽象工厂解决\"一族产品\"的创建**。JDK 里 `Calendar.getInstance()`、`NumberFormat.getInstance()` 是工厂方法。\n\n#### 建造者 Builder\n\n- 解决：**参数很多且可选**时不要用重叠构造器（ telescoping constructor），也别用一堆 setter（对象可变、线程不安全、易漏字段）。\n- JDK 代表：`StringBuilder`（链式 `append` 返回 this）、`Stream.Builder`。Lombok 的 `@Builder` 就是这个模式。\n- Lombok 的 `@Builder` 就是这个模式，Spring Boot 项目里 `对象.builder().a(1).b(2).build()` 很常见。\n\n#### 原型 Prototype\n\n- 从一个实例克隆新实例，`implements Cloneable` + 重写 `clone()`。\n- ⭐面试关联点：**浅拷贝**只复制引用（`List` 字段指向同一个对象），**深拷贝**递归复制。`ArrayList.clone()` 是浅拷贝——这是易错点。\n- 工程上更常用序列化/JSON 往返实现深拷贝，或 Spring 的 `@Scope(\"prototype\")`（注意：Bean 的 prototype 每次 `getBean` 新建，但注入进单例后只创建一次）。\n\n### 结构型模式（7 种）\n\n#### ⭐代理 Proxy —— 面向切面的地基\n\n- 意图：不改目标类，在调用前后插逻辑（日志、事务、权限、缓存）。\n\n| 维度 | JDK 动态代理 | CGLIB |\n|---|---|---|\n| 原理 | `Proxy.newProxyInstance` + **继承 `Proxy` 类**，反射调用 `InvocationHandler.invoke` | 生成**目标类的子类**覆盖方法（字节码，基于 ASM） |\n| 要求 | 目标必须实现接口 | 目标类不能是 `final`，方法不能 `private/final/static` |\n| 默认 | Spring Boot 2.x+ **默认全用 CGLIB**（1.x 是 JDK）；`@EnableAspectJAutoProxy(proxyTargetClass=true)` | — |\n| 性能 | 每次调用走反射（有优化但仍略慢） | 创建慢、调用快 |\n\n```java\nObject proxy = Proxy.newProxyInstance(loader, interfaces,\n    (p, method, args) -> {                       // 唯一坑：method.invoke 的第一个参数必须是 target 而不是 proxy\n        long t = System.currentTimeMillis();\n        Object r = method.invoke(target, args);\n        System.out.println(method.getName() + \" \" + (System.currentTimeMillis() - t) + \"ms\");\n        return r;\n    });\n```\n- 一句话：**Spring AOP 是代理模式的应用，动态代理是它的实现手段**；事务失效的\"同类内部方法调用不走代理\"也是这个原理（见[《Spring核心》](#/f/f15)）。\n- 静态代理：手写 `UserServiceProxy implements UserService`，每个方法转发 + 加逻辑。缺点是每个接口都要写一份，所以才有动态代理。\n\n#### ⭐装饰器 Decorator\n\n- 意图：**动态增强功能，比继承灵活**，运行时任意组合。结构是\"持有被装饰对象的引用 + 实现同一接口\"。\n- JDK 最典型：`new BufferedReader(new InputStreamReader(new FileInputStream(f), \"UTF-8\"))`——`InputStream` 套娃，每一层加一种能力（字节→字符→缓冲）。\n- 与代理的区别：**装饰器关注\"加功能\"，代理关注\"控制访问\"**；装饰器通常由调用方层层手动包，代理一般由框架生成。\n- 其他：`Collections.unmodifiableList`（只读装饰）、Stream 的中间操作、Spring 的 `HttpServletRequestWrapper`（XSS 过滤）。\n\n#### 适配器 Adapter\n\n- 意图：接口不兼容时做一次转换，让本来不能合作的类能合作。\n- 一句话代表：**SpringMVC 的 `HandlerAdapter`**——Controller 有 `@RequestMapping`、`HttpRequestHandler`、旧 `Controller` 接口好几种形态，DispatcherServlet 只认 `handle()` 一个方法，中间靠适配器各转一份。\n- 生活化例子：电源转换头；代码例子：把 `Dog.bark()` 适配成 `Robot.beep()`。日志门面 SLF4J 底下换 Logback/Log4j2 也是适配器思路。\n\n#### 外观 Facade\n\n- 意图：给复杂子系统提供一个**简单统一入口**，降低耦合。\n- 例子：`Slf4jLogger`、Spring 的 `JdbcTemplate`（把 `Connection`/`PreparedStatement`/`ResultSet`/异常处理全包成一个 `update(sql, args)`）、你写的 `XxxService` 聚合多个 DAO + RPC。\n- 与适配器区别：外观是**自己设计**的简化层，适配器是**为了兼容已有的不匹配接口**。\n\n#### 桥接 Bridge\n\n- 抽象与实现**各自独立变化**，用组合而不是继承把两者连起来。\n- 例子：形状（圆/方）× 颜色（红/蓝），继承会爆炸成 4 个类，桥接是 `Shape` 持有 `Color` 接口。JDBC 驱动 API（`java.sql` 抽象 + 各厂商实现）是标准案例。\n- 一句话：**开闭原则在\"两个维度都要扩展\"时的落地**。\n\n#### 组合 Composite\n\n- 把\"单个对象\"和\"对象树\"用同一接口处理，客户端不用区分叶子还是分支。\n- 例子：文件系统（`File` 既能表示文件也能表示目录）、UI 组件树、评论的父子嵌套回复（树形结构菜单/部门表就是组合模式的数据库版）。\n\n#### ⭐享元 Flyweight\n\n- 意图：大量细粒度对象**共享同一份**来省内存。\n- JDK 里你已经学过三个：`Integer` 缓存 -128~127、**字符串常量池**、`Boolean.valueOf()` 返回两个固定实例。\n- 追问：享元与缓存的区别——缓存是\"用完可能淘汰\"，享元是\"设计上共享不可变实例，由工厂统一管\"。\n- 反面提醒：缓存的对象**必须不可变**，否则一个持有者改了全都受影响。\n\n### 行为型模式（11 种，重点 4 个）\n\n#### ⭐策略 Strategy\n\n- 意图：把**可互相替换的算法各自封装成类**，客户端只选不用改。\n- 用途：干掉成串 `if/else` 或 `switch`。\n\n```java\n// 重构前\npublic BigDecimal fee(String type, BigDecimal amt) {\n    if (\"WECHAT\".equals(type))      return amt.multiply(new BigDecimal(\"0.006\"));\n    else if (\"ALIPAY\".equals(type)) return amt.multiply(new BigDecimal(\"0.004\"));\n    else if (\"CARD\".equals(type))   return amt.add(new BigDecimal(\"1\"));\n    else throw new IllegalArgumentException(type);\n}\n\n// 重构后：策略接口 + 注册表\npublic interface PayStrategy {\n    String type();\n    BigDecimal fee(BigDecimal amt);\n}\n@Component\npublic class PayContext {\n    private final Map<String, PayStrategy> map;\n    public PayContext(List<PayStrategy> list) {                 // Spring 自动注入所有实现\n        this.map = list.stream().collect(Collectors.toMap(PayStrategy::type, s -> s));\n    }\n    public BigDecimal fee(String type, BigDecimal amt) {\n        PayStrategy s = map.get(type);\n        if (s == null) throw new IllegalArgumentException(\"unsupported: \" + type);\n        return s.fee(amt);\n    }\n}   // 新增渠道只加一个 @Component 类，PayContext 一行不改\n```\n- JDK 例子：`Comparator`、`ThreadPoolExecutor.AbortPolicy` 等拒绝策略、`Arrays.sort(a, cmp)`。\n- **一句话：策略模式 = 把 if-else 的每个分支变成一个 bean，用 Map 分发。**\n\n#### ⭐模板方法 Template Method\n\n- 意图：父类定**算法骨架**，把某些步骤留给子类实现（钩子方法）。\n- 例子：`JdbcTemplate`（骨架固定，SQL 和 RowMapper 你给）；`AbstractQueuedSynchronizer` 的 `tryAcquire/tryRelease` 由 `ReentrantLock`、`Semaphore` 各自实现——AQS 是模板方法 + 钩子的经典（见[《01-多线程与并发编程》](#/f/f9)）；`InputStream.read()`、Servlet `HttpServlet.service()` 分发到 `doGet/doPost`。\n- 实现手段：抽象类（编译期约定）或接口 `default` 方法（Java 8 后）。\n- 与策略区别：**模板方法靠继承复用流程（编译期固定），策略靠组合替换算法（运行期可换，更灵活）**。\n\n#### ⭐观察者 Observer\n\n- 意图：一对多依赖，一个对象状态变化自动通知一批订阅者，**发布者不认识订阅者**。\n- JDK/Spring：`EventListener` 体系、`Observable`（已废弃）；Spring 的 `ApplicationEventPublisher.publishEvent(new OrderCreatedEvent(...))` + `@EventListener`（还有 `@Async`、`@TransactionalEventListener`）。\n- 心智模型延伸：**消息队列 MQ 就是跨进程的观察者**——生产者只管发消息，消费者自己订阅（见[《02-RabbitMQ》](#/f/f22)）。\n- 追问点：同步观察者仍在同一线程（阻塞主流程，靠 `@TransactionalEventListener(AFTER_COMMIT)` 或异步线程池解）；观察者注册顺序、内存泄漏（注销订阅）。\n\n#### ⭐责任链 Chain of Responsibility\n\n- 意图：请求沿一串处理者传递，谁能处理谁处理，**发送方不需要知道有多少处理者**。\n- 例子：Servlet `Filter`（`chain.doFilter()`）、SpringMVC `HandlerInterceptor`（pre/post/after 三个时机，返回 false 就断链）、Netty `ChannelPipeline` 的 `Handler` 链（见[《03-IO模型与网络编程》](#/f/f11)）、Logback 的 Filter、审批流、风控规则链。\n- 和策略的区别：**策略只命中一个；责任链可能多个依次处理，且链的顺序有语义**。\n\n#### 其余 6 种（🟢 了解即可）\n\n| 模式 | 一句话 | 代表 |\n|---|---|---|\n| 迭代器 | 顺序访问集合又不暴露内部结构 | `Iterator`、增强 for |\n| 命令 | 把请求封装成对象，支持撤销/排队/日志 | `Runnable`、`ThreadPoolExecutor` 提交任务、undo 栈 |\n| 状态 | 状态变了就换一个状态对象，行为随状态迁移 | 订单状态机、`Thread` 的 NEW→RUNNABLE→TERMINATED |\n| 中介者 | 用一个中心对象拦住同事间的网状引用 | SpringMVC `DispatcherServlet`、MQ Broker、事件总线 |\n| 访问者 | 在不改元素类的前提下给对象结构加新操作 | 编译器 AST 遍历、ASM 的 `ClassVisitor` |\n| 解释器 | 语法规则各建一个类来解释句子 | SQL/正则解析、SpEL（用得极少） |\n\n### ⭐Spring 全家桶里的设计模式（面试最高频对照表）\n\n| 模式 | Spring 里的落地 | 面试展开点 |\n|---|---|---|\n| 简单工厂 | `BeanFactory.getBean()` | 工厂方法版是 `FactoryBean.getObject()`（`SqlSessionFactoryBean`） |\n| 工厂方法 | `FactoryBean` 接口 | 造的对象类型和 FactoryBean 自己不同类型，且可返回半成品 |\n| 建造者 | `BeanDefinitionBuilder`、`SpEL` 解析、`UriComponentsBuilder` | 对应 Builder：分步构造 `BeanDefinition` |\n| **原型** | `@Scope(\"prototype\")` | 注入进单例只创建一次，要每次新对象需 `ObjectProvider`/`lookup` |\n| 单例 | **默认 Bean 就是单例**（容器级单例，非 JVM 单例） | 三级缓存解决循环依赖（见[《Spring核心》](#/f/f15)） |\n| **代理** | **AOP / `@Transactional` / `@Async`** | JDK vs CGLIB 选择规则、同类调用不走代理 |\n| 模板方法 | `JdbcTemplate`、`RedisTemplate`、`MyBatis` 的 `SqlSessionTemplate`、`RedisTemplate.execute()` | 骨架管连接与异常，回调（`RowMapper`）给你扩展 |\n| **观察者** | `ApplicationEvent` + `@EventListener` | 解耦非核心逻辑；`@TransactionalEventListener` 控制时机 |\n| **责任链** | `HandlerInterceptor`、`Filter`、`SecurityFilterChain` | 顺序由注册顺序/`@Order` 决定 |\n| 适配器 | `HandlerAdapter`、`HandlerExceptionResolver`、数据库 `Driver` | 多种 Controller 形态统一成一个入口 |\n| 策略 | 资源加载 `Resource`（`ClassPathResource`/`FileSystemResource`/`UrlResource`） | 按位置各实现一套，既是策略也是适配器 |\n\n一句话：**问\"Spring 用了哪些设计模式\"，标准答案报 5 个——IoC 工厂、AOP 代理、JdbcTemplate 模板方法、事件观察者、拦截器责任链，每个带一个类名，就赢过大部分候选人。**\n\n## 🛠 动手实践\n\n### 任务 1：手写两种单例并证明它安全\n\n- 要求：写静态内部类单例 + DCL 单例；用 20 个线程并发 `getInstance()`，用 `Set<IdentityHashMap>` 收集所有返回对象。\n- 验收标准：并发收集后不同实例数 = 1；再用反射 `getDeclaredConstructor().setAccessible(true).newInstance()` 试图破坏，能说出为什么 DCL 版能被破坏、加了构造器判空后抛什么异常；再说出 `volatile` 去掉后可能出现什么问题（指令重排导致半成品对象）。\n\n### 任务 2：策略模式重构 if-else\n\n- 要求：把上面的 `PayContext` 例子写完整（接口 + 3 个 `@Component` 实现 + Context），再加第 4 种支付方式，**只新增文件**。\n- 验收标准：`PayContext` 里没有 `if/else/switch`；新增渠道后原有代码 diff 为 0；`PayContext` 的 Map 通过构造器注入 `List<PayStrategy>` 自动装配；未知 type 抛明确异常而不是返回 null。\n\n### 任务 3：JDK 动态代理打印耗时\n\n- 要求：给一个 `UserService` 接口生成代理，对每个方法打印 `方法名 + 耗时`，`cost > 100ms` 时额外打印 \"slow\"。\n- 验收标准：不修改 `UserServiceImpl` 一行代码；能解释为什么 `Proxy` 生成的类不能同时代理两个已有父类（Java 单继承 → CGLIB 也受此限）；说出 `method.invoke(target, args)` 传 `proxy` 会无限递归的原因。\n\n## 💼 高频面试题\n\n- [ ] **Q：单例有哪几种写法？如何保证线程安全？⭐** —— 饿汉/懒汉/双重检查锁 volatile/静态内部类/枚举五种；DCL 靠 synchronized+volatile，推荐静态内部类（JVM 类加载保证）或枚举 ｜ 详见[《01-多线程与并发编程》](#/f/f9)\n- [ ] **Q：单例会被什么手段破坏？怎么防？⭐** —— 反射开私有构造（构造器判空抛异常防）、序列化每次新建对象（实现 readResolve 防）、多类加载器；枚举天然免疫前两种 ｜ 详见[《04-异常-IO-反射-注解》](#/f/f6)\n- [ ] **Q：双重检查锁里 volatile 能去掉吗？为什么？⭐** —— 不能；new 分三步可能被重排序，其他线程第一重检查会拿到\"引用非空但没初始化完\"的半成品 ｜ 详见[《01-多线程与并发编程》](#/f/f9)\n- [ ] **Q：JDK 动态代理和 CGLIB 的区别？Spring 用哪个？⭐** —— JDK 基于接口+继承 Proxy 类走反射，CGLIB 生成目标类子类走字节码；目标没接口只能用 CGLIB，final 类/CGLIB 搞不了；Spring Boot 默认 CGLIB ｜ 详见[《Spring核心》](#/f/f15)\n- [ ] **Q：工厂方法和抽象工厂的区别？⭐** —— 工厂方法一个工厂造一个产品（新增加类不改老代码），抽象工厂一个工厂造一整族相关产品；DataSource.getConnection() 是工厂方法 ｜ 详见[《07-设计模式》](#/f/f8)\n- [ ] **Q：装饰器和代理有什么区别？⭐** —— 装饰器给对象叠加功能、由调用方层层包（InputStream 套娃）；代理控制对目标的访问、通常由框架生成（AOP）；结构一样、意图不同 ｜ 详见[《04-异常-IO-反射-注解》](#/f/f6)\n- [ ] **Q：策略模式和状态模式的区别？⭐** —— 策略是算法之间互不相识、由客户端选一个；状态是状态间有迁移规则、由各状态自己决定下一个；策略模式更轻、状态模式带状态机 ｜ 详见[《07-设计模式》](#/f/f8)\n- [ ] **Q：策略和模板方法怎么选？⭐** —— 流程步骤固定只有局部变化用模板方法（继承，编译期）；整个算法可运行期互换用策略（组合，更符合开闭）；策略可用 Map+Spring 注入落地 ｜ 详见[《07-设计模式》](#/f/f8)\n- [ ] **Q：Spring 里用了哪些设计模式？举例说明。⭐** —— BeanFactory=工厂、BeanDefinitionBuilder=建造者、@Scope prototype=原型、AOP/事务=代理、JdbcTemplate=模板方法、ApplicationEvent=观察者、HandlerInterceptor=责任链、HandlerAdapter=适配器 ｜ 详见[《Spring核心》](#/f/f15)\n- [ ] **Q：责任链模式在 Java Web 里哪里用？Filter 和 Interceptor 什么区别？⭐** —— Filter（Servlet 规范，容器管，拦 URL）、HandlerInterceptor（SpringMVC 管，能拿到 handler 和模型）、Netty Pipeline；区别在归属层、可用 API、能否注入 Spring Bean ｜ 详见[《SpringBoot实战》](#/f/f16)\n- [ ] **Q：你在项目里用过什么设计模式？（场景题）⭐** —— 答题口径：讲一个重构故事，不说模式清单。结构=原来的 if-else 长什么样 → 什么痛点（新增要改老代码、测试难）→ 用了什么模式 → 落地方式（接口 + Map + Spring 注入）→ 收益（新增零改动、单测能各测各的） ｜ 详见[《04-简历与求职指南》](#/f/f35)\n- [ ] **Q：SOLID 里的开闭原则怎么落地？⭐** —— 抽象 + 扩展：把变化点抽成接口，新增行为只加实现类；策略模式和观察者模式是它的两种主要手段；Spring 靠注入 List<接口> 自动收集实现 ｜ 详见[《Spring核心》](#/f/f15)\n- [ ] **Q：Integer 缓存和字符串常量池是什么模式？⭐** —— 享元；共享不可变实例省内存，Integer 缓存 -128~127、字符串常量池复用字面量；也解释了为什么超出范围 == 为 false ｜ 详见[《02-面向对象与核心类》](#/f/f4)\n\n## 🔗 推荐资料\n\n| 资料 | 用来干什么 | 链接 |\n|---|---|---|\n| JavaGuide 设计模式详解 | 23 种模式图解 + Java 代码，按\"意图/结构/场景/优缺点\"展开 | https://javaguide.cn/other/how-to-learn-design-pattern.html |\n| pdai 设计模式 | 系统梳理 + 与 Spring 源码结合的完整版 | https://pdai.tech/md/dev-spec/pattern-all.html |\n| 廖雪峰 Java 面向对象 | 回补 SOLID 的地基：继承/多态/接口 | https://liaoxuefeng.com/books/java/oom/index.html |\n| 慕课 设计模式体系课 | 跟着敲一遍单例/工厂/代理/策略的手写实现 | https://www.imooc.com/course/list?c=designpattern |\n| 码工具 设计模式在线演示 | UML 类图与结构对照，快速看图回忆模式形状 | https://www.matools.com/design-pattern |\n","ck":13},{"id":"f9","stage":2,"path":"02-进阶篇/01-多线程与并发编程.md","title":"01-多线程与并发编程","md":"# 01-多线程与并发编程\n\n> **阶段**：进阶篇 ｜ **建议时长**：7 天 ｜ **前置**：02-面向对象与核心类.md、03-集合与泛型.md\n\n## 🎯 学习目标\n\n- 能用三种方式创建线程，画出线程 6 种状态流转图。\n- 能解释 JMM 三性与 volatile 的两个保证、一个不保证。\n- 掌握 synchronized 三种用法与 ReentrantLock 差异，会写死锁并排查。\n- 能默写线程池 7 参数、执行流程、4 种拒绝策略，并给出线程数经验公式。\n- 会用 ThreadLocal、CAS 工具类、JUC 协调工具与 CompletableFuture 完成典型并发任务。\n\n## 📖 核心知识点\n\n### ⭐线程的三种创建方式\n\n面试官想听：本质都是 Runnable——Thread 封装任务、FutureTask 接收返回值、线程池统一管理。\n\n```java\n// 1. 继承 Thread\nclass MyThread extends Thread {\n    public void run() { System.out.println(\"thread\"); }\n}\n// 2. 实现 Runnable（推荐，任务与执行解耦，还能交给线程池）\nRunnable task = () -> System.out.println(\"runnable\");\nnew Thread(task).start();\n// 3. Callable + FutureTask（有返回值、可抛异常）\nCallable<Integer> c = () -> 42;\nFutureTask<Integer> ft = new FutureTask<>(c);\nnew Thread(ft).start();\nInteger result = ft.get();      // 阻塞直到完成\n```\n\n- 必须调用 `start()` 而不是 `run()`：`run()` 只是普通方法调用（单线程执行），`start()` 才创建新线程。\n- 实战第 4 种：线程池 `ExecutorService`（见下文），避免手动 new Thread。\n- `Thread.currentThread()` 获取当前线程；线程默认不继承父线程状态（InheritableThreadLocal 除外）。\n\n### ⭐线程的 6 种状态\n\n面试官想听：NEW→RUNNABLE 的启动路径、RUNNABLE 与阻塞系状态的区分、WAITING 与 TIMED_WAITING 的差别。\n\n```\nNEW -> start() -> RUNNABLE <-> BLOCKED（等 synchronized 锁）\n                     |-> WAITING（wait/join/LockSupport.park，无超时）\n                     |-> TIMED_WAITING（sleep(n)/wait(n)/join(n)）\n                     |-> TERMINATED（run 结束）\n```\n\n- `sleep` 是 Thread 静态方法、**不释放锁**；`wait` 是 Object 方法、**释放锁**，且必须在 synchronized 块内调用，靠 `notify/notifyAll` 唤醒。\n- `join()`：等待目标线程结束；`yield()`：提示调度器让出 CPU（不可依赖）；`interrupt()` 只是设置中断标志，阻塞中线程会抛 `InterruptedException`，需自行决定退出策略。\n- 守护线程：`thread.setDaemon(true)` 必须在 start 前调用；所有非守护线程结束 JVM 就退出，GC 线程就是守护线程。\n\n### ⭐JMM 三性\n\n面试官想听：原子性、可见性、有序性，能各举一个反例并给出对应解决方案。\n\n- **原子性**：操作不可分割。`i++` 是「读-改-写」三步，多线程下会丢更新；用 `synchronized`、`AtomicInteger`、`Lock` 保证。经典对比：**10 个线程各 `count++` 1000 次，用 `int count` 结果通常小于 10000 且每次运行都不同**（读-改-写被交错打断，丢更新），**换成 `AtomicInteger.incrementAndGet()` 则精确等于 10000**（CAS 保证单次自增原子）。\n- **可见性**：一个线程的修改对其他线程立即可见。工作内存（CPU 缓存）与主存不同步导致；用 `volatile`、`synchronized`、`final` 保证。\n- **有序性**：编译器/CPU 指令重排导致代码执行顺序与书写顺序不一致；`volatile` 禁止指令重排，锁保证串行语义。\n- **happens-before**：JMM 定义的操作间偏序规则（程序顺序、锁的解锁先于加锁、volatile 写先于读、线程 start/join 等），满足则后操作可见前操作的结果，是理解并发的理论抓手。\n  - **传递性推演**（面试爱考）：线程
