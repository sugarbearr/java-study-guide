）。D 描述的是内存淘汰，是内存超限后的另一套机制。详见[《01-Redis》](#/f/f21)\n\n### 202.（Redis·易）纯缓存场景下，希望内存不足时优先淘汰最久未使用的数据，淘汰策略应配置为？\n- A. allkeys-lru\n- B. noeviction\n- C. volatile-ttl\n- D. allkeys-random\n\n答案：A\n解析：allkeys-lru 在全键范围内按最近最少使用淘汰，是缓存场景的常规选择。B 是默认值，内存满后写请求直接报错，适合把 Redis 当唯一数据源、宁可报错也不丢数据的场景；C 只在设了 TTL 的键里挑剩余寿命最短的；D 随机淘汰，命中率不可控。详见[《01-Redis》](#/f/f21)\n\n### 203.（Redis·中）下面哪种写法在 Redis Cluster 中容易触发 CROSSSLOT 错误？\n- A. GET 单个 key\n- B. 对单个 key 执行 INCR\n- C. 给单个 key 设置 EXPIRE\n- D. 对两个普通 key 直接做 SINTER（未使用 hash tag）\n\n答案：D\n解析：多 key 命令要求所有 key 落在同一个槽，`user:1:follow` 与 `user:2:follow` 大概率分属不同节点。解法是用 hash tag 强制同槽，例如 `{u1}:follow` 与 `{u1}:fans`。单 key 命令不受影响。详见[《01-Redis》](#/f/f21)\n\n### 204.（Redis·中）秒杀扣库存时用 Lua 脚本替代\"先 GET 判断、再 DECR 扣减\"两段代码，核心收益是？\n- A. Lua 脚本可以自动重试失败的命令\n- B. 脚本在 Redis 中作为一个整体串行执行，中间不会插入其他客户端的命令\n- C. Lua 脚本比 Java 代码更容易维护\n- D. 只有 Lua 脚本才能访问 Hash 类型\n\n答案：B\n解析：命令执行本身是单线程的，但两条命令之间仍可能插入其他请求，出现\"判断时库存够、扣减时已被别人扣完\"的超卖窗口。脚本整体执行消除了这个窗口。注意脚本内不要写耗时逻辑，否则会阻塞整个实例。详见[《02-高并发系统设计》](#/f/f30)\n\n### 205.（Redis·中）服务用本地 Caffeine + Redis 做多级缓存，商品价格修改后部分实例仍返回旧价格，最可能的原因是？\n- A. Caffeine 的容量设置得太小\n- B. Redis 不支持价格这类数值\n- C. 只删了 Redis 中的缓存，各实例进程内的 Caffeine 没有被通知失效\n- D. 商品价格这类数据必须直接查数据库\n\n答案：C\n解析：本地缓存不在 Redis 里，删 Redis 影响不到各实例自己的内存。做法是借助 Redis 发布订阅或键过期通知广播\"某 key 失效\"，各节点收到后清掉本地条目。这类广播丢一两次无大碍，但不能当可靠消息用。详见[《01-Redis》](#/f/f21)\n\n### 206.（Redis·中）主从 + 哨兵架构下，写完立即查询却读到旧值，最可能的原因是？\n- A. Redis 的 RDB 文件损坏\n- B. 复制是异步的，写落在主节点而读请求被路由到了尚未同步完成的从节点\n- C. 哨兵把写请求转发到了从节点\n- D. 从节点只读，所以读不到新数据\n\n答案：B\n解析：主节点写完本地就返回，命令再异步传播给从节点，这个窗口内的读从请求必然拿到旧值。对一致性敏感的操作（如支付后立刻查订单）要强制读主，或用 `WAIT` 等待若干副本确认。哨兵只负责监控与切换，不代理读写。详见[《01-Redis》](#/f/f21)\n\n### 207.（Redis·难）一个占用 60GB 内存的 Redis 实例执行 bgsave，关于 fork 与写时复制，下列说法正确的是？\n- A. fork 会立即复制一份 60GB 内存给子进程，实例随即 OOM\n- B. fork 会挂起父进程直到快照完成，期间所有请求阻塞\n- C. fork 瞬间只复制页表、开销很小，但快照期间父进程的写入会触发页复制，内存可能接近翻倍\n- D. 内存越大 fork 越快，60GB 实例几乎无感知\n\n答案：C\n解析：Linux 的 fork 采用写时复制，并非立刻复制 60GB，所以 A 错；但快照期间父进程每修改一个内存页就要复制一份出来，最坏情况内存接近翻倍，叠加内存碎片后容易 OOM，因此要预留一倍余量并控制 maxmemory。fork 复制页表的耗时随内存量增长，大实例会有毫秒级停顿，B 的\"挂起直到完成\"夸大了。详见[《01-Redis》](#/f/f21)\n\n### 208.（Redis·难）AOF 重写期间客户端仍在不停写入，Redis 靠什么保证这批新命令不丢？\n- A. 重写期间直接拒绝所有新的写命令\n- B. 新命令只进内存，重写结束后由客户端重新发送\n- C. 重写期间临时关闭 AOF，结束后再打开\n- D. 新命令同时追加到旧 AOF 和重写缓冲区，新文件写完后补上这段增量再原子替换\n\n答案：D\n解析：重写子进程只持有 fork 那一刻的数据视图，感知不到后续写入，所以父进程把新命令额外积累到 aof_rewrite_buf；新 AOF 落盘后先追加这段增量、再改名替换旧文件，切换期间几乎没有数据缺口。代价是这份缓冲区同样吃内存，写流量极大时需留意。详见[《01-Redis》](#/f/f21)\n\n### 209.（Redis·中）热点 key 失效后的重建，用\"逻辑过期\"与\"互斥锁\"最本质的差别是？\n- A. 逻辑过期让请求直接拿到旧值再异步重建，互斥锁让其余请求阻塞等待重建结果\n- B. 逻辑过期不会产生任何数据不一致\n- C. 互斥锁方案不需要考虑锁超时问题\n- D. 两者完全等价，只是代码写法不同\n\n答案：A\n解析：逻辑过期把过期时间写进 value、key 本身不设 TTL，命中后发现逻辑过期就返回旧值并异步刷新，吞吐高但会短暂返回旧数据；互斥锁只放一个线程回源、其余等待，一致性好但要处理锁超时、吞吐较低。选哪种取决于业务能否容忍短时旧值；两者都不解决\"数据根本不存在\"的穿透问题。详见[《01-Redis》](#/f/f21)\n\n### 210.（Redis·难）在 Cache Aside 之上再叠加\"延迟双删\"，是为了堵住哪个时序漏洞？\n- A. 数据库主从延迟导致从库读不到最新数据\n- B. 删除缓存这个动作本身不是原子的\n- C. Redis 的内存淘汰策略会误删缓存\n- D. 读请求在写请求删除缓存之后、更新数据库之前查到旧值，随后又把旧值回填进缓存\n\n答案：D\n解析：典型时序是：读线程查库拿到旧值 → 写线程更新数据库并删缓存 → 读线程此时才把旧值写回缓存，脏数据就长期留下了。延迟双删做成\"删缓存 → 更新数据库 → 延迟 500ms~1s 再删一次\"，清掉这次延迟加载造成的脏数据。它依赖对延迟时长的估计、并不保险，更彻底的做法是订阅 binlog 异步删缓存。详见[《01-Redis》](#/f/f21)\n\n### 211.（消息队列·易）团队要做日志采集与用户行为埋点，数据量极大，下游既有实时计算任务，也需要能回溯重放历史数据。按常规选型结论，最合适的是？\n- A. RabbitMQ：延迟最低、路由最灵活，适合海量日志\n- B. Kafka：吞吐最高，且消息按保留策略留存、消费只移动 offset，天然支持回溯重放\n- C. RocketMQ：事务消息最成熟，日志场景首选\n- D. 三者都可以，日志场景对吞吐和回放都没有要求\n\n答案：B\n解析：选型看三个维度：吞吐（Kafka 百万级 > RocketMQ 十万级 > RabbitMQ 万~十万级）、功能（业务功能 RocketMQ 最全，路由能力 RabbitMQ 最强）、数据保留方式。日志/埋点/大数据管道这类\"量大、要多方消费、要能重放\"的场景与 Kafka 的日志化模型天然契合。RabbitMQ 的优势在低延迟与灵活路由，但吞吐量级和\"确认即删\"的模型都不匹配。详见[《04-RocketMQ》](#/f/f24)\n\n### 212.（消息队列·中）关于 Kafka 的 rebalance（分区再平衡），下列说法正确的是？\n- A. 只有消费者数量变化才会触发，生产者增加分区数不会\n- B. 频繁 rebalance 只影响新加入的消费者，组内其他消费者不受影响\n- C. 成员增减、订阅的 topic 变化、分区数变化都会触发；Sticky/CooperativeSticky 策略让分区尽量留在原消费者上、只做增量调整，减少整组停顿\n- D. rebalance 期间消费照常进行，只是分区归属发生改变\n\n答案：C\n解析：触发条件有三类——组内成员增减（上下线、宕机）、分区数变化、订阅的 topic 变化，A 漏了后两类。rebalance 期间整个消费组停止消费（类似 STW），所以 B、D 都错：影响的是全组，且停摆会直接造成消费延迟。分区分配策略中 Range/RoundRobin 属于全量重分配，Sticky 与 CooperativeSticky 尽量保留原有归属、只做增量调整，其中 CooperativeSticky 支持增量式协作重平衡，停顿最短。工程上要避免频繁 rebalance：合理设置 session.timeout.ms，并确保消费耗时不超过 max.poll.interval.ms。详见[《03-Kafka》](#/f/f23)\n\n### 213.（消息队列·易）希望 `order.*` 能匹配 `order.create`、但不匹配 `order.create.success`，应选择哪类交换机？\n- A. direct\n- B. topic\n- C. fanout\n- D. headers\n\n答案：B\n解析：topic 的通配符中 `*` 匹配一级、`#` 匹配多级，`order.#` 才会命中 `order.create.success`。direct 只做精确匹配；fanout 忽略 RoutingKey 广播给所有绑定队列；headers 按消息头匹配，性能差、很少用。详见[《02-RabbitMQ》](#/f/f22)\n\n### 214.（消息队列·易）Kafka 能支持消息回溯、被多个消费组反复消费，根本原因是？\n- A. 每条消息带有全局唯一的 UUID\n- B. 消费者本地缓存了全量消息副本\n- C. Kafka 会把同一条消息推送给所有消费组\n- D. 消息按保留策略存在日志文件里，消费只是移动 offset，并不删除消息\n\n答案：D\n解析：Kafka 把消息当作可追加的日志，消费进度只是一个位移数字，重置 offset 就能重放历史数据。这与 RabbitMQ\"确认即删除\"的模型形成对照，也是它适合日志采集与大数据管道的原因。详见[《03-Kafka》](#/f/f23)\n\n### 215.（消息队列·中）RocketMQ 的延迟消息，相比 RabbitMQ 用 TTL + 死信实现延迟，主要优势在于？\n- A. Broker 侧按到期时间调度投递，不受队列先进先出顺序的限制\n- B. 延迟精度可以做到纳秒级\n- C. 延迟消息不占用磁盘空间\n- D. RabbitMQ 的 TTL 方案完全无法实现延迟效果\n\n答案：A\n解析：TTL + 死信方案里队列是先进先出的：排在前面的消息还没到期，后面已经到期的也出不去，这就是队头阻塞（同一队列内各条消息延迟时长不一致时尤其明显）。RocketMQ 先把消息存进内部调度 Topic，到期后再投回真实 Topic，因此没有这个问题（4.x 为 18 个固定等级，5.x 用时间轮支持任意时刻）。详见[《04-RocketMQ》](#/f/f24)\n\n### 216.（Redis·难）Redis Cluster 中，客户端向一个并不负责该 key 的节点发起请求，关于节点的响应，下列说法正确的是？\n- A. 节点静默把请求转发给正确的节点，客户端完全无感知\n- B. 节点返回 MOVED 错误并带上目标节点地址，由客户端更新槽映射后重新发起请求\n- C. 节点返回 nil，客户端只能自己遍历所有节点去找数据\n- D. 节点会自动把这个 key 迁移到自己这里，之后由本节点负责\n\n答案：B\n解析：槽的归属是预先划分好的，节点不做代理转发，而是用 MOVED 告诉客户端\"这个槽现在归谁\"，智能客户端据此刷新本地槽映射再重试——所以叫重定向而不是转发。D 说反了：key 归哪个节点由它落在哪个槽决定，节点不能自行把槽搬过来。补充一个高频追问：如果该槽正在迁移中，节点会返回 ASK，让客户端仅对这一次请求临时改投目标节点，且不更新客户端的槽映射——MOVED 是永久改派、ASK 是一次性绕行，这是两者的关键区别。详见[《01-Redis》](#/f/f21)\n\n### 217.（消息队列·中）Kafka 生产者设置 acks=all 时，为什么还建议搭配 min.insync.replicas=2？\n- A. 让消息被包括未同步副本在内的所有副本确认\n- B. 为每条消息自动开启事务\n- C. 让 ISR 收缩到只剩 Leader 时仍能写入成功\n- D. acks=all 只要求所有 ISR 成员确认，而 ISR 会收缩；设成 2 后同步副本不足时写入直接失败，避免退化成\"只剩 Leader 也算 all\"\n\n答案：D\n解析：ISR 是动态集合，落后太多的副本会被踢出，极端情况下只剩 Leader，此时 acks=all 等价于 acks=1。min.insync.replicas=2 把\"至少两个副本同步成功\"变成写入的前置条件，不足则抛 NotEnoughReplicas，可靠性与预期才对得上。A 错在未同步的副本本就不属于 ISR。详见[《03-Kafka》](#/f/f23)\n\n### 218.（消息队列·中）Kafka 消费者保留默认的 enable.auto.commit=true，可能在什么情况下丢消息？\n- A. 位移按固定间隔自动提交，业务还没处理完就宕机，重启后从已提交位移继续，中间那批消息被跳过\n- B. 自动提交会让 Broker 拒绝投递新消息\n- C. 自动提交会覆盖生产者的 acks 配置\n- D. 自动提交只能提交偶数位移，造成错位\n\n答案：A\n解析：自动提交是定时任务，提交的位移与业务处理进度完全脱钩，正是\"先提交后处理\"的典型丢消息模式。业务系统一律关闭自动提交、改为处理完成后手动提交；代价是宕机后会重复消费，所以还需要消费端幂等。详见[《03-Kafka》](#/f/f23)\n\n### 219.（消息队列·中）Kafka 消费组里消费者数量超过了 Topic 的分区数，会发生什么？\n- A. 多出来的消费者会自动拆分现有分区继续消费，总吞吐继续线性提升\n- B. 消费组会拒绝新成员加入并报错\n- C. 每个分区会被两个消费者同时消费，消费速度翻倍\n- D. 多出来的消费者分不到分区、处于空闲状态；想提升并行度只能先增加分区数\n\n答案：D\n解析：分区是并行消费的最小单位，组内一个分区同一时刻只能归一个消费者，因此并行度上限就是分区数。这也是消息积压时\"盲目加消费者\"无效的原因——正确顺序是先扩分区（或新建多分区 Topic 搬迁数据），再扩消费者。详见[《03-Kafka》](#/f/f23)\n\n### 220.（消息队列·难）生产端已配置 acks=all 与重试，但代码里 `kafkaTemplate.send()` 之后从不检查返回值，消息仍可能丢失，原因是？\n- A. acks=all 在消息小于 1KB 时会自动降级为 acks=1\n- B. 只要配了 acks=all，任何情况下都不会丢\n- C. send() 是异步的，失败异常被吞在返回的 future 里，不阻塞等待或注册回调就完全无感知\n- D. KafkaTemplate 会把失败的消息自动写入死信队列\n\n答案：C\n解析：可靠性配置只管\"发出去之后\"的链路，管不了\"根本没发出去\"。高可靠场景必须显式检查发送结果，失败落库补偿或重试。死信队列是消费侧的机制，生产侧没有自动兜底。详见[《03-Kafka》](#/f/f23)\n\n### 221.（消息队列·难）RocketMQ 事务消息的\"事务回查\"机制，主要解决什么问题？\n- A. 生产者执行完本地事务后，Commit/Rollback 丢失或生产者宕机，半消息状态悬而未决\n- B. 消费者重复消费的问题\n- C. Broker 磁盘写满导致的写入失败\n- D. 消息在 MessageQueue 中的顺序错乱\n\n答案：A\n解析：正常流程下生产者会在本地事务结束后主动二次确认，但网络抖动或进程崩溃可能让这次确认永远到不了 Broker，半消息就一直悬着（对消费者不可见）。回查让 Broker 定时反查生产者\"这笔本地事务到底成了没有\"，据此决定提交或回滚。注意事务消息只保证生产端与本地事务一致，消费端仍需幂等。详见[《04-RocketMQ》](#/f/f24)\n\n### 222.（Elasticsearch·易）要对 text 类型字段 name 做「整句精确匹配」查询，正确的写法是？\n- A. 用 term 查询 name.keyword 子字段（mapping 中该 text 字段配了 keyword 子字段）\n- B. 用 match 查询 name 字段\n- C. 用 match_phrase 查询 name 字段\n- D. 用 term 查询 name 字段本身\n\n答案：A\n解析：text 字段写入时已被分词，倒排表里根本不存在「整句」这个词，所以直接 term 查 name 通常查不到（选项 D 是经典错误）；B、C 都属于会对查询词再分词的全文检索。给 text 字段加 keyword 子字段后，term 查这个不分词的子字段才能精确命中。详见[《05-Elasticsearch》](#/f/f25)\n\n### 223.（Elasticsearch·中）把价格区间过滤放进 bool 的 filter 子句而不是 must 子句，主要好处是？\n- A. filter 支持 range 查询而 must 不支持\n- B. filter 会提升文档的 BM25 相关度得分\n- C. filter 子句之间是 OR 关系，能召回更多文档\n- D. filter 不参与相关性打分且过滤结果可被缓存，纯过滤场景性能更好\n\n答案：D\n解析：must 参与 BM25 打分计算，filter 只判断「命中与否」不算分，并且过滤结果可以缓存成 bitset 复用。所以状态、时间、价格区间这类只影响「筛选」不影响「排序」的条件应放 filter，只有真正影响相关度的全文条件才放 must。详见[《05-Elasticsearch》](#/f/f25)\n\n### 224.（Elasticsearch·难）关于 Elasticsearch 的 refresh 与 flush，下列说法正确的是？\n- A. refresh 负责把 segment 持久化到磁盘并清空 translog\n- B. flush 负责让新写入的文档变得可被搜索\n- C. refresh（默认 1s）把内存缓冲中的文档生成 segment 并写入 OS 页缓存，此时文档才可被搜索；flush（默认 30 分钟或 translog 写满）才把 segment 落盘并清空 translog\n- D. 两者默认都每 1 秒执行一次，且一旦关闭 refresh 就会丢数据\n\n答案：C\n解析：写入先进入内存 buffer 与 translog（防丢），refresh 后才可被搜索——这正是「近实时」的来源；flush 才是真正的持久化与 translog 清理。关闭 refresh 只影响可见性、不会丢数据，因为 translog 仍在记录。详见[《05-Elasticsearch》](#/f/f25)\n\n### 225.（Elasticsearch·难）商品搜索要做「无限下拉」式深翻页（可能翻到几万条之后），最合适的方案是？\n- A. 不断加大 from 的值，配合 size=20 逐页取\n- B. 用 search_after 配合 PIT，以上一页最后一条的排序值作为游标继续取下一页\n- C. 用 scroll 为每个在线用户维持一个游标来翻页\n- D. 在每个分片上各取前 N 条，再在客户端归并去重\n\n答案：B\n解析：from+size 需要每个分片都取出 from+size 条到协调节点归并排序，代价随 from 线性增长且默认上限 10000；scroll 会长时间占用资源维持快照，适合一次性全量导出而非用户翻页；search_after 靠游标定位，代价与页深无关，配合 PIT 还能保证翻页期间数据视图一致。详见[《05-Elasticsearch》](#/f/f25)\n\n### 226.（Elasticsearch·中）某索引现有 6 个主分片已接近单分片容量上限，正确的扩容做法是？\n- A. 新建一个分片数更多的索引，用 _reindex 把数据导过去，再用别名切换，业务无感\n- B. 调用 _settings 接口把 number_of_shards 从 6 改成 12\n- C. 把副本数从 1 调到 3，写入容量随之翻倍\n- D. 重启集群，主分片会自动分裂成更多份\n\n答案：A\n解析：主分片数在建索引时固定、之后不可修改，因为文档路由公式依赖它，改分片数等于让所有历史数据「找错门」，只能重建索引后切别名。副本分片只提升读吞吐与容灾能力，并不分担写入。详见[《05-Elasticsearch》](#/f/f25)\n\n### 227.（Elasticsearch·易）中文商品搜索中，analyzer 与 search_analyzer 的常见搭配是？\n- A. 两个都用 standard，中文会被切成单字\n- B. analyzer 用 ik_smart，search_analyzer 用 ik_max_word\n- C. 只设置 search_analyzer，analyzer 保持默认\n- D. analyzer 用 ik_max_word 保证写入侧召回，search_analyzer 用 ik_smart 让查询词更精炼\n\n答案：D\n解析：写入用最细粒度切词，保证任何合理查询都能命中；查询用粗粒度切词，减少无关词带来的噪声，两者配合才能兼顾召回与精度。standard 对中文基本逐字切分，噪声大、相关性差，中文检索必须换 IK 插件。详见[《05-Elasticsearch》](#/f/f25)\n\n### 228.（Elasticsearch·易）执行 `GET /_cluster/health` 返回 status 为 yellow，说明？\n- A. 主分片已全部分配，但存在副本分片未分配（单节点集群几乎必然如此）\n- B. 主分片与副本分片都已正常分配，集群完全健康\n- C. 至少有一个主分片未分配，这部分数据已经查不到\n- D. 集群正在做段合并，属于正常的中间状态\n\n答案：A\n解析：green 表示主副分片全部就绪；yellow 表示主分片齐全但副本无处安放（只有一台节点时没有别处可放副本，所以单节点集群长期是 yellow）；red 才是有主分片未分配、部分数据不可用。测试环境看到 yellow 不必惊慌。详见[《05-Elasticsearch》](#/f/f25)\n\n### 229.（ZooKeeper·中）在 zkCli 中执行 `create -e /order-svc \"192.168.1.10:8080\"` 后 quit 退出，重新进入 zkCli 执行 `ls /order-svc` 会看到什么？\n- A. 节点仍存在，数据保持原样\n- B. 提示节点不存在——`-e` 创建的是临时节点，随会话断开被自动删除\n- C. 节点还在，但数据被清空\n- D. 节点自动转换成了持久节点\n\n答案：B\n解析：`-e` 即 ephemeral，生命周期绑定客户端会话，会话断开即消失——这正是服务注册能「实例宕机自动摘除」的原理。不加 `-e` 时默认创建持久节点，会话断开也不会消失。详见[《06-ZooKeeper与Nacos》](#/f/f26)\n\n### 230.（ZooKeeper·难）用 ZooKeeper 实现分布式锁时，如果所有等待者都监听同一个锁节点，锁释放瞬间会出现什么现象？\n- A. 只唤醒排队时间最久的那一个客户端\n- B. ZooKeeper 会把通知自动排队，按注册先后逐个唤醒\n- C. 所有等待者同时被唤醒并涌向服务端抢锁，形成羊群效应，给 ZK 带来瞬时压力\n- D. Watcher 只触发一次，所以其余客户端永远收不到通知\n\n答案：C\n解析：这就是「惊群/羊群效应」：一次事件唤醒大量客户端，最终只有一个抢到锁，其余白跑一趟。正确做法是改用临时顺序节点，每个客户端只监听「比自己序号小的前一个节点」，释放时只唤醒下一个等待者。详见[《06-ZooKeeper与Nacos》](#/f/f26)\n\n### 231.（ZooKeeper·难）关于 ZAB 与 Paxos 的关系，说法正确的是？\n- A. Paxos 是通用的分布式一致性算法；ZAB 是为「主备模式的原子广播」设计的协议，靠 zxid/epoch 保证全局有序，包含消息广播与崩溃恢复两个阶段\n- B. ZAB 是通用一致性算法，而 Paxos 只能用于主备系统\n- C. 两者完全等价，ZAB 只是 Paxos 的 Java 语言实现\n- D. ZAB 只要 Leader 自己写入成功即可提交，无需过半确认\n\n答案：A\n解析：Paxos 解决「一批节点就某个值达成一致」的通用问题，本身不保证全序；ZAB 面向主备复制状态机，要求所有写请求经 Leader 排序后广播、过半节点确认才提交，从而保证各副本状态顺序一致。详见[《06-ZooKeeper与Nacos》](#/f/f26)\n\n### 232.（ZooKeeper·中）「ZooKeeper 不适合做注册中心」最主要的理由是？\n- A. ZK 不支持临时节点，无法自动摘除宕机实例\n- B. ZK 没有 Watcher 机制，调用方无法感知实例列表变化\n- C. ZK 只能单机部署，无法组建集群\n- D. ZK 是 CP 系统，Leader 选举期间整个集群拒绝服务，而服务发现更看重可用性——宁可返回一份略旧的实例列表\n\n答案：D\n解析：A、B、C 都与事实相反，临时节点与 Watcher 恰恰是 ZK 的看家本领。真正的短板在 CP 语义带来的「选举期不可写」，再加上 Watcher 一次性、无控制台、运维成本高，新项目基本不再选它做注册中心。详见[《06-ZooKeeper与Nacos》](#/f/f26)\n\n### 233.（ZooKeeper·中）Nacos 的「保护阈值」是为了解决什么问题？\n- A. 限制单个客户端对配置中心的请求频率\n- B. 当健康实例比例低于阈值时，把不健康实例也一并返回给调用方，避免返回空列表导致整个服务不可用\n- C. 当配置中心连接断开时自动降级读取本地缓存\n- D. 心跳超过 15 秒未到达就立即剔除该实例\n\n答案：B\n解析：这是「可用性优先」的体现：返回一份可能部分不可用的列表，调用方最多部分请求失败；一旦返回空列表，整条调用链会瞬间全挂。D 描述的是心跳超时标记不健康的机制（15 秒），并非保护阈值。详见[《06-ZooKeeper与Nacos》](#/f/f26)\n\n### 234.（ZooKeeper·中）Nacos 中 Distro 协议与 Raft 协议的分工，正确的是？\n- A. 临时实例走 Distro（AP，异步复制、最终一致），持久实例与配置中心走 Raft（CP，强一致）\n- B. 临时实例走 Raft 保强一致，持久实例走 Distro 保可用\n- C. 两者都走 Raft，只是配置参数不同\n- D. Distro 负责配置存储，Raft 负责服务发现\n\n答案：A\n解析：绝大多数微服务注册成临时实例（默认），要的正是「宕机也能返回旧列表」的 AP 语义，靠客户端心跳与超时剔除实现最终一致；数据库类等必须全员强一致的服务才注册成持久实例走 CP。同一集群可同时承载两种模式。详见[《06-ZooKeeper与Nacos》](#/f/f26)\n\n### 235.（Nginx·中）配置 `location /api/ { proxy_pass http://backend/; }`，浏览器请求 `GET /api/user/1` 时后端收到的路径是？\n- A. /api/user/1\n- B. /user/1\n- C. /backend/api/user/1\n- D. /api/\n\n答案：B\n解析：proxy_pass 的地址结尾带 `/` 时，Nginx 会把 location 匹配到的前缀 `/api/` 替换掉再转发；若写成 `proxy_pass http://backend;`（结尾不带 `/`），则会把 `/api/user/1` 原样转发给后端。这一字之差是配置反向代理最常见的坑。详见[《07-Nginx》](#/f/f27)\n\n### 236.（Nginx·中）`limit_req zone=apiLimit burst=20 nodelay;` 中 nodelay 的作用是？\n- A. 超过 burst 的请求直接返回 503，不做任何缓冲\n- B. 把限流速率 rate 降到原来的一半\n- C. burst 范围内的突发请求立即被处理，不按 rate 匀速排队等待\n- D. 关闭限流计数，只记录日志不拦截\n\n答案：C\n解析：burst 是允许排队的突发量；不加 nodelay 时这些请求会被匀速放行，客户端看到明显延迟；加了 nodelay 则立即处理，只有超出 burst 的部分才会被拒绝。rate=10r/s 约束的是平均速率，burst 让瞬时尖峰能被吸收。详见[《07-Nginx》](#/f/f27)\n\n### 237.（Nginx·难）多个 worker 进程同时监听同一端口会引发惊群问题，Nginx 的应对方式是？\n- A. 把 worker_processes 设为 1，单进程自然没有惊群\n- B. 用 accept_mutex 让 worker 串行竞争 accept 权，同一时刻只让一个 worker 监听新连接（新内核下由 EPOLLEXCLUSIVE 承担同类职责）\n- C. 关闭 epoll，改用 select 模型\n- D. 让每个 worker 监听不同端口，再由 master 统一转发\n\n答案：B\n解析：惊群指新连接到来时，所有阻塞在事件等待上的 worker 都被唤醒，却只有一个能 accept，其余白白被唤醒消耗 CPU。accept_mutex 通过「同一时刻只有一个 worker 有机会 accept」消除无谓唤醒；worker 数通常设为 CPU 核数，多进程 + epoll 正是 Nginx 高并发的根基。详见[《07-Nginx》](#/f/f27)\n\n### 238.（Nginx·易）Vue history 模式下刷新子路由出现 404，应该补上的 Nginx 配置是？\n- A. location / { return 301 /index.html; }\n- B. location / { proxy_pass http://backend; }\n- C. location / { expires 7d; }\n- D. location / { root /usr/share/nginx/html; try_files $uri $uri/ /index.html; }\n\n答案：D\n解析：try_files 依次尝试「文件 → 目录 → 兜底 index.html」，把找不到的路径交给前端路由自己接管。A 用 301 会改写浏览器地址栏，B 会把静态资源请求打到后端应用，C 只管缓存头、解决不了 404。详见[《07-Nginx》](#/f/f27)\n\n### 239.（MongoDB·易）MongoDB 默认生成的 ObjectId 由哪几部分组成？\n- A. 4 字节时间戳 + 8 字节纯随机数\n- B. 4 字节秒级时间戳 + 5 字节机器/进程随机值 + 3 字节自增计数\n- C. 12 字节整型自增序列\n- D. 8 字节时间戳 + 4 字节分片键哈希\n\n答案：B\n解析：共 12 字节，前 4 字节是创建时间（所以 ObjectId 大致按时间递增），中间 5 字节标识机器与进程，最后 3 字节是同一秒内的自增计数。应用端即可生成、不依赖数据库协调，天然趋势递增，适合做索引键。详见[《08-MongoDB》](#/f/f28)\n\n### 240.（MongoDB·中）要按品牌统计商品数量与均价（只看 1000 元以上的商品），聚合管道的阶段顺序应为？\n- A. [{ $match: { price: { $gte: 1000 } } }, { $group: { _id: \"$brand\", count: { $sum: 1 }, avgPrice: { $avg: \"$price\" } } }, { $sort: { count: -1 } }]\n- B. [{ $group: { _id: \"$brand\", count: { $sum: 1 } } }, { $match: { price: { $gte: 1000 } } }, { $sort: { count: -1 } }]\n- C. [{ $sort: { count: -1 } }, { $match: { price: { $gte: 1000 } } }, { $group: { _id: \"$brand\" } }]\n- D. [{ $group: { _id: \"$brand\", count: { $sum: 1 } } }, { $sort: { count: -1 } }, { $match: { price: { $gte: 1000 } } }]\n\n答案：A\n解析：聚合管道严格按数组顺序执行。$match 越靠前越能先滤掉无关文档、大幅减少后续阶段的数据量（还能利用索引），$group 做分组聚合，$sort 最后对聚合结果排序。B、D 在 $group 之后才过滤，等于白算了一大批文档；C 里 $sort 的 count 字段此时根本不存在。详见[《08-MongoDB》](#/f/f28)\n\n### 241.（MongoDB·难）关于 MongoDB 的写关注（writeConcern），说法正确的是？\n- A. w:1 表示所有副本节点都确认后才返回\n- B. w:0 表示必须等主节点落盘后才返回\n- C. w:\"majority\" 表示多数节点确认后才返回，可降低主节点故障回滚导致的数据丢失风险；j:true 则要求写入 journal 日志后才确认\n- D. writeConcern 只对分片集群生效，副本集下没有意义\n\n答案：C\n解析：w 决定「多少个节点确认才返回」：w:0 是发出去就不管（最快，可能丢），w:1 只需主节点确认（主节点故障时可能被回滚），w:\"majority\" 最稳但延迟最高；j 控制是否等待写入 journal 落盘。写关注越高越安全、越慢，需按业务取舍。详见[《08-MongoDB》](#/f/f28)\n\n### 242.（框架·中）某事务方法内部执行 `try { mapper.update(x); } catch (Exception e) { log.error(\"更新失败\", e); }`，异常被捕获后方法正常返回，这条 update 会？\n- A. 因为事务内出现过异常，仍然回滚\n- B. 方法返回后 Spring 会复查日志，发现异常后回滚\n- C. 不回滚：代理感知不到异常，事务正常提交\n- D. 取决于 update 与后续操作是否在同一个 Mapper\n\n答案：C\n解析：回滚与否只看异常有没有传播到代理；被 try-catch 吞掉后代理认为方法正常完成，于是提交已执行的更新——这就是\"异常被吞导致事务失效\"。要局部容错又想回滚，需显式标记回滚，或把该操作拆到另一个 Bean 的独立事务里。详见[《Spring核心》](#/f/f15)\n\n### 243.（框架·中）`@Bean public OrderService orderService(UserRepository repo) { return new OrderService(repo); }` 这种写法？\n- A. 可行：容器会解析方法参数并从容器中按类型注入\n- B. 编译报错：@Bean 方法的签名不允许带参数\n- C. 启动报错：@Bean 方法只能返回容器已有的 Bean\n- D. 可以启动，但参数恒为 null，仍需在方法体里手动 new\n\n答案：A\n解析：@Bean 方法的参数由 Spring 自动解析注入，等价于构造器注入；@Configuration + @Bean 适合装配没有源码、打不了注解的第三方类。详见[《Spring核心》](#/f/f15)\n\n### 244.（框架·难）Spring 中的 AOP 代理对象，通常是在 Bean 生命周期的哪个环节由 BeanPostProcessor 生成的？\n- A. 实例化之前，由 InstantiationAwareBeanPostProcessor 预先生成\n- B. 属性填充阶段，与依赖注入同时完成\n- C. postProcessAfterInitialization：初始化方法都执行完之后\n- D. postProcessBeforeInitialization：@PostConstruct 执行之前\n\n答案：C\n解析：初始化链路是 Aware 回调 → postProcessBeforeInitialization → @PostConstruct/afterPropertiesSet/init-method → postProcessAfterInitialization，代理通常在最后一步由 AbstractAutoProxyCreator 生成，因此代理对象里的目标对象是\"完全初始化好的 Bean\"。详见[《Spring核心》](#/f/f15)\n\n### 245.（框架·中）在一个 `@Transactional(propagation = REQUIRED)` 的 orderCreate 方法中，跨 Bean 调用了另一个 `@Transactional(propagation = REQUIRES_NEW)` 的 saveLog 方法；saveLog 执行成功后 orderCreate 抛异常，结果是？\n- A. 订单更新与日志一起回滚\n- B. 订单更新与日志一起提交\n- C. 日志回滚，订单更新提交\n- D. 订单更新回滚，日志已经独立提交、不随之回滚\n\n答案：D\n解析：REQUIRED 会加入当前事务，REQUIRES_NEW 则挂起当前事务另开一个并先行提交，外层回滚影响不到它——这正是\"业务失败但操作日志必须留痕\"的做法。注意 NESTED 相反：外层回滚时它一定回滚。详见[《Spring核心》](#/f/f15)\n\n### 246.（框架·中）自动配置类中的 @Bean 方法标注了 @ConditionalOnMissingBean，而用户自己定义了一个同类型 Bean，结果是？\n- A. 两个 Bean 都注册，注入时抛 NoUniqueBeanDefinitionException\n- B. 用户定义的 Bean 被覆盖，自动配置的生效\n- C. 自动配置的 Bean 不注册，用户定义的生效\n- D. 必须再加 @Primary 才能决定用哪一个\n\n答案：C\n解析：@ConditionalOnMissingBean 的含义是\"容器里没有同类型 Bean 才生效\"，所以用户的配置永远让位——这就是\"默认配置永远让位给你的配置\"，也是约定优于配置的实现方式。详见[《SpringBoot实战》](#/f/f16)\n\n### 247.（框架·易）下列哪个注解不属于 @SpringBootApplication 的组成部分？\n- A. @SpringBootConfiguration\n- B. @EnableAutoConfiguration\n- C. @ComponentScan\n- D. @MapperScan\n\n答案：D\n解析：@SpringBootApplication 是三合一：@SpringBootConfiguration（本质是 @Configuration）、@EnableAutoConfiguration（自动配置开关）、@ComponentScan（扫描主类所在包及子包）。@MapperScan 是 MyBatis 扫描 Mapper 接口用的，需要自己加。详见[《SpringBoot实战》](#/f/f16)\n\n### 248.（框架·中）`public interface TodoMapper extends BaseMapper<Todo> {}` 是一个完全空的接口，关于它的说法正确的是？\n- A. 必须再手写一个实现类，否则启动就报错\n- B. 只要起了这个名字，BaseMapper 就会为它生成多表关联查询\n- C. 不写 XML 就无法进行任何数据库操作\n- D. 继承即得单表 CRUD，无需实现类；多表复杂 SQL 仍要回到 XML 手写\n\n答案：D\n解析：MyBatis-Plus 的定位是消灭单表 CRUD 的重复劳动，Condition 构造器还能省掉大量动态 SQL；但复杂关联查询仍推荐手写 XML——知道这条边界比背 API 重要。详见[《MyBatis》](#/f/f17)\n\n### 249.（框架·中）只传 title 参数执行下面这段 update，`<set>` 标签起到的作用是？\n- A. 把 set 关键字替换成 update，兼容不同数据库\n- B. 参数全为空时生成 `SET WHERE`，需要自己兜底\n- C. 只保留第一个生效的 if 内容，其余丢弃\n- D. 自动去掉末尾多余的逗号，生成 `UPDATE todo SET title = ? WHERE id = ?`\n\n答案：D\n解析：`<set>` 会智能追加 SET 关键字并删除末尾多余的逗号；与之对应 `<where>` 自动去掉开头的 AND/OR，两者底层都由 `<trim>` 实现。记忆口诀：if 拼接、where 去头、set 去尾。详见[《MyBatis》](#/f/f17)\n\n### 250.（框架·难）MyBatis 二级缓存（namespace 级）在生产环境通常不开启，主要原因是？\n- A. 二级缓存默认关闭，必须改造源码才能开启\n- B. 二级缓存只在单个 SqlSession 内生效，命中率太低\n- C. 其他 Mapper 更新了关联表时本 namespace 的缓存不会被清，容易读到旧数据\n- D. 二级缓存的 key 只有 SQL 语句，与 namespace 无关，会互相覆盖\n\n答案：C\n解析：二级缓存按 namespace 隔离、跨 SqlSession 共享，多表关联时任一张表被别的 Mapper 更新，本 namespace 感知不到，于是脏读；分布式部署下多节点缓存也不同步。生产一般关闭它，统一用 Redis 做缓存。详见[《MyBatis》](#/f/f17)\n\n### 251.（框架·难）把 `mybatis-plus.configuration.map-underscore-to-camel-case` 显式设为 false，实体属性是 `LocalDateTime createdAt`、数据库列是 `created_at`，执行 `selectById`（没写 resultMap，SQL 也没起别名）的结果是？\n- A. 正常映射：框架会自动把 created_at 改写成驼峰列名\n- B. createdAt 为 null：列名与属性名对不上，自动映射失败\n- C. 启动直接报错，提示列名与属性名不匹配\n- D. 查询抛异常，必须给该字段加 @TableField 才能启动\n\n答案：B\n解析：下划线转驼峰是自动映射的一部分，关掉之后 `created_at` 找不到同名属性，字段就一直是 null，而程序不会报错——这类\"静默丢字段\"最难排查。生产建议保持开启，或在 SQL 里用别名 / resultMap 显式映射。详见[《MyBatis》](#/f/f17)\n\n### 252.（框架·易）Gateway 路由配置里 `uri: lb://order-service` 中的 lb 表示？\n- A. 从注册中心获取该服务的实例列表，负载均衡选一台发请求\n- B. 直接按 yml 里写死的 IP 直连，不做负载均衡\n- C. 只在本地开发环境生效，生产必须换成 http://\n- D. 表示对这条路由使用长连接，减少握手开销\n\n答案：A\n解析：lb 即 load balance：网关拿着服务名去注册中心取实例列表，再由负载均衡器选一台转发。写成 http://ip:port 就退化成写死地址，扩缩容后要改配置。详见[《SpringCloud微服务》](#/f/f18)\n\n### 253.（框架·易）Nacos 中 namespace 的主要作用是？\n- A. 隔离同一个项目里的不同模块\n- B. 用来做配置的灰度发布\n- C. 隔离 dev/test/prod 等环境，环境之间配置与服务互不可见\n- D. 决定配置项之间的加载优先级\n\n答案：C\n解析：namespace 隔离环境，group 隔离项目/模块，配置按 `dataId + group + namespace` 三元组定位——这条常被答反。详见[《SpringCloud微服务》](#/f/f18)\n\n### 254.（框架·中）认证全局过滤器实现了 `getOrder()` 返回 -1，另一个全局过滤器返回 1，执行顺序是？\n- A. 返回 -1 的先执行\n- B. 返回 1 的先执行\n- C. 两者并发执行，顺序不确定\n- D. getOrder 只对路由级过滤器生效，全局过滤器按注册顺序\n\n答案：A\n解析：Ordered 的数值越小优先级越高、越先执行，鉴权过滤器返回 -1 就是为了在业务过滤器之前拦下未登录请求。详见[《SpringCloud微服务》](#/f/f18)\n\n### 255.（框架·中）Nacos 临时实例默认每 5s 上报一次心跳，实例多久未心跳会被标记为不健康、多久被剔除？\n- A. 5s 不健康，15s 剔除\n- B. 15s 不健康，30s 剔除\n- C. 30s 不健康，60s 剔除\n- D. 一次心跳丢失即标记不健康并立即剔除\n\n答案：B\n解析：15s 未心跳标记不健康（此时仍会被调用方拿到，属于\"带病实例\"窗口），30s 未心跳才剔除；消费者本地还会缓存实例列表，注册中心短暂不可用时仍能按缓存调用。详见[《SpringCloud微服务》](#/f/f18)\n\n### 256.（框架·难）接口用 `@SentinelResource(value = \"getProduct\", blockHandler = \"getProductBlock\", fallback = \"getProductFallback\")` 标注，并给它配了 QPS=2 的快速失败流控规则；快速刷新触发限流时请求会？\n- A. 直接把 BlockException 抛给前端，返回 500\n- B. 走 getProductFallback 方法\n- C. 在队列中排队等待，直到令牌可用\n- D. 走 getProductBlock 方法返回兜底结果\n\n答案：D\n解析：blockHandler 专门处理限流/熔断等 BlockException（参数要与原方法一致、末尾多一个 BlockException），fallback 处理的是业务异常，两者别混。快速失败意味着不排队等待，直接走兜底。详见[《SpringCloud微服务》](#/f/f18)\n\n### 257.（单元测试·易）Mockito 的 @Mock 对象，没有被 when 打桩的方法被调用时返回什么？\n- A. 抛出 UnsupportedOperationException\n- B. 对象类型返回 null，基本类型返回 0/false\n- C. 返回真实实现的结果\n- D. 编译不通过，必须先给所有方法打桩\n\n答案：B\n解析：假对象默认返回空值，所以链式调用 `when(mock.getA().getB())` 会直接 NPE——这是最常见的坑；另外 MockitoExtension 默认 strict stubs，多余的打桩会直接报错，逼你删掉无用的桩。详见[《05-单元测试与工程质量》](#/f/f19)\n\n### 258.（单元测试·中）关于 MockMvc，下列说法正确的是？\n- A. 不启动真实端口，把模拟请求直接交给 DispatcherServlet 处理，用于测 Web 层\n- B. 会启动内嵌 Tomcat 并监听随机端口，因此能测到过滤器完整链路\n- C. 必须连接真实数据库才能断言响应\n- D. 只能发送 GET 请求，POST 要用 TestRestTemplate\n\n答案：A\n解析：MockMvc 省去了真实网络与端口，配合 @WebMvcTest 只加载 Controller/Advice/序列化等 Web 层组件，Service 要用 @MockBean 顶替（切片里没有这个 Bean，用 @Mock 注入不进去）。需要覆盖过滤器/拦截器完整链路时，才改用 RANDOM_PORT 的真实端口方案。详见[《05-单元测试与工程质量》](#/f/f19)\n\n### 259.（单元测试·中）`@ParameterizedTest @CsvSource({\"' ', false\", \"'', false\", \"'写周报', true\"})` 修饰的测试方法会怎样执行？\n- A. 只执行一次，取最后一行参数\n- B. 执行 3 次，每次注入 CSV 中的一行参数\n- C. 编译报错，参数化测试必须同时加 @Test\n- D. 随机挑选其中一行执行，用来做随机测试\n\n答案：B\n解析：参数化测试把 N 个用例写成 1 个方法，@CsvSource 每行一组参数；单参数可用 @ValueSource，复杂对象用 @MethodSource 提供 Stream。注意 @ParameterizedTest 本身已替代 @Test，再加 @Test 反而会因缺参数而失败。详见[《05-单元测试与工程质量》](#/f/f19)\n\n### 260.（单元测试·中）测试中 ArgumentCaptor 的作用是？\n- A. 捕获被 mock 方法实际收到的参数，用于断言传进去的到底是什么\n- B. 捕获被测方法抛出的异常并断言异常消息\n- C. 统计某个方法被调用的次数\n- D. 捕获被测类的日志输出并做断言\n\n答案：A\n解析：verify 只能断言\"调没调、调几次\"，参数捕获才能断言\"传了什么\"——例如校验落库对象里的 createBy 是否被正确填充；调用次数用 `times()/never()`，限时用 assertTimeoutPreemptively。详见[《05-单元测试与工程质量》](#/f/f19)\n\n### 261.（认证与安全·易）为什么\"忘记密码\"只能重置，不能把原密码发给用户？\n- A. 服务端存的是 BCrypt 这类单向哈希，本来就无法还原出原密码\n- B. 原密码只存在 Redis 里，过了期就取不到了\n- C. 原密码用 AES 加密存储，但密钥在重启后丢失\n- D. 只是合规要求，技术上完全可以还原\n\n答案：A\n解析：哈希是单向的，服务端连自己都无法还原——这正是\"存的是哈希\"的证明。要区分三个概念：哈希单向不可逆（存密码）、加密双向有密钥（存手机号等要还原的数据）、编码只是格式转换不算安全手段。详见[《06-认证与安全》](#/f/f20)\n\n### 262.（认证与安全·易）下面哪一项描述的是 XSS 及其正确防御？\n- A. 用户输入被拼进 SQL 改变语义，防御靠预编译占位符\n- B. 评论内容里的脚本被浏览器当成代码执行，防御靠输出转义、HttpOnly Cookie 与 CSP\n- C. 借用户已登录的 Cookie 诱导浏览器发出伪造请求，防御靠 SameSite 与 CSRF Token\n- D. 伪造 JWT 签名冒充他人，防御靠改用 RS256 并把密钥藏好\n\n答案：B\n解析：记忆锚点：SQL 注入是\"数据在数据库被当代码执行\"，XSS 是\"数据在浏览器被当代码执行\"，CSRF 是\"请求冒充了合法用户\"。HttpOnly 让脚本读不到 Cookie，正是为了压缩 XSS 窃取凭据的收益。详见[《06-认证与安全》](#/f/f20)\n\n### 263.（认证与安全·中）对同一个密码连续调用两次 `encoder.encode(raw)`，得到的哈希串不同，原因是？\n- A. BCrypt 在结果里混入了时间戳，每次都不一样\n- B. BCrypt 会先把密码倒序，顺序随当前时间变化\n- C. 结果串被 Base64 编码时会引入随机字符\n- D. 每次都会随机生成盐并连同结果一起保存，比对时用同一个盐重算\n\n答案：D\n解析：盐是随机生成并写在哈希串里的，所以同一密码每次结果都不同，彩虹表直接失效；BCrypt 还是慢哈希，把 GPU 暴力破解的成本抬高几个数量级。比对必须用 `matches(raw, encoded)`，不能自己再 encode 一次比字符串。详见[《06-认证与安全》](#/f/f20)\n\n### 264.（认证与安全·中）下列做法中，真正用于防御 CSRF 的是？\n- A. 对用户输入统一做 HTML 转义\n- B. 给会话 Cookie 加上 HttpOnly 属性\n- C. 校验 Origin/Referer，并使用 SameSite Cookie 与 CSRF Token\n- D. 全站强制 HTTPS 加密传输\n\n答案：C\n解析：CSRF 的核心是浏览器自动带上目标站 Cookie，所以要么让浏览器不自动带（SameSite），要么要求请求带一个攻击者拿不到的凭证（CSRF Token），要么校验来源。A、B 是 XSS 防御，D 防的是窃听与篡改，都挡不住伪造请求。加分点：Header + JWT 方案因为不会自动携带 Authorization 头，天然免疫大半。详见[《06-认证与安全》](#/f/f20)\n\n### 265.（认证与安全·难）JWT 无状态带来\"注销难\"，工程上较完整的解法是？\n- A. 把有效期设为永久，避免过期带来的登录中断\n- B. 服务端为每个签发的 JWT 保存完整会话，注销时删掉\n- C. 短期 Access Token + 可吊销的 Refresh Token，配合 Redis 黑名单与改密后强制失效\n- D. 注销时前端删除本地存储的 token 即可\n\n答案：C\n解析：JWT 的无状态是用\"吊销难\"换来的：服务端不存会话，只能等它自然过期。务实做法是缩短 Access Token 寿命、把长期凭证换成存库可吊销的 Refresh Token，再用 Redis 黑名单兜底；B 等于把 JWT 用回了 Session，D 毫无作用——token 仍然有效。详见[《06-认证与安全》](#/f/f20)\n\n### 266.（分布式与高并发·易）关于 MySQL 读写分离，下列说法正确的是？\n- A. 读写分离能同时解决读压力、写压力和数据量增长三个问题\n- B. 读写分离把读请求分摊到从库以缓解读压力，但不解决单表数据量与写压力\n- C. 读写分离要求从库与主库强一致，因此不存在复制延迟\n- D. 读写分离后所有查询都应走从库，包括下单后立刻查订单\n\n答案：B\n解析：主从复制是异步的，延迟通常毫秒级，但大事务、从库负载高时会放大到秒级，所以\"写后立刻读\"的关键路径必须强制走主库。读写分离只分担读；数据量增长与写压力要靠分库分表，这是两条不同的扩展路线。详见[《02-高并发系统设计》](#/f/f30)\n\n### 267.（分布式与高并发·难）某电商大促期间机房网络抖动，注册中心集群被切成两个分区。运维观察到：部分调用方拿到的实例列表里仍有已下线的节点，调用报错；但注册中心控制台仍能打开，也能继续注册新实例。该注册中心最可能是哪种取向，代价是什么？\n- A. CP 取向，因为控制台可用就证明数据一致\n- B. CP 取向，代价是重新选举期间整个集群拒绝服务\n- C. AP 取向，各分区独立对外服务，代价是分区期间可能读到过期的实例列表，需要调用方靠重试与熔断兜底\n- D. 与 CAP 无关，注册中心只负责存储，不参与任何取舍\n\n答案：C\n解析：节点对等、任一节点可用即可完成注册发现、宁可返回旧列表也不整体不可用，这是典型 AP 表现（Eureka、Nacos 默认的临时实例）。CP 的对照面是 ZooKeeper：主节点宕机后需重新选举，期间整个集群不可用（可达数十秒到两分钟），宁停服不脏读。选型看的是\"业务能不能容忍读到旧实例列表\"，而不是谁更先进。详见[《01-分布式理论基础》](#/f/f29)\n\n### 268.（分布式与高并发·易）缓存集群从 3 个节点扩到 4 个，运维只改了应用里的取模基数，随后数据库压力陡增。最直接的原因是？\n- A. 取模基数一变，绝大多数 key 的落点都变了，缓存几乎全部失效\n- B. 新节点上的槽位需要时间预热，预热期间读请求会穿透到数据库\n- C. 客户端没有预热，冷启动必然打满数据库\n- D. 4 个节点无法组成集群，必须使用奇数节点\n\n答案：A\n解析：`hash(key) % N` 的落点与 N 强绑定，N 从 3 变 4 时只有极少数 key 恰好落回原节点，等于整层缓存被清空。一致性哈希把取模换成\"哈希环 + 顺时针寻址\"，增删节点只影响相邻区段，迁移量约 1/N。要能顺口说出\"为什么是 1/N\"：只有新节点逆时针到上一个节点之间的那段数据需要搬家。详见[《01-分布式理论基础》](#/f/f29)\n\n### 269.（分布式与高并发·易）一致性哈希引入\"虚拟节点\"主要是为了解决什么问题？\n- A. 降低哈希计算的复杂度\n- B. 让节点之间自动同步数据副本\n- C. 保证任意时刻都能读到最新数据\n- D. 物理节点较少时在环上分布不均造成的数据倾斜\n\n答案：D\n解析：节点少的时候，几台机器在 2^32 的环上可能挤在一起，导致大部分数据压在同一台上。给每个物理节点生成 100~200 个虚拟节点散布到环上，数据先落到虚拟节点再映射回物理节点，分布就均匀了；某个节点下线时压力也会由多台分摊，而不是全给它的顺时针后继。详见[《01-分布式理论基础》](#/f/f29)\n\n### 270.（分布式与高并发·易）分库分表后引入全局 ID，除了唯一性，选型时最需要关注的性质是？\n- A. 生成的 ID 必须足够短\n- B. 趋势递增，让 B+ 树顺序插入、避免频繁页分裂\n- C. 必须包含业务含义，能从 ID 直接看出下单时间\n- D. 必须由数据库集中生成以保证绝对不重复\n\n答案：B\n解析：分表后单表自增只能保证表内唯一，必须引入全局发号器。趋势递增是关键：UUID 无序，插入时页分裂多、写放大严重，还占 36 个字符；雪花算法与号段模式都能趋势递增，且本地或半本地生成，不把发号变成新的单点。详见[《01-分布式理论基础》](#/f/f29)\n\n### 271.（分布式与高并发·中）某订单服务用雪花算法生成 ID，线上只部署了 1 个 worker。大促零点峰值下单量实测约 500 万 ID/秒，仅从雪花算法的结构看能否撑住？\n- A. 够，12 位序列号表示每毫秒 4096 个，合每秒 4096 万\n- B. 够，时间戳是毫秒级的，一毫秒内可以无限生成\n- C. 不够，单 worker 每毫秒最多 4096 个 ID，每秒上限约 409 万，需拆分 workerId 或改用号段模式\n- D. 不够，雪花算法的单机上限只有每秒 10 万，必须依赖 Redis 发号\n\n答案：C\n解析：12 位序列号在**同一毫秒内**只提供 0~4095 共 4096 个 ID，乘 1000 毫秒即约 409.6 万/秒，这是单 worker 的理论天花板；序列号在一毫秒内打满后只能阻塞到下一毫秒，表现为延迟毛刺。百万级 QPS 要么拆 workerId（10 位机器 ID 最多 1024 台），要么改用号段模式——一次取一段缓存在内存，把发号压力摊薄。详见[《01-分布式理论基础》](#/f/f29)\n\n### 272.（分布式与高并发·中）Redisson 的看门狗（watchdog）自动续期，在什么条件下才会生效？\n- A. 只要调用了 tryLock 就会生效\n- B. 只有方法上加了 @Transactional 才会生效\n- C. 锁被其他线程抢占后会自动续期\n- D. 加锁时没有显式指定 leaseTime 才生效，默认 30 秒过期、约每 10 秒续一次\n\n答案：D\n解析：不传 leaseTime 时 Redisson 默认给 30 秒过期，并启动后台线程按 1/3 周期（约 10 秒）检查续期，业务没执行完锁就不会失效。一旦显式传了 leaseTime，等于声明\"超时我自己负责\"，看门狗不再介入——业务跑超时也没人救，这是线上最常见的踩坑点。释放时配合 `isHeldByCurrentThread()` 判断，避免误删他人重新抢到的锁。详见[《01-分布式理论基础》](#/f/f29)\n\n### 273.（分布式与高并发·中）某服务用 Redis 单实例 + 主从（哨兵）实现分布式锁，以主节点写入成功为准。一次主节点宕机触发切换后，出现了两个请求同时进入扣减逻辑。原因是？\n- A. 主从复制是异步的，锁还没同步到从库主节点就宕机了，切换后新主节点上根本没有这把锁\n- B. 哨兵会自动删除所有带过期时间的 key\n- C. 从库提升为主库后会清空全部数据\n- D. SET NX 命令在主从架构下不生效\n\n答案：A\n解析：A 在旧主写锁成功，这条写命令尚未同步到从库，旧主就宕机了；从库被提升为新主后锁并不存在，B 于是也能加锁成功，互斥被打破。这是\"Redis 锁可靠性中等\"的根因，也是 Redlock 试图解决的问题。对绝对不能出错、且能接受性能代价的场景（选主、元数据变更），应换用 ZooKeeper 的临时节点锁。详见[《01-分布式理论基础》](#/f/f29)\n\n### 274.（分布式与高并发·中）用 ZooKeeper 实现公平锁时，每个客户端只监听自己前一个顺序节点的删除事件，而不是监听 /locks 下所有子节点的变化，目的是？\n- A. 减少 ZK 集群的磁盘写入量\n- B. 让锁支持可重入\n- C. 避免羊群效应：一次释放唤醒全部等待者，绝大多数抢不到还要重新注册监听，形成无效广播\n- D. 绕过 ZAB 协议过半提交的限制\n\n答案：C\n解析：如果所有人都监听父节点，每次释放锁都会唤醒全部等待者，它们抢不到锁只能重新注册，白白制造一轮惊群。只 watch 前一个节点，锁释放时恰好唤醒队首的下一个，天然形成公平队列。ZK 锁的另一优势是临时节点随会话消失，客户端宕机锁自动释放，不会死锁；代价是写要走 ZAB 过半提交，性能不如 Redis。详见[《01-分布式理论基础》](#/f/f29)\n\n### 275.（分布式与高并发·难）TCC 中的\"悬挂\"指的是哪种时序问题？\n- A. Try 先到、Confirm 迟迟不来，资源被长期冻结\n- B. Confirm 重试导致资源被重复扣减\n- C. 参与方没收到 Try 却先收到 Cancel，回滚了一笔不存在的业务\n- D. Cancel 先执行完，迟到的 Try 才落地并冻结资源，此后没有任何事务会再来解冻它\n\n答案：D\n解析：C 描述的是**空回滚**——Try 从未执行，Cancel 却先到，若不识别就会误改数据；D 才是**悬挂**，Cancel 已走完，迟到的 Try 又把资源冻上，这笔冻结永远不会被释放。两者都靠\"事务状态表 + 幂等控制\"化解：执行 Cancel 前先查/插入状态记录（区分\"从未 Try\"与\"Try 成功\"），Try 落地前也先校验状态，发现已回滚就拒绝执行。详见[《01-分布式理论基础》](#/f/f29)\n\n### 276.（分布式与高并发·难）关于\"本地消息表\"与\"RocketMQ 事务消息\"的可靠性差异，下列说法最准确的是？\n- A. 两者完全等价，只是把消息表放在了不同位置\n- B. 本地消息表把业务写入与消息记录放在同一个本地事务里，MQ 当时不可用也不影响业务提交；事务消息依赖 Broker 回查生产者，生产者长时间不可达时消息会悬而未决\n- C. 事务消息不依赖任何回查机制，因此可靠性一定强于本地消息表\n- D. 本地消息表必须依赖 XA 两阶段提交才能保证原子性\n\n答案：B\n解析：本地消息表的核心是\"业务数据和待发消息在同一个本地事务里落库\"，业务提交与消息留存天然原子，MQ 挂了也不影响下单，后台任务慢慢投递即可；代价是与业务耦合、消息表要定时清理。事务消息相当于把这张表搬进 Broker（半消息 + 定时回查），业务零侵入，但最终状态取决于生产者能否被回查触达。两者都是最终一致，不是强一致。详见[《01-分布式理论基础》](#/f/f29)\n\n### 277.（分布式与高并发·中）某接口用固定窗口限流，阈值 100 次/秒。客户端在某一秒的最后 0.1 秒发了 100 个请求，紧接着在下一秒的前 0.1 秒又发了 100 个，全部放行。这 0.2 秒里实际通过了多少请求，说明什么？\n- A. 100 个，限流器工作正常\n- B. 150 个，属于统计误差\n- C. 200 个，固定窗口在边界处最坏可放行 2 倍阈值，即临界突刺\n- D. 0 个，应当全部被拒绝\n\n答案：C\n解析：固定窗口只统计\"当前这一秒\"的计数，跨边界的两批请求分属不同窗口，各自都没超限，于是交界处最坏能通过 2 倍配额。滑动窗口把大窗口切成小格子统计\"最近 N 秒\"，把突刺摊平（Sentinel 采用）；令牌桶则用桶容量限制瞬时突发。详见[《02-高并发系统设计》](#/f/f30)\n\n### 278.（分布式与高并发·难）某服务调用下游的超时率从 1% 涨到 60%，平均耗时从 20ms 涨到 80ms。熔断器跳闸进入\"打开\"状态后，正确的后续行为是？\n- A. 打开状态持续一个冷却窗口，其间请求直接快速失败；冷却结束进入半开，只放行少量探测请求，成功率恢复则关闭熔断器，否则重新打开并重新计时\n- B. 打开后永久拒绝，必须人工重启服务才能恢复\n- C. 打开后立刻放行全部请求，靠客户端重试自愈\n- D. 打开与关闭以固定 1 秒为周期交替切换\n\n答案：A\n解析：断路器是\"关闭 → 打开 → 半开\"的闭环。打开期间直接快速失败、不再真正调用下游，避免调用方线程被慢请求拖死形成雪崩；冷却结束进入半开，只放极少量探测请求试探下游是否恢复，成功则回到关闭，失败则回到打开重新计时。注意半开不等于预热放量（Warm Up）：前者是试探，后者是让流量爬坡。另需留意，平均耗时会被长尾掩盖，熔断策略更常看慢调用比例与异常比例。详见[《02-高并发系统设计》](#/f/f30)\n\n### 279.（系统设计·中）要判断 10 亿条 URL 是否已经抓取过，团队先试了 Redis SET，算完内存账后放弃。若误判率要求约 1%，改用布隆过滤器大约需要多少内存？\n- A. 约 120MB\n- B. 约 12GB\n- C. 约 1.2GB\n- D. 约 120GB\n\n答案：C\n解析：Redis SET 存 10 亿条、单条约 32 字节，光数据就约 32GB，加上哈希表本身的桶开销更贵。布隆过滤器在 1% 误判率下约需 9.6 bit/元素，10 亿 × 9.6 bit ≈ 1.2GB，差了一个多数量级——这就是它赢的地方。代价是只能回答\"可能存在 / 一定不存在\"，且标准布隆不支持删除。详见[《03-系统设计场景题》](#/f/f31)\n\n### 280.（系统设计·难）承接上题，布隆过滤器的位数组长度 m 与哈希函数个数 k 需按容量 n 和目标误判率 p 推算。若 p 定为 1%，下列哪组取值最接近？\n- A. m/n ≈ 4 bit，k ≈ 2\n- B. m/n ≈ 9.6 bit，k ≈ 7\n- C. m/n ≈ 20 bit，k ≈ 14\n- D. m/n ≈ 1 bit，k ≈ 1\n\n答案：B\n解析：由 `m = -n·lnp/(ln2)²` 与 `k = (m/n)·ln2` 可得：p=1% 时约 9.6 bit/元素、k≈7；p=0.1% 时约 14.4 bit/元素。k 不是越大越好，超过最优值后位数组被置 1 的比例上升，误判率反而回升。工程上容量 n 估小了会让实际 p 迅速恶化，所以通常按预估峰值的两倍以上设计并定期重建。详见[《03-系统设计场景题》](#/f/f31)\n\n### 281.（系统设计·中）短链服务预计每年新增 1 亿条，团队坚持用自增 ID + Base62 生成短码，长度固定 6 位。仅从编码容量看，6 位够用多久？\n- A. 不够，62^6 只有约 5.7 亿，两年就耗尽\n- B. 够用 3 年，之后必须换成 8 位\n- C. 不够，Base62 只能表示纯数字，承载不了 1 亿条\n- D. 非常宽裕，62^6 ≈ 568 亿，按每年 1 亿条也能用几百年\n\n答案：D\n解析：Base62 用 0-9、A-Z、a-z 共 62 个字符作\"数字\"，6 位空间为 62^6 ≈ 568 亿，按 1 亿/年算足够用几百年。所以短链的瓶颈从来不在短码长度而在读：读多写少约 100:1，热点短码靠本地缓存 + Redis 两级缓存扛，不存在的短码用布隆过滤器提前挡掉，避免每一次瞎猜都打穿到 DB。详见[《03-系统设计场景题》](#/f/f31)\n\n### 282.（系统设计·难）秒杀扣减库存有三种常见做法：① DB 直接 `UPDATE stock SET num=num-1 WHERE id=? AND num>0`；② Redis + Lua 预扣成功后发 MQ 异步落库；③ 请求全量进 MQ，消费端串行扣减。某活动 100 万用户抢 1 万件，峰值读 QPS 约 10 万、真正下单写约 1 万。下列判断正确的是？\n- A. 只用 ① 会让 10 万级读请求全部打到 DB、连接池瞬间打满；② 把绝大部分无效流量挡在 Redis 层，DB 只承接队列匀速来的写，因此是主流方案；③ 的代价是用户长时间排队等待、反馈延迟大\n- B. ① 最可靠，应当用它扛下全部流量\n- C. ② 只要 Redis 预扣成功就绝不会超卖，DB 层不需要再兜底\n- D. ③ 最优，因为它能让每个请求都立刻拿到结果\n\n答案：A\n解析：这题考\"每一层挡掉什么\"。DB 条件更新（`AND num > 0`）是防超卖的**最后一道保险**，行锁加上影响行数为 0 即回滚，但它扛不住 10 万级 QPS；Redis + Lua 把\"查库存 + 扣减\"做成原子操作，在内存里挡掉绝大多数无效请求，再发 MQ 让 DB 匀速落库；全量进 MQ 等于把压力推给排队，用户拿不到即时反馈。C 的陷阱在于 Redis 与 DB 之间仍有不一致窗口（宕机丢数据、超时未支付要回补），所以那层条件更新必须保留，并配合定时对账。详见[《02-高并发系统设计》](#/f/f30)\n\n### 283.（系统设计·易）订单 15 分钟未支付要自动关闭。下列方案中，最不推荐用于生产环境的是？\n- A. RocketMQ 延迟消息 / 定时消息\n- B. RabbitMQ 死信队列 + TTL（或延迟插件）\n- C. JDK 的 DelayQueue，服务重启后重新装载一遍\n- D. Redis ZSET，score 存执行时间，后台轮询 ZRANGEBYSCORE\n\n答案：C\n解析：DelayQueue 是纯内存的优先级队列，单机、重启即全丢，多实例部署时每个实例还会各关一遍单。它适合进程内的短延时任务，不适合承担订单超时这类必须可靠触发的业务。生产上优先 MQ 延迟消息（业务解耦、消息不丢），量大时用时间轮或调度平台；无论哪种实现，关单动作都要幂等并带状态校验。详见[《03-系统设计场景题》](#/f/f31)\n\n### 284.（系统设计·中）关单任务与支付成功回调几乎同时到达，最稳妥的防冲突做法是？\n- A. 给关单加分布式锁，支付回调不加锁\n- B. 两边都用条件更新，例如关单执行 `UPDATE orders SET status=已关闭 WHERE id=? AND status=待支付`，影响行数为 0 说明已被回调改过，直接放弃\n- C. 把关单时间设在支付超时之后 1 秒，靠时间差避开\n- D. 先 `SELECT` 查一次状态，是待支付就关单\n\n答案：B\n解析：A 只给一边加锁，另一边照样能改，等于没锁；D 的\"先查后改\"之间存在窗口——查完是待支付，改之前回调已把状态改成已支付，结果出现\"已支付却被关闭\"。正确做法是把判断与修改合并成一条带状态条件的 UPDATE，借数据库行锁保证原子性，两边都这么做，谁先到谁生效，这就是状态机 + 条件更新的通用写法。详见[《03-系统设计场景题》](#/f/f31)\n\n### 285.（系统设计·中）微博类 Feed 流中，某大 V 有 3000 万粉丝。若采用写扩散（推模式），发一条微博会发生什么？通常怎么处理？\n- A. 没有问题，推模式读性能最好，应对所有用户统一使用\n- B. 只影响大 V 自己的发博耗时，对系统整体无影响\n- C. 应改为所有人统一用读扩散，彻底放弃写扩散\n- D. 一次发文要写 3000 万份收件箱，写放大严重且会长时间占满队列；标准做法是推拉结合，按粉丝量设阈值（如 10 万），大 V 走读扩散、普通用户走写扩散\n\n答案：D\n解析：推模式把成本放在写侧，粉丝千万级时一次发文就是千万次写入，即便分批 + 异步也会长时间积压；拉模式把成本放在读侧，粉丝一刷新就要聚合关注列表，延迟高。推拉结合按粉丝量划线：普通用户写扩散保证读得快，大 V 走读扩散避免写爆炸，粉丝读时再把大 V 的内容合并进来。收件箱一般只存最近 N 条 ID，翻页回源 DB，删除与可见性在读取时过滤。详见[《03-系统设计场景题》](#/f/f31)\n\n### 286.（工具链·易）已经执行过 `git add`，但还没提交，现在想让文件退出暂存区、已做的修改保留在工作区，应该用？\n- A. `git restore --staged <file>`\n- B. `git restore <file>`\n- C. `git reset --hard HEAD`\n- D. `git rm --cached <file>` 后再重新 add\n\n答案：A\n解析：restore 不带参数撤的是工作区（改动作废），加了 --staged 撤的是暂存区（改动保留）；老写法 `git reset HEAD <file>` 同义。`git rm --cached` 是把文件移出版本控制，文件会变成未跟踪状态，不是\"退出暂存\"的正确姿势。详见[《04-开发工具链-Git-Maven-Linux》](#/f/f12)\n\n### 287.（工具链·易）Maven 坐标中，用于唯一标识一个构件所必需的三要素是？\n- A. groupId、packaging、classifier\n- B. artifactId、scope、version\n- C. groupId、artifactId、version\n- D. groupId、artifactId、packaging\n\n答案：C\n解析：packaging 缺省为 jar、classifier 缺省为空，用于区分同一 POM 产出的不同构件，都不是定位构件的必需项；scope 只决定依赖在哪几套 classpath 上生效，与\"找到哪个包\"无关。详见[《04-开发工具链-Git-Maven-Linux》](#/f/f12)\n\n### 288.（工具链·易）线上停服务时先执行 `kill -15 <pid>` 而不是直接 `kill -9 <pid>`，主要原因是？\n- A. -15 更快，-9 要等内核调度一轮才生效\n- B. -15 发送 SIGTERM，进程可以捕获并执行 shutdown hook 做优雅下线；-9 是 SIGKILL，进程没有清理机会\n- C. -9 需要 root 权限，普通用户发不出去\n- D. -15 只是把进程挂起，-9 才真正结束进程\n\n答案：B\n解析：SIGTERM 可被捕获，JVM 会跑 shutdown hook、Spring 能优雅摘流量再下线；SIGKILL 由内核直接终止，连接、锁、临时文件、消息 ACK 都可能残留，所以生产先试 -15。详见[《04-开发工具链-Git-Maven-Linux》](#/f/f12)\n\n### 289.（工具链·中）对已经 push 到公共 develop 分支的三个提交执行 `git rebase -i` 压缩后强推，会带来什么后果？\n- A. 只有自己的本地仓库受影响，其他人毫无感知\n- B. 远程仓库会拒绝一切强推，这个命令必然失败\n- C. 提交被重写成新的 sha，协作者本地仍指向旧历史，各自拉取或强推会互相冲掉对方的提交\n- D. 三个提交的内容会永久丢失，reflog 也捞不回来\n\n答案：C\n解析：\"已经 push 到公共分支的提交禁止 rebase\"针对的就是 sha 被重写这一点：内容没变，但所有下游都成了孤儿历史。D 错在\"永久丢失\"——内容还在悬空对象里，可借助 reflog 找回。详见[《04-开发工具链-Git-Maven-Linux》](#/f/f12)\n\n### 290.（工具链·中）要一条命令统计 access.log 中 5xx 响应占全部请求的比例，`awk` 写法正确的是？\n- A. `awk '$9>=500{e++} END{print e/NR}' access.log`\n- B. `awk '$9==500' access.log | wc -l`\n- C. `grep 500 access.log | sort -rn | head`\n- D. `awk '{print $9}' access.log | uniq -c`\n\n答案：A\n解析：awk 逐行累加 5xx 计数，NR 是总行数，END 块里相除即得占比；B 只统计了恰好 500 的行、也没有算比值，C 排序后取头部与比例无关，D 少了 uniq 需要的预先排序。详见[《04-开发工具链-Git-Maven-Linux》](#/f/f12)\n\n### 291.（工具链·难）误执行 `git reset --hard HEAD~2` 之后，`git reflog` 能帮你做到什么？\n- A. 只能恢复工作区里还没提交过的改动，已提交内容一律找不回\n- B. 能把 reset 丢掉的提交找回来——只要对应 sha 还出现在 reflog 记录里、对象尚未被 gc 回收\n- C. 能把分支恢复成任意历史状态，包括从未被 HEAD 指向过的提交\n- D. 只是把 reset 命令重新执行一遍，本身不含恢复能力\n\n答案：B\n解析：reflog 记录的是 HEAD 的每一次移动，`git reset --hard <reflog 中的 sha>` 就能把分支挪回去；局限在于它只覆盖\"曾经成为过 HEAD\"的位置，且悬空对象过了 gc 期限就真的没了。详见[《04-开发工具链-Git-Maven-Linux》](#/f/f12)\n\n### 292.（工具链·中）`mvn install` 与 `mvn deploy` 的关键区别是？\n- A. install 只打包不跑测试，deploy 会重新执行测试\n- B. install 把构件装进本地 ~/.m2 仓库供本机其他项目依赖，deploy 推送到远程私服供团队共享\n- C. 两者完全等价，deploy 只是 install 的别名\n- D. install 会跳过 compile 阶段，deploy 不会\n\n答案：B\n解析：生命周期是一条顺序链，两个命令都是\"执行到该阶段并连带跑完前面所有阶段\"，所以都会经过 compile 与 test；差别只在终点：一个是本地仓库，一个是远程私服 Nexus。详见[《04-开发工具链-Git-Maven-Linux》](#/f/f12)\n\n### 293.（工具链·难）依赖树如下：A→B→C→X:1.5（深度 3）、A→D→X:1.0（深度 2），且 A 的 pom 中 B 声明在 D 之前。最终生效的 X 版本是？\n- A. 1.5，因为同深度时先声明者胜，B 在 D 前面\n- B. 两个版本都会被打进包里，由类加载顺序决定用哪个\n- C. 直接报依赖冲突错误，构建失败\n- D. 1.0，因为路径最短者优先，声明顺序只在路径等长时才参与裁决\n\n答案：D\n解析：Maven 依赖调解先比路径深度、再比声明顺序，两个原则冲突时\"路径短的完胜\"，所以这里声明顺序根本轮不上。1.0 生效后若 C 用到了 1.5 才有的方法，运行期就会抛 NoSuchMethodError——这也解释了为什么这类错误编译期不报。详见[《04-开发工具链-Git-Maven-Linux》](#/f/f12)\n\n### 294.（设计模式·易）枚举单例被《Effective Java》推荐为最佳写法，主要因为它天然免疫了哪两种破坏手段？\n- A. 反射强开私有构造、反序列化时新建实例\n- B. 多线程并发创建、指令重排序\n- C. 类加载器重复加载、JIT 激进优化\n- D. 内存溢出、GC 提前回收对象\n\n答案：A\n解析：JVM 保证枚举常量的构造只执行一次，反射创建枚举会直接被 JDK 拒绝；枚举的序列化按名字查找、反序列化返回同一常量。多线程安全只是它顺带的好处，不是\"天然免疫破坏\"所指的靶点。详见[《07-设计模式》](#/f/f8)\n\n### 295.（设计模式·易）用策略模式重构一长串 `if (\"WECHAT\".equals(type)) ... else if ...`，Spring 项目里最常见的落地方式是？\n- A. 把所有分支方法改成 static，避免反复创建对象\n- B. 用更长的 switch 替换 if-else，提升可读性\n- C. 把分支逻辑整体上移到父类，让子类重写整个方法\n- D. 每个分支抽成一个策略实现类，用 `Map<String, 策略>` 分发（构造器注入 `List<策略>` 自动收集）\n\n答案：D\n解析：注入 `List<PayStrategy>` 后按 `type()` 建表，新增渠道只需加一个 @Component 类、Context 一行不改，这正是开闭原则的落地。C 描述的是模板方法的形状，而且\"重写整个方法\"并没有消除分支。详见[《07-设计模式》](#/f/f8)\n\n### 296.（设计模式·中）装饰器模式与代理模式结构相似，核心差别在于？\n- A. 装饰器只能包装一个对象，代理可以同时包装多个\n- B. 装饰器关注给对象叠加功能、通常由调用方层层包装；代理关注控制对目标的访问、通常由框架生成\n- C. 装饰器基于继承实现，代理基于组合实现\n- D. 装饰器必须继承目标类，代理必须实现与目标相同的接口\n\n答案：B\n解析：`new BufferedReader(new InputStreamReader(new FileInputStream(f)))` 是调用方手工套娃，一层加一种能力（字节→字符→缓冲）；AOP 生成的代理则是框架替你控制访问。结构可以一样，意图不同才是区分点。详见[《07-设计模式》](#/f/f8)\n\n### 297.（设计模式·中）Servlet 的 `Filter` 链与策略模式最关键的区别是？\n- A. Filter 链上只有一个过滤器会真正生效\n- B. 策略模式的多个实现类在运行期也会被依次全部执行\n- C. Filter 链上多个处理者会依次处理同一个请求、顺序本身有语义；策略模式通常只命中一个实现\n- D. 两者没有本质区别，Filter 链就是策略模式的一种写法\n\n答案：C\n解析：`chain.doFilter()` 把请求交给下一个处理者，可以全链走完也可以中途断链，注册顺序会改变行为；策略是客户端选定一个算法后命中即止。这也是\"责任链可能多个处理者参与、策略只命中一个\"的由来。详见[《07-设计模式》](#/f/f8)\n\n### 298.（设计模式·中）AQS 的 `acquire()` 固定了\"尝试获取→失败入队→阻塞等待\"的骨架，把 `tryAcquire` 留给子类实现，这属于哪种模式？\n- A. 策略模式：整个算法可以在运行期被替换\n- B. 责任链模式：请求沿处理者链传递\n- C. 模板方法模式：父类定算法骨架，把某些步骤作为钩子留给子类\n- D. 观察者模式：状态变化后自动通知订阅者\n\n答案：C\n解析：ReentrantLock、Semaphore、CountDownLatch 各自实现 tryAcquire/tryRelease，但排队与唤醒的流程骨架完全复用、编译期就固定。策略与模板方法的分界正在这里：前者整个算法可换，后者只有局部步骤可变。详见[《07-设计模式》](#/f/f8)\n\n### 299.（设计模式·难）关于单例被\"反射\"与\"序列化\"两种手段破坏及对应防御，正确的是？\n- A. 反射可以通过 `setAccessible(true)` 强开私有构造并新建实例，在构造器里判空抛异常可挡住；反序列化走的是另一条路，需要重写 `readResolve()` 返回原实例\n- B. 反射无法突破私有构造，能破坏单例的只有序列化\n- C. 只要实现了 `readResolve()`，反射也就无法再创建新实例了\n- D. 把类声明为 final 之后，反射与序列化两种手段都会失效\n\n答案：A\n解析：`getDeclaredConstructor().setAccessible(true).newInstance()` 确实能绕过私有构造；而反序列化根本不走构造器，是 `readObject` 直接造对象，所以必须用 readResolve 单独兜住——两种手段要分别防，没有一招通吃。详见[《07-设计模式》](#/f/f8)\n\n### 300.（设计模式·难）策略模式与状态模式最本质的区别是？\n- A. 策略模式靠继承实现，状态模式靠组合实现\n- B. 策略模式各算法之间互不相识、由客户端选定；状态模式各状态之间有迁移规则、由状态自身决定下一个状态\n- C. 状态模式消除不了 if-else，只有策略模式能消除\n- D. 策略模式只能有一个实现类，状态模式可以有多个\n\n答案：B\n解析：两者都能把分支拆成对象、都能配合 Map 分发，差别在语义：状态模式带状态机（订单状态流转、线程 NEW→RUNNABLE→TERMINATED），迁移由状态自己驱动，调用方通常不关心当前处于哪个状态。详见[《07-设计模式》](#/f/f8)\n\n### 301.（设计模式·难）目标类没有实现任何接口，并且被声明为 `final`，Spring 仍想对它做 AOP 增强，结果是？\n- A. 自动改用 JDK 动态代理，一切照常\n- B. CGLIB 会退化成静态代理，依然可以增强\n- C. 只要方法不是 private，final 类也能被 CGLIB 代理\n- D. CGLIB 生成子类会失败，无法为该类创建代理，只能去掉 final 或改为面向接口设计\n\n答案：D\n解析：没有接口时 JDK 动态代理无从下手，只能靠 CGLIB；而 CGLIB 的原理是生成目标类的子类，\"不能继承\"直接判了死刑，同理 final/private/static 方法也覆盖不了。记住这条边界，就知道为什么框架常要求业务类面向接口设计。详见[《07-设计模式》](#/f/f8)\n\n### 302.（算法·易）下列排序算法中，最坏情况下仍能保证 O(nlogn) 的是？\n- A. 快速排序\n- B. 归并排序\n- C. 冒泡排序\n- D. 插入排序\n\n答案：B\n解析：快排每次划分极不均匀时会退化到 O(n²)，例如对已经有序的数组固定取首元素当基准；归并排序每层都对半切分，稳定 O(nlogn)，代价是需要 O(n) 的额外空间。详见[《03-算法刷题路线》](#/f/f34)\n\n### 303.（算法·中）代码 `for (int i = 1; i < n; i *= 2) { for (int j = 0; j < n; j++) sum++; }` 的时间复杂度是？\n- A. O(n)\n- B. O(logn)\n- C. O(nlogn)\n- D. O(n²)\n\n答案：C\n解析：外层 i 每次翻倍，只执行 logn 次；内层固定 n 次，相乘得 O(nlogn)。判断这类题要看每层循环的\"步进方式\"而不是嵌套层数——两层循环不一定是 O(n²)。详见[《03-算法刷题路线》](#/f/f34)\n\n### 304.（算法·难）对 n 个元素自底向上建堆（heapify）的时间复杂度是？\n- A. O(n)：越靠近底层的节点数量越多、但下沉高度越小，加权求和后收敛到常数倍 n\n- B. O(nlogn)：要处理 n 个节点，每次下沉最坏 O(logn)\n- C. O(logn)：只有根节点需要下沉\n- D. O(n²)：每个节点都要和其余所有节点比较\n\n答案：A\n解析：这是经典的\"上界不等于紧界\"：n 次 O(logn) 只是上界，实际求和是 Σ(每层节点数 × 该层高度)，收敛到 O(n)。注意逐个 insert 建堆才是 O(nlogn)，这也是堆排序整体复杂度仍为 O(nlogn) 的原因。详见[《03-算法刷题路线》](#/f/f34)\n\n### 305.（算法·中）用 `LinkedHashMap` 实现 LRU 缓存，构造器参数与需要重写的方法分别是？\n- A. `super(capacity, 0.75f, false)` + 重写 `removeEldestEntry`\n- B. `super(capacity)` + 重写 `put`\n- C. `super(capacity, 0.75f, true)` + 重写 `removeEldestEntry`\n- D. `super(capacity, 0.75f, true)` + 重写 `get`\n\n答案：C\n解析：第三个参数 accessOrder=true 才会按访问顺序维护链表，get 也算一次访问；传 false 就成了 FIFO，淘汰的是最早插入而非最久未用的元素。removeEldestEntry 里返回 `size() > capacity` 即触发淘汰链表头。详见[《03-算法刷题路线》](#/f/f34)\n\n### 306.（算法·难）从 n 个数中找第 K 大的元素，\"维护一个大小为 K 的小顶堆\"这种做法的时间复杂度是？\n- A. O(nlogn)：每个元素都要进堆排一次序\n- B. O(nlogK)：遍历 n 个元素，每次堆调整 O(logK)\n- C. O(Klogn)：堆里始终只有 K 个元素\n- D. O(n)：堆的插入删除都是常数时间\n\n答案：B\n解析：遍历是 O(n)，每次入堆/出堆是 O(logK)，合计 O(nlogK)；K 远小于 n 时明显优于整体排序的 O(nlogn)，这正是\"海量数据取 Top K\"的标准解。选小顶堆是为了让堆顶正好是当前第 K 大，超容量就弹掉。详见[《03-算法刷题路线》](#/f/f34)\n\n### 307.（算法·中）下面哪种二分写法在收缩区间时可能陷入死循环？\n- A. 左闭右闭：`while (left <= right)`，配 `left = mid + 1` / `right = mid - 1`\n- B. 左闭右开：`while (left < right)`，配 `left = mid + 1` / `right = mid`\n- C. `while (left <= right)` 且 `mid = left + (right - left) / 2`\n- D. `while (left < right)` 且 `mid = (left + right) / 2`，并用 `left = mid` 收缩左边界\n\n答案：D\n解析：下取整的 mid 在区间只剩两个元素时会等于 left，若还用 `left = mid` 收缩，left 永远不动就死循环。两个修法：改成 `left = mid + 1`，或把 mid 改成上取整 `(left + right + 1) / 2`——一句话，收缩方向必须和取整方向配套。详见[《03-算法刷题路线》](#/f/f34)\n\n## 填空题\n\n### 308.（Java基础·易）Java 源文件经 javac 编译后生成＿＿＿文件，由 JVM 加载执行。\n答案：字节码／class／.class\n解析：javac 把 .java 编译为 .class 字节码，JVM 解释/JIT 执行，这是\"一次编写，到处运行\"的基础。详见[《01-环境搭建与基础语法》](#/f/f3)\n\n### 309.（Java基础·易）== 用于比较引用类型时，比较的是＿＿＿。\n答案：地址／内存地址／引用地址\n解析：比较内容应使用重写后的 equals，String、Integer 等都已重写。详见[《02-面向对象与核心类》](#/f/f4)\n\n### 310.（集合·易）ArrayList 的底层是＿＿＿，LinkedList 的底层是＿＿＿。\n答案：数组；双向链表\n解析：ArrayList 随机访问快，LinkedList 头尾插删快，随机访问慢。详见[《03-集合与泛型》](#/f/f5)\n\n### 311.（集合·易）HashMap（JDK 1.8）的底层结构是＿＿＿＋链表＋红黑树。\n答案：数组／哈希表\n解析：数组是主体，冲突挂链表，链表长度≥8 且数组长度≥64 时树化。详见[《03-集合与泛型》](#/f/f5)\n\n### 312.（并发·中）Executors 创建的 FixedThreadPool 使用无界＿＿＿，任务堆积可能导致 OOM，因此推荐手动 new ThreadPoolExecutor。\n答案：队列／阻塞队列\n解析：无界队列在消费慢时会无限堆积任务，最终内存耗尽。详见[《01-多线程与并发编程》](#/f/f9)\n\n### 313.（并发·中）synchronized 是 JVM 层面的锁，而 ReentrantLock 是＿＿＿层面用 AQS 实现的锁。\n答案：JDK／API／Java\n解析：ReentrantLock 基于队列同步器（AQS）在 Java 代码层实现，功能更丰富：可中断、超时、公平锁、Condition。详见[《01-多线程与并发编程》](#/f/f9)\n\n### 314.（JVM·中）JVM 新生代分为 Eden 区和两个＿＿＿区。\n答案：Survivor／S0/S1／from/to\n解析：默认 8:1:1，对象在两个 Survivor 区之间来回复制，每熬过一次 Minor GC 年龄+1。详见[《02-JVM核心》](#/f/f10)\n\n### 315.（JVM·中）类加载过程依次为：加载 → 验证 → 准备 → ＿＿＿ → 初始化。\n答案：解析\n解析：准备阶段给静态变量赋零值，初始化才执行 <clinit>；解析将常量池符号引用转为直接引用。详见[《02-JVM核心》](#/f/f10)\n\n### 316.（MySQL·易）MySQL 5.5 之后的默认存储引擎是＿＿＿。\n答案：InnoDB\n解析：支持事务、行级锁、外键与 MVCC；MyISAM 表锁且无事务，已非默认。详见[《MySQL基础与SQL实战》](#/f/f13)\n\n### 317.（MySQL·易）MySQL 默认的事务隔离级别是＿＿＿。\n答案：可重复读／REPEATABLE READ／RR\n解析：通过 MVCC + 临键锁在该级别下大幅避免幻读。详见[《索引-事务-锁与调优》](#/f/f14)\n\n### 318.（MySQL·中）EXPLAIN 输出的 type 列出现＿＿＿时表示全表扫描，通常需要优化。\n答案：ALL\n解析：性能从好到差：const > eq_ref > ref > range > index > ALL，生产 SQL 至少做到 range。详见[《索引-事务-锁与调优》](#/f/f14)\n\n### 319.（Redis·易）Redis 中实现排行榜最常用的数据结构是＿＿＿。\n答案：ZSet／zset／有序集合／sorted set\n解析：按 score 排序，ZINCRBY 加分、ZREVRANGE 取 TopN。详见[《01-Redis》](#/f/f21)\n\n### 320.（Redis·易）缓存三大经典问题：缓存穿透、缓存击穿、缓存＿＿＿。\n答案：雪崩\n解析：穿透查不存在的数据，击穿是热点 key 过期瞬间被打穿，雪崩是大规模 key 同时失效。详见[《01-Redis》](#/f/f21)\n\n### 321.（Redis·中）Redis 分布式锁的加锁命令 SET key value NX ＿＿＿ ttl 中，最后一参数段表示过期时间，防止死锁。\n答案：EX／ex\n解析：NX 保证互斥，EX 设置过期；生产建议直接用 Redisson 看门狗自动续期。详见[《01-Redis》](#/f/f21)\n\n### 322.（消息队列·中）Kafka 的消息顺序只在＿＿＿范围内保证，跨分区无序。\n答案：分区／Partition／partition\n解析：按 key 路由到同一分区可保证同类消息有序，消费组内一个分区只由一个消费者消费。详见[《03-Kafka》](#/f/f23)\n\n### 323.（框架·中）SpringBoot 中把配置文件批量绑定到配置类的注解是 @＿＿＿。\n答案：ConfigurationProperties\n解析：@Value 适合单个值；@ConfigurationProperties(prefix=\"xxx\") 支持批量绑定与校验。详见[《SpringBoot实战》](#/f/f16)\n\n### 324.（框架·易）SpringMVC 的前端核心控制器是＿＿＿。\n答案：DispatcherServlet\n解析：所有请求统一经过它分发到 HandlerMapping → HandlerAdapter → Controller。详见[《Spring核心》](#/f/f15)\n\n### 325.（分布式与高并发·中）Nacos 同时支持 AP 与＿＿＿两种模式，可按场景切换。\n答案：CP\n解析：临时实例走 AP（Distro 协议），持久实例走 CP（Raft）；ZK 是 CP，Eureka 是 AP。详见[《06-ZooKeeper与Nacos》](#/f/f26)\n\n### 326.（分布式与高并发·中）雪花算法依赖机器时钟，时钟回拨可能导致生成＿＿＿的 ID。\n答案：重复ID／ID重复／重复\n解析：兜底方案：等待追平、拒绝发号、使用备用机器 ID 或改用号段/Leaf 等方案。详见[《01-分布式理论基础》](#/f/f29)\n\n### 327.（分布式与高并发·中）秒杀系统中常用 Redis＋＿＿＿脚本原子地\"判断库存并扣减\"，防止超卖。\n答案：Lua／lua\n解析：多个 Redis 命令在 Lua 中原子执行，配合 MQ 异步落库完成秒杀主链路。详见[《02-高并发系统设计》](#/f/f30)\n\n### 328.（Java8·中）Stream 的中间操作是＿＿＿执行的，遇到终端操作才真正计算。\n答案：惰性／延迟\n解析：filter/map 等只记录操作，collect/forEach 触发才执行；这也是流只能被消费一次的原因。详见[《05-Lambda-Stream与Java8新特性》](#/f/f7)\n\n### 329.（网络·易）TCP 断开连接需要＿＿＿次挥手。\n答案：4／四\n解析：TCP 全双工，两个方向各需一次 FIN 和一次 ACK。详见[《03-IO模型与网络编程》](#/f/f11)\n\n### 330.（Nginx·中）Nginx 把动态请求转交给后端应用的核心指令是＿＿＿。\n答案：proxy_pass\n解析：写在 location 块中；静态资源用 root/alias，动静分离即由此组合实现。详见[《07-Nginx》](#/f/f27)\n\n### 331.（框架·中）Spring Cloud Gateway 中，定义\"哪些请求转发到哪个服务\"的配置叫＿＿＿规则。\n答案：路由／Route\n解析：路由 = 断言（Predicate，匹配条件）+ 过滤器（Filter，处理逻辑），是网关的核心抽象。详见[《SpringCloud微服务》](#/f/f18)\n\n### 332.（Elasticsearch·中）MySQL 与 ES 近实时同步，常用阿里开源的＿＿＿监听 binlog 异步写入 ES。\n答案：canal\n解析：canal 伪装成 MySQL 从库解析 binlog；其他方案还有同步双写与 MQ 异步，各有取舍。详见[《05-Elasticsearch》](#/f/f25)\n\n### 333.（MongoDB·易）MongoDB 中对应关系型数据库\"行\"的概念叫＿＿＿。\n答案：文档／document\n解析：集合 collection ≈ 表；文档以 BSON（二进制 JSON）存储。详见[《08-MongoDB》](#/f/f28)\n\n### 334.（Redis·难）Redis 主从增量复制依赖主节点的＿＿＿环形缓冲区，缓冲区太小或 offset 不连续就会退化成＿＿＿复制。\n答案：repl_backlog；全量\n解析：从节点上报 master_repl_offset，只要在 backlog 范围内就只补差额；否则重新 fork 做全量同步，大内存实例 fork 会带来毫秒级阻塞。详见[《01-Redis》](#/f/f21)\n\n### 335.（Redis·难）分布式锁\"误删别人的锁\"发生在：客户端 A 持锁后长时间 GC 停顿，锁＿＿＿后被 B 获取，A 恢复后直接 DEL 删掉了 B 的锁；解法是 value 存唯一标识并加＿＿＿原子校验删除。\n答案：过期；Lua／lua／lua脚本\n解析：判断与删除必须是两步，普通代码非原子；Redisson 用看门狗续期避免过期，用 Lua 校验持有者避免误删。详见[《01-Redis》](#/f/f21)\n\n### 336.（MySQL·难）RR 下事务第一次快照读时生成 ReadView，此后＿＿＿（填\"复用/每次重新生成\"）；RC 则是每次＿＿＿都重新生成。\n答案：复用；查询／select／快照读\n解析：ReadView 记录了生成时仍活跃的事务 ID 集合，据此判断版本可见性；复用同一份快照正是\"可重复读\"的实现手段。详见[《索引-事务-锁与调优》](#/f/f14)\n\n### 337.（操作系统·中）Linux 下递归搜索目录内所有文件的文本内容，常用 grep 的 ＿＿＿ 参数（写作两个字母或长选项）。\n答案：-r／-R／--recursive\n解析：`grep -rn \"关键词\" 目录` 会递归并显示行号；-R 与 -r 的差别是对符号链接的处理，管道配合 `| head` 控制输出量。详见[《04-开发工具链-Git-Maven-Linux》](#/f/f12)\n\n### 338.（工具链·中）要确认本机某端口是否被进程监听，常用命令是 ＿＿＿（含参数）。\n答案：ss -lntp／ss -lnt／netstat -anp／lsof -i:端口\n解析：-l 只看 LISTEN、-n 不做 DNS 反解、-t 只看 TCP、-p 显示进程；ss 比 netstat 更快，容器里没 ss 时可用 lsof。详见[《04-开发工具链-Git-Maven-Linux》](#/f/f12)\n\n### 339.（Redis·难）ZSET 在元素较少、分值较短时用＿＿＿编码存储；超过阈值后改为跳表＋字典表双结构，其中跳表的作用是支持按分数区间 O(logN) 查找。\n答案：ziplist／压缩列表／listpack\n解析：小 ZSET 用 ziplist/listpack 连续内存省开销；变大后拆成 skiplist（按 score 范围与排名查找）+ dict（按成员 O(1) 取分数）。详见[《01-Redis》](#/f/f21)\n\n### 340.（Java基础·易）Java 中所有类的直接或间接父类是＿＿＿。\n答案：Object／java.lang.Object\n解析：Object 是类层次根，定义了 equals/hashCode/toString/wait/notify 等所有对象共有的方法。详见[《02-面向对象与核心类》](#/f/f4)\n\n### 341.（集合·易）HashMap 解决哈希冲突在 JDK 1.8 中采用＿＿＿法，冲突严重时转为红黑树。\n答案：链地址法／拉链法\n解析：同桶元素挂成链表，长度≥8 且表长≥64 时树化；1.7 是纯链表加头插，1.8 改为尾插。详见[《03-集合与泛型》](#/f/f5)\n\n### 342.（集合·中）ArrayList 扩容时新容量为旧容量的＿＿＿倍。\n答案：1.5／1.5倍\n解析：`newCapacity = oldCapacity + (oldCapacity >> 1)`，与 HashMap 的 2 倍扩容是两套不同策略。详见[《03-集合与泛型》](#/f/f5)\n\n### 343.（Java8·中）Stream 的中间操作是＿＿＿求值的，只有遇到终端操作才会真正执行。\n答案：惰性／lazy\n解析：filter/map 等只记录流水线，collect/forEach 等终端操作才拉动执行；这也是 peek 不接终端操作不生效的原因。详见[《05-Lambda-Stream与Java8新特性》](#/f/f7)\n\n### 344.（Java基础·中）Java 中 String 与 StringBuilder 的核心区别是：String 是＿＿＿的，StringBuilder 是可变的。\n答案：不可变／immutable\n解析：String 每次拼接产生新对象，循环拼接应用 StringBuilder 避免大量临时对象。详见[《02-面向对象与核心类》](#/f/f4)\n\n### 345.（Java基础·易）Java 支持＿＿＿继承，一个类可以实现多个接口。\n答案：单／单一\n解析：单继承多实现是 Java 的设计取舍，避免 C++ 菱形继承的歧义问题；接口多实现配合 Java 8 default 方法需要显式消歧。详见[《02-面向对象与核心类》](#/f/f4)\n\n### 346.（集合·中）保证元素唯一性的 HashSet，底层实际是维护了一个＿＿＿。\n答案：HashMap／哈希表\n解析：HashSet 把元素当 key 存入 HashMap，value 是统一的占位对象，因此去重依赖 hashCode+equals。详见[《03-集合与泛型》](#/f/f5)\n\n### 347.（Java基础·中）finally 块中若执行 return，会＿＿＿ try 块中已有的返回值。\n答案：覆盖／覆盖掉\n解析：finally 在方法返回前执行，其中的 return 会替换原返回值；同理 try 里有 return、finally 里改基本类型变量不会影响已确定的返回值。详见[《04-异常-IO-反射-注解》](#/f/f6)\n\n### 348.（集合·中）List、Set、Map 三大集合中，＿＿＿不属于 Collection 接口体系。\n答案：Map\n解析：Collection 分支是 List/Set/Queue，Map 是独立顶层接口，以键值对存储，两者无继承关系。详见[《03-集合与泛型》](#/f/f5)\n\n### 349.（Java8·中）方法引用 `String::length` 等价于 Lambda 表达式＿＿＿。\n答案：s -> s.length()／str -> str.length()\n解析：方法引用是 Lambda 的语法糖，静态方法用 类::方法名，实例方法用 对象::方法名，构造器用 类::new。详见[《05-Lambda-Stream与Java8新特性》](#/f/f7)\n\n### 350.（集合·中）把数组转成固定长度的 List 常用 Arrays.＿＿＿ 方法，但它不支持 add/remove。\n答案：asList\n解析：asList 返回的是 Arrays 内部类视图，长度固定；要可变列表需 new ArrayList<>(Arrays.asList(arr))。详见[《03-集合与泛型》](#/f/f5)\n\n### 351.（Java基础·中）String.intern() 的作用是把字符串放入＿＿＿，返回其规范表示。\n答案：字符串常量池／常量池／StringTable\n解析：JDK 7 起常量池移到堆中，intern 用于复用重复字符串、节省内存；大量重复字符串场景是优化点。详见[《02-面向对象与核心类》](#/f/f4)\n\n### 352.（集合·中）用 Stream 把 List 转 Map 时，若 key 重复会抛 IllegalStateException，需传入＿＿＿参数指定合并策略。\n答案：合并函数／mergeFunction／BinaryOperator\n解析：`toMap(keyMapper, valueMapper, (a,b) -> b)` 三参重载用合并函数消解冲突，否则默认 throwDuplicates。详见[《05-Lambda-Stream与Java8新特性》](#/f/f7)\n\n### 353.（Java基础·中）`Integer a = 100; Integer b = 100; a == b` 的结果是＿＿＿。\n答案：true\n解析：-128~127 内命中 IntegerCache 返回同一对象，超出范围则各建对象为 false；比较值应始终用 equals。详见[《02-面向对象与核心类》](#/f/f4)\n\n### 354.（并发·易）synchronized 修饰实例方法时，锁对象是＿＿＿。\n答案：this／当前对象／调用该方法的对象\n解析：实例方法锁 this，静态方法锁 Class 对象，同步代码块锁括号里指定的对象，三种用法锁的对象各不相同。详见[《01-多线程与并发编程》](#/f/f9)\n\n### 355.（并发·易）调用 `thread.start()` 之后，线程进入的第一个状态是＿＿＿（填英文状态名）。\n答案：RUNNABLE\n解析：start 只是让线程进入可运行状态参与调度，并不等于立刻占用 CPU；NEW 是还没 start 时的状态。详见[《01-多线程与并发编程》](#/f/f9)\n\n### 356.（并发·中）ReentrantLock 默认是＿＿＿锁，只有在构造时传入 true 才会按队列顺序发放。\n答案：非公平\n解析：非公平锁允许新线程插队先 CAS 抢一次，省掉挂起与唤醒开销、吞吐更高；只有防饥饿才需要公平模式。详见[《01-多线程与并发编程》](#/f/f9)\n\n### 357.（并发·中）ReentrantReadWriteLock 的读锁与写锁共用一个 state 字段，其中高 16 位记录＿＿＿。\n答案：读锁的持有次数／读锁的数量／读锁被获取的总次数\n解析：低 16 位是写锁的重入次数、高 16 位是读锁持有总数，因此读写锁的重入上限都是 65535。详见[《01-多线程与并发编程》](#/f/f9)\n\n### 358.（并发·难）虚拟线程在 synchronized 块中执行阻塞操作时无法从载体线程上卸载，这种现象称为＿＿＿（中文术语或英文原词均可）。\n答案：固定／钉住／pinning\n解析：pinning 会让载体线程一起被占住，虚拟线程失去伸缩优势；官方建议把这类临界区改用 ReentrantLock。详见[《01-多线程与并发编程》](#/f/f9)\n\n### 359.（JVM·易）对象优先在新生代的＿＿＿区分配；超过 -XX:PretenureSizeThreshold 的大对象则直接在＿＿＿分配。\n答案：Eden／伊甸园区；老年代\n解析：Eden 是新生代的主要分配区，大对象直接进老年代可避免在 Eden 与 Survivor 之间反复复制。详见[《02-JVM核心》](#/f/f10)\n\n### 360.（网络·易）TCP 依靠序号＋＿＿＿实现丢包重传，依靠＿＿＿窗口实现流量控制。\n答案：确认应答／ACK；滑动\n解析：ACK 与超时重传保证数据不丢，滑动窗口让发送方按接收方的处理能力调速，拥塞控制则保护网络本身。详见[《03-IO模型与网络编程》](#/f/f11)\n\n### 361.（操作系统·易）进程是＿＿＿分配的基本单位，线程是＿＿＿调度的基本单位。\n答案：资源；CPU／处理器\n解析：进程拥有独立地址空间等资源，线程共享进程资源但各有自己的栈与程序计数器，是调度实际作用的对象。详见[《03-IO模型与网络编程》](#/f/f11)\n\n### 362.（操作系统·易）虚拟地址到物理地址的转换依靠＿＿＿完成；当访问的页面不在物理内存中时，会触发＿＿＿中断。\n答案：页表；缺页\n解析：页表记录虚拟页到物理页框的映射，缺页中断由内核把页面从磁盘调入后再恢复执行，这是按需调页的基础。详见[《03-IO模型与网络编程》](#/f/f11)\n\n### 363.（JVM·中）Java 8 起方法区由＿＿＿实现，使用本地内存；其容量上限可通过参数 -XX:＿＿＿ 设置。\n答案：元空间／Metaspace；MaxMetaspaceSize\n解析：元空间取代了永久代，默认不设上限只受本机内存约束，动态生成类过多会 OOM: Metaspace，生产建议显式限制。详见[《02-JVM核心》](#/f/f10)\n\n### 364.（网络·易）HTTPS 握手阶段用＿＿＿加密安全地协商出会话密钥，之后的通信数据使用＿＿＿加密传输。\n答案：非对称／公钥；对称\n解析：非对称加密安全但慢，只用来交换密钥；对称加密快，用来承载真正的业务数据，这就是混合加密的分工。详见[《03-IO模型与网络编程》](#/f/f11)\n\n### 365.（MySQL·易）建表时，金额与成绩等要求精确的小数字段应使用＿＿＿类型，而不是 FLOAT/DOUBLE。\n答案：DECIMAL／decimal／DECIMAL(M,D)／定点数\n解析：FLOAT/DOUBLE 以二进制浮点存储，比较与累加都会产生误差；DECIMAL 按十进制精确存储，代价是运算稍慢。详见[《MySQL基础与SQL实战》](#/f/f13)\n\n### 366.（MySQL·易）联合索引中，查询条件必须从最左列开始连续命中才能用上索引，这一规则称为＿＿＿原则。\n答案：最左前缀／最左匹配／最左前缀匹配\n解析：(a,b,c) 相当于提供 a、(a,b)、(a,b,c) 三套索引能力，跳过 a 直接查 b 就用不上这个索引。详见[《索引-事务-锁与调优》](#/f/f14)\n\n### 367.（MySQL·易）InnoDB 的行锁是加在＿＿＿上的，因此 UPDATE/DELETE 的 WHERE 条件若没有走索引，会退化成扫描全表并把扫过的记录全锁住。\n答案：索引／索引项／索引记录\n解析：这也解释了为什么加锁类语句的条件列必须有索引；无索引的 UPDATE 会把每一条记录都加上临键锁，约等于锁全表。详见[《索引-事务-锁与调优》](#/f/f14)\n\n### 368.（MySQL·中）explain 的 Extra 列出现＿＿＿表示用到了覆盖索引、无需回表；出现＿＿＿表示有额外的文件排序需要优化。\n答案：Using index；Using filesort\n解析：前者说明查询列都在索引中，后者说明排序无法由索引顺序满足；Using temporary（临时表）同样是值得优化的信号。详见[《索引-事务-锁与调优》](#/f/f14)\n\n### 369.（MySQL·中）SQL 逻辑执行顺序中，＿＿＿在 GROUP BY 之前过滤行，＿＿＿在分组之后过滤组。\n答案：WHERE；HAVING\n解析：因为 WHERE 早于 SELECT 执行，它引用不了 SELECT 中定义的别名，而 HAVING 与 ORDER BY 可以。详见[《MySQL基础与SQL实战》](#/f/f13)\n\n### 370.（MySQL·难）主从延迟的三类常见成因是：从库重放能力不足、主库存在＿＿＿导致从库长时间追不上、从库机器配置弱于主库。\n答案：大事务／大事务或大表 DDL\n解析：单线程重放遇上一次性改几十万行的事务就会持续落后；对策是拆小事务、开启并行复制、关键读强制走主库。详见[《索引-事务-锁与调优》](#/f/f14)\n\n### 371.（Redis·易）删除百万元素的大 key 时，用＿＿＿命令把键从键空间摘除、内存回收交给后台线程，可避免 DEL 造成的长时间阻塞。\n答案：UNLINK／unlink\n解析：大 key 的痛点是释放内存的耗时全压在主线程上；UNLINK 先摘除键、由后台线程回收内存，把阻塞降到最低。日常还应定期用 `redis-cli --bigkeys` 排查大 key。详见[《01-Redis》](#/f/f21)\n\n### 372.（Redis·易）缓存 key 即使业务上\"不会变\"，也建议显式设置＿＿＿，它既能回收冷数据，也是删缓存失败时的一致性兜底。\n答案：过期时间／TTL／ttl／EXPIRE\n解析：业务数据变更时，即使删缓存的逻辑漏了或调用失败，到期后也会自动失效并重新加载，这是最后一道兜底。详见[《01-Redis》](#/f/f21)\n\n### 373.（消息队列·易）Kafka 中消费进度体现为消费者提交的＿＿＿，重置它就能重新消费历史消息。\n答案：offset／位移／偏移量\n解析：Kafka 不因消费而删除消息，消费进度只是一个位移数字，所以既能被多个消费组各读各的，也能通过重置位移做数据回放。详见[《03-Kafka》](#/f/f23)\n\n### 374.（Redis·中）Redis Sentinel 中，单个哨兵判定主节点失联称为＿＿＿下线；达到 quorum 数量的哨兵共同确认后才升级为＿＿＿下线并触发故障转移。\n答案：主观；客观\n解析：这样设计是为了避免单个哨兵的网络抖动引发误切换，也正是哨兵要多节点部署的原因。详见[《01-Redis》](#/f/f21)\n\n### 375.（消息队列·中）RocketMQ 中，Broker 对迟迟收不到二次确认的半消息会发起＿＿＿，由生产者反查本地事务状态后返回提交或回滚。\n答案：事务回查／回查\n解析：回查依据是 checkLocalTransaction() 里反查业务表（如订单是否创建成功），把\"本地事务成功\"与\"消息可达\"绑成最终一致。详见[《04-RocketMQ》](#/f/f24)\n\n### 376.（消息队列·难）RocketMQ 顺序消息依赖两段配合：发送时按业务 key 哈希进入同一个＿＿＿，消费端用 ConsumeMode.＿＿＿ 加队列锁单线程消费。\n答案：MessageQueue；ORDERLY\n解析：队列内天然 FIFO，加锁串行消费才能保证顺序。代价是吞吐下降、消费失败会阻塞该队列的重试，Broker 主从切换也会短暂破坏顺序。详见[《04-RocketMQ》](#/f/f24)\n\n### 377.（Elasticsearch·中）Elasticsearch 中在 refresh 之前就记录下写入操作、用于防止内存数据丢失的日志称为＿＿＿。\n答案：translog／事务日志\n解析：写入同时进内存 buffer 和 translog，即使进程崩溃也能靠 translog 重放恢复；它要到 flush 时才被清空。refresh 只负责「可见」，translog 负责「不丢」。详见[《05-Elasticsearch》](#/f/f25)\n\n### 378.（ZooKeeper·易）ZooKeeper 中生命周期与客户端会话绑定、会话断开后由服务端自动删除的节点称为＿＿＿节点。\n答案：临时／ephemeral\n解析：临时节点是服务注册与分布式锁自动释放的基石；在此基础上加顺序后缀得到的临时顺序节点，可实现公平锁并避免羊群效应。详见[《06-ZooKeeper与Nacos》](#/f/f26)\n\n### 379.（ZooKeeper·易）Nacos 临时实例默认每＿＿＿秒发送一次心跳，超过＿＿＿秒未收到心跳的实例会被自动剔除。\n答案：5；30\n解析：15 秒未收到心跳只是标记为不健康，30 秒未收到才真正剔除。这套「心跳保活 + 超时剔除」的机制正是 AP 模式下最终一致的实现方式。详见[《06-ZooKeeper与Nacos》](#/f/f26)\n\n### 380.（Nginx·易）Nginx 配置中的＿＿＿指令块用于定义一组后端服务器，并按指定策略把请求分发到它们。\n答案：upstream\n解析：upstream 定义节点池，配合 weight（权重轮询）、ip_hash（会话保持）、least_conn（最少连接）等策略；location 里再用 proxy_pass 引用它，这是负载均衡配置的标准结构。详见[《07-Nginx》](#/f/f27)\n\n### 381.（MongoDB·中）MongoDB 中让文档在指定秒数后自动过期的索引称为＿＿＿索引。\n答案：TTL\n解析：`db.log_events.createIndex({ createdAt: 1 }, { expireAfterSeconds: 3600 })` 即可让文档在 createdAt 之后一小时自动删除，特别适合日志、埋点、临时会话这类「只关心近期数据」的场景，省去手写清理任务。详见[《08-MongoDB》](#/f/f28)\n\n### 382.（框架·易）Spring 中声明式事务依赖的注解是 @＿＿＿。\n答案：Transactional\n解析：加到方法或类上即可，底层由 AOP 代理实现，所以一切绕过代理的调用（自调用、非 public 方法）都会失效。详见[《Spring核心》](#/f/f15)\n\n### 383.（框架·易）Spring 中 @Autowired 默认按＿＿＿匹配候选 Bean，候选不唯一时可用 @Qualifier 按名称指定。\n答案：类型\n解析：@Autowired 是 Spring 提供的注解、默认按类型注入，配合 @Qualifier 或 @Primary 解决多候选；@Resource 是 JDK 规范，默认按名称。详见[《Spring核心》](#/f/f15)\n\n### 384.（框架·易）MyBatis 中用于遍历集合、生成 IN 查询或批量插入的动态 SQL 标签是 <＿＿＿>。\n答案：foreach\n解析：foreach 负责循环，collection 指定集合、item 是元素别名、separator 是分隔符；配合 `<where>` 的\"去头\"和 `<set>` 的\"去尾\"构成动态 SQL 的常用组合。详见[《MyBatis》](#/f/f17)\n\n### 385.（单元测试·易）JUnit 5 中标注在方法上、表示每个 @Test 执行前都会先跑一次的注解是 @＿＿＿。\n答案：BeforeEach\n解析：@BeforeEach/@AfterEach 每个用例各一次，@BeforeAll/@AfterAll 全部用例共一次且必须是 static 方法——因为 JUnit 5 为每个 @Test 都新建一个测试类实例。详见[《05-单元测试与工程质量》](#/f/f19)\n\n### 386.（单元测试·中）Mockito 中要断言\"某个方法从未被调用过\"，应写成 verify(mock, ＿＿＿())。\n答案：never\n解析：verify 的默认次数是 times(1)，还有 atLeastOnce()/atMost()；用 never() 断言\"不该发生的事\"是单测里容易被忽略、价值却很高的一类断言。详见[《05-单元测试与工程质量》](#/f/f19)\n\n### 387.（认证与安全·易）RBAC 模型中，用户不直接关联权限，而是通过＿＿＿作为中转。\n答案：角色\n解析：链路是用户 → 角色 → 权限 → 资源，角色是批量授权的中转站，换岗只改角色不改人；落地时前端按钮显隐只是体验，后端接口鉴权才是安全。详见[《06-认证与安全》](#/f/f20)\n\n### 388.（分布式与高并发·易）BASE 理论是对 CAP 中 AP 路线的工程化延伸，三个字母分别指基本可用、软状态和＿＿＿。\n答案：最终一致／Eventually Consistent／最终一致性\n解析：Basically Available 指降级、限流保住核心功能；Soft state 指允许\"支付处理中\"这类中间态存在；Eventually consistent 指经过一段时间同步与补偿后收敛到一致。互联网业务的主流选择就是\"接受短暂不一致，用对账与补偿把窗口压到最小\"。详见[《01-分布式理论基础》](#/f/f29)\n\n### 389.（分布式与高并发·中）Seata AT 模式在一阶段把业务 SQL 修改前后的镜像写入 ＿＿＿ 表，并与业务数据在同一个本地事务中提交，二阶段回滚时据此生成反向 SQL。\n答案：undo_log\n解析：前后镜像（before/after image）随本地事务一起落库，保证\"业务改动\"与\"可回滚信息\"原子；全局提交时只需异步批量删除，几乎无性能损耗；全局回滚时先校验后镜像没有被别人改过，再用前镜像生成补偿 SQL。AT 靠 TC 的全局锁保证回滚窗口内数据不被其他全局事务修改，用并发性能换业务零侵入（一个 @GlobalTransactional 注解）。详见[《01-分布式理论基础》](#/f/f29)\n\n### 390.（系统设计·易）短链系统通常用自增 ID 配合 ＿＿＿ 编码（0-9、A-Z、a-z 共 62 个字符）生成 6~7 位短码。\n答案：Base62\n解析：62 进制把长数字压得很短，6 位就有 62^6 ≈ 568 亿的空间，配合发号器（DB 号段 / Redis INCR / 雪花）即可。自定义后缀则另走业务表的唯一键，冲突就重试。别忘了跳转用 301、不存在的短码用布隆过滤器提前挡掉。详见[《03-系统设计场景题》](#/f/f31)\n\n### 391.（系统设计·中）统计 UV 时只关心去重后的数量、不关心具体是谁，用 Redis 的 ＿＿＿ 结构只需约 12KB 就能把标准误差控制在 0.81%。\n答案：HyperLogLog\n解析：HyperLogLog 用概率算法估算基数，内存恒定约 12KB（16384 个 6bit 寄存器），比 SET 省下几个数量级。代价是只能拿到计数、拿不到成员列表，且结果本身是近似值。判断要不要精确应先问指标的精度要求：排行榜要精确名次，UV 通常只用来看趋势。详见[《01-Redis》](#/f/f21)\n\n### 392.（系统设计·中）IM 系统为每个会话维护一个单调递增的 ＿＿＿，接收方按它排序与去重，一次解决\"不乱序\"和\"重复消息\"两个问题。\n答案：seq／序列号／会话内序列号\n解析：IM 的可靠性四件套是不丢（ACK + 重传 + 离线拉取）、不乱（会话内单调递增的 seq）、不重（幂等 msgId）、在线状态（心跳 / 临时节点）。有了 seq，客户端断线重连只需上报\"我收到的最大 seq\"，服务端就能续传缺口，比逐条确认高效得多；已读回执也别逐条存，用位图或区间压缩。详见[《03-系统设计场景题》](#/f/f31)\n\n### 393.（工具链·中）打 war 包部署到外部 Tomcat 时，`spring-boot-starter-tomcat` 应设为 `<scope>＿＿＿<\/scope>`：编译与测试可用，但不打进包，由运行容器提供。\n答案：provided\n解析：provided 在编译、测试 classpath 上有效而运行 classpath 上无效；若不这样设，war 内嵌的 Tomcat 会和外部容器自带的冲突导致启动失败。打可执行 jar 独立运行的场景则不需要。详见[《04-开发工具链-Git-Maven-Linux》](#/f/f12)\n\n### 394.（工具链·中）统计 access.log 中访问次数 Top10 的 IP，命令为 `awk '{print $1}' access.log | sort | ＿＿＿ | sort -rn | head -10`。\n答案：uniq -c\n解析：uniq 只能合并相邻的重复行，所以必须先 sort；-c 给每组加上出现次数前缀，再 `sort -rn` 按次数降序取前 10。这也解释了为什么不能直接对原始文件 sort -rn——那时比较的是整行文本而不是计数。详见[《04-开发工具链-Git-Maven-Linux》](#/f/f12)\n\n### 395.（设计模式·易）`Integer` 缓存 -128~127 与字符串常量池复用字面量，都是＿＿＿模式的落地：由工厂统一管理、共享不可变实例来节省内存。\n答案：享元\n解析：共享的是\"多个相同值的对象共用同一份实例\"，而不是\"全局唯一实例\"，所以不是单例；这也解释了 `Integer a=128,b=128` 时 == 为 false——超出缓存范围就不再共享。享元对象必须不可变，否则一个持有者改了全都受影响。详见[《07-设计模式》](#/f/f8)\n\n### 396.（设计模式·中）静态内部类（Holder）单例既能延迟加载又线程安全，靠的是内部类被首次引用时才触发类加载，且 JVM 保证同一个类的＿＿＿过程只执行一次。\n答案：初始化／类初始化\n解析：类初始化由 JVM 加锁完成，所以 Holder.I 只会被创建一次，既不用 volatile 也不用显式加锁；延迟则来自\"内部类只有被引用时才加载\"这一特性。详见[《07-设计模式》](#/f/f8)\n\n### 397.（算法·易）二分查找中，为避免 `(left + right) / 2` 在两个大整数相加时溢出，常写成 `mid = left + ＿＿＿`。\n答案：(right - left) / 2\n解析：变形后等价于取中间位置，差值不会超过 int 范围；`(left + right) >>> 1` 也是常见的无溢出写法。详见[《03-算法刷题路线》](#/f/f34)\n\n### 398.（算法·中）「找下一个更大元素」这一类题（每日温度、柱状图中最大的矩形）的标准解法是维护一个＿＿＿栈。\n答案：单调栈／单调递减栈\n解析：把暂时还没有更大元素的下标压栈，遇到更大的就弹栈结算，每个元素最多进出栈一次，整体 O(n)；与暴力双重循环的 O(n²) 形成对比。详见[《03-算法刷题路线》](#/f/f34)\n\n## 判断题\n\n### 399.（并发·易）volatile 可以保证 i++ 这类复合操作的原子性。\n- A. 正确\n- B. 错误\n\n答案：B\n解析：volatile 只管可见性与有序性，i++ 是\"读-改-写\"三步，并发下仍会丢更新，需要 synchronized 或 AtomicInteger。详见[《01-多线程与并发编程》](#/f/f9)\n\n### 400.（集合·易）HashMap 的 key 允许为 null。\n- A. 正确\n- B. 错误\n\n答案：A\n解析：JDK 1.8 允许一个 null 键（固定放在 0 号桶）；而 Hashtable 与 ConcurrentHashMap 的 key、value 都不允许为 null。详见[《03-集合与泛型》](#/f/f5)\n\n### 401.（Java基础·中）`\"a|b\".split(\"|\")` 能正确按竖线切成两个元素，不需要转义。\n- A. 正确\n- B. 错误\n\n答案：B\n解析：split 的参数是正则，竖线表示\"或\"，结果是每个字符被空匹配切开；必须写成 split(\"\\\\|\")。详见[《02-面向对象与核心类》](#/f/f4)\n\n### 402.（并发·中）synchronized 修饰静态方法时，锁的是该类的 Class 对象。\n- A. 正确\n- B. 错误\n\n答案：A\n解析：静态方法没有 this，锁的是 Class 对象，与实例锁互不影响——同一类里静态与实例同步方法可以并发进入。详见[《01-多线程与并发编程》](#/f/f9)\n\n### 403.（集合·中）重写 equals 而不重写 hashCode，程序一定会抛出异常或明显出错。\n- A. 正确\n- B. 错误\n\n答案：B\n解析：不放进哈希容器时逻辑上看不出问题，所以更隐蔽；一旦用作 HashMap 键或 HashSet 元素，就会重复存、get 不到。违反的是约定而非必然崩溃。详见[《02-面向对象与核心类》](#/f/f4)\n\n### 404.（框架·易）MyBatis 的 #{} 最终会被编译成 JDBC 的预编译占位符 ?。\n- A. 正确\n- B. 错误\n\n答案：A\n解析：#{} 由 PreparedStatement 用 setXxx 绑定参数，SQL 结构在编译期确定，因此能防注入。详见[《MyBatis》](#/f/f17)\n\n### 405.（Redis·中）Redis 6.0 的多线程只用于网络 IO 与协议解析，命令的执行仍然是单线程。\n- A. 正确\n- B. 错误\n\n答案：A\n解析：多线程解决的是网络读写瓶颈；命令在单线程中串行执行，因此单条命令的原子性依旧成立，Lua 脚本也据此工作。详见[《01-Redis》](#/f/f21)\n\n### 406.（消息队列·中）Kafka Topic 增加分区数后，同一个 key 的消息可能被路由到与历史不同的分区。\n- A. 正确\n- B. 错误\n\n答案：A\n解析：分区路由是 hash(key) % 分区数，分区数一变映射就变；需要严格顺序的业务要评估扩容影响或改用新 Topic。详见[《03-Kafka》](#/f/f23)\n\n### 407.（MySQL·中）在默认 RR 隔离级别下，MySQL 已经彻底杜绝了幻读，任何写法都不会出现。\n- A. 正确\n- B. 错误\n\n答案：B\n解析：快照读靠 MVCC、当前读靠临键锁各自避免幻读，但\"先快照读、再被别的事务插入、再当前读/更新\"这类混用场景仍会看到幻影行。详见[《索引-事务-锁与调优》](#/f/f14)\n\n### 408.（框架·中）Spring 事务传播行为 REQUIRED 表示：当前有事务就加入，没有就新建一个。\n- A. 正确\n- B. 错误\n\n答案：A\n解析：这是默认值；REQUIRES_NEW 会挂起当前事务另开一个，NESTED 用保存点，SUPPORTS 无事务则非事务执行。详见[《Spring核心》](#/f/f15)\n\n### 409.（框架·中）@Transactional 默认会对所有抛出的 Exception（含受检异常）回滚。\n- A. 正确\n- B. 错误\n\n答案：B\n解析：默认只对 RuntimeException 和 Error 回滚，受检异常需要 rollbackFor = Exception.class 才回滚——这是最常见的\"事务没回滚\"原因。详见[《Spring核心》](#/f/f15)\n\n### 410.（单元测试·中）为提高覆盖率，单元测试应优先直接测试私有方法。\n- A. 正确\n- B. 错误\n\n答案：B\n解析：私有方法是实现细节，直接反射测试会让重构寸步难行；应通过公共入口的行为测试间接覆盖，若难测则说明该方法该拆出去了。详见[《05-单元测试与工程质量》](#/f/f19)\n\n### 411.（Java基础·中）Java 中 String 是基本数据类型。\n- A. 正确\n- B. 错误\n\n答案：B\n解析：String 是引用类型（final 类），8 种基本类型不含它；面试常拿它与基本类型的包装类一起考。详见[《02-面向对象与核心类》](#/f/f4)\n\n### 412.（集合·中）HashMap 是线程安全的。\n- A. 正确\n- B. 错误\n\n答案：B\n解析：HashMap 非线程安全，并发 put 可能丢数据甚至 1.7 下成环；并发场景用 ConcurrentHashMap 或 Collections.synchronizedMap。详见[《03-集合与泛型》](#/f/f5)\n\n### 413.（Java基础·中）重写 equals 必须同时重写 hashCode。\n- A. 正确\n- B. 错误\n\n答案：A\n解析：约定是相等的对象必须有相同哈希值，否则 HashMap/HashSet 中会「存进去却找不到」；反之 hashCode 相同不要求 equals 相等。详见[《02-面向对象与核心类》](#/f/f4)\n\n### 414.（集合·易）ArrayList 支持随机访问，按下标取元素的时间复杂度是 O(1)。\n- A. 正确\n- B. 错误\n\n答案：A\n解析：底层数组可直接寻址；LinkedList 按下标访问需从头遍历是 O(n)，这也是两者选型的核心差异之一。详见[《03-集合与泛型》](#/f/f5)\n\n### 415.（Java8·中）Stream 可以被重复消费，同一流可以 collect 两次。\n- A. 正确\n- B. 错误\n\n答案：B\n解析：Stream 是一次性的，终端操作后流已关闭，复用会抛 IllegalStateException；需要复用就每次从源重新 stream()。详见[《05-Lambda-Stream与Java8新特性》](#/f/f7)\n\n### 416.（Java基础·难）Java 中 `i++` 是原子操作。\n- A. 正确\n- B. 错误\n\n答案：B\n解析：i++ 是读-改-写三步，多线程下会丢更新，需 AtomicInteger 或加锁；这与 volatile 无关，volatile 也不保证原子性。详见[《01-多线程与并发编程》](#/f/f9)\n\n### 417.（并发·易）线程已经 start() 之后，仍然可以调用 setDaemon(true) 把它改成守护线程。\n- A. 正确\n- B. 错误\n\n答案：B\n解析：setDaemon 必须在 start 之前调用，否则抛 IllegalThreadStateException；守护属性不允许事后再改。详见[《01-多线程与并发编程》](#/f/f9)\n\n### 418.（并发·中）CyclicBarrier 的计数归零后会自动重置、可以循环使用，而 CountDownLatch 归零后无法重置。\n- A. 正确\n- B. 错误\n\n答案：A\n解析：CyclicBarrier 可复用且支持到齐回调，CountDownLatch 是一次性的，想重新计数只能新建对象，这是两者最常被问的区别。详见[《01-多线程与并发编程》](#/f/f9)\n\n### 419.（并发·中）在 synchronized 代码块内调用 `Thread.sleep()` 会让当前线程释放它持有的锁。\n- A. 正确\n- B. 错误\n\n答案：B\n解析：sleep 不释放锁，会抱着锁睡到超时；会释放锁的是 Object.wait()，它同时把线程挂到等待队列。详见[《01-多线程与并发编程》](#/f/f9)\n\n### 420.（并发·难）线程 A 先执行 `v = 1`（v 为 volatile），紧接着执行 `y = 2`（y 为普通变量）；线程 B 读到 `v == 1` 后再读 y，则 B 一定能读到 `y == 2`。\n- A. 正确\n- B. 错误\n\n答案：A\n解析：A 中 v 的写先于 y 的写，volatile 写又 happens-before 读到它的读，加上 B 中读 v 先于读 y，传递性让 y 的写对 B 可见。详见[《01-多线程与并发编程》](#/f/f9)\n\n### 421.（JVM·易）把 -Xms 与 -Xmx 设为相同值，可以避免堆在运行期间反复扩容与收缩带来抖动，是生产的常用做法。\n- A. 正确\n- B. 错误\n\n答案：A\n解析：固定堆大小省去动态调整的代价，也便于按最坏情况规划内存，代价是启动即占用全部堆空间。详见[《02-JVM核心》](#/f/f10)\n\n### 422.（网络·中）TCP 是面向字节流的协议，不保留应用层的消息边界，因此粘包与拆包需要应用层自己处理。\n- A. 正确\n- B. 错误\n\n答案：A\n解析：TCP 只保证字节有序到达，会把多次 write 合并或拆分；常见解法是定长、分隔符或\"长度字段＋内容\"的自定义协议。详见[《03-IO模型与网络编程》](#/f/f11)\n\n### 423.（网络·中）TCP 三次握手中，若客户端发出的第三个 ACK 报文丢失，连接一定无法建立。\n- A. 正确\n- B. 错误\n\n答案：B\n解析：客户端发出 ACK 后即认为连接已建立并可发送数据；服务端超时会重传 SYN+ACK，客户端再次确认后连接照样建立。详见[《03-IO模型与网络编程》](#/f/f11)\n\n### 424.（操作系统·中）只要系统的资源足够充足，就不会发生死锁。\n- A. 正确\n- B. 错误\n\n答案：B\n解析：死锁源于四个必要条件同时成立，与资源总量无关；两个线程各持一把锁再互相申请，资源再多也会死锁。详见[《03-IO模型与网络编程》](#/f/f11)\n\n### 425.（JVM·中）Eden 区被填满时会触发 Full GC。\n- A. 正确\n- B. 错误\n\n答案：B\n解析：Eden 满触发的是 Minor GC（Young GC）；Full GC 的常见触发点老年代或元空间不足、分配担保失败、调用 System.gc() 等。详见[《02-JVM核心》](#/f/f10)\n\n### 426.（MySQL·易）只要在 (a, b) 上建了联合索引，单独用 b 作为查询条件也能走上这个索引。\n- A. 正确\n- B. 错误\n\n答案：B\n解析：联合索引先按 a 排序，a 未限定时 b 在全局是无序的，不满足最左前缀；需要单独给 b 建索引或调整索引列顺序。详见[《索引-事务-锁与调优》](#/f/f14)\n\n### 427.（MySQL·中）事务 ACID 中的隔离性（I）是靠 redo log 实现的。\n- A. 正确\n- B. 错误\n\n答案：B\n解析：隔离性靠 MVCC 与锁共同实现；redo log 保证的是持久性（D），undo log 保证的是原子性（A）。详见[《索引-事务-锁与调优》](#/f/f14)\n\n### 428.（MySQL·中）在大表上查询要返回其中大部分数据时，优化器主动放弃索引改为全表扫描是正常现象，此时 explain 的 key 为 NULL 未必说明 SQL 有问题。\n- A. 正确\n- B. 错误\n\n答案：A\n解析：走二级索引要逐行回表且是随机 IO，当条件区分度低、命中行数占比过高时，顺序全表扫描反而更快；一切以实测耗时为准。详见[《索引-事务-锁与调优》](#/f/f14)\n\n### 429.（MySQL·难）binlog 组提交（group commit）把多个事务的 binlog 刷盘合并成一次 fsync，从而摊薄两阶段提交带来的磁盘 IO 开销。\n- A. 正确\n- B. 错误\n\n答案：A\n解析：commit 阶段被拆成 flush、sync、commit 三段，每段一个队列由 leader 带队执行，多个事务共用一次刷盘；prepare 阶段不变。详见[《索引-事务-锁与调优》](#/f/f14)\n\n### 430.（Redis·中）Redis 的发布订阅可以当作消息队列使用，订阅者离线期间的消息会在重连后补投。\n- A. 正确\n- B. 错误\n\n答案：B\n解析：Pub/Sub 是即发即弃：没有持久化、没有 ACK、没有重投，订阅者离线期间的消息直接丢失，只适合\"丢一两次无大碍\"的缓存失效广播；业务消息（订单、支付）必须交给 RabbitMQ/Kafka/RocketMQ 这类专业 MQ。详见[《01-Redis》](#/f/f21)\n\n### 431.（消息队列·中）Kafka 通过分区设计保证了消息的全局有序，只要 Topic 有足够多的分区，就能同时兼顾吞吐与全局顺序。\n- A. 正确\n- B. 错误\n\n答案：B\n解析：Kafka 只保证分区内有序，分区之间没有任何顺序关系，所以\"全局有序\"与\"多分区并行\"本质互斥，真要全局有序只能退化成单分区。业务上的常规解法是收敛为\"同一业务 key 有序\"，按 key 路由到同一分区。详见[《03-Kafka》](#/f/f23)\n\n### 432.（Redis·中）RDB 是二进制的紧凑快照，恢复速度比 AOF 快，代价是可能丢失最后一次快照之后的写入。\n- A. 正确\n- B. 错误\n\n答案：A\n解析：RDB 定时 fork 子进程做全量快照，文件小、加载快，但两次快照之间的写入会丢；AOF 记录写命令序列，everysec 下最多丢约 1 秒，代价是文件更大、恢复更慢。生产常用混合持久化兼顾两者。详见[《01-Redis》](#/f/f21)\n\n### 433.（消息队列·易）RabbitMQ 生产者开启 publisher confirm 后收到 Basic.Ack，只说明消息已被 Broker 接收，并不代表消费者已经处理成功。\n- A. 正确\n- B. 错误\n\n答案：A\n解析：Confirm 只覆盖\"生产者到 Broker\"这一段，与消费成功与否无关；若消息到了交换机却路由不到任何队列，还要靠 publisher-returns + ReturnCallback 才能捕获。全链路可靠需要队列与消息持久化、消费者手动 ACK、失败重试与死信队列逐段补齐。详见[《02-RabbitMQ》](#/f/f22)\n\n### 434.（Elasticsearch·中）ES 中「更新一条文档」的底层实现是直接在原 segment 里原地修改这条记录。\n- A. 正确\n- B. 错误\n\n答案：B\n解析：segment 一旦生成即不可修改，更新实际是「标记旧文档为删除 + 写入一条新文档」，被标记的旧文档要到段合并（merge）时才真正回收空间——这正是 ES 更新代价高的根源，也是它不适合当主库的原因之一。详见[《05-Elasticsearch》](#/f/f25)\n\n### 435.（Nginx·中）开源版 Nginx 的 upstream 只提供被动健康检查（max_fails/fail_timeout），主动探测需要商业版或第三方模块。\n- A. 正确\n- B. 错误\n\n答案：A\n解析：被动检查是「请求失败达到 max_fails 次就把该节点暂停 fail_timeout 时长不派流量」，属于事后发现；主动探测（定期发请求探活）开源版不具备，需要商业版或 OpenResty 等第三方模块补齐。详见[《07-Nginx》](#/f/f27)\n\n### 436.（MongoDB·易）MongoDB 的单文档更新本身就是原子的，所以把强关联数据放进同一个文档、减少对跨文档事务的依赖，是它的惯用设计。\n- A. 正确\n- B. 错误\n\n答案：A\n解析：一条 BSON 文档的更新不会「写一半」，因此「把需要一起变更的数据内嵌在同一文档里」比开事务更高效，这也是文档模型的核心设计思路。MongoDB 4.0 起虽支持多文档事务，但性能与生态仍不如关系库，不适合当 MySQL 的替代品。详见[《08-MongoDB》](#/f/f28)\n\n### 437.（框架·中）Spring Boot 扫描到的候选自动配置类都会被注册成 Bean，条件注解只决定它们的加载先后顺序。\n- A. 正确\n- B. 错误\n\n答案：B\n解析：条件注解是\"是否生效\"的开关，不满足条件的候选类根本不会注册（@ConditionalOnMissingBean 就是让位给用户配置的关键）；加载先后顺序由 @AutoConfigureOrder/@AutoConfigureBefore 这类注解控制，与条件注解是两件事。详见[《SpringBoot实战》](#/f/f16)\n\n### 438.（框架·难）Feign 的重试只应对幂等操作开启：对下单这类非幂等接口重试，可能造成重复下单。\n- A. 正确\n- B. 错误\n\n答案：A\n解析：重试的本质是\"再发一次请求\"，查询接口重复执行无害，下单、扣款重复执行就是事故；所以只给幂等接口配 Retryer，非幂等接口要靠超时 + 幂等号来兜底。另需显式配置 connectTimeout/readTimeout，避免下游慢调用拖垮自己。详见[《SpringCloud微服务》](#/f/f18)\n\n### 439.（框架·难）Sentinel 触发限流或熔断后，请求会走 blockHandler 等兜底逻辑返回降级结果，而不是把异常直接抛给用户。\n- A. 正确\n- B. 错误\n\n答案：A\n解析：这正是\"降级\"的意义：被限流/熔断/异常时返回缓存旧值、默认值这类\"有损但可用\"的结果。注意规则默认存在内存里，重启即丢失，生产要接 Nacos 做规则持久化。详见[《SpringCloud微服务》](#/f/f18)\n\n### 440.（单元测试·难）测试类上标注 @Transactional 后，用例结束时数据库、Redis 与消息队列的写入都会一起回滚，因此不会污染环境。\n- A. 正确\n- B. 错误\n\n答案：B\n解析：它只回滚当前事务里的数据库操作，回滚不了 Redis、消息队列等外部副作用；而且因为复用同一连接、内层事务被合并，还会掩盖事务传播行为的 bug。生产级做法是独立测试库每轮清理，或用 Testcontainers 每次起新容器。详见[《05-单元测试与工程质量》](#/f/f19)\n\n### 441.（认证与安全·中）JWT 的 payload 是加密的，所以把手机号等敏感信息放进 payload 是安全的。\n- A. 正确\n- B. 错误\n\n答案：B\n解析：JWT 是\"签名\"不是\"加密\"，header 与 payload 只是 Base64URL 编码，任何人都能解开看内容；签名只保证不被篡改，不保证保密。payload 里只放 userId、role 这类不敏感标识，手机号等敏感数据留在服务端按需查询。详见[《06-认证与安全》](#/f/f20)\n\n### 442.（分布式与高并发·中）一致性哈希环上移除一个节点时，该节点原本承载的数据会被平均分摊到其余所有节点上。\n- A. 正确\n- B. 错误\n\n答案：B\n解析：数据是沿环顺时针找到第一个节点存放的，所以被移除节点的数据只会整体交给它在环上的**顺时针后继**那一台，其余节点分毫不动。之所以看起来\"分摊开了\"，是因为虚拟节点让每个物理节点在环上有上百个落点，它的后继自然散布在多台机器上——这是虚拟节点的第二个好处：故障压力均摊。详见[《01-分布式理论基础》](#/f/f29)\n\n### 443.（系统设计·易）短链跳转返回 301（永久重定向）而不是 302，好处是浏览器会缓存这次跳转，从而减少对短链服务的回源请求。\n- A. 正确\n- B. 错误\n\n答案：A\n解析：301 会被浏览器缓存，同一短码的后续访问可能根本不打到服务端，对读多写少的短链系统是很大的减负。反过来，如果业务强依赖每次点击都回源，才会考虑 302——但点击统计的正确做法是异步上报（写 MQ 不阻塞跳转），而不是牺牲缓存来换。详见[《03-系统设计场景题》](#/f/f31)\n\n### 444.（系统设计·中）Redis ZSET 中分数相同的成员会按成员名的字典序排列，因此做排行榜时若要求\"同分先达到者排前\"，需要把时间信息编进 score。\n- A. 正确\n- B. 错误\n\n答案：A\n解析：ZSET 的排序规则是\"先比 score，score 相同再按 member 字典序\"，字典序与达成先后毫无关系。常规做法是把 score 设计成复合值（例如 `分数 × 10^10 + (大常数 - 时间戳)`），一次 ZADD 就把并列名次也定好；取榜单用 ZREVRANGE，查自己名次用 ZREVRANK。注意\"精确名次\"与\"TopN 列表\"是两个量级的问题，亿级数据要靠分桶 + 近似 + 定时快照。详见[《03-系统设计场景题》](#/f/f31)\n\n### 445.（工具链·易）git rebase 会把被重放的提交彻底删除，之后再也找不回来。\n- A. 正确\n- B. 错误\n\n答案：B\n解析：rebase 是\"把提交逐个重放\"，原提交仍以悬空对象留在仓库里，通过 reflog 或旧 sha 通常还能找回，直到 gc 回收；它真正危险的地方不是\"丢内容\"，而是改写了公共历史导致协作者本地历史错位。详见[《04-开发工具链-Git-Maven-Linux》](#/f/f12)\n\n### 446.（设计模式·中）把 `@Scope(\"prototype\")` 的 Bean 注入到一个单例 Bean 之后，该单例持有的始终是注入时创建的那一个实例。\n- A. 正确\n- B. 错误\n\n答案：A\n解析：注入只发生一次，之后这个字段一直指向最初创建的对象。想每次都拿新的，需要用 ObjectProvider、@Lookup 或直接从容器 getBean——这是原型模式在 Spring 里最常见的踩坑点。详见[《07-设计模式》](#/f/f8)\n\n### 447.（算法·易）快速排序的最坏时间复杂度是 O(nlogn)。\n- A. 正确\n- B. 错误\n\n答案：B\n解析：快排最坏是 O(n²)——每次划分只能分出一个元素（如已有序数组固定取首元素为基准），递归深度退化成 n。O(nlogn) 是它的平均复杂度，这一点是最常见的时间复杂度误解之一。详见[《03-算法刷题路线》](#/f/f34)\n\n### 448.（算法·中）HashMap 的查询平均时间复杂度是 O(1)，最坏情况下会退化成 O(n)。\n- A. 正确\n- B. 错误\n\n答案：A\n解析：哈希均匀时定位到桶是常数时间；大量 key 落在同一个桶（哈希碰撞）时会退化成链表扫描，JDK 1.8 用\"链表长度超过 8 且容量 ≥ 64 时转红黑树\"把最坏情况改善到 O(logn)。详见[《03-集合与泛型》](#/f/f5)\n","ck":0},{"id":"f37","stage":7,"path":"07-面试篇/06-考点详略表.md","title":"06-考点详略表","md":"# 06-考点详略表\n\n> **阶段**：全部 ｜ **用法**：时间有限时按此表取舍精力。图例——🔴 **必考精通**：详学 + 亲手敲代码 + 面试题全过 + 能应对追问；🟡 **高频掌握**：懂原理 + 能讲清楚 + 小考通过即可；🟢 **了解即可**：有印象、能用一句话对比定位。配合应用「📖 章节小考」逐章验收、🟡 以下允许只看文档不写代码。\n\n## 一、面试权重总览\n\n| 阶段 | 面试权重 | 建议投入 | 说明 |\n|------|---------|---------|------|\n| ② 进阶篇（并发/JVM） | 🔴🔴 最高 | 全程 40% 力度 | 区分度最大，追问最深的板块 |\n| ⑤ 中间件篇 | 🔴 最高 | 全程 25% 力度 | 场景题主力（缓存/消息/搜索） |\n| ③ 数据库篇 | 🔴 最高 | 全程 15% 力度 | MySQL 几乎每场必问 |\n| ④ 框架篇 | 🔴 高 | 全程 12% 力度 | Spring 事务与自动配置是常客 |\n| ⑥ 分布式与高并发 | 🟡 高 | 全程 5% 力度 | 一二面考场景设计题 |\n| ① 入门篇 | 🟡 中 | 全程 3% 力度 | 地基，但面试问得浅（一面开场） |\n| ⑦ 面试篇 | 🔴 冲刺期主战场 | 最后 3~4 周 | 速查 + 题库 + 算法 + 简历 |\n\n## 二、各篇详略\n\n### ① 入门篇（整体 🟡）\n\n| 文件 | 定位 | 必须精通 🔴 | 了解即可 🟢 |\n|------|------|------------|------------|\n| 01-环境搭建与基础语法 | 🟡 地基 | JDK/JRE/JVM、值传递、基本类型 | 快捷键、二维数组细节 |\n| 02-面向对象与核心类 | 🟡 地基 | 三大特性、equals/hashCode、String 不可变、Integer 缓存 | 内部类细节、StringJoiner |\n| 03-集合与泛型 | 🔴 详学 | ArrayList 扩容、HashMap 全套（put/扩容/1.7vs1.8）、fail-fast | Vector/Stack、EnumMap |\n| 04-异常-IO-反射-注解 | 🟡 | 异常体系、反射原理与用途、动态代理 | 加密与安全、正则 |\n| 05-Lambda-Stream与Java8 | 🟡 | Stream 常用操作、map/flatMap、Optional | Nashorn、模块化细节 |\n| 07-设计模式 | 🟡 | 单例（DCL）、代理（对应 AOP）、策略/模板/观察者，**Spring 里的模式对照表必背** | 访问者、解释器、中介者 |\n\n### ② 进阶篇（整体 🔴🔴，面试区分度最大）\n\n| 文件 | 定位 | 必须精通 🔴 | 了解即可 🟢 |\n|------|------|------------|------------|\n| 01-多线程与并发编程 | 🔴🔴 | 线程池全套（7 参数/流程/拒绝策略/大小）、synchronized 与锁升级、volatile、ThreadLocal、ConcurrentHashMap、JMM 三性 | 虚拟线程、StampedLock |\n| 02-JVM核心 | 🔴🔴 | 内存区域、GC 判活与收集器（G1）、类加载与双亲委派、CPU 100%/OOM 排查流程 | ZGC 细节、逃逸分析 |\n| 03-IO模型与网络编程 | 🟡 | 三次握手/四次挥手、BIO/NIO/AIO 区别、零拷贝概念、Cookie/Session/JWT | Netty 源码级细节、RMI |\n| 04-开发工具链 | 🟢 | Maven 依赖冲突排查、git merge vs rebase、排查命令链（top/jstack） | Gradle、shell 高级用法 |\n\n### ③ 数据库篇\n\n| 文件 | 定位 | 必须精通 🔴 | 了解即可 🟢 |\n|------|------|------------|------------|\n| 01-MySQL基础与SQL实战 | 🟡 | 连接查询、分组聚合、执行顺序（手写 SQL 要熟） | 存储过程、窗口函数 |\n| 02-索引-事务-锁与调优 | 🔴🔴 | B+ 树与回表/覆盖索引/最左前缀、隔离级别与 MVCC、三大日志、explain、慢 SQL 排查、分库分表思路 | 主从复制的字节级细节 |\n\n### ⑤ 中间件篇（场景题主战场）\n\n| 文件 | 定位 | 必须精通 🔴 | 了解即可 🟢 |\n|------|------|------------|------------|\n| 01-Redis | 🔴🔴 | 五大类型与场景、持久化、缓存穿透/击穿/雪崩、缓存一致性、分布式锁（Redisson）、哨兵/集群 | 模块（Module）、Stream 类型 |\n| 02-RabbitMQ | 🟡 | 消息不丢全链路（confirm/持久化/ACK/死信）、幂等消费、延迟队列 | 镜像/仲裁队列运维细节 |\n| 03-Kafka | 🟡 | 为什么快、分区与消费组、ACK/ISR、不丢不重 | Streams、Exactly-Once 事务细节 |\n| 04-RocketMQ | 🟡 | 事务消息流程、顺序/延迟消息、三大 MQ 选型对比 | 消息轨迹、Dledger 运维 |\n| 05-Elasticsearch | 🟡 | 倒排索引、与 MySQL 分工、DSL 基本查询、数据同步方案 | 深分页源码、分片路由细节 |\n| 06-ZooKeeper与Nacos | 🟡 | Watcher 与临时节点、CP/AP 取舍、Nacos 注册+配置热更新 | ZAB 选举细节 |\n| 07-Nginx | 🟢 略读 | 反向代理 vs 正向代理、负载均衡策略、动静分离 | OpenResty、内核级调优 |\n| 08-MongoDB | 🟢 略读 | 与 MySQL 的选型边界、文档模型 | 副本集/分片集群运维 |\n\n### ④ 框架篇\n\n| 文件 | 定位 | 必须精通 🔴 | 了解即可 🟢 |\n|------|------|------------|------------|\n| 01-Spring核心 | 🔴🔴 | IoC/AOP 原理、Bean 生命周期与循环依赖、@Transactional 失效场景、SpringMVC 流程 | 事件机制、SpEL |\n| 02-SpringBoot实战 | 🔴🔴 | 自动配置原理、统一返回/异常/校验三件套（项目要用） | Actuator 细节、自定义 starter 完整实现 |\n| 03-MyBatis | 🟡 | #{} vs ${}、一二级缓存、Mapper 动态代理原理、Plus 常用功能 | 插件开发、多数据源 |\n| 04-SpringCloud微服务 | 🟡 | 组件全景（注册/配置/网关/熔断）、Nacos 原理、Feign/网关/限流的概念与用法 | 链路追踪落地、Seata 细节（分布式篇补） |\n| 05-单元测试与工程质量 | 🟢 | @SpringBootTest vs @WebMvcTest、mock 思路（项目要用） | Testcontainers、变异测试 |\n| 06-认证与安全 | 🟡 | JWT 结构与吊销、BCrypt 存密码、XSS/CSRF/注入防御（中厂爱问） | OAuth2 全流程、SSO 协议细节 |\n\n### ⑥ 分布式与高并发篇\n\n| 文件 | 定位 | 必须精通 🔴 | 了解即可 🟢 |\n|------|------|------------|------------|\n| 01-分布式理论基础 | 🟡 | CAP/BASE、一致性哈希、雪花算法与时钟回拨、三种分布式锁对比、分布式事务方案选型 | Paxos/Raft 推导 |\n| 02-高并发系统设计 | 🔴🔴 | 秒杀全链路（必考场景题）、限流四算法、缓存体系与一致性、分库分表问题清单 | 异地多活、单元化 |\n| 03-系统设计场景题 | 🟡 | 答题框架 + 短链/去重/延迟任务/排行榜 四个高频场景 | IM、Feed 流细节、GEO |\n\n### ⑦ 面试篇（冲刺期全部 🔴）\n\n| 文件 | 定位 | 用法 |\n|------|------|------|\n| 01/02-八股速查 | 🔴 | 冲刺期每天过 1~2 个板块，全部打勾 |\n| 03-算法刷题路线 | 🔴 | 每天 2~3 题 + 手撕模板默写，总量 200 题 |\n| 04-简历与求职指南 | 🔴 | 简历定稿 + STAR 项目故事 + 各轮侧重 |\n| 05-选择填空判断题库 | 🔴 | 章节小考逐章清零 → 乱序全刷 → 只做错题 → 综合大考 ≥85% |\n| 本篇（详略表） | 🟡 | 每 2 周回顾一次，动态调整精力分配 |\n\n## 三、时间紧时的「最小可行知识面」\n\n只剩 1 个月时的取舍（按性价比排序，保住 80% 的面试得分点）：\n\n1. 🔴 并发：线程池 + synchronized/volatile + ThreadLocal + ConcurrentHashMap（2 天）\n2. 🔴 JVM：内存区域 + GC 基础 + 双亲委派 + 两条排查流程（2 天）\n3. 🔴 MySQL：B+ 树/回表/覆盖 + 隔离级别/MVCC + 三大日志 + explain（3 天）\n4. 🔴 Redis：五大类型 + 持久化 + 三兄弟 + 一致性 + 分布式锁（3 天）\n5. 🔴 Spring：IoC/AOP + Bean 生命周期 + 事务失效 + 自动配置（2 天）\n6. 🔴 场景题：秒杀设计 + 缓存一致性 + 消息不丢不重（2 天）\n7. 🟡 MQ 三选一精通（RocketMQ 优先，含事务消息），另外两个会选型对比（2 天）\n8. 🟡 算法：热题 100 的前 6 个专题 + 7 个手撕模板（贯穿每天）\n9. 🟢 其余（网络细节、Nginx、MongoDB、SpringCloud 组件细节）只看本指南对应文件的「高频面试题」部分\n\n## 四、与打卡和应用的联动\n\n- 每章学完 → 应用「📝 选择填空练习」→「📖 章节小考」选本章 → 正确率 90%+ 才过\n- 每个 🔴 文件 → STUDY-TRACKER 打卡全部勾完才算精通\n- 周末 → 「🏁 综合大考」20 题，正确率 <85% 时用「🔁 只做错题」+ 首页「薄弱环节」定位补漏\n- 本表每 2 周对照一次：已精通的降级为维持性复习，薄弱的升级投入\n","ck":0},{"id":"f38","stage":7,"path":"07-面试篇/07-术语速查表.md","title":"07-术语速查表","md":"# 07-术语速查表\n\n> **阶段**：面试篇 ｜ **用法**：碰到不认识的缩写来这里查；冲刺期通读一遍，10 分钟\n\n## 📖 使用说明\n\n- 八股和面经里最坑的不是\"不懂原理\"，是**看不懂题**——面试官说\"你们 P99 多少\"\"这个 RPO 能接受吗\"，缩写卡住就彻底接不上。\n- 每行格式：`缩写 | 全称 | 一句话解释 | 出现章节`。⭐标星的是问不出来一定扣分的。\n- 只背这一栏不够：认全缩写后回到\"章节\"列那份指南看完整追问链。\n\n## 🎯 性能与容量\n\n| 缩写 | 全称 | 一句话解释 | 章节 |\n|---|---|---|---|\n| ⭐QPS | Queries Per Second | 每秒查询数，读请求为主场景的吞吐指标 | ../06-分布式与高并发篇/02-高并发系统设计.md |\n| ⭐TPS | Transactions Per Second | 每秒完成的事务（一笔完整业务）数，写场景用 | 同上 |\n| QPM / RPM | Queries/Requests Per Minute | 每分钟请求数，限流窗口常用分钟粒度 | 同上 |\n| ⭐RT | Response Time | 响应时间，一次请求从发出到收到结果的耗时（ms） | 同上 |\n| 并发数 | Concurrency | 同一时刻**正在被处理**的请求数量，不是客户端数 | 同上 |\n| 吞吐量 | Throughput | 单位时间处理的请求量；QPS/TPS 都是它的具体形式 | 同上 |\n| ⭐Little's Law | 利特尔法则 | **并发数 = 吞吐量 × 响应时间**（L = λ × W）：QPS 1000、RT 20ms → 系统内约 20 个并发 | 同上 |\n| P99 / P95 / P50 | 第 99/95/50 百分位耗时 | 99% 的请求都快于这个值；⭐平均数会被极值骗，看分位才准 | 同上 |\n| SLA | Service Level Agreement | 对外承诺的服务可用性等级，如 99.99%（一年不可用约 52 分钟） | 同上 |\n| SLO | Service Level Objective | 内部目标值（比 SLA 留余量），违反了叫 SLA 违约 | — |\n\n## ☕ JVM 与并发（JUC）\n\n| 缩写 | 全称 | 一句话解释 | 章节 |\n|---|---|---|---|\n| ⭐JIT | Just-In-Time 编译 | 运行期把热点字节码编译成本机代码，\"一次编译到处运行\"仍要现场编译 | ../02-进阶篇/02-JVM核心.md |\n| AOT | Ahead-Of-Time 编译 | 运行前就编成本地码（GraalVM Native Image），启动快、内存省，但峰值优化不如 JIT | — |\n| ⭐Safepoint | 安全点 | 线程停在\"能安全 GC\"的位置才动手；到达方式是\"轮询标志位主动挂起\"，所以有停顿 | 同上 |\n| STW | Stop The World | GC 时用户线程全停，是停顿时间的根源 | 同上 |\n| ⭐OOM | Out Of Memory | 堆不够（Java heap space）、元空间不够、栈深（StackOverflowError 是另一类）、线程建太多 | 同上 |\n| ⭐GC Root | 垃圾回收根对象 | 判活的起点：栈上的局部变量/引用、静态变量、常量、JNI 引用、活跃线程、类加载器等 | 同上 |\n| TLAB | Thread Local Allocation Buffer | 每个线程在 Eden 里的私有小缓冲区，避免并发分配抢锁 | 同上 |\n| BABY | Baby 代（年轻代俗称） | 一些资料里指 Young Generation；不是缩写而是行话，见到别慌 | 同上 |\n| ⭐JMM | Java Memory Model | 描述\"线程与主内存\"的抽象规范，规定volatile/锁/final 的可见性与排序约束 | ../02-进阶篇/01-多线程与并发编程.md |\n| CAS | Compare And Swap | 乐观锁原子指令：预期值等于当前值才更新，失败就重试；ABA 问题靠版本号/AtomicStampedReference 解 | 同上 |\n| AQS | AbstractQueuedSynchronizer | 同步器骨架：state + CLH 双向队列，ReentrantLock/Semaphore/CountDownLatch 都基于它 | 同上 |\n| JUC | java.util.concurrent 包 | 并发工具包统称（线程池、Atomic、Lock、并发容器） | 同上 |\n\n## 🗄 MySQL\n\n| 缩写 | 全称 | 一句话解释 | 章节 |\n|---|---|---|---|\n| ⭐DDL | Data Definition Language | 建/改/删结构：CREATE、ALTER、DROP（隐式提交，不能回滚） | ../03-数据库篇/01-MySQL基础与SQL实战.md |\n| ⭐DML | Data Manipulation Language | 增删改：INSERT、UPDATE、DELETE | 同上 |\n| DQL | Data Query Language | 查询：SELECT | 同上 |\n| DCL | Data Control Language | 权限：GRANT、REVOKE | 同上 |\n| TCL | Transaction Control Language | 事务：COMMIT、ROLLBACK、SAVEPOINT | 同上 |\n| ⭐ACID | 原子/一致/隔离/持久 | 事务四特性；分别由 undo log、业务约束、MVCC+锁、redo log + binlog 保证 | ../03-数据库篇/02-索引-事务-锁与调优.md |\n| ⭐MVCC | Multi-Version Concurrency Control | 多版本并发控制：undo log 版本链 + ReadView，让读不加锁、读写不互相阻塞 | 同上 |\n| ⭐ICP | Index Condition Pushdown | 索引条件下推：把 WHERE 里能用索引列的判断搬到存储引擎层，减少回表次数 | 同上 |\n| B+ 树 | B+ Tree | InnoDB 索引结构：非叶子只存键、叶子双向链表相连，矮胖 → 3 层存两千万行 | 同上 |\n| ⭐redo log / binlog | 重做日志 / 归档日志 | redo 是 InnoDB 物理日志保证崩溃恢复（WAL）；binlog 是 Server 层逻辑日志用于复制与恢复 | 同上 |\n| WAL | Write-Ahead Logging | 先写日志再写磁盘数据页，把随机写变顺序写 | 同上 |\n| LSN | Log Sequence Number | 日志序列号，redo log 的位点；用于崩溃恢复与主从对齐 | 同上 |\n| BBA | 双写备份（BlackBox Audit，部分资料写作\"两阶段提交\"语境） | 少见缩写，指 redo 与 binlog 的**两阶段提交**配合点；见到按\"2PC + binlog\"理解即可 | 同上 |\n| PITR | Point-In-Time Recovery | 基于全量备份 + binlog 恢复到任意时间点（误删库救命术） | 同上 |\n| explain | — | 看执行计划：type、key、rows、Extra（Using filesort/temporary 是坏信号） | 同上 |\n| ⭐分库分表 | Sharding | 垂直拆（按业务）+ 水平拆（按规则），中间件 ShardingSphere | ../06-分布式与高并发篇/02-高并发系统设计.md |\n| ORM | Object Relational Mapping | 对象-表映射框架（MyBatis、JPA），省样板但复杂查询易失控 | ../04-框架篇/03-MyBatis.md |\n\n## 🖥 Redis\n\n| 缩写 | 全称 | 一句话解释 | 章节 |\n|---|---|---|---|\n| ⭐RDB | Redis Database（快照文件） | 定时 fork 子进程做全量二进制快照，文件小恢复快、会丢两次之间的数据 | ../05-中间件篇/01-Redis.md |\n| ⭐AOF | Append Only File | 追加记录每条写命令，everysec 最多丢 1 秒，文件大恢复慢 | 同上 |\n| TTL | Time To Live | key 的过期时间（`EXPIRE`/`TTL` 命令）——与网络里的 TTL 是同名不同义 | 同上 |\n| ⭐LRU | Least Recently Used | 最近最少使用淘汰；Redis 是**近似 LRU**（随机采样 N 个挑最久未用） | 同上 |\n| LFU | Least Frequently Used | 按访问频率淘汰（4.0+），热点更稳 | 同上 |\n| noeviction | — | 内存满不淘汰，写命令直接报错（默认策略） | 同上 |\n| allkeys-lru / volatile-lru | — | 全部 key / 只从有过期时间的 key 里淘汰 | 同上 |\n| MSET / MGET | — | 批量写/读，省 RT（比循环单命令少 N 次往返） | 同上 |\n| SDS | Simple Dynamic String | Redis 的字符串结构：预分配 + 记录长度（O(1) 求长度）+ 二进制安全 | 同上 |\n| ⭐Pipeline | — | 批量发命令减少网络往返，⚠️不保证原子（那是 Lua 事务的事） | 同上 |\n| 布隆过滤器 | Bloom Filter | 判\"一定不存在/可能存在\"的概率结构，防穿透；有误判率、不支持删除 | ../05-中间件篇/01-Redis.md |\n| 热 Key / 大 Key | — | 见\"性能与容量\"栏 | 同上 |\n\n## 📨 消息队列（MQ）\n\n| 缩写 | 全称 | 一句话解释 | 章节 |\n|---|---|---|---|\n| ⭐ACK | Acknowledgement | 消费者确认消息已处理；Kafka 是 offset 提交，RabbitMQ 是 basic.ack，RocketMQ 返回 CONSUME_SUCCESS | ../05-中间件篇/02-RabbitMQ.md、03-Kafka.md |\n| NACK | Negative ACK | 确认失败，可要求重回队列或直接进死信 | 同上 |\n| ⭐DLQ | Dead Letter Queue | 死信队列：重试耗尽/被拒绝/过期的消息进这里，人工或补偿任务处理 | ../05-中间件篇/02-RabbitMQ.md |\n| ⭐ISR | In-Sync Replicas | Kafka 中与 leader 保持同步的副本集合，只有 ISR 里的才能被选为新 leader | ../05-中间件篇/03-Kafka.md |\n| HW | High Watermark | 高水位：所有 ISR 副本都已落盘的最大 offset，⚠️消费者只能读到 HW | 同上 |\n| LEO | Log End Offset | 每个副本下一条待写入消息的 offset（HW 由 ISR 中最小 LEO 决定） | 同上 |\n| ⭐LSO | Last Stable Offset | 事务消息可见性水位：未提交事务之前的位置，用于读已提交隔离级别 | 同上 |\n| ⭐WAL | Write-Ahead Log | 先写日志再改数据；Kafka/RocketMQ/InnoDB/etcd 都靠它做顺序写与恢复 | ../05-中间件篇/03-Kafka.md |\n| Consumer Group / Rebalance | 消费组 / 再平衡 | 组内分摊分区（一分区一消费者），成员变化触发 Rebalance | 同上 |\n| 幂等消费 | Idempotent | 同一条消息重复投递不产生重复效果（唯一业务键 + 去重表/Redis） | ../05-中间件篇/04-RocketMQ.md |\n| ⭐E2E | End To End | 端到端：从生产者发出到消费者处理完的完整链路（\"E2E 延迟\"=全链路耗时） | 各 MQ 篇 |\n| 延迟消息 | Delayed Message | 到点才投递（订单超时关闭），Rabbit 用死信/TTL，Rocket 用延迟等级 | ../05-中间件篇/04-RocketMQ.md |\n| 事务消息 | Transactional Message | 半消息 + 本地事务 + 二次确认，实现最终一致 | 同上 |\n\n## 🌐 分布式与一致性\n\n| 缩写 | 全称 | 一句话解释 | 章节 |\n|---|---|---|---|\n| ⭐CAP | Consistency/Availability/Partition tolerance | 一致性、可用性、分区容错三者最多取二；网络分区必然存在，所以本质是 CP 还是 AP 的取舍 | ../06-分布式与高并发篇/01-分布式理论基础.md |\n| ⭐BASE | Basically Available / Soft state / Eventually consistent | 折中方案：基本可用 + 中间态 + 最终一致，是互联网业务的默认姿势 | 同上 |\n| ⭐RPO | Recovery Point Objective | 最多能接受**丢多少数据**（时间长度），决定同步/异步复制 | 同上 |\n| ⭐RTO | Recovery Time Objective | 最多能接受**多久恢复服务**，决定切换方式与预案 | 同上 |\n| ⭐2PC | Two-Phase Commit | 准备 + 提交两阶段强一致事务（XA）；协调者单点、阻塞、同步阻塞代价大 | 同上 |\n| 3PC | Three-Phase Commit | 加 CanCommit + 超时机制减少阻塞，但**仍不能保证一致**，工业界少用 | 同上 |\n| ⭐TCC | Try-Confirm-Cancel | 业务层补偿事务：预留资源→确认→取消，性能比 2PC 好，但每笔都要写三段代码 | ../06-分布式与高并发篇/02-高并发系统设计.md |\n| SAGA | — | 长事务拆成多个本地事务 + 依次补偿（正向/逆向），最终一致 | 同上 |\n| XA | eXtended Architecture | 跨数据库分布式事务标准协议，Seata AT/XA 模式底层依赖它 | 同上 |\n| ⭐Seata | Simple Extensible Transaction Agent | 阿里开源分布式事务框架，AT（无侵入）/TCC/SAGA/XA 四模式 | 同上 |\n| LC | Local Cache / Logical Clock | 视上下文：客户端本地缓存；或 Lamport 逻辑时钟（分布式定序） | — |\n| GTS | Global Transaction Service | 阿里云商业版分布式事务服务（Seata 的托管前身），面经里偶见 | — |\n| 分布式锁 | — | Redis SET NX EX / Redisson / ZooKeeper 临时顺序节点，三选一对比必背 | ../05-中间件篇/01-Redis.md、06-ZooKeeper与Nacos.md |\n| 一致性哈希 | Consistent Hashing | 节点上下线只搬动约 1/N 的数据，缓存分片/负载均衡用它 | ../06-分布式与高并发篇/02-高并发系统设计.md |\n| 脑裂 | Split-Brain | 网络分区导致两个节点都以为自己主，写冲突；靠多数派仲裁避免 | ../05-中间件篇/06-ZooKeeper与Nacos.md |\n| 幂等 | Idempotent | 同一请求执行多次结果一致（唯一业务号 + 状态机校验） | ../06-分布式与高并发篇/02-高并发系统设计.md |\n\n## 🏗 微服务与架构\n\n| 缩写 | 全称 | 一句话解释 | 章节 |\n|---|---|---|---|\n| ⭐RPC | Remote Procedure Call | 像调本地方法一样调远程服务（Dubbo、gRPC、Feign），比 HTTP 少样板 | ../04-框架篇/04-SpringCloud微服务.md |\n| ⭐REST | Representational State Transfer | 一种架构风格：资源 + URI + HTTP 动词 + 无状态，Web API 主流 | ../04-框架篇/02-SpringBoot实战.md |\n| SOAP | Simple Object Access Protocol | 基于 XML 的重型协议（WSDL/SOUL 严格契约），老企业系统里能见 | — |\n| gRPC | Google RPC | HTTP/2 + Protobuf 的跨语言 RPC，流式、快、强类型 | ../04-框架篇/04-SpringCloud微服务.md |\n| BFF | Backend For Frontend | 给每个前端（App/H5/小程序）单独一层聚合裁剪接口 | 同上 |\n| ⭐CDN | Content Delivery Network | 就近静态加速节点，缓存图片/JS/CSS，回源有 TTL | ../05-中间件篇/07-Nginx.md |\n| ⭐CI/CD | Continuous Integration / Delivery·Deployment | 自动构建测试 → 自动发布；工具 Jenkins/GitLab CI/GitHub Actions | ../02-进阶篇/04-开发工具链-Git
