依赖无解，Spring Boot 2.6+ 默认禁止。\n\n**Q：BeanFactory 和 FactoryBean 的区别？**\n- BeanFactory 是 IoC 容器的顶层接口，负责生产和管理所有 Bean。\n- FactoryBean 是一种特殊 Bean：getObject() 里封装复杂对象的创建逻辑，容器里放的是 getObject() 的产物。\n- 想拿 FactoryBean 本身要在 beanName 前加 `&`；MyBatis 的 Mapper 就是通过 MapperFactoryBean 注册的。\n\n**Q：SpringMVC 处理一个请求的流程？**\n- DispatcherServlet 统一接收 → HandlerMapping 找到 Handler 和拦截器链 → HandlerAdapter 执行（参数解析、消息转换）→ Controller 返回。\n- @ResponseBody 时由 HttpMessageConverter 序列化 JSON 直接写出；传统方式再走 ViewResolver 渲染。\n- 异常统一交给 @ControllerAdvice 处理。\n\n**Q：拦截器和过滤器的区别？**\n- 过滤器属于 Servlet 规范，在 DispatcherServlet 之前执行，处理原始请求响应，适合编码、跨域、全局 XSS 过滤。\n- 拦截器属于 Spring MVC，围绕 Handler 执行，能注入 Spring Bean、拿到处理方法信息，适合鉴权、日志。\n- 执行顺序：过滤器 → DispatcherServlet → 拦截器 preHandle → Controller → 拦截器 postHandle/afterCompletion → 过滤器。\n\n## 🔗 推荐资料\n\n| 资料 | 说明 | 链接 |\n| --- | --- | --- |\n| JavaGuide Spring 常见问题总结 | IoC/AOP/事务/生命周期面试题合集 | https://javaguide.cn/system-design/framework/spring/spring-knowledge-and-questions-summary.html |\n| pdai Spring 知识体系 | 从核心机制到源码的体系化目录 | https://pdai.tech/md/spring/spring.html |\n| 廖雪峰 Spring 教程 | IoC、AOP、事务的入门实操 | https://liaoxuefeng.com/books/java/spring/index.html |\n| 廖雪峰 Maven 教程 | 框架篇所有工程的依赖管理基础 | https://liaoxuefeng.com/books/java/maven/index.html |\n","ck":0},{"id":"f16","stage":4,"path":"04-框架篇/02-SpringBoot实战.md","title":"SpringBoot实战","md":"# SpringBoot实战\n\n> **阶段**：框架篇 ｜ **建议时长**：5 天 ｜ **前置**：01-Spring核心.md\n\n## 🎯 学习目标\n\n- 能完整讲出 Spring Boot 自动配置原理（三个注解 + 条件注解 + AutoConfiguration.imports）。\n- 能用 yml 多环境 Profile 管理配置，并说清 @ConfigurationProperties 与 @Value 的取舍。\n- 能搭建一套规范 Web 工程：统一返回体、全局异常、参数校验、slf4j 日志。\n- 能独立完成 todo-list REST API：MyBatis-Plus + MySQL + Redis 缓存 + 打包部署。\n- 能说清 Spring Boot 启动流程概览与自定义 starter 的思路。\n\n## 📖 核心知识点\n\n### 1. 约定优于配置与起步依赖 ⭐\n\n> 面试官想听：Spring Boot 解决了 Spring 什么痛点——XML 地狱和依赖版本冲突。\n\n- **约定优于配置**：默认扫描主类所在包及子包、默认嵌入式 Tomcat 端口 8080、默认配置文件 application.yml，不配置也能跑。\n- **起步依赖（starter）**：`spring-boot-starter-web` = 一组按功能聚合的依赖 + 对应的自动配置。引入 starter 即引入整套能力，版本由 `spring-boot-starter-parent` 统一仲裁，杜绝版本冲突。\n- Web 项目最小依赖：`spring-boot-starter-web`、数据库驱动、持久层 starter（下一篇用 `mybatis-plus`）、`spring-boot-starter-validation`。\n- 版本差异：Spring Boot 2.7 基于 javax、Java 8+；Spring Boot 3.x 基于 Jakarta EE（`javax.*` → `jakarta.*`）、要求 Java 17+。新学建议直接上 3.x，老项目要会看 2.7。\n\n### 2. 自动配置原理 ⭐\n\n> 面试官想听：出现率最高的 Spring Boot 面试题，按\"三个注解 → 选择器 → imports 文件 → 条件注解\"四步讲。\n\n`@SpringBootApplication` 是三合一：\n\n```text\n@SpringBootConfiguration   —— 本质是 @Configuration，标记配置类\n@EnableAutoConfiguration   —— 自动配置的总开关\n@ComponentScan             —— 扫描主类所在包及子包的组件\n```\n\n自动配置的加载链路：\n\n```text\n@EnableAutoConfiguration\n  → @Import(AutoConfigurationImportSelector)\n  → 读取所有 jar 包的 META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports\n    （Spring Boot 2.7 之前是 META-INF/spring.factories）\n  → 拿到全部候选自动配置类（如 DataSourceAutoConfiguration、RedisAutoConfiguration）\n  → 用条件注解逐个过滤，符合条件的才注册为 Bean\n```\n\n条件注解是筛选的关键：`@ConditionalOnClass`（类路径有某类才生效）、`@ConditionalOnMissingBean`（用户没自定义才生效——这就是\"默认配置永远让位给你的配置\"）、`@ConditionalOnProperty`（配置项满足才生效）。\n\n**自定义 starter 思路**：建两个模块 `xxx-autoconfigure`（写自动配置类 + 条件注解）和 `xxx-starter`（只做依赖聚合），并在 autoconfigure 模块的 `AutoConfiguration.imports` 文件里登记配置类。面试能说出这两个模块的分工即可。\n\n### 3. 配置体系 ⭐\n\n> 面试官想听：@ConfigurationProperties 与 @Value 怎么选，以及配置优先级。\n\n```yaml\n# application.yml：冒号后必须有空格，缩进两个空格\nserver:\n  port: 8080\nspring:\n  profiles:\n    active: dev          # 激活 dev 环境\napp:\n  todo:\n    cache-ttl: 10m\n    key-prefix: \"todo:\"\n```\n\n多环境：`application-dev.yml`、`application-prod.yml`、`application-test.yml`，由 `spring.profiles.active` 决定加载哪套；启动时可覆盖：`java -jar app.jar --spring.profiles.active=prod`。\n\n两种读取方式：\n\n```java\n// 批量绑定：前缀下的配置映射成对象，类型安全、可加校验（推荐）\n@Component\n@ConfigurationProperties(prefix = \"app.todo\")\n@Data\npublic class TodoProperties {\n    private Duration cacheTtl;\n    private String keyPrefix;\n}\n\n// 单个读取：适合零散配置，支持 SpEL（@Value(\"#{...}\")）\n@Value(\"${server.port}\")\nprivate int port;\n```\n\n配置优先级（高 → 低）：命令行参数 > Java 系统属性 > 操作系统环境变量 > `application-{profile}.yml` > `application.yml`。一句话：越\"外部、越具体\"的越优先，便于部署时用环境变量覆盖。\n\n### 4. Web 实战规范 ⭐\n\n> 面试官想听：统一返回体 + 全局异常 + 参数校验是一套组合拳，体现工程规范意识。\n\n**RESTful 风格**：URL 表示资源（名词复数），HTTP 方法表示动作，状态码表达结果——`GET /api/todos` 列表、`POST /api/todos` 创建、`PUT /api/todos/1` 更新、`DELETE /api/todos/1` 删除。\n\n**统一返回体**：\n\n```java\n@Data\npublic class Result<T> {\n    private int code;        // 业务码：200 成功，4xx 客户端问题，5xx 服务端问题\n    private String message;\n    private T data;\n\n    public static <T> Result<T> ok(T data) { return build(200, \"success\", data); }\n    public static <T> Result<T> fail(int code, String message) { return build(code, message, null); }\n}\n```\n\n**全局异常处理**：\n\n```java\n@RestControllerAdvice\npublic class GlobalExceptionHandler {\n\n    @ExceptionHandler(MethodArgumentNotValidException.class)   // 参数校验失败\n    public Result<Void> handleValid(MethodArgumentNotValidException e) {\n        String msg = e.getBindingResult().getFieldErrors().stream()\n                .map(f -> f.getField() + \": \" + f.getDefaultMessage())\n                .collect(Collectors.joining(\"; \"));\n        return Result.fail(400, msg);\n    }\n\n    @ExceptionHandler(BusinessException.class)                 // 业务异常：返回明确提示\n    public Result<Void> handleBiz(BusinessException e) {\n        return Result.fail(e.getCode(), e.getMessage());\n    }\n\n    @ExceptionHandler(Exception.class)                         // 兜底：不暴露堆栈给前端\n    public Result<Void> handleOther(Exception e) {\n        log.error(\"unexpected error\", e);\n        return Result.fail(500, \"系统繁忙，请稍后重试\");\n    }\n}\n```\n\n**参数校验**：引入 `spring-boot-starter-validation`，实体上打约束注解，Controller 参数前加 `@Valid`，失败异常由上面的全局处理器接住：\n\n```java\npublic record TodoCreateRequest(\n        @NotBlank(message = \"标题不能为空\")\n        @Size(max = 50, message = \"标题最长 50 字\") String title,\n        @Size(max = 500) String content) {}\n\n@PostMapping(\"/api/todos\")\npublic Result<TodoVO> create(@Valid @RequestBody TodoCreateRequest req) {\n    return Result.ok(todoService.create(req));\n}\n```\n\n**日志**：门面 slf4j + 实现 Logback（Boot 默认），用 Lombok 的 `@Slf4j` 注入 logger；级别 `TRACE < DEBUG < INFO < WARN < ERROR`，生产默认 INFO；配置输出格式与滚动策略，禁止 `System.out.println`（不走级别控制、无上下文、影响性能）。\n\n### 5. 整合与部署\n\n- **MyBatis-Plus**：引入 starter + 驱动，yml 配数据源，`@MapperScan` 扫 Mapper 包，继承 `BaseMapper` 即得 CRUD（下一篇专讲）。\n- **Redis**：引入 `spring-boot-starter-data-redis`；默认 `RedisTemplate` 用 JDK 序列化（乱码且跨语言差），推荐 `StringRedisTemplate` + 手动 JSON 序列化，或自定义 key/value 序列化器。\n- **Actuator**：`/actuator/health` 健康检查、`/actuator/info`、`/actuator/metrics`，是接监控体系（Prometheus）的基础，生产注意暴露范围。\n- **打包部署**：`mvn clean package` 打出可执行 fat jar（内嵌 Tomcat），`java -jar xxx.jar --spring.profiles.active=prod` 直接运行；Docker 部署本质就是把 jar 拷进镜像用 `java -jar` 启动。\n\n## 🛠 动手实践（本指南第一个完整项目）\n\n### 任务 ⭐：todo-list REST API（3 天，贯穿本篇所有知识点）\n\n**第 1 步：建库建表**\n\n```sql\nCREATE DATABASE todo_db DEFAULT CHARSET utf8mb4;\nUSE todo_db;\nCREATE TABLE todo (\n  id         BIGINT PRIMARY KEY AUTO_INCREMENT,\n  title      VARCHAR(50)  NOT NULL,\n  content    VARCHAR(500),\n  done       TINYINT      NOT NULL DEFAULT 0 COMMENT '0未完成 1完成',\n  created_at DATETIME     NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  updated_at DATETIME     NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP\n);\n```\n\n**第 2 步：工程骨架**——`spring-boot-starter-web` + `spring-boot-starter-validation` + 数据库/持久层 + Redis 依赖；`application-dev.yml`（本地数据库）与 `application-prod.yml`（改端口 8081、日志级别 WARN）双环境。\n\n**第 3 步：实现接口**——实体 Todo、Mapper、Service、Controller 四层；接口清单：\n\n| 方法 | 路径 | 说明 |\n| --- | --- | --- |\n| GET | /api/todos?done=false&page=1&size=10 | 分页条件查询 |\n| GET | /api/todos/{id} | 详情（走 Redis 缓存） |\n| POST | /api/todos | 新增，@Valid 校验 |\n| PUT | /api/todos/{id} | 更新 |\n| DELETE | /api/todos/{id} | 删除 |\n\n**第 4 步：横切能力**——`Result<T>` 统一返回、`GlobalExceptionHandler` 三段式异常处理、`BusinessException`（如 id 不存在抛 404）、`@Slf4j` 记录入参出参。\n\n**第 5 步：Redis 缓存查询结果**：\n\n```java\npublic TodoVO getById(Long id) {\n    String key = todoProperties.getKeyPrefix() + id;\n    String cached = stringRedisTemplate.opsForValue().get(key);\n    if (cached != null) return objectMapper.readValue(cached, TodoVO.class);\n    TodoVO vo = todoMapper.selectById(id);\n    if (vo == null) throw new BusinessException(404, \"待办不存在\");\n    stringRedisTemplate.opsForValue().set(key, objectMapper.writeValueAsString(vo),\n                                          todoProperties.getCacheTtl());\n    return vo;\n}\n```\n\n注意：新增/更新/删除后删除对应缓存 key（先更新库，再删缓存）。\n\n**验收标准清单（全部满足才算完成）**：\n\n- [ ] 10 个验收点逐一自测：POST 缺标题返回 400 + 统一错误体，正常创建返回 `code=200` 与 data。\n- [ ] GET 单个：首次查库、二次命中 Redis（日志可见），更新后缓存被删、再次查询回源。\n- [ ] 查询不存在的 id 返回业务码 404 而不是 500。\n- [ ] 分页接口 page/size/done 条件生效。\n- [ ] DELETE 后 GET 返回 404。\n- [ ] 手动抛 RuntimeException 能被全局异常兜底为统一 500 体，控制台有堆栈。\n- [ ] `--spring.profiles.active=prod` 启动后端口变为 8081。\n- [ ] `mvn clean package` 打出 fat jar，`java -jar` 运行功能不缩水。\n- [ ] `/actuator/health` 返回 `{\"status\":\"UP\"}`。\n- [ ] 代码分层清晰：Controller 只做参数处理，业务在 Service。\n\n## 💼 高频面试题\n\n**Q：Spring Boot 自动配置的原理？**\n- @EnableAutoConfiguration 通过 AutoConfigurationImportSelector 读取各 jar 的 `META-INF/spring/...AutoConfiguration.imports` 文件（2.7 前是 spring.factories），拿到全部候选配置类。\n- 再用条件注解过滤：@ConditionalOnClass 类存在、@ConditionalOnMissingBean 用户没自定义、@ConditionalOnProperty 配置满足。\n- 结论：框架给默认值，用户一旦配置/自定义 Bean 就让位——这就是约定优于配置的实现方式。\n\n**Q：@SpringBootApplication 由哪些注解组成？**\n- @SpringBootConfiguration：本质是 @Configuration，标记主类为配置类。\n- @EnableAutoConfiguration：开启自动配置。\n- @ComponentScan：扫描主类所在包及子包，所以主类要放最外层。\n\n**Q：什么是 starter？如何自定义？**\n- starter = 按功能聚合的依赖集合 + 对应自动配置，引入即用，版本由 parent 统一管理。\n- 自定义：xxx-autoconfigure 模块写自动配置类（加条件注解）并在 AutoConfiguration.imports 登记；xxx-starter 模块聚合依赖。\n- 使用方引入 xxx-starter，配置对应属性即可生效。\n\n**Q：@ConfigurationProperties 和 @Value 怎么选？**\n- @ConfigurationProperties 按前缀批量绑定成对象，类型安全、支持 JSR303 校验、支持松散绑定（cache-ttl → cacheTtl），适合一组相关配置。\n- @Value 单个注入，支持 SpEL，适合零散的简单值。\n- 都能获取配置，但 @Value 不支持复杂对象绑定与校验。\n\n**Q：Spring Boot 的启动流程大概是什么样的？**\n- new SpringApplication()：推断应用类型（Servlet/Reactive）、加载 Initializer 与 Listener。\n- run()：准备 Environment（加载配置）→ 创建 ApplicationContext → prepareContext 加载主类 → **refresh()（核心：解析自动配置、注册 Bean）** → 回调 CommandLineRunner/ApplicationRunner。\n- 一句话：启动 = 准备环境 → 创建并刷新容器（自动配置在这里生效）→ 执行 Runner。\n\n**Q：全局异常处理怎么实现？**\n- @RestControllerAdvice + @ExceptionHandler 捕获 Controller 层抛出的异常。\n- 细分处理：参数校验异常返回 400、业务异常 BusinessException 返回业务码、Exception 兜底返回 500 并记录日志。\n- 配合统一返回体，前端拿到的永远是 `{code, message, data}` 结构。\n\n**Q：为什么推荐 slf4j + Logback？**\n- slf4j 是门面（API 抽象），Logback 是实现，门面与实现分离，换实现不改业务代码。\n- 有级别控制、异步输出、滚动归档等生产必备能力；System.out 都不具备且不可控。\n\n## 🔗 推荐资料\n\n| 资料 | 说明 | 链接 |\n| --- | --- | --- |\n| 廖雪峰 Spring Boot 教程 | 从 Hello World 到完整的开发流程 | https://liaoxuefeng.com/books/java/springboot/index.html |\n| JavaGuide Spring 常见问题总结 | 含 Spring Boot 面试高频题 | https://javaguide.cn/system-design/framework/spring/spring-knowledge-and-questions-summary.html |\n| pdai Spring 知识体系 | 含 Spring Boot 核心机制章节 | https://pdai.tech/md/spring/spring.html |\n| 廖雪峰 Maven 教程 | 打包、依赖管理，部署实践的基础 | https://liaoxuefeng.com/books/java/maven/index.html |\n","ck":10},{"id":"f17","stage":4,"path":"04-框架篇/03-MyBatis.md","title":"MyBatis","md":"# MyBatis\n\n> **阶段**：框架篇 ｜ **建议时长**：4 天 ｜ **前置**：02-SpringBoot实战.md（及数据库篇）\n\n## 🎯 学习目标\n\n- 能说清 #{} 与 ${} 的本质区别，以及什么场景才允许用 ${}。\n- 能熟练使用 if/where/choose/set/foreach 编写动态 SQL，并用 resultMap 完成一对多映射。\n- 能讲出一二级缓存的作用域与\"二级缓存为什么生产慎用\"。\n- 能给现有项目接入 MyBatis-Plus：BaseMapper、Wrapper、分页、自动填充、逻辑删除、乐观锁。\n- 能解释\"Mapper 接口没有实现类为什么能执行\"（动态代理原理）。\n\n## 📖 核心知识点\n\n### 1. 定位与核心组件\n\n> MyBatis 是半自动 ORM：SQL 自己写（可控、可优化），参数与结果映射自动做（省样板代码）。\n\n核心组件四件套：`SqlSessionFactoryBuilder`（读配置建工厂）→ `SqlSessionFactory`（重量级，全局一份）→ `SqlSession`（轻量，一次会话）→ **Mapper 接口 + XML**（真正的业务入口）。Spring Boot 整合后前三者被容器托管，你只面对 Mapper。\n\nSpring Boot 接入（Boot 3.x 用 `mybatis-plus-spring-boot3-starter`，2.7 用 `mybatis-plus-boot-starter`；裸 MyBatis 用 `mybatis-spring-boot-starter`）：\n\n```yaml\n# application.yml\nspring:\n  datasource:\n    url: jdbc:mysql://localhost:3306/todo_db?useSSL=false&serverTimezone=Asia/Shanghai\n    username: root\n    password: root123\nmybatis-plus:\n  configuration:\n    map-underscore-to-camel-case: true   # created_at → createdAt 自动驼峰映射；设为 false 会导致这类字段静默为 null\n  global-config:\n    db-config:\n      id-type: auto                      # 主键用数据库自增\nlogging:\n  level:\n    com.example.demo.mapper: debug       # 打印 SQL，调试必备\n```\n\n```java\n@SpringBootApplication\n@MapperScan(\"com.example.demo.mapper\")   // 扫描 Mapper 接口\npublic class DemoApplication { ... }\n```\n\n### 2. CRUD 与 #{}/${} ⭐\n\n> 面试官想听：#{} 预编译防注入、${} 拼接有风险，必须说出\"什么情况下才用 ${}\"。\n\n```xml\n<select id=\"getById\" resultType=\"Todo\">        <!-- #{} → 占位符 ? -->\n  SELECT * FROM todo WHERE id = #{id}\n<\/select>\n<insert id=\"insert\" useGeneratedKeys=\"true\" keyProperty=\"id\">  <!-- 主键回填到实体 -->\n  INSERT INTO todo (title, content) VALUES (#{title}, #{content})\n<\/insert>\n```\n\n- **#{})**：预编译占位符，`#{id}` 变成 `?`，值由 PreparedStatement 安全设置，**防 SQL 注入**，绝大多数场景用它。\n- **${}**：字符串直接替换进 SQL，有注入风险。只用于表名、列名、`ORDER BY` 字段这类\"不能加引号\"的动态部位，且必须用白名单校验：\n\n```java\nprivate static final Set<String> SORTABLE = Set.of(\"created_at\", \"title\");  // 白名单\n// if (!SORTABLE.contains(sortField)) throw new IllegalArgumentException();\n```\n\n### 3. 动态 SQL ⭐\n\n> 面试官想听：写过多条件查询就一定用过这些标签，each 标签说得出解决什么问题。\n\n```xml\n<select id=\"search\" resultType=\"Todo\">\n  SELECT * FROM todo\n  <where>                                          <!-- where 标签：自动去掉开头多余的 AND/OR -->\n    <if test=\"done != null\">AND done = #{done}<\/if>\n    <if test=\"keyword != null and keyword != ''\">\n      AND title LIKE CONCAT('%', #{keyword}, '%')\n    <\/if>\n    <choose>                                       <!-- choose/when/otherwise = if/else if/else -->\n      <when test=\"orderBy == 'time'\">ORDER BY created_at DESC<\/when>\n      <otherwise>ORDER BY id DESC<\/otherwise>\n    <\/choose>\n  <\/where>\n<\/select>\n\n<update id=\"updateTodo\">                           <!-- set 标签：自动去掉末尾多余的逗号 -->\n  UPDATE todo\n  <set>\n    <if test=\"title != null\">title = #{title},<\/if>\n    <if test=\"content != null\">content = #{content},<\/if>\n    <if test=\"done != null\">done = #{done},<\/if>\n  <\/set>\n  WHERE id = #{id}\n<\/update>\n\n<insert id=\"batchInsert\">                          <!-- foreach：in 查询 / 批量插入 -->\n  INSERT INTO todo (title, content) VALUES\n  <foreach collection=\"list\" item=\"t\" separator=\",\">\n    (#{t.title}, #{t.content})\n  <\/foreach>\n<\/insert>\n```\n\n记忆口诀：`if` 条件拼接、`where` 去头、`set` 去尾、`choose` 分支、`foreach` 循环。\n\n### 4. resultMap 与关联映射\n\n自动映射搞不定\"一对多/一对一\"和列名对不上时用 `resultMap`：\n\n```xml\n<resultMap id=\"studentWithScores\" type=\"Student\">\n  <id property=\"id\" column=\"id\"/>\n  <result property=\"name\" column=\"name\"/>\n  <collection property=\"scores\" ofType=\"Score\">     <!-- 一对多；一对一用 association -->\n    <id property=\"id\" column=\"score_id\"/>\n    <result property=\"courseName\" column=\"course_name\"/>\n    <result property=\"value\" column=\"value\"/>\n  <\/collection>\n<\/resultMap>\n\n<select id=\"getStudentWithScores\" resultMap=\"studentWithScores\">\n  SELECT s.id, s.name, sc.id AS score_id, c.name AS course_name, sc.value\n  FROM student s\n  LEFT JOIN score sc ON sc.student_id = s.id\n  LEFT JOIN course c ON c.id = sc.course_id\n  WHERE s.id = #{id}\n<\/select>\n```\n\n联表一次查出（结果集映射）适合少量数据；分步查询（先查学生再按 id 查成绩）适合懒加载，但要警惕 **N+1 问题**：查 1 次列表又对每行发 1 次子查询。原则：列表页用联表，详情页可分步。\n\n### 5. 缓存与批量操作 ⭐\n\n> 面试官想听：一级二级缓存的作用域差别，以及\"为什么二级缓存生产慎用\"。\n\n- **一级缓存**：SqlSession 级别，默认开启。同一 SqlSession 内相同查询直接命中；任何增删改都会清空。Spring 整合后每次请求通常是新 SqlSession，所以平时感觉不到它的存在（同一事务内有效）。\n- **二级缓存**：namespace（Mapper）级别，需手动开启（`<cache/>`），跨 SqlSession 共享。慎用原因：多表关联时任一表更新，其他 Mapper 的缓存感知不到，容易读到脏数据；分布式部署下多节点缓存不同步。生产一般不开启，统一用 Redis 做缓存。\n- **PageHelper 分页**：`PageHelper.startPage(page, size)` 用 ThreadLocal 携带分页参数，拦截下一条 SQL 自动拼 `LIMIT`，物理分页：\n\n```java\nPageHelper.startPage(1, 10);\nList<Todo> list = todoMapper.search(keyword, done);\nPageInfo<Todo> page = new PageInfo<>(list);   // total、pages 等分页信息\n```\n\n注意 startPage 和查询必须紧挨着，且不要 try 包裹后中途 return。\n\n- **批量操作**：小批量用 `foreach` 拼多值 INSERT；大批量（万级）用 `ExecutorType.BATCH` 的 SqlSession 分批 flush，避免 SQL 过长与超参数上限。\n\n### 6. MyBatis-Plus ⭐\n\n> 面试官想听：MP 解决\"单表 CRUD 重复劳动\"，但复杂 SQL 仍要手写——知道边界比背 API 重要。\n\n```java\n@TableName(\"todo\")\npublic class Todo {\n    @TableId(type = IdType.AUTO)\n    private Long id;\n    private String title;\n    private String content;\n    private Boolean done;\n    @TableField(fill = FieldFill.INSERT)\n    private LocalDateTime createdAt;\n    @TableLogic                                    // 逻辑删除：delete 变 UPDATE deleted=1\n    private Integer deleted;\n    @Version                                       // 乐观锁版本号\n    private Integer version;\n}\n\npublic interface TodoMapper extends BaseMapper<Todo> {}   // 继承即得 CRUD\n\n// 条件构造器：动态条件不用再写 XML\nLambdaQueryWrapper<Todo> qw = new LambdaQueryWrapper<>();\nqw.eq(Todo::getDone, false)\n  .like(StringUtils.hasText(keyword), Todo::getTitle, keyword)   // 条件为 true 才拼接\n  .orderByDesc(Todo::getCreatedAt);\nList<Todo> list = todoMapper.selectList(qw);\n\n// 分页插件：物理分页\nPage<Todo> page = todoMapper.selectPage(new Page<>(1, 10), qw);\n```\n\n三个内置插件一次配齐：\n\n```java\n@Bean\npublic MybatisPlusInterceptor mybatisPlusInterceptor() {\n    MybatisPlusInterceptor interceptor = new MybatisPlusInterceptor();\n    interceptor.addInnerInterceptor(new PaginationInnerInterceptor(DbType.MYSQL)); // 分页\n    interceptor.addInnerInterceptor(new OptimisticLockerInnerInterceptor());       // 乐观锁\n    return interceptor;\n}\n\n@Component\npublic class FillHandler implements MetaObjectHandler {     // 自动填充 created_at 等\n    @Override\n    public void insertFill(MetaObject metaObject) {\n        strictInsertFill(metaObject, \"createdAt\", LocalDateTime.class, LocalDateTime.now());\n    }\n    @Override\n    public void updateFill(MetaObject metaObject) {\n        strictUpdateFill(metaObject, \"updatedAt\", LocalDateTime.class, LocalDateTime.now());\n    }\n}\n```\n\nService 层用 `IService<Todo>` / `ServiceImpl<TodoMapper, Todo>`，自带 `saveBatch`、`getById`、`page` 等封装。\n\n### 7. 原理与选型 ⭐\n\n> 面试官想听：Mapper 接口原理是 MyBatis 最高频的原理题，答对关键在\"JDK 动态代理 + 全限定名定位 SQL\"。\n\n```text\n@MapperScan 扫描接口 → 每个接口注册为 MapperFactoryBean\n调用接口方法 → JDK 动态代理 MapperProxy 拦截\n→ 用 接口全限定名.方法名 定位 MappedStatement（XML 里 <select id=\"...\"> 对应一条）\n→ SqlSession 执行 JDBC → 结果按映射规则转成对象\n```\n\n所以接口无需实现类：**代理对象的 invoke 逻辑就是\"方法签名 → SQL 语句 → 执行 → 映射\"**，id 的对应关系由\"namespace 必须等于接口全限定名\"保证。\n\n**MyBatis vs JPA/Hibernate**：MyBatis SQL 可控、好优化、上手快，但每个查询要自己写；JPA 全自动 CRUD、移植性好，但复杂查询/优化受限。国内互联网主流 MyBatis(-Plus)（业务 SQL 复杂、重性能），海外及简单业务系统 JPA 居多——回答时给出\"按场景选型\"的结论。\n\n## 🛠 动手实践\n\n### 任务 1：给 todo-list 项目接入 MyBatis-Plus（1.5 小时）\n\n替换 SpringBoot 实战篇项目中的持久层实现（保留 Controller/Service 接口不变，体现分层价值）。\n验收：`TodoMapper extends BaseMapper<Todo>` 完成 5 个接口的 CRUD；`LambdaQueryWrapper` 实现按 done + 关键字筛选；打开 SQL 日志能看到执行的语句。\n\n### 任务 2：动态 SQL 多条件分页查询（2 小时）\n\nXML 写法：`search` 语句支持 keyword（模糊）、done（等值）、时间范围（`&gt;=` 用 `<![CDATA[ ]]>` 或转义），配合 PageHelper 分页。\n验收：四种参数组合（全空/只有 keyword/只有 done/全有）生成的 SQL 各不相同且正确；PageInfo 的 total 与实际数据条数一致。\n\n### 任务 3：MP 三件套生效验证（1.5 小时）\n\n开启分页、自动填充、逻辑删除、乐观锁插件（见第 6 节代码），逐个验证。\n验收：分页 SQL 出现 `LIMIT`；insert 自动写入 createdAt；delete 后表里数据还在（`deleted=1`），查询默认过滤已删数据；两个会话并发更新同一条数据，version 冲突时后提交的影响行数为 0，业务代码能感知并重试。\n\n## 💼 高频面试题\n\n**Q：#{} 和 ${} 的区别？**\n- #{} 预编译占位符，编译成 `?` 由 PreparedStatement 设值，防 SQL 注入，默认用它。\n- ${} 字符串拼接，直接替换进 SQL，有注入风险。\n- ${} 只用于动态表名/列名/排序字段等不能加引号的位置，且必须白名单校验。\n\n**Q：MyBatis 的一级、二级缓存？为什么二级慎用？**\n- 一级缓存 SqlSession 级默认开启，会话内相同查询命中，增删改清空；Spring 下每次请求新会话，基本感知不到。\n- 二级缓存 namespace 级，跨会话共享，需手动开启。\n- 慎用原因：多表关联更新时其他 Mapper 感知不到，易脏读；分布式部署多节点不同步。生产一般用 Redis 替代。\n\n**Q：Mapper 接口没有实现类，为什么能执行 SQL？**\n- MyBatis 用 JDK 动态代理为接口生成 MapperProxy 代理对象。\n- 调用方法时用\"接口全限定名.方法名\"匹配 XML 里的 MappedStatement（namespace = 接口全限定名，id = 方法名）。\n- 代理的 invoke 里走 SqlSession 执行 JDBC 并做结果映射，所以不需要手写实现类。\n\n**Q：动态 SQL 有哪些标签？**\n- if 条件拼接；where 自动去掉开头 AND/OR；set 自动去掉末尾逗号。\n- choose/when/otherwise 实现多分支；foreach 处理集合（in、批量插入）。\n- trim 可自定义前后缀的增删，是 where/set 的底层实现——`<set>` 实际就是 `trim(prefix=\"SET\", suffixOverrides=\",\")` 的语法糖，自动去掉末尾多余的逗号，所以所有 `<if>` 都不命中时它还会生成空的 SET 子句（要防这种全空更新，应在 Service 层先校验）。\n\n**Q：MyBatis 和 JPA/Hibernate 怎么选？**\n- MyBatis 半自动：SQL 自己写，可控、易优化，适合复杂查询、报表、互联网业务。\n- JPA 全自动：CRUD 零 SQL、开发效率高，但复杂查询难调优。\n- 国内主流 MyBatis-Plus：单表交给 MP，复杂 SQL 回到 XML 手写。\n\n**Q：什么是 N+1 问题？怎么避免？**\n- 查 1 次主列表后，对每行记录再发 1 次子查询，1 次变 N+1 次，性能崩塌。\n- 避免列表页用联表一次查出（resultMap collection/association）。\n- 分步查询仅在详情页或确有懒加载需求时使用，并控制列表行数。\n\n**Q：PageHelper 分页的原理？**\n- PageHelper.startPage 把分页参数放进 ThreadLocal。\n- 拦截器拦截紧跟其后的第一条查询，改写 SQL 追加 LIMIT，并额外发 COUNT 语句求总数。\n- 注意 startPage 与查询必须紧邻，防止 ThreadLocal 残留误伤其他 SQL。\n\n## 🔗 推荐资料\n\n| 资料 | 说明 | 链接 |\n| --- | --- | --- |\n| JavaGuide MyBatis 面试题 | 本篇高频题的标准答案库 | https://javaguide.cn/system-design/framework/mybatis/mybatis-interview.html |\n| JavaGuide SQL 语句面试题 | 动态 SQL 要解决的查询场景练手 | https://javaguide.cn/database/sql/sql-questions-01.html |\n| JavaGuide MySQL 面试题 | SQL 层面试题与 MyBatis 面试题互补 | https://javaguide.cn/database/mysql/mysql-questions-01.html |\n| 廖雪峰 Spring Boot 教程 | 整合数据访问与工程组织的上下文 | https://liaoxuefeng.com/books/java/springboot/index.html |\n","ck":0},{"id":"f18","stage":4,"path":"04-框架篇/04-SpringCloud微服务.md","title":"SpringCloud微服务","md":"# SpringCloud微服务\n\n> **阶段**：框架篇 ｜ **建议时长**：6 天 ｜ **前置**：02-SpringBoot实战.md\n\n## 🎯 学习目标\n\n- 能说出微服务拆分的时机与代价，并画出微服务技术栈全景图。\n- 能讲清 Nacos 注册中心的注册/心跳/发现机制，并实现配置中心热更新。\n- 能用 OpenFeign 完成服务间声明式调用，并配置超时、重试与日志。\n- 能用 Gateway 统一入口并写一个全局鉴权过滤器，能用 Sentinel 配置限流与熔断降级。\n- 能独立完成 order/product 双服务实战，通过全部验收标准。\n\n## 📖 核心知识点\n\n### 1. 单体 → 微服务 ⭐\n\n> 面试官想听：不是背\"微服务好\"，而是能说出\"什么时候该拆、拆了要付出什么\"。\n\n- 拆分收益：模块独立部署发布（互不拖累）、故障隔离（一个服务挂不拖垮全站）、按服务伸缩（订单服务单独扩容）、团队并行开发、技术栈可选。\n- 拆分代价：分布式复杂性全部入场——网络调用不可靠、数据一致性变难、链路排查复杂、运维成本翻倍。\n- 拆分时机：团队规模大了需要并行；模块间发布节奏冲突严重；不同模块负载差异大需要独立伸缩。**早期单体能扛就先单体**，拆分是演进不是起点。\n- 组件全景（每个角色解决一个分布式问题）：\n\n```text\n注册发现：服务上下线感知（Nacos）\n配置中心：配置集中管理与热更新（Nacos）\n远程调用：跨服务 HTTP 调用（OpenFeign）+ 负载均衡（LoadBalancer）\nAPI 网关：统一入口、鉴权、路由、限流（Gateway）\n熔断限流：保护服务不被打垮（Sentinel）\n链路追踪：一次请求跨多个服务，怎么串起来（SkyWalking）\n分布式事务：跨库写一致性（Seata，衔接分布式篇）\n```\n\n### 2. 技术栈现状 ⭐\n\n> 面试官想听：知道行业从 Netflix 迁移到 Spring Cloud Alibaba 的现状，版本对应能说一句即可。\n\n- **Netflix 全家桶**（Eureka 注册、Ribbon 负载均衡、Hystrix 熔断、Zuul 网关）2018 年起陆续停止更新、进入维护模式，新项目不用。\n- **国内主流组合**：Spring Cloud Alibaba（Nacos + Sentinel + Seata）+ Spring Cloud 官方（Gateway + OpenFeign + LoadBalancer）。\n- 版本对应一句话：**Spring Cloud Alibaba 2022.x ↔ Spring Cloud 2022.x ↔ Spring Boot 3.0.x，Nacos 用 2.x**——三者版本必须配套，官方对照表查一下再用。\n\n### 3. Nacos：注册中心 + 配置中心 ⭐\n\n> 面试官想听：服务怎么注册、怎么知道对方还活着、配置怎么热更新，三问连环。\n\n**注册中心原理**：\n\n```text\n服务注册：服务启动时把 实例名/IP/端口 上报到 Nacos\n心跳检测：临时实例默认每 5s 发一次心跳（Nacos 2.x 临时实例走 gRPC 长连接，机制等价）\n          15s 未心跳标记为不健康，30s 未心跳剔除实例\n服务发现：消费者从 Nacos 拉取实例列表并订阅，实例变更时推送更新\n```\n\n注册中心解决的是\"服务地址动态变化\"：扩缩容、重启后 IP 变了，调用方无需改配置。\n\n**配置中心 + 热更新**：配置集中存到 Nacos，改完不用重启即生效——`@Value` 所在类加 `@RefreshScope`，或用 `@ConfigurationProperties` 绑定（原生支持刷新）：\n\n```java\n@RestController\n@RefreshScope\npublic class ConfigController {\n    @Value(\"${app.welcome:hello}\")\n    private String welcome;      // Nacos 控制台改值发布后，这里立即读到新值\n}\n```\n\n**namespace 与 group**：namespace 隔离环境（dev/test/prod 各一个），group 隔离项目/模块；配置按 `dataId + group + namespace` 三元组定位。\n\n### 4. OpenFeign：声明式远程调用 ⭐\n\n> 面试官想听：Feign 的原理一句话（接口 + 动态代理 → HTTP 请求），以及超时重试的幂等意识。\n\n```java\n@FeignClient(name = \"product-service\")      // 服务名，走注册中心寻址\npublic interface ProductClient {\n    @GetMapping(\"/api/products/{id}\")\n    ProductVO getById(@PathVariable(\"id\") Long id);\n}\n\n// 注入即用，像调用本地方法一样发 HTTP 请求\n@Service\n@RequiredArgsConstructor\npublic class OrderService {\n    private final ProductClient productClient;\n\n    public OrderVO create(Long productId) {\n        ProductVO product = productClient.getById(productId);  // 远程调用\n        return orderAssembler.assemble(product);\n    }\n}\n```\n\n要点：\n\n- 原理：接口方法 → 动态代理 → 组装 HTTP 请求 → 经 LoadBalancer 从实例列表选一台发出 → 解码响应。`lb://` 前缀即\"负载均衡寻址\"。\n- **超时**：默认偏保守，必须显式配置 `connectTimeout` / `readTimeout`，防止下游慢调用拖垮自己。\n- **重试**：`Retryer` 可配次数与间隔；只对幂等操作（查询）开重试，下单、扣款这类非幂等操作重试会造成重复下单。\n- **日志**：`Logger.Level.BASIC/FULL` + `logging.level.<client包>=debug`，排查联调问题的第一手段。\n\n### 5. Gateway：统一入口 ⭐\n\n> 面试官想听：网关三大概念 + 全局过滤器做鉴权的思路。\n\n网关作用：统一入口、路由转发、统一鉴权、限流、跨域处理——让鉴权这类横切逻辑只做一次，不用每个服务重复实现。\n\n三大概念：**Route**（一条路由 = 目标 URI + 断言 + 过滤器）、**Predicate**（断言：Path/Method/Query/Header 等匹配条件）、**Filter**（请求/响应的加工处理）。\n\n```yaml\nspring:\n  cloud:\n    gateway:\n      routes:\n        - id: order-route\n          uri: lb://order-service          # lb = 从注册中心负载均衡\n          predicates:\n            - Path=/api/orders/**\n        - id: product-route\n          uri: lb://product-service\n          predicates:\n            - Path=/api/products/**\n```\n\n**全局过滤器鉴权**：\n\n```java\n@Component\npublic class AuthGlobalFilter implements GlobalFilter, Ordered {\n    private static final Set<String> WHITE_LIST = Set.of(\"/api/auth/login\", \"/api/auth/register\");\n\n    @Override\n    public Mono<Void> filter(ServerWebExchange exchange, GatewayFilterChain chain) {\n        String path = exchange.getRequest().getPath().value();\n        if (WHITE_LIST.stream().anyMatch(path::startsWith)) return chain.filter(exchange);\n        String token = exchange.getRequest().getHeaders().getFirst(\"Authorization\");\n        if (!StringUtils.hasText(token)) {                        // 未登录直接拦截\n            exchange.getResponse().setStatusCode(HttpStatus.UNAUTHORIZED);\n            return exchange.getResponse().setComplete();\n        }\n        // 校验 token，把用户信息透传给下游服务（放 header）\n        return chain.filter(exchange);\n    }\n    @Override\n    public int getOrder() { return -1; }                          // 数值越小越先执行\n}\n```\n\n### 6. Sentinel：限流与熔断降级 ⭐\n\n> 面试官想听：限流/熔断/降级三者区别，这是微服务稳定性面试的核心题。\n\n- **限流**：请求量超阈值直接拒绝，保护自己（如 QPS 限 100）。规则维度：QPS / 并发线程数；流控效果：快速失败、Warm Up（预热爬升）、排队等待。\n- **熔断**：下游大量超时/异常时\"跳闸\"，一段时间内不再调用下游，直接走兜底，防止线程池被拖垮引发**服务雪崩**（一个服务慢 → 上游线程全堵住 → 连锁崩溃）。熔断器状态：关闭 → 打开 → 半开（放几个探测请求，成功则恢复）。\n- **降级**：被限流/熔断/异常时的兜底方案：返回缓存旧值、默认值、空列表等\"有损但可用\"的结果。\n- 雪崩应对三板斧：超时、限流、熔断降级。\n\n```java\n@GetMapping(\"/{id}\")\n@SentinelResource(value = \"getProduct\",\n                  blockHandler = \"getProductBlock\",    // 处理限流/熔断触发\n                  fallback = \"getProductFallback\")     // 处理业务异常\npublic ProductVO getProduct(@PathVariable Long id) {\n    return productService.getById(id);\n}\n\npublic ProductVO getProductBlock(Long id, BlockException ex) {\n    return ProductVO.defaultFallback();    // 限流/熔断时的兜底\n}\n```\n\n规则可在 Sentinel Dashboard（控制台）配置，默认内存态、重启丢失，生产要接 Nacos 做规则持久化——这是加分项。\n\n### 7. 可观测与一致性（概念铺垫）\n\n- **链路追踪**：一次请求经过网关→订单→商品多个服务，SkyWalking 用 TraceId 把整条调用链串起来，可视化展示每段耗时、定位慢点和报错点；特点是基于字节码增强、业务代码零侵入。一句话了解即可，中间件篇/分布式篇展开。\n- **Seata**：分布式事务框架，AT 模式最常用——一阶段自动记录数据快照生成 undo_log，二阶段成功则删日志、失败则用快照反向补偿回滚。此处只需知道\"跨服务跨库的写操作需要它\"，详细机制在分布式篇。\n\n## 🛠 动手实践\n\n### 任务 ⭐：order/product 双服务微服务链路（4 天）\n\n**第 1 步：起环境**——Docker 启动 Nacos（standalone）：\n\n```bash\ndocker run -d --name nacos -e MODE=standalone \\\n  -p 8848:8848 -p 9848:9848 nacos/nacos-server:v2.2.3\n```\n\n**第 2 步：两个 Spring Boot 服务**——`product-service`（商品查询/列表）与 `order-service`（下单，需要查商品）。依赖版本配套：Spring Boot 3.0.x + spring-cloud 2022.0.x + spring-cloud-alibaba 2022.0.0.x，依赖 `spring-cloud-starter-alibaba-nacos-discovery`、`spring-cloud-starter-openfeign`、`spring-cloud-starter-loadbalancer`。yml 关键配置：\n\n```yaml\nspring:\n  application:\n    name: product-service          # 服务名即注册名，消费方按它寻址\n  cloud:\n    nacos:\n      server-addr: localhost:8848\n```\n\n**第 3 步：Feign 互调**——order-service 定义 `ProductClient` 调 product-service 的查询接口（见第 4 节），配好超时与 BASIC 日志。\n\n**第 4 步：Gateway 统一入口**——新建 gateway 服务，按第 5 节配置两条路由，并实现 `AuthGlobalFilter`：白名单放行登录接口，其余无 token 返回 401。\n\n**第 5 步：Sentinel 限流**——order/order-list 资源加 `@SentinelResource`，控制台对该资源配置 QPS=2 的流控规则，触发后返回兜底数据；再给 product 接口模拟慢调用，配置慢调用比例熔断规则，观察\"熔断打开→请求直接走 fallback→半开恢复\"的过程。\n\n**验收标准清单（全部满足才算完成）**：\n\n- [ ] Nacos 控制台的服务列表能看到 product-service 和 order-service 两个实例，IP 端口正确。\n- [ ] 杀掉 product-service，约 30s 后实例被剔除；重启后自动恢复注册。\n- [ ] 通过 order-service 的接口下单，能拿到商品信息（Feign 调用成功），SQL/调用日志可见。\n- [ ] Nacos 上新建配置并发布，@RefreshScope 的属性值不重启即生效。\n- [ ] 直接访问 `localhost:8080/api/products/1`（Gateway 端口）能路由到 product-service。\n- [ ] 不带 Authorization 头访问非白名单接口返回 401；登录接口白名单放行。\n- [ ] Sentinel 上给资源配 QPS=2 流控后，快速刷新页面触发限流，返回兜底结果而非报错堆栈。\n- [ ] 模拟 product 慢调用触发熔断：连续超时后一段时间内请求直接走 fallback，之后恢复。\n- [ ] 停掉 order-service，gateway 路由返回 503 而不是网关崩溃。\n\n## 💼 高频面试题\n\n**Q：微服务有什么优缺点？什么时候该拆？**\n- 优点：独立部署发布、故障隔离、独立伸缩、团队并行。\n- 缺点：网络调用不可靠、分布式事务与数据一致性难、运维与排查成本高。\n- 拆分时机：团队规模与发布冲突、模块负载差异需要独立伸缩；单体扛得住就先单体，演进式拆分。\n\n**Q：注册中心的原理？Nacos 怎么感知服务上下线？**\n- 服务启动时上报实例信息（注册），消费者拉取并订阅实例列表，变更时推送。\n- 临时实例靠心跳保活：5s 一次心跳，15s 不健康，30s 剔除（2.x 临时实例走长连接，机制等价）。\n- 调用方本地缓存实例列表，注册中心短暂不可用时仍可按缓存调用，保证可用性。\n\n**Q：Feign 的原理？**\n- 声明式 HTTP 客户端：接口 + @FeignClient，启动时用动态代理生成实现。\n- 调用方法 → 按注解组装 HTTP 请求 → 经负载均衡从注册中心实例列表选一台 → 发请求 → 解码响应。\n- 必须配超时；重试只用于幂等操作，非幂等接口重试会重复下单。\n\n**Q：网关的作用？**\n- 统一入口，客户端不感知内部服务地址；按路由规则转发到各服务（lb 负载均衡）。\n- 横切能力收敛一处：鉴权、限流、跨域、日志。\n- 组成：Route（路由）、Predicate（断言匹配）、Filter（前置/后置加工），全局过滤器适合做统一鉴权。\n\n**Q：限流、熔断、降级的区别？**\n- 限流：限制进入的请求量（QPS/线程数），超出直接拒绝，保护自己。\n- 熔断：下游异常率/慢调用超阈值后暂时\"跳闸\"不再调用，防止故障蔓延引发雪崩，状态机为关闭→打开→半开。\n- 降级：被限流/熔断/异常时的兜底响应，返回默认值或缓存旧值，保证有损可用。\n- 三者配合：限流挡量、熔断止损、降级兜底。\n\n**Q：Feign 调用和 Dubbo/RPC 有什么区别？**\n- Feign 基于 HTTP + JSON，跨语言友好、调试简单，性能一般。\n- RPC（如 Dubbo）基于 TCP + 二进制序列化，性能高，但耦合序列化协议。\n- 选型：对外或异构系统用 HTTP；内部大规模高性能调用可上 RPC（见 RPC 入门资料）。\n\n**Q：微服务/分布式环境下会遇到哪些典型问题？**\n- 服务治理：注册发现、负载均衡、故障转移。\n- 数据一致性：跨服务跨库事务（Seata/消息最终一致）、分布式 ID、幂等设计。\n- 稳定性：雪崩防护（超时/限流/熔断降级）、服务依赖治理。\n- 可观测：链路追踪、日志聚合、监控告警；以及配置集中管理与热更新。\n\n## 🔗 推荐资料\n\n| 资料 | 说明 | 链接 |\n| --- | --- | --- |\n| 廖雪峰 Spring Cloud 教程 | 注册发现、网关等组件的入门实操 | https://liaoxuefeng.com/books/java/springcloud/index.html |\n| JavaGuide RPC & Dubbo 入门 | 理解 Feign 与 RPC 的异同 | https://javaguide.cn/distributed-system/rpc/rpc-intro.html |\n| JavaGuide API 网关 | 网关的职责与选型总结 | https://javaguide.cn/distributed-system/api-gateway.html |\n| JavaGuide 高可用系统设计指南 | 限流、熔断、降级、超时的系统论述 | https://javaguide.cn/high-availability/high-availability-system-design.html |\n| pdai 架构知识体系 | 微服务演进与架构设计全景图 | https://pdai.tech/md/arch/arch-z-overview.html |\n","ck":9},{"id":"f19","stage":4,"path":"04-框架篇/05-单元测试与工程质量.md","title":"05-单元测试与工程质量","md":"# 05-单元测试与工程质量\n\n> **阶段**：框架篇 ｜ **建议时长**：4 天 ｜ **前置**：04-框架篇/01-Spring核心.md、04-框架篇/02-SpringBoot实战.md\n\n## 🎯 学习目标\n\n- 能说清测试金字塔，以及单元测试/集成测试/E2E 的边界与各自该测什么。\n- 会用 JUnit 5 的注解与参数化测试，会为 Service 写带 Mock 的独立单测。\n- 能区分 `@SpringBootTest` 与 `@WebMvcTest`（切片），并解释 `@MockBean` 的作用。\n- 知道怎么保证测试不污染数据库（`@Transactional` 回滚 / 独立测试库 / Testcontainers）。\n- 能回答\"你们怎么保证代码质量\"——测试 + 规范 + 静态检查 + CI 四件套。\n\n## 📖 核心知识点\n\n### 一、测试金字塔与三种测试\n\n面试官想听：不是\"我们会写单测\"，而是能说清**为什么单测要占大头**。\n\n```\n        /  E2E  \\        少量（关键业务闭环），慢、脆、贵\n       / 集成测试 \\       中等（多个组件 + 真实中间件协作）\n      /  单元测试   \\     大量（单个类/方法，无外部依赖，毫秒级）\n```\n\n| 层次 | 测什么 | 依赖 | 数量 | 典型工具 |\n|---|---|---|---|---|\n| 单元测试 UT | 一个类的逻辑分支，DAO/RPC 全 mock | 不起 Spring | 几百上千 | JUnit 5 + Mockito，毫秒级 |\n| 集成测试 IT | 多组件协作、真实 SQL、事务生效 | 起容器/真库 | 几十 | `@SpringBootTest` + Testcontainers |\n| 端到端 E2E | 从界面点到落库的业务闭环 | 完整环境 | 个位数 | Selenium / 手工冒烟 |\n\n- 为什么面试爱问「你们怎么保证质量」：这题考的是**工程习惯与协作成熟度**，不是记 API。答得好的人会说流程（Review + CI + 测试 + 规范），而不是\"我很仔细\"。\n- 一句话：**单测的价值不在\"发现 bug\"，在\"敢改代码\"**——没有测试的重构等于裸奔。\n\n### 二、JUnit 5\n\n```java\nclass TodoServiceTest {\n\n    @BeforeEach void setUp() { /* 每个 @Test 前跑，造公共数据 */ }\n    @AfterEach  void tearDown() { /* 每个之后跑，清理 */ }\n    @BeforeAll  static void initAll() { /* 全部之前，必须 static */ }\n\n    @Test\n    @DisplayName(\"正常创建待办：应返回自增 id 且状态为未完成\")   // 报告里显示中文，评审友好\n    void create_ok() {\n        int a = 1 + 2;\n        assertAll(                                  // ⭐一组断言全部执行完再汇总失败，比第一个就抛异常信息量大\n            () -> assertEquals(3, a),\n            () -> assertTrue(a > 0),\n            () -> assertNull(null)\n        );\n    }\n\n    @Test\n    void 空标题应抛异常() {\n        // 断言异常类型 + 消息，异常场景是单测最容易漏的一块\n        BusinessException ex = assertThrows(BusinessException.class,\n                () -> todoService.create(new TodoDTO()));\n        assertEquals(\"标题不能为空\", ex.getMessage());\n    }\n}\n```\n\n常用断言：`assertEquals` / `assertNotEquals` / `assertTrue` / `assertNull` / `assertSame`（比引用）/ `assertIterableEquals` / `assertLinesMatch` / `assertTimeoutPreemptively`（限时）。\n\n#### ⭐参数化测试（把 N 个用例写成 1 个方法）\n\n```java\n@ParameterizedTest\n@CsvSource({\"' ',  false\", \"'',  false\", \"'写周报',  true\"})    // 多行用例\nvoid 标题校验(String title, boolean expected) {\n    assertEquals(expected, todoService.isValidTitle(title));\n}\n\n@ParameterizedTest @ValueSource(ints = {1, 5, 100, 999})       // 单参数\nvoid 分页大小合法(int size) { assertTrue(pageService.isLegal(size)); }\n\n@ParameterizedTest @MethodSource(\"badIds\")                     // 复杂对象来源\nvoid 非法id应拒绝(long id) { assertThrows(BusinessException.class, () -> service.get(id)); }\nstatic Stream<Arguments> badIds() { return Stream.of(Arguments.of(-1L), Arguments.of(0L)); }\n```\n\n- 生命周期与命名注意：JUnit 5 **每个 @Test 都新建一个测试类实例**（与 JUnit 4 一致，保证用例互不影响），所以 `@BeforeAll` 才必须 static。\n- 别在测试里让用例互相依赖顺序（`@TestMethodOrder` 是坏味道信号）。\n\n### 三、Mockito\n\n一句话：**Mockito 让你在不启动 Spring、不连数据库的前提下测 Service 的逻辑**。\n\n```java\n@ExtendWith(MockitoExtension.class)          // ⭐JUnit 5 用这个；写成 @RunWith 是老 JUnit 4 的\nclass TodoServiceTest {\n\n    @Mock  private TodoMapper todoMapper;     // 假对象：所有方法默认返回 null/0/false\n    @Mock  private RedisTemplate<String, Object> redis;\n    @InjectMocks private TodoService todoService;   // 把上面所有 @Mock 注入进来\n\n    @Test\n    void 创建时应写库并清缓存() {\n        TodoDTO dto = new TodoDTO(); dto.setTitle(\"写周报\");\n        when(todoMapper.insert(any(Todo.class))).thenAnswer(inv -> {       // 模拟 MyBatis-Plus 回填主键\n            inv.getArgument(0, Todo.class).setId(1L);\n            return 1;\n        });\n\n        Long id = todoService.create(dto);\n\n        assertEquals(1L, id);\n        verify(todoMapper).insert(any());                 // 确实调了 1 次（默认 times(1)）\n        verify(redis, times(1)).delete(\"todo:list\");      // 次数断言\n        verify(redis, never()).delete(\"todo:detail:*\");   // ⭐never：不该发生的也要断言\n    }\n\n    @Test\n    void 查不存在的待办应抛业务异常() {\n        when(todoMapper.selectById(99L)).thenReturn(null);\n        assertThrows(BusinessException.class, () -> todoService.get(99L));\n    }\n\n    @Test\n    void 保存时应带上当前用户ID() {\n        ArgumentCaptor<Todo> captor = ArgumentCaptor.forClass(Todo.class);  // ⭐参数捕获：看传进去的到底是什么\n        todoService.create(buildDto());\n        verify(todoMapper).insert(captor.capture());\n        assertEquals(\"u1001\", captor.getValue().getCreateBy());\n    }\n}\n```\n\n- `when(...).thenReturn(...)` 打桩（stub）；`thenThrow` 模拟依赖抛异常（**这条最重要：数据库超时时你的 Service 怎么处理？**）；`thenAnswer` 需要动态/副作用时用。\n- `verify(mock, times(2))` / `atLeastOnce()` / `never()`；`verifyNoMoreInteractions()` 严格模式（少用）。\n- ⭐**spy 慎用**：`@Spy` 包真实对象，默认走真实逻辑，容易写出\"其实是在测真实实现\"的假单测；出现 spy 通常说明这个类该拆了。\n- 常见坑：`when(mock.list()).thenReturn(...)` 里对**未打桩的方法**返回 null，链式调用直接 NPE；`MockitoExtension` 默认 strict stubs，**多余的打桩会报错**（这是好事，能逼你删无用桩）。\n- 别 mock 的东西：值对象/DTO、JDK 集合、静态常量、你自己的被测类本身。\n\n### 四、Spring 测试：整体启动 vs 切片\n\n| 注解 | 启动什么 | 速度 | 适用 |\n|---|---|---|---|\n| `@SpringBootTest` | **整个应用上下文**（所有 Bean、自动配置全跑） | 慢（秒级起） | 集成测试：真连 MyBatis、事务、Redis（或 Testcontainers） |\n| `@WebMvcTest` | **只扫 Web 层**：`@Controller`/`@ControllerAdvice`/`Filter`/序列化，不装 Service 和 Mapper | 快 | 测 URL 映射、参数校验、JSON 结构、异常处理 |\n| `@DataJpaTest` / `@MybatisTest` | 只起持久层 + 内嵌库 | 中 | 测 SQL、动态 SQL、分页插件 |\n| `@JsonTest` | 只测 JSON 序列化 | 快 | 测字段命名、日期格式、`@JsonIgnore` |\n\n```java\n@WebMvcTest(TodoController.class)\nclass TodoControllerTest {\n\n    @Autowired MockMvc mockMvc;                     // MockMvc：不真起端口，直接喂一个模拟请求\n    @MockBean  TodoService todoService;             // ⭐把容器里的 Service 换成 mock（不是 @Mock！）\n\n    @Test\n    void GET_按id查待办_应返回200和json字段() throws Exception {\n        when(todoService.get(1L)).thenReturn(new TodoVO(1L, \"写周报\", false));\n\n        mockMvc.perform(get(\"/api/todos/{id}\", 1L)\n                    .accept(MediaType.APPLICATION_JSON))\n               .andExpect(status().isOk())\n               .andExpect(jsonPath(\"$.id\").value(1))\n               .andExpect(jsonPath(\"$.title\").value(\"写周报\"))\n               .andExpect(jsonPath(\"$.done\").value(false));\n    }\n}\n```\n\n- `MockMvc`（同步、Spring 官方）vs `TestRestTemplate` / `RestTestTemplate`（真起随机端口 `@SpringBootTest(webEnvironment = RANDOM_PORT)`，能测到过滤器与拦截器的完整链路）。\n- **整链路集成测试的注解组合**：`@SpringBootTest` + **`@AutoConfigureMockMvc`**——前者启动完整容器（Controller→Service→Mapper 真实装配），后者自动配置 MockMvc 让你不必真起端口也能发请求。只测 Web 层用 `@WebMvcTest`（更快的切片测试，Service 要 mock）。\n- ⭐`@MockBean` 会让上下文缓存失效从而重启容器，**大量使用会显著拖慢测试**；纯单测就别起 Spring。\n- 测试隔离：`@Transactional` 标在测试类/方法上，测试结束**自动回滚**（这是 Spring 测试最常用的一招）；但注意它回滚不了 Redis、消息队列，也会让\"事务传播行为\"测不出来（内层事务被合并）。\n\n#### 数据库测试的三条路\n\n1. `@Transactional` 自动回滚 —— 最省事，但依赖同一连接、测不到真实提交效果。\n2. 独立测试库 + 每轮 `clean`（或 Flyway/`@Sql` 脚本重建数据）—— 团队 CI 常用。\n3. ⭐**Testcontainers**（了解即可）：测试时用 Docker 真起一个 MySQL/Redis 容器，跑完销毁。兼顾\"真环境\"和\"可重复\"，代价是慢、CI 需要 Docker。\n4. H2 内存库：快但 SQL 方言和 MySQL 不完全兼容（`ON DUPLICATE KEY`、`limit` 写法会骗你），MyBatis 项目慎用。\n\n### 五、覆盖率 JaCoCo\n\n```xml\n<plugin>\n  <groupId>org.jacoco<\/groupId><artifactId>jacoco-maven-plugin<\/artifactId><version>0.8.12<\/version>\n  <executions>\n    <execution><goals><goal>prepare-agent<\/goal><\/goals><\/execution>\n    <execution><id>report<\/id><phase>test<\/phase><goals><goal>report<\/goal><\/goals><\/execution>\n  <\/executions>\n<\/plugin>\n```\n\n- `mvn test` 后看 `target/site/jacoco/index.html`：行覆盖、分支覆盖、指令覆盖。\n- ⭐答题口径：**覆盖率不是目标，关键路径的分支覆盖才是**。行覆盖 80% 但 `if` 的 else 分支从没进过，等于没测；追求 100% 会催生一堆 `assertNotNull(x)` 式的水测试。\n- 团队实践：只对本次改动的文件要求增量覆盖率（diff coverage，Sonar 的 \"new code coverage\"），比全局门槛合理得多。\n\n### 六、工程质量顺带这一节\n\n#### Lombok：常用注解与原理\n\n| 注解 | 生成什么 | 注意点 |\n|---|---|---|\n| `@Data` | getter/setter/toString/equals/hashCode/`@RequiredArgsConstructor` | ⭐**实体上慎用**：`equals/hashCode` 会带上所有字段（含大集合），可能栈溢出；JPA 实体建议 `@Getter @Setter` |\n| `@Builder` | 建造者，`Todo.builder().id(1L).build()` | 与 Jackson 反序列化配合要加 `@AllArgsConstructor` |\n| `@Slf4j` | `private static final Logger log = LoggerFactory.getLogger(X.class)` | 少写一行样板 |\n| `@RequiredArgsConstructor` | final 字段的构造器 | ⭐**配合构造器注入的最佳写法**，替代 `@Autowired` 字段注入 |\n| `@Getter/@Setter`、`@NoArgsConstructor`、`@ToString` | 局部生成 | — |\n\n- 原理（面试点）：**编译期注解处理器**，通过改 AST 语法树插入方法字节码，运行时反射读不到\"Lombok 生成的东西\"和手写的一模一样。所以它**不是运行时动态生成**，`@Retention(SOURCE)`；代价是 IDE 必须装插件、Javadoc 里看不到方法。\n- 追问：为什么 `@Builder` 加在无 `@AllArgsConstructor` 的类上会报错？因为 builder 的 `build()` 需要一个能填全字段的构造器。\n\n- **MapStruct 一句话**：编译期生成对象转换代码（DTO ↔ PO），比手写 `BeanUtils.copyProperties` 快（无反射）、比反射安全（字段改名编译就报错）。\n\n#### 日志规范：SLF4J 门面 + Logback 实现\n\n```java\nlog.info(\"订单创建成功 userId={} amount={} traceId={}\", userId, amount, traceId);\n```\n\n- ⭐**必须用占位符 `{}`**，不要 `log.info(\"user=\" + userId)`：字符串拼接在日志级别被关闭时**照样执行**，白白浪费；占位符是延迟求值。\n- 别用 `System.out.println`：无级别、无时间戳、无线程名、无法落文件与收集、不能被 ELK 采（见[《05-Elasticsearch》](#/f/f25)）。\n- 异常打印：`log.error(\"下单失败 orderId=\" + id, e)` —— ⭐**异常对象必须作为最后一个参数**（不要 `e.getMessage()`，那样堆栈全丢）。\n- 别到处 `e.printStackTrace()`（写 stderr，可能不进日志文件）。\n\n| 级别 | 用在哪 | 生产是否开 |\n|---|---|---|\n| `ERROR` | 需要人介入的故障：报警、异常堆栈 | ✅ |\n| `WARN` | 异常但可自愈：降级、重试成功、参数不合法 | ✅ |\n| `INFO` | 关键业务节点：下单、支付回调、启动参数 | ✅（别刷屏） |\n| `DEBUG` | 排查细节：入参出参、SQL | 临时开 |\n| `TRACE` | 最细，循环内部 | 基本不开 |\n\n- 追问：线上想临时改日志级别怎么办？——Spring Boot Actuator `/actuator/loggers/{name}` 可动态调整，不用重启。\n\n#### 阿里巴巴 Java 开发手册（要点摘要，非照抄）\n\n| 规约 | 要求 | 为什么 |\n|---|---|---|\n| 命名 | 类名 UpperCamelCase、方法/变量 lowerCamelCase、常量全大写下划线；抽象类 Abstract/Base 开头、异常类 Exception 结尾、测试类\"被测类名 + Test\" | 一眼看出用途 |\n| POJO 布尔 | ⭐**布尔字段不要加 `is` 前缀**（用 `deleted` 不用 `isDeleted`） | 框架按 getter 推导属性名，`isDeleted()` → `deleted`，导致字段丢失/反序列化为 null |\n| 包装类型 | POJO 属性、RPC 返回值与参数用包装类型；局部变量用基本类型 | 基本类型默认 0，分不清\"没传\"和\"传了 0\"，数据库列可能为 null |\n| Integer 比较 | ⭐**整型包装类值比较一律用 `equals()`** | 缓存只到 -128~127，超出后 `==` 为 false（面试与线上双坑） |\n| 金额 | `BigDecimal` 且**构造传 String**（`new BigDecimal(\"0.1\")`）；除法必须指定 scale 与 RoundingMode | double 无法精确表示 0.1 |\n| 并发 | ⭐**线程池禁止用 `Executors` 快捷方法创建**，必须 `new ThreadPoolExecutor(...)` 手动指定七参数 | 队列/线程数无界 → OOM；手册强制项也是面试高频 |\n| 并发 | `SimpleDateFormat` 线程不安全（用 `DateTimeFormatter`）；`ThreadLocal` 用完必须 `remove()` | 线程池复用线程会造成脏数据与内存泄漏 |\n| MySQL | ⭐禁止 `SELECT *`；`WHERE` 列上避免函数与隐式类型转换（varchar 列传 int → 索引失效） | 覆盖索引失效、回表代价 |\n| 工程 | 不允许魔法值；异常不做流程控制、不在 finally 里 return；对外接口必须幂等 | 可读性 + \"吞异常\"事故 |\n\n- 顺带提一句静态检查：**SpotBugs / PMD / Checkstyle / SonarQube** 把这些规约变成 CI 里的硬门槛，比口头强调有效。\n- 一句话：**规范的价值是\"团队里任何一个人写的代码，另一个人都能一眼读懂\"**。\n\n## 🛠 动手实践\n\n### 任务 1：给 TodoService 写 3 个单测（不起 Spring）\n\n- 要求：`@ExtendWith(MockitoExtension.class)` + `@Mock TodoMapper` + `@InjectMocks TodoService`，覆盖三条路径：① 创建成功（verify 写库 + 清缓存）；② 标题为空抛 `BusinessException`（`assertThrows`）；③ 列表查询（用 `@ParameterizedTest` 覆盖 正常/空结果/超长分页 三种入参）。\n- 验收标准：三个测试类方法都能在没有 MySQL、没有 Redis 的情况下跑通；至少一处用 `verify(..., never())` 断言\"不该发生的事\"；至少一个用例用 `ArgumentCaptor` 校验落库对象的字段值；`mvn test` 全绿且启动耗时 < 1 秒（证明没起 Spring 上下文）。\n\n### 任务 2：给 Controller 加 MockMvc 切片测试\n\n- 要求：`@WebMvcTest(TodoController.class)` + `@MockBean TodoService`，测 `GET /api/todos/{id}`（200 + jsonPath 校验字段）与 `POST /api/todos` 传空标题（400 + 错误信息），断言 `@Valid` 校验确实生效。\n- 验收标准：两个用例分别断言状态码和 `$.code`/`$.message` 字段；能说出 `@WebMvcTest` 下 Service 为什么必须 `@MockBean` 而不是 `@Mock`（**容器里没有这个 Bean，切片不扫描 Service**）；测试类里没有任何真实数据库连接。\n\n### 任务 3：加 JaCoCo 并补一个分支\n\n- 要求：接入 jacoco-maven-plugin，跑 `mvn test`，找出 `TodoService` 里**未被覆盖的 else 分支**并补一个测试。\n- 验收标准：能截图或贴出报告里该类的分支覆盖率数字，补测前后各一个数值；能说出行覆盖与分支覆盖的差别，以及为什么不追求 100%。\n\n## 💼 高频面试题\n\n- [ ] **Q：@SpringBootTest 和 @WebMvcTest 有什么区别？⭐** —— 前者启动整个 ApplicationContext（所有 Bean + 自动配置，慢，测集成）；后者只加载 Web 层切片（Controller/Advice/序列化），Service 要用 @MockBean 顶替，快 ｜ 详见[《SpringBoot实战》](#/f/f16)\n- [ ] **Q：mock 和 stub 的区别？⭐** —— 都是假对象；stub 关注\"返回值\"（when-thenReturn 让被测代码拿到预设数据），mock 关注\"交互\"（verify 断言有没有被调用、调用几次、参数是什么）；Mockito 一个工具两种用法 ｜ 详见[《05-单元测试与工程质量》](#/f/f19)\n- [ ] **Q：private 方法怎么测？⭐** —— 口径是\"不该直接测\"：private 是实现细节，测它会让重构寸步难行；应该通过 public 入口覆盖它的分支，或者这个类已经承担太多职责、该拆出来（拆成独立类的 public 方法再测） ｜ 详见[《07-设计模式》](#/f/f8)\n- [ ] **Q：测试为什么会污染数据库？怎么解决？⭐** —— 测试插的数据留在库里导致后续用例互相影响；解法：测试类标 @Transactional 结束自动回滚、独立测试库每轮 clean、Testcontainers 每次起新容器；注意 @Transactional 测不出事务传播且回滚不了 Redis ｜ 详见[《Spring核心》](#/f/f15)\n- [ ] **Q：单元测试怎么保证隔离性？⭐** —— JUnit 5 每个用例新建测试实例；不共享可变状态、不依赖执行顺序、@BeforeEach 准备数据、外部依赖全部 mock 掉；出现\"单独跑通、一起跑挂\"就是有隐藏共享状态 ｜ 详见[《05-单元测试与工程质量》](#/f/f19)\n- [ ] **Q：覆盖率多少算合格？怎么看？⭐** —— JaCoCo 出行覆盖/分支覆盖；口径是\"覆盖率不是目标，关键路径的分支覆盖才是\"，团队更该看增量（diff）覆盖率，避免为凑数写无断言的假测试 ｜ 详见[《05-单元测试与工程质量》](#/f/f19)\n- [ ] **Q：你们团队怎么保证代码质量？（高频开放题）⭐** —— 四层：① 单测 + 集成测试（关键路径分支覆盖）；② Code Review 强制 + PR 门禁；③ 静态扫描（Sonar/PMD/阿里规约插件）+ 统一格式化；④ CI 自动构建部署 + 线上监控告警与灰度 ｜ 详见[《04-简历与求职指南》](#/f/f35)\n- [ ] **Q：Lombok 的原理是什么？有什么坑？⭐** —— 编译期注解处理器修改 AST 生成方法字节码，不是运行时反射；坑：IDE 必须装插件、@Data 在实体上会生成含全部字段的 equals/hashCode、Javadoc 不含生成方法 ｜ 详见[《04-异常-IO-反射-注解》](#/f/f6)\n- [ ] **Q：日志为什么用 {} 占位符而不是字符串拼接？⭐** —— 拼接在日志级别关闭时仍会执行（无谓开销），占位符延迟求值；另外别用 System.out（无级别/时间/线程、无法被采集） ｜ 详见[《05-Elasticsearch》](#/f/f25)\n- [ ] **Q：阿里规约为什么禁止 POJO 布尔字段加 is 前缀？⭐** —— getter 为 isDeleted() 时部分框架推导属性名为 deleted，序列化/反序列化与 MyBatis 映射可能对不上导致字段丢失 ｜ 详见[《MySQL基础与SQL实战》](#/f/f13)\n- [ ] **Q：@Transactional 用在测试类上有什么副作用？⭐** —— 用例结束自动回滚（好事，保证隔离），但同库同连接会让真实提交行为测不到、内层事务被合并从而掩盖传播行为 bug、MyBatis 二级缓存与自增主键相关行为也不真实 ｜ 详见[《Spring核心》](#/f/f15)\n\n## 🔗 推荐资料\n\n| 资料 | 用来干什么 | 链接 |\n|---|---|---|\n| JavaGuide 单元测试 | JUnit5 + Mockito 的工程化用法与常见坑 | https://javaguide.cn/high-quality-technical-articles/focused/tech/2021-12-11-单元测试.html |\n| pdai Spring 测试 | @SpringBootTest、切片测试、测试隔离的完整讲解 | https://pdai.tech/md/framework/spring-boot/x-boot-test.html |\n| 廖雪峰 Spring Boot 实战 | 回到 todo-list 项目，把 Controller/Service 结构理清 | https://liaoxuefeng.com/books/java/springboot/index.html |\n| 慕课 Java 单元测试实战 | 跟练 MockMvc/Testcontainers，补齐动手经验 | https://www.imooc.com/course/list?c=junit |\n| 码工具 阿里 Java 开发手册 | 规约条目在线速查与自查清单 | https://www.matools.com/alibaba |\n","ck":11},{"id":"f20","stage":4,"path":"04-框架篇/06-认证与安全.md","title":"06-认证与安全","md":"# 06-认证与安全\n\n> **阶段**：框架篇 ｜ **用法**：todo-list 项目做到「能登录、能鉴权」时学这一篇；面试安全题（JWT/CSRF/密码存储）基本都在这里。先读完再动项目，安全方案别自己发明。\n\n## 🎯 学习目标\n\n- 能画出一个「账号密码登录 → 发 Token → 后续请求带 Token → 网关/拦截器校验」的完整时序。\n- 说清 Cookie/Session/JWT 三者的取舍，以及分布式下 Session 共享的三种方案。\n- 记住密码存储铁律：**加盐慢哈希（BCrypt）**，以及为什么「忘记密码只能重置不能找回」。\n- 能解释 XSS / CSRF / SQL 注入 三种攻击的原理与防御各一条，且不混淆。\n- 理解 RBAC 权限模型，能设计「用户-角色-权限-资源」四张表。\n\n## 📖 核心知识点\n\n### 1. 认证 vs 鉴权（先分清这两个词）\n\n- **认证 Authentication**：你是谁——校验凭据（密码/短信/扫码/OAuth）。\n- **鉴权 Authorization**：你能干什么——校验权限（这个角色能不能删这条订单）。\n- 一句话：认证是门卫查证件，鉴权是前台刷卡开闸。Spring Security 的两大组件一一对应（`AuthenticationManager` / `AccessDecisionManager` 或新版 `AuthorizationManager`）。\n\n### 2. 会话方案演进：Cookie+Session → Token → JWT ⭐\n\n| 方案 | 状态存哪 | 扩容 | 跨域 | 注销 |\n|---|---|---|---|---|\n| Session（Cookie 传 JSESSIONID） | 服务端内存 | 要共享（见下） | 同域才行 | 服务端删，立即生效 |\n| 集中式 Session（Redis） | Redis | 天然共享 | 同上 | 立即生效 |\n| JWT Token（放 `Authorization: Bearer`） | 不存（自包含） | 无状态最省事 | 无限制 | **难**，需黑名单/短过期 |\n\n- JWT 结构：`header.payload.signature`，Base64URL 编码——**是签名不是加密**，payload 里别放敏感信息，任何人都能 base64 解开看。\n- HS256（对称，单服务自用）vs RS256（非对称，签发方私钥签、验证方公钥验，微服务/开放平台用）。\n- 过期与刷新：Access Token 短期（15min~2h）+ Refresh Token 长期（7~30 天，存库可吊销）。口径：**JWT 的无状态是用「吊销难」换来的**。\n- 常见坑：`alg: none` 绕过验签（库要关支持）、密钥泄露等于系统沦陷、把 JWT 当加密信封。\n- 分布式 Session 三方案：**粘滞会话**（同一 IP 固定路由到同一台，扩容即乱）、**Session 复制**（集群广播，小集群才用）、**集中存储**（Spring Session + Redis，事实标准）。\n\n### 3. 密码与敏感数据 ⭐\n\n- 铁律：服务端**永远不存明文密码**，也不存可逆密文。忘记密码只能重置不能告诉你原密码——因为存的是哈希，本来就无法还原（这正是安全的证明）。\n- 正确姿势：**BCrypt（或 Argon2/PBKDF2）**，自带随机盐、慢哈希抗暴力。`encoder.encode(raw)` 一次一盐，比对用 `encoder.matches(raw, encoded)`。\n- 三个概念别混：\n  - **哈希 Hash**：单向，不可逆 → 存密码用它（MD5/SHA1 太快来不及加盐，禁用）。\n  - **加密 Encryption**：双向有密钥 → AES 存要还原的数据（手机号、API key），RSA 公加密私解密。\n  - **编码 Encoding**：无损格式转换（Base64/URL-encode）→ **不是安全手段**，Base64 不是加密是常识题。\n- 加盐（Salt）作用：同密码不同哈希，破彩虹表攻击；慢哈希作用：把 GPU 爆破成本拉高 1000 倍。\n- 脱敏：日志和返回里的手机号 `138****1234`、身份证、银行卡——序列化时处理（Jackson 注解或 MyBatis TypeHandler），别在业务代码里手搓 substring。\n\n### 4. 三种经典攻击与防御 ⭐\n\n| 攻击 | 原理一句话 | 发生地 | 防御 |\n|---|---|---|---|\n| SQL 注入 | 用户输入拼进 SQL 改变了语义（`' or 1=1 --`） | 数据库层 | **预编译 `#{}`**（MyBatis）、最小权限 DB 账号、WAF 兜底 |\n| XSS 跨站脚本 | 恶意 JS 注入页面，偷 Cookie/冒充操作 | 浏览器 | 输出转义、`HttpOnly` Cookie、CSP、前端框架默认转义 |\n| CSRF 跨站请求伪造 | 借用户在目标站的**已登录 Cookie**，诱导浏览器发伪造请求 | 浏览器 | **SameSite Cookie**、CSRF Token、校验 Origin/Referer |\n\n- 记忆锚点：**SQL 注入是「数据被当代码执行」，XSS 是「数据在浏览器被当代码执行」，CSRF 是「请求冒充了合法用户」**。\n- CSRF 只对「自动携带凭据（Cookie）」的方案有效，Header+JWT 方案天然免疫大半（浏览器不会自动带 Authorization 头）——这是面试加分点。\n- SQL 注入防御呼应[《MyBatis》](#/f/f17)的 `#{}` vs `${}`：`${}` 就是字符串拼接，order by 场景不得不用 `${}` 时要做**白名单校验**。\n\n### 5. RBAC 权限模型\n\n- 模型：**用户 → 角色 → 权限 → 资源**，用户不直接挂权限，一律通过角色中转（换岗位只改角色不改人）。\n- 四张核心表：`user`、`role`、`permission`、`user_role`、`role_permission`（多对多两张中间表）。\n- 落地分层：前端按钮显隐（体验层，**不是安全**）+ 后端接口鉴权（安全层，缺一不可）。接口上用注解（Spring Security `@PreAuthorize(\"hasRole('ADMIN')\")` 或自研拦截器）。\n- 面试一句话：「前端控制是体验，后端控制才是安全」。\n\n### 6. 第三方登录（OAuth2 速览）\n\n- 场景：微信/GitHub 授权登录。角色：资源所有者（用户）、客户端（你的应用）、授权服务器（微信）、资源服务器（微信 API）。\n- 授权码模式（最常用）时序：跳授权页 → 用户同意 → 回调带 `code` → 你的后端用 code+client_secret 换 access_token → 拿用户信息。\n- 关键点：**code 走前端、token 换在后端**（client_secret 绝不能放前端）；state 参数防 CSRF。\n- 了解即可，别展开实现——面试问到说出时序就够。\n\n## 🛠 动手实践\n\n### 任务 1：给 todo-list 加登录发 JWT\n\n- 要求：`POST /login`（用户名+密码，BCrypt matches 校验）→ 签发 JWT（含 userId、role，过期 2h）；写一个拦截器：`Authorization: Bearer` 验签+验过期，失败统一返回 401；除 `/login` 外全部接口拦截。\n- 验收标准：不带 token 访问受保护接口返回 401；带篡改过的 token 返回 401；把过期时间调成 30 秒，等待后访问能复现 401；能说出为什么 payload 里不放手机号。\n\n### 任务 2：亲手玩一次 SQL 注入与防御\n\n- 要求：先用 `${}` 拼接写一个查询接口，用 `' OR '1'='1` 复现全表泄露；再改 `#{}` 验证免疫；对「按列名动态排序」参数做白名单（只允许 `id|create_time|priority`）。\n- 验收标准：能演示注入前后差异；白名单外的列名传入直接 400；说出预编译防御的原理（SQL 结构与参数分离，参数永远是数据）。\n\n### 任务 3：RBAC 四表 + 一个接口级鉴权\n\n- 要求：建五张表（user/role/permission+两张中间表）；登录时把角色写进 JWT payload；`DELETE /todos/{id}` 只允许 ADMIN 角色；普通用户删除自己的记录放行（数据级权限，与功能级权限的区别）。\n- 验收标准：ADMIN 删除任意记录 200，USER 删别人的 403、删自己的 200；能说出「功能级权限」与「数据级权限」分别拦在哪一层。\n\n## 💼 高频面试题\n\n- [ ] **Q：JWT 的组成部分与校验流程？** —— header.payload.signature 三段 Base64URL，服务端用密钥重算签名比对，再查 exp；是签名不是加密 ｜ 详见[《03-IO模型与网络编程》](#/f/f11)\n- [ ] **Q：为什么 JWT 注销难，怎么解决？** —— 无状态服务端不存，只能等过期；缓解：短期 Access + 可吊销 Refresh、Redis 黑名单、改密码全局失效 ｜ 详见[《06-认证与安全》](#/f/f20)\n- [ ] **Q：XSS 和 CSRF 的区别与各自防御？** —— XSS 是注入脚本偷凭据（转义+HttpOnly+CSP），CSRF 是借凭伪造请求（SameSite+Token+验 Origin） ｜ 详见[《06-认证与安全》](#/f/f20)\n- [ ] **Q：密码怎么存才安全？** —— BCrypt/Argon2 加盐慢哈希，禁止 MD5/SHA 裸哈希与可逆加密；matches 比对 ｜ 详见[《06-认证与安全》](#/f/f20)\n- [ ] **Q：分布式系统下 Session 怎么共享？** —— 粘滞会话/集群复制/Spring Session 存 Redis（事实标准），或直接改无状态 Token ｜ 详见[《03-IO模型与网络编程》](#/f/f11)\n- [ ] **Q：预编译为什么能防 SQL 注入？** —— 先编译 SQL 结构再填参数，参数被当纯数据绑定，改变不了语法结构 ｜ 详见[《MyBatis》](#/f/f17)\n- [ ] **Q：RBAC 是什么，为什么用户不直接挂权限？** —— 用户-角色-权限三层，角色是批量授权的中转站，人员/权限变动只动一层 ｜ 详见[《06-认证与安全》](#/f/f20)\n- [ ] **Q：OAuth2 授权码模式为什么要后端换 token？** —— code 经浏览器可被截但短命且需 client_secret 才能换 token，secret 不落前端 ｜ 详见[《06-认证与安全》](#/f/f20)\n\n## 🔗 推荐资料\n\n| 资料 | 用来干什么 | 链接 |\n|---|---|---|\n| JavaGuide 认证授权专题（JWT/SSO 详解） | JWT 与单点登录的完整推导 | https://javaguide.cn/system-design/security/ |\n| JavaGuide 常见加密算法总结 | 哈希/对称/非对称选型对照 | https://javaguide.cn/system-design/security/encryption-algorithms.html |\n| pdai.tech 系统设计与安全 | RBAC/权限体系的结构图视角 | https://pdai.tech/md/arch/arch-z-design.html |\n| 廖雪峰 Web 前端安全篇（跨站脚本/CSRF） | 攻击原理的通俗讲解 | https://www.liaoxuefeng.com/book/0001373845519712840765955243109f0516b23e69718a6000 |\n| 码工具 Java API（MessageDigest/SecretKey 相关） | 动手实现时查签名 | https://www.matools.com/api/java8 |\n","ck":8},{"id":"f21","stage":5,"path":"05-中间件篇/01-Redis.md","title":"01-Redis","md":"# 01-Redis\n\n> **阶段**：中间件篇 ｜ **建议时长**：4 天 ｜ **前置**：MySQL 基础（03-数据库篇）、Spring Boot 基础\n\n## 🧩 它是什么，解决什么问题\n\nRedis（Remote Dictionary Server）是基于**内存**的 key-value NoSQL 数据库，单机 QPS 可达 10 万+。它是后端面试与实际工作中出现频率最高的中间件，没有之一。\n\n**磁盘数据库 vs 内存数据库**：\n\n| 维度 | MySQL（磁盘） | Redis（内存） |\n| --- | --- | --- |\n| 数据存放 | 磁盘（B+ 树数据页） | 内存（哈希表/跳表等） |\n| 随机读写 | 毫秒级，受磁盘 IO 限制 | 微秒级，10 万级 QPS |\n| 定位 | 持久化主存、复杂查询、事务 | 高速读写、缓存、简单结构 |\n| 容量 | TB 级 | 受内存限制（单实例不宜过大） |\n\n一句话：**MySQL 负责\"存得下\"，Redis 负责\"跑得快\"**。典型架构是 MySQL 为主存，Redis 做缓存层挡住大部分热点读。\n\n**为什么这么快？（高频面试题）**\n\n1. **纯内存操作**：数据在内存中读写，比磁盘快几个数量级；\n2. **命令执行单线程**：无锁竞争、无线程上下文切换（6.0 后网络 IO 用多线程，但**命令执行仍是单线程**，不存在并发安全问题）；\n3. **IO 多路复用**：基于 epoll 的 Reactor 模型，单线程同时监听大量连接，谁的请求就绪就处理谁；\n4. **高效数据结构**：SDS 动态字符串、跳表（ZSet）、压缩列表等，针对场景专门优化。\n\n## 📌 典型使用场景\n\n| 业务场景 | 为什么用它 | 不用的后果 |\n| --- | --- | --- |\n| 热点缓存（商品详情） | 读多写少，内存读微秒级 | 高峰期请求全打到 MySQL，数据库被打垮 |\n| 分布式锁（秒杀扣库存） | `SET NX EX`/Redisson 跨进程互斥 | 多实例并发超卖库存 |\n| 计数器（点赞/浏览量） | `INCR` 原子自增，天然无并发问题 | `count = count + 1` 在并发下丢失更新 |\n| 排行榜（游戏积分/热搜） | ZSet 按分数自动排序，`REVRANGE` 直接取 Top N | MySQL `ORDER BY` 大表排序慢，实时更新代价高 |\n| 会话共享（集群登录态） | 多台应用实例读写同一份 Session | Session 存本机，Nginx 轮询后用户频繁掉登录 |\n| 接口限流 | `INCR + EXPIRE` 按时间窗口计数 | 无限流则恶意请求/突发流量打垮服务 |\n| 签到打卡 | BitMap 1 bit/天，一年 365 天仅 46 字节 | MySQL 存签到记录，亿级用户存储与统计成本高 |\n\n## 🚀 快速上手\n\n### 1. Docker 启动\n\n```bash\ndocker run -d --name redis -p 6379:6379 redis:7.2 --requirepass \"123456\"\n# 进入命令行\ndocker exec -it redis redis-cli -a 123456\n```\n\n```bash\n# redis-cli 基本操作\nset name zhangsan          # 写\nget name                   # 读\nset lock:order:1 1 NX EX 10  # 不存在才设置 + 10 秒过期（分布式锁雏形）\nincr count                 # 原子自增\nexpire name 60             # 设置过期时间\nttl name                   # 查看剩余过期时间\nkeys *                     # 列出所有 key（生产禁用，会阻塞；用 scan 代替）\ndel name                   # 删除\n```\n\n### 2. Spring Boot 整合（StringRedisTemplate 五大类型操作）\n\n```xml\n<!-- pom.xml -->\n<dependency>\n    <groupId>org.springframework.boot<\/groupId>\n    <artifactId>spring-boot-starter-data-redis<\/artifactId>\n<\/dependency>\n<!-- Redisson：生产级分布式锁 -->\n<dependency>\n    <groupId>org.redisson<\/groupId>\n    <artifactId>redisson-spring-boot-starter<\/artifactId>\n    <version>3.30.0<\/version>\n<\/dependency>\n```\n\n```yaml\n# application.yml（Spring Boot 3.x 用 spring.data.redis；2.x 用 spring.redis）\nspring:\n  data:\n    redis:\n      host: localhost\n      port: 6379\n      password: 123456\n```\n\n```java\n@Service\n@RequiredArgsConstructor\npublic class RedisTypeDemo {\n    private final StringRedisTemplate redis;\n\n    /** String：缓存 JSON + 过期时间 + 计数器 */\n    public void string() {\n        redis.opsForValue().set(\"user:1\", \"{\\\"name\\\":\\\"张三\\\"}\", 30, TimeUnit.MINUTES);\n        redis.opsForValue().get(\"user:1\");\n        redis.opsForValue().increment(\"article:1001:like\");   // 原子 +1\n    }\n\n    /** Hash：对象按字段读写，局部更新不整存整取 */\n    public void hash() {\n        redis.opsForHash().put(\"user:1:profile\", \"name\", \"张三\");\n        redis.opsForHash().get(\"user:1:profile\", \"name\");\n        redis.opsForHash().delete(\"user:1:profile\", \"name\");\n    }\n\n    /** List：最新消息/简易队列（左进右出） */\n    public void list() {\n        redis.opsForList().leftPush(\"msg:list\", \"hello\");\n        redis.opsForList().rightPop(\"msg:list\");\n        redis.opsForList().range(\"msg:list\", 0, 9);           // 取最新 10 条\n    }\n\n    /** Set：去重、抽奖、共同关注 */\n    public void set() {\n        redis.opsForSet().add(\"article:1001:readers\", \"u1\", \"u2\");  // 自动去重\n        redis.opsForSet().intersect(\"u1:follow\", \"u2:follow\");      // 共同关注\n        redis.opsForSet().pop(\"lottery:1\");                          // 随机弹出（抽奖）\n    }\n\n    /** ZSet：排行榜，按 score 自动排序 */\n    public void zset() {\n        redis.opsForZSet().incrementScore(\"rank:score\", \"player1\", 10); // 加 10 分\n        redis.opsForZSet().reverseRange(\"rank:score\", 0, 9);            // Top 10\n        redis.opsForZSet().reverseRank(\"rank:score\", \"player1\");        // 我的排名\n    }\n}\n```\n\n### 3. Redisson 分布式锁（看门狗自动续期）\n\n```java\n@Service\n@RequiredArgsConstructor\npublic class StockService {\n    private final RedissonClient redisson;\n\n    public void deductStock(String productId) {\n        RLock lock = redisson.getLock(\"lock:stock:\" + productId);\n        lock.lock(); // 不传 leaseTime → 启用看门狗：默认锁 30s，每 10s 检查并自动续期\n        try {\n            // 查库存 → 判断 → 扣减，临界区必须包含\"查+改\"全程\n        } finally {\n            if (lock.isHeldByCurrentThread()) { // 防止误释放别人的锁\n                lock.unlock();\n            }\n        }\n    }\n\n    public boolean tryDeduct(String productId) throws InterruptedException {\n        RLock lock = redisson.getLock(\"lock:stock:\" + productId);\n        // tryLock：最多等 5 秒，拿到锁后 10 秒自动释放（不启用看门狗）\n        if (!lock.tryLock(5, 10, TimeUnit.SECONDS)) {\n            return false; // 没抢到锁，快速失败\n        }\n        try { /* 业务 */ return true; }\n        finally { lock.unlock(); }\n    }\n}\n```\n\n## 🔧 常用命令 / API 速查\n\n| 类型 | 常用命令 | 典型场景 |\n| --- | --- | --- |\n| String | `SET/GET`、`INCR/DECR`、`SET key val NX EX 10`、`MSET/MGET` | 缓存、计数器、分布式锁、限流 |\n| List | `LPUSH/RPOP`、`LRANGE`、`LLEN`、`BLPOP` | 最新列表、消息队列、时间线 |\n| Hash | `HSET/HGET/HGETALL`、`HDEL`、`HINCRBY` | 对象属性存储、购物车 |\n| Set | `SADD/SMEMBERS`、`SINTER/SUNION/SDIFF`、`SPOP` | 去重、共同好友、抽奖 |\n| ZSet | `ZADD`、`ZINCRBY`、`ZREVRANGE`、`ZRANK`、`ZRANGEBYSCORE` | 排行榜、延迟队列、范围检索 |\n| Stream | `XADD`、`XREADGROUP`、`XACK` | 消息队列/消费者组雏形（5.0+，面试加分项，了解即可） |\n| BitMap | `SETBIT/GETBIT`、`BITCOUNT` | 签到、活跃用户统计 |\n| 通用 | `EXPIRE/TTL`、`SCAN`、`DEL/UNLINK`、`TYPE` | 过期管理、渐进遍历、删除 |\n\n## 🧠 核心进阶\n\n### 1. 过期删除与内存淘汰\n\n- **过期删除**（处理已设 TTL 的 key）：不是\"到点即删\"。采用 **惰性删除**（访问时检查过期才删）+ **定期删除**（每 100ms 随机抽一批 key 检查删除）的折中策略，兼顾 CPU 与内存。\n- **内存淘汰**（内存达到 `maxmemory` 后触发）：`noeviction`（默认，写报错）、`allkeys-lru`（全键 LRU，缓存场景最常用）、`allkeys-lfu`（访问频率优先）、`volatile-lru/lfu/ttl/random`（只淘汰设了 TTL 的）、`allkeys-random`。缓存场景推荐 `allkeys-lru` 或 `allkeys-lfu`。\n\n### 2. 持久化：RDB vs AOF vs 混合\n\n| 方案 | 原理 | 优点 | 缺点 |\n| --- | --- | --- | --- |\n| RDB | 定时 `bgsave` fork 子进程做全量快照（二进制） | 文件小、恢复快 | 两次快照间的数据会丢 |\n| AOF | 追加记录每条写命令，`appendfsync everysec` | 最多丢 1 秒数据 | 文件大、恢复慢（有重写机制压缩） |\n| 混合（4.0+） | AOF 重写时前半段存 RDB 全量 + 后半段增量命令 | 恢复快 + 丢得少 | 仅 Redis 4.0+ 支持 |\n\n生产推荐：开启混合持久化（`aof-use-rdb-preamble yes`）。\n\n**bgsave 的 fork 与写时复制（线上高频追问）**：`bgsave` 靠 fork 子进程做快照，靠的就是 OS 的写时复制——fork 瞬间**不复制数据**，父子共享同一批物理页，所以 60GB 实例 fork 也很快。但代价在后面：\n\n- 快照期间主进程仍接受写入，**任何一个被改动的页都会触发复制**，额外占用内存；写入越猛、被改的页越多，峰值内存越接近**翻倍**。\n- 所以线上要留出内存余量（经验值：留给 COW 的空间 ≈ 写入速率 × 快照耗时），并控制 `maxmemory` 不超过物理内存的一半左右；反之则可能触发 swap 甚至 OOM。\n- 同理，`fork` 本身虽然快，但**fork 那一刻主进程会短暂阻塞**（要复制页表，堆越大页表越大，阻塞越久），这是\"大实例 fork 卡顿\"的来源。\n\n**AOF 重写期间的新命令去哪了？**：子进程重写期间，主进程把新收到的写命令**追加到 `aof_rewrite_buf`（重写缓冲区）**，同时照常写入原 AOF 文件。子进程写完新 AOF 后，主进程把 `aof_rewrite_buf` 的内容**追加到新文件末尾**，再用新文件原子替换旧文件——这样重写期间的写入一条不丢，也不会污染重写出的快照。\n\n### 3. 缓存穿透 / 击穿 / 雪崩（必须会画会讲）\n\n| 问题 | 现象 | 解决方案 |\n| --- | --- | --- |\n| 穿透 | 查询**根本不存在**的数据，缓存永远 miss，请求全打到 DB | ① 缓存空值（短 TTL）；② **布隆过滤器**前置拦截（说\"不存在\"则一定不存在，说\"存在\"可能误判，空间极省）；③ 参数校验 |\n| 击穿 | 某个**热点 key 过期瞬间**，海量并发同时回源 DB | ① **互斥锁**：只放一个线程重建缓存，其他等待；② 逻辑过期：热点 key 不设 TTL，值里存过期时间异步更新 |\n| 雪崩 | **大量 key 同时过期**或 Redis 宕机，DB 瞬间被冲垮 | ① TTL 加随机值打散；② 多级缓存（本地 Caffeine + Redis）；③ 集群高可用 + 限流、降级兜底 |\n\n### 4. 缓存与数据库一致性\n\n- 主流方案 **Cache Aside**：读——先读缓存，miss 则查库回填；写——**先更新数据库，再删除缓存**（不是更新缓存：并发写会覆盖出旧值，删除保留\"下次读时再加载\"的懒加载语义）。\n- 该方案仍有极小概率不一致（读线程在写线程删缓存后、更新数据库前把旧值回填），可用**延迟双删**：删缓存 → 更新库 → 延迟 500ms~1s 再删一次。\n- 更可靠的方案：订阅 MySQL binlog（canal）异步删除/更新缓存，业务代码零侵入。\n\n### 5. 三种高可用架构对比\n\n| 架构 | 解决什么 | 原理 | 局限 |\n| --- | --- | --- | --- |\n| 主从复制 | 读写分离、备份 | 从节点全量 RDB + 增量命令同步，写主读从 | 主挂需手动切换 |\n| 哨兵 Sentinel | 主挂**自动故障转移** | 哨兵集群监控主节点，多数派投票选新主并通知客户端 | 不扩容，容量仍受单机限制 |\n| Cluster | 数据分片 + 高可用 | 16384 个 slot 按 `CRC16(key) % 16384` 分给多个主节点，每主带从 | 多 key 跨槽操作受限（需 hash tag）、运维复杂 |\n\n**主从复制的两个阶段**（面试常追问）：\n\n- **全量复制**：首次连接或增量不可用时，主节点 `bgsave` 生成 RDB 发给从节点，期间的写命令缓存后一并发过去，从节点加载完成。\n- **增量复制（断线重连的关键）**：主节点维护一个 **`repl_backlog` 环形缓冲区**（默认 1MB），记录最近一段写命令与 `master_repl_offset`；从节点重连时上报自己的 offset，**只要 offset 仍落在 backlog 范围内，就只补发差额部分**；反之（offset 已被覆盖/不连续）只能**退化成全量复制**——大内存实例全量复制要重新 fork + 传输整个 RDB，代价极高。所以生产上 `repl-backlog-size` 要按\"断线时长 × 写入速率\"给足。\n- **复制是异步的 → 读写分离会读到旧值**：主节点执行完写命令就返回客户端，命令再**异步**传播给从节点。主从之间因此存在一个同步窗口，**窗口内去读从节点必然拿到旧值**。对一致性敏感的操作（支付后立刻查订单状态）要**强制读主库**，或先 `WAIT` 等若干副本确认。哨兵只负责监控与故障转移，**不代理读写请求**——读旧值不是哨兵的问题。\n\n**哨兵的主观下线与客观下线**：单个哨兵 `PING` 主节点超时后，先标记为**主观下线（SDOWN）**——这只是它一家的判断，可能是自己的网络抖动。它会向其他哨兵询问，**达到 quorum 数量的哨兵都认为失联**时，才判定**客观下线（ODOWN）**并触发选举与故障转移。两层判定就是为了避免单点误判引发无谓的主从切换。\n\n**槽与 key 的路由**：客户端算 `CRC16(key) % 16384` 得到槽号，再查本地缓存的「槽 → 节点」映射，直接连对应节点。\n\n- **请求发错节点时的两种重定向**（高频追问）：\n  - **MOVED**：该槽**永久**归属另一个节点 → 节点返回 `MOVED <slot> <ip:port>`，客户端**更新本地槽映射**后重新请求（槽的归属是预先划分好的，节点不做代理转发，只做重定向）。\n  - **ASK**：该槽**正在迁移中**，key 已被搬到目标节点但迁移未完成 → 返回 `ASK`，客户端仅对**这一次**请求临时改投目标节点，**不更新**槽映射（否则迁移未完成时映射会来回抖动）。\n  - 一句话：**MOVED 是永久改派（要刷新映射），ASK 是一次性绕行（不刷新）**。\n- **CROSSSLOT 错误**：多 key 命令（`MGET`、`SINTER`、`MSET`、Lua 多 key）要求所有 key 在**同一个槽**，否则报 `CROSSSLOT Keys in request don't hash to the same slot`。`user:1:follow` 与 `user:2:follow` 的 CRC16 结果通常不同 → 分属不同节点 → 直接报错。\n  - 解法：**hash tag**——用 `{}` 包住参与哈希的部分，只有花括号内的内容参与计算：`{u1}:follow` 与 `{u1}:fans` 的哈希部分都是 `u1`，必然同槽，可以放心一起操作。\n\n### 6. 热 key 与大 key\n\n- **热 key**：单个 key 被超高频率访问，打爆某个节点 → 本地缓存兜一层、key 加随机后缀打散到多节点。\n- **大 key**：value 过大（如百万元素的 List）→ 删除/迁移阻塞主线程 → 拆分成多 key、压缩、用 `UNLINK` 异步删除，`redis-cli --bigkeys` 排查。\n\n### 7. 发布/订阅与键过期通知\n\n- `SUBSCRIBE/PSUBSCRIBE` 频道订阅、`PUBLISH` 发布；配合 `notify-keyspace-events Ex` 可订阅**键过期/删除事件**，常见用法是集群各节点收到\"某缓存 key 失效\"广播后清掉本地缓存。\n- 缺陷：**不可靠**——订阅者离线期间的消息直接丢失，没有持久化、没有 ACK、没有重投。结论：做**缓存失效广播**这类\"丢一两次无大碍\"的事可以，做**业务消息**（订单、支付）不行 → 这正是需要专业 MQ（RabbitMQ/Kafka/RocketMQ）的理由。\n\n### 8. 对象编码与内存优化\n\n同一种类型，Redis 会按数据规模**自动切换底层编码**以省内存（`OBJECT ENCODING key` 可查看）：\n\n| 类型 | 小对象编码 | 大对象编码 | 切换阈值（默认） |\n| --- | --- | --- | --- |\n| String | int / embstr | raw | 整数用 int；≤44 字节用 embstr |\n| Hash | **listpack**（旧版 ziplist） | hashtable | 字段数 ≤128 且值 ≤64 字节 |\n| List | listpack | quicklist | 元素数/大小超阈值 |\n| ZSet | **listpack**（旧版 ziplist） | skiplist + dict | 元素数 ≤128 且成员 ≤64 字节 |\n| Set | intset / listpack | hashtable | 全整数用 intset；元素数 ≤128 且值 ≤64 字节 |\n\n- 大 ZSet 的**双结构**：**skiplist** 支持按 score 范围与排名 O(logN) 查找，**dict** 支持按成员 O(1) 取分数——两者互补，代价是内存翻倍。\n- 优化口径：小对象紧凑编码省内存但增删代价高（要移动连续内存），超过阈值自动转成指针结构；调 `hash-max-listpack-entries` 等参数可控制阈值，通常不用动。\n\n## 💼 高频面试题\n\n**Q：Redis 为什么快？**\n- 纯内存操作，避免磁盘 IO；\n- 命令执行单线程，无锁、无线程切换开销（6.0 的多线程只用于网络 IO）；\n- epoll IO 多路复用，单线程支撑大量并发连接；\n- 专门优化的高效数据结构（跳表、SDS、压缩列表等）。\n\n**Q：五大基本类型及使用场景？**\n- String：缓存 JSON、计数器（INCR）、分布式锁（SET NX EX）、限流；\n- List：最新消息列表、简单消息队列（LPUSH/RPOP）；\n- Hash：对象按字段存取（购物车、用户属性）；\n- Set：去重、共同关注（SINTER）、抽奖（SPOP）；\n- ZSet：排行榜（分数排序）、延迟队列（score 存执行时间）。\n- 加分项：还有 **Stream**（5.0+，带 ID 的消息流 + 消费者组 + ACK，消息队列雏形），以及 BitMap/HyperLogLog/GEO 等扩展类型。\n\n**扩展类型速记**（统计类场景的高频考点）：\n\n| 类型 | 用途 | 关键数字 |\n| --- | --- | --- |\n| BitMap | 签到、活跃统计 | 1 bit/天，一年 365 天仅 46 字节 |\n| **HyperLogLog** | 统计**去重后的基数**（UV、PV 去重） | **固定约 12KB**，标准误差 **0.81%**；16384 个 6bit 寄存器做概率估算 |\n| GEO | 附近的人、距离计算 | 底层是 ZSET，按经纬度编码成分值 |\n| Stream | 消息队列雏形 | 带 ID、消费者组、ACK |\n\n- HyperLogLog 的取舍：内存恒定、不要成员列表，只给近似计数。**只关心\"有多少个不同的\"，不关心\"分别是谁\"**时用它（UV）；要精确、要成员列表就用 SET，但内存随基数线性增长。判断精度是否够，先问业务对误差的容忍度。\n\n**Q：持久化怎么选？**\n- RDB 快照：文件小恢复快，但会丢两次快照间的数据；\n- AOF：everysec 最多丢 1 秒，文件大恢复慢；\n- 生产用 4.0+ 混合持久化：RDB 做底 + AOF 增量，兼顾恢复速度与数据安全。\n\n**Q：缓存穿透、击穿、雪崩的区别与方案？**\n- 穿透=数据压根不存在→布隆过滤器/缓存空值/参数校验；\n- 击穿=单个热点 key 失效瞬间→互斥锁重建/逻辑过期；\n- 雪崩=大量 key 同时失效或 Redis 挂掉→TTL 随机打散/多级缓存/集群+限流降级。\n\n**Q：如何保证缓存与数据库一致性？**\n- 先更新数据库，再删除缓存（Cache Aside），失败靠重试；\n- 并发窗口要求高用延迟双删；\n- 终极方案：canal 订阅 binlog 异步删缓存，解耦且不易漏。\n\n**Q：Redisson 分布式锁的原理？**\n- 加锁/解锁用 Lua 脚本保证原子性；底层是 Hash 结构记录\"持有线程+重入次数\"，支持可重入；\n- 看门狗：不指定 leaseTime 时默认锁 30 秒，后台线程每 10 秒检查续期，业务没执行完锁不会过期；\n- 相比自写 `SET NX EX`：解决了\"业务超时锁先过期\"\"误删他人锁\"\"不可重入\"三大坑。\n\n**Q：哨兵和 Cluster 怎么选？**\n- 哨兵：数据量小、写并发不高，只要高可用 + 读写分离，方案简单；\n- Cluster：数据量大（单机放不下）或写 QPS 高，需要分片横向扩容；\n- Cluster 解决分片+高可用，哨兵只解决高可用。\n\n## 🔗 推荐资料\n\n| 资料 | 说明 | 链接 |\n| --- | --- | --- |\n| JavaGuide Redis 面试题（上） | 面试导向，覆盖本篇全部考点 | https://javaguide.cn/database/redis/redis-questions-01.html |\n| pdai Redis 总览 | 知识体系全景图 | https://pdai.tech/md/db/nosql-redis/db-redis-overview.html |\n| pdai Redis 数据类型 | 五大类型与底层结构详解 | https://pdai.tech/md/db/nosql-redis/db-redis-data-types.html |\n| pdai RDB 与 AOF | 持久化机制与混合持久化 | https://pdai.tech/md/db/nosql-redis/db-redis-x-rdb-aof.html |\n| pdai 缓存问题 | 穿透/击穿/雪崩/一致性 | https://pdai.tech/md/db/nosql-redis/db-redis-x-cache.html |\n| pdai Redis 哨兵 | 主从架构与故障转移 | https://pdai.tech/md/db/nosql-redis/db-redis-x-sentinel.html |\n| pdai Redis Cluster | 分片原理与槽位机制 | https://pdai.tech/md/db/nosql-redis/db-redis-x-cluster.html |\n| 廖雪峰 Spring Boot 集成 Redis | Spring Boot 整合实操 | https://liaoxuefeng.com/books/java/springboot/index.html |\n","ck":0},{"id":"f22","stage":5,"path":"05-中间件篇/02-RabbitMQ.md","title":"02-RabbitMQ","md":"# 02-RabbitMQ\n\n> **阶段**：中间件篇 ｜ **建议时长**：3 天 ｜ **前置**：01-Redis（中间件基础）、Spring Boot 基础\n\n## 🧩 它是什么，解决什么问题\n\nRabbitMQ 是基于 **AMQP 协议**的消息中间件，Erlang 语言编写，特点是**低延迟、路由灵活、功能完善**，吞吐量万级到十万级，是中小规模业务系统（电商、支付、CRM）最常用的 MQ。\n\n**消息队列解决的三个核心问题**：\n\n1. **异步**：下单后要发短信、加积分、通知仓储——串行要 800ms，发条消息让下游异步消费，主流程 100ms 返回；\n2. **解耦**：订单系统不直接调用下游 N 个系统，只发一条\"订单已创建\"事件，新增订阅方无需改订单代码；\n3. **削峰**：秒杀瞬时 10 万请求先排队，消费端按自己的节奏（如每秒 2000 单）处理，保护数据库。\n\n**核心模型（AMQP）**：\n\n```\nProducer ──(RoutingKey)──> Exchange ──(Binding 绑定规则)──> Queue ──> Consumer\n 生产者                      交换机（不存消息，只路由）        队列（存消息）    消费者\n```\n\n关键理解：**生产者永远不直接把消息发到队列，而是发给交换机**，交换机按绑定规则（Binding + RoutingKey）决定投递到哪个队列——这就是 RabbitMQ 路由灵活的原因。\n\n## 📌 典型使用场景\n\n| 业务场景 | 为什么用它 | 不用的后果 |\n| --- | --- | --- |\n| 订单超时自动取消（延迟消息） | 下单 15 分钟未支付自动关闭，TTL+死信或延迟插件实现 | 定时任务轮询订单表，延迟高、扫表压力大 |\n| 下单后异步通知（短信/积分/推送） | 主流程只发消息，多个下游各自订阅 | 串行调用，一个下游超时拖垮下单接口 |\n| 秒杀削峰 | 请求先进队列，消费端匀速落库 | 瞬时流量直接打爆 MySQL |\n| 系统间事件广播（fanout） | 一次发布，多个系统各自消费 | 新系统接入需改动上游代码，强耦合 |\n\n## 🚀 快速上手\n\n### 1. Docker 启动（带管理台）\n\n```bash\ndocker run -d --name rabbitmq -p 5672:5672 -p 15672:15672 rabbitmq:3.13-management\n# 管理台：http://localhost:15672  账号密码默认 guest/guest\n# 5672 = AMQP 通信端口，15672 = Web 管理台端口\n```\n\n### 2. Spring Boot 整合（声明队列 + JSON 序列化 + 手动 ACK）\n\n```xml\n<dependency>\n    <groupId>org.springframework.boot<\/groupId>\n    <artifactId>spring-boot-starter-amqp<\/artifactId>\n<\/dependency>\n```\n\n```yaml\n# application.yml\nspring:\n  rabbitmq:\n    host: localhost\n    port: 5672\n    username: guest\n    password: guest\n    publisher-confirm-type: correlated   # 生产者确认（异步 Confirm）\n    publisher-returns: true              # 路由不到队列时回调 ReturnCallback\n    listener:\n      simple:\n        acknowledge-mode: manual         # 消费者手动 ACK\n        prefetch: 10                     # 每个消费者未确认消息数上限（限流）\n```\n\n```java\n@Configuration\npublic class RabbitConfig {\n    public static final String ORDER_EXCHANGE = \"order.exchange\";\n    public static final String ORDER_QUEUE    = \"order.create.queue\";\n    public static final String DLX_EXCHANGE   = \"order.dlx.exchange\";\n    public static final String DLQ            = \"order.create.dlq\";\n\n    @Bean\n    public DirectExchange orderExchange() { return new DirectExchange(ORDER_EXCHANGE); }\n\n    /** 业务队列：绑定死信交换机，消费失败的消息转投 DLQ，人工兜底 */\n    @Bean\n    public Queue orderQueue() {\n        return QueueBuilder.durable(ORDER_QUEUE)          // 持久化队列\n                .deadLetterExchange(DLX_EXCHANGE)\n                .deadLetterRoutingKey(\"order.dead\")\n                .build();\n    }\n\n    @Bean\n    public DirectExchange dlxExchange() { return new DirectExchange(DLX_EXCHANGE); }\n\n    @Bean\n    public Queue dlq() { return QueueBuilder.durable(DLQ).build(); }\n\n    @Bean\n    public Binding orderBinding() {\n        return BindingBuilder.bind(orderQueue()).to(orderExchange()).with(\"order.create\");\n    }\n\n    @Bean\n    public Binding dlqBinding() {\n        return BindingBuilder.bind(dlq()).to(dlxExchange()).with(\"order.dead\");\n    }\n\n    /** 默认 SimpleMessageConverter 只支持基本类型；换成 JSON，收发对象都走 JSON */\n    @Bean\n    public MessageConverter jacksonConverter() { return new Jackson2JsonMessageConverter(); }\n}\n```\n\n```java\n@Service\n@RequiredArgsConstructor\n@Slf4j\npublic class OrderProducer {\n    private final RabbitTemplate rabbitTemplate;\n\n    public void sendOrderCreated(OrderMsg msg) {\n        rabbitTemplate.convertAndSend(RabbitConfig.ORDER_EXCHANGE, \"order.create\", msg);\n        log.info(\"已发送订单消息: {}\", msg.getOrderId());\n    }\n}\n\n@Component\n@RequiredArgsConstructor\n@Slf4j\npublic class OrderConsumer {\n    private final ObjectMapper objectMapper; // spring-boot-starter-web 自带\n\n    @RabbitListener(queues = RabbitConfig.ORDER_QUEUE)\n    public void onMessage(Message message, Channel channel) throws IOException {\n        long tag = message.getMessageProperties().getDeliveryTag();\n        try {\n            // Jackson2JsonMessageConverter 已配置时，参数直接声明为 OrderMsg 类型即可自动反序列化\n            OrderMsg msg = objectMapper.readValue(message.getBody(), OrderMsg.class);\n            handle(msg);\n            channel.basicAck(tag, false);            // 处理成功才确认\n        } catch (Exception e) {\n            log.error(\"消费失败\", e);\n            // requeue=false：不再回队列，直接转入死信队列，避免无限重投\n            channel.basicNack(tag, false, false);\n        }\n    }\n    private void handle(OrderMsg msg) { /* 业务逻辑 */ }\n}\n```\n\n## 🔧 常用命令 / API 速查\n\n| 操作 | 命令 / API |\n| --- | --- |\n| 管理台 | http://localhost:15672（guest/guest），查看队列、堆积、消费者 |\n| 列出队列 | `docker exec rabbitmq rabbitmqctl list_queues name messages consumers` |\n| 创建用户 | `rabbitmqctl add_user app 123456 && rabbitmqctl set_permissions -p / app \".*\" \".*\" \".*\"` |\n| 发消息 | `rabbitTemplate.convertAndSend(exchange, routingKey, object)` |\n| 收消息 | `@RabbitListener(queues = \"xxx\")` 标注在方法上 |\n| 手动确认 | `channel.basicAck(tag, false)` / 拒绝 `channel.basicNack(tag, false, requeue)` |\n\n**四种交换机**：\n\n| 类型 | 路由规则 | 示例 |\n| --- | --- | --- |\n| direct | RoutingKey **精确匹配** | `order.create` 只进绑定了该 key 的队列 |\n| topic | RoutingKey **模式匹配**：`#` 多级、`*` 一级 | `order.*` 匹配 `order.create`；`order.#` 匹配 `order.create.success` |\n| fanout | 广播，忽略 RoutingKey，投给所有绑定队列 | 配置变更通知所有服务实例 |\n| headers | 按消息 header 匹配（性能差，少用） | — |\n\n## 🧠 核心进阶\n\n### 1. 消息不丢的全链路（必须会讲）\n\n```\n生产者 ──①Confirm确认──> Broker(交换机/队列/消息持久化②) ──> 消费者 ──③手动ACK后才删除\n   │                        │ 路由不到队列 → ④备用交换机兜底\n   └─ 发送失败重试/记录表补偿 ─┘ 消费失败 → ⑤重试N次后进死信队列，人工处理\n```\n\n- **①生产者 Confirm**：消息到达 Broker 后异步回调 `ConfirmCallback`（`publisher-confirm-type: correlated`），失败则重发或落库补偿；`publisher-returns: true` + `ReturnCallback` 捕获\"到了交换机但路由不到队列\"的消息；\n- **②Broker 端持久化**：交换机 `durable`、队列 `durable`、消息 `deliveryMode=2`（用 Spring AMQP 发对象默认持久化），三者缺一不可；配合镜像/仲裁队列防止单机磁盘损坏；\n- **③消费者手动 ACK**：`acknowledge-mode: manual`，处理成功才 `basicAck`；未 ACK 时消费者挂掉，消息会重新投递给其他消费者；\n- **⑤死信队列（DLX）**：消息被 `nack(requeue=false)`、被拒绝、或 TTL 到期、或队列超长时，转发到死信交换机，最终落在死信队列里由人工/补偿任务处理——**这是排查\"消息去哪了\"的关键**。\n\n### 2. 幂等消费（重复消费不可避免，必须兜底）\n\n消息**至少一次投递**（At Least Once），网络抖动、ACK 丢失都会导致重复。方案：**唯一消息 ID + 去重表**——\n\n```java\n// 发送端：msg.setMessageId(UUID.randomUUID().toString());\n// 消费端：先查去重表（业务库一张表，消息ID唯一索引）\nif (messageLogMapper.existsByMsgId(msgId)) { channel.basicAck(tag, false); return; } // 已处理过，直接确认\nhandle(msg);\nmessageLogMapper.insert(msgId); // 与业务操作放同一事务\n```\n\n### 3. 延迟队列的两种实现\n\n- **TTL + 死信**：给队列设 TTL，到期后转入死信交换机实现延迟。缺陷：**队列头阻塞**——前面 10 分钟的消息没消费，后面 1 分钟的到期了也出不来（FIFO 限制）；\n- **延迟插件**（推荐）：安装 `rabbitmq_delayed_message_exchange`，交换机类型声明为 `x-delayed-message`，发送时设置 `x-delay`，消息到点才投递，无队头阻塞。\n\n### 4. 其他能力\n\n- **优先级队列**：声明队列时设 `x-max-priority`，高优先级消息优先投递（如 VIP 订单）；\n- **集群与高可用**：经典集群只共享元数据不共享消息；镜像队列（classic）每节点全量复制，性能开销大已不推荐；**仲裁队列 Quorum Queue**（3.8+）基于 Raft 多数派写入，官方当前推荐。\n\n## 💼 高频面试题\n\n**Q：四种交换机的区别？**\n- direct：RoutingKey 精确匹配；topic：`#`/`*` 模式匹配，最灵活；\n- fanout：广播给所有绑定队列，忽略 RoutingKey；headers：按 header 匹配，少用；\n- 业务里最常用 direct（点对点）和 topic（多订阅、分级路由）。\n\n**Q：怎么保证消息不丢？（全链路）**\n- 生产端：Confirm 确认 + ReturnCallback，失败重发或落库补偿；\n- Broker 端：交换机、队列、消息三个层面都持久化，配合仲裁队列防单点；\n- 消费端：手动 ACK，处理成功才确认；失败进重试，多次失败进死信队列人工兜底。\n\n**Q：重复消费怎么办？**\n- 重复不可避免（At Least Once），要在消费端做幂等；\n- 常用：唯一消息 ID + 去重表（消息 ID 加唯一索引，与业务同事务）；或用业务天然幂等键（订单号、`UPDATE ... WHERE status=待处理`）；\n- Redis `SETNX msgId` 做轻量去重也可以，但要考虑 Redis 不可用时的兜底。\n\n**Q：死信队列有什么用？**\n- 三种进死信的情况：被 nack/reject 且不回队列、TTL 到期、队列超长；\n- 用途一：消费失败的兜底容器，避免阻塞正常队列，人工补偿；\n- 用途二：配合 TTL 实现延迟队列（订单超时取消）。\n\n**Q：RabbitMQ 和 Kafka 怎么选？**\n- 一句话：**业务级消息（低延迟、灵活路由、需要延迟/死信/优先级）选 RabbitMQ；日志流、大数据管道、超高吞吐、消息回溯选 Kafka**；\n- RabbitMQ 吞吐万级~十万级、微秒毫秒级延迟、消息确认后即删；Kafka 吞吐百万级、消息按 offset 保留可重复消费，但路由能力弱。\n\n## 🔗 推荐资料\n\n| 资料 | 说明 | 链接 |\n| --- | --- | --- |\n| JavaGuide 消息队列基础 | 消息队列通用知识：使用场景、可靠性、幂等 | https://javaguide.cn/high-performance/message-queue/message-queue.html |\n| JavaGuide 高可用系统设计指南 | 削峰、限流、降级等系统设计视角 | https://javaguide.cn/high-availability/high-availability-system-design.html |\n| 廖雪峰 Spring Boot 集成 RabbitMQ | Spring Boot 整合实操 | https://liaoxuefeng.com/books/java/springboot/index.html |\n| pdai 架构知识体系 | 异步/解耦/削峰在整体架构中的位置 | https://pdai.tech/md/arch/arch-z-overview.html |\n","ck":0},{"id":"f23","stage":5,"path":"05-中间件篇/03-Kafka.md","title":"03-Kafka","md":"# 03-Kafka\n\n> **阶段**：中间件篇 ｜ **建议时长**：3 天 ｜ **前置**：02-RabbitMQ（理解消息队列基本概念）\n\n## 🧩 它是什么，解决什么问题\n\nKafka 是 LinkedIn 开源的**分布式日志/流处理平台**，Scala+Java 编写，特点是**超高吞吐（单机百万级）、消息按 offset 持久化可回溯**，是日志采集、用户行为埋点、大数据管道（对接 Flink/Spark）领域的事实标准。\n\n**与 RabbitMQ 的定位差异**：RabbitMQ 面向\"业务消息\"，确认即删；Kafka 面向\"数据流\"，消息像日志文件一样顺序追加到磁盘，按保留策略（时间/容量）删除，**消费只移动 offset，不删除消息**——所以它能被多个系统反复消费、也能回溯重放。\n\n**核心概念（必须全部搞懂）**：\n\n| 概念 | 含义 |\n| --- | --- |\n| Broker | 一个 Kafka 服务节点 |\n| Topic | 消息的逻辑分类（如 order-topic） |\n| Partition | Topic 的物理分片，**并行度和顺序性的基本单位** |\n| Replica | 分区副本：1 Leader + N Follower，Leader 负责读写 |\n| Consumer Group | 消费组：组内分区分摊、组间广播 |\n| offset | 消息在分区内的唯一序号，消费进度就是\"提交到了哪个 offset\" |\n\n## 📌 典型使用场景\n\n| 业务场景 | 为什么用它 | 不用的后果 |\n| --- | --- | --- |\n| 日志采集（ELK 前置） | Filebeat→Kafka→Logstash→ES，缓冲+解耦，ES 挂了日志不丢 | 日志直写 ES，高峰打挂 ES 且无法回补 |\n| 用户行为埋点 | App/网页 PV/UV 事件流高吞吐写入，下游多系统消费 | 直接写库扛不住峰值，埋点丢失无法追溯 |\n| 大数据管道 | Flink/Spark 从 Kafka 消费做实时计算（实时大屏、风控） | 各计算任务直连业务库，互相影响 |\n| 大流量削峰 | 秒杀/活动消息排队，消费端按能力处理 | 瞬时流量冲垮下游 |\n| 消息回溯/重放 | 数据错了重置 offset 重新消费即可 | 传统 MQ 消费即删，错了只能人工补数 |\n\n## 🚀 快速上手\n\n### 1. Docker Compose 单机 KRaft 模式（无需 ZooKeeper）\n\n```yaml\n# docker-compose.yml\nservices:\n  kafka:\n    image: bitnami/kafka:3.7\n    container_name: kafka\n    ports:\n      - \"9092:9092\"\n    environment:\n      - KAFKA_CFG_NODE_ID=0\n      - KAFKA_CFG_PROCESS_ROLES=controller,broker      # KRaft：本机既是控制器又是 Broker\n      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093\n      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092\n      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT\n      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093\n      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER\n```\n\n```bash\ndocker compose up -d\n```\n\n### 2. 命令行创建 Topic、生产、消费\n\n```bash\n# 创建 topic：3 个分区\ndocker exec -it kafka kafka-topics.sh --bootstrap-server localhost:9092 \\\n  --create --topic order-topic --partitions 3 --replication-factor 1\n\n# 控制台生产（输入一行发一条）\ndocker exec -it kafka kafka-console-producer.sh \\\n  --bootstrap-server localhost:9092 --topic order-topic\n\n# 控制台消费（从头消费）\ndocker exec -it kafka kafka-console-consumer.sh \\\n  --bootstrap-server localhost:9092 --topic order-topic --from-beginning\n\n# 查看消费组积压\ndocker exec -it kafka kafka-consumer-groups.sh \\\n  --bootstrap-server localhost:9092 --describe --group order-group\n```\n\n### 3. Spring Boot 整合（KafkaTemplate + @KafkaListener）\n\n```xml\n<dependency>\n    <groupId>org.springframework.kafka<\/groupId>\n    <artifactId>spring-kafka<\/artifactId>\n<\/dependency>\n```\n\n```yaml\nspring:\n  kafka:\n    bootstrap-servers: localhost:9092\n    producer:\n      key-serializer: org.apache.kafka.common.serialization.StringSerializer\n      value-serializer: org.apache.kafka.common.serialization.StringSerializer\n      acks: all                        # 等所有 ISR 副本确认，最高可靠\n      properties:\n        enable.idempotence: true       # 幂等生产者\n    consumer:\n      group-id: order-group\n      auto-offset-reset: earliest      # 无初始位移时从头消费\n      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer\n      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer\n      enable-auto-commit: false        # 关闭自动提交，业务处理完手动提交\n    listener:\n      ack-mode: manual_immediate\n```\n\n```java\n@Service\n@RequiredArgsConstructor\npublic class OrderProducer {\n    private final KafkaTemplate<String, String> kafkaTemplate;\n    private final ObjectMapper objectMapper; // spring-boot-starter-web 自带\n\n    public void send(OrderMsg msg) throws Exception {\n        // key = 订单号：相同 key 哈希进同一分区，保证该订单的消息分区内有序\n        kafkaTemplate.send(\"order-topic\", msg.getOrderId(), objectMapper.writeValueAsString(msg));\n    }\n}\n\n@Component\n@Slf4j\npublic class OrderConsumer {\n    @KafkaListener(topics = \"order-topic\", groupId = \"order-group\")\n    public void onMessage(ConsumerRecord<String, String> record, Acknowledgment ack) {\n        log.info(\"partition={}, offset={}, key={}, value={}\",\n                record.partition(), record.offset(), record.key(), record.value());\n        // 业务处理（需幂等：可能重复消费）...\n        ack.acknowledge();   // 手动提交位移，防止处理中宕机丢消息\n    }\n}\n```\n\n## 🔧 常用命令 / API 速查\n\n| 操作 | 命令 / API |\n| --- | --- |\n| 创建 topic | `kafka-topics.sh --create --topic t --partitions 3 --replication-factor 2` |\n| 查看 topic 详情 | `kafka-topics.sh --describe --topic t`（看分区/Leader/ISR） |\n| 扩分区（只能加不能减） | `kafka-topics.sh --alter --topic t --partitions 6` |\n| 查看消费积压 | `kafka-consumer-groups.sh --describe --group g`（LAG 列） |\n| 重置 offset（回放） | `kafka-consumer-groups.sh --reset-offsets --group g --topic t --to-earliest --execute` |\n| 发送消息 | `kafkaTemplate.send(topic, key, value)` |\n| 消费消息 | `@KafkaListener(topics = \"t\", groupId = \"g\")` |\n\n## 🧠 核心进阶\n\n### 1. 分区机制与消息顺序\n\n- **为什么分区**：一个 Topic 的消息水平切到多个 Partition，分布在多个 Broker 上——这是 Kafka 横向扩容和并行消费的根基；\n- **分区策略**：指定了 partition 用指定值；有 key 按 `hash(key) % 分区数`；都没有则轮询/粘性分区（sticky，攒批更高效）；\n- **顺序保证**：Kafka 只保证**分区内有序**。需要\"同一业务实体有序\"就按业务 key（如订单号）路由到同一分区；需要全局有序只能 1 个分区（牺牲并行度）；\n- 注意：扩分区会改变 key→分区映射，破坏\"同 key 同分区\"，所以分区数尽量一次规划好。\n\n### 2. 消费组与 Rebalance\n\n- 消费组内**一个分区同一时刻只分配给一个消费者**（组间广播、组内负载均衡）；\n- 触发 rebalance 的三种情况：组内**成员增减**（消费者上/下线、宕机）、**分区数变化**、订阅的 topic 变化；\n- rebalance 期间整个消费组停止消费（类似 STW），生产环境要避免频繁 rebalance：合理设置 `session.timeout.ms`、`max.poll.interval.ms`，避免消费太慢被踢出；\n- 分区分配策略：Range、RoundRobin、Sticky、CooperativeSticky（增量 rebalance，停顿最短）。\n\n### 3. 可靠性三件套\n\n- **acks 三个级别**：`0`（发出即成功，可能丢）、`1`（Leader 写入即成功，Leader 挂了副本没同步则丢）、`all/-1`（等所有 ISR 副本写入，最可靠）；`all` 必须配合 `min.insync.replicas>=2`（至少 2 个副本同步成功），否则退化成\"单副本也行\"；\n- **ISR（In-Sync Replicas）**：与 Leader 保持同步的副本集合，落后的会被踢出 ISR；`all` 只需 ISR 内确认；\n- **幂等生产者**（`enable.idempotence=true`）：Broker 用 `<PID, 分区, 序列号>` 去重，解决生产者重试导致的单分区重复写入（不能跨分区跨会话）；跨分区原子写用**事务**（`transactional.id` + `initTransactions`）；\n- **位移提交与重复消费**：`enable.auto.commit=true` 按间隔自动提交，处理到一半宕机会**丢消息**（先提交后处理）；手动在**处理完成后提交**则宕机后重读 → **重复消费**。所以工程上\"先处理后提交 + 消费端幂等\"是标准答案。\n\n### 4. 为什么 Kafka 这么快（高频）\n\n1. **顺序写磁盘**：消息追加到日志文件末尾（append-only），磁盘顺序写速度接近内存；\n2. **页缓存（PageCache）**：读写都走 OS 页缓存，命中率高，JVM 不存消息数据（避免 GC 压力）；\n3. **零拷贝（sendfile）**：消费者拉取时数据从页缓存直接到网卡，不经过用户态，省 2 次拷贝 2 次上下文切换；\n4. **批量 + 压缩**：生产者攒批（`batch.size`/`linger.ms`）后整体压缩（lz4/snappy）发送，网络与磁盘 IO 都按批摊销；\n5. **拉模式消费**：Consumer 主动拉取，按自身能力控制速率，天然避免推模式压垮慢消费者。\n\n### 5. 消息积压的应急与根治（实战高频）\n\n- 现象：消费速度追不上生产速度，`kafka-consumer-groups.sh --describe` 的 **LAG（落后位移）持续增大**；\n- 应急：扩容消费者实例——**消费者数最多等于分区数**，多出来只会空转；分区数不够时新建多分区 topic，写程序把旧 topic 消息搬过去并行消费；\n- 根治：批量拉取（`max.poll.records`）+ 批量落库、消费逻辑异步化、非核心处理降级延后；\n- 预防：上线前压测确定\"分区数 : 消费者数\"配比，对 LAG 配置告警；\n- 提交方式坑：`enable.auto.commit=true` 是定时提交位移，与消费进度脱钩，业务系统一律改为手动提交。\n- 常见坑：频繁 rebalance（消费耗时超过 `max.poll.interval.ms` 被踢出）会雪上加霜，先调大该参数止血；\n- 另一个坑：`kafkaTemplate.send()` 是**异步**的，不 `get()` 阻塞等待或注册回调，发送失败是无感知的——可靠性要求高的场景必须检查发送结果。\n\n## 💼 高频面试题\n\n**Q：Kafka 为什么吞吐量这么高？**\n- 顺序写磁盘（append-only log）+ 页缓存，读写都不过 JVM 堆；\n- 零拷贝 sendfile，消费路径数据不进用户态；\n- 分区并行 + 生产端批量发送与压缩；\n- 消费端拉（pull）模式，按消费能力拉取，天然流控。\n\n**Q：Kafka 怎么保证消息不丢不重？**\n- 不丢：生产者 `acks=all` + `min.insync.replicas>=2` + 重试；Broker 副本机制；消费者先处理后手动提交 offset；\n- 不重（难完全做到）：生产端幂等生产者/事务解决 broker 侧重试重复；消费端必然可能重复（重试、rebalance），**靠业务幂等**（唯一键、去重表）兜底；\n- 口诀：生产 acks=all、Broker 副本、消费先处理再提交 + 幂等。\n\n**Q：消费者组是什么机制？什么时候 rebalance？**\n- 组内消费者分摊分区（一分区只归一个消费者），组间各自独立消费（广播）；\n- 触发：成员上/下线、分区数变化、订阅变化；\n- rebalance 期间整组停摆，生产要避免频繁触发；用 Sticky/CooperativeSticky 减少影响。\n\n**Q：Kafka 如何保证消息顺序？**\n- 全局只能保证分区内有序；\n- 业务上按关键 key（订单号/用户 ID）作为消息 key，哈希进同一分区，同一实体的消息先进先出；\n- 消费端同分区由同一线程处理（`max.poll` 单线程消费即可保证）。\n\n**Q：acks=1 会丢消息吗？**\n- 会。Leader 写入成功即返回，若 Leader 随即宕机且消息尚未同步给 Follower，新 Leader 上没有这条消息；\n- 关键业务用 `acks=all` + `min.insync.replicas=2` + `retries` 调大。\n\n## 🔗 推荐资料\n\n| 资料 | 说明 | 链接 |\n| --- | --- | --- |\n| JavaGuide 消息队列基础 | 消息队列通用知识与选型 | https://javaguide.cn/high-performance/message-queue/message-queue.html |\n| pdai 零拷贝 | sendfile/mmap 原理，理解 Kafka 快的关键 | https://pdai.tech/md/java/io/java-io-nio-zerocopy.html |\n| 廖雪峰 Spring Boot 集成 Kafka | Spring Boot 整合实操 | https://liaoxuefeng.com/books/java/springboot/index.html |\n| pdai 架构知识体系 | 消息队列在整体架构中的位置 | https://pdai.tech/md/arch/arch-z-overview.html |\n","ck":0},{"id":"f24","stage":5,"path":"05-中间件篇/04-RocketMQ.md","title":"04-RocketMQ","md":"# 04-RocketMQ\n\n> **阶段**：中间件篇 ｜ **建议时长**：3 天 ｜ **前置**：02-RabbitMQ、03-Kafka（理解消息队列与分区概念）\n\n## 🧩 它是什么，解决什么问题\n\nRocketMQ 是阿里开源、Java 编写的消息中间件，为**电商级业务场景**而生：吞吐十万级、毫秒级延迟，且把业务最需要的能力做成了原生特性——**事务消息、顺序消息、延迟消息、消息轨迹**。国内大厂（阿里系生态）用得极多，Spring Cloud Alibaba 体系默认 MQ。\n\n核心架构：\n\n```\nNameServer（无状态注册中心：Broker 上报路由，客户端来问地址）\n   ↑ 注册            │ 发现路由\nBroker（Master/Slave，消息存储与转发，存储单元是 CommitLog + ConsumeQueue）\n   ↑ ↓\nProducer ──发送──> Topic（逻辑分类，物理上由多个 MessageQueue 组成）──投递──> Consumer\n```\n\n| 概念 | 含义 | 与 Kafka 对比 |\n| --- | --- | --- |\n| NameServer | 轻量无状态路由中心 | 类似 ZK 但更简单，无选主 |\n| Broker | 存储转发节点 | 主从架构 |\n| Topic | 消息主题 | 同 Kafka |\n| MessageQueue | Topic 的分区 | 同 Kafka Partition |\n| Tag | 消息二级标签，用于过滤 | 类似子主题，Consumer 按 Tag 订阅 |\n\n## 📌 典型使用场景\n\n| 业务场景 | 为什么用它 | 不用的后果 |\n| --- | --- | --- |\n| 订单创建最终一致（事务消息） | 下单→扣库存/冻积分，用半消息+本地事务保证\"库和消息\"原子性 | 本地事务成功但消息没发出去，下游永远不知道 |\n| 延时发货/超时取消 | 原生延迟消息（18 个等级，5.x 支持任意延迟） | RabbitMQ 要 TTL+死信绕一圈，还有队头阻塞 |\n| 积分/优惠券异步发放 | 下单主流程发消息即返回，下游各自消费 | 串行调用下游，下单接口耗时叠加 |\n| 电商大促削峰 |
