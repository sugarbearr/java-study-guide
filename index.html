 A 里先写 `v = 1`（volatile）再写 `y = 2`（普通变量）；线程 B 读到 `v == 1` 后再读 `y`，则 **B 一定读到 `y == 2`**。推导链：A 中\"写 v 先于写 y\"（程序顺序规则）+ \"v 的写 happens-before B 对 v 的读\"（volatile 规则）+ B 中\"读 v 先于读 y\"（程序顺序规则），传递可得 y 的写对 B 可见——普通变量的写跟着 volatile 的写\"顺带\"可见了。反过来（先写普通变量、后写 volatile）不保证。\n\n### ⭐volatile\n\n面试官想听：两个保证（可见性、禁止重排）+ 一个不保证（原子性），最好带双重检查锁单例的例子。\n\n```java\npublic class Singleton {\n    private static volatile Singleton instance;   // 防止指令重排\n    public static Singleton getInstance() {\n        if (instance == null) {                   // 第一次检查：避免不必要加锁\n            synchronized (Singleton.class) {\n                if (instance == null) {           // 第二次检查\n                    instance = new Singleton();   // 分配内存->初始化->赋值，可能被重排\n                }\n            }\n        }\n        return instance;\n    }\n}\n```\n\n- `new` 对象不是原子操作：若无 volatile，另一线程可能在「赋值完成但未初始化」时拿到半成品。\n- volatile 适合**一写多读**或状态标志位（`volatile boolean running = false;`）；复合运算仍需锁或原子类。\n\n### ⭐synchronized 与锁升级\n\n面试官想听：三种用法对应不同锁对象；1.6 后锁升级路径（偏向→轻量级→重量级）说明 synchronized 并不重。\n\n- 三种用法：① 修饰实例方法（锁当前对象 this）；② 修饰静态方法（锁 Class 对象）；③ 同步代码块 `synchronized(obj)`（锁指定对象）。\n- 底层基于对象头的 Monitor（重量级锁依赖 OS mutex），Java 6 引入优化：**无锁 → 偏向锁（单线程反复进入）→ 轻量级锁（CAS 自旋）→ 重量级锁（线程挂起）**，只升不降。\n- 可重入：同一线程可重复获取自己持有的锁；异常会自动释放锁。\n- 注意 `String` 常量、Integer 缓存对象等被共享的锁对象，可能造成意外竞争。\n\n**公平锁与非公平锁**（synchronized 只有非公平语义，公平性见 ReentrantLock）：`new ReentrantLock(true)` 为公平锁，严格按队列顺序发放；**默认非公平**——新来的线程先 CAS 抢一次，抢到直接执行，省掉挂起/唤醒与排队的开销，上下文切换更少、吞吐更高。需要「排队保证」或防饥饿时才用公平模式或 `tryLock(fair)`/带超时的 `tryLock`。\n\n### 读写锁 ReentrantReadWriteLock 与 StampedLock\n\n- 锁分离：**读读并行、读写互斥、写写互斥**——state 高 16 位记读锁数、低 16 位记写锁重入数，适合「读多写少」（如本地配置缓存）。写线程可降级为读线程，**读锁不能升级为写锁**（会死锁）。\n- `StampedLock`（Java 8）：增加**乐观读** `tryOptimisticRead()`——只拿一个戳不加锁，读完 `validate(stamp)` 校验期间没被写过，冲突才升级为读锁；性能更高但**不可重入、不支持 Condition**，出问题时排查更难。\n\n### ⭐ReentrantLock 与 synchronized vs Lock\n\n面试官想听：默认用 synchronized，需要「可中断、超时、公平、多条件」四个能力之一才上 ReentrantLock。\n\n```java\nprivate final ReentrantLock lock = new ReentrantLock();       // true 为公平锁\nprivate final Condition notEmpty = lock.newCondition();\npublic void take() throws InterruptedException {\n    lock.lockInterruptibly();                                 // 可中断获取\n    try {\n        while (queue.isEmpty()) notEmpty.await();             // 条件等待（等价 wait）\n        // 取数据\n    } finally {\n        lock.unlock();                                        // 必须放 finally\n    }\n}\n```\n\n| 维度 | synchronized | ReentrantLock |\n|---|---|---|\n| 层级 | JVM 关键字，自动释放 | JDK API，手动 lock/unlock |\n| 可中断/超时 | 不支持 | `lockInterruptibly()`/`tryLock(超时)` |\n| 公平锁 | 不支持 | 构造参数可选 |\n| 条件变量 | 单一 wait/notify | 多个 Condition 精准唤醒 |\n\n### ⭐AQS（抽象队列同步器）\n\n面试官想听：JUC 里锁和同步工具的公共地基——一个 volatile int + 一条排队队列。\n\n- 核心：`volatile int state` 表示资源状态（ReentrantLock 中=重入次数，Semaphore 中=许可数，CountDownLatch 中=剩余计数）；抢不到就封装成节点进入 **CLH 变体的双向等待队列**，靠 `LockSupport.park()` 挂起，前序释放时 unpark 唤醒。\n- 模板方法模式：AQS 管排队与挂起/唤醒，子类只需实现 `tryAcquire/tryRelease`（独占）或 `tryAcquireShared/tryReleaseShared`（共享）——ReentrantLock、Semaphore、CountDownLatch、ReentrantReadWriteLock 都基于它。\n- 两种模式：**独占模式**（同一时刻只有一个线程持有，如 ReentrantLock）vs **共享模式**（多个线程可同时获取，如 Semaphore、CountDownLatch）。\n- 一句话记忆口径：**state 表示资源，队列表示排队的人**。\n\n### ⭐死锁：四条件与排查\n\n面试官想听：背出四个必要条件并给出「按序加锁」这个最实用的预防手段。\n\n- 四个必要条件：**互斥、持有并等待、不可剥夺、循环等待**，破坏任意一个即可预防（最常用：所有线程按相同顺序加锁；或 `tryLock` 带超时）。\n- 排查：`jstack pid` 末尾直接输出 `Found one Java-level deadlock`；jconsole 检测死锁按钮；代码上 `lock.tryLock(timeout)` 日志告警。\n\n### ⭐线程池：7 参数、执行流程与拒绝策略\n\n面试官想听：这是并发面试第一高频，参数、流程、拒绝策略必须一次说全，再补 Executors 的坑。\n\n```java\nThreadPoolExecutor pool = new ThreadPoolExecutor(\n        4, 8, 60, TimeUnit.SECONDS,\n        new ArrayBlockingQueue<>(100),\n        Thread::new,                       // 线程工厂：命名便于排障\n        new ThreadPoolExecutor.CallerRunsPolicy());\n```\n\n- **7 参数**：核心线程数 corePoolSize、最大线程数 maximumPoolSize、空闲存活时间 keepAliveTime、时间单位、任务队列 workQueue、线程工厂 threadFactory、拒绝策略 handler。\n- **执行流程**：核心线程未满则新建核心线程执行 → 满了进队列排队 → 队列满了再创建非核心线程至 maximum → 达到 maximum 则执行拒绝策略。\n- **4 种拒绝策略**：`AbortPolicy`（默认，抛 RejectedExecutionException）、`CallerRunsPolicy`（调用者线程自己执行，天然削峰）、`DiscardPolicy`（静默丢弃）、`DiscardOldestPolicy`（丢队首最旧任务再重试）。\n- **Executors 的坑**（阿里规约禁止）：`newFixedThreadPool/newSingleThreadExecutor` 用**无界队列** LinkedBlockingQueue，任务堆积可 OOM；`newCachedThreadPool` 最大线程数 Integer.MAX_VALUE，可无限建线程。**手动 new ThreadPoolExecutor**。\n- 线程数经验公式：CPU 密集型 ≈ **N核 + 1**；I/O 密集型 ≈ **N核 × (1 + 等待时间/计算时间)**，再压测校准。\n- 优雅关闭：`shutdown()`（等任务跑完）→ `awaitTermination` → 超时后 `shutdownNow()`。\n- `submit` 吞异常：异常存在返回的 Future 里，不调用 `get()` 就无人知晓——记得处理或用 execute。\n\n### ⭐CAS 与 Atomic、ABA 问题\n\n面试官想听：CAS = 比较并交换的 CPU 原子指令，知道它的三个问题：ABA、自旋开销、只能保一个变量。\n\n- CAS：`compareAndSwap(内存值V, 预期值E, 新值N)`，硬件级原子指令，失败自旋重试；`Unsafe` → `AtomicInteger` 等的实现基础。\n- **ABA 问题**：值从 A→B→A，CAS 以为没变过；用 `AtomicStampedReference`（版本号戳）解决。\n- 常用原子类：`AtomicInteger/AtomicLong`（`incrementAndGet`）、`AtomicReference`、`LongAdder`（分段累加，高并发计数优于 AtomicLong）。\n\n### ⭐ThreadLocal 原理与内存泄漏\n\n面试官想听：ThreadLocalMap 的 key 是弱引用这条链路，以及「为什么必须 finally 里 remove」。\n\n```java\nstatic ThreadLocal<SimpleDateFormat> DF =\n        ThreadLocal.withInitial(() -> new SimpleDateFormat(\"yyyy-MM-dd\"));\ntry {\n    use(DF.get());\n} finally {\n    DF.remove();          // 必须手动清理\n}\n```\n\n- 原理：每个 `Thread` 内有 `ThreadLocalMap`，key 是 ThreadLocal 对象（**弱引用**），value 是存的值（强引用）。\n- 泄漏链路：ThreadLocal 外部引用消失后 key 被 GC 变 null，但 value 仍被线程强引用，线程池线程长存 → value 永远无法回收。Entry 的 key 为 null 也不会被主动清。\n- 结论：线程池场景用完必须 `remove()`；用途：按线程隔离状态（如 SimpleDateFormat、用户上下文、链路 traceId）。\n\n### ⭐ConcurrentHashMap 1.7 vs 1.8\n\n面试官想听：分段的粒度从「Segment 二级哈希」进化到「单桶 CAS+synchronized」。\n\n- 1.7：`Segment` 分段锁（默认 16 段，继承 ReentrantLock），并发度=段数；两次 hash 定位。\n- 1.8：抛弃分段，**Node 数组 + 链表/红黑树**；put 时桶为空用 **CAS 插入**，冲突时 **synchronized 锁住桶头节点**，锁粒度更细、并发度更高。\n- size 统计用 `baseCount + CounterCell[]` 分片计数（LongAdder 思想）；扩容支持多线程协助迁移。\n- key/value 都不允许 null（并发下无法区分「不存在」与「值为 null」）。\n\n### JUC 容器补充：CopyOnWriteArrayList\n\n- 原理：写时复制——add/remove/set 时复制一份新数组改完再替换引用，读永远走旧数组，**迭代器不加锁且不会抛 ConcurrentModificationException**；适合读极多写极少（如监听器列表、黑白名单）。\n- 代价：每次写都复制整个数组，写开销大、内存翻倍峰值；且读到的可能是**旧快照**（弱一致性）。与 ConcurrentHashMap 并列记忆：都是「并发场景替代非线程安全集合」的方案，一个治 ArrayList，一个治 HashMap。\n\n### ⭐CountDownLatch / CyclicBarrier / Semaphore\n\n面试官想听：三个工具一句话定位——等 N 件事完成、凑 N 个人再一起走、只放行 M 个。\n\n- `CountDownLatch`：`countDown()` 减计数、`await()` 阻塞到 0；一次性，用于主线程等待多个子任务完成。\n- `CyclicBarrier`：N 个线程互相等待到齐后一起继续，可复用（可传回调）；用于分段计算后汇总。\n- `Semaphore`：许可数=并发上限，`acquire/release`；用于限流（如数据库连接数、接口并发数）。\n- 阻塞队列：`ArrayBlockingQueue`（有界数组）、`LinkedBlockingQueue`（默认无界链表）、`SynchronousQueue`（不存储、直接交接）、`DelayQueue/PriorityBlockingQueue`；`put/take` 自动阻塞，是生产者消费者的现成方案。\n\n### CompletableFuture 与虚拟线程\n\n```java\nCompletableFuture<String> price = CompletableFuture.supplyAsync(() -> queryPrice(id), pool);\nCompletableFuture<Integer> stock = CompletableFuture.supplyAsync(() -> queryStock(id), pool);\nprice.thenCombine(stock, (p, s) -> p + \" / \" + s)     // 两个结果合并\n     .orTimeout(2, TimeUnit.SECONDS)                  // 超时保护\n     .whenComplete((r, e) -> log.info(\"{}\", r, e));\n```\n\n- 异步编排三件套：`supplyAsync` 提交、`thenApply/thenAccept/thenCombine` 链式转换、`thenCompose` 串行依赖、`allOf/anyOf` 聚合多个任务。**必须传入自定义线程池**，默认池仍是 ForkJoinPool.commonPool。\n- 虚拟线程（Java 21 正式）：JVM 调度的轻量级线程（KB 级栈），`Thread.ofVirtual().start(...)` 或 `Executors.newVirtualThreadPerTaskExecutor()`；阻塞时自动挂起不占 OS 线程，**适合大量阻塞 I/O 任务**（一秒开万十个线程等下游）。\n- 虚拟线程不适合什么：① **CPU 密集任务无收益**——它解决的是「等待时不占 OS 线程」，计算量不变，还是 N 核；② 观念要变：**不池化**（创建极廉价，用完即弃，别再建 `newFixedThreadPool` 复用）、`ThreadLocal` 慎用以避免长生命周期对象泄漏（可考虑替代方案），且 synchronized 块内长时间阻塞会把载体线程一起占住（建议改用 ReentrantLock）。\n\n## 🛠 动手实践\n\n### 任务 1：三线程交替打印 ABC\n\n```java\nprivate static final Object lock = new Object();\nprivate static int state = 0;   // 0->A, 1->B, 2->C\n// 每个线程：synchronized (lock) { while (state % 3 != self) lock.wait(); print; state++; lock.notifyAll(); }\n```\n\n- 验收标准：连续输出 `ABCABCABC...` 至少 10 轮不乱序；用 wait/notifyAll（不能用 Thread.sleep 控制顺序）；能解释为什么用 while 而不是 if 判断条件（防止虚假唤醒）。\n\n### 任务 2：阻塞队列生产者消费者\n\n- 要求：`ArrayBlockingQueue<Integer>`（容量 5），3 个生产者各生产 100 个随机数，2 个消费者取出求和；用「毒丸对象」通知消费者退出。\n- 验收标准：程序正常退出且总和打印完整；生产过快时观察 `put` 阻塞（有界队列生效）；改用手写 `wait/notifyAll` 版本对比一次。\n\n### 任务 3：线程池批处理统计耗时\n\n- 要求：用 `new ThreadPoolExecutor(4, 8, ...)` 提交 1000 个模拟任务（`Thread.sleep(1)`），统计总耗时；分别设置 CPU 密集（sleep 0）与 I/O 密集（sleep 10）参数对比线程数公式。\n- 验收标准：记录不同 corePoolSize 下的耗时对比数据；拒绝策略演示触发过一次（队列调小）；所有线程有命名（自定义 ThreadFactory）。\n\n## 💼 高频面试题\n\n**Q：创建线程有几种方式？⭐**\n- 继承 Thread 重写 run；实现 Runnable 交给 Thread；实现 Callable 配 FutureTask 拿返回值；线程池提交任务。\n- 本质上只有「new Thread().start()」一种启动方式，其他都是任务形态差异。\n- 实践必须用线程池：复用线程、统一管控、避免频繁创建销毁。\n\n**Q：线程有哪些状态？⭐**\n- 6 种：NEW、RUNNABLE、BLOCKED、WAITING、TIMED_WAITING、TERMINATED。\n- 调 start 后进入 RUNNABLE；等 synchronized 进入 BLOCKED；wait/join/park 进入 WAITING；带超时版本进入 TIMED_WAITING。\n- sleep 不释放锁、wait 释放锁且必须在同步块内。\n\n**Q：volatile 和 synchronized 的区别？⭐**\n- volatile 只保证可见性和有序性，不保证原子性；synchronized 三性都保证。\n- volatile 是轻量级无锁方案，适合状态标志、一写多读；synchronized 互斥执行，适合复合操作。\n- volatile 不阻塞线程；synchronized 可能阻塞。volatile 修饰变量，synchronized 修饰方法/代码块。\n\n**Q：说说线程池的核心参数与任务执行流程。⭐**\n- 7 参数：corePoolSize、maximumPoolSize、keepAliveTime、时间单位、workQueue、threadFactory、拒绝策略 handler。\n- 流程：核心线程未满直接新建执行 → 满了进队列 → 队列满再建线程到最大值 → 达到最大值执行拒绝策略。\n- 四种拒绝策略：Abort（抛异常）、CallerRuns（调用者执行）、Discard（丢弃）、DiscardOldest（丢最旧）。\n\n**Q：线程池大小怎么定？**\n- CPU 密集型：N+1（N 为核心数），避免过多上下文切换。\n- I/O 密集型：N × (1 + 等待时间/计算时间)，等待占比越大线程越多。\n- 经验值需压测校准；区分业务用独立线程池，避免相互影响。\n\n**Q：ThreadLocal 为什么会内存泄漏？⭐**\n- 每个 Thread 持有 ThreadLocalMap，key 是弱引用的 ThreadLocal，value 是强引用。\n- ThreadLocal 被回收后 key 变 null，value 无法访问但被长生命周期线程（线程池）强引用，无法回收。\n- 规范：使用完（尤其线程池场景）必须在 finally 中 remove()。\n\n**Q：CAS 是什么？有什么问题？**\n- Compare And Swap：比较内存值与预期值，相等则替换为新值，由 CPU 原子指令保证，失败自旋重试。Atomic 类的底层。\n- 问题：ABA（用 AtomicStampedReference 加版本号解决）、自旋开销（竞争激烈时 CPU 空转）、只能保证单个变量原子性。\n- 典型应用：AtomicInteger 计数、ConcurrentHashMap 空桶插入。\n\n**Q：ConcurrentHashMap 如何保证并发安全？1.7 和 1.8 区别？⭐**\n- 1.7：Segment 分段锁（默认 16 段 ReentrantLock），锁一段。\n- 1.8：CAS + synchronized 锁单个桶头节点，粒度更细并发更高；链表过长转红黑树。\n- size 用 CounterCell 分片计数；不允许 null key/value。\n\n**Q：sleep 和 wait 的区别？**\n- 所属：Thread.sleep 是静态方法；wait 是 Object 方法。\n- 锁：sleep 不释放锁；wait 释放对象锁。\n- 场景：wait/notify 配合做线程间通信，必须在 synchronized 内；sleep 单纯休眠。\n\n**Q：死锁怎么产生、怎么排查和避免？**\n- 四个必要条件：互斥、持有并等待、不可剥夺、循环等待。\n- 排查：jstack 输出 Found one Java-level deadlock；jconsole 检测死锁。\n- 避免：全局固定加锁顺序、tryLock 带超时、减小锁粒度、用并发工具替代手写锁。\n\n## 🔗 推荐资料\n\n| 资料 | 说明 | 链接 |\n|---|---|---|\n| 廖雪峰 Java 多线程 | 线程基础到同步机制的主线教程 | https://liaoxuefeng.com/books/java/threading/index.html |\n| pdai 并发知识体系 | JMM/锁/线程池/JUC 全景与源码索引 | https://pdai.tech/md/java/thread/java-thread-x-overview.html |\n| JavaGuide 并发面试题 | 本章所有面试题的标准展开版本 | https://javaguide.cn/java/concurrent/java-concurrent-questions-01.html |\n","ck":0},{"id":"f10","stage":2,"path":"02-进阶篇/02-JVM核心.md","title":"02-JVM核心","md":"# 02-JVM核心\n\n> **阶段**：进阶篇 ｜ **建议时长**：5 天 ｜ **前置**：建议先学 01-多线程与并发编程.md\n\n## 🎯 学习目标\n\n- 能默画运行时数据区五块区域，并说明哪些线程共享、哪些线程私有。\n- 能演示三种 OOM（堆、栈、元空间）并说出对应参数。\n- 能讲清类加载五阶段、双亲委派模型及其打破场景。\n- 掌握 GC 判活算法、四种引用、三大回收算法与 G1 的核心特点。\n- 会用 jps/jstat/jmap/jstack/arthas 完成 CPU 飙高与 Full GC 频繁的排查。\n\n## 📖 核心知识点\n\n### ⭐运行时数据区\n\n面试官想听：先分「线程私有 vs 共享」再逐区说职责与 OOM 表现，这是 JVM 面试的第一题。\n\n```\n线程私有：程序计数器 ｜ 虚拟机栈（栈帧：局部变量表/操作数栈/动态链接/返回地址）｜ 本地方法栈\n线程共享：堆（对象实例；分新生代 Eden+2*Survivor / 老年代）｜ 元空间 Metaspace（类元数据）\n```\n\n- **程序计数器**：当前线程字节码执行行号，唯一不会 OOM/StackOverflow 的区域。\n- **虚拟机栈**：每个方法调用压入一个栈帧；递归过深抛 `StackOverflowError`；线程过多也可能 OOM（无法创建本地线程）。\n- **堆**：GC 主战场；`-Xms` 初始大小、`-Xmx` 最大大小；分配不下的对象抛 `java.lang.OutOfMemoryError: Java heap space`。\n- **元空间**（Java 8 取代永久代）：存类元信息、常量池（运行时常量）、静态变量移至堆（Java 8 起在堆中）；用本地内存，`-XX:MaxMetaspaceSize` 限制，动态生成类过多会 OOM: Metaspace。\n- 直接内存（NIO DirectByteBuffer）：不属于运行时数据区但受 `-XX:MaxDirectMemorySize` 限制。\n\n### 对象创建与内存布局\n\n- 创建流程：检查类是否已加载 → 分配内存（指针碰撞/空闲列表；TLAB 线程私有缓冲避免并发竞争）→ 零值初始化 → 设置对象头（哈希码、GC 分代年龄、锁标志）→ 执行构造方法。\n- 内存布局三部分：**对象头**（Mark Word + 类型指针 + 数组长度）、**实例数据**、**对齐填充**（8 字节整数倍）。\n- 对象分配优先在 Eden（TLAB），大对象直接进老年代（`-XX:PretenureSizeThreshold`），长期存活（年龄 ≥ 15）晋升老年代。\n\n### 各区域 OOM 演示\n\n```java\nList<byte[]> heapLeak = new ArrayList<>();          // OOM: Java heap space\nwhile (true) heapLeak.add(new byte[1024 * 1024]);\n\npublic void stackOverflow(int i) { stackOverflow(i + 1); }   // StackOverflowError\n\n// OOM: Metaspace —— CGLIB/反射在循环里动态生成类不回收\n// 启动参数：-Xmx32m -Xss128k -XX:MaxMetaspaceSize=16m\n```\n\n- 排查的第一步永远是让 OOM 时自动 dump：`-XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp`。\n\n### ⭐类加载五阶段\n\n面试官想听：加载→验证→准备→解析→初始化的顺序，以及「准备阶段赋默认值、初始化阶段才执行 <clinit>」的细节。\n\n- **加载**：读取字节码生成 Class 对象；**验证**：格式/元数据/字节码/符号引用合法性；**准备**：为静态变量分配内存并赋**零值**（`static int a = 1` 此时 a=0；被 `static final` 修饰的常量则直接赋值）；**解析**：符号引用转直接引用；**初始化**：执行静态变量赋值与静态代码块（`<clinit>`，JVM 保证加锁、只执行一次）。\n- 触发初始化的时机（主动引用）：`new`、读写静态字段（非 final）、调用静态方法、反射、子类初始化触发父类、main 所在类。\n- 不触发初始化：通过子类引用父类静态字段、数组定义、访问 final 常量（编译期已入常量池）。\n- **`Class.forName` vs `ClassLoader.loadClass`**（高频对比）：`forName(\"全限定名\")` 默认 `initialize=true`，**加载 + 链接 + 初始化**全走完，会执行静态代码块——这正是 JDBC 老写法 `Class.forName(\"com.mysql.jdbc.Driver\")` 能注册驱动的原理（驱动类静态块里往 DriverManager 注册自己）；`loadClass(...)` 只做到**加载**（默认不解析、不初始化），只拿到 Class 对象、静态块不执行。需要加载即初始化用 forName，想延迟初始化用 `loadClass` 或 `forName(name, false, loader)`。\n- 验证练习：`static int a = 1; static int b;` 中准备阶段后 a=0、b=0，`<clinit>` 执行后 a 才等于 1；`static final int C = 1` 在准备阶段即赋值（ConstantValue 属性）。\n- 类加载器是隔离的基础：同一个 `.class` 被两个不同加载器加载会得到两个互不兼容的 Class 对象（`instanceof` 为 false），Tomcat 多应用隔离正基于此。\n\n### ⭐类加载器与双亲委派\n\n面试官想听：三层加载器 + 「先委托父加载器，父无法加载才自己加载」的流程，能说出安全与唯一性两个意义。\n\n```\nBootstrap（核心类库 rt.jar，C++ 实现）← 扩展类加载器 PlatformClassLoader ← 应用类加载器 AppClassLoader ← 自定义类加载器\n```\n\n- 流程：收到加载请求先向上委托，父加载器能加载就返回；都到顶仍失败才逐层向下由子加载器尝试。\n- 意义：① 安全——用户自定义 `java.lang.String` 不会被加载替换核心类；② 唯一——同一个类只被加载一次，保证 `Class` 对象全局唯一。\n- **打破双亲委派的场景**：SPI/JDBC（`Thread.contextClassLoader` 线程上下文类加载器反向委托）、OSGi/容器热部署（每个模块独立加载器）、Tomcat 的 WebappClassLoader（先自己加载 web 应用类实现隔离）。\n\n### ⭐GC Roots 可达性分析\n\n面试官想听：能列举至少四类 GC Roots，并说清与引用计数的对比（为什么 Java 不用引用计数）。\n\n- 可作为 GC Roots 的对象：**虚拟机栈（栈帧局部变量表）引用的对象、方法区类静态变量引用的对象、方法区常量引用的对象、JNI（本地方法栈）引用的对象、活跃线程、锁持有的对象**。\n- 从 Roots 出发不可达 ⇒ 可回收。相比引用计数，可达性分析能正确处理循环引用（Java 不用引用计数的核心原因）。\n- 四种引用（强 → 软 → 弱 → 虚）：强引用不回收；**软引用**内存不足才回收（缓存）；**弱引用**下次 GC 必回收（WeakHashMap、ThreadLocalMap 的 key）；虚引用仅用于回收通知（堆外内存管理）。\n\n### 回收算法与分代\n\n- **标记-清除**：标记可达后清除；缺点：效率不稳、内存碎片。\n- **标记-复制**：内存分两块，存活对象复制到另一半；无碎片、效率高，代价是可用内存减半——**适合存活率低的新生代**（Eden:S0:S1 = 8:1:1）。\n- **标记-整理**：存活对象向一端移动；无碎片但移动成本高——**适合存活率高的老年代**。\n- Minor GC：回收新生代，Eden 满触发，复制算法，STW 短；对象年龄 +1。\n- **Full GC（Major GC）触发条件**：老年代空间不足、元空间不足、`System.gc()` 建议、空间分配担保失败、大对象直接分配失败。STW 时间长，**线上要重点监控**。\n\n### ⭐垃圾收集器演进：CMS → G1 → ZGC\n\n面试官想听：按「追求更短停顿」这条主线串起演进，能说出 G1 三点核心设计。\n\n| 收集器 | 特点 | 局限 |\n|---|---|---|\n| Parallel GC（1.8 默认） | 吞吐量优先，多线程并行回收 | 停顿长 |\n| CMS（9 已移除） | 并发标记清除，停顿短 | 碎片、并发失败退化、CPU 敏感 |\n| **G1（9+ 默认）** | 分 Region 管理、可预测停顿（`-XX:MaxGCPauseMillis=200`）、整体标记整理+局部复制 | 大堆下的记忆集开销 |\n| ZGC/Shenandoah | 着色指针/读屏障，停顿 <1ms，支持 TB 级堆 | 吞吐略有损耗，版本要求高 |\n\n- **G1 三个关键词**：Region 化布局（不再物理分代，逻辑上分 Eden/Survivor/Old/Humongous）、按停顿目标优先回收「垃圾最多」的 Region（Garbage First 得名）、并行并发混合回收。\n\n**停顿与吞吐的权衡（`-XX:MaxGCPauseMillis` 的调优逻辑）**：G1 每次回收前会按停顿目标**挑选一批 Region 组成回收集合（Collection Set）**——目标越小，单次能收的 Region 就越少，同样的垃圾量就要分更多次、更频繁地回收，**GC 总耗时（吞吐开销）随之上升**。所以「把停顿目标从 200ms 调到 50ms，停顿确实短了、但吞吐明显下降」是预期行为，而不是参数写错了：停顿与吞吐本质是一对矛盾，目标定得越激进，可用于业务线程的 CPU 时间越少。调参口径：先定一个\"业务能接受的最大停顿\"，再观察是否真的达成，不要盲目往小调。\n\n### ⭐三色标记与并发标记的漏标问题\n\n面试官想听：能说清「三色标记为什么会漏标」以及 CMS 与 G1 各自的解法差异，这是并发收集器的高频深挖点。\n\n- **三色抽象**：白色（未访问，最终仍白 = 可回收）、灰色（已访问、其引用还没扫完，在待处理队列里）、黑色（已访问且引用全部扫完）。标记过程就是灰对象不断变黑、白对象不断变灰。\n- **并发标记的难点**：标记线程与应用线程同时跑，应用线程改引用会破坏标记。**漏标**（活对象被当成垃圾）需要同时满足两个条件：\n  1. 黑色对象**新增**了指向白色对象的引用；\n  2. 从灰色对象到该白色对象的**路径被删除**（灰色不再直接或间接引用它）。\n- 破坏其中任一条件即可解决，两种方案由此分野（都靠**写屏障**在引用赋值处插入一小段记录逻辑）：\n\n| 方案 | 收集器 | 屏障类型 | 记录内容 | 重新标记阶段做什么 |\n|---|---|---|---|---|\n| **增量更新**（incremental update） | CMS | **写后**屏障 | 黑 → 白的新引用（把黑对象重新变灰） | 以这些黑对象为根再扫一遍 |\n| **SATB**（原始快照，snapshot-at-the-beginning） | G1、Shenandoah | **写前**屏障 | 引用**被删除前**的旧值（把旧白对象当活） | 以删除前的对象图为快照，扫描被记录的旧引用 |\n\n- 记忆口诀：**增量更新盯「新增」，SATB 盯「删除」**；对应写后屏障 vs 写前屏障。\n- 代价对比：SATB 会把标记开始后实际已死的对象也当活的（浮动垃圾，下次 GC 再收），但不需要重新扫描整个堆；增量更新浮动垃圾少，但重新标记阶段要多扫一批黑对象，停顿更长。G1 选 SATB 是为了「可预测停顿」。\n\n### ⭐安全点（Safepoint）\n\n面试官想听：说清「为什么需要安全点」——因为很多操作要求线程处于一致状态，不能想停就停。\n\n- **定义**：代码中一些特定位置，线程执行到这些点时才允许被 JVM 挂起（进入 STW）。GC、偏向锁撤销、线程 dump、类卸载等操作都要求**所有线程都停在安全点**才能开始。\n- **到达方式**：不是\"从外部强行暂停线程\"，而是**主动轮询**——JVM 在安全点位置插入轮询指令（poll），线程执行到时检查\"是否该停\"，是则自己挂起。所以 STW 的停顿包含\"等所有线程跑到安全点\"的时间。\n- **OopMap**：解释器/JIT 在每个安全点位置记录了**栈和寄存器中哪些位置存的是对象引用**（OopMap），GC 到达安全点后据此**快速准确地找到 GC Roots**，无需扫描整个栈——这是\"准确式 GC\"的基础。\n- **安全点与长循环**：若循环体内没有安全点轮询（如 counted loop 的边界情况），线程会长期无法挂起，导致 STW 停顿被拉长。现代 JVM 用 `-XX:+UseCountedLoopSafepoints`（JDK 10+ 默认开启）在长循环中插入轮询解决。\n- 排查：GC 日志中 `Total time for which application threads were stopped` 明显偏高但 GC 本身不慢时，往往是\"到达安全点耗时\"（time to safepoint）在作祟。\n\n### 常用 JVM 参数表\n\n| 参数 | 作用 | 常用值 |\n|---|---|---|\n| -Xms / -Xmx | 堆初始/最大（两者设为相同避免抖动） | 2g / 2g |\n| -Xss | 单线程栈大小 | 512k~1m |\n| -Xmn | 新生代大小 | 堆的 1/3 |\n| -XX:MetaspaceSize / MaxMetaspaceSize | 元空间初始/上限 | 256m |\n| -XX:MaxGCPauseMillis | G1 停顿目标 | 200 |\n| -XX:+HeapDumpOnOutOfMemoryError | OOM 自动 dump | 开启 |\n| -XX:+PrintGCDetails（或 -Xlog:gc*） | GC 日志 | 开启 |\n| -XX:SurvivorRatio / PretenureSizeThreshold | Eden 比 / 大对象阈值 | 8 / 视情况 |\n\n### ⭐排查工具箱与两个经典案例\n\n面试官想听：工具会一个一个报出名字，并按固定套路描述排查过程，这是校招/社招的「过程分」。\n\n- 工具：`jps`（进程号）、`jstat -gcutil pid 1000`（GC 统计）、`jmap -heap`/`jmap -dump:live,format=b,file=heap.hprof pid`（堆转储）、`jstack pid`（线程栈）、`jinfo`、图形化 jconsole/VisualVM/MAT/JProfiler、在线诊断 **Arthas**（`dashboard`、`thread -n 3`、`heapdump`、`trace`）。\n- Arthas 三步上手：`curl -O arthas-boot.jar` 启动选择进程 → `dashboard` 总览线程/内存/GC → `thread -b` 直接找死锁、`watch 类名 方法名 '{params,returnObj}'` 观察入参出参，无需重启应用。\n\n**CPU 100% 排查流程：**\n1. `top` 找到高 CPU 的 Java 进程 PID。**注意 top 里单核上限是 100%，Java 进程是多线程的，占用可以超过 100%**——显示 380% 意思是\"约 3.8 个核被这个进程吃满\"（多核累加），不是异常。多个业务线程并行计算、GC 线程并发、或死循环跑在多线程上都会如此；核数少于 400% 时说明确实压满了可用 CPU。\n2. `top -Hp pid` 找到该进程内高 CPU 的线程 TID。\n3. `printf '%x' TID` 把线程号转十六进制。\n4. `jstack pid | grep -A 30 '0x十六进制'` 定位线程栈，看它卡在哪个业务方法。\n5. 常见原因：死循环、正则回溯、频繁 Full GC（GC 线程本身占满）。\n\n**内存泄漏排查思路：**\n1. 现象确认：jstat 观察 Old 区持续上涨、Full GC 后回收很少。\n2. `jmap -dump` 导出堆快照（或 OOM 自动 dump）。\n3. MAT/VisualVM 分析支配树，找 Retained Size 最大的对象链，定位到持有引用的业务代码。\n4. 常见泄漏源：静态集合只增不减、ThreadLocal 未 remove、监听器/回调未注销、连接未关闭。\n\n## 🛠 动手实践\n\n### 任务 1：堆 OOM 复现并用 jmap 定位\n\n- 要求：用 `-Xmx32m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp` 启动一段「List 持续添加 1MB 数组」的代码，触发 OOM；用 MAT 或 `jmap -histo pid` 找到占用最大的类型。\n- 验收标准：能截出 OOM 日志与 dump 分析图；能说出「哪一行代码持有引用、为什么 GC 无法回收」；写出让堆存活参数生效的完整启动命令。\n\n### 任务 2：jstack 分析死锁\n\n- 要求：写两个线程互锁（A 锁 o1 等 o2，B 锁 o2 等 o1），启动后执行 `jstack pid`。\n- 验收标准：找到输出中的 `Found one Java-level deadlock` 段落并贴出两个线程的栈帧；能按栈信息对上代码中两把锁的获取顺序；改造成按序加锁后死锁消失。\n\n### 任务 3：jstat 观察 Full GC\n\n- 要求：程序周期性创建大对象但不持有引用，再改造成持续持有引用两个版本；`jstat -gcutil pid 500` 观察 Eden/Survivor/Old/FGC 变化。\n- 验收标准：能解释 YGC 与 FGC 列数值的变化含义；第二版本出现 Old 持续增长、FGC 次数上升；总结一行结论（Old 涨且 FGC 不降 ≈ 泄漏嫌疑）。\n\n## 💼 高频面试题\n\n**Q：说说 JVM 运行时内存区域。⭐**\n- 线程私有：程序计数器（行号）、虚拟机栈（栈帧，StackOverflowError 发生地）、本地方法栈。\n- 线程共享：堆（对象实例，分新生代/老年代）、元空间（类元数据，Java 8 取代永久代，用本地内存）。\n- 再补一句各区域对应的 OOM 类型，体现理解深度。\n\n**Q：对象什么时候进入老年代？⭐**\n- 年龄达到阈值（默认 15，CMS 6）长期存活的对象。\n- 大对象直接进入老年代（避免 Eden 与 Survivor 间反复复制）。\n- Minor GC 后 Survivor 放不下的对象通过空间分配担保提前进入老年代；动态年龄判断：同龄对象总大小超 Survivor 一半，该年龄及以上直接晋升。\n\n**Q：如何判断对象可以被回收？⭐**\n- 可达性分析：从 GC Roots（栈局部变量、静态变量、常量、JNI 引用、活跃线程等）出发，不可达即可回收。\n- 引用计数无法处理循环引用，JVM 不采用。\n- 补充四种引用强度：强不回收、软引用内存不足回收、弱引用下次 GC 回收、虚引用仅通知。\n\n**Q：G1 和 CMS 的区别？为什么 G1 成为主流？⭐**\n- CMS 标记-清除产生碎片，并发失败退化 Serial Old；G1 整体标记整理无碎片。\n- G1 按停顿目标优先回收垃圾最多的 Region，停顿可预测可控；CMS 只针对老年代，G1 全堆统一管理。\n- CMS 已在 Java 9 移除，G1 自 Java 9 起为默认收集器。\n\n**Q：类加载过程与双亲委派模型。⭐**\n- 五阶段：加载、验证、准备（静态变量赋零值）、解析、初始化（执行 <clinit>）。\n- 双亲委派：收到请求先委托父加载器，直到 Bootstrap，父加载不了才自己加载。\n- 意义：防止核心类被篡改、保证类全局唯一。打破场景：SPI 的线程上下文类加载器、Tomcat 隔离部署、热部署。\n\n**Q：线上 CPU 飙高怎么排查？⭐**\n- top 找高 CPU 进程 → top -Hp 找高 CPU 线程 → printf '%x' 转十六进制 → jstack 按线程号 grep 定位栈帧。\n- 常见根因：死循环、正则回溯灾难、频繁 GC（看 jstat）。\n- 有条件用 Arthas：thread -n 3 一步定位，dashboard 总览。\n\n**Q：Full GC 频繁怎么排查？⭐**\n- 先看 GC 日志/jstat 确认频率与每次回收量：Old 回收后仍高 ⇒ 疑似泄漏，dump 分析大对象链。\n- 回收后 Old 很低但仍频繁触发 ⇒ 检查堆太小、MetaSpace 不足、System.gc() 调用、内存分配速率过高。\n- 手段组合：GC 日志 + jmap dump + MAT 支配树；优化方向：调大堆/元空间、修泄漏、对象池化、降低分配速率。\n\n**Q：有哪些 JVM 调优参数是你常用的？**\n- -Xms=-Xmx 固定堆、-Xss 栈、-XX:MaxMetaspaceSize、-XX:MaxGCPauseMillis（G1 停顿目标）。\n- 排障三件套：HeapDumpOnOutOfMemoryError、GC 日志、（容器环境）-XX:+UseContainerSupport。\n- 强调：调优基于监控数据，不是背参数。\n\n## 🔗 推荐资料\n\n| 资料 | 说明 | 链接 |\n|---|---|---|\n| pdai JVM 内存结构 | 运行时数据区图文详解 | https://pdai.tech/md/java/jvm/java-jvm-struct.html |\n| pdai JVM 垃圾回收 | GC 算法与收集器演进梳理 | https://pdai.tech/md/java/jvm/java-jvm-gc.html |\n| pdai 类加载机制 | 双亲委派与打破场景 | https://pdai.tech/md/java/jvm/java-jvm-classload.html |\n| JavaGuide JVM 面试题 | 本章面试题的完整版答案 | https://javaguide.cn/java/jvm/jvm-interview-questions.html |\n","ck":0},{"id":"f11","stage":2,"path":"02-进阶篇/03-IO模型与网络编程.md","title":"03-IO模型与网络编程","md":"# 03-IO模型与网络编程\n\n> **阶段**：进阶篇 ｜ **建议时长**：3 天 ｜ **前置**：01-环境搭建与基础语法.md\n\n## 🎯 学习目标\n\n- 能对比 TCP 与 UDP 的特性与适用场景，讲清三次握手/四次挥手及「为什么三次」。\n- 会写 Socket TCP 客户端/服务端小程序，会用 Java 11 HttpClient 发请求。\n- 能画/说 BIO、NIO、AIO 的差异，解释 NIO 三大件与多路复用（select/poll/epoll）。\n- 能解释零拷贝的两个核心系统调用及其收益。\n- 能说出 Netty 的定位与高性能的四个原因。\n\n## 📖 核心知识点\n\n### ⭐TCP vs UDP\n\n面试官想听：连接性、可靠性、有序性、速度四个维度对比 + 一个各自的典型应用。\n\n| 维度 | TCP | UDP |\n|---|---|---|\n| 连接 | 面向连接（握手挥手） | 无连接，直接发 |\n| 可靠性 | 可靠：确认重传、滑动窗口、流量/拥塞控制 | 尽力而为，可能丢包乱序 |\n| 数据形态 | 字节流（无消息边界） | 数据报（有边界） |\n| 速度/开销 | 头部 20 字节起，握手有延迟 | 头部 8 字节，低延迟 |\n| 场景 | HTTP、文件传输、数据库连接 | DNS、视频直播、游戏、心跳广播 |\n\n- TCP 可靠传输三板斧：**确认应答（ACK）+ 超时重传**保证不丢；**序号 + 接收缓冲重排**保证有序；**滑动窗口**限速（流量控制）+ **拥塞控制**（慢启动、拥塞避免）保护网络。\n\n### ⭐三次握手 / 四次挥手\n\n面试官想听：能画出双向确认的过程，并回答「为什么握手是三次、挥手是四次」两个为什么。\n\n- **三次握手（建立连接）**：客户端发 SYN → 服务端回 SYN+ACK → 客户端再回 ACK，连接建立。\n- 为什么三次：确认**双方的收发能力都正常**；两次无法让服务端确认「客户端能收到我的包」，同时防止历史（过期）SYN 重复建立连接。\n- **四次挥手（断开连接）**：主动方 FIN → 对方 ACK → 对方（数据发完后）FIN → 主动方 ACK，进入 **TIME_WAIT** 等 2MSL 后关闭。\n- 为什么四次：TCP 全双工，两个方向的关闭各自独立，ACK 和 FIN（被动方收到 FIN 后可能还有数据要发）不能合并，故 ACK、FIN 分开发送。\n- TIME_WAIT 的意义：确保最后的 ACK 若丢失可重传、让旧报文在网络中消亡；大量 TIME_WAIT 常见于短连接服务，可调 `tcp_tw_reuse` 优化。\n\n### HTTP 基础\n\n- 请求报文：请求行（方法 URL 版本）+ 请求头 + 空行 + 请求体；响应报文：状态行 + 响应头 + 响应体。\n- 常见状态码：**200 成功、301/302 重定向、400 客户端请求错误、401 未认证、403 禁止、404 未找到、500 服务器内部错误、502 网关错误、504 网关超时**。\n- **GET vs POST**：语义上 GET 获取（幂等、参数在 URL、可缓存可收藏）；POST 提交（不幂等、参数在 body）；本质都是 TCP 上的报文，区别是约定而非硬性限制。\n\n### HTTPS 握手概念\n\n- TLS 在 TCP 与 HTTP 之间：① 客户端请求并携带支持的加密套件；② 服务端返回证书；③ 客户端用内置 CA 验证证书，生成随机预主密钥并用**服务端公钥**加密发送；④ 双方据其算出对称密钥，之后用**对称加密**通信。\n- 混合加密的原因：非对称加密安全但慢，只用来交换密钥；数据传输用快的对称加密。这一过程同时解决机密性与身份认证（证书）。\n\n**抓包工具为什么能解密 HTTPS？**（Charles / Fiddler / mitmproxy 的原理）：TLS 本可防中间人，但抓包工具做的是**「被信任的中间人」**——它自签一套根证书，诱导你把这张根证书装进系统/浏览器的信任库，之后：\n\n1. 客户端与抓包工具建立第一条 TLS 连接——握手时工具返回**它自己签发的证书**（而非真实网站证书）；因为其根证书已被你信任，校验通过；\n2. 抓包工具再与真实服务器建立第二条 TLS 连接，用真实证书正常握手；\n3. 两条连接各自加解密，工具在中间**明文转发**——于是能看到全部请求与响应。\n\n- 关键前提：**根证书被目标设备信任**。所以公司做流量审计，靠的正是 MDM 或手动安装企业根证书；反过来，手机/电脑上出现不明根证书，就是要警惕的风险信号（这也是为什么装了抓包证书后，部分金融 App 会拒绝运行——它们做了证书固定（certificate pinning），只认自己的证书链）。\n- 防中间人的真正依据：浏览器验的是**证书链能否追到系统信任的根 CA**，以及**域名是否匹配**——攻击者拿不到真实域名的合法证书，伪造的又追不到受信根，就会弹「证书不受信任」警告。\n\n### Cookie / Session / Token\n\n面试官想听：三者「存在哪、谁认谁」——Cookie 在浏览器、Session 在服务端、Token 在请求头里自带身份。\n\n| | Cookie | Session | Token（JWT） |\n|---|---|---|---|\n| 存放位置 | 浏览器 | 服务端内存/存储 | 客户端（LocalStorage/Cookie/Header 均可） |\n| 生命周期 | 会话级（关浏览器没）或设 Max-Age 持久 | 超时销毁（默认 30 分钟不访问失效） | payload 里 exp 自带过期时间 |\n| 状态 | 只是载体 | **有状态**：服务端要存 | **无状态**：服务端只验签不存 |\n\n- 传统登录流程：登录后服务端建 Session，把 `JSESSIONID` 写进 Cookie 返回；之后浏览器自动带上 Cookie，服务端凭它找到 Session——所以 **Session 依赖 Cookie 传递凭证**（禁 Cookie 就得 URL 重写）。\n- Token 流程：登录成功后服务端用密钥签发 JWT 返回，客户端存起来，之后每次请求放 `Authorization: Bearer xxx` 头；服务端**只验签、不查存储**，天然方便水平扩容。\n- 分布式下 Session 共享三种方案：**粘滞会话**（负载均衡按 IP 固定路由到同一台，简单但单点故障丢会话）、**Session 复制**（节点间互同步，节点多时流量爆炸）、**集中存储**（Session 统一放 Redis，主流做法——本质就是「把有状态外置成共享存储」）。\n- 记忆口径：Cookie 是身份证的「挂绳」，Session 是柜台后面的档案，Token 是把档案信息签名后自己揣兜里。\n\n### JWT 的结构与校验\n\n- 结构三段，用 `.` 连接：`header.payload.signature`，前两段是 **Base64URL 编码（不是加密！）**，任何人可解码看到内容——别把敏感信息放 payload。\n  - header：`{\"alg\":\"HS256\",\"typ\":\"JWT\"}`；payload：声明（`exp` 过期、`sub` 用户、自定义字段）；signature：`HMAC-SHA256(base64(header) + \".\" + base64(payload), 密钥)`。\n- 校验流程：服务端拆开三段，用同一个密钥重算签名比对，再看 `exp` 是否过期。**改一个字符签名就对不上**，这就是防篡改原理。\n- HS256（对称，一个密钥签发+校验，单体够用）vs **RS256**（非对称，私钥签发、公钥校验，适合多方验签/微服务，签发权不扩散）。\n- 无状态的代价：签发出去就收不回，**登出/踢人**要么靠短过期 + Refresh Token 续期（accessToken 几分钟、refreshToken 几天，过期前用后者换新），要么引入 Redis 黑名单/版本号（又变回有状态）。\n- 常见坑：`alg=none` 攻击（老库允许不验签，务必校验 alg 白名单）、密钥泄露、忽略 exp、把 JWT 当加密用。\n\n### 操作系统基础（面试常顺手问）\n\n面试官想听：这几个点是 IO/网络题的「顺手追问」，每题 1~3 行说清概念 + 一个口径。\n\n- **进程 vs 线程**：进程是**资源分配**的单位（独立虚拟地址空间），线程是**CPU 调度**的单位；一个 JVM（进程）里线程共享堆和方法区，**各自有独立的栈、程序计数器、本地方法栈**。切换成本：线程 < 进程（不用换页表/地址空间）。口径：进程是工厂，线程是工人。\n- **进程间通信 IPC**：管道（半双工、亲缘）、消息队列（解耦、有大小限制）、**共享内存（最快——映射同一块物理页，不再经过内核拷贝，但要自己配信号量做同步）**、信号量（计数、同步互斥）、Socket（可跨机，网络编程的基础）。\n- **死锁四个必要条件**：**互斥、请求与保持（持有并等待）、不可剥夺、循环等待**，四个同时成立才死锁；**预防=破坏其中任意一个**——一次性申请全部资源（破坏请求保持）、允许强占（破坏不可剥夺）、**按全局顺序加锁**（破坏循环等待）、`tryLock` 超时放弃。Java 层死锁详见并发篇。\n- **虚拟内存与缺页中断**：每个进程看到的是自己独占的连续虚拟地址空间，经**页表**映射到物理页；内存不够时把冷页换出到磁盘，访问不在内存的页触发**缺页中断**（Page Fault），内核调入后再继续。收益：**内存超售**（跑起来的比物理内存多）、隔离保护、按需加载。代价：一次缺页中断可能上百微秒到毫秒级（SSD）。\n- **用户态 vs 内核态**：CPU 特权级两种模式；应用代码在用户态，读网络、读磁盘、分配内存都要**系统调用**（或中断）陷入内核态执行，返回再切回——每次切换有保存/恢复寄存器和刷流水线的开销。这就是「为什么频繁小 IO 慢」的底层原因，也是零拷贝想省的东西。\n- **IO 多路复用（进程/线程视角）**：一个线程通过 `select/poll/epoll` 一次看护成百上千个 fd，「谁就绪我处理谁」，从而**用 1 个线程服务 N 个连接**，替代「每连接阻塞等在内核里的一线一连接」——Java Selector 与 Netty/Nginx/Redis 的底层正是 epoll（详见下文 NIO 小节）。\n- **零拷贝**：`mmap`/`sendfile` 让数据不来回穿越用户态内核态（详见下文零拷贝小节）；应用代表：**Kafka**（消息体透传不加工，天生适合）、Nginx `sendfile on` 静态文件服务、Java `FileChannel.transferTo`。\n- **fork 与写时复制（COW）**：fork 创建子进程时不复制物理内存，父子**共享同一批物理页且只读**，任一方**写入才真正复制那一页**（缺页中断触发）——所以 fork 大 JVM 进程很快，但随后写多了内存翻倍。延伸：Linux 线程是 `clone()` 带 `CLONE_VM` 标志的轻量进程（共享地址空间），这也是「线程共享堆」的内核实现。\n- **僵尸进程与孤儿进程**：子进程退出后内核要保留它的退出状态供父进程 `wait()` 读取，此时子进程已是「尸体」但仍在进程表占位——这就是**僵尸进程**（ZOMBIE，内存几乎不占但占 PID 表项，大量堆积会耗尽 PID）。**父进程调用 `wait/waitpid`（或忽略 SIGCHLD 自动回收）即消除**。反过来，父进程先退出、子进程被 init/systemd 收养，则是**孤儿进程**，无害。排查：`ps aux | grep Z`，`ps` 的 STAT 列出现 `Z`；成因多为父进程没处理 SIGCHLD。\n- **多线程加速比与 Amdahl 定律**：4 核跑 4 线程理论上 100 秒 → 25 秒，实测 28 秒，多出的 3 秒来自**不可并行的部分 + 并行开销**（线程创建/销毁、锁竞争与同步、伪共享导致的缓存失效、任务划分与结果合并、冷启动与调度延迟）。Amdahl 定律给出上界：加速比 = 1 / (串行占比 + 并行占比/核数)，串行占比 5% 时哪怕核数无穷大，加速比也封顶在 20 倍。这解释了「加核不等于线性变快」。\n- **CPU 占用可以超过 100%**：`top` 里单核显示 100%，一个 JVM 进程是**多线程**的，其占用是所有线程在多个核上之和——380% 即约 3.8 个核满负荷，通常是有多线程并行计算（GC 线程、业务线程池、并行流），也可能是死循环 + 多线程。定位：`top -Hp <pid>` 看哪个线程高 → `printf '%x' <tid>` 转十六进制 → `jstack` 中按 nid 找到对应栈帧（详见[《01-Java高频八股速查》](#/f/f32)的排查套路）。\n- **TCP 慢启动与拥塞控制**：刚建连时不知道链路容量，**cwnd（拥塞窗口）从小开始按指数增长**——每经过一个 RTT 翻倍（1→2→4→8…），直到达到慢启动阈值 `ssthresh` 或检测到丢包：**超时**则 cwnd 归 1 重新慢启动，**三个重复 ACK**则进入快恢复（cwnd 减半 + 拥塞避免，此后**每个 RTT 只加 1**，线性增长）。所以「慢启动不慢、拥塞避免才慢」是经典反直觉点。\n\n### Socket 编程 demo\n\n```java\n// 服务端：accept 阻塞等连接，每连接一个线程处理（BIO）\ntry (ServerSocket server = new ServerSocket(8080)) {\n    while (true) {\n        Socket socket = server.accept();              // 阻塞点 1\n        new Thread(() -> {\n            try (BufferedReader in = new BufferedReader(\n                     new InputStreamReader(socket.getInputStream()));\n                 PrintWriter out = new PrintWriter(socket.getOutputStream(), true)) {\n                String line;\n                while ((line = in.readLine()) != null) {   // 阻塞点 2\n                    out.println(\"echo: \" + line);\n                }\n            } catch (IOException ignored) { }\n        }).start();\n    }\n}\n```\n\n```java\n// 客户端\ntry (Socket s = new Socket(\"127.0.0.1\", 8080);\n     PrintWriter out = new PrintWriter(s.getOutputStream(), true)) {\n    out.println(\"hello\");\n}\n```\n\n- UDP：`DatagramSocket` + `DatagramPacket`，`send/receive` 收发数据报，无需连接。\n- Java 11 标准 `HttpClient`：支持 HTTP/2、同步 `send` 与异步 `sendAsync`（返回 CompletableFuture）：\n\n```java\n// Java 11 标准 HttpClient：支持 HTTP/2、同步 send 与异步 sendAsync\nHttpClient client = HttpClient.newHttpClient();\nHttpRequest req = HttpRequest.newBuilder(URI.create(\"http://localhost:8080/api/health\")).build();\nHttpResponse<String> resp = client.send(req, HttpResponse.BodyHandlers.ofString());  // 同步\nclient.sendAsync(req, HttpResponse.BodyHandlers.ofString())\n      .thenApply(HttpResponse::body)                                                  // 异步\n      .thenAccept(System.out::println);\n```\n\n### ⭐BIO / NIO / AIO 对比\n\n面试官想听：用「等谁」来区分——BIO 等数据、NIO 等就绪事件、AIO 等完成通知；再补连接数与线程数的关系。\n\n| 模型 | 全称 | 阻塞点 | 线程模型 | 适用 |\n|---|---|---|---|---|\n| BIO | 同步阻塞 | accept/read/write 全阻塞 | 一个连接一个线程 | 连接少且固定 |\n| NIO | 同步非阻塞 | 线程轮询 Selector 等就绪事件 | 一个线程管理多个 Channel | 连接多、请求轻（高并发核心） |\n| AIO | 异步非阻塞 | 发起后立即返回，完成后回调 | 系统完成 I/O 再通知 | 理论最优，Linux 实现不成熟，实际少用 |\n\n- 记忆口径：BIO/NIO/AIO 的本质差异在「等待阶段用户线程做不做事」：BIO 死等、NIO 不阻塞但需主动轮询事件、AIO 注册回调由内核完成。\n- 「同步/异步」看**是谁完成真正的 I/O 拷贝**（用户进程 = 同步，内核通知 = 异步）；「阻塞/非阻塞」看**发起调用后线程是否挂起**。\n\n### ⭐NIO 三大件：Channel / Buffer / Selector\n\n面试官想听：能讲一个完整事件循环：注册 → select 轮询 → 判断事件类型 → 读写，并注意 flip。\n\n- **Channel（通道）**：双向数据通道（Stream 是单向的），`SocketChannel/ServerSocketChannel/FileChannel`，配合 Buffer 读写。\n- **Buffer（缓冲区）**：`ByteBuffer` 核心参数 `position/limit/capacity`；写完读之前必须 `flip()`（limit 置为 position、position 归零），`clear()` 重写、`rewind()` 重读。\n- **Selector（多路复用器）**：一个线程注册多个 Channel，`select()` 阻塞到任一 Channel 就绪，返回 `SelectionKey` 集合（OP_ACCEPT/OP_READ/OP_WRITE/OP_CONNECT），就绪才分配线程读写——把「每连接一线程」变成「每就绪事件一处理」。\n\n```java\nSelector selector = Selector.open();\nServerSocketChannel ssc = ServerSocketChannel.open();\nssc.configureBlocking(false);                      // NIO 必须非阻塞\nssc.register(selector, SelectionKey.OP_ACCEPT);\nwhile (selector.select() > 0) {                    // 轮询就绪事件\n    for (SelectionKey key : selector.selectedKeys()) {\n        if (key.isAcceptable()) ((ServerSocketChannel) key.channel()).accept();\n        // ... 处理 OP_READ 等，处理后 remove key\n    }\n}\n```\n\n- 多路复用底层：**select**（fd 数组遍历，1024 上限）、**poll**（链表，无上限但仍 O(n) 遍历）、**epoll**（红黑树 + 就绪链表 + 事件回调，O(1)，Linux 2.6+，Netty/Nginx 依赖它）。一句话：**select/poll 是遍历所有 fd 问谁好了，epoll 是内核把好的 fd 主动报给你**。\n\n**epoll 的 LT 与 ET（高频追问）**：\n\n| 模式 | 触发方式 | 行为 | 风险 |\n|---|---|---|---|\n| **LT**（水平触发，默认） | 只要 fd 的读缓冲区**还有数据**就持续通知 | 这次没读完，下次 `epoll_wait` 还会再报 | 不会丢事件，写代码简单 |\n| **ET**（边缘触发） | 只在状态**发生变化**时通知**一次** | 通知后必须**一次读到 `EAGAIN`**（读空），否则剩余数据不再上报 | 漏读即事件永远丢失；必须配**非阻塞 fd** + 循环读，否则最后一次 read 会阻塞住整个线程 |\n\n- 选型口径：LT 省心、适合通用场景；ET 通知次数少、在高并发下略省开销，但代码必须严格「非阻塞 + 循环读到 EAGAIN」。Netty 默认 LT（`EpollChannelOption` 可切 ET），Nginx 用 ET。\n- 面试记法：**LT = 「没处理完就一直催」，ET = 「只喊一次，你得自己干完」**。\n\n**连接状态排查：TIME_WAIT 与 CLOSE_WAIT**（`ss -ant` / `netstat -ant` 判读）：\n\n- **TIME_WAIT 在主动关闭方**：四次挥手最后一步，等待 2MSL（通常 60s）才真正释放。作用有二：确保最后的 ACK 能重传（对方没收到 ACK 会重发 FIN）、让本次连接的迟到报文在网络中消散，避免污染复用同一四元组的新连接。大量 TIME_WAIT 说明本机是**主动关闭方且短连接多** → 解决：连接池/长连接复用、`tcp_tw_reuse`（客户端侧安全）。\n- **CLOSE_WAIT 在被动关闭方**：收到了对方的 FIN 并回了 ACK，但**本进程还没调用 `close()`**——即流量已经结束、socket 却没被应用释放。**大量 CLOSE_WAIT 一定是应用代码 bug**（忘了关流/连接，异常路径漏了 `finally`，或连接池未回收），内核参数调优没用，要回去改代码。\n- 一句区分：**TIME_WAIT 是「正常的等待」，CLOSE_WAIT 堆积是「应用没关连接」**。排查用 `ss -antp` 看归属进程与 fd，配合 `lsof -p <pid> | grep CLOSE_WAIT` 定位泄漏点。\n\n### Reactor 模式\n\n- 核心思想：**I/O 多路复用 + 事件分发**——Reactor 线程监听事件，分发给 Handler 处理。\n- 单 Reactor 单线程（Redis 6 前）、单 Reactor 多线程（工作线程池处理业务）、主从 Reactor 多线程（accept 由主 Reactor，I/O 由子 Reactor 组）——Netty 默认主从模式（bossGroup + workerGroup）。\n\n### ⭐零拷贝\n\n面试官想听：传统读发要 4 次拷贝 4 次上下文切换，mmap/sendfile 把它降到 2 次甚至 0 次 CPU 拷贝。\n\n- 传统方式 `read + write`：磁盘 → 内核缓冲 → 用户缓冲（应用）→ Socket 缓冲 → 网卡，**4 次拷贝、4 次用户态内核态切换**。\n- `mmap`（内存映射）：用户空间与内核缓冲共享映射，减少一次拷贝；`sendfile`：数据直接在内核内从文件缓冲流向 Socket 缓冲，用户态零参与；网卡支持 gather 时连 Socket 缓冲拷贝都省掉（DMA 直接收集），仅 2 次拷贝且全在内核。\n- Java 对应：`FileChannel.transferTo()` 即 sendfile；Kafka 高吞吐、RocketMQ、Nginx `sendfile on` 都是受益者。**适用条件：不需要在应用层修改数据**，需要加工时仍要走用户态。\n\n### ⭐Netty 定位与为什么快\n\n面试官想听：Netty = 封装好 NIO 的异步事件驱动网络框架，快在四点：Reactor 线程模型、epoll、零拷贝、池化内存。\n\n- 定位：屏蔽 JDK NIO 复杂 API 与空轮询 bug（epoll bug），提供统一的异步事件驱动编程模型；Dubbo/gRPC/ElasticSearch 等的通信底座。\n- 高性能四要点：① **主从 Reactor 多线程模型**（boss 收连接、worker 处理 I/O）；② 基于 **epoll** 多路复用；③ **ByteBuf 池化**（PooledByteBufAllocator，减少 GC）与 CompositeByteBuf 等零拷贝（逻辑组合而非物理拷贝）；④ **无锁串行化设计**——消息在同一个 Channel 上始终由同一线程处理，避免锁竞争。\n- 组件速记：`Channel`（连接）、`EventLoop/EventLoopGroup`（线程+多路复用循环）、`ChannelPipeline`（Handler 责任链，解码/业务/编码）、`ByteBuf`（增强 Buffer）。\n\n## 🛠 动手实践\n\n### 任务 1：BIO 多线程聊天室\n\n- 要求：扩展上文 demo：服务端维护 `CopyOnWriteArrayList<PrintWriter>`，收到消息广播给所有在线客户端；客户端开两个线程（一个读控制台发送、一个收服务端消息）。\n- 验收标准：开 3 个终端同时对话，消息全量可见；一个客户端断开不影响其他（异常处理 + 移除失效 writer）；能说出连接数一多该模型的瓶颈（线程暴涨、内存占用）。\n\n### 任务 2：缓冲流拷贝性能对比\n\n- 要求：用 IO 章节（04-异常-IO-反射-注解.md）的任务 2 结论做基准；再用 `FileChannel.transferTo()` 拷贝同一个 ≥ 100MB 的文件并计时。\n- 验收标准：三组数据（单字节、8KB 缓冲数组、transferTo）对比；transferTo 明显更快；能解释它走的是 sendfile 零拷贝路径。\n\n### 任务 3（可选）：Netty echo server\n\n- 要求：引入 `io.netty:netty-all`，实现 boss/worker 两 EventLoopGroup 的 echo 服务；自定义 `SimpleChannelInboundHandler<ByteBuf>` 原样返回；telnet 测试。\n- 验收标准：客户端发送什么返回什么；能指出 pipeline 中 handler 的处理顺序；说出该 demo 对应 Reactor 的哪一种模型。\n\n## 💼 高频面试题\n\n**Q：说说 TCP 三次握手和四次挥手。⭐**\n- 握手：SYN → SYN+ACK → ACK；目的是确认双方收发能力、同步初始序列号、防止历史连接误建。\n- 挥手：FIN → ACK → FIN → ACK；因 TCP 全双工，被动方 ACK 与 FIN 不能合并（可能还有数据要发）。\n- 主动方最后进入 TIME_WAIT 等 2MSL：保证最后的 ACK 丢失可重传、旧报文自然消亡。\n\n**Q：为什么握手是三次而不是两次？**\n- 两次时服务端无法确认「客户端能收到自己的包」，连接的发送通道未获确认。\n- 同时无法阻止一个在网络中滞留的旧 SYN 再次建立无效连接。\n- 三次是确认双方收发能力的最小次数。\n\n**Q：TCP 如何保证可靠传输？**\n- 序号 + 确认应答（ACK），超时或收到重复 ACK 触发重传。\n- 接收缓冲区对乱序数据重排。\n- 滑动窗口做流量控制（不压垮接收方），慢启动/拥塞避免做拥塞控制（不压垮网络）；校验和检查数据损坏。\n\n**Q：BIO、NIO、AIO 的区别？⭐**\n- BIO 同步阻塞：accept/read 全阻塞，一个连接一线程，连接多时线程暴涨。\n- NIO 同步非阻塞：Selector 多路复用，一个线程监听多个 Channel 的就绪事件，就绪才读写；「同步」指数据拷贝仍由用户线程发起完成。\n- AIO 异步非阻塞：发起后立即返回，内核完成 I/O 后回调通知；Linux 实现不成熟，实际生产多用 NIO。\n- 一句话：BIO 等数据、NIO 等事件、AIO 等通知。\n\n**Q：select、poll、epoll 的区别？一句话概括。**\n- select：固定大小 fd 数组，每次全量遍历 O(n)，有 1024 上限。\n- poll：链表突破数量上限，但仍 O(n) 拷贝与遍历。\n- epoll：红黑树管理 fd + 就绪链表回调，只返回就绪的 fd，O(1)；一句话——前两者是「挨个问谁好了」，epoll 是「好了的主动排队」。\n\n**Q：什么是零拷贝？⭐**\n- 传统 read+write：4 次拷贝（磁盘→内核缓冲→用户缓冲→Socket 缓冲→网卡）+ 4 次上下文切换。\n- sendfile 让数据全程在内核态流转，CPU 拷贝降为 0~1 次、切换降为 2 次；mmap 用映射减少一次拷贝。\n- Java 里 `FileChannel.transferTo` 即 sendfile；Kafka/RocketMQ/Nginx 借此实现高吞吐；前提是应用不需要改数据。\n\n**Q：Netty 为什么高性能？⭐**\n- 主从 Reactor 多线程模型：bossGroup 收连接，workerGroup 处理 I/O，业务不阻塞 I/O 线程。\n- 底层基于 epoll 等 I/O 多路复用，并修复了 JDK NIO 的空轮询 bug。\n- ByteBuf 池化 + 复合缓冲的零拷贝，减少内存分配与 GC。\n- 单 Channel 事件无锁串行化到同一 EventLoop，避免锁竞争；pipeline 责任链灵活编解码。\n\n**Q：HTTP 常见状态码？GET 和 POST 的区别？**\n- 2xx 成功、301/302 重定向、400 参数错误、401 未认证、403 无权限、404 不存在、500 服务器错误、502/504 网关错误。\n- GET 获取资源：幂等、参数在 URL、可缓存；POST 提交数据：参数在 body、一般不幂等。\n- 面试加分：安全层面 GET 会被浏览器历史/日志记录，敏感数据应用 POST + HTTPS。\n\n## 🔗 推荐资料\n\n| 资料 | 说明 | 链接 |\n|---|---|---|\n| 廖雪峰 Java 网络编程 | Socket/UDP/邮件主线教程 | https://liaoxuefeng.com/books/java/network/index.html |\n| pdai IO/NIO/AIO 总览 | 三种模型与 NIO 三大件体系图 | https://pdai.tech/md/java/io/java-io-overview.html |\n| pdai 零拷贝 | mmap/sendfile 原理与图解 | https://pdai.tech/md/java/io/java-io-nio-zerocopy.html |\n| JavaGuide IO 模型 | BIO/NIO/AIO 面试向对比 | https://javaguide.cn/java/io/io-model.html |\n| JavaGuide NIO 基础 | Channel/Buffer/Selector 细节 | https://javaguide.cn/java/io/nio-basis.html |\n| JavaGuide IO 基础 | IO 流体系与序列化复习 | https://javaguide.cn/java/io/io-basis.html |\n","ck":0},{"id":"f12","stage":2,"path":"02-进阶篇/04-开发工具链-Git-Maven-Linux.md","title":"04-开发工具链-Git-Maven-Linux","md":"# 04-开发工具链-Git-Maven-Linux\n\n> **阶段**：进阶篇 ｜ **建议时长**：5 天（可拆开贯穿全程） ｜ **前置**：01-入门篇/01-环境搭建与基础语法.md\n\n## 🎯 学习目标\n\n- 能画出 Git 工作区/暂存区/仓库三区模型，说清 `reset --soft/--mixed/--hard` 各回退到哪。\n- 会用 `rebase` 整理提交、`cherry-pick` 摘补丁、`stash` 临时存改动，并知道**公共历史禁止 rebase**。\n- 能解释 Maven 依赖冲突的两个原则，用 `dependency:tree` 定位并 `<exclusion>` 排除。\n- 能在 Linux 上独立完成：起服务、看日志、找进程、探端口、统计 Top10 IP。\n- 会走 Java 线上排查命令链：`ps` → `top -Hp` → `printf %x` → `jstack`。\n\n## 📖 核心知识点\n\n### 一、Git\n\n一句话：**Git 本质是对快照和指针的管理**——每次 commit 是一个指向内容快照的对象，分支只是一个可移动的 41 字节指针，`HEAD` 是指向\"当前分支\"的指针。理解这句，所有命令都只是在动指针。\n\n#### 三区模型\n\n```\n工作区(Working Dir) --add--> 暂存区(Index/Stage) --commit--> 本地仓库(.git)\n                                                             --push--> 远程仓库(origin)\n       <-- checkout/restore --'        <-- reset --'        <-- fetch/pull --'\n```\n\n- `git status` 看的其实是\"工作区 vs 暂存区 vs HEAD\"三者的差异。\n- 撤销的核心区别：`restore` 只撤工作区（未 add），`restore --staged` 撤到暂存区（已 add 未 commit），`reset` 撤到已提交（改指针）。\n\n#### 高频命令表\n\n| 目的 | 命令 | 备注 |\n|---|---|---|\n| 提交但改上一次 | `git commit --amend -m \"新信息\"` | ⭐**只能改未 push 的提交**，push 后 amend 会造成历史分叉 |\n| 建并切分支 | `git switch -c feature/x` | 老写法 `checkout -b` 同义；switch/restore 是新式的分工明确版 |\n| 切分支 | `git switch main` | 切分支前工作区必须干净，否则先 stash |\n| 合并 | `git merge feature/x` | 保留分支拓扑，可能产生 merge commit |\n| 变基 | `git rebase main` | 把当前分支的提交\"逐个重放\"到 main 之后，历史变线性 |\n| 摘单个提交 | `git cherry-pick <sha>` | 紧急修 bug 往 release 分支摘补丁常用 |\n| 回退指针 | `git reset --soft/--mixed/--hard HEAD~1` | 见下表 |\n| 反做提交 | `git revert <sha>` | 生成一个\"新提交\"抵消旧改动，**不改历史，公共分支安全** |\n| 临时藏改动 | `git stash` / `git stash pop` | 切分支救急；`git stash list` 查 |\n| 打标签 | `git tag -a v1.0.0 -m \"发布\" && git push --tags` | 版本发布用 |\n| 只看某人某天的提交 | `git log --since=1.day --until=2.day --author=xxx` | 周报生成器 |\n| 逐行找谁写的 | `git blame file.java` | 追责利器 |\n| 找某段代码首次出现的提交 | `git log -S \"关键词\" --oneline` | 排查\"这行为什么在这\" |\n\n#### ⭐reset 三种模式\n\n| 模式 | 指针 | 暂存区 | 工作区 | 用途 |\n|---|---|---|---|---|\n| `--soft` | 移动 | 保留 | 保留 | 把几个提交\"退回未提交\"，重新组织成一次提交 |\n| `--mixed`（默认） | 移动 | **清空** | 保留 | 退回已 add 状态，边看边重新 add |\n| `--hard` | 移动 | 清空 | **丢弃** | 彻底放弃改动，⚠️**不可恢复**（只能靠 `git reflog`） |\n\n- 救命命令：`git reflog` 记录 HEAD 的所有移动，误 `reset --hard` 后 `git reset --hard <reflog里的sha>` 能捞回来。\n\n#### ⭐merge vs rebase 与团队协作禁忌\n\n| 维度 | merge | rebase |\n|---|---|---|\n| 历史 | 保留真实分支轨迹，有 merge commit | 线性、干净、好看 |\n| 提交 sha | 不变 | **全部重写**（同一改动新 sha） |\n| 冲突处理 | 一次性解决 | 逐个提交解决，可能反复 |\n| 适用 | 合到主干、要留痕 | 提交前整理自己的本地小提交、同步上游 |\n\n- **禁忌（必考）：已经 push 到公共分支（多人协作的 main/develop）的提交绝对不要 rebase。** 因为你重写了 sha，别人本地还指着旧历史，各自 rebase 后互相 force push 会把别人的提交冲掉，团队立刻炸锅。\n- 安全用法：**只 rebase 自己本地还没推的提交**，或者\"我 pull --rebase 把远程改动拉到我提交之前\"（这只重写我自己的提交）。\n- 冲突解决三步：① `git status` 看哪些文件 `both modified`；② 打开文件找 `<<<<<<< HEAD` / `=======` / `>>>>>>>` 标记，留下正确内容（或 `git checkout --ours/--theirs`）；③ `git add` 标记已解决 → `git commit`（merge 场景）或 `git rebase --continue`。\n- `.gitignore` 只忽略**未被跟踪**的文件；已经被提交过的 `.idea/` 加了 ignore 也不会生效，需要 `git rm -r --cached .idea` 再提交。\n\n#### 回滚：revert vs reset\n\n- 未 push：`reset`（改历史，干净）。\n- 已 push/生产分支：`revert`（加新提交抵消，历史完整可追溯）。团队规范上主干基本只允许 PR 合并 + revert。\n\n#### GitHub/GitLab 协作流程（PR/MR）\n\n```\nfork 仓库 → git clone 自己的 fork → git switch -c fix/xxx → 改代码 → commit → push origin fix/xxx\n→ 在网页提 Pull Request（base=上游 main, compare=fix/xxx）→ Code Review → 修改后继续 push（PR 自动更新）\n→ 合并 → 删除分支 → git fetch upstream && git switch main && git merge upstream/main\n```\n- 一句话：**PR 的价值不是搬代码，是把 Review 变成强制流程**——CI 跑测试 + 至少一人 approve 才允许合并。\n\n### 二、Maven\n\n一句话：**约定大于配置的依赖管理 + 标准化构建生命周期**。\n\n#### 坐标与常用 scope\n\n```xml\n<dependency>\n  <groupId>com.alibaba<\/groupId>     <!-- 组织 -->\n  <artifactId>druid-spring-boot-starter<\/artifactId>  <!-- 项目名 -->\n  <version>1.2.23<\/version>          <!-- 版本 -->\n  <scope>provided<\/scope>            <!-- 依赖范围 -->\n<\/dependency>\n```\n\n| scope | 编译 | 测试 | 打包 | 典型场景 |\n|---|---|---|---|---|\n| `compile`（默认） | ✅ | ✅ | ✅ | 业务依赖 |\n| `provided` | ✅ | ✅ | ❌ | Servlet API（容器已提供）、Lombok（只编译期用） |\n| `runtime` | ❌ | ✅ | ✅ | JDBC 驱动（编译只依赖 `java.sql` 接口） |\n| `test` | ❌ | ✅ | ❌ | JUnit、Mockito |\n| `system` | — | — | — | 已废弃，指向本地 jar 路径 |\n\n- ⭐`scope=provided` 打 war 的场景：Web 项目打 war 部署到外部 Tomcat，`spring-boot-starter-tomcat` 必须 provided，否则和容器自带 Tomcat 冲突启动失败。打可执行 jar 则不需要。\n\n#### 生命周期（一根顺序链）\n\n```\nclean → validate → compile → test → package → verify → install → deploy\n```\n- 命令都是\"**执行到该阶段**\"，会连带跑前面所有阶段：`mvn package` 会自动 compile + test。\n- `install` = 装进本地仓库 `~/.m2/repository`（别人/别的项目才能依赖你）；`deploy` = 推到私服 Nexus。\n- 跳过测试：`mvn package -DskipTests`（编译测试代码但不跑）；`-Dmaven.test.skip=true`（连测试代码都不编译，不推荐）。\n\n#### ⭐依赖传递与冲突两个原则\n\nMaven 会自动把你依赖的依赖也拉进来（传递依赖），同一个 jar 出现两个版本就冲突。裁决规则：\n\n1. **就近优先（路径最短者胜）**：A→B→C→X:1.0 与 A→D→X:2.0 冲突时，X:2.0 胜（深度 1 < 深度 3）。\n2. **声明优先（同深度时，先声明者胜）**：路径深度相同，pom 里写在上面的那个胜。\n\n排查与处理：\n\n```bash\nmvn dependency:tree                          # 看整棵树\nmvn dependency:tree -Dverbose -Dincludes=com.fasterxml.jackson.core\nmvn dependency:analyze                       # 找出\"用了没声明/声明了没用\"\n```\n\n```xml\n<dependency>\n  <groupId>org.springframework.boot<\/groupId>\n  <artifactId>spring-boot-starter-web<\/artifactId>\n  <exclusions><exclusion>\n      <groupId>org.apache.logging.log4j<\/groupId>     <!-- 排除冲突的日志实现，只留一个 -->\n      <artifactId>log4j-to-slf4j<\/artifactId>\n  <\/exclusion><\/exclusions>\n<\/dependency>\n```\n\n- 冲突症状：`NoSuchMethodError`（运行时加载到旧版本，方法不存在）、`ClassNotFoundException`、`IncompatibleClassChangeError`。⭐注意 `NoSuchMethodError` 而不是编译报错，就是因为编译期和运行期的 jar 版本不一致。\n\n#### BOM 与 dependencyManagement\n\n- `<dependencyManagement>` **只统一版本号，不真正引入依赖**——子模块 `<dependency>` 写 groupId+artifactId 就够，version 由父 pom 决定。\n- Spring Boot 的 `spring-boot-starter-parent` 就是靠继承 + `spring-boot-dependencies` 这个 **BOM**（bill of materials）管理上万个 artifact 的版本，所以业务 pom 里几乎不写 version。\n- 不能继承 parent 时改用 `<scope>import<\/scope>` 导入 BOM。这是\"为什么我的依赖不用写版本号\"的答案。\n\n#### 聚合 vs 继承\n\n| | 聚合（modules） | 继承（parent） |\n|---|---|---|\n| pom 元素 | `<modules><module>` | `<parent>` |\n| 目的 | 一条命令构建多个模块（reactor 排序） | 复用依赖版本、插件配置、属性 |\n| 关系 | 平级，一次性打包 | 父子，属性向下传递 |\n- 多模块项目常两者同时用。\n\n#### Gradle 一句对比\n\n- Gradle 用 Groovy/Kotlin DSL（编程式，灵活但可读性看人），**增量构建与依赖缓存快于 Maven**，Android 官方构建工具。Java 后端主流仍是 Maven——面试被问到就说\"两者定位一样，Gradle 赢在构建性能与脚本灵活度，Maven 赢在约定简单和生态稳定\"。\n\n### 三、Linux\n\n定位：**Java 工程师的 Linux = 上服务器看进程、看日志、看端口**，不需要会写内核。\n\n#### 文件与文本\n\n| 目的 | 命令 |\n|---|---|\n| 看详情/大小 | `ls -lh`（`-a` 隐藏文件，`-t` 按时间） |\n| 目录树 | `tree -L 2` |\n| 找文件 | `find /app -name \"*.jar\"`；`find . -mtime +7 -name \"*.log\"`（配合 `-delete` 清日志） |\n| 搜内容 | `grep -rn \"关键词\" ./src`（`-r` 递归 `-n` 行号 `-i` 忽略大小 `-C 3` 上下 3 行） |\n| 行数 / 头尾 | `wc -l f`、`head -20 f`、`tail -50 f`、⭐`tail -f app.log`（实时跟，`Ctrl+C` 退） |\n| 翻页大文件 | `less big.log`（`/关键词` 搜、`n` 下一个、`G` 到底、`q` 退） |\n\n**文本三剑客一句话**：\n- `grep` 找：`grep -c \"ERROR\" app.log`（统计条数）。\n- `sed` 改：`sed -i 's/旧值/新值/g' application.yml`（原地全局替换，macOS 要 `sed -i ''`）；`sed -n '10,20p' f` 只打印 10~20 行。\n- `awk` 按列算：`awk '{print $1}' access.log | sort | uniq -c | sort -rn | head -10`（第一列计数降序取 Top10）；`awk '$9==500' access.log`（筛状态码 500）。\n\n#### 权限与进程\n\n- `chmod 755 start.sh`：**r=4 w=2 x=1**，`755` = 属主 `rwx`(7)、属组 `r-x`(5)、其他 `r-x`(5)。目录的 x 是\"能进入\"。\n- `chown app:app /app/service` 改属主属组；`chmod -R` 递归（别对着 `/` 手滑）。\n- 进程：\n  - `ps -ef | grep java` 找 Java 进程（`-ef` 全格式含父 pid；`ps aux` 含 CPU/内存占用）。\n  - `kill -15 <pid>` 优雅退出（发 TERM，JVM 会跑 shutdown hook，**先用这个**）；`kill -9 <pid>` 强杀（SIGKILL，不给清理机会，临时文件/锁/消息 ACK 可能残留）。\n  - `top` 全局看；交互界面里 `Shift+P` 按 CPU 排序、`Shift+M` 按内存排序、`1` 展开各核、`c` 显示完整命令行。\n  - `nohup java -jar app.jar > app.log 2>&1 &` 后台常驻（`nohup` 防挂断，`2>&1` 合并错误流，`&` 后台）；`jobs`/`fg`/`disown` 管理。\n\n#### 网络\n\n| 目的 | 命令 |\n|---|---|\n| 调接口 | `curl -X POST -H \"Content-Type: application/json\" -d '{\"id\":1}' http://localhost:8080/users` |\n| 探连通 | `ping host`（只能测 IP 层，很多服务器禁 ICMP） |\n| 探端口 | `telnet 127.0.0.1 6379` 或 `nc -zv 127.0.0.1 6379`（比 telnet 更适合脚本） |\n| 看谁在监听 | ⭐`ss -lntp`（新，快）vs `netstat -tunlp`（老，功能一样；精简镜像常没装） |\n| 看 IP | `ip addr`（新）vs `ifconfig`（老，net-tools 包里） |\n| 域名解析 | `dig +short javaguide.cn`、`nslookup` |\n\n#### vi/vim 三种模式\n\n- **普通模式**（打开即在）：`h j k l` 移动、`w b` 跳词、`dd` 删行、`u` 撤销、`yy` 复制、`p` 粘贴、`G` 到末行、`gg` 到首行、`/xxx` 搜索。\n- **插入模式**：`i`（光标前）/ `a`（光标后）/ `o`（新开一行）进入，`Esc` 退出。\n- **命令模式**：`:` 进入，`:wq` 保存退出、`:q!` 强制不存退出、`:%s/old/new/g` 全文替换。\n- 新人最常卡住的是\"不知道自己在哪个模式\"——`Esc` 是万能退路。\n\n#### ⭐Java 工程师的线上排查命令链\n\n**CPU 打满 / 线程卡死四步（面试手写流程）**：\n\n```bash\nps -ef | grep java                 # 1. 找到应用 pid，比如 20481\ntop -c -p 20481                    # 2. 看进程；按 Shift+H 进线程视图，Shift+P 按 CPU 排\ntop -Hp 20481                      #    找出 CPU 最高的线程 tid，比如 20500\nprintf \"%x\\n\" 20500                # 3. 线程号转 16 进制 → 5014\njstack 20481 | grep -A 30 'nid=0x5014'   # 4. 定位到具体代码行（nid 是 16 进制带 0x）\n```\n\n- 补充链：`jmap -histo:live <pid> | head -20` 看对象直方图（大对象嫌疑）；`jmap -dump:live,format=b,file=heap.hprof <pid>` 导堆给 MAT（⚠️会 STW，生产慎用，先摘流量）；`jstat -gcutil <pid> 1000 10` 每秒打印 GC 情况，判断是不是频繁 Full GC。详见[《02-JVM核心》](#/f/f10)。\n- 日志：`tail -f app.log | grep --line-buffered \"orderId=123\"` 追一笔订单；`grep -E \"ERROR|Exception\" -C 5 app.log > err.txt` 抓上下文。\n- 磁盘满（`No space left on device`）：`df -h` 看哪个分区满 → `du -sh /app/logs/*` 找大头 → `> app.log` 清空（不要 `rm` 正被进程写的文件，句柄不释放空间照样不回来）。\n- 内存/负载：`free -h`（看 available 而不是 free）、`uptime`（1/5/15 分钟负载，对比核数）、`vmstat 1 5`。\n\n## 🛠 动手实践\n\n### 任务 1：Git 造冲突 + rebase 整理提交\n\n- 要求：① 建 `feature/a` 和 `feature/b` 两个分支改**同一行**，合并制造冲突并解决；② 在 `feature/a` 上用 `git rebase -i HEAD~3` 把 3 个提交（含一个 \"fix typo\"）压成 1 个语义清晰的提交。\n- 验收标准：`git log --oneline` 上只剩 1 条描述规范的提交；能说出 `pick/squash/fixup/drop/reword` 各干什么；能说明为什么这次 rebase 是安全的（**该分支还没 push 给别人**）；冲突文件里没有残留 `<<<<<<<` 标记。\n\n### 任务 2：Maven 依赖冲突定位并排除\n\n- 要求：给项目引入两个各自依赖不同版本 Jackson 的 starter，用 `mvn dependency:tree` 找出实际生效版本，再用 `<exclusion>` + 显式声明统一到指定版本。\n- 验收标准：能贴出 `dependency:tree -Dverbose` 里被标记 `omitted for conflict` 的那一行并解释为什么被裁掉；处理后 `mvn dependency:tree` 只出现一个 jackson-databind 版本；能说出 `dependencyManagement` 和 `exclusion` 两种解法的差别（前者统一版本、后者按路径剪枝）。\n\n### 任务 3：Linux 统计 access.log Top10 IP\n\n- 要求：本地造一份 nginx 格式 `access.log`（≥1000 行），一条命令输出访问次数 Top10 的 IP 及次数；再用 `awk` 统计 5xx 响应占比。\n- 验收标准：命令为 `awk '{print $1}' access.log | sort | uniq -c | sort -rn | head -10`，能解释每个环节干什么（取列→计数→排序→截断）；5xx 用 `awk '$9>=500{e++} END{print e/NR}' access.log`；说出为什么不能用 `sort -rn` 直接排原文件。\n\n## 💼 高频面试题\n\n- [ ] **Q：merge 和 rebase 的区别？什么时候不能 rebase？⭐** —— merge 保留拓扑生成 merge commit、rebase 重放提交使历史线性但改写 sha；已 push 的公共分支禁止 rebase，会让协作者历史分叉 ｜ 详见[《01-环境搭建与基础语法》](#/f/f3)\n- [ ] **Q：git reset 和 git revert 的区别？⭐** —— reset 移动 HEAD 指针改写历史（--soft 留暂存区、--mixed 留工作区、--hard 全丢），只适合未 push；revert 生成反向新提交不改历史，公共分支安全 ｜ 详见[《01-环境搭建与基础语法》](#/f/f3)\n- [ ] **Q：Maven 依赖冲突怎么解决？两个原则是什么？⭐** —— 就近优先（路径浅者胜）+ 同深度声明优先；用 mvn dependency:tree -Dverbose 定位，再 exclusion 排除或 dependencyManagement 统一版本 ｜ 详见[《SpringBoot实战》](#/f/f16)\n- [ ] **Q：pom 里为什么不写依赖版本号？⭐** —— 继承 spring-boot-starter-parent 并导入 spring-boot-dependencies 这个 BOM，dependencyManagement 只统版本不引入，子模块省略 version ｜ 详见[《SpringBoot实战》](#/f/f16)\n- [ ] **Q：scope=provided 是什么意思？什么场景用？⭐** —— 编译和测试可用、不打进包，由运行容器提供；典型是打 war 部署外部 Tomcat 时 starter-tomcat 设 provided，以及 Lombok 只编译期生效 ｜ 详见[《SpringBoot实战》](#/f/f16)\n- [ ] **Q：线上 CPU 打满怎么排查？⭐** —— ps -ef|grep java 拿 pid → top -Hp 找最耗 CPU 线程 tid → printf \"%x\" 转 16 进制 → jstack 按 nid=0x 定位代码；再配合 jstat 看 GC ｜ 详见[《02-JVM核心》](#/f/f10)\n- [ ] **Q：kill -9 和 kill -15 有什么区别？⭐** —— -15 是 SIGTERM，可被捕获，进程能做清理（JVM 会跑 shutdown hook、Spring 能优雅下线）；-9 是 SIGKILL，内核直接杀、不可捕获，连接/锁/临时文件都不清理，生产先试 -15 ｜ 详见[《02-JVM核心》](#/f/f10)\n- [ ] **Q：NoSuchMethodError 是什么问题？怎么查？⭐** —— 编译期与运行期 jar 版本不一致导致方法缺失，属依赖冲突；用 dependency:tree 看实际加载版本、jar 包检查、-verbose:class 看类从哪加载 ｜ 详见[《02-JVM核心》](#/f/f10)\n- [ ] **Q：.gitignore 加了但文件还在被跟踪怎么办？⭐** —— ignore 只对未跟踪文件生效；git rm -r --cached <路径> 取消索引再提交，本地文件不被删 ｜ 详见[《01-环境搭建与基础语法》](#/f/f3)\n- [ ] **Q：install 和 deploy 的区别？⭐** —— install 装进本地 ~/.m2 仓库供本机其他项目依赖；deploy 发布到远程私服 Nexus 供团队共享 ｜ 详见[《SpringBoot实战》](#/f/f16)\n\n## 🔗 推荐资料\n\n| 资料 | 用来干什么 | 链接 |\n|---|---|---|\n| 廖雪峰 Git 教程 | 三区模型、分支管理、冲突与回滚的入门主线 | https://liaoxuefeng.com/books/git/introduction/index.html |\n| 廖雪峰 Maven 教程 | 坐标、生命周期、依赖范围的基础讲解 | https://liaoxuefeng.com/books/java/maven/index.html |\n| JavaGuide Maven 总结 | 依赖冲突、BOM、多模块的工程化总结 | https://javaguide.cn/tools/maven/maven-best-practice.html |\n| pdai Maven 详解 | 生命周期与插件机制的完整知识图谱 | https://pdai.tech/md/techtools/tools-maven-detail.html |\n| 慕课 Linux 命令实战 | 服务器排查与 Shell 命令跟练 | https://www.imooc.com/course/list?c=linux |\n| 码工具 Linux 命令速查 | 在线查命令参数与用法示例 | https://www.matools.com/linux |\n","ck":10},{"id":"f13","stage":3,"path":"03-数据库篇/01-MySQL基础与SQL实战.md","title":"MySQL基础与SQL实战","md":"# MySQL基础与SQL实战\n\n> **阶段**：数据库篇 ｜ **建议时长**：6 天 ｜ **前置**：无\n\n## 🎯 学习目标\n\n- 能用 Docker 启动 MySQL 8 实例，通过客户端完成建库、建表、造数等基本操作。\n- 能说出核心数据类型（int/bigint/varchar/char/datetime/decimal）的选型依据与常见坑。\n- 能熟练书写连接查询、分组聚合、子查询、分页 SQL，独立完成本篇 10 道练习题。\n- 能背出 SQL 逻辑执行顺序，并用它解释 where/having、别名引用等规则。\n- 能说清 JDBC 六步、连接池的作用，以及\"从 JDBC 到 MyBatis\"的演进原因。\n\n## 📖 核心知识点\n\n### 1. 环境搭建：库、表、行\n\nDocker 一条命令启动 MySQL 8（数据落在具名卷 `mysql-data`，删容器不丢数据）：\n\n```bash\ndocker run -d --name mysql8 \\\n  -p 3306:3306 \\\n  -e MYSQL_ROOT_PASSWORD=root123 \\\n  -e TZ=Asia/Shanghai \\\n  -v mysql-data:/var/lib/mysql \\\n  mysql:8.0.36 \\\n  --character-set-server=utf8mb4 \\\n  --collation-server=utf8mb4_general_ci\n```\n\n```bash\n# 进入命令行客户端\ndocker exec -it mysql8 mysql -uroot -proot123\n```\n\n```sql\nSHOW DATABASES;                                    -- 查看所有库\nCREATE DATABASE school DEFAULT CHARSET utf8mb4;    -- 建库，字符集统一 utf8mb4\nUSE school;\nSHOW TABLES;                                       -- 查看库中的表\nDESC student;                                      -- 查看表结构\n```\n\n三个层级：**database（库）→ table（表）→ row（行）/ column（列）**。一个库对应一个业务域（如订单库、用户库），一张表对应一类实体，一行就是一条记录。\n\n**存储引擎**：MySQL 5.5 之后**默认 InnoDB**（5.5 前默认 MyISAM）。InnoDB **支持事务、行级锁、外键与 MVCC**，是绝大多数业务表的选择；MyISAM 只有表锁、不支持事务，仅个别只读/计数场景还在用。建表时可显式指定：`ENGINE=InnoDB`（本文所有建表语句都显式写了，属于好习惯）；用 `SHOW TABLE STATUS LIKE '表名'` 或 `SHOW CREATE TABLE 表名` 可查看某张表实际用的引擎。\n\n客户端工具：命令行 `mysql`、IDEA 自带 Database 面板、Navicat / DataGrip / DBeaver（免费），学习期任选其一即可。\n\n### 2. 数据类型选择与约束 ⭐\n\n> 面试官想听：能否按业务选对类型，并说出\"金额为什么用 DECIMAL、字段为什么尽量 NOT NULL\"。\n\n| 类型 | 适用场景 | 注意点 |\n| --- | --- | --- |\n| INT | 状态、数量（约 ±21 亿） | `INT(11)` 的 11 只是显示宽度，不影响存储范围 |\n| BIGINT | 主键、雪花 ID | 主键首选，永不溢出 |\n| DECIMAL(M,D) | 金额 | FLOAT/DOUBLE 有精度丢失，金额禁用 |\n| CHAR(N) | 定长：身份证、MD5 串 | 不足补空格存取略快，过长浪费空间 |\n| VARCHAR(N) | 变长：姓名、标题 | 额外 1~2 字节存长度；N 是字符数不是字节数 |\n| DATETIME | 绝大多数时间字段 | 无时区转换，8 字节，范围 1000~9999 年 |\n| TIMESTAMP | 需要时区转换的场景 | 4 字节，最大只到 2038 年，受时区影响 |\n\n选型三原则：能用数字不用字符串；字段尽量 `NOT NULL` 并给默认值（NULL 会干扰索引、统计和 `COUNT`）；长文本用 TEXT 并考虑拆到扩展表。\n\n常用约束：`PRIMARY KEY`（唯一+非空）、`UNIQUE`、`NOT NULL`、`DEFAULT`、`FOREIGN KEY`。互联网公司普遍**不建物理外键**，只建普通索引并在应用层校验：外键带来级联锁与维护开销，且不利于后续分库分表。\n\n### 3. SQL 三大类\n\n- DDL（定义）：`CREATE / ALTER / DROP / TRUNCATE`，操作表结构。\n- DML（操作）：`INSERT / UPDATE / DELETE`，操作数据。\n- DQL（查询）：`SELECT`，面试与日常工作的主战场。\n- 另有 DCL（`GRANT/REVOKE` 权限）、TCL（`COMMIT/ROLLBACK` 事务），了解即可。\n\n### 4. 查询核心：连接、分组、子查询 ⭐\n\n> 面试官想听：SQL 逻辑执行顺序脱口而出，并能解释\"为什么 where 里不能用 select 的别名\"。\n\n**SQL 逻辑执行顺序**（书写从 SELECT 开始，执行却不是）：\n\n```text\nFROM → ON → JOIN → WHERE → GROUP BY → HAVING → SELECT(含别名) → DISTINCT → ORDER BY → LIMIT\n```\n\n两条推论：`WHERE` 阶段早于 `SELECT`，所以引用不了 SELECT 定义的别名，`ORDER BY` 可以；`WHERE` 过滤行，`HAVING` 过滤分组后的结果。\n\n基础骨架：\n\n```sql\nSELECT s.name, c.name AS course_name, sc.value\nFROM score sc\nJOIN student s ON sc.student_id = s.id\nJOIN course  c ON sc.course_id  = c.id\nWHERE sc.value >= 60\nGROUP BY sc.course_id, c.name\nHAVING AVG(sc.value) > 80\nORDER BY sc.value DESC\nLIMIT 10;\n```\n\n**三种连接**：\n\n- `INNER JOIN`：只返回两表都匹配上的行。\n- `LEFT JOIN`：左表全部保留，右表匹配不上补 NULL——\"查没有 XX 的记录\"类题目的标准解法。\n- `RIGHT JOIN`：LEFT 的镜像，项目里几乎不用（交换表顺序改写成 LEFT）。\n\n**子查询与 EXISTS**：子查询可出现在 WHERE（标量/列/表）、FROM（派生表）中。`IN` 与 `EXISTS` 的选择：子查询结果集小用 `IN`，外表小用 `EXISTS`，核心思想都是\"小表驱动大表\"。\n\n**UNION vs UNION ALL**：`UNION` 合并后去重（多一步去重计算，慢），`UNION ALL` 直接拼接（快）；确定无重复数据时一律用 UNION ALL。\n\n### 5. 常用函数与实用写法 ⭐\n\n> 面试官想听：CASE WHEN 行转列、IFNULL 兜底这类\"写得出\"的硬功夫。\n\n```sql\n-- 字符串：拼接、截取、长度、替换\nSELECT CONCAT(name, '-', gender) FROM student;\nSELECT SUBSTRING(name, 1, 1), LENGTH(name), REPLACE(name, '张', '章') FROM student;\n\n-- 日期：当前时间、加减、差值、格式化\nSELECT NOW(), CURDATE();\nSELECT DATE_ADD(NOW(), INTERVAL 7 DAY), DATEDIFF(NOW(), '2026-01-01');\nSELECT DATE_FORMAT(NOW(), '%Y-%m-%d %H:%i:%s');\n\n-- IFNULL 空值兜底；IF 三元\nSELECT IFNULL(value, 0) FROM score;\n\n-- CASE WHEN：分段统计与行转列的核心\nSELECT value,\n  CASE WHEN value >= 90 THEN 'A'\n       WHEN value >= 60 THEN 'B'\n       ELSE 'C' END AS grade\nFROM score;\n```\n\n分页：`LIMIT offset, size`，第 1 页 `LIMIT 0,10`、第 2 页 `LIMIT 10,10`；offset 越大越慢（深分页问题，下一篇详讲）。去重：`SELECT DISTINCT course_id FROM score;`。\n\nCOUNT 三兄弟：`COUNT(*)`（InnoDB 有专门优化，推荐）、`COUNT(1)`（与 * 等价）、`COUNT(col)`（不统计该列为 NULL 的行，语义不同）。\n\n### 建表实战与设计要点\n\n**一张「像生产环境」的建表 SQL**（学生/课程/选课三表，学生选课库即此结构）：\n\n```sql\nCREATE TABLE student (\n  id         BIGINT UNSIGNED NOT NULL AUTO_INCREMENT COMMENT '主键',\n  name       VARCHAR(20)     NOT NULL COMMENT '姓名',\n  id_card    CHAR(18)        NOT NULL COMMENT '身份证，定长用 CHAR',\n  gender     TINYINT         NOT NULL DEFAULT 1 COMMENT '1男 0女',\n  birthday   DATE            DEFAULT NULL,\n  created_at DATETIME        NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  updated_at DATETIME        NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,\n  PRIMARY KEY (id),\n  UNIQUE KEY uk_id_card (id_card)          -- 业务唯一键\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_general_ci COMMENT='学生表';\n\nCREATE TABLE course (\n  id   BIGINT UNSIGNED NOT NULL AUTO_INCREMENT,\n  name VARCHAR(30)     NOT NULL,\n  PRIMARY KEY (id),\n  UNIQUE KEY uk_name (name)\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;\n\nCREATE TABLE score (  -- 选课/成绩：多对多中间表\n  id         BIGINT UNSIGNED NOT NULL AUTO_INCREMENT,\n  student_id BIGINT UNSIGNED NOT NULL,\n  course_id  BIGINT UNSIGNED NOT NULL,\n  value      DECIMAL(5,1)    NOT NULL DEFAULT 0 COMMENT '成绩，小数用 DECIMAL 不用 FLOAT',\n  PRIMARY KEY (id),\n  UNIQUE KEY uk_student_course (student_id, course_id),  -- 一人一课一条\n  KEY idx_course (course_id)                              -- 外键列建普通索引\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;\n```\n\n- 要点逐条：主键用 `BIGINT AUTO_INCREMENT`；定长（身份证/MD5）用 CHAR、变长用 VARCHAR；金额/成绩用 DECIMAL；时间用 DATETIME；`utf8mb4` 才存得了 emoji，排序规则全库统一；`NOT NULL + DEFAULT`，可空就写 `DEFAULT NULL`。教学演示可加 `FOREIGN KEY (student_id) REFERENCES student(id)`，**生产不建物理外键**（见上文约束小节）。\n\n**设计要点一句话清单**：每张表「自增 bigint 主键 + 业务唯一键」双保险；不用外键约束，靠应用层保证（分库分表后外键更没法用）；**适度冗余**换掉高频 join（如订单表冗余商品名）；时间统一 DATETIME、金额统一 DECIMAL；必备 `created_at/updated_at` 两列。\n\n**高价值 SQL 面试题补充**（配合 10 道练习，这几道是「面试原题级」）：\n\n- **行转列**：成绩表转成「每人一行、各科一列」——`CASE WHEN + GROUP BY + MAX`：\n\n```sql\nSELECT s.name,\n  MAX(CASE WHEN c.name='语文' THEN sc.value END) AS chinese,\n  MAX(CASE WHEN c.name='数学' THEN sc.value END) AS math,\n  MAX(CASE WHEN c.name='英语' THEN sc.value END) AS english\nFROM score sc\nJOIN student s ON s.id=sc.student_id\nJOIN course  c ON c.id=sc.course_id\nGROUP BY s.name;\n```\n\n- **分组内 Top N**（每科前 2 名）：MySQL 8 窗口函数一行搞定 `ROW_NUMBER()/RANK() OVER (PARTITION BY course_id ORDER BY value DESC)` 放进子查询取 rn<=2（并列用 RANK，不并列才用 ROW_NUMBER）；MySQL 5.7 没有窗口函数，思路是**自连接计数**：`JOIN score t2 ON t2.course_id=t.course_id AND t2.value>t.value` 后 `HAVING COUNT(*) < 2`，或用户变量模拟行号。\n- **连续 N 天出现**（如连续 3 天打卡/登录）：经典「日期减行号」——按人按天排序后 `date - INTERVAL ROW_NUMBER() DAY` 得到分组键 `grp`，连续日期段内 grp 相同，再 `GROUP BY 人, grp HAVING COUNT(*) >= 3`。\n- **第 N 高的分数**：`DENSE_RANK() OVER (ORDER BY value DESC)` 取 =N（去重排名，DENSE_RANK 并列不跳号，RANK 跳号）；不用窗口则 `SELECT DISTINCT value FROM score ORDER BY value DESC LIMIT N-1,1`。\n- 口径：**排名类题目先想窗口函数，老版本再退化到自连接/变量**；行转列永远是 CASE WHEN + 聚合。\n\n### 6. 从 JDBC 到 ORM（衔接框架篇）\n\n**JDBC 六步**：加载驱动 → 获取连接 `DriverManager.getConnection()` → 创建 Statement → 执行 SQL → 处理 ResultSet → 关闭资源（倒序释放）。原生写法痛点：样板代码冗长、SQL 与 Java 代码耦合、结果集要手动映射成对象。\n\n**连接池**解决\"连接无法复用\"：TCP 建连 + 认证开销大，池子提前建好连接、借还复用。Spring Boot 2.x 起默认 **HikariCP**（轻量高效），国内也常用 **Druid**（阿里出品，自带 SQL 监控页面）。\n\nORM 演进：JDBC → JdbcTemplate（只省样板代码）→ **MyBatis**（SQL 独立到 XML、结果自动映射、灵活可控）→ JPA/Hibernate（全自动但复杂 SQL 难写）。国内互联网主流是 MyBatis-Plus，框架篇展开。\n\n## 🛠 动手实践\n\n### 任务 1：Docker 起库并熟悉客户端（30 分钟）\n\n按上文命令启动 MySQL 8，命令行和 IDEA Database 面板各连一次。\n验收：`SELECT VERSION();` 显示 8.x；能熟练完成建库、`SHOW TABLES`、`DESC`。\n\n### 任务 2：学生-课程-成绩三表并造数（1 小时）\n\n```sql\nCREATE DATABASE school DEFAULT CHARSET utf8mb4;\nUSE school;\n\nCREATE TABLE student (\n  id         BIGINT PRIMARY KEY AUTO_INCREMENT,\n  name       VARCHAR(20) NOT NULL,\n  gender     TINYINT     NOT NULL DEFAULT 1 COMMENT '1男 0女',\n  birthday   DATE,\n  created_at DATETIME    NOT NULL DEFAULT CURRENT_TIMESTAMP\n);\n\nCREATE TABLE course (\n  id   BIGINT PRIMARY KEY AUTO_INCREMENT,\n  name VARCHAR(30) NOT NULL UNIQUE\n);\n\nCREATE TABLE score (\n  id         BIGINT PRIMARY KEY AUTO_INCREMENT,\n  student_id BIGINT NOT NULL,\n  course_id  BIGINT NOT NULL,\n  value      DECIMAL(5,1) NOT NULL,\n  UNIQUE KEY uk_student_course (student_id, course_id)  -- 一人一课只允许一条成绩\n);\n\nINSERT INTO student (name, gender, birthday) VALUES\n('张三', 1, '2003-05-12'), ('李四', 1, '2002-11-03'),\n('王五', 0, '2003-08-21'), ('赵六', 0, '2004-01-15');\n\nINSERT INTO course (name) VALUES ('语文'), ('数学'), ('英语'), ('体育');\n\nINSERT INTO score (student_id, course_id, value) VALUES\n(1,1,85.5),(1,2,92.0),(1,3,78.0),\n(2,1,74.0),(2,2,88.5),\n(3,1,90.0),(3,3,95.5),\n(4,2,59.5);\n```\n\n验收：三表能独立查询，也能 JOIN 出\"学生名-课程名-分数\"宽表。\n\n### 任务 3：10 道经典 SQL 练习（3 天）\n\n前 3 题给思路，先自己写再看答案；后 7 题独立完成。\n\n**第 1 题：每门课程的平均分，只保留平均分大于 80 的课程。**\n思路：按课程分组 → 组内求平均 → 对\"分组结果\"过滤。过滤组必须用 HAVING（WHERE 过滤行且执行在聚合之前）。\n\n```sql\nSELECT c.name, AVG(sc.value) AS avg_value\nFROM score sc JOIN course c ON sc.course_id = c.id\nGROUP BY sc.course_id, c.name\nHAVING avg_value > 80;\n```\n\n**第 2 题：每门课程最高分对应的学生姓名（考虑并列第一）。**\n思路：不能直接 `MAX(value)` 后顺手取姓名（非聚合列会取到错误行）。先分组聚合出\"课程-最高分\"，再把这个结果当一张表 join 回去查姓名。\n\n```sql\nSELECT c.name AS course_name, s.name, t.max_value\nFROM (SELECT course_id, MAX(value) AS max_value FROM score GROUP BY course_id) t\nJOIN score  sc ON sc.course_id = t.course_id AND sc.value = t.max_value\nJOIN course c  ON c.id = sc.course_id\nJOIN student s ON s.id = sc.student_id;\n```\n\n**第 3 题：查询没有选「数学」课的学生姓名。**\n思路：`NOT IN` 的子查询结果含 NULL 时整个查询返回空，推荐 `NOT EXISTS` 或 LEFT JOIN + IS NULL。\n\n```sql\nSELECT s.name FROM student s\nWHERE NOT EXISTS (\n  SELECT 1 FROM score sc\n  JOIN course c ON c.id = sc.course_id\n  WHERE sc.student_id = s.id AND c.name = '数学'\n);\n```\n\n**第 4~10 题（独立完成，附提示）：**\n\n| # | 题目 | 提示 |\n| --- | --- | --- |\n| 4 | 每个学生的平均分并降序排名 | GROUP BY + ORDER BY |\n| 5 | 选课数量大于等于 2 门的学生姓名 | COUNT + HAVING |\n| 6 | 既选了语文又选了数学的学生 | GROUP BY 后 HAVING COUNT(DISTINCT course_id) = 2 |\n| 7 | 每科成绩前两名（考虑并列） | MySQL 8 窗口函数 ROW_NUMBER / RANK |\n| 8 | 没有任何选课记录的学生 | LEFT JOIN ... IS NULL 或 NOT EXISTS |\n| 9 | 行转列：输出 学生/语文/数学/英语 每人一行 | CASE WHEN + GROUP BY + MAX |\n| 10 | 统计 90+、60~89、60 以下各分数段人数 | CASE WHEN 作为分组维度 |\n\n验收：10 题全部在本地库跑出正确结果；第 2、3 题不看答案能复述思路。\n\n## 💼 高频面试题\n\n**Q：CHAR 和 VARCHAR 的区别？**\n- CHAR(N) 定长，不足自动补空格，存取效率略高，适合长度固定的值（身份证、MD5）。\n- VARCHAR(N) 变长，额外 1~2 字节记录实际长度，省空间，适合长度波动大的值。\n- N 都是字符数不是字节数；utf8mb4 下一个中文最多 3 字节，emoji 占 4 字节。\n\n**Q：DATETIME 和 TIMESTAMP 怎么选？**\n- DATETIME 8 字节，范围 1000~9999 年，与时区无关；TIMESTAMP 4 字节，最大到 2038 年，存取时做时区转换。\n- 一般业务字段用 DATETIME + 应用层统一时区；\"跟随客户端时区变化\"的全球化场景才考虑 TIMESTAMP。\n- 建表常用 `DEFAULT CURRENT_TIMESTAMP` 和 `ON UPDATE CURRENT_TIMESTAMP` 自动维护创建/更新时间。\n\n**Q：DROP、DELETE、TRUNCATE 的区别？**\n- DELETE 是 DML：逐行删、可加 WHERE、事务内可回滚、不重置自增。\n- TRUNCATE 是 DDL：清空整表、不可回滚、重置自增、速度远快于无 WHERE 的 DELETE。\n- DROP 是 DDL：连表带结构一起删，不可回滚。\n- 一句话：删部分数据用 DELETE，清空重置用 TRUNCATE，表不要了用 DROP。\n\n**Q：内连接和左连接的区别？**\n- INNER JOIN 只返回两表都匹配的行；LEFT JOIN 保留左表全部行，右表匹配不上补 NULL。\n- 典型场景：\"查询所有用户，包括没下过单的\"必须 LEFT JOIN；内连接会把没下单的用户丢掉。\n- 反向需求\"只查没匹配上的行\"用 LEFT JOIN + WHERE 右表主键 IS NULL。\n\n**Q：WHERE 和 HAVING 的区别？**\n- 执行顺序上 WHERE 在 GROUP BY 之前过滤行，HAVING 在之后过滤分组。\n- WHERE 不能用聚合函数，HAVING 可以（此时聚合结果已产生）。\n- 能放 WHERE 的条件不放 HAVING：先过滤行，减少参与分组的数据量。\n\n**Q：IN 和 EXISTS 的区别？**\n- IN 先执行子查询得到结果集，外表逐行去匹配；EXISTS 以外表为驱动，逐行到子查询探测是否存在。\n- 经验法则：子查询结果集小用 IN，外表小用 EXISTS，本质都是小表驱动大表。\n- 注意 NOT IN 遇到 NULL 会整体返回空，用 NOT EXISTS 更安全。\n\n**Q：COUNT(*)、COUNT(1)、COUNT(列) 有什么区别？**\n- InnoDB 下 COUNT(*) 与 COUNT(1) 等价，官方对 COUNT(*) 有专门优化，推荐使用。\n- COUNT(col) 不统计 col 为 NULL 的行，语义不同，不要混用。\n- COUNT(主键) 并不更快，没必要替代 COUNT(*)。\n\n## 🔗 推荐资料\n\n| 资料 | 说明 | 链接 |\n| --- | --- | --- |\n| JavaGuide 数据库基础知识 | 基础概念、范式、数据类型全覆盖 | https://javaguide.cn/database/basis.html |\n| JavaGuide SQL 语句面试题 | 经典 SQL 练习题与解析，配合本篇练习 | https://javaguide.cn/database/sql/sql-questions-01.html |\n| JavaGuide MySQL 面试题 | 基础+进阶面试题速查 | https://javaguide.cn/database/mysql/mysql-questions-01.html |\n| pdai MySQL 知识体系总览 | 从安装到调优的知识目录地图 | https://pdai.tech/md/db/sql-mysql/sql-mysql-overview.html |\n| 廖雪峰 JDBC 教程 | 本篇第 6 节 JDBC 六步的代码级讲解 | https://liaoxuefeng.com/books/java/jdbc/index.html |\n","ck":0},{"id":"f14","stage":3,"path":"03-数据库篇/02-索引-事务-锁与调优.md","title":"索引-事务-锁与调优","md":"# 索引-事务-锁与调优\n\n> **阶段**：数据库篇 ｜ **建议时长**：7 天 ｜ **前置**：01-MySQL基础与SQL实战.md\n\n## 🎯 学习目标\n\n- 能从磁盘 IO 角度解释 InnoDB 为什么选 B+ 树，并说清聚簇索引、回表、覆盖索引、最左前缀。\n- 能画出 undo log 版本链 + ReadView，解释 MVCC 如何实现 RC/RR 两种隔离级别。\n- 能说清 redo/undo/binlog 三大日志的分工与两阶段提交的必要性。\n- 能用 explain 定位慢 SQL，独立完成本篇 3 条慢 SQL 的优化。\n- 能讲出主从复制原理与分库分表的触发条件、代价、常见方案。\n\n## 📖 核心知识点\n\n### 1. 索引：为什么用 B+ 树 ⭐\n\n> 面试官想听：不是背\"B+ 树好\"，而是能拿哈希/红黑树/B 树逐个对比出原因。\n\n索引本质：一张排好序的、以空间换时间的查找结构。InnoDB 以**页**（默认 16KB）为最小 IO 单位，衡量指标就是\"找一行数据要几次页 IO\"。\n\n| 结构 | 问题 |\n| --- | --- |\n| 哈希表 | 等值快，但不支持范围查询和排序 |\n| 红黑树（二叉） | 树太高：1000 万数据约 23 层 = 23 次磁盘 IO |\n| B 树 | 非叶子节点也存数据，单页容纳的键少、树变高；范围查询要中序回溯 |\n| B+ 树 | 非叶子只存键+指针，叶子存数据且用双向链表串起来 |\n\n```text\n高度估算（InnoDB 默认 16KB 页）：\n非叶子节点：bigint 主键 8B + 页指针 6B ≈ 一页放 1170 项\n叶子节点：按一行 1KB 估算，一页放约 16 行\n3 层容量 ≈ 1170 × 1170 × 16 ≈ 2000 万行 → 3 次 IO 定位任意一行\n范围查询：定位起点后沿叶子链表顺序扫描即可\n```\n\n**聚簇索引 vs 二级索引**：聚簇索引即主键索引，叶子节点存整行数据（所以表本身就是一棵 B+ 树）；二级索引（辅助索引）叶子节点只存\"索引列 + 主键值\"。用二级索引查非覆盖列时，要先拿主键再回聚簇索引查整行，这一步叫**回表**。\n\n**覆盖索引**：查询的列全部包含在某个索引里，无需回表，explain 的 Extra 显示 `Using index`。常用手段：把 `SELECT` 需要的列加进联合索引，或至少 `SELECT id`（二级索引自带主键）。\n\n**最左前缀原则**：联合索引 `(a, b, c)` 相当于建了 `a`、`(a,b)`、`(a,b,c)` 三套索引能力；查询条件必须从最左列开始连续命中，遇到范围查询（>、<、between、like 'xx%'）后面的列停止走索引。设计口诀：等值列在前、范围列在后、尽量覆盖查询字段。\n\n**索引下推（ICP）**：MySQL 5.6+ 默认开启，联合索引中即使某列不能直接走索引匹配，也可在引擎层先过滤，减少回表次数。\n\n### 2. 索引失效的常见场景 ⭐\n\n> 面试官想听：能结合 explain 说出至少 5 种失效原因，而不是死记硬背。\n\n```sql\n-- 以下写法都会让 idx_name 等索引失效或部分失效\nWHERE LEFT(name, 1) = '张'          -- 1. 对索引列使用函数\nWHERE name = '张' OR age = 18       -- 2. OR 两侧存在无索引的列\nWHERE name LIKE '%三'               -- 3. 左模糊（'张%' 不失效）\nWHERE phone = 13800000000           -- 4. 隐式类型转换：varchar 列传了数字\nWHERE age + 1 = 20                  -- 5. 对索引列做运算\nWHERE b = 2                         -- 6. 联合索引 (a,b) 跳过最左列 a\nWHERE id <> 5 / NOT IN (...)        -- 7. 否定条件通常无法走索引（视优化器而定）\n```\n\n另两类\"假失效\"：优化器判断全表扫描更快（回表数据量大、查询超过表的 20%~30%）；统计信息过期。排查手段永远是 `EXPLAIN` + 实测。\n\n### 3. explain 关键列 ⭐\n\n> 面试官想听：拿到 explain 输出能立刻判断这条 SQL 健不健康。\n\n```sql\nEXPLAIN SELECT * FROM big_user WHERE name = 'user_999999';\n```\n\n重点看 5 列：\n\n| 列 | 关注点 |\n| --- | --- |\n| id | 子查询执行顺序；id 相同从上往下 |\n| type | 访问类型，从好到差：`const > eq_ref > ref > range > index > ALL`，生产 SQL 至少 range |\n| key | 实际用到的索引；key=NULL 说明没走索引 |\n| rows | 预估扫描行数，越接近 1 越好，百万级就要警惕 |\n| Extra | `Using index` 覆盖索引（好）；`Using filesort` 额外排序（坏）；`Using temporary` 临时表（坏） |\n\n### 4. 事务：ACID、隔离级别与 MVCC ⭐\n\n> 面试官想听：ACID 各靠什么机制实现，MVCC 能讲出\"版本链 + ReadView\"两件套。\n\n- **原子性**：undo log 回滚未提交的修改。\n- **持久性**：redo log 保证提交后宕机不丢（WAL：先写日志再刷数据页）。\n- **隔离性**：MVCC + 锁。\n- **一致性**：前三者是手段，一致性是最终目的。\n\n三类并发问题：**脏读**（读到别人未提交的数据）、**不可重复读**（同一次事务内两次读同一行值不同——针对 UPDATE）、**幻读**（两次范围查询行数不同——针对 INSERT/DELETE）。\n\n四个隔离级别（MySQL InnoDB 默认 **REPEATABLE READ**）：\n\n| 级别 | 脏读 | 不可重复读 | 幻读 |\n| --- | --- | --- | --- |\n| READ UNCOMMITTED | 可能 | 可能 | 可能 |\n| READ COMMITTED | 避免了 | 可能 | 可能 |\n| REPEATABLE READ（默认） | 避免了 | 避免了 | 快照读避免/当前读靠临键锁 |\n| SERIALIZABLE | 避免了 | 避免了 | 避免了 |\n\n**MVCC 原理**：\n\n```text\n隐藏列：每行有 trx_id(最近修改它的事务) 和 roll_pointer(指向 undo log 旧版本)\nundo log 版本链：多次修改形成链表，新版本指向旧版本\nReadView：m_ids(生成时刻的活跃事务列表)、min_trx_id、max_trx_id、creator_trx_id\n可见性判断：trx_id < min → 可见；trx_id >= max → 不可见；\n           介于中间 → 在 m_ids 里不可见、不在则可见；不可见就顺 roll_pointer 找旧版本\n```\n\nRC 与 RR 的唯一实现差异：**RC 每次快照读都生成新的 ReadView，RR 只在第一次快照读时生成并复用**——这就是 RR 能\"可重复读\"的原因。\n\n**RR 下如何避免幻读**：快照读（普通 SELECT）靠 MVCC 看到的是事务开始时的快照；当前读（`SELECT ... FOR UPDATE / UPDATE / DELETE / INSERT`）靠 **Next-Key Lock = 记录锁 + 间隙锁**锁住范围，阻止其他事务在范围内插入。两个会话混用快照读和当前读时仍可能出现\"幻影行\"，这是加分项。\n\n### 5. 三大日志与两阶段提交 ⭐\n\n> 面试官想听：redo/undo/binlog 分属什么层、解决什么问题，以及为什么提交要\"两阶段\"。\n\n| 日志 | 层级 | 类型 | 写法 | 作用 |\n| --- | --- | --- | --- | --- |\n| redo log | InnoDB | 物理日志（改了哪个页） | 固定大小循环写 | 崩溃恢复，保证持久性（WAL） |\n| undo log | InnoDB | 逻辑日志（反向操作） | 随数据版本留存 | 回滚（原子性）+ MVCC 版本链 |\n| binlog | Server 层 | 逻辑日志（语句/行变更） | 追加写 | 主从复制、数据恢复 |\n\n**两阶段提交（2PC）**：执行更新时 redo log 先写 `prepare` → 写 binlog → 提交时 redo log 置为 `commit`。为什么必须这样：redo 与 binlog 是两份独立日志，若不做两阶段，崩溃恢复时二者可能不一致，导致主从数据不一致（如 redo 写完 binlog 还没写，恢复后主库有这条数据、从库没有）。\n\n**崩溃恢复怎么判断该提交还是回滚**（高频追问）：redo log 的 prepare 记录里带了 **XID**（事务 ID）。重启后扫描 redo log：\n\n- 若该事务的 redo 已是 `commit` 状态 → 直接提交；\n- 若处于 `prepare` 状态 → 拿 XID 去 **binlog 里查**：**能找到**（说明 binlog 已写成功）→ 提交；**找不到** → 回滚。\n\n判据的本质是「**binlog 写成功才算事务真正提交成功**」——因为主从复制依赖 binlog，只有保证「binlog 有则主库必提交、binlog 无则主库必回滚」，主从才可能一致。\n\n**组提交（group commit）**：两阶段提交要求每个事务提交时刷盘，高频写入下每次一次 `fsync` 会成瓶颈。MySQL 把 commit 阶段拆成 **flush → sync → commit 三段**，每段维护一个队列、由队首事务当 leader 带队执行：**多个事务的 binlog 合并成一次 fsync 落盘**，等于把磁盘 IO 开销摊薄到整组。prepare 阶段不变。这也解释了为什么 `sync_binlog=1` + `innodb_flush_log_at_trx_commit=1`（双 1 配置）在高并发下没有想象中慢——组提交把并发事务的刷盘合并了。\n\n### 6. 锁：表锁、行锁、间隙锁 ⭐\n\n> 面试官想听：知道\"行锁锁的是索引项\"，以及乐观锁悲观锁怎么选。\n\n- 全局锁（`FLUSH TABLES WITH READ LOCK`，用于全库逻辑备份）、表级锁、元数据锁（MDL，防 DDL 与查询冲突）、意向锁（表级标记，快速判断表中是否有行锁）。\n- 行锁三种：**Record Lock** 锁单条索引记录；**Gap Lock** 锁索引记录之间的间隙；**Next-Key Lock** = Record + Gap，RR 级别防止幻读的主力。\n- **插入意向锁（Insert Intention Lock）**：INSERT 之前设置的一种**特殊的间隙锁**，只表示\"我打算在这个间隙里插一行，插入位置在这\"。要点：① 它**不是表锁**，是行级/间隙级的意向标记；② **多个插入意向锁之间互不冲突**（大家都可以\"打算\"往同一间隙插）；③ 但它与**已有的、范围内其他事务持有的间隙锁冲突**——若别人先用 `SELECT ... FOR UPDATE` 锁住了这个间隙，你的 INSERT 就会阻塞等它释放。这正是\"并发插入被间隙锁阻塞\"与\"插入死锁\"的常见来源：两个事务各持有某间隙的间隙锁、又都想插入对方锁住的间隙，就互相等待成环。RC 级别下间隙锁基本不生效，插入意向锁也就少见——不是 RC 才产生它，而是 RC 少用间隙锁、冲突面小。\n- 关键推论：**行锁加在索引上**，WHERE 条件没走索引时会退化成扫描全表并把扫过的记录全锁住，等于锁全表。\n- **另一个关键推论：非唯一索引等值查询也会锁相邻间隙**。RR 下用非唯一索引等值查 `WHERE a = 10` 时，Next-Key Lock 锁的不只是 a=10 那条记录，而是 **`(5, 10]` 与 `(10, 15]` 两个区间**（左开右闭，含前一条记录到 10 的间隙、以及 10 到后一条记录的间隙）——因为不唯一索引里 a=10 可能有多条，必须锁住相邻间隙防止插入新的 a=10。所以并发插入 a=8（落在 (5,10] 内）会被阻塞；而普通 `SELECT`（快照读）走 MVCC 不加锁，不受影响。这是\"明明只查了一行却把别人插不进来\"的经典来源。等值查唯一索引时则退化为记录锁，不加间隙。\n- 悲观锁：假定会冲突，先加锁再操作，如 `SELECT ... FOR UPDATE`，适合写多冲突激烈的场景。\n- 乐观锁：不加锁，提交时用版本号校验，适合读多写少：\n\n```sql\nUPDATE stock SET num = num - 1, version = version + 1\nWHERE id = 1 AND version = 5;   -- 影响行数为 0 说明被并发修改过，业务侧重试\n```\n\n### 7. 调优与架构演进 ⭐\n\n> 面试官想听：一条完整的\"发现慢 SQL → 分析 → 优化 → 验证\"流程，以及大表治理的全景。\n\n**慢 SQL 定位流程**：开慢查询日志捕获 → 按耗时/扫描行数排序 → `EXPLAIN` 分析 → 加索引或改写 SQL → 复测验证。\n\n```sql\nSET GLOBAL slow_query_log = ON;      -- 开启慢日志\nSET GLOBAL long_query_time = 1;      -- 超过 1 秒记录\nSHOW VARIABLES LIKE 'slow_query_log%';\n```\n\n**SQL 优化清单**：只查需要的列（拒绝 `SELECT *`，给覆盖索引机会）；为 WHERE/ORDER BY 列建合适的联合索引；深分页改写；JOIN 用小表驱动大表并保证关联字段有索引；UNION ALL 代替 UNION；大事务拆小事务，减少锁持有时间；批量插入合并语句。\n\n**深分页优化**：\n\n```sql\n-- 慢：LIMIT 900000, 10 要扫描 90 万零 10 行再丢弃\nSELECT * FROM big_user ORDER BY id LIMIT 900000, 10;\n-- 快① 延迟关联：先用覆盖索引拿到 10 个 id，再回表\nSELECT u.* FROM big_user u\nJOIN (SELECT id FROM big_user ORDER BY id LIMIT 900000, 10) t ON u.id = t.id;\n-- 快② 游标分页：记住上一页最后的 id，要求连续翻页\nSELECT * FROM big_user WHERE id > 900000 ORDER BY id LIMIT 10;\n```\n\n**主从复制**：主库写 binlog → 从库 IO 线程拉取写入本地 relay log → 从库 SQL 线程重放。用途：读写分离（写主读从）、容灾备份。主从延迟的原因：从库单线程重放慢、大事务、机器差；对策：关键读强制走主库、并行复制、监控 `Seconds_Behind_Master`。\n\n**分库分表**：垂直分库按业务拆（订单库、用户库），垂直分表把大字段拆扩展表；水平分表按行拆（按用户 id 取模、按时间分表）。分片键要选查询最高频的维度（通常用户 id）。拆分的代价：跨库 JOIN 变难、需要分布式事务、需要全局唯一 ID、扩容数据迁移复杂。原则：**先垂直后水平，索引和缓存优化到底扛不住了再分**。\n\n## 🛠 动手实践\n\n### 任务 1：造 100 万数据，对比有无索引（1 小时）\n\n```sql\nCREATE TABLE big_user (\n  id BIGINT PRIMARY KEY AUTO_INCREMENT,\n  name VARCHAR(20), age INT, city VARCHAR(20), created_at DATETIME\n);\n\nDELIMITER $$\nCREATE PROCEDURE gen_data(IN n INT)\nBEGIN\n  DECLARE i INT DEFAULT 0;\n  START TRANSACTION;\n  WHILE i < n DO\n    INSERT INTO big_user (name, age, city, created_at)\n    VALUES (CONCAT('user_', i), FLOOR(RAND()*50)+18,\n            ELT(FLOOR(RAND()*4)+1, '北京','上海','深圳','杭州'), NOW());\n    SET i = i + 1;\n  END WHILE;\n  COMMIT;\nEND $$\nDELIMITER ;\n\nCALL gen_data(1000000);\n```\n\n验收：无索引 `SELECT * FROM big_user WHERE name='user_999999'` 耗时可观测（百万级约几百 ms），建 `idx_name` 后降到几 ms；两次 explain 的 type 分别为 ALL 和 ref，能复述原因。\n\n### 任务 2：explain 优化 3 条慢 SQL（2 小时）\n\n| # | 慢 SQL | 优化方向 |\n| --- | --- | --- |\n| 1 | `WHERE city='北京' AND age=20 ORDER BY created_at` | 建联合索引 `(city, age, created_at)`，消除 Using filesort |\n| 2 | `ORDER BY id LIMIT 900000, 10` | 延迟关联或游标分页（见上文） |\n| 3 | `WHERE name = 13800000000`（name 是 varchar） | 改传字符串，消除隐式类型转换 |\n\n验收：3 条优化前后各跑一次 explain，type 提升、rows 数量级下降，并各写一句优化说明。\n\n### 任务 3：开启慢日志（30 分钟）\n\n按第 7 节配置开启慢日志，故意跑几条全表扫描 SQL，再到日志文件里找到它们。\n验收：日志中出现慢 SQL 记录，能指出 Query_time 和 Rows_examined 两个字段。\n\n### 任务 4：两个会话演示隔离级别与锁（1 小时）\n\n```sql\n-- 会话 A（开两个终端各连一个客户端）\nSET SESSION TRANSACTION ISOLATION LEVEL READ COMMITTED;\nBEGIN;\nSELECT * FROM big_user WHERE id = 1;         -- 第一次读\n-- 会话 B：UPDATE big_user SET age=99 WHERE id=1; COMMIT;\nSELECT * FROM big_user WHERE id = 1;         -- RC 下值变了（不可重复读）\n-- 再把会话 A 改成 REPEATABLE READ 重复实验：值不变，体会 ReadView 复用\n```\n\n再在 RR 下：会话 A `BEGIN; SELECT * FROM big_user WHERE id BETWEEN 100 AND 200 FOR UPDATE;`，会话 B 尝试 `INSERT` id=150，应被阻塞（临键锁生效）。\n验收：三个实验现象截图或记录，各配一句话解释。\n\n## 💼 高频面试题\n\n**Q：为什么 InnoDB 用 B+ 树而不是哈希、红黑树、B 树？**\n- 哈希不支持范围查询和排序，只适合等值。\n- 红黑树是二叉的，千万数据树高 20+ 层，每层一次磁盘 IO，太高。\n- B 树非叶子也存数据，单页容纳键少树更高，范围查询需中序遍历回溯。\n- B+ 树非叶子只存键，3 层可容纳约 2000 万行；叶子双向链表，范围查询顺序扫描即可。\n\n**Q：什么是回表？怎么避免？**\n- 二级索引叶子只存主键值，查到主键后还要回聚簇索引取整行，这就是回表。\n- 用覆盖索引避免：查询列全部在索引里，explain 出现 Using index。\n- 手段：把高频查询列加入联合索引；至少 `SELECT id` 而不是 `SELECT *`。\n\n**Q：联合索引的最左前缀原则？**\n- 联合索引 (a,b,c) 按 a 排序、a 相同再按 b、再按 c，等价于 a、(a,b)、(a,b,c) 三套索引能力。\n- 查询必须从最左列开始连续命中；遇到范围查询，后面的列停止走索引。\n- 设计上把等值条件列放前面、范围列放后面，并尽量让常用查询覆盖。\n\n**Q：索引什么时候会失效？**\n- 对索引列用函数或运算；隐式类型转换（varchar 列传数字）。\n- LIKE 以 % 开头；联合索引不满足最左前缀。\n- OR 连接了无索引列；NOT IN / != 通常无法走索引。\n- 优化器认为回表成本高于全表扫描（查询比例过大）也会放弃索引——一切以 explain 实测为准。\n\n**Q：事务的隔离级别有哪些？MySQL 默认哪个，怎么实现的？**\n- 读未提交、读已提交（RC）、可重复读（RR，InnoDB 默认）、串行化。\n- 分别解决脏读、不可重复读、幻读的递进问题。\n- 实现靠 MVCC（快照读）+ 锁（当前读）：RC 每次读生成新 ReadView，RR 复用第一次的 ReadView。\n\n**Q：讲一下 MVCC 的原理。**\n- 三件套：隐藏列（trx_id、roll_pointer）+ undo log 版本链 + ReadView。\n- 读时拿 ReadView 和版本链上各版本的 trx_id 比对可见性，不可见就沿链找旧版本。\n- 实现了读写不阻塞；RC 与 RR 的差别只在生成 ReadView 的时机。\n\n**Q：redo log、undo log、binlog 的区别？为什么要两阶段提交？**\n- redo：InnoDB 物理日志、循环写，崩溃恢复保证持久性；undo：InnoDB 逻辑日志，回滚 + MVCC；binlog：Server 层逻辑日志、追加写，用于主从复制和恢复。\n- 两阶段提交：redo prepare → 写 binlog → redo commit。\n- 目的是保证两份日志一致，否则崩溃恢复后主从数据不一致。\n\n**Q：线上出现慢 SQL，怎么排查？**\n- 开慢查询日志定位具体 SQL，看执行频率与耗时分布。\n- EXPLAIN 分析：type 是否 ALL、key 是否为 NULL、rows 是否巨大、Extra 有无 filesort/temporary。\n- 优化手段：建/改联合索引、覆盖索引、改写 SQL（深分页、函数下界）、必要时上缓存或读写分离。\n- 改完必须复测 explain 与真实耗时，形成闭环。\n\n**Q：一张千万级大表，你有哪些优化思路？**\n- 先做索引与 SQL 优化、覆盖索引、深分页改写，成本最低收益最大。\n- 上缓存挡读流量；读写分离分担读压力。\n- 冷热数据归档（历史表），减小活跃数据量。\n- 仍不够再分库分表：垂直拆业务、水平按分片键拆行，同时接受跨库 JOIN、分布式事务、全局 ID 的复杂度。\n\n## 🔗 推荐资料\n\n| 资料 | 说明 | 链接 |\n| --- | --- | --- |\n| pdai MySQL 索引（B+ 树） | B+ 树结构与索引原理图文详解 | https://pdai.tech/md/db/sql-mysql/sql-mysql-b-tree.html |\n| pdai MySQL 性能优化 | explain、慢 SQL、优化清单 | https://pdai.tech/md/db/sql-mysql/sql-mysql-performance.html |\n| pdai MySQL 主从复制 | 复制原理与读写分离实践 | https://pdai.tech/md/db/sql-mysql/sql-mysql-slave.html |\n| pdai MySQL 分库分表 | 拆分策略与带来的问题 | https://pdai.tech/md/db/sql-mysql/sql-mysql-devide.html |\n| JavaGuide MySQL 面试题 | 本篇高频题的标准答案库 | https://javaguide.cn/database/mysql/mysql-questions-01.html |\n| JavaGuide 读写分离与分库分表 | 何时拆、怎么拆的决策思路 | https://javaguide.cn/high-performance/read-and-write-separation-and-library-subtable.html |\n| JavaGuide 数据库基础知识 | 事务、日志等基础概念补充 | https://javaguide.cn/database/basis.html |\n","ck":0},{"id":"f15","stage":4,"path":"04-框架篇/01-Spring核心.md","title":"Spring核心","md":"# Spring核心\n\n> **阶段**：框架篇 ｜ **建议时长**：6 天 ｜ **前置**：已完成入门篇/进阶篇\n\n## 🎯 学习目标\n\n- 能说清 IoC/DI 概念与好处，并用注解和 JavaConfig 两种方式完成依赖注入。\n- 能按顺序复述 Bean 生命周期，并说出 AOP 代理生成的时机。\n- 能解释 JDK 动态代理与 CGLIB 的区别，并手写一个记录接口耗时的切面。\n- 能列出 @Transactional 至少 5 种失效场景，并现场演示、修复其中一种。\n- 能讲出循环依赖三级缓存的流转过程与\"为什么是三级\"。\n- 能画出 DispatcherServlet 处理请求的完整流程。\n\n## 📖 核心知识点\n\n### 1. IoC 与 DI ⭐\n\n> 面试官想听：能否一句话讲清\"控制反转是什么、反转了什么\"，以及它解决了什么痛点。\n\n- **IoC（控制反转）**：对象的创建和依赖关系的管理，从程序员手写 `new` 反转为交给 Spring 容器统一负责。**DI（依赖注入）**是 IoC 的实现手段：容器在创建对象时，把依赖的对象\"注入\"进来。\n- 好处：调用方与实现类解耦（换实现只改配置）；便于单测（注入 Mock）；对象生命周期与配置集中管理。\n- 注解装配：`@Component` 通用组件，衍生 `@Service / @Repository / @Controller`（语义分层）；注入用 `@Autowired`（Spring 提供，按类型匹配，多个候选配合 `@Qualifier` 或 `@Primary`）、`@Resource`（JDK 规范，默认按名称）。\n- JavaConfig：`@Configuration` + `@Bean`，适合装配第三方类（没源码、没法打注解的类）。\n\n```java\n@Configuration\npublic class AppConfig {\n    @Bean   // 方法名即 beanName，返回值交给容器管理\n    public OrderService orderService(UserRepository repo) {  // 参数自动注入\n        return new OrderService(repo);\n    }\n}\n```\n\n**Bean 作用域**：`singleton`（默认，容器内单例）、`prototype`（每次获取新建）、`request`/`session`（Web 环境）。注意：单例 Bean 中持有可变成员变量是并发隐患，尽量无状态。\n\n### 2. Bean 生命周期 ⭐\n\n> 面试官想听：能按顺序说出五个阶段，并知道 AOP 代理在初始化之后、由 BeanPostProcessor 生成。\n\n```text\n1. 实例化 Instantiation     —— 反射调用构造器，只是个\"毛坯\"对象\n2. 属性填充 Populate        —— @Autowired / @Value 注入依赖\n3. 初始化 Initialization    —— Aware 回调（BeanNameAware/ApplicationContextAware）\n                              → BeanPostProcessor#postProcessBeforeInitialization\n                              → @PostConstruct → InitializingBean#afterPropertiesSet → init-method\n                              → BeanPostProcessor#postProcessAfterInitialization（AOP 代理通常在这里生成）\n4. 使用\n5. 销毁 Destruction         —— 容器关闭时：@PreDestroy → DisposableBean#destroy → destroy-method\n```\n\n记忆抓手：`InstantiationAwareBeanPostProcessor` 前后夹着实例化和初始化；`BeanPostProcessor` 是 AOP、@Autowired 注入等框架能力的扩展点——这也是\"Spring 大部分黑魔法都靠 BeanPostProcessor\"这个加分项的来源。\n\n### 3. AOP：面向切面编程 ⭐\n\n> 面试官想听：术语不出错 + 两种代理的区别 + 你真实用它做过什么。\n\n- 术语：**连接点 JoinPoint**（可被拦截的方法）、**切点 Pointcut**（筛选连接点的表达式）、**通知 Advice**（拦截后做什么：@Before/@After/@AfterReturning/@AfterThrowing/@Around）、**切面 Aspect**（切点 + 通知）、**织入**（把切面应用到目标对象生成代理）。\n- **JDK 动态代理**：基于接口，运行时生成实现相同接口的代理类（`Proxy + InvocationHandler`）。\n- **CGLIB**：基于继承，生成目标类的子类字节码，不能代理 final 类/方法。\n- Spring Boot 2.x 起默认强制使用 CGLIB（`proxyTargetClass=true`）；有接口也用 CGLIB，保证注入统一。\n\n```java\n@Aspect @Component\npublic class CostAspect {\n    @Around(\"execution(* com.example.demo.controller..*(..))\")\n    public Object around(ProceedingJoinPoint pjp) throws Throwable {\n        long start = System.currentTimeMillis();\n        try {\n            return pjp.proceed();\n        } finally {\n            log.info(\"{} cost {}ms\", pjp.getSignature(), System.currentTimeMillis() - start);\n        }\n    }\n}\n```\n\n典型应用：接口耗时监控、操作日志、权限校验、接口幂等/限流；`@Transactional` 的底层就是 AOP——这一点直接衔接下一节的事务失效。\n\n### 4. 事务与失效场景大全 ⭐\n\n> 面试官想听：失效场景是 Spring 面试出现率最高的问题之一，要能说出 5 个以上并讲出\"失效本质 = 没走到代理\"。\n\n`@Transactional` 关键属性：`propagation`（传播行为）、`isolation`（隔离级别）、`rollbackFor`（触发回滚的异常）、`readOnly`、`timeout`。\n\n**传播行为三剑客**：\n\n- `REQUIRED`（默认）：有事务就加入，没有就新建。\n- `REQUIRES_NEW`：挂起当前事务，新建独立事务——内部操作是否回滚与外层无关（如\"记录操作日志\"即使业务回滚也要落库）。\n- `NESTED`：在当前事务内打保存点，可回滚到保存点而不影响外层；外层回滚则它一定回滚。\n\n**失效场景大全**：\n\n```java\n@Service\npublic class OrderService {\n    public void create() {\n        this.doSave();                       // ① 自调用：this 是原始对象不是代理 → 失效\n    }\n    @Transactional\n    public void doSave() { ... }\n\n    @Transactional\n    public void bad() {\n        try {\n            orderMapper.update(...);\n        } catch (Exception e) { log.error(...); }   // ② 异常被吞 → 失效\n    }\n\n    @Transactional                            // ③ 默认只回滚 RuntimeException/Error\n    public void check() throws Exception {\n        throw new Exception(\"受检异常默认不回滚\");   // 需 rollbackFor = Exception.class\n    }\n    // ④ 方法不是 public（代理只拦截 public）\n    // ⑤ 类没被 Spring 管理（没加 @Service 等）\n    // ⑥ 数据库引擎不支持事务（MyISAM）\n    // ⑦ 传播行为配错，如 NOT_SUPPORTED 会以非事务运行\n}\n```\n\n修复 ①：注入自身代理（`@Autowired private OrderService self;`）、`AopContext.currentProxy()` 或把方法拆到另一个类。记忆主线：**事务由代理实现，一切让调用绕过代理的写法都会失效**。\n\n### 5. 循环依赖与三级缓存 ⭐\n\n> 面试官想听：三级缓存各自存什么、流转过程，以及\"为什么二级不够\"。\n\nA 依赖 B、B 依赖 A（都是单例、setter/字段注入）时的解法：\n\n```text\n一级缓存 singletonObjects      成品 Bean\n二级缓存 earlySingletonObjects 提前曝光的半成品（已实例化、未完成属性填充）\n三级缓存 singletonFactories    ObjectFactory（能生产早期引用，必要时在这里提前生成 AOP 代理）\n\n流程：A 实例化 → 把 A 的工厂放入三级缓存 → A 填充属性发现要 B\n     → B 实例化 → B 填充属性要 A → 从三级缓存拿到 A 的早期引用（放进二级缓存）\n     → B 完成初始化进入一级缓存 → A 继续完成初始化进入一级缓存\n```\n\n为什么需要三级而不是二级：三级缓存存的是工厂，**只有真正发生循环依赖时才会提前创建 AOP 代理**；没有循环依赖时代理仍走正常初始化后生成，不破坏 Bean 生命周期。二级缓存也能工作，但会迫使所有 Bean 提前生成代理。\n\n边界：构造器注入的循环依赖无解（实例化前就需要对方）；prototype 不处理；Spring Boot 2.6+ 默认禁止循环依赖，启动报错，需 `spring.main.allow-circular-references=true` 放开——官方态度是\"循环依赖是设计坏味道，该重构\"。\n\n### 6. SpringMVC：请求处理流程 ⭐\n\n> 面试官想听：从请求进来到响应出去，中间经过哪些组件，能说出 HttpMessageConverter 更佳。\n\n```text\n请求 → DispatcherServlet（前端控制器，唯一入口）\n     → HandlerMapping（根据 URL 找到 Handler 及拦截器链 HandlerExecutionChain）\n     → HandlerAdapter → 参数解析（@RequestParam/@PathVariable/@RequestBody）\n                        → 反射调用 Controller 方法 → 返回值处理\n     → @ResponseBody：HttpMessageConverter 序列化为 JSON 直接写响应（前后端分离主流）\n     → 传统视图：ViewResolver 解析视图 → 渲染模板\n     → 过程中抛异常 → @ControllerAdvice + @ExceptionHandler 统一捕获\n```\n\n**拦截器 vs 过滤器**：过滤器是 Servlet 规范组件，由容器管理，在 DispatcherServlet 之前执行，能拿到的是原始 request/response，适合编码、跨域；拦截器是 Spring 的组件，在 Controller 前后执行，可以注入 Spring Bean、拿到 Handler 信息，适合登录校验、日志、权限。\n\n**参数注解辨析**：`@RequestParam` 接 query/form 单值参数；`@PathVariable` 接 URL 路径占位符；`@RequestBody` 把请求体 JSON 反序列化为对象（Content-Type: application/json，走 HttpMessageConverter）。\n\n全局异常：`@RestControllerAdvice` 捕获所有 Controller 的异常，配合自定义 `BusinessException` 返回统一错误体——下一篇 SpringBoot 实战直接落地。\n\n## 🛠 动手实践\n\n### 任务 1：JavaConfig 演示 IoC/DI（1 小时）\n\n不用任何注解扫包，纯 JavaConfig 装配：\n\n```java\npublic interface SmsSender { void send(String msg); }\npublic class AliyunSmsSender implements SmsSender {\n    @Override public void send(String msg) { System.out.println(\"阿里云短信: \" + msg); }\n}\n\n@Configuration\npublic class AppConfig {\n    @Bean public SmsSender smsSender() { return new AliyunSmsSender(); }\n    @Bean public NotifyService notifyService(SmsSender sender) {   // 构造器注入\n        return new NotifyService(sender);\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        var ctx = new AnnotationConfigApplicationContext(AppConfig.class);\n        ctx.getBean(NotifyService.class).notifyAll(\"欢迎注册\");\n    }\n}\n```\n\n验收：新增一个 `TencentSmsSender` 实现类，只改 `AppConfig` 一处就能切换实现，体会\"面向接口 + 容器装配\"的解耦。\n\n### 任务 2：AOP 记录接口耗时（1.5 小时）\n\n用 Spring Boot 建一个最小 Web 项目，写两个 Controller 接口，按上文 `CostAspect` 实现 `@Around` 切面。\n验收：调用接口后控制台打印\"方法签名 + 耗时\"；把切点改成只拦 `service` 包后接口耗时日志消失，验证切点生效范围。\n\n### 任务 3：演示并修复一次事务失效（1.5 小时）\n\n建表 `account(id, balance)`，写转账 Service：\n\n```java\n@Service\npublic class TransferService {\n    @Transactional\n    public void transfer(Long from, Long to, int amount) {\n        accountMapper.decrease(from, amount);\n        if (amount > 1000) throw new RuntimeException(\"超限\");  // 制造异常\n        accountMapper.increase(to, amount);\n    }\n}\n```\n\n先构造失效版本：另写一个方法 `public void proxy() { this.transfer(...); }` 从外部调 `proxy()`，观察异常抛出后余额仍被扣减（没回滚）。\n验收：修复方式三选一（注入自身代理 / 拆方法到另一个 Service / AopContext），修复后异常时两步操作都回滚；能用一句话解释失效原因（自调用绕过了代理）。\n\n## 💼 高频面试题\n\n**Q：什么是 IoC 和 DI？带来了什么好处？**\n- IoC：对象的创建与依赖管理由容器负责，控制权从程序员手里反转给框架；DI 是它的实现方式，依赖由容器注入。\n- 好处：调用方只依赖接口，替换实现不改代码（解耦）；单测可注入 Mock；生命周期、配置集中管理。\n- 装配方式：注解扫包（@Component 系列）与 JavaConfig（@Configuration + @Bean）。\n\n**Q：说说 Bean 的生命周期。**\n- 实例化（构造器）→ 属性填充（依赖注入）→ 初始化（Aware 回调 → BeanPostProcessor 前置 → @PostConstruct → afterPropertiesSet → BeanPostProcessor 后置）→ 使用 → 销毁（@PreDestroy → destroy）。\n- 加分：AOP 代理在初始化后由 BeanPostProcessor 生成；框架扩展大多通过 BeanPostProcessor 实现。\n\n**Q：Bean 的作用域有哪些？**\n- singleton 默认，容器内单例；prototype 每次获取新建。\n- Web 环境还有 request、session。\n- 注意单例 Bean 里放可变状态有线程安全问题，Service 应保持无状态。\n\n**Q：AOP 是什么原理？JDK 动态代理和 CGLIB 的区别？**\n- AOP 把日志、事务等横切逻辑从业务代码中抽离，运行期由代理对象织入。\n- JDK 动态代理基于接口（Proxy + InvocationHandler）；CGLIB 基于继承生成子类，不能代理 final 类和方法。\n- Spring Boot 2.x 起默认 CGLIB；典型应用：事务、日志、耗时监控、权限。\n\n**Q：@Transactional 的传播行为？**\n- REQUIRED（默认）：有事务加入，无则新建。\n- REQUIRES_NEW：挂起当前事务另起新事务，内外回滚互不影响，适合\"日志必须落库\"。\n- NESTED：保存点机制，可局部回滚，外层回滚则整体回滚。\n\n**Q：@Transactional 在哪些情况下会失效？**\n- 自调用（this 调用绕过代理）、方法非 public、类未被 Spring 管理。\n- 异常被 try-catch 吞掉；抛受检异常但没配 rollbackFor。\n- 数据库引擎不支持事务（MyISAM）、传播行为配置错误。\n- 本质一句话：事务靠 AOP 代理实现，绕过代理就不生效。\n\n**Q：Spring 怎么解决循环依赖？为什么需要三级缓存？**\n- 用三级缓存：一级成品、二级半成品、三级 ObjectFactory。\n- A 实例化后先暴露工厂引用，B 注入 A 时拿到早期引用，B 先完成，A 再完成。\n- 三级缓存的意义：只在发生循环依赖时才提前生成 AOP 代理，不破坏正常生命周期；构造器注入的循环
