-Maven-Linux.md |\n| ⭐SRE | Site Reliability Engineering | 用工程手段做运维：SLO、错误预算、值班与故障复盘 | ../06-分布式与高并发篇/02-高并发系统设计.md |\n| APM | Application Performance Management | 应用性能监控（SkyWalking、Pinpoint、ARMS），链路追踪 + 指标 + 告警 | 同上 |\n| ⭐ELK | Elasticsearch + Logstash + Kibana | 日志集中收集检索栈；轻量版 EFK/PLG（Fluentd/Promtail） | ../05-中间件篇/05-Elasticsearch.md |\n| ⭐IoC / DI | Inversion of Control / Dependency Injection | 控制权反转：对象不自己 new，交给容器创建装配；DI 是 IoC 的实现手段 | ../04-框架篇/01-Spring核心.md |\n| ⭐AOP | Aspect-Oriented Programming | 切面编程：把日志/事务/权限等横切逻辑与业务分离，靠动态代理实现 | 同上 |\n| DDD | Domain-Driven Design | 领域驱动设计。**战略**：限界上下文、通用语言、上下文映射；**战术**：实体/值对象/聚合根/领域事件/仓储 | ../06-分布式与高并发篇/02-高并发系统设计.md |\n| ⭐CQRS | Command Query Responsibility Segregation | 读写分离到模型层：写模型只管变更，读模型单独优化（常配 ES/宽表） | 同上 |\n| ES（Event Sourcing） | 事件溯源 | 只存\"发生了什么\"的事件流，状态靠回放推导；⚠️**别和 Elasticsearch 混** | 同上 |\n| 熔断 / 降级 / 限流 / 超时 | — | 微服务四件套：Resilience4j/Sentinel；限流算法：令牌桶、漏桶、滑动窗口 | ../04-框架篇/04-SpringCloud微服务.md |\n| 配置中心 | Config Center | Nacos/Apollo 统一配置并热更新，避免改配置重启 | 同上 |\n\n## 🔐 安全与网络\n\n| 缩写 | 全称 | 一句话解释 | 章节 |\n|---|---|---|---|\n| ⭐CORS | Cross-Origin Resource Sharing | 浏览器跨域限制与服务端放行规则（`Access-Control-Allow-*`）；预检是 OPTIONS | ../04-框架篇/02-SpringBoot实战.md |\n| ⭐CSRF | Cross-Site Request Forgery | 跨站请求伪造：借已登录用户的 Cookie 发恶意请求；防法是 CSRF Token / SameSite / 校验来源 | ../07-面试篇/01-Java高频八股速查.md |\n| ⭐XSS | Cross-Site Scripting | 跨站脚本：把恶意 JS 注入页面（存储型/反射型/DOM 型）；防法是输出转义 + CSP | 同上 |\n| ⭐SQLi | SQL Injection | SQL 注入：拼接用户输入改变语句语义；**唯一正解是参数化查询 `#{}`，不要 `${}`** | ../04-框架篇/03-MyBatis.md |\n| ⭐JWT | JSON Web Token | 三段式 `header.payload.signature` 自包含令牌，服务端不存状态、签名验真；⚠️Payload 只是 Base64 不是加密，别放敏感信息；无法主动失效（需黑名单/短过期） | ../07-面试篇/01-Java高频八股速查.md |\n| OAuth2 | Open Authorization 2.0 | 授权框架：让第三方拿到有限权限的 access_token，不接触密码（授权码模式最常用） | 同上 |\n| OIDC | OpenID Connect | 建在 OAuth2 之上的**身份认证**层，给 `id_token`（JWT）说\"这人是谁\" | — |\n| SSO | Single Sign-On | 单点登录：一处登录，多个系统互认（CAS、OIDC 是常见实现） | 同上 |\n| ⭐TLS/SSL | Transport Layer Security | HTTPS 的加密层；TLS 1.2 握手 = 证书 + 密钥交换 + 对称加密通信 | ../02-进阶篇/03-IO模型与网络编程.md |\n| CA | Certificate Authority | 证书颁发机构，浏览器内置其根证书形成信任链 | 同上 |\n| DNS | Domain Name System | 域名 → IP；解析链：本地缓存→运营商→根/顶级/权威域名服务器 | 同上 |\n| TTL（DNS） | Time To Live | 解析记录的缓存时间，改域名后老 IP 还会被用一段时间 | 同上 |\n| ⭐L4 / L7 | 四层 / 七层 | 四层看 IP+端口转发（LVS、Nginx stream，快）；七层能看 URL/Header 做路由与限流（更灵活） | ../05-中间件篇/07-Nginx.md |\n| NAT | Network Address Translation | 内网私有地址 ↔ 公网地址转换；所以服务端拿不到客户端真实内网 IP（要透传用 X-Forwarded-For） | 同上 |\n| VPC | Virtual Private Cloud | 云上逻辑隔离的私有网络，安全组挂在其内 | — |\n| ⭐DDoS | Distributed Denial of Service | 分布式拒绝服务：打满带宽（SYN Flood/UDP）或打满资源（CC 攻击=大量恶意 HTTP 请求） | ../06-分布式与高并发篇/02-高并发系统设计.md |\n| WAF | Web Application Firewall | 应用层防火墙，拦 SQLi/XSS/CC（与网络层防火墙不同层） | 同上 |\n| ⭐RBAC | Role-Based Access Control | 基于角色：用户 → 角色 → 权限（`hasRole('ADMIN')`），系统最常见 | ../07-面试篇/01-Java高频八股速查.md |\n| ABAC | Attribute-Based Access Control | 基于属性/策略：部门、时间、IP 等条件组合判断，粒度更细更难配 | 同上 |\n| HTTPS / ⭐HSTS | HTTP over TLS / Strict Transport Security | HSTS 响应头让浏览器强制走 HTTPS，防降级与首跳被劫持 | ../02-进阶篇/03-IO模型与网络编程.md |\n| 脱敏 | Data Masking | 手机号/身份证存或展示时打码（`138****1234`）；日志里也禁止打全量敏感信息 | ../04-框架篇/05-单元测试与工程质量.md |\n| 加盐 | Salting | 存密码时给每个用户加随机串再哈希（`BCrypt` 内置），防彩虹表撞库；⚠️密码不是\"加密\"是\"单向哈希+盐\" | ../07-面试篇/01-Java高频八股速查.md |\n\n## 🧪 测试与质量\n\n| 缩写 | 全称 | 一句话解释 | 章节 |\n|---|---|---|---|\n| UT / IT / E2E | Unit / Integration / End To End Test | 单元（单类、全 mock）/ 集成（多组件、真依赖）/ 端到端（业务闭环） | ../04-框架篇/05-单元测试与工程质量.md |\n| ⭐TDD | Test-Driven Development | 红-绿-重构：先写失败测试，再写实现，再整理；适合规则清晰的逻辑，不适合探索性代码 | 同上 |\n| BDD | Behavior-Driven Development | 用业务语言描述行为（Given-When-Then），Cucumber/JBehave 执行 | 同上 |\n| Mock / Stub / Spy | — | Mock 断言交互（verify 调用次数）；Stub 只预置返回值；Spy 包真实对象、默认走真逻辑（慎用） | 同上 |\n| 行覆盖 / 分支覆盖 | Line / Branch Coverage | 每行被执行 / 每个 if 的真假分支都进过；⭐后者严格强于前者，只看行覆盖会漏 else | 同上 |\n| Flaky Test | — | 时好时坏的测试（依赖时间/顺序/并发/网络），CI 毒药，必须消灭 | 同上 |\n| CI 门禁 | Quality Gate | PR 必须通过构建+测试+扫描才允许合并（Sonar/Review） | 同上 |\n\n## 🔺 易混淆对照（新人最常混的 12 组）\n\n| 名字很像 | 区别（一句话分清楚） | 章节 |\n|---|---|---|\n| ⭐ES（Elasticsearch）vs ES（Event Sourcing） | 前者是搜索/日志引擎（倒排索引，中间件篇）；后者是\"只存事件流、状态靠回放\"的架构风格（DDD/CQRS 语境）。**看上下文：说\"查日志/索引\"是引擎，说\"命令/事件\"是溯源** | ../05-中间件篇/05-Elasticsearch.md |\n| ⭐JWT vs Session | Session 状态在**服务端**内存/Redis（可随时踢人，扩容要共享）；JWT 状态**自包含在令牌里**（服务端无状态好横向扩，但签发后收不回来，需短过期+黑名单） | ../07-面试篇/01-Java高频八股速查.md |\n| ⭐Ehcache/Caffeine vs Redis | 前者是**进程内本地缓存**（一级，微秒级，不共享、随应用重启即失效）；后者是**独立中间件**（二级，集群共享、可持久化、有网络往返）；多级缓存 = 本地挡热点 + Redis 挡全量 | ../05-中间件篇/01-Redis.md |\n| ⭐rebase vs merge | merge 生成合并提交、保留真实分叉历史；rebase 重放提交、历史线性但**改写 sha → 公共分支禁用** | ../02-进阶篇/04-开发工具链-Git-Maven-Linux.md |\n| String vs StringBuilder | String 不可变（每次拼接产生新对象，走常量池复用），StringBuilder 可变字符数组（单线程频繁拼接）；多线程用 StringBuffer，⚠️for 循环里用 `+` 是每轮 new 一个 builder | ../01-入门篇/02-面向对象与核心类.md |\n| char vs varchar（MySQL） | `char(n)` 定长、不足补空格、不超长不截断，适合 MD5/手机号/状态；`varchar(n)` 变长 + 1~2 字节长度前缀，n 是**字符数**不是字节数（utf8mb4 一字符最多 4 字节） | ../03-数据库篇/01-MySQL基础与SQL实战.md |\n| RDB vs AOF（Redis） | RDB 是\"某一时刻的全量快照\"（小、快、丢得多）；AOF 是\"写命令流水账\"（全、慢、丢得少）；生产用混合持久化 | ../05-中间件篇/01-Redis.md |\n| 主从 vs 哨兵 vs 集群（Redis） | 主从只解决读写分离与备份（主挂了要人工切）；哨兵加**自动故障转移**（不扩容）；Cluster 加**数据分片 + 高可用**（16384 slot） | ../05-中间件篇/01-Redis.md |\n| IoC vs DI | IoC 是**思想/目标**（创建与使用的控制权交给容器）；DI 是**实现手段**（容器把依赖注入进来：构造器/setter/字段）；说\"依赖倒置原则 DIP\"是它们的 SOLID 版本 | ../04-框架篇/01-Spring核心.md |\n| `@Controller` vs `@RestController` | `@RestController` = `@Controller` + `@ResponseBody`；前者返回值默认当**视图名**解析，后者直接序列化 JSON 写回 | ../04-框架篇/02-SpringBoot实战.md |\n| 限流 vs 降级 vs 熔断 | 限流=进门时控制流量；降级=主动放弃非核心保住核心；熔断=发现下游烂了暂时不调（快速失败+自愈） | ../04-框架篇/04-SpringCloud微服务.md |\n| 幂等 vs 去重 vs 缓存 | 幂等=重复请求不出错（唯一业务号+状态机）；去重=同一元素只处理一次（布隆/唯一索引）；缓存=少算几遍 | ../06-分布式与高并发篇/02-高并发系统设计.md |\n\n## 🔗 推荐资料\n\n| 资料 | 用来干什么 | 链接 |\n|---|---|---|\n| JavaGuide 高频面试题汇总 | 每个缩写的完整上下文与追问链 | https://javaguide.cn/java/java-interview-questions/java-interview-questions.html |\n| pdai 知识图谱 | 按板块看缩写出现在哪条技术线上 | https://pdai.tech/md/roadmap/roadmap-index.html |\n| 廖雪峰 Java 教程 | 缩写认全之后补原理的地基教材 | https://liaoxuefeng.com/books/java/index.html |\n| 慕课 架构与技术名词课 | 视频快速扫一遍分布式/微服务术语 | https://www.imooc.com/course/list?c=architect |\n| 码工具 缩写与命令速查 | 临场查缩写、命令参数 | https://www.matools.com/ |\n","ck":0}],"cards":[{"id":"c0","cat":"设计模式","q":"单例有哪几种写法？如何保证线程安全？⭐","a":"饿汉/懒汉/双重检查锁 volatile/静态内部类/枚举五种；DCL 靠 synchronized+volatile，推荐静态内部类（JVM 类加载保证）或枚举","ref":"f9","refTitle":"01-多线程与并发编程"},{"id":"c1","cat":"设计模式","q":"单例会被什么手段破坏？怎么防？⭐","a":"反射开私有构造（构造器判空抛异常防）、序列化每次新建对象（实现 readResolve 防）、多类加载器；枚举天然免疫前两种","ref":"f6","refTitle":"04-异常-IO-反射-注解"},{"id":"c2","cat":"设计模式","q":"双重检查锁里 volatile 能去掉吗？为什么？⭐","a":"不能；new 分三步可能被重排序，其他线程第一重检查会拿到\"引用非空但没初始化完\"的半成品","ref":"f9","refTitle":"01-多线程与并发编程"},{"id":"c3","cat":"设计模式","q":"JDK 动态代理和 CGLIB 的区别？Spring 用哪个？⭐","a":"JDK 基于接口+继承 Proxy 类走反射，CGLIB 生成目标类子类走字节码；目标没接口只能用 CGLIB，final 类/CGLIB 搞不了；Spring Boot 默认 CGLIB","ref":"f15","refTitle":"Spring核心"},{"id":"c4","cat":"设计模式","q":"工厂方法和抽象工厂的区别？⭐","a":"工厂方法一个工厂造一个产品（新增加类不改老代码），抽象工厂一个工厂造一整族相关产品；DataSource.getConnection() 是工厂方法","ref":"f8","refTitle":"07-设计模式"},{"id":"c5","cat":"设计模式","q":"装饰器和代理有什么区别？⭐","a":"装饰器给对象叠加功能、由调用方层层包（InputStream 套娃）；代理控制对目标的访问、通常由框架生成（AOP）；结构一样、意图不同","ref":"f6","refTitle":"04-异常-IO-反射-注解"},{"id":"c6","cat":"设计模式","q":"策略模式和状态模式的区别？⭐","a":"策略是算法之间互不相识、由客户端选一个；状态是状态间有迁移规则、由各状态自己决定下一个；策略模式更轻、状态模式带状态机","ref":"f8","refTitle":"07-设计模式"},{"id":"c7","cat":"设计模式","q":"策略和模板方法怎么选？⭐","a":"流程步骤固定只有局部变化用模板方法（继承，编译期）；整个算法可运行期互换用策略（组合，更符合开闭）；策略可用 Map+Spring 注入落地","ref":"f8","refTitle":"07-设计模式"},{"id":"c8","cat":"设计模式","q":"Spring 里用了哪些设计模式？举例说明。⭐","a":"BeanFactory=工厂、BeanDefinitionBuilder=建造者、@Scope prototype=原型、AOP/事务=代理、JdbcTemplate=模板方法、ApplicationEvent=观察者、HandlerInterceptor=责任链、HandlerAdapter=适配器","ref":"f15","refTitle":"Spring核心"},{"id":"c9","cat":"设计模式","q":"责任链模式在 Java Web 里哪里用？Filter 和 Interceptor 什么区别？⭐","a":"Filter（Servlet 规范，容器管，拦 URL）、HandlerInterceptor（SpringMVC 管，能拿到 handler 和模型）、Netty Pipeline；区别在归属层、可用 API、能否注入 Spring Bean","ref":"f16","refTitle":"SpringBoot实战"},{"id":"c10","cat":"设计模式","q":"你在项目里用过什么设计模式？（场景题）⭐","a":"答题口径：讲一个重构故事，不说模式清单。结构=原来的 if-else 长什么样 → 什么痛点（新增要改老代码、测试难）→ 用了什么模式 → 落地方式（接口 + Map + Spring 注入）→ 收益（新增零改动、单测能各测各的）","ref":"f35","refTitle":"04-简历与求职指南"},{"id":"c11","cat":"设计模式","q":"SOLID 里的开闭原则怎么落地？⭐","a":"抽象 + 扩展：把变化点抽成接口，新增行为只加实现类；策略模式和观察者模式是它的两种主要手段；Spring 靠注入 List<接口> 自动收集实现","ref":"f15","refTitle":"Spring核心"},{"id":"c12","cat":"设计模式","q":"Integer 缓存和字符串常量池是什么模式？⭐","a":"享元；共享不可变实例省内存，Integer 缓存 -128~127、字符串常量池复用字面量；也解释了为什么超出范围 == 为 false","ref":"f4","refTitle":"02-面向对象与核心类"},{"id":"c13","cat":"开发工具链-Git-Maven-Linux","q":"merge 和 rebase 的区别？什么时候不能 rebase？⭐","a":"merge 保留拓扑生成 merge commit、rebase 重放提交使历史线性但改写 sha；已 push 的公共分支禁止 rebase，会让协作者历史分叉","ref":"f3","refTitle":"01-环境搭建与基础语法"},{"id":"c14","cat":"开发工具链-Git-Maven-Linux","q":"git reset 和 git revert 的区别？⭐","a":"reset 移动 HEAD 指针改写历史（--soft 留暂存区、--mixed 留工作区、--hard 全丢），只适合未 push；revert 生成反向新提交不改历史，公共分支安全","ref":"f3","refTitle":"01-环境搭建与基础语法"},{"id":"c15","cat":"开发工具链-Git-Maven-Linux","q":"Maven 依赖冲突怎么解决？两个原则是什么？⭐","a":"就近优先（路径浅者胜）+ 同深度声明优先；用 mvn dependency:tree -Dverbose 定位，再 exclusion 排除或 dependencyManagement 统一版本","ref":"f16","refTitle":"SpringBoot实战"},{"id":"c16","cat":"开发工具链-Git-Maven-Linux","q":"pom 里为什么不写依赖版本号？⭐","a":"继承 spring-boot-starter-parent 并导入 spring-boot-dependencies 这个 BOM，dependencyManagement 只统版本不引入，子模块省略 version","ref":"f16","refTitle":"SpringBoot实战"},{"id":"c17","cat":"开发工具链-Git-Maven-Linux","q":"scope=provided 是什么意思？什么场景用？⭐","a":"编译和测试可用、不打进包，由运行容器提供；典型是打 war 部署外部 Tomcat 时 starter-tomcat 设 provided，以及 Lombok 只编译期生效","ref":"f16","refTitle":"SpringBoot实战"},{"id":"c18","cat":"开发工具链-Git-Maven-Linux","q":"线上 CPU 打满怎么排查？⭐","a":"ps -ef|grep java 拿 pid → top -Hp 找最耗 CPU 线程 tid → printf \"%x\" 转 16 进制 → jstack 按 nid=0x 定位代码；再配合 jstat 看 GC","ref":"f10","refTitle":"02-JVM核心"},{"id":"c19","cat":"开发工具链-Git-Maven-Linux","q":"kill -9 和 kill -15 有什么区别？⭐","a":"-15 是 SIGTERM，可被捕获，进程能做清理（JVM 会跑 shutdown hook、Spring 能优雅下线）；-9 是 SIGKILL，内核直接杀、不可捕获，连接/锁/临时文件都不清理，生产先试 -15","ref":"f10","refTitle":"02-JVM核心"},{"id":"c20","cat":"开发工具链-Git-Maven-Linux","q":"NoSuchMethodError 是什么问题？怎么查？⭐","a":"编译期与运行期 jar 版本不一致导致方法缺失，属依赖冲突；用 dependency:tree 看实际加载版本、jar 包检查、-verbose:class 看类从哪加载","ref":"f10","refTitle":"02-JVM核心"},{"id":"c21","cat":"开发工具链-Git-Maven-Linux","q":".gitignore 加了但文件还在被跟踪怎么办？⭐","a":"ignore 只对未跟踪文件生效；git rm -r --cached <路径> 取消索引再提交，本地文件不被删","ref":"f3","refTitle":"01-环境搭建与基础语法"},{"id":"c22","cat":"开发工具链-Git-Maven-Linux","q":"install 和 deploy 的区别？⭐","a":"install 装进本地 ~/.m2 仓库供本机其他项目依赖；deploy 发布到远程私服 Nexus 供团队共享","ref":"f16","refTitle":"SpringBoot实战"},{"id":"c23","cat":"单元测试与工程质量","q":"@SpringBootTest 和 @WebMvcTest 有什么区别？⭐","a":"前者启动整个 ApplicationContext（所有 Bean + 自动配置，慢，测集成）；后者只加载 Web 层切片（Controller/Advice/序列化），Service 要用 @MockBean 顶替，快","ref":"f16","refTitle":"SpringBoot实战"},{"id":"c24","cat":"单元测试与工程质量","q":"mock 和 stub 的区别？⭐","a":"都是假对象；stub 关注\"返回值\"（when-thenReturn 让被测代码拿到预设数据），mock 关注\"交互\"（verify 断言有没有被调用、调用几次、参数是什么）；Mockito 一个工具两种用法","ref":"f19","refTitle":"05-单元测试与工程质量"},{"id":"c25","cat":"单元测试与工程质量","q":"private 方法怎么测？⭐","a":"口径是\"不该直接测\"：private 是实现细节，测它会让重构寸步难行；应该通过 public 入口覆盖它的分支，或者这个类已经承担太多职责、该拆出来（拆成独立类的 public 方法再测）","ref":"f8","refTitle":"07-设计模式"},{"id":"c26","cat":"单元测试与工程质量","q":"测试为什么会污染数据库？怎么解决？⭐","a":"测试插的数据留在库里导致后续用例互相影响；解法：测试类标 @Transactional 结束自动回滚、独立测试库每轮 clean、Testcontainers 每次起新容器；注意 @Transactional 测不出事务传播且回滚不了 Redis","ref":"f15","refTitle":"Spring核心"},{"id":"c27","cat":"单元测试与工程质量","q":"单元测试怎么保证隔离性？⭐","a":"JUnit 5 每个用例新建测试实例；不共享可变状态、不依赖执行顺序、@BeforeEach 准备数据、外部依赖全部 mock 掉；出现\"单独跑通、一起跑挂\"就是有隐藏共享状态","ref":"f19","refTitle":"05-单元测试与工程质量"},{"id":"c28","cat":"单元测试与工程质量","q":"覆盖率多少算合格？怎么看？⭐","a":"JaCoCo 出行覆盖/分支覆盖；口径是\"覆盖率不是目标，关键路径的分支覆盖才是\"，团队更该看增量（diff）覆盖率，避免为凑数写无断言的假测试","ref":"f19","refTitle":"05-单元测试与工程质量"},{"id":"c29","cat":"单元测试与工程质量","q":"你们团队怎么保证代码质量？（高频开放题）⭐","a":"四层：① 单测 + 集成测试（关键路径分支覆盖）；② Code Review 强制 + PR 门禁；③ 静态扫描（Sonar/PMD/阿里规约插件）+ 统一格式化；④ CI 自动构建部署 + 线上监控告警与灰度","ref":"f35","refTitle":"04-简历与求职指南"},{"id":"c30","cat":"单元测试与工程质量","q":"Lombok 的原理是什么？有什么坑？⭐","a":"编译期注解处理器修改 AST 生成方法字节码，不是运行时反射；坑：IDE 必须装插件、@Data 在实体上会生成含全部字段的 equals/hashCode、Javadoc 不含生成方法","ref":"f6","refTitle":"04-异常-IO-反射-注解"},{"id":"c31","cat":"单元测试与工程质量","q":"日志为什么用 {} 占位符而不是字符串拼接？⭐","a":"拼接在日志级别关闭时仍会执行（无谓开销），占位符延迟求值；另外别用 System.out（无级别/时间/线程、无法被采集）","ref":"f25","refTitle":"05-Elasticsearch"},{"id":"c32","cat":"单元测试与工程质量","q":"阿里规约为什么禁止 POJO 布尔字段加 is 前缀？⭐","a":"getter 为 isDeleted() 时部分框架推导属性名为 deleted，序列化/反序列化与 MyBatis 映射可能对不上导致字段丢失","ref":"f13","refTitle":"MySQL基础与SQL实战"},{"id":"c33","cat":"单元测试与工程质量","q":"@Transactional 用在测试类上有什么副作用？⭐","a":"用例结束自动回滚（好事，保证隔离），但同库同连接会让真实提交行为测不到、内层事务被合并从而掩盖传播行为 bug、MyBatis 二级缓存与自增主键相关行为也不真实","ref":"f15","refTitle":"Spring核心"},{"id":"c34","cat":"认证与安全","q":"JWT 的组成部分与校验流程？","a":"header.payload.signature 三段 Base64URL，服务端用密钥重算签名比对，再查 exp；是签名不是加密","ref":"f11","refTitle":"03-IO模型与网络编程"},{"id":"c35","cat":"认证与安全","q":"为什么 JWT 注销难，怎么解决？","a":"无状态服务端不存，只能等过期；缓解：短期 Access + 可吊销 Refresh、Redis 黑名单、改密码全局失效","ref":"f20","refTitle":"06-认证与安全"},{"id":"c36","cat":"认证与安全","q":"XSS 和 CSRF 的区别与各自防御？","a":"XSS 是注入脚本偷凭据（转义+HttpOnly+CSP），CSRF 是借凭伪造请求（SameSite+Token+验 Origin）","ref":"f20","refTitle":"06-认证与安全"},{"id":"c37","cat":"认证与安全","q":"密码怎么存才安全？","a":"BCrypt/Argon2 加盐慢哈希，禁止 MD5/SHA 裸哈希与可逆加密；matches 比对","ref":"f20","refTitle":"06-认证与安全"},{"id":"c38","cat":"认证与安全","q":"分布式系统下 Session 怎么共享？","a":"粘滞会话/集群复制/Spring Session 存 Redis（事实标准），或直接改无状态 Token","ref":"f11","refTitle":"03-IO模型与网络编程"},{"id":"c39","cat":"认证与安全","q":"预编译为什么能防 SQL 注入？","a":"先编译 SQL 结构再填参数，参数被当纯数据绑定，改变不了语法结构","ref":"f17","refTitle":"MyBatis"},{"id":"c40","cat":"认证与安全","q":"RBAC 是什么，为什么用户不直接挂权限？","a":"用户-角色-权限三层，角色是批量授权的中转站，人员/权限变动只动一层","ref":"f20","refTitle":"06-认证与安全"},{"id":"c41","cat":"认证与安全","q":"OAuth2 授权码模式为什么要后端换 token？","a":"code 经浏览器可被截但短命且需 client_secret 才能换 token，secret 不落前端","ref":"f20","refTitle":"06-认证与安全"},{"id":"c42","cat":"系统设计场景题","q":"短链为什么用 301 不用 302？","a":"永久重定向浏览器会缓存跳转，省一次回源；302 每次都打到服务端，读放大","ref":"f31","refTitle":"03-系统设计场景题"},{"id":"c43","cat":"系统设计场景题","q":"布隆过滤器能删元素吗？误判率怎么定？","a":"基础版不能（置 0 会误伤）；m 与 k 由容量 n 和目标误差 p 推出；「说没有一定准」","ref":"f31","refTitle":"03-系统设计场景题"},{"id":"c44","cat":"系统设计场景题","q":"订单超时关闭有哪几种实现，怎么选？","a":"扫表/DelayQueue/Redis ZSET/MQ 延迟；生产选 MQ 延迟消息或 RocketMQ 定时消息，关单用条件更新防与支付回调打架","ref":"f22","refTitle":"02-RabbitMQ"},{"id":"c45","cat":"系统设计场景题","q":"排行榜同分怎么处理？","a":"score 复合（分数 × 基数 + 取反时间戳），一次排序解决「同分先达优先」","ref":"f21","refTitle":"01-Redis"},{"id":"c46","cat":"系统设计场景题","q":"Feed 流推拉结合怎么划分用户？","a":"粉丝量阈值：超阈值大 V 写扩散推，普通用户读扩散拉，兼顾写放大与读延迟","ref":"f31","refTitle":"03-系统设计场景题"},{"id":"c47","cat":"系统设计场景题","q":"UV 统计为什么用 HyperLogLog？","a":"只关心计数不关心成员，12KB 内存 0.81% 误差，比 SET 省几个量级","ref":"f21","refTitle":"01-Redis"},{"id":"c48","cat":"Java 基础","q":"== 与 equals 的区别？","a":"== 比较栈里的值（基本类型比值、引用类型比地址），equals 默认同 ==，String 等重写后比较内容","ref":"f4","refTitle":"02-面向对象与核心类"},{"id":"c49","cat":"Java 基础","q":"为什么重写 equals 必须重写 hashCode？","a":"约定相等对象必须有相同哈希值，否则重写后两个\"相等\"对象在 HashMap 中会落到不同桶","ref":"f4","refTitle":"02-面向对象与核心类"},{"id":"c50","cat":"Java 基础","q":"String 为什么设计成不可变？","a":"private final 存储不暴露修改方法：安全性、hashCode 可缓存、字符串常量池复用","ref":"f4","refTitle":"02-面向对象与核心类"},{"id":"c51","cat":"Java 基础","q":"String、StringBuilder、StringBuffer 怎么选？","a":"常量用 String，单线程频繁拼接用 StringBuilder，多线程共享拼接用 StringBuffer","ref":"f4","refTitle":"02-面向对象与核心类"},{"id":"c52","cat":"Java 基础","q":"Integer 缓存机制？","a":"IntegerCache 缓存 -128~127，范围内 == 为 true，范围外必须用 equals，面试常挖箱拆箱 NPE","ref":"f4","refTitle":"02-面向对象与核心类"},{"id":"c53","cat":"Java 基础","q":"Java 是值传递还是引用传递？","a":"永远是值传递；传对象时复制的是引用值，方法内改属性生效、重新赋值不影响原对象","ref":"f3","refTitle":"01-环境搭建与基础语法"},{"id":"c54","cat":"Java 基础","q":"重载与重写的区别？","a":"重载是同类同名不同参（编译期确定），重写是子类覆盖父类同签名方法（运行期多态）","ref":"f4","refTitle":"02-面向对象与核心类"},{"id":"c55","cat":"Java 基础","q":"接口与抽象类的区别？","a":"抽象类表示\"是什么\"（单继承、可有状态），接口表示\"能做什么\"（多实现，Java 8 后可有 default/static 方法）","ref":"f4","refTitle":"02-面向对象与核心类"},{"id":"c56","cat":"Java 基础","q":"final 关键字有哪些用法？","a":"类不可继承、方法不可重写、变量不可重新赋值（引用不变但对象内容可变）","ref":"f4","refTitle":"02-面向对象与核心类"},{"id":"c57","cat":"Java 基础","q":"面向对象三大特性？","a":"封装隐藏细节、继承复用扩展、多态同一方法不同实现（编译看左边、运行看右边）","ref":"f4","refTitle":"02-面向对象与核心类"},{"id":"c58","cat":"Java 基础","q":"Java 异常体系？","a":"Throwable 下分 Error（OOM/StackOverflowError 不该捕获）与 Exception，后者分受检异常与运行时异常","ref":"f6","refTitle":"04-异常-IO-反射-注解"},{"id":"c59","cat":"Java 基础","q":"反射是什么？有什么用？","a":"运行期动态获取类信息并创建对象、调用方法，是 Spring IoC、MyBatis Mapper 等框架的底层基石","ref":"f6","refTitle":"04-异常-IO-反射-注解"},{"id":"c60","cat":"Java 基础","q":"注解的原理？","a":"@interface 本质是继承 Annotation 的接口，运行期靠反射读取元数据，Retention 决定保留到源码/字节码/运行期","ref":"f6","refTitle":"04-异常-IO-反射-注解"},{"id":"c61","cat":"Java 基础","q":"什么是泛型擦除？","a":"泛型只存在于编译期做类型检查，运行期 List\\<String\\> 与 List\\<Integer\\> 都是 List，桥接方法保证多态","ref":"f5","refTitle":"03-集合与泛型"},{"id":"c62","cat":"Java 基础","q":"static 关键字的用法？","a":"静态变量/方法/代码块/内部类都属于类而非实例，静态方法不能访问实例成员，加载时初始化","ref":"f3","refTitle":"01-环境搭建与基础语法"},{"id":"c63","cat":"Java 基础","q":"内部类有哪些？","a":"成员、静态、局部、匿名内部类；匿名内部类访问局部变量要求 effectively final","ref":"f4","refTitle":"02-面向对象与核心类"},{"id":"c64","cat":"Java 基础","q":"BigDecimal 为什么能避免精度丢失？","a":"用\"无标度整数+标度\"精确表示十进制；金额计算必用，除法必须指定舍入模式与精度","ref":"f4","refTitle":"02-面向对象与核心类"},{"id":"c65","cat":"Java 基础","q":"Java 8 有哪些新特性？","a":"Lambda、函数式接口、Stream、Optional、接口 default 方法、新时间日期 API","ref":"f7","refTitle":"05-Lambda-Stream与Java8新特性"},{"id":"c66","cat":"Java 基础","q":"Stream 常用操作？","a":"中间操作 filter/map/sorted/flatMap 惰性执行，终端操作 collect/reduce/count/forEach 触发计算，只能消费一次","ref":"f7","refTitle":"05-Lambda-Stream与Java8新特性"},{"id":"c67","cat":"Java 基础","q":"Optional 解决什么问题？","a":"显式表达\"可能为空\"，用 map/orElse/ifPresent 链式处理减少 NPE，不建议用作字段","ref":"f7","refTitle":"05-Lambda-Stream与Java8新特性"},{"id":"c68","cat":"集合","q":"ArrayList 和 LinkedList 的区别？","a":"数组随机访问 O(1) vs 双向链表头尾插删 O(1)；实际绝大多数场景用 ArrayList（CPU 缓存友好、无指针开销）","ref":"f5","refTitle":"03-集合与泛型"},{"id":"c69","cat":"集合","q":"ArrayList 扩容机制？","a":"首次 add 创建容量 10，超出后扩为 1.5 倍并 Arrays.copyOf 拷贝；能预估数据量就指定初始容量","ref":"f5","refTitle":"03-集合与泛型"},{"id":"c70","cat":"集合","q":"HashMap 底层数据结构？","a":"1.8 起数组+链表+红黑树：链表长度 ≥8 且数组长度 ≥64 转红黑树，节点减到 6 退化回链表","ref":"f5","refTitle":"03-集合与泛型"},{"id":"c71","cat":"集合","q":"HashMap 的 put 流程？","a":"计算 hash 定位桶 → 空桶直接放 → 链表尾插或树插入 → key 已存在则覆盖 → 超过阈值扩容","ref":"f5","refTitle":"03-集合与泛型"},{"id":"c72","cat":"集合","q":"HashMap 扩容机制？","a":"容量翻倍、负载因子 0.75；1.8 优化：元素要么留在原索引，要么移到\"原索引+旧容量\"位置","ref":"f5","refTitle":"03-集合与泛型"},{"id":"c73","cat":"集合","q":"HashMap 1.7 和 1.8 的区别？","a":"1.7 头插法+纯链表（并发扩容可能成环死循环），1.8 尾插法+红黑树+扩容高位拆分优化","ref":"f5","refTitle":"03-集合与泛型"},{"id":"c74","cat":"集合","q":"HashMap 容量为什么是 2 的幂？","a":"使 (n-1) & hash 等价于取模且位运算更快，同时保证散列均匀","ref":"f5","refTitle":"03-集合与泛型"},{"id":"c75","cat":"集合","q":"HashSet 如何去重？","a":"底层就是 HashMap，元素作 key，add 时先比 hashCode 再比 equals","ref":"f5","refTitle":"03-集合与泛型"},{"id":"c76","cat":"集合","q":"ConcurrentHashMap 1.8 的实现原理？","a":"CAS 初始化 + synchronized 锁单个桶头节点，扩容支持多线程协助迁移，size 用 CounterCell 分散计数","ref":"f5","refTitle":"03-集合与泛型"},{"id":"c77","cat":"集合","q":"fail-fast 与 fail-safe？","a":"遍历中结构被改抛 ConcurrentModificationException（modCount 校验）；CopyOnWrite 系列是 fail-safe 的快照遍历","ref":"f5","refTitle":"03-集合与泛型"},{"id":"c78","cat":"集合","q":"遍历集合时如何安全删除元素？","a":"用 Iterator.remove() 或 removeIf()，不能在 for-each 中直接 list.remove()","ref":"f5","refTitle":"03-集合与泛型"},{"id":"c79","cat":"集合","q":"TreeMap 的底层与使用场景？","a":"红黑树实现，key 有序，支持范围查询与首个/最后一个元素，需自然排序或 Comparator","ref":"f5","refTitle":"03-集合与泛型"},{"id":"c80","cat":"集合","q":"List/Set/Queue/Map 怎么选型？","a":"有序可重复选 List、去重选 Set、先进先出/优先级选 Queue、键值映射选 Map，再看是否需要排序与并发","ref":"f5","refTitle":"03-集合与泛型"},{"id":"c81","cat":"集合","q":"ArrayList 线程安全吗？怎么解决？","a":"不安全；Vector 已过时，读多写少用 CopyOnWriteArrayList，或 Collections.synchronizedList","ref":"f5","refTitle":"03-集合与泛型"},{"id":"c82","cat":"集合","q":"Comparable 与 Comparator 的区别？","a":"Comparable 在类内部定义自然排序（compareTo），Comparator 外部定制排序规则（compare），后者可多套并存","ref":"f5","refTitle":"03-集合与泛型"},{"id":"c83","cat":"并发","q":"创建线程有几种方式？","a":"本质都是 new Thread 传 Runnable（Callable 配 FutureTask 可拿返回值）；生产环境一律用线程池","ref":"f9","refTitle":"01-多线程与并发编程"},{"id":"c84","cat":"并发","q":"线程有哪些状态？","a":"NEW/RUNNABLE/BLOCKED/WAITING/TIMED_WAITING/TERMINATED 六种，常追问 wait 与 sleep 的区别","ref":"f9","refTitle":"01-多线程与并发编程"},{"id":"c85","cat":"并发","q":"synchronized 的底层原理？","a":"基于对象头 Mark Word 与 monitor（monitorenter/monitorexit 字节码指令），锁状态记录在对象头","ref":"f9","refTitle":"01-多线程与并发编程"},{"id":"c86","cat":"并发","q":"锁升级过程？","a":"无锁 → 偏向锁 → 轻量级锁（CAS 自旋）→ 重量级锁（monitor 阻塞），偏向锁在 JDK 15 后已废弃","ref":"f9","refTitle":"01-多线程与并发编程"},{"id":"c87","cat":"并发","q":"volatile 的作用？","a":"保证可见性（写立即刷主存、读失效本地缓存）与有序性（内存屏障禁重排），**不保证原子性**","ref":"f9","refTitle":"01-多线程与并发编程"},{"id":"c88","cat":"并发","q":"JMM（Java 内存模型）是什么？","a":"主内存+工作内存的抽象，定义 happens-before 规则，解决多线程的可见性与有序性问题","ref":"f9","refTitle":"01-多线程与并发编程"},{"id":"c89","cat":"并发","q":"CAS 的原理与问题？","a":"CPU 原子比较交换指令；存在 ABA（用 AtomicStampedReference 加版本号）与自旋空转问题","ref":"f9","refTitle":"01-多线程与并发编程"},{"id":"c90","cat":"并发","q":"一句话说清 AQS？","a":"抽象队列同步器：volatile 的 state + CLH 变体等待队列 + 模板方法，ReentrantLock/Semaphore/CountDownLatch 的共同基石","ref":"f9","refTitle":"01-多线程与并发编程"},{"id":"c91","cat":"并发","q":"ReentrantLock 与 synchronized 的区别？","a":"支持可中断、tryLock 超时、公平锁、多个 Condition；JDK 6 后性能相当，简单场景仍用 synchronized","ref":"f9","refTitle":"01-多线程与并发编程"},{"id":"c92","cat":"并发","q":"公平锁与非公平锁？","a":"公平锁按队列顺序获取防饥饿；非公平锁允许新请求直接插队，吞吐更高，ReentrantLock 默认非公平","ref":"f9","refTitle":"01-多线程与并发编程"},{"id":"c93","cat":"并发","q":"线程池的 7 个参数？","a":"corePoolSize、maximumPoolSize、keepAliveTime、unit、workQueue、threadFactory、handler","ref":"f9","refTitle":"01-多线程与并发编程"},{"id":"c94","cat":"并发","q":"线程池的任务执行流程？","a":"先填核心线程 → 满了入队列 → 队列满了开非核心线程 → 到 maximum 后触发拒绝策略（注意\"先排队再扩容\"）","ref":"f9","refTitle":"01-多线程与并发编程"},{"id":"c95","cat":"并发","q":"四种拒绝策略？","a":"AbortPolicy 抛异常（默认）、CallerRunsPolicy 调用者线程执行、DiscardPolicy 静默丢弃、DiscardOldestPolicy 丢最旧任务","ref":"f9","refTitle":"01-多线程与并发编程"},{"id":"c96","cat":"并发","q":"线程池大小怎么定？","a":"经验公式 CPU 密集 N+1、IO 密集 N×(1+等待时间/计算时间)，最终靠压测校准，不建议 unbounded 队列","ref":"f9","refTitle":"01-多线程与并发编程"},{"id":"c97","cat":"并发","q":"ThreadLocal 原理与内存泄漏？","a":"每个 Thread 内有 ThreadLocalMap，key 是弱引用、value 是强引用，用完必须 remove() 防止 value 泄漏","ref":"f9","refTitle":"01-多线程与并发编程"},{"id":"c98","cat":"并发","q":"CountDownLatch/CyclicBarrier/Semaphore 的区别？","a":"一次性倒数开门 / 可复用的集体等齐 / 控制并发数（permits），三者都基于 AQS","ref":"f9","refTitle":"01-多线程与并发编程"},{"id":"c99","cat":"并发","q":"死锁的产生条件与排查？","a":"互斥、请求与保持、不可剥夺、循环等待四个必要条件；jstack 可直接检测出死锁","ref":"f9","refTitle":"01-多线程与并发编程"},{"id":"c100","cat":"并发","q":"CompletableFuture 怎么用？","a":"supplyAsync/thenApply/thenCompose/allOf 做异步编排与结果组合，注意默认线程池与异常传播","ref":"f9","refTitle":"01-多线程与并发编程"},{"id":"c101","cat":"并发","q":"ConcurrentHashMap 并发 put 为什么安全？","a":"1.8 用 CAS 初始化 + 对桶头节点 synchronized，锁粒度到单个桶；get 无锁靠 volatile","ref":"f9","refTitle":"01-多线程与并发编程"},{"id":"c102","cat":"并发","q":"虚拟线程是什么？","a":"JDK 21 正式特性：由 JVM 调度的轻量线程，阻塞时不占用 OS 线程，可创建百万级，适合 IO 密集场景","ref":"f9","refTitle":"01-多线程与并发编程"},{"id":"c103","cat":"JVM","q":"JVM 内存区域划分？","a":"线程私有：虚拟机栈、本地方法栈、程序计数器；线程共享：堆、方法区（JDK 8 后由元空间实现）","ref":"f10","refTitle":"02-JVM核心"},{"id":"c104","cat":"JVM","q":"对象的创建过程？","a":"类加载检查 → 分配内存（TLAB/指针碰撞）→ 零值初始化 → 设置对象头 → 执行构造函数","ref":"f10","refTitle":"02-JVM核心"},{"id":"c105","cat":"JVM","q":"GC Roots 有哪些？","a":"栈帧局部变量、静态变量、常量引用、JNI 引用、活跃线程等，是可达性分析的起点","ref":"f10","refTitle":"02-JVM核心"},{"id":"c106","cat":"JVM","q":"四种引用的区别？","a":"强引用不回收；软引用内存不足才回收（缓存）；弱引用下次 GC 必回收（ThreadLocal key）；虚引用仅用于跟踪回收","ref":"f10","refTitle":"02-JVM核心"},{"id":"c107","cat":"JVM","q":"三种基础 GC 算法？","a":"标记-清除（有碎片）、标记-复制（新生代，浪费空间）、标记-整理（老年代，移动对象慢）","ref":"f10","refTitle":"02-JVM核心"},{"id":"c108","cat":"JVM","q":"分代收集的设计？","a":"新生代 Eden:Survivor:Survivor = 8:1:1 用复制算法，对象熬过 15 次 GC（默认）晋升老年代用标记整理","ref":"f10","refTitle":"02-JVM核心"},{"id":"c109","cat":"JVM","q":"Minor GC 和 Full GC 的区别？","a":"Minor 只清新生代、STW 短且频繁；Full GC 清整堆+元空间、STW 长，是性能优化的头号目标","ref":"f10","refTitle":"02-JVM核心"},{"id":"c110","cat":"JVM","q":"对象什么时候进入老年代？","a":"年龄达阈值（默认 15）、大对象直接进入、动态年龄判断、Survivor 放不下","ref":"f10","refTitle":"02-JVM核心"},{"id":"c111","cat":"JVM","q":"CMS 的原理与问题？","a":"并发标记-清除收集器，四阶段中标记可并发；产生内存碎片、并发失败退化为 Serial Old，已在新版移除","ref":"f10","refTitle":"02-JVM核心"},{"id":"c112","cat":"JVM","q":"G1 的原理？","a":"堆划分为多个 Region，按\"停顿时间目标\"优先回收垃圾最多的 Region（Mixed GC），JDK 9 起默认","ref":"f10","refTitle":"02-JVM核心"},{"id":"c113","cat":"JVM","q":"ZGC 的特点？","a":"着色指针+读屏障实现并发整理，停顿 <1ms 且与堆大小无关，适合超大堆低延迟场景","ref":"f10","refTitle":"02-JVM核心"},{"id":"c114","cat":"JVM","q":"并发标记为什么会\"漏标\"？CMS 和 G1 怎么解决？","a":"漏标需同时满足「黑对象新增指向白对象的引用」+「灰到白的路径被删」；CMS 用增量更新（写后屏障记录新引用、黑变灰重扫），G1 用 SATB（写前屏障保留删除前旧值，浮动垃圾下次收）","ref":"f10","refTitle":"02-JVM核心"},{"id":"c115","cat":"JVM","q":"类加载过程？","a":"加载 → 验证 → 准备（静态变量赋零值）→ 解析 → 初始化（执行 \\<clinit\\>），五步常按\"什么时候触发初始化\"追问","ref":"f10","refTitle":"02-JVM核心"},{"id":"c116","cat":"JVM","q":"双亲委派模型？","a":"类加载请求逐级向上委托（自定义 → 应用 → 扩展 → 启动），保证核心类安全与唯一；打破场景：SPI、热部署、Tomcat 隔离","ref":"f10","refTitle":"02-JVM核心"},{"id":"c117","cat":"JVM","q":"CPU 飙到 100% 怎么排查？","a":"top 找进程 → top -Hp 找线程 → printf '%x' 转十六进制 → jstack 中按 nid 定位到代码行","ref":"f10","refTitle":"02-JVM核心"},{"id":"c118","cat":"JVM","q":"OOM 怎么排查？","a":"启动加 -XX:+HeapDumpOnOutOfMemoryError 拿堆转储 → MAT/jvisualvm 分析支配树与大对象 → 沿引用链定位泄漏代码","ref":"f10","refTitle":"02-JVM核心"},{"id":"c119","cat":"Spring/SpringBoot","q":"什么是 IoC 和 DI？","a":"IoC 把对象创建与依赖管理交给容器（控制反转），DI 是实现手段：构造器/setter/字段注入","ref":"f15","refTitle":"Spring核心"},{"id":"c120","cat":"Spring/SpringBoot","q":"Bean 的生命周期？","a":"实例化 → 属性填充 → Aware 回调 → BeanPostProcessor 前置 → 初始化（@PostConstruct/afterPropertiesSet）→ 后置处理 → 销毁","ref":"f15","refTitle":"Spring核心"},{"id":"c121","cat":"Spring/SpringBoot","q":"三级缓存如何解决循环依赖？","a":"成品池/早期引用池/工厂池三步走，只能解决单例 + setter 注入的循环依赖，构造器依赖无解","ref":"f15","refTitle":"Spring核心"},{"id":"c122","cat":"Spring/SpringBoot","q":"Bean 的作用域？","a":"singleton（默认，容器单例）、prototype（每次新建）、request/session 等 Web 作用域","ref":"f15","refTitle":"Spring核心"},{"id":"c123","cat":"Spring/SpringBoot","q":"AOP 的原理？","a":"运行期动态代理织入横切逻辑：目标类有接口走 JDK 动态代理，无接口走 CGLIB 子类代理","ref":"f15","refTitle":"Spring核心"},{"id":"c124","cat":"Spring/SpringBoot","q":"JDK 动态代理与 CGLIB 的区别？","a":"JDK 基于接口反射实现代理，CGLIB 生成子类字节码；final 类/方法无法被 CGLIB 代理","ref":"f15","refTitle":"Spring核心"},{"id":"c125","cat":"Spring/SpringBoot","q":"Spring 事务的传播行为？","a":"REQUIRED（默认，有事务则加入）、REQUIRES_NEW（挂起当前另开新事务）、NESTED（嵌套保存点）等 7 种","ref":"f15","refTitle":"Spring核心"},{"id":"c126","cat":"Spring/SpringBoot","q":"Spring 事务失效的场景？","a":"自调用（this 绕过代理）、方法非 public、异常被 catch 吞掉、默认只回滚 RuntimeException、引擎不支持事务","ref":"f15","refTitle":"Spring核心"},{"id":"c127","cat":"Spring/SpringBoot","q":"SpringMVC 的执行流程？","a":"请求到 DispatcherServlet → HandlerMapping 找处理器 → HandlerAdapter 调用 Controller → 返回视图渲染","ref":"f15","refTitle":"Spring核心"},{"id":"c128","cat":"Spring/SpringBoot","q":"SpringBoot 自动配置原理？","a":"@EnableAutoConfiguration 读取 AutoConfiguration.imports 文件，配合 @ConditionalOnClass 等条件注解按需装配","ref":"f16","refTitle":"SpringBoot实战"},{"id":"c129","cat":"Spring/SpringBoot","q":"starter 是什么？","a":"依赖聚合 + 自动配置的封装，引入即用；自定义 starter = 自动配置模块 + starter 空壳依赖","ref":"f16","refTitle":"SpringBoot实战"},{"id":"c130","cat":"Spring/SpringBoot","q":"@Autowired 和 @Resource 的区别？","a":"@Autowired 是 Spring 的，先按类型后按名称；@Resource 是 JSR-250 的，先按名称后按类型","ref":"f16","refTitle":"SpringBoot实战"},{"id":"c131","cat":"Spring/SpringBoot","q":"@ConfigurationProperties 与 @Value 怎么选？","a":"前者批量绑定前缀配置、类型安全、支持校验；后者适合单个值，支持 SpEL","ref":"f16","refTitle":"SpringBoot实战"},{"id":"c132","cat":"Spring/SpringBoot","q":"@Configuration 与 @Component 的区别？","a":"@Configuration 类被 CGLIB 代理，@Bean 方法互调仍走容器保证单例；@Component 下互调会 new 新对象","ref":"f15","refTitle":"Spring核心"},{"id":"c133","cat":"Spring/SpringBoot","q":"BeanFactory 和 FactoryBean 的区别？","a":"BeanFactory 是容器顶层接口；FactoryBean 是\"生产 Bean 的 Bean\"，用于封装复杂对象的构建（如 SqlSessionFactoryBean）","ref":"f15","refTitle":"Spring核心"},{"id":"c134","cat":"MyBatis","q":"#{} 和 ${} 的区别？","a":"#{} 是预编译占位符防 SQL 注入；${} 是字符串拼接，只用于动态表名/列名等受控场景","ref":"f17","refTitle":"MyBatis"},{"id":"c135","cat":"MyBatis","q":"一级缓存与二级缓存？","a":"一级是 SqlSession 级默认开启；二级是 namespace 级需手动开启，跨会话共享，分布式下易脏读生产慎用","ref":"f17","refTitle":"MyBatis"},{"id":"c136","cat":"MyBatis","q":"Mapper 接口没有实现类为什么能执行 SQL？","a":"JDK 动态代理 MapperProxy 拦截方法调用，接口全限定名+方法名映射到 XML 的 statement id","ref":"f17","refTitle":"MyBatis"},{"id":"c137","cat":"MyBatis","q":"常用动态 SQL 标签？","a":"if/where/choose/when/otherwise/set/foreach/trim，用于条件拼接与批量插入","ref":"f17","refTitle":"MyBatis"},{"id":"c138","cat":"MyBatis","q":"resultMap 什么时候用？","a":"列名与属性名不一致、一对一/一对多关联映射、自定义类型转换时使用","ref":"f17","refTitle":"MyBatis"},{"id":"c139","cat":"MyBatis","q":"MyBatis 的分页方案？","a":"RowBounds 是内存逻辑分页（全查再截取，有 OOM 风险）；生产用 PageHelper 物理分页（改写 SQL 加 LIMIT）","ref":"f17","refTitle":"MyBatis"},{"id":"c140","cat":"MyBatis","q":"MyBatis-Plus 有哪些特性？","a":"BaseMapper 通用 CRUD、Wrapper 条件构造器、分页/乐观锁插件、自动填充、代码生成器","ref":"f17","refTitle":"MyBatis"},{"id":"c141","cat":"MyBatis","q":"MyBatis 和 JPA 怎么选？","a":"SQL 需要精细控制、复杂查询多选 MyBatis（国内主流）；标准 CRUD 快速开发选 JPA/Hibernate","ref":"f17","refTitle":"MyBatis"},{"id":"c142","cat":"MySQL","q":"为什么用 B+ 树而不是 B 树/哈希/红黑树？","a":"矮胖 3 层可存千万级数据、叶子链表支持范围查询；哈希不支持范围，红黑树/AVL 树太高 IO 次数多","ref":"f14","refTitle":"索引-事务-锁与调优"},{"id":"c143","cat":"MySQL","q":"聚簇索引与二级索引的区别？","a":"聚簇索引叶子存整行数据（InnoDB 必有，默认主键），二级索引叶子存主键值","ref":"f14","refTitle":"索引-事务-锁与调优"},{"id":"c144","cat":"MySQL","q":"什么是回表？","a":"用二级索引只拿到主键，还要回聚簇索引再查一次整行；查询列都在索引里则免回表","ref":"f14","refTitle":"索引-事务-锁与调优"},{"id":"c145","cat":"MySQL","q":"什么是覆盖索引？","a":"查询所需列全部包含在索引中，无需回表；是\"只查需要的列\"与联合索引设计的核心依据","ref":"f14","refTitle":"索引-事务-锁与调优"},{"id":"c146","cat":"MySQL","q":"最左前缀原则？","a":"联合索引 (a,b,c) 必须从 a 开始连续命中才走索引，遇到范围查询后索引列失效","ref":"f14","refTitle":"索引-事务-锁与调优"},{"id":"c147","cat":"MySQL","q":"索引失效的常见场景？","a":"索引列上函数/运算、隐式类型转换、前导 % 模糊、or 连接非索引列、违反最左前缀、优化器认为全表更快","ref":"f14","refTitle":"索引-事务-锁与调优"},{"id":"c148","cat":"MySQL","q":"explain 主要看哪些字段？","a":"type（至少 range，理想 ref/const）、key（实际用的索引）、rows（预估扫描行数）、Extra（出现 Using filesort/Using temporary 要优化）","ref":"f14","refTitle":"索引-事务-锁与调优"},{"id":"c149","cat":"MySQL","q":"ACID 分别靠什么实现？","a":"原子性靠 undo log、持久性靠 redo log、隔离性靠锁+MVCC、一致性是前三者共同保障的结果","ref":"f14","refTitle":"索引-事务-锁与调优"},{"id":"c150","cat":"MySQL","q":"四种隔离级别？","a":"读未提交 → 读已提交（解决脏读）→ 可重复读（InnoDB 默认，解决不可重复读）→ 串行化；InnoDB 的 RR 用 MVCC+间隙锁基本杜绝幻读","ref":"f14","refTitle":"索引-事务-锁与调优"},{"id":"c151","cat":"MySQL","q":"MVCC 的原理？","a":"隐藏字段 trx_id/roll_pointer + undo log 版本链 + ReadView 可见性判断；RC 每次查询生成 ReadView，RR 事务内复用第一次的","ref":"f14","refTitle":"索引-事务-锁与调优"},{"id":"c152","cat":"MySQL","q":"三大日志的作用？","a":"redo log 保证崩溃恢复（WAL、循环写）、undo log 支持回滚与 MVCC、binlog 用于主从复制与数据恢复（Server 层、追加写）","ref":"f14","refTitle":"索引-事务-锁与调优"},{"id":"c153","cat":"MySQL","q":"redo log 和 binlog 的区别？","a":"层级（InnoDB vs Server）、形态（循环写 vs 追加写）、用途（崩溃恢复 vs 复制/恢复）都不同；两阶段提交保证两者一致","ref":"f14","refTitle":"索引-事务-锁与调优"},{"id":"c154","cat":"MySQL","q":"InnoDB 有哪些锁？","a":"行锁（记录锁/间隙锁/临键锁）、表锁、意向锁；行锁是加在索引上的，无索引条件更新会升级为全表扫描锁住大量记录","ref":"f14","refTitle":"索引-事务-锁与调优"},{"id":"c155","cat":"MySQL","q":"慢 SQL 怎么排查优化？","a":"慢查询日志定位 → explain 分析执行计划 → 优化索引/改写 SQL/覆盖索引 → 数据量太大再考虑分库分表","ref":"f14","refTitle":"索引-事务-锁与调优"},{"id":"c156","cat":"MySQL","q":"分库分表怎么拆？","a":"先垂直（按业务拆库、大字段拆表）再水平（按分片键散列行）；分片键要满足高频查询条件且分布均匀","ref":"f14","refTitle":"索引-事务-锁与调优"},{"id":"c157","cat":"MySQL","q":"分库分表带来哪些问题？","a":"跨片 join/分页/聚合困难、跨库事务、全局唯一 ID、扩容数据迁移；能用缓存/ES 撑住就别急着拆","ref":"f30","refTitle":"02-高并发系统设计"},{"id":"c158","cat":"MySQL","q":"深分页怎么优化？","a":"`LIMIT 1000000,10` 要扫描并丢弃前 100 万行；改成游标（WHERE id > 上次最大值）、子查询先定位 id、或覆盖索引","ref":"f14","refTitle":"索引-事务-锁与调优"},{"id":"c159","cat":"MySQL","q":"inner join / left join / right join 的区别？","a":"inner 取两表交集；left 保留左表全部行、右表无匹配补 NULL；right 相反","ref":"f13","refTitle":"MySQL基础与SQL实战"},{"id":"c160","cat":"MySQL","q":"char 与 varchar 的区别？","a":"char 定长、空间换性能、适合定长数据（手机号/MD5）；varchar 变长、多 1~2 字节长度头，按实际长度存储","ref":"f13","refTitle":"MySQL基础与SQL实战"},{"id":"c161","cat":"MySQL","q":"drop、delete、truncate 的区别？","a":"drop 删表结构与数据；delete 逐行删、可回滚、可带 where；truncate 清空全表重置自增，属 DDL 不可回滚","ref":"f13","refTitle":"MySQL基础与SQL实战"},{"id":"c162","cat":"Redis","q":"Redis 为什么快？","a":"纯内存操作 + 命令执行单线程（无锁无切换）+ epoll IO 多路复用 + 针对场景优化的数据结构","ref":"f21","refTitle":"01-Redis"},{"id":"c163","cat":"Redis","q":"五种基本类型与使用场景？","a":"String 缓存/计数/分布式锁，Hash 对象属性，List 队列/时间线，Set 去重/抽奖/交并集，ZSet 排行榜/延迟队列","ref":"f21","refTitle":"01-Redis"},{"id":"c164","cat":"Redis","q":"RDB 与 AOF 怎么选？","a":"RDB 快照恢复快、可能丢最后一次快照后的数据；AOF 追加日志丢得少但文件大；4.0 混合持久化（RDB 底座+AOF 增量）兼得","ref":"f21","refTitle":"01-Redis"},{"id":"c165","cat":"Redis","q":"过期删除策略？","a":"惰性删除（访问时检查）+ 定期删除（随机抽检）组合，内存超限再触发淘汰策略","ref":"f21","refTitle":"01-Redis"},{"id":"c166","cat":"Redis","q":"内存淘汰策略？","a":"默认 noeviction 写报错；缓存场景用 allkeys-lru，含过期集合维度有 volatile-lru/lfu 等 8 种","ref":"f21","refTitle":"01-Redis"},{"id":"c167","cat":"Redis","q":"缓存穿透及解决？","a":"查询**不存在**的数据每次都打穿到 DB；空值缓存、布隆过滤器、入口参数校验","ref":"f21","refTitle":"01-Redis"},{"id":"c168","cat":"Redis","q":"缓存击穿及解决？","a":"单个**热点 key 过期瞬间**大量请求直击 DB；互斥锁重建、逻辑过期不删 key、热点数据不过期","ref":"f21","refTitle":"01-Redis"},{"id":"c169","cat":"Redis","q":"缓存雪崩及解决？","a":"**大量 key 同时失效**或 Redis 宕机；TTL 加随机值、多级缓存、集群高可用、限流降级兜底","ref":"f21","refTitle":"01-Redis"},{"id":"c170","cat":"Redis","q":"缓存与数据库一致性？","a":"Cache Aside 先更新 DB 再删除缓存 + 失败重试；要求更高用延迟双删；终极方案 canal 订阅 binlog 异步删缓存","ref":"f21","refTitle":"01-Redis"},{"id":"c171","cat":"Redis","q":"用 Redis 写分布式锁要注意什么？","a":"`SET key uniqueValue NX EX` 原子加锁；value 存唯一标识防误删；解锁用 Lua 校验后删除","ref":"f21","refTitle":"01-Redis"},{"id":"c172","cat":"Redis","q":"Redisson 分布式锁的原理？","a":"Lua 加解锁 + Hash 结构记录持有线程与重入次数；看门狗默认 30 秒锁、每 10 秒续期，解决业务超时锁先过期","ref":"f21","refTitle":"01-Redis"},{"id":"c173","cat":"Redis","q":"主从复制的流程？","a":"首次全量同步（主库生成 RDB 传给从库）+ 复制缓冲区增量，之后命令异步传播；读写分离依赖它","ref":"f21","refTitle":"01-Redis"},{"id":"c174","cat":"Redis","q":"哨兵的作用？","a":"监控主库、通知运维、自动故障转移（选新主）、充当配置中心；至少 3 个哨兵节点防止误判与脑裂","ref":"f21","refTitle":"01-Redis"},{"id":"c175","cat":"Redis","q":"Cluster 集群的原理？","a":"16384 个槽位按 CRC16 分片到各主节点，客户端请求错位收 MOVED 重定向；gossip 协议通信，主从自动切换","ref":"f21","refTitle":"01-Redis"},{"id":"c176","cat":"Redis","q":"大 key 与热 key 怎么处理？","a":"大 key：拆分成多个 key、用 UNLINK 异步删除、避免集合过大；热 key：本地缓存兜底、副本打散、限流","ref":"f21","refTitle":"01-Redis"},{"id":"c177","cat":"消息队列","q":"消息队列的三大作用？","a":"异步（缩短响应时间）、解耦（生产者消费者互不依赖）、削峰（洪峰进队列匀速消费）","ref":"f22","refTitle":"02-RabbitMQ"},{"id":"c178","cat":"消息队列","q":"RabbitMQ 的四种交换机？","a":"direct 精确匹配、fanout 广播、topic 通配符匹配、headers 按头部匹配；业务路由多用 topic","ref":"f22","refTitle":"02-RabbitMQ"},{"id":"c179","cat":"消息队列","q":"RabbitMQ 如何保证消息不丢？","a":"三段：生产者 confirm 确认、交换机/队列/消息持久化、消费者手动 ack，任一环节失败可重发","ref":"f22","refTitle":"02-RabbitMQ"},{"id":"c180","cat":"消息队列","q":"死信队列是什么？","a":"消息被拒绝/过期/队列满时路由到 DLX；用途是异常消息兜底，以及 TTL+死信实现延迟队列","ref":"f22","refTitle":"02-RabbitMQ"},{"id":"c181","cat":"消息队列","q":"Kafka 为什么快？","a":"顺序写磁盘+页缓存、零拷贝 sendfile、批量发送与压缩、分区并行消费","ref":"f23","refTitle":"03-Kafka"},{"id":"c182","cat":"消息队列","q":"Kafka 的 ACK 机制？","a":"0 不等待、1 主分区落盘即确认、all（-1）等 ISR 全部确认；可靠性要求高用 all + retries","ref":"f23","refTitle":"03-Kafka"},{"id":"c183","cat":"消息队列","q":"ISR 是什么？","a":"与 leader 保持同步的副本集合（含 leader），落后超过阈值被踢出；all ACK 只等 ISR 成员，兼顾可靠与性能","ref":"f23","refTitle":"03-Kafka"},{"id":"c184","cat":"消息队列","q":"消费组与 rebalance？","a":"组内消费者分摊分区且一个分区只归一个消费者；成员增减触发重平衡，期间会停止消费且可能重复消费","ref":"f23","refTitle":"03-Kafka"},{"id":"c185","cat":"消息队列","q":"Kafka 怎么保证消息顺序？","a":"只保证分区内有序；需要顺序的业务按 key 路由到同一分区，消费端单线程处理该分区","ref":"f23","refTitle":"03-Kafka"},{"id":"c186","cat":"消息队列","q":"RocketMQ 事务消息的原理？","a":"半消息（消费者不可见）→ 执行本地事务 → 提交/回滚半消息；Broker 定时回查事务状态兜底","ref":"f24","refTitle":"04-RocketMQ"},{"id":"c187","cat":"消息队列","q":"重复消费怎么办（幂等）？","a":"MQ 是至少一次投递，重复不可避免；消费端用唯一业务键 + 去重表/Redis SETNX/状态机校验实现幂等","ref":"f24","refTitle":"04-RocketMQ"},{"id":"c188","cat":"消息队列","q":"RabbitMQ/Kafka/RocketMQ 怎么选型？","a":"RabbitMQ 低延迟、功能全、适合中小业务；Kafka 吞吐王、适合日志与大数据；RocketMQ 电商业务（事务/延迟/顺序消息全支持）","ref":"f24","refTitle":"04-RocketMQ"},{"id":"c189","cat":"Elasticsearch/ZooKeeper/Nacos","q":"什么是倒排索引？","a":"分词后建立\"词项 → 文档列表\"的映射，查询按词直达文档，FST 结构压缩词典，这是全文检索快的根本","ref":"f25","refTitle":"05-Elasticsearch"},{"id":"c190","cat":"Elasticsearch/ZooKeeper/Nacos","q":"ES 和 MySQL 的分工？","a":"MySQL 是事务主存（写入源），ES 做检索与聚合的查询副本；各司其职而非互相替代","ref":"f25","refTitle":"05-Elasticsearch"},{"id":"c191","cat":"Elasticsearch/ZooKeeper/Nacos","q":"match 与 term 的区别？","a":"match 对查询词分词后做全文匹配打分；term 不分词做精确匹配；bool 组合 must/should/filter（filter 不算分且可缓存）","ref":"f25","refTitle":"05-Elasticsearch"},{"id":"c192","cat":"Elasticsearch/ZooKeeper/Nacos","q":"ES 的深分页问题？","a":"from+size 每个分片都要取 from+size 条排序，默认限制 1 万；翻页深用 search_after 游标，全量导出用 scroll","ref":"f25","refTitle":"05-Elasticsearch"},{"id":"c193","cat":"Elasticsearch/ZooKeeper/Nacos","q":"text 和 keyword 类型的区别？","a":"text 分词、参与相关性打分，用于全文搜索；keyword 不分词、整体匹配，用于精确过滤与聚合排序","ref":"f25","refTitle":"05-Elasticsearch"},{"id":"c194","cat":"Elasticsearch/ZooKeeper/Nacos","q":"MySQL 数据怎么同步到 ES？","a":"主流用 canal 监听 binlog → 发 MQ → 消费写入 ES，解耦且不侵入业务；代码双写是简易方案但有一致性风险","ref":"f25","refTitle":"05-Elasticsearch"},{"id":"c195","cat":"Elasticsearch/ZooKeeper/Nacos","q":"ZooKeeper 的应用场景？","a":"分布式锁、注册中心、配置中心、Master 选举；本质是基于\"文件系统 + Watcher\"的协调服务","ref":"f26","refTitle":"06-ZooKeeper与Nacos"},{"id":"c196","cat":"Elasticsearch/ZooKeeper/Nacos","q":"Watcher 机制的特点？","a":"一次性触发（触发后需重新注册）、轻量（只推事件类型不推数据）、顺序性（客户端先收到事件再看到新数据）","ref":"f26","refTitle":"06-ZooKeeper与Nacos"},{"id":"c197","cat":"Elasticsearch/ZooKeeper/Nacos","q":"临时节点与顺序节点？","a":"临时节点随会话断开自动删除（服务发现/锁的基石）；顺序节点由 ZK 追加序号保证全局有序（锁排队）","ref":"f26","refTitle":"06-ZooKeeper与Nacos"},{"id":"c198","cat":"Elasticsearch/ZooKeeper/Nacos","q":"ZAB 协议做了什么？","a":"崩溃恢复（按 zxid/epoch 选主）+ 消息广播（类似两阶段提交、过半即提交）；因此 ZK 是 CP 系统","ref":"f26","refTitle":"06-ZooKeeper与Nacos"},{"id":"c199","cat":"Elasticsearch/ZooKeeper/Nacos","q":"Nacos 的 AP 与 CP 怎么选？","a":"临时实例走 Distro 协议（AP，默认），持久实例与配置中心走 Raft（CP）；服务发现一般用 AP 保可用","ref":"f26","refTitle":"06-ZooKeeper与Nacos"},{"id":"c200","cat":"Elasticsearch/ZooKeeper/Nacos","q":"注册中心的服务发现原理？","a":"服务启动时注册地址 → 消费者订阅并拉取列表缓存本地 → 心跳续约剔除失效实例 → 变更推送更新本地缓存","ref":"f26","refTitle":"06-ZooKeeper与Nacos"},{"id":"c201","cat":"网络","q":"TCP 和 UDP 的区别？","a":"TCP 面向连接、可靠字节流、有流量/拥塞控制；UDP 无连接、不可靠、报文小延迟低（DNS/视频/游戏）","ref":"f11","refTitle":"03-IO模型与网络编程"},{"id":"c202","cat":"网络","q":"为什么三次握手不是两次？","a":"确认双方收发能力都正常，并防止历史重复的 SYN 建立无效连接；两次会导致服务端白白维持半连接","ref":"f11","refTitle":"03-IO模型与网络编程"},{"id":"c203","cat":"网络","q":"四次挥手与 TIME_WAIT？","a":"双向各发 FIN+ACK；主动方最后等 2MSL：确保对端收到最后的 ACK、让旧报文在网络中消亡","ref":"f11","refTitle":"03-IO模型与网络编程"},{"id":"c204","cat":"网络","q":"TCP 如何保证可靠传输？","a":"序列号+确认应答、超时重传/快速重传、滑动窗口流量控制、拥塞控制（慢启动/拥塞避免/快恢复）","ref":"f11","refTitle":"03-IO模型与网络编程"},{"id":"c205","cat":"网络","q":"常见 HTTP 状态码？","a":"200 成功、301/302 重定向、304 缓存有效、400 参数错、401/403 未认证/无权限、404 不存在、500 服务器错、502/504 网关错误/超时","ref":"f11","refTitle":"03-IO模型与网络编程"},{"id":"c206","cat":"网络","q":"HTTP 方法的幂等性？","a":"GET/PUT/DELETE 幂等（重复执行效果相同），POST 非幂等；幂等性影响重试设计","ref":"f11","refTitle":"03-IO模型与网络编程"},{"id":"c207","cat":"网络","q":"HTTPS 的握手与加密？","a":"TCP 之后 TLS 协商套件 → 验证证书（防冒充）→ ECDHE 非对称交换出对称密钥 → 之后对称加密通信；混合加密兼顾安全与性能","ref":"f11","refTitle":"03-IO模型与网络编程"},{"id":"c208","cat":"网络","q":"GET 和 POST 的区别？","a":"语义：GET 获取（幂等、参数在 URL、可缓存）vs POST 提交（非幂等、参数在 body）；本质都是 TCP 报文，区别是约定","ref":"f11","refTitle":"03-IO模型与网络编程"},{"id":"c209","cat":"网络","q":"TCP 粘包拆包怎么解决？","a":"TCP 是字节流没有消息边界；定长协议、分隔符、长度前缀（Netty LengthFieldBasedFrameDecoder）三种方案","ref":"f11","refTitle":"03-IO模型与网络编程"},{"id":"c210","cat":"网络","q":"select/poll/epoll 的区别？","a":"select 有 1024 上限且每次全量拷贝轮询；poll 无上限仍轮询；epoll 红黑树管理 fd + 就绪链表回调，O(1) 只处理就绪的","ref":"f11","refTitle":"03-IO模型与网络编程"},{"id":"c211","cat":"网络","q":"Cookie/Session/Token 的区别？","a":"Cookie 存客户端随请求携带；Session 存服务端（集群需共享）；Token（JWT）自包含无状态、天然适合分布式","ref":"f11","refTitle":"03-IO模型与网络编程"},{"id":"c212","cat":"网络","q":"JWT 的结构与校验？","a":"Header.Payload.Signature，签名防篡改；服务端无状态验证签发方；缺点是无法主动失效（要配黑名单）","ref":"f11","refTitle":"03-IO模型与网络编程"},{"id":"c213","cat":"网络","q":"DNS 的解析过程？","a":"浏览器缓存 → 系统缓存 → 本地 DNS（递归）→ 根/顶级/权威服务器（迭代），最终拿到 IP 并缓存","ref":"f11","refTitle":"03-IO模型与网络编程"},{"id":"c214","cat":"网络","q":"HTTP/1.1、2、3 的演进？","a":"1.1 长连接但仍有队头阻塞；2 二进制分帧+多路复用解决 HTTP 层阻塞；3 基于 QUIC/UDP 彻底解决 TCP 层队头阻塞","ref":"f11","refTitle":"03-IO模型与网络编程"},{"id":"c215","cat":"网络","q":"从输入 URL 到页面展示发生了什么？","a":"DNS 解析 → TCP 三次握手 → TLS 握手 → HTTP 请求 → 服务端处理返回 → 浏览器解析渲染，综合串讲题","ref":"f11","refTitle":"03-IO模型与网络编程"},{"id":"c216","cat":"操作系统","q":"进程和线程的区别？","a":"进程是资源分配单位（独立地址空间），线程是 CPU 调度单位（共享进程堆与方法区，各自有栈）；线程切换成本更低","ref":"f11","refTitle":"03-IO模型与网络编程"},{"id":"c217","cat":"操作系统","q":"进程间通信方式？","a":"管道、消息队列、共享内存（最快）、信号量、Socket；线程间直接共享内存但要加锁同步","ref":"f11","refTitle":"03-IO模型与网络编程"},{"id":"c218","cat":"操作系统","q":"死锁的四个必要条件？","a":"互斥、请求与保持、不可剥夺、循环等待；破坏任意一个即可预防，工程上常用资源有序申请","ref":"f11","refTitle":"03-IO模型与网络编程"},{"id":"c219","cat":"操作系统","q":"什么是虚拟内存？","a":"每个进程独立的虚拟地址空间，经页表映射到物理内存，缺页中断按需加载；带来隔离与\"内存超售\"能力","ref":"f11","refTitle":"03-IO模型与网络编程"},{"id":"c220","cat":"操作系统","q":"用户态与内核态？","a":"CPU 权限分级；系统调用/中断触发切换并保存上下文，切换有开销，频繁切换是性能杀手（如大量小 IO）","ref":"f11","refTitle":"03-IO模型与网络编程"},{"id":"c221","cat":"操作系统","q":"IO 多路复用是什么？","a":"一个线程同时监听多个 fd，内核告知就绪后才处理；select/poll/epoll 是三种实现，epoll 是高性能服务的标配","ref":"f11","refTitle":"03-IO模型与网络编程"},{"id":"c222","cat":"操作系统","q":"什么是零拷贝？","a":"数据不经过用户态来回拷贝（sendfile/mmap），减少 CPU 拷贝与上下文切换；Kafka、RocketMQ、Nginx 靠它提速","ref":"f11","refTitle":"03-IO模型与网络编程"},{"id":"c223","cat":"操作系统","q":"fork 是什么？写时复制？","a":"Unix 创建子进程的系统调用；COW 让父子先共享物理页，任一方写入时才真正复制，降低创建成本","ref":"f11","refTitle":"03-IO模型与网络编程"}],"quiz":[{"id":"q9f4b265c","kind":"select","cat":"Java基础","diff":"易","q":"JDK、JRE、JVM 三者的包含关系是？","opts":["JDK ⊃ JRE ⊃ JVM","JVM ⊃ JRE ⊃ JDK","JRE ⊃ JDK ⊃ JVM","三者互相独立"],"a":"A","exp":"JDK = 开发工具 + JRE，JRE = JVM + 核心类库；只需运行程序装 JRE，要开发才装 JDK。详见[《01-环境搭建与基础语法》](#/f/f3)","ref":"f3"},{"id":"q2e983fea","kind":"select","cat":"Java基础","diff":"中","q":"`StringBuilder sb = new StringBuilder(\"a\");` 调用 `change(sb)`，方法体为 `void change(StringBuilder x){ x.append(\"b\"); x = new StringBuilder(\"c\"); }`，之后 sb 的内容是？","opts":["a","c","ab","bc"],"a":"C","exp":"Java 只有值传递：append 修改的是同一个对象，而重新赋值只改变了形参的指向，不影响实参。详见[《01-环境搭建与基础语法》](#/f/f3)","ref":"f3"},{"id":"q94b063d1","kind":"select","cat":"Java基础","diff":"易","q":"`Integer a = 127, b = 127; System.out.println(a == b);` 输出什么？","opts":["false","编译错误","不确定","true"],"a":"D","exp":"IntegerCache 缓存 -128~127，范围内 == 比较的是同一个缓存对象；超出范围（如 128）必须用 equals。详见[《02-面向对象与核心类》](#/f/f4)","ref":"f4"},{"id":"qdb9bf6ae","kind":"select","cat":"Java基础","diff":"易","q":"以下哪个不属于面向对象三大特性？","opts":["重载","封装","继承","多态"],"a":"A","exp":"三大特性是封装、继承、多态；重载是编译期确定同签名不同参数的方法，不属于三大特性。详见[《02-面向对象与核心类》](#/f/f4)","ref":"f4"},{"id":"qc53e2f40","kind":"select","cat":"Java基础","diff":"易","q":"try-with-resources 的主要作用是？","opts":["自动提交事务","自动关闭实现了 AutoCloseable 的资源","捕获所有异常","提升运行速度"],"a":"B","exp":"编译器会生成 finally 中的关闭逻辑，避免资源泄漏，优于手写 try-catch-finally。详见[《04-异常-IO-反射-注解》](#/f/f6)","ref":"f6"},{"id":"qc518bf56","kind":"select","cat":"Java基础","diff":"中","q":"关于 String 不可变，正确的解释是？","opts":["String 是可变的，只是习惯上不改","频繁拼接字符串应优先用 String","String 类被 final 修饰、内部数据私有且不暴露修改方法","String 是基本数据类型"],"a":"C","exp":"不可变带来安全性、字符串常量池复用、hashCode 可缓存；频繁拼接用 StringBuilder。详见[《02-面向对象与核心类》](#/f/f4)","ref":"f4"},{"id":"q49902d55","kind":"select","cat":"集合","diff":"中","q":"JDK 1.8 中 ArrayList 首次 add 时容量扩到 10，此后每次扩容为原来的？","opts":["2 倍","1.2 倍","3 倍","1.5 倍"],"a":"D","exp":"newCapacity = oldCapacity + (oldCapacity >> 1)，即 1.5 倍向下取整。详见[《03-集合与泛型》](#/f/f5)","ref":"f5"},{"id":"q36b54228","kind":"select","cat":"集合","diff":"中","q":"HashMap（JDK 1.8）中链表转红黑树的条件是？","opts":["链表长度 ≥ 8 且数组长度 ≥ 64","链表长度 ≥ 8 即可","链表长度 ≥ 16","元素总数 ≥ 64"],"a":"A","exp":"数组长度不足 64 时优先扩容而不是树化；红黑树退化回链表的阈值是 6。详见[《03-集合与泛型》](#/f/f5)","ref":"f5"},{"id":"qd0c54804","kind":"select","cat":"集合","diff":"易","q":"HashSet 判断元素是否重复依赖的方法是？","opts":["仅 equals","hashCode 与 equals","仅 ==","compareTo"],"a":"B","exp":"先用 hashCode 定位桶，再在桶内用 equals 精确比较，两者必须一起重写。详见[《03-集合与泛型》](#/f/f5)","ref":"f5"},{"id":"q3cef9a45","kind":"select","cat":"集合","diff":"易","q":"下列集合中线程安全的是？","opts":["ArrayList","HashMap","Vector","LinkedList"],"a":"C","exp":"Vector 方法用 synchronized 修饰；现代并发场景更推荐 ConcurrentHashMap 或 CopyOnWriteArrayList。详见[《03-集合与泛型》](#/f/f5)","ref":"f5"},{"id":"qa42fd497","kind":"select","cat":"集合","diff":"易","q":"用 for-each 遍历 ArrayList 时直接调用 list.remove(o)，通常会？","opts":["正常删除","编译错误","静默删除所有元素","抛出 ConcurrentModificationException"],"a":"D","exp":"fail-fast 机制检测到 modCount 被修改即抛异常；正确做法是 Iterator.remove() 或 removeIf。详见[《03-集合与泛型》](#/f/f5)","ref":"f5"},{"id":"q8e47eefc","kind":"select","cat":"并发","diff":"易","q":"直接调用线程对象的 run() 而不是 start()，结果是？","opts":["在当前线程中作为普通方法执行","创建新线程执行","抛出异常","永久阻塞"],"a":"A","exp":"只有 start() 会让 JVM 创建新线程并调用 run()；直接调 run() 与普通方法调用无异。详见[《01-多线程与并发编程》](#/f/f9)","ref":"f9"},{"id":"q47770921","kind":"select","cat":"并发","diff":"易","q":"volatile 能保证的是？","opts":["原子性","可见性与有序性","原子性与可见性","原子性、可见性、有序性都保证"],"a":"B","exp":"volatile 保证可见性和禁止指令重排，但 i++ 这类复合操作仍需 synchronized 或原子类。详见[《01-多线程与并发编程》](#/f/f9)","ref":"f9"},{"id":"qfc23522a","kind":"select","cat":"并发","diff":"中","q":"线程池提交任务后的处理顺序是？","opts":["直接创建线程直到最大线程数","核心线程 → 阻塞队列 → 非核心线程 → 拒绝策略","先入队列再创建核心线程","顺序随机"],"a":"B","exp":"先占满核心线程，队列满了才扩非核心线程，到 max 后触发拒绝策略——这也是 FixedThreadPool 无界队列堆积 OOM 的根源。详见[《01-多线程与并发编程》](#/f/f9)","ref":"f9"},{"id":"q5d6c68e0","kind":"select","cat":"并发","diff":"中","q":"synchronized 锁升级的正确顺序是？","opts":["重量级锁 → 轻量级锁 → 偏向锁","轻量级锁 → 偏向锁 → 重量级锁","偏向锁 → 轻量级锁 → 重量级锁","不存在锁升级"],"a":"C","exp":"JVM 按竞争激烈程度逐步升级且不可逆，目的是减少无竞争场景的开销。详见[《01-多线程与并发编程》](#/f/f9)","ref":"f9"},{"id":"q76a56636","kind":"select","cat":"并发","diff":"中","q":"ThreadLocal 可能内存泄漏的根本原因是？","opts":["key 是强引用","value 是弱引用","底层是 ArrayList","key 是弱引用但 value 是强引用，线程长期存活时 value 无法回收"],"a":"D","exp":"线程池中线程长期存活，ThreadLocalMap 的 value 无法自动回收，用完必须调用 remove()。详见[《01-多线程与并发编程》](#/f/f9)","ref":"f9"},{"id":"q0e8a68e0","kind":"select","cat":"并发","diff":"易","q":"以下哪个不是 ThreadPoolExecutor 的拒绝策略？","opts":["FairPolicy","AbortPolicy","CallerRunsPolicy","DiscardPolicy"],"a":"A","exp":"四种拒绝策略是 AbortPolicy、CallerRunsPolicy、DiscardPolicy、DiscardOldestPolicy。详见[《01-多线程与并发编程》](#/f/f9)","ref":"f9"},{"id":"q1982ed9e","kind":"select","cat":"JVM","diff":"中","q":"以下运行时区域中，规范规定不会抛出 OutOfMemoryError 的是？","opts":["堆","程序计数器","虚拟机栈","元空间"],"a":"B","exp":"程序计数器是唯一没有规定任何 OOM 情况的区域；栈是 StackOverflowError，堆和元空间都会 OOM。详见[《02-JVM核心》](#/f/f10)","ref":"f10"},{"id":"qf75982ef","kind":"select","cat":"JVM","diff":"易","q":"判断对象是否可回收，主流商用虚拟机采用？","opts":["引用计数法","随机回收","可达性分析（从 GC Roots 出发）","手动释放"],"a":"C","exp":"可达性分析解决了引用计数法的循环引用问题；GC Roots 包括栈帧局部变量、静态变量、常量、JNI 引用等。详见[《02-JVM核心》](#/f/f10)","ref":"f10"},{"id":"q5efc147f","kind":"select","cat":"JVM","diff":"中","q":"双亲委派机制的主要作用是？","opts":["加快类加载速度","是节省内存的唯一手段","为了支持热更新","避免核心类被篡改与类的重复加载"],"a":"D","exp":"子加载器先委托父加载器，保证 String 等核心类始终由 Bootstrap 加载，安全且唯一。详见[《02-JVM核心》](#/f/f10)","ref":"f10"},{"id":"q61240830","kind":"select","cat":"JVM","diff":"中","q":"关于 G1 收集器，下列说法正确的是？","opts":["将堆划分为多个 Region，可设定目标停顿时间","只能回收新生代","基于标记-清除，必然产生大量碎片","是 JDK 8 的默认收集器"],"a":"A","exp":"G1 按 Region 管理、可预测停顿（-XX:MaxGCPauseMillis），整体标记-整理、Region 间复制，JDK 9+ 默认。详见[《02-JVM核心》](#/f/f10)","ref":"f10"},{"id":"qa9ba616a","kind":"select","cat":"MySQL","diff":"易","q":"InnoDB 的默认事务隔离级别是？","opts":["读未提交","可重复读","读已提交","串行化"],"a":"B","exp":"RR 通过 MVCC + 临键锁在很大程度上避免幻读；互联网公司常改用 RC 以减少锁冲突。详见[《索引-事务-锁与调优》](#/f/f14)","ref":"f14"},{"id":"qc8377dce","kind":"select","cat":"MySQL","diff":"中","q":"假设 name 列有索引，下列条件能走索引的是？","opts":["name LIKE '%三'","LEFT(name,1) = '张'","name LIKE '张%'","name + 1 = '张三'"],"a":"C","exp":"左模糊、对索引列使用函数或运算都会导致索引失效，只有右前缀模糊可以走索引。详见[《索引-事务-锁与调优》](#/f/f14)","ref":"f14"},{"id":"q223389b2","kind":"select","cat":"MySQL","diff":"易","q":"事务 ACID 中的 I 指的是？","opts":["原子性","一致性","持久性","隔离性"],"a":"D","exp":"Atomicity 原子性、Consistency 一致性、Isolation 隔离性、Durability 持久性。详见[《索引-事务-锁与调优》](#/f/f14)","ref":"f14"},{"id":"qda615f50","kind":"select","cat":"MySQL","diff":"中","q":"binlog（二进制日志）的主要用途是？","opts":["主从复制与时间点恢复","崩溃后恢复未完成的事务","保证事务原子性","记录慢查询"],"a":"A","exp":"崩溃恢复靠 redo log；binlog 是 Server 层日志，用于主从复制和数据归档恢复。详见[《索引-事务-锁与调优》](#/f/f14)","ref":"f14"},{"id":"q1b70b94a","kind":"select","cat":"MySQL","diff":"易","q":"InnoDB 聚簇索引的叶子节点存放的是？","opts":["主键值","整行数据","索引列 + 主键","数据页地址"],"a":"B","exp":"聚簇索引即主键索引，叶子存整行；二级索引叶子存\"索引列+主键\"，查非覆盖列需回表。详见[《索引-事务-锁与调优》](#/f/f14)","ref":"f14"},{"id":"qa1a50173","kind":"select","cat":"MySQL","diff":"易","q":"varchar(50) 在 utf8mb4 字符集下的含义是？","opts":["最多 50 字节","固定占 50 字节","最多 50 个字符","最多存 50 个汉字"],"a":"C","exp":"varchar 按字符计长度，实际占用字节数取决于字符集与内容。详见[《MySQL基础与SQL实战》](#/f/f13)","ref":"f13"},{"id":"qb86f3b6e","kind":"select","cat":"Redis","diff":"中","q":"Redis 6.0 引入多线程的目的是？","opts":["让命令执行并行化","彻底替换单线程模型","为了实现分布式锁","处理网络 IO 与协议解析，命令执行仍是单线程"],"a":"D","exp":"Redis 瓶颈常在网络 IO；引入多线程读写网络，命令执行保持单线程避免锁竞争。详见[《01-Redis》](#/f/f21)","ref":"f21"},{"id":"qd7a646d1","kind":"select","cat":"Redis","diff":"易","q":"解决缓存穿透的常用手段是？","opts":["缓存空值与布隆过滤器","过期时间加随机值","互斥锁重建缓存","多级缓存"],"a":"A","exp":"穿透是查询根本不存在的数据；B 针对 AOF 雪崩、C 针对击穿、D 用于高并发兜底。详见[《01-Redis》](#/f/f21)","ref":"f21"},{"id":"q865afd28","kind":"select","cat":"Redis","diff":"中","q":"关于 RDB 持久化，正确的是？","opts":["每条写命令都实时落盘","某一时刻的内存快照，恢复快但可能丢失最后一次快照后的数据","生成可读的文本命令日志","不能与 AOF 同时开启"],"a":"B","exp":"AOF 才是命令日志；RDB 二进制紧凑恢复快，Redis 4.0+ 支持 RDB+AOF 混合持久化。详见[《01-Redis》](#/f/f21)","ref":"f21"},{"id":"q17fdae4d","kind":"select","cat":"Redis","diff":"易","q":"大量 key 同一时刻过期导致数据库瞬间被压垮，这属于？","opts":["缓存穿透","缓存击穿","缓存雪崩","缓存污染"],"a":"C","exp":"雪崩=大规模 key 同时失效或 Redis 宕机；过期时间加随机值、多级缓存、集群高可用是常用方案。详见[《01-Redis》](#/f/f21)","ref":"f21"},{"id":"q094e877b","kind":"select","cat":"Redis","diff":"易","q":"实现排行榜功能最合适的 Redis 数据结构是？","opts":["String","Hash","Set","ZSet"],"a":"D","exp":"ZSet 按 score 排序，天然支持 ZINCRBY 加分、ZRANGE/ZREVRANGE 取 TopN。详见[《01-Redis》](#/f/f21)","ref":"f21"},{"id":"q770693c6","kind":"select","cat":"Redis","diff":"中","q":"Cache Aside 模式推荐的更新顺序是？","opts":["先更新数据库，再删除缓存","先更新缓存，再更新数据库","先删除缓存，再更新数据库，无兜底","缓存与数据库同时双写"],"a":"A","exp":"先更库再删缓存的不一致窗口最小；并发读写场景可配合延迟双删、过期时间兜底。详见[《01-Redis》](#/f/f21)","ref":"f21"},{"id":"q6fb83eb8","kind":"select","cat":"消息队列","diff":"易","q":"消息队列解决的核心问题是？","opts":["数据持久存储","异步、解耦、削峰","数据计算","服务发现"],"a":"B","exp":"典型场景：异步通知（注册发短信）、系统解耦（订单与库存）、流量削峰（秒杀）。详见[《02-RabbitMQ》](#/f/f22)","ref":"f22"},{"id":"qbe5d6915","kind":"select","cat":"消息队列","diff":"中","q":"关于 Kafka 的消息顺序，正确的是？","opts":["Topic 内天然全局有序","消费者越多越有序","单分区内有序，按 key 路由可保证同类消息有序","顺序与分区无关"],"a":"C","exp":"顺序只保证在分区内；需要顺序的消息按业务 key 路由到同一分区，且该分区在消费组内只由一个消费者处理。详见[《03-Kafka》](#/f/f23)","ref":"f23"},{"id":"q08b25567","kind":"select","cat":"消息队列","diff":"中","q":"以下哪项不是 Kafka 高吞吐的原因？","opts":["顺序写磁盘","零拷贝（sendfile）","批量发送与压缩","每条消息立即 fsync 刷盘"],"a":"D","exp":"Kafka 依赖页缓存批量刷盘，逐条 fsync 反而严重拖慢写入。详见[《03-Kafka》](#/f/f23)","ref":"f23"},{"id":"q3ac7d566","kind":"select","cat":"消息队列","diff":"中","q":"RocketMQ 事务消息的正确流程是？","opts":["发送半消息 → 执行本地事务 → 提交/回滚，配合事务回查兜底","先投递消息再执行本地事务，失败无法处理","由消费者代替生产者执行本地事务","依赖数据库两阶段提交"],"a":"A","exp":"半消息对消费者不可见；生产者宕机时 Broker 通过回查确认本地事务状态，实现最终一致。详见[《04-RocketMQ》](#/f/f24)","ref":"f24"},{"id":"q89ab8286","kind":"select","cat":"消息队列","diff":"易","q":"防止重复消费污染数据的通用思路是？","opts":["要求 MQ 绝对不重复","消费端幂等：唯一业务 ID + 去重表/状态机","把消费模式改为只消费一次","无需处理"],"a":"B","exp":"至少一次投递下重复不可避免，幂等是标准答案：数据库唯一键、Redis setnx 去重等。详见[《02-RabbitMQ》](#/f/f22)","ref":"f22"},{"id":"q44ddd0ff","kind":"select","cat":"框架","diff":"中","q":"同类中方法 A 直接调用带 @Transactional 的方法 B，事务失效的原因是？","opts":["事务传播行为冲突","方法 B 不是 public","自调用走的是原始对象而非代理对象","数据库不支持事务"],"a":"C","exp":"Spring 事务基于 AOP 代理，自调用绕过了代理对象；可拆分类、注入自身代理或用 AopContext 解决。注意 C 也可能失效，但\"自调用\"是本题场景主因。详见[《Spring核心》](#/f/f15)","ref":"f15"},{"id":"q27fb8513","kind":"select","cat":"框架","diff":"易","q":"Spring Bean 的默认作用域是？","opts":["prototype","request","session","singleton"],"a":"D","exp":"默认单例；有状态Bean可用 @Scope(\"prototype\")。详见[《Spring核心》](#/f/f15)","ref":"f15"},{"id":"q0d508603","kind":"select","cat":"框架","diff":"易","q":"Spring AOP 底层实现采用的是？","opts":["动态代理（JDK 动态代理或 CGLIB）","反射工具类","手写字节码注入","操作系统信号量"],"a":"A","exp":"目标类有接口时默认 JDK 动态代理，无接口时用 CGLIB 子类代理。详见[《Spring核心》](#/f/f15)","ref":"f15"},{"id":"q749f45b9","kind":"select","cat":"框架","diff":"中","q":"SpringBoot 自动配置的加载逻辑是？","opts":["扫描并加载所有第三方类","读取 AutoConfiguration.imports 列出的自动配置类，再按 @ConditionalOnXxx 条件筛选生效","用户必须手动注册所有 Bean","启动时随机加载部分配置"],"a":"B","exp":"@EnableAutoConfiguration 聚合加载配置清单，条件注解（如类路径、已有 Bean）决定是否生效。详见[《SpringBoot实战》](#/f/f16)","ref":"f16"},{"id":"qceaf8c49","kind":"select","cat":"框架","diff":"易","q":"MyBatis 中 #{} 与 ${} 的区别，正确的是？","opts":["二者完全等价","${} 更安全","#{} 是预编译占位符可防 SQL 注入，${} 是字符串拼接有注入风险","#{} 不能用在任何地方"],"a":"C","exp":"动态表名、ORDER BY 列名等无法参数化的位置才用 ${}，且必须白名单校验。详见[《MyBatis》](#/f/f17)","ref":"f17"},{"id":"qe9a11be0","kind":"select","cat":"框架","diff":"易","q":"MyBatis 一级缓存的作用范围是？","opts":["单个 Mapper 接口","应用全局","单个线程","SqlSession"],"a":"D","exp":"同一 SqlSession 内相同查询命中一级缓存（默认开启）；二级缓存跨会话，分布式下易脏读应慎用。详见[《MyBatis》](#/f/f17)","ref":"f17"},{"id":"qc67b4731","kind":"select","cat":"框架","diff":"难","q":"Spring 三级缓存能解决的循环依赖是？","opts":["singleton 作用域 + setter/字段注入的循环依赖","所有循环依赖","构造器注入的循环依赖","prototype 作用域的循环依赖"],"a":"A","exp":"三级缓存靠\"提前暴露早期引用\"；构造器注入在实例化阶段就需要依赖，prototype 每次新建，都无法用三级缓存解决。详见[《Spring核心》](#/f/f15)","ref":"f15"},{"id":"qd6bb8246","kind":"select","cat":"分布式与高并发","diff":"中","q":"关于 CAP 理论，实践中更准确的理解是？","opts":["三个特性可以同时任选","分区不可避免，实际是在 CP 与 AP 之间取舍","应该追求 CA 而放弃 P","P 可以通过配置关闭"],"a":"B","exp":"网络分区必然发生，P 是必选项；无分区时才能同时兼顾 C 与 A，如 ZK 偏 CP、Eureka 偏 AP。详见[《01-分布式理论基础》](#/f/f29)","ref":"f29"},{"id":"q4c6946d8","kind":"select","cat":"分布式与高并发","diff":"中","q":"雪花算法的结构中不包含以下哪部分？","opts":["符号位","时间戳","随机数","机器 ID"],"a":"C","exp":"标准结构是 1 位符号 + 41 位时间戳 + 10 位机器 ID + 12 位序列号；时钟回拨会产生重复 ID，需要兜底策略。详见[《01-分布式理论基础》](#/f/f29)","ref":"f29"},{"id":"qc742b160","kind":"select","cat":"分布式与高并发","diff":"中","q":"与漏桶算法相比，令牌桶的特点是？","opts":["恒定速率处理请求","不能用于限流","只能单机使用","允许一定程度的突发流量"],"a":"D","exp":"令牌桶积攒令牌允许突发消费；漏桶恒定速率流出，平滑但无突发能力。详见[《02-高并发系统设计》](#/f/f30)","ref":"f30"},{"id":"qbfa9317a","kind":"select","cat":"Java8","diff":"易","q":"以下哪一项不是 Java 8 引入的新特性？","opts":["sealed 密封类","Lambda 表达式与函数式接口","Stream API","Optional"],"a":"A","exp":"sealed 是 Java 17 的特性；Java 8 的代表性新特性是 Lambda、函数式接口、Stream、Optional、接口默认方法与新日期 API。详见[《05-Lambda-Stream与Java8新特性》](#/f/f7)","ref":"f7"},{"id":"qf767077e","kind":"select","cat":"Java8","diff":"中","q":"关于 Stream 的 map 与 flatMap，正确的是？","opts":["二者完全等价","map 将每个元素映射为另一个元素，flatMap 将每个元素映射为流后再拼接扁平化","flatMap 只能用于数值流","map 会自动去重"],"a":"B","exp":"flatMap 常用于「一对多展开」，例如把句子流拆成单词流。详见[《05-Lambda-Stream与Java8新特性》](#/f/f7)","ref":"f7"},{"id":"q853d21f2","kind":"select","cat":"Java8","diff":"易","q":"Optional 的设计目的是？","opts":["彻底取代所有 null 判断","提升程序运行性能","显式表达\"可能为空\"，用链式 API 减少 NPE","替代异常处理"],"a":"C","exp":"主要用于方法返回值；不建议用作字段与入参，也不建议直接 get()。详见[《05-Lambda-Stream与Java8新特性》](#/f/f7)","ref":"f7"},{"id":"qac678f97","kind":"select","cat":"网络","diff":"易","q":"TCP 建立连接需要进行几次握手？","opts":["2 次","4 次","1 次","3 次"],"a":"D","exp":"三次握手确认双方收发能力；两次无法确认\"客户端能收到\"，四次则冗余。详见[《03-IO模型与网络编程》](#/f/f11)","ref":"f11"},{"id":"q1b2dd99d","kind":"select","cat":"网络","diff":"中","q":"NIO 的核心三组件是？","opts":["Channel、Buffer、Selector","Stream、Reader、Writer","Socket、ServerSocket、URL","Thread、Runnable、Future"],"a":"A","exp":"一个 Selector 可监听多个 Channel 的事件，单线程管理大量连接，即 IO 多路复用。详见[《03-IO模型与网络编程》](#/f/f11)","ref":"f11"},{"id":"q817265ca","kind":"select","cat":"网络","diff":"中","q":"以下哪项不是 Netty 高性能的原因？","opts":["主从 Reactor 线程模型","每个连接独占一个线程","零拷贝与池化 Buffer","eventLoop 串行无锁化设计"],"a":"B","exp":"「每连接一线程」正是 BIO 的模型，连接多时线程爆炸；Netty 用少量 eventLoop 线程服务大量连接。详见[《03-IO模型与网络编程》](#/f/f11)","ref":"f11"},{"id":"qcf21325d","kind":"select","cat":"网络","diff":"易","q":"与 TCP 相比，UDP 的特点是？","opts":["面向连接、可靠传输","必须先握手才能发数据","无连接、不保证可靠但开销小、延迟低","自带拥塞控制"],"a":"C","exp":"适合音视频、DNS、游戏等实时性优先、可容忍少量丢包的场景。详见[《03-IO模型与网络编程》](#/f/f11)","ref":"f11"},{"id":"q9f5839df","kind":"select","cat":"框架","diff":"中","q":"微服务架构中，注册中心的作用是？","opts":["存储业务数据","代替数据库做缓存","部署应用","服务提供者注册地址，消费者动态发现可用实例"],"a":"D","exp":"配合心跳做健康检查，实例上下线自动感知，调用方从注册中心拉取可用地址列表。详见[《SpringCloud微服务》](#/f/f18)","ref":"f18"},{"id":"q79fe8f06","kind":"select","cat":"框架","diff":"易","q":"OpenFeign 实现声明式 HTTP 调用的底层原理是？","opts":["为接口生成动态代理，把方法调用翻译成 HTTP 请求","反射调用 Controller","需要手写 OkHttp 代码","依赖数据库存储过程"],"a":"A","exp":"@FeignClient 接口在启动时生成代理对象，结合负载均衡选择实例发起请求。详见[《SpringCloud微服务》](#/f/f18)","ref":"f18"},{"id":"q5fb5557e","kind":"select","cat":"框架","diff":"中","q":"下游服务大量超时，调用方暂时切断对它的请求并直接走兜底逻辑，这属于？","opts":["限流","熔断","负载均衡","灰度发布"],"a":"B","exp":"熔断像电闸：错误率或慢调用超阈值后跳闸快速失败，防止雪崩，之后半开状态试探恢复。详见[《SpringCloud微服务》](#/f/f18)","ref":"f18"},{"id":"q728914a2","kind":"select","cat":"Elasticsearch","diff":"易","q":"Elasticsearch 实现全文检索的核心数据结构是？","opts":["B+ 树","哈希表","倒排索引","跳表"],"a":"C","exp":"文本分词后建立「词项 → 文档列表」的映射，查询时先查词再取文档，天然适合全文搜索。详见[《05-Elasticsearch》](#/f/f25)","ref":"f25"},{"id":"qdca15af0","kind":"select","cat":"Elasticsearch","diff":"中","q":"关于 keyword 与 text 类型，正确的是？","opts":["二者都会分词","keyword 会分词，text 不分词","都不能用于聚合","text 会分词用于全文检索，keyword 不分词、适合精确匹配与排序聚合"],"a":"D","exp":"状态码、手机号等用 keyword 精确匹配；商品描述等长文本用 text。详见[《05-Elasticsearch》](#/f/f25)","ref":"f25"},{"id":"q030b55df","kind":"select","cat":"Nginx","diff":"易","q":"以下哪项不是 Nginx 的典型用途？","opts":["消息存储转发","反向代理","负载均衡","静态资源服务"],"a":"A","exp":"消息存储转发是消息队列的职责；Nginx 基于 epoll，擅长高并发连接接入与转发。详见[《07-Nginx》](#/f/f27)","ref":"f27"},{"id":"qd704ad7b","kind":"select","cat":"Nginx","diff":"中","q":"upstream 中配置 ip_hash 的作用是？","opts":["随机分发请求","同一客户端 IP 固定转发到同一后端节点","按权重分发","执行健康检查"],"a":"B","exp":"实现会话保持（不依赖 Cookie）；缺点是后端扩缩容时分布会变化。详见[《07-Nginx》](#/f/f27)","ref":"f27"},{"id":"qa0025d19","kind":"select","cat":"MongoDB","diff":"易","q":"MongoDB 的数据模型是？","opts":["二维关系表","图结构","文档（BSON）","纯键值对"],"a":"C","exp":"文档模型 schema 灵活、嵌套结构免多表关联；概念对应：库-集合-文档 ≈ 库-表-行。详见[《08-MongoDB》](#/f/f28)","ref":"f28"},{"id":"q23b960ff","kind":"select","cat":"MongoDB","diff":"中","q":"以下哪种场景最适合 MongoDB？","opts":["银行核心账务（强事务）","复杂的多表 JOIN 报表","计费扣款","商品详情这类字段灵活、结构多变的内容管理"],"a":"D","exp":"MongoDB 的弱项正是强事务与复杂关联；内容管理、日志埋点、爬虫数据是它的强项。详见[《08-MongoDB》](#/f/f28)","ref":"f28"},{"id":"qd6036fb9","kind":"select","cat":"Java基础","diff":"中","q":"`Integer x = 128, y = 128;` 执行 `System.out.println(x == y);` 输出什么？","opts":["false","true","编译错误","抛出 NullPointerException"],"a":"A","exp":"IntegerCache 只缓存 -128~127，128 会各自新建对象，== 比地址为 false；比较值必须用 equals。详见[《02-面向对象与核心类》](#/f/f4)","ref":"f4"},{"id":"q88a6c1dc","kind":"select","cat":"Java基础","diff":"中","q":"`final StringBuilder sb = new StringBuilder(\"a\"); sb.append(\"b\"); sb = new StringBuilder(\"c\");` 的结果是？","opts":["正常运行，sb 内容为 abc","编译错误：不能对 final 变量重新赋值","正常运行，sb 内容为 c","运行时抛出 IllegalStateException"],"a":"B","exp":"final 只禁止引用再次指向别处，指向的对象内容仍可修改；append 合法，第二次赋值非法。详见[《02-面向对象与核心类》](#/f/f4)","ref":"f4"},{"id":"q77ef431e","kind":"select","cat":"Java基础","diff":"中","q":"方法体为 `try { return 1; } finally { return 2; }`，调用方拿到的返回值是？","opts":["1","编译错误：finally 中不允许 return","2","抛出异常"],"a":"C","exp":"finally 在 return 之前执行，其中的 return 会覆盖 try 的返回值并吞掉异常；这是典型的坑，实际编码禁止在 finally 写 return。详见[《04-异常-IO-反射-注解》](#/f/f6)","ref":"f6"},{"id":"q76bde8f2","kind":"select","cat":"集合","diff":"中","q":"某类只重写了 equals 没有重写 hashCode，用它作 HashMap 的 key，`put(k,v)` 后用另一个字段相等的新对象 `get(k2)`，通常得到？","opts":["v","编译错误","抛出 ClassCastException","null"],"a":"D","exp":"HashMap 先用 hashCode 定位桶，未重写 hashCode 时两个对象哈希不同、落到不同桶，equals 根本没机会被调用。详见[《03-集合与泛型》](#/f/f5)","ref":"f5"},{"id":"q8b3ff982","kind":"select","cat":"集合","diff":"中","q":"`List<Integer> list = Arrays.asList(1, 2,3);` 之后执行 `list.set(0, 9)` 和 `list.add(4)`，结果是？","opts":["set 成功，add 抛出 UnsupportedOperationException","set 和 add 都成功","set 抛异常，add 成功","两者都编译错误"],"a":"A","exp":"Arrays.asList 返回的是固定大小的视图（底层是数组），支持改元素 set，不支持改变长度的 add/remove。详见[《03-集合与泛型》](#/f/f5)","ref":"f5"},{"id":"q2d3e24a6","kind":"select","cat":"并发","diff":"中","q":"线程池 corePoolSize=1、maximumPoolSize=2、队列容量=1，连续提交 4 个耗时任务，会观察到？","opts":["1 个线程执行，其余排队","2 个线程执行，1 个在队列中，第 4 个触发拒绝策略","4 个线程并行执行","4 个任务全部被拒绝"],"a":"B","exp":"任务 1 建核心线程，任务 2 入队，任务 3 因队列已满才建非核心线程，任务 4 已达 max 走拒绝策略——队列先于非核心线程。详见[《01-多线程与并发编程》](#/f/f9)","ref":"f9"},{"id":"qce6f8206","kind":"select","cat":"并发","diff":"中","q":"多个线程共用同一个 SimpleDateFormat 实例做 parse/format，最典型的现象是？","opts":["完全正常，只是慢一点","编译错误，SimpleDateFormat 不可共享","结果错乱或抛出解析异常","自动加锁串行执行"],"a":"C","exp":"SimpleDateFormat 内部持有可变 Calendar，非线程安全；应改用线程安全的 DateTimeFormatter，或每次新建、用 ThreadLocal 持有。详见[《05-Lambda-Stream与Java8新特性》](#/f/f7)","ref":"f7"},{"id":"q969765be","kind":"select","cat":"Java基础","diff":"中","q":"`System.out.println(0.1 + 0.2 == 0.3);` 输出什么？","opts":["true","编译错误","不确定，取决于 JVM 版本","false"],"a":"D","exp":"0.1/0.2 的二进制浮点表示无法精确存储，相加为 0.30000000000000004；金额计算用 BigDecimal 或 long 存分。详见[《01-环境搭建与基础语法》](#/f/f3)","ref":"f3"},{"id":"q2b2ed25c","kind":"select","cat":"并发","diff":"难","q":"AQS 中的 state 变量，在独占模式与共享模式下分别表示什么？","opts":["独占模式下表示资源占用/重入次数，共享模式下表示剩余可用许可数","两种模式下都表示持有者的线程编号","两种模式下都表示等待队列的长度","由开发者随意定义，AQS 内部并不使用它"],"a":"A","exp":"ReentrantLock 用 state 记重入次数，Semaphore/CountDownLatch 用 state 记许可数/计数，tryAcquire 与 tryAcquireShared 语义由此不同。详见[《01-多线程与并发编程》](#/f/f9)","ref":"f9"},{"id":"q5c380cbb","kind":"select","cat":"并发","diff":"难","q":"ThreadLocal 泄漏链路中，当外部 strong 引用被置 null 后，正确的描述是？","opts":["key 被回收，value 同时被自动回收","key 被回收变成 null，但 value 仍被 Thread→ThreadLocalMap→Entry 强引用链持有","key 和 value 都不会被回收，因为 Entry 是强引用","value 是弱引用，随时可能被 GC 回收"],"a":"B","exp":"Entry 继承 WeakReference，key 弱、value 强。线程不死则 value 无法回收，get/set 时的惰性清理不可靠，所以用完必须 remove()。详见[《01-多线程与并发编程》](#/f/f9)","ref":"f9"},{"id":"q2f6eae62","kind":"select","cat":"JVM","diff":"难","q":"并发标记出现\"漏标\"（对象明明活着却被回收）需要同时满足两个条件，是？","opts":["白色对象被两个黑色对象同时引用","新生代对象被老年代引用","黑色对象新增了指向白色对象的引用，且灰色到该白色对象的路径被删除","标记线程与应用线程同时运行"],"a":"C","exp":"三色标记只破坏一个条件不会漏标；CMS 用增量更新（写屏障记录黑→白新引用）、G1 用 SATB 快照（记录删除前的引用）分别解决。详见[《02-JVM核心》](#/f/f10)","ref":"f10"},{"id":"q31a9b51f","kind":"select","cat":"JVM","diff":"难","q":"双亲委派机制被\"破坏\"的典型场景不包括以下哪项？","opts":["JDBC 通过 SPI 让 DriverManager 反向调用 AppClassLoader 加载 Driver","Tomcat 各 Webapp 的类加载器优先加载自己的类，实现应用隔离","热部署/OSGi 用自定义 ClassLoader 替换旧类实现动态更新","用 Class.forName() 显式指定类名加载一个类"],"a":"D","exp":"Class.forName 仍走调用者所在类加载器并向上委托，没有破坏委派；A 靠线程上下文类加载器，B、C 是打破委派顺序的真实需求。详见[《02-JVM核心》](#/f/f10)","ref":"f10"},{"id":"q2ced2e06","kind":"select","cat":"MySQL","diff":"难","q":"RR 隔离级别下，执行 `UPDATE t SET x=1 WHERE name='a'` 而 name 上没有索引，InnoDB 的加锁行为是？","opts":["扫描过程中对所有行都加行锁（约等于锁全表），无匹配也不释放已扫描行","只对匹配的行加锁","只加表级元数据锁，不加行锁","直接抛出\"无索引不能更新\"的错误"],"a":"A","exp":"InnoDB 锁的是\"扫过的记录\"，无索引即全表扫描，于是每行都被加锁；这也解释了为什么 UPDATE/DELETE 条件列必须有索引。详见[《索引-事务-锁与调优》](#/f/f14)","ref":"f14"},{"id":"qc4786a16","kind":"select","cat":"MySQL","diff":"难","q":"关于 MVCC 的 ReadView 生成时机，正确的是？","opts":["RR 和 RC 都在事务开始时生成","RR 在事务第一次快照读时生成并整个事务复用；RC 每次快照读都重新生成","RR 每次 select 都重新生成，所以能读到最新数据","ReadView 只在加锁读时生成，快照读不需要"],"a":"B","exp":"这正是\"可重复读\"与\"读已提交\"差异的实现根源：RR 复用一份快照，RC 每次重新取，因而能看到别的事务已提交的更新。详见[《索引-事务-锁与调优》](#/f/f14)","ref":"f14"},{"id":"q444f6cbb","kind":"select","cat":"分布式与高并发","diff":"难","q":"关于 Redlock 算法的主要争议，下列说法最准确的是？","opts":["它的争议在于只能部署在单机 Redis 上","争议在于它必须依赖 ZooKeeper 才能工作","在 GC 停顿或时钟漂移下，客户端可能在锁已过期后仍以为持有锁，需要 fencing token 兜底","学界已公认它完全不可用"],"a":"C","exp":"Kleppmann 指出：进程暂停跨越租期后依旧会写，多节点也无法阻止；antirez 则反驳假设过于悲观。实践中单点故障容忍度高的业务多用单实例锁 + 幂等。详见[《01-分布式理论基础》](#/f/f29)","ref":"f29"},{"id":"q2c25b764","kind":"select","cat":"并发","diff":"难","q":"多个线程竞争同一把锁时，锁升级各阶段的触发条件正确的是？","opts":["只要有两个线程访问就直接重量级锁","轻量级锁竞争失败会退回偏向锁","偏向锁和轻量级锁是同时获取的","只有一个线程访问时保持偏向，出现第二个线程竞争升级为轻量级，自旋失败/竞争加剧才膨胀为重量级"],"a":"D","exp":"升级路径单向不可逆，代价依次升高：偏向只需一次 CAS 记录线程 ID，轻量级靠 CAS+自旋，重量级依赖 OS Mutex 挂起线程。详见[《01-多线程与并发编程》](#/f/f9)","ref":"f9"},{"id":"qeec7ca1e","kind":"select","cat":"消息队列","diff":"难","q":"Kafka 消费组频繁发生 Rebalance（Rebalance 风暴）的常见诱因是？","opts":["消费者处理时间超过 max.poll.interval.ms 被判定失效，反复进出组触发全员重分配","分区数少于消费者数量","Broker 端开启了事务","生产者 acks 配置为 all"],"a":"A","exp":"Rebalance 是 stop-the-world 的，期间整组停止消费；调大单次处理量上限、缩小批处理、优化耗时才是正解，分区数不足只会造成空闲。详见[《03-Kafka》](#/f/f23)","ref":"f23"},{"id":"q44a77dc2","kind":"select","cat":"JVM","diff":"难","q":"安全点（Safepoint）的准确含义是？","opts":["内存不足时触发 Full GC 的时刻","线程执行到指定位置后暂停，此时所有线程的栈与引用关系可被精确定位","每次对象分配前都要检查的位置","只有方法调用才是安全点，循环不是"],"a":"B","exp":"GC、偏向锁撤销、线程 dump 等操作要求线程在安全点停顿，靠 OopMap 定位引用；长循环需插入轮询指令，否则 safepoint 停顿时间被拉长。详见[《02-JVM核心》](#/f/f10)","ref":"f10"},{"id":"q717d5f65","kind":"select","cat":"MySQL","diff":"难","q":"以下哪个 SELECT 一定需要回表（假设只有 name 单列索引）？","opts":["SELECT id FROM t WHERE name = 'a'","SELECT name FROM t WHERE name = 'a'","SELECT age FROM t WHERE name = 'a'","SELECT count(*) FROM t WHERE name = 'a'"],"a":"C","exp":"二级索引叶子只存索引列与主键，age 不在索引中只能拿主键回聚簇索引取整行；A、B、D 需要的列都在索引里，属于覆盖索引。详见[《索引-事务-锁与调优》](#/f/f14)","ref":"f14"},{"id":"q26efe2c4","kind":"select","cat":"操作系统","diff":"中","q":"fork() 之后父子进程初始时的内存状态是？","opts":["父进程内存被完整复制到子进程的物理内存","子进程只共享代码段，数据段全部重新初始化","父子进程完全共享内存，互相可见所有修改","父子共享同一份物理页，任一方写入时才复制该页（写时复制 COW）"],"a":"D","exp":"fork 只复制页表，物理页通过引用计数共享，写触发缺页异常再拷贝；这就是 fork 大内存进程仍然很快、但写入会翻倍占用的原因。详见[《03-IO模型与网络编程》](#/f/f11)","ref":"f11"},{"id":"q2fb0fab7","kind":"select","cat":"操作系统","diff":"中","q":"以下哪项不是死锁的四个必要条件之一？","opts":["时间片轮转调度","互斥条件","请求与保持条件","循环等待条件"],"a":"A","exp":"四个必要条件是互斥、请求与保持、不可剥夺、循环等待；破坏任意一个即可预防死锁，调度算法与死锁无必然关系。详见[《01-多线程与并发编程》](#/f/f9)","ref":"f9"},{"id":"q2571d430","kind":"select","cat":"操作系统","diff":"中","q":"用户态切换到内核态的典型时机是？","opts":["执行任何一条算术指令","系统调用、中断或异常","方法调用与返回","只有进程创建时"],"a":"B","exp":"系统调用（read/write）、外设中断、缺页等异常会触发特权级切换并保存现场；频繁切换的开销正是 NIO/epoll、零拷贝优化的动机。详见[《03-IO模型与网络编程》](#/f/f11)","ref":"f11"},{"id":"q3d7766b2","kind":"select","cat":"ZooKeeper","diff":"中","q":"用 ZooKeeper 实现分布式锁或公平排队，最合适的节点组合是？","opts":["持久节点 + 轮询","只读节点 + Watch 全量列表","临时顺序节点，各客户端监听前一个节点","持久顺序节点 + 定时删除"],"a":"C","exp":"临时节点随会话断开自动消失，解决持锁者宕机的死锁；顺序号保证公平，只监听前一个节点可避免羊群效应。详见[《06-ZooKeeper与Nacos》](#/f/f26)","ref":"f26"},{"id":"q32808404","kind":"select","cat":"ZooKeeper","diff":"中","q":"一个 3 节点的 ZK 集群，最多能容忍几个节点宕机仍对外提供读写？","opts":["0 个","2 个","3 个都可以","1 个"],"a":"D","exp":"过半机制要求存活节点数 > n/2：3 台需 2 台在线，故只能挂 1 台；5 台可挂 2 台。部署 4 台的容错能力和 3 台一样，还多花成本。详见[《06-ZooKeeper与Nacos》](#/f/f26)","ref":"f26"},{"id":"qaff00159","kind":"select","cat":"ZooKeeper","diff":"中","q":"关于 ZooKeeper 的 Watcher 机制，正确的是？","opts":["Watcher 是一次性的，事件触发后需重新注册","Watcher 触发后会持续监听该节点的每次变更","Watcher 能保证事件按写入顺序且不丢失地送达","只有持久节点能设置 Watcher"],"a":"A","exp":"一次性注册意味着两次变更之间的信息可能丢失，因此 ZK 不适合做可靠消息通知；Nacos 的配置推送、MQ 的削峰都用别的方案。详见[《06-ZooKeeper与Nacos》](#/f/f26)","ref":"f26"},{"id":"qc9d13c66","kind":"select","cat":"框架","diff":"中","q":"动态排序需求 `ORDER BY ${orderBy}` 的正确防护做法是？","opts":["把 orderBy 用 #{} 包住即可防注入","在 Java 层用白名单校验列名，非法值直接抛异常或回退默认排序","依赖 MyBatis 自带的 SQL 转义函数","只允许前端传数字，就不会有注入"],"a":"B","exp":"ORDER BY 的列名无法用 #{} 参数化（预编译占位符只能替换值），只能字符串拼接，必须服务端白名单枚举；D 错在字段名本身也可被注入。详见[《MyBatis》](#/f/f17)","ref":"f17"},{"id":"q917cc0a9","kind":"select","cat":"设计模式","diff":"中","q":"双重检查锁单例中，实例字段必须加 volatile，原因是？","opts":["volatile 能让 new 操作变成原子操作","不加 volatile 会导致编译错误","保证可见性，且禁止\"分配内存-初始化-赋值引用\"三步重排序","主要是为了提升加锁的性能"],"a":"C","exp":"没有 volatile 时，其他线程可能拿到引用非 null 但尚未初始化完的半成品对象；volatile 的内存屏障禁止了这一步序颠倒。详见[《07-设计模式》](#/f/f8)","ref":"f8"},{"id":"q06017304","kind":"select","cat":"工具链","diff":"中","q":"要把功能分支合并回主干且保留真实分叉历史，应选？","opts":["git rebase，历史变成一条直线","git cherry-pick","git stash","git merge，产生一个合并提交、保留分支分叉"],"a":"D","exp":"merge 不改写历史，适合已推送的公共分支；rebase 会重写提交，对多人协作的分支执行会有风险，\"已发布的历史不要 rebase\"是铁律。详见[《04-开发工具链-Git-Maven-Linux》](#/f/f12)","ref":"f12"},{"id":"qd59659c0","kind":"select","cat":"工具链","diff":"中","q":"一次 merge 已经把错误代码合进了主干并已推送，最稳妥的撤销方式是？","opts":["git revert -m 1 <合并提交>","git reset --hard HEAD~1 后强推","git commit --amend","删掉分支重新拉"],"a":"A","exp":"revert 生成一条反向提交、不改写历史，对协作分支安全；-m 1 表示保留主干一侧的父提交。reset+强推会让同事的本地历史错位。详见[《04-开发工具链-Git-Maven-Linux》](#/f/f12)","ref":"f12"},{"id":"q3d455a4c","kind":"select","cat":"工具链","diff":"中","q":"Maven 出现依赖版本冲突时，默认的仲裁规则是？","opts":["版本号最大的胜出","依赖树中路径最近的胜出，路径相同则先声明的胜出","pom 中最后一个 <dependency> 胜出","由传递依赖的作者指定"],"a":"B","exp":"先\"最短路径优先\"再\"同深度先声明优先\"；定位用 mvn dependency:tree，治理用 <dependencyManagement> 或 exclusions 显式固定版本。详见[《04-开发工具链-Git-Maven-Linux》](#/f/f12)","ref":"f12"},{"id":"q33ad6245","kind":"select","cat":"单元测试","diff":"中","q":"@MockBean 与 Mockito 的 @Mock 的关键区别是？","opts":["两者完全等价，只是包名不同","@Mock 能替换容器里的 Bean，@MockBean 不能","@MockBean 替换 Spring 容器中的 Bean 且会导致上下文缓存失效重建，@Mock 只是纯对象、需手动注入","@MockBean 只能用于 Controller 层"],"a":"C","exp":"@MockBean 需要 SpringBootTest 上下文支持，一个类里多个 @MockBean 会显著拖慢测试；纯单元测试优先用 @Mock + @InjectMocks。详见[《05-单元测试与工程质量》](#/f/f19)","ref":"f19"},{"id":"q883a909a","kind":"select","cat":"单元测试","diff":"中","q":"要测试\"Controller → Service → Mapper 整条链路真实装配\"，最合适的注解组合是？","opts":["@WebMvcTest 单独使用","@DataJpaTest 单独使用","@ExtendWith(MockitoExtension.class)","@SpringBootTest + @AutoConfigureMockMvc"],"a":"D","exp":"@SpringBootTest 启动完整容器做集成测试；@WebMvcTest 只加载 Web 层（Service 需 mock），@DataJpaTest 只测持久层且默认事务回滚。详见[《05-单元测试与工程质量》](#/f/f19)","ref":"f19"},{"id":"qde5b55a1","kind":"select","cat":"MySQL","diff":"难","q":"关于间隙锁（Gap Lock）与插入冲突，下列描述正确的是？","opts":["两个事务同时对同一间隙加间隙锁不冲突，但其中一个插入该间隙会被另一个阻塞","间隙锁之间互斥，第二个事务无法加","间隙锁会锁住整张表","RR 与 RC 都会对范围查询加间隙锁"],"a":"A","exp":"间隙锁只与\"插入该间隙\"冲突，彼此相容，所以两事务都能锁 (10,20) 区间；一旦一方插入 (10,20) 就被另一方的间隙锁挡住——并发插入死锁的常见来源。RC 下基本不加间隙锁。详见[《索引-事务-锁与调优》](#/f/f14)","ref":"f14"},{"id":"qd1993e99","kind":"select","cat":"Java基础","diff":"中","q":"`int[] a = {1, 2, 3}; int[] b = a.clone(); b[0] = 99;` 之后 `a[0]` 的值是？","opts":["99","1","编译错误","0"],"a":"B","exp":"数组 clone 是浅拷贝，新数组元素独立；若元素是引用类型则复制的是引用，改对象内容仍会互相影响。详见[《07-设计模式》](#/f/f8)","ref":"f8"},{"id":"qb06b4c41","kind":"select","cat":"Java基础","diff":"中","q":"关于接口中的方法，Java 8 之后说法正确的是？","opts":["接口只能有抽象方法","default 方法必须被实现类强制覆写","接口可以有 default 方法与 static 方法，default 方法可被实现类继承或覆写","static 方法可以被子接口继承并在实现类中直接调用"],"a":"C","exp":"Java 8 引入 default/static 方法支持接口演进；default 可不覆写，static 属于接口本身、不被继承，只能通过接口名调用。详见[《02-面向对象与核心类》](#/f/f4)","ref":"f4"},{"id":"q93cc889c","kind":"select","cat":"Java基础","diff":"中","q":"一个类实现两个接口，两个接口有同名同参的 default 方法，会发生什么？","opts":["自动选择第一个接口的实现","自动选择第二个接口的实现","运行时抛异常","编译错误，必须在该类中显式覆写并用 `接口名.super.方法()` 指定"],"a":"D","exp":"菱形冲突编译器无法裁决，强制实现类覆写消歧，这也是 default 方法引入后的典型考点。详见[《02-面向对象与核心类》](#/f/f4)","ref":"f4"},{"id":"q515f02af","kind":"select","cat":"Java基础","diff":"中","q":"`new BigDecimal(0.1)` 与 `new BigDecimal(\"0.1\")` 的区别是？","opts":["前者以 double 的二进制近似值为准，结果不是精确的 0.1；后者按十进制字符串精确表示","没有区别，结果相同","前者精确、后者有误差","前者编译报错"],"a":"A","exp":"造 BigDecimal 必须用 String 或 valueOf，用 double 会把二进制误差一起带进来，金额计算尤忌。详见[《02-面向对象与核心类》](#/f/f4)","ref":"f4"},{"id":"q742116a9","kind":"select","cat":"Java基础","diff":"中","q":"自定义异常继承 RuntimeException 与继承 Exception 的关键差别是？","opts":["前者是受检异常必须 try 或 throws","前者无需显式 catch/throws，后者编译期强制处理","后者是运行时异常，编译器不强制处理","没有差别，只是命名习惯"],"a":"B","exp":"Exception 系（非 RuntimeException）是受检异常，编译器强制处理；RuntimeException 系免检，参数校验失败常抛它。详见[《04-异常-IO-反射-注解》](#/f/f6)","ref":"f6"},{"id":"qc62e49c2","kind":"select","cat":"Java基础","diff":"中","q":"关于 try-with-resources，说法正确的是？","opts":["任何对象都能作为资源","必须在 finally 里手动 close，否则不会关闭","资源必须实现 AutoCloseable，且 close 会在 try 块结束（含异常）时自动调用","多个资源按声明顺序逆序关闭，先声明后关闭"],"a":"C","exp":"需实现 AutoCloseable（或 Closeable），多个资源按声明逆序关闭（后声明先关）；这也是它优于手写 finally 的地方。详见[《04-异常-IO-反射-注解》](#/f/f6)","ref":"f6"},{"id":"q3fbaf699","kind":"select","cat":"Java基础","diff":"中","q":"`Class.forName(\"com.mysql.jdbc.Driver\")` 与 `ClassLoader.loadClass(...)` 的关键差别是？","opts":["两者完全等价","forName 只能加载 JDK 自带的类","loadClass 会触发静态初始化，forName 不会","forName 默认会执行类的静态初始化块，loadClass 默认不会"],"a":"D","exp":"forName 默认 initialize=true 会跑 static 块，这正是 JDBC 驱动注册的经典用法；loadClass 只加载不初始化。详见[《02-JVM核心》](#/f/f10)","ref":"f10"},{"id":"qf621e6b2","kind":"select","cat":"Java基础","diff":"中","q":"序列化时 `serialVersionUID` 不一致会导致什么？","opts":["反序列化时抛 InvalidClassException","序列化时抛异常","静默忽略旧字段，正常反序列化","编译报错"],"a":"A","exp":"serialVersionUID 是序列化的版本契约，类结构变了而 UID 不匹配时反序列化会拒绝，显式声明可避免编译器自动生成值随环境变化。详见[《04-异常-IO-反射-注解》](#/f/f6)","ref":"f6"},{"id":"q63234e23","kind":"select","cat":"Java基础","diff":"难","q":"静态代码块、实例代码块、构造方法的执行顺序（首次创建对象时）是？","opts":["构造方法 → 实例块 → 静态块","静态块 → 实例块 → 构造方法","实例块 → 静态块 → 构造方法","三者顺序不确定"],"a":"B","exp":"静态块随类初始化执行且仅一次，之后每次 new 走实例块再走构造方法，父类先于子类；面试常给继承场景问输出。详见[《02-面向对象与核心类》](#/f/f4)","ref":"f4"},{"id":"q92032f32","kind":"select","cat":"Java基础","diff":"难","q":"`String s = \"a\" + \"b\" + \"c\";` 在编译期发生什么？","opts":["创建三个临时 String 再拼接","编译为 StringBuilder 链式调用","编译器常量折叠，直接生成 \"abc\" 一个常量","运行时用 + 逐个拼接"],"a":"C","exp":"字面量相加编译器直接折叠为一个常量；只有含变量时才会编译为 StringBuilder，这是「字符串拼接性能」题的关键前提。详见[《02-面向对象与核心类》](#/f/f4)","ref":"f4"},{"id":"q5033c7f0","kind":"select","cat":"Java基础","diff":"难","q":"方法重载的解析（选择哪个重载版本）发生在什么阶段？","opts":["运行时，根据实际对象类型动态选择","编译期和运行时各选一次","运行时，根据参数个数动态选择","编译期，根据引用变量的静态类型选择"],"a":"D","exp":"重载是编译期静态分派（看静态类型），重写是运行期动态分派（看实际类型）；重载版本的参数若是父类与子类，选的是编译期那个。详见[《02-面向对象与核心类》](#/f/f4)","ref":"f4"},{"id":"q1ee4b5ae","kind":"select","cat":"Java基础","diff":"难","q":"以下哪种情况**不会**触发类的初始化？","opts":["通过数组定义引用类，如 `MyClass[] arr = new MyClass[5]`","读取一个类的静态字段（非常量）","new 一个该类的实例","通过反射调用该类的静态方法"],"a":"A","exp":"数组定义只创建数组对象，不初始化元素类；B/C/D 都会触发初始化。另有两条边界：static final 基本类型常量在编译期内联、同样不触发；通过子类访问父类静态字段，初始化的是父类。详见[《02-JVM核心》](#/f/f10)","ref":"f10"},{"id":"q3a666bcc","kind":"select","cat":"集合","diff":"中","q":"`ArrayList` 与 `LinkedList` 做头部插入 10000 次，性能差异的根本原因是？","opts":["LinkedList 线程安全所以更慢","ArrayList 头插需要整体移动元素 O(n)，LinkedList 只需改指针 O(1)","LinkedList 更省内存","ArrayList 不支持头部插入"],"a":"B","exp":"ArrayList 底层数组，头插要 System.arraycopy 搬移；LinkedList 双向链表改前后指针即可，但按索引访问却是 O(n)。详见[《03-集合与泛型》](#/f/f5)","ref":"f5"},{"id":"q48a1ffc1","kind":"select","cat":"集合","diff":"中","q":"`HashMap` 扩容时（JDK 1.8）对旧桶链表的处理方式是？","opts":["重新计算每个 key 的 hash 再分配","全部重新插入到新表头","利用 `hash & oldCap` 判断高位，把链表拆成「原位置」与「原位置+oldCap」两条","保持链表不动，只扩大数组"],"a":"C","exp":"容量为 2 的幂时，元素新位置只可能是原位或原位+oldCap，1.8 借此省去重算 hash 并避免 1.7 头插成环。详见[《03-集合与泛型》](#/f/f5)","ref":"f5"},{"id":"qe295de2a","kind":"select","cat":"集合","diff":"中","q":"遍历 `HashMap` 时想按插入顺序输出，应该用？","opts":["HashMap","Hashtable","TreeMap","LinkedHashMap"],"a":"D","exp":"LinkedHashMap 在哈希结构上加了双向链表维护插入顺序（accessOrder=true 时变访问顺序，天然可做 LRU）；TreeMap 按 key 排序。详见[《03-集合与泛型》](#/f/f5)","ref":"f5"},{"id":"q236f53aa","kind":"select","cat":"集合","diff":"中","q":"`TreeMap` 的 key 必须满足什么条件？","opts":["必须实现 Comparable 或构造时传入 Comparator","必须实现 hashCode","必须是 String","必须重写 equals 即可"],"a":"A","exp":"TreeMap 靠比较排序，key 需可比较，否则 put 时抛 ClassCastException；它用比较结果代替 equals 判等。详见[《03-集合与泛型》](#/f/f5)","ref":"f5"},{"id":"q038b60cb","kind":"select","cat":"集合","diff":"中","q":"关于 `Iterator.remove()` 与 `Collection.remove()`，说法正确的是？","opts":["两者在遍历中等价","for-each 遍历时调用集合的 remove 会抛 ConcurrentModificationException（某些集合行为未定义），Iterator.remove 才是安全做法","Iterator.remove 会抛异常","只有 Map 支持 Iterator.remove"],"a":"B","exp":"for-each 底层是迭代器，直接改集合会破坏 modCount 校验；用迭代器自己的 remove，或 Java 8 的 removeIf。详见[《03-集合与泛型》](#/f/f5)","ref":"f5"},{"id":"q3ed4bed0","kind":"select","cat":"集合","diff":"难","q":"`HashMap` 中两个不同对象 hash 值相同但 equals 为 false，会怎样？","opts":["后者覆盖前者","抛异常","两者共存于同一桶，通过链表/红黑树区分，查找时先比 hash 再比 equals","只保留先插入的"],"a":"C","exp":"哈希冲突是常态，定位桶后再用 equals 精确区分；这就是「重写 equals 必须重写 hashCode」的另一面——hash 相同不代表相等。详见[《03-集合与泛型》](#/f/f5)","ref":"f5"},{"id":"qe7c80237","kind":"select","cat":"集合","diff":"难","q":"`ConcurrentHashMap`（JDK 1.8）保证线程安全的核心手段是？","opts":["全表加一把 synchronized 锁","用 Segment 分段锁","读操作也全程加锁","CAS + synchronized 锁单个桶头节点，配合 volatile 保证可见性"],"a":"D","exp":"1.8 抛弃 Segment，锁粒度细到桶（首节点），空桶用 CAS 插入，扩容支持多线程协助迁移；1.7 才是分段锁。详见[《03-集合与泛型》](#/f/f5)","ref":"f5"},{"id":"q003b6178","kind":"select","cat":"集合","diff":"难","q":"以下代码输出的顺序是？`Set<String> s = new LinkedHashSet<>(); s.add(\"b\"); s.add(\"a\"); s.add(\"c\"); s.add(\"a\");`","opts":["b, a, c","a, b, c","c, a, b","b, c, a"],"a":"A","exp":"LinkedHashSet 保持插入顺序且去重，重复的 \"a\" 不改变原位置也不追加，输出按首次插入序。详见[《03-集合与泛型》](#/f/f5)","ref":"f5"},{"id":"qc34b6d97","kind":"select","cat":"集合","diff":"难","q":"`ArrayList` 的 `subList(1, 3)` 返回的视图，对它的修改会怎样？","opts":["抛 UnsupportedOperationException","直接反映到原列表（它是视图而非副本），原列表结构变化后视图操作可能抛 ConcurrentModificationException","生成独立副本，互不影响","只能读不能写"],"a":"B","exp":"subList 是原列表的视图，改视图即改原表；这是踩坑高发区，需要副本时必须 new ArrayList<>(list.subList(...))。详见[《03-集合与泛型》](#/f/f5)","ref":"f5"},{"id":"q3d6a3aa5","kind":"select","cat":"Java8","diff":"中","q":"`Stream` 中 `map` 与 `flatMap` 的区别是？","opts":["map 可以改变流的大小，flatMap 不能","两者完全等价","map 是一对一转换，flatMap 把每个元素展开成流再合并（一对多/扁平化）","flatMap 只能处理字符串"],"a":"C","exp":"map 元素数不变（1→1），flatMap 先 map 再 flat（1→N），典型场景是 List<List<T>> 打平。详见[《05-Lambda-Stream与Java8新特性》](#/f/f7)","ref":"f7"},{"id":"q2158034c","kind":"select","cat":"Java8","diff":"中","q":"`Stream` 的 `peek` 方法在什么情况下不会执行？","opts":["永远会执行","并行流中永远不执行","只处理基本类型时","后面没有终端操作时（惰性求值，中间操作不触发）"],"a":"D","exp":"中间操作惰性，只有终端操作才会拉动整条流水线；peek 常用于调试，别拿它做副作用业务。详见[《05-Lambda-Stream与Java8新特性》](#/f/f7)","ref":"f7"},{"id":"qf6708b02","kind":"select","cat":"Java8","diff":"中","q":"关于并行流 `parallelStream()` 的默认线程池，说法正确的是？","opts":["使用公共 ForkJoinPool.commonPool()，可用 `-Djava.util.concurrent.ForkJoinPool.common.parallelism` 调大小","每次调用新建一个线程池","使用 Tomcat 线程池","使用 newCachedThreadPool"],"a":"A","exp":"并行流共享 commonPool，默认并行度是 CPU 核数-1；阻塞型任务别用并行流，会拖垮整个公共池。详见[《05-Lambda-Stream与Java8新特性》](#/f/f7)","ref":"f7"},{"id":"q2dd3f088","kind":"select","cat":"Java8","diff":"难","q":"`Collectors.groupingBy` 默认返回的 Map 是什么类型？","opts":["TreeMap","HashMap，且默认值类型是 List","LinkedHashMap","ConcurrentHashMap"],"a":"B","exp":"默认 HashMap+List；要保序用三参重载传 LinkedHashMap::new，要下游聚合传 counting()/mapping() 等。详见[《05-Lambda-Stream与Java8新特性》](#/f/f7)","ref":"f7"},{"id":"qd1efccb8","kind":"select","cat":"Java8","diff":"难","q":"以下代码输出的结果是？`Optional<String> o = Optional.of(null);`","opts":["创建成功，o.isEmpty() 为 true","编译错误","立即抛出 NullPointerException","创建成功但 get() 返回 null"],"a":"C","exp":"of 不接受 null（空值用 ofNullable），这是刻意设计——让空指针尽早暴露而非藏进 Optional；get() 前应先 isPresent 或用 orElse。详见[《05-Lambda-Stream与Java8新特性》](#/f/f7)","ref":"f7"},{"id":"q8a36a9f0","kind":"select","cat":"Java基础","diff":"易","q":"Java 中 `switch` 的 case 标签可以使用的类型不包括？","opts":["byte/short/char/int","枚举","String（Java 7+）","double"],"a":"D","exp":"switch 支持整型（含包装类）、枚举、String 与 Java 17 的模式匹配，浮点与 long 不行（long 自 Java 14 起在部分场景可用，但 double 始终不支持语法语义是明确考点）。详见[《01-环境搭建与基础语法》](#/f/f3)","ref":"f3"},{"id":"q576de4fa","kind":"select","cat":"Java基础","diff":"中","q":"`String s = \"hello\"; s.concat(\" world\"); System.out.println(s);` 输出？","opts":["hello","hello world","编译错误","hello world 但 s 已变"],"a":"A","exp":"String 不可变，concat 返回新串，返回值未接收则原引用不变；这类「忘了接返回值」是常见低级 bug。详见[《02-面向对象与核心类》](#/f/f4)","ref":"f4"},{"id":"q8c16a5f6","kind":"select","cat":"集合","diff":"中","q":"`HashMap` 的初始容量 16 与负载因子 0.75 意味着什么？","opts":["存满 16 个元素才扩容","元素数超过 16×0.75=12 时扩容为两倍","永远不扩容","初始容量是 12"],"a":"B","exp":"阈值 = 容量×负载因子，达到阈值触发 resize，容量翻倍；负载因子权衡空间与冲突，0.75 是官方折中值。详见[《03-集合与泛型》](#/f/f5)","ref":"f5"},{"id":"q78918278","kind":"select","cat":"集合","diff":"中","q":"`Collections.unmodifiableList(list)` 与 `List.of(...)` 的区别是？","opts":["两者都是不可变且都不允许 null","List.of 可以继续 add","unmodifiableList 是原列表的只读视图（原列表变了它也跟着变），List.of 是真正不可变且不允许 null","unmodifiableList 会复制一份数据"],"a":"C","exp":"只读视图仍被原表牵动，防御性场景要真不可变；List.of 拒绝 null 且结构绝对不变。详见[《03-集合与泛型》](#/f/f5)","ref":"f5"},{"id":"qc43a2bb5","kind":"select","cat":"Java基础","diff":"难","q":"泛型擦除后，`List<String>` 与 `List<Integer>` 在运行时的 getClass() 结果是？","opts":["分别是 Class<List<String>> 与 Class<List<Integer>>","一个是 List 一个是 Collection","编译错误","都是同一个 Class 对象（如 java.util.ArrayList），因为泛型在运行时被擦除"],"a":"D","exp":"泛型仅存在于编译期（类型检查与自动转换），运行时都是裸类型，这也是不能 `new T[]`、不能对泛型做 instanceof 的原因。详见[《03-集合与泛型》](#/f/f5)","ref":"f5"},{"id":"q01416eab","kind":"select","cat":"Java8","diff":"中","q":"`Predicate<T>` 的 `and`/`or`/`negate` 组合，`p.negate().and(p)` 对任意输入的结果是？","opts":["恒为 false","恒为 true","等于 p 本身","编译错误"],"a":"A","exp":"negate 取反后与原判定做逻辑与，两个条件互斥，任何输入都不可能同时成立。详见[《05-Lambda-Stream与Java8新特性》](#/f/f7)","ref":"f7"},{"id":"qbfd3480f","kind":"select","cat":"并发","diff":"易","q":"线程 t 的任务体是 `Thread.sleep(5000)`，主线程在 t 启动 300ms 后打印 `t.getState()`，结果是？","opts":["BLOCKED","WAITING","TIMED_WAITING","RUNNABLE"],"a":"C","exp":"带超时的 sleep 让线程进入 TIMED_WAITING；BLOCKED 专指等待 synchronized 锁，WAITING 是无超时的 wait/park。详见[《01-多线程与并发编程》](#/f/f9)","ref":"f9"},{"id":"qf244c845","kind":"select","cat":"并发","diff":"易","q":"两个线程分别用 `new A()` 和 `new A()` 调用同一个 `static synchronized` 方法，结果是？","opts":["可以并行执行，因为实例对象不同","只有同一个实例的调用才互斥","抛 IllegalMonitorStateException","互斥
