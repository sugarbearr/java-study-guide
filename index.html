执行，因为锁的是同一个 Class 对象"],"a":"D","exp":"静态方法没有 this，同步锁是类对应的 Class 对象，与实例无关；只有实例方法才锁 this。详见[《01-多线程与并发编程》](#/f/f9)","ref":"f9"},{"id":"q4fcf7516","kind":"select","cat":"并发","diff":"易","q":"关于守护线程，下列说法正确的是？","opts":["所有非守护线程结束后 JVM 就会退出，即使还有守护线程在运行","setDaemon(true) 可以在 start() 之后调用","守护线程的 finally 块一定会被执行","main 线程默认是守护线程"],"a":"A","exp":"守护线程不阻止 JVM 退出，被放弃时 finally 不保证执行；setDaemon 必须在 start 前调用，main 是非守护线程。详见[《01-多线程与并发编程》](#/f/f9)","ref":"f9"},{"id":"q3c0383cb","kind":"select","cat":"并发","diff":"易","q":"10 个线程各对同一变量自增 1000 次：用 `int count` 与用 `AtomicInteger`，最终结果分别是？","opts":["两者都一定是 10000","int 一定是 10000，AtomicInteger 可能小于 10000","int 通常小于 10000 且每次运行可能不同，AtomicInteger 一定是 10000","两者都可能小于 10000"],"a":"C","exp":"`count++` 是读-改-写三步，多线程下会丢更新；AtomicInteger 靠 CAS 保证单次自增原子，计数精确。详见[《01-多线程与并发编程》](#/f/f9)","ref":"f9"},{"id":"q0f1cb1f5","kind":"select","cat":"并发","diff":"易","q":"以下哪种线程池最容易因任务无界堆积而 OOM？","opts":["`new ThreadPoolExecutor(4, 8, 60, TimeUnit.SECONDS, new ArrayBlockingQueue<>(100))`","`new ThreadPoolExecutor(2, 4, 60, TimeUnit.SECONDS, new ArrayBlockingQueue<>(10))`","`new ThreadPoolExecutor(4, 8, 60, TimeUnit.SECONDS, new SynchronousQueue<>())`","`Executors.newFixedThreadPool(4)`"],"a":"D","exp":"newFixedThreadPool 用无界 LinkedBlockingQueue，队列永不溢出、任务持续堆积直到 OOM，所以规约要求手动 new ThreadPoolExecutor。详见[《01-多线程与并发编程》](#/f/f9)","ref":"f9"},{"id":"q4b5a1eeb","kind":"select","cat":"并发","diff":"中","q":"线程池 corePoolSize=2、maximumPoolSize=4、workQueue 为 ArrayBlockingQueue(2)、默认拒绝策略，连续提交 8 个一直阻塞不结束的任务，结果是？","opts":["8 个任务全部进队列排队","4 个在执行、2 个在队列、2 个被拒绝抛 RejectedExecutionException","2 个在执行、6 个在队列","2 个在执行、4 个被拒绝、2 个在队列"],"a":"B","exp":"先占满 2 个核心线程，再塞满容量 2 的队列，然后扩到 maximum 共 4 个线程，剩余 2 个走 AbortPolicy 抛异常。详见[《01-多线程与并发编程》](#/f/f9)","ref":"f9"},{"id":"q29b9a273","kind":"select","cat":"并发","diff":"中","q":"关于 ReentrantLock，下列说法错误的是？","opts":["一个 ReentrantLock 实例只能创建一个 Condition 对象","必须手动调用 unlock，通常写在 finally 中","构造时传入 true 可以得到公平锁","lockInterruptibly() 支持在等待锁时响应中断"],"a":"A","exp":"一个 ReentrantLock 可以 newCondition() 出多个 Condition 做精准唤醒，这正是它相较 wait/notify 的优势。详见[《01-多线程与并发编程》](#/f/f9)","ref":"f9"},{"id":"qcbbfd587","kind":"select","cat":"并发","diff":"中","q":"线程 A 先执行 `x = 1;`（x 为普通 int），紧接着执行 `flag = true;`（flag 为 volatile boolean）；线程 B 在 `while (!flag) {}` 之后打印 x，输出是？","opts":["一定是 0","可能是 0 也可能是 1，取决于 CPU 核数","编译不通过，volatile 不能修饰 boolean","一定是 1"],"a":"D","exp":"volatile 写 happens-before 读到该值的读，而 A 中 x=1 又先于 volatile 写，经传递性 x 的修改对 B 必然可见。详见[《01-多线程与并发编程》](#/f/f9)","ref":"f9"},{"id":"q975ec7c1","kind":"select","cat":"并发","diff":"中","q":"`CompletableFuture.supplyAsync(() -> { sb.append(\"1\"); return \"x\"; }).thenApply(s -> { sb.append(\"2\"); return s; }).thenAccept(s -> sb.append(\"3\")).join();` 返回后主线程再执行 `sb.append(\"4\")`，最终 sb 的内容是？","opts":["1234","4123","2134","无法确定，thenApply 可能与 supplyAsync 并行执行"],"a":"A","exp":"join 会阻塞到整条链执行完毕，1→2→3 按阶段先后串行完成，主线程随后才追加 4；链式阶段的依赖关系保证不了乱序。详见[《01-多线程与并发编程》](#/f/f9)","ref":"f9"},{"id":"q8ef141bb","kind":"select","cat":"并发","diff":"中","q":"`Semaphore s = new Semaphore(2);` 两个线程已各 acquire 一次且都没 release，此时第三个线程调用 `s.acquire()` 会？","opts":["立即返回，许可数变为 -1","阻塞，直到有线程 release 归还许可","抛 IllegalStateException","抢占其他线程已持有的许可"],"a":"B","exp":"许可耗尽后 acquire 会进入 AQS 队列挂起，release 时被唤醒；不想无限等待可改用带超时的 tryAcquire。详见[《01-多线程与并发编程》](#/f/f9)","ref":"f9"},{"id":"qa1b40377","kind":"select","cat":"并发","diff":"中","q":"CAS 的 ABA 问题指的是什么？常用什么方案解决？","opts":["两个线程同时 CAS 导致都失败，需要用自旋重试解决","值从 A 变成 B 又变回 A，CAS 误以为从未变过；用 AtomicStampedReference 加版本号解决","CAS 只能操作 int 类型，需要用 AtomicReference 解决","CAS 失败自旋消耗 CPU，需要改用 synchronized 解决"],"a":"B","exp":"ABA 的坑在于中间状态被抹平；AtomicStampedReference 用版本戳识别「变过又变回来」。自旋开销是 CAS 的另一个独立问题。详见[《01-多线程与并发编程》](#/f/f9)","ref":"f9"},{"id":"q8214425e","kind":"select","cat":"并发","diff":"中","q":"JDK 1.8 的 ConcurrentHashMap 执行 put 时，对空桶与非空桶分别采用？","opts":["都用 synchronized 锁住对应的 Segment 段","空桶用 CAS 插入，非空桶用 synchronized 锁住桶的头节点","空桶用 synchronized，非空桶用 CAS","全程用 ReentrantLock 锁住整个 table"],"a":"B","exp":"1.8 抛弃 Segment 分段锁，桶为空时 CAS 无锁写入，发生冲突才 synchronized 锁单个桶头，锁粒度比 1.7 更细。详见[《01-多线程与并发编程》](#/f/f9)","ref":"f9"},{"id":"q184d3c7b","kind":"select","cat":"并发","diff":"中","q":"关于 CopyOnWriteArrayList，下列说法错误的是？","opts":["每次写操作都复制一份新数组，写开销较大","迭代器基于快照，遍历时不会抛 ConcurrentModificationException","适合读多写少的场景，如监听器列表","迭代过程中能立刻读到其他线程刚写入的新元素"],"a":"D","exp":"读写分离带来弱一致性，迭代器拿到的是创建时的旧数组快照，看不到之后的写入，这正是它写少读多才划算的原因。详见[《01-多线程与并发编程》](#/f/f9)","ref":"f9"},{"id":"q2903807c","kind":"select","cat":"并发","diff":"中","q":"线程池中某任务往 ThreadLocal 里 set 了值却没有 remove，同一线程执行的下一个任务调用 get() 会得到？","opts":["上一个任务残留的值","null，因为线程复用时 JVM 会重置 ThreadLocalMap","抛 IllegalStateException","取决于任务是用 submit 还是 execute 提交"],"a":"A","exp":"ThreadLocalMap 挂在线程对象上并随线程复用，不会自动清空，这是线程池场景必须在 finally 中 remove 的原因。详见[《01-多线程与并发编程》](#/f/f9)","ref":"f9"},{"id":"qaaa87123","kind":"select","cat":"并发","diff":"中","q":"预防死锁最常用的手段是？","opts":["加大线程池的线程数","用 volatile 修饰锁对象","把多把锁合并成一把大锁并延长持锁时间","让所有线程按相同的全局顺序获取锁"],"a":"D","exp":"死锁四条件中最容易破坏的是「循环等待」，统一加锁顺序即可；tryLock 带超时也是常用兜底。加大线程数只会提高发生概率。详见[《01-多线程与并发编程》](#/f/f9)","ref":"f9"},{"id":"q659eded0","kind":"select","cat":"并发","diff":"中","q":"线程池 `shutdownNow()` 的返回值是？","opts":["队列中尚未开始执行的任务列表","void，没有返回值","已经执行完成的任务数","表示线程池是否成功终止的布尔值"],"a":"A","exp":"shutdownNow 会尝试中断执行中的任务并返回未执行的任务列表以便补偿处理；温和关闭等任务跑完的是 shutdown。详见[《01-多线程与并发编程》](#/f/f9)","ref":"f9"},{"id":"q725e6f38","kind":"select","cat":"并发","diff":"难","q":"AQS 共享模式中，子类实现的 `tryAcquireShared` 返回值语义是？","opts":["负值表示获取成功，0 表示失败，正值表示重入次数","负值表示获取失败需要排队，0 表示获取成功但后继线程无法再获取，正值表示获取成功且后继也可能成功","只需区分是否为 0，其余取值没有意义","返回值就是当前 state 的值，仅供调试打印"],"a":"B","exp":"共享模式下返回值同时承担「告知后继节点能否继续获取」的职责，CountDownLatch 计数归零时返回正数唤醒整条队列。详见[《01-多线程与并发编程》](#/f/f9)","ref":"f9"},{"id":"q68c4b704","kind":"select","cat":"并发","diff":"难","q":"关于 synchronized 的偏向锁撤销，下列说法正确的是？","opts":["只要出现第二个线程竞争，就会立即膨胀为重量级锁","偏向锁一旦被撤销，该对象就永远无法再被偏向","撤销偏向需要在全局安全点进行，批量重偏向与批量撤销正是为降低这笔开销引入的优化","偏向锁无法通过 JVM 参数关闭"],"a":"C","exp":"撤销要先等 STW 安全点，代价高，于是有了批量重偏向/撤销；竞争时先升级为轻量级锁而非直接重量级。详见[《01-多线程与并发编程》](#/f/f9)","ref":"f9"},{"id":"q8e985c85","kind":"select","cat":"并发","diff":"难","q":"CMS 并发标记阶段使用的增量更新（incremental update）写屏障，记录的是？","opts":["被删除的旧引用，即所谓原始快照","所有新创建出来的对象，防止它们被漏标","新插入的引用，并把新增该引用的黑色对象重新变灰，避免存活对象被漏标","跨代引用的卡表条目"],"a":"C","exp":"增量更新破坏「黑色对象新增指向白色对象的引用」这一漏标条件，屏障记录新引用、把该黑对象重新变灰待扫；记录被删除的旧引用则是 G1 的 SATB 思路。详见[《02-JVM核心》](#/f/f10)","ref":"f10"},{"id":"qd6ba83f9","kind":"select","cat":"并发","diff":"难","q":"ThreadLocalMap 的 key 已经是弱引用，为什么仍会内存泄漏、还必须手动 remove()？","opts":["弱引用在 Java 中对 GC 没有实际作用，key 永远不会被回收","ThreadLocalMap 是定长数组，槽位迟早会被写满","key 是弱引用但 value 是强引用，key 被回收后 Entry 变成 key=null 而 value 仍被线程强引用，且 get/set 只顺带清理命中的少数槽位","弱引用只在 Full GC 时才会被回收，平时等价于强引用"],"a":"C","exp":"弱引用只解决了 key 的回收，value 仍被长期存活的线程池线程强引用；探测式清理只覆盖命中的槽位，所以必须 remove。详见[《01-多线程与并发编程》](#/f/f9)","ref":"f9"},{"id":"q4fb521cc","kind":"select","cat":"并发","diff":"难","q":"ConcurrentHashMap 用 baseCount + CounterCell[] 而不是单个 AtomicLong 来统计 size，主要目的是？","opts":["让 size() 的返回值具有强一致性","把不同线程的计数分散到不同槽位，减少单点 CAS 自旋与缓存行伪共享带来的冲突","支持扩容时的多线程协助迁移","让 size() 的时间复杂度降为 O(1)"],"a":"B","exp":"这与 LongAdder 的分段累加同源，热点计数被打散到多个 Cell 上；size() 仍是遍历求和，只保证弱一致。详见[《01-多线程与并发编程》](#/f/f9)","ref":"f9"},{"id":"qe6a4bffc","kind":"select","cat":"JVM","diff":"易","q":"对象头中的 Mark Word 不包含以下哪项信息？","opts":["对象的实例字段值","对象的哈希码","GC 分代年龄","锁状态标志位"],"a":"A","exp":"Mark Word 存放哈希码、分代年龄、锁标志等运行时数据，实例字段值属于实例数据区。详见[《02-JVM核心》](#/f/f10)","ref":"f10"},{"id":"qe117dc95","kind":"select","cat":"网络","diff":"易","q":"下列场景中最适合使用 UDP 的是？","opts":["下载一份必须完整无损的安装包","实时视频会议的音视频流传输","数据库客户端与数据库服务器之间的通信","通过 HTTP 浏览网页"],"a":"B","exp":"UDP 无连接、开销小、可容忍少量丢包，适合实时音视频；其余场景都要求可靠有序，应当用 TCP。详见[《03-IO模型与网络编程》](#/f/f11)","ref":"f11"},{"id":"qe1034fda","kind":"select","cat":"操作系统","diff":"易","q":"下列进程间通信方式中，数据无需在用户态与内核态之间反复拷贝、速度最快的是？","opts":["匿名管道","消息队列","共享内存","信号（signal）"],"a":"C","exp":"共享内存把同一块物理页映射进两个进程的地址空间，读写不再经过内核拷贝，代价是要自行用信号量同步。详见[《03-IO模型与网络编程》](#/f/f11)","ref":"f11"},{"id":"qbc5e3b08","kind":"select","cat":"JVM","diff":"难","q":"同一个 .class 文件被两个不同的类加载器分别加载，下列说法正确的是？","opts":["得到同一个 Class 对象，两个加载器共享该类的静态变量","得到两个 Class 对象，但两者之间可以正常互相赋值","得到两个 Class 对象，但 instanceof 判断依然为 true","得到两个互不兼容的 Class 对象，互相赋值会抛 ClassCastException"],"a":"D","exp":"类加载器构成命名空间，同一个 class 被不同加载器加载会得到两个独立 Class，instanceof 为 false，转型直接抛异常。详见[《02-JVM核心》](#/f/f10)","ref":"f10"},{"id":"qcb6d7032","kind":"select","cat":"网络","diff":"中","q":"TCP 主动关闭方在发完最后一个 ACK 后进入 TIME_WAIT 并等待 2MSL，主要目的是？","opts":["确保这个 ACK 丢失时对端重传的 FIN 能被响应，并让本次连接的旧报文在网络中消亡","等待对端把尚未发完的剩余数据发送完毕","等待操作系统回收本地端口号资源","防止对端重发 SYN 重新建立连接"],"a":"A","exp":"2MSL 保证最后 ACK 丢失时可重发，同时让迟到报文过期，避免串到之后复用相同四元组的新连接上。详见[《03-IO模型与网络编程》](#/f/f11)","ref":"f11"},{"id":"qfc2101bd","kind":"select","cat":"操作系统","diff":"易","q":"关于僵尸进程，下列说法正确的是？","opts":["父进程先于子进程退出，子进程被 init 收养，因此称为僵尸进程","子进程已退出但父进程尚未调用 wait/waitpid 回收其退出状态，进程表项仍被占用","僵尸进程会持续占用 CPU 空转，只能靠 kill -9 清除","僵尸进程占用大量物理内存，是内存泄漏的主要来源"],"a":"B","exp":"退出状态未被父进程回收，进程表项残留；它不占 CPU 与内存，kill -9 也无效，需父进程 wait。A 描述的是孤儿进程。详见[《03-IO模型与网络编程》](#/f/f11)","ref":"f11"},{"id":"qd49ee9bb","kind":"select","cat":"JVM","diff":"中","q":"类加载的准备阶段，对 `static int a = 1; static final int B = 2;` 这两个字段的处理是？","opts":["a 与 B 都只赋零值，到初始化阶段才分别变成 1 和 2","a 直接赋为 1，B 先赋零值，到初始化阶段再赋为 2","a 赋零值（初始化阶段才变成 1），B 在准备阶段即被赋为 2","a 与 B 都在准备阶段直接赋为最终值"],"a":"C","exp":"普通静态变量在准备阶段只赋零值；被 static final 修饰的编译期常量带 ConstantValue 属性，准备阶段就完成赋值。详见[《02-JVM核心》](#/f/f10)","ref":"f10"},{"id":"qca4bcd91","kind":"select","cat":"网络","diff":"中","q":"关于 epoll 的水平触发（LT）与边缘触发（ET），下列说法正确的是？","opts":["LT 只在状态变化时通知一次，ET 则只要还有数据就反复通知","两者行为完全一致，只是 ET 的性能更好","ET 模式只能用于监听套接字，不能用于已建立连接的套接字","LT 只要缓冲区还有未读完的数据就持续通知，ET 仅在状态变化时通知一次，因此 ET 必须一次读完"],"a":"D","exp":"LT 反复提醒直到处理干净、编程简单；ET 只报一次状态变化，必须循环读到 EAGAIN，否则剩余数据不再通知。详见[《03-IO模型与网络编程》](#/f/f11)","ref":"f11"},{"id":"q2a369b88","kind":"select","cat":"操作系统","diff":"中","q":"进程切换的开销明显大于线程切换，主要原因是？","opts":["进程切换要更换页表、切换虚拟地址空间，导致 TLB 与缓存大面积失效","进程切换必须销毁并重建内核栈","进程切换会触发一次垃圾回收","进程切换一定伴随磁盘 I/O"],"a":"A","exp":"同进程内的线程共享地址空间，切换只需换栈与寄存器；进程切换还要换页表，TLB 失效后访存代价显著上升。详见[《03-IO模型与网络编程》](#/f/f11)","ref":"f11"},{"id":"qa1839363","kind":"select","cat":"JVM","diff":"中","q":"关于 TLAB（Thread Local Allocation Buffer），下列说法正确的是？","opts":["它位于老年代，专门用于分配大对象","它是每个线程在 Eden 中预先划出的一小块私有区域，避免多线程分配对象时争抢同一个指针","它位于元空间，用于缓存类元数据","它的作用是缓存字符串常量，减少重复创建"],"a":"B","exp":"TLAB 是 Eden 内线程私有的分配缓冲，分配在本地指针上完成，用完再申请新的，避免指针碰撞的并发竞争。详见[《02-JVM核心》](#/f/f10)","ref":"f10"},{"id":"q2897aaac","kind":"select","cat":"网络","diff":"易","q":"HTTP 响应的 502 与 504 状态码分别表示？","opts":["502 请求参数错误，504 未认证","502 服务器内部错误，504 资源不存在","502 网关收到了上游服务器的无效响应，504 网关等待上游响应超时","502 服务不可用，504 重定向次数过多"],"a":"C","exp":"5xx 属服务端错误：502 Bad Gateway 是上游返回了无效响应，504 是网关等上游超时，两者常见于 Nginx 反代场景。详见[《03-IO模型与网络编程》](#/f/f11)","ref":"f11"},{"id":"q6c19fac1","kind":"select","cat":"操作系统","diff":"中","q":"关于虚拟内存与缺页中断，下列说法正确的是？","opts":["缺页中断说明程序有 bug，正常程序运行中不应出现","虚拟内存让所有进程共享同一份地址空间，便于互相访问数据","虚拟内存的总大小不能超过物理内存大小","访问的页不在物理内存时触发缺页中断，由内核调入该页后重新执行刚才那条指令"],"a":"D","exp":"缺页是按需调页的正常机制而非错误，它支撑了内存超售与进程隔离，代价是一次访问可能多花上百微秒。详见[《03-IO模型与网络编程》](#/f/f11)","ref":"f11"},{"id":"qca4d34b0","kind":"select","cat":"JVM","diff":"中","q":"关于类初始化的触发时机，下列说法正确的是？","opts":["访问被 static final 修饰且编译期可确定值的常量，不会触发该类的初始化","通过子类引用父类的静态字段时，子类也会被初始化","执行 `new Foo[10]` 定义数组会触发 Foo 类的初始化","只要调用了 ClassLoader.loadClass()，类就完成了初始化"],"a":"A","exp":"编译期常量在准备阶段已进常量池，读取不触发初始化；数组定义、父类静态字段、loadClass 都只到加载与链接阶段。详见[《02-JVM核心》](#/f/f10)","ref":"f10"},{"id":"q11daca61","kind":"select","cat":"网络","diff":"难","q":"线上服务执行 `ss -ant` 后显示大量连接停留在 CLOSE_WAIT，下列判断最准确的是？","opts":["说明本机是主动关闭方，应开启 tcp_tw_reuse 缓解","对端已发来 FIN 且本端内核已确认，但应用程序迟迟没调用 close()，通常是连接或流未关闭的代码缺陷","说明本机端口即将耗尽，应调大本地端口范围","这是网络拥塞造成的，应调大拥塞窗口"],"a":"B","exp":"CLOSE_WAIT 是\"收到对方 FIN、本端尚未 close\"的等待态，堆积即代码没关连接；主动关闭方的残留态是 TIME_WAIT。详见[《03-IO模型与网络编程》](#/f/f11)","ref":"f11"},{"id":"q9f2fe255","kind":"select","cat":"操作系统","diff":"中","q":"要求所有线程都按资源编号从小到大的顺序申请锁，这一做法破坏了死锁四个必要条件中的？","opts":["互斥条件","请求与保持条件","循环等待条件","不可剥夺条件"],"a":"C","exp":"全局统一的加锁顺序使环路无法形成，破坏的是循环等待；一次性申请全部资源破坏的才是请求与保持。详见[《03-IO模型与网络编程》](#/f/f11)","ref":"f11"},{"id":"qce783042","kind":"select","cat":"JVM","diff":"难","q":"G1 的 SATB（原始快照）与 CMS 的增量更新在并发标记中的区别是？","opts":["SATB 记录新建立的引用，增量更新记录被删除的引用","两者都只记录新建立的引用，区别仅在于记录所用的数据结构不同","SATB 用于标记新生代，增量更新用于标记老年代","SATB 在引用被删除前记录旧引用，增量更新在引用被赋值后记录新引用"],"a":"D","exp":"SATB 靠写前屏障保留删除前的旧值，维持标记开始时的对象图快照；增量更新靠写后屏障记录新引用，重新标记时再扫描。详见[《02-JVM核心》](#/f/f10)","ref":"f10"},{"id":"q01f48bc1","kind":"select","cat":"网络","diff":"难","q":"Charles、Fiddler 这类抓包工具能解密 HTTPS 流量，其前提是？","opts":["客户端信任了工具自签发的根证书，工具分别与客户端、服务端建立两条独立的 TLS 连接","工具拿到了服务端证书对应的私钥","工具与客户端恰好使用了相同的会话密钥","只要与客户端处于同一局域网内，即可自动解密"],"a":"A","exp":"中间人分别与客户端和服务端各建一条 TLS 连接，用自签根证书骗客户端信任；证书校验一旦被绕过，流量即为明文。详见[《03-IO模型与网络编程》](#/f/f11)","ref":"f11"},{"id":"q632fd9d7","kind":"select","cat":"操作系统","diff":"难","q":"某单线程计算任务在单核上耗时 100 秒；改成 4 个无共享数据的线程在 4 核上运行后实测 28 秒（理论 25 秒），多出来的时间最主要来自？","opts":["线程创建与销毁的系统调用开销","线程调度与上下文切换、多核间缓存一致性（缓存行失效、伪共享）带来的额外开销","磁盘 I/O 等待","JVM 的类加载过程"],"a":"B","exp":"创建销毁是一次性成本，主要损耗在切换与跨核缓存同步；这也解释了多线程加速比为何总达不到线性。详见[《03-IO模型与网络编程》](#/f/f11)","ref":"f11"},{"id":"q7b9aed88","kind":"select","cat":"JVM","diff":"难","q":"关于 Minor GC 前的空间分配担保，下列说法正确的是？","opts":["只要老年代剩余空间小于新生代对象总大小，就一定先触发一次 Full GC","分配担保指把新创建的对象直接分配到老年代","JDK 6 Update 24 之后，只要老年代最大可用连续空间大于新生代对象总大小或历次晋升平均大小，就允许先尝试 Minor GC，否则才 Full GC","分配担保只在 Serial 收集器上生效，G1 已取消该机制"],"a":"C","exp":"担保是 Minor GC 前的安全检查，防的是晋升对象无处安放；HandlePromotionFailure 参数在该版本之后已不再生效。详见[《02-JVM核心》](#/f/f10)","ref":"f10"},{"id":"qbfdf8c53","kind":"select","cat":"网络","diff":"中","q":"压测客户端使用短连接，观测到 TIME_WAIT 数量暴涨并触发本地端口告警，最直接有效的组合措施是？","opts":["调大 net.ipv4.tcp_max_syn_backlog","调大 net.ipv4.tcp_fin_timeout，延长等待时间","关闭 net.ipv4.tcp_syncookies","开启 net.ipv4.tcp_tw_reuse，并改用连接池复用长连接"],"a":"D","exp":"TIME_WAIT 落在主动关闭方，短连接使它不断堆积；长连接从源头减少连接数，tcp_tw_reuse 让出站连接可复用 TIME_WAIT 端口。详见[《03-IO模型与网络编程》](#/f/f11)","ref":"f11"},{"id":"q1b17bbce","kind":"select","cat":"操作系统","diff":"难","q":"`top` 中某个 Java 进程的 CPU 占用显示为 380%，最合理的解释是？","opts":["top 以单核为 100% 累加，380% 表示该进程的多个线程同时在约 4 个核上运行","数据显示异常，单进程不可能超过 100%","该进程陷入了内核态忙等待","该进程正在进行频繁的 Full GC"],"a":"A","exp":"Linux 的进程 CPU 占用是多核累加值，超过 100% 属正常；要进一步定位可 top -Hp 看线程级占用再对照 jstack。详见[《02-JVM核心》](#/f/f10)","ref":"f10"},{"id":"q78a2768b","kind":"select","cat":"JVM","diff":"难","q":"把 G1 的 `-XX:MaxGCPauseMillis` 从 200 调到 50 后，停顿确实变短，但吞吐量明显下降，最合理的解释是？","opts":["停顿目标会让 G1 在压力下改用 Serial 收集器兜底","停顿目标越小，单次可回收的 Region 越少，GC 次数变多，GC 总开销上升","调小该参数会禁用并发标记线程","调小该参数会强制每次 Young GC 都回收老年代"],"a":"B","exp":"G1 依据停顿目标挑选回收的 Region 数量，目标越激进每次回收越少、频率越高；停顿与吞吐本就需要权衡。详见[《02-JVM核心》](#/f/f10)","ref":"f10"},{"id":"q7e6af9e7","kind":"select","cat":"网络","diff":"中","q":"TCP 慢启动阶段，拥塞窗口 cwnd 的变化方式是？","opts":["每个 RTT 增加 1 个报文段，直到发生超时","由接收方通告的接收窗口 rwnd 决定，与网络状况无关","每个 RTT 翻倍（指数增长），达到慢启动阈值 ssthresh 后转为拥塞避免的线性增长","始终保持初始值不变，直到发生丢包才调整"],"a":"C","exp":"慢启动从 1 个 MSS 起指数扩张，到 ssthresh 转线性；丢包后将 ssthresh 减半，再进入快速重传与快速恢复。详见[《03-IO模型与网络编程》](#/f/f11)","ref":"f11"},{"id":"q8462ccab","kind":"select","cat":"JVM","diff":"中","q":"`jstat -gcutil <pid> 1000` 显示老年代使用率长期高于 98%、Full GC 次数不断上涨，但每次回收后使用率几乎不下降。最可能的原因是？","opts":["新生代太小，对象过早晋升到老年代","SurvivorRatio 设置不合理，Survivor 区过小","元空间不足导致频繁触发 Full GC","存在内存泄漏，大量对象仍被引用而无法回收"],"a":"D","exp":"回收后占用不降说明对象依然可达，是典型泄漏特征；应导出堆快照用 MAT 找 Retained Size 最大的对象链。详见[《02-JVM核心》](#/f/f10)","ref":"f10"},{"id":"q509466da","kind":"select","cat":"JVM","diff":"中","q":"用 `-Xmx512m -XX:MaxMetaspaceSize=16m` 启动的程序，循环用 CGLIB 动态生成类并把 Class 对象存入静态集合，最可能先抛出的是？","opts":["java.lang.OutOfMemoryError: Metaspace","java.lang.OutOfMemoryError: Java heap space","java.lang.StackOverflowError","java.lang.OutOfMemoryError: Direct buffer memory"],"a":"A","exp":"类元数据存放在元空间，静态集合又阻止了 Class 卸载，16m 的元空间上限最先被击穿，报错信息即为 Metaspace。详见[《02-JVM核心》](#/f/f10)","ref":"f10"},{"id":"q5f6ce3b7","kind":"select","cat":"MySQL","diff":"易","q":"InnoDB 的 B+ 树把完整行数据只放在叶子节点，这样做最直接的好处是？","opts":["单个数据页能容纳更多键值，树更矮，定位一行所需的磁盘 IO 更少","索引不再需要维护键值的排序","范围查询不必再走叶子链表，在非叶子层就能扫完整个区间","二级索引因此不必再存储主键值"],"a":"A","exp":"非叶子只存键与页指针，一页可放上千项，三层即可覆盖千万级数据；叶子间的双向链表才是范围查询快的另一原因。详见[《索引-事务-锁与调优》](#/f/f14)","ref":"f14"},{"id":"q362d8e37","kind":"select","cat":"MySQL","diff":"易","q":"建表时，金额、成绩这类要求精确的小数字段应优先选用哪种类型？","opts":["FLOAT","DOUBLE","DECIMAL","VARCHAR"],"a":"C","exp":"FLOAT/DOUBLE 是二进制浮点，累加与比较会出现精度丢失；DECIMAL 按十进制精确存储，是金额与成绩的标准选择。详见[《MySQL基础与SQL实战》](#/f/f13)","ref":"f13"},{"id":"q39d013df","kind":"select","cat":"MySQL","diff":"易","q":"关于 DATETIME 与 TIMESTAMP，下列说法正确的是？","opts":["两者都会随服务器时区的变化而改变存储的数值","TIMESTAMP 占 4 字节、存取时做时区转换，最大只能表示到 2038 年","DATETIME 占 4 字节，取值范围可到 9999 年","TIMESTAMP 与时区无关，DATETIME 反而受时区影响"],"a":"B","exp":"DATETIME 占 8 字节、与时区无关、范围到 9999 年；需要跟随客户端时区变化的全球化场景才考虑 TIMESTAMP。详见[《MySQL基础与SQL实战》](#/f/f13)","ref":"f13"},{"id":"qe2bf85cd","kind":"select","cat":"MySQL","diff":"易","q":"关于 COUNT(*)、COUNT(1)、COUNT(name)，说法正确的是？","opts":["三者完全等价，结果与性能都一样","COUNT(1) 只统计值为 1 的行，因此语义与 COUNT(*) 不同","COUNT(*) 会跳过 name 为 NULL 的行，另外两个不会","InnoDB 下 COUNT(*) 与 COUNT(1) 等价且官方有优化；COUNT(name) 不统计 name 为 NULL 的行"],"a":"D","exp":"数字 1 只是占位，COUNT(1) 与 COUNT(*) 一样统计所有行；COUNT(列) 的语义才是\"该列非 NULL 的行数\"。COUNT(主键) 也并不更快。详见[《MySQL基础与SQL实战》](#/f/f13)","ref":"f13"},{"id":"q29fa463d","kind":"select","cat":"MySQL","diff":"易","q":"关于 DROP TABLE、DELETE FROM t、TRUNCATE TABLE，说法正确的是？","opts":["三者都在事务中可回滚","TRUNCATE 属 DDL，清空整表并重置自增，不可回滚","DELETE 不带 WHERE 时会自动重置自增","DROP 只删数据、保留表结构"],"a":"B","exp":"DELETE 是 DML，逐行删、可带 WHERE、事务内可回滚、不重置自增；DROP 连表带结构一起删，最彻底。详见[《MySQL基础与SQL实战》](#/f/f13)","ref":"f13"},{"id":"qb0902fa1","kind":"select","cat":"MySQL","diff":"易","q":"库存表 `stock(id BIGINT PRIMARY KEY, num INT NOT NULL)` 中 id=1 的 num 为 1。\"先 SELECT 查出来再判断再 UPDATE\"在并发下会超卖，更稳妥的写法是？","opts":["把隔离级别升到 SERIALIZABLE 就一定不会超卖","先 `SELECT num FROM stock WHERE id = 1;`，应用层判断 num > 0 之后再 `UPDATE stock SET num = 1 WHERE id = 1;`","用 `UPDATE stock SET num = num - 1 WHERE id = 1 AND num > 0;`，靠影响行数判断是否扣减成功","把 num 声明成 `INT NOT NULL` 并给它加唯一索引"],"a":"C","exp":"把判断与扣减合并成一条原子语句，由数据库保证原子性；影响行数为 0 即库存不足，回到应用层按失败处理。乐观锁版本号写法同理。详见[《索引-事务-锁与调优》](#/f/f14)","ref":"f14"},{"id":"q29393f18","kind":"select","cat":"MySQL","diff":"中","q":"表结构如下，执行 `SELECT name FROM big_user WHERE name = 'user_999999';` 的执行计划最可能是什么？","opts":["type=ref，key=idx_name，Extra 含 Using index","type=ALL，key=NULL","type=range，key=PRIMARY，Extra 含 Using filesort","type=index，key=idx_name，Extra 含 Using temporary"],"a":"A","exp":"等值条件命中 idx_name，且查询列 name 本身就在索引里，构成覆盖索引；二级索引自带主键，故 Extra 会显示 Using index。详见[《索引-事务-锁与调优》](#/f/f14)","ref":"f14"},{"id":"q2e84b394","kind":"select","cat":"MySQL","diff":"中","q":"同样是 `SELECT * FROM big_user WHERE name = 'user_999999';`（表与索引同上一题），与上一题的写法相比，代价变大的主要原因是？","opts":["二者没有实质差异，`*` 只是书写习惯","`*` 会让 idx_name 直接失效，必然退化成全表扫描","`*` 会让结果集自动去重，多出一次排序开销","需要的列不在 idx_name 中，每行都要回表取整行，代价高于覆盖索引"],"a":"D","exp":"二级索引只带主键，回表是随机 IO；当命中行数占比过高时，优化器甚至可能直接放弃索引改为全表扫描。详见[《索引-事务-锁与调优》](#/f/f14)","ref":"f14"},{"id":"qffef3347","kind":"select","cat":"MySQL","diff":"中","q":"已有联合索引 `idx_city_age_created (city, age, created_at)`，下列哪条 SQL 能把该索引用得最充分？","opts":["`SELECT * FROM t WHERE age = 20 ORDER BY created_at;`","`SELECT * FROM t WHERE city = '北京' AND created_at > '2026-01-01';`","`SELECT * FROM t WHERE city = '北京' AND age = 20 ORDER BY created_at;`","`SELECT * FROM t WHERE city = '北京' ORDER BY created_at;`"],"a":"C","exp":"C 三列连续命中，且索引顺序天然满足 ORDER BY，不产生 filesort；A 缺最左列，B 与 D 都跳过了 age，created_at 用不上。详见[《索引-事务-锁与调优》](#/f/f14)","ref":"f14"},{"id":"qa672b8e6","kind":"select","cat":"MySQL","diff":"中","q":"查询 `SELECT * FROM t WHERE city = '北京' AND age = 20 ORDER BY created_at;` 已建有 `idx_city_age (city, age)`，explain 的 Extra 出现 Using filesort。最有效的改法是？","opts":["把 created_at 追加到联合索引末尾，改建成 (city, age, created_at)","给 created_at 单独建一个索引","把 ORDER BY 改成 ORDER BY id","调大 sort_buffer_size 参数"],"a":"A","exp":"排序列紧跟在等值列之后，索引自身的顺序即满足 ORDER BY，filesort 随之消失；单列索引与本次排序无关。详见[《索引-事务-锁与调优》](#/f/f14)","ref":"f14"},{"id":"q7ee6910a","kind":"select","cat":"MySQL","diff":"中","q":"联合索引 `idx_a_b (a, b)`，SQL 为 `SELECT * FROM t WHERE a > 10 AND b = 5;`，b 列的情况是？","opts":["b 仍能参与索引定位，等同于一次等值匹配","a 走了范围查询，b 无法再用于定位，只能靠索引下推在回表前过滤","整条 SQL 用不上该索引，只能全表扫描","优化器会自动把索引顺序改写成 (b, a) 后再使用"],"a":"B","exp":"最左列遇到范围查询后，其后的列失去定位能力；MySQL 5.6+ 的索引下推能把 b=5 下推到引擎层过滤，减少回表次数。详见[《索引-事务-锁与调优》](#/f/f14)","ref":"f14"},{"id":"qe353c8d0","kind":"select","cat":"MySQL","diff":"中","q":"name 为 VARCHAR(20) 且有索引 idx_name，SQL `SELECT * FROM t WHERE name = 13800000000;` 的执行结果是？","opts":["走 idx_name，type=ref，性能正常","报语法错误，字符串列不能与数字比较","走索引，但结果会漏掉部分行","不走索引，字符串列与数字比较会触发隐式类型转换，相当于对索引列做了运算"],"a":"D","exp":"此时 MySQL 会把列值转成数字再比较，索引的有序性被破坏；正确写法是加引号传字符串，让两边类型一致。详见[《索引-事务-锁与调优》](#/f/f14)","ref":"f14"},{"id":"q77b11cf3","kind":"select","cat":"MySQL","diff":"中","q":"表与数据如下，执行后面的 SQL，结果是？","opts":["2 行：(1, 3, 255.5) 与 (2, 1, 74.0)","1 行：(1, 3, 255.5)","1 行：(1, 3, 78.0)","报错，HAVING 不能引用 SELECT 中定义的别名 cnt"],"a":"B","exp":"HAVING 执行在 SELECT 之后，可以引用 cnt、total 这类别名；学生 2 只有 1 条记录被滤掉，没有记录的学生也不会出现在结果里。详见[《MySQL基础与SQL实战》](#/f/f13)","ref":"f13"},{"id":"qb823d796","kind":"select","cat":"MySQL","diff":"中","q":"两阶段提交中，redo log、binlog 的写入先后顺序是？","opts":["redo log prepare → 写 binlog → redo log commit","写 binlog → redo log prepare → redo log commit","redo log commit → 写 binlog → 写 undo log","写 undo log → 写 binlog → redo log prepare"],"a":"A","exp":"redo 先置 prepare、再写 binlog、最后置 commit；崩溃恢复时用 XID 去 binlog 中比对，据此决定提交还是回滚。详见[《索引-事务-锁与调优》](#/f/f14)","ref":"f14"},{"id":"qa7d06e06","kind":"select","cat":"MySQL","diff":"中","q":"关于插入意向锁（Insert Intention Lock），下列说法正确的是？","opts":["它是表级锁，插入之前会先锁住整张表","它本身就是间隙锁的一种，两个插入意向锁之间也互斥","它是插入前设置的意向标记；间隙锁彼此不冲突，但它与范围内已存在的间隙锁冲突","它只在 RC 隔离级别下才会产生"],"a":"C","exp":"多个事务可同时持有同一间隙的间隙锁，一旦有人真要插入，插入意向锁便与这些间隙锁冲突而被阻塞——并发插入死锁的常见来源。详见[《索引-事务-锁与调优》](#/f/f14)","ref":"f14"},{"id":"qb6de50c6","kind":"select","cat":"MySQL","diff":"中","q":"RR 隔离级别下，两个会话按下列顺序执行（v 初值为 0），最终 t 表中 id=1 的 v 值是？","opts":["1","0","报死锁错误，事务 A 被整体回滚","2"],"a":"D","exp":"A 的 SELECT 是快照读不阻塞 B；A 随后的 UPDATE 是当前读，会读到 B 已提交的最新值 1，再按自己的语义写为 2。详见[《索引-事务-锁与调优》](#/f/f14)","ref":"f14"},{"id":"q5eabed1c","kind":"select","cat":"MySQL","diff":"中","q":"订单表预计增长到 5 亿行，准备按 user_id 做水平分表。直接带来的后果是？","opts":["表结构必须改成 MyISAM 才能分片","主键不能再自增，必须改成无序 UUID","分片键选了 user_id，按 order_id 查询无法直接定位分片，需要额外的路由或映射方案","事务隔离级别必须降到 RC"],"a":"C","exp":"按订单号查落不到确定分片，只能广播查询或再维护一张 order_id 到 user_id 的映射；分片后的全局唯一 ID 通常用雪花算法生成。详见[《02-数据库与中间件面试速查》](#/f/f33)","ref":"f33"},{"id":"q991afc65","kind":"select","cat":"MySQL","diff":"难","q":"事务在执行过程中尚未 COMMIT 时 MySQL 崩溃，重启后的处理是？","opts":["扫描 redo log 中处于 prepare 状态的记录，用其中的 XID 去 binlog 比对：能找到就提交，找不到就回滚","一律回滚，因为事务没有走到 commit 阶段","一律提交，因为 redo log 已经持久化到磁盘","由 undo log 的版本链自行决定，与 binlog 无关"],"a":"A","exp":"binlog 写成功才是事务提交成功的标志；用 XID 回查 binlog，正是两阶段提交保证两份日志一致、进而保证主从一致的关键。详见[《索引-事务-锁与调优》](#/f/f14)","ref":"f14"},{"id":"q3a33281a","kind":"select","cat":"MySQL","diff":"难","q":"主库执行 `UPDATE account SET balance = balance - 100 WHERE id = 1;`，redo log 已写入并处于 prepare，写 binlog 之前主库宕机且数据无法恢复。此时从库的情况是？","opts":["从库的余额已经扣减 100，需要人工补偿","从库没有这条变更，余额不变，与回滚后的主库保持一致","从库会自动把这条事务补写进自己的 binlog","从库进入只读模式，等待主库恢复后重新同步"],"a":"B","exp":"binlog 没写成功，恢复时该事务回滚；从库只重放 binlog，自然也没有这条变更，两边同为\"未扣款\"。详见[《索引-事务-锁与调优》](#/f/f14)","ref":"f14"},{"id":"qe1a08cc3","kind":"select","cat":"MySQL","diff":"难","q":"表 `t(id BIGINT PRIMARY KEY, a INT, b INT)` 上有 `KEY idx_a (a)`，索引中 a 的值依次为 1、5、10、15。会话 A 执行：","opts":["`UPDATE t SET b = 1 WHERE a = 10;`","`INSERT INTO t (id, a, b) VALUES (99, 8, 1);`","`SELECT * FROM t WHERE a = 10 FOR UPDATE;`","`SELECT b FROM t WHERE a = 10;`"],"a":"D","exp":"非唯一索引等值加锁会覆盖记录 10 及 (5,10]、(10,15] 等区间，A、C 撞上被锁记录，B 插入的 a=8 落在被锁间隙里；D 是快照读走 MVCC，不阻塞。详见[《索引-事务-锁与调优》](#/f/f14)","ref":"f14"},{"id":"qd592bedb","kind":"select","cat":"MySQL","diff":"难","q":"关于覆盖索引与索引下推（ICP），下列说法正确的是？","opts":["两者是同一件事的两种叫法","覆盖索引指查询列全部落在索引中、无需回表；ICP 是把无法用于定位的索引列过滤下推到引擎层，减少回表次数","使用覆盖索引时，explain 的 Extra 显示的是 Using index condition","ICP 默认关闭，需要手动打开才会生效"],"a":"B","exp":"覆盖索引对应 Extra 的 Using index，ICP 对应 Using index condition；ICP 自 MySQL 5.6 起默认开启，两者优化的是不同环节。详见[《索引-事务-锁与调优》](#/f/f14)","ref":"f14"},{"id":"qb3ef5efd","kind":"select","cat":"MySQL","diff":"难","q":"深分页优化中，延迟关联写法比原始写法快，原理是？","opts":["它把一条 SQL 拆成两次查询并发执行","它把排序工作挪到了应用层完成","子查询只扫描较窄的二级索引即可拿到 10 个目标主键，避免为前 90 万行逐行取整行数据","它命中了查询缓存，第二次直接从缓存读取"],"a":"C","exp":"子查询在 idx_created 上完成排序与偏移，最后只对 10 个主键回表；游标分页（WHERE created_at > 上次值）则连偏移扫描都省掉，但只能顺序翻页。详见[《索引-事务-锁与调优》](#/f/f14)","ref":"f14"},{"id":"qe1c34f8a","kind":"select","cat":"Redis","diff":"易","q":"Redis 的 Hash 类型在字段数较少、值较小时，采用哪种编码存储？","opts":["跳表 + 哈希表","整数集合（intset）","压缩列表（ziplist/listpack）","双向链表"],"a":"C","exp":"小 Hash 用 ziplist/listpack 连续内存紧凑存放，字段数或值长度超过 hash-max-listpack-entries/value 阈值后才转成哈希表。intset 是 Set 在\"元素全是整数且数量少\"时的编码；跳表 + 哈希表是 ZSet 变大后的双结构。详见[《01-Redis》](#/f/f21)","ref":"f21"},{"id":"qb394dd33","kind":"select","cat":"Redis","diff":"易","q":"下面哪一项最不适合用 Redis 的 List 来实现？","opts":["按分数实时排名的游戏榜单","取最新 10 条评论（LPUSH + LRANGE 截断）","秒杀订单的异步落库队列（LPUSH + BRPOP）","未读消息列表"],"a":"A","exp":"List 只能按下标或头尾访问，没有按分数排序的能力，排行榜要交给 ZSet 的 score + ZREVRANGE。B/C/D 都是 List 的典型用法。详见[《01-Redis》](#/f/f21)","ref":"f21"},{"id":"qf1e24163","kind":"select","cat":"消息队列","diff":"易","q":"RabbitMQ 中一条消息被消费失败且 `basicNack` 时 requeue 设为 false，它最终会去哪里？","opts":["直接丢弃，没有任何记录","自动重试 3 次后丢弃","进入死信交换机，落到死信队列等人工或补偿任务处理","退回给生产者重新发送"],"a":"C","exp":"消息被 nack/reject 且不回队列、TTL 到期、队列超长这三种情况都会触发死信路由，前提是声明队列时绑定了死信交换机（x-dead-letter-exchange）。死信队列是排查\"消息去哪了\"的关键兜底，也常被用来配合 TTL 实现延迟队列。A 忽略了 DLX 的兜底作用；MQ 不会自动把消息退给生产者。详见[《02-RabbitMQ》](#/f/f22)","ref":"f22"},{"id":"qfd3d445e","kind":"select","cat":"Redis","diff":"中","q":"关于 Redis 的惰性删除，下列说法正确的是？","opts":["key 一到过期时间就被立即从内存中删除","key 过期后不主动回收，直到下一次访问到它时才检查并删除","惰性删除意味着过期 key 永远不会被清理","惰性删除是内存达到 maxmemory 之后才启动的机制"],"a":"B","exp":"惰性删除把 CPU 开销摊到访问时刻，代价是\"再也没人访问的过期 key 会一直占内存\"，所以要配合定期删除（每 100ms 随机抽一批检查）。D 描述的是内存淘汰，是内存超限后的另一套机制。详见[《01-Redis》](#/f/f21)","ref":"f21"},{"id":"qd0f0e72d","kind":"select","cat":"Redis","diff":"易","q":"纯缓存场景下，希望内存不足时优先淘汰最久未使用的数据，淘汰策略应配置为？","opts":["allkeys-lru","noeviction","volatile-ttl","allkeys-random"],"a":"A","exp":"allkeys-lru 在全键范围内按最近最少使用淘汰，是缓存场景的常规选择。B 是默认值，内存满后写请求直接报错，适合把 Redis 当唯一数据源、宁可报错也不丢数据的场景；C 只在设了 TTL 的键里挑剩余寿命最短的；D 随机淘汰，命中率不可控。详见[《01-Redis》](#/f/f21)","ref":"f21"},{"id":"q87afce88","kind":"select","cat":"Redis","diff":"中","q":"下面哪种写法在 Redis Cluster 中容易触发 CROSSSLOT 错误？","opts":["GET 单个 key","对单个 key 执行 INCR","给单个 key 设置 EXPIRE","对两个普通 key 直接做 SINTER（未使用 hash tag）"],"a":"D","exp":"多 key 命令要求所有 key 落在同一个槽，`user:1:follow` 与 `user:2:follow` 大概率分属不同节点。解法是用 hash tag 强制同槽，例如 `{u1}:follow` 与 `{u1}:fans`。单 key 命令不受影响。详见[《01-Redis》](#/f/f21)","ref":"f21"},{"id":"qb9ddb36a","kind":"select","cat":"Redis","diff":"中","q":"秒杀扣库存时用 Lua 脚本替代\"先 GET 判断、再 DECR 扣减\"两段代码，核心收益是？","opts":["Lua 脚本可以自动重试失败的命令","脚本在 Redis 中作为一个整体串行执行，中间不会插入其他客户端的命令","Lua 脚本比 Java 代码更容易维护","只有 Lua 脚本才能访问 Hash 类型"],"a":"B","exp":"命令执行本身是单线程的，但两条命令之间仍可能插入其他请求，出现\"判断时库存够、扣减时已被别人扣完\"的超卖窗口。脚本整体执行消除了这个窗口。注意脚本内不要写耗时逻辑，否则会阻塞整个实例。详见[《02-高并发系统设计》](#/f/f30)","ref":"f30"},{"id":"qe17b8b47","kind":"select","cat":"Redis","diff":"中","q":"服务用本地 Caffeine + Redis 做多级缓存，商品价格修改后部分实例仍返回旧价格，最可能的原因是？","opts":["Caffeine 的容量设置得太小","Redis 不支持价格这类数值","只删了 Redis 中的缓存，各实例进程内的 Caffeine 没有被通知失效","商品价格这类数据必须直接查数据库"],"a":"C","exp":"本地缓存不在 Redis 里，删 Redis 影响不到各实例自己的内存。做法是借助 Redis 发布订阅或键过期通知广播\"某 key 失效\"，各节点收到后清掉本地条目。这类广播丢一两次无大碍，但不能当可靠消息用。详见[《01-Redis》](#/f/f21)","ref":"f21"},{"id":"q03238158","kind":"select","cat":"Redis","diff":"中","q":"主从 + 哨兵架构下，写完立即查询却读到旧值，最可能的原因是？","opts":["Redis 的 RDB 文件损坏","复制是异步的，写落在主节点而读请求被路由到了尚未同步完成的从节点","哨兵把写请求转发到了从节点","从节点只读，所以读不到新数据"],"a":"B","exp":"主节点写完本地就返回，命令再异步传播给从节点，这个窗口内的读从请求必然拿到旧值。对一致性敏感的操作（如支付后立刻查订单）要强制读主，或用 `WAIT` 等待若干副本确认。哨兵只负责监控与切换，不代理读写。详见[《01-Redis》](#/f/f21)","ref":"f21"},{"id":"qc989977e","kind":"select","cat":"Redis","diff":"难","q":"一个占用 60GB 内存的 Redis 实例执行 bgsave，关于 fork 与写时复制，下列说法正确的是？","opts":["fork 会立即复制一份 60GB 内存给子进程，实例随即 OOM","fork 会挂起父进程直到快照完成，期间所有请求阻塞","fork 瞬间只复制页表、开销很小，但快照期间父进程的写入会触发页复制，内存可能接近翻倍","内存越大 fork 越快，60GB 实例几乎无感知"],"a":"C","exp":"Linux 的 fork 采用写时复制，并非立刻复制 60GB，所以 A 错；但快照期间父进程每修改一个内存页就要复制一份出来，最坏情况内存接近翻倍，叠加内存碎片后容易 OOM，因此要预留一倍余量并控制 maxmemory。fork 复制页表的耗时随内存量增长，大实例会有毫秒级停顿，B 的\"挂起直到完成\"夸大了。详见[《01-Redis》](#/f/f21)","ref":"f21"},{"id":"q5f9b574b","kind":"select","cat":"Redis","diff":"难","q":"AOF 重写期间客户端仍在不停写入，Redis 靠什么保证这批新命令不丢？","opts":["重写期间直接拒绝所有新的写命令","新命令只进内存，重写结束后由客户端重新发送","重写期间临时关闭 AOF，结束后再打开","新命令同时追加到旧 AOF 和重写缓冲区，新文件写完后补上这段增量再原子替换"],"a":"D","exp":"重写子进程只持有 fork 那一刻的数据视图，感知不到后续写入，所以父进程把新命令额外积累到 aof_rewrite_buf；新 AOF 落盘后先追加这段增量、再改名替换旧文件，切换期间几乎没有数据缺口。代价是这份缓冲区同样吃内存，写流量极大时需留意。详见[《01-Redis》](#/f/f21)","ref":"f21"},{"id":"qf731fcc9","kind":"select","cat":"Redis","diff":"中","q":"热点 key 失效后的重建，用\"逻辑过期\"与\"互斥锁\"最本质的差别是？","opts":["逻辑过期让请求直接拿到旧值再异步重建，互斥锁让其余请求阻塞等待重建结果","逻辑过期不会产生任何数据不一致","互斥锁方案不需要考虑锁超时问题","两者完全等价，只是代码写法不同"],"a":"A","exp":"逻辑过期把过期时间写进 value、key 本身不设 TTL，命中后发现逻辑过期就返回旧值并异步刷新，吞吐高但会短暂返回旧数据；互斥锁只放一个线程回源、其余等待，一致性好但要处理锁超时、吞吐较低。选哪种取决于业务能否容忍短时旧值；两者都不解决\"数据根本不存在\"的穿透问题。详见[《01-Redis》](#/f/f21)","ref":"f21"},{"id":"q9c3ddeef","kind":"select","cat":"Redis","diff":"难","q":"在 Cache Aside 之上再叠加\"延迟双删\"，是为了堵住哪个时序漏洞？","opts":["数据库主从延迟导致从库读不到最新数据","删除缓存这个动作本身不是原子的","Redis 的内存淘汰策略会误删缓存","读请求在写请求删除缓存之后、更新数据库之前查到旧值，随后又把旧值回填进缓存"],"a":"D","exp":"典型时序是：读线程查库拿到旧值 → 写线程更新数据库并删缓存 → 读线程此时才把旧值写回缓存，脏数据就长期留下了。延迟双删做成\"删缓存 → 更新数据库 → 延迟 500ms~1s 再删一次\"，清掉这次延迟加载造成的脏数据。它依赖对延迟时长的估计、并不保险，更彻底的做法是订阅 binlog 异步删缓存。详见[《01-Redis》](#/f/f21)","ref":"f21"},{"id":"q25a36c72","kind":"select","cat":"消息队列","diff":"易","q":"团队要做日志采集与用户行为埋点，数据量极大，下游既有实时计算任务，也需要能回溯重放历史数据。按常规选型结论，最合适的是？","opts":["RabbitMQ：延迟最低、路由最灵活，适合海量日志","Kafka：吞吐最高，且消息按保留策略留存、消费只移动 offset，天然支持回溯重放","RocketMQ：事务消息最成熟，日志场景首选","三者都可以，日志场景对吞吐和回放都没有要求"],"a":"B","exp":"选型看三个维度：吞吐（Kafka 百万级 > RocketMQ 十万级 > RabbitMQ 万~十万级）、功能（业务功能 RocketMQ 最全，路由能力 RabbitMQ 最强）、数据保留方式。日志/埋点/大数据管道这类\"量大、要多方消费、要能重放\"的场景与 Kafka 的日志化模型天然契合。RabbitMQ 的优势在低延迟与灵活路由，但吞吐量级和\"确认即删\"的模型都不匹配。详见[《04-RocketMQ》](#/f/f24)","ref":"f24"},{"id":"qf7e3889e","kind":"select","cat":"消息队列","diff":"中","q":"关于 Kafka 的 rebalance（分区再平衡），下列说法正确的是？","opts":["只有消费者数量变化才会触发，生产者增加分区数不会","频繁 rebalance 只影响新加入的消费者，组内其他消费者不受影响","成员增减、订阅的 topic 变化、分区数变化都会触发；Sticky/CooperativeSticky 策略让分区尽量留在原消费者上、只做增量调整，减少整组停顿","rebalance 期间消费照常进行，只是分区归属发生改变"],"a":"C","exp":"触发条件有三类——组内成员增减（上下线、宕机）、分区数变化、订阅的 topic 变化，A 漏了后两类。rebalance 期间整个消费组停止消费（类似 STW），所以 B、D 都错：影响的是全组，且停摆会直接造成消费延迟。分区分配策略中 Range/RoundRobin 属于全量重分配，Sticky 与 CooperativeSticky 尽量保留原有归属、只做增量调整，其中 CooperativeSticky 支持增量式协作重平衡，停顿最短。工程上要避免频繁 rebalance：合理设置 session.timeout.ms，并确保消费耗时不超过 max.poll.interval.ms。详见[《03-Kafka》](#/f/f23)","ref":"f23"},{"id":"qd9d57270","kind":"select","cat":"消息队列","diff":"易","q":"希望 `order.*` 能匹配 `order.create`、但不匹配 `order.create.success`，应选择哪类交换机？","opts":["direct","topic","fanout","headers"],"a":"B","exp":"topic 的通配符中 `*` 匹配一级、`#` 匹配多级，`order.#` 才会命中 `order.create.success`。direct 只做精确匹配；fanout 忽略 RoutingKey 广播给所有绑定队列；headers 按消息头匹配，性能差、很少用。详见[《02-RabbitMQ》](#/f/f22)","ref":"f22"},{"id":"q3924a2b4","kind":"select","cat":"消息队列","diff":"易","q":"Kafka 能支持消息回溯、被多个消费组反复消费，根本原因是？","opts":["每条消息带有全局唯一的 UUID","消费者本地缓存了全量消息副本","Kafka 会把同一条消息推送给所有消费组","消息按保留策略存在日志文件里，消费只是移动 offset，并不删除消息"],"a":"D","exp":"Kafka 把消息当作可追加的日志，消费进度只是一个位移数字，重置 offset 就能重放历史数据。这与 RabbitMQ\"确认即删除\"的模型形成对照，也是它适合日志采集与大数据管道的原因。详见[《03-Kafka》](#/f/f23)","ref":"f23"},{"id":"q5b84f38d","kind":"select","cat":"消息队列","diff":"中","q":"RocketMQ 的延迟消息，相比 RabbitMQ 用 TTL + 死信实现延迟，主要优势在于？","opts":["Broker 侧按到期时间调度投递，不受队列先进先出顺序的限制","延迟精度可以做到纳秒级","延迟消息不占用磁盘空间","RabbitMQ 的 TTL 方案完全无法实现延迟效果"],"a":"A","exp":"TTL + 死信方案里队列是先进先出的：排在前面的消息还没到期，后面已经到期的也出不去，这就是队头阻塞（同一队列内各条消息延迟时长不一致时尤其明显）。RocketMQ 先把消息存进内部调度 Topic，到期后再投回真实 Topic，因此没有这个问题（4.x 为 18 个固定等级，5.x 用时间轮支持任意时刻）。详见[《04-RocketMQ》](#/f/f24)","ref":"f24"},{"id":"q11f772e9","kind":"select","cat":"Redis","diff":"难","q":"Redis Cluster 中，客户端向一个并不负责该 key 的节点发起请求，关于节点的响应，下列说法正确的是？","opts":["节点静默把请求转发给正确的节点，客户端完全无感知","节点返回 MOVED 错误并带上目标节点地址，由客户端更新槽映射后重新发起请求","节点返回 nil，客户端只能自己遍历所有节点去找数据","节点会自动把这个 key 迁移到自己这里，之后由本节点负责"],"a":"B","exp":"槽的归属是预先划分好的，节点不做代理转发，而是用 MOVED 告诉客户端\"这个槽现在归谁\"，智能客户端据此刷新本地槽映射再重试——所以叫重定向而不是转发。D 说反了：key 归哪个节点由它落在哪个槽决定，节点不能自行把槽搬过来。补充一个高频追问：如果该槽正在迁移中，节点会返回 ASK，让客户端仅对这一次请求临时改投目标节点，且不更新客户端的槽映射——MOVED 是永久改派、ASK 是一次性绕行，这是两者的关键区别。详见[《01-Redis》](#/f/f21)","ref":"f21"},{"id":"q9346d5a8","kind":"select","cat":"消息队列","diff":"中","q":"Kafka 生产者设置 acks=all 时，为什么还建议搭配 min.insync.replicas=2？","opts":["让消息被包括未同步副本在内的所有副本确认","为每条消息自动开启事务","让 ISR 收缩到只剩 Leader 时仍能写入成功","acks=all 只要求所有 ISR 成员确认，而 ISR 会收缩；设成 2 后同步副本不足时写入直接失败，避免退化成\"只剩 Leader 也算 all\""],"a":"D","exp":"ISR 是动态集合，落后太多的副本会被踢出，极端情况下只剩 Leader，此时 acks=all 等价于 acks=1。min.insync.replicas=2 把\"至少两个副本同步成功\"变成写入的前置条件，不足则抛 NotEnoughReplicas，可靠性与预期才对得上。A 错在未同步的副本本就不属于 ISR。详见[《03-Kafka》](#/f/f23)","ref":"f23"},{"id":"q029f90e0","kind":"select","cat":"消息队列","diff":"中","q":"Kafka 消费者保留默认的 enable.auto.commit=true，可能在什么情况下丢消息？","opts":["位移按固定间隔自动提交，业务还没处理完就宕机，重启后从已提交位移继续，中间那批消息被跳过","自动提交会让 Broker 拒绝投递新消息","自动提交会覆盖生产者的 acks 配置","自动提交只能提交偶数位移，造成错位"],"a":"A","exp":"自动提交是定时任务，提交的位移与业务处理进度完全脱钩，正是\"先提交后处理\"的典型丢消息模式。业务系统一律关闭自动提交、改为处理完成后手动提交；代价是宕机后会重复消费，所以还需要消费端幂等。详见[《03-Kafka》](#/f/f23)","ref":"f23"},{"id":"q916b2f6a","kind":"select","cat":"消息队列","diff":"中","q":"Kafka 消费组里消费者数量超过了 Topic 的分区数，会发生什么？","opts":["多出来的消费者会自动拆分现有分区继续消费，总吞吐继续线性提升","消费组会拒绝新成员加入并报错","每个分区会被两个消费者同时消费，消费速度翻倍","多出来的消费者分不到分区、处于空闲状态；想提升并行度只能先增加分区数"],"a":"D","exp":"分区是并行消费的最小单位，组内一个分区同一时刻只能归一个消费者，因此并行度上限就是分区数。这也是消息积压时\"盲目加消费者\"无效的原因——正确顺序是先扩分区（或新建多分区 Topic 搬迁数据），再扩消费者。详见[《03-Kafka》](#/f/f23)","ref":"f23"},{"id":"q20deb87a","kind":"select","cat":"消息队列","diff":"难","q":"生产端已配置 acks=all 与重试，但代码里 `kafkaTemplate.send()` 之后从不检查返回值，消息仍可能丢失，原因是？","opts":["acks=all 在消息小于 1KB 时会自动降级为 acks=1","只要配了 acks=all，任何情况下都不会丢","send() 是异步的，失败异常被吞在返回的 future 里，不阻塞等待或注册回调就完全无感知","KafkaTemplate 会把失败的消息自动写入死信队列"],"a":"C","exp":"可靠性配置只管\"发出去之后\"的链路，管不了\"根本没发出去\"。高可靠场景必须显式检查发送结果，失败落库补偿或重试。死信队列是消费侧的机制，生产侧没有自动兜底。详见[《03-Kafka》](#/f/f23)","ref":"f23"},{"id":"qd063676d","kind":"select","cat":"消息队列","diff":"难","q":"RocketMQ 事务消息的\"事务回查\"机制，主要解决什么问题？","opts":["生产者执行完本地事务后，Commit/Rollback 丢失或生产者宕机，半消息状态悬而未决","消费者重复消费的问题","Broker 磁盘写满导致的写入失败","消息在 MessageQueue 中的顺序错乱"],"a":"A","exp":"正常流程下生产者会在本地事务结束后主动二次确认，但网络抖动或进程崩溃可能让这次确认永远到不了 Broker，半消息就一直悬着（对消费者不可见）。回查让 Broker 定时反查生产者\"这笔本地事务到底成了没有\"，据此决定提交或回滚。注意事务消息只保证生产端与本地事务一致，消费端仍需幂等。详见[《04-RocketMQ》](#/f/f24)","ref":"f24"},{"id":"q896c2309","kind":"select","cat":"Elasticsearch","diff":"易","q":"要对 text 类型字段 name 做「整句精确匹配」查询，正确的写法是？","opts":["用 term 查询 name.keyword 子字段（mapping 中该 text 字段配了 keyword 子字段）","用 match 查询 name 字段","用 match_phrase 查询 name 字段","用 term 查询 name 字段本身"],"a":"A","exp":"text 字段写入时已被分词，倒排表里根本不存在「整句」这个词，所以直接 term 查 name 通常查不到（选项 D 是经典错误）；B、C 都属于会对查询词再分词的全文检索。给 text 字段加 keyword 子字段后，term 查这个不分词的子字段才能精确命中。详见[《05-Elasticsearch》](#/f/f25)","ref":"f25"},{"id":"q0e42a765","kind":"select","cat":"Elasticsearch","diff":"中","q":"把价格区间过滤放进 bool 的 filter 子句而不是 must 子句，主要好处是？","opts":["filter 支持 range 查询而 must 不支持","filter 会提升文档的 BM25 相关度得分","filter 子句之间是 OR 关系，能召回更多文档","filter 不参与相关性打分且过滤结果可被缓存，纯过滤场景性能更好"],"a":"D","exp":"must 参与 BM25 打分计算，filter 只判断「命中与否」不算分，并且过滤结果可以缓存成 bitset 复用。所以状态、时间、价格区间这类只影响「筛选」不影响「排序」的条件应放 filter，只有真正影响相关度的全文条件才放 must。详见[《05-Elasticsearch》](#/f/f25)","ref":"f25"},{"id":"q407c26e8","kind":"select","cat":"Elasticsearch","diff":"难","q":"关于 Elasticsearch 的 refresh 与 flush，下列说法正确的是？","opts":["refresh 负责把 segment 持久化到磁盘并清空 translog","flush 负责让新写入的文档变得可被搜索","refresh（默认 1s）把内存缓冲中的文档生成 segment 并写入 OS 页缓存，此时文档才可被搜索；flush（默认 30 分钟或 translog 写满）才把 segment 落盘并清空 translog","两者默认都每 1 秒执行一次，且一旦关闭 refresh 就会丢数据"],"a":"C","exp":"写入先进入内存 buffer 与 translog（防丢），refresh 后才可被搜索——这正是「近实时」的来源；flush 才是真正的持久化与 translog 清理。关闭 refresh 只影响可见性、不会丢数据，因为 translog 仍在记录。详见[《05-Elasticsearch》](#/f/f25)","ref":"f25"},{"id":"qdde58388","kind":"select","cat":"Elasticsearch","diff":"难","q":"商品搜索要做「无限下拉」式深翻页（可能翻到几万条之后），最合适的方案是？","opts":["不断加大 from 的值，配合 size=20 逐页取","用 search_after 配合 PIT，以上一页最后一条的排序值作为游标继续取下一页","用 scroll 为每个在线用户维持一个游标来翻页","在每个分片上各取前 N 条，再在客户端归并去重"],"a":"B","exp":"from+size 需要每个分片都取出 from+size 条到协调节点归并排序，代价随 from 线性增长且默认上限 10000；scroll 会长时间占用资源维持快照，适合一次性全量导出而非用户翻页；search_after 靠游标定位，代价与页深无关，配合 PIT 还能保证翻页期间数据视图一致。详见[《05-Elasticsearch》](#/f/f25)","ref":"f25"},{"id":"q2d8b12b6","kind":"select","cat":"Elasticsearch","diff":"中","q":"某索引现有 6 个主分片已接近单分片容量上限，正确的扩容做法是？","opts":["新建一个分片数更多的索引，用 _reindex 把数据导过去，再用别名切换，业务无感","调用 _settings 接口把 number_of_shards 从 6 改成 12","把副本数从 1 调到 3，写入容量随之翻倍","重启集群，主分片会自动分裂成更多份"],"a":"A","exp":"主分片数在建索引时固定、之后不可修改，因为文档路由公式依赖它，改分片数等于让所有历史数据「找错门」，只能重建索引后切别名。副本分片只提升读吞吐与容灾能力，并不分担写入。详见[《05-Elasticsearch》](#/f/f25)","ref":"f25"},{"id":"qfe10d9d0","kind":"select","cat":"Elasticsearch","diff":"易","q":"中文商品搜索中，analyzer 与 search_analyzer 的常见搭配是？","opts":["两个都用 standard，中文会被切成单字","analyzer 用 ik_smart，search_analyzer 用 ik_max_word","只设置 search_analyzer，analyzer 保持默认","analyzer 用 ik_max_word 保证写入侧召回，search_analyzer 用 ik_smart 让查询词更精炼"],"a":"D","exp":"写入用最细粒度切词，保证任何合理查询都能命中；查询用粗粒度切词，减少无关词带来的噪声，两者配合才能兼顾召回与精度。standard 对中文基本逐字切分，噪声大、相关性差，中文检索必须换 IK 插件。详见[《05-Elasticsearch》](#/f/f25)","ref":"f25"},{"id":"q11b339a1","kind":"select","cat":"Elasticsearch","diff":"易","q":"执行 `GET /_cluster/health` 返回 status 为 yellow，说明？","opts":["主分片已全部分配，但存在副本分片未分配（单节点集群几乎必然如此）","主分片与副本分片都已正常分配，集群完全健康","至少有一个主分片未分配，这部分数据已经查不到","集群正在做段合并，属于正常的中间状态"],"a":"A","exp":"green 表示主副分片全部就绪；yellow 表示主分片齐全但副本无处安放（只有一台节点时没有别处可放副本，所以单节点集群长期是 yellow）；red 才是有主分片未分配、部分数据不可用。测试环境看到 yellow 不必惊慌。详见[《05-Elasticsearch》](#/f/f25)","ref":"f25"},{"id":"q82027ce4","kind":"select","cat":"ZooKeeper","diff":"中","q":"在 zkCli 中执行 `create -e /order-svc \"192.168.1.10:8080\"` 后 quit 退出，重新进入 zkCli 执行 `ls /order-svc` 会看到什么？","opts":["节点仍存在，数据保持原样","提示节点不存在——`-e` 创建的是临时节点，随会话断开被自动删除","节点还在，但数据被清空","节点自动转换成了持久节点"],"a":"B","exp":"`-e` 即 ephemeral，生命周期绑定客户端会话，会话断开即消失——这正是服务注册能「实例宕机自动摘除」的原理。不加 `-e` 时默认创建持久节点，会话断开也不会消失。详见[《06-ZooKeeper与Nacos》](#/f/f26)","ref":"f26"},{"id":"q776a0476","kind":"select","cat":"ZooKeeper","diff":"难","q":"用 ZooKeeper 实现分布式锁时，如果所有等待者都监听同一个锁节点，锁释放瞬间会出现什么现象？","opts":["只唤醒排队时间最久的那一个客户端","ZooKeeper 会把通知自动排队，按注册先后逐个唤醒","所有等待者同时被唤醒并涌向服务端抢锁，形成羊群效应，给 ZK 带来瞬时压力","Watcher 只触发一次，所以其余客户端永远收不到通知"],"a":"C","exp":"这就是「惊群/羊群效应」：一次事件唤醒大量客户端，最终只有一个抢到锁，其余白跑一趟。正确做法是改用临时顺序节点，每个客户端只监听「比自己序号小的前一个节点」，释放时只唤醒下一个等待者。详见[《06-ZooKeeper与Nacos》](#/f/f26)","ref":"f26"},{"id":"q32170854","kind":"select","cat":"ZooKeeper","diff":"难","q":"关于 ZAB 与 Paxos 的关系，说法正确的是？","opts":["Paxos 是通用的分布式一致性算法；ZAB 是为「主备模式的原子广播」设计的协议，靠 zxid/epoch 保证全局有序，包含消息广播与崩溃恢复两个阶段","ZAB 是通用一致性算法，而 Paxos 只能用于主备系统","两者完全等价，ZAB 只是 Paxos 的 Java 语言实现","ZAB 只要 Leader 自己写入成功即可提交，无需过半确认"],"a":"A","exp":"Paxos 解决「一批节点就某个值达成一致」的通用问题，本身不保证全序；ZAB 面向主备复制状态机，要求所有写请求经 Leader 排序后广播、过半节点确认才提交，从而保证各副本状态顺序一致。详见[《06-ZooKeeper与Nacos》](#/f/f26)","ref":"f26"},{"id":"qc439fc31","kind":"select","cat":"ZooKeeper","diff":"中","q":"「ZooKeeper 不适合做注册中心」最主要的理由是？","opts":["ZK 不支持临时节点，无法自动摘除宕机实例","ZK 没有 Watcher 机制，调用方无法感知实例列表变化","ZK 只能单机部署，无法组建集群","ZK 是 CP 系统，Leader 选举期间整个集群拒绝服务，而服务发现更看重可用性——宁可返回一份略旧的实例列表"],"a":"D","exp":"A、B、C 都与事实相反，临时节点与 Watcher 恰恰是 ZK 的看家本领。真正的短板在 CP 语义带来的「选举期不可写」，再加上 Watcher 一次性、无控制台、运维成本高，新项目基本不再选它做注册中心。详见[《06-ZooKeeper与Nacos》](#/f/f26)","ref":"f26"},{"id":"q5650fb77","kind":"select","cat":"ZooKeeper","diff":"中","q":"Nacos 的「保护阈值」是为了解决什么问题？","opts":["限制单个客户端对配置中心的请求频率","当健康实例比例低于阈值时，把不健康实例也一并返回给调用方，避免返回空列表导致整个服务不可用","当配置中心连接断开时自动降级读取本地缓存","心跳超过 15 秒未到达就立即剔除该实例"],"a":"B","exp":"这是「可用性优先」的体现：返回一份可能部分不可用的列表，调用方最多部分请求失败；一旦返回空列表，整条调用链会瞬间全挂。D 描述的是心跳超时标记不健康的机制（15 秒），并非保护阈值。详见[《06-ZooKeeper与Nacos》](#/f/f26)","ref":"f26"},{"id":"q46490e18","kind":"select","cat":"ZooKeeper","diff":"中","q":"Nacos 中 Distro 协议与 Raft 协议的分工，正确的是？","opts":["临时实例走 Distro（AP，异步复制、最终一致），持久实例与配置中心走 Raft（CP，强一致）","临时实例走 Raft 保强一致，持久实例走 Distro 保可用","两者都走 Raft，只是配置参数不同","Distro 负责配置存储，Raft 负责服务发现"],"a":"A","exp":"绝大多数微服务注册成临时实例（默认），要的正是「宕机也能返回旧列表」的 AP 语义，靠客户端心跳与超时剔除实现最终一致；数据库类等必须全员强一致的服务才注册成持久实例走 CP。同一集群可同时承载两种模式。详见[《06-ZooKeeper与Nacos》](#/f/f26)","ref":"f26"},{"id":"q79f5a81a","kind":"select","cat":"Nginx","diff":"中","q":"配置 `location /api/ { proxy_pass http://backend/; }`，浏览器请求 `GET /api/user/1` 时后端收到的路径是？","opts":["/api/user/1","/user/1","/backend/api/user/1","/api/"],"a":"B","exp":"proxy_pass 的地址结尾带 `/` 时，Nginx 会把 location 匹配到的前缀 `/api/` 替换掉再转发；若写成 `proxy_pass http://backend;`（结尾不带 `/`），则会把 `/api/user/1` 原样转发给后端。这一字之差是配置反向代理最常见的坑。详见[《07-Nginx》](#/f/f27)","ref":"f27"},{"id":"qd70c1479","kind":"select","cat":"Nginx","diff":"中","q":"`limit_req zone=apiLimit burst=20 nodelay;` 中 nodelay 的作用是？","opts":["超过 burst 的请求直接返回 503，不做任何缓冲","把限流速率 rate 降到原来的一半","burst 范围内的突发请求立即被处理，不按 rate 匀速排队等待","关闭限流计数，只记录日志不拦截"],"a":"C","exp":"burst 是允许排队的突发量；不加 nodelay 时这些请求会被匀速放行，客户端看到明显延迟；加了 nodelay 则立即处理，只有超出 burst 的部分才会被拒绝。rate=10r/s 约束的是平均速率，burst 让瞬时尖峰能被吸收。详见[《07-Nginx》](#/f/f27)","ref":"f27"},{"id":"q3dcc029b","kind":"select","cat":"Nginx","diff":"难","q":"多个 worker 进程同时监听同一端口会引发惊群问题，Nginx 的应对方式是？","opts":["把 worker_processes 设为 1，单进程自然没有惊群","用 accept_mutex 让 worker 串行竞争 accept 权，同一时刻只让一个 worker 监听新连接（新内核下由 EPOLLEXCLUSIVE 承担同类职责）","关闭 epoll，改用 select 模型","让每个 worker 监听不同端口，再由 master 统一转发"],"a":"B","exp":"惊群指新连接到来时，所有阻塞在事件等待上的 worker 都被唤醒，却只有一个能 accept，其余白白被唤醒消耗 CPU。accept_mutex 通过「同一时刻只有一个 worker 有机会 accept」消除无谓唤醒；worker 数通常设为 CPU 核数，多进程 + epoll 正是 Nginx 高并发的根基。详见[《07-Nginx》](#/f/f27)","ref":"f27"},{"id":"q0cfb6cf8","kind":"select","cat":"Nginx","diff":"易","q":"Vue history 模式下刷新子路由出现 404，应该补上的 Nginx 配置是？","opts":["location / { return 301 /index.html; }","location / { proxy_pass http://backend; }","location / { expires 7d; }","location / { root /usr/share/nginx/html; try_files $uri $uri/ /index.html; }"],"a":"D","exp":"try_files 依次尝试「文件 → 目录 → 兜底 index.html」，把找不到的路径交给前端路由自己接管。A 用 301 会改写浏览器地址栏，B 会把静态资源请求打到后端应用，C 只管缓存头、解决不了 404。详见[《07-Nginx》](#/f/f27)","ref":"f27"},{"id":"q2e663290","kind":"select","cat":"MongoDB","diff":"易","q":"MongoDB 默认生成的 ObjectId 由哪几部分组成？","opts":["4 字节时间戳 + 8 字节纯随机数","4 字节秒级时间戳 + 5 字节机器/进程随机值 + 3 字节自增计数","12 字节整型自增序列","8 字节时间戳 + 4 字节分片键哈希"],"a":"B","exp":"共 12 字节，前 4 字节是创建时间（所以 ObjectId 大致按时间递增），中间 5 字节标识机器与进程，最后 3 字节是同一秒内的自增计数。应用端即可生成、不依赖数据库协调，天然趋势递增，适合做索引键。详见[《08-MongoDB》](#/f/f28)","ref":"f28"},{"id":"q95beecf4","kind":"select","cat":"MongoDB","diff":"中","q":"要按品牌统计商品数量与均价（只看 1000 元以上的商品），聚合管道的阶段顺序应为？","opts":["[{ $match: { price: { $gte: 1000 } } }, { $group: { _id: \"$brand\", count: { $sum: 1 }, avgPrice: { $avg: \"$price\" } } }, { $sort: { count: -1 } }]","[{ $group: { _id: \"$brand\", count: { $sum: 1 } } }, { $match: { price: { $gte: 1000 } } }, { $sort: { count: -1 } }]","[{ $sort: { count: -1 } }, { $match: { price: { $gte: 1000 } } }, { $group: { _id: \"$brand\" } }]","[{ $group: { _id: \"$brand\", count: { $sum: 1 } } }, { $sort: { count: -1 } }, { $match: { price: { $gte: 1000 } } }]"],"a":"A","exp":"聚合管道严格按数组顺序执行。$match 越靠前越能先滤掉无关文档、大幅减少后续阶段的数据量（还能利用索引），$group 做分组聚合，$sort 最后对聚合结果排序。B、D 在 $group 之后才过滤，等于白算了一大批文档；C 里 $sort 的 count 字段此时根本不存在。详见[《08-MongoDB》](#/f/f28)","ref":"f28"},{"id":"qf759208d","kind":"select","cat":"MongoDB","diff":"难","q":"关于 MongoDB 的写关注（writeConcern），说法正确的是？","opts":["w:1 表示所有副本节点都确认后才返回","w:0 表示必须等主节点落盘后才返回","w:\"majority\" 表示多数节点确认后才返回，可降低主节点故障回滚导致的数据丢失风险；j:true 则要求写入 journal 日志后才确认","writeConcern 只对分片集群生效，副本集下没有意义"],"a":"C","exp":"w 决定「多少个节点确认才返回」：w:0 是发出去就不管（最快，可能丢），w:1 只需主节点确认（主节点故障时可能被回滚），w:\"majority\" 最稳但延迟最高；j 控制是否等待写入 journal 落盘。写关注越高越安全、越慢，需按业务取舍。详见[《08-MongoDB》](#/f/f28)","ref":"f28"},{"id":"q6dad812f","kind":"select","cat":"框架","diff":"中","q":"某事务方法内部执行 `try { mapper.update(x); } catch (Exception e) { log.error(\"更新失败\", e); }`，异常被捕获后方法正常返回，这条 update 会？","opts":["因为事务内出现过异常，仍然回滚","方法返回后 Spring 会复查日志，发现异常后回滚","不回滚：代理感知不到异常，事务正常提交","取决于 update 与后续操作是否在同一个 Mapper"],"a":"C","exp":"回滚与否只看异常有没有传播到代理；被 try-catch 吞掉后代理认为方法正常完成，于是提交已执行的更新——这就是\"异常被吞导致事务失效\"。要局部容错又想回滚，需显式标记回滚，或把该操作拆到另一个 Bean 的独立事务里。详见[《Spring核心》](#/f/f15)","ref":"f15"},{"id":"qa9e256fe","kind":"select","cat":"框架","diff":"中","q":"`@Bean public OrderService orderService(UserRepository repo) { return new OrderService(repo); }` 这种写法？","opts":["可行：容器会解析方法参数并从容器中按类型注入","编译报错：@Bean 方法的签名不允许带参数","启动报错：@Bean 方法只能返回容器已有的 Bean","可以启动，但参数恒为 null，仍需在方法体里手动 new"],"a":"A","exp":"@Bean 方法的参数由 Spring 自动解析注入，等价于构造器注入；@Configuration + @Bean 适合装配没有源码、打不了注解的第三方类。详见[《Spring核心》](#/f/f15)","ref":"f15"},{"id":"q2ad30a65","kind":"select","cat":"框架","diff":"难","q":"Spring 中的 AOP 代理对象，通常是在 Bean 生命周期的哪个环节由 BeanPostProcessor 生成的？","opts":["实例化之前，由 InstantiationAwareBeanPostProcessor 预先生成","属性填充阶段，与依赖注入同时完成","postProcessAfterInitialization：初始化方法都执行完之后","postProcessBeforeInitialization：@PostConstruct 执行之前"],"a":"C","exp":"初始化链路是 Aware 回调 → postProcessBeforeInitialization → @PostConstruct/afterPropertiesSet/init-method → postProcessAfterInitialization，代理通常在最后一步由 AbstractAutoProxyCreator 生成，因此代理对象里的目标对象是\"完全初始化好的 Bean\"。详见[《Spring核心》](#/f/f15)","ref":"f15"},{"id":"q5e296137","kind":"select","cat":"框架","diff":"中","q":"在一个 `@Transactional(propagation = REQUIRED)` 的 orderCreate 方法中，跨 Bean 调用了另一个 `@Transactional(propagation = REQUIRES_NEW)` 的 saveLog 方法；saveLog 执行成功后 orderCreate 抛异常，结果是？","opts":["订单更新与日志一起回滚","订单更新与日志一起提交","日志回滚，订单更新提交","订单更新回滚，日志已经独立提交、不随之回滚"],"a":"D","exp":"REQUIRED 会加入当前事务，REQUIRES_NEW 则挂起当前事务另开一个并先行提交，外层回滚影响不到它——这正是\"业务失败但操作日志必须留痕\"的做法。注意 NESTED 相反：外层回滚时它一定回滚。详见[《Spring核心》](#/f/f15)","ref":"f15"},{"id":"qe28a399b","kind":"select","cat":"框架","diff":"中","q":"自动配置类中的 @Bean 方法标注了 @ConditionalOnMissingBean，而用户自己定义了一个同类型 Bean，结果是？","opts":["两个 Bean 都注册，注入时抛 NoUniqueBeanDefinitionException","用户定义的 Bean 被覆盖，自动配置的生效","自动配置的 Bean 不注册，用户定义的生效","必须再加 @Primary 才能决定用哪一个"],"a":"C","exp":"@ConditionalOnMissingBean 的含义是\"容器里没有同类型 Bean 才生效\"，所以用户的配置永远让位——这就是\"默认配置永远让位给你的配置\"，也是约定优于配置的实现方式。详见[《SpringBoot实战》](#/f/f16)","ref":"f16"},{"id":"q911d347d","kind":"select","cat":"框架","diff":"易","q":"下列哪个注解不属于 @SpringBootApplication 的组成部分？","opts":["@SpringBootConfiguration","@EnableAutoConfiguration","@ComponentScan","@MapperScan"],"a":"D","exp":"@SpringBootApplication 是三合一：@SpringBootConfiguration（本质是 @Configuration）、@EnableAutoConfiguration（自动配置开关）、@ComponentScan（扫描主类所在包及子包）。@MapperScan 是 MyBatis 扫描 Mapper 接口用的，需要自己加。详见[《SpringBoot实战》](#/f/f16)","ref":"f16"},{"id":"qe509fdad","kind":"select","cat":"框架","diff":"中","q":"`public interface TodoMapper extends BaseMapper<Todo> {}` 是一个完全空的接口，关于它的说法正确的是？","opts":["必须再手写一个实现类，否则启动就报错","只要起了这个名字，BaseMapper 就会为它生成多表关联查询","不写 XML 就无法进行任何数据库操作","继承即得单表 CRUD，无需实现类；多表复杂 SQL 仍要回到 XML 手写"],"a":"D","exp":"MyBatis-Plus 的定位是消灭单表 CRUD 的重复劳动，Condition 构造器还能省掉大量动态 SQL；但复杂关联查询仍推荐手写 XML——知道这条边界比背 API 重要。详见[《MyBatis》](#/f/f17)","ref":"f17"},{"id":"qa494fa09","kind":"select","cat":"框架","diff":"中","q":"只传 title 参数执行下面这段 update，`<set>` 标签起到的作用是？","opts":["把 set 关键字替换成 update，兼容不同数据库","参数全为空时生成 `SET WHERE`，需要自己兜底","只保留第一个生效的 if 内容，其余丢弃","自动去掉末尾多余的逗号，生成 `UPDATE todo SET title = ? WHERE id = ?`"],"a":"D","exp":"`<set>` 会智能追加 SET 关键字并删除末尾多余的逗号；与之对应 `<where>` 自动去掉开头的 AND/OR，两者底层都由 `<trim>` 实现。记忆口诀：if 拼接、where 去头、set 去尾。详见[《MyBatis》](#/f/f17)","ref":"f17"},{"id":"q22124499","kind":"select","cat":"框架","diff":"难","q":"MyBatis 二级缓存（namespace 级）在生产环境通常不开启，主要原因是？","opts":["二级缓存默认关闭，必须改造源码才能开启","二级缓存只在单个 SqlSession 内生效，命中率太低","其他 Mapper 更新了关联表时本 namespace 的缓存不会被清，容易读到旧数据","二级缓存的 key 只有 SQL 语句，与 namespace 无关，会互相覆盖"],"a":"C","exp":"二级缓存按 namespace 隔离、跨 SqlSession 共享，多表关联时任一张表被别的 Mapper 更新，本 namespace 感知不到，于是脏读；分布式部署下多节点缓存也不同步。生产一般关闭它，统一用 Redis 做缓存。详见[《MyBatis》](#/f/f17)","ref":"f17"},{"id":"q44f656ca","kind":"select","cat":"框架","diff":"难","q":"把 `mybatis-plus.configuration.map-underscore-to-camel-case` 显式设为 false，实体属性是 `LocalDateTime createdAt`、数据库列是 `created_at`，执行 `selectById`（没写 resultMap，SQL 也没起别名）的结果是？","opts":["正常映射：框架会自动把 created_at 改写成驼峰列名","createdAt 为 null：列名与属性名对不上，自动映射失败","启动直接报错，提示列名与属性名不匹配","查询抛异常，必须给该字段加 @TableField 才能启动"],"a":"B","exp":"下划线转驼峰是自动映射的一部分，关掉之后 `created_at` 找不到同名属性，字段就一直是 null，而程序不会报错——这类\"静默丢字段\"最难排查。生产建议保持开启，或在 SQL 里用别名 / resultMap 显式映射。详见[《MyBatis》](#/f/f17)","ref":"f17"},{"id":"q1355ad48","kind":"select","cat":"框架","diff":"易","q":"Gateway 路由配置里 `uri: lb://order-service` 中的 lb 表示？","opts":["从注册中心获取该服务的实例列表，负载均衡选一台发请求","直接按 yml 里写死的 IP 直连，不做负载均衡","只在本地开发环境生效，生产必须换成 http://","表示对这条路由使用长连接，减少握手开销"],"a":"A","exp":"lb 即 load balance：网关拿着服务名去注册中心取实例列表，再由负载均衡器选一台转发。写成 http://ip:port 就退化成写死地址，扩缩容后要改配置。详见[《SpringCloud微服务》](#/f/f18)","ref":"f18"},{"id":"q6435b7b1","kind":"select","cat":"框架","diff":"易","q":"Nacos 中 namespace 的主要作用是？","opts":["隔离同一个项目里的不同模块","用来做配置的灰度发布","隔离 dev/test/prod 等环境，环境之间配置与服务互不可见","决定配置项之间的加载优先级"],"a":"C","exp":"namespace 隔离环境，group 隔离项目/模块，配置按 `dataId + group + namespace` 三元组定位——这条常被答反。详见[《SpringCloud微服务》](#/f/f18)","ref":"f18"},{"id":"q6dbc4600","kind":"select","cat":"框架","diff":"中","q":"认证全局过滤器实现了 `getOrder()` 返回 -1，另一个全局过滤器返回 1，执行顺序是？","opts":["返回 -1 的先执行","返回 1 的先执行","两者并发执行，顺序不确定","getOrder 只对路由级过滤器生效，全局过滤器按注册顺序"],"a":"A","exp":"Ordered 的数值越小优先级越高、越先执行，鉴权过滤器返回 -1 就是为了在业务过滤器之前拦下未登录请求。详见[《SpringCloud微服务》](#/f/f18)","ref":"f18"},{"id":"qf0d1d364","kind":"select","cat":"框架","diff":"中","q":"Nacos 临时实例默认每 5s 上报一次心跳，实例多久未心跳会被标记为不健康、多久被剔除？","opts":["5s 不健康，15s 剔除","15s 不健康，30s 剔除","30s 不健康，60s 剔除","一次心跳丢失即标记不健康并立即剔除"],"a":"B","exp":"15s 未心跳标记不健康（此时仍会被调用方拿到，属于\"带病实例\"窗口），30s 未心跳才剔除；消费者本地还会缓存实例列表，注册中心短暂不可用时仍能按缓存调用。详见[《SpringCloud微服务》](#/f/f18)","ref":"f18"},{"id":"q9c51228f","kind":"select","cat":"框架","diff":"难","q":"接口用 `@SentinelResource(value = \"getProduct\", blockHandler = \"getProductBlock\", fallback = \"getProductFallback\")` 标注，并给它配了 QPS=2 的快速失败流控规则；快速刷新触发限流时请求会？","opts":["直接把 BlockException 抛给前端，返回 500","走 getProductFallback 方法","在队列中排队等待，直到令牌可用","走 getProductBlock 方法返回兜底结果"],"a":"D","exp":"blockHandler 专门处理限流/熔断等 BlockException（参数要与原方法一致、末尾多一个 BlockException），fallback 处理的是业务异常，两者别混。快速失败意味着不排队等待，直接走兜底。详见[《SpringCloud微服务》](#/f/f18)","ref":"f18"},{"id":"q2d36ff1d","kind":"select","cat":"单元测试","diff":"易","q":"Mockito 的 @Mock 对象，没有被 when 打桩的方法被调用时返回什么？","opts":["抛出 UnsupportedOperationException","对象类型返回 null，基本类型返回 0/false","返回真实实现的结果","编译不通过，必须先给所有方法打桩"],"a":"B","exp":"假对象默认返回空值，所以链式调用 `when(mock.getA().getB())` 会直接 NPE——这是最常见的坑；另外 MockitoExtension 默认 strict stubs，多余的打桩会直接报错，逼你删掉无用的桩。详见[《05-单元测试与工程质量》](#/f/f19)","ref":"f19"},{"id":"q998dc73c","kind":"select","cat":"单元测试","diff":"中","q":"关于 MockMvc，下列说法正确的是？","opts":["不启动真实端口，把模拟请求直接交给 DispatcherServlet 处理，用于测 Web 层","会启动内嵌 Tomcat 并监听随机端口，因此能测到过滤器完整链路","必须连接真实数据库才能断言响应","只能发送 GET 请求，POST 要用 TestRestTemplate"],"a":"A","exp":"MockMvc 省去了真实网络与端口，配合 @WebMvcTest 只加载 Controller/Advice/序列化等 Web 层组件，Service 要用 @MockBean 顶替（切片里没有这个 Bean，用 @Mock 注入不进去）。需要覆盖过滤器/拦截器完整链路时，才改用 RANDOM_PORT 的真实端口方案。详见[《05-单元测试与工程质量》](#/f/f19)","ref":"f19"},{"id":"qadf3e6f4","kind":"select","cat":"单元测试","diff":"中","q":"`@ParameterizedTest @CsvSource({\"' ', false\", \"'', false\", \"'写周报', true\"})` 修饰的测试方法会怎样执行？","opts":["只执行一次，取最后一行参数","执行 3 次，每次注入 CSV 中的一行参数","编译报错，参数化测试必须同时加 @Test","随机挑选其中一行执行，用来做随机测试"],"a":"B","exp":"参数化测试把 N 个用例写成 1 个方法，@CsvSource 每行一组参数；单参数可用 @ValueSource，复杂对象用 @MethodSource 提供 Stream。注意 @ParameterizedTest 本身已替代 @Test，再加 @Test 反而会因缺参数而失败。详见[《05-单元测试与工程质量》](#/f/f19)","ref":"f19"},{"id":"qe37a9a1a","kind":"select","cat":"单元测试","diff":"中","q":"测试中 ArgumentCaptor 的作用是？","opts":["捕获被 mock 方法实际收到的参数，用于断言传进去的到底是什么","捕获被测方法抛出的异常并断言异常消息","统计某个方法被调用的次数","捕获被测类的日志输出并做断言"],"a":"A","exp":"verify 只能断言\"调没调、调几次\"，参数捕获才能断言\"传了什么\"——例如校验落库对象里的 createBy 是否被正确填充；调用次数用 `times()/never()`，限时用 assertTimeoutPreemptively。详见[《05-单元测试与工程质量》](#/f/f19)","ref":"f19"},{"id":"q1445ab69","kind":"select","cat":"认证与安全","diff":"易","q":"为什么\"忘记密码\"只能重置，不能把原密码发给用户？","opts":["服务端存的是 BCrypt 这类单向哈希，本来就无法还原出原密码","原密码只存在 Redis 里，过了期就取不到了","原密码用 AES 加密存储，但密钥在重启后丢失","只是合规要求，技术上完全可以还原"],"a":"A","exp":"哈希是单向的，服务端连自己都无法还原——这正是\"存的是哈希\"的证明。要区分三个概念：哈希单向不可逆（存密码）、加密双向有密钥（存手机号等要还原的数据）、编码只是格式转换不算安全手段。详见[《06-认证与安全》](#/f/f20)","ref":"f20"},{"id":"q738a281b","kind":"select","cat":"认证与安全","diff":"易","q":"下面哪一项描述的是 XSS 及其正确防御？","opts":["用户输入被拼进 SQL 改变语义，防御靠预编译占位符","评论内容里的脚本被浏览器当成代码执行，防御靠输出转义、HttpOnly Cookie 与 CSP","借用户已登录的 Cookie 诱导浏览器发出伪造请求，防御靠 SameSite 与 CSRF Token","伪造 JWT 签名冒充他人，防御靠改用 RS256 并把密钥藏好"],"a":"B","exp":"记忆锚点：SQL 注入是\"数据在数据库被当代码执行\"，XSS 是\"数据在浏览器被当代码执行\"，CSRF 是\"请求冒充了合法用户\"。HttpOnly 让脚本读不到 Cookie，正是为了压缩 XSS 窃取凭据的收益。详见[《06-认证与安全》](#/f/f20)","ref":"f20"},{"id":"qa952d3d4","kind":"select","cat":"认证与安全","diff":"中","q":"对同一个密码连续调用两次 `encoder.encode(raw)`，得到的哈希串不同，原因是？","opts":["BCrypt 在结果里混入了时间戳，每次都不一样","BCrypt 会先把密码倒序，顺序随当前时间变化","结果串被 Base64 编码时会引入随机字符","每次都会随机生成盐并连同结果一起保存，比对时用同一个盐重算"],"a":"D","exp":"盐是随机生成并写在哈希串里的，所以同一密码每次结果都不同，彩虹表直接失效；BCrypt 还是慢哈希，把 GPU 暴力破解的成本抬高几个数量级。比对必须用 `matches(raw, encoded)`，不能自己再 encode 一次比字符串。详见[《06-认证与安全》](#/f/f20)","ref":"f20"},{"id":"q539bb52c","kind":"select","cat":"认证与安全","diff":"中","q":"下列做法中，真正用于防御 CSRF 的是？","opts":["对用户输入统一做 HTML 转义","给会话 Cookie 加上 HttpOnly 属性","校验 Origin/Referer，并使用 SameSite Cookie 与 CSRF Token","全站强制 HTTPS 加密传输"],"a":"C","exp":"CSRF 的核心是浏览器自动带上目标站 Cookie，所以要么让浏览器不自动带（SameSite），要么要求请求带一个攻击者拿不到的凭证（CSRF Token），要么校验来源。A、B 是 XSS 防御，D 防的是窃听与篡改，都挡不住伪造请求。加分点：Header + JWT 方案因为不会自动携带 Authorization 头，天然免疫大半。详见[《06-认证与安全》](#/f/f20)","ref":"f20"},{"id":"qb999e30b","kind":"select","cat":"认证与安全","diff":"难","q":"JWT 无状态带来\"注销难\"，工程上较完整的解法是？","opts":["把有效期设为永久，避免过期带来的登录中断","服务端为每个签发的 JWT 保存完整会话，注销时删掉","短期 Access Token + 可吊销的 Refresh Token，配合 Redis 黑名单与改密后强制失效","注销时前端删除本地存储的 token 即可"],"a":"C","exp":"JWT 的无状态是用\"吊销难\"换来的：服务端不存会话，只能等它自然过期。务实做法是缩短 Access Token 寿命、把长期凭证换成存库可吊销的 Refresh Token，再用 Redis 黑名单兜底；B 等于把 JWT 用回了 Session，D 毫无作用——token 仍然有效。详见[《06-认证与安全》](#/f/f20)","ref":"f20"},{"id":"qcda3a21c","kind":"select","cat":"分布式与高并发","diff":"易","q":"关于 MySQL 读写分离，下列说法正确的是？","opts":["读写分离能同时解决读压力、写压力和数据量增长三个问题","读写分离把读请求分摊到从库以缓解读压力，但不解决单表数据量与写压力","读写分离要求从库与主库强一致，因此不存在复制延迟","读写分离后所有查询都应走从库，包括下单后立刻查订单"],"a":"B","exp":"主从复制是异步的，延迟通常毫秒级，但大事务、从库负载高时会放大到秒级，所以\"写后立刻读\"的关键路径必须强制走主库。读写分离只分担读；数据量增长与写压力要靠分库分表，这是两条不同的扩展路线。详见[《02-高并发系统设计》](#/f/f30)","ref":"f30"},{"id":"qde3753a0","kind":"select","cat":"分布式与高并发","diff":"难","q":"某电商大促期间机房网络抖动，注册中心集群被切成两个分区。运维观察到：部分调用方拿到的实例列表里仍有已下线的节点，调用报错；但注册中心控制台仍能打开，也能继续注册新实例。该注册中心最可能是哪种取向，代价是什么？","opts":["CP 取向，因为控制台可用就证明数据一致","CP 取向，代价是重新选举期间整个集群拒绝服务","AP 取向，各分区独立对外服务，代价是分区期间可能读到过期的实例列表，需要调用方靠重试与熔断兜底","与 CAP 无关，注册中心只负责存储，不参与任何取舍"],"a":"C","exp":"节点对等、任一节点可用即可完成注册发现、宁可返回旧列表也不整体不可用，这是典型 AP 表现（Eureka、Nacos 默认的临时实例）。CP 的对照面是 ZooKeeper：主节点宕机后需重新选举，期间整个集群不可用（可达数十秒到两分钟），宁停服不脏读。选型看的是\"业务能不能容忍读到旧实例列表\"，而不是谁更先进。详见[《01-分布式理论基础》](#/f/f29)","ref":"f29"},{"id":"q591d77c0","kind":"select","cat":"分布式与高并发","diff":"易","q":"缓存集群从 3 个节点扩到 4 个，运维只改了应用里的取模基数，随后数据库压力陡增。最直接的原因是？","opts":["取模基数一变，绝大多数 key 的落点都变了，缓存几乎全部失效","新节点上的槽位需要时间预热，预热期间读请求会穿透到数据库","客户端没有预热，冷启动必然打满数据库","4 个节点无法组成集群，必须使用奇数节点"],"a":"A","exp":"`hash(key) % N` 的落点与 N 强绑定，N 从 3 变 4 时只有极少数 key 恰好落回原节点，等于整层缓存被清空。一致性哈希把取模换成\"哈希环 + 顺时针寻址\"，增删节点只影响相邻区段，迁移量约 1/N。要能顺口说出\"为什么是 1/N\"：只有新节点逆时针到上一个节点之间的那段数据需要搬家。详见[《01-分布式理论基础》](#/f/f29)","ref":"f29"},{"id":"q2c140253","kind":"select","cat":"分布式与高并发","diff":"易","q":"一致性哈希引入\"虚拟节点\"主要是为了解决什么问题？","opts":["降低哈希计算的复杂度","让节点之间自动同步数据副本","保证任意时刻都能读到最新数据","物理节点较少时在环上分布不均造成的数据倾斜"],"a":"D","exp":"节点少的时候，几台机器在 2^32 的环上可能挤在一起，导致大部分数据压在同一台上。给每个物理节点生成 100~200 个虚拟节点散布到环上，数据先落到虚拟节点再映射回物理节点，分布就均匀了；某个节点下线时压力也会由多台分摊，而不是全给它的顺时针后继。详见[《01-分布式理论基础》](#/f/f29)","ref":"f29"},{"id":"q1f766dd6","kind":"select","cat":"分布式与高并发","diff":"易","q":"分库分表后引入全局 ID，除了唯一性，选型时最需要关注的性质是？","opts":["生成的 ID 必须足够短","趋势递增，让 B+ 树顺序插入、避免频繁页分裂","必须包含业务含义，能从 ID 直接看出下单时间","必须由数据库集中生成以保证绝对不重复"],"a":"B","exp":"分表后单表自增只能保证表内唯一，必须引入全局发号器。趋势递增是关键：UUID 无序，插入时页分裂多、写放大严重，还占 36 个字符；雪花算法与号段模式都能趋势递增，且本地或半本地生成，不把发号变成新的单点。详见[《01-分布式理论基础》](#/f/f29)","ref":"f29"},{"id":"q1d583e7f","kind":"select","cat":"分布式与高并发","diff":"中","q":"某订单服务用雪花算法生成 ID，线上只部署了 1 个 worker。大促零点峰值下单量实测约 500 万 ID/秒，仅从雪花算法的结构看能否撑住？","opts":["够，12 位序列号表示每毫秒 4096 个，合每秒 4096 万","够，时间戳是毫秒级的，一毫秒内可以无限生成","不够，单 worker 每毫秒最多 4096 个 ID，每秒上限约 409 万，需拆分 workerId 或改用号段模式","不够，雪花算法的单机上限只有每秒 10 万，必须依赖 Redis 发号"],"a":"C","exp":"12 位序列号在**同一毫秒内**只提供 0~4095 共 4096 个 ID，乘 1000 毫秒即约 409.6 万/秒，这是单 worker 的理论天花板；序列号在一毫秒内打满后只能阻塞到下一毫秒，表现为延迟毛刺。百万级 QPS 要么拆 workerId（10 位机器 ID 最多 1024 台），要么改用号段模式——一次取一段缓存在内存，把发号压力摊薄。详见[《01-分布式理论基础》](#/f/f29)","ref":"f29"},{"id":"q339614da","kind":"select","cat":"分布式与高并发","diff":"中","q":"Redisson 的看门狗（watchdog）自动续期，在什么条件下才会生效？","opts":["只要调用了 tryLock 就会生效","只有方法上加了 @Transactional 才会生效","锁被其他线程抢占后会自动续期","加锁时没有显式指定 leaseTime 才生效，默认 30 秒过期、约每 10 秒续一次"],"a":"D","exp":"不传 leaseTime 时 Redisson 默认给 30 秒过期，并启动后台线程按 1/3 周期（约 10 秒）检查续期，业务没执行完锁就不会失效。一旦显式传了 leaseTime，等于声明\"超时我自己负责\"，看门狗不再介入——业务跑超时也没人救，这是线上最常见的踩坑点。释放时配合 `isHeldByCurrentThread()` 判断，避免误删他人重新抢到的锁。详见[《01-分布式理论基础》](#/f/f29)","ref":"f29"},{"id":"q086c41da","kind":"select","cat":"分布式与高并发","diff":"中","q":"某服务用 Redis 单实例 + 主从（哨兵）实现分布式锁，以主节点写入成功为准。一次主节点宕机触发切换后，出现了两个请求同时进入扣减逻辑。原因是？","opts":["主从复制是异步的，锁还没同步到从库主节点就宕机了，切换后新主节点上根本没有这把锁","哨兵会自动删除所有带过期时间的 key","从库提升为主库后会清空全部数据","SET NX 命令在主从架构下不生效"],"a":"A","exp":"A 在旧主写锁成功，这条写命令尚未同步到从库，旧主就宕机了；从库被提升为新主后锁并不存在，B 于是也能加锁成功，互斥被打破。这是\"Redis 锁可靠性中等\"的根因，也是 Redlock 试图解决的问题。对绝对不能出错、且能接受性能代价的场景（选主、元数据变更），应换用 ZooKeeper 的临时节点锁。详见[《01-分布式理论基础》](#/f/f29)","ref":"f29"},{"id":"q418df54b","kind":"select","cat":"分布式与高并发","diff":"中","q":"用 ZooKeeper 实现公平锁时，每个客户端只监听自己前一个顺序节点的删除事件，而不是监听 /locks 下所有子节点的变化，目的是？","opts":["减少 ZK 集群的磁盘写入量","让锁支持可重入","避免羊群效应：一次释放唤醒全部等待者，绝大多数抢不到还要重新注册监听，形成无效广播","绕过 ZAB 协议过半提交的限制"],"a":"C","exp":"如果所有人都监听父节点，每次释放锁都会唤醒全部等待者，它们抢不到锁只能重新注册，白白制造一轮惊群。只 watch 前一个节点，锁释放时恰好唤醒队首的下一个，天然形成公平队列。ZK 锁的另一优势是临时节点随会话消失，客户端宕机锁自动释放，不会死锁；代价是写要走 ZAB 过半提交，性能不如 Redis。详见[《01-分布式理论基础》](#/f/f29)","ref":"f29"},{"id":"q91303e77","kind":"select","cat":"分布式与高并发","diff":"难","q":"TCC 中的\"悬挂\"指的是哪种时序问题？","opts":["Try 先到、Confirm 迟迟不来，资源被长期冻结","Confirm 重试导致资源被重复扣减","参与方没收到 Try 却先收到 Cancel，回滚了一笔不存在的业务","Cancel 先执行完，迟到的 Try 才落地并冻结资源，此后没有任何事务会再来解冻它"],"a":"D","exp":"C 描述的是**空回滚**——Try 从未执行，Cancel 却先到，若不识别就会误改数据；D 才是**悬挂**，Cancel 已走完，迟到的 Try 又把资源冻上，这笔冻结永远不会被释放。两者都靠\"事务状态表 + 幂等控制\"化解：执行 Cancel 前先查/插入状态记录（区分\"从未 Try\"与\"Try 成功\"），Try 落地前也先校验状态，发现已回滚就拒绝执行。详见[《01-分布式理论基础》](#/f/f29)","ref":"f29"},{"id":"q42653869","kind":"select","cat":"分布式与高并发","diff":"难","q":"关于\"本地消息表\"与\"RocketMQ 事务消息\"的可靠性差异，下列说法最准确的是？","opts":["两者完全等价，只是把消息表放在了不同位置","本地消息表把业务写入与消息记录放在同一个本地事务里，MQ 当时不可用也不影响业务提交；事务消息依赖 Broker 回查生产者，生产者长时间不可达时消息会悬而未决","事务消息不依赖任何回查机制，因此可靠性一定强于本地消息表","本地消息表必须依赖 XA 两阶段提交才能保证原子性"],"a":"B","exp":"本地消息表的核心是\"业务数据和待发消息在同一个本地事务里落库\"，业务提交与消息留存天然原子，MQ 挂了也不影响下单，后台任务慢慢投递即可；代价是与业务耦合、消息表要定时清理。事务消息相当于把这张表搬进 Broker（半消息 + 定时回查），业务零侵入，但最终状态取决于生产者能否被回查触达。两者都是最终一致，不是强一致。详见[《01-分布式理论基础》](#/f/f29)","ref":"f29"},{"id":"qc15cc7df","kind":"select","cat":"分布式与高并发","diff":"中","q":"某接口用固定窗口限流，阈值 100 次/秒。客户端在某一秒的最后 0.1 秒发了 100 个请求，紧接着在下一秒的前 0.1 秒又发了 100 个，全部放行。这 0.2 秒里实际通过了多少请求，说明什么？","opts":["100 个，限流器工作正常","150 个，属于统计误差","200 个，固定窗口在边界处最坏可放行 2 倍阈值，即临界突刺","0 个，应当全部被拒绝"],"a":"C","exp":"固定窗口只统计\"当前这一秒\"的计数，跨边界的两批请求分属不同窗口，各自都没超限，于是交界处最坏能通过 2 倍配额。滑动窗口把大窗口切成小格子统计\"最近 N 秒\"，把突刺摊平（Sentinel 采用）；令牌桶则用桶容量限制瞬时突发。详见[《02-高并发系统设计》](#/f/f30)","ref":"f30"},{"id":"q3ea90971","kind":"select","cat":"分布式与高并发","diff":"难","q":"某服务调用下游的超时率从 1% 涨到 60%，平均耗时从 20ms 涨到 80ms。熔断器跳闸进入\"打开\"状态后，正确的后续行为是？","opts":["打开状态持续一个冷却窗口，其间请求直接快速失败；冷却结束进入半开，只放行少量探测请求，成功率恢复则关闭熔断器，否则重新打开并重新计时","打开后永久拒绝，必须人工重启服务才能恢复","打开后立刻放行全部请求，靠客户端重试自愈","打开与关闭以固定 1 秒为周期交替切换"],"a":"A","exp":"断路器是\"关闭 → 打开 → 半开\"的闭环。打开期间直接快速失败、不再真正调用下游，避免调用方线程被慢请求拖死形成雪崩；冷却结束进入半开，只放极少量探测请求试探下游是否恢复，成功则回到关闭，失败则回到打开重新计时。注意半开不等于预热放量（Warm Up）：前者是试探，后者是让流量爬坡。另需留意，平均耗时会被长尾掩盖，熔断策略更常看慢调用比例与异常比例。详见[《02-高并发系统设计》](#/f/f30)","ref":"f30"},{"id":"q5db810d7","kind":"select","cat":"系统设计","diff":"中","q":"要判断 10 亿条 URL 是否已经抓取过，团队先试了 Redis SET，算完内存账后放弃。若误判率要求约 1%，改用布隆过滤器大约需要多少内存？","opts":["约 120MB","约 12GB","约 1.2GB","约 120GB"],"a":"C","exp":"Redis SET 存 10 亿条、单条约 32 字节，光数据就约 32GB，加上哈希表本身的桶开销更贵。布隆过滤器在 1% 误判率下约需 9.6 bit/元素，10 亿 × 9.6 bit ≈ 1.2GB，差了一个多数量级——这就是它赢的地方。代价是只能回答\"可能存在 / 一定不存在\"，且标准布隆不支持删除。详见[《03-系统设计场景题》](#/f/f31)","ref":"f31"},{"id":"q0b3a4053","kind":"select","cat":"系统设计","diff":"难","q":"承接上题，布隆过滤器的位数组长度 m 与哈希函数个数 k 需按容量 n 和目标误判率 p 推算。若 p 定为 1%，下列哪组取值最接近？","opts":["m/n ≈ 4 bit，k ≈ 2","m/n ≈ 9.6 bit，k ≈ 7","m/n ≈ 20 bit，k ≈ 14","m/n ≈ 1 bit，k ≈ 1"],"a":"B","exp":"由 `m = -n·lnp/(ln2)²` 与 `k = (m/n)·ln2` 可得：p=1% 时约 9.6 bit/元素、k≈7；p=0.1% 时约 14.4 bit/元素。k 不是越大越好，超过最优值后位数组被置 1 的比例上升，误判率反而回升。工程上容量 n 估小了会让实际 p 迅速恶化，所以通常按预估峰值的两倍以上设计并定期重建。详见[《03-系统设计场景题》](#/f/f31)","ref":"f31"},{"id":"q543dbcc9","kind":"select","cat":"系统设计","diff":"中","q":"短链服务预计每年新增 1 亿条，团队坚持用自增 ID + Base62 生成短码，长度固定 6 位。仅从编码容量看，6 位够用多久？","opts":["不够，62^6 只有约 5.7 亿，两年就耗尽","够用 3 年，之后必须换成 8 位","不够，Base62 只能表示纯数字，承载不了 1 亿条","非常宽裕，62^6 ≈ 568 亿，按每年 1 亿条也能用几百年"],"a":"D","exp":"Base62 用 0-9、A-Z、a-z 共 62 个字符作\"数字\"，6 位空间为 62^6 ≈ 568 亿，按 1 亿/年算足够用几百年。所以短链的瓶颈从来不在短码长度而在读：读多写少约 100:1，热点短码靠本地缓存 + Redis 两级缓存扛，不存在的短码用布隆过滤器提前挡掉，避免每一次瞎猜都打穿到 DB。详见[《03-系统设计场景题》](#/f/f31)","ref":"f31"},{"id":"q2c3e8268","kind":"select","cat":"系统设计","diff":"难","q":"秒杀扣减库存有三种常见做法：① DB 直接 `UPDATE stock SET num=num-1 WHERE id=? AND num>0`；② Redis + Lua 预扣成功后发 MQ 异步落库；③ 请求全量进 MQ，消费端串行扣减。某活动 100 万用户抢 1 万件，峰值读 QPS 约 10 万、真正下单写约 1 万。下列判断正确的是？","opts":["只用 ① 会让 10 万级读请求全部打到 DB、连接池瞬间打满；② 把绝大部分无效流量挡在 Redis 层，DB 只承接队列匀速来的写，因此是主流方案；③ 的代价是用户长时间排队等待、反馈延迟大","① 最可靠，应当用它扛下全部流量","② 只要 Redis 预扣成功就绝不会超卖，DB 层不需要再兜底","③ 最优，因为它能让每个请求都立刻拿到结果"],"a":"A","exp":"这题考\"每一层挡掉什么\"。DB 条件更新（`AND num > 0`）是防超卖的**最后一道保险**，行锁加上影响行数为 0 即回滚，但它扛不住 10 万级 QPS；Redis + Lua 把\"查库存 + 扣减\"做成原子操作，在内存里挡掉绝大多数无效请求，再发 MQ 让 DB 匀速落库；全量进 MQ 等于把压力推给排队，用户拿不到即时反馈。C 的陷阱在于 Redis 与 DB 之间仍有不一致窗口（宕机丢数据、超时未支付要回补），所以那层条件更新必须保留，并配合定时对账。详见[《02-高并发系统设计》](#/f/f30)","ref":"f30"},{"id":"qada31a19","kind":"select","cat":"系统设计","diff":"易","q":"订单 15 分钟未支付要自动关闭。下列方案中，最不推荐用于生产环境的是？","opts":["RocketMQ 延迟消息 / 定时消息","RabbitMQ 死信队列 + TTL（或延迟插件）","JDK 的 DelayQueue，服务重启后重新装载一遍","Redis ZSET，score 存执行时间，后台轮询 ZRANGEBYSCORE"],"a":"C","exp":"DelayQueue 是纯内存的优先级队列，单机、重启即全丢，多实例部署时每个实例还会各关一遍单。它适合进程内的短延时任务，不适合承担订单超时这类必须可靠触发的业务。生产上优先 MQ 延迟消息（业务解耦、消息不丢），量大时用时间轮或调度平台；无论哪种实现，关单动作都要幂等并带状态校验。详见[《03-系统设计场景题》](#/f/f31)","ref":"f31"},{"id":"q322df1df","kind":"select","cat":"系统设计","diff":"中","q":"关单任务与支付成功回调几乎同时到达，最稳妥的防冲突做法是？","opts":["给关单加分布式锁，支付回调不加锁","两边都用条件更新，例如关单执行 `UPDATE orders SET status=已关闭 WHERE id=? AND status=待支付`，影响行数为 0 说明已被回调改过，直接放弃","把关单时间设在支付超时之后 1 秒，靠时间差避开","先 `SELECT` 查一次状态，是待支付就关单"],"a":"B","exp":"A 只给一边加锁，另一边照样能改，等于没锁；D 的\"先查后改\"之间存在窗口——查完是待支付，改之前回调已把状态改成已支付，结果出现\"已支付却被关闭\"。正确做法是把判断与修改合并成一条带状态条件的 UPDATE，借数据库行锁保证原子性，两边都这么做，谁先到谁生效，这就是状态机 + 条件更新的通用写法。详见[《03-系统设计场景题》](#/f/f31)","ref":"f31"},{"id":"q67973693","kind":"select","cat":"系统设计","diff":"中","q":"微博类 Feed 流中，某大 V 有 3000 万粉丝。若采用写扩散（推模式），发一条微博会发生什么？通常怎么处理？","opts":["没有问题，推模式读性能最好，应对所有用户统一使用","只影响大 V 自己的发博耗时，对系统整体无影响","应改为所有人统一用读扩散，彻底放弃写扩散","一次发文要写 3000 万份收件箱，写放大严重且会长时间占满队列；标准做法是推拉结合，按粉丝量设阈值（如 10 万），大 V 走读扩散、普通用户走写扩散"],"a":"D","exp":"推模式把成本放在写侧，粉丝千万级时一次发文就是千万次写入，即便分批 + 异步也会长时间积压；拉模式把成本放在读侧，粉丝一刷新就要聚合关注列表，延迟高。推拉结合按粉丝量划线：普通用户写扩散保证读得快，大 V 走读扩散避免写爆炸，粉丝读时再把大 V 的内容合并进来。收件箱一般只存最近 N 条 ID，翻页回源 DB，删除与可见性在读取时过滤。详见[《03-系统设计场景题》](#/f/f31)","ref":"f31"},{"id":"q5aeaf30e","kind":"select","cat":"工具链","diff":"易","q":"已经执行过 `git add`，但还没提交，现在想让文件退出暂存区、已做的修改保留在工作区，应该用？","opts":["`git restore --staged <file>`","`git restore <file>`","`git reset --hard HEAD`","`git rm --cached <file>` 后再重新 add"],"a":"A","exp":"restore 不带参数撤的是工作区（改动作废），加了 --staged 撤的是暂存区（改动保留）；老写法 `git reset HEAD <file>` 同义。`git rm --cached` 是把文件移出版本控制，文件会变成未跟踪状态，不是\"退出暂存\"的正确姿势。详见[《04-开发工具链-Git-Maven-Linux》](#/f/f12)","ref":"f12"},{"id":"q62bd5d26","kind":"select","cat":"工具链","diff":"易","q":"Maven 坐标中，用于唯一标识一个构件所必需的三要素是？","opts":["groupId、packaging、classifier","artifactId、scope、version","groupId、artifactId、version","groupId、artifactId、packaging"],"a":"C","exp":"packaging 缺省为 jar、classifier 缺省为空，用于区分同一 POM 产出的不同构件，都不是定位构件的必需项；scope 只决定依赖在哪几套 classpath 上生效，与\"找到哪个包\"无关。详见[《04-开发工具链-Git-Maven-Linux》](#/f/f12)","ref":"f12"},{"id":"q1af1ec3e","kind":"select","cat":"工具链","diff":"易","q":"线上停服务时先执行 `kill -15 <pid>` 而不是直接 `kill -9 <pid>`，主要原因是？","opts":["-15 更快，-9 要等内核调度一轮才生效","-15 发送 SIGTERM，进程可以捕获并执行 shutdown hook 做优雅下线；-9 是 SIGKILL，进程没有清理机会","-9 需要 root 权限，普通用户发不出去","-15 只是把进程挂起，-9 才真正结束进程"],"a":"B","exp":"SIGTERM 可被捕获，JVM 会跑 shutdown hook、Spring 能优雅摘流量再下线；SIGKILL 由内核直接终止，连接、锁、临时文件、消息 ACK 都可能残留，所以生产先试 -15。详见[《04-开发工具链-Git-Maven-Linux》](#/f/f12)","ref":"f12"},{"id":"q11c36fa8","kind":"select","cat":"工具链","diff":"中","q":"对已经 push 到公共 develop 分支的三个提交执行 `git rebase -i` 压缩后强推，会带来什么后果？","opts":["只有自己的本地仓库受影响，其他人毫无感知","远程仓库会拒绝一切强推，这个命令必然失败","提交被重写成新的 sha，协作者本地仍指向旧历史，各自拉取或强推会互相冲掉对方的提交","三个提交的内容会永久丢失，reflog 也捞不回来"],"a":"C","exp":"\"已经 push 到公共分支的提交禁止 rebase\"针对的就是 sha 被重写这一点：内容没变，但所有下游都成了孤儿历史。D 错在\"永久丢失\"——内容还在悬空对象里，可借助 reflog 找回。详见[《04-开发工具链-Git-Maven-Linux》](#/f/f12)","ref":"f12"},{"id":"q58040896","kind":"select","cat":"工具链","diff":"中","q":"要一条命令统计 access.log 中 5xx 响应占全部请求的比例，`awk` 写法正确的是？","opts":["`awk '$9>=500{e++} END{print e/NR}' access.log`","`awk '$9==500' access.log | wc -l`","`grep 500 access.log | sort -rn | head`","`awk '{print $9}' access.log | uniq -c`"],"a":"A","exp":"awk 逐行累加 5xx 计数，NR 是总行数，END 块里相除即得占比；B 只统计了恰好 500 的行、也没有算比值，C 排序后取头部与比例无关，D 少了 uniq 需要的预先排序。详见[《04-开发工具链-Git-Maven-Linux》](#/f/f12)","ref":"f12"},{"id":"q3aec0516","kind":"select","cat":"工具链","diff":"难","q":"误执行 `git reset --hard HEAD~2` 之后，`git reflog` 能帮你做到什么？","opts":["只能恢复工作区里还没提交过的改动，已提交内容一律找不回","能把 reset 丢掉的提交找回来——只要对应 sha 还出现在 reflog 记录里、对象尚未被 gc 回收","能把分支恢复成任意历史状态，包括从未被 HEAD 指向过的提交","只是把 reset 命令重新执行一遍，本身不含恢复能力"],"a":"B","exp":"reflog 记录的是 HEAD 的每一次移动，`git reset --hard <reflog 中的 sha>` 就能把分支挪回去；局限在于它只覆盖\"曾经成为过 HEAD\"的位置，且悬空对象过了 gc 期限就真的没了。详见[《04-开发工具链-Git-Maven-Linux》](#/f/f12)","ref":"f12"},{"id":"q3fbb003c","kind":"select","cat":"工具链","diff":"中","q":"`mvn install` 与 `mvn deploy` 的关键区别是？","opts":["install 只打包不跑测试，deploy 会重新执行测试","install 把构件装进本地 ~/.m2 仓库供本机其他项目依赖，deploy 推送到远程私服供团队共享","两者完全等价，deploy 只是 install 的别名","install 会跳过 compile 阶段，deploy 不会"],"a":"B","exp":"生命周期是一条顺序链，两个命令都是\"执行到该阶段并连带跑完前面所有阶段\"，所以都会经过 compile 与 test；差别只在终点：一个是本地仓库，一个是远程私服 Nexus。详见[《04-开发工具链-Git-Maven-Linux》](#/f/f12)","ref":"f12"},{"id":"q5bc31473","kind":"select","cat":"工具链","diff":"难","q":"依赖树如下：A→B→C→X:1.5（深度 3）、A→D→X:1.0（深度 2），且 A 的 pom 中 B 声明在 D 之前。最终生效的 X 版本是？","opts":["1.5，因为同深度时先声明者胜，B 在 D 前面","两个版本都会被打进包里，由类加载顺序决定用哪个","直接报依赖冲突错误，构建失败","1.0，因为路径最短者优先，声明顺序只在路径等长时才参与裁决"],"a":"D","exp":"Maven 依赖调解先比路径深度、再比声明顺序，两个原则冲突时\"路径短的完胜\"，所以这里声明顺序根本轮不上。1.0 生效后若 C 用到了 1.5 才有的方法，运行期就会抛 NoSuchMethodError——这也解释了为什么这类错误编译期不报。详见[《04-开发工具链-Git-Maven-Linux》](#/f/f12)","ref":"f12"},{"id":"qdc6fc1ad","kind":"select","cat":"设计模式","diff":"易","q":"枚举单例被《Effective Java》推荐为最佳写法，主要因为它天然免疫了哪两种破坏手段？","opts":["反射强开私有构造、反序列化时新建实例","多线程并发创建、指令重排序","类加载器重复加载、JIT 激进优化","内存溢出、GC 提前回收对象"],"a":"A","exp":"JVM 保证枚举常量的构造只执行一次，反射创建枚举会直接被 JDK 拒绝；枚举的序列化按名字查找、反序列化返回同一常量。多线程安全只是它顺带的好处，不是\"天然免疫破坏\"所指的靶点。详见[《07-设计模式》](#/f/f8)","ref":"f8"},{"id":"qd0ea6b34","kind":"select","cat":"设计模式","diff":"易","q":"用策略模式重构一长串 `if (\"WECHAT\".equals(type)) ... else if ...`，Spring 项目里最常见的落地方式是？","opts":["把所有分支方法改成 static，避免反复创建对象","用更长的 switch 替换 if-else，提升可读性","把分支逻辑整体上移到父类，让子类重写整个方法","每个分支抽成一个策略实现类，用 `Map<String, 策略>` 分发（构造器注入 `List<策略>` 自动收集）"],"a":"D","exp":"注入 `List<PayStrategy>` 后按 `type()` 建表，新增渠道只需加一个 @Component 类、Context 一行不改，这正是开闭原则的落地。C 描述的是模板方法的形状，而且\"重写整个方法\"并没有消除分支。详见[《07-设计模式》](#/f/f8)","ref":"f8"},{"id":"q748a79d7","kind":"select","cat":"设计模式","diff":"中","q":"装饰器模式与代理模式结构相似，核心差别在于？","opts":["装饰器只能包装一个对象，代理可以同时包装多个","装饰器关注给对象叠加功能、通常由调用方层层包装；代理关注控制对目标的访问、通常由框架生成","装饰器基于继承实现，代理基于组合实现","装饰器必须继承目标类，代理必须实现与目标相同的接口"],"a":"B","exp":"`new BufferedReader(new InputStreamReader(new FileInputStream(f)))` 是调用方手工套娃，一层加一种能力（字节→字符→缓冲）；AOP 生成的代理则是框架替你控制访问。结构可以一样，意图不同才是区分点。详见[《07-设计模式》](#/f/f8)","ref":"f8"},{"id":"qa9ede933","kind":"select","cat":"设计模式","diff":"中","q":"Servlet 的 `Filter` 链与策略模式最关键的区别是？","opts":["Filter 链上只有一个过滤器会真正生效","策略模式的多个实现类在运行期也会被依次全部执行","Filter 链上多个处理者会依次处理同一个请求、顺序本身有语义；策略模式通常只命中一个实现","两者没有本质区别，Filter 链就是策略模式的一种写法"],"a":"C","exp":"`chain.doFilter()` 把请求交给下一个处理者，可以全链走完也可以中途断链，注册顺序会改变行为；策略是客户端选定一个算法后命中即止。这也是\"责任链可能多个处理者参与、策略只命中一个\"的由来。详见[《07-设计模式》](#/f/f8)","ref":"f8"},{"id":"q1ffc5eef","kind":"select","cat":"设计模式","diff":"中","q":"AQS 的 `acquire()` 固定了\"尝试获取→失败入队→阻塞等待\"的骨架，把 `tryAcquire` 留给子类实现，这属于哪种模式？","opts":["策略模式：整个算法可以在运行期被替换","责任链模式：请求沿处理者链传递","模板方法模式：父类定算法骨架，把某些步骤作为钩子留给子类","观察者模式：状态变化后自动通知订阅者"],"a":"C","exp":"ReentrantLock、Semaphore、CountDownLatch 各自实现 tryAcquire/tryRelease，但排队与唤醒的流程骨架完全复用、编译期就固定。策略与模板方法的分界正在这里：前者整个算法可换，后者只有局部步骤可变。详见[《07-设计模式》](#/f/f8)","ref":"f8"},{"id":"q5a5443f5","kind":"select","cat":"设计模式","diff":"难","q":"关于单例被\"反射\"与\"序列化\"两种手段破坏及对应防御，正确的是？","opts":["反射可以通过 `setAccessible(true)` 强开私有构造并新建实例，在构造器里判空抛异常可挡住；反序列化走的是另一条路，需要重写 `readResolve()` 返回原实例","反射无法突破私有构造，能破坏单例的只有序列化","只要实现了 `readResolve()`，反射也就无法再创建新实例了","把类声明为 final 之后，反射与序列化两种手段都会失效"],"a":"A","exp":"`getDeclaredConstructor().setAccessible(true).newInstance()` 确实能绕过私有构造；而反序列化根本不走构造器，是 `readObject` 直接造对象，所以必须用 readResolve 单独兜住——两种手段要分别防，没有一招通吃。详见[《07-设计模式》](#/f/f8)","ref":"f8"},{"id":"q7e402f90","kind":"select","cat":"设计模式","diff":"难","q":"策略模式与状态模式最本质的区别是？","opts":["策略模式靠继承实现，状态模式靠组合实现","策略模式各算法之间互不相识、由客户端选定；状态模式各状态之间有迁移规则、由状态自身决定下一个状态","状态模式消除不了 if-else，只有策略模式能消除","策略模式只能有一个实现类，状态模式可以有多个"],"a":"B","exp":"两者都能把分支拆成对象、都能配合 Map 分发，差别在语义：状态模式带状态机（订单状态流转、线程 NEW→RUNNABLE→TERMINATED），迁移由状态自己驱动，调用方通常不关心当前处于哪个状态。详见[《07-设计模式》](#/f/f8)","ref":"f8"},{"id":"q0573531b","kind":"select","cat":"设计模式","diff":"难","q":"目标类没有实现任何接口，并且被声明为 `final`，Spring 仍想对它做 AOP 增强，结果是？","opts":["自动改用 JDK 动态代理，一切照常","CGLIB 会退化成静态代理，依然可以增强","只要方法不是 private，final 类也能被 CGLIB 代理","CGLIB 生成子类会失败，无法为该类创建代理，只能去掉 final 或改为面向接口设计"],"a":"D","exp":"没有接口时 JDK 动态代理无从下手，只能靠 CGLIB；而 CGLIB 的原理是生成目标类的子类，\"不能继承\"直接判了死刑，同理 final/private/static 方法也覆盖不了。记住这条边界，就知道为什么框架常要求业务类面向接口设计。详见[《07-设计模式》](#/f/f8)","ref":"f8"},{"id":"q972a60fa","kind":"select","cat":"算法","diff":"易","q":"下列排序算法中，最坏情况下仍能保证 O(nlogn) 的是？","opts":["快速排序","归并排序","冒泡排序","插入排序"],"a":"B","exp":"快排每次划分极不均匀时会退化到 O(n²)，例如对已经有序的数组固定取首元素当基准；归并排序每层都对半切分，稳定 O(nlogn)，代价是需要 O(n) 的额外空间。详见[《03-算法刷题路线》](#/f/f34)","ref":"f34"},{"id":"qf1eb54d0","kind":"select","cat":"算法","diff":"中","q":"代码 `for (int i = 1; i < n; i *= 2) { for (int j = 0; j < n; j++) sum++; }` 的时间复杂度是？","opts":["O(n)","O(logn)","O(nlogn)","O(n²)"],"a":"C","exp":"外层 i 每次翻倍，只执行 logn 次；内层固定 n 次，相乘得 O(nlogn)。判断这类题要看每层循环的\"步进方式\"而不是嵌套层数——两层循环不一定是 O(n²)。详见[《03-算法刷题路线》](#/f/f34)","ref":"f34"},{"id":"q9425392c","kind":"select","cat":"算法","diff":"难","q":"对 n 个元素自底向上建堆（heapify）的时间复杂度是？","opts":["O(n)：越靠近底层的节点数量越多、但下沉高度越小，加权求和后收敛到常数倍 n","O(nlogn)：要处理 n 个节点，每次下沉最坏 O(logn)","O(logn)：只有根节点需要下沉","O(n²)：每个节点都要和其余所有节点比较"],"a":"A","exp":"这是经典的\"上界不等于紧界\"：n 次 O(logn) 只是上界，实际求和是 Σ(每层节点数 × 该层高度)，收敛到 O(n)。注意逐个 insert 建堆才是 O(nlogn)，这也是堆排序整体复杂度仍为 O(nlogn) 的原因。详见[《03-算法刷题路线》](#/f/f34)","ref":"f34"},{"id":"qee7caaf3","kind":"select","cat":"算法","diff":"中","q":"用 `LinkedHashMap` 实现 LRU 缓存，构造器参数与需要重写的方法分别是？","opts":["`super(capacity, 0.75f, false)` + 重写 `removeEldestEntry`","`super(capacity)` + 重写 `put`","`super(capacity, 0.75f, true)` + 重写 `removeEldestEntry`","`super(capacity, 0.75f, true)` + 重写 `get`"],"a":"C","exp":"第三个参数 accessOrder=true 才会按访问顺序维护链表，get 也算一次访问；传 false 就成了 FIFO，淘汰的是最早插入而非最久未用的元素。removeEldestEntry 里返回 `size() > capacity` 即触发淘汰链表头。详见[《03-算法刷题路线》](#/f/f34)","ref":"f34"},{"id":"q05f1d802","kind":"select","cat":"算法","diff":"难","q":"从 n 个数中找第 K 大的元素，\"维护一个大小为 K 的小顶堆\"这种做法的时间复杂度是？","opts":["O(nlogn)：每个元素都要进堆排一次序","O(nlogK)：遍历 n 个元素，每次堆调整 O(logK)","O(Klogn)：堆里始终只有 K 个元素","O(n)：堆的插入删除都是常数时间"],"a":"B","exp":"遍历是 O(n)，每次入堆/出堆是 O(logK)，合计 O(nlogK)；K 远小于 n 时明显优于整体排序的 O(nlogn)，这正是\"海量数据取 Top K\"的标准解。选小顶堆是为了让堆顶正好是当前第 K 大，超容量就弹掉。详见[《03-算法刷题路线》](#/f/f34)","ref":"f34"},{"id":"q6002394f","kind":"select","cat":"算法","diff":"中","q":"下面哪种二分写法在收缩区间时可能陷入死循环？","opts":["左闭右闭：`while (left <= right)`，配 `left = mid + 1` / `right = mid - 1`","左闭右开：`while (left < right)`，配 `left = mid + 1` / `right = mid`","`while (left <= right)` 且 `mid = left + (right - left) / 2`","`while (left < right)` 且 `mid = (left + right) / 2`，并用 `left = mid` 收缩左边界"],"a":"D","exp":"下取整的 mid 在区间只剩两个元素时会等于 left，若还用 `left = mid` 收缩，left 永远不动就死循环。两个修法：改成 `left = mid + 1`，或把 mid 改成上取整 `(left + right + 1) / 2`——一句话，收缩方向必须和取整方向配套。详见[《03-算法刷题路线》](#/f/f34)","ref":"f34"},{"id":"qb7aabe53","kind":"blank","cat":"Java基础","diff":"易","q":"Java 源文件经 javac 编译后生成＿＿＿文件，由 JVM 加载执行。","alts":[["字节码","class",".class"]],"exp":"javac 把 .java 编译为 .class 字节码，JVM 解释/JIT 执行，这是\"一次编写，到处运行\"的基础。详见[《01-环境搭建与基础语法》](#/f/f3)","ref":"f3"},{"id":"qaf4cebf4","kind":"blank","cat":"Java基础","diff":"易","q":"== 用于比较引用类型时，比较的是＿＿＿。","alts":[["地址","内存地址","引用地址"]],"exp":"比较内容应使用重写后的 equals，String、Integer 等都已重写。详见[《02-面向对象与核心类》](#/f/f4)","ref":"f4"},{"id":"q6ce67066","kind":"blank","cat":"集合","diff":"易","q":"ArrayList 的底层是＿＿＿，LinkedList 的底层是＿＿＿。","alts":[["数组"],["双向链表"]],"exp":"ArrayList 随机访问快，LinkedList 头尾插删快，随机访问慢。详见[《03-集合与泛型》](#/f/f5)","ref":"f5"},{"id":"qa86f8ef3","kind":"blank","cat":"集合","diff":"易","q":"HashMap（JDK 1.8）的底层结构是＿＿＿＋链表＋红黑树。","alts":[["数组","哈希表"]],"exp":"数组是主体，冲突挂链表，链表长度≥8 且数组长度≥64 时树化。详见[《03-集合与泛型》](#/f/f5)","ref":"f5"},{"id":"qc3c9965b","kind":"blank","cat":"并发","diff":"中","q":"Executors 创建的 FixedThreadPool 使用无界＿＿＿，任务堆积可能导致 OOM，因此推荐手动 new ThreadPoolExecutor。","alts":[["队列","阻塞队列"]],"exp":"无界队列在消费慢时会无限堆积任务，最终内存耗尽。详见[《01-多线程与并发编程》](#/f/f9)","ref":"f9"},{"id":"q47ff62a7","kind":"blank","cat":"并发","diff":"中","q":"synchronized 是 JVM 层面的锁，而 ReentrantLock 是＿＿＿层面用 AQS 实现的锁。","alts":[["JDK","API","Java"]],"exp":"ReentrantLock 基于队列同步器（AQS）在 Java 代码层实现，功能更丰富：可中断、超时、公平锁、Condition。详见[《01-多线程与并发编程》](#/f/f9)","ref":"f9"},{"id":"q0fca9652","kind":"blank","cat":"JVM","diff":"中","q":"JVM 新生代分为 Eden 区和两个＿＿＿区。","alts":[["Survivor","S0/S1","from/to"]],"exp":"默认 8:1:1，对象在两个 Survivor 区之间来回复制，每熬过一次 Minor GC 年龄+1。详见[《02-JVM核心》](#/f/f10)","ref":"f10"},{"id":"qbe130ce3","kind":"blank","cat":"JVM","diff":"中","q":"类加载过程依次为：加载 → 验证 → 准备 → ＿＿＿ → 初始化。","alts":[["解析"]],"exp":"准备阶段给静态变量赋零值，初始化才执行 <clinit>；解析将常量池符号引用转为直接引用。详见[《02-JVM核心》](#/f/f10)","ref":"f10"},{"id":"q4ac78094","kind":"blank","cat":"MySQL","diff":"易","q":"MySQL 5.5 之后的默认存储引擎是＿＿＿。","alts":[["InnoDB"]],"exp":"支持事务、行级锁、外键与 MVCC；MyISAM 表锁且无事务，已非默认。详见[《MySQL基础与SQL实战》](#/f/f13)","ref":"f13"},{"id":"qb9ce91e9","kind":"blank","cat":"MySQL","diff":"易","q":"MySQL 默认的事务隔离级别是＿＿＿。","alts":[["可重复读","REPEATABLE READ","RR"]],"exp":"通过 MVCC + 临键锁在该级别下大幅避免幻读。详见
