ckend/;      # 结尾带 / → 去掉 /api 前缀再转发\n            proxy_set_header Host $host;\n            proxy_set_header X-Real-IP $remote_addr;          # 传真实客户端 IP\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n            proxy_read_timeout 60s;\n        }\n    }\n}\n```\n\n### 3. 限流（令牌桶）与 CORS 跨域\n\n```nginx\nhttp {\n    # 每个 IP 每秒 10 个请求，10m 内存约可跟踪 16 万 IP\n    limit_req_zone $binary_remote_addr zone=apiLimit:10m rate=10r/s;\n\n    server {\n        location /api/ {\n            limit_req zone=apiLimit burst=20 nodelay;\n            # burst=20 允许突发 20 个排队，nodelay 立即处理不匀速等待\n\n            # 跨域：让前端域名的请求被浏览器放行\n            add_header Access-Control-Allow-Origin  $http_origin always;\n            add_header Access-Control-Allow-Methods \"GET, POST, PUT, DELETE, OPTIONS\" always;\n            add_header Access-Control-Allow-Headers \"Content-Type, Authorization\" always;\n            add_header Access-Control-Allow-Credentials \"true\" always;\n            if ($request_method = OPTIONS) { return 204; }   # 预检请求直接放行\n        }\n    }\n}\n```\n\n### 4. WebSocket 反向代理（实时推送场景）\n\n```nginx\nlocation /ws/ {\n    proxy_pass http://backend;\n    proxy_http_version 1.1;\n    proxy_set_header Upgrade $http_upgrade;      # 协议升级头，缺一不可\n    proxy_set_header Connection \"upgrade\";\n    proxy_read_timeout 300s;                     # 长连接空闲超时，避免被误断\n}\n```\n\n### 5. HTTPS 思路与高可用\n\n- HTTPS：用 certbot/云厂商证书拿到 `.pem/.key`，server 块监听 443，配置 `ssl_certificate` 与 `ssl_certificate_key`，再把 80 端口 `return 301 https://$host$request_uri;` 整站跳转；\n- **keepalived 高可用**：Nginx 自身是单点，主备两台 Nginx + keepalived 抢占同一个 VIP（虚拟 IP），主挂了 VIP 漂移到备机，客户端无感知。\n\n## 🔧 常用命令 / API 速查\n\n| 配置 / 命令 | 作用 |\n| --- | --- |\n| `root /data/www` | 把 URL 映射到**本地文件**（静态资源） |\n| `proxy_pass http://backend` | 把请求**转发到后端服务**（反向代理） |\n| `upstream` + `server` | 定义负载均衡后端节点池 |\n| `weight / ip_hash / least_conn` | 权重轮询 / IP 会话保持 / 最少连接 |\n| `limit_req_zone` + `limit_req` | 令牌桶限流 |\n| `gzip on; gzip_types ...` | 响应压缩 |\n| `expires 7d` | 静态资源浏览器缓存时间 |\n| `nginx -t` / `nginx -s reload` | 语法检查 / 平滑重载 |\n| `tail -f logs/access.log` / `error.log` | 排查 502/404 等问题第一现场 |\n\n## 🧠 核心进阶\n\n### 1. 负载均衡策略对比\n\n| 策略 | 规则 | 适用 |\n| --- | --- | --- |\n| 轮询（默认） | 依次分发 | 实例性能相近 |\n| weight | 按权重分发（`weight=2`） | 机器配置不均 |\n| ip_hash | 客户端 IP 哈希固定到某实例 | 有状态的会话保持（更推荐应用层用 Redis 共享 Session） |\n| least_conn | 转发给当前连接数最少的实例 | 请求处理时长差异大 |\n- **健康检查**：开源版只有被动检查（`max_fails`/`fail_timeout`：失败 3 次、暂停 30s 不派流量）；主动探测（定期发请求探活）需商业版或第三方模块。\n\n### 2. Nginx 与 Spring Cloud Gateway 的分工（高频）\n\n| | Nginx | Spring Cloud Gateway |\n| --- | --- | --- |\n| 定位 | 接入层：静态资源、SSL 终止、全局负载均衡 | 业务网关：路由 + 鉴权 + 限流 + 熔断 |\n| 能力 | C 语言、性能极高，但不感知微服务 | 与注册中心联动按**服务名**路由，可写 Java 过滤器做业务逻辑 |\n| 典型位置 | 最外层入口 | Nginx 之后、微服务之前 |\n\n标准链路：**客户端 → Nginx（负载均衡）→ Gateway（业务网关，做鉴权/限流）→ 微服务**。判断标准：和业务无关的\"流量转发\"给 Nginx，和微服务体系相关的\"路由+治理\"给 Gateway。\n\n### 3. 动静分离与灰度\n\n- **动静分离**：静态请求（html/js/css/图片）由 Nginx 直接返回并设置 `expires` 缓存，动态请求走 `proxy_pass` 到应用——减少无效请求占用 JVM；\n- **灰度发布**：upstream 中新旧版本配权重（如 `weight=1` vs `weight=9`）放 10% 流量到新版；更精细的按 Cookie/Header 分流用 `map` + 两个 upstream 实现。\n\n### 5. 常见问题排查（实战）\n\n- **502 Bad Gateway**：后端挂了/端口不通/处理超时——先 `curl` 直连后端确认，再查 `error.log`；\n- **404**：`root` 与 location 拼接路径不对；前端 history 路由刷新 404 是漏配 `try_files $uri $uri/ /index.html;`；\n- **限流不生效**：`limit_req_zone` 必须在 http 块定义、`limit_req` 在 location 块引用，二者缺一；\n- **跨域失败**：OPTIONS 预检没放行，或后端也加了 CORS 头导致重复头报错——跨域头只在一处加（推荐 Nginx）。\n\n## 💼 高频面试题\n\n**Q：正向代理和反向代理的区别？**\n- 正向代理代理客户端：服务端不知道真实客户端是谁（VPN）；\n- 反向代理代理服务端：客户端不知道真实后端是谁，以为代理就是服务本身；\n- Nginx 做的是反向代理：隐藏后端、负载均衡、统一入口。\n\n**Q：Nginx 为什么能支撑高并发？**\n- master-worker 多进程模型：master 管理，worker 处理请求，worker 数 ≈ CPU 核数，避免线程争抢；\n- epoll 事件驱动 + 非阻塞 IO：一个 worker 可同时处理上万连接，不为每个连接创建线程；\n- sendfile 零拷贝传输静态文件。\n\n**Q：Nginx 的负载均衡策略有哪些？**\n- 轮询（默认）、weight 权重、ip_hash（会话保持）、least_conn（最少连接）；\n- 健康检查：开源版被动探测（max_fails/fail_timeout），主动探测要商业版/模块；\n- 有状态场景更推荐应用层用 Redis 共享 Session 而不是 ip_hash。\n\n**Q：你写过哪些 Nginx 配置？**\n- 静态站点 + `try_files` 支持前端 history 路由；`/api` 反向代理到 Spring Boot 集群（带 X-Real-IP）；\n- gzip 压缩、静态资源 `expires` 缓存（动静分离）；\n- `limit_req` 接口限流、CORS 跨域头、443 HTTPS + 80 跳转。\n\n**Q：Nginx 和 Spring Cloud Gateway 有什么区别，怎么一起用？**\n- Nginx 是接入层反向代理：性能极高，处理静态资源、SSL、全局负载均衡，但不懂微服务；\n- Gateway 是业务网关：基于注册中心按服务名动态路由，可用过滤器实现鉴权、限流、熔断等业务治理；\n- 典型架构：客户端 → Nginx → Gateway → 微服务，流量入口归 Nginx，服务治理归 Gateway。\n\n## 🔗 推荐资料\n\n| 资料 | 说明 | 链接 |\n| --- | --- | --- |\n| JavaGuide 负载均衡 | 负载均衡原理与分类 | https://javaguide.cn/high-performance/load-balancing.html |\n| JavaGuide API 网关 | 网关与 Nginx 的分工 | https://javaguide.cn/distributed-system/api-gateway.html |\n| pdai 架构知识体系 | 接入层在整个架构中的位置 | https://pdai.tech/md/arch/arch-z-overview.html |\n| JavaGuide 高可用系统设计指南 | 限流、降级等高可用手段 | https://javaguide.cn/high-availability/high-availability-system-design.html |\n","ck":0},{"id":"f20","stage":4,"path":"04-中间件篇/08-MongoDB.md","title":"08-MongoDB","md":"# 08-MongoDB\n\n> **阶段**：中间件篇 ｜ **建议时长**：2 天 ｜ **前置**：MySQL 基础（03-数据库篇）\n\n## 🧩 它是什么，解决什么问题\n\nMongoDB 是**文档型 NoSQL 数据库**，数据以 **BSON**（二进制 JSON）存储，一行可以是一个嵌套任意层级的 JSON 文档。它不要求每条记录字段一致（**schema 灵活**），查询语法面向文档而非 SQL，索引机制却与 MySQL 类似（B+ 树），是\"既要灵活结构、又要像数据库一样查询\"场景的最优解。\n\n**与 MySQL 概念对照（必须记住）**：\n\n| MongoDB | MySQL | 说明 |\n| --- | --- | --- |\n| database | database | 库 |\n| collection | table | 集合（表），无需建表结构 |\n| document | row（一行） | BSON 文档，字段可各不相同 |\n| field | column | 字段 |\n| `_id` | 主键 | 默认自动生成 ObjectId |\n| index | index | B+ 树索引，语法不同思想相同 |\n\n核心差异：MySQL 先定义表结构才能写；MongoDB **随时往集合里塞不同结构的文档**——商品 A 有\"颜色\"规格、商品 B 有\"内存/硬盘\"规格，放同一集合毫无压力，这正是关系库做\"商品多规格\"时的痛点（一堆 NULL 列或 EAV 反范式）。\n\n## 📌 典型使用场景\n\n| 业务场景 | 为什么用它 | 不用的后果 |\n| --- | --- | --- |\n| 内容管理（文章/评论/CMS） | 文档结构可嵌套，字段增减无需 DDL | MySQL 频繁改表结构，字段大量为 NULL |\n| 商品详情聚合 | 标题、规格、图文、扩展属性一个大文档一次查出 | 多表 JOIN 拼装，SQL 复杂且慢 |\n| 日志/埋点存储 | 写入吞吐高，字段随业务变化，按 TTL 自动过期 | MySQL 单表暴涨，加字段要 DDL 锁表 |\n| 用户画像/标签 | 每个用户标签数不同，文档天然表达 | 关系库做标签需 EAV 多表关联，查询慢 |\n\n**不适用**（同样重要，面试会问）：需要**强事务、多表复杂关联、金额类强一致**的场景（如订单资金、账务系统）→ 用 MySQL。MongoDB 4.0+ 虽支持多文档事务，但性能与生态仍不如关系库，别把它当 MySQL 的替代品。\n\n## 🚀 快速上手\n\n### 1. Docker 启动 + mongosh CRUD\n\n```bash\ndocker run -d --name mongo -p 27017:27017 mongo:7.0\ndocker exec -it mongo mongosh          # 进入交互式 shell\n```\n\n```javascript\nuse shop                                // 创建/切换库（写数据时才真正创建）\n\n// 增：insertOne / insertMany，无需建表\ndb.product.insertOne({ name: \"华为 Mate60 Pro\", brand: \"华为\", price: 6999,\n                       specs: { memory: \"12G\", storage: \"512G\" }, tags: [\"旗舰\", \"5G\"] })\n\n// 查：find + 条件 + 投影\ndb.product.find({ brand: \"华为\" })                                  // 等值\ndb.product.find({ price: { $gte: 5000, $lte: 8000 } })              // 范围：$gte/$lte/$gt/$lt\ndb.product.find({ tags: \"旗舰\" })                                   // 数组包含\ndb.product.find({}, { name: 1, price: 1, _id: 0 })                  // 只返回指定字段\n\n// 排序分页：sort / skip / limit（跳过前 10 条取 5 条，按价格倒序）\ndb.product.find().sort({ price: -1 }).skip(10).limit(5)\n\n// 统计\ndb.product.countDocuments({ brand: \"华为\" })\n\n// 改：updateOne + $set（只改指定字段，不会覆盖整个文档）\ndb.product.updateOne({ name: \"华为 Mate60 Pro\" }, { $set: { price: 6499 } })\ndb.product.updateOne({ name: \"华为 Mate60 Pro\" }, { $addToSet: { tags: \"卫星通信\" } }) // 数组去重追加\n\n// 删\ndb.product.deleteOne({ name: \"华为 Mate60 Pro\" })\n\n// 索引：与 MySQL 一样，等值/排序字段要建索引\ndb.product.createIndex({ brand: 1 })                 // 普通索引\ndb.product.createIndex({ name: \"text\" })             // 全文索引\ndb.log_events.createIndex({ createdAt: 1 }, { expireAfterSeconds: 3600 })  // TTL 自动过期\n```\n\n### 2. 聚合管道（MongoDB 版的 GROUP BY + JOIN）\n\n```javascript\n// 按品牌统计商品数与均价：$match(过滤) → $group(分组聚合) → $sort(排序)\ndb.product.aggregate([\n  { $match: { price: { $gte: 1000 } } },\n  { $group: { _id: \"$brand\", count: { $sum: 1 }, avgPrice: { $avg: \"$price\" } } },\n  { $sort: { count: -1 } }\n])\n```\n\n### 3. Spring Boot 整合（MongoTemplate 常用操作）\n\n```xml\n<dependency>\n    <groupId>org.springframework.boot<\/groupId>\n    <artifactId>spring-boot-starter-data-mongodb<\/artifactId>\n<\/dependency>\n```\n\n```yaml\nspring:\n  data:\n    mongodb:\n      uri: mongodb://localhost:27017/shop\n```\n\n```java\n@Document(collection = \"product\")\n@Data\npublic class Product {\n    @Id\n    private String id;          // 不赋值则自动生成 ObjectId\n    private String name;\n    private String brand;\n    private Double price;\n    private Map<String, Object> specs;   // 灵活 schema：任意规格字段\n    private List<String> tags;\n}\n\n@Service\n@RequiredArgsConstructor\npublic class ProductService {\n    private final MongoTemplate mongoTemplate;\n\n    public void demo() {\n        // 插入\n        Product p = new Product();\n        p.setName(\"小米 14\"); p.setBrand(\"小米\"); p.setPrice(4999.0);\n        mongoTemplate.save(p);\n\n        // 条件查询：brand=华为 且 price 在 [5000,8000]，按价格倒序\n        Query query = new Query(\n                new Criteria().andOperator(\n                        Criteria.where(\"brand\").is(\"华为\"),\n                        Criteria.where(\"price\").gte(5000).lte(8000)))\n                .with(Sort.by(Sort.Direction.DESC, \"price\"))\n                .skip(0).limit(10);\n        List<Product> list = mongoTemplate.find(query, Product.class);\n\n        // 更新：$set\n        mongoTemplate.updateFirst(\n                Query.query(Criteria.where(\"name\").is(\"小米 14\")),\n                Update.update(\"price\", 4599.0), Product.class);\n\n        // 聚合：按品牌统计\n        mongoTemplate.aggregate(\n                Aggregation.newAggregation(\n                        Aggregation.group(\"brand\").count().as(\"count\"),\n                        Aggregation.sort(Sort.Direction.DESC, \"count\")),\n                \"product\", Document.class);\n\n        // 计数与删除\n        long count = mongoTemplate.count(\n                Query.query(Criteria.where(\"brand\").is(\"华为\")), Product.class);\n        mongoTemplate.remove(Query.query(Criteria.where(\"price\").lt(100)), Product.class);\n    }\n}\n```\n\n## 🔧 常用命令 / API 速查\n\n| 操作 | mongosh | MongoTemplate |\n| --- | --- | --- |\n| 插入 | `insertOne/insertMany` | `save()` / `insert()` |\n| 查询 | `find({条件}, {投影})` | `find(Query, Class)` |\n| 范围 | `$gte $lte $gt $lt $in $ne` | `Criteria.where(...).gte(...)` |\n| 更新 | `updateOne + $set/$inc/$push` | `updateFirst(Query, Update, Class)` |\n| 删除 | `deleteOne/deleteMany` | `remove(Query, Class)` |\n| 分页 | `sort().skip().limit()` | `Sort / skip / limit` |\n| 聚合 | `aggregate([$match, $group])` | `Aggregation.newAggregation(...)` |\n| 索引 | `createIndex({field: 1})` | `@Indexed` / `@CompoundIndex` 注解 |\n\n## 🧠 核心进阶\n\n### 1. ObjectId 结构（面试常考）\n\n`_id` 默认生成的 ObjectId 共 **12 字节**：\n\n| 部分 | 长度 | 含义 |\n| --- | --- | --- |\n| 时间戳 | 4 字节 | 创建时间（秒级），所以 ObjectId 本身就带创建时间且**大致按时间递增** |\n| 随机值 | 5 字节 | 机器 + 进程标识（同一实例唯一） |\n| 递增计数 | 3 字节 | 同一秒内的自增序号 |\n\n价值：主键生成**不依赖数据库协调**（应用端即可生成），天然趋势递增，适合做索引键。\n\n### 2. 副本集与分片（一句话级别即可）\n\n- **副本集（Replica Set）**：一主多从自动选主——主节点写、从节点读，主挂了从节点自动选举接管，等同 MySQL 主从 + MHA 的开箱即用版；生产最小 3 节点（PSS 或 PSA）；\n- **分片（Sharding）**：按分片键（如 user_id 哈希）把 collection 水平拆到多台机器，解决单机容量与写入瓶颈，mongos 路由组件对应用透明；\n- 一句话：**副本集保高可用，分片保扩展性**。\n\n### 3. 事务与一致性\n\n- 4.0 起支持**多文档事务**（副本集内），用法与 Spring `@Transactional` 类似；\n- 但单文档操作本身就是原子的（一条 BSON 的更新不会写一半），所以\"把强一致需求的关联数据放进同一个文档\"是 MongoDB 的惯用设计，比开事务更高效；\n- 默认读自己写的没问题，但跨文档、跨集合的一致性需求仍是 MySQL 的主场。\n\n## 💼 高频面试题\n\n**Q：MongoDB 和 MySQL 怎么选型？**\n- MySQL：强事务（资金/订单）、多表关联、结构固定的业务主数据；\n- MongoDB：schema 灵活多变（内容管理、商品多规格、日志埋点）、文档自包含一次读取、写入吞吐优先；\n- 常见组合：MySQL 存核心交易数据，MongoDB 存内容/详情/日志类数据。\n\n**Q：什么场景适合 MongoDB？不适合什么场景？**\n- 适合：字段不固定或嵌套复杂、单文档整体读写、大容量写多读多（CMS、商品详情、日志、画像）；\n- 不适合：强事务与金额一致性、复杂多表 JOIN（`$lookup` 能力有限且慢）；\n- 4.0+ 有事务但不是它的主场，选型要明确\"文档优先\"的设计思路。\n\n**Q：ObjectId 是什么结构？**\n- 12 字节：4 字节秒级时间戳 + 5 字节机器/进程随机值 + 3 字节自增计数；\n- 应用端生成，无需数据库协调；带时间信息、趋势递增，利于索引；\n- 这也是 MongoDB 写入性能好的原因之一（主键不冲突、不回页）。\n\n**Q：副本集和分片分别解决什么问题？**\n- 副本集：一主多从 + 自动选主，解决**高可用**与读写分离；\n- 分片：按分片键水平拆分数据到多节点，解决**容量与写入扩展**；\n- 生产通常\"分片集群的每个分片本身是一个副本集\"。\n\n## 🔗 推荐资料\n\n| 资料 | 说明 | 链接 |\n| --- | --- | --- |\n| JavaGuide MongoDB 面试题 | 面试导向的知识点梳理 | https://javaguide.cn/database/mongodb/mongodb-questions-01.html |\n| pdai MongoDB 总览 | MongoDB 知识体系与原理 | https://pdai.tech/md/db/nosql-mongo/mongo.html |\n| 廖雪峰 Spring Boot 集成 MongoDB | Spring Boot 整合实操 | https://liaoxuefeng.com/books/java/springboot/index.html |\n| pdai 架构知识体系 | NoSQL 在整体架构中的位置 | https://pdai.tech/md/arch/arch-z-overview.html |\n","ck":0},{"id":"f21","stage":5,"path":"05-框架篇/01-Spring核心.md","title":"Spring核心","md":"# Spring核心\n\n> **阶段**：框架篇 ｜ **建议时长**：6 天 ｜ **前置**：已完成入门篇/进阶篇\n\n## 🎯 学习目标\n\n- 能说清 IoC/DI 概念与好处，并用注解和 JavaConfig 两种方式完成依赖注入。\n- 能按顺序复述 Bean 生命周期，并说出 AOP 代理生成的时机。\n- 能解释 JDK 动态代理与 CGLIB 的区别，并手写一个记录接口耗时的切面。\n- 能列出 @Transactional 至少 5 种失效场景，并现场演示、修复其中一种。\n- 能讲出循环依赖三级缓存的流转过程与\"为什么是三级\"。\n- 能画出 DispatcherServlet 处理请求的完整流程。\n\n## 📖 核心知识点\n\n### 1. IoC 与 DI ⭐\n\n> 面试官想听：能否一句话讲清\"控制反转是什么、反转了什么\"，以及它解决了什么痛点。\n\n- **IoC（控制反转）**：对象的创建和依赖关系的管理，从程序员手写 `new` 反转为交给 Spring 容器统一负责。**DI（依赖注入）**是 IoC 的实现手段：容器在创建对象时，把依赖的对象\"注入\"进来。\n- 好处：调用方与实现类解耦（换实现只改配置）；便于单测（注入 Mock）；对象生命周期与配置集中管理。\n- 注解装配：`@Component` 通用组件，衍生 `@Service / @Repository / @Controller`（语义分层）；注入用 `@Autowired`（Spring 提供，按类型匹配，多个候选配合 `@Qualifier` 或 `@Primary`）、`@Resource`（JDK 规范，默认按名称）。\n- JavaConfig：`@Configuration` + `@Bean`，适合装配第三方类（没源码、没法打注解的类）。\n\n```java\n@Configuration\npublic class AppConfig {\n    @Bean   // 方法名即 beanName，返回值交给容器管理\n    public OrderService orderService(UserRepository repo) {  // 参数自动注入\n        return new OrderService(repo);\n    }\n}\n```\n\n**Bean 作用域**：`singleton`（默认，容器内单例）、`prototype`（每次获取新建）、`request`/`session`（Web 环境）。注意：单例 Bean 中持有可变成员变量是并发隐患，尽量无状态。\n\n### 2. Bean 生命周期 ⭐\n\n> 面试官想听：能按顺序说出五个阶段，并知道 AOP 代理在初始化之后、由 BeanPostProcessor 生成。\n\n```text\n1. 实例化 Instantiation     —— 反射调用构造器，只是个\"毛坯\"对象\n2. 属性填充 Populate        —— @Autowired / @Value 注入依赖\n3. 初始化 Initialization    —— Aware 回调（BeanNameAware/ApplicationContextAware）\n                              → BeanPostProcessor#postProcessBeforeInitialization\n                              → @PostConstruct → InitializingBean#afterPropertiesSet → init-method\n                              → BeanPostProcessor#postProcessAfterInitialization（AOP 代理通常在这里生成）\n4. 使用\n5. 销毁 Destruction         —— 容器关闭时：@PreDestroy → DisposableBean#destroy → destroy-method\n```\n\n记忆抓手：`InstantiationAwareBeanPostProcessor` 前后夹着实例化和初始化；`BeanPostProcessor` 是 AOP、@Autowired 注入等框架能力的扩展点——这也是\"Spring 大部分黑魔法都靠 BeanPostProcessor\"这个加分项的来源。\n\n### 3. AOP：面向切面编程 ⭐\n\n> 面试官想听：术语不出错 + 两种代理的区别 + 你真实用它做过什么。\n\n- 术语：**连接点 JoinPoint**（可被拦截的方法）、**切点 Pointcut**（筛选连接点的表达式）、**通知 Advice**（拦截后做什么：@Before/@After/@AfterReturning/@AfterThrowing/@Around）、**切面 Aspect**（切点 + 通知）、**织入**（把切面应用到目标对象生成代理）。\n- **JDK 动态代理**：基于接口，运行时生成实现相同接口的代理类（`Proxy + InvocationHandler`）。\n- **CGLIB**：基于继承，生成目标类的子类字节码，不能代理 final 类/方法。\n- Spring Boot 2.x 起默认强制使用 CGLIB（`proxyTargetClass=true`）；有接口也用 CGLIB，保证注入统一。\n\n```java\n@Aspect @Component\npublic class CostAspect {\n    @Around(\"execution(* com.example.demo.controller..*(..))\")\n    public Object around(ProceedingJoinPoint pjp) throws Throwable {\n        long start = System.currentTimeMillis();\n        try {\n            return pjp.proceed();\n        } finally {\n            log.info(\"{} cost {}ms\", pjp.getSignature(), System.currentTimeMillis() - start);\n        }\n    }\n}\n```\n\n典型应用：接口耗时监控、操作日志、权限校验、接口幂等/限流；`@Transactional` 的底层就是 AOP——这一点直接衔接下一节的事务失效。\n\n### 4. 事务与失效场景大全 ⭐\n\n> 面试官想听：失效场景是 Spring 面试出现率最高的问题之一，要能说出 5 个以上并讲出\"失效本质 = 没走到代理\"。\n\n`@Transactional` 关键属性：`propagation`（传播行为）、`isolation`（隔离级别）、`rollbackFor`（触发回滚的异常）、`readOnly`、`timeout`。\n\n**传播行为三剑客**：\n\n- `REQUIRED`（默认）：有事务就加入，没有就新建。\n- `REQUIRES_NEW`：挂起当前事务，新建独立事务——内部操作是否回滚与外层无关（如\"记录操作日志\"即使业务回滚也要落库）。\n- `NESTED`：在当前事务内打保存点，可回滚到保存点而不影响外层；外层回滚则它一定回滚。\n\n**失效场景大全**：\n\n```java\n@Service\npublic class OrderService {\n    public void create() {\n        this.doSave();                       // ① 自调用：this 是原始对象不是代理 → 失效\n    }\n    @Transactional\n    public void doSave() { ... }\n\n    @Transactional\n    public void bad() {\n        try {\n            orderMapper.update(...);\n        } catch (Exception e) { log.error(...); }   // ② 异常被吞 → 失效\n    }\n\n    @Transactional                            // ③ 默认只回滚 RuntimeException/Error\n    public void check() throws Exception {\n        throw new Exception(\"受检异常默认不回滚\");   // 需 rollbackFor = Exception.class\n    }\n    // ④ 方法不是 public（代理只拦截 public）\n    // ⑤ 类没被 Spring 管理（没加 @Service 等）\n    // ⑥ 数据库引擎不支持事务（MyISAM）\n    // ⑦ 传播行为配错，如 NOT_SUPPORTED 会以非事务运行\n}\n```\n\n修复 ①：注入自身代理（`@Autowired private OrderService self;`）、`AopContext.currentProxy()` 或把方法拆到另一个类。记忆主线：**事务由代理实现，一切让调用绕过代理的写法都会失效**。\n\n### 5. 循环依赖与三级缓存 ⭐\n\n> 面试官想听：三级缓存各自存什么、流转过程，以及\"为什么二级不够\"。\n\nA 依赖 B、B 依赖 A（都是单例、setter/字段注入）时的解法：\n\n```text\n一级缓存 singletonObjects      成品 Bean\n二级缓存 earlySingletonObjects 提前曝光的半成品（已实例化、未完成属性填充）\n三级缓存 singletonFactories    ObjectFactory（能生产早期引用，必要时在这里提前生成 AOP 代理）\n\n流程：A 实例化 → 把 A 的工厂放入三级缓存 → A 填充属性发现要 B\n     → B 实例化 → B 填充属性要 A → 从三级缓存拿到 A 的早期引用（放进二级缓存）\n     → B 完成初始化进入一级缓存 → A 继续完成初始化进入一级缓存\n```\n\n为什么需要三级而不是二级：三级缓存存的是工厂，**只有真正发生循环依赖时才会提前创建 AOP 代理**；没有循环依赖时代理仍走正常初始化后生成，不破坏 Bean 生命周期。二级缓存也能工作，但会迫使所有 Bean 提前生成代理。\n\n边界：构造器注入的循环依赖无解（实例化前就需要对方）；prototype 不处理；Spring Boot 2.6+ 默认禁止循环依赖，启动报错，需 `spring.main.allow-circular-references=true` 放开——官方态度是\"循环依赖是设计坏味道，该重构\"。\n\n### 6. SpringMVC：请求处理流程 ⭐\n\n> 面试官想听：从请求进来到响应出去，中间经过哪些组件，能说出 HttpMessageConverter 更佳。\n\n```text\n请求 → DispatcherServlet（前端控制器，唯一入口）\n     → HandlerMapping（根据 URL 找到 Handler 及拦截器链 HandlerExecutionChain）\n     → HandlerAdapter → 参数解析（@RequestParam/@PathVariable/@RequestBody）\n                        → 反射调用 Controller 方法 → 返回值处理\n     → @ResponseBody：HttpMessageConverter 序列化为 JSON 直接写响应（前后端分离主流）\n     → 传统视图：ViewResolver 解析视图 → 渲染模板\n     → 过程中抛异常 → @ControllerAdvice + @ExceptionHandler 统一捕获\n```\n\n**拦截器 vs 过滤器**：过滤器是 Servlet 规范组件，由容器管理，在 DispatcherServlet 之前执行，能拿到的是原始 request/response，适合编码、跨域；拦截器是 Spring 的组件，在 Controller 前后执行，可以注入 Spring Bean、拿到 Handler 信息，适合登录校验、日志、权限。\n\n**参数注解辨析**：`@RequestParam` 接 query/form 单值参数；`@PathVariable` 接 URL 路径占位符；`@RequestBody` 把请求体 JSON 反序列化为对象（Content-Type: application/json，走 HttpMessageConverter）。\n\n全局异常：`@RestControllerAdvice` 捕获所有 Controller 的异常，配合自定义 `BusinessException` 返回统一错误体——下一篇 SpringBoot 实战直接落地。\n\n## 🛠 动手实践\n\n### 任务 1：JavaConfig 演示 IoC/DI（1 小时）\n\n不用任何注解扫包，纯 JavaConfig 装配：\n\n```java\npublic interface SmsSender { void send(String msg); }\npublic class AliyunSmsSender implements SmsSender {\n    @Override public void send(String msg) { System.out.println(\"阿里云短信: \" + msg); }\n}\n\n@Configuration\npublic class AppConfig {\n    @Bean public SmsSender smsSender() { return new AliyunSmsSender(); }\n    @Bean public NotifyService notifyService(SmsSender sender) {   // 构造器注入\n        return new NotifyService(sender);\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        var ctx = new AnnotationConfigApplicationContext(AppConfig.class);\n        ctx.getBean(NotifyService.class).notifyAll(\"欢迎注册\");\n    }\n}\n```\n\n验收：新增一个 `TencentSmsSender` 实现类，只改 `AppConfig` 一处就能切换实现，体会\"面向接口 + 容器装配\"的解耦。\n\n### 任务 2：AOP 记录接口耗时（1.5 小时）\n\n用 Spring Boot 建一个最小 Web 项目，写两个 Controller 接口，按上文 `CostAspect` 实现 `@Around` 切面。\n验收：调用接口后控制台打印\"方法签名 + 耗时\"；把切点改成只拦 `service` 包后接口耗时日志消失，验证切点生效范围。\n\n### 任务 3：演示并修复一次事务失效（1.5 小时）\n\n建表 `account(id, balance)`，写转账 Service：\n\n```java\n@Service\npublic class TransferService {\n    @Transactional\n    public void transfer(Long from, Long to, int amount) {\n        accountMapper.decrease(from, amount);\n        if (amount > 1000) throw new RuntimeException(\"超限\");  // 制造异常\n        accountMapper.increase(to, amount);\n    }\n}\n```\n\n先构造失效版本：另写一个方法 `public void proxy() { this.transfer(...); }` 从外部调 `proxy()`，观察异常抛出后余额仍被扣减（没回滚）。\n验收：修复方式三选一（注入自身代理 / 拆方法到另一个 Service / AopContext），修复后异常时两步操作都回滚；能用一句话解释失效原因（自调用绕过了代理）。\n\n## 💼 高频面试题\n\n**Q：什么是 IoC 和 DI？带来了什么好处？**\n- IoC：对象的创建与依赖管理由容器负责，控制权从程序员手里反转给框架；DI 是它的实现方式，依赖由容器注入。\n- 好处：调用方只依赖接口，替换实现不改代码（解耦）；单测可注入 Mock；生命周期、配置集中管理。\n- 装配方式：注解扫包（@Component 系列）与 JavaConfig（@Configuration + @Bean）。\n\n**Q：说说 Bean 的生命周期。**\n- 实例化（构造器）→ 属性填充（依赖注入）→ 初始化（Aware 回调 → BeanPostProcessor 前置 → @PostConstruct → afterPropertiesSet → BeanPostProcessor 后置）→ 使用 → 销毁（@PreDestroy → destroy）。\n- 加分：AOP 代理在初始化后由 BeanPostProcessor 生成；框架扩展大多通过 BeanPostProcessor 实现。\n\n**Q：Bean 的作用域有哪些？**\n- singleton 默认，容器内单例；prototype 每次获取新建。\n- Web 环境还有 request、session。\n- 注意单例 Bean 里放可变状态有线程安全问题，Service 应保持无状态。\n\n**Q：AOP 是什么原理？JDK 动态代理和 CGLIB 的区别？**\n- AOP 把日志、事务等横切逻辑从业务代码中抽离，运行期由代理对象织入。\n- JDK 动态代理基于接口（Proxy + InvocationHandler）；CGLIB 基于继承生成子类，不能代理 final 类和方法。\n- Spring Boot 2.x 起默认 CGLIB；典型应用：事务、日志、耗时监控、权限。\n\n**Q：@Transactional 的传播行为？**\n- REQUIRED（默认）：有事务加入，无则新建。\n- REQUIRES_NEW：挂起当前事务另起新事务，内外回滚互不影响，适合\"日志必须落库\"。\n- NESTED：保存点机制，可局部回滚，外层回滚则整体回滚。\n\n**Q：@Transactional 在哪些情况下会失效？**\n- 自调用（this 调用绕过代理）、方法非 public、类未被 Spring 管理。\n- 异常被 try-catch 吞掉；抛受检异常但没配 rollbackFor。\n- 数据库引擎不支持事务（MyISAM）、传播行为配置错误。\n- 本质一句话：事务靠 AOP 代理实现，绕过代理就不生效。\n\n**Q：Spring 怎么解决循环依赖？为什么需要三级缓存？**\n- 用三级缓存：一级成品、二级半成品、三级 ObjectFactory。\n- A 实例化后先暴露工厂引用，B 注入 A 时拿到早期引用，B 先完成，A 再完成。\n- 三级缓存的意义：只在发生循环依赖时才提前生成 AOP 代理，不破坏正常生命周期；构造器注入的循环依赖无解，Spring Boot 2.6+ 默认禁止。\n\n**Q：BeanFactory 和 FactoryBean 的区别？**\n- BeanFactory 是 IoC 容器的顶层接口，负责生产和管理所有 Bean。\n- FactoryBean 是一种特殊 Bean：getObject() 里封装复杂对象的创建逻辑，容器里放的是 getObject() 的产物。\n- 想拿 FactoryBean 本身要在 beanName 前加 `&`；MyBatis 的 Mapper 就是通过 MapperFactoryBean 注册的。\n\n**Q：SpringMVC 处理一个请求的流程？**\n- DispatcherServlet 统一接收 → HandlerMapping 找到 Handler 和拦截器链 → HandlerAdapter 执行（参数解析、消息转换）→ Controller 返回。\n- @ResponseBody 时由 HttpMessageConverter 序列化 JSON 直接写出；传统方式再走 ViewResolver 渲染。\n- 异常统一交给 @ControllerAdvice 处理。\n\n**Q：拦截器和过滤器的区别？**\n- 过滤器属于 Servlet 规范，在 DispatcherServlet 之前执行，处理原始请求响应，适合编码、跨域、全局 XSS 过滤。\n- 拦截器属于 Spring MVC，围绕 Handler 执行，能注入 Spring Bean、拿到处理方法信息，适合鉴权、日志。\n- 执行顺序：过滤器 → DispatcherServlet → 拦截器 preHandle → Controller → 拦截器 postHandle/afterCompletion → 过滤器。\n\n## 🔗 推荐资料\n\n| 资料 | 说明 | 链接 |\n| --- | --- | --- |\n| JavaGuide Spring 常见问题总结 | IoC/AOP/事务/生命周期面试题合集 | https://javaguide.cn/system-design/framework/spring/spring-knowledge-and-questions-summary.html |\n| pdai Spring 知识体系 | 从核心机制到源码的体系化目录 | https://pdai.tech/md/spring/spring.html |\n| 廖雪峰 Spring 教程 | IoC、AOP、事务的入门实操 | https://liaoxuefeng.com/books/java/spring/index.html |\n| 廖雪峰 Maven 教程 | 框架篇所有工程的依赖管理基础 | https://liaoxuefeng.com/books/java/maven/index.html |\n","ck":0},{"id":"f22","stage":5,"path":"05-框架篇/02-SpringBoot实战.md","title":"SpringBoot实战","md":"# SpringBoot实战\n\n> **阶段**：框架篇 ｜ **建议时长**：5 天 ｜ **前置**：01-Spring核心.md\n\n## 🎯 学习目标\n\n- 能完整讲出 Spring Boot 自动配置原理（三个注解 + 条件注解 + AutoConfiguration.imports）。\n- 能用 yml 多环境 Profile 管理配置，并说清 @ConfigurationProperties 与 @Value 的取舍。\n- 能搭建一套规范 Web 工程：统一返回体、全局异常、参数校验、slf4j 日志。\n- 能独立完成 todo-list REST API：MyBatis-Plus + MySQL + Redis 缓存 + 打包部署。\n- 能说清 Spring Boot 启动流程概览与自定义 starter 的思路。\n\n## 📖 核心知识点\n\n### 1. 约定优于配置与起步依赖 ⭐\n\n> 面试官想听：Spring Boot 解决了 Spring 什么痛点——XML 地狱和依赖版本冲突。\n\n- **约定优于配置**：默认扫描主类所在包及子包、默认嵌入式 Tomcat 端口 8080、默认配置文件 application.yml，不配置也能跑。\n- **起步依赖（starter）**：`spring-boot-starter-web` = 一组按功能聚合的依赖 + 对应的自动配置。引入 starter 即引入整套能力，版本由 `spring-boot-starter-parent` 统一仲裁，杜绝版本冲突。\n- Web 项目最小依赖：`spring-boot-starter-web`、数据库驱动、持久层 starter（下一篇用 `mybatis-plus`）、`spring-boot-starter-validation`。\n- 版本差异：Spring Boot 2.7 基于 javax、Java 8+；Spring Boot 3.x 基于 Jakarta EE（`javax.*` → `jakarta.*`）、要求 Java 17+。新学建议直接上 3.x，老项目要会看 2.7。\n\n### 2. 自动配置原理 ⭐\n\n> 面试官想听：出现率最高的 Spring Boot 面试题，按\"三个注解 → 选择器 → imports 文件 → 条件注解\"四步讲。\n\n`@SpringBootApplication` 是三合一：\n\n```text\n@SpringBootConfiguration   —— 本质是 @Configuration，标记配置类\n@EnableAutoConfiguration   —— 自动配置的总开关\n@ComponentScan             —— 扫描主类所在包及子包的组件\n```\n\n自动配置的加载链路：\n\n```text\n@EnableAutoConfiguration\n  → @Import(AutoConfigurationImportSelector)\n  → 读取所有 jar 包的 META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports\n    （Spring Boot 2.7 之前是 META-INF/spring.factories）\n  → 拿到全部候选自动配置类（如 DataSourceAutoConfiguration、RedisAutoConfiguration）\n  → 用条件注解逐个过滤，符合条件的才注册为 Bean\n```\n\n条件注解是筛选的关键：`@ConditionalOnClass`（类路径有某类才生效）、`@ConditionalOnMissingBean`（用户没自定义才生效——这就是\"默认配置永远让位给你的配置\"）、`@ConditionalOnProperty`（配置项满足才生效）。\n\n**自定义 starter 思路**：建两个模块 `xxx-autoconfigure`（写自动配置类 + 条件注解）和 `xxx-starter`（只做依赖聚合），并在 autoconfigure 模块的 `AutoConfiguration.imports` 文件里登记配置类。面试能说出这两个模块的分工即可。\n\n### 3. 配置体系 ⭐\n\n> 面试官想听：@ConfigurationProperties 与 @Value 怎么选，以及配置优先级。\n\n```yaml\n# application.yml：冒号后必须有空格，缩进两个空格\nserver:\n  port: 8080\nspring:\n  profiles:\n    active: dev          # 激活 dev 环境\napp:\n  todo:\n    cache-ttl: 10m\n    key-prefix: \"todo:\"\n```\n\n多环境：`application-dev.yml`、`application-prod.yml`、`application-test.yml`，由 `spring.profiles.active` 决定加载哪套；启动时可覆盖：`java -jar app.jar --spring.profiles.active=prod`。\n\n两种读取方式：\n\n```java\n// 批量绑定：前缀下的配置映射成对象，类型安全、可加校验（推荐）\n@Component\n@ConfigurationProperties(prefix = \"app.todo\")\n@Data\npublic class TodoProperties {\n    private Duration cacheTtl;\n    private String keyPrefix;\n}\n\n// 单个读取：适合零散配置，支持 SpEL（@Value(\"#{...}\")）\n@Value(\"${server.port}\")\nprivate int port;\n```\n\n配置优先级（高 → 低）：命令行参数 > Java 系统属性 > 操作系统环境变量 > `application-{profile}.yml` > `application.yml`。一句话：越\"外部、越具体\"的越优先，便于部署时用环境变量覆盖。\n\n### 4. Web 实战规范 ⭐\n\n> 面试官想听：统一返回体 + 全局异常 + 参数校验是一套组合拳，体现工程规范意识。\n\n**RESTful 风格**：URL 表示资源（名词复数），HTTP 方法表示动作，状态码表达结果——`GET /api/todos` 列表、`POST /api/todos` 创建、`PUT /api/todos/1` 更新、`DELETE /api/todos/1` 删除。\n\n**统一返回体**：\n\n```java\n@Data\npublic class Result<T> {\n    private int code;        // 业务码：200 成功，4xx 客户端问题，5xx 服务端问题\n    private String message;\n    private T data;\n\n    public static <T> Result<T> ok(T data) { return build(200, \"success\", data); }\n    public static <T> Result<T> fail(int code, String message) { return build(code, message, null); }\n}\n```\n\n**全局异常处理**：\n\n```java\n@RestControllerAdvice\npublic class GlobalExceptionHandler {\n\n    @ExceptionHandler(MethodArgumentNotValidException.class)   // 参数校验失败\n    public Result<Void> handleValid(MethodArgumentNotValidException e) {\n        String msg = e.getBindingResult().getFieldErrors().stream()\n                .map(f -> f.getField() + \": \" + f.getDefaultMessage())\n                .collect(Collectors.joining(\"; \"));\n        return Result.fail(400, msg);\n    }\n\n    @ExceptionHandler(BusinessException.class)                 // 业务异常：返回明确提示\n    public Result<Void> handleBiz(BusinessException e) {\n        return Result.fail(e.getCode(), e.getMessage());\n    }\n\n    @ExceptionHandler(Exception.class)                         // 兜底：不暴露堆栈给前端\n    public Result<Void> handleOther(Exception e) {\n        log.error(\"unexpected error\", e);\n        return Result.fail(500, \"系统繁忙，请稍后重试\");\n    }\n}\n```\n\n**参数校验**：引入 `spring-boot-starter-validation`，实体上打约束注解，Controller 参数前加 `@Valid`，失败异常由上面的全局处理器接住：\n\n```java\npublic record TodoCreateRequest(\n        @NotBlank(message = \"标题不能为空\")\n        @Size(max = 50, message = \"标题最长 50 字\") String title,\n        @Size(max = 500) String content) {}\n\n@PostMapping(\"/api/todos\")\npublic Result<TodoVO> create(@Valid @RequestBody TodoCreateRequest req) {\n    return Result.ok(todoService.create(req));\n}\n```\n\n**日志**：门面 slf4j + 实现 Logback（Boot 默认），用 Lombok 的 `@Slf4j` 注入 logger；级别 `TRACE < DEBUG < INFO < WARN < ERROR`，生产默认 INFO；配置输出格式与滚动策略，禁止 `System.out.println`（不走级别控制、无上下文、影响性能）。\n\n### 5. 整合与部署\n\n- **MyBatis-Plus**：引入 starter + 驱动，yml 配数据源，`@MapperScan` 扫 Mapper 包，继承 `BaseMapper` 即得 CRUD（下一篇专讲）。\n- **Redis**：引入 `spring-boot-starter-data-redis`；默认 `RedisTemplate` 用 JDK 序列化（乱码且跨语言差），推荐 `StringRedisTemplate` + 手动 JSON 序列化，或自定义 key/value 序列化器。\n- **Actuator**：`/actuator/health` 健康检查、`/actuator/info`、`/actuator/metrics`，是接监控体系（Prometheus）的基础，生产注意暴露范围。\n- **打包部署**：`mvn clean package` 打出可执行 fat jar（内嵌 Tomcat），`java -jar xxx.jar --spring.profiles.active=prod` 直接运行；Docker 部署本质就是把 jar 拷进镜像用 `java -jar` 启动。\n\n## 🛠 动手实践（本指南第一个完整项目）\n\n### 任务 ⭐：todo-list REST API（3 天，贯穿本篇所有知识点）\n\n**第 1 步：建库建表**\n\n```sql\nCREATE DATABASE todo_db DEFAULT CHARSET utf8mb4;\nUSE todo_db;\nCREATE TABLE todo (\n  id         BIGINT PRIMARY KEY AUTO_INCREMENT,\n  title      VARCHAR(50)  NOT NULL,\n  content    VARCHAR(500),\n  done       TINYINT      NOT NULL DEFAULT 0 COMMENT '0未完成 1完成',\n  created_at DATETIME     NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  updated_at DATETIME     NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP\n);\n```\n\n**第 2 步：工程骨架**——`spring-boot-starter-web` + `spring-boot-starter-validation` + 数据库/持久层 + Redis 依赖；`application-dev.yml`（本地数据库）与 `application-prod.yml`（改端口 8081、日志级别 WARN）双环境。\n\n**第 3 步：实现接口**——实体 Todo、Mapper、Service、Controller 四层；接口清单：\n\n| 方法 | 路径 | 说明 |\n| --- | --- | --- |\n| GET | /api/todos?done=false&page=1&size=10 | 分页条件查询 |\n| GET | /api/todos/{id} | 详情（走 Redis 缓存） |\n| POST | /api/todos | 新增，@Valid 校验 |\n| PUT | /api/todos/{id} | 更新 |\n| DELETE | /api/todos/{id} | 删除 |\n\n**第 4 步：横切能力**——`Result<T>` 统一返回、`GlobalExceptionHandler` 三段式异常处理、`BusinessException`（如 id 不存在抛 404）、`@Slf4j` 记录入参出参。\n\n**第 5 步：Redis 缓存查询结果**：\n\n```java\npublic TodoVO getById(Long id) {\n    String key = todoProperties.getKeyPrefix() + id;\n    String cached = stringRedisTemplate.opsForValue().get(key);\n    if (cached != null) return objectMapper.readValue(cached, TodoVO.class);\n    TodoVO vo = todoMapper.selectById(id);\n    if (vo == null) throw new BusinessException(404, \"待办不存在\");\n    stringRedisTemplate.opsForValue().set(key, objectMapper.writeValueAsString(vo),\n                                          todoProperties.getCacheTtl());\n    return vo;\n}\n```\n\n注意：新增/更新/删除后删除对应缓存 key（先更新库，再删缓存）。\n\n**验收标准清单（全部满足才算完成）**：\n\n- [ ] 10 个验收点逐一自测：POST 缺标题返回 400 + 统一错误体，正常创建返回 `code=200` 与 data。\n- [ ] GET 单个：首次查库、二次命中 Redis（日志可见），更新后缓存被删、再次查询回源。\n- [ ] 查询不存在的 id 返回业务码 404 而不是 500。\n- [ ] 分页接口 page/size/done 条件生效。\n- [ ] DELETE 后 GET 返回 404。\n- [ ] 手动抛 RuntimeException 能被全局异常兜底为统一 500 体，控制台有堆栈。\n- [ ] `--spring.profiles.active=prod` 启动后端口变为 8081。\n- [ ] `mvn clean package` 打出 fat jar，`java -jar` 运行功能不缩水。\n- [ ] `/actuator/health` 返回 `{\"status\":\"UP\"}`。\n- [ ] 代码分层清晰：Controller 只做参数处理，业务在 Service。\n\n## 💼 高频面试题\n\n**Q：Spring Boot 自动配置的原理？**\n- @EnableAutoConfiguration 通过 AutoConfigurationImportSelector 读取各 jar 的 `META-INF/spring/...AutoConfiguration.imports` 文件（2.7 前是 spring.factories），拿到全部候选配置类。\n- 再用条件注解过滤：@ConditionalOnClass 类存在、@ConditionalOnMissingBean 用户没自定义、@ConditionalOnProperty 配置满足。\n- 结论：框架给默认值，用户一旦配置/自定义 Bean 就让位——这就是约定优于配置的实现方式。\n\n**Q：@SpringBootApplication 由哪些注解组成？**\n- @SpringBootConfiguration：本质是 @Configuration，标记主类为配置类。\n- @EnableAutoConfiguration：开启自动配置。\n- @ComponentScan：扫描主类所在包及子包，所以主类要放最外层。\n\n**Q：什么是 starter？如何自定义？**\n- starter = 按功能聚合的依赖集合 + 对应自动配置，引入即用，版本由 parent 统一管理。\n- 自定义：xxx-autoconfigure 模块写自动配置类（加条件注解）并在 AutoConfiguration.imports 登记；xxx-starter 模块聚合依赖。\n- 使用方引入 xxx-starter，配置对应属性即可生效。\n\n**Q：@ConfigurationProperties 和 @Value 怎么选？**\n- @ConfigurationProperties 按前缀批量绑定成对象，类型安全、支持 JSR303 校验、支持松散绑定（cache-ttl → cacheTtl），适合一组相关配置。\n- @Value 单个注入，支持 SpEL，适合零散的简单值。\n- 都能获取配置，但 @Value 不支持复杂对象绑定与校验。\n\n**Q：Spring Boot 的启动流程大概是什么样的？**\n- new SpringApplication()：推断应用类型（Servlet/Reactive）、加载 Initializer 与 Listener。\n- run()：准备 Environment（加载配置）→ 创建 ApplicationContext → prepareContext 加载主类 → **refresh()（核心：解析自动配置、注册 Bean）** → 回调 CommandLineRunner/ApplicationRunner。\n- 一句话：启动 = 准备环境 → 创建并刷新容器（自动配置在这里生效）→ 执行 Runner。\n\n**Q：全局异常处理怎么实现？**\n- @RestControllerAdvice + @ExceptionHandler 捕获 Controller 层抛出的异常。\n- 细分处理：参数校验异常返回 400、业务异常 BusinessException 返回业务码、Exception 兜底返回 500 并记录日志。\n- 配合统一返回体，前端拿到的永远是 `{code, message, data}` 结构。\n\n**Q：为什么推荐 slf4j + Logback？**\n- slf4j 是门面（API 抽象），Logback 是实现，门面与实现分离，换实现不改业务代码。\n- 有级别控制、异步输出、滚动归档等生产必备能力；System.out 都不具备且不可控。\n\n## 🔗 推荐资料\n\n| 资料 | 说明 | 链接 |\n| --- | --- | --- |\n| 廖雪峰 Spring Boot 教程 | 从 Hello World 到完整的开发流程 | https://liaoxuefeng.com/books/java/springboot/index.html |\n| JavaGuide Spring 常见问题总结 | 含 Spring Boot 面试高频题 | https://javaguide.cn/system-design/framework/spring/spring-knowledge-and-questions-summary.html |\n| pdai Spring 知识体系 | 含 Spring Boot 核心机制章节 | https://pdai.tech/md/spring/spring.html |\n| 廖雪峰 Maven 教程 | 打包、依赖管理，部署实践的基础 | https://liaoxuefeng.com/books/java/maven/index.html |\n","ck":10},{"id":"f23","stage":5,"path":"05-框架篇/03-MyBatis.md","title":"MyBatis","md":"# MyBatis\n\n> **阶段**：框架篇 ｜ **建议时长**：4 天 ｜ **前置**：02-SpringBoot实战.md（及数据库篇）\n\n## 🎯 学习目标\n\n- 能说清 #{} 与 ${} 的本质区别，以及什么场景才允许用 ${}。\n- 能熟练使用 if/where/choose/set/foreach 编写动态 SQL，并用 resultMap 完成一对多映射。\n- 能讲出一二级缓存的作用域与\"二级缓存为什么生产慎用\"。\n- 能给现有项目接入 MyBatis-Plus：BaseMapper、Wrapper、分页、自动填充、逻辑删除、乐观锁。\n- 能解释\"Mapper 接口没有实现类为什么能执行\"（动态代理原理）。\n\n## 📖 核心知识点\n\n### 1. 定位与核心组件\n\n> MyBatis 是半自动 ORM：SQL 自己写（可控、可优化），参数与结果映射自动做（省样板代码）。\n\n核心组件四件套：`SqlSessionFactoryBuilder`（读配置建工厂）→ `SqlSessionFactory`（重量级，全局一份）→ `SqlSession`（轻量，一次会话）→ **Mapper 接口 + XML**（真正的业务入口）。Spring Boot 整合后前三者被容器托管，你只面对 Mapper。\n\nSpring Boot 接入（Boot 3.x 用 `mybatis-plus-spring-boot3-starter`，2.7 用 `mybatis-plus-boot-starter`；裸 MyBatis 用 `mybatis-spring-boot-starter`）：\n\n```yaml\n# application.yml\nspring:\n  datasource:\n    url: jdbc:mysql://localhost:3306/todo_db?useSSL=false&serverTimezone=Asia/Shanghai\n    username: root\n    password: root123\nmybatis-plus:\n  configuration:\n    map-underscore-to-camel-case: true   # created_at → createdAt 自动驼峰映射\n  global-config:\n    db-config:\n      id-type: auto                      # 主键用数据库自增\nlogging:\n  level:\n    com.example.demo.mapper: debug       # 打印 SQL，调试必备\n```\n\n```java\n@SpringBootApplication\n@MapperScan(\"com.example.demo.mapper\")   // 扫描 Mapper 接口\npublic class DemoApplication { ... }\n```\n\n### 2. CRUD 与 #{}/${} ⭐\n\n> 面试官想听：#{} 预编译防注入、${} 拼接有风险，必须说出\"什么情况下才用 ${}\"。\n\n```xml\n<select id=\"getById\" resultType=\"Todo\">        <!-- #{} → 占位符 ? -->\n  SELECT * FROM todo WHERE id = #{id}\n<\/select>\n<insert id=\"insert\" useGeneratedKeys=\"true\" keyProperty=\"id\">  <!-- 主键回填到实体 -->\n  INSERT INTO todo (title, content) VALUES (#{title}, #{content})\n<\/insert>\n```\n\n- **#{})**：预编译占位符，`#{id}` 变成 `?`，值由 PreparedStatement 安全设置，**防 SQL 注入**，绝大多数场景用它。\n- **${}**：字符串直接替换进 SQL，有注入风险。只用于表名、列名、`ORDER BY` 字段这类\"不能加引号\"的动态部位，且必须用白名单校验：\n\n```java\nprivate static final Set<String> SORTABLE = Set.of(\"created_at\", \"title\");  // 白名单\n// if (!SORTABLE.contains(sortField)) throw new IllegalArgumentException();\n```\n\n### 3. 动态 SQL ⭐\n\n> 面试官想听：写过多条件查询就一定用过这些标签，each 标签说得出解决什么问题。\n\n```xml\n<select id=\"search\" resultType=\"Todo\">\n  SELECT * FROM todo\n  <where>                                          <!-- where 标签：自动去掉开头多余的 AND/OR -->\n    <if test=\"done != null\">AND done = #{done}<\/if>\n    <if test=\"keyword != null and keyword != ''\">\n      AND title LIKE CONCAT('%', #{keyword}, '%')\n    <\/if>\n    <choose>                                       <!-- choose/when/otherwise = if/else if/else -->\n      <when test=\"orderBy == 'time'\">ORDER BY created_at DESC<\/when>\n      <otherwise>ORDER BY id DESC<\/otherwise>\n    <\/choose>\n  <\/where>\n<\/select>\n\n<update id=\"updateTodo\">                           <!-- set 标签：自动去掉末尾多余的逗号 -->\n  UPDATE todo\n  <set>\n    <if test=\"title != null\">title = #{title},<\/if>\n    <if test=\"content != null\">content = #{content},<\/if>\n    <if test=\"done != null\">done = #{done},<\/if>\n  <\/set>\n  WHERE id = #{id}\n<\/update>\n\n<insert id=\"batchInsert\">                          <!-- foreach：in 查询 / 批量插入 -->\n  INSERT INTO todo (title, content) VALUES\n  <foreach collection=\"list\" item=\"t\" separator=\",\">\n    (#{t.title}, #{t.content})\n  <\/foreach>\n<\/insert>\n```\n\n记忆口诀：`if` 条件拼接、`where` 去头、`set` 去尾、`choose` 分支、`foreach` 循环。\n\n### 4. resultMap 与关联映射\n\n自动映射搞不定\"一对多/一对一\"和列名对不上时用 `resultMap`：\n\n```xml\n<resultMap id=\"studentWithScores\" type=\"Student\">\n  <id property=\"id\" column=\"id\"/>\n  <result property=\"name\" column=\"name\"/>\n  <collection property=\"scores\" ofType=\"Score\">     <!-- 一对多；一对一用 association -->\n    <id property=\"id\" column=\"score_id\"/>\n    <result property=\"courseName\" column=\"course_name\"/>\n    <result property=\"value\" column=\"value\"/>\n  <\/collection>\n<\/resultMap>\n\n<select id=\"getStudentWithScores\" resultMap=\"studentWithScores\">\n  SELECT s.id, s.name, sc.id AS score_id, c.name AS course_name, sc.value\n  FROM student s\n  LEFT JOIN score sc ON sc.student_id = s.id\n  LEFT JOIN course c ON c.id = sc.course_id\n  WHERE s.id = #{id}\n<\/select>\n```\n\n联表一次查出（结果集映射）适合少量数据；分步查询（先查学生再按 id 查成绩）适合懒加载，但要警惕 **N+1 问题**：查 1 次列表又对每行发 1 次子查询。原则：列表页用联表，详情页可分步。\n\n### 5. 缓存与批量操作 ⭐\n\n> 面试官想听：一级二级缓存的作用域差别，以及\"为什么二级缓存生产慎用\"。\n\n- **一级缓存**：SqlSession 级别，默认开启。同一 SqlSession 内相同查询直接命中；任何增删改都会清空。Spring 整合后每次请求通常是新 SqlSession，所以平时感觉不到它的存在（同一事务内有效）。\n- **二级缓存**：namespace（Mapper）级别，需手动开启（`<cache/>`），跨 SqlSession 共享。慎用原因：多表关联时任一表更新，其他 Mapper 的缓存感知不到，容易读到脏数据；分布式部署下多节点缓存不同步。生产一般不开启，统一用 Redis 做缓存。\n- **PageHelper 分页**：`PageHelper.startPage(page, size)` 用 ThreadLocal 携带分页参数，拦截下一条 SQL 自动拼 `LIMIT`，物理分页：\n\n```java\nPageHelper.startPage(1, 10);\nList<Todo> list = todoMapper.search(keyword, done);\nPageInfo<Todo> page = new PageInfo<>(list);   // total、pages 等分页信息\n```\n\n注意 startPage 和查询必须紧挨着，且不要 try 包裹后中途 return。\n\n- **批量操作**：小批量用 `foreach` 拼多值 INSERT；大批量（万级）用 `ExecutorType.BATCH` 的 SqlSession 分批 flush，避免 SQL 过长与超参数上限。\n\n### 6. MyBatis-Plus ⭐\n\n> 面试官想听：MP 解决\"单表 CRUD 重复劳动\"，但复杂 SQL 仍要手写——知道边界比背 API 重要。\n\n```java\n@TableName(\"todo\")\npublic class Todo {\n    @TableId(type = IdType.AUTO)\n    private Long id;\n    private String title;\n    private String content;\n    private Boolean done;\n    @TableField(fill = FieldFill.INSERT)\n    private LocalDateTime createdAt;\n    @TableLogic                                    // 逻辑删除：delete 变 UPDATE deleted=1\n    private Integer deleted;\n    @Version                                       // 乐观锁版本号\n    private Integer version;\n}\n\npublic interface TodoMapper extends BaseMapper<Todo> {}   // 继承即得 CRUD\n\n// 条件构造器：动态条件不用再写 XML\nLambdaQueryWrapper<Todo> qw = new LambdaQueryWrapper<>();\nqw.eq(Todo::getDone, false)\n  .like(StringUtils.hasText(keyword), Todo::getTitle, keyword)   // 条件为 true 才拼接\n  .orderByDesc(Todo::getCreatedAt);\nList<Todo> list = todoMapper.selectList(qw);\n\n// 分页插件：物理分页\nPage<Todo> page = todoMapper.selectPage(new Page<>(1, 10), qw);\n```\n\n三个内置插件一次配齐：\n\n```java\n@Bean\npublic MybatisPlusInterceptor mybatisPlusInterceptor() {\n    MybatisPlusInterceptor interceptor = new MybatisPlusInterceptor();\n    interceptor.addInnerInterceptor(new PaginationInnerInterceptor(DbType.MYSQL)); // 分页\n    interceptor.addInnerInterceptor(new OptimisticLockerInnerInterceptor());       // 乐观锁\n    return interceptor;\n}\n\n@Component\npublic class FillHandler implements MetaObjectHandler {     // 自动填充 created_at 等\n    @Override\n    public void insertFill(MetaObject metaObject) {\n        strictInsertFill(metaObject, \"createdAt\", LocalDateTime.class, LocalDateTime.now());\n    }\n    @Override\n    public void updateFill(MetaObject metaObject) {\n        strictUpdateFill(metaObject, \"updatedAt\", LocalDateTime.class, LocalDateTime.now());\n    }\n}\n```\n\nService 层用 `IService<Todo>` / `ServiceImpl<TodoMapper, Todo>`，自带 `saveBatch`、`getById`、`page` 等封装。\n\n### 7. 原理与选型 ⭐\n\n> 面试官想听：Mapper 接口原理是 MyBatis 最高频的原理题，答对关键在\"JDK 动态代理 + 全限定名定位 SQL\"。\n\n```text\n@MapperScan 扫描接口 → 每个接口注册为 MapperFactoryBean\n调用接口方法 → JDK 动态代理 MapperProxy 拦截\n→ 用 接口全限定名.方法名 定位 MappedStatement（XML 里 <select id=\"...\"> 对应一条）\n→ SqlSession 执行 JDBC → 结果按映射规则转成对象\n```\n\n所以接口无需实现类：**代理对象的 invoke 逻辑就是\"方法签名 → SQL 语句 → 执行 → 映射\"**，id 的对应关系由\"namespace 必须等于接口全限定名\"保证。\n\n**MyBatis vs JPA/Hibernate**：MyBatis SQL 可控、好优化、上手快，但每个查询要自己写；JPA 全自动 CRUD、移植性好，但复杂查询/优化受限。国内互联网主流 MyBatis(-Plus)（业务 SQL 复杂、重性能），海外及简单业务系统 JPA 居多——回答时给出\"按场景选型\"的结论。\n\n## 🛠 动手实践\n\n### 任务 1：给 todo-list 项目接入 MyBatis-Plus（1.5 小时）\n\n替换 SpringBoot 实战篇项目中的持久层实现（保留 Controller/Service 接口不变，体现分层价值）。\n验收：`TodoMapper extends BaseMapper<Todo>` 完成 5 个接口的 CRUD；`LambdaQueryWrapper` 实现按 done + 关键字筛选；打开 SQL 日志能看到执行的语句。\n\n### 任务 2：动态 SQL 多条件分页查询（2 小时）\n\nXML 写法：`search` 语句支持 keyword（模糊）、done（等值）、时间范围（`&gt;=` 用 `<![CDATA[ ]]>` 或转义），配合 PageHelper 分页。\n验收：四种参数组合（全空/只有 keyword/只有 done/全有）生成的 SQL 各不相同且正确；PageInfo 的 total 与实际数据条数一致。\n\n### 任务 3：MP 三件套生效验证（1.5 小时）\n\n开启分页、自动填充、逻辑删除、乐观锁插件（见第 6 节代码），逐个验证。\n验收：分页 SQL 出现 `LIMIT`；insert 自动写入 createdAt；delete 后表里数据还在（`deleted=1`），查询默认过滤已删数据；两个会话并发更新同一条数据，version 冲突时后提交的影响行数为 0，业务代码能感知并重试。\n\n## 💼 高频面试题\n\n**Q：#{} 和 ${} 的区别？**\n- #{} 预编译占位符，编译成 `?` 由 PreparedStatement 设值，防 SQL 注入，默认用它。\n- ${} 字符串拼接，直接替换进 SQL，有注入风险。\n- ${} 只用于动态表名/列名/排序字段等不能加引号的位置，且必须白名单校验。\n\n**Q：MyBatis 的一级、二级缓存？为什么二级慎用？**\n- 一级缓存 SqlSession 级默认开启，会话内相同查询命中，增删改清空；Spring 下每次请求新会话，基本感知不到。\n- 二级缓存 namespace 级，跨会话共享，需手动开启。\n- 慎用原因：多表关联更新时其他 Mapper 感知不到，易脏读；分布式部署多节点不同步。生产一般用 Redis 替代。\n\n**Q：Mapper 接口没有实现类，为什么能执行 SQL？**\n- MyBatis 用 JDK 动态代理为接口生成 MapperProxy 代理对象。\n- 调用方法时用\"接口全限定名.方法名\"匹配 XML 里的 MappedStatement（namespace = 接口全限定名，id = 方法名）。\n- 代理的 invoke 里走 SqlSession 执行 JDBC 并做结果映射，所以不需要手写实现类。\n\n**Q：动态 SQL 有哪些标签？**\n- if 条件拼接；where 自动去掉开头 AND/OR；set 自动去掉末尾逗号。\n- choose/when/otherwise 实现多分支；foreach 处理集合（in、批量插入）。\n- trim 可自定义前后缀的增删，是 where/set 的底层实现。\n\n**Q：MyBatis 和 JPA/Hibernate 怎么选？**\n- MyBatis 半自动：SQL 自己写，可控、易优化，适合复杂查询、报表、互联网业务。\n- JPA 全自动：CRUD 零 SQL、开发效率高，但复杂查询难调优。\n- 国内主流 MyBatis-Plus：单表交给 MP，复杂 SQL 回到 XML 手写。\n\n**Q：什么是 N+1 问题？怎么避免？**\n- 查 1 次主列表后，对每行记录再发 1 次子查询，1 次变 N+1 次，性能崩塌。\n- 避免列表页用联表一次查出（resultMap collection/association）。\n- 分步查询仅在详情页或确有懒加载需求时使用，并控制列表行数。\n\n**Q：PageHelper 分页的原理？**\n- PageHelper.startPage 把分页参数放进 ThreadLocal。\n- 拦截器拦截紧跟其后的第一条查询，改写 SQL 追加 LIMIT，并额外发 COUNT 语句求总数。\n- 注意 startPage 与查询必须紧邻，防止 ThreadLocal 残留误伤其他 SQL。\n\n## 🔗 推荐资料\n\n| 资料 | 说明 | 链接 |\n| --- | --- | --- |\n| JavaGuide MyBatis 面试题 | 本篇高频题的标准答案库 | https://javaguide.cn/system-design/framework/mybatis/mybatis-interview.html |\n| JavaGuide SQL 语句面试题 | 动态 SQL 要解决的查询场景练手 | https://javaguide.cn/database/sql/sql-questions-01.html |\n| JavaGuide MySQL 面试题 | SQL 层面试题与 MyBatis 面试题互补 | https://javaguide.cn/database/mysql/mysql-questions-01.html |\n| 廖雪峰 Spring Boot 教程 | 整合数据访问与工程组织的上下文 | https://liaoxuefeng.com/books/java/springboot/index.html |\n","ck":0},{"id":"f24","stage":5,"path":"05-框架篇/04-SpringCloud微服务.md","title":"SpringCloud微服务","md":"# SpringCloud微服务\n\n> **阶段**：框架篇 ｜ **建议时长**：6 天 ｜ **前置**：02-SpringBoot实战.md\n\n## 🎯 学习目标\n\n- 能说出微服务拆分的时机与代价，并画出微服务技术栈全景图。\n- 能讲清 Nacos 注册中心的注册/心跳/发现机制，并实现配置中心热更新。\n- 能用 OpenFeign 完成服务间声明式调用，并配置超时、重试与日志。\n- 能用 Gateway 统一入口并写一个全局鉴权过滤器，能用 Sentinel 配置限流与熔断降级。\n- 能独立完成 order/product 双服务实战，通过全部验收标准。\n\n## 📖 核心知识点\n\n### 1. 单体 → 微服务 ⭐\n\n> 面试官想听：不是背\"微服务好\"，而是能说出\"什么时候该拆、拆了要付出什么\"。\n\n- 拆分收益：模块独立部署发布（互不拖累）、故障隔离（一个服务挂不拖垮全站）、按服务伸缩（订单服务单独扩容）、团队并行开发、技术栈可选。\n- 拆分代价：分布式复杂性全部入场——网络调用不可靠、数据一致性变难、链路排查复杂、运维成本翻倍。\n- 拆分时机：团队规模大了需要并行；模块间发布节奏冲突严重；不同模块负载差异大需要独立伸缩。**早期单体能扛就先单体**，拆分是演进不是起点。\n- 组件全景（每个角色解决一个分布式问题）：\n\n```text\n注册发现：服务上下线感知（Nacos）\n配置中心：配置集中管理与热更新（Nacos）\n远程调用：跨服务 HTTP 调用（OpenFeign）+ 负载均衡（LoadBalancer）\nAPI 网关：统一入口、鉴权、路由、限流（Gateway）\n熔断限流：保护服务不被打垮（Sentinel）\n链路追踪：一次请求跨多个服务，怎么串起来（SkyWalking）\n分布式事务：跨库写一致性（Seata，衔接分布式篇）\n```\n\n### 2. 技术栈现状 ⭐\n\n> 面试官想听：知道行业从 Netflix 迁移到 Spring Cloud Alibaba 的现状，版本对应能说一句即可。\n\n- **Netflix 全家桶**（Eureka 注册、Ribbon 负载均衡、Hystrix 熔断、Zuul 网关）2018 年起陆续停止更新、进入维护模式，新项目不用。\n- **国内主流组合**：Spring Cloud Alibaba（Nacos + Sentinel + Seata）+ Spring Cloud 官方（Gateway + OpenFeign + LoadBalancer）。\n- 版本对应一句话：**Spring Cloud Alibaba 2022.x ↔ Spring Cloud 2022.x ↔ Spring Boot 3.0.x，Nacos 用 2.x**——三者版本必须配套，官方对照表查一下再用。\n\n### 3. Nacos：注册中心 + 配置中心 ⭐\n\n> 面试官想听：服务怎么注册、怎么知道对方还活着、配置怎么热更新，三问连环。\n\n**注册中心原理**：\n\n```text\n服务注册：服务启动时把 实例名/IP/端口 上报到 Nacos\n心跳检测：临时实例默认每 5s 发一次心跳（Nacos 2.x 临时实例走 gRPC 长连接，机制等价）\n          15s 未心跳标记为不健康，30s 未心跳剔除实例\n服务发现：消费者从 Nacos 拉取实例列表并订阅，实例变更时推送更新\n```\n\n注册中心解决的是\"服务地址动态变化\"：扩缩容、重启后 IP 变了，调用方无需改配置。\n\n**配置中心 + 热更新**：配置集中存到 Nacos，改完不用重启即生效——`@Value` 所在类加 `@RefreshScope`，或用 `@ConfigurationProperties` 绑定（原生支持刷新）：\n\n```java\n@RestController\n@RefreshScope\npublic class ConfigController {\n    @Value(\"${app.welcome:hello}\")\n    private String welcome;      // Nacos 控制台改值发布后，这里立即读到新值\n}\n```\n\n**namespace 与 group**：namespace 隔离环境（dev/test/prod 各一个），group 隔离项目/模块；配置按 `dataId + group + namespace` 三元组定位。\n\n### 4. OpenFeign：声明式远程调用 ⭐\n\n> 面试官想听：Feign 的原理一句话（接口 + 动态代理 → HTTP 请求），以及超时重试的幂等意识。\n\n```java\n@FeignClient(name = \"product-service\")      // 服务名，走注册中心寻址\npublic interface ProductClient {\n    @GetMapping(\"/api/products/{id}\")\n    ProductVO getById(@PathVariable(\"id\") Long id);\n}\n\n// 注入即用，像调用本地方法一样发 HTTP 请求\n@Service\n@RequiredArgsConstructor\npublic class OrderService {\n    private final ProductClient productClient;\n\n    public OrderVO create(Long productId) {\n        ProductVO product = productClient.getById(productId);  // 远程调用\n        return orderAssembler.assemble(product);\n    }\n}\n```\n\n要点：\n\n- 原理：接口方法 → 动态代理 → 组装 HTTP 请求 → 经 LoadBalancer 从实例列表选一台发出 → 解码响应。`lb://` 前缀即\"负载均衡寻址\"。\n- **超时**：默认偏保守，必须显式配置 `connectTimeout` / `readTimeout`，防止下游慢调用拖垮自己。\n- **重试**：`Retryer` 可配次数与间隔；只对幂等操作（查询）开重试，下单、扣款这类非幂等操作重试会造成重复下单。\n- **日志**：`Logger.Level.BASIC/FULL` + `logging.level.<client包>=debug`，排查联调问题的第一手段。\n\n### 5. Gateway：统一入口 ⭐\n\n> 面试官想听：网关三大概念 + 全局过滤器做鉴权的思路。\n\n网关作用：统一入口、路由转发、统一鉴权、限流、跨域处理——让鉴权这类横切逻辑只做一次，不用每个服务重复实现。\n\n三大概念：**Route**（一条路由 = 目标 URI + 断言 + 过滤器）、**Predicate**（断言：Path/Method/Query/Header 等匹配条件）、**Filter**（请求/响应的加工处理）。\n\n```yaml\nspring:\n  cloud:\n    gateway:\n      routes:\n        - id: order-route\n          uri: lb://order-service          # lb = 从注册中心负载均衡\n          predicates:\n            - Path=/api/orders/**\n        - id: product-route\n          uri: lb://product-service\n          predicates:\n            - Path=/api/products/**\n```\n\n**全局过滤器鉴权**：\n\n```java\n@Component\npublic class AuthGlobalFilter implements GlobalFilter, Ordered {\n    private static final Set<String> WHITE_LIST = Set.of(\"/api/auth/login\", \"/api/auth/register\");\n\n    @Override\n    public Mono<Void> filter(ServerWebExchange exchange, GatewayFilterChain chain) {\n        String path = exchange.getRequest().getPath().value();\n        if (WHITE_LIST.stream().anyMatch(path::startsWith)) return chain.filter(exchange);\n        String token = exchange.getRequest().getHeaders().getFirst(\"Authorization\");\n        if (!StringUtils.hasText(token)) {                        // 未登录直接拦截\n            exchange.getResponse().setStatusCode(HttpStatus.UNAUTHORIZED);\n            return exchange.getResponse().setComplete();\n        }\n        // 校验 token，把用户信息透传给下游服务（放 header）\n        return chain.filter(exchange);\n    }\n    @Override\n    public int getOrder() { return -1; }                          // 数值越小越先执行\n}\n```\n\n### 6. Sentinel：限流与熔断降级 ⭐\n\n> 面试官想听：限流/熔断/降级三者区别，这是微服务稳定性面试的核心题。\n\n- **限流**：请求量超阈值直接拒绝，保护自己（如 QPS 限 100）。规则维度：QPS / 并发线程数；流控效果：快速失败、Warm Up（预热爬升）、排队等待。\n- **熔断**：下游大量超时/异常时\"跳闸\"，一段时间内不再调用下游，直接走兜底，防止线程池被拖垮引发**服务雪崩**（一个服务慢 → 上游线程全堵住 → 连锁崩溃）。熔断器状态：关闭 → 打开 → 半开（放几个探测请求，成功则恢复）。\n- **降级**：被限流/熔断/异常时的兜底方案：返回缓存旧值、默认值、空列表等\"有损但可用\"的结果。\n- 雪崩应对三板斧：超时、限流、熔断降级。\n\n```java\n@GetMapping(\"/{id}\")\n@SentinelResource(value = \"getProduct\",\n                  blockHandler = \"getProductBlock\",    // 处理限流/熔断触发\n                  fallback = \"getProductFallback\")     // 处理业务异常\npublic ProductVO getProduct(@PathVariable Long id) {\n    return productService.getById(id);\n}\n\npublic ProductVO getProductBlock(Long id, BlockException ex) {\n    return ProductVO.defaultFallback();    // 限流/熔断时的兜底\n}\n```\n\n规则可在 Sentinel Dashboard（控制台）配置，默认内存态、重启丢失，生产要接 Nacos 做规则持久化——这是加分项。\n\n### 7. 可观测与一致性（概念铺垫）\n\n- **链路追踪**：一次请求经过网关→订单→商品多个服务，SkyWalking 用 TraceId 把整条调用链串起来，可视化展示每段耗时、定位慢点和报错点；特点是基于字节码增强、业务代码零侵入。一句话了解即可，中间件篇/分布式篇展开。\n- **Seata**：分布式事务框架，AT 模式最常用——一阶段自动记录数据快照生成 undo_log，二阶段成功则删日志、失败则用快照反向补偿回滚。此处只需知道\"跨服务跨库的写操作需要它\"，详细机制在分布式篇。\n\n## 🛠 动手实践\n\n### 任务 ⭐：order/product 双服务微服务链路（4 天）\n\n**第 1 步：起环境**——Docker 启动 Nacos（standalone）：\n\n```bash\ndocker run -d --name nacos -e MODE=standalone \\\n  -p 8848:8848 -p 9848:9848 nacos/nacos-server:v2.2.3\n```\n\n**第 2 步：两个 Spring Boot 服务**——`product-service`（商品查询/列表）与 `order-service`（下单，需要查商品）。依赖版本配套：Spring Boot 3.0.x + spring-cloud 2022.0.x + spring-cloud-alibaba 2022.0.0.x，依赖 `spring-cloud-starter-alibaba-nacos-discovery`、`spring-cloud-starter-openfeign`、`spring-cloud-starter-loadbalancer`。yml 关键配置：\n\n```yaml\nspring:\n  application:\n    name: product-service          # 服务名即注册名，消费方按它寻址\n  cloud:\n    nacos:\n      server-addr: localhost:8848\n```\n\n**第 3 步：Feign 互调**——order-service 定义 `ProductClient` 调 product-service 的查询接口（见第 4 节），配好超时与 BASIC 日志。\n\n**第 4 步：Gateway 统一入口**——新建 gateway 服务，按第 5 节配置两条路由，并实现 `AuthGlobalFilter`：白名单放行登录接口，其余无 token 返回 401。\n\n**第 5 步：Sentinel 限流**——order/order-list 资源加 `@SentinelResource`，控制台对该资源配置 QPS=2 的流控规则，触发后返回兜底数据；再给 product 接口模拟慢调用，配置慢调用比例熔断规则，观察\"熔断打开→请求直接走 fallback→半开恢复\"的过程。\n\n**验收标准清单（全部满足才算完成）**：\n\n- [ ] Nacos 控制台的服务列表能看到 product-service 和 order-service 两个实例，IP 端口正确。\n- [ ] 杀掉 product-service，约 30s 后实例被剔除；重启后自动恢复注册。\n- [ ] 通过 order-service 的接口下单，能拿到商品信息（Feign 调用成功），SQL/调用日志可见。\n- [ ] Nacos 上新建配置并发布，@RefreshScope 的属性值不重启即生效。\n- [ ] 直接访问 `localhost:8080/api/products/1`（Gateway 端口）能路由到 product-service。\n- [ ] 不带 Authorization 头访问非白名单接口返回 401；登录接口白名单放行。\n- [ ] Sentinel 上给资源配 QPS=2 流控后，快速刷新页面触发限流，返回兜底结果而非报错堆栈。\n- [ ] 模拟 product 慢调用触发熔断：连续超时后一段时间内请求直接走 fallback，之后恢复。\n- [ ] 停掉 order-service，gateway 路由返回 503 而不是网关崩溃。\n\n## 💼 高频面试题\n\n**Q：微服务有什么优缺点？什么时候该拆？**\n- 优点：独立部署发布、故障隔离、独立伸缩、团队并行。\n- 缺点：网络调用不可靠、分布式事务与数据一致性难、运维与排查成本高。\n- 拆分时机：团队规模与发布冲突、模块负载差异需要独立伸缩；单体扛得住就先单体，演进式拆分。\n\n**Q：注册中心的原理？Nacos 怎么感知服务上下线？**\n- 服务启动时上报实例信息（注册），消费者拉取并订阅实例列表，变更时推送。\n- 临时实例靠心跳保活：5s 一次心跳，15s 不健康，30s 剔除（2.x 临时实例走长连接，机制等价）。\n- 调用方本地缓存实例列表，注册中心短暂不可用时仍可按缓存调用，保证可用性。\n\n**Q：Feign 的原理？**\n- 声明式 HTTP 客户端：接口 + @FeignClient，启动时用动态代理生成实现。\n- 调用方法 → 按注解组装 HTTP 请求 → 经负载均衡从注册中心实例列表选一台 → 发请求 → 解码响应。\n- 必须配超时；重试只用于幂等操作，非幂等接口重试会重复下单。\n\n**Q：网关的作用？**\n- 统一入口，客户端不感知内部服务地址；按路由规则转发到各服务（lb 负载均衡）。\n- 横切能力收敛一处：鉴权、限流、跨域、日志。\n- 组成：Route（路由）、Predicate（断言匹配）、Filter（前置/后置加工），全局过滤器适合做统一鉴权。\n\n**Q：限流、熔断、降级的区别？**\n- 限流：限制进入的请求量（QPS/线程数），超出直接拒绝，保护自己。\n- 熔断：下游异常率/慢调用超阈值后暂时\"跳闸\"不再调用，防止故障蔓延引发雪崩，状态机为关闭→打开→半开。\n- 降级：被限流/熔断/异常时的兜底响应，返回默认值或缓存旧值，保证有损可用。\n- 三者配合：限流挡量、熔断止损、降级兜底。\n\n**Q：Feign 调用和 Dubbo/RPC 有什么区别？**\n- Feign 基于 HTTP + JSON，跨语言友好、调试简单，性能一般。\n- RPC（如 Dubbo）基于 TCP + 二进制序列化，性能高，但耦合序列化协议。\n- 选型：对外或异构系统用 HTTP；内部大规模高性能调用可上 RPC（见 RPC 入门资料）。\n\n**Q：微服务/分布式环境下会遇到哪些典型问题？**\n- 服务治理：注册发现、负载均衡、故障转移。\n- 数据一致性：跨服务跨库事务（Seata/消息最终一致）、分布式 ID、幂等设计。\n- 稳定性：雪崩防护（超时/限流/熔断降级）、服务依赖治理。\n- 可观测：链路追踪、日志聚合、监控告警；以及配置集中管理与热更新。\n\n## 🔗 推荐资料\n\n| 资料 | 说明 | 链接 |\n| --- | --- | --- |\n| 廖雪峰 Spring Cloud 教程 | 注册发现、网关等组件的入门实操 | https://liaoxuefeng.com/books/java/springcloud/index.html |\n| JavaGuide RPC & Dubbo 入门 | 理解 Feign 与 RPC 的异同 | https://javaguide.cn/distributed-system/rpc/rpc-intro.html |\n| JavaGuide API 网关 | 网关的职责与选型总结 | https://javaguide.cn/distributed-system/api-gateway.html |\n| JavaGuide 高可用系统设计指南 | 限流、熔断、降级、超时的系统论述 | https://javaguide.cn/high-availability/high-availability-system-design.html |\n| pdai 架构知识体系 | 微服务演进与架构设计全景图 | https://pdai.tech/md/arch/arch-z-overview.html |\n","ck":9},{"id":"f25","stage":6,"path":"06-分布式与高并发篇/01-分布式理论基础.md","title":"01-分布式理论基础","md":"# 01-分布式理论基础\n\n> **阶段**：分布式与高并发篇 ｜ **建议时长**：5 天 ｜ **前置**：04-中间件篇（Redis、ZooKeeper、RocketMQ）\n\n## 🎯 学习目标\n\n- 讲清\"单机 → 分布式\"的动机：不是追新技术，而是单机在**性能、容量、可用性**上撞墙后的必然选择；\n- 能结合注册中心（ZooKeeper/Nacos）讲 CAP 定理与 CP/AP 取舍，说清 BASE 理论与强/最终一致性的区别 ⭐；\n- 讲清一致性哈希为什么能让节点扩缩容时只迁移少量数据（哈希环 + 虚拟节点）⭐；\n- 掌握分布式 ID 四种方案，吃透雪花算法 64 位结构与**时钟回拨**处理 ⭐；\n- 从实现、优缺点、选型三个维度对比数据库/Redis/ZooKeeper 三种分布式锁 ⭐⭐；\n- 理解 2PC、TCC、本地消息表、RocketMQ 事务消息、Seata AT 的原理与适用场景，会做选型 ⭐⭐；\n- 说出一次 RPC 调用的完整链路（动态代理 → 序列化 → 网络传输 → 反序列化 → 反射调用）。\n\n## 📖 核心知识点\n\n### 1. 为什么需要分布式\n\n单机架构的三堵墙，每一堵都对应一个\"分布式化\"动作：\n\n| 单机瓶颈 | 具体表现 | 对应解法 |\n| --- | --- | --- |\n| 性能墙 | 单机 QPS/连接数有上限，CPU 与内存物理封顶 | 横向加机器 + 负载均衡 |\n| 容量墙 | 单表几千万行后索引膨胀、单机磁盘放不下 | 分库分表、数据分片 |\n| 可用性墙 | 单机故障 = 全站故障，发布即停服 | 多副本 + 故障转移（Redis/MySQL 主从、服务多实例） |\n\n代价同样明确：**数据一致性变难、运维复杂度上升、排查链路变长**。所以原则是\"先优化单机与架构，能不分布式就不分布式\"，这与下一篇的高并发演进路径是同一条主线。\n\n### 2. CAP 定理与取舍 ⭐\n\n- **C（Consistency）一致性**：所有节点在同一时刻读到相同的数据；\n- **A（Availability）可用性**：每个请求都能得到（非错误的）响应；\n- **P（Partition tolerance）分区容错性**：网络分区（节点间断连）发生时系统仍能工作。\n\n三个关键结论：\n\n1. 分布式系统中网络分区**必然发生**，P 必选，所以真实选择是 **CP 还是 AP**；\n2. 分区发生时：选 CP 就拒绝部分请求保数据一致（分布式锁、选主场景）；选 AP 就返回可能旧的数据保可用（服务发现场景）；\n3. 分区恢复后通过同步、补偿达到最终一致。\n\n**注册中心的取舍（呼应 04-中间件篇）**：\n\n| 注册中心 | 倾向 | 具体表现 |\n| --- | --- | --- |\n| ZooKeeper | CP | 主节点宕机选举期间（可达 30~120 秒）服务不可用，宁停服不脏读 |\n| Eureka | AP | 节点对等，任一节点可用即可完成注册发现，可能读到旧实例列表 |\n| Nacos | AP/CP 可切换 | 临时实例走 Distro 协议（AP），持久实例走 Raft（CP），默认 AP |\n\n**BASE 理论**：选 AP 时的工程化落地方案 —— **BA**（Basically Available，基本可用：降级、限流）、**S**（Soft State，软状态：允许中间态，如\"支付处理中\"）、**E**（Eventually Consistent，最终一致）。\n\n**一致性级别**：\n\n- **强一致**：写完任意节点后，立即可读到最新值，代价高、性能差；\n- **最终一致**：允许短暂不一致，经过一段时间同步后保证一致，互联网业务主流选择；\n- 两者之间还有\"读己之写\"\"单调读\"等会话级保证，面试提一句即可。\n\n### 3. 一致性哈希 ⭐\n\n**普通 Hash 取模的问题**：`hash(key) % N`，N 从 3 变 4 时绝大多数 key 的落点都会变，缓存几乎全部失效——这就是缓存集群扩容的经典痛点。\n\n**哈希环方案**：\n\n1. 把 2^32 的哈希空间想成一个环，节点（按 IP/主机名 hash）与数据（按 key hash）都映射到环上；\n2. 数据沿顺时针找到**第一个节点**存取；\n3. 增删节点时，只有\"该节点逆时针方向到上一个节点之间\"的数据需要迁移（约 1/N），其余全部不动。\n\n**数据倾斜与虚拟节点**：节点少时在环上分布不均，可能大部分数据落到同一节点。给每个物理节点生成 100~200 个**虚拟节点**散布在环上，数据先落在虚拟节点再映射回物理节点，均匀性大幅提升。\n\n**应用**：分布式缓存节点分布、负载均衡（Dubbo 的一致性哈希策略）、分库分表备选方案。注意：Redis Cluster 用的不是一致性哈希，而是 **16384 个 hash slot**，面试要能区分这两者。\n\n### 4. 分布式 ID ⭐\n\n分库分表后自增主键只能保证单表唯一，必须引入全局 ID。核心诉求：全局唯一、趋势递增（利于 B+ 树顺序插入）、信息安全和性能可用性。\n\n| 方案 | 原理 | 优点 | 缺点 |\n| --- | --- | --- | --- |\n| UUID | 128 位随机数 | 本地生成、无依赖、性能高 | 无序导致 B+ 树页分裂、太长（36 字符）、无业务含义 |\n| 数据库号段 | 批量取一段号缓存在应用内存，用完再取 | 趋势递增、DB 压力小（一次取 1000 个） | 依赖 DB、应用重启浪费号段、多机房扩展难 |\n| 雪花算法 | 64 位：时间戳 + 机器 ID + 序列号 | 本地生成、趋势递增、单机每秒 400 万+ | **依赖机器时钟**（回拨问题）、workerId 需要分配 |\n| Redis 自增 | INCR + 初始值/步长 | 简单、有序 | 强依赖 Redis 可用性，需持久化防重启丢数据 |\n\n**雪花算法结构（必背）**：\n\n```text\n| 1 bit 符号位 | 41 bit 时间戳（毫秒级，可用约 69 年） | 10 bit 机器 ID（可拆 5+5 机房+机器，共 1024 台） | 12 bit 序列号（同一毫秒内 0~4095） |\n```\n\n**时钟回拨问题**：机器时间被 NTP 校准往回调后，同一毫秒可能被\"重复使用\"，生成重复 ID。处理思路：小幅度回拨（如 ≤5ms）等待追平；回拨过大直接抛异常告警，或切换备用 workerId。动手实践第 1 题要求实现。\n\n### 5. 分布式锁方案对比 ⭐⭐\n\n单机用 `synchronized`/`ReentrantLock`，应用多实例部署后 JVM 锁失效，需要跨进程互斥——典型如防重复下单、定时任务防多机并发执行。\n\n**方案一：数据库**\n- 唯一索引插入法：`INSERT INTO lock_table(lock_key) VALUES(?)`，插入成功即获锁，删除记录即释放；\n- 悲观锁法：`SELECT ... FOR UPDATE` 排他锁。\n- 缺点：性能差（DB 是瓶颈）、无过期自动释放、宕机要自己处理死锁。仅适合低频场景或没有其他中间件时兜底。\n\n**方案二：Redis（主流）**\n- 雏形：`SET lockKey uniqueValue NX EX 30`，一条命令原子完成\"不存在才设置 + 过期时间\"；\n- 三大坑：① 业务没执行完锁先过期 → Redisson **看门狗**自动续期；② 误删他人锁 → value 存唯一标识，释放时 Lua 校验后再删；③ 不可重入 → Redisson 用 Hash 结构记录持有线程与重入次数；\n- Redisson 关键点：加锁/解锁都是 Lua 脚本保证原子性；不传 leaseTime 时默认锁 30 秒，后台线程每 10 秒（1/3）检查并续期，业务没执行完锁不会失效。\n\n```java\nRLock lock = redissonClient.getLock(\"order:lock:\" + userId);\ntry {\n    // 不指定 leaseTime → 启用看门狗自动续期；第一个参数是最长等待时间\n    if (lock.tryLock(3, TimeUnit.SECONDS)) {\n        // 业务逻辑\n    }\n} finally {\n    if (lock.isHeldByCurrentThread()) {   // 只释放自己持有的锁\n        lock.unlock();\n    }\n}\n```\n\n**方案三：ZooKeeper**\n- 客户端在 `/locks` 下创建**临时顺序节点**；\n- 判断自己是否是序号最小的节点：是则获锁；否则只 **watch 前一个节点**的删除事件（避免羊群效应）；\n- 释放 = 删除自己的节点；客户端宕机时临时节点自动消失，**锁天然不会死锁**；\n- 代价：写请求要走 ZAB 过半提交，性能不如 Redis。\n\n**对比与选型**：\n\n| 维度 | 数据库 | Redis | ZooKeeper |\n| --- | --- | --- | --- |\n| 性能 | 低 | 高（内存操作） | 中 |\n| 可靠性 | 高（落库） | 中（主从切换瞬间可能丢锁） | 高（CP） |\n| 实现复杂度 | 低 | 中（Redisson 已解决） | 中 |\n| 自动过期 | 需自己实现 | 过期时间 + 看门狗续期 | 临时节点（会话断开即释放） |\n| 适用场景 | 低频、无其他中间件 | 高并发业务锁（秒杀、防重） | 强一致要求（选主、元数据） |\n\n**一句话选型**：业务高并发选 Redisson；强一致、不能出错选 ZK；没得选才用数据库。\n\n### 6. 分布式事务方案与选型 ⭐⭐\n\n跨库/跨服务的写操作无法用本地事务保证。先想清楚：**能不用就不用**——能合并到单库就合并，能靠业务流程避开的就避开。\n\n**2PC（两阶段提交）/3PC**：协调者先问所有参与者\"能否提交\"（Prepare），全部同意再统一提交（Commit）。\n- 问题：同步阻塞、协调者单点、第二阶段部分节点宕机会导致数据不一致；3PC 增加超时与 CanCommit 预询问缓解阻塞，但未根治。属于一致性协议层面的考点，工程上很少直接用。\n\n**TCC（Try-Confirm-Cancel）**：业务层的两阶段，每个参与方实现三个方法。\n- Try：预留资源（冻结库存/冻结金额）；Confirm：确认扣减；Cancel：释放预留；\n- 三个经典问题：**空回滚**（Try 没到、Cancel 先到）、**幂等**（重试导致重复执行）、**悬挂**（Cancel 之后迟到的 Try 又落地）；解决方式是事务状态表 + 幂等控制；\n- 特点：不依赖数据库回滚、性能好，但**业务侵入极大**（每个接口要写三套逻辑），适合资金类核心链路。\n\n**本地消息表**：业务操作与\"待发送消息\"记录在**同一个本地事务**里落库，后台任务扫描消息表投递 MQ，投递成功标记完成，失败重试；消费方保证幂等。简单可靠，缺点是与业务耦合、消息表需要定时清理。\n\n**RocketMQ 事务消息**：本地消息表的中间件化。\n1. 发送**半消息**（对消费者不可见）→ 2. 执行本地事务 → 3. 根据结果提交/回滚半消息；Broker 定时**回查**生产者本地事务状态兜底。解决\"本地事务与发消息的原子性\"。\n\n**Seata AT 模式原理 ⭐（国内面试高频）**：\n\n- 一阶段：代理数据源解析业务 SQL，生成前后镜像（before/after image）写入 `undo_log`，**与业务数据在同一个本地事务提交**，同时向 TC（事务协调器）注册分支；\n- 二阶段提交：异步批量删除 undo_log，几乎无性能损耗；\n- 二阶段回滚：根据 undo_log 校验数据未被别人改过，用前镜像生成反向 SQL 补偿；\n- 全局锁：保证一阶段已提交的本地数据，在全局事务回滚前不被其他全局事务修改（隔离性来源）；\n- 优点：业务几乎零侵入（一个 `@GlobalTransactional` 注解）；代价：全局锁带来并发性能损耗。\n\n**选型对比表**：\n\n| 方案 | 一致性 | 性能 | 侵入性 | 适用场景 |\n| --- | --- | --- | --- | --- |\n| 2PC/3PC | 强 | 差 | 低（协议层） | 数据库层面，工程少用 |\n| TCC | 最终一致（较强） | 好 | 极高（手写三接口） | 资金类核心链路 |\n| 本地消息表 | 最终一致 | 好 | 中 | 中小系统的 MQ 场景 |\n| RocketMQ 事务消息 | 最终一致 | 好 | 低 | 依赖 RocketMQ 的异步场景 |\n| Seata AT | 最终一致（准实时） | 中（全局锁） | 低 | 大多数微服务跨库场景 |\n\n### 7. RPC 基础\n\n把本地方法调用变成跨网络调用，中间要做五件事——**一次 RPC 调用流程**：\n\n1. **动态代理**：调用方拿到的是接口的代理对象，方法调用被拦截，组装请求（接口名、方法名、参数、版本号）；\n2. **序列化**：把请求对象序列化成字节流（Kryo/Protobuf/Hessian 等；JSON 慢但可读）；\n3. **网络传输**：客户端通过 Netty（TCP）发送，服务端接收；\n4. **反序列化**：服务端还原请求，根据接口名找到本地实现类；\n5. **反射调用**：`Method.invoke` 执行真实方法，结果原路序列化返回。\n\n注册中心（Nacos/ZK）负责服务地址的注册与发现，负载均衡在调用方（客户端）完成。\n\n**Dubbo 与 OpenFeign 一句话**：都是远程调用方案——Dubbo 是自研 RPC 框架（默认 Dubbo 协议 + 注册中心，服务治理能力强）；OpenFeign 本质是基于 HTTP 的声明式调用客户端（伪 RPC：HTTP + 动态代理），是 Spring Cloud 技术栈的默认选择。\n\n## 🛠 动手实践\n\n1. **手写雪花算法（含时钟回拨抛异常）**\n   - 实现 64 位结构生成器 + 简单 workerId 分配（配置文件或数据库）；\n   - 时钟回拨处理：≤5ms 自旋等待追平；>5ms 抛 `IllegalStateException` 并打告警日志；\n   - **验收**：10 个线程各生成 10 万个 ID，去重后仍是 100 万（无重复）；手动把系统时间回拨 10 秒，程序稳定抛异常而不是生成重复 ID。\n\n2. **封装 Redisson 分布式锁工具类**\n   - 提供 `tryLock(key, waitTime, Supplier)` 模板方法：加锁 → 执行业务 → finally 中释放；进阶用 AOP + 自定义 `@DistributedLock` 注解实现；\n   - **验收**：两个终端同时运行抢锁程序，同一时刻只有一个执行业务；把业务耗时设为 40 秒（超过默认 30 秒锁时长），观察看门狗续期期间锁不失效。\n\n3. **对比测试三种\"锁\"（可选）**\n   - 分别用数据库唯一索引、原生 `SET NX EX`、Redisson 跑同一段\"查库存→扣减\"逻辑；\n   - **验收**：用 JMeter 100 并发压测，观察前两种出现超卖或请求堆积，Redisson 版扣减结果精确；把现象与原因写成注释留在代码里。\n\n## 💼 高频面试题\n\n**Q：CAP 定理是什么？实践中怎么取舍？⭐**\n- P 必选（网络分区无法避免），实际是在 CP 与 AP 之间做选择；\n- 涉及钱、锁、选主的场景选 CP：宁可拒绝服务，不能读到脏数据（ZooKeeper、etcd）；\n- 服务发现、登录态、信息流场景选 AP：宁可返回旧数据，不能整体不可用（Eureka、Nacos 默认）；\n- 分区恢复后靠同步与补偿达到最终一致，这正是 BASE 理论；\n- 能举注册中心的例子（ZK 选举期间不可用 vs Eureka 返回旧列表）是明显加分项。\n\n**Q：一致性哈希解决什么问题？虚拟节点的作用？⭐**\n- 解决节点数变化时普通取模导致几乎全量数据迁移的问题；\n- 哈希环 + 顺时针寻址，增删节点只影响相邻区段的数据（约 1/N）；\n- 节点少时数据倾斜，用虚拟节点（每个物理节点 100~200 个）打散到环上，让分布均匀；\n- 应用：分布式缓存、负载均衡策略；能对比出 Redis Cluster 用的是 hash slot 而非一致性哈希更好。\n\n**Q：讲讲雪花算法的结构？时钟回拨怎么处理？⭐**\n- 64 位 = 1 符号位 + 41 位时间戳（约 69 年）+ 10 位机器 ID + 12 位毫秒内序列号（4096）；\n- 时钟回拨会让同一毫秒被重复使用而生成重复 ID；\n- 处理：小回拨（毫秒级）等待追平；大回拨抛异常告警，或切换备用 workerId；\n- 缓解手段：NTP 用渐变同步（slew）而非阶跃、预留回拨保护位、生产用美团 Leaf 等成熟方案。\n\n**Q：Redis、ZooKeeper、数据库三种分布式锁怎么选？⭐**\n- Redis：性能最高，Redisson 解决了续期、误删、重入三大坑；代价是主从切换瞬间可能丢锁，适合高并发业务锁；\n- ZK：临时顺序节点 + watch 前一个节点，会话断开自动释放、不会死锁，CP 更可靠，性能一般；\n- 数据库：实现最简单，但性能差、无自动过期、要自己处理宕机，只在低频场景兜底；\n- 结论：默认 Redisson；强一致选 ZK；数据库是最后的选择。\n\n**Q：分布式事务有哪些方案？怎么选型？⭐**\n- 用三个维度评估：一致性强度、性能、业务侵入性；\n- 强一致：2PC（同步阻塞，工程少用）、TCC（侵入大但可控，适合资金链路，要处理空回滚/幂等/悬挂）；\n- 最终一致：本地消息表（简单通用）、RocketMQ 事务消息（半消息 + 回查）、Seata AT（零侵入但有全局锁开销）；\n- 选择优先级：能合并成单库本地事务 > 消息最终一致 > Seata AT > TCC，数据越重要用侵入性越强的方案；\n- 一定先反问业务场景再选型，体现\"能不用就不用\"的工程判断。\n\n**Q：Seata AT 模式的原理？**\n- 一阶段：代理数据源解析 SQL，把前后镜像写入 undo_log，随本地事务一起提交，并向 TC 注册分支；\n- 二阶段：全局提交则异步删除 undo_log；全局回滚则校验后镜像无脏写，用前镜像生成反向 SQL 补偿；\n- 全局锁保证回滚窗口内数据不被其他全局事务修改；\n- 对比 TCC：AT 无业务侵入，但依赖数据库支持且并发受全局锁限制。\n\n## 🔗 推荐资料\n\n| 资料 | 说明 | 链接 |\n| --- | --- | --- |\n| pdai 架构知识体系 | CAP、一致性、分布式锁、事务的体系化索引 | https://pdai.tech/md/arch/arch-z-overview.html |\n| JavaGuide RPC&Dubbo 入门 | RPC 原理与 Dubbo 架构详解 | https://javaguide.cn/distributed-system/rpc/rpc-intro.html |\n| JavaGuide ZooKeeper 入门 | ZAB、Watcher、临时节点与 ZK 分布式锁 | https://javaguide.cn/distributed-system/distributed-process-coordination/zookeeper/zookeeper-intro.html |\n| JavaGuide 消息队列入门 | 事务消息与 MQ 基础概念 | https://javaguide.cn/high-performance/message-queue/message-queue.html |\n| JavaGuide 高可用系统设计指南 | 限流/降级/超时重试，衔接下一篇 | https://javaguide.cn/high-availability/high-availability-system-design.html |\n| JavaGuide 后端面试通关计划 | 冲刺期分布式部分的复习节奏 | https://javaguide.cn/interview-preparation/backend-interview-plan.html |\n| pdai 面试知识体系 | 分布式面试真题索引 | https://pdai.tech/md/interview/x-interview.html |\n","ck":0},{"id":"f26","stage":6,"path":"06-分布式与高并发篇/02-高并发系统设计.md","title":"02-高并发系统设计","md":"# 02-高并发系统设计\n\n> **阶段**：分布式与高并发篇 ｜ **建议时长**：5 天 ｜ **前置**：01-分布式理论基础、04-中间件篇（Redis/MQ/分库分表基础）\n\n## 🎯 学习目标\n\n- 用一条演进主线讲清高并发系统是怎么一步步长出来的（单机 → 读写分离 → 缓存 → MQ → 分库分表 → 微服务）⭐；\n- 说清多级缓存的层次与取舍（本地 Caffeine + Redis），会处理热点 key ⭐；\n- 对比四种限流算法并说出各自的 Java 实现（Guava RateLimiter/Sentinel/Redis+Lua）⭐；\n- 区分限流、熔断、降级三者，理解雪崩效应与舱壁模式 ⭐；\n- 讲清读写分离的主从延迟对策，以及分库分表的分片键选择与三大代价 ⭐；\n- **完整输出一份秒杀系统设计方案（流量漏斗 + 防超卖 + 一致性）⭐⭐——这是后端面试最经典的场景题**。\n\n## 📖 核心知识点\n\n### 1. 高并发演进路径 ⭐\n\n以一个电商订单系统为例，流量从日均 1 万单涨到峰值 10 万 QPS，每一步都是\"瓶颈出现 → 针对性加一层\"：\n\n| 阶段 | 出现的瓶颈 | 采取的动作 |\n| --- | --- | --- |\n| 1. 单机 all-in-one | 应用+DB 挤在一台机器 | 应用与 DB 分离部署 |\n| 2. 读写分离 | 读多写少，单库读扛不住 | MySQL 主从 + 读写分离，读请求分摊到从库 |\n| 3. 加缓存 | 热点读打穿到 DB | Redis 缓存热点数据，DB 只兜底缓存没有的 |\n| 4. MQ 削峰 | 写入洪峰（大促/秒杀） | 写请求先进 MQ，消费端按 DB 能力匀速落库 |\n| 5. 分库分表 | 单表过亿、单库写入瓶颈 | 垂直拆业务库，水平按分片键拆表 |\n| 6. 微服务化 | 单体应用发布慢、模块互相拖垮 | 按业务域拆服务，注册中心 + 网关 + 链路追踪 |\n\n三条铁律：\n\n1. **演进由瓶颈驱动**，不要一上来就微服务+分库分表（过度设计）；\n2. 每一步都是为了解决**上一层扛不住的那一类流量**（读 → 缓存、写 → MQ、数据量 → 分片）；\n3. 面试讲演进时永远带一句\"当时的瓶颈是什么\"，体现判断力而不是背名词。\n\n### 2. 缓存体系：多级缓存与热点 key ⭐\n\n**完整的读链路**：浏览器缓存 → CDN → Nginx 缓存 → **本地缓存（Caffeine）→ Redis → MySQL**。离用户越近越快，越远越全。\n\n**为什么要两级（本地 + Redis）**：\n\n| 维度 | 本地缓存 Caffeine | Redis |\n| --- | --- | --- |\n| 读取速度 | 纳秒~微秒（进程内存） | 毫秒内（多一次网络 IO + 序列化） |\n| 容量 | 单机有限 | 集群可扩展 |\n| 一致性 | 各实例独立，改动难同步 | 集中式，相对好保证 |\n| 定位 | 极热的小量数据（配置、商品 top100） | 主要缓存层，容量主力 |\n\n典型组合：先查 Caffeine，未命中查 Redis 并回填本地；更新时先失效 Redis，本地用**短 TTL（秒级）+ 过期自动刷新**容忍短暂不一致。\n\n```java\nCache<String, Product> localCache = Caffeine.newBuilder()\n        .maximumSize(10_000)                 // 控制容量，防内存溢出\n        .expireAfterWrite(Duration.ofSeconds(10)) // 短 TTL 控制不一致窗口\n        .build();\nProduct p = localCache.getIfPresent(id);\nif (p == null) {                             // 一级未命中 → 查二级\n    p = redisTemplate.opsForValue().get(\"p:\" + id);\n    if (p != null) localCache.put(id, p);\n}\n```\n\n**热点 key 处理**：单个 key 的 QPS 高到单分片扛不住（明星八卦、爆款商品）。手段：① 检测发现（客户端统计 + Redis `--hotkeys`/monitor）；② 热点 key 进**本地缓存**扛掉大部分读；③ 打散副本（`key_1`~`key_N` 随机读）；④ 读写分离多从库。\n\n**三种缓存问题一句话回顾**（详见[《01-Redis》](#/f/f13)）：\n- 穿透 = 查**不存在**的数据打穿到 DB → 空值缓存/布隆过滤器；\n- 击穿 = 单个**热点 key 失效瞬间** → 互斥锁重建/逻辑过期；\n- 雪崩 = **大量 key 同时失效**或 Redis 宕机 → TTL 随机打散/多级缓存/限流降级。\n\n### 3. 限流 ⭐\n\n**四种算法对比**：\n\n| 算法 | 原理 | 优点 | 缺点 | 典型实现 |\n| --- | --- | --- | --- | --- |\n| 固定窗口计数 | 单位时间计数器，超阈值拒绝 | 实现最简单 | 窗口边界突刺：两个窗口交界处可通过 2 倍流量 | Redis INCR+EXPIRE |\n| 滑动窗口 | 统计最近 N 秒内的请求数 | 解决边界突刺，更平滑 | 精度依赖格子数，内存略高 | Sentinel（滑动窗口统计） |\n| 漏桶 | 请求进桶，恒定速率流出 | 绝对平滑，整形流量 | 无法应对合理突发，排队有延迟 | Nginx limit_req |\n| 令牌桶 | 恒定速率往桶里放令牌，拿到令牌才放行 | 允许一定突发（桶里攒了令牌） | 速率与容量需调参 | Guava RateLimiter |\n\n**三种实现方式**：\n\n1. **Guava RateLimiter（单机）**：令牌桶，`tryAcquire()` 拿不到就快速失败。只对单个实例有效，多实例要乘以实例数折算阈值；\n2. **Sentinel（单机 + 集群，最常用于生产）**：滑动窗口统计，支持 QPS/线程数两种维度、流控效果（快速失败/Warm Up/排队等待）、熔断降级一体，配控制台动态改规则；\n3. **Redis + Lua（集群全局限流）**：多实例共享一份计数器，Lua 保证\"判断+计数+设过期\"原子执行：\n\n```lua\n-- 固定窗口：超过阈值返回 0（拒绝），否则自增并放行\nlocal current = redis.call('INCR', KEYS[1])\nif current == 1 then\n    redis.call('EXPIRE', KEYS[1], ARGV[1])   -- 第一次访问才设置过期\nend\nif current > tonumber(ARGV[2]) then\n    return 0\nend\nreturn 1\n```\n\nLua 的必要性：INCR 与 EXPIRE 分两步执行时，进程可能死在中间导致 key 永不过期、限流器永久锁死；Lua 脚本整体原子执行，天然规避。\n\n### 4. 熔断与降级 ⭐\n\n**雪崩效应**：服务 A 调 B，B 调 C；C 变慢 → B 的线程被拖住堆积 → B 也慢 → A 线程池耗尽 → 整条链路瘫痪。一个下游故障放大成全站故障，就是雪崩。\n\n三个概念各管一件事：\n\n- **限流**：流量太多时只放一部分进来（保自己）；\n- **熔断**：下游故障/超时率超阈值时，断路器跳闸，一段时间内直接快速失败，不再真正调用（断开依赖，防雪崩）。断路器三态：**关闭**（正常放行）→ **打开**（直接拒绝，计时）→ **半开**（放少量探测请求，成功则恢复）；\n- **降级**：出问题时返回兜底数据/简化逻辑（丢卒保帅：推荐列表挂了就返回默认榜单，不让页面白屏）。\n\n**舱壁模式（Bulkhead）**：像船舱一样隔离资源——给每个下游依赖分配**独立线程池/信号量**，一个依赖挂掉只烧掉自己的舱，不殃及其他调用。\n\n**三者关系一句话**：限流是入口处控量，熔断是调用链上断开故障依赖，降级是失败后的兜底预案；Sentinel 里三者通常配合使用。\n\n### 5. 数据层扩展：读写分离与分库分表 ⭐\n\n**读写分离**：主库写，从库读，主从复制（主库写 binlog → 从库 IO 线程拉取 → SQL 线程重放）。\n- **主从延迟**是核心问题：写完立刻读，从库可能还没同步到。对策：① 关键路径**强制走主库**（下单后查订单）；② 写后短时间内的同用户请求路由到主库；③ 半同步复制降低丢数据风险；\n- 注意：读写分离解决**读压力**，不解决单表数据量与写压力。\n\n**分库分表**：\n- **垂直分库**：按业务域拆（订单库/商品库/用户库）；**垂直分表**：把大字段、低频字段拆出去；\n- **水平分表/分库**：同一张表的数据按分片键打散到多个表/库，解决数据量与写入瓶颈。\n\n**分片键选择（最关键的决策）**：\n- 原则一：带分片键的查询占绝大多数（如订单表按 `user_id` 分，\"查我的订单\"直落单片）；\n- 原则二：数据分布均匀，避免热点（不能按\"省份\"分）；\n- 冲突处理：商家侧查询\"店铺所有订单\"没有 user_id → 冗余一份按 seller_id 分的异构索引表，或走 ES/宽表。\n\n**分库分表的三大代价（必考）**：\n1. **跨片查询**：无分片键的条件要扇出到全部分片再聚合，分页/排序代价极高（配合 ES 或异构索引解决）；\n2. **分布式事务**：跨库写无法用本地事务，需要 01 篇的分布式事务方案；\n3. **扩容与数据迁移**：翻倍扩容要迁移数据，常用\"翻倍扩容 + 双写迁移 + 灰度校验\"；\n4. 附带问题：全局唯一主键（见[《01-分布式理论基础》](#/f/f25)雪花算法）。\n\n**ShardingSphere**：Apache 分库分表中间件，两种形态——**ShardingSphere-JDBC**（客户端 SDK，直连数据库，性能好、侵入应用）与 **ShardingSphere-Proxy**（独立代理进程，对应用透明、支持异构语言）。核心配置概念：逻辑表/真实节点/分片算法。\n\n### 6. 削峰填谷\n\n- **MQ 异步化**：短时间洪峰（0 点签到、秒杀下单）先进队列，消费端按数据库承受能力**匀速消费**，把\"尖峰\"削成\"平谷\"；\n- **缓冲与排队**：请求进缓冲池/答题/令牌预发放，把随机洪峰变成可控节奏；\n- 代价：**延迟变高**（用户看到\"排队中\"）、需要处理消息可靠性与消费幂等（详见[《04-RocketMQ》](#/f/f16)与 MQ 三篇）。\n\n### 7. 秒杀系统设计串讲 ⭐⭐\n\n**先估量级**：100 万用户抢 1 万件商品，假设 10 分钟内 80% 请求涌入 → 峰值读 QPS 可到 10 万级，写（下单）远小于读。**99% 的流量应该死在到达数据库之前**——这就是流量漏斗。\n\n**流量漏斗（五层，自上而下）**：\n\n| 层 | 手段 | 挡掉什么 |\n| --- | --- | --- |\n| 1. 前端 | 按钮置灰防重复点击、答题/验证码拉平请求、秒杀 URL 动态加密防提前刷接口 | 机器人与重复点击，削掉大半流量 |\n| 2. 网关 | 令牌桶限流（如 5000 QPS）、黑名单/IP 限流、登录态校验 | 超过系统容量的流量与刷子 |\n| 3. 服务层 | 风控（同用户/设备限购）、Redis **预扣库存**（Lua 原子） | 无资格请求；库存不足直接拒绝，不再往下 |\n| 4. 异步层 | 抢到资格 → 发 MQ → 返回\"排队中\" | 削掉写入洪峰，前端体验平滑 |\n| 5. 数据库 | 消费端真正创建订单 + 扣减库存：`UPDATE stock SET num = num - 1 WHERE goods_id = ? AND num > 0` | 只接住队列匀速来的写，乐观锁条件 `num > 0` 兜底防超卖 |\n\n**Redis 预扣库存 + Lua 脚本防超卖 ⭐**（核中之核）：\n\n```lua\n-- KEYS[1]=库存 key，ARGV[1]=扣减数量\nlocal stock = tonumber(redis.call('GET', KEYS[1]) or '-1')\nif stock < tonumber(ARGV[1]) then\n    return -1                                   -- 库存不足，直接拒绝\nend\nredis.call('DECRBY', KEYS[1], ARGV[1])\nreturn stock - 1\n```\n\n要点：GET 判断与 DECRBY 之间不能有缝隙——若先 GET 再 DECR 两步执行，并发下会同时看到\"还剩 1\"然后都扣成负数（超卖）；Lua 单线程原子执行杜绝该窗口。\n\n**防刷三板斧**：验证码/答题（挡脚本+拉平峰值）、风控规则（同用户限购 1 件、同设备/同 IP 频次限制）、黑名单（提前标记羊毛党账号，网关直接拦截）。\n\n**热点与一致性**：\n- 库存是**热点 key**：单分片扛不住就分段（`stock_1`~`stock_10` 各存 1/10，随机段扣减，合并剩余量）；\n- **不超卖**靠 Redis 原子预扣 + DB 条件更新双保险；**不少卖**靠超时未支付回补库存（延迟消息）+ 定时对账 Redis 与 DB 的库存差异；\n- 缓存与 DB 一致性：下单成功以 DB 为准，Redis 库存在扣减成功后随 MQ 消费同步更新，失败有对账兜底。\n\n**一分钟回答框架**：澄清规模 → 漏斗五层逐层挡流量 → Redis+Lua 原子预扣防超卖 → MQ 异步落库削峰 → DB 条件更新兜底 → 防刷与对账保一致。\n\n## 🛠 动手实践\n\n1. **Redis + Lua 限流器**\n   - 用 `StringRedisTemplate.execute(RedisScript)` 封装\"固定窗口限流\"，参数为 key、窗口秒数、阈值；\n   - 写清注释：为什么必须 Lua（INCR/EXPIRE 两步不原子，进程中断会导致 key 永不过期）；\n   - **验收**：20 线程并发调用阈值 10 次/10 秒的限流器，恰好放行 10 个；窗口过期后自动恢复放行。\n\n2. **实现秒杀预扣库存（复用第 7 节 Lua）**\n   - Spring Boot + StringRedisTemplate：初始化库存 → Lua 预扣 → 抢到后发 RocketMQ/RabbitMQ 消息 → 消费端落库 `UPDATE ... AND num > 0`；\n   - **验收**：JMeter 500 并发抢 100 件库存，最终订单恰好 100 条、库存不为负；把每层日志（预扣成功/失败、MQ 消费、落库）打出来核对漏斗。\n\n3. **写一份秒杀设计文档**\n   - 固定三段：① 扣库存（预扣+落库怎么分工）② 防超卖（两层保险在哪）③ 一致性（超时回补、对账、缓存更新）；\n   - **验收**：文档里有 QPS 估算过程、流量漏斗图（文字版即可）、防刷清单；能对着文档口头讲 3 分钟不卡壳。\n\n## 💼 高频面试题\n\n**Q：设计一个秒杀系统？⭐⭐**\n- 先澄清量级：多少库存、多少用户、峰值读多大，再开始设计；\n- 流量漏斗：前端（置灰/答题/动态 URL）→ 网关（令牌桶限流+黑名单）→ 服务（风控限购 + Redis 预扣）→ MQ 异步 → DB 匀速落库；\n- 防超卖双保险：Redis Lua 原子预扣（GET+DECR 不留缝隙）+ DB `UPDATE ... AND num > 0` 条件更新；\n- 削峰：抢到资格先进 MQ 返回\"排队中\"，消费端按 DB 能力匀速创建订单；\n- 热点：库存 key 分段扛单分片极限，读走本地缓存+静态化；\n- 收尾讲一致性：超时未支付用延迟消息回补库存，定时对账兜底。\n\n**Q：四种限流算法对比？⭐**\n- 固定窗口：最简单，但窗口交界处有 2 倍突刺；\n- 滑动窗口：按小格子统计最近 N 秒，消除突刺，Sentinel 采用；\n- 漏桶：恒定速率流出，绝对平滑但压掉合理突发，Nginx 采用；\n- 令牌桶：匀速放令牌、桶内可攒，允许突发又能限制平均速率，Guava RateLimiter 采用；\n- 实现选型：单机用 RateLimiter/Sentinel，集群全局用 Redis+Lua。\n\n**Q：如何防止超卖？⭐**\n- 第一层：Redis 预扣库存，Lua 把\"查库存+扣减\"做成原子操作，不留并发窗口；\n- 第二层：数据库 `UPDATE stock SET num = num - 1 WHERE id = ? AND num > 0`，利用行锁+条件更新兜底，返回影响行数为 0 即回滚；\n- 也可以用 `SELECT ... FOR UPDATE` 悲观锁，但吞吐低，作为对比方案讲；\n- 最后对账：Redis 与 DB 库存定时核对，发现偏差告警修复。\n\n**Q：如何保证缓存与数据库一致性？⭐**\n- 基础方案 Cache Aside：读→先缓存后 DB；写→**先更新 DB，再删除缓存**（不是更新缓存）；\n- 删除失败的补偿：消息队列重试或订阅 binlog（canal）异步删除，解耦且不易漏；\n- 并发窗口要求高：延迟双删（写后删一次，隔几百毫秒再删一次，清掉期间旧读回填的脏缓存）；\n- 结论话术：强一致代价极高，业务上通常接受\"最终一致 + 不一致窗口最小化\"。\n\n**Q：系统突然来 10 倍流量怎么办？**\n- 应急三件套：限流（保住容量内的流量）、降级（非核心功能先砍）、扩容（无状态服务横向加实例）；\n- 缓存层检查：命中率是否下降、有没有热点 key 打爆单分片；\n- 写洪峰进 MQ 排队削峰，消费速率对齐 DB 承受力；\n- 事后：补压测、加容量告警，把\"突变\"变成\"可预测的扩容预案\"。\n\n**Q：为什么要多级缓存？本地缓存和 Redis 怎么分工？**\n- Redis 集中管理：容量大、一致性好维护，但每次多一次网络 IO 与序列化（约 0.5~1ms）；\n- 本地缓存：纳秒级响应，但各实例独立、容量有限、更新难同步；\n- 分工：极热、更新少的小数据（配置、TopN 商品）进本地，主力缓存放 Redis，DB 兜底；\n- 本地用短 TTL（秒级）控制不一致窗口，或通过 MQ 广播失效通知各实例清本地缓存。\n\n**Q：做了读写分离，主从延迟怎么处理？**\n- 先定性：复制是异步的，延迟通常毫秒级，但大事务、机器负载高时会放大到秒级；\n- 关键路径强制读主库：下单后立刻查订单，这类读不信任从库；\n- 会话级路由：同一用户\"写后 N 秒内\"的读请求路由到主库；\n- 监控从库同步延迟（Seconds_Behind_Master），落后过大告警并摘除读流量。\n\n## 🔗 推荐资料\n\n| 资料 | 说明 | 链接 |\n| --- | --- | --- |\n| JavaGuide 读写分离与分库分表 | 数据层扩展的完整思路 | https://javaguide.cn/high-performance/read-and-write-separation-and-library-subtable.html |\n| JavaGuide 高可用系统设计指南 | 限流/熔断/降级/隔离的系统化讲解 | https://javaguide.cn/high-availability/high-availability-system-design.html |\n| JavaGuide 负载均衡 | 演进路径与网关层的基础概念 | https://javaguide.cn/high-performance/load-balancing.html |\n| JavaGuide 消息队列入门 | 削峰、异步、解耦三大作用 | https://javaguide.cn/high-performance/message-queue/message-queue.html |\n| JavaGuide 系统设计面试题 | 秒杀/抢红包等场景题的答题框架 | https://javaguide.cn/system-design/system-design-questions.html |\n| pdai Redis 缓存问题 | 穿透/击穿/雪崩/一致性的深入篇 | https://pdai.tech/md/db/nosql-redis/db-redis-x-cache.html |\n| pdai MySQL 分库分表 | 分片策略与问题的更多细节 | https://pdai.tech/md/db/sql-mysql/sql-mysql-devide.html |\n| pdai 架构知识体系 | 高并发演进与架构设计的全景图 | https://pdai.tech/md/arch/arch-z-overview.html |\n","ck":0},{"id":"f27","stage":7,"path":"07-面试篇/01-Java高频八股速查.md","title":"01-Java高频八股速查","md":"# 01-Java高频八股速查\n\n> **阶段**：面试篇 ｜ **用法**：遮住答案自测，能独立说出 3 条以上要点再打勾；冲刺期每天过一遍\n\n## 使用说明\n\n- 每条格式：`- [ ] **Q：xxx？** —— 一句话核心答案 ｜ 详见《对应指南文件名》`，一句话只是提醒方向，真正的标准是**能展开说 3 条以上要点**；\n- 顺序按考察频率排列，越靠前越常被问；每道题的完整版答案与追问链在\"详见\"对应的指南文件里；\n- 冲刺期节奏：每天 1~2 个板块，全部过完一轮后重刷未打勾的题；面试前一晚只看打勾但\"心里没底\"的；\n- 八股追问是链式的（如 HashMap → 扩容 → 并发问题 → ConcurrentHashMap），建议按板块连着练，不要跳着背；\n- 每个板块开头有一行\"面试形式\"提示，说明该板块怎么考，按提示的连环问法对练；\n- 有精力时点开板块末尾的资料链接读完整版，把每条\"一句话答案\"扩成自己的 3 条要点；\n- 算法与项目经验不在本文件，见[《03-算法刷题路线》](#/f/f29)与[《04-简历与求职指南》](#/f/f30)。\n\n## 📋 自测清单\n\n### Java 基础（20 题）\n\n> 面试形式：单点直问 + 小连环（== → equals → hashCode 连问）；基础题答错一条，面试官会直接调低对整体的评价。\n\n- [ ] **Q：== 与 equals 的区别？** —— == 比较栈里的值（基本类型比值、引用类型比地址），equals 默认同 ==，String 等重写后比较内容 ｜ 详见[《02-面向对象与核心类》](#/f/f4)\n- [ ] **Q：为什么重写 equals 必须重写 hashCode？** —— 约定相等对象必须有相同哈希值，否则重写后两个\"相等\"对象在 HashMap 中会落到不同桶 ｜ 详见[《02-面向对象与核心类》](#/f/f4)\n- [ ] **Q：String 为什么设计成不可变？** —— private final 存储不暴露修改方法：安全性、hashCode 可缓存、字符串常量池复用 ｜ 详见[《02-面向对象与核心类》](#/f/f4)\n- [ ] **Q：String、StringBuilder、StringBuffer 怎么选？** —— 常量用 String，单线程频繁拼接用 StringBuilder，多线程共享拼接用 StringBuffer ｜ 详见[《02-面向对象与核心类》](#/f/f4)\n- [ ] **Q：Integer 缓存机制？** —— IntegerCache 缓存 -128~127，范围内 == 为 true，范围外必须用 equals，面试常挖箱拆箱 NPE ｜ 详见[《02-面向对象与核心类》](#/f/f4)\n- [ ] **Q：Java 是值传递还是引用传递？** —— 永远是值传递；传对象时复制的是引用值，方法内改属性生效、重新赋值不影响原对象 ｜ 详见[《02-面向对象与核心类》](#/f/f4)\n- [ ] **Q：重载与重写的区别？** —— 重载是同类同名不同参（编译期确定），重写是子类覆盖父类同签名方法（运行期多态）｜ 详见[《02-面向对象与核心类》](#/f/f4)\n- [ ] **Q：接口与抽象类的区别？** —— 抽象类表示\"是什么\"（单继承、可有状态），接口表示\"能做什么\"（多实现，Java 8 后可有 default/static 方法）｜ 详见[《02-面向对象与核心类》](#/f/f4)\n- [ ] **Q：final 关键字有哪些用法？** —— 类不可继承、方法不可重写、变量不可重新赋值（引用不变但对象内容可变）｜ 详见[《02-面向对象与核心类》](#/f/f4)\n- [ ] **Q：面向对象三大特性？** —— 封装隐藏细节、继承复用扩展、多态同一方法不同实现（编译看左边、运行看右边）｜ 详见[《02-面向对象与核心类》](#/f/f4)\n- [ ] **Q：Java 异常体系？** —— Throwable 下分 Error（OOM/StackOverflowError 不该捕获）与 Exception，后者分受检异常与运行时异常 ｜ 详见[《04-异常-IO-反射-注解》](#/f/f6)\n- [ ] **Q：反射是什么？有什么用？** —— 运行期动态获取类信息并创建对象、调用方法，是 Spring IoC、MyBatis Mapper 等框架的底层基石 ｜ 详见[《04-异常-IO-反射-注解》](#/f/f6)\n- [ ] **Q：注解的原理？** —— @interface 本质是继承 Annotation 的接口，运行期靠反射读取元数据，Retention 决定保留到源码/字节码/运行期 ｜ 详见[《04-异常-IO-反射-注解》](#/f/f6)\n- [ ] **Q：什么是泛型擦除？** —— 泛型只存在于编译期做类型检查，运行期 List\\<String\\> 与 List\\<Integer\\> 都是 List，桥接方法保证多态 ｜ 详见[《03-集合与泛型》](#/f/f5)\n- [ ] **Q：static 关键字的用法？** —— 静态变量/方法/代码块/内部类都属于类而非实例，静态方法不能访问实例成员，加载时初始化 ｜ 详见[《01-环境搭建与基础语法》](#/f/f3)\n- [ ] **Q：内部类有哪些？** —— 成员、静态、局部、匿名内部类；匿名内部类访问局部变量要求 effectively final ｜ 详见[《04-异常-IO-反射-注解》](#/f/f6)\n- [ ] **Q：BigDecimal 为什么能避免精度丢失？** —— 用\"无标度整数+标度\"精确表示十进制；金额计算必用，除法必须指定舍入模式与精度 ｜ 详见[《02-面向对象与核心类》](#/f/f4)\n- [ ] **Q：Java 8 有哪些新特性？** —— Lambda、函数式接口、Stream、Optional、接口 default 方法、新时间日期 API ｜ 详见[《05-Lambda-Stream与Java8新特性》](#/f/f7)\n- [ ] **Q：Stream 常用操作？** —— 中间操作 filter/map/sorted/flatMap 惰性执行，终端操作 collect/reduce/count/forEach 触发计算，只能消费一次 ｜ 详见[《05-Lambda-Stream与Java8新特性》](#/f/f7)\n- [ ] **Q：Optional 解决什么问题？** —— 显式表达\"可能为空\"，用 map/orElse/ifPresent 链式处理减少 NPE，不建议用作字段 ｜ 详见[《05-Lambda-Stream与Java8新特性》](#/f/f7)\n\n### 集合（15 题）\n\n> 面试形式：以 HashMap 为绝对中心向下挖（put → 扩容 → 1.7/1.8 → 线程安全），ConcurrentHashMap 是通往并发板块的衔接点。\n\n- [ ] **Q：ArrayList 和 LinkedList 的区别？** —— 数组随机访问 O(1) vs 双向链表头尾插删 O(1)；实际绝大多数场景用 ArrayList（CPU 缓存友好、无指针开销）｜ 详见[《03-集合与泛型》](#/f/f5)\n- [ ] **Q：ArrayList 扩容机制？** —— 首次 add 创建容量 10，超出后扩为 1.5 倍并 Arrays.copyOf 拷贝；能预估数据量就指定初始容量 ｜ 详见[《03-集合与泛型》](#/f/f5)\n- [ ] **Q：HashMap 底层数据结构？** —— 1.8 起数组+链表+红黑树：链表长度 ≥8 且数组长度 ≥64 转红黑树，节点减到 6 退化回链表 ｜ 详见[《03-集合与泛型》](#/f/f5)\n- [ ] **Q：HashMap 的 put 流程？** —— 计算 hash 定位桶 → 空桶直接放 → 链表尾插或树插入 → key 已存在则覆盖 → 超过阈值扩容 ｜ 详见[《03-集合与泛型》](#/f/f5)\n- [ ] **Q：HashMap 扩容机制？** —— 容量翻倍、负载因子 0.75；1.8 优化：元素要么留在原索引，要么移到\"原索引+旧容量\"位置 ｜ 详见[《03-集合与泛型》](#/f/f5)\n- [ ] **Q：HashMap 1.7 和 1.8 的区别？** —— 1.7 头插法+纯链表（并发扩容可能成环死循环），1.8 尾插法+红黑树+扩容高位拆分优化 ｜ 详见[《03-集合与泛型》](#/f/f5)\n- [ ] **Q：HashMap 容量为什么是 2 的幂？** —— 使 (n-1) & hash 等价于取模且位运算更快，同时保证散列均匀 ｜ 详见[《03-集合与泛型》](#/f/f5)\n- [ ] **Q：HashSet 如何去重？** —— 底层就是 HashMap，元素作 key，add 时先比 hashCode 再比 equals ｜ 详见[《03-集合与泛型》](#/f/f5)\n- [ ] **Q：ConcurrentHashMap 1.8 的实现原理？** —— CAS 初始化 + synchronized 锁单个桶头节点，扩容支持多线程协助迁移，size 用 CounterCell 分散计数 ｜ 详见[《03-集合与泛型》](#/f/f5)\n- [ ] **Q：fail-fast 与 fail-safe？** —— 遍历中结构被改抛 ConcurrentModificationException（modCount 校验）；CopyOnWrite 系列是 fail-safe 的快照遍历 ｜ 详见[《03-集合与泛型》](#/f/f5)\n- [ ] **Q：遍历集合时如何安全删除元素？** —— 用 Iterator.remove() 或 removeIf()，不能在 for-each 中直接 list.remove() ｜ 详见[《03-集合与泛型》](#/f/f5)\n- [ ] **Q：TreeMap 的底层与使用场景？** —— 红黑树实现，key 有序，支持范围查询与首个/最后一个元素，需自然排序或 Comparator ｜ 详见[《03-集合与泛型》](#/f/f5)\n- [ ] **Q：List/Set/Queue/Map 怎么选型？** —— 有序可重复选 List、去重选 Set、先进先出/优先级选 Queue、键值映射选 Map，再看是否需要排序与并发 ｜ 详见[《03-集合与泛型》](#/f/f5)\n- [ ] **Q：ArrayList 线程安全吗？怎么解决？** —— 不安全；Vector 已过时，读多写少用 CopyOnWriteArrayList，或 Collections.synchronizedList ｜ 详见[《01-多线程与并发编程》](#/f/f8)\n- [ ] **Q：Comparable 与 Comparator 的区别？** —— Comparable 在类内部定义自然排序（compareTo），Comparator 外部定制排序规则（compare），后者可多套并存 ｜ 详见[《03-集合与泛型》](#/f/f5)\n\n### 并发（20 题）\n\n> 面试形式：追问最深的板块，线程池 7 参数与 synchronized/volatile 几乎必考，常要求现场写出线程池使用代码。\n\n- [ ] **Q：创建线程有几种方式？** —— 本质都是 new Thread 传 Runnable（Callable 配 FutureTask 可拿返回值）；生产环境一律用线程池 ｜ 详见[《01-多线程与并发编程》](#/f/f8)\n- [ ] **Q：线程有哪些状态？** —— NEW/RUNNABLE/BLOCKED/WAITING/TIMED_WAITING/TERMINATED 六种，常追问 wait 与 sleep 的区别 ｜ 详见[《01-多线程与并发编程》](#/f/f8)\n- [ ] **Q：synchronized 的底层原理？** —— 基于对象头 Mark Word 与 monitor（monitorenter/monitorexit 字节码指令），锁状态记录在对象头 ｜ 详见[《01-多线程与并发编程》](#/f/f8)\n- [ ] **Q：锁升级过程？** —— 无锁 → 偏向锁 → 轻量级锁（CAS 自旋）→ 重量级锁（monitor 阻塞），偏向锁在 JDK 15 后已废弃 ｜ 详见[《01-多线程与并发编程》](#/f/f8)\n- [ ] **Q：volatile 的作用？** —— 保证可见性（写立即刷主存、读失效本地缓存）与有序性（内存屏障禁重排），**不保证原子性** ｜ 详见[《01-多线程与并发编程》](#/f/f8)\n- [ ] **Q：JMM（Java 内存模型）是什么？** —— 主内存+工作内存的抽象，定义 happens-before 规则，解决多线程的可见性与有序性问题 ｜ 详见[《01-多线程与并发编程》](#/f/f8)\n- [ ] **Q：CAS 的原理与问题？** —— CPU 原子比较交换指令；存在 ABA（用 AtomicStampedReference 加版本号）与自旋空转问题 ｜ 详见[《01-多线程与并发编程》](#/f/f8)\n- [ ] **Q：一句话说清 AQS？** —— 抽象队列同步器：volatile 的 state + CLH 变体等待队列 + 模板方法，ReentrantLock/Semaphore/CountDownLatch 的共同基石 ｜ 详见[《01-多线程与并发编程》](#/f/f8)\n- [ ] **Q：ReentrantLock 与 synchronized 的区别？** —— 支持可中断、tryLock 超时、公平锁、多个 Condition；JDK 6 后性能相当，简单场景仍用 synchronized ｜ 详见[《01-多线程与并发编程》](#/f/f8)\n- [ ] **Q：公平锁与非公平锁？** —— 公平锁按队列顺序获取防饥饿；非公平锁允许新请求直接插队，吞吐更高，ReentrantLock 默认非公平 ｜ 详见[《01-多线程与并发编程》](#/f/f8)\n- [ ] **Q：线程池的 7 个参数？** —— corePoolSize、maximumPoolSize、keepAliveTime、unit、workQueue、threadFactory、handler ｜ 详见[《01-多线程与并发编程》](#/f/f8)\n- [ ] **Q：线程池的任务执行流程？** —— 先填核心线程 → 满了入队列 → 队列满了开非核心线程 → 到 maximum 后触发拒绝策略（注意\"先排队再扩容\"）｜ 详见[《01-多线程与并发编程》](#/f/f8)\n- [ ] **Q：四种拒绝策略？** —— AbortPolicy 抛异常（默认）、CallerRunsPolicy 调用者线程执行、DiscardPolicy 静默丢弃、DiscardOldestPolicy 丢最旧任务 ｜ 详见[《01-多线程与并发编程》](#/f/f8)\n- [ ] **Q：线程池大小怎么定？** —— 经验公式 CPU 密集 N+1、IO 密集 N×(1+等待时间/计算时间)，最终靠压测校准，不建议 unbounded 队列 ｜ 详见[《01-多线程与并发编程》](#/f/f8)\n- [ ] **Q：ThreadLocal 原理与内存泄漏？** —— 每个 Thread 内有 ThreadLocalMap，key 是弱引用、value 是强引用，用完必须 remove() 防止 value 泄漏 ｜ 详见[《01-多线程与并发编程》](#/f/f8)\n- [ ] **Q：CountDownLatch/CyclicBarrier/Semaphore 的区别？** —— 一次性倒数开门 / 可复用的集体等齐 / 控制并发数（permits），三者都基于 AQS ｜ 详见[《01-多线程与并发编程》](#/f/f8)\n- [ ] **Q：死锁的产生条件与排查？** —— 互斥、请求与保持、不可剥夺、循环等待四个必要条件；jstack 可直接检测出死锁 ｜ 详见[《01-多线程与并发编程》](#/f/f8)\n- [ ] **Q：CompletableFuture 怎么用？** —— supplyAsync/thenApply/thenCompose/allOf 做异步编排与结果组合，注意默认线程池与异常传播 ｜ 详见[《01-多线程与并发编程》](#/f/f8)\n- [ ] **Q：ConcurrentHashMap 并发 put 为什么安全？** —— 1.8 用 CAS 初始化 + 对桶头节点 synchronized，锁粒度到单个桶；get 无锁靠 volatile ｜ 详见[《01-多线程与并发编程》](#/f/f8)\n- [ ] **Q：虚拟线程是什么？** —— JDK 21 正式特性：由 JVM 调度的轻量线程，阻塞时不占用 OS 线程，可创建百万级，适合 IO 密集场景 ｜ 详见[《01-多线程与并发编程》](#/f/f8)\n\n### JVM（15 题）\n\n> 面试形式：概念之外一定接实操——CPU 飙高与 OOM 排查两类题要按步骤背熟，最好配上自己跑过的例子。\n\n- [ ] **Q：JVM 内存区域划分？** —— 线程私有：虚拟机栈、本地方法栈、程序计数器；线程共享：堆、方法区（JDK 8 后由元空间实现）｜ 详见[《02-JVM核心》](#/f/f9)\n- [ ] **Q：对象的创建过程？** —— 类加载检查 → 分配内存（TLAB/指针碰撞）→ 零值初始化 → 设置对象头 → 执行构造函数 ｜ 详见[《02-JVM核心》](#/f/f9)\n- [ ] **Q：GC Roots 有哪些？** —— 栈帧局部变量、静态变量、常量引用、JNI 引用、活跃线程等，是可达性分析的起点 ｜ 详见[《02-JVM核心》](#/f/f9)\n- [ ] **Q：四种引用的区别？** —— 强引用不回收；软引用内存不足才回收（缓存）；弱引用下次 GC 必回收（ThreadLocal key）；虚引用仅用于跟踪回收 ｜ 详见[《02-JVM核心》](#/f/f9)\n- [ ] **Q：三种基础 GC 算法？** —— 标记-清除（有碎片）、标记-复制（新生代，浪费空间）、标记-整理（老年代，移动对象慢）｜ 详见[《02-JVM核心》](#/f/f9)\n- [ ] **Q：分代收集的设计？** —— 新生代 Eden:Survivor:Survivor = 8:1:1 用复制算法，对象熬过 15 次 GC（默认）晋升老年代用标记整理 ｜ 详见[《02-JVM核心》](#/f/f9)\n- [ ] **Q：Minor GC 和 Full GC 的区别？** —— Minor 只清新生代、STW 短且频繁；Full GC 清整堆+元空间、STW 长，是性能优化的头号目标 ｜ 详见[《02-JVM核心》](#/f/f9)\n- [ ] **Q：对象什么时候进入老年代？** —— 年龄达阈值（默认 15）、大对象直接进入、动态年龄判断、Survivor 放不下 ｜ 详见[《02-JVM核心》](#/f/f9)\n- [ ] **Q：CMS 的原理与问题？** —— 并发标记-清除收集器，四阶段中标记可并发；产生内存碎片、并发失败退化为 Serial Old，已在新版移除 ｜ 详见[《02-JVM核心》](#/f/f9)\n- [ ] **Q：G1 的原理？** —— 堆划分为多个 Region，按\"停顿时间目标\"优先回收垃圾最多的 Region（Mixed GC），JDK 9 起默认 ｜ 详见[《02-JVM核心》](#/f/f9)\n- [ ] **Q：ZGC 的特点？** —— 着色指针+读屏障实现并发整理，停顿 <1ms 且与堆大小无关，适合超大堆低延迟场景 ｜ 详见[《02-JVM核心》](#/f/f9)\n- [ ] **Q：类加载过程？** —— 加载 → 验证 → 准备（静态变量赋零值）→ 解析 → 初始化（执行 \\<clinit\\>），五步常按\"什么时候触发初始化\"追问 ｜ 详见[《02-JVM核心》](#/f/f9)\n- [ ] **Q：双亲委派模型？** —— 类加载请求逐级向上委托（自定义 → 应用 → 扩展 → 启动），保证核心类安全与唯一；打破场景：SPI、热部署、Tomcat 隔离 ｜ 详见[《02-JVM核心》](#/f/f9)\n- [ ] **Q：CPU 飙到 100% 怎么排查？** —— top 找进程 → top -Hp 找线程 → printf '%x' 转十六进制 → jstack 中按 nid 定位到代码行 ｜ 详见[《02-JVM核心》](#/f/f9)\n- [ ] **Q：OOM 怎么排查？** —— 启动加 -XX:+HeapDumpOnOutOfMemoryError 拿堆转储 → MAT/jvisualvm 分析支配树与大对象 → 沿引用链定位泄漏代码 ｜ 详见[《02-JVM核心》](#/f/f9)\n\n### Spring/SpringBoot（15 题）\n\n> 面试形式：围绕 Bean 生命周期、事务失效、自动配置三条主线追问，常结合项目问\"你项目里怎么用的\"。\n\n- [ ] **Q：什么是 IoC 和 DI？** —— IoC 把对象创建与依赖管理交给容器（控制反转），DI 是实现手段：构造器/setter/字段注入 ｜ 详见[《Spring核心》](#/f/f21)\n- [ ] **Q：Bean 的生命周期？** —— 实例化 → 属性填充 → Aware 回调 → BeanPostProcessor 前置 → 初始化（@PostConstruct/afterPropertiesSet）→ 后置处理 → 销毁 ｜ 详见[《Spring核心》](#/f/f21)\n- [ ] **Q：三级缓存如何解决循环依赖？** —— 成品池/早期引用池/工厂池三步走，只能解决单例 + setter 注入的循环依赖，构造器依赖无解 ｜ 详见[《Spring核心》](#/f/f21)\n- [ ] **Q：Bean 的作用域？** —— singleton（默认，容器单例）、prototype（每次新建）、request/session 等 Web 作用域 ｜ 详见[《Spring核心》](#/f/f21)\n- [ ] **Q：AOP 的原理？** —— 运行期动态代理织入横切逻辑：目标类有接口走 JDK 动态代理，无接口走 CGLIB 子类代理 ｜ 详见[《Spring核心》](#/f/f21)\n- [ ] **Q：JDK 动态代理与 CGLIB 的区别？** —— JDK 基于接口反射实现代理，CGLIB 生成子类字节码；final 类/方法无法被 CGLIB 代理 ｜ 详见[《Spring核心》](#/f/f21)\n- [ ] **Q：Spring 事务的传播行为？** —— REQUIRED（默认，有事务则加入）、REQUIRES_NEW（挂起当前另开新事务）、NESTED（嵌套保存点）等 7 种 ｜ 详见[《Spring核心》](#/f/f21)\n- [ ] **Q：Spring 事务失效的场景？** —— 自调用（this 绕过代理）、方法非 public、异常被 catch 吞掉、默认只回滚 RuntimeException、引擎不支持事务 ｜ 详见[《Spring核心》](#
