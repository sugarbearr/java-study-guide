学习目标\n\n- 能对比 TCP 与 UDP 的特性与适用场景，讲清三次握手/四次挥手及「为什么三次」。\n- 会写 Socket TCP 客户端/服务端小程序，会用 Java 11 HttpClient 发请求。\n- 能画/说 BIO、NIO、AIO 的差异，解释 NIO 三大件与多路复用（select/poll/epoll）。\n- 能解释零拷贝的两个核心系统调用及其收益。\n- 能说出 Netty 的定位与高性能的四个原因。\n\n## 📖 核心知识点\n\n### ⭐TCP vs UDP\n\n面试官想听：连接性、可靠性、有序性、速度四个维度对比 + 一个各自的典型应用。\n\n| 维度 | TCP | UDP |\n|---|---|---|\n| 连接 | 面向连接（握手挥手） | 无连接，直接发 |\n| 可靠性 | 可靠：确认重传、滑动窗口、流量/拥塞控制 | 尽力而为，可能丢包乱序 |\n| 数据形态 | 字节流（无消息边界） | 数据报（有边界） |\n| 速度/开销 | 头部 20 字节起，握手有延迟 | 头部 8 字节，低延迟 |\n| 场景 | HTTP、文件传输、数据库连接 | DNS、视频直播、游戏、心跳广播 |\n\n- TCP 可靠传输三板斧：**确认应答（ACK）+ 超时重传**保证不丢；**序号 + 接收缓冲重排**保证有序；**滑动窗口**限速（流量控制）+ **拥塞控制**（慢启动、拥塞避免）保护网络。\n\n### ⭐三次握手 / 四次挥手\n\n面试官想听：能画出双向确认的过程，并回答「为什么握手是三次、挥手是四次」两个为什么。\n\n- **三次握手（建立连接）**：客户端发 SYN → 服务端回 SYN+ACK → 客户端再回 ACK，连接建立。\n- 为什么三次：确认**双方的收发能力都正常**；两次无法让服务端确认「客户端能收到我的包」，同时防止历史（过期）SYN 重复建立连接。\n- **四次挥手（断开连接）**：主动方 FIN → 对方 ACK → 对方（数据发完后）FIN → 主动方 ACK，进入 **TIME_WAIT** 等 2MSL 后关闭。\n- 为什么四次：TCP 全双工，两个方向的关闭各自独立，ACK 和 FIN（被动方收到 FIN 后可能还有数据要发）不能合并，故 ACK、FIN 分开发送。\n- TIME_WAIT 的意义：确保最后的 ACK 若丢失可重传、让旧报文在网络中消亡；大量 TIME_WAIT 常见于短连接服务，可调 `tcp_tw_reuse` 优化。\n\n### HTTP 基础\n\n- 请求报文：请求行（方法 URL 版本）+ 请求头 + 空行 + 请求体；响应报文：状态行 + 响应头 + 响应体。\n- 常见状态码：**200 成功、301/302 重定向、400 客户端请求错误、401 未认证、403 禁止、404 未找到、500 服务器内部错误、502 网关错误、504 网关超时**。\n- **GET vs POST**：语义上 GET 获取（幂等、参数在 URL、可缓存可收藏）；POST 提交（不幂等、参数在 body）；本质都是 TCP 上的报文，区别是约定而非硬性限制。\n\n### HTTPS 握手概念\n\n- TLS 在 TCP 与 HTTP 之间：① 客户端请求并携带支持的加密套件；② 服务端返回证书；③ 客户端用内置 CA 验证证书，生成随机预主密钥并用**服务端公钥**加密发送；④ 双方据其算出对称密钥，之后用**对称加密**通信。\n- 混合加密的原因：非对称加密安全但慢，只用来交换密钥；数据传输用快的对称加密。这一过程同时解决机密性与身份认证（证书）。\n\n### Socket 编程 demo\n\n```java\n// 服务端：accept 阻塞等连接，每连接一个线程处理（BIO）\ntry (ServerSocket server = new ServerSocket(8080)) {\n    while (true) {\n        Socket socket = server.accept();              // 阻塞点 1\n        new Thread(() -> {\n            try (BufferedReader in = new BufferedReader(\n                     new InputStreamReader(socket.getInputStream()));\n                 PrintWriter out = new PrintWriter(socket.getOutputStream(), true)) {\n                String line;\n                while ((line = in.readLine()) != null) {   // 阻塞点 2\n                    out.println(\"echo: \" + line);\n                }\n            } catch (IOException ignored) { }\n        }).start();\n    }\n}\n```\n\n```java\n// 客户端\ntry (Socket s = new Socket(\"127.0.0.1\", 8080);\n     PrintWriter out = new PrintWriter(s.getOutputStream(), true)) {\n    out.println(\"hello\");\n}\n```\n\n- UDP：`DatagramSocket` + `DatagramPacket`，`send/receive` 收发数据报，无需连接。\n- Java 11 标准 `HttpClient`：支持 HTTP/2、同步 `send` 与异步 `sendAsync`（返回 CompletableFuture）：\n\n```java\n// Java 11 标准 HttpClient：支持 HTTP/2、同步 send 与异步 sendAsync\nHttpClient client = HttpClient.newHttpClient();\nHttpRequest req = HttpRequest.newBuilder(URI.create(\"http://localhost:8080/api/health\")).build();\nHttpResponse<String> resp = client.send(req, HttpResponse.BodyHandlers.ofString());  // 同步\nclient.sendAsync(req, HttpResponse.BodyHandlers.ofString())\n      .thenApply(HttpResponse::body)                                                  // 异步\n      .thenAccept(System.out::println);\n```\n\n### ⭐BIO / NIO / AIO 对比\n\n面试官想听：用「等谁」来区分——BIO 等数据、NIO 等就绪事件、AIO 等完成通知；再补连接数与线程数的关系。\n\n| 模型 | 全称 | 阻塞点 | 线程模型 | 适用 |\n|---|---|---|---|---|\n| BIO | 同步阻塞 | accept/read/write 全阻塞 | 一个连接一个线程 | 连接少且固定 |\n| NIO | 同步非阻塞 | 线程轮询 Selector 等就绪事件 | 一个线程管理多个 Channel | 连接多、请求轻（高并发核心） |\n| AIO | 异步非阻塞 | 发起后立即返回，完成后回调 | 系统完成 I/O 再通知 | 理论最优，Linux 实现不成熟，实际少用 |\n\n- 记忆口径：BIO/NIO/AIO 的本质差异在「等待阶段用户线程做不做事」：BIO 死等、NIO 不阻塞但需主动轮询事件、AIO 注册回调由内核完成。\n- 「同步/异步」看**是谁完成真正的 I/O 拷贝**（用户进程 = 同步，内核通知 = 异步）；「阻塞/非阻塞」看**发起调用后线程是否挂起**。\n\n### ⭐NIO 三大件：Channel / Buffer / Selector\n\n面试官想听：能讲一个完整事件循环：注册 → select 轮询 → 判断事件类型 → 读写，并注意 flip。\n\n- **Channel（通道）**：双向数据通道（Stream 是单向的），`SocketChannel/ServerSocketChannel/FileChannel`，配合 Buffer 读写。\n- **Buffer（缓冲区）**：`ByteBuffer` 核心参数 `position/limit/capacity`；写完读之前必须 `flip()`（limit 置为 position、position 归零），`clear()` 重写、`rewind()` 重读。\n- **Selector（多路复用器）**：一个线程注册多个 Channel，`select()` 阻塞到任一 Channel 就绪，返回 `SelectionKey` 集合（OP_ACCEPT/OP_READ/OP_WRITE/OP_CONNECT），就绪才分配线程读写——把「每连接一线程」变成「每就绪事件一处理」。\n\n```java\nSelector selector = Selector.open();\nServerSocketChannel ssc = ServerSocketChannel.open();\nssc.configureBlocking(false);                      // NIO 必须非阻塞\nssc.register(selector, SelectionKey.OP_ACCEPT);\nwhile (selector.select() > 0) {                    // 轮询就绪事件\n    for (SelectionKey key : selector.selectedKeys()) {\n        if (key.isAcceptable()) ((ServerSocketChannel) key.channel()).accept();\n        // ... 处理 OP_READ 等，处理后 remove key\n    }\n}\n```\n\n- 多路复用底层：**select**（fd 数组遍历，1024 上限）、**poll**（链表，无上限但仍 O(n) 遍历）、**epoll**（红黑树 + 就绪链表 + 事件回调，O(1)，Linux 2.6+，Netty/Nginx 依赖它）。一句话：**select/poll 是遍历所有 fd 问谁好了，epoll 是内核把好的 fd 主动报给你**。\n\n### Reactor 模式\n\n- 核心思想：**I/O 多路复用 + 事件分发**——Reactor 线程监听事件，分发给 Handler 处理。\n- 单 Reactor 单线程（Redis 6 前）、单 Reactor 多线程（工作线程池处理业务）、主从 Reactor 多线程（accept 由主 Reactor，I/O 由子 Reactor 组）——Netty 默认主从模式（bossGroup + workerGroup）。\n\n### ⭐零拷贝\n\n面试官想听：传统读发要 4 次拷贝 4 次上下文切换，mmap/sendfile 把它降到 2 次甚至 0 次 CPU 拷贝。\n\n- 传统方式 `read + write`：磁盘 → 内核缓冲 → 用户缓冲（应用）→ Socket 缓冲 → 网卡，**4 次拷贝、4 次用户态内核态切换**。\n- `mmap`（内存映射）：用户空间与内核缓冲共享映射，减少一次拷贝；`sendfile`：数据直接在内核内从文件缓冲流向 Socket 缓冲，用户态零参与；网卡支持 gather 时连 Socket 缓冲拷贝都省掉（DMA 直接收集），仅 2 次拷贝且全在内核。\n- Java 对应：`FileChannel.transferTo()` 即 sendfile；Kafka 高吞吐、RocketMQ、Nginx `sendfile on` 都是受益者。**适用条件：不需要在应用层修改数据**，需要加工时仍要走用户态。\n\n### ⭐Netty 定位与为什么快\n\n面试官想听：Netty = 封装好 NIO 的异步事件驱动网络框架，快在四点：Reactor 线程模型、epoll、零拷贝、池化内存。\n\n- 定位：屏蔽 JDK NIO 复杂 API 与空轮询 bug（epoll bug），提供统一的异步事件驱动编程模型；Dubbo/gRPC/ElasticSearch 等的通信底座。\n- 高性能四要点：① **主从 Reactor 多线程模型**（boss 收连接、worker 处理 I/O）；② 基于 **epoll** 多路复用；③ **ByteBuf 池化**（PooledByteBufAllocator，减少 GC）与 CompositeByteBuf 等零拷贝（逻辑组合而非物理拷贝）；④ **无锁串行化设计**——消息在同一个 Channel 上始终由同一线程处理，避免锁竞争。\n- 组件速记：`Channel`（连接）、`EventLoop/EventLoopGroup`（线程+多路复用循环）、`ChannelPipeline`（Handler 责任链，解码/业务/编码）、`ByteBuf`（增强 Buffer）。\n\n## 🛠 动手实践\n\n### 任务 1：BIO 多线程聊天室\n\n- 要求：扩展上文 demo：服务端维护 `CopyOnWriteArrayList<PrintWriter>`，收到消息广播给所有在线客户端；客户端开两个线程（一个读控制台发送、一个收服务端消息）。\n- 验收标准：开 3 个终端同时对话，消息全量可见；一个客户端断开不影响其他（异常处理 + 移除失效 writer）；能说出连接数一多该模型的瓶颈（线程暴涨、内存占用）。\n\n### 任务 2：缓冲流拷贝性能对比\n\n- 要求：用 IO 章节（04-异常-IO-反射-注解.md）的任务 2 结论做基准；再用 `FileChannel.transferTo()` 拷贝同一个 ≥ 100MB 的文件并计时。\n- 验收标准：三组数据（单字节、8KB 缓冲数组、transferTo）对比；transferTo 明显更快；能解释它走的是 sendfile 零拷贝路径。\n\n### 任务 3（可选）：Netty echo server\n\n- 要求：引入 `io.netty:netty-all`，实现 boss/worker 两 EventLoopGroup 的 echo 服务；自定义 `SimpleChannelInboundHandler<ByteBuf>` 原样返回；telnet 测试。\n- 验收标准：客户端发送什么返回什么；能指出 pipeline 中 handler 的处理顺序；说出该 demo 对应 Reactor 的哪一种模型。\n\n## 💼 高频面试题\n\n**Q：说说 TCP 三次握手和四次挥手。⭐**\n- 握手：SYN → SYN+ACK → ACK；目的是确认双方收发能力、同步初始序列号、防止历史连接误建。\n- 挥手：FIN → ACK → FIN → ACK；因 TCP 全双工，被动方 ACK 与 FIN 不能合并（可能还有数据要发）。\n- 主动方最后进入 TIME_WAIT 等 2MSL：保证最后的 ACK 丢失可重传、旧报文自然消亡。\n\n**Q：为什么握手是三次而不是两次？**\n- 两次时服务端无法确认「客户端能收到自己的包」，连接的发送通道未获确认。\n- 同时无法阻止一个在网络中滞留的旧 SYN 再次建立无效连接。\n- 三次是确认双方收发能力的最小次数。\n\n**Q：TCP 如何保证可靠传输？**\n- 序号 + 确认应答（ACK），超时或收到重复 ACK 触发重传。\n- 接收缓冲区对乱序数据重排。\n- 滑动窗口做流量控制（不压垮接收方），慢启动/拥塞避免做拥塞控制（不压垮网络）；校验和检查数据损坏。\n\n**Q：BIO、NIO、AIO 的区别？⭐**\n- BIO 同步阻塞：accept/read 全阻塞，一个连接一线程，连接多时线程暴涨。\n- NIO 同步非阻塞：Selector 多路复用，一个线程监听多个 Channel 的就绪事件，就绪才读写；「同步」指数据拷贝仍由用户线程发起完成。\n- AIO 异步非阻塞：发起后立即返回，内核完成 I/O 后回调通知；Linux 实现不成熟，实际生产多用 NIO。\n- 一句话：BIO 等数据、NIO 等事件、AIO 等通知。\n\n**Q：select、poll、epoll 的区别？一句话概括。**\n- select：固定大小 fd 数组，每次全量遍历 O(n)，有 1024 上限。\n- poll：链表突破数量上限，但仍 O(n) 拷贝与遍历。\n- epoll：红黑树管理 fd + 就绪链表回调，只返回就绪的 fd，O(1)；一句话——前两者是「挨个问谁好了」，epoll 是「好了的主动排队」。\n\n**Q：什么是零拷贝？⭐**\n- 传统 read+write：4 次拷贝（磁盘→内核缓冲→用户缓冲→Socket 缓冲→网卡）+ 4 次上下文切换。\n- sendfile 让数据全程在内核态流转，CPU 拷贝降为 0~1 次、切换降为 2 次；mmap 用映射减少一次拷贝。\n- Java 里 `FileChannel.transferTo` 即 sendfile；Kafka/RocketMQ/Nginx 借此实现高吞吐；前提是应用不需要改数据。\n\n**Q：Netty 为什么高性能？⭐**\n- 主从 Reactor 多线程模型：bossGroup 收连接，workerGroup 处理 I/O，业务不阻塞 I/O 线程。\n- 底层基于 epoll 等 I/O 多路复用，并修复了 JDK NIO 的空轮询 bug。\n- ByteBuf 池化 + 复合缓冲的零拷贝，减少内存分配与 GC。\n- 单 Channel 事件无锁串行化到同一 EventLoop，避免锁竞争；pipeline 责任链灵活编解码。\n\n**Q：HTTP 常见状态码？GET 和 POST 的区别？**\n- 2xx 成功、301/302 重定向、400 参数错误、401 未认证、403 无权限、404 不存在、500 服务器错误、502/504 网关错误。\n- GET 获取资源：幂等、参数在 URL、可缓存；POST 提交数据：参数在 body、一般不幂等。\n- 面试加分：安全层面 GET 会被浏览器历史/日志记录，敏感数据应用 POST + HTTPS。\n\n## 🔗 推荐资料\n\n| 资料 | 说明 | 链接 |\n|---|---|---|\n| 廖雪峰 Java 网络编程 | Socket/UDP/邮件主线教程 | https://liaoxuefeng.com/books/java/network/index.html |\n| pdai IO/NIO/AIO 总览 | 三种模型与 NIO 三大件体系图 | https://pdai.tech/md/java/io/java-io-overview.html |\n| pdai 零拷贝 | mmap/sendfile 原理与图解 | https://pdai.tech/md/java/io/java-io-nio-zerocopy.html |\n| JavaGuide IO 模型 | BIO/NIO/AIO 面试向对比 | https://javaguide.cn/java/io/io-model.html |\n| JavaGuide NIO 基础 | Channel/Buffer/Selector 细节 | https://javaguide.cn/java/io/nio-basis.html |\n| JavaGuide IO 基础 | IO 流体系与序列化复习 | https://javaguide.cn/java/io/io-basis.html |\n","ck":0},{"id":"f11","stage":3,"path":"03-数据库篇/01-MySQL基础与SQL实战.md","title":"MySQL基础与SQL实战","md":"# MySQL基础与SQL实战\n\n> **阶段**：数据库篇 ｜ **建议时长**：6 天 ｜ **前置**：无\n\n## 🎯 学习目标\n\n- 能用 Docker 启动 MySQL 8 实例，通过客户端完成建库、建表、造数等基本操作。\n- 能说出核心数据类型（int/bigint/varchar/char/datetime/decimal）的选型依据与常见坑。\n- 能熟练书写连接查询、分组聚合、子查询、分页 SQL，独立完成本篇 10 道练习题。\n- 能背出 SQL 逻辑执行顺序，并用它解释 where/having、别名引用等规则。\n- 能说清 JDBC 六步、连接池的作用，以及\"从 JDBC 到 MyBatis\"的演进原因。\n\n## 📖 核心知识点\n\n### 1. 环境搭建：库、表、行\n\nDocker 一条命令启动 MySQL 8（数据落在具名卷 `mysql-data`，删容器不丢数据）：\n\n```bash\ndocker run -d --name mysql8 \\\n  -p 3306:3306 \\\n  -e MYSQL_ROOT_PASSWORD=root123 \\\n  -e TZ=Asia/Shanghai \\\n  -v mysql-data:/var/lib/mysql \\\n  mysql:8.0.36 \\\n  --character-set-server=utf8mb4 \\\n  --collation-server=utf8mb4_general_ci\n```\n\n```bash\n# 进入命令行客户端\ndocker exec -it mysql8 mysql -uroot -proot123\n```\n\n```sql\nSHOW DATABASES;                                    -- 查看所有库\nCREATE DATABASE school DEFAULT CHARSET utf8mb4;    -- 建库，字符集统一 utf8mb4\nUSE school;\nSHOW TABLES;                                       -- 查看库中的表\nDESC student;                                      -- 查看表结构\n```\n\n三个层级：**database（库）→ table（表）→ row（行）/ column（列）**。一个库对应一个业务域（如订单库、用户库），一张表对应一类实体，一行就是一条记录。\n\n客户端工具：命令行 `mysql`、IDEA 自带 Database 面板、Navicat / DataGrip / DBeaver（免费），学习期任选其一即可。\n\n### 2. 数据类型选择与约束 ⭐\n\n> 面试官想听：能否按业务选对类型，并说出\"金额为什么用 DECIMAL、字段为什么尽量 NOT NULL\"。\n\n| 类型 | 适用场景 | 注意点 |\n| --- | --- | --- |\n| INT | 状态、数量（约 ±21 亿） | `INT(11)` 的 11 只是显示宽度，不影响存储范围 |\n| BIGINT | 主键、雪花 ID | 主键首选，永不溢出 |\n| DECIMAL(M,D) | 金额 | FLOAT/DOUBLE 有精度丢失，金额禁用 |\n| CHAR(N) | 定长：身份证、MD5 串 | 不足补空格存取略快，过长浪费空间 |\n| VARCHAR(N) | 变长：姓名、标题 | 额外 1~2 字节存长度；N 是字符数不是字节数 |\n| DATETIME | 绝大多数时间字段 | 无时区转换，8 字节，范围 1000~9999 年 |\n| TIMESTAMP | 需要时区转换的场景 | 4 字节，最大只到 2038 年，受时区影响 |\n\n选型三原则：能用数字不用字符串；字段尽量 `NOT NULL` 并给默认值（NULL 会干扰索引、统计和 `COUNT`）；长文本用 TEXT 并考虑拆到扩展表。\n\n常用约束：`PRIMARY KEY`（唯一+非空）、`UNIQUE`、`NOT NULL`、`DEFAULT`、`FOREIGN KEY`。互联网公司普遍**不建物理外键**，只建普通索引并在应用层校验：外键带来级联锁与维护开销，且不利于后续分库分表。\n\n### 3. SQL 三大类\n\n- DDL（定义）：`CREATE / ALTER / DROP / TRUNCATE`，操作表结构。\n- DML（操作）：`INSERT / UPDATE / DELETE`，操作数据。\n- DQL（查询）：`SELECT`，面试与日常工作的主战场。\n- 另有 DCL（`GRANT/REVOKE` 权限）、TCL（`COMMIT/ROLLBACK` 事务），了解即可。\n\n### 4. 查询核心：连接、分组、子查询 ⭐\n\n> 面试官想听：SQL 逻辑执行顺序脱口而出，并能解释\"为什么 where 里不能用 select 的别名\"。\n\n**SQL 逻辑执行顺序**（书写从 SELECT 开始，执行却不是）：\n\n```text\nFROM → ON → JOIN → WHERE → GROUP BY → HAVING → SELECT(含别名) → DISTINCT → ORDER BY → LIMIT\n```\n\n两条推论：`WHERE` 阶段早于 `SELECT`，所以引用不了 SELECT 定义的别名，`ORDER BY` 可以；`WHERE` 过滤行，`HAVING` 过滤分组后的结果。\n\n基础骨架：\n\n```sql\nSELECT s.name, c.name AS course_name, sc.value\nFROM score sc\nJOIN student s ON sc.student_id = s.id\nJOIN course  c ON sc.course_id  = c.id\nWHERE sc.value >= 60\nGROUP BY sc.course_id, c.name\nHAVING AVG(sc.value) > 80\nORDER BY sc.value DESC\nLIMIT 10;\n```\n\n**三种连接**：\n\n- `INNER JOIN`：只返回两表都匹配上的行。\n- `LEFT JOIN`：左表全部保留，右表匹配不上补 NULL——\"查没有 XX 的记录\"类题目的标准解法。\n- `RIGHT JOIN`：LEFT 的镜像，项目里几乎不用（交换表顺序改写成 LEFT）。\n\n**子查询与 EXISTS**：子查询可出现在 WHERE（标量/列/表）、FROM（派生表）中。`IN` 与 `EXISTS` 的选择：子查询结果集小用 `IN`，外表小用 `EXISTS`，核心思想都是\"小表驱动大表\"。\n\n**UNION vs UNION ALL**：`UNION` 合并后去重（多一步去重计算，慢），`UNION ALL` 直接拼接（快）；确定无重复数据时一律用 UNION ALL。\n\n### 5. 常用函数与实用写法 ⭐\n\n> 面试官想听：CASE WHEN 行转列、IFNULL 兜底这类\"写得出\"的硬功夫。\n\n```sql\n-- 字符串：拼接、截取、长度、替换\nSELECT CONCAT(name, '-', gender) FROM student;\nSELECT SUBSTRING(name, 1, 1), LENGTH(name), REPLACE(name, '张', '章') FROM student;\n\n-- 日期：当前时间、加减、差值、格式化\nSELECT NOW(), CURDATE();\nSELECT DATE_ADD(NOW(), INTERVAL 7 DAY), DATEDIFF(NOW(), '2026-01-01');\nSELECT DATE_FORMAT(NOW(), '%Y-%m-%d %H:%i:%s');\n\n-- IFNULL 空值兜底；IF 三元\nSELECT IFNULL(value, 0) FROM score;\n\n-- CASE WHEN：分段统计与行转列的核心\nSELECT value,\n  CASE WHEN value >= 90 THEN 'A'\n       WHEN value >= 60 THEN 'B'\n       ELSE 'C' END AS grade\nFROM score;\n```\n\n分页：`LIMIT offset, size`，第 1 页 `LIMIT 0,10`、第 2 页 `LIMIT 10,10`；offset 越大越慢（深分页问题，下一篇详讲）。去重：`SELECT DISTINCT course_id FROM score;`。\n\nCOUNT 三兄弟：`COUNT(*)`（InnoDB 有专门优化，推荐）、`COUNT(1)`（与 * 等价）、`COUNT(col)`（不统计该列为 NULL 的行，语义不同）。\n\n### 6. 从 JDBC 到 ORM（衔接框架篇）\n\n**JDBC 六步**：加载驱动 → 获取连接 `DriverManager.getConnection()` → 创建 Statement → 执行 SQL → 处理 ResultSet → 关闭资源（倒序释放）。原生写法痛点：样板代码冗长、SQL 与 Java 代码耦合、结果集要手动映射成对象。\n\n**连接池**解决\"连接无法复用\"：TCP 建连 + 认证开销大，池子提前建好连接、借还复用。Spring Boot 2.x 起默认 **HikariCP**（轻量高效），国内也常用 **Druid**（阿里出品，自带 SQL 监控页面）。\n\nORM 演进：JDBC → JdbcTemplate（只省样板代码）→ **MyBatis**（SQL 独立到 XML、结果自动映射、灵活可控）→ JPA/Hibernate（全自动但复杂 SQL 难写）。国内互联网主流是 MyBatis-Plus，框架篇展开。\n\n## 🛠 动手实践\n\n### 任务 1：Docker 起库并熟悉客户端（30 分钟）\n\n按上文命令启动 MySQL 8，命令行和 IDEA Database 面板各连一次。\n验收：`SELECT VERSION();` 显示 8.x；能熟练完成建库、`SHOW TABLES`、`DESC`。\n\n### 任务 2：学生-课程-成绩三表并造数（1 小时）\n\n```sql\nCREATE DATABASE school DEFAULT CHARSET utf8mb4;\nUSE school;\n\nCREATE TABLE student (\n  id         BIGINT PRIMARY KEY AUTO_INCREMENT,\n  name       VARCHAR(20) NOT NULL,\n  gender     TINYINT     NOT NULL DEFAULT 1 COMMENT '1男 0女',\n  birthday   DATE,\n  created_at DATETIME    NOT NULL DEFAULT CURRENT_TIMESTAMP\n);\n\nCREATE TABLE course (\n  id   BIGINT PRIMARY KEY AUTO_INCREMENT,\n  name VARCHAR(30) NOT NULL UNIQUE\n);\n\nCREATE TABLE score (\n  id         BIGINT PRIMARY KEY AUTO_INCREMENT,\n  student_id BIGINT NOT NULL,\n  course_id  BIGINT NOT NULL,\n  value      DECIMAL(5,1) NOT NULL,\n  UNIQUE KEY uk_student_course (student_id, course_id)  -- 一人一课只允许一条成绩\n);\n\nINSERT INTO student (name, gender, birthday) VALUES\n('张三', 1, '2003-05-12'), ('李四', 1, '2002-11-03'),\n('王五', 0, '2003-08-21'), ('赵六', 0, '2004-01-15');\n\nINSERT INTO course (name) VALUES ('语文'), ('数学'), ('英语'), ('体育');\n\nINSERT INTO score (student_id, course_id, value) VALUES\n(1,1,85.5),(1,2,92.0),(1,3,78.0),\n(2,1,74.0),(2,2,88.5),\n(3,1,90.0),(3,3,95.5),\n(4,2,59.5);\n```\n\n验收：三表能独立查询，也能 JOIN 出\"学生名-课程名-分数\"宽表。\n\n### 任务 3：10 道经典 SQL 练习（3 天）\n\n前 3 题给思路，先自己写再看答案；后 7 题独立完成。\n\n**第 1 题：每门课程的平均分，只保留平均分大于 80 的课程。**\n思路：按课程分组 → 组内求平均 → 对\"分组结果\"过滤。过滤组必须用 HAVING（WHERE 过滤行且执行在聚合之前）。\n\n```sql\nSELECT c.name, AVG(sc.value) AS avg_value\nFROM score sc JOIN course c ON sc.course_id = c.id\nGROUP BY sc.course_id, c.name\nHAVING avg_value > 80;\n```\n\n**第 2 题：每门课程最高分对应的学生姓名（考虑并列第一）。**\n思路：不能直接 `MAX(value)` 后顺手取姓名（非聚合列会取到错误行）。先分组聚合出\"课程-最高分\"，再把这个结果当一张表 join 回去查姓名。\n\n```sql\nSELECT c.name AS course_name, s.name, t.max_value\nFROM (SELECT course_id, MAX(value) AS max_value FROM score GROUP BY course_id) t\nJOIN score  sc ON sc.course_id = t.course_id AND sc.value = t.max_value\nJOIN course c  ON c.id = sc.course_id\nJOIN student s ON s.id = sc.student_id;\n```\n\n**第 3 题：查询没有选「数学」课的学生姓名。**\n思路：`NOT IN` 的子查询结果含 NULL 时整个查询返回空，推荐 `NOT EXISTS` 或 LEFT JOIN + IS NULL。\n\n```sql\nSELECT s.name FROM student s\nWHERE NOT EXISTS (\n  SELECT 1 FROM score sc\n  JOIN course c ON c.id = sc.course_id\n  WHERE sc.student_id = s.id AND c.name = '数学'\n);\n```\n\n**第 4~10 题（独立完成，附提示）：**\n\n| # | 题目 | 提示 |\n| --- | --- | --- |\n| 4 | 每个学生的平均分并降序排名 | GROUP BY + ORDER BY |\n| 5 | 选课数量大于等于 2 门的学生姓名 | COUNT + HAVING |\n| 6 | 既选了语文又选了数学的学生 | GROUP BY 后 HAVING COUNT(DISTINCT course_id) = 2 |\n| 7 | 每科成绩前两名（考虑并列） | MySQL 8 窗口函数 ROW_NUMBER / RANK |\n| 8 | 没有任何选课记录的学生 | LEFT JOIN ... IS NULL 或 NOT EXISTS |\n| 9 | 行转列：输出 学生/语文/数学/英语 每人一行 | CASE WHEN + GROUP BY + MAX |\n| 10 | 统计 90+、60~89、60 以下各分数段人数 | CASE WHEN 作为分组维度 |\n\n验收：10 题全部在本地库跑出正确结果；第 2、3 题不看答案能复述思路。\n\n## 💼 高频面试题\n\n**Q：CHAR 和 VARCHAR 的区别？**\n- CHAR(N) 定长，不足自动补空格，存取效率略高，适合长度固定的值（身份证、MD5）。\n- VARCHAR(N) 变长，额外 1~2 字节记录实际长度，省空间，适合长度波动大的值。\n- N 都是字符数不是字节数；utf8mb4 下一个中文最多 3 字节，emoji 占 4 字节。\n\n**Q：DATETIME 和 TIMESTAMP 怎么选？**\n- DATETIME 8 字节，范围 1000~9999 年，与时区无关；TIMESTAMP 4 字节，最大到 2038 年，存取时做时区转换。\n- 一般业务字段用 DATETIME + 应用层统一时区；\"跟随客户端时区变化\"的全球化场景才考虑 TIMESTAMP。\n- 建表常用 `DEFAULT CURRENT_TIMESTAMP` 和 `ON UPDATE CURRENT_TIMESTAMP` 自动维护创建/更新时间。\n\n**Q：DROP、DELETE、TRUNCATE 的区别？**\n- DELETE 是 DML：逐行删、可加 WHERE、事务内可回滚、不重置自增。\n- TRUNCATE 是 DDL：清空整表、不可回滚、重置自增、速度远快于无 WHERE 的 DELETE。\n- DROP 是 DDL：连表带结构一起删，不可回滚。\n- 一句话：删部分数据用 DELETE，清空重置用 TRUNCATE，表不要了用 DROP。\n\n**Q：内连接和左连接的区别？**\n- INNER JOIN 只返回两表都匹配的行；LEFT JOIN 保留左表全部行，右表匹配不上补 NULL。\n- 典型场景：\"查询所有用户，包括没下过单的\"必须 LEFT JOIN；内连接会把没下单的用户丢掉。\n- 反向需求\"只查没匹配上的行\"用 LEFT JOIN + WHERE 右表主键 IS NULL。\n\n**Q：WHERE 和 HAVING 的区别？**\n- 执行顺序上 WHERE 在 GROUP BY 之前过滤行，HAVING 在之后过滤分组。\n- WHERE 不能用聚合函数，HAVING 可以（此时聚合结果已产生）。\n- 能放 WHERE 的条件不放 HAVING：先过滤行，减少参与分组的数据量。\n\n**Q：IN 和 EXISTS 的区别？**\n- IN 先执行子查询得到结果集，外表逐行去匹配；EXISTS 以外表为驱动，逐行到子查询探测是否存在。\n- 经验法则：子查询结果集小用 IN，外表小用 EXISTS，本质都是小表驱动大表。\n- 注意 NOT IN 遇到 NULL 会整体返回空，用 NOT EXISTS 更安全。\n\n**Q：COUNT(*)、COUNT(1)、COUNT(列) 有什么区别？**\n- InnoDB 下 COUNT(*) 与 COUNT(1) 等价，官方对 COUNT(*) 有专门优化，推荐使用。\n- COUNT(col) 不统计 col 为 NULL 的行，语义不同，不要混用。\n- COUNT(主键) 并不更快，没必要替代 COUNT(*)。\n\n## 🔗 推荐资料\n\n| 资料 | 说明 | 链接 |\n| --- | --- | --- |\n| JavaGuide 数据库基础知识 | 基础概念、范式、数据类型全覆盖 | https://javaguide.cn/database/basis.html |\n| JavaGuide SQL 语句面试题 | 经典 SQL 练习题与解析，配合本篇练习 | https://javaguide.cn/database/sql/sql-questions-01.html |\n| JavaGuide MySQL 面试题 | 基础+进阶面试题速查 | https://javaguide.cn/database/mysql/mysql-questions-01.html |\n| pdai MySQL 知识体系总览 | 从安装到调优的知识目录地图 | https://pdai.tech/md/db/sql-mysql/sql-mysql-overview.html |\n| 廖雪峰 JDBC 教程 | 本篇第 6 节 JDBC 六步的代码级讲解 | https://liaoxuefeng.com/books/java/jdbc/index.html |\n","ck":0},{"id":"f12","stage":3,"path":"03-数据库篇/02-索引-事务-锁与调优.md","title":"索引-事务-锁与调优","md":"# 索引-事务-锁与调优\n\n> **阶段**：数据库篇 ｜ **建议时长**：7 天 ｜ **前置**：01-MySQL基础与SQL实战.md\n\n## 🎯 学习目标\n\n- 能从磁盘 IO 角度解释 InnoDB 为什么选 B+ 树，并说清聚簇索引、回表、覆盖索引、最左前缀。\n- 能画出 undo log 版本链 + ReadView，解释 MVCC 如何实现 RC/RR 两种隔离级别。\n- 能说清 redo/undo/binlog 三大日志的分工与两阶段提交的必要性。\n- 能用 explain 定位慢 SQL，独立完成本篇 3 条慢 SQL 的优化。\n- 能讲出主从复制原理与分库分表的触发条件、代价、常见方案。\n\n## 📖 核心知识点\n\n### 1. 索引：为什么用 B+ 树 ⭐\n\n> 面试官想听：不是背\"B+ 树好\"，而是能拿哈希/红黑树/B 树逐个对比出原因。\n\n索引本质：一张排好序的、以空间换时间的查找结构。InnoDB 以**页**（默认 16KB）为最小 IO 单位，衡量指标就是\"找一行数据要几次页 IO\"。\n\n| 结构 | 问题 |\n| --- | --- |\n| 哈希表 | 等值快，但不支持范围查询和排序 |\n| 红黑树（二叉） | 树太高：1000 万数据约 23 层 = 23 次磁盘 IO |\n| B 树 | 非叶子节点也存数据，单页容纳的键少、树变高；范围查询要中序回溯 |\n| B+ 树 | 非叶子只存键+指针，叶子存数据且用双向链表串起来 |\n\n```text\n高度估算（InnoDB 默认 16KB 页）：\n非叶子节点：bigint 主键 8B + 页指针 6B ≈ 一页放 1170 项\n叶子节点：按一行 1KB 估算，一页放约 16 行\n3 层容量 ≈ 1170 × 1170 × 16 ≈ 2000 万行 → 3 次 IO 定位任意一行\n范围查询：定位起点后沿叶子链表顺序扫描即可\n```\n\n**聚簇索引 vs 二级索引**：聚簇索引即主键索引，叶子节点存整行数据（所以表本身就是一棵 B+ 树）；二级索引（辅助索引）叶子节点只存\"索引列 + 主键值\"。用二级索引查非覆盖列时，要先拿主键再回聚簇索引查整行，这一步叫**回表**。\n\n**覆盖索引**：查询的列全部包含在某个索引里，无需回表，explain 的 Extra 显示 `Using index`。常用手段：把 `SELECT` 需要的列加进联合索引，或至少 `SELECT id`（二级索引自带主键）。\n\n**最左前缀原则**：联合索引 `(a, b, c)` 相当于建了 `a`、`(a,b)`、`(a,b,c)` 三套索引能力；查询条件必须从最左列开始连续命中，遇到范围查询（>、<、between、like 'xx%'）后面的列停止走索引。设计口诀：等值列在前、范围列在后、尽量覆盖查询字段。\n\n**索引下推（ICP）**：MySQL 5.6+ 默认开启，联合索引中即使某列不能直接走索引匹配，也可在引擎层先过滤，减少回表次数。\n\n### 2. 索引失效的常见场景 ⭐\n\n> 面试官想听：能结合 explain 说出至少 5 种失效原因，而不是死记硬背。\n\n```sql\n-- 以下写法都会让 idx_name 等索引失效或部分失效\nWHERE LEFT(name, 1) = '张'          -- 1. 对索引列使用函数\nWHERE name = '张' OR age = 18       -- 2. OR 两侧存在无索引的列\nWHERE name LIKE '%三'               -- 3. 左模糊（'张%' 不失效）\nWHERE phone = 13800000000           -- 4. 隐式类型转换：varchar 列传了数字\nWHERE age + 1 = 20                  -- 5. 对索引列做运算\nWHERE b = 2                         -- 6. 联合索引 (a,b) 跳过最左列 a\nWHERE id <> 5 / NOT IN (...)        -- 7. 否定条件通常无法走索引（视优化器而定）\n```\n\n另两类\"假失效\"：优化器判断全表扫描更快（回表数据量大、查询超过表的 20%~30%）；统计信息过期。排查手段永远是 `EXPLAIN` + 实测。\n\n### 3. explain 关键列 ⭐\n\n> 面试官想听：拿到 explain 输出能立刻判断这条 SQL 健不健康。\n\n```sql\nEXPLAIN SELECT * FROM big_user WHERE name = 'user_999999';\n```\n\n重点看 5 列：\n\n| 列 | 关注点 |\n| --- | --- |\n| id | 子查询执行顺序；id 相同从上往下 |\n| type | 访问类型，从好到差：`const > eq_ref > ref > range > index > ALL`，生产 SQL 至少 range |\n| key | 实际用到的索引；key=NULL 说明没走索引 |\n| rows | 预估扫描行数，越接近 1 越好，百万级就要警惕 |\n| Extra | `Using index` 覆盖索引（好）；`Using filesort` 额外排序（坏）；`Using temporary` 临时表（坏） |\n\n### 4. 事务：ACID、隔离级别与 MVCC ⭐\n\n> 面试官想听：ACID 各靠什么机制实现，MVCC 能讲出\"版本链 + ReadView\"两件套。\n\n- **原子性**：undo log 回滚未提交的修改。\n- **持久性**：redo log 保证提交后宕机不丢（WAL：先写日志再刷数据页）。\n- **隔离性**：MVCC + 锁。\n- **一致性**：前三者是手段，一致性是最终目的。\n\n三类并发问题：**脏读**（读到别人未提交的数据）、**不可重复读**（同一次事务内两次读同一行值不同——针对 UPDATE）、**幻读**（两次范围查询行数不同——针对 INSERT/DELETE）。\n\n四个隔离级别（MySQL InnoDB 默认 **REPEATABLE READ**）：\n\n| 级别 | 脏读 | 不可重复读 | 幻读 |\n| --- | --- | --- | --- |\n| READ UNCOMMITTED | 可能 | 可能 | 可能 |\n| READ COMMITTED | 避免了 | 可能 | 可能 |\n| REPEATABLE READ（默认） | 避免了 | 避免了 | 快照读避免/当前读靠临键锁 |\n| SERIALIZABLE | 避免了 | 避免了 | 避免了 |\n\n**MVCC 原理**：\n\n```text\n隐藏列：每行有 trx_id(最近修改它的事务) 和 roll_pointer(指向 undo log 旧版本)\nundo log 版本链：多次修改形成链表，新版本指向旧版本\nReadView：m_ids(生成时刻的活跃事务列表)、min_trx_id、max_trx_id、creator_trx_id\n可见性判断：trx_id < min → 可见；trx_id >= max → 不可见；\n           介于中间 → 在 m_ids 里不可见、不在则可见；不可见就顺 roll_pointer 找旧版本\n```\n\nRC 与 RR 的唯一实现差异：**RC 每次快照读都生成新的 ReadView，RR 只在第一次快照读时生成并复用**——这就是 RR 能\"可重复读\"的原因。\n\n**RR 下如何避免幻读**：快照读（普通 SELECT）靠 MVCC 看到的是事务开始时的快照；当前读（`SELECT ... FOR UPDATE / UPDATE / DELETE / INSERT`）靠 **Next-Key Lock = 记录锁 + 间隙锁**锁住范围，阻止其他事务在范围内插入。两个会话混用快照读和当前读时仍可能出现\"幻影行\"，这是加分项。\n\n### 5. 三大日志与两阶段提交 ⭐\n\n> 面试官想听：redo/undo/binlog 分属什么层、解决什么问题，以及为什么提交要\"两阶段\"。\n\n| 日志 | 层级 | 类型 | 写法 | 作用 |\n| --- | --- | --- | --- | --- |\n| redo log | InnoDB | 物理日志（改了哪个页） | 固定大小循环写 | 崩溃恢复，保证持久性（WAL） |\n| undo log | InnoDB | 逻辑日志（反向操作） | 随数据版本留存 | 回滚（原子性）+ MVCC 版本链 |\n| binlog | Server 层 | 逻辑日志（语句/行变更） | 追加写 | 主从复制、数据恢复 |\n\n**两阶段提交（2PC）**：执行更新时 redo log 先写 `prepare` → 写 binlog → 提交时 redo log 置为 `commit`。为什么必须这样：redo 与 binlog 是两份独立日志，若不做两阶段，崩溃恢复时二者可能不一致，导致主从数据不一致（如 redo 写完 binlog 还没写，恢复后主库有这条数据、从库没有）。\n\n### 6. 锁：表锁、行锁、间隙锁 ⭐\n\n> 面试官想听：知道\"行锁锁的是索引项\"，以及乐观锁悲观锁怎么选。\n\n- 全局锁（`FLUSH TABLES WITH READ LOCK`，用于全库逻辑备份）、表级锁、元数据锁（MDL，防 DDL 与查询冲突）、意向锁（表级标记，快速判断表中是否有行锁）。\n- 行锁三种：**Record Lock** 锁单条索引记录；**Gap Lock** 锁索引记录之间的间隙；**Next-Key Lock** = Record + Gap，RR 级别防止幻读的主力。\n- 关键推论：**行锁加在索引上**，WHERE 条件没走索引时会退化成扫描全表并把扫过的记录全锁住，等于锁全表。\n- 悲观锁：假定会冲突，先加锁再操作，如 `SELECT ... FOR UPDATE`，适合写多冲突激烈的场景。\n- 乐观锁：不加锁，提交时用版本号校验，适合读多写少：\n\n```sql\nUPDATE stock SET num = num - 1, version = version + 1\nWHERE id = 1 AND version = 5;   -- 影响行数为 0 说明被并发修改过，业务侧重试\n```\n\n### 7. 调优与架构演进 ⭐\n\n> 面试官想听：一条完整的\"发现慢 SQL → 分析 → 优化 → 验证\"流程，以及大表治理的全景。\n\n**慢 SQL 定位流程**：开慢查询日志捕获 → 按耗时/扫描行数排序 → `EXPLAIN` 分析 → 加索引或改写 SQL → 复测验证。\n\n```sql\nSET GLOBAL slow_query_log = ON;      -- 开启慢日志\nSET GLOBAL long_query_time = 1;      -- 超过 1 秒记录\nSHOW VARIABLES LIKE 'slow_query_log%';\n```\n\n**SQL 优化清单**：只查需要的列（拒绝 `SELECT *`，给覆盖索引机会）；为 WHERE/ORDER BY 列建合适的联合索引；深分页改写；JOIN 用小表驱动大表并保证关联字段有索引；UNION ALL 代替 UNION；大事务拆小事务，减少锁持有时间；批量插入合并语句。\n\n**深分页优化**：\n\n```sql\n-- 慢：LIMIT 900000, 10 要扫描 90 万零 10 行再丢弃\nSELECT * FROM big_user ORDER BY id LIMIT 900000, 10;\n-- 快① 延迟关联：先用覆盖索引拿到 10 个 id，再回表\nSELECT u.* FROM big_user u\nJOIN (SELECT id FROM big_user ORDER BY id LIMIT 900000, 10) t ON u.id = t.id;\n-- 快② 游标分页：记住上一页最后的 id，要求连续翻页\nSELECT * FROM big_user WHERE id > 900000 ORDER BY id LIMIT 10;\n```\n\n**主从复制**：主库写 binlog → 从库 IO 线程拉取写入本地 relay log → 从库 SQL 线程重放。用途：读写分离（写主读从）、容灾备份。主从延迟的原因：从库单线程重放慢、大事务、机器差；对策：关键读强制走主库、并行复制、监控 `Seconds_Behind_Master`。\n\n**分库分表**：垂直分库按业务拆（订单库、用户库），垂直分表把大字段拆扩展表；水平分表按行拆（按用户 id 取模、按时间分表）。分片键要选查询最高频的维度（通常用户 id）。拆分的代价：跨库 JOIN 变难、需要分布式事务、需要全局唯一 ID、扩容数据迁移复杂。原则：**先垂直后水平，索引和缓存优化到底扛不住了再分**。\n\n## 🛠 动手实践\n\n### 任务 1：造 100 万数据，对比有无索引（1 小时）\n\n```sql\nCREATE TABLE big_user (\n  id BIGINT PRIMARY KEY AUTO_INCREMENT,\n  name VARCHAR(20), age INT, city VARCHAR(20), created_at DATETIME\n);\n\nDELIMITER $$\nCREATE PROCEDURE gen_data(IN n INT)\nBEGIN\n  DECLARE i INT DEFAULT 0;\n  START TRANSACTION;\n  WHILE i < n DO\n    INSERT INTO big_user (name, age, city, created_at)\n    VALUES (CONCAT('user_', i), FLOOR(RAND()*50)+18,\n            ELT(FLOOR(RAND()*4)+1, '北京','上海','深圳','杭州'), NOW());\n    SET i = i + 1;\n  END WHILE;\n  COMMIT;\nEND $$\nDELIMITER ;\n\nCALL gen_data(1000000);\n```\n\n验收：无索引 `SELECT * FROM big_user WHERE name='user_999999'` 耗时可观测（百万级约几百 ms），建 `idx_name` 后降到几 ms；两次 explain 的 type 分别为 ALL 和 ref，能复述原因。\n\n### 任务 2：explain 优化 3 条慢 SQL（2 小时）\n\n| # | 慢 SQL | 优化方向 |\n| --- | --- | --- |\n| 1 | `WHERE city='北京' AND age=20 ORDER BY created_at` | 建联合索引 `(city, age, created_at)`，消除 Using filesort |\n| 2 | `ORDER BY id LIMIT 900000, 10` | 延迟关联或游标分页（见上文） |\n| 3 | `WHERE name = 13800000000`（name 是 varchar） | 改传字符串，消除隐式类型转换 |\n\n验收：3 条优化前后各跑一次 explain，type 提升、rows 数量级下降，并各写一句优化说明。\n\n### 任务 3：开启慢日志（30 分钟）\n\n按第 7 节配置开启慢日志，故意跑几条全表扫描 SQL，再到日志文件里找到它们。\n验收：日志中出现慢 SQL 记录，能指出 Query_time 和 Rows_examined 两个字段。\n\n### 任务 4：两个会话演示隔离级别与锁（1 小时）\n\n```sql\n-- 会话 A（开两个终端各连一个客户端）\nSET SESSION TRANSACTION ISOLATION LEVEL READ COMMITTED;\nBEGIN;\nSELECT * FROM big_user WHERE id = 1;         -- 第一次读\n-- 会话 B：UPDATE big_user SET age=99 WHERE id=1; COMMIT;\nSELECT * FROM big_user WHERE id = 1;         -- RC 下值变了（不可重复读）\n-- 再把会话 A 改成 REPEATABLE READ 重复实验：值不变，体会 ReadView 复用\n```\n\n再在 RR 下：会话 A `BEGIN; SELECT * FROM big_user WHERE id BETWEEN 100 AND 200 FOR UPDATE;`，会话 B 尝试 `INSERT` id=150，应被阻塞（临键锁生效）。\n验收：三个实验现象截图或记录，各配一句话解释。\n\n## 💼 高频面试题\n\n**Q：为什么 InnoDB 用 B+ 树而不是哈希、红黑树、B 树？**\n- 哈希不支持范围查询和排序，只适合等值。\n- 红黑树是二叉的，千万数据树高 20+ 层，每层一次磁盘 IO，太高。\n- B 树非叶子也存数据，单页容纳键少树更高，范围查询需中序遍历回溯。\n- B+ 树非叶子只存键，3 层可容纳约 2000 万行；叶子双向链表，范围查询顺序扫描即可。\n\n**Q：什么是回表？怎么避免？**\n- 二级索引叶子只存主键值，查到主键后还要回聚簇索引取整行，这就是回表。\n- 用覆盖索引避免：查询列全部在索引里，explain 出现 Using index。\n- 手段：把高频查询列加入联合索引；至少 `SELECT id` 而不是 `SELECT *`。\n\n**Q：联合索引的最左前缀原则？**\n- 联合索引 (a,b,c) 按 a 排序、a 相同再按 b、再按 c，等价于 a、(a,b)、(a,b,c) 三套索引能力。\n- 查询必须从最左列开始连续命中；遇到范围查询，后面的列停止走索引。\n- 设计上把等值条件列放前面、范围列放后面，并尽量让常用查询覆盖。\n\n**Q：索引什么时候会失效？**\n- 对索引列用函数或运算；隐式类型转换（varchar 列传数字）。\n- LIKE 以 % 开头；联合索引不满足最左前缀。\n- OR 连接了无索引列；NOT IN / != 通常无法走索引。\n- 优化器认为回表成本高于全表扫描（查询比例过大）也会放弃索引——一切以 explain 实测为准。\n\n**Q：事务的隔离级别有哪些？MySQL 默认哪个，怎么实现的？**\n- 读未提交、读已提交（RC）、可重复读（RR，InnoDB 默认）、串行化。\n- 分别解决脏读、不可重复读、幻读的递进问题。\n- 实现靠 MVCC（快照读）+ 锁（当前读）：RC 每次读生成新 ReadView，RR 复用第一次的 ReadView。\n\n**Q：讲一下 MVCC 的原理。**\n- 三件套：隐藏列（trx_id、roll_pointer）+ undo log 版本链 + ReadView。\n- 读时拿 ReadView 和版本链上各版本的 trx_id 比对可见性，不可见就沿链找旧版本。\n- 实现了读写不阻塞；RC 与 RR 的差别只在生成 ReadView 的时机。\n\n**Q：redo log、undo log、binlog 的区别？为什么要两阶段提交？**\n- redo：InnoDB 物理日志、循环写，崩溃恢复保证持久性；undo：InnoDB 逻辑日志，回滚 + MVCC；binlog：Server 层逻辑日志、追加写，用于主从复制和恢复。\n- 两阶段提交：redo prepare → 写 binlog → redo commit。\n- 目的是保证两份日志一致，否则崩溃恢复后主从数据不一致。\n\n**Q：线上出现慢 SQL，怎么排查？**\n- 开慢查询日志定位具体 SQL，看执行频率与耗时分布。\n- EXPLAIN 分析：type 是否 ALL、key 是否为 NULL、rows 是否巨大、Extra 有无 filesort/temporary。\n- 优化手段：建/改联合索引、覆盖索引、改写 SQL（深分页、函数下界）、必要时上缓存或读写分离。\n- 改完必须复测 explain 与真实耗时，形成闭环。\n\n**Q：一张千万级大表，你有哪些优化思路？**\n- 先做索引与 SQL 优化、覆盖索引、深分页改写，成本最低收益最大。\n- 上缓存挡读流量；读写分离分担读压力。\n- 冷热数据归档（历史表），减小活跃数据量。\n- 仍不够再分库分表：垂直拆业务、水平按分片键拆行，同时接受跨库 JOIN、分布式事务、全局 ID 的复杂度。\n\n## 🔗 推荐资料\n\n| 资料 | 说明 | 链接 |\n| --- | --- | --- |\n| pdai MySQL 索引（B+ 树） | B+ 树结构与索引原理图文详解 | https://pdai.tech/md/db/sql-mysql/sql-mysql-b-tree.html |\n| pdai MySQL 性能优化 | explain、慢 SQL、优化清单 | https://pdai.tech/md/db/sql-mysql/sql-mysql-performance.html |\n| pdai MySQL 主从复制 | 复制原理与读写分离实践 | https://pdai.tech/md/db/sql-mysql/sql-mysql-slave.html |\n| pdai MySQL 分库分表 | 拆分策略与带来的问题 | https://pdai.tech/md/db/sql-mysql/sql-mysql-devide.html |\n| JavaGuide MySQL 面试题 | 本篇高频题的标准答案库 | https://javaguide.cn/database/mysql/mysql-questions-01.html |\n| JavaGuide 读写分离与分库分表 | 何时拆、怎么拆的决策思路 | https://javaguide.cn/high-performance/read-and-write-separation-and-library-subtable.html |\n| JavaGuide 数据库基础知识 | 事务、日志等基础概念补充 | https://javaguide.cn/database/basis.html |\n","ck":0},{"id":"f13","stage":4,"path":"04-中间件篇/01-Redis.md","title":"01-Redis","md":"# 01-Redis\n\n> **阶段**：中间件篇 ｜ **建议时长**：4 天 ｜ **前置**：MySQL 基础（03-数据库篇）、Spring Boot 基础\n\n## 🧩 它是什么，解决什么问题\n\nRedis（Remote Dictionary Server）是基于**内存**的 key-value NoSQL 数据库，单机 QPS 可达 10 万+。它是后端面试与实际工作中出现频率最高的中间件，没有之一。\n\n**磁盘数据库 vs 内存数据库**：\n\n| 维度 | MySQL（磁盘） | Redis（内存） |\n| --- | --- | --- |\n| 数据存放 | 磁盘（B+ 树数据页） | 内存（哈希表/跳表等） |\n| 随机读写 | 毫秒级，受磁盘 IO 限制 | 微秒级，10 万级 QPS |\n| 定位 | 持久化主存、复杂查询、事务 | 高速读写、缓存、简单结构 |\n| 容量 | TB 级 | 受内存限制（单实例不宜过大） |\n\n一句话：**MySQL 负责\"存得下\"，Redis 负责\"跑得快\"**。典型架构是 MySQL 为主存，Redis 做缓存层挡住大部分热点读。\n\n**为什么这么快？（高频面试题）**\n\n1. **纯内存操作**：数据在内存中读写，比磁盘快几个数量级；\n2. **命令执行单线程**：无锁竞争、无线程上下文切换（6.0 后网络 IO 用多线程，但**命令执行仍是单线程**，不存在并发安全问题）；\n3. **IO 多路复用**：基于 epoll 的 Reactor 模型，单线程同时监听大量连接，谁的请求就绪就处理谁；\n4. **高效数据结构**：SDS 动态字符串、跳表（ZSet）、压缩列表等，针对场景专门优化。\n\n## 📌 典型使用场景\n\n| 业务场景 | 为什么用它 | 不用的后果 |\n| --- | --- | --- |\n| 热点缓存（商品详情） | 读多写少，内存读微秒级 | 高峰期请求全打到 MySQL，数据库被打垮 |\n| 分布式锁（秒杀扣库存） | `SET NX EX`/Redisson 跨进程互斥 | 多实例并发超卖库存 |\n| 计数器（点赞/浏览量） | `INCR` 原子自增，天然无并发问题 | `count = count + 1` 在并发下丢失更新 |\n| 排行榜（游戏积分/热搜） | ZSet 按分数自动排序，`REVRANGE` 直接取 Top N | MySQL `ORDER BY` 大表排序慢，实时更新代价高 |\n| 会话共享（集群登录态） | 多台应用实例读写同一份 Session | Session 存本机，Nginx 轮询后用户频繁掉登录 |\n| 接口限流 | `INCR + EXPIRE` 按时间窗口计数 | 无限流则恶意请求/突发流量打垮服务 |\n| 签到打卡 | BitMap 1 bit/天，一年 365 天仅 46 字节 | MySQL 存签到记录，亿级用户存储与统计成本高 |\n\n## 🚀 快速上手\n\n### 1. Docker 启动\n\n```bash\ndocker run -d --name redis -p 6379:6379 redis:7.2 --requirepass \"123456\"\n# 进入命令行\ndocker exec -it redis redis-cli -a 123456\n```\n\n```bash\n# redis-cli 基本操作\nset name zhangsan          # 写\nget name                   # 读\nset lock:order:1 1 NX EX 10  # 不存在才设置 + 10 秒过期（分布式锁雏形）\nincr count                 # 原子自增\nexpire name 60             # 设置过期时间\nttl name                   # 查看剩余过期时间\nkeys *                     # 列出所有 key（生产禁用，会阻塞；用 scan 代替）\ndel name                   # 删除\n```\n\n### 2. Spring Boot 整合（StringRedisTemplate 五大类型操作）\n\n```xml\n<!-- pom.xml -->\n<dependency>\n    <groupId>org.springframework.boot<\/groupId>\n    <artifactId>spring-boot-starter-data-redis<\/artifactId>\n<\/dependency>\n<!-- Redisson：生产级分布式锁 -->\n<dependency>\n    <groupId>org.redisson<\/groupId>\n    <artifactId>redisson-spring-boot-starter<\/artifactId>\n    <version>3.30.0<\/version>\n<\/dependency>\n```\n\n```yaml\n# application.yml（Spring Boot 3.x 用 spring.data.redis；2.x 用 spring.redis）\nspring:\n  data:\n    redis:\n      host: localhost\n      port: 6379\n      password: 123456\n```\n\n```java\n@Service\n@RequiredArgsConstructor\npublic class RedisTypeDemo {\n    private final StringRedisTemplate redis;\n\n    /** String：缓存 JSON + 过期时间 + 计数器 */\n    public void string() {\n        redis.opsForValue().set(\"user:1\", \"{\\\"name\\\":\\\"张三\\\"}\", 30, TimeUnit.MINUTES);\n        redis.opsForValue().get(\"user:1\");\n        redis.opsForValue().increment(\"article:1001:like\");   // 原子 +1\n    }\n\n    /** Hash：对象按字段读写，局部更新不整存整取 */\n    public void hash() {\n        redis.opsForHash().put(\"user:1:profile\", \"name\", \"张三\");\n        redis.opsForHash().get(\"user:1:profile\", \"name\");\n        redis.opsForHash().delete(\"user:1:profile\", \"name\");\n    }\n\n    /** List：最新消息/简易队列（左进右出） */\n    public void list() {\n        redis.opsForList().leftPush(\"msg:list\", \"hello\");\n        redis.opsForList().rightPop(\"msg:list\");\n        redis.opsForList().range(\"msg:list\", 0, 9);           // 取最新 10 条\n    }\n\n    /** Set：去重、抽奖、共同关注 */\n    public void set() {\n        redis.opsForSet().add(\"article:1001:readers\", \"u1\", \"u2\");  // 自动去重\n        redis.opsForSet().intersect(\"u1:follow\", \"u2:follow\");      // 共同关注\n        redis.opsForSet().pop(\"lottery:1\");                          // 随机弹出（抽奖）\n    }\n\n    /** ZSet：排行榜，按 score 自动排序 */\n    public void zset() {\n        redis.opsForZSet().incrementScore(\"rank:score\", \"player1\", 10); // 加 10 分\n        redis.opsForZSet().reverseRange(\"rank:score\", 0, 9);            // Top 10\n        redis.opsForZSet().reverseRank(\"rank:score\", \"player1\");        // 我的排名\n    }\n}\n```\n\n### 3. Redisson 分布式锁（看门狗自动续期）\n\n```java\n@Service\n@RequiredArgsConstructor\npublic class StockService {\n    private final RedissonClient redisson;\n\n    public void deductStock(String productId) {\n        RLock lock = redisson.getLock(\"lock:stock:\" + productId);\n        lock.lock(); // 不传 leaseTime → 启用看门狗：默认锁 30s，每 10s 检查并自动续期\n        try {\n            // 查库存 → 判断 → 扣减，临界区必须包含\"查+改\"全程\n        } finally {\n            if (lock.isHeldByCurrentThread()) { // 防止误释放别人的锁\n                lock.unlock();\n            }\n        }\n    }\n\n    public boolean tryDeduct(String productId) throws InterruptedException {\n        RLock lock = redisson.getLock(\"lock:stock:\" + productId);\n        // tryLock：最多等 5 秒，拿到锁后 10 秒自动释放（不启用看门狗）\n        if (!lock.tryLock(5, 10, TimeUnit.SECONDS)) {\n            return false; // 没抢到锁，快速失败\n        }\n        try { /* 业务 */ return true; }\n        finally { lock.unlock(); }\n    }\n}\n```\n\n## 🔧 常用命令 / API 速查\n\n| 类型 | 常用命令 | 典型场景 |\n| --- | --- | --- |\n| String | `SET/GET`、`INCR/DECR`、`SET key val NX EX 10`、`MSET/MGET` | 缓存、计数器、分布式锁、限流 |\n| List | `LPUSH/RPOP`、`LRANGE`、`LLEN`、`BLPOP` | 最新列表、消息队列、时间线 |\n| Hash | `HSET/HGET/HGETALL`、`HDEL`、`HINCRBY` | 对象属性存储、购物车 |\n| Set | `SADD/SMEMBERS`、`SINTER/SUNION/SDIFF`、`SPOP` | 去重、共同好友、抽奖 |\n| ZSet | `ZADD`、`ZINCRBY`、`ZREVRANGE`、`ZRANK`、`ZRANGEBYSCORE` | 排行榜、延迟队列、范围检索 |\n| BitMap | `SETBIT/GETBIT`、`BITCOUNT` | 签到、活跃用户统计 |\n| 通用 | `EXPIRE/TTL`、`SCAN`、`DEL/UNLINK`、`TYPE` | 过期管理、渐进遍历、删除 |\n\n## 🧠 核心进阶\n\n### 1. 过期删除与内存淘汰\n\n- **过期删除**（处理已设 TTL 的 key）：不是\"到点即删\"。采用 **惰性删除**（访问时检查过期才删）+ **定期删除**（每 100ms 随机抽一批 key 检查删除）的折中策略，兼顾 CPU 与内存。\n- **内存淘汰**（内存达到 `maxmemory` 后触发）：`noeviction`（默认，写报错）、`allkeys-lru`（全键 LRU，缓存场景最常用）、`allkeys-lfu`（访问频率优先）、`volatile-lru/lfu/ttl/random`（只淘汰设了 TTL 的）、`allkeys-random`。缓存场景推荐 `allkeys-lru` 或 `allkeys-lfu`。\n\n### 2. 持久化：RDB vs AOF vs 混合\n\n| 方案 | 原理 | 优点 | 缺点 |\n| --- | --- | --- | --- |\n| RDB | 定时 `bgsave` fork 子进程做全量快照（二进制） | 文件小、恢复快 | 两次快照间的数据会丢 |\n| AOF | 追加记录每条写命令，`appendfsync everysec` | 最多丢 1 秒数据 | 文件大、恢复慢（有重写机制压缩） |\n| 混合（4.0+） | AOF 重写时前半段存 RDB 全量 + 后半段增量命令 | 恢复快 + 丢得少 | 仅 Redis 4.0+ 支持 |\n\n生产推荐：开启混合持久化（`aof-use-rdb-preamble yes`）。\n\n### 3. 缓存穿透 / 击穿 / 雪崩（必须会画会讲）\n\n| 问题 | 现象 | 解决方案 |\n| --- | --- | --- |\n| 穿透 | 查询**根本不存在**的数据，缓存永远 miss，请求全打到 DB | ① 缓存空值（短 TTL）；② **布隆过滤器**前置拦截（说\"不存在\"则一定不存在，说\"存在\"可能误判，空间极省）；③ 参数校验 |\n| 击穿 | 某个**热点 key 过期瞬间**，海量并发同时回源 DB | ① **互斥锁**：只放一个线程重建缓存，其他等待；② 逻辑过期：热点 key 不设 TTL，值里存过期时间异步更新 |\n| 雪崩 | **大量 key 同时过期**或 Redis 宕机，DB 瞬间被冲垮 | ① TTL 加随机值打散；② 多级缓存（本地 Caffeine + Redis）；③ 集群高可用 + 限流、降级兜底 |\n\n### 4. 缓存与数据库一致性\n\n- 主流方案 **Cache Aside**：读——先读缓存，miss 则查库回填；写——**先更新数据库，再删除缓存**（不是更新缓存：并发写会覆盖出旧值，删除保留\"下次读时再加载\"的懒加载语义）。\n- 该方案仍有极小概率不一致（读线程在写线程删缓存后、更新数据库前把旧值回填），可用**延迟双删**：删缓存 → 更新库 → 延迟 500ms~1s 再删一次。\n- 更可靠的方案：订阅 MySQL binlog（canal）异步删除/更新缓存，业务代码零侵入。\n\n### 5. 三种高可用架构对比\n\n| 架构 | 解决什么 | 原理 | 局限 |\n| --- | --- | --- | --- |\n| 主从复制 | 读写分离、备份 | 从节点全量 RDB + 增量命令同步，写主读从 | 主挂需手动切换 |\n| 哨兵 Sentinel | 主挂**自动故障转移** | 哨兵集群监控主节点，多数派投票选新主并通知客户端 | 不扩容，容量仍受单机限制 |\n| Cluster | 数据分片 + 高可用 | 16384 个 slot 按 `CRC16(key) % 16384` 分给多个主节点，每主带从 | 多 key 跨槽操作受限（需 hash tag）、运维复杂 |\n\n### 6. 热 key 与大 key\n\n- **热 key**：单个 key 被超高频率访问，打爆某个节点 → 本地缓存兜一层、key 加随机后缀打散到多节点。\n- **大 key**：value 过大（如百万元素的 List）→ 删除/迁移阻塞主线程 → 拆分成多 key、压缩、用 `UNLINK` 异步删除，`redis-cli --bigkeys` 排查。\n\n## 💼 高频面试题\n\n**Q：Redis 为什么快？**\n- 纯内存操作，避免磁盘 IO；\n- 命令执行单线程，无锁、无线程切换开销（6.0 的多线程只用于网络 IO）；\n- epoll IO 多路复用，单线程支撑大量并发连接；\n- 专门优化的高效数据结构（跳表、SDS、压缩列表等）。\n\n**Q：五大基本类型及使用场景？**\n- String：缓存 JSON、计数器（INCR）、分布式锁（SET NX EX）、限流；\n- List：最新消息列表、简单消息队列（LPUSH/RPOP）；\n- Hash：对象按字段存取（购物车、用户属性）；\n- Set：去重、共同关注（SINTER）、抽奖（SPOP）；\n- ZSet：排行榜（分数排序）、延迟队列（score 存执行时间）。\n\n**Q：持久化怎么选？**\n- RDB 快照：文件小恢复快，但会丢两次快照间的数据；\n- AOF：everysec 最多丢 1 秒，文件大恢复慢；\n- 生产用 4.0+ 混合持久化：RDB 做底 + AOF 增量，兼顾恢复速度与数据安全。\n\n**Q：缓存穿透、击穿、雪崩的区别与方案？**\n- 穿透=数据压根不存在→布隆过滤器/缓存空值/参数校验；\n- 击穿=单个热点 key 失效瞬间→互斥锁重建/逻辑过期；\n- 雪崩=大量 key 同时失效或 Redis 挂掉→TTL 随机打散/多级缓存/集群+限流降级。\n\n**Q：如何保证缓存与数据库一致性？**\n- 先更新数据库，再删除缓存（Cache Aside），失败靠重试；\n- 并发窗口要求高用延迟双删；\n- 终极方案：canal 订阅 binlog 异步删缓存，解耦且不易漏。\n\n**Q：Redisson 分布式锁的原理？**\n- 加锁/解锁用 Lua 脚本保证原子性；底层是 Hash 结构记录\"持有线程+重入次数\"，支持可重入；\n- 看门狗：不指定 leaseTime 时默认锁 30 秒，后台线程每 10 秒检查续期，业务没执行完锁不会过期；\n- 相比自写 `SET NX EX`：解决了\"业务超时锁先过期\"\"误删他人锁\"\"不可重入\"三大坑。\n\n**Q：哨兵和 Cluster 怎么选？**\n- 哨兵：数据量小、写并发不高，只要高可用 + 读写分离，方案简单；\n- Cluster：数据量大（单机放不下）或写 QPS 高，需要分片横向扩容；\n- Cluster 解决分片+高可用，哨兵只解决高可用。\n\n## 🔗 推荐资料\n\n| 资料 | 说明 | 链接 |\n| --- | --- | --- |\n| JavaGuide Redis 面试题（上） | 面试导向，覆盖本篇全部考点 | https://javaguide.cn/database/redis/redis-questions-01.html |\n| pdai Redis 总览 | 知识体系全景图 | https://pdai.tech/md/db/nosql-redis/db-redis-overview.html |\n| pdai Redis 数据类型 | 五大类型与底层结构详解 | https://pdai.tech/md/db/nosql-redis/db-redis-data-types.html |\n| pdai RDB 与 AOF | 持久化机制与混合持久化 | https://pdai.tech/md/db/nosql-redis/db-redis-x-rdb-aof.html |\n| pdai 缓存问题 | 穿透/击穿/雪崩/一致性 | https://pdai.tech/md/db/nosql-redis/db-redis-x-cache.html |\n| pdai Redis 哨兵 | 主从架构与故障转移 | https://pdai.tech/md/db/nosql-redis/db-redis-x-sentinel.html |\n| pdai Redis Cluster | 分片原理与槽位机制 | https://pdai.tech/md/db/nosql-redis/db-redis-x-cluster.html |\n| 廖雪峰 Spring Boot 集成 Redis | Spring Boot 整合实操 | https://liaoxuefeng.com/books/java/springboot/index.html |\n","ck":0},{"id":"f14","stage":4,"path":"04-中间件篇/02-RabbitMQ.md","title":"02-RabbitMQ","md":"# 02-RabbitMQ\n\n> **阶段**：中间件篇 ｜ **建议时长**：3 天 ｜ **前置**：01-Redis（中间件基础）、Spring Boot 基础\n\n## 🧩 它是什么，解决什么问题\n\nRabbitMQ 是基于 **AMQP 协议**的消息中间件，Erlang 语言编写，特点是**低延迟、路由灵活、功能完善**，吞吐量万级到十万级，是中小规模业务系统（电商、支付、CRM）最常用的 MQ。\n\n**消息队列解决的三个核心问题**：\n\n1. **异步**：下单后要发短信、加积分、通知仓储——串行要 800ms，发条消息让下游异步消费，主流程 100ms 返回；\n2. **解耦**：订单系统不直接调用下游 N 个系统，只发一条\"订单已创建\"事件，新增订阅方无需改订单代码；\n3. **削峰**：秒杀瞬时 10 万请求先排队，消费端按自己的节奏（如每秒 2000 单）处理，保护数据库。\n\n**核心模型（AMQP）**：\n\n```\nProducer ──(RoutingKey)──> Exchange ──(Binding 绑定规则)──> Queue ──> Consumer\n 生产者                      交换机（不存消息，只路由）        队列（存消息）    消费者\n```\n\n关键理解：**生产者永远不直接把消息发到队列，而是发给交换机**，交换机按绑定规则（Binding + RoutingKey）决定投递到哪个队列——这就是 RabbitMQ 路由灵活的原因。\n\n## 📌 典型使用场景\n\n| 业务场景 | 为什么用它 | 不用的后果 |\n| --- | --- | --- |\n| 订单超时自动取消（延迟消息） | 下单 15 分钟未支付自动关闭，TTL+死信或延迟插件实现 | 定时任务轮询订单表，延迟高、扫表压力大 |\n| 下单后异步通知（短信/积分/推送） | 主流程只发消息，多个下游各自订阅 | 串行调用，一个下游超时拖垮下单接口 |\n| 秒杀削峰 | 请求先进队列，消费端匀速落库 | 瞬时流量直接打爆 MySQL |\n| 系统间事件广播（fanout） | 一次发布，多个系统各自消费 | 新系统接入需改动上游代码，强耦合 |\n\n## 🚀 快速上手\n\n### 1. Docker 启动（带管理台）\n\n```bash\ndocker run -d --name rabbitmq -p 5672:5672 -p 15672:15672 rabbitmq:3.13-management\n# 管理台：http://localhost:15672  账号密码默认 guest/guest\n# 5672 = AMQP 通信端口，15672 = Web 管理台端口\n```\n\n### 2. Spring Boot 整合（声明队列 + JSON 序列化 + 手动 ACK）\n\n```xml\n<dependency>\n    <groupId>org.springframework.boot<\/groupId>\n    <artifactId>spring-boot-starter-amqp<\/artifactId>\n<\/dependency>\n```\n\n```yaml\n# application.yml\nspring:\n  rabbitmq:\n    host: localhost\n    port: 5672\n    username: guest\n    password: guest\n    publisher-confirm-type: correlated   # 生产者确认（异步 Confirm）\n    publisher-returns: true              # 路由不到队列时回调 ReturnCallback\n    listener:\n      simple:\n        acknowledge-mode: manual         # 消费者手动 ACK\n        prefetch: 10                     # 每个消费者未确认消息数上限（限流）\n```\n\n```java\n@Configuration\npublic class RabbitConfig {\n    public static final String ORDER_EXCHANGE = \"order.exchange\";\n    public static final String ORDER_QUEUE    = \"order.create.queue\";\n    public static final String DLX_EXCHANGE   = \"order.dlx.exchange\";\n    public static final String DLQ            = \"order.create.dlq\";\n\n    @Bean\n    public DirectExchange orderExchange() { return new DirectExchange(ORDER_EXCHANGE); }\n\n    /** 业务队列：绑定死信交换机，消费失败的消息转投 DLQ，人工兜底 */\n    @Bean\n    public Queue orderQueue() {\n        return QueueBuilder.durable(ORDER_QUEUE)          // 持久化队列\n                .deadLetterExchange(DLX_EXCHANGE)\n                .deadLetterRoutingKey(\"order.dead\")\n                .build();\n    }\n\n    @Bean\n    public DirectExchange dlxExchange() { return new DirectExchange(DLX_EXCHANGE); }\n\n    @Bean\n    public Queue dlq() { return QueueBuilder.durable(DLQ).build(); }\n\n    @Bean\n    public Binding orderBinding() {\n        return BindingBuilder.bind(orderQueue()).to(orderExchange()).with(\"order.create\");\n    }\n\n    @Bean\n    public Binding dlqBinding() {\n        return BindingBuilder.bind(dlq()).to(dlxExchange()).with(\"order.dead\");\n    }\n\n    /** 默认 SimpleMessageConverter 只支持基本类型；换成 JSON，收发对象都走 JSON */\n    @Bean\n    public MessageConverter jacksonConverter() { return new Jackson2JsonMessageConverter(); }\n}\n```\n\n```java\n@Service\n@RequiredArgsConstructor\n@Slf4j\npublic class OrderProducer {\n    private final RabbitTemplate rabbitTemplate;\n\n    public void sendOrderCreated(OrderMsg msg) {\n        rabbitTemplate.convertAndSend(RabbitConfig.ORDER_EXCHANGE, \"order.create\", msg);\n        log.info(\"已发送订单消息: {}\", msg.getOrderId());\n    }\n}\n\n@Component\n@RequiredArgsConstructor\n@Slf4j\npublic class OrderConsumer {\n    private final ObjectMapper objectMapper; // spring-boot-starter-web 自带\n\n    @RabbitListener(queues = RabbitConfig.ORDER_QUEUE)\n    public void onMessage(Message message, Channel channel) throws IOException {\n        long tag = message.getMessageProperties().getDeliveryTag();\n        try {\n            // Jackson2JsonMessageConverter 已配置时，参数直接声明为 OrderMsg 类型即可自动反序列化\n            OrderMsg msg = objectMapper.readValue(message.getBody(), OrderMsg.class);\n            handle(msg);\n            channel.basicAck(tag, false);            // 处理成功才确认\n        } catch (Exception e) {\n            log.error(\"消费失败\", e);\n            // requeue=false：不再回队列，直接转入死信队列，避免无限重投\n            channel.basicNack(tag, false, false);\n        }\n    }\n    private void handle(OrderMsg msg) { /* 业务逻辑 */ }\n}\n```\n\n## 🔧 常用命令 / API 速查\n\n| 操作 | 命令 / API |\n| --- | --- |\n| 管理台 | http://localhost:15672（guest/guest），查看队列、堆积、消费者 |\n| 列出队列 | `docker exec rabbitmq rabbitmqctl list_queues name messages consumers` |\n| 创建用户 | `rabbitmqctl add_user app 123456 && rabbitmqctl set_permissions -p / app \".*\" \".*\" \".*\"` |\n| 发消息 | `rabbitTemplate.convertAndSend(exchange, routingKey, object)` |\n| 收消息 | `@RabbitListener(queues = \"xxx\")` 标注在方法上 |\n| 手动确认 | `channel.basicAck(tag, false)` / 拒绝 `channel.basicNack(tag, false, requeue)` |\n\n**四种交换机**：\n\n| 类型 | 路由规则 | 示例 |\n| --- | --- | --- |\n| direct | RoutingKey **精确匹配** | `order.create` 只进绑定了该 key 的队列 |\n| topic | RoutingKey **模式匹配**：`#` 多级、`*` 一级 | `order.*` 匹配 `order.create`；`order.#` 匹配 `order.create.success` |\n| fanout | 广播，忽略 RoutingKey，投给所有绑定队列 | 配置变更通知所有服务实例 |\n| headers | 按消息 header 匹配（性能差，少用） | — |\n\n## 🧠 核心进阶\n\n### 1. 消息不丢的全链路（必须会讲）\n\n```\n生产者 ──①Confirm确认──> Broker(交换机/队列/消息持久化②) ──> 消费者 ──③手动ACK后才删除\n   │                        │ 路由不到队列 → ④备用交换机兜底\n   └─ 发送失败重试/记录表补偿 ─┘ 消费失败 → ⑤重试N次后进死信队列，人工处理\n```\n\n- **①生产者 Confirm**：消息到达 Broker 后异步回调 `ConfirmCallback`（`publisher-confirm-type: correlated`），失败则重发或落库补偿；`publisher-returns: true` + `ReturnCallback` 捕获\"到了交换机但路由不到队列\"的消息；\n- **②Broker 端持久化**：交换机 `durable`、队列 `durable`、消息 `deliveryMode=2`（用 Spring AMQP 发对象默认持久化），三者缺一不可；配合镜像/仲裁队列防止单机磁盘损坏；\n- **③消费者手动 ACK**：`acknowledge-mode: manual`，处理成功才 `basicAck`；未 ACK 时消费者挂掉，消息会重新投递给其他消费者；\n- **⑤死信队列（DLX）**：消息被 `nack(requeue=false)`、被拒绝、或 TTL 到期、或队列超长时，转发到死信交换机，最终落在死信队列里由人工/补偿任务处理——**这是排查\"消息去哪了\"的关键**。\n\n### 2. 幂等消费（重复消费不可避免，必须兜底）\n\n消息**至少一次投递**（At Least Once），网络抖动、ACK 丢失都会导致重复。方案：**唯一消息 ID + 去重表**——\n\n```java\n// 发送端：msg.setMessageId(UUID.randomUUID().toString());\n// 消费端：先查去重表（业务库一张表，消息ID唯一索引）\nif (messageLogMapper.existsByMsgId(msgId)) { channel.basicAck(tag, false); return; } // 已处理过，直接确认\nhandle(msg);\nmessageLogMapper.insert(msgId); // 与业务操作放同一事务\n```\n\n### 3. 延迟队列的两种实现\n\n- **TTL + 死信**：给队列设 TTL，到期后转入死信交换机实现延迟。缺陷：**队列头阻塞**——前面 10 分钟的消息没消费，后面 1 分钟的到期了也出不来（FIFO 限制）；\n- **延迟插件**（推荐）：安装 `rabbitmq_delayed_message_exchange`，交换机类型声明为 `x-delayed-message`，发送时设置 `x-delay`，消息到点才投递，无队头阻塞。\n\n### 4. 其他能力\n\n- **优先级队列**：声明队列时设 `x-max-priority`，高优先级消息优先投递（如 VIP 订单）；\n- **集群与高可用**：经典集群只共享元数据不共享消息；镜像队列（classic）每节点全量复制，性能开销大已不推荐；**仲裁队列 Quorum Queue**（3.8+）基于 Raft 多数派写入，官方当前推荐。\n\n## 💼 高频面试题\n\n**Q：四种交换机的区别？**\n- direct：RoutingKey 精确匹配；topic：`#`/`*` 模式匹配，最灵活；\n- fanout：广播给所有绑定队列，忽略 RoutingKey；headers：按 header 匹配，少用；\n- 业务里最常用 direct（点对点）和 topic（多订阅、分级路由）。\n\n**Q：怎么保证消息不丢？（全链路）**\n- 生产端：Confirm 确认 + ReturnCallback，失败重发或落库补偿；\n- Broker 端：交换机、队列、消息三个层面都持久化，配合仲裁队列防单点；\n- 消费端：手动 ACK，处理成功才确认；失败进重试，多次失败进死信队列人工兜底。\n\n**Q：重复消费怎么办？**\n- 重复不可避免（At Least Once），要在消费端做幂等；\n- 常用：唯一消息 ID + 去重表（消息 ID 加唯一索引，与业务同事务）；或用业务天然幂等键（订单号、`UPDATE ... WHERE status=待处理`）；\n- Redis `SETNX msgId` 做轻量去重也可以，但要考虑 Redis 不可用时的兜底。\n\n**Q：死信队列有什么用？**\n- 三种进死信的情况：被 nack/reject 且不回队列、TTL 到期、队列超长；\n- 用途一：消费失败的兜底容器，避免阻塞正常队列，人工补偿；\n- 用途二：配合 TTL 实现延迟队列（订单超时取消）。\n\n**Q：RabbitMQ 和 Kafka 怎么选？**\n- 一句话：**业务级消息（低延迟、灵活路由、需要延迟/死信/优先级）选 RabbitMQ；日志流、大数据管道、超高吞吐、消息回溯选 Kafka**；\n- RabbitMQ 吞吐万级~十万级、微秒毫秒级延迟、消息确认后即删；Kafka 吞吐百万级、消息按 offset 保留可重复消费，但路由能力弱。\n\n## 🔗 推荐资料\n\n| 资料 | 说明 | 链接 |\n| --- | --- | --- |\n| JavaGuide 消息队列基础 | 消息队列通用知识：使用场景、可靠性、幂等 | https://javaguide.cn/high-performance/message-queue/message-queue.html |\n| JavaGuide 高可用系统设计指南 | 削峰、限流、降级等系统设计视角 | https://javaguide.cn/high-availability/high-availability-system-design.html |\n| 廖雪峰 Spring Boot 集成 RabbitMQ | Spring Boot 整合实操 | https://liaoxuefeng.com/books/java/springboot/index.html |\n| pdai 架构知识体系 | 异步/解耦/削峰在整体架构中的位置 | https://pdai.tech/md/arch/arch-z-overview.html |\n","ck":0},{"id":"f15","stage":4,"path":"04-中间件篇/03-Kafka.md","title":"03-Kafka","md":"# 03-Kafka\n\n> **阶段**：中间件篇 ｜ **建议时长**：3 天 ｜ **前置**：02-RabbitMQ（理解消息队列基本概念）\n\n## 🧩 它是什么，解决什么问题\n\nKafka 是 LinkedIn 开源的**分布式日志/流处理平台**，Scala+Java 编写，特点是**超高吞吐（单机百万级）、消息按 offset 持久化可回溯**，是日志采集、用户行为埋点、大数据管道（对接 Flink/Spark）领域的事实标准。\n\n**与 RabbitMQ 的定位差异**：RabbitMQ 面向\"业务消息\"，确认即删；Kafka 面向\"数据流\"，消息像日志文件一样顺序追加到磁盘，按保留策略（时间/容量）删除，**消费只移动 offset，不删除消息**——所以它能被多个系统反复消费、也能回溯重放。\n\n**核心概念（必须全部搞懂）**：\n\n| 概念 | 含义 |\n| --- | --- |\n| Broker | 一个 Kafka 服务节点 |\n| Topic | 消息的逻辑分类（如 order-topic） |\n| Partition | Topic 的物理分片，**并行度和顺序性的基本单位** |\n| Replica | 分区副本：1 Leader + N Follower，Leader 负责读写 |\n| Consumer Group | 消费组：组内分区分摊、组间广播 |\n| offset | 消息在分区内的唯一序号，消费进度就是\"提交到了哪个 offset\" |\n\n## 📌 典型使用场景\n\n| 业务场景 | 为什么用它 | 不用的后果 |\n| --- | --- | --- |\n| 日志采集（ELK 前置） | Filebeat→Kafka→Logstash→ES，缓冲+解耦，ES 挂了日志不丢 | 日志直写 ES，高峰打挂 ES 且无法回补 |\n| 用户行为埋点 | App/网页 PV/UV 事件流高吞吐写入，下游多系统消费 | 直接写库扛不住峰值，埋点丢失无法追溯 |\n| 大数据管道 | Flink/Spark 从 Kafka 消费做实时计算（实时大屏、风控） | 各计算任务直连业务库，互相影响 |\n| 大流量削峰 | 秒杀/活动消息排队，消费端按能力处理 | 瞬时流量冲垮下游 |\n| 消息回溯/重放 | 数据错了重置 offset 重新消费即可 | 传统 MQ 消费即删，错了只能人工补数 |\n\n## 🚀 快速上手\n\n### 1. Docker Compose 单机 KRaft 模式（无需 ZooKeeper）\n\n```yaml\n# docker-compose.yml\nservices:\n  kafka:\n    image: bitnami/kafka:3.7\n    container_name: kafka\n    ports:\n      - \"9092:9092\"\n    environment:\n      - KAFKA_CFG_NODE_ID=0\n      - KAFKA_CFG_PROCESS_ROLES=controller,broker      # KRaft：本机既是控制器又是 Broker\n      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093\n      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092\n      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT\n      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093\n      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER\n```\n\n```bash\ndocker compose up -d\n```\n\n### 2. 命令行创建 Topic、生产、消费\n\n```bash\n# 创建 topic：3 个分区\ndocker exec -it kafka kafka-topics.sh --bootstrap-server localhost:9092 \\\n  --create --topic order-topic --partitions 3 --replication-factor 1\n\n# 控制台生产（输入一行发一条）\ndocker exec -it kafka kafka-console-producer.sh \\\n  --bootstrap-server localhost:9092 --topic order-topic\n\n# 控制台消费（从头消费）\ndocker exec -it kafka kafka-console-consumer.sh \\\n  --bootstrap-server localhost:9092 --topic order-topic --from-beginning\n\n# 查看消费组积压\ndocker exec -it kafka kafka-consumer-groups.sh \\\n  --bootstrap-server localhost:9092 --describe --group order-group\n```\n\n### 3. Spring Boot 整合（KafkaTemplate + @KafkaListener）\n\n```xml\n<dependency>\n    <groupId>org.springframework.kafka<\/groupId>\n    <artifactId>spring-kafka<\/artifactId>\n<\/dependency>\n```\n\n```yaml\nspring:\n  kafka:\n    bootstrap-servers: localhost:9092\n    producer:\n      key-serializer: org.apache.kafka.common.serialization.StringSerializer\n      value-serializer: org.apache.kafka.common.serialization.StringSerializer\n      acks: all                        # 等所有 ISR 副本确认，最高可靠\n      properties:\n        enable.idempotence: true       # 幂等生产者\n    consumer:\n      group-id: order-group\n      auto-offset-reset: earliest      # 无初始位移时从头消费\n      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer\n      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer\n      enable-auto-commit: false        # 关闭自动提交，业务处理完手动提交\n    listener:\n      ack-mode: manual_immediate\n```\n\n```java\n@Service\n@RequiredArgsConstructor\npublic class OrderProducer {\n    private final KafkaTemplate<String, String> kafkaTemplate;\n    private final ObjectMapper objectMapper; // spring-boot-starter-web 自带\n\n    public void send(OrderMsg msg) throws Exception {\n        // key = 订单号：相同 key 哈希进同一分区，保证该订单的消息分区内有序\n        kafkaTemplate.send(\"order-topic\", msg.getOrderId(), objectMapper.writeValueAsString(msg));\n    }\n}\n\n@Component\n@Slf4j\npublic class OrderConsumer {\n    @KafkaListener(topics = \"order-topic\", groupId = \"order-group\")\n    public void onMessage(ConsumerRecord<String, String> record, Acknowledgment ack) {\n        log.info(\"partition={}, offset={}, key={}, value={}\",\n                record.partition(), record.offset(), record.key(), record.value());\n        // 业务处理（需幂等：可能重复消费）...\n        ack.acknowledge();   // 手动提交位移，防止处理中宕机丢消息\n    }\n}\n```\n\n## 🔧 常用命令 / API 速查\n\n| 操作 | 命令 / API |\n| --- | --- |\n| 创建 topic | `kafka-topics.sh --create --topic t --partitions 3 --replication-factor 2` |\n| 查看 topic 详情 | `kafka-topics.sh --describe --topic t`（看分区/Leader/ISR） |\n| 扩分区（只能加不能减） | `kafka-topics.sh --alter --topic t --partitions 6` |\n| 查看消费积压 | `kafka-consumer-groups.sh --describe --group g`（LAG 列） |\n| 重置 offset（回放） | `kafka-consumer-groups.sh --reset-offsets --group g --topic t --to-earliest --execute` |\n| 发送消息 | `kafkaTemplate.send(topic, key, value)` |\n| 消费消息 | `@KafkaListener(topics = \"t\", groupId = \"g\")` |\n\n## 🧠 核心进阶\n\n### 1. 分区机制与消息顺序\n\n- **为什么分区**：一个 Topic 的消息水平切到多个 Partition，分布在多个 Broker 上——这是 Kafka 横向扩容和并行消费的根基；\n- **分区策略**：指定了 partition 用指定值；有 key 按 `hash(key) % 分区数`；都没有则轮询/粘性分区（sticky，攒批更高效）；\n- **顺序保证**：Kafka 只保证**分区内有序**。需要\"同一业务实体有序\"就按业务 key（如订单号）路由到同一分区；需要全局有序只能 1 个分区（牺牲并行度）；\n- 注意：扩分区会改变 key→分区映射，破坏\"同 key 同分区\"，所以分区数尽量一次规划好。\n\n### 2. 消费组与 Rebalance\n\n- 消费组内**一个分区同一时刻只分配给一个消费者**（组间广播、组内负载均衡）；\n- 触发 rebalance 的三种情况：组内**成员增减**（消费者上/下线、宕机）、**分区数变化**、订阅的 topic 变化；\n- rebalance 期间整个消费组停止消费（类似 STW），生产环境要避免频繁 rebalance：合理设置 `session.timeout.ms`、`max.poll.interval.ms`，避免消费太慢被踢出；\n- 分区分配策略：Range、RoundRobin、Sticky、CooperativeSticky（增量 rebalance，停顿最短）。\n\n### 3. 可靠性三件套\n\n- **acks 三个级别**：`0`（发出即成功，可能丢）、`1`（Leader 写入即成功，Leader 挂了副本没同步则丢）、`all/-1`（等所有 ISR 副本写入，最可靠）；`all` 必须配合 `min.insync.replicas>=2`（至少 2 个副本同步成功），否则退化成\"单副本也行\"；\n- **ISR（In-Sync Replicas）**：与 Leader 保持同步的副本集合，落后的会被踢出 ISR；`all` 只需 ISR 内确认；\n- **幂等生产者**（`enable.idempotence=true`）：Broker 用 `<PID, 分区, 序列号>` 去重，解决生产者重试导致的单分区重复写入（不能跨分区跨会话）；跨分区原子写用**事务**（`transactional.id` + `initTransactions`）；\n- **位移提交与重复消费**：`enable.auto.commit=true` 按间隔自动提交，处理到一半宕机会**丢消息**（先提交后处理）；手动在**处理完成后提交**则宕机后重读 → **重复消费**。所以工程上\"先处理后提交 + 消费端幂等\"是标准答案。\n\n### 4. 为什么 Kafka 这么快（高频）\n\n1. **顺序写磁盘**：消息追加到日志文件末尾（append-only），磁盘顺序写速度接近内存；\n2. **页缓存（PageCache）**：读写都走 OS 页缓存，命中率高，JVM 不存消息数据（避免 GC 压力）；\n3. **零拷贝（sendfile）**：消费者拉取时数据从页缓存直接到网卡，不经过用户态，省 2 次拷贝 2 次上下文切换；\n4. **批量 + 压缩**：生产者攒批（`batch.size`/`linger.ms`）后整体压缩（lz4/snappy）发送，网络与磁盘 IO 都按批摊销；\n5. **拉模式消费**：Consumer 主动拉取，按自身能力控制速率，天然避免推模式压垮慢消费者。\n\n### 5. 消息积压的应急与根治（实战高频）\n\n- 现象：消费速度追不上生产速度，`kafka-consumer-groups.sh --describe` 的 **LAG（落后位移）持续增大**；\n- 应急：扩容消费者实例——**消费者数最多等于分区数**，多出来只会空转；分区数不够时新建多分区 topic，写程序把旧 topic 消息搬过去并行消费；\n- 根治：批量拉取（`max.poll.records`）+ 批量落库、消费逻辑异步化、非核心处理降级延后；\n- 预防：上线前压测确定\"分区数 : 消费者数\"配比，对 LAG 配置告警；\n- 提交方式坑：`enable.auto.commit=true` 是定时提交位移，与消费进度脱钩，业务系统一律改为手动提交。\n- 常见坑：频繁 rebalance（消费耗时超过 `max.poll.interval.ms` 被踢出）会雪上加霜，先调大该参数止血；\n- 另一个坑：`kafkaTemplate.send()` 是**异步**的，不 `get()` 阻塞等待或注册回调，发送失败是无感知的——可靠性要求高的场景必须检查发送结果。\n\n## 💼 高频面试题\n\n**Q：Kafka 为什么吞吐量这么高？**\n- 顺序写磁盘（append-only log）+ 页缓存，读写都不过 JVM 堆；\n- 零拷贝 sendfile，消费路径数据不进用户态；\n- 分区并行 + 生产端批量发送与压缩；\n- 消费端拉（pull）模式，按消费能力拉取，天然流控。\n\n**Q：Kafka 怎么保证消息不丢不重？**\n- 不丢：生产者 `acks=all` + `min.insync.replicas>=2` + 重试；Broker 副本机制；消费者先处理后手动提交 offset；\n- 不重（难完全做到）：生产端幂等生产者/事务解决 broker 侧重试重复；消费端必然可能重复（重试、rebalance），**靠业务幂等**（唯一键、去重表）兜底；\n- 口诀：生产 acks=all、Broker 副本、消费先处理再提交 + 幂等。\n\n**Q：消费者组是什么机制？什么时候 rebalance？**\n- 组内消费者分摊分区（一分区只归一个消费者），组间各自独立消费（广播）；\n- 触发：成员上/下线、分区数变化、订阅变化；\n- rebalance 期间整组停摆，生产要避免频繁触发；用 Sticky/CooperativeSticky 减少影响。\n\n**Q：Kafka 如何保证消息顺序？**\n- 全局只能保证分区内有序；\n- 业务上按关键 key（订单号/用户 ID）作为消息 key，哈希进同一分区，同一实体的消息先进先出；\n- 消费端同分区由同一线程处理（`max.poll` 单线程消费即可保证）。\n\n**Q：acks=1 会丢消息吗？**\n- 会。Leader 写入成功即返回，若 Leader 随即宕机且消息尚未同步给 Follower，新 Leader 上没有这条消息；\n- 关键业务用 `acks=all` + `min.insync.replicas=2` + `retries` 调大。\n\n## 🔗 推荐资料\n\n| 资料 | 说明 | 链接 |\n| --- | --- | --- |\n| JavaGuide 消息队列基础 | 消息队列通用知识与选型 | https://javaguide.cn/high-performance/message-queue/message-queue.html |\n| pdai 零拷贝 | sendfile/mmap 原理，理解 Kafka 快的关键 | https://pdai.tech/md/java/io/java-io-nio-zerocopy.html |\n| 廖雪峰 Spring Boot 集成 Kafka | Spring Boot 整合实操 | https://liaoxuefeng.com/books/java/springboot/index.html |\n| pdai 架构知识体系 | 消息队列在整体架构中的位置 | https://pdai.tech/md/arch/arch-z-overview.html |\n","ck":0},{"id":"f16","stage":4,"path":"04-中间件篇/04-RocketMQ.md","title":"04-RocketMQ","md":"# 04-RocketMQ\n\n> **阶段**：中间件篇 ｜ **建议时长**：3 天 ｜ **前置**：02-RabbitMQ、03-Kafka（理解消息队列与分区概念）\n\n## 🧩 它是什么，解决什么问题\n\nRocketMQ 是阿里开源、Java 编写的消息中间件，为**电商级业务场景**而生：吞吐十万级、毫秒级延迟，且把业务最需要的能力做成了原生特性——**事务消息、顺序消息、延迟消息、消息轨迹**。国内大厂（阿里系生态）用得极多，Spring Cloud Alibaba 体系默认 MQ。\n\n核心架构：\n\n```\nNameServer（无状态注册中心：Broker 上报路由，客户端来问地址）\n   ↑ 注册            │ 发现路由\nBroker（Master/Slave，消息存储与转发，存储单元是 CommitLog + ConsumeQueue）\n   ↑ ↓\nProducer ──发送──> Topic（逻辑分类，物理上由多个 MessageQueue 组成）──投递──> Consumer\n```\n\n| 概念 | 含义 | 与 Kafka 对比 |\n| --- | --- | --- |\n| NameServer | 轻量无状态路由中心 | 类似 ZK 但更简单，无选主 |\n| Broker | 存储转发节点 | 主从架构 |\n| Topic | 消息主题 | 同 Kafka |\n| MessageQueue | Topic 的分区 | 同 Kafka Partition |\n| Tag | 消息二级标签，用于过滤 | 类似子主题，Consumer 按 Tag 订阅 |\n\n## 📌 典型使用场景\n\n| 业务场景 | 为什么用它 | 不用的后果 |\n| --- | --- | --- |\n| 订单创建最终一致（事务消息） | 下单→扣库存/冻积分，用半消息+本地事务保证\"库和消息\"原子性 | 本地事务成功但消息没发出去，下游永远不知道 |\n| 延时发货/超时取消 | 原生延迟消息（18 个等级，5.x 支持任意延迟） | RabbitMQ 要 TTL+死信绕一圈，还有队头阻塞 |\n| 积分/优惠券异步发放 | 下单主流程发消息即返回，下游各自消费 | 串行调用下游，下单接口耗时叠加 |\n| 电商大促削峰 | 十万级吞吐扛住瞬时下单洪峰 | 数据库被瞬时流量打垮 |\n\n## 🚀 快速上手\n\n### 1. Docker 启动（NameServer + Broker + Dashboard）\n\n```bash\n# 1) NameServer\ndocker run -d --name rmqnamesrv -p 9876:9876 apache/rocketmq:5.3.1 sh mqnamesrv\n\n# 2) Broker（Mac 上用 host.docker.internal 连 NameServer；Linux 用宿主机 IP）\ndocker run -d --name rmqbroker -p 10911:10911 -p 10909:10909 \\\n  -e \"NAMESRV_ADDR=host.docker.internal:9876\" \\\n  -e \"JAVA_OPT_EXT=-Xmx512m -Xms512m\" \\\n  apache/rocketmq:5.3.1 sh mqbroker -n host.docker.internal:9876\n\n# 3) 可视化控制台\ndocker run -d --name rmqdashboard -p 8081:8080 \\\n  -e \"JAVA_OPTS=-Drocketmq.namesrv.addr=host.docker.internal:9876\" \\\n  apacherocketmq/rocketmq-dashboard:latest\n# 控制台：http://localhost:8081\n```\n\n### 2. Spring Boot 整合（三种发送方式 + 消费）\n\n```xml\n<dependency>\n    <groupId>org.apache.rocketmq<\/groupId>\n    <artifactId>rocketmq-spring-boot-starter<\/artifactId>\n    <version>2.3.1<\/version>\n<\/dependency>\n```\n\n```yaml\n# application.yml\nrocketmq:\n  name-server: localhost:9876\n  producer:\n    group: order-producer-group        # 生产者组（事务消息回查时有用）\n    send-message-timeout: 3000\n```\n\n```java\n@Service\n@RequiredArgsConstructor\n@Slf4j\npublic class OrderProducer {\n    private final RocketMQTemplate template;\n\n    /** 同步发送：等 Broker 确认，可靠性要求高（订单、支付） */\n    public void syncSend(OrderMsg msg) {\n        SendResult result = template.syncSend(\"order-topic\", msg);\n        log.info(\"发送状态: {}\", result.getSendStatus());\n    }\n\n    /** 异步发送：回调通知成功/失败，兼顾吞吐与可靠 */\n    public void asyncSend(OrderMsg msg) {\n        template.asyncSend(\"order-topic\", msg, new SendCallback() {\n            public void onSuccess(SendResult r) { log.info(\"OK\"); }\n            public void onException(Throwable e) { log.error(\"失败，落库补偿\", e); }\n        });\n    }\n\n    /** 单向发送：只管发不等结果，用于日志类消息（可能丢） */\n    public void sendOneWay(OrderMsg msg) { template.sendOneWay(\"order-topic\", msg); }\n\n    /** 延迟消息：默认 18 个等级（1s 5s 10s 30s 1m 2m 3m 4m 5m 6m 7m 8m 9m 10m 20m 30m 1h 2h） */\n    public void sendDelay(OrderMsg msg) {\n        template.syncSend(\"order-topic\",\n                MessageBuilder.withPayload(msg).build(), 3000, 3); // level 3 = 10s\n    }\n\n    /** 顺序消息：同一 orderId 哈希到同一 MessageQueue，分区内先进先出 */\n    public void sendOrderly(OrderMsg msg) {\n        template.syncSendOrderly(\"order-topic\", msg, msg.getOrderId());\n    }\n}\n\n@Component\n@RocketMQMessageListener(\n        topic = \"order-topic\",\n        consumerGroup = \"order-consumer-group\",\n        consumeMode = ConsumeMode.ORDERLY,     // 顺序消费；默认 CONCURRENTLY 并发消费\n        selectorExpression = \"TagA || TagB\")   // 按 Tag 过滤，\"*\" 表示全部\n@Slf4j\npublic class OrderConsumer implements RocketMQListener<OrderMsg> {\n    @Override\n    public void onMessage(OrderMsg msg) {\n        log.info(\"消费: {}\", msg.getOrderId()); // 抛异常 = 消费失败，触发重试\n    }\n}\n```\n\n## 🔧 常用命令 / API 速查\n\n| 操作 | 命令 / API |\n| --- | --- |\n| 控制台 | Dashboard 查看 Topic、消费组、消息轨迹、堆积 |\n| 创建 Topic | 控制台创建，或 `sh mqadmin updateTopic -n localhost:9876 -t order-topic -c DefaultCluster` |\n| 发送消息 | `template.syncSend(topic, msg)` / `asyncSend` / `sendOneWay` |\n| 消费消息 | 类实现 `RocketMQListener<T>`，加 `@RocketMQMessageListener` |\n| 消费模式 | `MessageModel.CLUSTERING`（默认，负载均衡）/ `BROADCASTING`（广播） |\n| 死信 Topic | `%DLQ%+消费者组名`，重试耗尽后自动进入 |\n\n## 🧠 核心进阶\n\n### 1. 事务消息（面试重点，必须会画流程）\n\n```\nProducer                          Broker                         Consumer\n   │ ①发送半消息(Half Msg) ────────> │ (对消费者不可见)\n   │ <────②ACK 半消息落盘成功────────│\n   │ ③执行本地事务(扣库存/下单)\n   │ ④Commit/Rollback ────────────> │ Commit: 消息对消费者可见\n   │                                │ Rollback: 删除半消息\n   │      （若④网络丢失）            │ ⑤定时回查 checkLocalTransaction()\n   │ <────⑥回查请求────────────────│    根据本地事务状态返回 COMMIT/ROLLBACK\n   │                                │ ⑦消息可见 → 推送给 Consumer 消费\n```\n\n- 解决的问题：**\"本地事务成功\"与\"消息发出\"的原子性**（先发消息可能事务回滚了消息已出去；先提交事务再发消息可能发送失败）；\n- 注意：它只保证**生产端与本地事务的一致**，消费端仍需自己做幂等；\n- 回查依据：`@RocketMQTransactionListener` 的 `checkLocalTransaction()` 里反查业务表状态（如订单是否创建成功）。\n\n### 2. 顺序消息\n\n- 全局有序代价大，业务上只需**同一业务 key 有序**（同一订单：创建→支付→发货）；\n- 实现：发送时 `syncSendOrderly(topic, msg, orderId)`，相同 key 经哈希进入**同一个 MessageQueue**；消费端 `ConsumeMode.ORDERLY` 用队列级锁单线程消费该队列；\n- 注意：消费失败会阻塞当前队列重试，需设置合理的最大重试次数；Broker 宕机切换会短暂破坏顺序。\n\n### 3. 延迟消息\n\n- 4.x 固定 18 个等级（level 1~18，见上方注释），存入内部的 `SCHEDULE_TOPIC_XXXX`，定时任务按等级扫描到期后转回真实 Topic；\n- 5.x 基于**时间轮**支持任意时刻延迟（`deliverTimeMs`）；\n- 与 RabbitMQ 对比：原生支持、无队头阻塞，这是选 RocketMQ 的常见理由。\n\n### 4. 消费重试与死信、消费模式\n\n- 消费抛异常 → 默认重试 **16 次**，间隔递增（10s 起逐步拉长到 2h），期间消息堆积在 `RETRY_TOPIC`；全部失败进入死信 Topic **`%DLQ%消费者组名`**，人工处理；\n- **集群模式**（默认）：组内消费者分摊 MessageQueue，一条消息只被组内一个实例消费；**广播模式**：组内每个实例都消费一遍（如本地缓存刷新），广播模式失败不重试。\n\n### 5. 三大 MQ 对比与选型（必背）\n\n| 维度 | RabbitMQ | Kafka | RocketMQ |\n| --- | --- | --- | --- |\n| 吞吐量 | 万~十万级 | 百万级 | 十万级 |\n| 延迟 | 微秒~毫秒（最低） | 毫秒级 | 毫秒级 |\n| 路由能力 | 最强（四种交换机） | 弱（仅 topic/分区） | 中（Topic+Tag） |\n| 特色功能 | 延迟(插件)、死信、优先级 | 消息回溯、流处理生态 | 事务消息、顺序消息、延迟消息、消息轨迹 |\n| 消息保留 | 确认即删 | 按 offset/时间保留，可回放 | 确认后按时间保留 |\n| 语言/社区 | Erlang，社区活跃 | Scala/Java，大数据生态标准 | Java，阿里/国内生态 |\n| 典型场景 | 业务系统异步解耦、低延迟场景 | 日志、埋点、大数据管道 | 电商交易、订单等强业务场景 |\n\n选型建议：中小业务系统、需要灵活路由和低延迟 → RabbitMQ；日志流、大数据实时计算、超高吞吐 → Kafka；电商交易类业务、需要事务/顺序/延迟消息 → RocketMQ。没被公司技术栈绑架时，Java 团队业务系统选 RocketMQ 最省心。\n\n## 💼 高频面试题\n\n**Q：RocketMQ 事务消息的流程？**\n- 先发**半消息**（消费者不可见）→ Broker ACK → 执行**本地事务** → 根据结果 Commit/Rollback；\n- 若 Broker 未收到二次确认，定时**回查**生产者本地事务状态（查业务表）决定提交或回滚；\n- 本质：用\"半消息+回查\"把\"本地事务成功\"和\"消息可达\"绑成最终一致；消费端仍要幂等。\n\n**Q：顺序消息怎么保证？**\n- 发送端：同一业务 key（订单号）哈希路由到同一个 MessageQueue，队列内天然 FIFO；\n- 消费端：`ConsumeMode.ORDERLY`，对队列加锁单线程消费；\n- 代价：吞吐下降、消费失败会阻塞队列、Broker 扩缩容会短暂乱序。\n\n**Q：延迟消息是怎么实现的？**\n- 4.x：18 个固定等级，消息先写到系统 Topic `SCHEDULE_TOPIC_XXXX`，定时任务按等级扫描，到期后投回真实 Topic；\n- 5.x：时间轮支持任意延迟时间；\n- 面试可对比：RabbitMQ 用 TTL+死信有队头阻塞，Kafka 原生不支持延迟。\n\n**Q：三大 MQ 怎么选型？**\n- 吞吐：Kafka(百万) > RocketMQ(十万) > RabbitMQ(万~十万)；\n- 功能：业务功能 RocketMQ 最全（事务/顺序/延迟/轨迹），路由能力 RabbitMQ 最强；\n- 场景：日志/大数据管道选 Kafka；低延迟业务解耦选 RabbitMQ；电商交易、需要事务消息选 RocketMQ。\n\n**Q：消费重试机制？**\n- 并发消费失败默认重试 16 次，间隔指数递增；期间进入重试 Topic `%RETRY%组名`；\n- 耗尽后进入死信 Topic `%DLQ%组名`，需人工/补偿任务处理；\n- 广播模式不重试；顺序消费会本地重试并阻塞队列。\n\n## 🔗 推荐资料\n\n| 资料 | 说明 | 链接 |\n| --- | --- | --- |\n| JavaGuide 消息队列基础 | 消息队列通用知识与可靠性设计 | https://javaguide.cn/high-performance/message-queue/message-queue.html |\n| 廖雪峰 Spring Boot 集成消息队列 | Spring Boot 整合 MQ 实操 | https://liaoxuefeng.com/books/java/springboot/index.html |\n| JavaGuide 高可用系统设计指南 | 削峰、异步、解耦的系统性设计 | https://javaguide.cn/high-availability/high-availability-system-design.html |\n| pdai 架构知识体系 | MQ 在整体架构中的位置 | https://pdai.tech/md/arch/arch-z-overview.html |\n","ck":0},{"id":"f17","stage":4,"path":"04-中间件篇/05-Elasticsearch.md","title":"05-Elasticsearch","md":"# 05-Elasticsearch\n\n> **阶段**：中间件篇 ｜ **建议时长**：4 天 ｜ **前置**：MySQL 基础（03-数据库篇）、Docker 基础\n\n## 🧩 它是什么，解决什么问题\n\nElasticsearch（ES）是基于 Lucene 的**分布式搜索与分析引擎**，核心是**倒排索引**：把文档分词后建立\"**词 → 文档 ID 列表**\"的映射，查\"华为手机\"时直接拿到包含这两个词的文档集合，再按**相关度评分**排序——这正是 MySQL 做不好的事。\n\n**ES 与 MySQL 的分工**：\n\n| 对比点 | MySQL | Elasticsearch |\n| --- | --- | --- |\n| `LIKE '%手机%'` | 前模糊不走索引，**全表扫描** | 分词后命中倒排表，毫秒级 |\n| 相关度排序 | 只能按字段值排 | 按 BM25 评分：词频、权重、字段长度综合打分 |\n| 复杂聚合分析 | 慢，易拖垮主库 | 倒排+列存 doc_values，聚合飞快 |\n| 事务/强一致 | 强项 | 不支持事务，近实时（约 1s 延迟） |\n\n一句话：**MySQL 是\"存数据的\"，ES 是\"查数据的\"**。典型架构：MySQL 为主存，数据同步到 ES 专供搜索。\n\n## 📌 典型使用场景\n\n| 业务场景 | 为什么用它 | 不用的后果 |\n| --- | --- | --- |\n| 商品搜索（电商） | 多关键词分词检索 + 筛选 + 排序 + 高亮 | `LIKE '%xx%'` 全表扫，商品百万级时秒开不可能 |\n| 日志分析（ELK） | Filebeat→Kafka→Logstash→ES，集中检索海量日志 | 故障排查只能登机器 grep，效率极低 |\n| 站内搜索（文章/简历） | 全文检索 + 相关度排序 + 分词纠错 | 搜索结果不相关，用户体验差 |\n| 数据聚合看板 | terms/range 聚合秒级出报表 | MySQL `GROUP BY` 大表慢查询堆积 |\n\n## 🚀 快速上手\n\n### 1. Docker 启动（单节点，可选 Kibana）\n\n```bash\ndocker run -d --name es \\\n  -p 9200:9200 \\\n  -e discovery.type=single-node \\\n  -e ES_JAVA_OPTS=\"-Xms512m -Xmx512m\" \\\n  -e xpack.security.enabled=false \\\n  elasticsearch:8.14.0\n# 验证：curl http://localhost:9200\n# 9200 = REST API 端口；Kibana（可视化，可选）映射 5601 连接 http://host.docker.internal:9200\n# 中文分词需安装 IK 插件（镜像内执行 elasticsearch-plugin install analysis-ik 或自制镜像）\n```\n\n### 2. REST 风格 CRUD + DSL 查询\n\n```bash\n# 建索引 + Mapping：商品名用 text 分词，品牌用 keyword 精确\nPUT /product\n{\n  \"mappings\": {\n    \"properties\": {\n      \"name\":  { \"type\": \"text\",    \"analyzer\": \"ik_max_word\", \"search_analyzer\": \"ik_smart\" },\n      \"brand\": { \"type\": \"keyword\" },\n      \"price\": { \"type\": \"double\" },\n      \"desc\":  { \"type\": \"text\",    \"analyzer\": \"ik_max_word\" }\n    }\n  }\n}\n\n# 写入文档（可指定 id；不指定用自动生成）\nPOST /product/_doc/1\n{ \"name\": \"华为 Mate60 Pro\", \"brand\": \"华为\", \"price\": 6999, \"desc\": \"麒麟芯片 支持卫星通信\" }\nPOST /product/_doc/2\n{ \"name\": \"小米 14 Ultra\",  \"brand\": \"小米\", \"price\": 6499, \"desc\": \"徕卡光学 骁龙芯片\" }\n\n# 查询：bool 组合 —— must 打分、filter 不打分可缓存\nGET /product/_search\n{\n  \"query\": {\n    \"bool\": {\n      \"must\":     [ { \"match\": { \"name\": \"华为手机\" } } ],\n      \"should\":   [ { \"match\": { \"desc\": \"卫星通信\" } } ],\n      \"filter\":   [ { \"range\": { \"price\": { \"gte\": 5000, \"lte\": 8000 } } } ]\n    }\n  },\n  \"highlight\": { \"fields\": { \"name\": {} } },     // 命中词高亮\n  \"sort\":  [ { \"price\": \"desc\" } ],              // 排序\n  \"from\": 0, \"size\": 10                          // 分页\n}\n```\n\n| DSL 关键词 | 作用 | 注意 |\n| --- | --- | --- |\n| `match` | 对 text 分词后检索，参与相关度打分 | 搜索字段用这个 |\n| `match_phrase` | 短语匹配，分词后要求**按序相邻** | 更精确，召回更少 |\n| `term` | 精确匹配，**不涉及分词** | 只对 keyword/数值/日期字段用 |\n| `bool` | 组合：`must`(AND) / `should`(OR) / `must_not` / `filter` | filter 不算分且可缓存，条件过滤放这里 |\n| `from/size` | 浅分页 | `from + size <= 10000`，深分页用 `search_after` |\n\n### 3. Spring Boot 整合（Spring Data Elasticsearch）\n\n```xml\n<dependency>\n    <groupId>org.springframework.boot<\/groupId>\n    <artifactId>spring-boot-starter-data-elasticsearch<\/artifactId>\n<\/dependency>\n```\n\n```yaml\nspring:\n  elasticsearch:\n    uris: http://localhost:9200\n```\n\n```java\n@Document(indexName = \"product\")\n@Data\npublic class Product {\n    @Id\n    private Long id;\n    @Field(type = FieldType.Text, analyzer = \"ik_max_word\", searchAnalyzer = \"ik_smart\")\n    private String name;\n    @Field(type = FieldType.Keyword)     // 品牌精确匹配/聚合，必须是 Keyword\n    private String brand;\n    @Field(type = FieldType.Double)\n    private Double price;\n}\n\npublic interface ProductRepository extends ElasticsearchRepository<Product, Long> {\n    List<Product> findByName(String name);   // 方法名派生查询\n}\n\n// 常用操作\n@Service\n@RequiredArgsConstructor\npublic class ProductSearchService {\n    private final ProductRepository repository;\n    private final ElasticsearchOperations operations; // 复杂查询用Criteria/原生DSL\n\n    public void save(Product p) { repository.save(p); }\n    public List<Product> search(String keyword) { return repository.findByName(keyword); }\n    public long countByBrand(String brand) { return repository.count(); }\n}\n```\n\n## 🔧 常用命令 / API 速查\n\n| 操作 | 命令 |\n| --- | --- |\n| 查看集群健康 | `GET /_cluster/health`（green/yellow/red） |\n| 查看索引 Mapping | `GET /product/_mapping` |\n| 删除索引 | `DELETE /product` |\n| 按 id 查/删 | `GET/DELETE /product/_doc/1` |\n| 批量导入 | `POST /_bulk`（一行动作描述 + 一行文档） |\n| 分词测试 | `GET /product/_analyze {\"analyzer\":\"ik_smart\",\"text\":\"华为手机\"}` |\n| 聚合统计 | `\"aggs\": {\"brand_count\": {\"terms\": {\"field\": \"brand\"}}}` |\n\n**与 MySQL 概念对照**：\n\n| Elasticsearch | MySQL | 说明 |\n| --- | --- | --- |\n| Index | Table | 一类文档的集合 |\n| Document | Row | JSON 文档 |\n| Field | Column | 字段 |\n| Mapping | Schema | 字段类型定义 |\n| Shard（主分片） | 分库分表 | 建索引时定，之后不可改 |\n| Replica（副本） | 从库 | 容灾 + 读扩展 |\n\n## 🧠 核心进阶\n\n### 1. 倒排索引（面试必问）\n\n- 正排：文档 ID → 内容（MySQL 主键查询）；倒排：**分词后的词条 → 包含该词的文档 ID 列表（posting list）**；\n- 写入时对 text 字段分词，为每个词建倒排；查询\"华为手机\"→ 分词为\"华为/手机\" → 查两张倒排表 → 取交集/并集 → 按相关度（BM25）排序；\n- 词条表有序 + 压缩，查找近似 O(logN)，因此海量文档也能毫秒级检索。\n\n### 2. text vs keyword（高频坑）\n\n- `text`：写入时**分词**建倒排，用于全文检索（match）；不能直接精确匹配/聚合；\n- `keyword`：**不分词**，整体作为一个词，用于精确匹配（term）、排序、聚合；\n- 经典错误：对 text 字段用 term 查\"华为手机\"查不到（因为分词后没有\"华为手机\"这个整体词）；品牌、状态、类别字段必须用 keyword；\n- 一个字段可同时要两个能力：`\"fields\": {\"raw\": {\"type\": \"keyword\"}}`。\n\n### 3. 写入为什么是\"近实时\"（NRT）\n\n```\n写入 → Index Buffer(内存) + translog(事务日志,防丢)\n  ↓ refresh（默认每 1s）→ 生成 segment，写入 OS 页缓存 → 此时才可被搜索\n  ↓ flush（默认 30min 或 translog 满）→ segment 持久化到磁盘，清空 translog\n```\n\n- 所以写入到可搜索**最多有约 1 秒延迟**（`refresh_interval` 可调）；追求实时可设 `refresh_interval=1s` 以下但费性能；\n- segment 一旦生成不可修改：删除只是打标记，更新=删旧+插新，这是 ES 更新代价高的根源。\n\n### 4. 深分页问题\n\n- `from + size`：每个分片都要取 `from + size` 条到协调节点排序，`from` 越大代价越高，默认上限 10000；\n- 深翻页方案：**`search_after` + PIT（Point in Time）**——用上一页最后一条的排序值做游标，性能稳定，适合\"下一页\"式翻页；`scroll` 适合一次性导出全量（已不推荐做分页）；\n- 产品层面规避：搜索结果只允许翻前 100 页（如 Google）。\n\n### 5. 数据同步方案（MySQL → ES）\n\n| 方案 | 原理 | 优点 | 缺点 |\n| --- | --- | --- | --- |\n| 同步双写 | 代码里写完 MySQL 写 ES | 简单、实时 | 代码耦合；双写不一致风险 |\n| 异步 MQ | 写库后发消息，消费者更新 ES | 解耦、可重试、可靠 | 毫秒~秒级延迟；要处理堆积 |\n| canal | 伪装 MySQL 从库订阅 binlog | 对业务零侵入 | 多一套 canal 运维；有延迟 |\n| Logstash | 定时按 `update_time` 拉增量 | 纯配置，上手快 | 秒~分钟级延迟；给 DB 带来查询压力 |\n\n生产主流：**MQ 异步同步**或 **canal 订阅 binlog**；要求最终一致再加对账任务。\n\n### 6. 集群\n\n- 主分片数建索引时固定（默认 1），副本可动态调；分片是数据分布与并行的单位；\n- 节点角色：master（管理）、data（存数据）、coordinating（协调，所有节点默认兼任）；\n- 容量评估经验：单分片建议 20~50GB 以内。\n\n## 💼 高频面试题\n\n**Q：倒排索引是什么？**\n- 与正排（ID→文档）相反，倒排是\"分词后的词条→文档 ID 列表\"；\n- 写入时分词建表，查询时对关键词分词后查倒排表，取交集并集再按相关度排序；\n- 词典有序查找近似 O(logN)，因此全量数据也能毫秒级检索。\n\n**Q：ES 和 MySQL 怎么选型？**\n- 主数据、强事务、多表关联 → MySQL；全文检索、模糊搜索、聚合分析、日志 → ES；\n- 典型架构：MySQL 存主数据，异步同步（MQ/canal）到 ES 专供搜索；\n- ES 不支持事务、近实时、更新代价高，别当主库用。\n\n**Q：ES 深分页怎么办？**\n- `from+size` 每个分片都取前 N 条再归并，代价随 from 线性涨，默认限 10000；\n- 翻页用 `search_after` + PIT 游标；全量导出用 scroll（或 search_after）；\n- 产品上限制可翻页深度是通用做法。\n\n**Q：text 和 keyword 的区别？**\n- text 会分词建倒排，用于 match 全文搜索；keyword 不分词，用于 term 精确匹配、排序、聚合；\n- 坑：对 text 字段 term 查整句通常查不到；状态/品牌/分类字段务必用 keyword。\n\n**Q：ES 写入为什么是近实时的？**\n- 写入先进内存 buffer + translog；**refresh（默认 1s）** 生成 segment 进入页缓存后才可搜索；\n- **flush** 才真正落盘并清 translog；调小 refresh_interval 可降延迟但增加开销；\n- segment 不可变，删除/更新是标记与重建，这也解释了 ES 更新昂贵。\n\n## 🔗 推荐资料\n\n| 资料 | 说明 | 链接 |\n| --- | --- | --- |\n| JavaGuide Elasticsearch 面试题 | 面试题合集（部分内容付费，注意甄别） | https://javaguide.cn/database/elasticsearch/elasticsearch-questions-01.html |\n| pdai Elasticsearch 总览 | ES 知识体系与原理详解 | https://pdai.tech/md/db/nosql-es/elasticsearch.html |\n| 廖雪峰 Spring Boot 集成 ES | Spring Boot 整合实操 | https://liaoxuefeng.com/books/java/springboot/index.html |\n| pdai 架构知识体系 | 搜索中间件在架构中的位置 | https://pdai.tech/md/arch/arch-z-overview.html |\n","ck":0},{"id":"f18","stage":4,"path":"04-中间件篇/06-ZooKeeper与Nacos.md","title":"06-ZooKeeper与Nacos","md":"# 06-ZooKeeper与Nacos\n\n> **阶段**：中间件篇 ｜ **建议时长**：3 天 ｜ **前置**：Spring Boot 基础、01-Redis（理解分布式锁）\n\n## 🧩 它是什么，解决什么问题\n\n进入微服务后出现两个新问题，注册中心/配置中心就是为它们而生的：\n\n1. **服务动态感知（注册中心）**：服务提供者有多台实例，随时扩容、缩容、宕机，调用方不能把 IP 写死在配置里——实例启动时把地址注册上去，调用方实时拉取并监听列表变化；\n2. **配置集中管理 + 热更新（配置中心）**：几十个实例的开关、阈值、连接串散落在各自配置文件里，改一次要逐个重启——配置集中存放，改完自动推送到所有实例，**不用重启**。\n\n**ZooKeeper（ZK）**：Apache 的分布式协调服务，本质是\"高可靠的树形 K-V 存储 + Watcher 通知\"，并非专为服务发现设计，但 Hadoop/Kafka/Dubbo 早期都拿它当注册中心，它的**临时节点、Watcher、顺序节点**是面试核心。\n\n**Nacos**：阿里开源的**注册中心 + 配置中心二合一**，Spring Cloud Alibaba 生态的标配，开箱即用、带控制台，是目前国内 Java 微服务的最主流选择。\n\n## 📌 典型使用场景\n\n| 业务场景 | 用什么 | 为什么 | 不用的后果 |\n| --- | --- | --- | --- |\n| 微服务互相调用 | Nacos 注册中心 | 调用方按服务名动态发现实例，自动剔除宕机实例 | IP 写死，扩缩容要改所有调用方配置 |\n| 业务开关/阈值热更新 | Nacos 配置中心 | 控制台改配置秒级推送，无需重启 | 改个开关要发版重启全部实例 |\n| 分布式锁/选主 | ZK | 临时顺序节点 + Watcher 实现公平锁与 Leader 选举 | 多进程并发操作共享资源无序 |\n| 大数据组件依赖 | ZK | Kafka(旧)、HBase、SolrCloud 的协调底座 | 组件无法选主与元数据管理 |\n\n## 🚀 快速上手\n\n### 1. Docker 启动 Nacos（单机模式）\n\n```bash\ndocker run -d --name nacos \\\n  -p 8848:8848 -p 9848:9848 \\\n  -e MODE=standalone \\\n  -e NACOS_AUTH_ENABLE=false \\\n  nacos/nacos-server:v2.3.2\n# 控制台：http://localhost:8848/nacos（默认 nacos/nacos）\n# 8848=控制台/HTTP API，9848=客户端 gRPC（2.x 必须开放）\n```\n\n### 2. （可选）Docker 启动 ZooKeeper，体验临时节点\n\n```bash\ndocker run -d --name zk -p 2181:2181 zookeeper:3.9\ndocker exec -it zk zkCli.sh\n\ncreate -e /order-svc \"192.168.1.10:8080\"   # -e：创建临时节点，模拟服务注册\nls /order-svc                              # 能看到节点\nquit                                       # 退出 = 会话断开\n# 重新进入 zkCli 后 ls /order-svc：节点已自动消失（临时节点随会话销毁）\n```\n\n### 3. Spring Boot 接入（注册中心 + 配置中心）\n\n```xml\n<dependency>\n    <groupId>com.alibaba.cloud<\/groupId>\n    <artifactId>spring-cloud-starter-alibaba-nacos-discovery<\/artifactId>\n<\/dependency>\n<dependency>\n    <groupId>com.alibaba.cloud<\/groupId>\n    <artifactId>spring-cloud-starter-alibaba-nacos-config<\/artifactId>\n<\/dependency>\n<!-- 版本随 Spring Cloud Alibaba BOM 管理，Boot 3.x 对应 2023.x 系列 -->\n```\n\n```yaml\n# application.yml（Boot 3.x 用 spring.config.import 引入远端配置）\nspring:\n  application:\n    name: order-service              # 服务名 = 注册中心里的标识\n  cloud:\n    nacos:\n      server-addr: localhost:8848\n      discovery:\n        namespace: dev               # 命名空间隔离环境（dev/test/prod）\n      config:\n        file-extension: yaml\n  config:\n    import: nacos:order-service.yaml # 拉取 Nacos 上的配置\n```\n\n在 Nacos 控制台新建配置 `order-service.yaml`（Group 默认 DEFAULT_GROUP），写入：\n\n```yaml\norder:\n  discount: 100       # 折扣阈值，演示热更新\n```\n\n```java\n// 服务提供方：启动即自动注册到 Nacos（discovery 依赖引入即生效）\n\n// 配置热更新：控制台改 discount 后，本 Bean 无需重启即拿到新值\n@RestController\n@RefreshScope                     // 让 @Value 绑定的配置支持热刷新\npublic class ConfigController {\n    @Value(\"${order.discount:100}\")\n    private int discount;\n\n    @GetMapping(\"/discount\")\n    public int discount() { return discount; }\n}\n\n// 服务消费方：从注册中心拿可用实例列表（配合 LoadBalancer 实现负载均衡）\n@Service\n@RequiredArgsConstructor\npublic class DiscoveryDemo {\n    private final DiscoveryClient discoveryClient;\n\n    public List<String> instances() {\n        return discoveryClient.getInstances(\"order-service\").stream()\n                .map(i -> i.getHost() + \":\" + i.getPort()).toList();\n    }\n}\n```\n\n## 🔧 常用命令 / API 速查\n\n| 操作 | 命令 / API |\n| --- | --- |\n| Nacos 控制台 | `http://localhost:8848/nacos`：服务列表、配置管理、命名空间 |\n| 注册服务 | 引入 discovery 依赖 + `spring.cloud.nacos.server-addr` 即自动注册 |\n| 手动上下线 | 控制台对实例\"上线/下线\"，用于发布前摘流量 |\n| 读取配置 | `@Value` + `@RefreshScope`，或 `@ConfigurationProperties`（天然支持刷新） |\n| 查看实例列表 | `discoveryClient.getInstances(\"service-name\")` |\n| ZK 客户端 | `docker exec -it zk zkCli.sh` 进入命令行 |\n\n**ZooKeeper 常用操作（zkCli.sh）**：\n\n| 命令 | 说明 |\n| --- | --- |\n| `create /app/lock/seq- \"data\"` | 创建 znode（`-e` 临时、`-s` 顺序） |\n| `get /app/config` | 读节点数据并注册 Watcher |\n| `ls /app` | 列子节点并注册 Watcher |\n| `set /app/config \"new\"` | 更新数据，触发 Watcher 通知 |\n| `delete /app/config` | 删除节点 |\n\n## 🧠 核心进阶\n\n### 1. ZooKeeper 三大机制（面试核心）\n\n- **znode**：树形命名空间中的节点，类似文件/目录二合一，可存少量数据（建议 < 1MB）；\n- **临时节点（ephemeral）**：**与客户端会话绑定，会话断开自动删除**——这就是服务注册与锁自动释放的基石（实例宕机 → 会话失效 → 节点消失 → 下游立刻感知）；另有**临时顺序节点**：自动追加单调递增序号（`lock-0001`、`lock-0002`）；\n- **Watcher 机制**：客户端对节点注册监听，节点**变化时触发一次通知**（数据变更、子节点增减、节点删除）；注意是**一次性**的，收到通知后要重新注册——服务发现每次拉完列表都要再挂一次 Watcher。\n\n**ZAB 协议一句话**：ZK 用 ZAB（原子广播）保证一致性——写请求都转发给 Leader，**过半节点写入成功才算提交**；Leader 挂掉触发选举，恢复期间集群不可写。由此 ZK 的**写性能受限于过半同步**，且部署节点建议为奇数（3/5 台）以省资源。\n\n**临时顺序节点实现分布式锁**：\n\n```\n1. 各客户端在 /lock/ 下创建临时顺序节点 seq-\n2. 判断自己是不是序号最小的 → 是则获锁\n3. 否则 watch「比自己序号小的最近一个节点」\n4. 持锁者释放锁/会话断开 → 节点删除 → 下一个收到通知 → 回到 2\n```\n\n比\"所有人抢同一个节点\"好在**避免惊群**：锁释放只唤醒一个等待者；会话断开自动删节点则天然解决\"持锁进程挂死锁不释放\"。\n\n**CP 的代价**：ZK 是 CP 系统，Leader 选举期间（可能长达数十秒）整个集群**拒绝服务**——服务发现场景下\"宁可返回旧列表也不能不可用\"，这就是\"ZK 不适合做注册中心\"论断的核心；再加上 Watcher 一次性、无控制台、运维重，新项目基本不再选它做注册。\n\n### 2. Nacos 架构与 AP/CP\n\n- **AP/CP 可切换⭐**：**临时实例（默认）用 AP（Distro 协议）**——客户端每 5s 发心跳，15s 未收到标记不健康，30s 未收到剔除；实例下线最终一致，可用性优先。**持久实例用 CP（Raft 协议）**——强一致，适合数据库类\"必须全员知道\"的服务；\n- 注册中心要的恰恰是\"宕机也能返回旧列表\"，所以**临时实例 + AP 是服务发现的正确姿势**；面试追问\"为什么不用 CP\"就答 ZK 选举期不可用的反例；\n- **配置中心**：长轮询（客户端 30s 内监听配置变更，改动秒级推送）+ MD5 比对；`@RefreshScope` 触发 Bean 重建实现热更新；`@ConfigurationProperties` 绑定的配置自动刷新；与 ZK Watcher 对比：Nacos 长轮询可重复等待无需反复注册，使用成本低得多；\n- **保护阈值（雪崩保护）**：健康实例比例低于阈值时，Nacos 把不健康实例也返回给调用方——宁可部分调用失败，也不返回空列表导致服务全瘫，这正是\"可用性优先\"的体现；\n- **集群部署**：生产至少 3 节点组集群（内嵌 Raft/Distro 协议选主与同步），配置持久化到 MySQL（单机默认 Derby），客户端通过 gRPC 长连接保持实时感知；\n- **命名空间（namespace）**：按环境隔离（dev/test/prod 各一个 namespace），配合 Group、Cluster 做多级隔离；\n- **优雅上下线**：发布前在控制台对实例\"下线\"摘流量，等流量排空再停机，避免发布瞬间报错——注册中心的控制台能力比\"能注册\"更值钱。\n\n### 3. 三者对比与选型\n\n| 维度 | ZooKeeper | Nacos | Eureka |\n| --- | --- | --- | --- |\n| 一致性 | CP | AP/CP 可切换 | AP |\n| 健康检查 | 会话 keepalive | 心跳 + 主动探测 | 客户端心跳 |\n| 功能 | 树形 K-V + Watcher | 注册 + 配置 + 控制台 | 仅注册 |\n| 易用性 | 无 UI、运维重 | 控制台开箱即用 | 有控制台但已停更 |\n| 典型用途 | 选主/锁/大数据组件 | Spring Cloud Alibaba 微服务 | 旧 Spring Cloud Netflix |\n\n选型：**Spring Cloud Alibaba 体系直接用 Nacos**（注册+配置一站式）；需要强一致的协调原语（选主、严格的锁）用 ZK 或 etcd；新项目不要再选已停更的 Eureka。国内新项目 90% 的组合是：Nacos（注册+配置）+ OpenFeign（调用）+ Sentinel（限流熔断），即 Spring Cloud Alibaba 标准全家桶。\n\n## 💼 高频面试题\n\n**Q：ZooKeeper 能干什么？**\n- 树形 znode 存储 + 临时节点 + Watcher，提供高可靠的分布式协调原语；\n- 典型用途：注册中心（早期 Dubbo/Kafka）、分布式锁（临时顺序节点）、Leader 选举、配置共享；\n- 本质是 CP 的协调服务，不是专门的服务发现组件。\n\n**Q：Watcher 机制是什么？**\n- 客户端对节点读操作可注册监听，节点数据变更/子节点变化/删除时服务端推送一次通知；\n- **一次性触发**：收到通知后必须重新注册，否则后续变更收不到；\n- 服务发现依赖它：列表变化 → 通知 → 重新拉取 + 重新注册。\n\n**Q：临时节点有什么用途？**\n- 生命周期绑定客户端**会话**，会话断开自动删除；\n- 服务注册：实例宕机 → 节点消失 → 调用方即时感知；\n- 分布式锁：持锁进程崩溃 → 锁节点自动删除 → 不会死锁；加顺序性后可实现公平锁并避免惊群。\n\n**Q：为什么说 ZK 不适合做注册中心？**\n- CP：Leader 选举期间集群不可用，而服务发现更需要可用性（AP）——宁可返回略旧的实例列表；\n- Watcher 一次性，客户端要反复注册，实现繁琐；\n- 无健康检查语义外的管理能力（无控制台、无权重/灰度），运维成本高。\n\n**Q：Nacos 的 AP 和 CP 怎么选？**\n- 临时实例（默认）→ AP/Distro：客户端心跳保活，宕机靠心跳超时剔除，最终一致，适合绝大多数微服务；\n- 持久实例 → CP/Raft：不会自动剔除，需主动注销，适合配置类、数据库类强一致服务；\n- 同一 Nacos 集群可同时承载两种模式，按实例类型自动路由。\n\n**Q：Nacos 配置中心如何实现热更新？**\n- 客户端与 Nacos 保持**长轮询**，配置变更后秒级返回新版本；\n- `@Value` 字段所在 Bean 加 `@RefreshScope`：刷新时销毁重建 Bean 重新注入；`@ConfigurationProperties` 绑定类天然支持；\n- 灰度发布与回滚可直接在控制台操作。\n\n## 🔗 推荐资料\n\n| 资料 | 说明 | 链接 |\n| --- | --- | --- |\n| JavaGuide ZooKeeper 入门 | znode/Watcher/ZAB 等核心概念 | https://javaguide.cn/distributed-system/distributed-process-coordination/zookeeper/zookeeper-intro.html |\n| pdai 架构知识体系 | 注册中心/配置中心在微服务架构中的位置 | https://pdai.tech/md/arch/arch-z-overview.html |\n| 廖雪峰 Spring Boot 教程 | Spring Boot 整合实操基础 | https://liaoxuefeng.com/books/java/springboot/index.html |\n| JavaGuide 高可用系统设计指南 | 服务注册发现的可用性设计视角 | https://javaguide.cn/high-availability/high-availability-system-design.html |\n","ck":0},{"id":"f19","stage":4,"path":"04-中间件篇/07-Nginx.md","title":"07-Nginx","md":"# 07-Nginx\n\n> **阶段**：中间件篇 ｜ **建议时长**：2 天 ｜ **前置**：无（了解 HTTP、前后端分离更佳）\n\n## 🧩 它是什么，解决什么问题\n\nNginx 是高性能的 **HTTP 服务器 / 反向代理服务器**，C 语言编写，单机可轻松支撑数万并发连接。在后端项目里它几乎无处不在：**静态资源服务、反向代理、负载均衡**是三大本职工作。\n\n**为什么它这么能扛？（高频）**\n\n- **epoll 事件驱动 + 异步非阻塞 IO**：一个 worker 进程用 IO 多路复用同时处理成千上万连接，不为每个连接分配线程（对比传统\"一连接一线程\"模型）；\n- **master-worker 架构**：master 读配置、管理 worker；worker 真正处理请求（数量 ≈ CPU 核数，`worker_processes auto`），worker 挂了 master 自动拉起，改配置可平滑 reload 不中断服务。\n\n**正向代理 vs 反向代理（必会）**：\n\n| | 正向代理 | 反向代理 |\n| --- | --- | --- |\n| 代理谁 | **客户端**（替客户端出去访问） | **服务端**（替服务器接请求） |\n| 谁知道谁存在 | 服务端不知道真实客户端 | 客户端不知道真实后端（以为 Nginx 就是服务） |\n| 典型例子 | VPN/科学上网 | Nginx 转发到 Spring Boot 集群 |\n\n## 📌 典型使用场景\n\n| 业务场景 | 为什么用它 | 不用的后果 |\n| --- | --- | --- |\n| 前后端分离部署 | Nginx 托管前端静态包，`/api` 转发后端，同域解决跨域 | 前后端分开部署域名不同，跨域问题频出 |\n| 多实例负载均衡 | upstream 把请求分摊到多个 Spring Boot 实例 | 单实例扛不住，宕机全站不可用 |\n| 灰度发布 | 按权重把少量流量切到新版本，观察后再全量 | 新版本直接全量上线，出事故影响所有人 |\n| 静态资源服务 | 图片/CSS/JS 直接由 Nginx 返回，带缓存头 | 静态请求也打到 Java 应用，浪费 JVM 资源 |\n\n## 🚀 快速上手\n\n### 1. 安装与常用命令\n\n```bash\ndocker run -d --name nginx -p 80:80 nginx:1.26\n# 或 Mac：brew install nginx；配置文件通常在 /usr/local/etc/nginx/nginx.conf 或 /etc/nginx/nginx.conf\n\nnginx -t              # 检查配置语法（改完必做）\nnginx -s reload       # 平滑重载配置，不断连接\ndocker exec -it nginx nginx -s reload   # docker 版重载\n```\n\n### 2. 核心配置结构（全局块 / events / http / server / location）\n\n```nginx\n# ===== 全局块 =====\nworker_processes  auto;              # worker 数 = CPU 核数\nevents {\n    worker_connections  10240;       # 每个 worker 的最大连接数\n}\nhttp {\n    include       mime.types;        # 文件类型映射\n    default_type  application/octet-stream;\n    access_log    logs/access.log;\n    sendfile      on;                # 静态文件零拷贝\n\n    # gzip 压缩：JS/CSS 传输体积减小 70%+\n    gzip on;\n    gzip_types text/css application/json application/javascript;\n    gzip_min_length 1k;\n\n    # ===== 负载均衡：定义后端集群 =====\n    upstream backend {\n        server 127.0.0.1:8081 weight=2;      # 权重轮询：8081 承担 2 倍流量\n        server 127.0.0.1:8082;               # 默认轮询\n        # ip_hash;                           # 按客户端 IP 固定分发（会话保持）\n        # least_conn;                        # 最少连接优先\n        server 127.0.0.1:8083 max_fails=3 fail_timeout=30s;  # 被动健康检查\n    }\n\n    server {\n        listen 80;\n        server_name example.com;\n\n        # 场景1：静态站点（Vue/React 打包产物，history 路由回退 index.html）\n        location / {\n            root  /usr/share/nginx/html;     # 文件映射到本地目录\n            try_files $uri $uri/ /index.html;\n        }\n\n        # 场景2：动静分离——静态资源单独 location，直接返回\n        location /static/ {\n            root /data/www;                  # 实际文件在 /data/www/static/\n            expires 7d;                      # 浏览器缓存 7 天\n        }\n\n        # 场景3：反向代理——/api 开头转发给后端集群\n        location /api/ {\n            proxy_pass http://ba
